<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@TITLE@</title>
<meta name="description" content="@DESCRIPTION@">
<meta name="theme-color" content="#070b1a">
<!--head-->@HEAD@<!--/head-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23070b1a' stroke='%23f5c46b' stroke-width='3'/><text x='32' y='44' font-size='34' text-anchor='middle' fill='%23f5c46b' font-family='Georgia,serif' font-style='italic'>ζ</text></svg>">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
@STYLES@
@SHELL_SCRIPT@
</head>
<body @BODY_ATTRIBUTES@>
<a class="skiplink" href="@SKIP_TARGET@">@SKIP_TEXT@</a>
@MAP@
<div id="tip" role="tooltip"></div>

<header class="topbar">
  <a class="brand" href="/" aria-label="Home: the map">
    <span class="logo">ζ</span><span class="brand-text">RH Lean <b>Explorer</b></span>
  </a>
  <nav aria-label="Sections">
    <a href="/status/" data-nav="status">Status</a>
    <a href="/guides/" data-nav="guides">Guides</a>
    <a href="/timeline/" data-nav="timeline">Timeline</a>
    <a href="/learn/" data-nav="learn">Learn</a>
  </nav>
  <button id="sbtn" class="sbtn" type="button" aria-label="Search" aria-expanded="false" aria-controls="q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  <div class="search">
    <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="@SEARCH_PLACEHOLDER@" aria-label="@SEARCH_PLACEHOLDER@" data-clarity-mask="true" data-1p-ignore disabled autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div id="results" hidden></div>
  </div>
  @STATUS_CHIP@
</header>

<aside id="panel" data-sheet="@PANEL_SHEET@"@PANEL_ATTRIBUTES@>
  <button id="grip" type="button" aria-label="Change the size of the panel" aria-controls="content"><span></span></button>
  @PANEL_HEADING@
  <div id="content"><!--prerender-->@PANEL_CONTENT@<!--/prerender--></div>
@PANEL_FOOTER@
</aside>

<section id="page" aria-hidden="@OVERLAY_HIDDEN@">
  <a id="close" href="@ACTIVE_MAP@" aria-label="Back to the map">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </a>
  <div id="pagebody" tabindex="-1">@OVERLAY_CONTENT@</div>
@OVERLAY_FOOTER@
</section>

<div class="mapctl">
  <button id="zin" type="button" title="Zoom in" disabled>+</button>
  <button id="zout" type="button" title="Zoom out" disabled>−</button>
  <button id="zreset" type="button" title="Show everything" disabled><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <a id="zlist" class="zbtn" href="@LIST@" title="List view" aria-label="List view: the map as a list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></a>
  <a id="zroute" class="zbtn" href="@ROUTE@" title="Route from Main" aria-label="Route from Main: how the proof is structured"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="18" r="2"/><path d="M7 18h4a3 3 0 0 0 3-3V9a3 3 0 0 1 3-3h1"/><path d="m18 3 3 3-3 3"/></svg></a>
  <span data-share-slot="toolbar" hidden></span>
</div>

<div id="fbar" class="fbar" role="region" aria-label="Map colours and filters">@FILTERS@</div>
<div id="fmob" class="fmob"></div>
<dialog id="fsheet" class="fsheet" aria-labelledby="fs-h"></dialog>
<dialog id="share-menu" class="share-menu" aria-labelledby="share-heading">
  <div class="share-options">
    <div class="share-head"><h2 id="share-heading">Share</h2><button type="button" data-share-close aria-label="Close share options">×</button></div>
    <button type="button" data-share-native hidden>Share via device</button>
    <button type="button" data-share-copy autofocus>Copy link</button>
    <a data-share-network="x" target="_blank" rel="noopener noreferrer">X</a>
    <a data-share-network="reddit" target="_blank" rel="noopener noreferrer">Reddit</a>
    <a data-share-network="email">Email</a>
    <a data-share-network="linkedin" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <button type="button" data-share-embed hidden>Embed</button>
    <fieldset class="share-download" hidden>
      <legend>Download image</legend>
      <button type="button" data-image-format="png">PNG</button>
      <button type="button" data-image-format="svg">SVG</button>
    </fieldset>
    <p role="status"></p>
  </div>
  <div class="embed-options" hidden>
    <div class="share-head"><h2 id="embed-heading">Embed</h2><button type="button" data-share-close aria-label="Close embed options">×</button></div>
    <textarea rows="6" readonly aria-label="Embed HTML"></textarea>
    <button type="button" data-embed-copy>Copy HTML</button>
    <p role="status"></p>
  </div>
</dialog>

<div id="loader" class="done"><p id="map-status" class="meta map-status" role="status"></p></div><noscript><style>
#loader, #grip, .topbar .search, .topbar .sbtn, .mapctl button, #fbar, #fmob { display: none; }
@media (max-width: 820px) {
  body:not(.paged) #panel { transform: none; touch-action: pan-y; padding-bottom: 0; }
}
</style></noscript>

@SCRIPTS@
</body>
</html>
