# Changelog for riemannhypothesissolved.com, rendered by build_site.py as /changelog/ and /changelog/feed.xml.
# One entry per day, newest anywhere (the builder sorts). Dates are the day the change was made (site repo commits, IST).
# Seeded from the git log of the site repo (rithn/rh-lean-explorer).

- date: 2026-11-22
  title: Clean links, list view, Lean source viewer, faster loading
  items:
    - "Renamed 20 themes whose names described only a small part of their content; old addresses redirect."
    - "Status wording updated: who certified, ongoing checks, what is not yet claimed. One dated status block now feeds every page, the app, /api/status.json and llms.txt, and About notes that the source viewer shows the original archive as released (commit 40e56bab)."
    - "All 2,647 clusters now have names and descriptions written by Claude, and every cluster has its own page."
    - "Pages have real addresses (for example /cluster/k0677-…/ and /about/) instead of #/ links; old #/ links still work."
    - "New list view at /list/: every cluster as text, ordered by distance from the main theorem, by theme or by size, with a filter."
    - "Lean file pages link to the file on GitHub (the public mirror, pinned to one commit) and can show its source on request."
    - "A small route glyph shows how many import steps lead from a cluster or theme to the main theorem."
    - "Cluster panels show why a cluster is in the proof (its import route up to the main theorem), what it builds on and what needs it, grouped by theme; file pages show how far each file is from Main."
    - "New page /route/: how the proof is structured, from the main theorem down."
    - "Calmer panels: fewer stat tiles, a proof-at-a-glance row on the home panel, plain theme cards."
    - "Smaller first download for the map, and long caching for versioned data."
    - "Every page has a Markdown copy (add index.md to its path); new /api/ with JSON for the proof status, clusters and themes; llms.txt."
    - "The site's own data (names, descriptions, map layout, JSON) is licensed CC BY 4.0."
    - "This changelog and its RSS feed; feedback goes to @SomTheBuilder on X, from the site footer, and each cluster has a small \"Report a wrong name\" link."
    - "Lean source in a wide viewer: file pages open with the source already loading, cluster file lists have a </> button, and the import lines at the top of a file are links (files in the archive open in the viewer; Mathlib, Batteries and Lean core files open their Mathlib docs page)."
    - "/route/ is now a picture: one ring per import step from the main theorem, sized by its number of clusters; click a ring to list its clusters."
    - "Status wording: the joint statement does not claim peer review, and no refereed paper has been announced."

- date: 2026-11-21
  title: Proof certified; launch of the map
  items:
    - "First version of the RH Lean Explorer: cluster map, cluster, file and concept views, and search."
    - "Canvas star map with a fly-to camera, the route from the main theorem, command search and a mobile sheet."
    - "Theme names and blurbs written by Claude from cluster names and folders."
    - "Static pages for the 63 themes and the named clusters, a social preview image, sitemap and robots.txt."
    - "Static About and Learning path pages, real 404 pages, structured data and llms.txt."
    - "Status updated: on 21 Nov 2026 a joint statement by the Lean and Mathlib communities, endorsed by the Lean FRO and the Mathlib Initiative, certified the Lean statement and proof."
    - "Panel redesign: summary first, stat tiles, route from the main theorem, folded references."
