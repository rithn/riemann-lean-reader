- date: 2026-11-24
  title: Alpöge's posts, reactions and the tautology objection
  items:
    - "/status/ adds what Alpöge has said since the release (his posts of 23 Nov, 22:03 UTC and 24 Nov, 03:01 UTC, and replies), eight named reactions with a source for each, and a short summary of the objection that the proof is a tautology."
    - "/faq/ has three new questions: whether the proof is a tautology (the full objection and the responses), whether Alpöge retracted it, and whether anyone has disproved it in Lean. It also explains figures such as \"60,790 files\" that count the community repository after clean-up."
    - "/timeline/ runs to 24 Nov, including the kernel results of 22 and 23 Nov. /press/ adds WIRED, The Wall Street Journal and Nikkei."
    - "The community repository's file count is now dated: 60,156 .lean files at commit 6866a9c6 (24 Nov 2026, 13:39 UTC), against 175,187 in the released archive."

- date: 2026-11-24
  title: Status update and number fixes
  items:
    - "Status: Lean's own kernel has accepted the full export in its default (22 Nov) and paranoid (23 Nov) modes, and the unmodified Comparator v4.33.0 reports \"Your solution is okay!\" (23 Nov), as on Sutherland's page last updated 24 Nov 2026 at 05:25 UTC. His end-to-end lake comparator run on Lean v4.36.0 is still in progress."
    - "/status/ has a section on refereed publication and the Clay prize rules."
    - "Corrected dates: Sutherland's con-leche runs and the lean4lean check finished on 20 Nov, not 21 Nov (/timeline/, /status/)."
    - "Corrected /proof-in-numbers/: the largest field, automorphic forms, holds 20.6% of the mapped files, just over a fifth. The FAQ now credits the dependency-closure count to Rubinstein's page."
    - "The home and route descriptions now say the map holds 175,027 of the 175,187 Lean files; the status date is 24 Nov 2026 everywhere."

- date: 2026-11-22
  title: Small fixes from a check of the live site
  items:
    - "Filters that leave 30 clusters or fewer zoom the map to them and ring each one in gold."
    - "Cluster panels say that Builds on and Needed by count direct imports; the main theorem's line says it reaches every other cluster through chains of imports."
    - "/list/ has a Markdown copy (/list/index.md) listing every cluster by distance from the main theorem."
    - "On phones the header shows \"Certified\" next to its green dot, and the Lean source viewer wraps long lines. The route page says that clicking a ring lists its clusters, and the zeros figure's caption says the mirror images below the axis are not shown."

- date: 2026-11-22
  title: Core, numbers, timeline and a new About page
  items:
    - "New pages: /core/ (the 16 core clusters in route order, with names checked against the code), /proof-in-numbers/ (every figure of the proof, with sources) and /timeline/ (1748 to the 2026 Lean proof)."
    - "/about/ is now about the map itself: what it is, how it was made, who made it, the licence and where AI was used. The status of the proof is on /status/."
    - "The 160 files in the archive but not on the map were recounted: 150 import-only files, 5 build helpers and 5 with no theorem or definition."
    - "Checked clusters link to all 16 core clusters; k0677's summary line now says what the cluster holds. On the explainer, the Simple / Student / Expert tabs no longer cover the zeros figure."

- date: 2026-11-22
  title: Zeros figure and share links
  items:
    - "The explainer shows the critical strip with the first ten zeros of the zeta function at their true heights, the trivial zeros and the pole at s = 1."
    - "Clusters and themes have a Share button that copies the page's link (or opens the share sheet on phones), and each has its own preview image for links on social media."

- date: 2026-11-22
  title: 16 core cluster names checked against the code
  items:
    - "The names and descriptions of the 16 core clusters (the main theorem, the final assembly and the clusters closest to them) were checked against their full Lean code and corrected; for example k0677 is now \"Main theorem statements, plus the explicit formula for Dirichlet L-functions\"."
    - "These 16 clusters carry a \"Checked against the code\" badge on their pages and in the map's panel, with a few of the Lean declarations the check rests on. All other names are still written by Claude from samples of the code."
    - "Their page addresses changed with their names; old addresses redirect. /api/clusters.json has a new field, checked."

- date: 2026-11-22
  title: Status, explainer, FAQ and press pages
  items:
    - "New pages: /status/ (has the Riemann hypothesis been solved?), /what-is-the-riemann-hypothesis/, /how-we-know/, /why-it-matters/, /faq/ and /press/."
    - "The explainer has three levels, Simple, Student and Expert, as tabs; each level also has its own Markdown file (simple.md, student.md, expert.md)."
    - "The status block on every page, the app, /api/status.json and llms.txt now states what was verified, the four certified criteria, the live list of checks and what the proof covers."

- date: 2026-11-22
  title: Clean links, list view, Lean source viewer, faster loading
  items:
    - "Renamed 20 themes whose names described only a small part of their content; old addresses redirect."
    - "Status wording updated: who certified, the ongoing checks and what the proof covers. One dated status block now feeds every page, the app, /api/status.json and llms.txt, and About notes that the source viewer shows the original archive as released (commit 40e56bab)."
    - "All 2,647 clusters now have names and descriptions written by Claude, and every cluster has its own page."
    - "Pages have real addresses (for example /cluster/k0677-…/ and /about/) instead of #/ links; old #/ links still work."
    - "New list view at /list/: every cluster as text, ordered by distance from the main theorem, by theme or by size, with a filter."
    - "Lean file pages link to the file on GitHub (the public mirror, pinned to one commit) and can show its source on request."
    - "A small route glyph shows how many import steps lead from a cluster or theme to the main theorem."
    - "Cluster panels show why a cluster is in the proof (its import route up to the main theorem), what it builds on and what needs it, grouped by theme; file pages show how far each file is from Main."
    - "New page /route/: how the proof is structured, from the main theorem down."
    - "Calmer panels: fewer stat tiles, a proof-at-a-glance row on the home panel, plain theme cards."
    - "Smaller first download for the map, and long caching for versioned data."
    - "Every page has a Markdown copy (add index.md to its path); new /api/ with JSON for the proof status, clusters and themes; llms.txt."
    - "The site's own data (names, descriptions, map layout, JSON) is licensed CC BY 4.0."
    - "This changelog and its RSS feed; feedback goes to @SomTheBuilder on X, from the site footer, and each cluster has a small \"Report a wrong name\" link."
    - "Lean source in a wide viewer: file pages open with the source already loading, cluster file lists have a </> button, and the import lines at the top of a file are links (files in the archive open in the viewer; Mathlib, Batteries and Lean core files open their Mathlib docs page)."
    - "/route/ is now a picture: one ring per import step from the main theorem, sized by its number of clusters; click a ring to list its clusters."
    - "The map is coloured by nine fields of mathematics (theme colours, or distance from the main theorem, are one tap away), and can be filtered by field, distance, era (the decade of the newest concept a cluster needs), maths level, and what is new in this proof. Filters are part of the address, so a filtered view can be shared, and the list view uses the same filters."
    - "Cluster panels and pages show each cluster's field, era and maths level; /api/clusters.json has them too."

- date: 2026-11-21
  title: Proof certified; launch of the map
  items:
    - "First version of the RH Lean Explorer: cluster map, cluster, file and concept views, and search."
    - "Canvas star map with a fly-to camera, the route from the main theorem, command search and a mobile sheet."
    - "Theme names and blurbs written by Claude from cluster names and folders."
    - "Static pages for the 63 themes and the named clusters, a social preview image, sitemap and robots.txt."
    - "Static About and Learning path pages, real 404 pages, structured data and llms.txt."
    - "Status updated: on 21 Nov 2026 a joint statement by the Lean and Mathlib communities, endorsed by the Lean FRO and the Mathlib Initiative, certified the Lean statement and proof."
    - "Panel redesign: summary first, stat tiles, route from the main theorem, folded references."
