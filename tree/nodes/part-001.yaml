- id: f-st-primitive-form-sheeted-iff-root-full
  title: A point is a clean sheet exactly when its root lifts to points of X
  kind: step
  status: explained
  plain: 'Defines PrimitiveFormRootFull. A pair (t, tau) qualifies if there is an analytic root branch
    r near t (a root of the polynomial for each nearby s, varying analytically) with r(t) = tau, such
    that for every nearby s the following holds. The point whose i-th coordinate is (sum over j of q_ij(s)
    r(s)^j) / delta(s) lies in X and in the window W (a small open region around w), maps to s under the
    projection A, and has ell-value r(s). In other words, the root tau can be lifted to an analytic family
    of actual points of X. The statement (not proved in this file) is that for points z of X near w with
    delta(A z) nonzero, z is a clean sheet point if and only if PrimitiveFormRootFull holds at (A z, ell
    z).

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimitiveFormSheetedIffRootFull.lean:9
