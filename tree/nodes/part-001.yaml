- id: f-newton-polygon-last-dominant-index-mul-x-sub-c
  title: Multiplying by (X - a) with a inside the disc raises the dominant index by one
  kind: step
  status: explained
  plain: 'Same setup as the neighbouring file, but now |a| <= rho, so a is a root inside the closed disc
    of radius rho. Then (X - a) * g has dominant index d + 1 (the index of its biggest term): its coefficient
    term at index d + 1 is the strict maximum of everything above it and the maximum of everything below.
    Proof idea: the new top coefficient g_d - a g_(d+1) has the same size as g_d, because |a g_(d+1)|
    is strictly smaller (by the strict inequality on terms above d), and ultrametric addition of numbers
    of different size just takes the larger. All other new terms are bounded by rho times the old maximum.
    The main result is `newton_step_root_in_disc`; the helpers are the coefficient formulas and the subtraction
    version of the ultrametric rule.

