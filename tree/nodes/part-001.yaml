- id: f-geometry-proofs--germ-gen-pt-injective-range-reg-at
  title: Sections on an open set are exactly the common regular values at its points
  kind: step
  status: explained
  chunk: c0074
  plain: 'Take a geometric space X with a map from a field''s spectrum hitting a generic point, the point
    whose closure is everything. Take an open set U in which every point is a specialisation of the generic
    one. Evaluating sections at the generic point is one-to-one. A field element a lies in the image exactly
    when it is "regular" at every point of U, meaning it comes from a function defined near that point.
    The one-to-one part uses that sections agreeing at all stalks are equal. The range part glues local
    choices together using the sheaf gluing property.

    '
