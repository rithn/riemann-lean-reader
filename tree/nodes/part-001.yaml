    group G of invertible rational matrices. Let the lattice L be all whole-number combinations of the
    vectors g·e_i (the images of the standard basis). L is preserved by G, since multiplying by a group
    element permutes the generators. Being finitely generated and torsion free, L is free, and it has
    rank N because it spans the same space. In a basis of L each group element becomes an integer matrix,
