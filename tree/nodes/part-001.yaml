  kind: step
  status: explained
  chunk: c0023
  plain: 'Take a ring A, an element h, and a number q that is invertible in A. Say a unit eps (an element
    with an inverse) is a q-th power only approximately, meaning eps minus r to the q is a multiple of
    h. The file builds a bigger ring A'' that is an excision neighbourhood of h and contains an exact
    q-th root of eps. The construction is to adjoin a root of x to the q minus eps. Because q and eps
