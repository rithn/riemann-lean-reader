- id: f-im-conj-mul-combo
  title: 'Proof: area of the lattice from two generators'
  kind: step
  status: explained
  plain: 'Proves `AreaLat`. First an algebra identity: for a = m*w1 + n*w2 and b = m''*w1 + n''*w2, Im(conj(a)*b)
    = (m*n'' - n*m'') * Im(conj(w1)*w2), shown by expanding and rearranging. So every such quantity is
    a whole-number multiple k of the basic one. The area is the smallest positive |k| * |Im(conj(w1)*w2)|.
    The value is positive, so k cannot be zero and |k| >= 1; and k = 1 is reached by taking a = w1 and
    b = w2. Hence area = |Im(conj(w1)*w2)|. Despite the file name, the main theorem `areaLat` lives here
