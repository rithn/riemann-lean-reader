    Q. The proof multiplies the multipliers for a finite generating list; a product of non-members of
    a prime is a non-member. Second, in a Noetherian ring there are h elements of Q, where h is the fewest
    generators the local maximal ideal needs, which generate Q after one outside multiplier. Also, they
