- id: f-geometry-proofs--prod-update-div
  title: Pieces, adjoining an inverse, and a product-ratio identity
  kind: step
  status: explained
  chunk: c0074
  plain: 'This file collects several definitions and small facts. One is the subring of a field obtained
    by adding the inverse of an element a to a ring R. It consists of b with a power of a times b lying
    in R. Another is the definition of a piece, an affine open set matching a ring. Others cover minors
    (determinants of selected rows and columns) and how they scale. The named theorem says that for a
    product over several indices, changing one factor and dividing by the original product gives just
    the ratio of the changed factor to the original one. This needs all the original factors to be nonzero.

