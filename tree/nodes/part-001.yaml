  kind: step
  status: explained
  chunk: c0035
  plain: 'This file computes a dimension. Let T be a ring with a basis of m differentials over S, and
    let K and L be the fraction fields (the fields of fractions) of S and T. The claim is that the differentials
    of L over K form a space of dimension exactly m. The proof has three steps. Passing to fractions is
    an unramified, then etale, extension, so differentials of K over S vanish and those of L over T match
    those of T. The map from differentials over S to those over K is then an isomorphism. A basis of m
    elements transfers across, so the dimension is m.

