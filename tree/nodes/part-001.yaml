- id: f-finsum-conj-classes-centralizer-orbits-eq-pair-orbits
  title: Sum over conjugacy classes equals sum over pair orbits
  kind: step
  status: explained
  orphan: true
  plain: 'A counting identity for a group Gamma acting on a set Y, with a function F(y, gamma) invariant
    under simultaneous action and suitably finite. A conjugacy class is a set of elements of Gamma that
    are conjugates of each other. Left side: for each conjugacy class (representative gamma), sum over
    the orbits of gamma''s centralizer acting on Y the quantity F(y, gamma) / |Stab(y) intersected with
    Centralizer(gamma)|. Right side: `pairSum F`, the sum of F(y, gamma) / |Stab(y, gamma)| over orbits
    of Gamma acting on pairs (y, gamma), with conjugation acting on gamma. They agree because an orbit
    of pairs is the same as a conjugacy class of gamma plus an orbit of the centralizer inside the fibre
    over gamma. The proof matches conjugacy classes with orbits of Gamma acting on itself by conjugation
    (`conjClassesEquivOrbits`), then applies the fibre-by-fibre orbit lemma, using the finiteness lemma
    for its hypothesis. This is a general orbit-counting trick of the kind used in trace formulas; its
    place in the larger proof is not visible from this file.

