    by a high power of l) with all polynomial roots added, then completed so limits exist. Take coefficients
    a_0, ..., a_E of absolute value at most 1, with at least one, a_N, of absolute value exactly 1. Then
    for every b of absolute value at most 1, the equation a_0 W + a_1 W^l + a_2 W^(l^2) + ... + a_E W^(l^E)
    = b has a solution W of absolute value at most 1. Proof idea: form f(X) = (sum of a_k X^(l^k)) - b.
    All its coefficients have absolute value at most 1, and the one at X^(l^N) has absolute value exactly
    1. So by the root-counting result at radius 1, f has at least l^N >= 1 roots in the closed unit disc.
