  status: explained
  chunk: c0072
  plain: 'Take any family of commuting square matrices over a field. A joint eigensystem is a list of
    numbers, one per matrix, such that a single nonzero vector is scaled by each matrix by the matching
    number. The file proves that only finitely many such lists exist. The idea is that vectors with different
    joint eigenvalue lists live in generalised eigenspaces, which are independent subspaces, and a finite-dimensional
    space can only hold finitely many nonzero independent subspaces. Each joint eigensystem gives a nonzero
    one, so there are finitely many.

    '
