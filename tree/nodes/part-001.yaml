- id: f-exists-is-char-eq-add-of-pair-ne-zero
  title: A non-zero pairing means an irreducible character is a summand
  kind: step
  status: explained
  orphan: true
  plain: 'For a finite group over characteristic-zero fields: let phi be an irreducible character and
    a any character, and suppose the pairing of a with phi is not zero. Then a = phi + c for some character
    c. In words, phi occurs inside a, a bit like a prime factor occurring in a number. Proof idea: the
    pairing equals the dimension of the space of intertwining maps (linear maps commuting with the group
    action) from the irreducible representation of phi into that of a. It is not zero, so there is a non-zero
    such map. A non-zero intertwining map out of an irreducible representation is injective (loses no
    information). The previous file then splits off a complement, giving a = phi + c.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/ExistsIsCharEqAddOfPairNeZero.lean:8
  mathlib:
  - Representation.IsIrreducible.injective_or_eq_zero
  - Module.finrank_zero_of_subsingleton
  needs:
  - f-finite-group-function-pairing-character-eq-finrank-inte
  - f-exists-character-quotient-of-injective-intertwining
