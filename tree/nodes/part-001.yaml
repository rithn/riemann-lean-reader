- id: f-c-m-moduli--projective-space-over-spec
  title: Projective space over a ring, and the real-to-complex example
  kind: step
  status: explained
  chunk: c0076
  plain: 'This file sets up vocabulary and proves one small fact. Projective space over a ring is the
    space of "directions", meaning lines through the origin, built from polynomials in N+1 variables.
    A map is "projective" if the space sits inside such a projective space as a closed piece. The file
    also defines a normal scheme (every local ring is a domain and integrally closed), an ind-etale map
    (a limit of branch-free extensions), and a strict henselisation (a local ring where approximate roots
    can be improved and the residue field has all roots). The one proof shows that the complex numbers
    are a strict henselisation of the real numbers: the complex numbers are algebraically closed, and
    the extension from reals is finite and separable, hence etale.

    '
