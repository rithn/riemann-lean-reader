- id: f-geometry-proofs--coord-tie-comp-equiv
  title: Reordering the coordinates keeps a coordinate system valid
  kind: step
  status: explained
  chunk: c0074
  plain: 'The file first sets up the machinery for flag-style coordinates: matrices of formal variables,
    expressions built from them, and determinants of selected rows. Its theorem is simple. A list of numbers
    x is called a "tie" for a geometric setup when its ratios cut out good affine charts and fit with
    the given ring. The theorem says that if x has that property, then relabelling the coordinates by
    a one-to-one correspondence also has it. The proof checks that charts and sets of ratios are the same
    after relabelling, since ratios only depend on which values appear.

    '
