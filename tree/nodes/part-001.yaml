    with x isolated in its fibre, image not in a thinner set. One linear function ell of the coordinates,
    and analytic coefficients a_j depending only on A(z), can be chosen so that on X, ell satisfies a
    monic polynomial equation of degree N: ell^N + sum of a_j(A z) * ell^j = 0. There is also a non-zero
    analytic delta such that the polynomial has distinct roots whenever delta is not zero, and such that
    delta(A z) times each coordinate z_i equals a polynomial in ell with coefficients depending only on
    A(z). This echoes the primitive element theorem from field theory (finitely many algebraic numbers
    can be built from one): a single function ell generates all the coordinates, up to the factor delta.

