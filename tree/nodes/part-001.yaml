- id: f-ab-by-p-of-comm
  title: 'Definitions: characters, induction, pairing, abelian-by-p groups'
  kind: step
  status: explained
  plain: 'A definition file. A character of a group G is the list of traces (diagonal sums) of the matrices
    of some representation, with matrix entries in a smaller field K and traces read in a larger field
    L. Irreducible means the representation cannot be split into smaller pieces. Also defined: virtual
    characters (whole-number combinations of characters); induction, which turns a function on a subgroup
    H into one on G by averaging it over conjugates of g and dividing by the size of H; the pairing of
    two functions, (1/|G|) times the sum over g of a(g) times b(g inverse); and "AbByP", a property of
    a group: there is a prime p and a normal (conjugation-stable) commutative subgroup A such that every
    element x has some power x^(p^k) inside A. The only theorem: the constant function 1 is a character
    (via the 1-dimensional trivial representation).

    '
  lean:
  - Development/AbelianVarietyTheory/Definitions/CommutativeAlgebra/AbByPOfComm.lean:5
  mathlib:
  - Representation.character
  - Representation.trivial
  - Representation.IsIrreducible
  needs:
  - concept-group-representations
  - groups
  - rings-fields
  - linear-algebra
  chunk: c0001
- id: f-linear-map-short-exact-commute
  title: Trace adds up over a block-triangular split
  kind: step
  status: explained
  plain: 'Trace means the sum of the diagonal entries. Suppose a vector space V contains a subspace U
    (via an injective map i) and V maps onto the quotient W = V/U (V with U squashed to zero, via a surjective
    map p). If a linear map b on V sends U to itself, acting as a on U, and acts as c on the quotient
    W, then trace(b) = trace(a) + trace(c). Example: a 3x3 matrix that is block upper triangular, with
    a 2x2 block A and a 1x1 block C, has trace equal to trace(A) + trace(C). The proof splits V into U
    plus a copy of W (using one-sided inverses r and s), writes b as a sum of two maps, and uses trace(XY)
    = trace(YX) to read off the two traces. It holds for finite-dimensional spaces over any field.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/LinearMapShortExactCommute.lean:5
  mathlib:
  - LinearMap.trace_comp_comm'
  - LinearMap.exists_leftInverse_of_injective
  - LinearMap.exists_rightInverse_of_surjective
  needs:
  - linear-algebra
  - rings-fields
  chunk: c0001
- id: f-is-character-over-subfield-of-representation
  title: Characters also work for representations on any vector space
  kind: step
  status: explained
  plain: 'The definition of "character" only uses representations on coordinate space (lists of n numbers),
    but representations in practice live on arbitrary vector spaces. This file shows that any finite-dimensional
    representation rho gives a character in the defined sense, and an irreducible character if rho is
    irreducible (cannot be split into smaller pieces). The idea: choose a basis, which identifies V with
    coordinate space. Trace does not change under a change of basis, so every group element keeps the
    same trace. The rewritten representation also has exactly the same sub-representations (smaller pieces
    the group maps into themselves), so it is irreducible if and only if rho is. Helpers carry a representation
    across an identification of two vector spaces, show the characters agree, and match up the sub-representations
    on each side.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/IsCharacterOverSubfieldOfRepresentation.lean:51
  mathlib:
  - LinearMap.trace_conj'
  - Module.finBasis
  - Basis.equivFun
  - Representation.IsIrreducible
  - OrderIso.isSimpleOrder
  needs:
  - f-ab-by-p-of-comm
  - concept-group-representations
  - linear-algebra
  chunk: c0001
- id: f-finite-group-function-pairing-character-eq-finrank-inte
  title: Pairing two characters counts the maps that respect the group
  kind: step
  status: explained
  plain: 'Take a finite group G over a field of characteristic zero (a number system where 1+1+...+1 is
    never 0, such as the complex numbers) and two representations rho and sigma. The pairing, (1/|G|)
    times the sum over g of chi_sigma(g) chi_rho(g inverse), equals the dimension of the space of "intertwining
    maps" from rho to sigma. An intertwining map is a linear map that gives the same result whether you
    apply a group element before or after it. Example: if the two are the same irreducible representation
    over the complex numbers, the pairing is 1. The file gets this from Mathlib''s version of the same
    identity (Mathlib is Lean''s standard maths library), proved over the smaller field K, by moving it
    into the larger field L; the inclusion of K in L respects sums, products and inverses.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/FiniteGroupFunctionPairingCharacterEqFinrankInte.lean:6
  mathlib:
  - Representation.card_inv_mul_sum_char_mul_char_eq_finrank
  - finsum_eq_sum_of_fintype
  needs:
  - f-ab-by-p-of-comm
  - concept-group-representations
  - groups
  - linear-algebra
  chunk: c0001
- id: f-exists-character-quotient-of-injective-intertwining
  title: A sub-representation splits off its own character
  kind: step
  status: explained
  plain: 'Suppose f is an injective intertwining map (a linear map that commutes with the group action)
    from a representation sigma into a representation rho. Then the character of rho equals the character
    of sigma plus the character of some other representation: the quotient of rho by the image of f. Idea:
    the image of f is a sub-representation of rho, so the group also acts on the quotient (rho with that
    image squashed to zero). The trace-additivity result for short exact sequences, where trace on the
    whole equals trace on the sub-part plus trace on the quotient, then gives trace on rho = trace on
    sigma + trace on the quotient, for each group element. The matrix-version file shows that the quotient''s
    character is a character in the defined sense.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/ExistsCharacterQuotientOfInjectiveIntertwining.lean:8
  mathlib:
  - Submodule.mkQ
  - Submodule.ker_mkQ
  - Submodule.mkQ_surjective
  - Representation.quotient
  - Representation.IntertwiningMap
  needs:
  - f-is-character-over-subfield-of-representation
  - f-linear-map-short-exact-commute
  - f-ab-by-p-of-comm
  - concept-group-representations
