    over each list. The claim: if these sums agree for every j, then the lists contain the same numbers
    the same number of times, so one is a reordering of the other. Example: the lists (1, 3) and (3, 1)
    match; (2, 2) and (1, 3) do not, since their sums at cap 2 differ. Proof: the sum at cap j plus one,
    minus the sum at cap j, counts the entries larger than j. Differences of these counts give the number
