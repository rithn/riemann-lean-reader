    has the Hartogs property: an element that is divisible by a nonzero a at every prime of height at
    most 1 is divisible by a. "Torsion free over A" says that no nonzero a in A kills a nonzero element
    of the module, like integers acting on the rationals. "Etale in low height" says the algebra is etale
    (branch-free) after localizing at every prime whose pull back to A has height at most 1. The examples
