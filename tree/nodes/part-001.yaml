    some nonzero scalar s pushes every element of B into the image of A. The trace of an element is the
    sum of the diagonal entries of the matrix of "multiply by it", like 1+1 for the number 1 inside a
    two-dimensional space. The file proves the trace of x computed in A equals the trace of its image
    computed in B. The idea is to build a map back from B to A that, composed either way, is multiplication
    by s. Trace is unchanged by swapping the order of a composition, so s times each trace agrees, and
