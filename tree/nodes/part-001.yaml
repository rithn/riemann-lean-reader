- id: f-card-fixed-by-quotient-eq-rel-index-of-p-regular
  title: Cosets fixed by an element of order prime to p count a relative index
  kind: step
  status: explained
  plain: 'Take a finite group G, a prime p, an element c whose order is prime to p, and the cyclic group
    <c> of all powers of c. Take subgroups H and N where H contains <c>, every element of H has a p-power
    inside <c>, and N is the normalizer of <c>. Then the number of cosets gH that c fixes (c gH = gH)
    equals the relative index of H in N: the size of N divided by the size of H intersected with N. Proof
    idea: c fixes gH exactly when g^-1 c g is in H. The helper lemma shows this forces g^-1 c g into <c>,
    so g normalizes <c> and lies in N. Then fixed cosets match cosets of H inside N one-to-one. The helper
    uses that an element of order prime to p is a power of any of its p-powers.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/CardFixedByQuotientEqRelIndexOfPRegular.lean:20
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/CardFixedByQuotientEqRelIndexOfPRegular.lean:5
  mathlib:
  - exists_pow_eq_self_of_coprime
  - MulAut.conj
  - orderOf_eq
  - QuotientGroup.eq
  - MulAction.Quotient.smul_mk
  - Nat.card_eq_of_bijective
  - Subgroup.relIndex
