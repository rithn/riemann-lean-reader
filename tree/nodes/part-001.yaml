- id: f-alt-double-sum
  title: Boundary of a boundary is zero
  kind: step
  status: explained
  chunk: c0041
  plain: 'This file proves the basic rule of chain complexes: taking the boundary twice always gives zero.
    Think of a triangle. Its boundary is three edges, and the boundary of those edges cancels, because
    each corner is counted once with a plus and once with a minus. In general the boundary deletes entries
    one at a time with alternating signs. Deleting entry i then entry j gives the same result as deleting
    j then i, but with opposite signs. So the terms pair off and the total is twice itself with a minus
    sign, which forces zero. A small helper tracks how positions shift after a deletion.

    '
