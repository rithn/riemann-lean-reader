  kind: step
  status: explained
  chunk: c0041
  plain: 'This file proves a gluing rule, like the Mayer-Vietoris idea from topology. Take two face-closed
    families A and B. If A, B and their overlap are all hole-free, then the union of A and B is hole-free.
    The idea is to split a zero-boundary chain into an A-part and a B-part. The boundary of the A-part
    lies in the overlap, where it is a boundary of some overlap chain. Subtracting that chain from the
    A-part and adding it to the B-part gives two honest cycles, one in A and one in B, which are each
    boundaries. Adding the fillings finishes it.

    '
