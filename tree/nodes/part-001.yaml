  title: Induced function as a sum over cosets
  kind: step
  status: explained
  plain: 'Take a subgroup H of a finite group G and a function psi on H that is unchanged by conjugation
    (h becomes x^-1 h x, for x in H). The "induced" function is defined by summing psi over all conjugates
    x^-1 g x for x in the whole of G (psi is read as 0 outside H), then dividing by the size of H. This
    file shows the same value can be computed by summing over just one representative of each coset (each
    slice gH of G), with no division. Idea: every element of G is uniquely a coset representative times
    an element of H, and conjugating by the H-part does not change the term. So each coset contributes
    |H| equal terms, and the division by |H| cancels them. Helpers: conjugation by H preserves the extended-by-zero
    function, and the map (coset, h) to representative times h is a bijection.

    '
