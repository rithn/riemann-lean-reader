    j from 0 to q-1, of the form moved by the matrix with rows (1, j) and (0, q). That matrix has rational
    entries and determinant q. The proof is a direct computation. The moving rule contributes a factor
    q to the power k minus 1 from the determinant and a factor q to the power minus k from the bottom-right
    entry. These multiply to one over q, which is exactly the averaging factor in the definition of U.

