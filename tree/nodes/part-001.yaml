    (a "finitely generated" ring), and a nonzero element a. The claim is that there is a ring map from
    A into some number field (a finite extension of the rationals) that does not send a to zero. Proof
    idea. Inside the fraction field of A, adjoin the generators and the inverse of a, over the rationals.
    Pick a maximal ideal and take the quotient, which is a field. By the Nullstellensatz, a field finitely
    generated over the rationals is a finite-dimensional extension of the rationals, that is, a number
    field. Since a became invertible, it stays nonzero.

