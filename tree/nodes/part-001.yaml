- id: f-divisor-proofs--is-excision-nbhd-self
  title: 'Excision neighbourhood: the definition, and the trivial case'
  kind: step
  status: explained
  chunk: c0023
  plain: 'This file defines a condition and proves its easiest case. Take a ring A and an element h. A
    bigger ring A'' built from A is called an excision neighbourhood of h if three things hold. First,
    A'' is an etale extension of A, meaning one with no branching. Second, every element of A'' differs
    from an element of A by a multiple of h. Third, an element of A that is a multiple of h inside A''
    was already a multiple of h in A. Together the last two say that A and A'' look identical when multiples
    of h are treated as zero. The proof shows A itself qualifies, and every check is immediate.

    '
