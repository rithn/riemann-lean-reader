- id: f-st-primitive-form-window
  title: Shrinking to a clean window around w
  kind: step
  status: explained
  plain: 'A stated claim (not proved here), in the primitive-form setting (a linear function ell satisfying
    a monic polynomial equation and generating the coordinates). After shrinking around w one can pick
    an open set W containing w, a convex open set B around A(w), and a bigger open set N'' containing
    the closure of W, on which X is cut out by finitely many analytic functions. The choice makes all
    the earlier assumptions hold on the whole of W or B, not just "eventually near w": the polynomial
    equation for ell, the formula for the coordinates, analyticity of a_j, delta and q_ij, and distinct
    roots off delta = 0. It also ensures that points of X in the closure of W that project into B are
    already in W. This is a bookkeeping step that makes later arguments uniform.

    '
