- id: f-iwasawa-decomposition--discr-mul-mem-of-is-integral
  title: One denominator d clears all integral elements of the tensor fraction field
  kind: step
  status: explained
  chunk: c0022
  orphan: true
  plain: 'Proved in full, using the four neighbouring files. Take integrally closed domains T and U, U
    flat over T, and C finite over T, in characteristic zero. The claim is that there is one non-zero
    d in T such that d times any integral element of the fraction field of U ⊗ C lies in U ⊗ C. The d
