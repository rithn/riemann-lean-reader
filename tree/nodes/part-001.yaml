- id: f-divisor-proofs--is-excision-nbhd-away
  title: Inverting an element that is already invertible mod h keeps an excision neighbourhood
  kind: step
  status: explained
  chunk: c0023
  plain: 'Suppose A'' is an excision neighbourhood of h, and a is an element of A'' that has an inverse
    b once multiples of h are ignored, so that a times b is 1 plus a multiple of h. Then the ring obtained
    by allowing fractions with powers of a underneath is still an excision neighbourhood of h over A.
    The proof checks the three conditions. Allowing fractions is itself an etale step. Every fraction
    y over a^n is matched to something in A by multiplying through by b^n, which equals the inverse of
    a^n modulo h. The last condition is an equation chase using the same trick.

    '
