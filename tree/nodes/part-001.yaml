- id: f-newton-polygon-slope-existence
  title: A first Newton-polygon slope exists in a divisibility-chain ring
  kind: step
  status: explained
  plain: 'Take coefficients q_0, ..., q_d with q_d = 1 and q_0 dividing a power of varpi, in a ring where
    divisors of varpi-powers are unit times i-th powers. The file proves there is a scale c such that
    q_0 divides every q_i c^i, and for at least one i, q_i c^i divides q_0. In other words the terms q_i
