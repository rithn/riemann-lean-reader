- id: f-lat-defs
  title: 'Lattice definitions: the grid, its area, and standard sums'
  kind: step
  status: explained
  plain: 'Sets up the vocabulary for the lattice section. `lat2 w1 w2` is the lattice of all whole-number
    combinations m*w1 + n*w2, the smallest additive group containing both. `area L` is the smallest positive
    value of |Im(conj(w1) * w2)| over all pairs of points w1, w2 of the lattice L; for a genuine lattice
    this is the area of one parallelogram tile. It also defines `eisG L k`, the sum of 1/w^(2k) over nonzero
    lattice points w, then g2 = 60 * eisG L 2, g3 = 140 * eisG L 3 and `discr L` = g2^3 - 27*g3^2: standard
    invariants of the elliptic curve attached to a lattice. `U1` shifts a function G by omega and multiplies
    by an exponential factor with area L in the denominator. I take this to be a "magnetic translation"
