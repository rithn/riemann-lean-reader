- id: f-exists-coprime-order-of-pow-prime-pow
  title: Some p-power of an element has order not divisible by p
  kind: step
  status: explained
  plain: 'In a finite group, take any element x and a prime p. Some power x^(p^k) has an order (the number
    of steps until it returns to the identity) not divisible by p. Proof: write the order of x as p^k
    times u, with p not dividing u; that is, strip out all factors of p. Then x^(p^k) raised to the power
    u is x to the power of its order, which is the identity. So the order of x^(p^k) divides u and is
    therefore prime to p. Example: if x has order 12 and p = 2, then k = 2 and x^4 has order 3.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/ExistsCoprimeOrderOfPowPrimePow.lean:5
  mathlib:
  - Nat.exists_eq_pow_mul_and_not_dvd
  - orderOf_dvd_of_pow_eq_one
  - pow_orderOf_eq_one
  - Nat.Coprime.coprime_dvd_left
  needs:
  - groups
  - primes-divisibility
  - modular-arithmetic
  chunk: c0002
- id: f-card-fixed-by-pow-prime-pow-mod-eq
  title: Fixed points of x^(p^k) and of x agree mod p
  kind: step
  status: explained
  plain: 'Let a finite group G act on a finite set X (each group element permutes the points), let x be
    in G, and let p be a prime. Then the number of points fixed by x^(p^k) is congruent mod p to the number
    of points fixed by x. Proof idea: x permutes the set of points fixed by x^(p^k). Doing this p^k times
    gives the identity, so this permutation has order a power of p. A Mathlib lemma then says the number
    of points of the set is congruent mod p to the number of points that permutation fixes, and those
    are exactly the points fixed by x. Example: for the 4-cycle x on 4 points, with p = 2 and k = 1, x^2
    fixes 0 points and x fixes 0 points.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/CardFixedByPowPrimePowModEq.lean:5
  mathlib:
  - Equiv.Perm.card_fixedPoints_modEq
  - MulAction.fixedBy
  - Nat.card_congr
  needs:
  - concept-group-actions
  - groups
  - counting
  - modular-arithmetic
  - primes-divisibility
  chunk: c0002
- id: f-exists-sylow-over-subgroup
  title: Building a subgroup above C from a Sylow subgroup
  kind: step
  status: explained
  plain: 'Given a subgroup C of a finite group G and a prime p, this builds a subgroup H of G containing
    C with three properties. (1) H normalizes C (conjugating C by elements of H gives C back). (2) Every
    element of H has some p-power lying in C. (3) Inside the normalizer N of C, the relative index of
    H is not divisible by p; that is, the size of N divided by the size of the overlap of H and N. Proof
    idea: C is normal in N, so take the quotient group N/C, pick a Sylow p-subgroup P of it (it exists),
    and let H be everything in N that maps into P. Elements of P have p-power order, giving (2); the index
    of P in N/C is prime to p, giving (3). The file also proves the normalizer is a subgroup.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/ExistsSylowOverSubgroup.lean:5
  mathlib:
  - Sylow
  - Sylow.not_dvd_index
  - Sylow.isPGroup'
  - Subgroup.index_comap_of_surjective
  - Subgroup.comap_map_eq_self_of_injective
  - QuotientGroup.mk'
  needs:
