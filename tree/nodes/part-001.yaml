    in a ring where 2 is invertible. Here a condition called "etale in low height" says that for every
    prime ideal of R whose pull back to A has height at most 1 (height counts steps in a chain of primes),
    the extension C stays etale after localizing at that prime. The file shows this carries over to a
    prime Q of a bigger R-algebra O. The proof uses that etale-ness is preserved under changing the base
    ring, and that the two ways of tensoring agree.

