- id: f-convex-nerve-complexes--nerve-face-closed
  title: Definitions - tuples, boundary map, "no holes", the nerve
  kind: step
  status: explained
  chunk: c0041
  plain: 'This file mostly sets up vocabulary, with one small proved fact. Take a list of index labels.
    A "chain" is a whole-number combination of label tuples, like 2 times (a,b) minus 1 times (b,c). The
    "boundary" of a tuple is the alternating sum of the tuples you get by deleting one entry at a time.
    A family of tuples is "acyclic" if every chain with zero boundary is itself a boundary, which roughly
    means no holes. The "nerve" of sets A_i inside a space X is the collection of tuples whose sets share
    a common point of X. The proved fact is that deleting an entry from a tuple in the nerve stays in
    the nerve. Some extra definitions about polyhedra follow.

    '
