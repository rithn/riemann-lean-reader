  title: If every monic polynomial has a root, every monic polynomial splits fully
  kind: step
  status: explained
  plain: 'Suppose a ring has the property that every monic polynomial of positive degree has a root in
    it. The file proves that then every monic polynomial is a product of linear factors (x - b). So x^3
    - 2x^2 - x + 2 would become (x - 1)(x - 2)(x + 1). The proof is the schoolbook argument by induction
    on degree. Pick a root, divide the polynomial by (x - root), which leaves a monic polynomial of one
    degree less, and repeat. Degree zero gives the polynomial 1, the empty product. The proof appears
    complete; it uses only standard polynomial division facts.

