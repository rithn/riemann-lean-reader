- id: f-st-primitive-form-sheeted-locus-cut-out
  title: Being a clean sheet is a zero-set condition
  kind: step
  status: explained
  plain: 'A stated claim (not proved here). Work in the primitive-form setting of the previous nodes (a
    linear function ell satisfying a monic polynomial equation and generating the coordinates). No irreducibility
    is assumed, but delta is not identically zero near A(w). Then there are analytic functions c and e
    near w with c*e = 0 on X. At points z of X where delta(A(z)) is nonzero, X is a clean sheet at z (locally
    the graph of an analytic function) exactly when c(z) = 0, and clean-sheet points always have e(z)
    nonzero. So "being a clean sheet" is described by an equation c = 0, and zero sets of analytic functions
    can be analysed with analytic tools.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimitiveFormSheetedLocusCutOut.lean:9
  needs:
  - f-st-primitive-form-sheeted-off-discriminant
