- id: f-is-character-over-subfield-restrict-class-function-one
  title: Basic properties of characters
  kind: step
  status: explained
  plain: 'Three facts about a character chi of a group G (the trace function of a matrix representation
    over a subfield K, with values read in a bigger field L). First, restricting chi to any subgroup,
    or along any group homomorphism into G (a map that respects multiplication), gives again a character,
    because you can just restrict the matrices. Second, chi is constant on conjugates: chi(x^-1 g x) =
    chi(g), because trace does not change when you conjugate a matrix. Third, chi(1) is a natural number
    n, the dimension of the matrices, since the n x n identity matrix has trace n. If n = 0 the character
    is the zero function.

