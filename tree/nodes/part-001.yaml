- id: f-complex-analytic-sets--st-holomorphic-on-subset
  title: Definition of "holomorphic on a subset"
  kind: step
  status: explained
  chunk: c0021
  plain: 'A definition only, nothing is claimed. A function f on complex space is called holomorphic on
    a subset S if, near each point z of S, it agrees on S with a genuinely complex- differentiable function
    F defined on a whole open neighbourhood of z. The function F may change from point to point. Example:
    on the parabola y = x^2, the function that returns y is holomorphic. It agrees on the parabola with
    the plain function (x, y) goes to x^2, or with (x, y) goes to y. So the idea is a function of the
    set that looks locally like a smooth function of the surrounding space.

    '
