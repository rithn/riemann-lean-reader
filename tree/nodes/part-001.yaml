- id: f-st-polynomial-root-predicate-factor
  title: Splitting a polynomial into two analytic factors by a yes/no property of roots
  kind: step
  status: explained
  plain: 'A stated claim (not proved here), purely about polynomials with analytic coefficients. On a
    convex open set B of parameters (convex: the straight segment between any two of its points stays
    inside), take a monic polynomial in T with analytic coefficients that has distinct roots wherever
    delta is nonzero. Suppose P is a yes/no property of (t, root) that is locally constant along analytic
    root branches, meaning it cannot change as you follow a root smoothly. Then the polynomial factors
    as C*E, where C and E are analytic in (t, T) jointly, C vanishes at exactly the roots where P is true,
    and E at exactly those where P is false. Example: for T^2 - t the property "root is the positive branch"
    cannot be locally constant, so no such split exists; for T^2 - 1 it splits as (T-1)(T+1).

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPolynomialRootPredicateFactor.lean:6
  mathlib:
