- id: f-discr-is-unit
  title: Etale over a local ring means the discriminant is a unit
  kind: step
  status: explained
  chunk: c0064
  plain: 'The discriminant of a finite free algebra is a determinant built from traces of products of
    basis elements, and it measures whether the algebra is degenerate. Over a local ring (one with a single
    largest ideal, whose quotient is the residue field), the file proves that an etale algebra has a discriminant
    that is a unit, meaning it is invertible. The proof reduces modulo the largest ideal. Over the residue
    field the discriminant of an etale algebra is nonzero, and discriminants commute with change of base.
    A nonzero image in the residue field means the element lies outside the largest ideal, so it is a
    unit.

