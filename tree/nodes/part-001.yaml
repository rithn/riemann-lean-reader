- id: f-is-character-finsum-conj-subgroup-function-extend-by-zer
  title: Summing a subgroup character over cosets gives a character of the whole group
  kind: step
  status: explained
  plain: 'Suppose psi is a character of a subgroup H (the trace function of some matrix representation
    of H). Then the function sending g to the sum over cosets of psi(q^-1 g q), with psi read as 0 outside
    H, is a character of the whole group G. The proof builds the induced representation: G acts on tuples
    indexed by the cosets of H, each g shuffling the cosets and applying H''s matrices to the entries
    (a "monomial" block matrix, one block per coset). The trace of such a block matrix only counts the
    blocks sitting on the diagonal, which are the cosets fixed by g, and those are exactly the terms where
    q^-1 g q lies in H. Helpers: a "cocycle" recording which element of H appears when g moves a coset,
    its multiplication rule (so the construction is a representation), and a trace formula for block matrices
    with permuted blocks.

