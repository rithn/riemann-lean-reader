- id: f-matrix-exists-common-eigenvector-mem
  title: Commuting matrices share an eigenvector inside any stable subspace
  kind: step
  status: explained
  chunk: c0072
  plain: 'Over an algebraically closed field (one where every polynomial has a root, like the complex
    numbers), any set of commuting matrices has a common eigenvector. The file states this matrix form,
    with the extra requirement that the eigenvector can be found inside a given nonzero subspace that
    all the matrices keep in place. It is a repackaging of the operator version, which is proved in another
    file, by converting each matrix into the linear map it represents. The operator version picks a smallest
    stable subspace and uses one eigenvector at a time.

    '
