  chunk: c0075
  plain: 'This file also contains the big step of a construction, but the named result is a smaller one.
    Take a ring A and a family of sets of polynomials in three variables, where each finite subfamily
    has a common solution in some extension ring B. The result says that for any finite list of polynomials
    that are renamed copies of members of the family, one extension B makes all of them vanish together,
    using separate sets of variables for each set. The proof picks B for the finitely many sets involved
