  title: U preserves level-group symmetry
  kind: step
  status: explained
  chunk: c0026
  plain: 'This file proves a claim. Say f is unchanged by every matrix in the level group, and q is a
    prime dividing N times l. Then the averaged function U f is unchanged too. The idea is this. Moving
    the input of U f by a matrix turns each shifted copy of f into f at another shifted point, using a
    related level-group matrix. This works because q divides the lower-left entry. The shift index j becomes
    a new index mod q, and since the bottom-right entry is invertible mod q, this is just a reshuffle
    of 0 to q-1. A shift by q does not change f, so the sum is unchanged.

    '
