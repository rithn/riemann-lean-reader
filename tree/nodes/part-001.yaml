    group images of an element. Suppose some finite lists x and y satisfy a relation saying the sums of
    x times the G-images of y equal a nonzero element b at the identity and zero elsewhere. The file proves
    C is a finitely generated R-module if C has no torsion for b. The key identity says b times c equals
    a combination of the x''s with coefficients T of y times c. So b times C sits inside the span of the
