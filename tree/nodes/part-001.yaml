- id: f-divisor-proofs--exists-pow-sub-mem-span-of-is-unit-mod-of-is-alg-closed
  title: Over an algebraically closed field, a unit mod f is a q-th power mod f
  kind: step
  status: explained
  chunk: c0023
  plain: 'The setting is a ring B of functions on a curve-like shape over an algebraically closed field
    k, such that ideals factor uniquely into primes. Suppose q is not zero in k, and b has an inverse
    c modulo a nonzero f. Then b equals some r to the q modulo f. The proof works one prime factor at
    a time. Modulo each prime, b looks like a constant in k, which has a q-th root since k is algebraically
    closed. Newton-style steps (Hensel lifting) improve this root to higher powers of the prime. The Chinese
    remainder theorem then glues the roots for all primes into one r.

    '
