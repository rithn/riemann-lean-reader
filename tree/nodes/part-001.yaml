- id: f-foundations--pet-eq-rel-index-mul-pet-prod
  title: Level group, Hecke operators and Petersson sum (definitions)
  kind: step
  status: explained
  chunk: c0026
  plain: 'This file mostly defines things. The level group is the set of integer matrices with determinant
    1 that are 1 mod N in two entries and have lower-left entry divisible by l. It defines the operator
    U (average of q shifted copies), the operator V (feed in q times the input), their combination, and
    a Petersson-style sum over tiles. It then proves small facts. Scaling a form scales the sum, and conjugate-scales
    for the second slot. If both forms have full symmetry, the sum equals the number of tiles times one
    integral. The matrix minus-the-identity is not in the level group once N is at least 3. A few concrete
    examples are checked too.

    '
