  kind: step
  status: explained
  chunk: c0042
  plain: 'This file proves a classic fact: the product of (1 plus r) to a fixed power N and e to the minus
    c r squared stays below some fixed number, for all r at least 0, when c is positive. The Gaussian
    dies off faster than any polynomial grows. Proof idea: bound 1 plus r by e to the r, so the product
    is at most e to the (N r minus c r squared). A quadratic with a negative leading coefficient has a
    maximum, found by completing the square, and that maximum is N squared over 4c. So a valid bound is
    e to the power N squared over 4c.

