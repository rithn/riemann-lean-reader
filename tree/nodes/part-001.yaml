- id: f-analytic-germ
  title: 'Definitions: analytic near a point, and an irreducible germ'
  kind: step
  status: explained
  plain: 'Two definitions about a set X of complex tuples (points of complex n-space). "X is analytic
    near w" means that in some small open ball around w, X is exactly the set where finitely many analytic
    functions (given locally by convergent power series) all vanish (equal zero) at once. "The germ of
    X at w is irreducible" means w is in X and, whenever a product f*g of two analytic functions vanishes
    on X near w, then already f vanishes on X near w or g does. This copies the idea of a prime number
    (a "prime ideal", in the jargon): a prime dividing a product divides one factor. Example: the curve
    y = x^2 is irreducible, but the two crossing lines xy = 0 are not. Take f = x and g = y: the product
    vanishes on both lines, but neither factor does.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/AnalyticGerm.lean:8
  mathlib:
  - AnalyticOnNhd
  - AnalyticAt
  - IsOpen
  - nhds filter
  needs:
  - concept-complex-analytic-sets
  - complex-analysis
  - concept-point-set-topology
  chunk: c0003
- id: f-st-analytic-root-branch
  title: Roots of a polynomial move analytically as its coefficients do
  kind: step
  status: explained
  plain: 'This file only states a claim; it is stored as a named statement and not proved here. Take a
    monic polynomial T^N + a_{N-1}(t) T^{N-1} + ... + a_0(t), where "monic" means the top coefficient
    is 1 and the coefficients depend analytically on a parameter t (locally given by convergent power
    series). If at t0 the polynomial has no repeated roots and tau0 is a root, then there is an analytic
    function r defined near t0, with r(t0) = tau0, that remains a root for every nearby t. Example: T^2
    - t at t0 = 1 and tau0 = 1 gives r(t) = sqrt(t), analytic near t = 1. This is the implicit function
    theorem (a standard result for solving an equation for one variable in terms of the others) applied
    to the root equation.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StAnalyticRootBranch.lean:6
  mathlib:
  - Polynomial.Separable
  - AnalyticAt
  - AnalyticOnNhd
  needs:
  - polynomials
  - complex-analysis
  - concept-complex-analytic-sets
  chunk: c0003
- id: f-st-irreducible-germ-projection-image-near
  title: 'Irreducible germ: the projection''s image stays full at nearby points'
  kind: step
  status: explained
  plain: 'A stated claim, not proved in this file. Setup: X is analytic near w with irreducible germ (one
    piece near w, not crossing pieces). A is a linear map from the big space down to d dimensions. And
    w is isolated in its own fibre, meaning nearby points of X with the same image as w equal w. Assume
    the image of X under A is not squeezed into a thinner analytic set near A(w): any analytic function
    h on the target that vanishes on the image vanishes identically near A(w). The claim is that the same
    property holds at every point x of X close enough to w. So the property "the image fills out d dimensions"
    is stable under moving the base point slightly.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StIrreducibleGermProjectionImageNear.lean:9
  needs:
  - f-analytic-germ
  - concept-complex-analytic-sets
  - linear-algebra
  - concept-point-set-topology
  chunk: c0003
- id: f-st-finite-projection-sheets-dense
  title: Points where X is a clean sheet over the target are dense
  kind: step
  status: explained
  plain: 'A stated claim (not proved here), under the same hypotheses as the previous node: irreducible
    germ, linear projection A with w isolated in its fibre, image not inside a thinner analytic set. It
    says that near w, X lies in the closure of the set of points y where X is locally a "sheet". That
    means there is a single analytic section g over an open set O of the target (g undoes the projection:
    A maps g(s) back to s), and X near y equals the image of g. Think of the graph of an analytic function.
    "Closure" here means such graph-like points can be found arbitrarily close to any point of X near
    w, so the bad branching points cannot fill an open part of X.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StFiniteProjectionSheetsDense.lean:9
  needs:
