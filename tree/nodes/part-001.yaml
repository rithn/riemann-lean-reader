- id: f-divisor-proofs--is-excision-nbhd-trans
  title: Excision neighbourhoods can be stacked
  kind: step
  status: explained
  chunk: c0023
  plain: 'This file proves a closure property of the definition in the previous file. If A'' is an excision
    neighbourhood of h over A, and A'''' is an excision neighbourhood of the image of h over A'', then
    A'''' is an excision neighbourhood of h over A. The proof checks the three conditions one by one.
    Stacking etale extensions gives an etale extension (a Mathlib fact). For the other two, you move an
    element of A'''' down to A'' modulo h, and then down to A modulo h, and the two small errors that
    remain are both multiples of h.

    '
