- id: f-st-primitive-form-sheeted-off-discriminant
  title: Away from the thin exceptional set (delta = 0), every point of X is a clean sheet
  kind: step
  status: explained
  plain: 'A stated claim (not proved here). Same setting as before, now also with a "primitive form":
    a linear function ell on the big space satisfies a monic polynomial equation of degree N whose coefficients
    a_j are analytic functions of A(z). Each coordinate z_i can be recovered as a polynomial in ell(z),
    with analytic coefficients, divided by an analytic denominator delta(A(z)). The polynomial is assumed
    to have distinct roots wherever delta is nonzero. The claim is that in a neighbourhood M of w, every
    point y of X with delta(A(y)) nonzero is a "clean sheet" point: X near y is the image of an analytic
    section over the target, like the graph of an analytic function.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimitiveFormSheetedOffDiscriminant.lean:9
  needs:
  - f-st-finite-projection-sheets-dense
