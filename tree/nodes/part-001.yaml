- id: f-acyc-directed
  title: Hole-free on every finite piece means hole-free
  kind: step
  status: explained
  chunk: c0041
  plain: 'This file proves a limit argument. Suppose that for every finite set of tuples in a family,
    we can find a smaller hole-free family that contains them. Then the whole family is hole-free. The
    reason is that a chain uses only finitely many tuples. Take a chain with zero boundary. Its finitely
    many tuples sit inside some hole-free sub-family, so the chain is a boundary there. A boundary in
    the sub-family is also a boundary in the big family, because the sub-family is contained in it.

    '
