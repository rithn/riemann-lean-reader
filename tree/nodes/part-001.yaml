    be joined by a straight segment inside) and convex sets A_i. Choose a linear measuring function f
    and a level u. Cut X into the half where f is at most u and the half where f is at least u. Then the
    nerve of X is the union of the nerves of the two halves, and the nerve of the flat slice where f equals
    u is their overlap. The overlap part is the interesting one: if a point on each side lies in all the
    sets, slide along the straight segment between them to land exactly on the slice.

