- id: f-exists-abelian-by-prime-power-not-dvd-card-fixed-by
  title: A subgroup that is abelian-by-p and fixes a number of cosets not divisible by p
  kind: step
  status: explained
  orphan: true
  plain: 'For a finite group G, an element x and a prime p, there is a subgroup H of G with two properties.
    First, H has a normal commutative (abelian) subgroup A such that every element of H has a p-power
    in A (the project calls this "abelian-by-p"). Second, p does not divide the number of cosets gH (shifted
    copies of H) that x fixes. Proof idea: pick k so that x^(p^k) has order prime to p, and let C be the
    cyclic group it generates (all powers of one element). The Sylow construction gives H containing C,
    and A is C inside H: abelian because cyclic, normal in H. The coset count for x^(p^k) equals a relative
    index not divisible by p, and the mod p congruence carries this over to x. This is the top file of
    its chunk, with no stated user inside this chunk.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/CharacterTheory/ExistsAbelianByPrimePowerNotDvdCardFixedBy.lean:10
  mathlib:
