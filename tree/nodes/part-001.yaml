- id: f-cusp-form-gamma1-inter-gamma0-slash-rat-is-zero-at
  title: Moved cusp forms still vanish at cusps
  kind: step
  status: explained
  chunk: c0026
  plain: 'This file proves a claim. Take a cusp form for the level group, a form that fades to zero at
    every cusp. Move its input by any 2x2 matrix with rational entries and positive determinant, with
    the usual weight factor. The result still fades to zero at every cusp. The idea is that a cusp is
    a rational point or infinity, and such a matrix sends rational points to rational points. So the moved
    form looks, at each cusp, like the original at some other cusp. Since the level group has finite index
    in the full group, all rational points count as cusps for it, which finishes the proof.

    '
