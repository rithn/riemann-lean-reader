- id: f-norm-eigenvalue-le-one-of-entries
  title: Eigenvalues of a matrix with small entries are small
  kind: step
  status: explained
  chunk: c0072
  plain: 'Work in the p-adic numbers, where size is measured by the strange ultrametric rule that a sum
    is never larger than its largest term. If every entry of a square matrix has size at most 1, the file
    shows that every eigenvalue has size at most 1 too. The idea is to look at the eigenvector coordinate
    of largest size. In the equation matrix times vector equals eigenvalue times vector, that coordinate''s
    row is a sum of terms each no larger than it. So the eigenvalue times that coordinate is no larger
    than the coordinate, which forces the eigenvalue to be at most 1.

    '
