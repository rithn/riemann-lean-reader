    a p-adic ring O, it sets up the ring A-inf and three elements: mu, nu and xi. The identity xi times
    nu equals mu is the formula for a geometric sum, x to the p minus 1 equals (x minus 1) times (1 plus
    x plus ... plus x to the p minus 1), applied to a Teichmuller lift. Another identity says that undoing
    Frobenius sends mu to nu. It then defines a "datum", a package of four matrices over A-inf with matching
    actions of a ring Λ and relations like G F = mu. Two examples, an etale one and a multiplicative one,
    are built. I am inferring the intended meaning from names.

