    by every power of p. Then any two ring maps f and g from the p-adic integers into R are equal. The
    idea is that every p-adic integer c is, for each n, an ordinary integer plus a multiple of p to the
    n. Both maps agree on ordinary integers. So f(c) minus g(c) is divisible by p to the n for every n.
