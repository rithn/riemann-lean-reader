- id: f-reg-at-is-local-ring-is-fraction-ring-stalk
  title: The regular elements at a point form a local ring with the field as its fractions
  kind: step
  status: explained
  chunk: c0074
  plain: 'Fix a geometric space X and a field point mapping into it, where the generic point''s stalk
    corresponds one-to-one to the field. For any point p, consider the ring of field elements regular
    at p. The file proves it is a local ring (one maximal ideal), that the whole field is its fraction
    field, and that it is isomorphic to the stalk of X at p. The ring is the image of a surjective ring
    map from the stalk, so it is local. Fractions come from writing a germ at the generic point as a quotient
    of two sections on an affine open set.

    '
