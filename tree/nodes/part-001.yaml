- id: f-minkowski-bound--assemble
  title: From prime-power subgroups to the full Minkowski bound
  kind: step
  status: explained
  chunk: c0068
  plain: 'This proves Minkowski''s bound, but only by assuming a weaker claim, which we call the prime-power
    step. That claim says that a finite group of integer matrices whose size is a power of a prime ℓ has
    size dividing ℓ^m·m!, where m = N/(ℓ−1) rounded down. The idea is that a number divides M(N) if each
    prime power dividing it does. Sylow''s theorem gives a subgroup of exactly that prime-power size.
    Applying the step to it bounds the exponent. The file checks that the exponent of ℓ in ℓ^m·m! equals
    the exponent in M(N), using a formula for how often a prime divides a factorial.

