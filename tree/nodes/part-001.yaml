  kind: step
  status: explained
  chunk: c0027
  plain: 'This file proves a linear-algebra fact. Over a field, take any collection of rows of length
    h. Suppose the only vector orthogonal (dot product zero) to every row is the zero vector. Then you
    can pick h of the rows to make a square matrix whose determinant is not zero. For example, the rows
    (1,0), (0,1) and (1,1) have this property, and (1,0) with (1,1) gives determinant 1. The idea is that
    the rows must span the whole space, since otherwise a nonzero vector would be orthogonal to all of
    them. A spanning set contains a basis, and the basis rows are independent, so their matrix is invertible.

