- id: f-exists-irr-char-add
  title: Every non-zero character contains an irreducible one
  kind: step
  status: explained
  plain: 'Call a function on a group G a "character" if it is the trace function (the diagonal sum of
    the matrix of each group element) of some representation, and an "irreducible character" if the representation
    can be taken irreducible (not splittable into smaller pieces). The main result: any non-zero character
    a can be written as a = phi + c, where phi is an irreducible character and c is again a character.
    The proof picks a smallest non-zero invariant subspace S of the representation (one that every group
    element maps into itself). Smallest by dimension, it must be irreducible; that is the helper result
    in the same file. Take phi to be the character of S, and get c from a separate result about the quotient
    (the whole space modulo S). A non-zero character forces the space to be non-zero, since otherwise
    all traces would be 0.

