- id: f-st-manifold-zeros-complement-connected
  title: 'Statement: removing the zeros of an analytic function leaves a smooth shape in one piece'
  kind: step
  status: explained
  plain: 'Only states a claim; it does not prove it. Let R be a connected (one-piece) set in complex n-space
    that is smooth (every point regular), and h an analytic function on R that is not zero everywhere
    on R. Then R with the zeros of h removed is still connected. This is a complex phenomenon: the zeros
    of an analytic function have real codimension 2 (they are two real dimensions thinner than R), like
    a point removed from a plane. So they cannot cut the shape into pieces. The real analogue fails, since
    removing the point 0 from the real line splits it in two.

    '
