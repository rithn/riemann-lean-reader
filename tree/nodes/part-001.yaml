    E times D-star plus D times E equal to zero, and suppose no nonzero row vector is killed by both E
    and D. The file proves there is a skew-Hermitian V with E times V plus D invertible. The proof gives
    V outright: it is E times (eps times the identity minus D) times E, with eps a nonzero element the
    flip negates. A short computation checks it is skew. If its determinant were zero, some row vector
    would be killed by both E and D, which contradicts the assumption.

    '
