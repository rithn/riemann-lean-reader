  plain: 'Suppose an element m of a tensor product is, after localizing at a prime Q, a multiple of some
    element b. The file shows that before localizing, there is an element s outside Q such that s times
    m is a multiple of b. This is the usual "clearing denominators" trick: a statement true after inverting
    everything outside Q is true up to multiplying by one such element. Localizing a module just means
    allowing such denominators, so equality there means equality up to a factor from outside Q. The proof
    writes the localized element as a fraction and compares numerators.

