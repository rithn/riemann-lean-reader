- id: f-acyc-cone
  title: A cone point makes a family hole-free
  kind: step
  status: explained
  chunk: c0041
  plain: 'This file proves a "cone" rule for the no-holes property. Suppose there is a label a such that
    putting a in front of any tuple of the family gives another tuple of the family. Then the family is
    acyclic. Picture a tent: every loop on the ground can be filled in by joining it to the apex. Concretely,
    define a "join with a" operation on chains. A short calculation shows that taking the boundary of
    the joined chain gives back the original chain minus the join of its boundary. So a chain with zero
    boundary is the boundary of its join with a.

    '
