  kind: step
  status: explained
  chunk: c0052
  plain: 'This file collects consequences of a ring being perfect (p = 0 and the p-th power map is a bijection).
    The p-th power map is a ring automorphism. No nonzero element has a zero power, so there are no nilpotents.
    Every element has a p^k-th root, and that root is unique. For a compatible tower of p-th roots r0,
    r1, r2, ... (each is a p-th root of the last), the k-th term raised to p^k gives back r0, and if r0
    to some power kills x then each r_k kills x. Each proof is short: iterate the bijectivity, and use
    that n is less than p to the n.

