- id: f-dvd-trace-of-balanced-tensor
  title: A balanced tensor forces the trace to be a multiple of c
  kind: step
  status: explained
  chunk: c0072
  plain: 'Let H be a finite free algebra over a local ring O (a ring with a single maximal ideal). Suppose
    a tensor Θ in H tensor H is "balanced", meaning multiplying on the left or right by any element gives
    the same result, and that it multiplies out to c in H. The file shows that c divides the trace of
    every element of H, given that Θ stays nonzero under every map to an algebraically closed field. The
    same file proves that commuting operators have a common eigenvector, by choosing a smallest stable
    subspace. A determinant argument modulo the maximal ideal then shows a certain map is invertible.

    '
