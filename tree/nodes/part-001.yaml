- id: f-hodge-tate-points--val-at-restrict
  title: Evaluating sections at points, and the finite-over-local-ring lemma
  kind: step
  status: explained
  chunk: c0073
  plain: 'This file proves several small facts about functions on a geometric space (a scheme) and evaluating
    them at points of a field. Evaluating a function on a bigger open set and then restricting gives the
    same answer. A function on a group scheme that vanishes at every point is zero, when the group is
    flat and generically reduced. A family of values at points is the evaluation of one function exactly
    when it agrees locally, by gluing. Finally, an open part finite over a local ring that contains the
    closed fibre points contains everything over the ring, via closed maps and specialisation.

