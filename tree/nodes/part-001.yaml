  kind: step
  status: explained
  chunk: c0038
  plain: 'Say f has the q-series with coefficients a_m. The U operator averages f over q shifted copies,
    f at (tau + b)/q for b from 0 to q minus 1. The file shows the result has the series whose m-th coefficient
    is a at q times m. In other words it keeps every q-th coefficient and drops the others. Each shifted
    copy gives roots of unity as factors, and summing a root of unity''s powers over a full cycle gives
    q if q divides the exponent and 0 otherwise. That filters out the unwanted terms.

