- id: f-st-primitive-form-full-branch-constant
  title: Lifting a root is all-or-nothing on a connected region
  kind: step
  status: explained
  plain: 'A stated claim (not proved here). Fix a connected open region O of the target (connected means
    in one piece) where delta is nonzero and the polynomial has distinct roots, and let r be an analytic
    root branch over O. Then the property PrimitiveFormRootFull (the root lifts to an analytic family
    of points of X) is either true at every point (s, r(s)) with s in O, or false at all of them. It cannot
    switch on and off. This is a connectedness argument: the set where it holds is both open and closed
    inside O, and a connected set has no such subsets except the empty set and itself. The statement also
    carries window assumptions (open sets W and N'', the closure of W inside N'', and so on) that keep
    X under control.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimitiveFormFullBranchConstant.lean:7
