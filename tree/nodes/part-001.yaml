    a prime p. The number of elements of M/pM (M with multiples of p treated as zero) equals the number
    of elements x with p times x equal to 0, multiplied by p raised to the rank of M. Check with M = Z/4
    times Z and p = 2. M/2M has 4 elements. The "p-torsion" {0, 2} has 2 elements, and 2 to the power
