- id: f-piece-localization-at-element
  title: Inverting an element of a piece gives another piece
  kind: step
  status: explained
  chunk: c0074
  plain: 'A "piece" is an affine open set U whose ring of functions R sits inside a field as exactly the
    elements regular at all points of U. Given a nonzero element a of R, the file shows that inverting
    a gives another piece. It is the open set where a is invertible, and its ring is R with a allowed
    in denominators. The proof takes the section whose value at the generic point is a, uses its basic
    open set, and checks both inclusions of rings. If the generic point is not in U, the sets are empty
    and the claim is trivial.

    '
