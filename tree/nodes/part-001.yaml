    piece
  kind: step
  status: explained
  chunk: c0073
  plain: 'Over a local ring R, consider a group built from a finite flat group scheme. Take an open part
    U that is finite over R and contains every point over the closed point. The file proves that U is
    closed under the group operations, so it is a "finite open sub" of the group, meaning a finite open
    piece that is also closed under multiplication, inverses, and containing the identity. The proof uses
    the earlier result that any finite piece mapping into the group lands inside U, applied to products
