- id: f-newton-polygon-dominant-index-x-sub-c-mul
  title: Multiplying by (X - a) with a outside the disc keeps the dominant index
  kind: step
  status: explained
  plain: 'Take a polynomial g over an ultrametric field and a radius rho > 0. Suppose the term |g_d| rho^d
    is strictly the largest among higher terms and at least as large as all lower ones, so d is the dominant
    index (index of the biggest term). If a is a number with |a| > rho (a root outside the disc), then
    (X - a) * g has the same dominant index d. Proof idea: the new coefficient of X^(k+1) is g_k - a g_(k+1).
    Using the ultrametric rule that |x - y| is at most max(|x|, |y|), every new term is bounded by |a|
    times the old maximum. At position d the a * g_d part is strictly bigger than the g_(d-1) part, so
    the bound is attained there. The file proves this as `newton_step_root_outside_disc`, plus three small
    helpers (coefficient formulas, ultrametric rule for subtraction).

    '
