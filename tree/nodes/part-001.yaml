    The file proves that if A is etale (free of branching) after localizing at every height-one prime,
    then A is etale over R. The key is the discriminant, a determinant of traces. Etale over a field means
    nonzero discriminant. Over each height-one prime the discriminant is therefore a unit, so it lies
