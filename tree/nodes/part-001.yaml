- id: f-exists-prime-gt-dvd-eval
  title: A whole-number polynomial takes values divisible by huge primes
  kind: step
  status: explained
  plain: 'Take a whole-number polynomial that is not constant, say x^2 + 1. For any bound n, some prime
    bigger than n divides one of its values. Example: x^2 + 1 at 4 gives 17. The proof echoes Euclid''s
    argument that primes never run out. If the value at 0 is 0, every prime divides it, so we are done.
    Otherwise call the value at 0 "a". Then the value at a times n factorial times k equals a times (1
    + n factorial times k times q), for some whole number q. Pick k so that the bracket is not 1 or -1.
    Its smallest prime factor cannot be at most n, since such a prime would divide n factorial and so
    divide 1.

    '
