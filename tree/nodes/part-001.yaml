- id: f-regular-locus
  title: 'Regular points: where a complex shape is smooth'
  kind: step
  status: explained
  plain: 'Defines what it means for a point x of a set Y in complex n-space to be "regular": Y looks like
    a smooth complex-analytic sheet there. Concretely, a linear map A squashes space onto d coordinates,
    and near x the set Y is exactly the image of an analytic function g from an open piece O of d-space
    back up into Y, with A(g(y)) = y, so Y is the graph of g over d-space. Example: the curve y = x^2
    is regular everywhere, as a graph over the x-axis. The regular locus is the set of all regular points
    of Y. The file proves it lies in Y, and that every regular point of Y is also regular in the regular
    locus itself. It also defines a small helper set: the point 0 together with the numbers 1/1, 1/2,
    1/3, ... (a sequence plus its limit).

