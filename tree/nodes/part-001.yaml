    Take rings R, S, T stacked like a tower, with T smooth over S (a nice family without singularities).
    Suppose differentials of z1..ze form a basis of those of S over R, and differentials of w1..wm form
    a basis for T over S. Then the differentials of all of them together, z''s pushed into T followed
    by the w''s, form a basis for T over R. The proof is a linear algebra lemma. A short exact sequence
    with a basis on each end gives a basis on the middle. Smoothness is what makes the left map injective.

    '
