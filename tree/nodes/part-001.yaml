- id: f-finite-open-le-closed-fibre
  title: An open piece that is finite over a local ring is decided by its closed fibre
  kind: step
  status: explained
  chunk: c0073
  plain: 'This file only restates a result proved in another file, under a second name. Take a space X
    mapping to the spectrum of a local ring R, a space with one closed point. Let U be an open part of
    X that is "finite" over R, loosely meaning it is built from finitely many R-pieces. If U'' is another
    open part containing every point of X sitting over the closed point, then U lies inside U''. The idea
    is that any point of U can be moved, by specialising, to a point over the closed point, and open sets
    are closed under that move backwards.

    '
