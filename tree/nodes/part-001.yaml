  kind: step
  status: explained
  chunk: c0020
  plain: 'Proved in full. Let C be a complex of abelian groups, with a prime p that kills nothing but
    zero in every degree. Then "multiply by p" followed by "reduce mod p" (send x to 1 ⊗ x in Z/p ⊗ C)
    forms a short exact sequence of complexes. Check degree by degree. Multiplication by p is one-to-one
    by hypothesis. Reducing mod p reaches every element of Z/p ⊗ M, since k copies of 1 ⊗ m is 1 ⊗ km.
