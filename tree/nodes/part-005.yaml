    basic modular forms E4 and E6. For E4 the coefficient of q^n is 240 times the sum of the cubes of
    the divisors of n, and the constant term is 1. For E6 it is minus 504 times the sum of the fifth powers
    of the divisors of n, with constant term 1. For example, E4 = 1 + 240q + 2160q^2 + and so on. The
    proof uses Mathlib''s general Eisenstein series formula together with the Bernoulli numbers B4 = -1/30
    and B6 = 1/42. It also defines a polynomial-growth bound on coefficients.

