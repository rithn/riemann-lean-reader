  kind: step
  status: explained
  chunk: c0401
  plain: 'Let k be a finite field with q elements. Take two vectors a and b of length n+1, with a nonzero
    and b not a multiple of a. The claim is that q^2 times the number of x with a . x = 1 and b . x =
    1 equals q^(n+1). So there are q^(n-1) such x. The proof shows the map x going to the pair (a . x,
    b . x) is onto the plane k^2, since otherwise a nonzero functional would force a linear relation between
    a and b. A solution set is then a translate of the kernel, whose size is q to the power of its dimension,
