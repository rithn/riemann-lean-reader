- id: f-toroidal-compactification--push-invertible
  title: Vocabulary for models of moduli spaces of abelian varieties
  kind: step
  status: explained
  chunk: c0333
  plain: 'This file only makes definitions; it proves nothing. It sets up the objects used to study a
    "moduli space", a geometric space whose points are abelian varieties (shapes like higher-dimensional
    complex tori) of a given type with extra "level" data. It defines a root of unity, a number field
    built from it, and the moduli space with its universal family. It then defines a "model": an integral
    version of that space over a ring O, normal, projective and flat, containing the original as an open
    dense piece. It also defines when one model dominates or transitions to another, when level symmetries
    extend, and a technical "push-invertible" condition on line bundles.

    '
