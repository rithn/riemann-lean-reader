- id: f-cocycle-is-coboundary-of-neg-central-element
  title: A cocycle is a coboundary when −1 acts by an element
  kind: step
  status: explained
  chunk: c0335
  plain: 'This file proves an abstract algebra fact. A group G acts on a module V where 2 can be inverted.
    A "cocycle" z assigns to each group element a vector, subject to a twisting rule. It is a "coboundary"
    if z(g) = g·p − p for a single vector p. Assume an element c acts as minus the identity on a submodule
    S, and the commutators of c with everything lie in a normal subgroup Δ where z vanishes and the action
    is trivial. Then z is a coboundary with p = −z(c)/2. The proof compares z(cg) and z(gc), which are
    equal, and divides by 2.

    '
