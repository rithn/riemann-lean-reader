    norm of r, the determinant of multiplication by r, equals the product of r, sigma(r), ..., sigma^(q-1)(r).
    For example, over the real numbers with R the complex numbers and sigma conjugation, the norm of a
    + bi is (a + bi)(a minus bi) = a squared plus b squared. The proof shows R tensor R is isomorphic
    to q copies of R through a map that sends a tensor b to a·sigma^j(b), then uses that a norm on a product
