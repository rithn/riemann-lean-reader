- id: f-is-adic-complete-of-finite-basis
  title: A module with a finite basis over a complete ring is complete
  kind: step
  status: explained
  chunk: c0371
  orphan: true
  plain: 'A ring is "complete" for an ideal J if any sequence whose terms agree ever more closely (their
    differences land in higher and higher powers of J) has a limit. The p-adic integers are an example.
    This file proves, in full, that a module with a finite basis over such a ring (think of n-tuples of
    numbers) is complete too. The idea is to work one coordinate at a time. A difference lies in a power
    of J exactly when every coordinate does, so limits can be built coordinate by coordinate. It then
    deduces that a ring that is finite and flat over a complete local ring is complete for the extended
    ideal, because flat plus finite over a local ring forces a finite basis.

    '
