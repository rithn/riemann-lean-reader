  kind: step
  status: explained
  chunk: c0430
  plain: 'This file only states a claim and proves nothing. The claim, called the ramified start, is a
    version of the key representation statement for the special case where the prime l equals d. It says
    a starting vector with a good approximation at level 1 exists whenever the usual hypotheses hold.
    Elsewhere the other case, where l does not divide d, is proved directly, and this claim is the one
    hypothesis left over. It is kept as an assumption.

