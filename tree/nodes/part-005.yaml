  status: explained
  chunk: c0427
  plain: 'For a matrix g of size n with a characteristic polynomial without repeated roots, a Krylov matrix
    of a vector v has columns v, gv, g squared v, up to g^(n-1) v. The file proves that over a ring with
    finitely many maximal ideals, some v makes this matrix invertible. Over a field, a vector exists by
    cyclic-module arguments, since a low-degree polynomial killing g must be zero (it would have more
    roots than its degree). For a general ring, pick such vectors modulo each maximal ideal and glue them
