- id: f-q-expansion-mono-w-coeff-zero
  title: Every level-one modular form is a polynomial in E4 and E6
  kind: step
  status: explained
  chunk: c0396
  plain: 'The claim is that every full-level modular form of weight w is a combination of monomials E4^a
    times E6^b with 4a + 6b = w. For example, weight 12 forms use E4^3, E6^2 and nothing else. The proof
    is a strong induction on the weight. Subtract a multiple of a monomial to kill the constant term of
    the q-series, which makes a cusp form (a form vanishing at infinity). Such a form is the discriminant
    times a form of weight w - 12. Small weights are handled by the fact that there are no nonzero cusp
    forms below weight 12. Odd weights give zero. It uses Mathlib''s results on the discriminant.

