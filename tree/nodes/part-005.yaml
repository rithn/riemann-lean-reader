  kind: step
  status: explained
  chunk: c0366
  plain: 'Call x "Frobenius-fixed" if, for some f above 0, x^(p^f) − x is divisible by p. For example,
    modulo 3, every integer satisfies x^3 ≡ x. The file shows this property survives sums, products, negatives,
    and includes 0, 1 and every root of unity whose order is not divisible by p. For roots of unity it
    uses Euler''s theorem on powers modulo the order. Sums are the delicate case: (x+y)^p differs from
    x^p + y^p by a multiple of p. Hence the whole ring generated by such roots of unity has the property,
