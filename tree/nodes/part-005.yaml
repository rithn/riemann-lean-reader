    one- and two-dimensional cases. The others are about intersection numbers over a ring with one prime
    (a discrete valuation ring, such as the p-adic integers). "Conservation of number" says that cutting
    out the prime p gives the same intersection numbers as the generic fibre computes. A second claim
    cuts by an effective divisor, and a third says two vertical divisors commute. A few small helper facts
