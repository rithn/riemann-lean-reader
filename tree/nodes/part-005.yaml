- id: f-foundation-proofs--two-var-poly-subst-matrix-basic-laws
  title: 'Matrices acting on two-variable polynomials: basic laws'
  kind: step
  status: explained
  chunk: c0335
  plain: 'This file proves a bundle of seven basic rules for a matrix acting on polynomials in two variables
    x and y. A 2-by-2 matrix with whole-number entries acts by replacing x and y with linear combinations
    of them. The rules: acting by a product of matrices is acting one after the other (in swapped order);
    the identity matrix does nothing; homogeneous polynomials (all terms the same degree w) stay homogeneous;
    evaluating commutes with the action; changing the coefficient ring commutes with it; matrices equal
    in the ring act equally; and minus the identity multiplies a degree-w polynomial by (−1)^w. Each is
    checked on x and y.

    '
  lean:
