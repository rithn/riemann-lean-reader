- id: f-fundamental-domains--moderate-coefficient-positivity
  title: Fourier coefficients of slowly growing forms, claims only
  kind: step
  status: explained
  chunk: c0431
  plain: 'This file defines vocabulary and states unproved claims about Fourier-Jacobi coefficients, which
    are the pieces left after expanding a form along a direction. The definitions describe a flow that
    moves frames, a family of periods, and the coefficient as an average over one period cell. The claims
    are about when a frame stays in the domain, how norms change along the flow, and the expansion itself.
    The main claim says that for a form with moderate growth, the coefficients vanish for negative frequencies,
    and for positive frequencies they decay exponentially. Further claims cover products of forms and
    closure of the form spaces.

