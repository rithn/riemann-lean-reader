- id: f-hermitian-descent--nm-poly
  title: The norm of a matrix has coefficients in the base ring
  kind: step
  status: explained
  chunk: c0427
  plain: 'For a Galois automorphism sigma of order q, the norm of an invertible matrix delta is delta
    times sigma(delta) times ... times sigma^(q-1)(delta). The file proves two things. The characteristic
    polynomial of this norm is a monic polynomial with coefficients in the base ring k, not just in R.
    And replacing delta by its sigma-twisted conjugate by x only conjugates the norm by x. The proof shows
    sigma applied to the norm is a conjugate of the norm, so its characteristic polynomial is fixed by
    sigma, and fixed elements come from k.

