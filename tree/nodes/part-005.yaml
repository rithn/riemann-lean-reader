- id: f-complex-analytic-sets--st-area-multiplicity
  title: Area-with-multiplicity statement (a claim, not proved here)
  kind: step
  status: explained
  chunk: c0334
  plain: 'This file only states a claim and a definition; it proves nothing. The definition is the "area
    Jacobian" of a linear map: the square root of the determinant of L-transpose times L, which says how
    much L scales k-dimensional area. The claim is the area formula. For a smooth map f between two spaces
    of equal dimension k, add up the area-scaling factor of f over a measurable set A. This equals the
    integral over the target of the number of points of A that map to each target point. Counting points
    with multiplicity is the point. Other files prove it.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StAreaMultiplicity.lean:12
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StAreaMultiplicity.lean:16
