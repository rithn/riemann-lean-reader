- id: f-p-area-multiplicity
  title: Proof of the area formula with multiplicity
  kind: step
  status: explained
  chunk: c0334
  plain: 'This file proves the area-with-multiplicity statement. It first does the same-space case. Cut
    the set into countably many pieces where the derivative is invertible and f is one-to-one. Points
    where the derivative is singular map to a set of zero size, so they are ignored. On each piece, Mathlib''s
    change of variables says the integral of the Jacobian equals the size of the image. Summing the pieces
    counts each target point once per preimage. It also proves that counting points of a disjoint union
    adds up. Finally, it transfers the general case to this one by an isometry (a length-preserving identification
    of the two spaces).

    '
  lean:
