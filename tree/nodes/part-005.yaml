    the output by X^m times a fixed linear map L of h''s constant term, up to order m+1, if L is onto
    then an exact power-series solution exists. Proof: fix the solution one coefficient at a time. At
    step m, pick a preimage under L that cancels the m-th coefficient of the error, add X^m times it,
