- id: f-arithmetic-intersection--local-length-additivity-torsion-free
  title: Length formulas for quotients in one and two dimensions, stated
  kind: step
  status: explained
  chunk: c0432
  plain: 'This file only states claims, with no proofs. It first defines two order-of-vanishing measures.
    The claims concern the "length" of a module, a count of how many simple layers it is built from. The
    first says that cutting a module by multiplying by x changes the length by a sum over one-dimensional
    pieces. The second is a torsion-free version: for a module with no torsion over a one-dimensional
    local domain, the length of the quotient by x is the rank times the order of x. The third is a two-dimensional
    symmetry, saying the intersection count of a and b equals that of b and a.

    '
