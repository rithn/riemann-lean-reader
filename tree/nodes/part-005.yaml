- id: f-l-partial-sum
  title: Tail of an L-function series is small
  kind: step
  status: explained
  chunk: c0391
  plain: 'This file proves a size bound for a Dirichlet L-function (a series built from a repeating pattern
    of numbers, a "character"). Suppose the running totals of the pattern never exceed some size B. Then,
    for a complex input s with positive real part, the L-function differs from its first N terms (plus
    a small correction) by at most 2B(1 + |s|/Re s) times N to the power minus Re s. The idea is summation
    by parts. Each tail term is bounded by B times a difference of two neighbouring powers. Those differences
