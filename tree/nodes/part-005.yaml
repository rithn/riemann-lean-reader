- id: f-formal-degree-square-integrable--unimod
  title: The pseudo-unitary matrix group is unimodular
  kind: step
  status: explained
  chunk: c0378
  plain: 'This file proves, in full, that the Haar measure on the group of matrices preserving a sign
    form is invariant under right multiplication and under inversion. This is called unimodularity. First,
    a compact subgroup has trivial modular character, the factor by which right translation scales the
    measure. Second, Hermitian group elements also have trivial character, since they are conjugate to
    their own inverse by the sign matrix. Third, a polar decomposition writes every group element as a
    compact part times a Hermitian part, so every element has trivial character. Finally, trivial character
    implies the two invariances.

    '
