- id: f-prod-primes-dvd
  title: If pairwise unrelated primes each divide y, so does their product
  kind: step
  status: explained
  chunk: c0386
  plain: 'In a commutative ring, take finitely many elements f(a) in a finite index set, each of them
    prime, with none dividing another except itself. If each f(a) divides y, then the product of all the
    f(a) divides y. Proof: induction on the size of the set. Remove one element a; by induction the product
    of the rest divides y, so y is that product times c. Then f(a) divides that product times c. By primality
    either f(a) divides c, giving the product divides y, or it divides one of the others, which is excluded.
    Familiar example: 2, 3 and 5 each dividing y means 30 divides y.

    '
