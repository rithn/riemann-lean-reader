- id: f-capelli-identities--dvd-of-aeval
  title: If a polynomial kills a matrix with distinct eigenvalues, the characteristic polynomial divides
    it
  kind: step
  status: explained
  chunk: c0427
  plain: 'Over a field K, let g be a square matrix whose characteristic polynomial has no repeated roots.
    If a polynomial p gives the zero matrix at g, then the characteristic polynomial divides p. Proof:
    move to an algebraic closure, where the characteristic polynomial splits into distinct linear factors.
    Each eigenvalue is a root of the characteristic polynomial. Applying p to the matrix gives zero, so
    p of each eigenvalue is zero, meaning every root of the characteristic polynomial is a root of p.
    A polynomial with distinct roots then divides anything having all those roots.

    '
