    Take an m-by-m Hermitian matrix S, an m-by-n matrix x whose "Gram matrix" (conjugate transpose of
    x, times S, times x) is invertible, and an n-by-n Hermitian target H. The file proves that the number
    of m-by-n matrices y with y*Sx + x*Sy = H is exactly q to the power 2mn minus n squared. Idea: the
    map sending y to y*Sx + x*Sy is additive and lands in Hermitian matrices; it is onto, because some
    element of E has trace one, so one can always build a preimage. All fibres of an onto group map have
