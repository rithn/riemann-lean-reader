- id: f-casimir-coefficients--c-binet
  title: The Cauchy-Binet formula for determinants
  kind: step
  status: explained
  chunk: c0397
  plain: 'The Cauchy-Binet formula. For a wide matrix A and a tall matrix B, the determinant of A times
    B equals a sum over all choices S of i columns of A. Each term is the determinant of the i by i piece
    of A on those columns times the determinant of the matching piece of B. For a 2 by 3 matrix A, there
    are three terms. The proof starts from the sum over all column choices. It drops the choices that
    repeat a column, since a repeated row makes a determinant zero. It then groups the rest by their set
    of columns and sorts them with the sign of the sorting permutation. It then applies the formula to
    a unitary-diagonal product.

    '
