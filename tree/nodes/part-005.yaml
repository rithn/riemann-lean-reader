    differentiable infinitely often. This is the multi-variable version of a famous fact from complex
    analysis. The idea: Cauchy''s formula writes the derivative in a chosen direction as an integral around
    a small circle of the function''s own values. A function given by such an integral, with a bounded
    and continuous integrand, can be differentiated under the integral sign, so the derivative is again
    differentiable. Repeating this step by induction gives every order. The file first proves the needed
    bounds and continuity of these circle integrals.

