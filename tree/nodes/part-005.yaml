- id: f-join-col
  title: Gaussian weight and the Levi matrix (definitions)
  kind: step
  status: explained
  chunk: c0334
  plain: 'This file only gives definitions. The first is a Gaussian weight: for a table C of complex numbers,
    the number e raised to minus the sum of all squared sizes. It is the bell curve in many complex variables.
    The second counts, for a set A, how many points make several linear combinations of given functions
    vanish together. The third, "Levi matrix", takes a vector f and a table F and builds a small square
    matrix from sums of products and conjugates. It resembles a Gram matrix (table of inner products)
    corrected by f. The last glues one extra column onto a table. No claims are proved here.

    '
  lean:
