- id: f-rep-h-smul-right
  title: The key start claim, proved when l does not divide d
  kind: step
  status: explained
  chunk: c0430
  orphan: true
  plain: 'This file proves that the ramified-case claim implies the whole key start claim. It first records
    how the Hermitian pairing behaves under scaling and adding. It then builds a vector w with a pairing
    of the form constant times N over S, where neither N nor S is divisible by l, using the unit-pairing
    vector and checking four candidates. If all four fail, divisibility forces l to divide the product
    of a quantity and d, contradicting the assumptions. When l is not d, the quadratic-form fact modulo
    l then supplies the rest. When l equals d, the assumed claim is used.

    '
