  kind: step
  status: explained
  chunk: c0425
  plain: 'Let zeta be a primitive p^j-th root of unity and s at most the Euler totient of p^j, which is
    p^(j-1)(p-1). The file proves p divided by (zeta minus 1) raised to s is integral, a root of a monic
    polynomial. The proof writes p as the product of (1 minus mu) over all primitive roots mu, which is
    the cyclotomic polynomial at 1. Each 1 minus mu is (zeta minus 1) times an integral number, by the
    geometric sum, and there are exactly the totient many factors. So p equals (zeta minus 1) to the totient
    times an integral element.

