- id: f-u-operator-pow-eventually-invariant-mod-pow
  title: Repeated U operators make a function almost invariant
  kind: step
  status: explained
  chunk: c0331
  orphan: true
  plain: 'This file proves a theorem. Take a function on a p-adic matrix group that is "nice" (fixed by
    two subgroups). Apply the U operator, a averaging-style operation that shifts and sums the function,
    over and over. Eventually the result is unchanged by a chosen subgroup, up to an error that is divisible
    by a high power of the maximal ideal (the "small numbers" of the coefficient ring). The proof reduces
    everything modulo that power, so the coefficients live in a finite-style quotient ring. There, one
    application of U keeps the function fixed by the first two subgroups and improves the third one''s
    level by one step. Repeating this n times gets the full fixedness. Then the result is lifted back
    to the original ring.

    '
  lean:
  - Development/AutomorphicArithmetic/AutomorphicVarieties/BuildingsResidueChars/UOperatorPowEventuallyInvariantModPow.lean:24
  mathlib:
