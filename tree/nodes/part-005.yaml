- id: f-foundation-proofs--imports-bis
  title: A local parameter's powers stay exactly one level deep
  kind: step
  status: explained
  chunk: c0381
  plain: 'In a Dedekind domain (a ring where ideals factor uniquely into primes), let Q be a nonzero prime
    ideal and pi an element of Q that is not in Q squared. Then pi^m is not in Q^(m+1), for every m. Proof:
    the ideal generated by pi factors as Q times an ideal J, and Q does not divide J (otherwise pi would
    lie in Q squared). Then pi^m generates Q^m times J^m. If Q^(m+1) divided that, cancel Q^m to get Q
    dividing J^m, so Q would divide J as Q is prime, a contradiction. Example: in the integers with Q
    the ideal (p), pi = p works.

