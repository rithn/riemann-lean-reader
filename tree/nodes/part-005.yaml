- id: f-foundation-proofs--exists-scalar-gamma1-cap-gamma0-mod-level
  title: A matrix that is −1 at one prime power and central at another level
  kind: step
  status: explained
  chunk: c0335
  plain: 'This file proves an existence result about 2-by-2 integer matrices of determinant 1. Fix an
    odd prime l not dividing N or M. The claim is that there is a matrix c with three properties. It lies
    in the standard level-N congruence group (upper-left and lower-right entries 1 mod N, lower-left 0
    mod N, and 0 mod l). It acts like the scalar −1 modulo l^a. Its commutator with every matrix of determinant
    1 is trivial modulo M·N·l^a. The proof builds it explicitly from the Chinese remainder idea: Bézout''s
    identity, which writes 1 as a combination of coprime numbers, gives the entries.

    '
