- id: f-block-decomposition--unramified-quotient-card
  title: The quotient by the uniformiser to the k has q^(2k) elements
  kind: step
  status: explained
  chunk: c0379
  plain: 'In an unramified quadratic ring with uniformiser ϖ, the ring modulo ϖ to the power k has exactly
    q to the power 2k elements. For k equal to 1 this is the given size q squared. The proof is by induction
    on k. Reducing mod ϖ^(k+1) down to mod ϖ^k is an onto group map; its kernel is the set of multiples
    of ϖ^k, and multiplying by ϖ^k (which never kills a nonzero element in this ring) identifies that
    kernel with the ring mod ϖ. Group size equals kernel size times image size, so the count multiplies
    by q squared at each step. Think of Z mod p^k having p^k elements.

