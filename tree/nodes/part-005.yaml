  status: explained
  chunk: c0351
  orphan: true
  plain: 'A ring is "complete" for an ideal J if every sequence that settles down in the J-adic sense
    (differences lie in higher and higher powers of J) has a limit, and only zero is infinitely close
    to zero. This file proves that completeness passes between two ideals that control each other: if
    some power of J lies inside J'', and some power of J'' lies inside J, then complete for J means complete
    for J''. The idea is to compare the two chains of powers. Powers of J'' are sandwiched between powers
    of J, with indices stretched by a fixed factor. So sequences and limits for one ideal can be re-indexed
    into the other.

