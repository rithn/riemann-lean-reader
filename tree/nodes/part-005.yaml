- id: f-square-integrability--torus-at
  title: What it means for a theta-torus to sit at a point
  kind: step
  status: explained
  chunk: c0431
  plain: 'This file defines "being a torus at a point" and states one claim, without proving it. A torus
    datum matches a lattice in a model space with a lattice from the form data. It matches vectors to
    vectors, preserves the action of integers of the field, preserves sizes (the squared norm equals a
    weighted sum of the form''s values) and matches the imaginary part of the pairing up to a sign. The
    claim says such a matching has the same shortest-vector length as the frame and the same cutoff function.

