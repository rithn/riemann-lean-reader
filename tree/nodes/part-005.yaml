- id: f-gaussian-det-square-integral
  title: Integral of a Gaussian times a squared determinant
  kind: step
  status: explained
  chunk: c0334
  plain: 'This file proves a formula. Pick a d-column matrix G with n rows. Fill a d-by-n table C with
    independent complex Gaussian numbers, and multiply C by G to get a square matrix. The average of the
    squared size of its determinant, weighted by the Gaussian, equals π to the power d·n, times d factorial,
    times the determinant of G-conjugate-transpose times G. The proof first does one row: integrating
    z, conj z and the Gaussian gives π or 0. Then it expands the determinant as a signed sum over permutations,
    integrates row by row, and regroups the sum, which gives d factorial copies of the same determinant.

    '
  lean:
  - Development/AutomorphicSpectrum/Proofs/BlockDecomposition/GaussianDetSquareIntegral.lean:239
  mathlib:
  - Complex.integral_exp_neg_rpow
  - Matrix.det_apply'
  - MeasureTheory.integral_fintype_prod_volume_eq_prod
