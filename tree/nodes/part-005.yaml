- id: f-approximation-of-square-identity
  title: A "square identity" gives good approximations in a subspace
  kind: step
  status: explained
  chunk: c0332
  orphan: true
  plain: 'This file proves a conditional claim: it assumes a named "square identity" (stated elsewhere,
    not proved here) and deduces an approximation property. The setting is a space with lengths and angles,
    carrying a unitary action (one that preserves length) of a Lie algebra. Take a subspace F that is
    closed under a Casimir-type operator. For any vector η, the closest point P of F to η is the orthogonal
    projection. The file shows the gap vector η−P has a sum of squared "operator pieces" bounded by the
    size of (2·Casimir − c)η times its own length. The idea is that P is perpendicular to the gap, so
    the F-part drops out of the inner product.

    '
