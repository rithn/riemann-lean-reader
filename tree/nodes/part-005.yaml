- id: f-g-field
  title: The Gauss norm on polynomials and a field that realises it
  kind: step
  status: explained
  chunk: c0337
  orphan: true
  plain: 'Take a field with a "strange" size where a sum is never bigger than its biggest term (an ultrametric
    field, such as the p-adic numbers). For a polynomial in many variables, define its Gauss norm as the
    biggest size among its coefficients. The file proves this norm is multiplicative: the norm of a product
    is the product of norms. The idea is to look at the smallest monomial, in dictionary order, that attains
    the maximum in each factor; in the product that term cannot be cancelled. The norm then extends to
    fractions of polynomials. Finally it uses this to prove a generic-point existence claim, stated elsewhere,
    for the p-adic complex numbers.

    '
