  orphan: true
  plain: 'This file proves a result about two cocycles (twisted assignments of vectors to group elements)
    whose values are degree-w homogeneous polynomials in two variables over the integers mod l^n. The
    group is the level-N congruence group, and w is odd. Assume the two cocycles agree on a deeper subgroup
