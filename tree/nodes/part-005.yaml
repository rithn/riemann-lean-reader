- id: f-gaussian-det-levi-integral
  title: Gaussian integral of a squared determinant, Levi version
  kind: step
  status: explained
  chunk: c0334
  orphan: true
  plain: 'This file proves a formula that reduces to the previous Gaussian-determinant integral. The weight
    now has a twist: besides the usual Gaussian, there is an extra term from a fixed vector f. The answer
    is π to the power d·n, times d factorial, times the determinant of the Levi matrix built from f and
    F. The idea is a change of variables. A matrix built from f (identity plus a rank-one correction)
    is invertible, with determinant the square root of 1 plus the squared size of f. Multiplying every
    row by it untwists the weight. Then the square-integral formula applies, and a scaling factor for
    the volume appears.

    '
