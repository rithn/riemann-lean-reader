  kind: step
  status: explained
  chunk: c0401
  plain: 'Let k be a finite field with q elements, and a a nonzero vector of length n+1 over k. The claim
    is that q times the number of vectors x with a . x = 1 equals q^(n+1). That is, there are q^n such
    x. For example, over a field with 2 elements and n+1 = 3, the equation a . x = 1 has 4 solutions among
    the 8 vectors. The proof shows each value c of a . x is hit equally often, by sliding x along a fixed
    direction. The q values then split all q^(n+1) vectors evenly.

