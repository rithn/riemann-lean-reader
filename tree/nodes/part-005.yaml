  status: explained
  chunk: c0350
  plain: 'Assuming the claim that the standard brackets are independent (Lemma A), this file proves that
    the vectors of a column family are linearly independent over every field. The idea is a peeling argument.
    Suppose a combination vanishes. Among the weights involved, pick one that is maximal in dominance
    order. Projecting onto that weight kills all other terms, leaving a relation among the leading pieces.
    The independence of the column family at that weight, then Lemma A, forces those coefficients to be
