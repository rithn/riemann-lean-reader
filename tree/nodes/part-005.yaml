- id: f-dominates-lift-unique
  title: Maps between models commute with the structure maps
  kind: step
  status: explained
  chunk: c0333
  orphan: true
  plain: 'This file proves small bookkeeping facts about models of a moduli space, in the language of
    schemes (spaces glued from rings). First, the open inclusion of the original space into a model sits
    over the base ring in the expected way. Second, applying "Spec" (turn a ring map into a map of spaces)
    to two composable ring maps gives the composite in reverse order. Third, if one model is a "transition"
    from another along compatible ring maps, then the map between models respects the maps to the base,
    and the comparison map of the original spaces fits into a commuting square. The proofs are diagram
    chases using that a pullback square commutes.

    '
