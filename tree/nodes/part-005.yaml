- id: f-behrend-sets--statement-e
  title: More claims for Behrend sets (orders, spacing, selection, counting)
  kind: step
  status: explained
  chunk: c0340
  plain: 'This file states claims and definitions; it proves none of them. There are further claims about
    how fast odd numbers modulo a power of 2 return to one, and about "spacing": few points of a window
    of a cyclic orbit can lie in a thick set. Then come claims that a random subset can be chosen with
    few bad points, and that a finite group of prime-power size inside matrices over a number field is
