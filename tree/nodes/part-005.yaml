- id: f-card-hermitian-matrices-dvd-sq
  title: Counting self-conjugate matrices with entries divisible by p
  kind: step
  status: explained
  chunk: c0379
  plain: 'Work in a finite ring with a "conjugation", a map that gives back the original element when
    applied twice (like complex conjugation). Take square matrices whose entries are all multiples of
    a fixed element p that conjugation leaves alone, and which equal their own conjugate transpose (such
    matrices are called Hermitian). The file proves that the number of such matrices, squared, equals
    the number of multiples of p raised to the power m times m, where m is the matrix size. The idea:
    conjugate-transposing is a self-inverse twist of an additive group, and a general counting lemma from
    a neighbouring file says the fixed points of such a twist number the square root of the group size.
    A hypothesis that some element differs from its conjugate by a unit keeps the conjugation from being
    trivial.

    '
