- id: f-fundamental-domains--covering-radius-statement
  title: Covering-radius claim for self-dual lattices, stated
  kind: step
  status: explained
  chunk: c0431
  plain: 'This file states a claim without proving it, plus a small formula for the constant. Take a self-dual
    lattice over a CM number field, with a Hermitian form whose embeddings match a standard signed form
    after a change of basis. If every nonzero lattice vector has size at least some threshold, then two
    things follow. Any target point is within distance mu of a lattice point. The lattice also contains
    r independent vectors that are all short, with length at most mu. The bound mu depends on the number
    of embeddings, the dimension, the discriminant and the threshold.

