- id: f-exists-adic-limit-mem-automorphic-space
  title: Limits of converging sequences stay in the automorphic space
  kind: step
  status: explained
  chunk: c0330
  orphan: true
  plain: 'Setting: functions with values in a complete local ring A, where "close" means a difference
    lies in a high power of the maximal ideal (the elements counted as small). Take a sequence of functions
    whose consecutive differences lie in ever higher powers, so it settles down. The file proves there
    is a limit function, and if every term satisfies the defining conditions of the "automorphic space"
    (invariance under a group, transformation rules under a torus and a subgroup, and a congruence condition),
    then so does the limit. Method: coordinate by coordinate, build the limit from completeness, then
    show each condition holds because the two sides agree modulo every power, and equality mod all powers
    forces equality.

    '
  lean:
  - Development/AutomorphicArithmetic/AutomorphicVarieties/BuildingsResidueChars/ExistsAdicLimitMemAutomorphicSpace.lean:30
  mathlib:
  - IsPrecomplete.prec
  - IsHausdorff.haus
  - Ideal.pow_le_pow_right
