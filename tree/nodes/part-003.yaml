- id: f-twisted-trace-formula--inverse-chamber-map
  title: Sign vectors, chains and roots, the geometry toolkit
  kind: step
  status: explained
  chunk: c0199
  plain: 'This file sets up the geometry for a "twisted trace formula" argument. A sign vector has each
    coordinate −1, 0 or +1. One vector is "below" another if the second agrees with it wherever the first
    is nonzero. A "parabolic" set is a set of nonzero sign vectors that form a chain under this order.
    Each gives a subspace (its span) and an orthogonal projection onto it. The "root" of u in P is u minus
    its projection onto the span of the others. The file defines many such objects and proves basic facts,
    for example that roots are nonzero.

