- id: f-dual-lattices--valuation-det-eq-of-span-eq
  title: Dual of a dual lattice, and equal lattices have equal determinant size
  kind: step
  status: explained
  chunk: c0166
  plain: 'This file proves facts about lattices spanned by the columns of an invertible matrix B. A vector
    lies in the lattice exactly when B inverse times it is integral. The dual lattice is spanned by the
    columns of the inverse transpose. Dualising twice gives the lattice back. The last result says two
    matrices spanning the same lattice have determinants of the same size (valuation). If each is a matrix
    of integers times the other, then each size is at most the other, because an integral matrix has determinant
    of size at most 1. Everything is routine linear algebra with an integrality condition.

