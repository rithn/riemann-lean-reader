    Using the power basis, every element of A is a polynomial q in g. The minimal polynomial of g divides
    the characteristic one, so it is also without repeated factors. If q to the k is 0, the minimal polynomial
    divides q^k. A polynomial with no repeated factors that divides a power of q must divide q itself,
    so q evaluated at g is 0. Hence the element is 0.

