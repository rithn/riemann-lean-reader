- id: f-parseval-bound-integer-vector-small-fourier-support
  title: Parseval bound for an integer vector with few nonzero Fourier values
  kind: step
  status: explained
  chunk: c0156
  plain: 'Take a list c of N whole numbers whose squares add to 2n and whose plain sum has size at most
    n − 1, and suppose its Fourier values vanish outside a small set S of positions. Then 2nN ≤ (n − 1)²
    + 4n²·|S|. Idea: first Parseval''s identity, which says the squared sizes of the N Fourier values
    add up to N times the sum of squares of c. This is proved from the fact that powers of a root of unity
    cancel out. Then the value at position 0 is at most n − 1 and every other value has size at most 2n,
