- id: f-mod-f-iota-finite-place
  title: Haar modulus on a local field matches the p-adic absolute value
  kind: step
  status: explained
  chunk: c0234
  plain: 'This is a conditional result. It takes the index formula and the card step as hypotheses, not
    proved here. Take a number field F with a prime p, embedded densely in a local field K. Then the Haar
    modulus of the image of any z in F equals the p-adic absolute value of z. First treat a nonzero integer
    a. Combine the two hypotheses with the known fact that the absolute value times the ideal norm is
    1, and cancel. Then handle general fractions by writing z as a quotient of integers. The file also
    gives versions for a local setup bundle.

    '
