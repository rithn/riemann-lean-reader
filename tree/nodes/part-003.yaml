- id: f-adelic-lattice-proofs--kummer-galois
  title: Kummer extensions are Galois of degree p
  kind: step
  status: explained
  chunk: c0174
  plain: 'This file proves the standard structure of a Kummer extension. Take a field F of characteristic
    zero containing a primitive p-th root of unity zeta, and a number delta that is not a p-th power.
    Add a root theta of x to the p minus delta to get E. Then E has dimension p over F, it is a Galois
    extension, and the symmetry group is generated by one map sending theta to zeta times theta, which
    has order p. E is also the same as F with the polynomial x to the p minus delta adjoined. Any other
    field with a p-th root of delta receives a map from E. The proof uses irreducibility of the polynomial
    and compares roots.

    '
