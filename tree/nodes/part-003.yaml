- id: f-max-val-eq-zero-of-lt
  title: Binomial coefficients are not divisible by a prime above n
  kind: step
  status: explained
  chunk: c0184
  plain: 'Binomial coefficients are the numbers in Pascal''s triangle, such as "6 choose 2" = 15. This
    file proves that for a prime l larger than n, no binomial coefficient of the form "n choose i" has
    l as a factor. So the largest power of l dividing any of them is zero. The proof is by contradiction.
    If l divided "n choose i", it would divide n factorial, which is a product of numbers up to n, and
    a prime dividing such a product must divide one of its factors, so l would be at most n. For a non-prime
    l the answer is zero by definition.

    '
