- id: f-product-formula-haar--norm-mod
  title: The Haar modulus of a local field, and two stated counting claims
  kind: step
  status: explained
  chunk: c0234
  plain: 'This defines the "modulus" of a nonzero number a in a locally compact field. It says how much
    multiplying by a stretches volume, using the field''s Haar measure, which is its natural notion of
    length. It proves the modulus is positive, multiplicative, equal to 1 at 1, and compatible with division.
    It then states two claims as named Prop definitions, without proving them here. One is the index formula,
    that modulus of t times the size of the integers mod t equals 1. The other is the card step, that
    this size equals an ideal norm.

    '
