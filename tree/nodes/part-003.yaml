    that for every finite module X, the number of linear maps from X to M equals the number from X to
    N. Then M and N are isomorphic. Idea: sort maps by what they kill (their kernel). Maps killing a smaller
    quotient are counted by induction on size, so the counts of one-to-one maps agree. M has the identity
    map into itself, so there is a one-to-one map from N into M, and symmetrically. Between finite sets
