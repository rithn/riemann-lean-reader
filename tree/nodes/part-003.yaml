- id: f-div-count
  title: Few polynomials are divisible by a given one
  kind: step
  status: explained
  chunk: c0206
  plain: 'Over a field with g elements, fix a monic polynomial h (leading coefficient 1). This file shows
    that at most g^(r - deg h) monic polynomials of degree r are multiples of h. Example with g = 2, r
    = 3, h = x: the multiples are x times a monic degree-2 polynomial, so at most 4 of them. The idea
    is to divide: each multiple is h times a unique quotient. The quotient is monic of degree r minus
    deg h, so it is fixed by its lower coefficients, which are r - deg h numbers mod g. That gives a one-to-one
    map into a set of size g^(r - deg h).

