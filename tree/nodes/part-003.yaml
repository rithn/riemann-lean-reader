- id: f-regularisation--p-riemann-extension-slices
  title: Riemann extension in several variables via a torus integral
  kind: step
  status: explained
  chunk: c0154
  plain: 'This file proves a several-variable removable-singularity theorem. Suppose G is holomorphic
    on the unit ball with all coordinates nonzero, and along each coordinate slice (others fixed and nonzero),
    G has a limit as that coordinate tends to 0. Then G extends to a holomorphic function on the whole
    ball. The proof first shows a Cauchy formula for G on a torus, one circle at a time, using the one-variable
    Riemann extension (a bounded-limit point on a circle is removable). The right-hand side of that formula
    is analytic in z even across the coordinate axes. This gives an analytic function matching G off the
    axes, and it is unique by density.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/Regularisation/PRiemannExtensionSlices.lean:216
  mathlib:
  - circleIntegral_sub_inv_smul_of_differentiable_on_off_countable
  - torusIntegral_succ
  - AnalyticAt
  - dense_pi
  needs:
  - f-regularisation--st-riemann-slices
