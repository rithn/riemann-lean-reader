- id: f-weak-approx-f
  title: Statements of the basic approximation claims
  kind: step
  status: explained
  chunk: c0153
  plain: 'This file defines notation and then lists six claims, none proved here. Weak approximation says
    that given values at finitely many primes of a number field, one element of the field is simultaneously
    close to all of them. A version for E follows. Bounded denominators says any element of the local
    tensor ring becomes integral after multiplying by a nonzero integer. A unit claim says 1 plus (a multiple
    of a prime element) times an integral element is invertible. Eigenvalue avoidance says there is a
    norm-one scalar so that 1 plus it times g stays invertible. Finally the Cayley claim is stated, which
    is the target of the next file.

    '
  lean:
