- id: f-norm-index
  title: Proof of the index formula for a local field
  kind: step
  status: explained
  chunk: c0234
  plain: 'This proves the index formula. In a local field such as the p-adic numbers, take a nonzero integer
    t. Then the Haar modulus of t times the number of residue classes of the integers modulo t equals
    1. The idea is that the integers form an open, compact block with finite, nonzero volume. Multiplying
    by t shrinks that block to the sub-block t times the integers. That sub-block has volume equal to
    the modulus times the original. It also has volume equal to the original divided by the number of
    cosets it needs. Comparing the two gives the formula. The file also proves the integers carry a translation
    invariant measure.

    '
