- id: f-sym-k-eq-zero-of-om
  title: Positivity forces the operators to vanish
  kind: step
  status: explained
  chunk: c0172
  plain: 'This file proves a positivity argument about polynomials in many variables. It defines a pairing
    of two polynomials: multiply matching coefficients (one conjugated), weight each term by factorials
    of the exponents, and add up. It checks that this pairing is linear, conjugate-symmetric and strictly
    positive for nonzero input, like a dot product. An operator Om is defined as a sum of products of
    paired operators. If the pairing makes each operator the mirror of another, then Om applied to a polynomial
    a gives zero only when every individual operator kills a. The file also proves a linear-algebra fact:
    there is a polynomial in Om that equals 1 at zero and sends everything to the zero-eigen part.

