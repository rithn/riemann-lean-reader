  kind: step
  status: explained
  chunk: c0225
  plain: 'This file proves the same small fact as a sibling file, in a slightly different way. In the
    setup, "rt0" is a chosen complex square root of minus d, with d a positive prime. The claim is that
    complex conjugation (flip the sign of the imaginary part) turns rt0 into its negative. Equivalently,
    rt0 is purely imaginary, like 5i. The proof splits rt0 squared equal to minus d into real and imaginary
    parts. The imaginary part forces the real part times the imaginary part to be 0. If the imaginary
    part were 0, the real part squared would be negative, which is impossible. So the real part is 0,
    and the claim follows.

