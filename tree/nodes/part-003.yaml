- id: f-fock-gram--statement-herm
  title: 'Statements: dual lattices and Gram determinants for Hermitian forms'
  kind: step
  status: explained
  chunk: c0155
  plain: 'This file defines the dual of a lattice for a Hermitian form (all vectors whose pairing with
    every lattice vector lies in the base ring), then states two claims without proof. First: a lattice
    with a basis is contained in its dual exactly when the Gram matrix of basis pairings has integral
    entries. Its index in the dual (how many times it fits) equals the absolute norm of the Gram determinant,
    and the lattice equals its dual exactly when that determinant is a unit. Second: the determinant of
    the "trace" Gram matrix equals a power of a fixed discriminant times the norm of the Gram determinant.
    Both are assumed here.

    '
