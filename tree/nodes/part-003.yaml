    those that are integral with integral inverse, is finitely generated. The idea is to record, for each
    prime of the integral closure (a Dedekind domain, where ideals factor uniquely), the exponent of that
    prime in a nonzero element. This is a homomorphism to a product of copies of the integers. The kernel
    is exactly the integral units, since an element is integral when all its valuations are at most 1.
    There are only finitely many primes, since each divides the one prime of the base. A subgroup of a
    finite power of the integers is finitely generated.

    '
