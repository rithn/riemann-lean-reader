  kind: step
  status: explained
  chunk: c0221
  plain: 'This file holds two small tools. First: an integral over the whole real line equals the integral
    over the middle interval from -T to T, plus the integral over everything outside it. That holds whenever
    the function is integrable. Second: a purely algebraic fact for complex numbers. If a "rectangle identity"
    holds (four sides of a contour sum to 2 pi i times a residue R), and a sum S equals the vertical-side
    integral V0 plus an error E, all divided by 2 pi, then 2 pi times the distance from S to R is at most
    the sizes of E and of the other three sides added up. The proof uses the triangle inequality: the
    size of a sum is at most the sum of the sizes.

