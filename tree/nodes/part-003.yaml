- id: f-card-quotient-eq-abs-norm
  title: Proof that residue-class counts equal an ideal norm
  kind: step
  status: explained
  chunk: c0234
  plain: 'This proves the card step. Take a number field F with a prime p, and a local field K that completes
    F at p. For a nonzero integer a of F, the number of classes of the integers of K modulo a is the norm
    of the p-part of a. The proof maps the integers of F into the integers of K modulo a. The map is onto
    because F is dense in K, and any element can be approximated closely enough. Its kernel is exactly
    the p-part of the ideal generated by a. The first isomorphism theorem then matches the counts.

    '
