- id: f-nontrivial-transvection
  title: Transvection rules, and examples of what is and is not one
  kind: step
  status: explained
  chunk: c0228
  plain: 'A transvection is a matrix that adds a multiple of a chosen vector x to every vector. This file
    proves basic rules. Acting on v, it gives v plus (t times the form of v with x) times x. The form
    is linear in one slot and conjugate-linear in the other. A transvection keeps the form unchanged when
    a simple condition on t holds. Its determinant is 1 + t·(form of x with x). Every product of transvections
    has determinant 1. Concrete complex examples follow. The matrix [[1,i],[0,1]] is a product of transvections.
    The matrix i·identity is unitary but is not one, since its determinant is −1. The matrix [[1,1],[0,1]]
    is not unitary.

