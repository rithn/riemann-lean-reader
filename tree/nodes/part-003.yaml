    with a finite kernel (only finitely many elements go to 1). Then applying f a total of k+1 times also
    has finite kernel, and (number of cosets missed by the range of f^(k+1)) times (kernel size of f)^(k+1)
    equals (cosets missed by the range of f)^(k+1) times (kernel size of f^(k+1)). Example: doubling on
