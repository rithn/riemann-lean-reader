- id: f-ncard-places-over-eq-of-prime-degree
  title: Prime degree gives all or one primes above
  kind: step
  status: explained
  chunk: c0174
  plain: 'This file proves a counting fact for a Galois extension E of F whose degree is a prime number
    p. If a prime v of F has two different primes of E above it, then it has exactly p primes above it.
    The idea is the classical formula that the number of primes above v, times the ramification index,
    times the inertia degree, equals the degree p. Since p is prime, the number of primes above divides
    p, so it is 1 or p. Two distinct primes rule out 1, leaving p. For example, a prime that splits completely
    in a degree-3 extension has 3 primes above it.

