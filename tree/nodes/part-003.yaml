- id: f-exists-quasi-reflection-prod-mul-vec-eq
  title: Moving one vector to another with at most two reflections
  kind: step
  status: explained
  chunk: c0233
  plain: 'Take a Hermitian form and two vectors x and z with the same nonzero self-pairing. The file shows
    that a product of at most two quasi-reflections sends z to x. A quasi-reflection is a matrix that
    flips along one direction and leaves the form unchanged. The reflecting vectors can be chosen inside
    the plane spanned by x and z. The proof has two cases. If z minus x has nonzero self-pairing, one
    reflection in that vector does it. Otherwise z plus x must have nonzero self-pairing, because otherwise
    4 times the pairing of x would be zero. Then use a reflection in x followed by one in that vector.

    '
