- id: f-pow-prime-range-eq-iterated-difference
  title: p-th powers equal the range of the (p−1)-fold difference map
  kind: step
  status: explained
  chunk: c0201
  plain: 'This file proves a neat identity. Let τ be a self-map of an abelian group whose "norm" (a times
    its images under τ, p of them in all, p prime) is always 1. Let lam be the difference map a ↦ τ(a)/a.
    Then the set of p-th powers is exactly the range of lam applied p−1 times, and a^p = 1 exactly when
    that iterate sends a to 1. Idea: write the group additively, so the hypothesis says 1+T+...+T^(p−1)
    = 0. Substituting T = Y+1 turns this into Y^(p−1) + p·(unit-like factor) = 0, an Eisenstein-style
    shape, so p and Y^(p−1) divide each other.

