- id: f-pos-def-exists-conj-transpose-mul-mul-eq-one
  title: A positive definite matrix is a change of basis away from the identity
  kind: step
  status: explained
  chunk: c0169
  plain: 'This proves that every positive definite matrix H (Hermitian with all eigenvalues positive)
    can be turned into the identity by a change of basis y0: conj-transpose of y0, times H, times y0,
    equals 1. In other words, H has a square root inverse. The proof uses the spectral theorem: H is U
    times a diagonal matrix of positive eigenvalues times U-conjugate-transpose, with U unitary. Take
    y0 to be U times the diagonal matrix of inverse square roots of the eigenvalues. Then the diagonal
    factors multiply to 1 and the unitary factors cancel. The matrix y0 is invertible because it has an
    explicit inverse.

    '
