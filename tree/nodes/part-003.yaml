- id: f-dual-lattices--valuation-fourier-le-one
  title: Fourier transform of a dual element has size at most 1
  kind: step
  status: explained
  chunk: c0166
  plain: 'This proves that for a Hopf order on a finite group, any element u of the dual lattice has a
    Fourier transform u-hat(chi) = sum of u(a)chi(a) of size at most 1, for any character chi. The proof
    has three ideas. First, convolution (a sum of u(a)w(c-a)) keeps you in the dual lattice, because the
    Hopf order is closed under its coproduct. So every convolution power of u is in the dual lattice and
    has bounded entries. Second, the Fourier transform turns convolution into ordinary multiplication,
    so u-hat(chi)^k is bounded for every k. Third, a number whose powers all stay bounded has size at
    most 1 in an ultrametric setting.

    '
