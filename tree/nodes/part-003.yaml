    with coefficients in B into a single number in B, like a matrix determinant. This file proves a descent
    statement. Suppose a rule is given over a bigger ring A'', the smaller ring A sits inside A'' without
    collapsing, and the rule''s key coefficients all land in A. Then there is exactly one rule over A
    that turns into the given one. Idea of proof: any element is a combination of finitely many group
    elements. So the rule is determined by one polynomial, whose coefficients lie in A. Use them to define
