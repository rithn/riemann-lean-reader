    on a small neighbourhood count as equal. This file proves that germs of analytic functions (functions
    equal to a convergent power series) near a point form an integral domain: if f·g is zero near the
    point, then f or g is zero near it. Idea of proof: if f is not zero everywhere on a small ball, it
    is nonzero near some point z. There g must vanish, and the identity theorem then forces g to vanish
