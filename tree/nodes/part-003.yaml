  - counting
- id: f-complex-analytic-sets--osgood-separate
  title: 'Osgood''s theorem: separately holomorphic and continuous means holomorphic'
  kind: step
  status: explained
  chunk: c0154
  plain: 'This file proves a theorem of Osgood. A function of several complex variables that is continuous
    on an open set, and complex-differentiable in each variable separately with the others held fixed,
    is in fact analytic (a convergent power series locally). The proof uses a multi-variable Cauchy formula.
    Integrating around a small torus (a product of circles, one per variable) of the function divided
    by the product of (zeta_i minus z_i) gives (2 pi i)^n times the value at z. This is proved by induction
    on the number of variables, one circle at a time. The formula then makes the function a power series
    in z.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/OsgoodSeparate.lean:89
  mathlib:
  - circleIntegral_sub_inv_smul_of_differentiable_on_off_countable
  - torusIntegral_succ
  - AnalyticOnNhd
