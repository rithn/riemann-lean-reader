- id: f-unitary-matrix-eq-prod-quasi-reflections
  title: Every form-preserving matrix is a product of quasi-reflections
  kind: step
  status: explained
  chunk: c0233
  orphan: true
  plain: 'Take a Hermitian form over a number field. Every invertible matrix that preserves the form is
    a product of quasi-reflections, which flip a single direction. This is proved from two earlier results,
    the orthogonal basis and the two-reflection result. Fix an orthogonal basis. One basis vector at a
    time, multiply by reflections that move its image back to itself. Later reflections stay orthogonal
    to the vectors already fixed, so earlier fixes are not undone. After n steps, a product of reflections
    times the matrix fixes the whole basis, so it is the identity. Invert the product to finish.

    '
