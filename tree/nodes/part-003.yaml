    determinant. Then E^n has a basis of vectors that are pairwise orthogonal for the form, and each has
    nonzero pairing with itself. This restates the diagonalisation result of the Hermitian trace forms
    file in the vocabulary of the adelic forms file. The proof just feeds in the hypotheses. It uses the
    orthogonal basis, converts to the diagonal matrix, and notes that nonzero determinant forces every
    diagonal entry to be nonzero.

