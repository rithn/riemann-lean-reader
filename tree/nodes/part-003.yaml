  - f-analytic-charts--osgood
  - f-analytic-charts--osgood-a
  - complex-analysis
  - concept-point-set-topology
- id: f-p-non-isolated-fibre-curve
  title: A non-isolated point of a fibre lies on a holomorphic curve
  kind: step
  status: explained
  chunk: c0154
  plain: 'This file proves the "non-isolated fibre curve" statement, but only from two other statements
    that are assumed. Take a holomorphic map f and a point p where the set of points with the same value
    as p is not isolated, meaning other such points pile up at p. The claim is that a small holomorphic
    curve (a disc, injectively mapped) passes through p and stays inside that set. The idea: near p the
    set splits into finitely many irreducible pieces. One piece must also have p as a limit point, so
    the curve statement for irreducible pieces applies to it. Shrinking the disc keeps it inside the original
    set.

    '
