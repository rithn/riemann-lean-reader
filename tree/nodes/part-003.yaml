- id: f-iterated-deriv-zero-of-bound
  title: Small near zero forces the first derivatives to vanish
  kind: step
  status: explained
  chunk: c0231
  plain: 'Two facts from complex analysis. First: if a function has a complex derivative everywhere in
    a disc around 0 and its size is at most C times |z|^r, then its first r derivatives at 0 are all zero.
    In plain terms, a function that shrinks as fast as z^r cannot have a lower-order wiggle at 0. The
    proof uses Cauchy''s estimate, which bounds a derivative by the function''s size on a circle. Shrinking
    the circle to radius zero squeezes the derivative to zero. Second: if z^r times q(z) has size at most
    M on the unit circle, then q has size at most M on the whole disc (the maximum principle).

    '
