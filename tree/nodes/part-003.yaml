    one E. Each prime v of F (a "place") splits into finitely many primes of E lying over it. The file
    proves three things. A finite set of primes of F has only a finite set of primes of E above it. Every
    prime of F has at least one prime of E above it. And each prime of E measures elements of F the same
    way as the prime below it, raised to a positive whole-number power e, the ramification index. For
    example, 5 is a prime of the integers, and in the Gaussian integers it has two primes above it.

