    P is not "moved" by c (c maps numbers divisible by P to numbers divisible by P). Then the P-adic size
    of u is exactly 1, which means u has no P in its numerator or denominator. Idea: c preserves P-divisibility,
    so it preserves P-adic size. Then the size of u squared equals the size of u times that of c(u), which
