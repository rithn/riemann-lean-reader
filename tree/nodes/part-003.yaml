- id: f-fock-gram--statement-lat
  title: 'Statements: how Gram matrices change and combine'
  kind: step
  status: explained
  chunk: c0155
  plain: 'This file defines the Gram matrix of a list of vectors (the table of all pairings between them)
    and then states claims without proof. Changing basis multiplies the Gram matrix by the change-of-basis
    matrix and its conjugate transpose, so the determinant scales by the squared size of the change. A
    sublattice of index n has Gram determinant n^2 times that of the whole lattice. The Gram matrix of
    an orthogonal sum is block diagonal, with determinant the product. For a tensor product the determinant
    is a product of powers. Finally the covolume of a real lattice is the square root of the Gram determinant.

    '
