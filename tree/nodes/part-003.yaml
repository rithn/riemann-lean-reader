- id: f-general-b-fact-right-ter--imports
  title: A common nonzero multiple for finitely many conditions
  kind: step
  status: explained
  chunk: c0153
  plain: 'This file proves a small but handy fact. Suppose each of finitely many conditions Q_i holds
    for some nonzero algebraic integer c, and each condition stays true when c is multiplied by anything.
    Then there is one nonzero integer c that works for all conditions at once. The proof takes the product
    of the individual c_i. For each i, this product is c_i times the rest, so the condition holds by the
    stays-true property. Example: if one needs to clear denominators of several fractions, multiply all
    the denominators together.

    '
  lean:
  - Lemmata/GeneralBFactRightTer/Imports.lean:7
  mathlib:
  - Finset.prod_ne_zero_iff
  - Finset.mul_prod_erase
  needs:
