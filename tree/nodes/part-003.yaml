    has a characteristic polynomial with no repeated roots, then that polynomial divides the minimal polynomial
    (the smallest polynomial that kills f). The proof passes to an algebraically closed field, where every
    root of the characteristic polynomial is an eigenvalue, hence a root of the minimal polynomial. Second,
    for the algebra A, multiplication by g then has minimal polynomial of full degree. So 1, g, g squared,
    and so on up to degree dim minus 1 are linearly independent and form a basis. Such a basis of powers
    is called a power basis.

