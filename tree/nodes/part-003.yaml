- id: f-card-large-prime-factors-le-one-holds
  title: Proofs of five classical prime and sum estimates
  kind: step
  status: explained
  chunk: c0184
  plain: 'This file proves several standard facts. (1) The sum of log p over primes up to n is at most
    log 4 times n, using a ready-made Mathlib result. (2) A Mertens-type bound: the sum of log p over
    p−1 is at most 6 log n, by comparing against log p over p. (3) A number below L squared has at most
    one prime factor above L, since two such primes would multiply past L squared. (4) The harmonic sum
    1 + 1/2 + … + 1/n is at most 1 + log n. (5) The least positive residue behaves as expected: between
    1 and l and equal to a when a is small.

    '
