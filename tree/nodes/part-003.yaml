- id: f-skew-approx
  title: Approximating skew matrices by a global one
  kind: step
  status: explained
  chunk: c0153
  plain: 'This file proves that local skew matrices can be approximated by one global skew matrix, assuming
    the entry-wise approximation claim for E. Given a skew matrix Y_v at each prime v in a finite list,
    first approximate every entry by elements of E. Build Y'' as the average of Z and its conjugate-transpose
    (with a minus sign), which makes it skew exactly. A short calculation using the skew property at each
    prime then shows Y'' differs from Y_v by a multiple of the chosen precision, using that 2 is invertible.
    The file also shows that 2 equals the image of 2 in the tensor ring.

    '
  lean:
