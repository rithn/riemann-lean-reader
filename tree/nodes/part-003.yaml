- id: f-card-nonregular-residues-mod-pow-sub-one-le
  title: Few residues are fixed by a smaller power-of-q shift
  kind: step
  status: explained
  chunk: c0156
  plain: 'Fix whole numbers q at least 2 and n at least 1, and let N = q^n − 1. Call a number j between
    1 and N − 1 "irregular" if multiplying j by q^e leaves it unchanged mod N for some e strictly between
    0 and n. This file proves the irregular numbers are few: at most the sum, over the prime factors p
    of n, of (q^(n/p) − 2). Idea: if j is irregular, a gcd argument shows N divides j·(q^(n/p) − 1) for
    some prime p dividing n. So j is a multiple of N/(q^(n/p) − 1), and counting those multiples for each
    p gives the bound.

    '
  lean:
