    X with (twisted conjugate transpose of X)·J + J·X = 0, and checks it is closed under sums and negatives.
    It sets up a trace pairing on it, the Cayley transform (turning X into the group element g with g(2
    − X) = 2 + X), and a notion "LocTam" for a measure on the group. A measure is LocTam if it is Haar
    and, near the identity, the group measure of the Cayley image of a small set is within a factor 1
    + ε of a self-dual measure on the Lie algebra.

