  kind: step
  status: explained
  chunk: c0121
  plain: 'Take a ring R, a whole number n that is invertible in R, and a unit u (an element with an inverse).
    Adjoin a new number r with r to the power n equal to u. The theorem says the result is etale over
    R, which roughly means there is no branching: the n roots stay distinct, like the three different
    cube roots of 2 over the rationals. The idea is that the derivative of x^n - u is n times x^(n-1).
    Both n and r are invertible, so the derivative is invertible, and a monic polynomial with invertible
    derivative gives an etale extension. The degenerate case n = 0 is handled separately, where the ring
    collapses to zero.

