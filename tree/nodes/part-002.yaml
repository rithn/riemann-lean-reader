- id: f-key-newton
  title: Doubling the accuracy of an approximation, Newton-style
  kind: step
  status: explained
  chunk: c0145
  plain: 'This file proves the "Newton" step. Suppose w is an l-saturated vector, zero on T, with length
    squared equal to the target times (1 + l^k·p/q). Then a better vector exists, of the same kind, with
    error l^(2k) in place of l^k. The new vector is (1 − ε·τ)·w with ε = l^k·p/q. Here τ is a number built
    from θ with τ + conj τ = 1 and τ·conj τ a fraction r/s, with s prime to l. Expanding the length of
    the new vector, the first-order error cancels and only the square of the error remains. This is the
