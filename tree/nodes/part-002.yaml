    with a prime ideal q of polynomials that is not zero but meets the coefficients only in zero. Pick
    a nonzero f in q. Change variables so f becomes monic in the last variable. Then every element of
    the quotient ring can be reduced, by repeated division by f, to a polynomial in that variable of smaller
    degree. Division here only works after multiplying by a power of one fixed nonzero coefficient a.
    So the quotient is "finite" over a smaller polynomial ring once a is allowed to be inverted. The proof
