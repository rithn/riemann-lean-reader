- id: f-adelic-lattice-proofs--mem-span-rat-polys-vanishing-of-aut-stable
  title: A vanishing complex polynomial is a combination of rational ones
  kind: step
  status: explained
  orphan: true
  chunk: c0077
  plain: 'Let Γ be a set of complex matrices that is stable under every field automorphism of the complex
    numbers. If a polynomial f with complex coefficients vanishes on all of Γ, then f is a complex-linear
    combination of polynomials with rational coefficients that also vanish on Γ. The proof applies Galois
    descent: the set of vanishing polynomials is a complex vector space that is carried to itself by every
    automorphism, so it is spanned by its rational members. Two small helpers record how an automorphism
    acts on evaluation, and that rational polynomials evaluate the same in the complex numbers. This overlaps
    the neighbouring file, which proves a similar statement.

    '
