- id: f-coords-left-mul-matrix-const-base-change
  title: Coordinates and multiplication matrices are unchanged by base change
  kind: step
  status: explained
  chunk: c0078
  plain: 'Let F be a number field with a basis ω over the rationals, and let A be a bigger ring with a
    basis b (over some ring R) made of the images of the ω''s. Then for any x in F, two things hold. The
    coordinates of x inside A are just the rational coordinates of x, mapped into R. And the matrix of
    "multiply by x" in the new basis is the same rational matrix, mapped into R. Example: for F = the
    rationals with i adjoined and x = 2+3i, the coordinates are (2, 3) and the multiplication matrix has
    rows (2, -3) and (3, 2), whatever ring we work in. The proof expands x in the basis and uses that
    rational numbers map uniquely into any ring.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/AdelicLatticeProofs/CoordsLeftMulMatrixConstBaseChange.lean:24
