    of weight vectors with weights near a target splits as a finite sum of weight vectors, each of one
    weight close to the target, and vectors of different weights are orthogonal. Orthogonality: if x has
    weight omega and y has weight omega-prime and they differ in some coordinate a, applying the diagonal
    operator on both sides gives (omega_a - omega-prime_a) times the inner product equals 0, so the inner
    product is 0. The splitting is by induction on how the span is built (generators, zero, sums, scalings).

