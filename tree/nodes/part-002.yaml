    for the ideal I, I is finitely generated, and R/I is Noetherian, then R is Noetherian. The idea is
    to take an ideal J and use the Rees algebra, whose graded quotient is Noetherian, to find finitely
    many "leading generators" of J layer by layer. Each element g of J is then peeled off, one power of
