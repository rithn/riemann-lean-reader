- id: f-torsion-bounds-chains--transport
  title: Size bounds are preserved by isomorphism and weakening
  kind: step
  status: explained
  chunk: c0084
  plain: 'Four small bookkeeping facts about size bounds. If two abelian groups are isomorphic and one
    has a torsion part (elements of finite order) of size at most B, so does the other. If two sets are
