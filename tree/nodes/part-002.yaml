- id: f-exists-class-degree-one
  title: A polynomial pairing to exactly one with the low power sum
  kind: step
  status: explained
  chunk: c0079
  plain: 'For a cut-off j between 1 and N-1, there is a homogeneous polynomial Q of degree one less than
    the top degree, such that the "degree" functional applied to (low power sum times Q) equals exactly
    1. The degree functional picks out a signed sum of coefficients at special exponent patterns. The
    proof takes the staircase monomial, whose degree is plus or minus one, and removes one variable from
    it to get Q. Every other term of the low power sum then gives a monomial with a repeated exponent,
    and the functional is zero on those. Two helper facts record the staircase value and that vanishing.

