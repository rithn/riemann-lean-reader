- id: f-geometry-proofs--exists-unique-tangent-dual-number
  title: Each tangent vector lifts uniquely into the torsion points over the dual numbers mod N
  kind: step
  status: explained
  chunk: c0096
  plain: 'This proves a statement, assuming a hypothesis called "torsion along": that a given finite group
    of points maps in as exactly the N-torsion points (points that return to the identity after N steps).
    The claim is that every tangent vector e then has exactly one lift to the dual numbers mod N inside
    that finite group. The idea is that N times e is zero mod N, so the point obtained from e has trivial
    N-th power. Being N-torsion, it therefore comes from the finite group. Uniqueness follows because
    the embedding of the finite group is injective.

