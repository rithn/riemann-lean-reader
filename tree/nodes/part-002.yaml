    a perfect one-to-one rearrangement (a "perfect" ring). Take such a ring V and an element x. Complete
    V along powers of x: roughly, allow infinite sums that agree with ordinary elements of V up to higher
    and higher powers of x. The claim is that the completed ring is again perfect, meaning every element
    has exactly one l-th root. Uniqueness comes from the fact that in this setting the l-th power of a
    difference is the difference of l-th powers. Existence comes from taking l-th roots of better and
    better approximations in V and showing they converge.

