    matrix representation. Suppose chi adds up to zero over a subgroup H. The file proves that chi also
    adds up to zero over every coset gH (the translate of H by g). The idea is to add up the matrices
    of H into one matrix S. Then S times S is the size of H times S, so S divided by that size is a projection.
