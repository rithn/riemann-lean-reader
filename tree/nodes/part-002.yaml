    finite. It has at most |S| to the power |S|^(j+1) elements. The proof combines two facts. Every element
    of this group is killed by multiplying by |S|. And the group is a quotient of a subgroup of a free
    abelian group whose size is governed by the number of (j+1)-tuples in S, namely |S|^(j+1). A general
    counting lemma then gives the bound.

