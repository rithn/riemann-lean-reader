    j of the residue number divided by (d_i minus d''_j) times (d_k minus d''_j) equals 1. The proof takes
    the single-root identity at i and at k and subtracts them. The difference of the two simple fractions
    factors as (d_i minus d_k) times the new sum, so d_i minus d_k times (1 minus the sum) is zero. Because
