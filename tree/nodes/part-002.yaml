- id: f-divisor-proofs--origin-ideal
  title: Definitions - a cyclic-group torsor, and the origin ideal
  kind: step
  status: explained
  chunk: c0076
  plain: 'Two definitions, no proofs. A "Z/q torsor" over a ring B is an extension D of B carrying an
    action of the cyclic group of integers mod q, such that D is finite, projective and faithfully flat
    over B (a well-behaved, never-collapsing extension), and a certain map from D tensor D to q copies
    of D is a bijection. Intuitively this is a cover with q sheets, like the q-th roots of a number. The
    second definition, the "origin ideal", lives in polynomials over a local ring T. It is generated by
    the small elements of T together with the variable X, and so names the single point "X = 0, all small
    things zero".

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/OriginIdeal.lean:11
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/OriginIdeal.lean:18
  mathlib:
