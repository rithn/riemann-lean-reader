- id: f-gal-roots
  title: Trivial on roots of unity, and the Galois image is closed
  kind: step
  status: explained
  chunk: c0102
  plain: 'Two proved facts about the Galois action on l-power roots of unity. First, a symmetry''s l-adic
    unit is congruent to 1 modulo l^n exactly when the symmetry fixes every l^n-th root of unity. So "acts
    as the identity on those roots" is the same as "unit is close to 1". Second, the set of all such units,
    the Galois image, is a closed set in the l-adic units. The reason is that the symmetry group is compact
    and the map sending a symmetry to its unit is continuous, so its image is compact, hence closed.

