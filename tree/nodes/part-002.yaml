  chunk: c0115
  plain: 'This file proves two facts about determinants. First, a Cauchy-Binet style formula. The determinant
    of a product of a k by n matrix and an n by k matrix equals a sum over all ways f of choosing k columns,
    possibly repeated, of a product of entries times a k by k determinant of those columns. Second, if
    you pick k columns of a matrix, either two coincide and the determinant is 0, or the choice is a reordering
