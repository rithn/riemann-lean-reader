- id: f-divisor-proofs--torsors-trivial
  title: Claims - every cyclic torsor is trivial (stated, not proved)
  kind: step
  status: explained
  chunk: c0076
  plain: 'This file states claims as named propositions and proves none of them. A cover with q sheets
    over B is "trivial" if it has a section, meaning a ring map back from D to B. "TorsorsTrivial B q"
    says every such cover is trivial. The file also defines "absolutely integrally closed" (every monic
    polynomial has a root) and the generic fibre, then several claims named KeyAll, KeyLocal, KeyGeneric,
    KeyClosedPts and KeyOrigin. They assert that torsors become trivial in various settings, such as over
    a strict henselisation, at the generic point, at closed points or at the origin. They are hypotheses
    for later arguments, not results.

    '
