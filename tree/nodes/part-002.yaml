- id: f-etale-away-of-is-etale-at-off-submonoid
  title: Etale away from a set implies etale after inverting one element
  kind: step
  status: explained
  orphan: true
  chunk: c0076
  plain: 'Suppose C is a finitely presented algebra over R, and M is a set of elements of R closed under
    multiplication. Suppose C is etale (branch-free) at every prime of C that avoids M. Then one element
    m of M exists such that, after inverting m, the whole algebra is etale. The idea is geometric. The
    bad locus, where branching happens, is a closed set cut out by some ideal I. If I missed M entirely,
    we could find a prime containing I but avoiding M, and at that prime the algebra would be etale, a
    contradiction. So I contains the image of some m, which means the bad locus disappears once m is inverted.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/EtaleAwayOfIsEtaleAtOffSubmonoid.lean:14
  mathlib:
  - Algebra.isOpen_etaleLocus
  - Ideal.exists_le_prime_disjoint
  - Algebra.basicOpen_subset_etaleLocus_iff_etale
  needs:
  - concept-etale-ring-maps
  - concept-prime-ideals-localization
  - concept-schemes-basics
- id: f-divisor-proofs--etale-localization-at-prime-is-domain-is-integrally-clos
  title: Etale over a normal domain gives normal domain local rings
  kind: step
  status: explained
  orphan: true
  chunk: c0076
  plain: 'If R is a domain that is integrally closed (a "normal" domain, meaning a fraction that solves
    a monic polynomial over R already lies in R), and A is etale over R (an extension with no branching),
    then A localized at any prime is again a normal domain. Localizing at a prime means allowing division
    by everything outside that prime. The proof here is a single line: it just applies a longer result
    proved in the homogeneous-ideals file, which does the real work with smoothness and reduced fibres.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/EtaleLocalizationAtPrimeIsDomainIsIntegrallyClos.lean:7
  mathlib: []
  needs:
  - f-homogeneous-ideals--is-domain-and-is-integrally-closed-at-prime-of-smooth-of-co
  - concept-etale-ring-maps
  - concept-integral-closure-fraction-fields
