- id: f-limits-of-shift-functionals
  title: Two coefficient sequences converge if their combination does
  kind: step
  status: explained
  orphan: true
  chunk: c0079
  plain: 'Take two sequences of real numbers a(B) and b(B). Suppose that for every homogeneous polynomial
    F of the right degree (top degree plus one), the combination "a(B) times one functional of F plus
    b(B) times another" has a limit as B grows. Then a(B) and b(B) each converge on their own. The proof
    tests with two chosen polynomials. One, the square power sum times Q, isolates a, giving a limit of
    twice a. The other, built from the first power sum, gives an equation in N times b plus a known multiple
    of a. Solve for b and use the limits of sums and quotients.

    '
  lean:
