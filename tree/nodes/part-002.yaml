- id: f-divisor-proofs--zmod-torsor-exists-point-finite-separable
  title: A cyclic torsor has a point over a finite separable field extension
  kind: step
  status: explained
  orphan: true
  chunk: c0076
  plain: 'Take a q-sheeted cyclic cover D of a ring B, and a map from B to a field K. Then there is a
    finite separable extension L of K (an extension where every element has a root polynomial with no
    repeated roots) and a map from D to L compatible with the given map. The proof has two steps. First,
    the covering condition makes D tensor D look like q copies of D, which shows D is formally unramified
    (no infinitesimal branching). Second, because D is faithfully flat, K tensor D is not zero, so it
    has a maximal ideal. Quotienting gives a field that is finite over K, and unramified implies separable.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/ZmodTorsorExistsPointFiniteSeparable.lean:17
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/ZmodTorsorExistsPointFiniteSeparable.lean:43
