- id: f-gl-free-algebra-to-special-linear-emb-injective-hom
  title: Embedding invertible matrices into determinant-one matrices
  kind: step
  status: explained
  chunk: c0078
  plain: 'Replace each entry of an n-by-n matrix by the matrix of "multiply by that entry" in a chosen
    basis, giving a bigger block matrix, then add a one-by-one corner holding the inverse of the determinant.
    This file proves that map from invertible matrices has five properties: it sends the identity to the
    identity, sends products to products, always lands on determinant one, sends the adjugate to the inverse''s
    image, and is injective (different inputs give different outputs). So it is a faithful copy of the
    general linear group inside the special linear group. The proofs compute with block matrices.

    '
