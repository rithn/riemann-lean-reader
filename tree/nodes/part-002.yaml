    shows that any homogeneous polynomial (all terms of the same total degree d) with d bigger than N(N−1)/2
    is a combination of the power sums p_1,…,p_N with polynomial multipliers. The idea is that every polynomial
    equals, modulo the elementary symmetric polynomials, a combination of monomials whose exponents are
    small. Those monomials have degree at most N(N−1)/2. The power-sum and elementary ideals coincide.
