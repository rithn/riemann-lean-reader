- id: f-divisor-proofs--closure-finite-etale
  title: Definitions - the integral closure being finite etale, and "Good"
  kind: step
  status: explained
  chunk: c0076
  plain: 'This file only gives definitions; nothing is proved. Given a ring R and a bigger ring D, the
    "closure" is the set of elements of D that satisfy a monic polynomial (leading coefficient 1) with
    coefficients from R. The statement "closure is finite etale" says this set is a finite module over
    R, is an extension without branching, and is not the zero ring. A pair is called "Good" if two things
    hold. First, at every prime of R whose preimage has height at most one (a prime sitting at most one
    step above the bottom), the closure becomes etale after localizing. Second, the closure maps into
    a fraction field in a way compatible with a given map. The file ends with a tiny check that elements
    of R do lie in the closure.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/ClosureFiniteEtale.lean:27
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/ClosureFiniteEtale.lean:32
  mathlib:
