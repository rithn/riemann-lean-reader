- id: f-divisor-proofs--point-at-zero
  title: Definitions - "Fits", "Retracts" and "PointAtZero"
  kind: step
  status: explained
  chunk: c0076
  plain: 'Only definitions appear here; nothing is proved. "Fits" is a long list of compatibility requirements:
    a ring map is injective and local, q is invertible, the prime sits over the origin ideal, several
    square diagrams commute, and a cyclic-group torsor is present. Think of it as bookkeeping that says
    all the rings and maps involved line up. "Retracts" says there is a map back from a localization to
    A that sends the variable X to zero and agrees with the inclusion to first order. "PointAtZero" asks
    for a ring map from the closure into the fraction field of A that is compatible with a given map,
    a point of the closure over zero.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/PointAtZero.lean:12
