- id: f-exists-rational-coord-polynomial-base-change
  title: Coordinates of a polynomial value are rational polynomials in the coordinates
  kind: step
  status: explained
  chunk: c0078
  plain: 'Let F be a number field with a rational basis. Given any polynomial P over F, there are polynomials
    with rational coefficients, one for each basis element, such that the coordinates of P''s value are
    given by them. Concretely, the k-th coordinate of P(x) is a rational polynomial in the coordinates
    of the inputs. Example: for F with basis 1 and i, P = X squared gives (a+bi) squared = (a squared
    minus b squared) + 2ab i. The proof is by induction on the polynomial: constants, sums, and multiplying
    by a variable, where the rational "structure constants" of multiplication are used.

    '
