    the algebra A to the field k, and its kernel is nilpotent (some power of it is zero). Suppose x_1,
    ..., x_d are elements and D_1, ..., D_d are derivations that are "dual up to ε", meaning that ε of
    D_i applied to x_j is 1 if i = j and 0 otherwise. Then you can combine the D_i into new derivations
