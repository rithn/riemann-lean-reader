- id: f-princ-top
  title: Principal subgroups are open and neighbourhoods of 1 contain one
  kind: step
  status: explained
  chunk: c0102
  plain: 'The l-adic units carry a notion of closeness: numbers are close when their difference is divisible
    by a high power of l. This file proves four facts about it. Each principal subgroup (units congruent
    to 1 mod l^a) is an open set. Every neighbourhood of 1 contains such a subgroup. A subgroup is open
    exactly when it contains a principal subgroup, and exactly when it is closed with finite index. Finally,
    a closed subgroup contains x as soon as it matches x modulo every l^b. The key tool is that balls
    in this strange distance are both open and closed.

