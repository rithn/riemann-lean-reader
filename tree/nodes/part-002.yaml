- id: f-mem-rat-zariski-closure-points-iff-of-is-reduced
  title: Points of the rational closure are solutions, in a reduced ring
  kind: step
  status: explained
  chunk: c0078
  plain: 'Take rational polynomials S'' and the set of complex matrices they cut out. A matrix y over
    a ring R lies in the "rational closure points" exactly when y satisfies all the equations in S''.
    One direction always works. The other needs R to be reduced, meaning no nonzero element has a power
    equal to zero. The proof uses Hilbert''s Nullstellensatz: any polynomial vanishing on all complex
    solutions has some power in the ideal generated by S''. Evaluating at y gives zero for that power,
    and reducedness removes the power.

    '
