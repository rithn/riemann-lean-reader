- id: f-geometry-proofs--std-smooth-mv-polynomial
  title: The additive line is a smooth group with a Lie model
  kind: step
  status: explained
  chunk: c0123
  plain: 'This file proves that polynomial rings in n variables over any ring R are standard smooth of
    dimension n, meaning they are cut out with no equations and with an invertible (empty) Jacobian. From
    this it deduces that affine n-space is smooth of relative dimension n over any base scheme. It then
    builds the additive group of the line as a group object over any base, where a point is an element
    of the coordinate ring and the group law is addition. It builds its Lie model using dual numbers (numbers
    a + b*eps with eps squared zero). The final theorem says a smooth one-dimensional commutative group
    with a Lie model over every base exists over the integers.

    '
