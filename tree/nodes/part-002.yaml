- id: f-dixmier-schur-of-rank-le-aleph0
  title: Schur's lemma for countable-size complex spaces
  kind: step
  status: explained
  chunk: c0091
  plain: 'This file proves a version of Schur''s lemma. Take a complex vector space with a countable list
    of basis vectors, and a family of linear maps on it that has no smaller invisible-to-the-family subspace
    (only 0 and everything are kept inside themselves). Then any linear map commuting with the whole family
    is just multiplication by one complex number. The idea is a counting trick. If it were not a number,
    every number c would give an invertible map T minus c. Then the vectors you get by undoing these maps
    on one fixed vector would be independent, one for each complex number. But the complex numbers are
    uncountably many, while the space only has countably many independent directions. Contradiction.

    '
