    exp(-y^2) as you go up or down. Then the integral of f along the vertical line at real part a equals
    the integral along the line at real part b. The idea is Cauchy''s theorem. The integral around a tall
    rectangle is zero. The two horizontal edges shrink to nothing as the rectangle grows, because of the
    bell-curve decay. Only the two vertical sides remain, and they must cancel. The file proves this and
    restates it.

