- id: f-exists-is-q-group-weil-restriction
  title: Weil restriction of a matrix group is a group defined over the rationals
  kind: step
  status: explained
  orphan: true
  chunk: c0078
  plain: 'Take a number field F of degree d over the rationals, and a family of equations S over F that
    cut out a subgroup of n-by-n invertible matrices (it contains the identity and is closed under products
    and inverses, over every F-algebra). The statement is that a group Γ of complex matrices of size nd+1
    exists, defined by rational equations and stable under automorphisms of the complex numbers, whose
    points in any ring are exactly the images of the F-group''s points. This trick, called Weil restriction,
    trades a group over F for a bigger one over the rationals. The proof takes the rational equations
    from a neighbouring file, checks the group laws using the matrix embedding, and gets stability from
    rationality.

    '
  lean:
