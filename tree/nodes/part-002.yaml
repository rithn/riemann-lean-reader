- id: f-eval-complex-poly-eq-zero-on-rat-zariski-closure
  title: Complex equations vanishing on a Galois-stable set vanish on its rational closure
  kind: step
  status: explained
  orphan: true
  chunk: c0077
  plain: 'Take a set Γ of complex square matrices that is stable under every field automorphism of the
    complex numbers (apply the automorphism to each entry and you stay in Γ). If a polynomial f with complex
    coefficients vanishes at every point of Γ, then f also vanishes at every point of the "rational closure"
    of Γ, meaning the matrices on which every rational-coefficient polynomial vanishing on Γ vanishes.
    The idea is Galois descent: the space of polynomials vanishing on Γ is stable under the automorphisms,
    so it is spanned by polynomials with rational coefficients. Each of those vanishes on the closure,
    and so does any combination of them.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/AdelicLatticeProofs/EvalComplexPolyEqZeroOnRatZariskiClosure.lean:71
  mathlib:
  - MvPolynomial.mem_range_map_iff_coeffs_subset
  - Submodule.span_induction
  - MvPolynomial.basisMonomials
