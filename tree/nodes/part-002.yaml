  kind: step
  status: explained
  chunk: c0125
  orphan: true
  plain: 'Take a finite group G and a subgroup K that contains every commutator (a b a^-1 b^-1), so K
    is normal and G/K is abelian. The induced class function of the constant function 1 from K, minus
    the constant function equal to the index of K, lies in a certain group D0 of virtual characters. D0
    is generated by differences between a degree-one character and the trivial one. The proof shows the
    induced function equals the index on K and is 0 elsewhere. That equals the sum of all characters of
