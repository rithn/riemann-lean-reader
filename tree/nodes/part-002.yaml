- id: f-pseudo-division
  title: Dividing polynomials over a ring, after scaling
  kind: step
  status: explained
  chunk: c0141
  plain: 'Ordinary long division of polynomials needs to divide by the leading coefficient, which may
    be impossible in a ring such as the integers. This file shows a workaround. For any polynomial p and
    any nonzero g, some power of g''s leading coefficient times p equals g times a quotient plus a remainder
    of smaller degree than g. Example over the integers, dividing by 2x: multiply 3x² by 2 to get 6x²
    and subtract 3x·(2x), which leaves 0. The proof is induction on the degree of p. Subtract a multiple
    of g to cancel the top term, after scaling once.

