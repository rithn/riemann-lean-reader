    pairing with some fixed vector. The idea is counting. The map from vectors to functionals is injective
    because the form is non-degenerate, and the space of functionals has the same dimension as the space
    itself. So the map is onto. Example: on ordinary 3-space with the dot product, every linear function
    is a dot product with a fixed vector.

