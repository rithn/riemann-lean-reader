  status: explained
  chunk: c0087
  plain: 'This file only states a claim, without proving it. Weierstrass division is long division for
    analytic functions. Suppose f is analytic near the origin and, along the last coordinate axis, f vanishes
    to order exactly d (like t^d times something nonzero). Then any analytic g can be written as q times
    f plus a remainder, where the remainder is a polynomial of degree below d in the last coordinate,
    with coefficients analytic in the other coordinates. The equality holds near the origin. This is the
    analytic cousin of polynomial division with remainder.

