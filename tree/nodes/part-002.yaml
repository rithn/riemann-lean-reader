- id: f-noether-normalization-chart
  title: A change of variables that makes a polynomial monic
  kind: step
  status: explained
  chunk: c0141
  plain: 'Take a nonzero polynomial f in n+1 variables with coefficients in a ring with no zero-divisors.
    The file proves there is a reversible change of variables after which f, viewed as a polynomial in
    the first variable, has a constant nonzero leading coefficient. "Monic" means the top coefficient
    is just a number. The trick is a shear. Replace each other variable x_i by x_i plus a power of x_0,
    with exponents b, b², b³, … where b is bigger than every exponent in f. Different monomials of f then
    get different top degrees, like different digits in base b. So one monomial wins, and its coefficient
    is the leading one.

