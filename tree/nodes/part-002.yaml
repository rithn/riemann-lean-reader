    functionals of the product. The shift functional gives k times the degree of (low power sum of order
    k-1 times Q) when the blocks match, and zero otherwise. The total functional gives N times the degree
    of Q only when the blocks match and k = 1, and zero otherwise. The proof uses the product rule for
