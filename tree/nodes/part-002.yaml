- id: f-homogeneous-ideals--is-domain-and-is-integrally-closed-at-prime-of-smooth-of-co
  title: Smooth over a normal base gives normal local rings
  kind: step
  status: explained
  chunk: c0076
  plain: 'The main result: if B is smooth over A (a family of smooth shapes) and the local ring of A at
    the prime under p is a normal domain (a domain where fractions solving monic polynomials are already
    in it), then the local ring of B at p is also a normal domain. The file builds this in layers. A localization
    lemma transfers the property. The etale case (no branching) uses the fibre over the fraction field,
    which is a finite product of fields. Polynomial rings over a normal domain are normal, by induction
    on the number of variables. Smooth means locally etale over such a polynomial ring. A version for
    schemes, on local rings of points, ends the file.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/HomogeneousIdeals/IsDomainAndIsIntegrallyClosedAtPrimeOfSmoothOfCo.lean:160
