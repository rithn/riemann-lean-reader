    is a single unit a mod N times l^b which reduces to h mod N and to the reduction of u mod l^b. This
    is a form of the Chinese remainder theorem: two compatible residue conditions can be met together.
    Example: if you want a number that is 3 mod 4 and 5 mod 9 you need the two to agree on the shared
    divisor, and then one exists. The proof checks compatibility, builds a candidate using the Chinese
    remainder theorem, and then adjusts it to be a unit.

