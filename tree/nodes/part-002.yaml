- id: f-divisor-proofs--good-iff-etale-at
  title: Good unpacked as etale at each prime plus a point at zero
  kind: step
  status: explained
  orphan: true
  chunk: c0076
  plain: 'This file restates the earlier "Good" condition in two named pieces, and proves they are the
    same thing. It first defines "the closure is etale at a prime P": after localizing at P, the closure
    is a branch-free extension. The theorem then says "Good" holds exactly when (1) the closure is etale
    at every prime whose preimage has height at most one, and (2) a "point at zero" exists. The proof
    is trivial: both sides unfold to literally the same definition, so Lean accepts it by rfl, meaning
    "equal by definition".

    '
