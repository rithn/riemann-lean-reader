- id: f-exists-rational-equations-weil-restriction
  title: Rational equations describing the Weil restriction
  kind: step
  status: explained
  chunk: c0078
  plain: 'This builds the rational equations behind Weil restriction. Given equations S over a number
    field F of degree d, it produces a set of rational-coefficient polynomial equations on matrices of
    size nd+1. A matrix satisfies them exactly when it is the embedded image of an invertible n-by-n matrix
    over A that satisfies S. The equations say: certain off-block entries are zero, the big block equals
    the multiplication-matrix expansion of the coordinates, the determinant times the corner entry is
    1, and the coordinate polynomials of S vanish. Both directions are checked by substituting and comparing
    entries.

    '
