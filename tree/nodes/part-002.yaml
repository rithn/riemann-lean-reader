- id: f-abelian-scheme-quotients--is-abelian-scheme
  orphan: true
  title: Definitions of abelian schemes and semiabelian schemes
  kind: step
  status: explained
  chunk: c0096
  plain: 'This file only gives definitions. An abelian scheme is a group shape over a base that is commutative,
    smooth (no sharp points), proper (closed and compact-like) and has connected fibres. A torus extension
    is a group G with a map onto an abelian scheme B whose kernel is a split torus, that is, a product
    of copies of the nonzero numbers under multiplication. A semiabelian scheme is a smooth commutative
    group whose fibres over every algebraically closed field are such torus extensions. Elliptic curves
    with a pinched point (multiplicative reduction) are the usual example.

    '
