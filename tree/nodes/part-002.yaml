  plain: 'This file proves the algebra behind the Cayley transform over any commutative ring with a conjugation
    map. If X is "skew" (conjugate-transpose of X times J plus J times X equals zero) and 1 plus X has
    an invertible determinant, then (1 minus X) times the inverse of (1 plus X) is unitary for J, and
    has invertible determinant so it lies in the unitary group. Conversely, if g is unitary and 1 plus
    g is invertible, then (1 minus g)(1 plus g)^-1 is skew. The proofs are matrix identities, using that
    1 plus X and 1 minus X commute.

