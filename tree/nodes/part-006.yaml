    |lambda_a minus lambda_b| divided by the gap between positions b and a. First, it is positive when
    lambda has distinct entries. Second, it does not change if the entries are permuted; the trick is
    that its square is a product over all ordered pairs, which is symmetric, and square roots of nonnegative
    numbers are unique. Third, for decreasing lambda the absolute values can be dropped. Fourth, a Weyl-style
    form with shifted entries.

