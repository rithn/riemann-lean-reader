    y ≥ 1. The constant depends on the character. The key step bounds the ramp: each term has size at
    most y, because Λ(n) is at most n, the character value has size at most 1, and the ramp weight is
    at most y/n. There are at most y + 1 terms, so the total is at most 2y². The extra pieces (y log y
