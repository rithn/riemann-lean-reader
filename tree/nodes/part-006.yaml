- id: f-haar-transv
  title: Shear maps keep a suitable box in place
  kind: step
  status: explained
  chunk: c0436
  plain: 'A "transvection" (shear) adds a multiple of one coordinate to another, like sliding a deck of
    cards sideways. This file shows that for every shear there is a box which the shear maps exactly onto
    itself. The idea is to choose the box a little wider in the changed coordinate, then check the new
    coordinate stays within the bound using the ultrametric rule (a sum is no bigger than its biggest
    term). The inverse shear covers the other direction. Hence shears do not change volume.

    '
  lean:
  - Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ProductFormulaHaar/HaarTransv.lean:74
  mathlib:
  - Matrix.TransvectionStruct
  needs:
  - f-haar-box
  - concept-ultrametric-norm
  - concept-valuation-rings
  - linear-algebra
- id: f-haar-main
  title: Any invertible matrix scales volume by the modulus of its determinant
  kind: step
  status: explained
  chunk: c0436
  plain: 'This file proves that, over a local field, an invertible matrix multiplies volume by the modulus
    of its determinant. It assumes two facts about boxes (stretching one coordinate, and shears), supplied
    by sibling files. The idea is the classic one from linear algebra: every invertible matrix is a product
    of diagonal matrices and shears. Volume scaling is multiplicative, so it is enough to check those
    two kinds. It then packages this as the statement for multiplication by an element of an algebra.

    '
  lean:
  - Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ProductFormulaHaar/HaarMain.lean:114
