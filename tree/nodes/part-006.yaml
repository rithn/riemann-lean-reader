  kind: step
  status: explained
  chunk: c0517
  plain: 'Two calculus facts for polynomials in many variables. First, a chain rule: the derivative of
    "a polynomial f evaluated at values phi" equals the sum over variables of (partial derivative of f)
    times (derivative of that value). Second, a translation-invariance result. If a combination of partial
    derivatives of f, with coefficient polynomials c_v, is zero, then f takes the same value at y and
    at y + t z for every t, when z is the "direction" matching the coefficients. The proof restricts to
    a line in t, shows the derivative in t is zero, and concludes a polynomial with zero derivative is
