- id: f-ker-coker
  title: A submodule's quotient is no longer than the kernel
  kind: step
  status: explained
  chunk: c0485
  plain: 'This file proves a clean claim about "length", which counts how many steps a module needs to
    be built up from simple pieces (for a finite-dimensional vector space, length is just dimension).
    Take a module of finite length, a linear map f on it, and a submodule N that f sends into itself.
    Then the length of N modulo f(N) is at most the length of the kernel of f. The idea: f restricted
    to N maps N onto f(N), and its kernel sits inside the kernel of f. Length adds up along such exact
    sequences, so the quotient N/f(N) has the length of that smaller kernel, which is at most the full
    one. This is the standard "kernel and cokernel have matching size" argument.

    '
