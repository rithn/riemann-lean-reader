- id: f-remainder-terms--coinv-reduction
  title: Powers of x_k beyond k are reducible modulo the power-sum ideal
  kind: step
  status: explained
  chunk: c0495
  plain: 'Work over a field of characteristic 0, with f groups of n variables. Let I be the ideal generated
    by the power sums x₁ᵐ + … + xₙᵐ (m = 1..n) of each group. Using Newton''s identities, the file shows
    I also contains every elementary symmetric polynomial, so modulo I the product (T+x₁)…(T+xₙ) is just
    Tⁿ. From that it derives: for each variable x_k, the power x_k^(k+1) equals, modulo I, a combination
    of lower powers of x_k with coefficients using only later variables. It also shows I is not the whole
    ring, since every generator has constant term 0.

