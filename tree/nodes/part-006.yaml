- id: f-additive-valuation-norms--imports-bis
  title: Cokernel of g^a−1 is no longer than that of g^b−1 when a divides b
  kind: step
  status: explained
  chunk: c0460
  plain: 'This file proves a short real result. If a divides b, then g^b−1 can be written as g^a−1 times
    a geometric sum (1 + g^a + g^(2a) + …). So the outputs of g^b−1 all lie inside the outputs of g^a−1,
    and by the fact that a bigger range gives a smaller cokernel, the cokernel of g^a−1 is no longer than
    that of g^b−1. Put simply: the further along the sequence of powers by multiples, the less is hit.

    '
