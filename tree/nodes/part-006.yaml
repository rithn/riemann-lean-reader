  kind: step
  status: explained
  chunk: c0489
  plain: 'This file proves the dimension formula for formal degree. First, the product over pairs a <
    b of (b minus a), positions in 0..n-1, equals 0! * 1! * ... * (n-1)!. The reason: for fixed b, the
    differences b-a over a < b run through b, b-1, ..., 1, whose product is b!, then multiply over b.
