- id: f-mem-range-of-forall-height-eq-one-of-is-reflexive
  title: In a normal domain, membership can be tested at height-one primes
  kind: step
  status: explained
  chunk: c0512
  plain: 'A long toolkit about "normal" rings, meaning integrally closed Noetherian domains such as the
    integers. Height one primes are the smallest nonzero primes, like (2) or (3) in the integers. The
    main fact: an element of the fraction field (think a rational number) lies in the ring if and only
    if it lies in the local ring at every height-one prime (for rational numbers, if and only if no prime
    appears in the denominator). Along the way, each such local ring is a discrete valuation ring, so
    there is a "how many times does this prime divide" count, and the same test works for elements of
    free or reflexive modules. Final packaged theorem collects these results.

