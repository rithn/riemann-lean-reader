- id: f-fst
  title: A fixed lattice containing a vector in the first coordinate contains it in any other fixed lattice
  kind: step
  status: explained
  chunk: c0435
  orphan: true
  plain: 'This file proves a small statement about two "fixed" lattices, meaning lattices equal to their
    own dual under a twisted Hermitian pairing. Suppose a vector of the form (a, 0), with zero second
    coordinate, lies in one fixed lattice S0. Then it also lies in the other fixed lattice S1. The proof
    uses that each fixed lattice is stable under conjugation and splits into coordinate pieces. For a
    vector (a, 0), the pairing with another reduces to a product of the form c times x times a conjugate,
    and its square is a product of two integral quantities. A square being integral makes the element
    itself integral.

    '
  lean:
