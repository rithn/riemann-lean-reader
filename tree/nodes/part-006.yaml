- id: f-statements-component-dim
  title: Components of the special fibre have the expected dimension, stated
  kind: step
  status: explained
  chunk: c0432
  plain: 'This file states a single claim and does not prove it. Take a multi-graded model P over a ring
    with one prime (a discrete valuation ring), of relative dimension d, and a form f not in P. Then every
    component of the vanishing locus of f that lies over the special prime has the full expected dimension,
    d plus the number of graded blocks. In words, cutting by f produces no smaller-than-expected pieces
    in the special fibre.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/DiscreteValuationNumbers/StatementsComponentDim.lean:13
  mathlib: []
  needs:
  - f-discrete-valuation-numbers--objects
