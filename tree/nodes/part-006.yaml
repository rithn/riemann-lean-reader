    1 to n. A matrix can act on one chosen slot, or one matrix per slot can act on all slots at once.
    This file proves the bookkeeping rules. Acting with the identity changes nothing. Acting with a product
    of matrices is acting twice. Operators on the underlying space commute with slot operators. Operators
