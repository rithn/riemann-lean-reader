- id: f-is-kummer-character-at-level-add-zero-congr
  title: Kummer-type conditions add up, hold at zero and survive small changes
  kind: step
  status: explained
  chunk: c0437
  orphan: true
  plain: 'This file proves three closure properties of a "Kummer-type condition", a technical test that
    an element and a function on matrices fit together via roots of unity. First, if two pairs pass the
    test, so does their sum. Second, the zero pair passes. Third, changing the function a little (agreeing
    on a congruence subgroup of finite index) keeps the test true. The idea is to multiply the witnessing
    functions, using that e^(2 pi i x / m) turns addition mod m into multiplication, and to enlarge the
    level by multiplying the two levels.

    '
