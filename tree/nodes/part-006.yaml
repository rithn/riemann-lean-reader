- id: f-dual-lattices--tower-zero-surjective
  title: A bundle of data for evaluating functions at torsion points
  kind: step
  status: explained
  chunk: c0439
  plain: 'This file mostly gathers definitions. It bundles many ingredients into one record: a tower of
    rings, a coordinate chart near zero, Hodge-Tate data (a way to compare two kinds of structure), and
