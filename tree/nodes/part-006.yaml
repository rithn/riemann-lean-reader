- id: f-discrete-valuation-numbers--cartier
  title: Proportional functions give the same divisor, plus two example models
  kind: step
  status: explained
  chunk: c0432
  plain: 'This file proves that when two functions are multiples of each other away from a prime W, they
    have the same multiplicity along W. The multiplicity here is a count of how many layers a localized
    quotient has. In the file, "multiple" means u times f minus v times g lies in the base ideal, with
    u and v nonzero at W. The proof compares the two localized quotients by an injection and a surjection.
    It also shows that a ratio of functions with such local unit relations is a "vertical divisor", and
    defines the blow-up model and a nodal model with explicit formulas.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/DiscreteValuationNumbers/Cartier.lean:70
  mathlib:
  - IsLocalizedModule.map
  - Module.length
  needs:
  - f-discrete-valuation-numbers--objects
  - concept-prime-ideals-localization
  - concept-discrete-valuation-ring
