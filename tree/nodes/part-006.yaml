- id: f-haar-scale
  title: Stretching one coordinate scales volume by the modulus
  kind: step
  status: explained
  chunk: c0436
  plain: 'Take the standard box (every coordinate of size at most 1). Multiply one coordinate by a nonzero
    number a. This file proves the box''s volume gets multiplied by the "modulus" of a, the factor by
    which a stretches volume on the number system K. The idea is to slice the space into one coordinate
    line times the rest. On that line, the slice measure is itself a translation-invariant volume, so
    the one-dimensional scaling rule applies. The file also proves any compact set sits inside some ball.

    '
  lean:
