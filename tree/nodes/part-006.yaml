  orphan: true
- id: f-effective-hilbert-samuel--p-curvature
  title: Calculus inequalities for a curvature calculation
  kind: step
  status: explained
  chunk: c0433
  plain: 'This file defines several explicit one-variable functions built from logarithms and exponentials,
    used in a curvature computation, and proves a few inequalities about them. The functions include x
    plus log x, 1 plus 1 over x, a gradient bound, and a coefficient in epsilon and v. Proven facts are
    that x is at most x plus log x when x is at least 1, and that x squared plus 4x is at most 2 e to
    the x. The main result says exp(D minus 1) over 2 is at most exp(D x) divided by ((x plus 1) squared
    plus x plus log x). The proofs use the standard lower bound of e to the t by its first terms.

    '
  lean:
