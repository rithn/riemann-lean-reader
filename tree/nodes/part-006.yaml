- id: f-p-trans-all-b
  title: Splitting a tensor power in two, and splitting alternation
  kind: step
  status: explained
  chunk: c0510
  plain: 'Think of a function that takes an index for every box in a set P. If we split the boxes into
    two groups (those satisfying a yes/no test and those that do not), such a function is the same thing
    as a function of the first group that returns a function of the second. This file builds that rearrangement
    and shows it is a faithful two-way translation. It then shows that the operators acting on box entries
    behave as expected after the rearrangement, and that the column-wise alternating sum (a signed sum
    over rearrangements of boxes, as in a determinant) factors as a signed sum on one group followed by
    a signed sum on the other, provided columns do not mix the groups.

