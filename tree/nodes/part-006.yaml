- id: f-p-tensor-g-k-b
  title: The tensor-product action keeps finiteness and continuity
  kind: step
  status: explained
  chunk: c0462
  plain: 'Suppose a group acts on a space M. Let it also act on several copies of M glued together (the
    tensor-style space). This file shows two good properties carry over. First, if every vector of M moves
    inside a finite-dimensional piece (it has only finitely many independent images), the same holds in
    the glued space. Second, if the action on M is continuous, so is the action on the glued space. The
    idea is that each output entry is a finite sum of matrix entries times old outputs. A finite sum of
    continuous things is continuous.

