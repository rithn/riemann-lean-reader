    to raising to the l-th power) keeps l-adic size, because it fixes units mod l and l itself. Then,
    if -d is not a square mod l, it sends sqrt(-d) to its negative. If it fixed sqrt(-d), the Frobenius
    condition would give a unit equal to 1 - (-d)^((l-1)/2), which is 2 mod l and so cannot be small.
    Euler''s criterion decides the square test.

