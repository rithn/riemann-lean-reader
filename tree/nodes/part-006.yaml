  orphan: true
  plain: 'Take a CM number field E (a totally imaginary quadratic extension of a totally real field),
    a lattice D.La that is a finitely generated projective module over the integers of E, and a positive
    integer N. The theorem says the lattice has a family of p + q elements that act like a basis modulo
    N: everything is a combination plus something in N times the lattice, and a combination lies there
