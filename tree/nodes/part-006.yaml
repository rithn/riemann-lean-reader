  status: explained
  chunk: c0460
  plain: 'This file proves a real result. A nilpotent map is one that becomes zero when applied enough
    times. The claim: if the module has length at most n (longest chain of sub-modules has at most n steps),
    then the n-th power of the map is already zero. Proof idea: the ranges of the successive powers form
    a decreasing chain, and as long as a power is non-zero the chain must strictly shrink, otherwise the
    map would never reach zero. A chain of strictly shrinking sub-modules cannot be longer than the length
