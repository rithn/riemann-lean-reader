- id: f-discrete-valuation-numbers--statements-fibre-var
  title: Both fibres of a model are projective varieties of the same dimension, stated
  kind: step
  status: explained
  chunk: c0432
  plain: 'This file states one claim without proving it. For a multi-graded model P over a discrete valuation
    ring (a ring with a single prime), the generic fibre and the special fibre have the same shape. Each
    is a prime multi-projective piece, and each has dimension equal to the relative dimension d plus the
    number of graded blocks. Informally, setting the prime to zero does not change the geometry''s size
    or primality.

    '
  lean:
