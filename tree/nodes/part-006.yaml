- id: f-involution-residue-pow-and-roots-of-unity
  title: An involution acts on roots of unity as the M-th power
  kind: step
  status: explained
  chunk: c0479
  orphan: true
  plain: 'Take a local ring S (one maximal ideal) whose residue field, the ring modulo that ideal, has
    M^2 elements. Let tau be a self-inverse ring map that acts nontrivially on the residue field. Then
    on the residue field tau is "raise to the M-th power". And every element w with w^(M^2 - 1) = 1 satisfies
    tau(w) = w^M. The first part uses the structure of the finite field. The second part uses that x^N
    - 1 has no repeated roots mod the maximal ideal, so a root is fixed by its residue (Hensel-style uniqueness).

