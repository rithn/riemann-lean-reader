  chunk: c0543
  plain: 'This file defines the Gaussian binomial number: a q-version of "m choose j" given by the Pascal-like
    rule G(m+1, j+1) = G(m, j+1) + q^(m-j) G(m, j). It proves small facts (value 1 at j=0, zero if j >
    m). It then states, without proving, three claims. One: the number of j-dimensional subspaces of an
    m-dimensional space over a finite field with q elements is G(m, j). Two: the same count for subspaces
    containing a given subspace. Three: a product formula that expands (1 - Y)(1 - qY) ... in terms of
