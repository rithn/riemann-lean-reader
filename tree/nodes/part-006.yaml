- id: f-hilbert-samuel--bergman-objects
  title: Line bundles, weights and Bergman kernel vocabulary
  kind: step
  status: explained
  chunk: c0433
  plain: 'This file is set-up with a few tiny proofs. A holomorphic line bundle is described by transition
    functions on overlapping chart pieces that are never zero and satisfy a consistency (cocycle) rule.
    Its "sections" are lists of local functions that agree across charts, up to those twists. A weight
    is a smooth compatible choice of local functions. It is semipositive when its complex Hessian (the
    Levi form) is nonnegative. The file also defines a smooth volume measure, the L2 size of a section,
    and the Bergman function (the best pointwise-to-total size ratio). It defines the Chern top-degree
    density, the Gram matrix of sections, and a Gaussian disc mass.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/HilbertSamuel/BergmanObjects.lean:14
  - GroundTheory/HeightsAndTheta/Heights/HilbertSamuel/BergmanObjects.lean:98
  mathlib: []
