  - concept-ample-nef-line-bundles
  - complex-analysis
- id: f-effective-hilbert-samuel--objects
  title: Vocabulary for sections with twisted weights on a complex atlas
  kind: step
  status: explained
  chunk: c0433
  plain: 'This file defines objects with a few small proofs of closure under addition and scaling. It
    works on a space covered by a finite atlas of complex charts. Top-degree sections are lists of local
    functions glued by the Jacobian and line-bundle twists. The file defines how to integrate over a chart
    without double-counting overlaps, and a squared norm using a weight. It defines nondegenerate zero
    sets with their Jacobians and residues, an "algebraic cover" property, and weights that must be semipositive.
    It also defines subspaces of sections vanishing to a given order, and notions of a symbol, with several
