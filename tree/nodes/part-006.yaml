  title: Small algebra facts about the quantum determinant and conjugation
  kind: step
  status: explained
  chunk: c0510
  plain: 'A toolbox of short facts used by the bigger argument. The quantum determinant is a determinant-like
    sum built from an n-by-n grid of operators, with a shift u added along the diagonal. Here we check
    that applying a structure-preserving map (an algebra map) to every entry just applies it to the whole
    determinant, and that the determinant commutes with anything that commutes with all the entries. Another
    lemma says anything built from entries by sums and products also commutes with such an element. Finally
    it defines conjugating an operator by a change of coordinates (an invertible linear map), and checks
    that conjugation respects sums and products.

