- id: f-effective-hilbert-samuel--p-constants
  title: Numeric constant inequalities with logs of 280 and 2 pi
  kind: step
  status: explained
  chunk: c0433
  plain: 'This file proves a handful of explicit numerical inequalities. The headline one is that log
    280 plus log of 2 pi is at most 7.6. From it come related bounds. For D at least 1, half of (log 280
    plus D times log 2 pi) is at most 3.8 D. And for a big enough rho, namely at least 2 to the 26th,
    3.8 D is at most (D over 2) times log rho. The proofs use known decimal bounds for pi and e, and a
    lower bound for the exponential by a quadratic. At the end it defines a vanishing-order bound.

    '
  lean:
  - GroundTheory/HeightsAndTheta/Heights/EffectiveHilbertSamuel/PConstants.lean:8
  mathlib:
  - Real.pi_lt_d2
  - Real.exp_one_gt_d9
  - Real.quadratic_le_exp_of_nonneg
