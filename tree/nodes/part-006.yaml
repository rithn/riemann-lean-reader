- id: f-exp-mv-add-c
  title: Proof of the cubic exponential claim
  kind: step
  status: explained
  chunk: c0545
  plain: 'This file proves the claim stated earlier. The first key fact: the exponential of a sum of series
    with no constant term is the product of the exponentials. Using it, the combination of logs under
    study has an exponential equal to a ratio of explicit products. The identity given in the hypotheses
    then shows that ratio is Z, where n times Z equals a product of three simple series. Since n starts
    with 1, it is invertible with integral coefficients, so Z is integral. The proof checks many nonvanishing
    side conditions along the way.

