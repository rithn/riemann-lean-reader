- id: f-exceptional-primes-finite-card-le
  title: At most three exceptional primes
  kind: step
  status: explained
  chunk: c0463
  plain: 'Take whole numbers n less than m. Call a prime l exceptional if m is smaller than l raised to
    four times the power of l dividing n. This file shows there are at most 3 such primes. Why: the full
    prime-power parts of n multiply to at most n. If four were exceptional, the product of their fourth
    powers would exceed m to the fourth, which is more than n to the fourth. That is a contradiction.
    It then uses this to prove a stated claim counting an exceptional set, growing one step at a time.

    '
