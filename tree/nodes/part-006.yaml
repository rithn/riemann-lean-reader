- id: f-exists-basis-mod-n
  title: A basis modulo n for a module over a Dedekind domain
  kind: step
  status: explained
  chunk: c0544
  plain: 'Let O be a Dedekind domain (a ring with unique factorisation of ideals, like the integers of
    a number field), M a finitely generated projective O-module (a "lattice"), and n a nonzero element.
    The theorem gives elements e_1, ..., e_r, where r is the rank, with two properties. Every element
    of M is a combination of the e_i plus n times something. And a combination of the e_i lies in n times
    M only if every coefficient is divisible by n. So the e_i behave like a basis of M modulo n. The proof
    inverts everything coprime to n, which leaves a ring with finitely many primes, so a principal ideal
    ring where bases exist. It then clears denominators.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsBasisModN.lean:48
  mathlib:
  - IsLocalization.isDedekindDomain
  - IsPrincipalIdealRing.of_finite_primes
