- id: f-lang-x-root
  title: A Lang-type theorem, fixed vectors span the space
  kind: step
  status: explained
  chunk: c0515
  plain: 'Take a finite-dimensional vector space V over an algebraically closed field k and a map F that
    is additive, one-to-one, and satisfies F(a v) = a^q F(v) for scalars a. Then V has a basis consisting
    of vectors fixed by F. This is a form of Lang''s theorem (cousin of the fact that x^q = x has q roots).
    The proof shows the span U of fixed vectors is everything. Otherwise a vector outside U gives a minimal
    linear relation among its iterates under F, the associated polynomial has a nonzero root, and that
    root yields a new vector in U, contradicting minimality. Helper lemmas solve z^q minus z = c.

