    acting on one space, but only by assuming two other claims (a one-label base claim and a tensor claim),
    which are stated elsewhere and not proved here. The setting: boxes are labelled by which copy they
    belong to. The idea is induction on the number of boxes. Pick one label. Take all boxes with that
    label as one block and apply the assumed one-label claim to them. The remaining boxes have fewer elements,
    so the induction hypothesis handles them. Then the two answers are glued, checking the eigenvalue
