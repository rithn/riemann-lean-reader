  kind: step
  status: explained
  chunk: c0496
  orphan: true
  plain: 'This proves a uniqueness statement for quotients of group schemes (spaces with a group law).
    Let G be such a group over a base, and q : G → B and q′ : G → B′ two surjective, flat group homomorphisms
    (flat: the fibres vary without jumps) with kernels T and T′. If each map kills the other''s kernel,
    then B and B′ are isomorphic as groups, compatibly with q and q′. Idea: a flat surjection is an "effective
