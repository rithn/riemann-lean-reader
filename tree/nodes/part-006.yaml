- id: f-haar-box
  title: Box-shaped sets and constant scaling of volume
  kind: step
  status: explained
  chunk: c0436
  plain: 'Fix a number system K with a p-adic style size (a "local field") and a finite-dimensional space
    over it. A "box" is the set of points whose coordinates each stay below a chosen size. This file proves
    boxes are open and compact (closed and bounded in the useful sense) and contain 0. It then shows that
    any invertible linear map multiplies every volume by one fixed constant. So if you know the constant
    on one box, you know it on every set. The proof compares the stretched volume measure with the original;
    two such measures differ by a constant.

    '
  lean:
  - Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ProductFormulaHaar/HaarBox.lean:140
  mathlib:
  - MeasureTheory.Measure.addHaarScalarFactor
  - isAddLeftInvariant_eq_smul
