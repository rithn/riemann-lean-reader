- id: f-effective-hilbert-samuel--p-division
  title: Bookkeeping for degree-raising multiplication, and the L2 lifting estimate
  kind: step
  status: explained
  chunk: c0433
  plain: 'This file proves several unrelated algebra and estimate facts. First comes a "multiplication
    tower", a sequence of vector spaces V0, V1, ... where multiplying by an element of a fixed space W
    lifts V j to V (j+1). It shows how products and powers raise the level, and that certain generated
    subspaces lie inside the level T space. A concrete example uses homogeneous polynomials in two variables.
    Then comes an L2 lemma. If a combination of functions with bounded coefficients has large norm, a
    weighted sum of the individual norms must be large, with an explicit constant. Last come constants
    with a factorial, and logarithmic inequalities bounding them.

    '
