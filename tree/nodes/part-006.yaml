- id: f-local-hermitian-forms--cint-idx
  title: Finite-index and integral-basis facts for a quadratic extension
  kind: step
  status: explained
  chunk: c0435
  plain: 'This file proves several facts about a quadratic extension of a field K, where each element
    has a real and an imaginary part. It shows an element with integral trace and norm is integral. It
    shows integral elements can have their parts cleared of denominators by one fixed nonzero number c.
    It follows that the integers of the extension form a finitely generated module. Another fact is that
