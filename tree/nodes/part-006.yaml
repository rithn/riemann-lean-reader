    scheme is a family of abelian varieties over a base; genus zero means its fibres have dimension 0.
    The proof shows that such a family is a trivial cover of the base: the structure map is an isomorphism.
    The structure map is proper, has connected fibres, and is étale (no branching) because relative dimension
    is zero. So the zero section is both a closed and open piece hitting every fibre point, hence everything.
