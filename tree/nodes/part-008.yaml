- id: f-is-hilbert-schmidt-of-finite-dimensional
  title: Hilbert–Schmidt and trace-class operators, and traces of group actions
  kind: step
  status: explained
  chunk: c0720
  plain: 'A long toolkit file, not one theorem. An operator on a Hilbert space is Hilbert–Schmidt if the
    squared sizes of its outputs on a basis add up to a finite number (this does not depend on the basis).
    Trace-class means a finite sum of products of two such operators. Proved: closure under sums, scaling,
    adjoint and composition; the trace is well defined, cyclic, and equals the usual matrix trace in finite
    dimensions. Then for a group acting by norm-preserving maps, integrating a nice function against the
    action gives an operator, whose trace behaves well. For a compact open subgroup K the trace is the
    volume of K times the dimension of the fixed vectors.

    '
