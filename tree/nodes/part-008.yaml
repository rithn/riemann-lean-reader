- id: f-cuspidal-unipotent-radical-sum-zero
  title: For a cuspidal representation, the sum over a unipotent block group vanishes
  kind: step
  status: explained
  chunk: c0672
  orphan: true
  plain: 'A "cuspidal" representation of GL(d) over a finite field is one with no nonzero vectors fixed
    by the unipotent radical of a proper parabolic subgroup (the group of matrices with identity blocks
    along a block diagonal and zeros below). The file shows that for such a representation, summing the
    representing matrices over that unipotent subgroup gives zero, because the sum is fixed by the subgroup,
    hence must be zero. Taking traces, summing the character over a shifted copy of the subgroup is also
    zero. The key trick is that multiplying by a group element just permutes the terms.

    '
  lean:
  - Development/AutomorphicSpectrum/Proofs/BlockDecomposition/CuspidalUnipotentRadicalSumZero.lean:73
  mathlib:
  - Equiv.sum_comp
  - LinearMap.trace
