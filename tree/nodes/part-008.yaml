- id: f-orbit-mass-equivariant-constant-fibre
  title: If every fibre has n points, orbit mass multiplies by n
  kind: step
  status: explained
  chunk: c0667
  plain: 'Suppose a group G acts on two sets Y and Z, and a map f from Y to Z respects the action. Weigh
    each orbit of a subgroup Γ by one over the size of the stabiliser of a point (this is a "mass"). If
    each point of a chosen invariant part S of Z has exactly n preimages, and points outside S have none,
    then the total mass in Y is n times the mass of the S-orbits in Z. The idea: the preimages of one
    orbit are counted by orbits of the stabiliser, and a counting identity (orbit sizes add up to n) gives
    the factor.

    '
