    whose total is finite. Then the family indexed by all choices of one entry from each slot, with value
    the product of the chosen entries, also has a finite total. Idea: any finite batch of choices fits
    inside a grid made of finitely many entries per slot. The sum over that grid factors as a product
    of per-slot sums, and each is at most that slot''s full total. So all partial sums are bounded by
    the product of totals, which gives convergence. (The file name mentions a specific use, but the statement
