- id: f-inv-vol-mul-pos-le-conj
  title: Relative volume of two subgroups multiplies along a chain
  kind: step
  status: explained
  chunk: c0667
  plain: 'Given two subgroups A and B of a group, the "inverse volume" is a ratio of indices (how many
    cosets of a small common subgroup D each contains, relative to the other). The file proves that if
    D sits inside both, this ratio is index(D in A) divided by index(D in B). From this it follows that
    the ratio multiplies along a chain K0, K1, K; it is positive; it is the index when K is inside K1;
    and it is unchanged by conjugating both subgroups by one element. The index of a subgroup counts its
    cosets, like counting how many cards a deck splits into.

    '
