- id: f-p-col-anti-b
  title: 'Counting pairs: a tableau-like filling is a column rearrangement'
  kind: step
  status: explained
  chunk: c0665
  plain: 'This file is pure counting. Take a list of positions sorted into columns, and give each position
    a number from 0 up to a top value. It defines the number of "same-column pairs" and, for each position,
    how many same-column positions carry a bigger number. It proves that this count never exceeds the
    room above (top minus the number), so the total of such counts equals the number of pairs. Then the
    equality case is the key: if the totals meet, the filling must be a rearrangement inside columns of
    a fixed reference filling. The proof counts with injective maps and a pigeonhole argument.

    '
