    listed as e(h). Let M be the table of values. Then M-transpose times M equals |G| times a permutation
    matrix, the one sending each character to its inverse. Reason: the (g, h) entry sums e(g)(x)·e(h)(x)
    over x, which is |G| if the two characters multiply to the trivial one and 0 otherwise (the orthogonality
    of characters). Taking determinants, det(M) squared equals |G|^|G| times plus or minus 1. So the squared
    determinant is plus or minus |G|^|G|.

