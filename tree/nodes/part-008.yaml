- id: f-p-col-anti-c
  title: The big column product splits off one factor that commutes with a swap
  kind: step
  status: explained
  chunk: c0665
  plain: 'Here the operators x_1, x_2, … commute with each other, and swapping neighbours i and j obeys
    a commutation rule with a "+1" correction. The file shows that the large product over all same-column
    pairs can be written as (x_i minus x_j plus 1) times a remainder R, where R commutes with the swap.
    The idea is to pair up the remaining factors: each pair of factors turns out to be symmetric under
    the swap, so the swap passes through them. Because everything lives in a commuting family, the product
    can be reordered freely, and that makes the pairing legal.

    '
