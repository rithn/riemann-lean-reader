  chunk: c0680
  plain: 'This file proves rules for derivatives of formal power series (infinite polynomials with no
    convergence needed). Substituting series into a series commutes with sums and constants. Mixed partial
    derivatives commute. The chain rule holds: the derivative of f(a(x)) is the sum of (derivative of
    f) evaluated at a, times the derivative of a. Differentiating the term x^α gives α·x^(α−1), so a series
    is fixed by its derivatives plus its coefficients in the undifferentiated variables. Over the rationals,
    a family of series that satisfy the symmetry rule is the derivative of a unique series with no such
