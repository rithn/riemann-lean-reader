    power of a module is the space of oriented parallelograms spanned by D of its vectors. If you extend
    the scalars (say from whole numbers to fractions), the wedge power of the extended module is just
    the extended wedge power. The proof builds a map out of the extended wedge algebra, then shows it
    has an inverse. The file then defines a "free generator" (one element that spans a rank-one module
    without redundancy) and shows étale ring maps, which add no branching, keep free generators of top-degree
    differential forms. It also records how such a form rescales by a determinant.

