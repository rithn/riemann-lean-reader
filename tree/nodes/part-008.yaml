- id: f-basechange-projector-idempotent-action
  title: Proof of the restricted Hopf order approximation claim
  kind: step
  status: explained
  chunk: c0663
  orphan: true
  plain: 'This file proves the claim named "restricted Hopf order approximation", which another file only
    states. It does so from the axioms of a "Hodge-Tate datum" (a bundle of matrices and function spaces
    over p-adic rings with compatibility rules). Those axioms are hypotheses, not claims to be proved.
    The goal is to find a function in a certain algebra that approximates a given linear function modulo
    p. There are two cases. If the target''s valuation is small compared with p, the prime must be 2,
    and an explicit combination is built using binary digits. Otherwise the approximation is assembled
    from the datum''s own approximation property, row by row, using orthogonal idempotents (projectors
    that kill one another).

    '
