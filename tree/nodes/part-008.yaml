    absolute values of a vector, and a single entry''s square is at most the whole sum. Second, for an
    upper (or lower) triangular matrix and a vector that vanishes beyond one position, the product''s
    entry at that position is just diagonal entry times vector entry; and the inverse of an upper triangular
    matrix is upper triangular with reciprocal diagonal. Third, any difference s_i − s_j is at most the
    sum of absolute consecutive differences |s_a − s_(a+1)|, a telescoping bound.

