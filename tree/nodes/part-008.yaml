    is integrally closed. The proof is by induction on dimension. Pick x in the maximal ideal but not
    its square; modding out by x leaves a regular ring, so x is prime. It suffices to check the ring with
    x inverted. There, a height-one prime is locally principal by induction, so projective, and Serre''s
