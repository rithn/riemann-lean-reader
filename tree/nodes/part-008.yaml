- id: f-p-young
  title: 'Young symmetriser: vanishing of a combined sum forces vanishing'
  kind: step
  status: explained
  chunk: c0699
  orphan: true
  plain: 'This file proves the "Young" claim about filled-in diagrams (Young tableaux) and tensors. A
    tableau fills boxes with column labels and row numbers. The column-antisymmetrisation of a tensor
    adds up all rearrangements within columns, each weighted by its sign (plus or minus one). The file
    shows that applying a second, paired rearrangement to such an antisymmetrised tensor just multiplies
    it by a whole number, which it proves is positive. So if the paired expression is zero, the antisymmetrised
    tensor must itself be zero. The positivity is supplied by the companion file and the bookkeeping of
    signs by another.

