    y of q) is a discrete valuation ring, a ring where every nonzero element is a unit times a power of
    one special element. That element is x minus 1. The proof shows: the ring is finite over the base
    DVR; x minus 1 divides p; every maximal ideal contains it, because in characteristic p the identity
    x^(p^n)=1 forces x=1; it is not nilpotent; and the quotient by it is a field, because Y^N minus the
    variable is irreducible by Eisenstein''s criterion. Then a standard test gives the DVR property.

