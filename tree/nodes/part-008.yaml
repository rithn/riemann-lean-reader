- id: f-p-col-anti-a
  title: A product of linear factors has degree equal to the number of equal-column pairs
  kind: step
  status: explained
  chunk: c0665
  plain: 'This file is a bookkeeping proof about "degree", meaning how many basic operators are multiplied
    together (like the degree of a polynomial). It shows degrees add when you multiply, that sums of same-degree
    pieces keep that degree, and that each factor "x_i minus x_j plus 1" has degree 1. Put together, the
    big product that runs over all pairs of positions sharing a column has degree exactly equal to the
    number of such pairs. For example, a column pattern with three pairs of equal entries gives a product
    of degree 3. The proof is by induction on the number of factors.

    '
