- id: f-rigidified-of-chart
  title: A line bundle pulled back into one chart has a generating section
  kind: step
  status: explained
  chunk: c0664
  orphan: true
  plain: 'A line bundle (a locally rank-one family of lines) can be described by gluing data. There is
    an open cover U_i, and between any two charts a nowhere-zero function g(i,j) satisfying a cocycle
    rule g(i,j)g(j,k) = g(i,k). This file proves that if a map f from Y to X lands entirely inside one
    chart U_i, then the pulled-back bundle has a generating section, one that is nonzero everywhere. The
    section is the transition function g(j,i) pulled back. The cocycle rule, pulled back, shows it is
    compatible across charts. Supporting lemmas check that restricting and pulling back functions commute.

    '
