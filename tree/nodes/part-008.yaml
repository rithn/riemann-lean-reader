  orphan: true
  plain: 'This file proves the two claims stated in the companion file. First: the rotation of q slots
    is a single cycle. Second: for odd q, any one-cycle shuffle is a conjugate of the rotation (the same
    cycle up to relabelling), and relabelling only multiplies the alternating form by the sign of the
    relabelling. Reversing the order turns the rotation into its inverse, which conjugates the complex
