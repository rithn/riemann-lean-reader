- id: f-p-col-anti
  title: Column swaps flip the sign, so the value is a multiple of the alternating sum
  kind: step
  status: explained
  chunk: c0665
  orphan: true
  plain: 'This file proves a claim about gl(n) operators, but only on the assumption of three other stated
    claims (tensor relations, commutation, and a height/degree bound). The setting is a linear map that
    eats a tuple of vectors. "Antisymmetric" means swapping two entries flips the sign. The proof shows
    that swapping two entries in the same column of a pattern flips the sign: neighbouring swaps first,
    then any swap built from neighbouring ones. Next it shows that patterns off the reference arrangement
    give zero. So the map equals one constant times the alternating sum over column rearrangements.

    '
