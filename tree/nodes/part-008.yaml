- id: f-torus-extension-points
  title: Points of an extension of an abelian scheme, with four stated claims
  kind: step
  status: explained
  chunk: c0661
  orphan: true
  plain: 'Mostly definitions and four claims that are stated but not proved. The definitions repeat the
    idea of a "point" (a base point of an abelian scheme plus compatible line-bundle sections) over a
    test scheme T. They add a family of reference sections on an open piece U of the base, which is called
    psi-extension, and "iota" points built from characters. A small proved lemma shows that points over
    a field''s test scheme are the same as the field version of the data. The stated claims say that such
    psi-extensions are unique and exist on a largest open set, that iota points exist uniquely, and that
    restricting points to a field is compatible with addition and repeated addition.

    '
