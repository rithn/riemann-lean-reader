- id: f-adelic-g-l2-ext-of-local-components
  title: Pulling back a group scheme keeps it a group pullback
  kind: step
  status: explained
  chunk: c0662
  orphan: true
  plain: 'Take a group scheme G over a base S and a map f from S'' to S. The file shows that the pulled-back
    group over S'' fits the definition of a "group pullback" of G along f. The key technical lemma, despite
    its name, says two maps into the product G×G are equal when they are equal after each of the two projections.
    With that, the file checks that the pullback maps commute with projections, multiplication, the unit,
    and swapping the two factors. These checks are all diagram-chasing: each equality is reduced to the
    two coordinate maps and verified there.

    '
