- id: f-jacobi-minor-proofs--le-iff-lt-col-height
  title: Column heights change by at most one on a horizontal strip step
  kind: step
  status: explained
  chunk: c0668
  plain: 'A weakly decreasing list of integers can be drawn like a staircase. The "column height" at c
    counts how many entries are at least c. The file proves the basic equivalence: c is at most the m-th
    entry exactly when m is below that height. It then shows that, when one list is obtained from another
    by adding a horizontal strip of b boxes, each column height rises by 0 or 1 and exactly b columns
    change. Finally it shows each step of a path of such lists changes finitely many columns, and the
    product of step polynomials has the expected degree in the variables of each step.

