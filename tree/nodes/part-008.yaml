  kind: step
  status: explained
  chunk: c0666
  orphan: true
  plain: 'Take a one-dimensional complex space, sitting inside g-tuples of complex numbers with g = 1,
    spanned by a nonzero vector w. Take a discrete set of integer combinations (a lattice) that spans
    it over the real numbers. The file shows there are two complex numbers, linearly independent over
    the reals, whose integer combinations are exactly the multiples z with z·w in the lattice. So it is
