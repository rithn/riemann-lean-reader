  title: Rational turns give roots of unity in any algebraic closure
  kind: step
  status: explained
  chunk: c0638
  plain: 'This file proves that the complex number e^(2πi·x), for x rational, behaves like a root of unity
    inside any algebraic closure of the rationals, Ω, that comes with an embedding ε into the complex
    numbers. Writing x = a/n, the number satisfies z^n = 1, so it is algebraic. Every algebraic complex
    number lies in the image of ε. The proof counts roots of its minimal polynomial. So one can pick a
    preimage, call it eOm(x). It satisfies eOm(x+y) = eOm(x)·eOm(y), and eOm(1/N) is a primitive N-th
    root of unity, meaning its powers cycle through exactly N values.

