- id: f-x-two-dvd-of-restrict-third-zero
  title: Proof of Wronskian uniqueness for three-variable series
  kind: step
  status: explained
  chunk: c0650
  orphan: true
  plain: 'This file proves the two uniqueness lemmas stated in the previous entry. First, a series that
    vanishes on the slice x2 = 0 is divisible by x2. Then comes the Wronskian lemma. Suppose Q·∂B = B·∂Q
    and Q vanishes on the slice, with B not vanishing there. Divide Q by x2 repeatedly. Each division
    gives a factor of (m+1), non-zero in characteristic 0, so Q is divisible by every power of x2. Hence
    Q = 0. A "shear" change of variables x1 → x1 − x2 then gives the second lemma, with the help of the
    chain rule.

    '
