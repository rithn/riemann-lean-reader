  kind: step
  status: explained
  chunk: c0638
  orphan: true
  plain: 'This file proves that a Galois symmetry s of the algebraic closure of Q sends the root of unity
    ζ = e^(2πi/N) to a power ζ^d. The exponent d, taken mod N, is a unit, meaning it has an inverse mod
    N. For example mod 7, d could be 3 but not 7. The reason is that s keeps ζ a primitive root, so d
    must share no factor with N. Any complex-number symmetry g that agrees with s then acts on the N-th
