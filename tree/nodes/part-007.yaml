    polynomial equation with coefficients in E. The result: if the automorphisms of ℂ that fix E send
    x to only finitely many values, then x is algebraic over E. The proof is by contradiction. If x were
    transcendental, one could build, for each natural number k, an automorphism of ℂ over E sending x
    to x + k. These images are all different, so the orbit would be infinite. The construction extends
    x to a transcendence basis of ℂ over E and shifts that one basis element.

