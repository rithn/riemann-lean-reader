- id: f-scattering-limits--ae-integral
  title: An integral of functions, evaluated pointwise, almost everywhere
  kind: step
  status: explained
  chunk: c0627
  plain: 'A technical fact about functions on the real line. Suppose for each t we have a square-integrable
    function G(t) (an element of L², where functions equal almost everywhere count as the same). Suppose
    G(t)(x) agrees almost everywhere with a jointly defined g(t, x), and the integral of G over t exists.
    Then the integral of G, evaluated at x, equals the ordinary integral over t of g(t, x), for almost
    every x. In plain terms, "integrate first, then evaluate" equals "evaluate first, then integrate",
    except on a negligible set of x. The proof tests both sides against indicator functions of intervals
    and uses Fubini (swapping the order of integration).

