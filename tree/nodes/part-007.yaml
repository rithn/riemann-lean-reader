- id: f-commutative-algebra--co-quot
  title: A quotient of a complete local ring is again one
  kind: step
  status: explained
  chunk: c0602
  plain: 'Take a complete local ring (limits of ever-closer approximations exist, and there is one ideal
    of small elements) and map it onto a nonzero ring. This file proves the target is again complete and
    local. The idea: given approximations downstairs, lift them one step at a time to approximations upstairs,
