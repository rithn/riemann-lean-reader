    algebra B is a finitely generated O-module. The integral closure is the set of elements of B satisfying
    monic equations over O. The idea is the classical dual-basis trick. Pick a basis of B made of integral
    elements. The trace form is non-degenerate because B is separable, so it has a dual basis. Any integral
