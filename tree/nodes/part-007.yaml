- id: f-norm-add-le-one
  title: Sums and products of "size at most 1" numbers stay that size; the curve series has integral coefficients
  kind: step
  status: explained
  chunk: c0545
  plain: 'In the p-adic setting, the size of a sum is at most the larger of the two sizes. So the sum
    of two numbers of size at most 1 still has size at most 1. This extends to coefficients of products
    of series. The main use: the series wq defined by an equation from the elliptic curve Weierstrass
    coefficients (all of size at most 1) has coefficients of size at most 1. The proof goes degree by
    degree. Each coefficient is computed from earlier ones using only sums and products with integral
    numbers.

    '
