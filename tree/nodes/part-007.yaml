- id: f-lattice-slopes-proofs--covol-eq-gram
  title: Cell volume does not depend on the chosen basis
  kind: step
  status: explained
  chunk: c0597
  plain: 'Proves that the covolume of a lattice (the volume of one cell) comes out the same whichever
    basis you use to compute it. Picture a floor tiled by parallelograms: the tile''s area does not change
    if you describe the same grid with different edge vectors. Here the volume is the square root of the
    Gram determinant, a number built from all the dot products between the basis vectors. Idea of proof:
    two bases of one lattice differ by a whole-number matrix whose inverse is also whole-number, so its
    determinant is 1 or minus 1. The Gram matrix changes by that matrix on both sides, and squaring removes
    the sign.

    '
