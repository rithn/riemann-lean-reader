    integral of e^(zt)κ(t) over t) obeys |symbol(1 + iy)| ≤ K/(1 + |y|) along the line where the real
    part is 1. Then the function kv(e) has a weighted L² norm bounded by K/√3 times |e|, where the weight
    is exponentially decaying (e^(−2x)). The proof multiplies by e^t, which turns the symbol into a Fourier
    transform on the line. Plancherel''s identity (the Fourier transform preserves L² size) is applied.
    Then the pointwise decay bound is integrated, using ∫ 1/(1 + |y|)² dy = 2 and 1/π ≤ 1/3.

