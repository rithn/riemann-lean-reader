- id: f-monic-root-norm-le-one-add-sum
  title: Size bound for roots of a monic polynomial
  kind: step
  status: explained
  chunk: c0550
  orphan: true
  plain: 'If y is a root of a monic polynomial (leading coefficient 1) with complex coefficients, then
    the size of y is at most 1 plus the sum of the sizes of the other coefficients. Example: y squared
    minus 3y plus 2 has roots 1 and 2, and the bound gives 1 plus 3 plus 2, which is 6, far above both.
    Proof: if y has size at most 1 there is nothing to show. Otherwise move the leading term across and
    use the triangle inequality. Each lower power of y is at most the (n minus 1)th power of its size,
    so the size of y is at most the coefficient sum.

    '
  lean:
  - Development/AbelianVarietyTheory/Proofs/FoundationProofs/MonicRootNormLeOneAddSum.lean:13
  mathlib:
  - norm_sum_le
  - pow_le_pow_right₀
  needs:
  - polynomials
  - complex-numbers
- id: f-upper-half-plane-eq-zero-of-vanish-above-im
  title: A holomorphic function vanishing high up is zero
  kind: step
  status: explained
  chunk: c0551
  orphan: true
  plain: 'Let f be complex-differentiable on the upper half-plane. If f is zero at every point whose imaginary
    part (height) exceeds some bound C, then f is zero everywhere. This is the identity theorem. A holomorphic
    function that vanishes on a small open patch of a connected region must vanish on all of it. Proof:
    pick a point above height C, check f vanishes on a neighbourhood of it, and note the upper half-plane
    is open and connected (it is convex). Then the identity theorem for analytic functions gives zero
    everywhere.

    '
