    form a transitive relation (if p reaches q and q reaches s, then p reaches s). On the first block
    it is also antisymmetric, shown by giving each index a rank that strictly increases along an allowed
    step. Matrices with non-zero entries only at allowed positions then form an algebra, closed under
    multiplication, and the diagonal of a product is the product of diagonals on that block. Inverses
