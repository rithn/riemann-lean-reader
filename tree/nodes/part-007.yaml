  kind: step
  status: explained
  chunk: c0627
  plain: 'On the real line, the Fourier transform can be defined in two ways. For an integrable function
    it is the usual integral ∫ e^(−2πixξ) u(x) dx. For a square-integrable function, it is defined by
    a limiting process so that it preserves L² length (Plancherel). If a function is both integrable and
    square-integrable, this file proves the two definitions agree for almost every ξ. The proof tests
    both against smooth, compactly supported test functions, uses the "multiplication formula" (a transform
    moves from one factor to the other), and concludes by the fact that locally integrable functions with
