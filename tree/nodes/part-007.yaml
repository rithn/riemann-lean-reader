  kind: step
  status: explained
  chunk: c0553
  plain: 'A box of small facts used by the transfer proof. First, if a polynomial combination of vectors
    (coefficients are powers of u) vanishes for infinitely many numbers u, every vector is zero. A nonzero
    polynomial has only finitely many roots. Second, a mix of sums and products of operators stays inside
