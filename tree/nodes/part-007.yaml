- id: f-map-eq-self-of-iterate
  title: Haar measure is unchanged by an automorphism of finite order
  kind: step
  status: explained
  chunk: c0632
  plain: 'The main result, in any locally compact group: a continuous group automorphism ψ with ψ applied
    N times equal to the identity leaves a Haar measure unchanged. Haar measures are unique up to a positive
    scalar, so ψ scales the measure by some constant c, and N times gives c^N = 1. Looking at a compact
    neighbourhood of the identity (positive, finite measure) gives c^N = 1 with c ≥ 0, so c = 1. Around
    it are tools for matrices: reindexing the rows and columns of a unitary-group matrix by a permutation
    gives a group isomorphism φ. Two such relabellings give the same pushed-forward measure, because their
    ratio is a finite-order permutation.

