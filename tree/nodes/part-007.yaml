- id: f-cls-gain-a
  title: Hermitian inputs, analyticity and the Cayley operator
  kind: step
  status: explained
  chunk: c0589
  plain: 'A grab-bag of supporting facts. First, if H is Hermitian (equal to its conjugate transpose),
    the matrices 1 - i·s·H and 1 + i·s·H are invertible. If (1 - i·s·H)v = 0, then v = i·s·Hv, and pairing
    with v gives a positive number equal to something purely imaginary, which is impossible. So a region
    where the needed determinants are non-zero is open and contains all Hermitian matrices. On that region
    the entries, determinant, inverse and weight are analytic. Finally, a determinant-shaped mix of derivatives
    agrees with the same mix on analytic extensions, so repeated applications match.

    '
