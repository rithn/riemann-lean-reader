- id: f-foundation-proofs--exists-root-ball-of-analytic-order-dvd
  title: m-th roots of holomorphic functions on a disc
  kind: step
  status: explained
  chunk: c0549
  plain: 'Given a function holomorphic on a closed disc whose zeros all have order divisible by m, builds
    a holomorphic m-th root on the open disc. Step one handles a function g with no zeros. Since a disc
    has no holes, g''/g has an antiderivative L, and g equals exp(L). Then exp(L/m) is an m-th root. Step
    two is the general case. The closed disc holds only finitely many zeros. The product of (z minus u)
    to the power order/m over those zeros accounts for them, and what remains has no zeros, so step one
    applies.

