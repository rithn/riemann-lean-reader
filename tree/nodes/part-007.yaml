- id: f-hahn-series-subring-coeff-mul-inv-mem
  title: Hahn series with coefficients in a subring stay that way under products and inverses
  kind: step
  status: explained
  chunk: c0590
  orphan: true
  plain: 'A Hahn series is like a power series, but the exponents may be any rational numbers, as long
    as they never pile up downwards. Take a field and a subring A inside it, for instance the integers
    inside the rationals. The file proves two things. If two Hahn series have all coefficients in A, so
    does their product. And if a Hahn series has coefficients in A and the inverse of its leading coefficient
    is also in A, its inverse again has all coefficients in A. Products are easy, since each coefficient
    is a finite sum of products of coefficients. For inverses, the series is treated as a series over
    A, where a unit leading coefficient makes it invertible, and the inverse is unique.

    '
