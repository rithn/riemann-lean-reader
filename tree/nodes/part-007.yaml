- id: f-lattice-slopes-proofs--gram-det-le
  title: Stretching lengths by C stretches volume by at most C to the n
  kind: step
  status: explained
  chunk: c0597
  plain: 'Proves a determinant comparison. Take two lists v and w of n vectors. If every combination of
    the w''s is at most C times as long as the same combination of the v''s, then the Gram determinant
    of w is at most C to the power 2n times that of v. The Gram determinant is the squared n-dimensional
    volume of the box the vectors span. Idea: the rule that sends a combination of v''s to the same combination
    of w''s is a linear map stretching lengths by at most C, so it stretches n-dimensional volume by at
    most C to the n; then square. If the v''s are dependent, so are the w''s, and both sides are zero.

    '
