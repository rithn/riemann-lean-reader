    the entries and no complex conjugates of entries integrates to zero. Idea: multiply every entry by
    the unit complex number zeta = e^(i*pi/N), where N is the degree. Lebesgue measure, the Gaussian weight
    and the Gram matrix are unchanged, but the monomial gets multiplied by zeta^N = -1. So the integral
    equals minus itself, hence zero.

