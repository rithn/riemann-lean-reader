- id: f-homogeneous-ideals--pow-le-comap-map-pow
  title: A ring map from a ring extends to its adic completion
  kind: step
  status: explained
  chunk: c0660
  plain: 'Take a ring A, an ideal I, and a ring map f from A to a ring B. Suppose B is complete in the
    sense that sequences that approximately agree modulo ever higher powers of I·B have limits. The file
    proves that f extends to a ring map out of the completion of A (the ring of compatible approximations
    modulo I, I², I³, and so on). The idea is to define the extension one level at a time. At level n,
    map to B modulo (I·B)^n. These pieces fit together, and completeness of B glues them into one map.
    The small lemma that I^n maps into (I·B)^n makes each level well defined.

    '
