  kind: step
  status: explained
  chunk: c0563
  orphan: true
  plain: 'For a holomorphic family with a rich chart system, two period maps (additive maps from the lattice
    to holomorphic functions on the base) that give the same class in the one-dimensional cohomology must
    be equal. If the classes agree, the two cocycles differ by a coboundary G. G is compatible with degree-zero
    maps, so it comes from a single base function p. Then the difference of the period maps becomes zero
    on composable charts, and the vanishing result gives that the two period maps are equal.

    '
