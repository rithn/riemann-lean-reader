- id: f-mem-of-test-ideal
  title: Test-point membership for a rank-one lattice in the field itself
  kind: step
  status: explained
  chunk: c0660
  orphan: true
  plain: 'This is the rank-one version of the test-point criterion. Let L be a locally free lattice of
    rank one inside the field Ω, and let v be an element of Ω. If some power of p times v lies in L, and
    the image of v lies in the span of L''s image at each test point, then v is in L. The proof reduces
    to the general theorem by identifying Ω with one-coordinate vectors. It checks that this identification
    keeps local freeness, and that the membership tests correspond. No new mathematical idea is needed
    beyond the general result.

    '
