- id: f-x-ha-lattice
  title: Membership in a lattice can be checked at test points
  kind: step
  status: explained
  chunk: c0660
  plain: 'Let R be a Noetherian, integrally closed ring (a "normal" ring) with fraction field Ω, and L
    a locally free lattice of vectors over R. The main result says a vector v belongs to L as soon as
    two conditions hold. Some power of p times v lies in L, and the image of v in every complete valued
    field C at a "test point" lies in the span of the image of L. Idea. Reduce to single coordinates using
    the previous file. Then a function lies in R if it lies in R localized at each height-one prime, which
    is a discrete valuation ring. For such rings test points exist, giving the claim. Primes not dividing
    p are handled by inverting p.

    '
