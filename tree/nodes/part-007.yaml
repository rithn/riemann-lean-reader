- id: f-perron-l-of
  title: From the truncated Perron bound to the log-derivative line integral
  kind: step
  status: explained
  chunk: c0546
  plain: 'This proves that a Perron-type bound with truncation implies a version for the von Mangoldt
    sum twisted by a Dirichlet character. The von Mangoldt function is the weight log p on prime powers.
    For real part above 1, the L-series of these twisted weights equals minus the logarithmic derivative
    of the L-function. So the abstract bound, applied to those weights (size at most Lambda(n) since a
    character has size at most 1), becomes a statement about that log derivative on a vertical line. The
    remaining work is comparing logarithms of u, N and T.

    '
