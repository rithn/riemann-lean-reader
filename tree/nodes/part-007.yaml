- id: f-cubic-charpoly-discriminant
  title: Characteristic polynomial of δ·θ(δ) has the form (X−1)(X²−τX+1), discriminant negative
  kind: step
  status: explained
  chunk: c0566
  plain: 'This file proves the claim "TauEx". Take a 3×3 unitary matrix δ and set M = δ·θ(δ), where θ
    conjugates all entries. Then M is also unitary with determinant 1 and a real trace, and its characteristic
    polynomial factors as (X − 1)(X² − τX + 1) for a number τ in the base field. If τ² − 4 is nonzero,
    then at every real embedding it is strictly negative. Proof of the sign: if τ² − 4 were positive,
    X² − τX + 1 would have a real root r. Unitary matrices only have eigenvalues of size 1, so r² = 1,
    forcing τ = 2 and τ² − 4 = 0, a contradiction.

    '
