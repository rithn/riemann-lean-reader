- id: f-formal-group-log-proofs--chain-rule
  title: Chain rule for substituting power series
  kind: step
  status: explained
  chunk: c0650
  plain: 'This file proves the chain rule for many-variable formal power series. If f is a series in variables
    x_j and we substitute series a_j (with zero constant term) for them, the partial derivative of the
    result in variable i is the sum over j of (∂f/∂x_j with the substitution) times ∂a_j/∂i. Formal power
    series have no limits. So the proof truncates everything at a fixed degree, where each series becomes
    a polynomial. It checks the rule for polynomials by induction. It also shows the two sides agree on
    all low-degree coefficients, which is all that is needed.

    '
