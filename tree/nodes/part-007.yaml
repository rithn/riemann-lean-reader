  plain: 'The highest-weight vector is a product of powers of leading minors, where the s-th minor is
    raised to the gap nu_s minus nu_(s+1). This file proves it lies in the dual Weyl module of weight
    nu, for nonincreasing nu. Each minor power is in the module with the matching weight, so the product
    is, with total weight the sum. A telescoping-sum lemma shows these weights add up to exactly nu: the
