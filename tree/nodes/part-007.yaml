  kind: step
  status: explained
  chunk: c0596
  plain: 'The file is named after a small identity, but its main result is a Jensen-style estimate. Let
    f be analytic on the closed unit disc with |f| ≤ M and f(0) ≠ 0. For a radius R < 1, f has finitely
    many zeros in that smaller disc, and their number is at most a constant times 1 + log(M/|f(0)|). Also,
    f''/f minus the sum of 1/(z - w) over those zeros is bounded by the same quantity for |z| ≤ r < R.
