- id: f-eigenvalue-square
  title: A real eigenvalue of a 3×3 unitary matrix is ±1
  kind: step
  status: explained
  chunk: c0566
  plain: 'Take a 3×3 complex matrix A that preserves lengths (a unitary matrix: its conjugate-transpose
    times A is the identity). If a real number r is a root of A''s characteristic polynomial, i.e. an
    eigenvalue, then r² = 1, so r is 1 or −1. Proof: pick an eigenvector v with A·v = r·v. Because A preserves
    lengths, the length of A·v equals the length of v. But the length of r·v is |r| times the length of
    v. So |r| = 1, and since r is real, r² = 1.

    '
