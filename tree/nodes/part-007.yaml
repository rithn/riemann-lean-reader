- id: f-row-form-permutation-split--permuted-row-product-split
  title: The double sum does not depend on the order of the shifts
  kind: step
  status: explained
  chunk: c0558
  plain: 'Proves the third double-sum claim: permuting the list of shifts leaves the double sum unchanged.
    Any permutation is a product of swaps of adjacent positions, so it is enough to treat one swap. For
    a swap, the difference of the two orderings of a product comes from the commutator of two neighbouring
    generators, which the defining relations of gl(n) turn into a simple expression. Then reindexing both
    permutations by the same swap shows the two resulting sums cancel. The general case follows by induction
    on products of swaps.

    '
