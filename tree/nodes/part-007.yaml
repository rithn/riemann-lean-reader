  plain: 'Proves that the row-division operators (the divided-power versions of row mixing) keep a polynomial
    inside the dual Weyl module. Two facts are needed. Weighted homogeneity survives: after substituting
    x plus t times another variable in a row, the coefficient of each power of t has the same weight.
