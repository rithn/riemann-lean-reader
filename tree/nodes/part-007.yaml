- id: f-rect-inv
  title: Integral of 1 over (s - w) along a vertical line is a difference of logs
  kind: step
  status: explained
  chunk: c0546
  plain: 'One calculus fact. Take a vertical line at real part b, with a point w to its left. Then i times
    the integral of 1 / (s - w) along the line, from height c to d, equals log of the top endpoint minus
    w, minus log of the bottom endpoint minus w. The reason: the complex logarithm is a well-defined antiderivative
    of 1 / z on the right half plane, and the line stays there. So the fundamental theorem of calculus
    applies.

    '
