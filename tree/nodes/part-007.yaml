    on the line), consider the bump supported on (0,1). The theorem has two parts. First, if the image
    of a bump with value e at one end is a coboundary, then e = 0. Second, if a linear map N matches the
    bump at the other end to the bump with value N(w) at the first end, up to a coboundary, then N preserves
