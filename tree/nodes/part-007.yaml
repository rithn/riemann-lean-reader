    the points can be followed smoothly, so the discriminant is a product of holomorphic pieces. Where
    the fibre has fewer points, two of the N nearby points must crowd together, so one factor shrinks
    to zero and the discriminant tends to zero. That gives continuity everywhere. A compactness argument
