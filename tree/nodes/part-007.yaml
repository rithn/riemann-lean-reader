- id: f-lattice-slopes-proofs--deg-quot
  title: Degree adds up in a lattice and its quotient
  kind: step
  status: explained
  chunk: c0597
  plain: 'Proves the quotient rule for lattices. Let N be a saturated sublattice of L, and project L onto
    the directions perpendicular to N to get a lattice Q. Then Q is discrete, its rank is rank L minus
    rank N, and the degree of L equals the degree of N plus the degree of Q. Here degree is a logarithm
    of covolume, up to sign. Idea: take a basis of N and lift a basis of Q; together they form a basis
    of L. After a shear that leaves determinants unchanged, the Gram matrix splits into two blocks because
    the pieces are perpendicular. So volumes multiply and logs add, like base times height.

