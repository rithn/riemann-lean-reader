- id: f-length-add-monoid-hom-finite-group-fraction-quotient-le
  title: Counting homomorphisms from a finite group into the fraction field mod the integers
  kind: step
  status: explained
  chunk: c0592
  orphan: true
  plain: 'Take a discrete valuation ring O (for example the l-adic integers) and the quotient of its fraction
    field by O itself. The "length" of a module is the number of steps in a chain of submodules, like
    counting layers. The file proves that for a finite abelian group A, the module of group homomorphisms
    from A into that quotient has length at most the length of O mod l, times how many times l divides
    the size of A. It peels off one cyclic subgroup of prime order at a time. A prime other than l is
    a unit in O and contributes nothing; the prime l contributes at most one copy. Exact sequences add
    lengths.

