- id: f-has-q-expansion-sum-above-mul
  title: Product of two q-series is the q-series of the product
  kind: step
  status: explained
  chunk: c0564
  orphan: true
  plain: 'A q-series is a sum of terms (coefficient) times e^(2πi·r·z), where the exponents r are fractions.
    This file proves that if two functions are each given by such a series on some region, then their
    product is given by the series whose coefficients are the "convolution" of the two coefficient lists.
    Example: (1 + q)(1 + q) = 1 + 2q + q². The idea: the series converge absolutely, so the double sum
    can be multiplied out and regrouped by total exponent r + s. For each total exponent only finitely
    many pairs contribute (the exponents come from well-ordered sets), and e^(a)·e^(b) = e^(a+b) makes
    the exponentials line up. I am inferring the exact meaning of the series predicate from its use here.

    '
