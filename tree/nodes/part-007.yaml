- id: f-homogeneous-ideals--exists-absolute-value-of-is-discrete-valuation-ring
  title: Embedding a discretely valued field into a complete algebraically closed one
  kind: step
  status: explained
  chunk: c0660
  plain: 'A discrete valuation ring V has one prime element and a fraction field K. Given an element a
    in the maximal ideal and a number r between 0 and 1, the main result gives a complete, algebraically
    closed field C with an ultrametric norm (a strange size where the sum of two elements is never bigger
    than the larger one). K sits inside C so that the unit ball of C meets K exactly in V, and a has norm
    r. There is also a version where p-adic numbers sit inside C isometrically. Supporting results describe
    the unit ball of such a C. It is local, has Krull dimension 1, is Henselian (roots lift from the residue
    field), and has an algebraically closed residue field.

    '
