- id: f-perron-kernel-b
  title: The Perron kernel is the step function, up to an error
  kind: step
  status: explained
  chunk: c0546
  plain: 'Perron''s formula is the idea that a vertical-line integral of y^s / s, divided by 2 pi i, acts
    like a switch: about 1 if y is at least 1 and about 0 if y is below 1. Here it is checked with an
    explicit error. The error at most y^c times a bound, and when the line is long compared to |log y|
    it is at most y^c / (T |log y|). The proof has three cases: log y negative, zero and positive. For
    small T times |log y| it uses a direct bound: split off the 1/s part, whose integral is at most pi,
    and the remainder.

    '
  lean:
  - Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ExplicitFormula/PerronKernelB.lean:92
  mathlib:
