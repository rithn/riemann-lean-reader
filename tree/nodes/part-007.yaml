- id: f-shimura-varieties--is-open-of-mem-irreducible-components-of-finite
  title: Normal schemes and their pieces
  kind: step
  status: explained
  chunk: c0614
  plain: 'Defines a "normal scheme": a shape where, at every point, the ring of local functions has no
    zero divisors and is integrally closed (any fraction that solves a monic equation over the ring already
    lies in it). Then proves a long list of consequences. Open parts and open covers of normal schemes
    are normal. The affine case reduces to a ring condition, so the integers are normal and Z/4 is not.
    The normalisation of a normal scheme is normal. Finally, if there are finitely many irreducible components
    (pieces that cannot be split into two smaller closed pieces), each one is open and closed, because
    two components never meet. The scheme is then a disjoint union of integral pieces.

    '
