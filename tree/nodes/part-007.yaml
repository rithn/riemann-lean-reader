- id: f-algebra-proofs--exists-uniform-denominator
  title: Denominators on a locally free lattice are uniformly bounded
  kind: step
  status: explained
  chunk: c0660
  plain: 'A "locally free lattice" is a collection of vectors that, after dividing by finitely many elements
    generating the unit ideal, looks like integer combinations of a basis. Two facts are proved. First,
    a vector v belongs to the lattice L whenever each of f1,...,fk times v eventually does and the f''s
    generate the whole ring. Second, if a linear functional ψ has bounded denominators g^n on each lattice
    element, a single power g^m works for all lattice elements. The proof uses a local basis and the fact
    that finitely many exponents have a maximum. Together they show a vector lies in L when every functional
    that is integral on L is integral on it.

    '
  lean:
