- id: f-additive-character-sum-orthogonality
  title: Orthogonality of an additive character over a finite field
  kind: step
  status: explained
  chunk: c0631
  orphan: true
  plain: 'A finite field K, such as the integers mod a prime, has additive characters: rules ψ that turn
    addition into multiplication, ψ(a + b) = ψ(a)ψ(b), with values that are complex numbers of size 1.
    Take a non-trivial one. The result: sum the inverse of ψ(r₁x₁ + … + r_jx_j) over all vectors r in
    K^j. You get |K|^j if the vector x is zero, and 0 otherwise. First do one coordinate: if x ≠ 0, then
    t ↦ tx runs over all of K, and the sum of a non-trivial character over a group is 0. Then the j-fold
    sum factors as a product, and one zero coordinate kills the product.

