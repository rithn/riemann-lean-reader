- id: f-lattice-slopes-proofs--covol-pos
  title: Cell volume is positive
  kind: step
  status: explained
  chunk: c0597
  plain: 'Proves basic facts about covolume. For a discrete lattice (one whose points are isolated, so
    a small ball around any lattice point contains no other), the basis vectors are linearly independent
    over the reals. Then the Gram matrix is positive definite, meaning its quadratic form is always positive,
    so its determinant is positive and the covolume is strictly positive. Also shown: the zero lattice
    has covolume 1, and a lattice generated by one nonzero vector has covolume equal to that vector''s
    length. The independence step uses a standard fact that a discrete lattice has as many generators
    as the real dimension of its span.

