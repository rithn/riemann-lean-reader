- id: f-perron-kernel-a
  title: The Perron kernel and its contour integrals around zero
  kind: step
  status: explained
  chunk: c0546
  plain: 'The kernel here is e^(l s) / s, with l = log y. The file proves several facts about integrating
    it over vertical lines. If l is negative (y below 1), the integral over a vertical line segment is
    small, at most 2 e^(l c) / (|l| T). If l is positive, the integral is close to 2 pi, with error of
    the same size. The proof closes a rectangle: by Cauchy''s theorem the integral over a rectangle is
    zero if it avoids s = 0, and 2 pi i if it encloses s = 0. The far side is shown to be tiny.

    '
