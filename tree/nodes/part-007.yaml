- id: f-loc-free-map-mk-q-iff
  title: Local freeness survives isomorphisms, scaling and quotients
  kind: step
  status: explained
  chunk: c0660
  plain: 'This file collects small stability facts for "locally free lattices" (subgroups that look like
    a free module of fixed rank after localizing). If a linear isomorphism carries one lattice to another,
    local freeness is preserved. The standard lattice of integer vectors is locally free. Scaling a lattice
    by a nonzero constant keeps it locally free. Taking the image under a quotient map is the same, whether
    you first form the quotient by the kernel or use the surjection directly. The file also checks that
    base-changing integer vectors to a bigger field gives the expected span. These are bookkeeping lemmas
    whose proofs are mostly direct unwinding of definitions.

    '
