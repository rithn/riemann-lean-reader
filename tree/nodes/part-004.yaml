- id: f-zero-factor
  title: An analytic function factors as its zeros times a nonvanishing part
  kind: step
  status: explained
  chunk: c0324
  plain: 'Let f be differentiable on a disk of radius r and not identically zero. Then inside a smaller
    closed disk of radius R1, f has finitely many zeros ρ. Each zero has a multiplicity m (how many times
    it can be divided out). And f(z) = ∏(z−ρ)^m times a function h that is differentiable on the bigger
    disk and nowhere zero on the smaller one. Finiteness: zeros of an analytic function are isolated,
    and a closed disk is compact. The factorization is by induction on the total multiplicity: divide
    out one factor (z−ρ) at a time using the slope function of f.

    '
