- id: f-coefficient-bound-membership
  title: Every coefficient of a frame-jet lies in the span of minors of the frame
  kind: step
  status: explained
  chunk: c0325
  orphan: true
  plain: 'The main theorem proves a claim named "CBMem", stated elsewhere. Take a matrix x and a matrix
    Y of unknowns. Form determinants of square pieces ("minors") of the product x·Y. Expand each determinant
    by the rule for the determinant of a product: it becomes a sum of monomials in the entries of Y, each
    multiplied by a minor of x. So each coefficient of the resulting polynomial is a combination of minors
    of x, which lie in a given vector space M. The file also proves, from a second hypothesis called "Theorem
    A Gauss", a Weyl-type version of the bound. That last result is conditional.

