- id: f-mem-reg-at-of-codim-one
  title: Being regular at a point can be checked at codimension one
  kind: step
  status: explained
  chunk: c0237
  plain: 'Setting: a nice (locally Noetherian, normal) space and a field of functions on it. A function
    a is "regular at a point p" if it makes sense there, with no pole. The theorem says: if a is regular
    at every codimension-one point that p lies in the closure of, then a is regular at p. The proof writes
    a as a fraction t over d in the coordinate ring at p. A helper lemma turns each height-one prime of
    that ring into a nearby codimension-one point. Then the lemma about codimension-one primes finishes
    the argument.

    '
