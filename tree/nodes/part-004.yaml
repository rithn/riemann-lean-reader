- id: f-is-prim-cmap
  title: Pushing a cycle along a group map gives a cycle
  kind: step
  status: explained
  chunk: c0322
  plain: 'A "cycle" in a chain complex is a chain whose boundary is zero. This file shows that if you
    move a cycle along a group homomorphism, you get a cycle again. The proof is two lines. Moving chains
    commutes with taking boundaries, so the boundary of the moved chain is the moved boundary, which is
    the moved zero, which is zero. That commuting rule is not proved here. It is one of the assumed properties
    packed into the claim named "chain", stated in another file, which this lemma takes as a hypothesis.

