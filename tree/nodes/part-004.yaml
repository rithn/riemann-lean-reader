- id: f-gamma1-cap-gamma0-level-acts-freely-upper-half-plane
  title: Level-N matrices never fix a point of the upper half-plane
  kind: step
  status: explained
  chunk: c0282
  plain: 'This file proves that, for level N at least 4, no matrix other than the identity in the level
    group fixes any point of the upper half-plane. A matrix (a b; c d) with determinant 1 sends z to (az+b)/(cz+d).
    Setting that equal to z and taking real and imaginary parts gives 4c^2 y^2 = 4 - (a+d)^2, where y
    is the height of z. If c is not 0, the trace a+d must satisfy (a+d)^2 < 4. But a and d are both 1
    modulo N, so a+d is 2 modulo N, which a small integer cannot be when N is at least 4. If c is 0, the
    matrix is the identity.

    '
