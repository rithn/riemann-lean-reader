    filtered colimits" (a colimit is a gluing-together of a growing family; filtered means any two members
    sit inside a common larger one) exactly when two element-level conditions hold for every filtered
    colimit. First, every element of the colimit comes from some stage. Second, an element that becomes
    zero in the colimit already becomes zero at some later stage. The proof uses that the forgetful functor
    to plain sets preserves such colimits, and that in sets these two conditions are exactly what a filtered
    colimit means.

