- id: f-is-unit-of-basic-open-nonempty-of-universally-closed
  title: On a connected proper space, a function nonzero somewhere is invertible everywhere
  kind: step
  status: explained
  chunk: c0296
  plain: 'A proved lemma. Let X be a connected space with a "universally closed" map to a point over a
    field (think: a compact connected curve over a field). A function a on X is called invertible at a
    point if it is nonzero there. The lemma says: if a is invertible at some point, it is invertible everywhere.
    Proof idea: such functions satisfy a polynomial equation, which gives a to the m times (u plus a times
    b) equals zero, with u invertible. At every point either a or the second factor is invertible, and
    never both, so X splits into two open pieces. Connectedness leaves only one.

