    idea: replace x_a by x_b everywhere in P to get a new polynomial. The difference between P and the
    new polynomial is always divisible by x_a minus x_b. The new polynomial vanishes on an open set of
    space, and a polynomial that is zero on an open set is zero, because a nonzero polynomial has too
    few roots to fill a box. So P is that difference.

    '
