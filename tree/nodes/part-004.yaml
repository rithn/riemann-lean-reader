- id: f-chebotarev--prime-cont
  title: The log Euler sum is continuous in s on (1, infinity)
  kind: step
  status: explained
  chunk: c0288
  plain: 'Proves that the prime-level log sum, twisted by a Dirichlet character, varies continuously with
    s for s greater than 1. Idea: pick a number a between 1 and s. Every term is continuous, and for s
    beyond a each term is at most 3/2 times (norm)^(-a), which is a convergent series. A sum of continuous
    functions bounded by a convergent series is continuous (the Weierstrass M-test). The details check
    that the logarithm is never asked to act on a number on the negative real axis, since each term has
