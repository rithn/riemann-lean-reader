- id: f-metric-constant-bound
  title: Cauchy-Binet for rectangular matrices
  kind: step
  status: explained
  chunk: c0236
  plain: 'This file proves a classical formula, Cauchy-Binet. If A is a short wide matrix (h rows, N columns)
    and B a tall thin one, then the determinant of the square product A times B equals the sum, over all
    ways to pick h columns of A in increasing order, of the minor of A times the matching minor of B.
    The proof expands one determinant as a signed sum over reorderings. It then matches pairs "chosen
    columns plus reordering" with arbitrary choices of h columns. Choices with a repeated column give
    zero, because a determinant with two equal columns vanishes.

    '
  lean:
  - Formalism/PeriodIntegrals/UnitaryGroupMassFormula/InvariantMetricIsometry/MetricConstantBound.lean:11
  mathlib:
  - Matrix.det_apply
  - Matrix.det_permute'
  - Matrix.det_zero_of_column_eq
  - Finset.orderEmbOfFin
