- id: f-st-derivation-adic-completion
  title: Claim - a derivative extends to the completion
  kind: step
  status: explained
  chunk: c0238
  plain: 'This file only states a claim; it proves nothing. A derivation is an abstract "derivative":
    an additive rule D on a ring obeying D(ab) = aD(b) + bD(a). The claim says that any derivation on
