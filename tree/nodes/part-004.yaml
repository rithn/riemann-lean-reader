- id: f-hermitian-vector-map
  title: Acting on the special vectors just changes the matrix
  kind: step
  status: explained
  chunk: c0236
  plain: 'This file proves two identities about the table of column-minors (determinants of small square
    pieces). First, applying a family of square matrices to the special vector built from some data gives
    the special vector built from the product of those matrices with the data. Second, the minor tables
    of two matrices multiply exactly like the matrices themselves. The idea: a sum over all choices of
    columns of a product of two determinants is the Cauchy-Binet formula, which says the determinant of
    a product equals that sum. One applies it block by block, and the product over blocks then splits
    out.

    '
  lean:
  - Formalism/PeriodIntegrals/UnitaryGroupMassFormula/InvariantMetricIsometry/HermitianVectorMap.lean:17
  mathlib: []
  needs:
  - f-col-choice-fintype
  - f-metric-constant-bound
