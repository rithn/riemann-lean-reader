- id: f-product-formula-haar--tr-base
  title: Local fields over a prime l, and three stated trace claims
  kind: step
  status: explained
  chunk: c0234
  orphan: true
  plain: 'This file defines a bundle: for a number field F and a prime number l, one local field for each
    prime of F lying over l, with a dense embedding of F into each. It also defines a map from the tensor
    product of the l-adic numbers with F into the product of all these local fields. It then states three
    claims, without proving them. The map is onto, the map is one-to-one, and the sum of the local traces
    of an element equals the trace over the rationals. These are the standard ingredients of "trace is
    a sum of local traces".

    '
