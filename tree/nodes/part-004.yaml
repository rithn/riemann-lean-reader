  chunk: c0324
  plain: 'Suppose f is analytic on a closed disk of radius R and has no zeros there. Suppose |f| is at
    most M·|f(z0)| on the disk. Then on the inner half-disk |f''/f| is at most 24·log M / R. The proof
    takes a "logarithm" g of f, with f = f(z0)·exp(g). Because |f| is bounded, the real part of g is at
    most log M. The Borel–Carathéodory theorem then bounds the size of g itself on a smaller disk. A Cauchy
    estimate bounds g'' = f''/f. A limit lets the slack in the log M go to zero. The file also proves
    the log exists on a disk.

    '
