- id: f-scheme-cohomology--regular-u-f-d-localization
  title: Localising a regular local ring at a prime stays regular
  kind: step
  status: explained
  chunk: c0238
  plain: 'This file proves that if a ring is regular local and p is any prime ideal, then localising at
    p (making everything outside p invertible) gives another regular local ring. The proof uses Serre''s
    theorem: the quotient by p has finite projective dimension, and this survives localising. A converse
    is proved first: a local ring whose residue field has finite projective dimension is regular. That
    converse is shown by induction, picking an element of the maximal ideal outside its square and outside
    the associated primes, and dividing by it.

    '
