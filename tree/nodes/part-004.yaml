- id: f-chebotarev--euler-lim
  title: The Euler product over all primes, and its exponential-of-logs form
  kind: step
  status: explained
  chunk: c0288
  plain: 'Pass from finite to infinite. Under the same assumptions on f, the product of 1/(1-f(q)) over
    all primes converges to the sum of f over all nonzero ideals. Proof idea: the finite products are
    sums over ideals made from the first few primes; as the set of primes grows every fixed ideal is eventually
    included, and a dominated-convergence argument (everything is bounded by the absolutely convergent
    sum) gives the limit. Taking logarithms gives the second form: the exponential of the sum of minus-log(1
    - f(q)) over primes equals the ideal sum.

