    a symmetry tau of a field E have finite order m. Tensor E with another field K of characteristic zero.
    If an element x has the property that multiplying x by its successive images under tau, m times in
    all, gives 1, then x equals z divided by tau of z for some invertible z. The idea: build a sum of
