- id: f-poly-eq-zero-of-circle
  title: The weight claim, proved by a circle trick
  kind: step
  status: explained
  chunk: c0236
  plain: 'This file proves the "hermitian weight" claim: an inner product invariant under unitary matrices
    agrees with the sum-of-squares pairing against the standard vector. The trick: use diagonal unitary
    matrices holding a number z of absolute value 1. They scale each coordinate by a power of z, so invariance
    gives a polynomial equation in z that holds on the whole unit circle. A polynomial with infinitely
    many roots is zero, so each power''s coefficient matches. Only the top power survives, giving the
    result. It also covers the empty case, where no column choices exist.

    '
