- id: f-product-formula-haar--res-char-iff
  title: Four stated claims about local fields (definitions only)
  kind: step
  status: explained
  chunk: c0234
  plain: 'Nothing is proved here. The file only states four claims as named Prop definitions, for use
    elsewhere. First, scaling by a unit on a finite-dimensional algebra over a local field stretches Haar
    volume by the modulus of its norm. Second, the Haar modulus agrees with the absolute value at a prime
    of a number field. Third, an integral element of a finite extension of the p-adic numbers has trace
    of size at most 1. Fourth, a prime of a number field lies over the prime number l exactly when l belongs
    to that prime ideal.

    '
