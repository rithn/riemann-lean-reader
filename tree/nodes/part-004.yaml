- id: f-exists-nsmul-eq-zero-of-tmul
  title: If 1⊗a is zero with real coefficients, some multiple of a is zero
  kind: step
  status: explained
  chunk: c0322
  plain: 'Let a be an element of an abelian group. Allow real coefficients, which means forming the "real
    tensor" 1⊗a. If that is zero, then a has finite order: some positive whole-number multiple of a is
    zero. Proof by contradiction. If no multiple vanished, the map from the integers sending n to n·a
    would be one-to-one. The reals are flat over the integers, so tensoring keeps it one-to-one. But 1⊗1
    maps to 1⊗a, which is zero. So 1⊗1 would be zero in the reals tensored with the integers, which is
    just the reals. That is absurd, since 1 is not 0.

    '
