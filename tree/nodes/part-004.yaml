    of chains, each chain running v, f v, f² v, … until it hits zero. Proof idea: induct on the dimension.
    The image of f is a smaller space, where f is still nilpotent, so it already has chains. Pull each
    chain back one step by choosing a preimage of its start, which makes it longer by one. The leftover
