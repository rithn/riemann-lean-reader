- id: f-annihilator-quotient-smul-top-of-free
  title: Enough depth and few generators force a module to be free
  kind: step
  status: explained
  chunk: c0293
  plain: 'This file proves a freeness criterion. Let B be a local Noetherian ring (one big ideal of small
    elements, called the maximal ideal) and M a finitely generated module over it. If M has "depth" at
    least n (there is a chain of n elements of the maximal ideal, each a non-zero-divisor on what is left
    after dividing out the earlier ones) and the maximal ideal can be generated by at most n elements,
    then M is free, meaning it has a basis. The proof goes by induction on n. Pick an element x that is
    a non-zero-divisor on M and not in the square of the maximal ideal. Then M/xM has one less depth and
    B/x has one fewer generator, so M/xM is free by induction. A lemma then lifts freeness from M/xM back
    up to M.

    '
