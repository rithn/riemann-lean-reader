- id: f-line-lattice-generator-codim-one
  title: A generator of a line lattice, checked in codimension one
  kind: step
  status: explained
  chunk: c0237
  orphan: true
  plain: 'A "lattice" here is a bundle of function-valued modules, one per point of a space. A rank-one
    lattice near a point p is generated by a single function b. The theorem says: if t is a nonzero function
    that generates the lattice at every codimension-one point whose closure contains p, then t generates
    it at p too. The idea: at each such point, t divided by b is an invertible function. By the previous
    result, being regular and having a regular inverse can be checked at codimension one. So t/b and its
    inverse are both regular at p, and t and b generate the same thing.

    '
