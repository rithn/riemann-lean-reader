- id: f-oe-eq-of-range-sub
  title: The diagonal rule and the norm of the standard vector
  kind: step
  status: explained
  chunk: c0236
  plain: 'This file proves two things. First, a column-minor table of a diagonal matrix is itself diagonal:
    it is a product of the diagonal entries when the two column choices agree, and zero otherwise. The
    key fact is that an increasing choice is determined by which positions it uses; if the choices differ,
    some row of the minor is all zeros. Second, the standard unit vector has exactly one nonzero entry,
    equal to 1, so its sum-of-squares length is 1, provided the diagram fits within N rows.

    '
  lean:
