- id: f-chebotarev--split-f
  title: Adding up over fibres - two inequalities for sums
  kind: step
  status: explained
  chunk: c0288
  plain: 'Two abstract facts about non-negative sums over a map from A to B. Upper bound: if each point
    of B has at most n points of A above it, and each value f(a) is at most h of its image, then the total
    of f is at most n times the total of h. Lower bound: if, outside a finite set S of exceptions, each
    point b has at least k points above it with f equal to g(b), then k times the total of g is at most
    the total of f plus k times the contribution of S. Proof idea: group terms by the point of B, count,
    and pass to the limit over finite subsets.

    '
