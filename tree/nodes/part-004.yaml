- id: f-bochner-inequality--k-unit-b
  title: The Casimir is bounded by its values on highest-weight vectors
  kind: step
  status: explained
  chunk: c0297
  orphan: true
  plain: 'Proved lemmas. The main one: in a finite-dimensional stable subspace, if the Casimir operator''s
    value on every highest-weight vector is at most C, then the "real part of ⟨Casimir x, x⟩" is at most
    C times the squared length of x, for every x. The idea is that the Casimir is symmetric, so it has
    an orthonormal basis of eigenvectors. Each eigenvalue is achieved by some highest-weight vector, hence
    is at most C. Expanding x in that basis then gives the bound term by term. A further lemma lifts a
    highest-weight vector from a quotient back to the space.

    '
