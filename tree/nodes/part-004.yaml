- id: f-vnu-map-zero
  title: Basic rules for acting by matrices on the vector tables
  kind: step
  status: explained
  chunk: c0236
  plain: 'This file proves the everyday rules for the action of matrices on the tables of column-minors.
    The action is additive and respects scaling, and sends zero to zero, so it keeps the span of the special
    vectors inside itself. Conjugating a minor gives the minor of the conjugate transpose. A family of
