- id: f-period-integrals--iso-inv-metric
  title: The claim that the natural length is the only invariant one
  kind: step
  status: explained
  chunk: c0236
  plain: 'This file only states a claim and defines the vocabulary; it proves nothing. The objects are
    lists of numbers, one for each way of picking columns from a matrix, shaped by staircase-like box
    patterns (Young diagrams). From a family of matrices one builds a special vector, and the vectors
    of this kind span a space. A unitary matrix is one that preserves lengths, like a rotation. The claim
    has two parts. First, unitary matrices send this space to itself and keep the usual sum-of-squares
    length. Second, any other inner product (a way of multiplying two vectors into a number) that is also
    unchanged by unitary matrices, and gives the standard vector length 1, must equal the sum-of-squares
    one on that space.

    '
  lean:
  - Formalism/PeriodIntegrals/IsoInvMetric.lean:34
  mathlib: []
  needs:
  - concept-hermitian-unitary-matrices
  - linear-algebra
  - counting
