- id: f-chebotarev--prime-asymp
  title: The prime sum is log(1/(s-1)) plus a bounded error
  kind: step
  status: explained
  chunk: c0288
  plain: 'Proves that as s decreases to 1, the sum over primes of (norm)^(-s) differs from log(1/(s-1))
    by a bounded amount. Idea: by the Euler product, the logarithm of the zeta sum over ideals is the
    sum of minus-log(1 - N^-s) over primes, and that differs from the plain prime sum by at most a constant,
    since -log(1-x) is close to x for small x. Meanwhile (s-1) times the zeta sum tends to a positive
    number (its residue), so it stays between two positive constants near 1, and the log of it is bounded.

