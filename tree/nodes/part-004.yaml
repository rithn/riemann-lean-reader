    the squared length of ρ. Here ρ is a fixed offset vector coming from the group. The same holds for
    the "compact-part" Casimir, using a different offset. The proof computes each product term: the commutation
    rule turns E(a,b)E(b,a) into μ_a−μ_b, μ_a squared, or zero, depending on whether a is below, equal
