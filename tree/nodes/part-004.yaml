- id: f-scheme-cohomology--regular-u-f-d-serre
  title: Regular local rings have finite projective dimension (Serre)
  kind: step
  status: explained
  chunk: c0238
  plain: 'A module''s "projective dimension" counts how long a chain of free-like modules is needed to
    describe it. This file proves that over a regular local ring of dimension d, every finite module has
    projective dimension at most d, a theorem of Serre. First, the maximal ideal is generated by a regular
    sequence of d elements (each is a non-zero-divisor modulo the earlier ones), built one at a time using
    the quotient lemma. This gives the residue field projective dimension at most d. Then a filtration
    argument extends it to every finite module.

    '
  lean:
  - GroundTheory/ArithmeticGeometry/SchemeCohomology/RegularUFDSerre.lean:13
  - GroundTheory/ArithmeticGeometry/SchemeCohomology/RegularUFDSerre.lean:192
  mathlib:
