- id: f-mem-range-of-integral-at-height-one-over
  title: Integral at the codimension-one primes above one element
  kind: step
  status: explained
  chunk: c0237
  plain: 'Take a well-behaved ring B (Noetherian, an integral domain, "integrally closed") with fraction
    field K. Let x be a fraction, and let w be a nonzero element of B such that some power of w times
    x already lies in B. Suppose that at every height-one prime containing w (a prime with nothing but
    the zero ideal below it), x can be written with a denominator outside that prime. Then x lies in B.
    The proof uses a known fact: x is in B if it passes this test at all height-one primes. Primes not
    containing w are handled by using w to a power as the denominator.

    '
  lean:
