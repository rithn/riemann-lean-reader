- id: f-chebotarev--prime-sum
  title: The log version and the plain prime sum differ by a bounded amount
  kind: step
  status: explained
  chunk: c0288
  plain: 'For a Dirichlet character and s greater than 1, the sum over primes of minus-log(1 - z_q) and
    the sum of z_q differ by at most the sum of (norm)^(-2), which is a finite constant. Here z_q is the
    character value times (norm of q)^(-s). Proof idea: each z_q has size at most 1/2, and for such z
    the quantity minus-log(1-z) minus z is at most |z| squared (a Taylor-series estimate). Squares of
    the primes'' terms are bounded by a fixed convergent series, so the total error stays bounded as s
    moves toward 1.

    '
