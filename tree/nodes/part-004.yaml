  kind: step
  status: explained
  chunk: c0290
  plain: 'Proves the "tensor spans" claim. Assume theta spans on one copy. Freeze all other copies and
    vary one: the restricted function is a multiple of theta, so F at one value times theta at another
    equals theta at the first times F at the other. Replacing the copies one at a time by a fixed point
    t0 then gives F(z) times theta(t0) to the power k equals the product of theta over the copies times
    F at the replaced array. If some theta(t0) to that power is nonzero, divide to get F as a multiple
    of the product. Otherwise theta vanishes everywhere and F is forced to be zero.

