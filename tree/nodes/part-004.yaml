- id: f-chebotarev--euler-fac
  title: Ideals built only from a chosen finite set of primes
  kind: step
  status: explained
  chunk: c0288
  plain: 'Call an ideal "smooth for a finite set S of primes" if every prime dividing it lies in S. The
    file proves the bookkeeping needed for Euler products. With no primes allowed, only the whole ring
    qualifies. Multiplying a smooth ideal by a power of a new prime keeps it smooth for the bigger set.
    Conversely, every nonzero ideal smooth for S plus q splits as a power of q times an ideal smooth for
    S, and this split is unique. This is unique factorisation of ideals, used in the guise of "write each
    number as 2^k times an odd part".

