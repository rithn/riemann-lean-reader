- id: f-inertia-ramification--average
  title: Ramification index is 1 exactly when no conductor is divisible by l
  kind: step
  status: explained
  chunk: c0323
  plain: 'Take a group X of Dirichlet characters modulo N and a prime l. The "ramification index" counts
    how many different l-parts the characters in X have (the l-part is what the character does on numbers
    whose troubles all lie at l). This file shows three facts. The index is 1 exactly when no character
    in X has a conductor divisible by l. That holds exactly when l does not divide the lcm of all the
    conductors. And the index is always at least 1. The proof is bookkeeping: a prime divides an lcm exactly
    when it divides one of the numbers, plus a lemma from another file linking the l-part to the conductor.

