- id: f-divisor-proofs--exists-filtered-colimit-finite-type-int-rings
  title: Every ring is a union of finitely generated rings
  kind: step
  status: explained
  chunk: c0327
  plain: 'This file proves that every commutative ring A is a "filtered colimit" of rings that are finitely
    generated over the integers. Concretely, for each finite set of elements of A, take the subring they
    generate. Bigger finite sets give bigger subrings, so these form a growing system in which any two
    have a common upper bound. A itself is the union (colimit) of them, since each element lies in the
    subring generated by itself. Each piece is finitely generated by construction. The proof checks this
    union property element by element.

    '
