  plain: 'This file proves a claim only by assuming two other claims (a Nullstellensatz for analytic functions,
    and that normal algebraic sets stay normal analytically). It says: on a shape cut out by a prime ideal
    whose coordinate ring is normal, if holomorphic F and G satisfy a monic-style equation F^d + a1 F^(d-1)
    G + ... = 0 on the shape, with G not identically zero, then near the point F equals G times some holomorphic
    H on the shape. Idea: move to the ring of germs (local functions) modulo the ideal, which is a normal
    domain. The relation says F/G is integral over that ring, so it lies in the ring; hence F = G·H.

