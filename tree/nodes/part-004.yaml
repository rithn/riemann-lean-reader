- id: f-foundation-proofs--upper-half-plane-holomorphic-germ-properties
  title: Smooth functions on the upper half-plane are rigid
  kind: step
  status: explained
  chunk: c0281
  plain: 'This file proves five basic facts about smooth (holomorphic) functions on the upper half-plane.
    First, two such functions that agree except at isolated points agree everywhere. Second, if a product
    of two is zero everywhere, one of them is zero everywhere. Third, changing variables by a Möbius map
