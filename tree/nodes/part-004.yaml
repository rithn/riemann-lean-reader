- id: f-hv-scalar
  title: Triangular data gives a multiple of the standard vector
  kind: step
  status: explained
  chunk: c0236
  plain: 'A matrix is upper triangular if everything below its diagonal is zero. This file shows that
    when the data is triangular, the special vector is just the standard unit vector times a single number,
    the product of the diagonal entries. The reason: a minor of a triangular matrix is the product of
    its diagonal entries, and it is zero unless the chosen columns are the first ones in order. It then
    combines this with a result that any matrix can be made triangular by a unitary one, to show every
    special vector is a scalar times one coming from a unitary matrix.

    '
  lean:
  - Formalism/PeriodIntegrals/UnitaryGroupMassFormula/InvariantMetricIsometry/HvScalar.lean:70
  mathlib:
  - Matrix.det_of_upperTriangular
  needs:
  - f-col-choice-fintype
