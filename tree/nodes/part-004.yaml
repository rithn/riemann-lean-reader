- id: f-exp-mv-eq
  title: Proof of the cube-factor lemma
  kind: step
  status: explained
  chunk: c0326
  plain: 'This file proves the cube-factor lemma. First it shows the logarithm and exponential defined
    here agree with the ones from the shared formal-group files. Then it checks that the sum and difference
    series are nonzero and have zero constant term, so one may cancel them from the given product identity.
    Cancelling leaves an identity between exponentials. Using that the exponential of a sum is the product
    of exponentials, the exponential of the error term becomes the unit-like integral series n times something
    equal to one, so it is integral too. The final step uses that an inverse of an integral series with
    constant term 1 is again integral.

    '
