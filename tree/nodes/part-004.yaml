    1, and is 0 beyond. It proves the tent never changes faster than its input does. It also shows a product
    rule: if all numbers have size at most 1, two products differ by at most the sum of the individual
    differences. The main payoff is that shifting a tent by every whole number and adding the copies always
    gives exactly 1. At any point only two shifts are non-zero, and their heights sum to 1. The same holds
    in several dimensions, using products of one-dimensional tents. It is a smooth way to chop space into
