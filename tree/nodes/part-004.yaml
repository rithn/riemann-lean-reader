    at the centre, then dividing by the ball''s volume gives a ratio tending to the density''s value at
    the centre. Concretely, given any tolerance, pick a small ball on which the density stays within half
    the tolerance of its centre value. The integral is then trapped between (value − tolerance/2) × volume
