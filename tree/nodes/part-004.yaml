- id: f-scheme-cohomology--regular-local-domain
  title: Regular local rings are domains; cutting by a good element stays regular
  kind: step
  status: explained
  chunk: c0238
  plain: 'This file proves two facts about regular local rings. First, if x is in the maximal ideal but
    not in its square, then the ring modulo x is again regular, with dimension one less. The idea: x is
    one genuine direction, so the maximal ideal needs one fewer generator. Second, every regular local
    ring is an integral domain (no two nonzero elements multiply to zero). The proof is by induction on
    the number of generators. It picks x outside the minimal primes and outside the square, quotients
    by it, and uses the induction hypothesis.

    '
