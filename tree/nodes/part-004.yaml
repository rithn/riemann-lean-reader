- id: f-period-integrals--prod-formula-e
  title: The product formula over all primes, stated only
  kind: step
  status: explained
  chunk: c0234
  orphan: true
  plain: 'This file only states a claim, a named Prop, and proves nothing. Take a number field F, a degree-2
    extension E, and a local model at each prime of F. The claim has two parts. First, for a nonzero x
    in E, only finitely many local factors differ from 1. Their product over all primes is 1 divided by
    the absolute value of the norm of x. Second, the product of the local phase factors of x equals e
    to the 2 pi i times the trace of x. Both are product formulas, which combine local data at every prime
    into a global quantity.

    '
  lean:
  - Formalism/PeriodIntegrals/ProdFormulaE.lean:10
