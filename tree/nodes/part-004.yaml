- id: f-re-swap-sum-le
  title: Swapping one box with an antisymmetric group never gains length
  kind: step
  status: explained
  chunk: c0259
  plain: 'A proved inequality. Let f be a vector that flips sign under every swap among a group B of boxes,
    and p a box outside B. The real part of the inner product of f with the sum of "swap p with q" over
    q in B is at most the squared length of f. The idea: write Y for that sum of swaps. Y is self-adjoint,
    and a computation gives Y(Yf) = |B|f - |B|Yf + Yf. So g = f - Yf satisfies Yg = -|B|g, which gives
    the inner product of g with g as (1+|B|) times the inner product of f with g; being a squared length,
    it is not negative.

