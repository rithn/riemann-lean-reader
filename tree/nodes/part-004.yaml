- id: f-formal-group-common--exp-log
  title: Exponential and logarithm series, and integral inverses
  kind: step
  status: explained
  chunk: c0326
  plain: 'Shared toolkit for the exponential and logarithm of power series. Over a field of characteristic
    zero it proves exp(log(1+X)) = 1+X: both sides satisfy the same derivative equation and start at 1,
    so they agree. Over the complex p-adic numbers it defines the logarithm of a many-variable series
    with constant term 1, proves its exponential gives the series back, and shows exponentials turn sums
    into products and commute with substitution. The last result is a size statement: if u times n equals
    1, and n has constant term 1 and all coefficients of size at most 1, then so does u. The proof goes
    degree by degree, using that p-adic sums never exceed their largest term.

    '
