- id: f-chebotarev--euler-fin
  title: Finite Euler product for a multiplicative function on ideals
  kind: step
  status: explained
  chunk: c0288
  plain: 'Let f assign a complex number to each ideal, with f(1)=1, f(ab)=f(a)f(b), absolutely summable
    over nonzero ideals, and each prime having |f| below 1. For a finite set S of primes, the file proves
    that the sum of f over ideals made only from S equals the product over q in S of 1/(1 - f(q)). Proof
    idea: induct on S. Adding a prime q multiplies the sum by the geometric series 1 + f(q) + f(q)^2 +
    ..., which is 1/(1-f(q)); unique factorisation matches the ideals one to one with pairs (power of
    q, ideal from S).

