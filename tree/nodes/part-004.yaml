  plain: 'A proved integrality fact. E4 and E6 have q-series with integer coefficients, built from sums
    of cubes and fifth powers of divisors. The key arithmetic: for any integer d, 5d^3 + 7d^5 is divisible
    by 12, checked by looking at d mod 12. Hence 5σ3 + 7σ5 is divisible by 12 for every n. Using Δ = (E4³
