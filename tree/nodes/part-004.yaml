- id: f-desc-pf
  title: Proof of Galois descent via the trace
  kind: step
  status: explained
  chunk: c0318
  plain: 'This proves the Galois descent claim for subspaces. The key identity: adding up all Galois conjugates
    of a vector gives the trace, a vector coming from the small field. Using a basis of the big field
    and its dual basis under the trace pairing, any vector is rewritten as a combination of such trace
    vectors. Each trace vector is a sum of conjugates of multiples of a vector in the subspace, so it
    lies in the subspace. Hence the subspace is spanned by rational points. The other containment is immediate.
    It needs the extension to be separable.

