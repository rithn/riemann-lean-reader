    with alternating signs. A cycle is a chain whose boundary is zero. This file proves: if putting a
    fixed vertex x in front of every list of G gives a list in F, then every cycle supported on G is a
    boundary of a chain supported on F. The proof is the "cone" construction. Prepending x defines a map,
    and the boundary of the cone of d equals d minus the cone of its boundary. For a cycle the second
    term vanishes.

