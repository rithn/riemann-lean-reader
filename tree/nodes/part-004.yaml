- id: f-chebotarev--split-c
  title: Not almost every prime can split into k or more equal-norm primes
  kind: step
  status: explained
  chunk: c0288
  orphan: true
  plain: 'For number fields E inside E'' and any k at least 2, it is impossible that all but finitely
    many primes q of E have at least k primes of E'' above them with the same norm as q. Proof idea: the
    prime sum for E'' would be at least k times that for E, up to a fixed finite correction. But each
    prime sum equals log(1/(s-1)) plus a bounded error. Take s close enough to 1 and the inequality turns
    into the false statement that a big number is at most a bounded number. This is the contradiction.

    '
