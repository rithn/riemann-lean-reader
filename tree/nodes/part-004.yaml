- id: f-quotient-rank
  title: Any matrix can be made upper triangular by a unitary one
  kind: step
  status: explained
  chunk: c0236
  plain: 'This file proves that for any square complex matrix X there is a unitary matrix k, meaning its
    columns are mutually perpendicular unit vectors, such that k''s conjugate transpose times X has zeros
    below the diagonal. This is the QR decomposition. The proof runs the Gram-Schmidt process on the columns
    of X, which builds perpendicular unit vectors one at a time. The new columns form k. The triangular
    shape comes from each original column being a mix of only the earlier perpendicular vectors.

    '
