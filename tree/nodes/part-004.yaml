- id: f-w0-eq-of-rt-eq
  title: Two small facts, about good primes and the trace on the complex numbers
  kind: step
  status: explained
  chunk: c0235
  orphan: true
  plain: 'Two small, unrelated facts. First, for a level M that is odd and at least 3, a prime p is "good"
    for M exactly when M is not a power of p. The proof splits M into the p-power part and the rest. That
    rest is odd, and it is not 1 when M is not a power of p. Second, for a complex number t, the trace
    from the complex numbers down to the reals, which adds t to its conjugate, is 2 times the real part
    of t. For i times t it is minus 2 times the imaginary part. I could not tell from the file alone what
    the "good" condition is used for.

    '
