nodes:
  - id: f-wedge-line-lattice-vector-bundle
    title: Wedge-ratio line lattice is a vector bundle (restated)
    kind: step
    status: explained
    chunk: c0086
    orphan: true
    plain: >
      This file restates a result proved elsewhere, and its proof is a single
      call to that result. The setting is a field with two "lattices" (integral
      structures inside a vector space, like Z sitting inside Q). Each lattice
      has a top-degree wedge power, which is a way of packaging a whole
      basis into one object. Given two such wedge elements a and b, the claim
      is that the ratio lattice they define is a rank-one vector bundle over
      the chosen set of points. It also says exactly which scalars t
      generate it locally, and that ratios of the coefficients of local bases
      do generate it. Nothing new is proved here.
    lean:
      - Development/AutomorphicSpectrum/Proofs/GeometryProofs/WedgeLineLatticeVectorBundle.lean:8
    mathlib: []
    needs:
      - f-line-lattice-vector-bundle
      - concept-exterior-powers
      - concept-schemes-basics
      - linear-algebra
  - id: f-line-lattice-vector-bundle
    title: Ratio of two wedge lattices forms a line bundle
    kind: step
    status: explained
    chunk: c0086
    plain: >
      Take two lattices A and B in a vector space over a field. Pick nonzero
      elements a and b in their wedge powers (single objects that stand in for
      whole bases). The idea is that a lattice made from the ratio a/b is a
      line, and this file shows it is locally trivial, meaning near each point
      it is generated by one number. The proof is bookkeeping with
      determinants. Changing a basis inside a lattice multiplies the wedge
      element by a determinant, so two local bases differ by a unit. That
      lets the local generator be computed from any frames and glued across
      the whole set of points.
    lean:
      - Development/WeilBound/CoreStatements/TorusUniformisation/ChowMahlerFamilies/LineLatticeVectorBundle.lean:146
    mathlib:
      - AlternatingMap.eq_smul_basis_det
      - Submodule.mem_span_singleton
    needs:
      - concept-exterior-powers
      - concept-valuation-rings
      - concept-schemes-basics
      - linear-algebra
