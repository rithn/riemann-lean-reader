nodes:
  - id: f-adjoin-inverse-is-localization-away
    title: Adding the inverse of g to a ring of numbers is the localization at g
    kind: step
    status: explained
    chunk: c0035
    plain: >
      This file proves a fact about rings generated by finitely many numbers. Take a ring A of numbers generated by some set G, and a nonzero element g of A. Let S be the ring generated by G together with 1 over g. The claim is that S is exactly A with g made invertible (the localization of A away from g, like going from whole numbers to fractions with only powers of g below). The proof shows every element of S can be written as an element of A divided by a power of g, by induction on how elements are built from sums and products.
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/AdjoinInverseIsLocalizationAway.lean:5"]
    mathlib: [IsLocalization.Away.mk, Algebra.adjoin_induction, Algebra.subset_adjoin]
    needs: [concept-prime-ideals-localization, rings-fields, concept-integral-closure-fraction-fields]
  - id: f-kaehler-basis-tower
    title: Bases of differentials combine along a tower of smooth rings
    kind: step
    status: explained
    chunk: c0035
    plain: >
      This file is about differentials, the algebraic version of "small changes" of a ring element. Take rings R, S, T stacked like a tower, with T smooth over S (a nice family without singularities). Suppose differentials of z1..ze form a basis of those of S over R, and differentials of w1..wm form a basis for T over S. Then the differentials of all of them together, z's pushed into T followed by the w's, form a basis for T over R. The proof is a linear algebra lemma. A short exact sequence with a basis on each end gives a basis on the middle. Smoothness is what makes the left map injective.
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/KaehlerBasisTower.lean:7", "Development/AutomorphicSpectrum/Proofs/GeometryProofs/KaehlerBasisTower.lean:63"]
    mathlib: [KaehlerDifferential.exact_mapBaseChange_map, Algebra.FormallySmooth.subsingleton_h1Cotangent, LinearIndependent.sum_type, Algebra.TensorProduct.basis]
    needs: [concept-derivations-smoothness, concept-smooth-morphisms, concept-chain-complexes-homology, linear-algebra]
  - id: f-kaehler-finrank-fraction-field
    title: Differentials over fraction fields have the expected dimension
    kind: step
    status: explained
    chunk: c0035
    plain: >
      This file computes a dimension. Let T be a ring with a basis of m differentials over S, and let K and L be the fraction fields (the fields of fractions) of S and T. The claim is that the differentials of L over K form a space of dimension exactly m. The proof has three steps. Passing to fractions is an unramified, then etale, extension, so differentials of K over S vanish and those of L over T match those of T. The map from differentials over S to those over K is then an isomorphism. A basis of m elements transfers across, so the dimension is m.
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/KaehlerFinrankFractionField.lean:7"]
    mathlib: [Algebra.FormallyEtale.of_isLocalization, Algebra.FormallyUnramified.of_isLocalization, KaehlerDifferential.exact_mapBaseChange_map, KaehlerDifferential.tensorKaehlerEquivOfFormallyEtale]
    needs: [concept-derivations-smoothness, concept-etale-ring-maps, concept-integral-closure-fraction-fields, concept-prime-ideals-localization, linear-algebra]
  - id: f-localization-kaehler-prime-ideal
    title: Vanishing conditions survive renaming variables and passing to a bigger ring
    kind: step
    status: explained
    chunk: c0035
    plain: >
      This file proves a bookkeeping fact about polynomial equations. Take a set of integer polynomial equations in variables indexed by a set, and a ring map that sends one ring of numbers into a bigger one while sending the chosen variable values to the matching values. Rename the variables inside the equations to match the bigger setup. The claim: a prime ideal q of the bigger ring contains every value of the renamed equations if and only if its pullback to the smaller ring contains every value of the original equations. The proof checks that evaluating a renamed polynomial equals evaluating the original and then mapping across.
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/LocalizationKaehlerPrimeIdeal.lean:15"]
    mathlib: [MvPolynomial.induction_on, MvPolynomial.rename, MvPolynomial.aeval, Submodule.span_induction]
    needs: [concept-prime-ideals-localization, polynomials, rings-fields, concept-coordinate-rings-dimension]
  - id: f-kaehler-rank-localization-bound
    title: Differentials after inverting one element give a basis one rank larger
    kind: step
    status: explained
    chunk: c0035
    orphan: true
    plain: >
      This file proves a local step in a geometric argument about the rank (dimension) of differentials. We have a smooth ring S inside a bigger smooth ring T, both domains with fraction fields K and L. Suppose the rank of the differentials of L over K is r, and S has a basis of e differentials. Fix a prime ideal P of T. Then after inverting one element outside P, the ring has a basis of e plus r differentials, extending the old one. The zero set of the polynomial equations is tracked by which basis elements lie in each prime. The proof combines the tower, fraction-field and localization lemmas.
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/KaehlerRankLocalizationBound.lean:9", "Development/AutomorphicSpectrum/Proofs/GeometryProofs/KaehlerRankLocalizationBound.lean:61"]
    mathlib: [Algebra.IsSmoothAt.exists_notMem_isStandardSmooth, Algebra.IsStandardSmooth.iff_exists_basis_kaehlerDifferential, IsLocalization.isPrime_of_isPrime_disjoint, IsLocalization.comap_map_of_isPrime_disjoint]
    needs: [f-kaehler-finrank-fraction-field, f-kaehler-basis-tower, f-adjoin-inverse-is-localization-away, f-localization-kaehler-prime-ideal, concept-smooth-morphisms, concept-derivations-smoothness, concept-prime-ideals-localization, concept-integral-closure-fraction-fields]
