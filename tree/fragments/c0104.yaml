nodes:
  - id: f-exists-basis-of-lattice-span
    title: A valuation ring span of finitely many vectors has a basis
    kind: step
    status: explained
    chunk: c0104
    plain: >
      Let C be a field with a valuation, and O its valuation ring (think of the p-adic integers inside the p-adic numbers). Take finitely many vectors g that span a space V over C. The file proves the O-lattice they generate has a basis b that is also an ordinary C-basis of V. So the lattice is free with exactly N generators, N being the dimension of V. The proof shows the lattice is flat, hence free over this local ring, picks a basis, shows it is independent and spanning over C, and counts to get N.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsBasisOfLatticeSpan.lean:7"]
    mathlib: [Module.free_of_flat_of_isLocalRing, Module.Flat.flat_iff_torsion_eq_bot_of_isBezout, LinearIndependent.iff_fractionRing]
    needs: [concept-valuation-rings, concept-flat-modules, concept-local-rings, linear-algebra]
  - id: f-exists-basis-quotient-lattice-eigen
    title: Eigenspace lattice has a basis whose wedge generates the determinant lattice
    kind: step
    status: explained
    chunk: c0104
    orphan: true
    plain: >
      The setting: commuting matrices over a valuation ring O, acting on vectors over its fraction field C, with an eigenspace for one eigenvalue. Its lattice is the image of integer vectors under projection to that eigenspace. The file proves this lattice has a basis b that is also a C-basis, so the top wedge power of the eigenspace is a line and the wedge of b is nonzero. It also shows the determinant lattice (wedges of lattice vectors) is generated by that single wedge. The proof assembles four earlier results: projection, spanning, free basis, wedge generation.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsBasisQuotientLatticeEigen.lean:11"]
    mathlib: [Module.finrank_eq_card_basis, Module.Basis.reindex]
    needs: [f-divisor-proofs--eigen-projection-quotient-lattice, f-divisor-proofs--exists-spanning-image-lattice, f-exists-basis-of-lattice-span, f-exterior-power-basis-lattice-principal, f-divisor-base--sandwich-maps, concept-exterior-powers, concept-valuation-rings]
  - id: f-exterior-power-basis-lattice-principal
    title: Wedges of a lattice's vectors are multiples of one wedge
    kind: step
    status: explained
    chunk: c0104
    plain: >
      Let b be an N-element basis of an N-dimensional space V over a field C, and O a subring. The N-fold wedge product (an antisymmetric product, like a determinant of vector columns) of vectors in V lives in a one-dimensional space. The file proves three facts. That space has dimension one. The wedge of the basis b is nonzero. And every wedge of N vectors from the O-span of b is an O-multiple of the wedge of b. Hence the wedge lattice is generated by one element. This uses the fact that wedging N vectors multiplies by the determinant of their coordinates.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExteriorPowerBasisLatticePrincipal.lean:8"]
    mathlib: [exteriorPower.finrank_eq, exteriorPower.ιMulti_apply_coe, Nat.choose_self]
    needs: [f-wedge-ne-zero-of-linear-independent, concept-exterior-powers, linear-algebra]
  - id: f-dual-lattices--small-level-class-set
    title: Definitions and unproved claims about dual lattices and Newton lifting
    kind: step
    status: explained
    chunk: c0104
    plain: >
      This file mostly states claims; it proves none of them. Its definitions are a standard symplectic matrix, a lattice of wedges, and several formal power series notions. The claims are written as named propositions that are merely assumed when used. They cover a determinant-lattice formula over a valuation ring, an identity for differences of polynomial values, commuting roots, lifting an eigenvector, a duality statement for saturated lattices, a Newton-style existence and uniqueness result for power-series solutions over a discrete valuation ring, and two facts about Hopf algebras (structures that carry a group-like multiplication) of height one. Despite the filename, nothing here is about class sets.
    lean: ["ReciprocityTheory/DualLattices/SmallLevelClassSet.lean:39"]
    mathlib: []
    needs: [concept-exterior-powers, concept-valuation-rings, concept-discrete-valuation-ring, concept-hensel-lifting, linear-algebra, polynomials]
  - id: f-wedge-ne-zero-of-linear-independent
    title: Wedge of independent vectors is nonzero and detects lattice membership
    kind: step
    status: explained
    chunk: c0104
    plain: >
      Take k vectors in a vector space over a field K. Their wedge product is an antisymmetric product, like a determinant of columns. The file proves three facts. If the vectors are independent, the wedge is nonzero. For any k vectors inside the span of an independent set b, their wedge equals the determinant of the coordinate matrix times the wedge of b. And if the vectors lie in an O-span of b for a subring O, that determinant lies in O, so the wedge is an O-multiple of the wedge of b. Everything reduces to uniqueness of determinants among alternating maps.
    lean: ["ReciprocityTheory/DualLattices/WedgeNeZeroOfLinearIndependent.lean:55"]
    mathlib: [AlternatingMap.eq_smul_basis_det, exteriorPower.ιMulti_family_linearIndependent_field, Basis.det_apply]
    needs: [f-dual-lattices--small-level-class-set, concept-exterior-powers, linear-algebra]
