  - id: f-exists-lt-commutator-mem-of-ne-top
    title: A proper subgroup of a nilpotent group has a bigger commuting-mod-K subgroup
    kind: step
    status: explained
    chunk: c0093
    plain: >
      Let G be a finite nilpotent group (one built from a chain of central layers) and K a proper subgroup. The claim is that there is a strictly larger subgroup A containing K, in which every commutator a·b·a⁻¹·b⁻¹ lands inside K. In nilpotent groups a proper subgroup is always strictly smaller than its normalizer, the elements that conjugate it to itself. Pick x in the normalizer but outside K. Let A be everything of the form k·xⁱ. Conjugating by powers of x keeps K inside K, so A is a subgroup, and a short calculation puts all commutators in K.
    lean:
      - Development/AbelianVarietyTheory/Proofs/InertiaEigenvalues/ExistsLtCommutatorMemOfNeTop.lean:7
    mathlib:
      - Group.normalizerCondition_of_isNilpotent
      - Subgroup.mem_normalizer_iff
    needs: [concept-normal-subgroups-quotients, groups]
    orphan: true
  - id: f-inertia-eigenvalues--ind-apply-one
    title: Basic facts about induced characters
    kind: step
    status: explained
    chunk: c0093
    plain: >
      Given a subgroup T of a finite group G, one can induce a complex function on T up to G by averaging conjugates. This file gathers small computations. Induction is additive, so it respects differences. Inducing a constant c gives c times inducing the constant 1. The value at the identity is the index of T in G (the number of cosets) times the value of the original at the identity. Inducing from the whole group changes nothing for conjugation-invariant functions. It also defines a set of differences of induced characters and matches the published induction formula with this one.
    lean:
      - Development/AbelianVarietyTheory/Proofs/InertiaEigenvalues/IndApplyOne.lean:28
