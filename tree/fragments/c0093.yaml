  - id: f-character-theory--virtual-characters-mul-comap-conj-ind-linear
    title: Virtual characters are closed under the usual operations
    kind: step
    status: explained
    chunk: c0093
    plain: >
      A character of a finite group records the trace (sum of diagonal entries) of each group element in a matrix representation. A virtual character is a whole-number combination of characters, with minus signs allowed. This file proves five closure facts for complex virtual characters on a finite group. Products of them stay virtual characters. Composing with a group homomorphism gives a virtual character of the source. They are unchanged by conjugation. Induction from a subgroup keeps them virtual characters. A one-dimensional character is one. Each is checked first for genuine characters, then extended through sums and differences.
    lean:
      - Development/AbelianVarietyTheory/Proofs/CharacterTheory/VirtualCharactersMulComapConjIndLinear.lean:62
    mathlib:
