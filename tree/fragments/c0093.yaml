  - id: f-galois-cohomology₂--brauer-degree-zero
    title: Statement of a Brauer-style character identity
    kind: step
    status: explained
    chunk: c0093
    plain: >
      This file only states a claim and does not prove it. It defines induction of a function from a subgroup H to a finite group G, by averaging over conjugates. It then names a statement, called a Brauer degree-zero statement. For any finite group and any finite-dimensional complex representation, the character minus the dimension should be a whole-number combination of differences, each being a one-dimensional character induced from some subgroup minus the trivial character induced from it. It is a degree-zero form of a classical theorem of Brauer on induced characters. The reader should treat it as an assumption.
    lean:
      - Development/AbelianVarietyTheory/PublishedTheorems/GaloisCohomology₂/BrauerDegreeZero.lean:12
