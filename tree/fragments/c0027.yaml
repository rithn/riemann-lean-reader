nodes:

- id: concept-prime-ideals-localization
  title: Prime ideals, Noetherian rings and localization
  kind: concept
  status: textbook
  plain: >
    An ideal is a set of ring elements closed under addition and under multiplication by any
    ring element, like the multiples of 6 among the whole numbers. It is prime if a product
    lying in it forces one of the factors to lie in it, like the multiples of 5. A ring is
    Noetherian if every ideal is generated by finitely many elements. Localizing at a prime
    means allowing division by everything outside it. For the whole numbers at 5, you may
    divide by 2 or 3 but not by 5, and 5 itself becomes the one maximal ideal. Questions about
    a prime then become questions about a single small local ring.
  needs: [rings-fields, polynomials, primes-divisibility, concept-ideals-and-discriminant]
  learn:
    - {title: "Introduction to Commutative Algebra (Atiyah and Macdonald)", where: "Chapters 1, 3 and 7"}
    - {title: "Commutative Algebra with a View Toward Algebraic Geometry (Eisenbud)", where: "Chapters 2 and 3"}

- id: concept-derivations-smoothness
  title: Partial derivatives on polynomials, differentials and smoothness
  kind: concept
  status: textbook
  plain: >
    On polynomials, taking the partial derivative with respect to a variable x follows the
    ordinary Leibniz product rule; for example, the derivative of x times y with respect to x
    is y. Differentials package all such derivatives into one object. The Jacobian criterion
    says a shape cut out by polynomial equations is smooth at a point when the matrix of
    partial derivatives of the equations has full rank there, so the point has no sharp corner
    or self-crossing. Over a perfect field, such as the rationals or a finite field, every
    function field is smooth in this sense, which is what makes the criterion work.
  needs: [polynomials, calculus, linear-algebra, concept-prime-ideals-localization, concept-field-extensions-transcendence]
  learn:
    - {title: "Algebraic Geometry (Hartshorne)", where: "Chapter I, section 5; Chapter II, section 8"}
    - {title: "Commutative Algebra with a View Toward Algebraic Geometry (Eisenbud)", where: "Chapter 16"}

- id: f-exists-det-ne-zero-of-rows-separating
  title: Rows that pin down every vector contain a nonzero determinant
  kind: step
  status: explained
  chunk: c0027
  plain: >
    This file proves a linear-algebra fact. Over a field, take any collection of rows of
    length h. Suppose the only vector orthogonal (dot product zero) to every row is the zero
    vector. Then you can pick h of the rows to make a square matrix whose determinant is not
    zero. For example, the rows (1,0), (0,1) and (1,1) have this property, and (1,0) with
    (1,1) gives determinant 1. The idea is that the rows must span the whole space, since
    otherwise a nonzero vector would be orthogonal to all of them. A spanning set contains a
    basis, and the basis rows are independent, so their matrix is invertible.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsDetNeZeroOfRowsSeparating.lean:6]
  mathlib: [Submodule.exists_le_ker_of_lt_top, exists_linearIndependent, Matrix.linearIndependent_rows_iff_isUnit, Matrix.isUnit_iff_isUnit_det]
  needs: [linear-algebra]

- id: f-mem-sq-localization-of-pderiv-mem
  title: Vanishing slopes force vanishing to second order
  kind: step
  status: explained
  chunk: c0027
  plain: >
    This file proves a claim. Take a prime ideal Q of a polynomial ring over a base ring whose
    fraction field is perfect, with no nonzero base element in Q. Suppose a polynomial x lies
    in Q and every partial derivative of x lies in Q. Then some g outside Q makes g times x lie
    in the square of Q, meaning x vanishes "twice" once the bad part is cleared. The idea
    uses smoothness. After localizing at Q, a map from a quotient by the square of the maximal
    ideal into differentials is injective. The differential of x is a combination of its partial
    derivatives, which are zero, so x lies in that square.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/MemSqLocalizationOfPderivMem.lean:21]
  mathlib: [Algebra.FormallySmooth.of_perfectField, KaehlerDifferential.kerCotangentToTensor, IsLocalization.algebraMap_mem_map_algebraMap_iff, KaehlerDifferential.mvPolynomialBasis]
  needs: [concept-derivations-smoothness, concept-prime-ideals-localization, polynomials]

- id: f-exists-mul-mem-of-forall
  title: Minimal generators of a prime, seen locally
  kind: step
  status: explained
  chunk: c0027
  plain: >
    This file proves a claim in two steps. First, for a finitely generated prime Q, if every
    element of Q has some multiplier outside Q pushing it into an ideal I, then one multiplier
    works for all of Q. The proof multiplies the multipliers for a finite generating list;
    a product of non-members of a prime is a non-member. Second, in a Noetherian ring there are
    h elements of Q, where h is the fewest generators the local maximal ideal needs, which
    generate Q after one outside multiplier. Also, they are independent mod Q squared. If a
    coefficient were a unit, one element would be redundant by Nakayama's lemma, giving fewer
    generators than the minimum.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsMulMemOfForall.lean:36]
  mathlib: [IsLocalization.mk'_surjective, IsLocalization.algebraMap_mem_map_algebraMap_iff, Submodule.le_of_le_smul_of_le_jacobson_bot, Submodule.spanFinrank]
  needs: [concept-prime-ideals-localization, rings-fields, counting]

- id: f-exists-minimal-local-generators
  title: Minimal local generators (forwarding file)
  kind: step
  status: explained
  chunk: c0027
  plain: >
    This file mostly forwards to the file just before it. Its main theorem says that for a
    prime ideal Q in a Noetherian ring there are elements f1 to fh in Q, with h the fewest
    generators the local maximal ideal needs, plus an outside multiplier g with g times Q
    inside their ideal. Any combination of them with coefficients not in Q stays out of Q
    squared. The proof just invokes the theorem proved in the other file. A helper proved
    here, about coefficients of a spanning set of the maximal ideal, does not seem to be used
    by the main theorem; I am not certain.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsMinimalLocalGenerators.lean:34]
  mathlib: [IsLocalRing.CotangentSpace.span_image_eq_top_iff, linearIndependent_of_top_le_span_of_card_le_finrank]
  needs: [f-exists-mul-mem-of-forall, concept-prime-ideals-localization]

- id: f-exists-generic-jacobian-data-of-prime
  title: A prime always has generators with an invertible Jacobian
  kind: step
  status: explained
  chunk: c0027
  plain: >
    This file proves a claim. Let Q be a prime ideal in a polynomial ring over a base ring Λ
    with perfect fraction field, with only 0 from Λ inside Q. Then there are h polynomials in Q
    that generate it after one outside multiplier. Also h of the variables can be chosen so that
    the h by h matrix of partial derivatives of those polynomials has determinant not in Q.
    The idea is that the minimal generators from the earlier file have independent derivatives.
    A dependency would give a combination with every derivative in Q, hence in Q squared by
    the smoothness file, contradicting minimality. The rows-and-determinant file then picks the
    variables.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsGenericJacobianDataOfPrime.lean:9]
  mathlib: [IsLocalization.exist_integer_multiples_of_finite, IsFractionRing.injective, RingHom.map_det, MvPolynomial.pderiv]
  needs: [f-exists-minimal-local-generators, f-mem-sq-localization-of-pderiv-mem, f-exists-det-ne-zero-of-rows-separating, concept-derivations-smoothness, concept-prime-ideals-localization]

- id: f-exists-generic-jacobian-data-iterated
  title: Invertible Jacobian for polynomials in two groups of variables
  kind: step
  status: explained
  chunk: c0027
  orphan: true
  plain: >
    This file proves a claim, the two-layer version of the previous result. Now the ring is
    polynomials in variables of one group over polynomials in variables of a second group over
    Λ. Derivations, which are rules for taking a derivative, are given, one per variable, and
    agree with the usual partial derivatives on the layers. The same conclusion holds, with
    the generators f and multiplier g, and a determinant of derivatives not in Q. The proof
    identifies the two-layer ring with ordinary polynomials in the combined variables, checks
    the derivatives match, and applies the one-layer theorem.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsGenericJacobianDataIterated.lean:49]
  mathlib: [MvPolynomial.sumAlgEquiv, MvPolynomial.pderiv, Derivation.leibniz, Ideal.map_span, AlgEquiv.map_det]
  needs: [f-exists-generic-jacobian-data-of-prime, concept-derivations-smoothness, polynomials]
