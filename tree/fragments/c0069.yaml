nodes:
  - id: f-unit-t-zpow
    title: Base change for rings with a Laurent variable
    kind: step
    status: explained
    chunk: c0069
    plain: >
      This file defines T as an invertible element of the ring of Laurent polynomials (polynomials allowing negative powers of T). Its main result is a base-change statement. Start with a ring A, a map from Laurent polynomials over A into a ring B, and the ideal generated by f − T·g. Suppose A and K satisfy two conditions called Pf (defined in other files) and the map satisfies a condition PQ for that ideal. Then, passing to K, there is a matching map from Laurent polynomials over K into B ⊗ K that also satisfies PQ. The proof builds the maps from universal properties, checks they agree on generators, and calls an earlier lifting result. I could not tell from the bundle what Pf and PQ mean.
    lean: ["Development/AutomorphicSpectrum/Proofs/BlockDecomposition/UnitTZpow.lean:18"]
    mathlib: ["LaurentPolynomial.induction_on'", "AddMonoidAlgebra.liftNCRingHom", "Algebra.TensorProduct.includeRight"]
    needs: [f-block-decomposition--perfect-tensor-generated-lift, f-block-decomposition--pf-facts, concept-tensor-product-of-algebras, polynomials, rings-fields]
    orphan: true
