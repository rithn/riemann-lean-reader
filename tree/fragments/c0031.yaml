nodes:
  - id: f-orbital-bounds-conclusion--sigma-star-uniq
    title: Uniqueness of the lattice function, named version
    kind: step
    status: explained
    chunk: c0031
    orphan: true
    plain: >
      This file gives the final name to a uniqueness result about a special function attached to a lattice (a grid of points in the plane). It proves nothing new itself. It takes the lattice area formula, which is proved elsewhere, and feeds it into a general uniqueness theorem. The output is the claim that two functions with the same defining properties must be the same function. So the result is only as strong as the area formula it is given. The real work happens in the file it calls, which builds the argument from Fourier coefficients (the "ingredients" of a repeating wave).
    lean: ["Formalism/PeriodIntegrals/OrbitalBoundsConclusion/SigmaStarUniq.lean:6"]
    mathlib: []
    needs: [f-sigma-star-uniq-of, f-orbital-bounds-conclusion--area-lat, f-period-integrals--sigma-star-uniq]
  - id: f-period-integrals--sigma-star-uniq
    title: "Statement: the lattice function is unique"
    kind: step
    status: explained
    chunk: c0031
    plain: >
      This file only states a claim and does not prove it. Take a lattice in the plane generated by two numbers w1 and w2 that do not lie on one line through zero. The claim is about smooth complex functions G that are odd (G of minus z is minus G of z), have slope 1 at zero, and obey a fixed sign rule when you shift by any lattice point. The rule says shifting gives back G times plus or minus one, the sign depending on whether half the shift is itself a lattice point. The claim: any two such functions are equal. Think of it as saying the pattern leaves no freedom.
    lean: ["Formalism/PeriodIntegrals/SigmaStarUniq.lean:7"]
    mathlib: []
    needs: [f-lat-defs, concept-lattices-in-the-plane, complex-analysis]
  - id: f-coef-shift
    title: Fourier coefficients and shifting by a lattice step
    kind: step
    status: explained
    chunk: c0031
    plain: >
      This file proves two things, assuming two earlier claims as hypotheses (that shifting the integration path does not change a Fourier coefficient, and that a function with all coefficients zero is zero). First, if a smooth function repeats every 1 and gets multiplied by a known factor when shifted by tau, then its n-th coefficient equals a constant times its coefficient number n plus k. Second, if one coefficient vanishes, all of them do, because the relation links neighbours and steps up or down by one. By completeness the function is then zero. The proof is an exponential-rewriting calculation plus induction on whole numbers.
    lean: ["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/CoefShift.lean:9", "Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/CoefShift.lean:24"]
    mathlib: [intervalIntegral.integral_const_mul, intervalIntegral.integral_congr, Complex.exp_add, Int.induction_on]
    needs: [f-complete, fourier-analysis, complex-numbers, calculus]
  - id: f-complete
    title: "Definitions: Fourier coefficient, completeness, shifted-function setup"
    kind: step
    status: explained
    chunk: c0031
    plain: >
      This file has no proofs, only definitions and three claims written as named statements. A Fourier coefficient of a function that repeats every 1 is an average of the function times a spinning exponential, taken over one period. "Shift invariance" is the claim that sliding the averaging path sideways in the complex plane does not change that average. "Completeness" is the claim that a smooth repeating function whose coefficients are all zero is zero. A third claim handles a function with a sign-like shift rule. The file also defines a rescaled version of a function and a constant used in later calculations.
    lean: ["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/Complete.lean:12", "Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/Complete.lean:15", "Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/Complete.lean:19"]
    mathlib: []
    needs: [fourier-analysis, complex-numbers, calculus]
  - id: f-siegel-set-completeness
    title: A smooth repeating function with all Fourier coefficients zero is zero
    kind: step
    status: explained
    chunk: c0031
    plain: >
      This file proves the completeness claim. Take a function defined on the whole complex plane, smooth in the complex sense, and repeating every 1. Suppose all its Fourier coefficients vanish. Restrict it to the real line and view it as a function on a circle. A standard theorem says a continuous function on a circle with all coefficients zero is zero. So the function vanishes at every real point. Real points pile up near zero, and a complex-smooth function that vanishes on a pile-up must vanish everywhere (the identity theorem). Hence the function is zero.
    lean: ["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/SiegelSetCompleteness.lean:9"]
    mathlib: [hasSum_fourier_series_L2, fourierCoeff_eq_intervalIntegral, AnalyticOnNhd.eqOn_zero_of_preconnected_of_frequently_eq_zero]
    needs: [f-complete, fourier-analysis, complex-analysis]
  - id: f-siegel-set-shift-invariance
    title: Sliding the Fourier averaging path does not change the coefficient
    kind: step
    status: explained
    chunk: c0031
    plain: >
      This file proves the shift-invariance claim. A Fourier coefficient averages a repeating function against a spinning exponential along a horizontal segment. Here the segment may be moved to any other starting point in the complex plane. The result is unchanged. The proof multiplies the function by the exponential to get a new smooth function that repeats every 1. A rectangle integral of a smooth function is zero (Cauchy's theorem). The two vertical sides cancel because of the repetition. So the top and bottom sides agree, and sliding sideways is harmless by periodicity.
    lean: ["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/SiegelSetShiftInvariance.lean:9"]
    mathlib: [Complex.integral_boundary_rect_eq_zero_of_differentiableOn, intervalIntegral.integral_comp_add_right, Function.Periodic.intervalIntegral_add_eq]
    needs: [f-complete, complex-analysis, fourier-analysis]
  - id: f-sigma-star-uniq-of
    title: The lattice function is unique, given the area formula
    kind: step
    status: explained
    chunk: c0031
    plain: >
      This file proves uniqueness only on the assumption that the lattice area formula holds, since that formula is a hypothesis here. It is a one-line assembly. Two earlier results, shift invariance and completeness of Fourier coefficients, are combined into a key lemma about functions with a quasi-periodic shift rule. That lemma, together with the area formula, is passed to the main argument in the zero-of-coefficient file. The result is the uniqueness statement for the special lattice function. Nothing new is computed here.
    lean: ["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/SigmaStarUniqOf.lean:8"]
    mathlib: []
    needs: [f-zero-of-coef, f-coef-shift, f-siegel-set-completeness, f-siegel-set-shift-invariance, f-period-integrals--area-lat, f-period-integrals--sigma-star-uniq]
  - id: f-zero-of-coef
    title: Two lattice functions with the same rules are equal
    kind: step
    status: explained
    chunk: c0031
    plain: >
      This file proves the uniqueness claim, but only by assuming the key lemma (a quasi-periodic function with one vanishing Fourier coefficient is zero) and the lattice area formula. The idea is to rescale a function so it repeats every 1 and picks up a known factor when shifted by a second number. The key lemma then says it is zero once its zeroth coefficient is zero. For two candidate functions G and G', combine them so the zeroth coefficient cancels. Then the combination is zero, so G' is a constant multiple of G. Slope 1 at zero forces the constant to be 1.
    lean: ["Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/ZeroOfCoef.lean:73", "Formalism/PeriodIntegrals/UnitaryGroupMassFormula/ThetaSeriesUniqueness/ZeroOfCoef.lean:94"]
    mathlib: [Complex.exp_log, intervalIntegral.integral_sub, deriv_const_mul]
    needs: [f-complete, f-period-integrals--sigma-star-uniq, f-period-integrals--area-lat, f-lat-defs, complex-analysis, complex-powers]
