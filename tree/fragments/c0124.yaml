nodes:
  - id: f-localization-closure-smooth
    title: A localized polynomial-like ring is smooth over its base
    kind: step
    status: explained
    chunk: c0124
    orphan: true
    plain: >
      Setting: a field Omega inside a bigger field K, a subring R of Omega, and finitely many elements of K that are algebraically
      independent (no polynomial relation among them over Omega). Take the ring generated by R and these elements, then invert one
      nonzero element l of it. The theorem says R maps smoothly into the result, so it behaves like a smooth family of shapes.
      The proof shows the generated ring is a polynomial ring over R (independence means no collapse), so the result is a localization
      of a polynomial ring at one element. Polynomial rings are smooth over R, and so are such localizations. Smoothness composes.
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/LocalizationClosureSmooth.lean:60"]
    mathlib: [Algebra.Smooth.of_isLocalization_Away, RingHom.Smooth.comp, algebraicIndependent_iff_injective_aeval, MvPolynomial.eval₂Hom]
    needs: [concept-smooth-morphisms, concept-field-extensions-transcendence, concept-prime-ideals-localization, concept-finitely-generated-algebras, polynomials, rings-fields]
