nodes:

- id: concept-field-extensions-transcendence
  title: Field extensions, algebraic vs transcendental elements
  kind: concept
  status: textbook
  plain: >
    Given a field k sitting inside a bigger field C, a number in C is "algebraic over k"
    if it solves a polynomial equation with coefficients in k (sqrt 2 over the rationals),
    and "transcendental" otherwise (pi). Several numbers are "algebraically independent"
    if no polynomial relation links them. A "transcendence basis" is a maximal
    independent list; everything else in C is then algebraic over the field it generates.
    The "primitive element theorem" says a finite list of algebraic numbers (in
    characteristic 0) can all be built from a single one.
  needs: [rings-fields, polynomials, linear-algebra, algebraic-closure]
  learn:
    - {title: "Dummit & Foote, Abstract Algebra", where: "Ch. 13 (field extensions), Sec. 14.4 (primitive element); transcendence bases in Lang, Algebra, Ch. VIII"}
    - {title: "Lang, Algebra", where: "Ch. VIII, Transcendental extensions"}

- id: f-exists-transcendence-basis-algebraic
  title: A finite family has a transcendence basis it is algebraic over
  kind: step
  status: explained
  plain: >
    Take a field k inside a bigger field C and finitely many elements a_1..a_m of C.
    The file proves one can pick d elements t_1..t_d of C that are algebraically
    independent over k (no polynomial relation with coefficients in k) such that
    every a_j is algebraic over the field generated by k and the t's. The proof
    picks, among the subsets of {a_1..a_m} that are algebraically independent, a
    largest one (there are only finitely many subsets). If some a_j were left out
    and still not algebraic over the chosen ones, adding it would give a bigger
    independent set, contradicting maximality. Example: k = Q, a = (pi, 2pi, sqrt 2):
    take t = (pi); 2pi and sqrt 2 are algebraic over Q(pi).
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsTranscendenceBasisAlgebraic.lean:6]
  mathlib: [AlgebraicIndepOn, AlgebraicIndepOn.insert_iff, IntermediateField.isAlgebraic_adjoin_iff, Set.Finite.exists_maximal]
  needs: [concept-field-extensions-transcendence, rings-fields, counting]

- id: f-monic-polynomial-primitive-over-basis
  title: Rescale an algebraic element so its equation is monic, over polynomials
  kind: step
  status: explained
  plain: >
    Setup: t_1..t_d are algebraically independent over k, so the ring they generate
    behaves like ordinary polynomials in d variables, and the field they generate
    is its fraction field. Given alpha algebraic over that fraction field, the file
    builds a new element theta (alpha multiplied by a suitable polynomial y, which
    clears the denominators in alpha's equation). Theta satisfies a monic equation P
    whose coefficients are genuine polynomials in d variables, alpha is recovered
    from theta by dividing by y, and P divides every other polynomial equation
    theta satisfies. The last point uses that polynomial rings in several variables
    over a field are integrally closed (a unique factorisation fact). Analogy:
    clearing denominators to turn a fraction-coefficient equation into an
    integer-coefficient monic one.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/MonicPolynomialPrimitiveOverBasis.lean:7]
  mathlib: [IsAlgebraic.exists_integral_multiple, minpoly.isIntegrallyClosed_dvd, UniqueFactorizationMonoid.instIsIntegrallyClosed, AlgebraicIndependent.aevalEquiv, IsFractionRing.isAlgebraic_iff]
  needs: [f-exists-transcendence-basis-algebraic, concept-field-extensions-transcendence, polynomials, rings-fields]

- id: f-primitive-element-finite-algebraic
  title: Primitive element for finitely many algebraic elements
  kind: step
  status: explained
  plain: >
    In characteristic 0, if finitely many elements a_1..a_m of a field C are each
    algebraic over a subfield K, then one single element alpha (also algebraic over
    K) generates all of them: each a_j lies in K(alpha). Proof: the field K(a_1..a_m)
    is finite-dimensional over K, Mathlib's primitive element theorem gives one
    generator of it, and that generator is alpha. Example: Q(sqrt 2, sqrt 3) is
    generated by sqrt 2 + sqrt 3.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/PrimitiveElementFiniteAlgebraic.lean:6]
  mathlib: [Field.exists_primitive_element, IntermediateField.finiteDimensional_adjoin, IntermediateField.adjoin_map]
  needs: [concept-field-extensions-transcendence, linear-algebra, rings-fields]

- id: f-primitive-element-coordinate-polynomials
  title: Write each element as a polynomial in theta with one common denominator
  kind: step
  status: explained
  plain: >
    Setting: theta is algebraic over the field K0 generated by the t's, and each x_j
    lies in K0(theta). Then x_j equals a polynomial in theta with coefficients in K0,
    and each coefficient is a fraction of polynomials in the t's. The main result
    finds a single polynomial Delta in d variables (nonzero when evaluated at t) and
    polynomials Q_j (in one variable, coefficients polynomials in d variables) with
    Q_j(theta) = Delta * x_j: a common denominator for everything. The helper
    commonDenom_finset does the key step by induction on a finite set of elements
    of K0: multiply the denominators together, treating a zero denominator as a
    separate case.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/PrimitiveElementCoordinatePolynomials.lean:35]
  mathlib: [IntermediateField.mem_adjoin_range_iff, IntermediateField.adjoin_simple_toSubalgebra_of_isAlgebraic, Polynomial.lifts_iff_coeff_lifts, Finset.induction_on]
  needs: [concept-field-extensions-transcendence, polynomials, rings-fields]

- id: f-primitive-element-denominator-clearing
  title: Specialise the structure to another field, clearing denominators
  kind: step
  status: explained
  plain: >
    Given the data from the previous steps (theta, monic equation P, denominator
    Delta, polynomials Q_j with Q_j(theta) = Delta * a_j), take any other field B
    and values t', theta' where Delta(t') is nonzero and theta' satisfies P. The
    main result then produces a ring homomorphism from the ring generated by the
    a_j to B sending a_j to Q_j(theta')/Delta(t'); in other words the algebraic
    relations among the a_j survive the swap. Proof idea: if a polynomial H in the
    a_j vanishes, a helper shows some power of Delta times H(a) equals R(theta) for
    some polynomial R; R(theta)=0 forces P to divide R, hence R(theta')=0, and so
    H(b)=0 after dividing by a power of Delta(t'), which is nonzero. So the map is
    well defined on the quotient. This is a standard specialisation-of-finitely-
    generated-algebras argument.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/PrimitiveElementDenominatorClearing.lean:43]
  mathlib: [Ideal.quotientKerAlgEquivOfSurjective, Ideal.Quotient.liftₐ, MvPolynomial.induction_on, Algebra.adjoin_range_eq_range_aeval]
  needs: [f-primitive-element-coordinate-polynomials, f-monic-polynomial-primitive-over-basis, concept-field-extensions-transcendence, polynomials, rings-fields]

- id: f-polynomial-system-specialization
  title: Structure of a finitely generated field, ready for specialisation
  kind: step
  status: explained
  orphan: true
  plain: >
    Assembly theorem. For a field k of characteristic 0 inside C, and finitely many
    elements a_1..a_m of C, there are algebraically independent t_1..t_d, an element
    theta with a monic equation P over polynomials in the t's, a nonzero Delta, and
    polynomials Q_j with Q_j(theta) = Delta * a_j. Moreover, for any other field B
    and any values t', theta' with Delta(t') nonzero and P(theta') = 0, there is a
    homomorphism from the k-algebra generated by the a_j to B compatible with the
    Q_j. The proof chains the other five files in this chunk: transcendence basis,
    primitive element, rescaling to monic form, common denominators, and
    denominator clearing. Where this is used elsewhere was not checked.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/PolynomialSystemSpecialization.lean:11]
  needs: [f-exists-transcendence-basis-algebraic, f-primitive-element-finite-algebraic, f-monic-polynomial-primitive-over-basis, f-primitive-element-coordinate-polynomials, f-primitive-element-denominator-clearing]
