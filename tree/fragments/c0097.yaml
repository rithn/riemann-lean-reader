nodes:
  - id: f-eq-of-sec-alg-top
    title: "Setup for pulling back a Hilbert-scheme ideal, and maps into Spec A are fixed by global sections"
    kind: step
    status: explained
    chunk: c0097
    plain: >
      Mostly definitions, plus one small proved fact. The setting is a ring B
      over a ring A, and a shape T with a map to the "space" of A. The file
      defines how A acts on the functions over an open piece U of T, a ring
      map called kappa from functions-tensor-B into the functions on a
      sub-shape cut out by an ideal sheaf, and the ideal that a quotient of
      the tensor ring defines. The proved fact: two maps from T into the space
      of A are equal when they induce the same ring map on all functions on T.
      That is the standard fact that, for affine targets, maps are determined
      by rings.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/EqOfSecAlgTop.lean:11", "Development/AbelianVarietyTheory/Proofs/DivisorProofs/EqOfSecAlgTop.lean:57", "Development/AbelianVarietyTheory/Proofs/DivisorProofs/EqOfSecAlgTop.lean:139"]
    mathlib: ["AlgebraicGeometry.ext_of_isAffine", "AlgebraicGeometry.Scheme.ΓSpecIso"]
    needs: [concept-schemes-basics, concept-categorical-pullbacks, concept-tensor-product-of-algebras]
  - id: f-kappa-apply-eq
    title: "The tensor-product map into the sub-shape factors through the pullback"
    kind: step
    status: explained
    chunk: c0097
    plain: >
      This file builds the ring map theta, which sends a simple tensor c ⊗ b
      (a function c on the piece U times an element b of B) to the product of
      the matching functions on the pullback shape. It proves that the earlier
      map kappa into the sub-shape is just theta followed by restriction to
      the sub-shape. Therefore the kernel of kappa is the preimage under theta
      of the kernel of restriction. It also defines psi, the same construction
      over the whole space of a second ring C. The proofs check the
      statements on simple tensors and then extend by adding.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/KappaApplyEq.lean:32", "Development/AbelianVarietyTheory/Proofs/DivisorProofs/KappaApplyEq.lean:56", "Development/AbelianVarietyTheory/Proofs/DivisorProofs/KappaApplyEq.lean:74", "Development/AbelianVarietyTheory/Proofs/DivisorProofs/KappaApplyEq.lean:81"]
    mathlib: ["TensorProduct.induction_on", "Algebra.TensorProduct.lift"]
    needs: [f-eq-of-sec-alg-top, concept-tensor-product-of-algebras, concept-schemes-basics, concept-categorical-pullbacks]
  - id: f-section-tensor-pullback-ring-hom-bijective
    title: "Functions on a pullback over an affine piece are exactly a tensor product"
    kind: step
    status: explained
    chunk: c0097
    plain: >
      This proves that the ring map theta from the tensor product of functions
      with B to the functions on the pullback shape is a bijection, when the
      piece U is affine (given by a single ring). The idea is that for
      affine pieces, a pullback of shapes corresponds to a tensor product of
      rings (a "pushout" of rings). So theta is compared with the standard
      isomorphism between a tensor product and a pushout, and it matches on
      the two inclusions. A ring map that is an isomorphism is a bijection.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/SectionTensorPullbackRingHomBijective.lean:8"]
    mathlib: ["CommRingCat.isPushout_tensorProduct", "ConcreteCategory.bijective_of_isIso"]
    needs: [f-kappa-apply-eq, concept-tensor-product-of-algebras, concept-categorical-pullbacks, concept-schemes-basics]
  - id: f-ideal-sheaf-comap-ideal-affine-open-of-is-affine
    title: "Pulling back an ideal sheaf from an affine shape, piece by piece"
    kind: step
    status: explained
    chunk: c0097
    plain: >
      An ideal sheaf is a choice of an ideal of functions on every piece of a
      shape; it cuts out a sub-shape. This proves a formula: if you pull an
      ideal sheaf K back along a map f into an affine shape Y, then on any
      affine open piece W of the source, the ideal is generated by the images
      of the elements of K's ideal on all of Y. The proof first handles the
      case where the source piece is the whole thing, using an earlier result
      for affine shapes, then moves to W using the inclusion of W.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/IdealSheafComapIdealAffineOpenOfIsAffine.lean:7"]
    mathlib: ["AlgebraicGeometry.Scheme.IdealSheafData", "Ideal.map_comap_of_surjective"]
    needs: [f-divisor-proofs--ideal-sheaf-data-comap-ideal-top-of-is-affine, concept-schemes-basics, concept-prime-ideals-localization]
  - id: f-divisor-proofs--affine-hilbert-ideal-sheaf-of-quotient-ideal-top
    title: "The ideal sheaf of a quotient has, over the whole space, the image of the ideal"
    kind: step
    status: explained
    chunk: c0097
    plain: >
      Take rings A, B and C, and an ideal J of the tensor product C ⊗ B. The
      quotient by J defines a sub-shape, hence an ideal sheaf. This proves
      that, on the whole affine space, the ideal of that sheaf is simply the
      image of J under the ring map psi into the functions on the pullback.
      The proof shows psi is onto, then checks that the kernel of the
      relevant map of functions is the image of J, using the standard rule
      that the preimage of a kernel is the kernel of the composite.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/AffineHilbertIdealSheafOfQuotientIdealTop.lean:8"]
    mathlib: ["Ideal.map_comap_of_surjective", "RingHom.comap_ker", "AlgebraicGeometry.Scheme.ker_of_isAffine"]
    needs: [f-kappa-apply-eq, f-eq-of-sec-alg-top, concept-tensor-product-of-algebras, concept-prime-ideals-localization, concept-schemes-basics]
  - id: f-affine-hilbert-base-change-app-l-e-comp-spec-tensor
    title: "Two ways of mapping the tensor ring into functions on a base change agree"
    kind: step
    status: explained
    chunk: c0097
    plain: >
      A technical compatibility fact. There are two ring maps from the tensor
      product C ⊗ B into the functions on a pulled-back shape: one goes via
      psi and then the base-change map, the other goes via theta after a map
      φ on the first factor. The file proves they are the same. The proof
      checks it on simple tensors c ⊗ b, where both sides become the product
      of the image of b and the image of c, then extends to all sums. Most of
      the work is bookkeeping with how functions on pullbacks are indexed.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/AffineHilbertBaseChangeAppLECompSpecTensor.lean:10"]
    mathlib: ["TensorProduct.induction_on", "Algebra.TensorProduct.map"]
    needs: [f-kappa-apply-eq, f-eq-of-sec-alg-top, f-divisor-proofs--comap-bc-comp, concept-tensor-product-of-algebras, concept-categorical-pullbacks]
  - id: f-ker-affine-hilbert-tensor-pullback-eq-map
    title: "The kernel of kappa on a pulled-back ideal is the pushed-forward ideal"
    kind: step
    status: explained
    chunk: c0097
    orphan: true
    plain: >
      This is the end of the chain. For an ideal J of C ⊗ B and a shape Z over
      C, it finds a ring map φ from C into the functions on an affine piece U
      of Z, and proves that the kernel of kappa for the base-changed ideal
      sheaf equals J pushed forward along φ ⊗ identity. The proof combines
      the four earlier facts: the pulled-back ideal is generated by an image
      of J, the compatibility of the two maps from the tensor ring, and the
      bijectivity of theta, which lets the kernel be pulled back exactly.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/KerAffineHilbertTensorPullbackEqMap.lean:13"]
    mathlib: ["Ideal.map_map", "Ideal.comap_map_of_bijective"]
    needs: [f-ideal-sheaf-comap-ideal-affine-open-of-is-affine, f-divisor-proofs--affine-hilbert-ideal-sheaf-of-quotient-ideal-top, f-affine-hilbert-base-change-app-l-e-comp-spec-tensor, f-section-tensor-pullback-ring-hom-bijective, f-kappa-apply-eq, f-eq-of-sec-alg-top, concept-tensor-product-of-algebras]
