nodes:

- id: concept-exterior-powers
  title: Exterior powers and wedge products
  kind: concept
  status: textbook
  plain: >
    Given a vector space V, the N-th exterior power is a new vector space built from "wedge
    products" v1 ^ v2 ^ ... ^ vN of N vectors. The wedge is linear in each slot and becomes
    zero whenever two slots hold the same vector, or more generally dependent vectors. For two
    vectors in the plane, the wedge records the signed area of the parallelogram they span,
    which is the 2x2 determinant. If V has dimension n, the N-th exterior power has dimension
    n choose N. In particular, the top one, N equal to n, is a single line: determinants live
    there.
  needs: [linear-algebra, counting]
  learn:
    - {title: "Linear Algebra Done Right (Axler)", where: "Chapter 9, multilinear forms and determinants"}
    - {title: "Algebra (Lang)", where: "Chapter XIX, exterior algebra"}

- id: concept-witt-vectors-ainf
  title: Witt vectors, the tilt and the ring A-inf
  kind: concept
  status: textbook
  plain: >
    This is graduate-level p-adic number theory, and I could only sketch it. Witt vectors are a
    way to build a ring in which p is not zero from a ring in which p is zero. For the whole
    numbers mod p, they give the p-adic integers. Applied to the "tilt", a char-p ring made
    from a p-adic ring O, they give a ring called A-inf. It comes with a map theta back down to O.
    Inside A-inf, the element mu is a Teichmuller lift minus one, and it plays a role like a
    prime. Matrices over A-inf with such conditions encode p-adic Galois representations.
  needs: [p-adic-numbers, rings-fields, concept-ultrametric-norm, modular-arithmetic]
  learn:
    - {title: "Lectures on Peter Scholze's perfectoid spaces (Bhatt)", where: "Lecture notes on A-inf and the tilting equivalence"}
    - {title: "Local Fields (Serre)", where: "Chapter II, section 6, Witt vectors"}

- id: concept-integral-lattices-valuation-rings
  title: Valuation rings and integral lattices in a vector space
  kind: concept
  status: textbook
  plain: >
    A valuation measures size in a field C so that a product has size multiplied. The elements of
    size at most 1 form a valuation ring O. For the rationals with the 2-adic size, O is the
    fractions with odd denominator. An O-lattice in a C-vector space is the set of all
    O-combinations of finitely many vectors. On a line over C, any such lattice is generated by
    one vector, the one of largest size, because the others are O-multiples of it. In higher
    dimension, a lattice is the analogue of the integer grid inside the plane.
  needs: [concept-ultrametric-norm, concept-lattices-in-the-plane, linear-algebra, rings-fields]
  learn:
    - {title: "Local Fields (Serre)", where: "Chapter I, discrete valuation rings"}
    - {title: "Algebraic Number Theory (Neukirch)", where: "Chapter II, valuations"}

- id: f-divisors--xi-mul-nu
  title: Teichmuller identities and the Datum structure (definitions)
  kind: step
  status: explained
  chunk: c0028
  plain: >
    This file is mostly definitions with two small proved identities. Starting from a prime p
    and a p-adic ring O, it sets up the ring A-inf and three elements: mu, nu and xi. The
    identity xi times nu equals mu is the formula for a geometric sum, x to the p minus 1 equals
    (x minus 1) times (1 plus x plus ... plus x to the p minus 1), applied to a Teichmuller
    lift. Another identity says that undoing Frobenius sends mu to nu. It then defines a "datum",
    a package of four matrices over A-inf with matching actions of a ring Λ and relations like
    G F = mu. Two examples, an etale one and a multiplicative one, are built. I am inferring
    the intended meaning from names.
  lean: [Development/AbelianVarietyTheory/Definitions/Divisors/XiMulNu.lean:36, Development/AbelianVarietyTheory/Definitions/Divisors/XiMulNu.lean:54]
  mathlib: [WittVector.teichmuller, geom_sum_mul, WittVector.map_teichmuller, frobeniusEquiv]
  needs: [concept-witt-vectors-ainf, p-adic-numbers, linear-algebra, polynomials]

- id: f-divisor-base--sandwich-maps
  title: Eigenspace lattices and the unproved LemmaDet statement
  kind: step
  status: explained
  chunk: c0028
  plain: >
    This file defines objects and states a claim without proving it. The claim is a named
    statement called LemmaDet, which a text search finds defined here and not proved here
    or used elsewhere in the project. The definitions are the real content. Given commuting
    matrices acting on vectors, the common eigenspace for a choice of eigenvalues is the set of
    vectors scaled by each matrix as prescribed. A lattice inside it is built from integral
    vectors. Its top wedge power, a line, gets an integral lattice. The file also defines
    maps iota between two such lines from a datum, and isogenies, which are maps with an
    inverse up to a power of p. LemmaDet says these maps are well defined and scale lattices by
    a specific power of p.
  lean: [Development/AbelianVarietyTheory/BlockTheory/DivisorBase/SandwichMaps.lean:15, Development/AbelianVarietyTheory/BlockTheory/DivisorBase/SandwichMaps.lean:96]
  mathlib: [Module.End.eigenspace, Matrix.toLin', exteriorPower.ιMulti, Valuation.Integers]
  needs: [f-divisors--xi-mul-nu, concept-exterior-powers, concept-integral-lattices-valuation-rings, concept-witt-vectors-ainf, linear-algebra]

- id: f-determinant-lattice-principal
  title: The determinant lattice is generated by one vector
  kind: step
  status: explained
  chunk: c0028
  orphan: true
  plain: >
    This file proves a claim. Take a field C with a size function, and its ring O of elements
    of size at most 1. Take matrices over O whose eigenspaces for different eigenvalue
    choices are independent and together fill the whole space. If one eigenspace has dimension
    N, then its N-th wedge power is a single line, and the lattice of wedges of integral
    vectors is generated by one nonzero vector. The proof chains five small steps: project onto the
    eigenspace, find finitely many lattice generators, wedge them, check wedges span the line,
    and use a one-line fact about lattices.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/DeterminantLatticePrincipal.lean:12]
  mathlib: [exteriorPower.ιMulti, Submodule.span]
  needs: [f-divisor-proofs--eigen-projection-quotient-lattice, f-divisor-proofs--exists-spanning-image-lattice, f-exterior-power-span-of-lattice, f-exterior-power-top-finrank-one, f-rank-one-lattice-span-singleton, f-divisor-base--sandwich-maps, concept-exterior-powers, concept-integral-lattices-valuation-rings]

- id: f-divisor-proofs--eigen-projection-quotient-lattice
  title: Projecting onto one eigenspace
  kind: step
  status: explained
  chunk: c0028
  plain: >
    This file proves a claim. Suppose the eigenspaces of a family of matrices are independent
    (no overlaps) and together fill the whole space. Then there is a projection pi onto the
    chosen eigenspace, which leaves its vectors unchanged. A vector x is the projection of z
    exactly when z minus x lies in the sum of the other eigenspaces. The special set of
    "integral" vectors of that eigenspace, defined as those within the other eigenspaces of an
    integer vector, is exactly the set of projections of integer vectors. The idea is that the
    chosen eigenspace and the sum of the others are complementary, so Mathlib's projection
    along a complement applies.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/EigenProjectionQuotientLattice.lean:7]
  mathlib: [Submodule.projectionOnto, Submodule.projectionOnto_apply_left, IsCompl, iSup_split_single]
  needs: [f-divisor-base--sandwich-maps, linear-algebra]

- id: f-divisor-proofs--exists-spanning-image-lattice
  title: Integer vectors map onto the lattice spanned by h vectors
  kind: step
  status: explained
  chunk: c0028
  plain: >
    This file proves a claim. Take a linear map pi from h-dimensional coordinate space over a
    field C onto another space V. Then the images of the h standard unit vectors span V over C.
    Also, the images of vectors whose coordinates all lie in the sub-ring O are exactly the
    O-combinations of those h image vectors. The proof is the linearity rule. The image of
    (x1, ..., xh) equals x1 times the first image plus x2 times the second, and so on. In
    the plane, if pi sends the unit vectors to u and w, integer-coordinate points go to the
    combinations a u plus b w.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsSpanningImageLattice.lean:7]
  mathlib: [pi_eq_sum_univ', Submodule.mem_span_range_iff_exists_fun, algebraMap_smul]
  needs: [f-divisor-base--sandwich-maps, linear-algebra, concept-integral-lattices-valuation-rings]

- id: f-exterior-power-span-of-lattice
  title: Wedges of lattice vectors come from wedges of generators
  kind: step
  status: explained
  chunk: c0028
  plain: >
    This file proves a claim. Let a lattice be all O-combinations of g1 to gh. Then the
    O-span of all wedge products x1 ^ ... ^ xN with every xi in the lattice equals the O-span of
    the wedges of N generators picked from the g's. One inclusion is easy. For the other,
    write each xi as a combination of the g's and expand using the wedge's linearity in each
    slot. Every term is an O-coefficient times a wedge of generators. For instance, in two
    dimensions, (a g1 + b g2) ^ (c g1 + d g2) expands to (ad minus bc) times g1 ^ g2.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExteriorPowerSpanOfLattice.lean:5]
  mathlib: [MultilinearMap.map_sum, MultilinearMap.map_smul_univ, Submodule.span_le]
  needs: [f-divisor-base--sandwich-maps, concept-exterior-powers, concept-integral-lattices-valuation-rings]

- id: f-exterior-power-top-finrank-one
  title: The top wedge power is a line, with a nonzero generator wedge
  kind: step
  status: explained
  chunk: c0028
  plain: >
    This file proves a claim. Let g1 to gh span a vector space V over a field, and let V have
    dimension N. Then the N-th wedge power of V has dimension exactly 1. Moreover, some choice
    of N of the g's has a nonzero wedge. The dimension count is the binomial coefficient
    N choose N, which is 1. For the second part, suppose every such wedge were zero. Those wedges
    span the whole wedge power by a Mathlib fact, so the wedge power would be zero, contradicting
    dimension 1. This generalises the fact that N vectors in N-space have nonzero determinant only if
    they are independent.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExteriorPowerTopFinrankOne.lean:7]
  mathlib: [exteriorPower.finrank_eq, exteriorPower.ιMulti_span_of_span, Nat.choose_self]
  needs: [f-divisor-base--sandwich-maps, concept-exterior-powers, linear-algebra, counting]

- id: f-rank-one-lattice-span-singleton
  title: A lattice in a line has a single generator
  kind: step
  status: explained
  chunk: c0028
  plain: >
    This file proves a claim. Let C be a field with a size function v, O the elements of size at
    most 1, and V a line over C. Take finitely many vectors u_i, not all zero. Then their O-span
    is generated by one nonzero vector. Write each u_i as a number c_i times a fixed base
    vector. Pick the index whose c has largest size. Every other u_i is an O-multiple of it,
    since the ratio has size at most 1. Example, 2-adic size on the rationals: from 3, 1/2 and 4
    the largest is 1/2, and 3 equals 6 times 1/2, 4 equals 8 times 1/2.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/RankOneLatticeSpanSingleton.lean:7]
  mathlib: [finrank_eq_one_iff', Finite.exists_max, Valuation.Integers.exists_of_le_one, Submodule.span_le]
  needs: [f-divisor-base--sandwich-maps, concept-integral-lattices-valuation-rings, concept-ultrametric-norm]
