nodes:

- id: concept-lattices-in-the-plane
  title: Lattices in the complex plane
  kind: concept
  status: textbook
  plain: >
    A lattice is the set of all whole-number combinations m*w1 + n*w2 of two complex
    numbers w1, w2 that do not point along the same line, like the grid of corners
    of a tiling of the plane by identical parallelograms. The area of one tile is
    |Im(conj(w1) * w2)|, which is the same as the absolute value of the 2x2
    determinant of the two vectors w1, w2 read as points in the plane. Changing to
    another pair of generators of the same grid changes this number by a
    whole-number determinant of +1 or -1, so the area does not depend on the choice.
  needs: [complex-numbers, linear-algebra, groups]
  learn:
  - title: "Silverman, The Arithmetic of Elliptic Curves (lattices and elliptic functions)"
    where: "Chapter VI, section 1"
  - title: "Stein and Shakarchi, Complex Analysis"
    where: "Chapter 9 (elliptic functions)"

- id: concept-ideals-and-discriminant
  title: Ideals, ideal norm and discriminant of a number field
  kind: concept
  status: textbook
  plain: >
    In a quadratic number field K (for example Q(i), or Q(sqrt(-5))) the "integers"
    O_K form a ring that, as a plain additive group, looks like Z x Z (a 2-D grid).
    An ideal is a subset of O_K closed under addition and under multiplication by
    any element of O_K; a nonzero ideal is itself a smaller 2-D grid inside O_K.
    Its norm is the number of grid points of O_K per grid point of the ideal, i.e.
    the index of the ideal in O_K. The discriminant of K is one integer that
    measures the shape of O_K: it is the determinant of the matrix of traces
    Tr(b_i * b_j) for a basis b_0, b_1.
  needs: [number-fields, rings-fields, linear-algebra, groups]
  learn:
  - title: "Marcus, Number Fields"
    where: "Chapters 2 and 3 (integers, ideals, norm, discriminant)"
  - title: "Neukirch, Algebraic Number Theory"
    where: "Chapter I, sections 2 to 4"

- id: f-lat-defs
  title: Basic lattice definitions (lat2, area, Eisenstein sums)
  kind: step
  status: explained
  plain: >
    Sets up the vocabulary used by the whole lattice section. `lat2 w1 w2` is the
    lattice of all whole-number combinations m*w1 + n*w2 (the smallest additive
    group containing w1 and w2). `area L` is defined as the smallest positive value
    of |Im(conj(w1) * w2)| over all pairs of points w1, w2 of the lattice L, which
    for a genuine lattice is the area of one parallelogram tile. The file also
    defines `eisG L k` (sum of 1/w^(2k) over the nonzero lattice points w), the
    numbers g2 = 60 * eisG L 2 and g3 = 140 * eisG L 3 built from it, and
    `discr L = g2^3 - 27*g3^2`; these are the standard invariants of the elliptic
    curve attached to a lattice. `U1` shifts a function G by omega and multiplies
    by an exponential factor with area L in the denominator; I take this to be a
    "magnetic translation" operator of the kind used for theta functions, but the
    file does not say what it is for.
  lean: [Formalism/PeriodIntegrals/LatDefs.lean:7]
  mathlib: [AddSubgroup.closure, tsum, Complex.exp]
  needs: [concept-lattices-in-the-plane, complex-numbers, complex-analysis, infinite-series, real-analysis]

- id: f-period-integrals--area-lat
  title: Statement - area of a two-generator lattice
  kind: step
  status: explained
  plain: >
    States (does not prove) the claim `AreaLat`. If w1, w2 are complex numbers
    with Im(conj(w1) * w2) not zero (so they are not on one line through 0), then
    the lattice they generate has area exactly |Im(conj(w1) * w2)|, and for any two
    points a, b of that lattice, Im(conj(a) * b) is a whole-number multiple of
    Im(conj(w1) * w2). Example. For w1 = 1 and w2 = i, Im(conj(1)*i) = 1, so the
    lattice of Gaussian integers has area 1.
  lean: [Formalism/PeriodIntegrals/AreaLat.lean:7]
  needs: [f-lat-defs, concept-lattices-in-the-plane, complex-numbers]

- id: f-period-integrals--ideal-lattice
  title: Statement - area of a lattice from an ideal of an imaginary quadratic field
  kind: step
  status: explained
  plain: >
    States (does not prove) the claim `IdealLattice`. Take a number field K of
    degree 2 with no real embedding (an imaginary quadratic field such as Q(i)),
    one chosen way phi of viewing K inside the complex numbers, a nonzero ideal cc
    of its integers, and a nonzero complex number delta. Then the set of points
    delta * phi(c), for c in cc, is a lattice generated by two complex numbers
    w1, w2 (not on one line), and its area equals |delta|^2 * N(cc) * sqrt|D| / 2,
    where N(cc) is the ideal norm and D the discriminant of K. Example. For K =
    Q(i), cc the whole ring Z[i], delta = 1: the norm is 1, D = -4, so the area is
    1 * 1 * 2 / 2 = 1, which matches the unit square grid.
  lean: [Formalism/PeriodIntegrals/IdealLattice.lean:7]
  mathlib: [NumberField.discr, Ideal.absNorm, NumberField.RingOfIntegers]
  needs: [f-lat-defs, concept-ideals-and-discriminant, concept-lattices-in-the-plane, number-fields, complex-numbers]

- id: f-im-conj-mul-combo
  title: Proof - area of a two-generator lattice
  kind: step
  status: explained
  plain: >
    Proves `AreaLat`. First an algebra identity: for a = m*w1 + n*w2 and
    b = m'*w1 + n'*w2, Im(conj(a)*b) = (m*n' - n*m') * Im(conj(w1)*w2), proved by
    expanding and rearranging. So every such quantity is a whole-number multiple k
    of the basic one. The area is the smallest positive |k| * |Im(conj(w1)*w2)|;
    k cannot be zero (the value is positive) so |k| >= 1, and k = 1 is reached by
    taking a = w1 and b = w2. Hence area = |Im(conj(w1)*w2)|. Note that despite the
    file name, the main theorem `areaLat` lives here too, alongside the helpers
    `im_conj_mul_combo` and `im_integral`.
  lean: [Formalism/PeriodIntegrals/UnitaryGroupMassFormula/LatticeArea/ImConjMulCombo.lean:25]
  mathlib: [AddSubgroup.mem_closure_pair, IsLeast.csInf_eq, Int.one_le_abs, Complex.mul_im]
  needs: [f-period-integrals--area-lat, f-lat-defs, complex-numbers, groups]

- id: f-orbital-bounds-conclusion--area-lat
  title: Area lattice formula (named theorem)
  kind: step
  status: explained
  plain: >
    A one-line wrapper that gives the already proved lattice-area result a headline
    name, `area_lattice_formula`. It just points to the proof in the
    ImConjMulCombo file (the area of the lattice generated by w1, w2 is
    |Im(conj(w1)*w2)|). No new maths here.
  lean: [Formalism/PeriodIntegrals/OrbitalBoundsConclusion/AreaLat.lean:6]
  needs: [f-im-conj-mul-combo, f-period-integrals--area-lat, f-lat-defs]

- id: f-ideal-basis-alt
  title: Definitions of the three ingredients for the ideal-lattice area
  kind: step
  status: explained
  plain: >
    Only definitions (as statements, no proofs). `OKArea`. For an imaginary
    quadratic field K and any two-element Z-basis b0, b1 of its integers,
    |Im(conj(phi(b0))*phi(b1))| = sqrt|D|/2. `IdealBasis`. Every nonzero ideal has
    two generators c1, c2 (as a Z-module) which are whole-number combinations of
    b0, b1 with coefficient determinant p*s - q*r of absolute value equal to the
    ideal norm. `OKBasis`. A degree-2 field's integers have a two-element
    Z-basis. `Assemble` says these three plus the area-of-lattice statement
    `AreaLat` together give `IdealLattice`.
  lean: [Formalism/PeriodIntegrals/UnitaryGroupMassFormula/IdealLatticeBasis/IdealBasisAlt.lean:9, Formalism/PeriodIntegrals/UnitaryGroupMassFormula/IdealLatticeBasis/IdealBasisAlt.lean:23]
  mathlib: [NumberField.discr, Ideal.absNorm, Module.Basis]
  needs: [f-period-integrals--ideal-lattice, f-period-integrals--area-lat, concept-ideals-and-discriminant, number-fields]

- id: f-ideal-basis
  title: Proof - a nonzero ideal has a two-element basis with determinant equal to its norm
  kind: step
  status: explained
  plain: >
    Proves `IdealBasis`. A nonzero ideal in a degree-2 field is itself a 2-D grid,
    so Mathlib supplies a basis c1, c2 of the ideal. Every element of the ideal is
    then a whole-number combination of c1, c2. Writing c1, c2 in terms of the basis
    b0, b1 of the full integers gives a 2x2 matrix of integers, and Mathlib's fact
    "determinant of the change of basis = index of the ideal" tells us that its
    determinant p*s - q*r has absolute value equal to the ideal norm. The proof is
    mostly unpacking those Mathlib results.
  lean: [Formalism/PeriodIntegrals/UnitaryGroupMassFormula/IdealLatticeBasis/IdealBasis.lean:8]
  mathlib: [Ideal.selfBasis, Ideal.natAbs_det_basis_change, Module.Basis.sum_repr, Matrix.det_fin_two]
  needs: [f-ideal-basis-alt, concept-ideals-and-discriminant, linear-algebra]

- id: f-o-k-area
  title: Proof - lattice of integers has area sqrt|D|/2
  kind: step
  status: explained
  plain: >
    Proves `OKArea`. Let x, y be the images in the complex numbers of the two basis
    elements of the integers of an imaginary quadratic field. The discriminant D is
    the determinant of the trace matrix Tr(b_i*b_j). Because the field has exactly
    two embeddings into the complexes (phi and its complex conjugate), the trace of
    z is phi(z) + conj(phi(z)); plugging in and simplifying, D = (x*conj(y) -
    conj(x)*y)^2, which equals -4 * Im(conj(x)*y)^2. Taking absolute values and
    square roots gives |Im(conj(x)*y)| = sqrt|D|/2. Helpers. `ne_conj` shows phi is
    different from its conjugate (using that there is no real embedding) and
    `sq_det_two` is the complex-number algebra step.
  lean: [Formalism/PeriodIntegrals/UnitaryGroupMassFormula/IdealLatticeBasis/OKArea.lean:23]
  mathlib: [Algebra.discr_def, NumberField.discr_eq_discr, Algebra.discr_localizationLocalization, trace_eq_sum_embeddings, AlgHom.card, NumberField.ComplexEmbedding.isReal_iff, Matrix.det_fin_two]
  needs: [f-ideal-basis-alt, concept-ideals-and-discriminant, number-fields, complex-numbers, linear-algebra]

- id: f-assemble
  title: Proof - put the pieces together to get the ideal lattice formula
  kind: step
  status: explained
  plain: >
    Proves that `OKArea`, `IdealBasis`, `OKBasis` and `AreaLat` together imply
    `IdealLattice`, and separately proves `OKBasis` (a degree-2 field's integers
    have a 2-element basis, from Mathlib's rank of the ring of integers). Idea.
    Take the two ideal generators c1, c2 and multiply by delta; the lattice is
    generated by delta*phi(c1), delta*phi(c2). The imaginary-part quantity for
    this pair is |delta|^2 * (p*s - q*r) * Im(conj(phi(b0))*phi(b1)), which is
    |delta|^2 * N(cc) * sqrt|D|/2 by `IdealBasis` and `OKArea`. It is nonzero, so
    `AreaLat` says the area equals it. Helpers `im_comb`, `im_scale`, `phi_comb`
    are algebra identities for this step. The final theorem is `idealLattice_of`.
  lean: [Formalism/PeriodIntegrals/UnitaryGroupMassFormula/IdealLatticeBasis/Assemble.lean:34, Formalism/PeriodIntegrals/UnitaryGroupMassFormula/IdealLatticeBasis/Assemble.lean:88]
  mathlib: [Module.finBasisOfFinrankEq, NumberField.RingOfIntegers.rank, NumberField.discr_ne_zero, Ideal.absNorm_eq_zero_iff, AddSubgroup.closure_le]
  needs: [f-ideal-basis-alt, f-orbital-bounds-conclusion--area-lat, f-period-integrals--ideal-lattice, f-period-integrals--area-lat, concept-ideals-and-discriminant, concept-lattices-in-the-plane, complex-numbers, groups]

- id: f-orbital-bounds-conclusion--ideal-lattice
  title: Ideal lattice basis theorem (named theorem)
  kind: step
  status: explained
  plain: >
    A one-line wrapper naming the result `ideal_lattice_basis`. For an ideal of an
    imaginary quadratic field, the lattice obtained by embedding it in the complex
    plane (and rescaling by delta) has two generators and area
    |delta|^2 * N(ideal) * sqrt|D|/2. It is obtained by plugging the `OKArea` and
    `IdealBasis` proofs into the assembly lemma. Nothing in the files I read uses
    this theorem further.
  lean: [Formalism/PeriodIntegrals/OrbitalBoundsConclusion/IdealLattice.lean:7]
  needs: [f-assemble, f-o-k-area, f-ideal-basis, f-period-integrals--ideal-lattice]
  orphan: true
