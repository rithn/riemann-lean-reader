nodes:
  - id: f-unit-eq-mul-pow-on-etale-excision-nbhd-zero-locus
    title: Fixing a unit to be a q-th power times a given unit, near a zero locus
    kind: step
    status: explained
    chunk: c0033
    orphan: true
    plain: >
      This is an algebra step in a geometry argument. Setup: a coordinate ring B of a curve-like shape over an algebraically closed field, a function f cutting out a zero set, and a neighbourhood of that zero set built from a ring A2 (an "excision neighbourhood", a ring where f's zero set looks the same). A unit c is given as a known expression. The result: after enlarging A2 to a bigger neighbourhood A3, c equals another given unit u times a q-th power of a new unit v. The proof clears denominators, takes a q-th root of a nearby unit using earlier root-finding results, and checks the equation by algebra.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/UnitEqMulPowOnEtaleExcisionNbhdZeroLocus.lean:11"]
    mathlib: [IsLocalization.Away.algebraMap_isUnit, Ideal.mem_span_singleton, IsScalarTower.algebraMap_apply]
