- id: f-affine-hilbert-scheme-valuative-criterion-existence
  title: Hilbert scheme of an algebra has the lifting property for properness
  kind: step
  status: explained
  chunk: c0017
  orphan: true
  plain: >
    Fix a ring A and a bigger ring B that is a finite free module over A. Suppose
    some geometric space H "classifies" all well-behaved sub-pieces of B of a fixed
    size r (assumed to exist; this file does not build H). The file proves that H
    satisfies the existence half of the valuative criterion for properness. That
    means: if you know a point of H over a "thin" field-like ring K, and its shadow
    over a "thick" valuation ring V inside K, you can always find a point over V that
    fits both. The idea: a point over K is an ideal; extend it to an ideal over V
    that stays flat (no sudden jumps in size), check it still has constant size r,
    and package the result.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/AffineHilbertSchemeValuativeCriterionExistence.lean:75]
  mathlib: [ValuativeCriterion.Existence, IsPullback.paste_vert, Module.free_of_flat_of_isLocalRing]
  needs: [f-divisor-proofs--comap-bc-comp, f-exists-flat-ideal-valuation-ring-pullback, f-flat-subscheme-of-quotient-flat-affine, f-divisor-proofs--ideal-sheaf-data-comap-ideal-top-of-is-affine, concept-affine-schemes, concept-valuation-rings, concept-flat-modules]

- id: f-divisor-proofs--comap-bc-comp
  title: The "good sub-pieces" functor and its base-change rules
  kind: step
  status: explained
  chunk: c0017
  plain: >
    This file sets up the objects used above and proves they behave well. Take a
    ring A, a finite algebra B over A, and a number r. Call a closed sub-piece of
    "B spread over a base T" good if it is finite over T, flat (no sudden jumps)
    and has exactly r pieces at every point. The file proves a good piece stays good
    when you pull back along a map of bases, and that pulling back twice equals pulling
    back once along the composite. Those checks show "base T goes to its good pieces"
    is a genuine functor, meaning a rule that respects composing maps. It proves
    these small compatibility facts; it builds no Hilbert scheme.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ComapBcComp.lean:14, Development/AbelianVarietyTheory/Proofs/DivisorProofs/ComapBcComp.lean:32, Development/AbelianVarietyTheory/Proofs/DivisorProofs/ComapBcComp.lean:77]
  mathlib: [CategoryTheory.Limits.pullback, AlgebraicGeometry.Scheme.IdealSheafData.comap, MorphismProperty.of_isPullback]
  needs: [concept-affine-schemes, concept-flat-modules]

- id: f-exists-flat-ideal-valuation-ring-pullback
  title: Ideals over the fraction field extend to flat ideals over a valuation ring
  kind: step
  status: explained
  chunk: c0017
  plain: >
    Let V be a valuation ring (a ring where, for any two nonzero elements, one divides
    the other; the integers localised at a prime are an example) with fraction field
    K. Take an affine space X over V and its "generic" copy X' over K, meaning X with
    denominators allowed. The file proves: every ideal of functions on X' is the
    extension of some ideal J of functions on X whose quotient is flat over V.
    The proof identifies functions on X' with K tensored over V with functions on X,
    then calls the unique-extension result in the neighbouring file.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsFlatIdealValuationRingPullback.lean:10]
  mathlib: [CommRingCat.isPushout_tensorProduct, Ideal.map_comap_of_surjective, RingHom.flat_algebraMap_iff]
  needs: [f-divisor-proofs--imports-alt, concept-valuation-rings, concept-flat-modules, concept-affine-schemes]

- id: f-flat-subscheme-of-quotient-flat-affine
  title: Flat quotient ring means the cut-out piece is flat
  kind: step
  status: explained
  chunk: c0017
  plain: >
    In the geometry of rings, an ideal J carves out a closed piece of an affine space
    X. The piece's functions are the quotient ring of X's functions by J. This file
    proves a translation: if that quotient is flat over the base ring V, meaning it
    does not make sizes jump as you move around V, then the geometric map from
    the carved-out piece to the base is flat. The proof is bookkeeping. It checks
    that the two ways of writing the ring map agree, up to the standard
    identification of an affine space with its ring of functions.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/FlatSubschemeOfQuotientFlatAffine.lean:6]
  mathlib: [HasRingHomProperty.iff_of_isAffine, RingHom.Flat.comp, RingHom.Flat.of_bijective]
  needs: [concept-affine-schemes, concept-flat-modules]

- id: f-divisor-proofs--ideal-sheaf-data-comap-ideal-top-of-is-affine
  title: Pulled-back ideal on affine spaces is generated by the image
  kind: step
  status: explained
  chunk: c0017
  plain: >
    Take a map f between two affine spaces X and Y, and a closed piece of Y cut out
    by an ideal J of functions on Y. Pulling the piece back along f gives a closed
    piece of X. The file proves that the ideal cutting it out on X is exactly the
    ideal generated by the images under f of the functions in J. One inclusion is
    clear: functions from J, pulled back along f, vanish on the pullback because the
    square of maps commutes. The other uses the standard link between pulling back
    and pushing forward closed pieces, and checks it on global functions.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/IdealSheafDataComapIdealTopOfIsAffine.lean:6]
  mathlib: [AlgebraicGeometry.Scheme.IdealSheafData.comap, Ideal.map_le_iff_le_comap, Scheme.IdealSheafData.ofIdealTop]
  needs: [concept-affine-schemes]

- id: f-divisor-proofs--imports-alt
  title: Over a valuation ring, ideals extend uniquely to flat ideals
  kind: step
  status: explained
  chunk: c0017
  plain: >
    Let V be a valuation ring with fraction field K, and B any ring built over V.
    The file proves a clean fact: each ideal of "K tensor B" (B with denominators
    from V allowed) comes from exactly one ideal J of B whose quotient B/J is flat
    over V. The key step is that, over a valuation ring, flat means torsion free,
    so no nonzero element of the quotient is killed by a nonzero scalar of V.
    The ideal J is then forced: it is the set of elements of B that land in the
    given ideal after denominators are allowed.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ImportsAlt.lean:8]
  mathlib: [Module.Flat.flat_iff_torsion_eq_bot_of_isBezout, IsLocalization.map_comap, IsLocalization.tensorRight]
  needs: [concept-valuation-rings, concept-flat-modules, rings-fields]

- id: concept-affine-schemes
  title: "Affine schemes: geometry built from a ring of functions"
  kind: concept
  status: textbook
  plain: >
    An affine scheme turns a commutative ring into a geometric space. The points
    are the ring's prime ideals, and the ring is the functions on the space. For
    the polynomials in one variable over the complex numbers, the space is the
    complex line. A map of rings goes backwards to a map of spaces. An ideal cuts out
    a closed piece, and its functions are the quotient ring. Pullback of spaces
    ("fibre product") corresponds to tensor product of rings. Schemes glue affine
    pieces together.
  needs: [rings-fields, polynomials]
  learn:
    - {title: "Algebraic Geometry (Robin Hartshorne)", where: "Chapter II, sections 1-3"}
    - {title: "The Geometry of Schemes (David Eisenbud and Joe Harris)", where: "Chapters I and II"}
    - {title: "Foundations of Algebraic Geometry (Ravi Vakil)", where: "Chapters 3-4, free online"}

- id: concept-flat-modules
  title: "Flatness: families with no sudden jumps"
  kind: concept
  status: textbook
  plain: >
    A module M over a ring R is flat if tensoring with M keeps exact sequences
    exact, meaning it does not lose injective maps. In geometry, a flat map is a
    family whose fibres vary without sudden jumps in size. Free modules, like R
    squared, are flat. Over a nice ring such as the integers, flat means torsion
    free: no nonzero element is killed by a nonzero scalar. So Z/2 is not flat over
    Z, since multiplying by 2 kills 1. Flatness over a valuation ring is also just
    torsion freeness.
  needs: [rings-fields, linear-algebra]
  learn:
    - {title: "Introduction to Commutative Algebra (Michael Atiyah and Ian Macdonald)", where: "Chapter 2"}
    - {title: "Commutative Algebra (David Eisenbud)", where: "Chapter 6"}
    - {title: "Commutative Ring Theory (Hideyuki Matsumura)", where: "Chapter 3"}

- id: concept-valuation-rings
  title: "Valuation rings: rings where one of any two elements divides the other"
  kind: concept
  status: textbook
  plain: >
    A valuation ring V is an integral domain where, for any two nonzero elements a
    and b, either a divides b or b divides a. Example: the fractions with odd
    denominator, inside the rationals, where "size" is the power of 2 in a number.
    Its fraction field K is where you allow every denominator. Geometrically, V is a tiny
    path: its closed point is the end of the path, and K is the path with the end
    removed. The valuative criterion for properness asks whether paths missing an end
    point can be completed.
  needs: [rings-fields, concept-ultrametric-norm, primes-divisibility]
  learn:
    - {title: "Introduction to Commutative Algebra (Michael Atiyah and Ian Macdonald)", where: "Chapter 5"}
    - {title: "Algebraic Geometry (Robin Hartshorne)", where: "Chapter II, section 4 (valuative criteria)"}
    - {title: "Algebraic Number Theory (Jurgen Neukirch)", where: "Chapter II, section 3"}
