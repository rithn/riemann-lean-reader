nodes:
  - id: f-global-geometry--is-cpt-gen
    title: "Vocabulary: points above a generic point, and where numbers are regular"
    kind: step
    status: explained
    chunk: c0053
    plain: >
      This file only gives definitions. Start with a map from the spectrum of a field Omega into a scheme X
      (a space glued from rings). Its image is the "generic point".
      Cpt is the set of points of X that the generic point specializes to (lies in the closure of).
      For each such point p, regAt is the subring of Omega of numbers that are regular at p,
      meaning they come from functions defined near p.
      unitAt says a nonzero number is regular at p and so is its inverse.
      IsCptGen is a technical niceness condition: the generic point sees all of Omega, and each comparison map is injective.
    lean: ["Development/AutomorphicSpectrum/Definitions/GlobalGeometry/IsCptGen.lean:11"]
    mathlib: [AlgebraicGeometry.Scheme.stalkClosedPointTo, TopCat.Presheaf.stalkSpecializes]
    needs: [concept-schemes-basics, concept-local-rings, concept-point-set-topology]
  - id: f-global-geometry--coords-at
    title: "Vocabulary: coordinates that are well behaved at a point"
    kind: step
    status: explained
    chunk: c0053
    plain: >
      This file only states definitions.
      InChart says one chosen coordinate is nonzero and all ratios of coordinates to it are regular at a point.
      CoordTie bundles conditions saying such coordinates cover the space, cut out affine pieces, and generate the right ring.
      ValAt says a number from the field matches a number r in a local ring, at the point where a map from
      the local ring's spectrum lands.
      CoordsAt says that coordinates over the field and coordinates over the local ring agree
      up to a unit scaling. InFibre says the prime p is not invertible at a point.
    lean: ["Development/AutomorphicSpectrum/Definitions/GlobalGeometry/CoordsAt.lean:32"]
    mathlib: [AlgebraicGeometry.IsAffineOpen, IsLocalRing.closedPoint]
    needs: [f-global-geometry--is-cpt-gen, concept-schemes-basics, concept-local-rings]
    orphan: true
  - id: f-global-geometry--etale-localization-at-prime-tensor-of-low-height
    title: "Vocabulary: lattices at every point and frames"
    kind: step
    status: explained
    chunk: c0053
    plain: >
      This file only gives definitions, and its name does not describe them.
      A "lattice" Lat picks, for each point p, a submodule over the ring of numbers regular at p inside a fixed vector space E.
      A frame at p is a basis of E that also generates the lattice at p.
      "Vector bundle on a set T" means that near each point of T there is one basis that is a frame at every nearby point of T.
      The file then defines operations on lattices: intersection, image, preimage, product, scaling, dual and wedge powers.
      It also defines pulling a lattice back along a map of schemes.
    lean: ["Development/AutomorphicSpectrum/Definitions/GlobalGeometry/EtaleLocalizationAtPrimeTensorOfLowHeight.lean:14"]
    mathlib: [exteriorPower.ιMulti, Submodule.span]
    needs: [f-global-geometry--is-cpt-gen, concept-exterior-powers, linear-algebra]
  - id: f-global-geometry--exists-gen-of-is-v-b-one
    title: A rank-one lattice has a local generator, plus order-of-vanishing tools
    kind: step
    status: explained
    chunk: c0053
    plain: >
      Mostly small proved lemmas about lattices.
      Main result: if a lattice is locally a rank-one vector bundle, then at each point it is generated by a single nonzero vector.
      This follows by reading off the one-element frame.
      Also defined are tools for measuring how a vector sits in a lattice, "order of vanishing" OrderAt.
      The file proves that order is unique, that invertibility behaves well under products and powers,
      and gives sample checks showing what the definitions mean in simple cases.
      It also defines "trivial modulo a number" conditions that later files use.
    lean: ["Development/AutomorphicSpectrum/Definitions/GlobalGeometry/ExistsGenOfIsVBOne.lean:130"]
    mathlib: [Submodule.mem_span_singleton, smul_left_injective]
    needs: [f-global-geometry--is-cpt-gen, f-global-geometry--etale-localization-at-prime-tensor-of-low-height, concept-integral-closure-fraction-fields, concept-local-rings]
    orphan: true
  - id: f-global-geometry--is-generic-flag
    title: "Vocabulary: flags and generic flags"
    kind: step
    status: explained
    chunk: c0053
    plain: >
      This file is definitions only.
      A flag is a chain of subspaces, each spanned by the first few vectors of a chosen basis.
      IsFlagVBOn says a lattice is locally framed by bases with the same flag.
      gr takes the successive graded pieces of a lattice along the flag, each a rank-one lattice on the base field.
      tens and grTens combine such rank-one lattices using integer exponents.
      IsGenericFlag describes a flag whose upper-triangular change-of-basis entries are algebraically independent,
      with a fixed finite degree of the field they generate.
    lean: ["Development/AutomorphicSpectrum/Definitions/GlobalGeometry/IsGenericFlag.lean:37"]
    mathlib: [AlgebraicIndependent, IntermediateField.adjoin]
    needs: [f-global-geometry--etale-localization-at-prime-tensor-of-low-height, f-global-geometry--is-cpt-gen, linear-algebra, concept-field-extensions-transcendence]
    orphan: true
  - id: f-global-geometry--is-line-gen-on
    title: "Vocabulary: when two wedge powers share a line"
    kind: step
    status: explained
    chunk: c0053
    plain: >
      This file is definitions only.
      Given two lattices A and B, a wedge power of A (a p-fold wedge product, like areas or volumes)
      and a wedge power of B, IsCoeffAt says that at a point x the two wedge lattices are each generated by
      a nonzero multiple of two fixed wedge vectors a and b, and that f is the ratio linking those multiples.
      IsLineGenOn then says a and b are nonzero and the ratio can be taken to be exactly 1 at every point of a chosen set.
    lean: ["Development/AutomorphicSpectrum/Definitions/GlobalGeometry/IsLineGenOn.lean:17"]
    mathlib: [exteriorPower]
    needs: [f-global-geometry--etale-localization-at-prime-tensor-of-low-height, concept-exterior-powers]
  - id: f-global-geometry--level-sections-exact-kernel-locus-open
    title: "Vocabulary: exactness modulo a number, and the line lattice"
    kind: step
    status: explained
    chunk: c0053
    plain: >
      This file only gives definitions; despite its name, it proves nothing about open loci.
      genFibre is the set of points where every nonzero number from a base ring is invertible.
      ConstClosed says every number algebraic over the base ring is a ratio of two base-ring elements.
      lineLat is the lattice generated by inverses of the ratios in the previous file.
      SplitModAt and ExactModLat express, in terms of coordinate maps J and J', that two lattices
      split off and pair perfectly after reducing modulo a number.
    lean: ["Development/AutomorphicSpectrum/Definitions/GlobalGeometry/LevelSectionsExactKernelLocusOpen.lean:15"]
    mathlib: [IsAlgebraic, dotProduct]
    needs: [f-global-geometry--is-line-gen-on, f-global-geometry--etale-localization-at-prime-tensor-of-low-height, f-global-geometry--is-cpt-gen, concept-field-extensions-transcendence]
    orphan: true
  - id: f-geometry-proofs--gen-map-germ-eq-gen-map-germ
    title: Being regular at a point spreads to a neighbourhood
    kind: step
    status: explained
    chunk: c0053
    plain: >
      Two points p and q of a space both lie in an open set U where a function s is defined.
      The first result says that reading s at p and then moving into the field gives the same number
      as reading s at q. Both agree with reading it at the generic point.
      The second result: if a number is regular at p, it is regular at every point of some open neighbourhood of p.
      The third: the same holds for being invertible (regular with regular inverse),
      by intersecting the two neighbourhoods.
      The proofs unwind the definition of regular as "comes from a function defined near p".
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/GenMapGermEqGenMapGerm.lean:8"]
    mathlib: [TopCat.Presheaf.germ_stalkSpecializes_apply, TopCat.Presheaf.exists_germ_eq]
    needs: [f-global-geometry--is-cpt-gen, concept-schemes-basics, concept-point-set-topology]
  - id: f-frame-near-generic-point
    title: A basis that frames the generic point frames a whole neighbourhood
    kind: step
    status: explained
    chunk: c0053
    plain: >
      The claim: if a lattice is locally a vector bundle of rank r on a set containing the generic point,
      and b is any basis of the underlying vector space, then there is an open neighbourhood of the generic point
      on which b is a frame at every point.
      The proof writes b in terms of a local frame e, and e in terms of b, using finitely many coefficients.
      Each coefficient is regular at the generic point, so it is regular on an open set.
      Intersect these finitely many open sets. There, each of b and e generates the other, so they span the same lattice.
    lean: ["Development/AutomorphicSpectrum/Proofs/GeometryProofs/FrameNearGenericPoint.lean:44"]
    mathlib: [Submodule.mem_span_range_iff_exists_fun, Finset.induction_on]
    needs: [f-global-geometry--is-cpt-gen, f-global-geometry--etale-localization-at-prime-tensor-of-low-height, f-geometry-proofs--gen-map-germ-eq-gen-map-germ, linear-algebra]
    orphan: true
