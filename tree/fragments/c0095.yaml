nodes:
  - id: concept-haar-measure-fundamental-domains
    title: Haar measure and fundamental domains
    kind: concept
    status: textbook
    plain: >
      On a nice topological group, such as the real line under addition, there is a way to measure the size of sets that does not change when you slide a set by a group element. This is called Haar measure, and on the line it is ordinary length. If a subgroup acts by sliding, a fundamental domain is a piece of the group that contains one copy of each coset, apart from a set of size zero. For the integers inside the real numbers, the interval from 0 to 1 is one. The size of a fundamental domain is a natural notion of the volume of the quotient.
    needs: [groups, concept-normal-subgroups-quotients, concept-point-set-topology, real-analysis]
    learn:
      - title: "Folland, A Course in Abstract Harmonic Analysis"
        where: "ch. 2 (Haar measure)"
      - title: "Terence Tao, An Introduction to Measure Theory"
        where: "ch. 1 (Lebesgue measure and invariance)"
  - id: f-sup-meas
    title: A measure on a product of normal and acting subgroups
    kind: step
    status: explained
    chunk: c0095
    plain: >
      This file only gives a definition. Let N be a subgroup carrying a measure, and Q another subgroup, with Q and N together generating a bigger subgroup. The new measure on this bigger subgroup is built by cutting it into cosets of N, one per element of the coset space. On each coset, slide the measure from N by a chosen coset representative. The pieces are then added up into one measure. The point is to extend a measure from N to everything generated by N and Q. Later files show that it is invariant when N is normal.
    lean:
      - Development/AbelianVarietyTheory/Proofs/DivisorProofs/SupMeas.lean:7
    mathlib:
      - MeasureTheory.Measure.sum
      - Subgroup.inclusion
    needs: [concept-haar-measure-fundamental-domains, concept-normal-subgroups-quotients, groups]
  - id: f-semidirect-quotient-measure-conjugation-invariant
    title: The glued measure is sigma-finite and shifts invariantly
    kind: step
    status: explained
    chunk: c0095
    plain: >
      Here N has a measure that is preserved by right shifts and by conjugation by elements of the bigger group generated by N and Q. The theorem says the glued measure on the bigger group is sigma-finite, meaning it is a countable sum of finite pieces, and that it is preserved by left multiplication. The proof compares the pieces. Choosing another representative of a coset changes a piece only by a right shift in N, which keeps the measure. Left multiplication permutes the cosets, and conjugation invariance handles the leftover element. A reshuffling of a sum then finishes it.
    lean:
      - Development/AbelianVarietyTheory/Proofs/DivisorProofs/SemidirectQuotientMeasureConjugationInvariant.lean:9
    mathlib:
      - MeasureTheory.Measure.sum_comp_equiv
      - MeasureTheory.Measure.map_map
    needs:
      - f-sup-meas
      - concept-haar-measure-fundamental-domains
      - concept-normal-subgroups-quotients
  - id: f-conjugation-measure-preserving-semidirect
    title: The glued measure is preserved by inversion
    kind: step
    status: explained
    chunk: c0095
    plain: >
      In the same set-up as the neighbouring files, this shows that sending each element p to its inverse preserves the glued measure on the group generated by N and Q. The hypotheses say that the measure on N is preserved by right shifts, inversion, and conjugation by the bigger group. The proof shows each piece, supported on one coset, is sent by inversion to the piece on the inverse coset. The inverse of a coset has a representative inverse to that of the original, up to a harmless shift. Inversion also permutes the cosets one-to-one, so the total sum is unchanged.
    lean:
      - Development/AbelianVarietyTheory/Proofs/DivisorProofs/ConjugationMeasurePreservingSemidirect.lean:9
    mathlib:
      - MeasureTheory.Measure.map_sum
      - Equiv.tsum_eq
    needs:
      - f-sup-meas
      - concept-haar-measure-fundamental-domains
      - concept-normal-subgroups-quotients
  - id: f-semidirect-measure-restriction-normal-part
    title: The glued measure agrees with the original on N
    kind: step
    status: explained
    chunk: c0095
    plain: >
      This shows that the glued measure, when applied to a measurable set inside N, returns exactly the original measure of that set. N must be a closed subgroup and the measure on N preserved by right shifts. The glued measure is a sum over cosets of N. Only the coset of the identity can contain a point of N, and there the piece is just a shift of the original measure by an element of N, which preserves it. All other pieces give zero. A tsum with one nonzero term is that term. The file also checks that the coset space is countable.
    lean:
      - Development/AbelianVarietyTheory/Proofs/DivisorProofs/SemidirectMeasureRestrictionNormalPart.lean:9
    mathlib:
      - MeasureTheory.Measure.sum_apply_of_countable
      - tsum_ite_eq
    needs:
      - f-sup-meas
      - concept-haar-measure-fundamental-domains
      - concept-normal-subgroups-quotients
  - id: f-countable-transversal-measure-extension
    title: Fundamental domains transfer to the bigger group
    kind: step
    status: explained
    chunk: c0095
    plain: >
      Let N be a closed subgroup of a group, with a countable subgroup R whose elements can move any point of the bigger group into N. A fundamental domain is a piece containing one copy of each coset, up to measure zero. Suppose E is one for R inside N. The theorem says the image of E in the bigger group is a fundamental domain for R there, for a measure that matches the original on N and is shift-invariant. The proof checks three things. The image is measurable, almost every point is moved into it, and the moved copies overlap only in measure zero sets.
    lean:
      - Development/AbelianVarietyTheory/Proofs/DivisorProofs/CountableTransversalMeasureExtension.lean:9
    mathlib:
      - MeasureTheory.IsFundamentalDomain.mk''
      - MeasurableEmbedding.subtype_coe
    needs:
      - concept-haar-measure-fundamental-domains
      - concept-normal-subgroups-quotients
      - concept-point-set-topology
  - id: f-normalizing-element-fundamental-domain-scaling
    title: Conjugating a fundamental domain by a normalizing element
    kind: step
    status: explained
    chunk: c0095
    plain: >
      Let N be a closed subgroup, with an element m that conjugates N into itself, and back. Suppose E is a fundamental domain for a subgroup Q inside N, and conjugating by m rescales measures by a factor c that is not zero. Then the conjugate of E is a fundamental domain for the conjugate of Q, measured by the same measure. The proof turns conjugation into a map on N that preserves null sets, because of the scaling factor. It then pairs elements of Q with their conjugates one-to-one, and a general principle transports fundamental domains along such matching maps.
    lean:
      - Development/AbelianVarietyTheory/Proofs/DivisorProofs/NormalizingElementFundamentalDomainScaling.lean:9
    mathlib:
      - MeasureTheory.IsFundamentalDomain.preimage_of_equiv
      - MeasureTheory.Measure.QuasiMeasurePreserving
    needs:
      - concept-haar-measure-fundamental-domains
      - concept-normal-subgroups-quotients
      - groups
  - id: f-quotient-measure-conjugation-invariant
    title: A shared measure for a quotient and its conjugate
    kind: step
    status: explained
    chunk: c0095
    plain: >
      This is the main result of the chunk. N is a closed subgroup of a locally compact group with a Haar measure, Q a countable subgroup normalizing N, and m an element that conjugates N into itself. Given a fundamental domain E for Q in N with finite positive measure, the file builds one measure on the group generated by N and Q. It is invariant under inversion and under left shifts by Q and by the conjugate of Q. It has fundamental domains for both, whose sizes differ by the scaling factor c. Supporting lemmas show Haar measures are right-shift and inversion invariant whenever a finite positive fundamental domain exists.
    lean:
      - Development/AbelianVarietyTheory/Proofs/DivisorProofs/QuotientMeasureConjugationInvariant.lean:91
    mathlib:
      - MeasureTheory.Measure.isMulLeftInvariant_eq_smul
      - MeasureTheory.IsFundamentalDomain.preimage_of_equiv
    needs:
      - f-sup-meas
      - f-semidirect-quotient-measure-conjugation-invariant
      - f-conjugation-measure-preserving-semidirect
      - f-semidirect-measure-restriction-normal-part
      - f-countable-transversal-measure-extension
      - f-normalizing-element-fundamental-domain-scaling
      - concept-haar-measure-fundamental-domains
      - concept-normal-subgroups-quotients
    orphan: true
