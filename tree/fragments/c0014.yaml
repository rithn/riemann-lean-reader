nodes:
- id: concept-finitely-generated-algebras
  title: Rings built from finitely many generators, and the Nullstellensatz
  kind: concept
  status: textbook
  plain: >
    A ring is "finitely generated" over a base ring if every element can be
    written as a polynomial, with base-ring coefficients, in some fixed finite list
    of elements. Example: the integers with 1/2 attached are generated by the
    single element 1/2. A maximal ideal is a largest proper "kernel": the ring
    modulo it is a field. The Nullstellensatz (Hilbert's zeros theorem) says that
    if a ring is finitely generated over the rationals and that quotient is a
    field, the field is a finite-dimensional vector space over the rationals. In
    plain terms, such a field is a number field. So any such ring maps onto a
    number field.
  needs: [rings-fields, polynomials, number-fields, linear-algebra]
  learn:
  - title: Introduction to Commutative Algebra (M. Atiyah and I. G. Macdonald)
    where: Chapters 1 and 5 (ideals, integral extensions), Chapter 7 (finiteness conditions)
  - title: Abstract Algebra (D. Dummit and R. Foote)
    where: Sections 15.1 to 15.3 (Hilbert's Nullstellensatz)

- id: concept-separable-polynomials
  title: Separable polynomials (no repeated roots) and the derivative test
  kind: concept
  status: textbook
  plain: >
    A polynomial is separable if it has no repeated root over the complex
    numbers. For example x^2 - 1 has roots 1 and -1 and is separable; x^2 has the
    root 0 twice and is not. A neat test uses the derivative (the slope formula
    from school calculus, applied term by term to x^k). A polynomial f is
    separable exactly when f and its derivative share no common factor. By the
    Euclidean algorithm for polynomials, that means we can find polynomials A and B
    with A times f plus B times the derivative equal to the number 1. Clearing
    the fractions turns the 1 into some nonzero whole number.
  needs: [polynomials, calculus, rings-fields]
  learn:
  - title: Abstract Algebra (D. Dummit and R. Foote)
    where: Sections 13.5 (separable and inseparable extensions) and 9.5
  - title: Algebra (S. Lang)
    where: Chapter V, Section 4 (separable extensions)

- id: f-exists-prime-gt-dvd-eval
  title: A whole-number polynomial takes values divisible by huge primes
  kind: step
  status: explained
  plain: >
    Take a whole-number polynomial that is not constant, say x^2 + 1. For any bound
    n, some prime bigger than n divides one of its values. Example: x^2 + 1 at 4
    gives 17. The proof echoes Euclid's argument that primes never run out. If the
    value at 0 is 0, every prime divides it, so we are done. Otherwise call the
    value at 0 "a". Then the value at a times n factorial times k equals a times
    (1 + n factorial times k times q), for some whole number q. Pick k so that
    the bracket is not 1 or -1. Its smallest prime factor cannot be at most n,
    since such a prime would divide n factorial and so divide 1.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsPrimeGtDvdEval.lean:25]
  mathlib: [Nat.exists_infinite_primes, Polynomial.sub_dvd_eval_sub, Nat.minFac_prime, Nat.dvd_factorial]
  needs: [polynomials, primes-divisibility, modular-arithmetic, proofs]

- id: f-exists-large-prime-dvd-int-polynomial-eval
  title: Large-prime divisor of a polynomial value (re-export)
  kind: step
  status: explained
  plain: >
    This file proves nothing new. It restates, under a second name, the result
    proved in the neighbouring file, that a non-constant whole-number polynomial has
    values divisible by arbitrarily large primes. The proof just tries several ways
    of handing the earlier result across, in case the exact form differs. A
    "Statement" twin file holds the same claim for other files to import. So
    this node only forwards the earlier theorem, and all the maths sits in the
    node it needs.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsLargePrimeDvdIntPolynomialEval.lean:9]
  needs: [f-exists-prime-gt-dvd-eval]

- id: f-sep-int-poly-root-mod-prime-sq
  title: Separable polynomials hit values divisible by a prime squared
  kind: step
  status: explained
  plain: >
    Take a non-constant whole-number polynomial f with no repeated roots. The claim
    is that for any bound n there is a prime p bigger than n and a whole number
    x with p squared dividing f(x). Idea in two steps. First, "no repeated
    roots" gives polynomials A and B with A times f plus B times the derivative
    of f equal to a fixed nonzero whole number N. Second, choose a large prime p
    not dividing N, and x with p dividing f(x), using the earlier result. Then p
    cannot divide the derivative at x. Nudging x by a multiple of p, a step in the
    spirit of Newton's method (called Hensel lifting), lifts "divisible by p"
    to "divisible by p squared".
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/SepIntPolyRootModPrimeSq.lean:34]
  mathlib: [Polynomial.binomExpansion, IsLocalization.integerNormalization_map_to_map, Prime.coprime_iff_not_dvd]
  needs: [f-exists-large-prime-dvd-int-polynomial-eval, concept-separable-polynomials, polynomials, modular-arithmetic, primes-divisibility]

- id: f-divisor-proofs--finite-type-to-number-field
  title: A finitely generated domain maps to a number field without killing a
  kind: step
  status: explained
  plain: >
    Take a ring A with no zero-divisors, built from finitely many generators over
    the whole numbers (a "finitely generated" ring), and a nonzero element a.
    The claim is that there is a ring map from A into some number field (a
    finite extension of the rationals) that does not send a to zero. Proof idea.
    Inside the fraction field of A, adjoin the generators and the inverse of a,
    over the rationals. Pick a maximal ideal and take the quotient, which is a
    field. By the Nullstellensatz, a field finitely generated over the rationals
    is a finite-dimensional extension of the rationals, that is, a number field.
    Since a became invertible, it stays nonzero.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/FiniteTypeToNumberField.lean:24]
  mathlib: [Ideal.exists_maximal, Ideal.Quotient.field, finite_of_finite_type_of_isJacobsonRing, Algebra.adjoin_induction]
  needs: [concept-finitely-generated-algebras, number-fields, rings-fields]

- id: f-divisor-proofs--number-field-to-mod-p-squared
  title: A number field's finite subring maps into integers mod p squared
  kind: step
  status: explained
  plain: >
    Take a number field K, a finite list S of its elements, and a bound n. The
    claim is that there is a prime p bigger than n and a ring map from the ring
    generated by S into the whole numbers mod p squared. Idea. Pick a primitive
    element of K, scaled to be an integer root of its minimal polynomial. Every
    element of S times some whole number N lies in the whole-number polynomials
    in that element. Use the previous result to find a large prime p and an x
    where p squared divides the minimal polynomial at x. Send the element to x
    mod p squared. N is invertible there, so the map extends to all of S.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/NumberFieldToModPSquared.lean:97]
  mathlib: [Field.exists_primitive_element, minpoly.equivAdjoin, AdjoinRoot.lift, IsLocalization.lift, ZMod.isUnit_iff_coprime]
  needs: [f-sep-int-poly-root-mod-prime-sq, concept-separable-polynomials, number-fields, concept-field-extensions-transcendence, modular-arithmetic, polynomials]

- id: f-nadel-vanishing-lemmas--finite-type-to-number-field
  title: Number-field point lemma (forwarding file)
  kind: step
  status: explained
  plain: >
    This short file proves nothing itself. It forwards the earlier result, that a
    finitely generated domain with a nonzero element a maps to a number field
    without sending a to zero, under a second name used by later files. The
    one-line proof just points at the original theorem, trying a few ways to apply it.
    All the real work is in the node it needs.
  lean: [Development/WeilBound/CoreStatements/PublishedTheorems/NadelVanishingPairs/NadelVanishingLemmas/FiniteTypeToNumberField.lean:4]
  needs: [f-divisor-proofs--finite-type-to-number-field]

- id: f-nadel-vanishing-lemmas--number-field-to-mod-p-squared
  title: Mod p squared lemma for number fields (forwarding file)
  kind: step
  status: explained
  plain: >
    This short file proves nothing itself. It forwards the earlier result, that for
    a number field and a finite list of elements, a large prime p gives a ring map
    from the generated ring into whole numbers mod p squared, under a second name
    used by later files. The one-line proof just points at the original theorem,
    trying a few ways to apply it. All the real work is in the node it needs.
  lean: [Development/WeilBound/CoreStatements/PublishedTheorems/NadelVanishingPairs/NadelVanishingLemmas/NumberFieldToModPSquared.lean:4]
  needs: [f-divisor-proofs--number-field-to-mod-p-squared]

- id: f-finite-type-to-mod-p-squared
  title: Finitely generated domains map to mod p squared, keeping a invertible
  kind: step
  status: explained
  plain: >
    Take a ring A with no zero-divisors, built from finitely many generators over
    the whole numbers, and a nonzero element a. The claim is that for any bound n
    there is a prime p bigger than n and a ring map from A into the whole numbers
    mod p squared sending a to an invertible number. Mod p squared means
    clock arithmetic with p times p hours. Proof. Map A into a number field
    with a nonzero. Gather the images of the generators and the inverse of
    a's image into a finite list. Apply the earlier lemma to get a large p and
    a map on the ring that list generates. Composing gives the map, and a is
    invertible because its inverse is in that ring.
  lean: [Development/WeilBound/CoreStatements/PublishedTheorems/NadelVanishingPairs/NadelVanishingLemmas/FiniteTypeToModPSquared.lean:8]
  mathlib: [Algebra.adjoin_induction, Subring.closure, RingHom.codRestrict]
  needs: [f-nadel-vanishing-lemmas--finite-type-to-number-field, f-nadel-vanishing-lemmas--number-field-to-mod-p-squared, concept-finitely-generated-algebras, modular-arithmetic]
  orphan: true
