nodes:
  - id: f-hermitian-local-continuous-congruence-section
    title: In a Dedekind domain, high powers of P clear a multiple of f
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves a fact about Dedekind domains (rings where ideals factor uniquely into prime ideals). Take a nonzero element f and a maximal ideal P. Then there is an exponent N such that every element b in P to the N can be fixed by multiplying with something outside P: some s not in P has s times b divisible by f. Idea: write the ideal generated by f as P to the m times J, with J not inside P, using unique factorisation. Choose s in J but not in P, and take N equal to m. The file name does not describe its content.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/HermitianLocalContinuousCongruenceSection.lean:5]
    mathlib: [pow_multiplicity_dvd, Ideal.mul_mem_mul]
    needs: [concept-dedekind-domains, concept-prime-ideals-localization]
  - id: f-dedekind-power-localization
    title: Restatement - high powers of P clear a multiple of f
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file restates a result under a second name and proves nothing new. It says that in a Dedekind domain, for a nonzero f and a maximal ideal P, some exponent N works so that every element b of P to the N has a multiplier s outside P with s times b a multiple of f. The proof just points to the version proved in a sibling file, trying several ways of passing the arguments. Other files cite this name.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/DedekindPowerLocalization.lean:5]
    mathlib: []
    needs: [f-hermitian-local-continuous-congruence-section, concept-dedekind-domains]
  - id: f-divisor-proofs--tensor-involution-algebra-properties
    title: Flat extensions - divisibility upstairs descends downstairs
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves a descent result for flat ring extensions B to D (D behaves well, "flat", as a module over B). Take a prime Q of D, and elements f and b of B. Suppose b is a multiple of f after passing to the local ring of D at Q (where elements outside Q become invertible). Then, down in B, some s outside the prime Q meets B has s times b a multiple of f. The idea is that the local ring over B is faithfully flat, and for such extensions an ideal membership holds downstairs exactly when it holds upstairs. The file name does not describe its content.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/TensorInvolutionAlgebraProperties.lean:6]
    mathlib: [Module.FaithfullyFlat.of_flat_of_isLocalHom, Ideal.comap_map_eq_self_of_faithfullyFlat]
    needs: [concept-flat-modules, concept-local-rings, concept-prime-ideals-localization]
  - id: f-flat-localization-membership
    title: Restatement - divisibility descends along a flat extension
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file restates a descent result under another name and proves nothing new. For a flat extension of rings B to D, a prime Q of D, and b, f in B: if b is a multiple of f in the local ring at Q, then some s outside the prime Q meets B has s times b a multiple of f in B. The proof just calls the version proved in a sibling file, trying several ways to supply the arguments. Other files cite this name.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/FlatLocalizationMembership.lean:5]
    mathlib: []
    needs: [f-divisor-proofs--tensor-involution-algebra-properties, concept-flat-modules, concept-prime-ideals-localization]
  - id: f-gram-fiber-measures-unique-ae
    title: Elements outside P become units modulo f after inverting g
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves a local statement. Let B map to D, let P be a prime of B and Q a prime of D over P. Suppose that, once we exclude primes containing g, Q is the only prime of D containing f. Then every s in B outside P has an inverse modulo f in the ring D with g inverted: some t makes s times t minus 1 a multiple of f. If not, the ideal generated by s and f is proper and sits inside a maximal ideal. That maximal ideal pulls back to a prime containing f and avoiding g, so it equals Q, contradicting s being outside P. The file name does not describe its content.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/GramFiberMeasuresUniqueAe.lean:5]
    mathlib: [Ideal.exists_le_maximal, Ideal.mem_span_pair]
    needs: [concept-prime-ideals-localization, concept-local-rings]
  - id: f-localization-inverse-mod-f
    title: Restatement - inverses modulo f after inverting g
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file restates a result under another name and proves nothing new. With the same setup, Q is the only prime of D over a prime P of B that contains f and avoids g, every s outside P becomes invertible modulo f in the ring where g is inverted. The proof just calls the version proved in a sibling file, with several fallback ways of passing arguments. Other files cite this name.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/LocalizationInverseModF.lean:5]
    mathlib: []
    needs: [f-gram-fiber-measures-unique-ae, concept-prime-ideals-localization]
  - id: f-primitive-vector-quadratic-level-measure
    title: Residue approximation survives inverting g
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves an approximation statement. Let P be a maximal ideal of B, Q a prime of D over it, and suppose every element of D is congruent mod Q to an element of B. Take g outside Q. Then every element of D with g inverted is congruent, modulo the ideal generated by Q, to an element of B. A fraction d over g to the n is handled by finding c in B with c times g congruent to 1 mod Q, and approximating by b_d times c to the n. The file name does not describe its content.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/PrimitiveVectorQuadraticLevelMeasure.lean:5]
    mathlib: [IsLocalization.mk'_surjective, Ideal.Quotient.eq_zero_iff_mem]
    needs: [concept-prime-ideals-localization, concept-local-rings, modular-arithmetic]
  - id: f-localization-residue-approximation
    title: Restatement - residue approximation after inverting g
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file restates a result under another name and proves nothing new. If every element of D is congruent mod a prime Q to an element of B, then the same holds, modulo the ideal generated by Q, after inverting an element g outside Q. The proof just calls the version proved in a sibling file, trying several argument patterns. Other files cite this name.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/LocalizationResidueApproximation.lean:5]
    mathlib: []
    needs: [f-primitive-vector-quadratic-level-measure, concept-prime-ideals-localization]
  - id: f-divisor-proofs--local-hermitian-diagonalization-units
    title: Approximation mod I lifts to approximation mod K when I to the N is small
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves a lifting argument. Let B map to A, I an ideal of B and K an ideal of A. Suppose every element of A is congruent to an element of B modulo (I extended to A) plus K, and I to the N, extended to A, lies inside K. Then every element of A is congruent to an element of B modulo K alone. The proof improves the approximation step by step: modulo J to the n plus K, for growing n, where J is the extended I. After N steps the power of J disappears into K. The file name does not describe its content.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/LocalHermitianDiagonalizationUnits.lean:5]
    mathlib: [Submodule.span_induction, Ideal.map_pow]
    needs: [concept-prime-ideals-localization, concept-hensel-lifting, rings-fields]
  - id: f-nilpotent-approximation-surjective
    title: Restatement - lifting approximation past a nilpotent ideal
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file restates a lifting result under another name and proves nothing new. If every element of A is congruent to one from B modulo the extended ideal I plus K, and I to the N extended lies inside K, then every element of A is congruent to one from B modulo K. The proof only points to the version in a sibling file, trying several ways of passing arguments. Other files cite this name.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/NilpotentApproximationSurjective.lean:5]
    mathlib: []
    needs: [f-divisor-proofs--local-hermitian-diagonalization-units, concept-hensel-lifting]
  - id: f-etale-unique-prime-le-map-maximal
    title: Etale extensions - a lone prime over P is inside P extended
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves a result for etale extensions B to A (extensions with no branching). Take a maximal ideal P of B and a prime Q of A that is the only prime containing P extended to A. Then Q is contained in P extended to A, so they match up to radical. The proof shows the quotient of A by P extended is reduced (has no nonzero nilpotents), since an etale extension stays unramified over the residue field of P. The radical of P extended is Q, and a reduced quotient forces Q to lie inside P extended.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/EtaleUniquePrimeLeMapMaximal.lean:5]
    mathlib: [Algebra.FormallyUnramified.isReduced_of_field, Ideal.radical_eq_sInf]
    needs: [concept-etale-ring-maps, concept-prime-ideals-localization, concept-local-rings]
  - id: f-isolate-maximal-among-primes-containing-etale
    title: Isolating one maximal ideal among primes containing f
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves a separation result. Let B be a Dedekind domain, D an etale B-algebra, f a nonzero element of B, and Q a maximal ideal of D. Then there is an element g of D, outside Q, so that Q is the only prime of D that contains f and avoids g. The proof shows only finitely many primes of D contain f, all maximal. For each other one, pick an element in it but not in Q, and let g be their product. Finiteness comes from the quotient by f being a finite-length ring and etale fibres being finite.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/IsolateMaximalAmongPrimesContainingEtale.lean:42]
    mathlib: [IsArtinianRing.setOfPred_isPrime_finite, Ideal.IsPrime.prod_mem_iff]
    needs: [concept-etale-ring-maps, concept-dedekind-domains, concept-prime-ideals-localization, concept-noetherian-and-irreducible-components]
  - id: f-etale-away-quotient-eq-localization
    title: Quotient by f equals a localization, for etale extensions of a Dedekind domain
    kind: step
    status: explained
    chunk: c0045
    plain: >
      This file proves a statement about an etale extension D of a Dedekind domain B. Take f nonzero in a maximal ideal P, and a prime Q of D over P whose residue field matches that of P. Then some g in D makes the localization D_g behave well: every element of D_g is congruent to an element of B modulo f, and an element b of B lies in f times D_g exactly when some s outside P has s b in the ideal of f. So the quotient by f is a localization of B. The proof combines the isolation, approximation and descent results of this chunk.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/EtaleAwayQuotientEqLocalization.lean:12]
    mathlib: [Algebra.Etale.of_isLocalizationAway, Algebra.Etale.comp, IsLocalization.map_comap]
    needs: [f-dedekind-power-localization, f-isolate-maximal-among-primes-containing-etale, f-localization-inverse-mod-f, f-etale-unique-prime-le-map-maximal, f-localization-residue-approximation, f-nilpotent-approximation-surjective, f-flat-localization-membership, concept-etale-ring-maps, concept-dedekind-domains, concept-prime-ideals-localization]
    orphan: true
