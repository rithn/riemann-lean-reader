nodes:
  - id: f-complex-analytic-sets--st-zariski-analytic-normality
    title: Germs of analytic functions, and normality statement
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file defines the ring of "germs" at a point w: functions that are
      analytic near w, with two functions identified when they agree on some
      small neighbourhood. It also proves polynomials give such germs. Then it
      states, without proving, a normality claim. If a polynomial ideal is
      prime and its quotient is integrally closed (every number that
      satisfies a monic equation over the fraction field is already in the
      ring), and w lies in its zero set, then the ideal stays prime
      inside the germ ring and the quotient stays integrally closed.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StZariskiAnalyticNormality.lean:11
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StZariskiAnalyticNormality.lean:42
    mathlib:
      - Germ
      - IsIntegrallyClosed
    needs:
      - f-analytic-germ
      - f-complex-analytic-sets--st-normal-model
      - concept-complex-analytic-sets
      - concept-integral-closure-fraction-fields
      - concept-prime-ideals-localization
  - id: f-complex-analytic-sets--st-analytic-germs-noetherian
    title: Statement - rings of analytic germs are Noetherian
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file only states a claim, without proving it. The claim is that for
      any point in complex space with finitely many coordinates, the ring of
      analytic germs at that point is Noetherian. Noetherian means every
      ideal (a set of germs closed under adding and scaling by germs) is
      generated by finitely many germs, so no infinite ascending chains of
      ideals exist. The same fact holds for polynomials in the Hilbert basis
      theorem. Here it is the key finiteness property for the local study of
      analytic sets.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StAnalyticGermsNoetherian.lean:9
    mathlib:
      - IsNoetherianRing
    needs:
      - f-complex-analytic-sets--st-zariski-analytic-normality
      - concept-noetherian-and-irreducible-components
      - concept-complex-analytic-sets
  - id: f-complex-analytic-sets--st-germ-weierstrass-division
    title: Statement - Weierstrass division for analytic germs
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file only states a claim, without proving it. Weierstrass division
      is long division for analytic functions. Suppose f is analytic near the
      origin and, along the last coordinate axis, f vanishes to order exactly
      d (like t^d times something nonzero). Then any analytic g can be written
      as q times f plus a remainder, where the remainder is a polynomial of
      degree below d in the last coordinate, with coefficients analytic in
      the other coordinates. The equality holds near the origin. This is the
      analytic cousin of polynomial division with remainder.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StGermWeierstrassDivision.lean:15
    mathlib:
      - analyticOrderAt
    needs:
      - complex-analysis
      - polynomials
      - concept-complex-analytic-sets
  - id: f-complex-analytic-sets--st-germ-general-coordinates
    title: Statement - a generic change of coordinates makes a germ regular
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file only states a claim, without proving it. Take an analytic
      function that is not identically zero near the origin. The claim is
      that some invertible linear change of coordinates makes it vanish to
      a finite order along the last coordinate axis. That is the condition
      Weierstrass division needs. In plain terms, a function that is zero only
      at the origin along some bad axis can be viewed from a better angle,
      and a slightly tilted axis will not lie entirely inside its zero set.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StGermGeneralCoordinates.lean:11
    mathlib:
      - analyticOrderAt
    needs:
      - f-complex-analytic-sets--st-germ-weierstrass-division
      - linear-algebra
      - complex-analysis
  - id: f-complex-analytic-sets--p-analytic-germs-noetherian
    title: Analytic germ rings are Noetherian, assuming two facts
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file proves that rings of analytic germs are Noetherian, but only
      by assuming two other claims: Weierstrass division and the generic
      coordinate change. The proof goes by induction on the number of
      variables. With zero variables the ring is a field, so it is fine.
      To add one variable, take an ideal, pick a nonzero germ in it, tilt
      coordinates so it is regular, and divide by it. Every germ then differs
      from a multiple of it by a polynomial in the last variable with
      coefficients from the smaller ring. Finiteness for the smaller ring
      then gives finitely many generators.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/PAnalyticGermsNoetherian.lean:197
    mathlib:
      - isNoetherianRing_of_ringEquiv
      - IsNoetherian.noetherian
    needs:
      - f-complex-analytic-sets--st-analytic-germs-noetherian
      - f-complex-analytic-sets--st-germ-weierstrass-division
      - f-complex-analytic-sets--st-germ-general-coordinates
      - f-complex-analytic-sets--st-zariski-analytic-normality
      - concept-noetherian-and-irreducible-components
      - concept-complex-analytic-sets
  - id: f-complex-analytic-sets--st-prime-germ-nullstellensatz
    title: Statement - Nullstellensatz for prime analytic germ ideals
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file defines the ideal generated by some analytic functions at a
      point, and only states a claim, without proving it. The claim is an
      analytic Nullstellensatz (a theorem that says a function vanishing on a
      solution set lies in the ideal of the equations). If the ideal is
      prime and a function g vanishes at every point near w where all the
      equations hold, then near w, g is a combination of the equations with
      analytic coefficients. It is the local analytic cousin of Hilbert's
      Nullstellensatz for polynomials.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimeGermNullstellensatz.lean:13
    mathlib:
      - Ideal.span
    needs:
      - f-complex-analytic-sets--st-zariski-analytic-normality
      - concept-finitely-generated-algebras
      - concept-prime-ideals-localization
      - concept-complex-analytic-sets
  - id: f-complex-analytic-sets--st-prime-germ-primitive-presentation
    title: Statement - a prime germ has a primitive-element presentation
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file defines a few things and only states a claim, without proving
      it. A combination means "a sum of the equations times analytic
      coefficients". For a prime germ ideal, the claim says there are
      linear coordinates, an extra linear function (a primitive element) and
      a monic equation in it, so that the primitive satisfies that equation
      modulo the ideal, with no smaller relation, and with a discriminant
      factor making the equation separable (no repeated roots). Every
      function then becomes a polynomial in the primitive after multiplying
      by a power of that factor.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimeGermPrimitivePresentation.lean:16
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimeGermPrimitivePresentation.lean:33
    mathlib:
      - Polynomial.Separable
    needs:
      - f-complex-analytic-sets--st-prime-germ-nullstellensatz
      - concept-separable-polynomials
      - concept-field-extensions-transcendence
      - concept-complex-analytic-sets
  - id: f-st-finite-germ-projection-objects
    title: What a finite projection of a germ ideal is
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file defines "finite germ projection" and proves the easy case.
      Given an ideal P in the germ ring and a linear map A to fewer
      coordinates, A is a finite projection if three things hold. No nonzero
      germ of the smaller space lies in P after pulling back. Every germ is
      congruent mod P to a polynomial in the old coordinates with
      coefficients from the smaller ring. And each old coordinate satisfies
      a monic equation over the smaller ring modulo P. For the zero ideal,
      a coordinate relabelling does the job, which the file proves.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StFiniteGermProjectionObjects.lean:15
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StFiniteGermProjectionObjects.lean:23
    mathlib:
      - Polynomial.Monic
      - MvPolynomial.eval₂
    needs:
      - f-complex-analytic-sets--p-analytic-germs-noetherian
      - f-complex-analytic-sets--st-zariski-analytic-normality
      - concept-complex-analytic-sets
      - concept-prime-ideals-localization
  - id: f-st-prime-germ-projection-step
    title: Statement - the induction step for finite projections
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file only states a claim, without proving it. It is the induction
      step in building finite projections. Take a prime germ ideal P that is
      not zero, in a space with some number of coordinates. Suppose every
      prime germ ideal in any space with fewer coordinates already has a
      finite projection. Then P has one too. This is like proving something
      about polynomial rings by repeatedly dropping a variable. The file also
      defines the ideal of germs vanishing at the origin of a line.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimeGermProjectionStep.lean:11
    mathlib:
      - Ideal.IsPrime
    needs:
      - f-st-finite-germ-projection-objects
      - concept-prime-ideals-localization
      - concept-complex-analytic-sets
  - id: f-st-germ-projection-function-form
    title: Statement - finite projections give explicit function formulas
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file only states a claim, without proving it. It turns the abstract
      finite-projection property of the germ ideal into statements about
      actual analytic functions. Suppose the ideal is generated by analytic
      functions and A is a finite projection. Then (1) a function of the
      smaller coordinates lying in the ideal vanishes near the point, (2)
      each coordinate satisfies a monic equation whose coefficients are
      functions of the smaller coordinates, modulo the ideal, and (3) every analytic
      function is, mod the ideal, a finite sum of such coefficient
      functions times monomials.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StGermProjectionFunctionForm.lean:10
    mathlib: []
    needs:
      - f-st-finite-germ-projection-objects
      - f-complex-analytic-sets--st-prime-germ-nullstellensatz
      - f-complex-analytic-sets--st-prime-germ-primitive-presentation
      - concept-complex-analytic-sets
  - id: f-complex-analytic-sets--st-prime-germ-finite-projection
    title: Statement - prime germs have a finite projection
    kind: step
    status: explained
    chunk: c0087
    plain: >
      This file only states a claim, without proving it. It is the conclusion
      of this whole group of germ results. For a prime ideal generated by
      analytic functions at a point, there is a linear map to a space of fewer
      coordinates so that three things hold. No nonzero function of the
      smaller coordinates is in the ideal. Each old coordinate satisfies a monic equation with
      coefficients from the smaller coordinates, modulo the ideal. Every
      analytic function is finitely many such coefficients times monomials,
      modulo the ideal. This is the analytic analogue of Noether normalisation.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/StPrimeGermFiniteProjection.lean:9
    mathlib: []
    needs:
      - f-complex-analytic-sets--st-prime-germ-nullstellensatz
      - f-complex-analytic-sets--st-prime-germ-primitive-presentation
      - concept-coordinate-rings-dimension
      - concept-complex-analytic-sets
  - id: f-p-prime-germ-finite-projection
    title: Prime germs have finite projections, from two assumed steps
    kind: step
    status: explained
    chunk: c0087
    orphan: true
    plain: >
      This file proves the finite-projection statement for prime germ ideals,
      but only by assuming two other claims: the induction step, and the
      claim turning a finite projection into explicit function formulas. The
      idea is induction on the number of coordinates. A zero ideal is handled
      directly by relabelling coordinates. A nonzero prime ideal is handled by
      the assumed step, which may use the result for fewer coordinates.
      The result then converts to the function form by the second assumption.
    lean:
      - GroundTheory/HeightsAndTheta/Heights/ComplexAnalyticSets/PPrimeGermFiniteProjection.lean:27
    mathlib:
      - Nat.strong_induction_on
    needs:
