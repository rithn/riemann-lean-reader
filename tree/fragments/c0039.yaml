nodes:
  - id: f-adelic-hermitian-forms--is-herm-hyperbolic
    title: Hermitian forms, unitary matrices and transvections, with the hyperbolic example
    kind: step
    status: explained
    chunk: c0039
    plain: >
      Mostly definitions. A Hermitian-style form takes two vectors and gives one number, using a matrix G and a field operation sigma that flips back to itself when applied twice, like complex conjugation. A matrix is "unitary" if it preserves this form. A transvection is a simple matrix that shears space along one vector x, and the file collects the submonoid they generate. It also names what a Hermitian setup needs. One small theorem is proved. The matrix with 0 and 1 off the diagonal, with complex conjugation, is a valid example, and it has a nonzero vector (1, 0) of length zero.
    lean: ["Development/AbelianVarietyTheory/Definitions/AdelicHermitianForms/IsHermHyperbolic.lean:27"]
    mathlib: [Matrix.det_fin_two, Complex.I]
    needs: [concept-hermitian-unitary-matrices, linear-algebra, complex-numbers, f-adelic-hermitian-forms--adelic-pair]
  - id: f-existence-of-lattices--hat1
    title: Definitions for lattices over the finite adeles
    kind: step
    status: explained
    chunk: c0039
    orphan: true
    plain: >
      Only definitions, no theorems. The finite adeles of a number field F are the tuples of numbers, one for each prime, that are integral at all but finitely many primes. The file builds the adelic version of a larger field E, the tensor product of those adeles with E. It defines, for a set of vectors or numbers, the group generated by integral-adelic multiples of them. Then it defines the set of vectors in E that become, after a matrix acts on the adelic span, part of that group. It also defines a Hermitian form on the adelic space.
    lean: ["Development/AbelianVarietyTheory/Definitions/ExistenceOfLattices/Hat1.lean:12"]
    mathlib: [NumberField.FiniteAdeleRing, IsDedekindDomain.HeightOneSpectrum.adicCompletionIntegers, TensorProduct]
    needs: [number-fields, p-adic-numbers, concept-tensor-product-of-algebras, concept-valuation-rings, concept-lattices-in-the-plane]
  - id: f-exists-nsmul-mul-vec-mem
    title: One whole number clears the denominators of a matrix acting on a lattice
    kind: step
    status: explained
    chunk: c0039
    plain: >
      Let E be a number field and L a lattice: vectors whose coordinates are algebraic integers, spanning the whole space with finitely many generators. For any matrix M with entries in E, the file shows a single positive whole number N such that N times M times v is back in L for every v in L. First, any number in E becomes an algebraic integer when multiplied by a suitable whole number. Then one handles the generators, and sums and scalar multiples, by multiplying the numbers found together.
    lean: ["Development/AbelianVarietyTheory/Proofs/AdelicLatticeProofs/ExistsNsmulMulVecMem.lean:53"]
    mathlib: [IsAlgebraic.exists_integral_multiple, Submodule.span_induction]
    needs: [number-fields, concept-integral-closure-fraction-fields, linear-algebra, concept-lattices-in-the-plane]
  - id: f-adelic-lattice-proofs--imports-ter
    title: One whole number pulls any vector into a spanning lattice
    kind: step
    status: explained
    chunk: c0039
    plain: >
      Despite its name, the file holds a real proof, a second copy of the denominator-clearing fact. Let E be a number field and L a lattice in E to the n, built from algebraic integers and spanning everything over E. For every vector y, there is a positive whole number N with N times y in L. First, any single number of E has a whole-number multiple that is an algebraic integer. Then one works through the spanning set, combining the whole numbers found by multiplication.
    lean: ["Development/AbelianVarietyTheory/Proofs/AdelicLatticeProofs/ImportsTer.lean:27"]
    mathlib: [IsAlgebraic.exists_integral_multiple, Submodule.span_induction]
    needs: [number-fields, concept-integral-closure-fraction-fields, linear-algebra]
  - id: f-adelic-lattice-proofs--transvection-identities-unitary
    title: Rules for computing with transvections
    kind: step
    status: explained
    chunk: c0039
    plain: >
      A bundle of eight algebra facts about the form and the transvection, a matrix that shears along a vector x by an amount t. The form is additive, scales in the first slot and by the flipped scalar in the second, and flips back when the arguments are swapped. A transvection acts on v by adding a multiple of x. Two transvections along the same x multiply to another one. Its determinant is 1 plus t times the form of x with itself. It is unitary exactly when a simple equation on t holds. Everything is a direct computation.
    lean: ["Development/AbelianVarietyTheory/Proofs/AdelicLatticeProofs/TransvectionIdentitiesUnitary.lean:93"]
    mathlib: [Matrix.det_one_add_replicateCol_mul_replicateRow, Matrix.mulVec_mulVec]
    needs: [f-adelic-hermitian-forms--is-herm-hyperbolic, concept-hermitian-unitary-matrices, linear-algebra]
  - id: f-exists-trace-zero-adjustment-of-hermitian-lattice
    title: Nudging a transvection parameter so the lattice is almost preserved
    kind: step
    status: explained
    chunk: c0039
    plain: >
      Fix a lattice L, a whole number b and a transvection with a parameter t that satisfies the trace-zero condition t plus its flip equals 0. The file finds a new parameter t' with the same condition, a whole number k coprime to b, and a power b^e, such that for every vector v in L, k times the difference of the two transvections is b times a lattice vector, and b^e times the new transvection and its inverse stay in L. The proof splits a denominator into a part dividing a power of b and a part coprime to b, then rescales t by a number found with Bezout. Two helper wrappers cite other files.
    lean: ["Development/AbelianVarietyTheory/Proofs/AdelicLatticeProofs/ExistsTraceZeroAdjustmentOfHermitianLattice.lean:61"]
    mathlib: [Nat.Coprime, Nat.isCoprime_iff_coprime, Submodule.add_mem]
    needs: [f-exists-nsmul-mul-vec-mem, f-adelic-lattice-proofs--imports-ter, f-adelic-hermitian-forms--is-herm-hyperbolic, f-adelic-lattice-proofs--transvection-identities-unitary, primes-divisibility, modular-arithmetic, concept-lattices-in-the-plane]
  - id: f-unitary-transvection-submonoid-adjust-integral-away
    title: Every product of transvections can be approximated by one keeping the lattice integral
    kind: step
    status: explained
    chunk: c0039
    orphan: true
    plain: >
      Take any product m of transvections of the Hermitian form, a lattice L and a whole number b. For every N the file finds another such product m', a number k coprime to b, and a power b^e, so that k times the gap between m' and m is divisible by b^N on L, and b^e times m' and m' inverse preserve L. Idea: induct on how m is built. A single transvection is the nudging lemma. The empty product is the identity. For a product of two, combine the two approximations, tracking the denominators and powers of b with care.
    lean: ["Development/AbelianVarietyTheory/Proofs/AdelicLatticeProofs/UnitaryTransvectionSubmonoidAdjustIntegralAway.lean:11"]
    mathlib: [Submonoid.closure_induction, Matrix.inv_eq_right_inv]
    needs: [f-exists-trace-zero-adjustment-of-hermitian-lattice, f-adelic-lattice-proofs--transvection-identities-unitary, f-adelic-hermitian-forms--is-herm-hyperbolic, concept-lattices-in-the-plane, groups]
