  - id: f-hecke-u-operator-preserves-modular-form-gamma1-inter-gam-statement
    title: U operator keeps modular forms modular (restated)
    kind: step
    status: explained
    chunk: c0032
    orphan: true
    plain: >
      This file restates a result under a standard name and proves it only by pointing at the real proof elsewhere. The result: take a modular form (a very symmetric function on the upper half plane) for a level group, and a prime q dividing the level. Apply the U operator, which averages the form over q shifted copies of itself. The output is again a modular form for the same level group and weight. The file simply cites the proved theorem in the neighbouring file.
    lean: ["Development/AbelianVarietyTheory/Proofs/FoundationProofs/HeckeUOperatorPreservesModularFormGamma1InterGamStatement.lean:7"]
