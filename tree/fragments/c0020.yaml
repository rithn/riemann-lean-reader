nodes:

- id: concept-chain-complexes-homology
  title: Chain complexes, homology and exact sequences
  kind: concept
  status: textbook
  plain: >
    A complex is a row of abelian groups joined by maps, where doing two steps in a row always
    gives zero. Example: the integers, then the integers again, joined by "times 2". The homology
    at a spot is the elements sent to zero by the outgoing map, divided by the elements that
    arrive from the incoming map. For "times 2" from Z to Z, the homology at the second Z is
    Z/2Z, the two classes "even" and "odd". A sequence with zero homology everywhere is called
    exact. A short exact sequence 0 to A to B to C to 0 is a way of saying that B is built from
    A and C. The key theorem: a short exact sequence of complexes gives a long exact sequence of
    their homology groups, linked by "connecting maps".
  needs: [groups, linear-algebra, concept-normal-subgroups-quotients]
  learn:
    - {title: "Algebraic Topology", where: "Hatcher, section 2.1 (chain complexes, long exact sequence)"}
    - {title: "An Introduction to Homological Algebra", where: "Weibel, chapter 1"}

- id: concept-tensor-products-flatness
  title: Tensor products, base change and flatness
  kind: concept
  status: textbook
  plain: >
    The tensor product A ⊗ B of two abelian groups is built from symbols a ⊗ b that add up
    in each slot separately. Two handy examples. First, Z/p ⊗ M is the same as M modulo its
    multiples of p. Second, Z/2 ⊗ Z/3 is zero, since every symbol is killed by both 2 and 3.
    "Base change" means using a tensor product to switch the numbers you scale by, as in turning
    a real matrix into a complex one. A module is "flat" if tensoring with it never turns a
    one-to-one map into a map that loses information. The rationals are flat over the integers.
    Z/2 is not: times 2 on Z is one-to-one, but becomes zero after tensoring with Z/2.
  needs: [linear-algebra, rings-fields, groups]
  learn:
    - {title: "Abstract Algebra", where: "Dummit and Foote, section 10.4 (tensor products) and 10.5 (exactness, flatness)"}
    - {title: "Introduction to Commutative Algebra", where: "Atiyah and Macdonald, chapter 2"}

- id: concept-finitely-generated-abelian-groups
  title: Finitely generated abelian groups
  kind: concept
  status: textbook
  plain: >
    An abelian group is one where the order of adding does not matter. If it is generated by
    finitely many elements, a classic theorem says it looks like Z^r times a finite group. The
    number r is the rank, the count of independent "free" directions. The finite part breaks
    into cyclic pieces Z/q, where q is a power of a prime. Example: Z times Z/4 times Z/3 has
    rank 1. Multiplying everything by a prime p acts very differently on the two parts. On the
    free part it is one-to-one but misses most elements. On the finite part, anything killed by
    p counts as part of the kernel.
  needs: [groups, modular-arithmetic, primes-divisibility, counting]
  learn:
    - {title: "Abstract Algebra", where: "Dummit and Foote, section 5.2 (structure theorem)"}
    - {title: "Algebra, 2nd edition", where: "Artin, chapter 14 (modules over the integers)"}

- id: f-card-quot-prime-smul-eq-card-ker-mul-pow-finrank
  title: Counting M/pM against p-torsion and rank
  kind: step
  status: explained
  chunk: c0020
  plain: >
    Proved in full, nothing assumed. Take an abelian group M with finitely many generators, and
    a prime p. The number of elements of M/pM (M with multiples of p treated as zero) equals the
    number of elements x with p times x equal to 0, multiplied by p raised to the rank of M.
    Check with M = Z/4 times Z and p = 2. M/2M has 4 elements. The "p-torsion" {0, 2} has 2
    elements, and 2 to the power 1 is 2. The proof splits M into Z^n times a finite group D. On
    Z^n the quotient has p^n elements and nothing is killed. On D, a counting fact (image size
    times kernel size equals size of D) shows the two counts agree.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/CardQuotPrimeSmulEqCardKerMulPowFinrank.lean:93]
  mathlib: [AddCommGroup.equiv_free_prod_directSum_zmod, AddSubgroup.card_mul_index, AddSubgroup.index_pi, AddSubgroup.index_prod, Int.index_zmultiples]
  needs: [concept-finitely-generated-abelian-groups, concept-normal-subgroups-quotients, groups, counting, linear-algebra]

- id: f-card-zmod-tensor-eq-card-quot-prime-multiples
  title: Z/p tensor M has as many elements as M/pM
  kind: step
  status: explained
  chunk: c0020
  plain: >
    Proved in full. For an abelian group M and a whole number p, the tensor product of Z/p with
    M has exactly as many elements as M modulo its multiples of p. Example: for M = Z/4 and
    p = 2, both sides have 2 elements. The idea is short. Z/p is the integers modulo the multiples
    of p. A library fact says that tensoring "integers modulo an ideal" with M gives M modulo
    that ideal's multiples of M. Here the ideal is generated by p, so the result is M modulo
    pM. The file only matches up the pieces, checking that the Z/p of the library is the same as
    the ring ZMod p.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/CardZmodTensorEqCardQuotPrimeMultiples.lean:18]
  mathlib: [TensorProduct.quotTensorEquivQuotSMul, Int.quotientSpanNatEquivZMod]
  needs: [concept-tensor-products-flatness, modular-arithmetic, concept-normal-subgroups-quotients, rings-fields]

- id: f-nat-card-homology-restrict-scalars
  title: Forgetting extra scalars does not change the size of homology
  kind: step
  status: explained
  chunk: c0020
  plain: >
    Proved in full. Take a complex of vector spaces over a ring S, and a ring map from R to S.
    You may forget that you can scale by all of S, and only allow scaling by R. The homology of
    the new complex has the same number of elements as the original. This is almost obvious,
    since the underlying sets of numbers do not change. Example: a complex of vector spaces
    over Z/3 can be viewed as a complex of abelian groups, and its homology groups are the same
    sets. The proof just uses a library fact that computing homology commutes with "forget the
    scalars", and then compares the two sets.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/NatCardHomologyRestrictScalars.lean:6]
  mathlib: [ShortComplex.mapHomologyIso, ModuleCat.restrictScalars]
  needs: [concept-chain-complexes-homology, rings-fields, counting]

- id: f-nat-card-homology-of-short-exact-mul
  title: Size of homology from a "times p" short exact sequence
  kind: step
  status: explained
  chunk: c0020
  plain: >
    Proved in full. Suppose a complex C sits in a short exact sequence 0, C, C, G, 0 where the
    first map is "multiply by p" and G is the cokernel. (This is assumed as a hypothesis of the
    theorem.) Then the homology of G in degree n has size equal to two numbers multiplied. One
    is the size of H_n(C) modulo p times itself. The other is the number of elements of the next
    homology group H_(n+1)(C) that p kills. The proof reads off five groups from the long
    exact sequence of homology. A small counting lemma then says that the middle group of an
    exact row of five is the product of a cokernel and a kernel.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/NatCardHomologyOfShortExactMul.lean:18]
  mathlib: [ShortComplex.ShortExact.homology_exact₁, ShortComplex.ShortExact.homology_exact₂, ShortComplex.ShortExact.homology_exact₃, LinearMap.quotKerEquivRange, ShortComplex.moduleCat_range_eq_ker]
  needs: [concept-chain-complexes-homology, concept-normal-subgroups-quotients, counting]

- id: f-short-exact-mul-prime-zmod-tensor-complex
  title: Times p, then reduce mod p, is a short exact sequence
  kind: step
  status: explained
  chunk: c0020
  plain: >
    Proved in full. Let C be a complex of abelian groups, with a prime p that kills nothing but
    zero in every degree. Then "multiply by p" followed by "reduce mod p" (send x to 1 ⊗ x in
    Z/p ⊗ C) forms a short exact sequence of complexes. Check degree by degree. Multiplication
    by p is one-to-one by hypothesis. Reducing mod p reaches every element of Z/p ⊗ M, since
    k copies of 1 ⊗ m is 1 ⊗ km. Two steps in a row give zero, because p is zero in Z/p, so p times (1 ⊗ x) is zero. The
    kernel of reduction is exactly the multiples of p, by mapping Z/p ⊗ M onto M/pM.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ShortExactMulPrimeZmodTensorComplex.lean:119]
  mathlib: [ModuleCat.extendRestrictScalarsAdj, HomologicalComplex.shortExact_of_degreewise_shortExact, TensorProduct.liftAddHom, ZMod.lift]
  needs: [concept-chain-complexes-homology, concept-tensor-products-flatness, modular-arithmetic, concept-normal-subgroups-quotients]

- id: f-finrank-homology-mod-prime-universal-coefficients
  title: Universal coefficients, mod p dimension formula
  kind: step
  status: explained
  chunk: c0020
  orphan: true
  plain: >
    Proved in full, using the other five files of this group. Let C be a complex of abelian
    groups with no p-torsion (nothing but zero is killed by the prime p), whose homology groups
    are finitely generated. Reduce C mod p. Then the dimension of the new homology in degree n,
    over the field with p elements, equals dim(H_n(C) ⊗ Z/p) plus dim(H_(n+1)(C) ⊗ Z/p) minus
    the rank of H_(n+1)(C). The proof counts elements. It combines the two size formulas for
    H_n(C)/p and for the p-torsion of H_(n+1)(C). Everything is a power of p, so the exponents
    can be compared.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/FinrankHomologyModPrimeUniversalCoefficients.lean:11]
  mathlib: [Module.natCard_eq_pow_finrank, Nat.pow_right_injective]
  needs: [f-card-quot-prime-smul-eq-card-ker-mul-pow-finrank, f-card-zmod-tensor-eq-card-quot-prime-multiples, f-nat-card-homology-restrict-scalars, f-nat-card-homology-of-short-exact-mul, f-short-exact-mul-prime-zmod-tensor-complex, concept-chain-complexes-homology, concept-tensor-products-flatness, linear-algebra, modular-arithmetic]
