# ---- new concepts first needed by this chunk ----

- id: concept-prime-spectrum-and-schemes
  title: Spec of a ring, the Zariski topology and schemes
  kind: concept
  status: textbook
  plain: >
    Algebraic geometry turns a ring into a shape. The points are the prime ideals, which are the sets of multiples that
    behave like "the functions vanishing at a point". Example: for the integers, the points are 0 and each prime
    number. A set of points is closed if it is where some functions all vanish, which gives a very coarse topology.
    A scheme is a shape glued together from such pieces. A closed and open set corresponds to an idempotent element,
    one equal to its own square, which is 1 on one part of the shape and 0 on the rest.
  needs: [rings-fields, concept-point-set-topology, concept-localization-quotient-rings]
  learn:
    - {title: Algebraic Geometry (R. Hartshorne), where: "Chapter II, sections 1 and 2"}
    - {title: Foundations of Algebraic Geometry (R. Vakil), where: "Chapters 3 and 4 (free online)"}
    - {title: Introduction to Commutative Algebra (M. Atiyah and I. Macdonald), where: "Chapter 1"}

- id: concept-tensor-product-of-algebras
  title: Tensor products of rings and algebras
  kind: concept
  status: textbook
  plain: >
    The tensor product of two rings A and B that both sit over a common ring R is a new ring A times B over R. Its
    elements are sums of formal products a times b, where an R-multiple can be moved from one side to the other. Example:
    the integers mod 2 tensored with the integers mod 3 give the zero ring, since the two kinds of arithmetic clash.
    Tensoring with a fraction field allows fractions. In geometry, it corresponds to taking the part of a shape lying
    over a chosen point of the base.
  needs: [rings-fields, linear-algebra]
  learn:
    - {title: Introduction to Commutative Algebra (M. Atiyah and I. Macdonald), where: "Chapter 2"}
    - {title: Abstract Algebra (D. Dummit and R. Foote), where: "Section 10.4"}

- id: concept-smooth-morphisms
  title: Smooth morphisms (families of smooth shapes)
  kind: concept
  status: textbook
  plain: >
    A smooth family is a map from one shape to another in which every fibre, meaning the part lying over one point, is a
    smooth shape with no corners or self-crossings, and the pieces vary without sudden jumps. Example: a circle of
    fixed radius over each point of a line. In algebra, this is a ring A over a ring R presented by polynomial
    equations whose slopes are independent. Etale maps are the case where the fibres are finite collections of points.
  needs: [concept-etale-ring-maps, concept-prime-spectrum-and-schemes, calculus]
  learn:
    - {title: Algebraic Geometry (R. Hartshorne), where: "Chapter III, section 10"}
    - {title: Neron Models (S. Bosch, W. Luetkebohmert, M. Raynaud), where: "Chapter 2"}

- id: concept-noetherian-and-irreducible-components
  title: Noetherian spaces and irreducible components
  kind: concept
  status: textbook
  plain: >
    A ring is Noetherian if every set of multiples is generated by finitely many elements. This holds for the integers
    and for polynomials in several variables. The shape of such a ring is then a Noetherian space, which means it can
    only be cut into finitely many basic irreducible pieces, where irreducible means "not a union of two smaller closed
    pieces". Example: two crossing lines form two pieces. This finiteness lets one prove facts about connected pieces
    of the shape by listing the irreducible ones.
  needs: [rings-fields, concept-point-set-topology, concept-prime-spectrum-and-schemes]
  learn:
    - {title: Introduction to Commutative Algebra (M. Atiyah and I. Macdonald), where: "Chapters 6 and 7"}
    - {title: Algebraic Geometry (R. Hartshorne), where: "Chapter I, section 1"}

- id: concept-integral-closure-fraction-fields
  title: Integral elements, integrally closed domains, fraction fields
  kind: concept
  status: textbook
  plain: >
    From a ring with no zero divisors, such as the integers, you can form the fraction field by allowing fractions.
    An element of the fraction field is integral if it is a root of a polynomial with leading coefficient 1 and
    coefficients from the ring. For example, the square root of 2 is integral over the integers, but one half is not.
    A ring is integrally closed if its only integral fractions are its own elements, as with the integers. An element e
    with e squared equal to e is automatically integral, being a root of x squared minus x.
  needs: [rings-fields, polynomials]
  learn:
    - {title: Introduction to Commutative Algebra (M. Atiyah and I. Macdonald), where: "Chapter 5"}
    - {title: Algebraic Number Theory (J. Neukirch), where: "Chapter I, section 2"}

- id: concept-valuation-rings
  title: Valuation rings (a base with a generic point and a closed point)
  kind: concept
  status: textbook
  plain: >
    A valuation ring is a ring where, for any two nonzero fractions, one divides the other. Example: the rational numbers
    with denominators not divisible by a fixed prime p. Its shape has exactly two kinds of points here: a closed point
    (reduce mod p) and a generic point (the fraction field). The closed point is a limit of the generic one, so you can
    ask how a quantity behaves when passing from generic to closed. This makes valuation rings a standard test case for
    properties of families.
  needs: [rings-fields, concept-prime-spectrum-and-schemes, p-adic-numbers]
  learn:
    - {title: Commutative Ring Theory (H. Matsumura), where: "Section 10 (valuation rings)"}
    - {title: Algebraic Number Theory (J. Neukirch), where: "Chapter II, section 3"}

# ---- the chunk ----

- id: f-is-integral-of-is-idempotent-elem
  title: Idempotents over a smooth algebra come from the algebra itself
  kind: step
  status: explained
  chunk: c0024
  plain: >
    The file proves two facts. First, an element e with e squared equal to e is integral, being a root of x squared minus
    x. Second, let R be an integrally closed ring with fraction field K, and A a smooth algebra over R. Then any
    such idempotent in A tensored with K is already of the form a tensor 1 for an idempotent a of A. The proof leans
    on a Mathlib theorem on integral closures of smooth algebras. Since R is integrally closed, the integral part of K is R
    itself, so a lift to A exists. Injectivity gives a squared equal to a.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/IsIntegralOfIsIdempotentElem.lean:12]
  mathlib: [TensorProduct.toIntegralClosure_bijective_of_smooth, IsIntegrallyClosed.isIntegral_iff, Algebra.TensorProduct.includeLeft_injective]
  needs: [concept-integral-closure-fraction-fields, concept-tensor-product-of-algebras, concept-smooth-morphisms]

- id: f-exists-idempotent-tmul-one-eq-of-smooth-algebra
  title: "Restatement: idempotents of the fibre over the fraction field come from A"
  kind: step
  status: explained
  chunk: c0024
  plain: >
    This short file proves nothing new. It restates the second result of the file on idempotents, that for a smooth
    algebra A over an integrally closed domain R, every idempotent of A tensored with the fraction field is of the
    form a tensor 1 for an idempotent a of A, under another public name. Its proof just tries several ways of
    applying the earlier theorem. Everything rests on the file it imports. The statement is long mainly because all
    assumptions on R and A are written in full.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsIdempotentTmulOneEqOfSmoothAlgebra.lean:9]
  needs: [f-is-integral-of-is-idempotent-elem]

- id: f-range-comap-include-right-field
  title: Which primes come from a tensor product with a field
  kind: step
  status: explained
  chunk: c0024
  plain: >
    For rings A and B over A, and a field k over A, there is a natural map from the shape of k tensored with B to the
    shape of B. The file proves that its image is exactly the set of primes of B whose restriction to A equals
    the kernel of A to k, meaning those over the point of A determined by k. One direction is routine. For the other,
    take such a prime and its residue field K. Tensoring k with K over the shared quotient of A is not the zero ring,
    so it has a maximal ideal, and pulling that back to k tensored with B gives a prime mapping to the original one.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/RangeComapIncludeRightField.lean:8]
  mathlib: [Algebra.TensorProduct.nontrivial_of_algebraMap_injective_of_isDomain, Ideal.exists_maximal, Ideal.ker_algebraMap_residueField]
  needs: [concept-tensor-product-of-algebras, concept-prime-spectrum-and-schemes]

- id: f-closure-generic-fibre-clopen-split
  title: Splitting the generic fibre into two separated pieces splits the whole space
  kind: step
  status: explained
  chunk: c0024
  plain: >
    Let A be a smooth algebra over an integrally closed domain R. The "generic fibre" is the part of the shape of A lying
    over the generic point of R. Suppose it is split into two sets C and C' such that neither touches the closure of
    the other. Then the closures of C and C' are disjoint and together make up the entire shape. The proof turns the
    split into a clopen set of the generic fibre, which gives an idempotent. That lifts to an idempotent a in A by the
    previous file, and the set where a is nonzero separates C from C'. Density of the generic fibre gives the cover.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ClosureGenericFibreClopenSplit.lean:7]
  mathlib: [PrimeSpectrum.isClopen_iff, PrimeSpectrum.denseRange_comap_iff_ker_le_nilRadical, Module.Flat.lTensor_preserves_injective_linearMap]
  needs:
    - f-exists-idempotent-tmul-one-eq-of-smooth-algebra
    - f-range-comap-include-right-field
    - concept-prime-spectrum-and-schemes
    - concept-smooth-morphisms
    - concept-point-set-topology

- id: f-smooth-generic-fibre-closure-partition
  title: The same splitting statement, for schemes instead of rings
  kind: step
  status: explained
  chunk: c0024
  plain: >
    This file lifts the previous statement from a single ring to a general scheme X with a smooth map to the shape of an
    integrally closed domain R. Splitting the generic fibre of X into two pieces C and C', each away from the closure of
    the other, forces the closures of C and C' to be disjoint and to cover all of X. The proof covers X by open pieces
    that are shapes of rings, applies the ring version in each, and then checks that closures behave well on open
    pieces, so the conclusion transfers back to X.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/SmoothGenericFibreClosurePartition.lean:9]
  mathlib: [AlgebraicGeometry.Scheme.affineCover, HasRingHomProperty.Spec_iff, IsOpenMap.preimage_closure_eq_closure_preimage]
  needs: [f-closure-generic-fibre-clopen-split, concept-prime-spectrum-and-schemes, concept-smooth-morphisms]

- id: f-is-open-connected-component-of-is-locally-noetherian
  title: In a locally Noetherian scheme, connected components are open
  kind: step
  status: explained
  chunk: c0024
  plain: >
    A scheme is locally Noetherian when it can be covered by shapes of Noetherian rings. The file proves that each
    connected component, meaning each maximal one-piece part, is then an open set. First for a Noetherian space:
    there are finitely many irreducible pieces, and everything outside the component is the union of those pieces
    that miss it. A finite union of closed sets is closed, so the component is open. The scheme case follows by
    working inside affine open pieces and comparing connected components there with those in the whole space.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/IsOpenConnectedComponentOfIsLocallyNoetherian.lean:34]
  mathlib: [NoetherianSpace.finite_irreducibleComponents, isClosed_of_mem_irreducibleComponents, noetherianSpace_of_isAffineOpen]
  needs: [concept-noetherian-and-irreducible-components, concept-point-set-topology, concept-prime-spectrum-and-schemes]

- id: f-section-mem-component-generic-of-closed-valuation
  title: A section that meets the right component at the closed point does so at the generic point
  kind: step
  status: explained
  chunk: c0024
  orphan: true
  plain: >
    Take a valuation ring V, a scheme X with a smooth map f to the shape of V, and two sections e and sigma, meaning
    maps that pick one point of X over each point of V. If sigma at the closed point lies in the same connected
    component of its fibre as e does, then so does sigma at the generic point. The proof is by contradiction. The
    generic fibre splits into the component of e and the rest, whose closures are disjoint by the previous results.
    One closure is clopen. Following sigma and e from the generic to the closed point forces sigma into the wrong
    closure.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/SectionMemComponentGenericOfClosedValuation.lean:61]
  mathlib: [IsLocalRing.specializes_closedPoint, IsPreconnected.subset_isClopen, connectedComponentIn_eq_image]
  needs:
    - f-is-open-connected-component-of-is-locally-noetherian
    - f-smooth-generic-fibre-closure-partition
    - concept-valuation-rings
    - concept-smooth-morphisms
