nodes:
  - id: f-q-act-m-sub-algebra-map
    title: "Definitions: the subspace cut by a character, and the action on the quotient"
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file sets up tools for studying a vector space H on which a ring acts. It defines a subspace "mSub", spanned by all vectors of the form (ring element acting on x) minus (a number chi times x), where chi is a character (a ring map to numbers). It defines a similar subspace for several characters, and the space of maps that commute with the action. It shows these subspaces are preserved by the action. Main result: on the quotient of H by mSub, every ring element acts as plain multiplication by its chi value. This is a direct check from the definition.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/QActMSubAlgebraMap.lean:9", "Development/AbelianVarietyTheory/Proofs/DivisorProofs/QActMSubAlgebraMap.lean:40", "Development/AbelianVarietyTheory/Proofs/DivisorProofs/QActMSubAlgebraMap.lean:78"]
    mathlib: [Submodule.span_induction, Submodule.mapQ, Submodule.Quotient.mk_eq_zero]
    needs: [linear-algebra, rings-fields, concept-group-representations]
  - id: f-character-augmentation-subspace-top-eq-ker-smul
    title: The character subspace equals the augmentation ideal times the whole space
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file proves that two descriptions of the same subspace agree. Let a ring C act on a vector space H over a field k, and let chi be a character of C. One subspace is spanned by vectors (c acting on y) minus (chi of c times y). The other is the part of H reached by the kernel of chi, an ideal of the combined ring k tensor C, acting on H. The proof checks both inclusions. Forward, each spanning vector is a kernel element acting on y. Backward, any kernel element acting on y differs from zero by something in the first subspace, shown by a sum-by-sum argument.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/CharacterAugmentationSubspaceTopEqKerSmul.lean:8"]
    mathlib: [TensorProduct.induction_on, Submodule.span_induction, Submodule.smul_induction_on, Algebra.TensorProduct.lift]
    needs: [f-q-act-m-sub-algebra-map, concept-tensor-product-of-algebras, linear-algebra, rings-fields]
  - id: f-character-augmentation-subspace-top-eq-ker-smul-statement
    title: Character subspace equals kernel times whole space (restated)
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file restates, under a standard name, the result that a character subspace equals the kernel of the character acting on the whole space. It does not prove it afresh. It just calls the proof in the neighbouring file, trying a few ways of passing the arguments. Other files cite this restated name. The idea of the proof is in that neighbouring file, where both inclusions are checked directly from the definitions.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/CharacterAugmentationSubspaceTopEqKerSmulStatement.lean:8"]
    mathlib: []
    needs: [f-character-augmentation-subspace-top-eq-ker-smul, concept-tensor-product-of-algebras]
  - id: f-exists-idempotent-local-of-character
    title: A character picks out a local piece of a finite algebra
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file proves that a finite-dimensional algebra A over a field k, with a character phi (a ring map from A to k), has a special element e. Here e is idempotent (e times e equals e, like a switch that is either fully on or off), it maps to 1 under phi, and e times anything that phi sends to zero is nilpotent (some power of it is zero). Intuitively, e carves out the piece of A sitting over the point phi. The proof uses that powers of the kernel ideal eventually stop shrinking, so a power is generated by an idempotent.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsIdempotentLocalOfCharacter.lean:7"]
    mathlib: [IsArtinianRing.of_finite, IsArtinian.monotone_stabilizes, Ideal.isIdempotentElem_iff_of_fg]
    needs: [rings-fields, linear-algebra, concept-local-rings, concept-prime-ideals-localization]
  - id: f-exists-idempotent-local-of-character-statement
    title: Local idempotent for a character (restated)
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file restates, under a standard name, the result that a character on a finite-dimensional algebra yields an idempotent element sitting over it. It does not reprove it. It calls the proof in the neighbouring file, trying several ways of passing the arguments. Other files cite this restated name. The idea is that the kernel of the character has powers that stabilise, and a stabilised power is generated by an idempotent.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsIdempotentLocalOfCharacterStatement.lean:7"]
    mathlib: []
    needs: [f-exists-idempotent-local-of-character, rings-fields]
  - id: f-finrank-quot-one-sub-idempotent-eq-mul
    title: Dimension of a quotient by an idempotent, as a product
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file proves a dimension count. Let A be a finite-dimensional algebra with a character phi, and e the idempotent over phi from the earlier file. Let H be a finite-dimensional space on which A acts nicely (projectively, a mild condition like being a piece of a free module). Then the dimension of H modulo the (1 minus e) part equals the dimension of H modulo the kernel of phi, times the dimension of A modulo the (1 minus e) part. The proof shows the quotient of A is a local ring, so the module is free over it, which gives a product of dimensions.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/FinrankQuotOneSubIdempotentEqMul.lean:7"]
    mathlib: [Module.free_of_flat_of_isLocalRing, TensorProduct.quotTensorEquivQuotSMul, Module.finrank_baseChange, Module.finrank_pi_fintype]
    needs: [concept-local-rings, concept-flat-modules, concept-tensor-product-of-algebras, linear-algebra, rings-fields]
  - id: f-finrank-quot-one-sub-idempotent-eq-mul-statement
    title: Dimension of a quotient by an idempotent (restated)
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file restates, under a standard name, the dimension formula for a quotient by an idempotent. It does not prove it afresh. It forwards to the proof in the neighbouring file, trying a few ways of passing the arguments. Other files cite this restated name. The formula says one dimension equals another dimension times a third, coming from a freeness argument over a local ring.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/FinrankQuotOneSubIdempotentEqMulStatement.lean:7"]
    mathlib: []
    needs: [f-finrank-quot-one-sub-idempotent-eq-mul, linear-algebra]
  - id: f-weight-space-iff-idempotent-fixed
    title: Generalised eigenspace equals the vectors fixed by the idempotent
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file proves a description of a "weight space". Let a ring C act on a finite-dimensional vector space M, and chi be a character of C. The weight space is the set of vectors that every element c of C acts on like chi of c, up to nilpotent errors (a generalised eigenspace, as for a matrix with a repeated eigenvalue). The claim: a vector lies in this space exactly when the idempotent e fixes it (e acting on m gives m). One direction uses that 1 minus e is both idempotent and nilpotent on the space, hence zero. The other raises the fixed vector to powers.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/WeightSpaceIffIdempotentFixed.lean:7"]
    mathlib: [Module.End.mapsTo_maxGenEigenspace_of_comm, Module.End.maxGenEigenspace, Commute.isNilpotent_add, IsIdempotentElem.eq_zero_of_isNilpotent]
    needs: [linear-algebra, concept-tensor-product-of-algebras, rings-fields]
  - id: f-weight-space-iff-idempotent-fixed-statement
    title: Weight space equals idempotent-fixed vectors (restated)
    kind: step
    status: explained
    chunk: c0034
    plain: >
      This file restates, under a standard name, the fact that a weight space (a generalised eigenspace shared by a whole ring of operators) is exactly the set of vectors fixed by a chosen idempotent. It does not reprove it. It forwards to the proof in the neighbouring file, trying a few ways of passing the arguments. Other files cite this restated name.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/WeightSpaceIffIdempotentFixedStatement.lean:7"]
    mathlib: []
    needs: [f-weight-space-iff-idempotent-fixed, linear-algebra]
  - id: f-finrank-weight-space-projective-tensor-eq
    title: Dimension of a weight space factors as a product
    kind: step
    status: explained
    chunk: c0034
    orphan: true
    plain: >
      This file proves a dimension formula for weight spaces. A ring C acts on a finite-dimensional space H over an algebraically closed field k, and H is projective over the combined ring k tensor C. For a character chi, the dimension of the chi weight space of H equals the dimension of H modulo the character subspace, times the dimension of the chi weight space of the ring k tensor C itself. The proof picks the idempotent over chi. It rewrites each weight space as the space fixed by that idempotent, counts dimensions as kernel versus quotient, and applies the product formula from the earlier file.
    lean: ["Development/AbelianVarietyTheory/Proofs/DivisorProofs/FinrankWeightSpaceProjectiveTensorEq.lean:35"]
    mathlib: [LinearMap.finrank_range_add_finrank_ker, Submodule.finrank_quotient_add_finrank, Module.End.maxGenEigenspace]
    needs: [f-exists-idempotent-local-of-character-statement, f-finrank-quot-one-sub-idempotent-eq-mul-statement, f-weight-space-iff-idempotent-fixed-statement, f-character-augmentation-subspace-top-eq-ker-smul-statement, f-q-act-m-sub-algebra-map, concept-tensor-product-of-algebras, concept-flat-modules, linear-algebra, algebraic-closure]
