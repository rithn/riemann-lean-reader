nodes:
  - id: f-block-decomposition--perfect-tensor-product
    title: Tensoring perfect rings gives a perfect ring
    kind: step
    status: explained
    chunk: c0056
    plain: >
      This file proves that if three rings of prime characteristic p are "perfect", then so is the ring made by tensoring two of them over the third. A ring is perfect when raising to the p-th power is a two-way street: every element has exactly one p-th root. A tensor product glues two rings along a shared one. The proof builds the candidate inverse by taking the p-th root on each side of every glued pair, checks it undoes the p-th power on simple pairs, and extends by adding. A small helper shows root-taking commutes with scalar multiplication.
    lean: [Development/AutomorphicSpectrum/Proofs/BlockDecomposition/PerfectTensorProduct.lean:29]
    mathlib: [TensorProduct.liftAddHom, TensorProduct.induction_on, RingEquiv.ofBijective]
    needs: [concept-tensor-product-of-algebras, rings-fields, primes-divisibility, f-block-decomposition--pf-facts]
  - id: f-block-decomposition--pq-lift
    title: Maps out of a "perfected quotient" are determined uniquely
    kind: step
    status: explained
    chunk: c0056
    plain: >
      Take a ring map from S into a perfect ring T1 (in prime characteristic p) that sends every element of an ideal I to zero. This file proves it extends in exactly one way over a bigger ring T that is a "perfect hull" of S modulo I. The idea: every element of T has some p^k-th power coming from S. Send it to the p^k-th root of the image in T1. Perfectness makes that root unique, so the choice is consistent, and the Frobenius map being additive makes the result respect sums and products.
    lean: [Development/AutomorphicSpectrum/Proofs/BlockDecomposition/PqLift.lean:11]
    mathlib: []
    needs: [f-block-decomposition--pf-facts, rings-fields, primes-divisibility, concept-categorical-pullbacks]
  - id: f-block-decomposition--perfect-tensor-generated-lift
    title: The perfected-quotient property survives base change
    kind: step
    status: explained
    chunk: c0056
    plain: >
      Setting: rings of prime characteristic p, where B is a perfect hull of S modulo an ideal I. Tensoring B up with another perfect ring K gives a bigger ring. This file shows the tensor ring is again perfect, every element has a p-power coming from the new base, and the kernel is exactly what the pushed-forward ideal predicts. The proof uses the previous two results: the tensor is perfect, and the universal lifting property of the hull gives a map that detects the kernel. Hedged reading: I have paraphrased the technical conditions loosely.
    lean: [Development/AutomorphicSpectrum/Proofs/BlockDecomposition/PerfectTensorGeneratedLift.lean:13]
    mathlib: [TensorProduct.induction_on, Algebra.TensorProduct.productMap]
    needs: [f-block-decomposition--perfect-tensor-product, f-block-decomposition--pq-lift, f-block-decomposition--exists-p-q, f-block-decomposition--pf-facts, concept-tensor-product-of-algebras]
  - id: f-pq-base-change-polynomial
    title: The perfected-quotient property for polynomial rings, base-changed
    kind: step
    status: explained
    chunk: c0056
    plain: >
      Start with polynomials over a perfect ring A, an ideal generated by one polynomial h, and a perfect hull of the quotient. Swap the coefficients to a bigger perfect ring K. This file shows the same kind of hull exists for the new polynomial ring, with the ideal generated by h with coefficients converted. The proof builds the map from the new polynomials by sending X to X tensor 1, checks it on constants, additions and multiplication by X, shows polynomials are generated by constants plus converted polynomials, and then applies the general base-change result.
    lean: [Development/AutomorphicSpectrum/Proofs/BlockDecomposition/PqBaseChangePolynomial.lean:9]
    mathlib: [Polynomial.eval₂RingHom, Polynomial.induction_on, Ideal.map_span]
    needs: [f-block-decomposition--perfect-tensor-generated-lift, polynomials, concept-tensor-product-of-algebras]
    orphan: true
