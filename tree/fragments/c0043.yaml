nodes:
  - id: f-nonempty-alg-hom-adjoin
    title: A map defined on a subring extends after clearing a denominator
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file proves a ring-extension fact. Inside a field F, take a subring S, a ring map psi from S into another field, and an element h of S that psi does not send to zero. Suppose h times each element x of a set T lies in S. Then psi can be extended to everything built from T. The idea is to allow division by powers of h. Inverting h in S gives a bigger ring, which sits inside F and maps onward to the target field. Because h is nonzero in both fields, this is consistent, and elements built from T live in the bigger ring.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/NonemptyAlgHomAdjoin.lean:5]
    mathlib: [IsLocalization.liftAlgHom, AlgEquiv.ofInjective]
    needs: [concept-prime-ideals-localization, rings-fields]
  - id: f-adjoin-hom-extend-of-denominator
    title: Restatement - extending a map by clearing a denominator
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file states the denominator-clearing extension result under a second name, and it proves nothing new. The statement: a ring map from a subring S of a field to another field, with an element h of S not sent to zero, extends to all elements x of a set T provided h times x lands in S. The proof is only a call to the version proved in the neighbouring file, with several fallback attempts for how to pass the arguments. Other files cite this name.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/AdjoinHomExtendOfDenominator.lean:6]
    mathlib: []
    needs: [f-nonempty-alg-hom-adjoin, rings-fields]
  - id: f-extend-alg-hom-adjoin-integral-root
    title: Extending a map by sending a root to a root
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file proves an extension rule. Take a subring R of a field F that is integrally closed (it contains every element of its fraction field that satisfies a monic equation over R). Take an element theta of F that satisfies a monic equation over R, with minimal such polynomial m. Given a ring map ev from R to a field and a root r of m after applying ev, there is a map from the ring generated by R and theta that agrees with ev on R and sends theta to r. The proof identifies that ring with R adjoin a formal root of m, then sends the formal root to r.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExtendAlgHomAdjoinIntegralRoot.lean:7]
    mathlib: [minpoly.equivAdjoin, AdjoinRoot.lift]
    needs: [concept-integral-closure-fraction-fields, polynomials, rings-fields]
  - id: f-is-integrally-closed-adjoin
    title: Polynomial rings are integrally closed; evaluating away zeros
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file collects three small results. First, if elements s_1,...,s_n of a field are algebraically independent over k (satisfy no polynomial relation), then the ring they generate looks exactly like the polynomial ring in n variables. Because polynomial rings have unique factorisation, that ring is integrally closed. Second, a separably closed field is infinite. Third, given a nonzero element H of that polynomial ring, one can plug in values from the separable closure of k so that H does not vanish. This works because a nonzero polynomial cannot vanish at every point of an infinite field's grid.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/IsIntegrallyClosedAdjoin.lean:10, Development/AbelianVarietyTheory/Proofs/DivisorProofs/IsIntegrallyClosedAdjoin.lean:23]
    mathlib: [AlgebraicIndependent.aevalEquiv, MvPolynomial.funext, UniqueFactorizationMonoid]
    needs: [concept-integral-closure-fraction-fields, concept-field-extensions-transcendence, polynomials, concept-separable-polynomials]
  - id: f-linear-indep-on-pow-of-is-domain-tensor-purely-inseparabl
    title: In characteristic p, p-th powers keep independence
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file proves a statement about fields of prime characteristic p, where raising to the p-th power is additive. Let B be a domain finitely generated over a field k, and assume that tensoring B with any finite purely inseparable extension of k stays a domain. Then if finitely many elements of the fraction field of B are linearly independent over k, so are their p-th powers. The proof clears denominators, then adjoins p-th roots of any hypothetical relation's coefficients. In the tensor product, raising a sum to the p-th power gives zero, and a domain has no nonzero nilpotents, forcing the coefficients to be zero.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/LinearIndepOnPowOfIsDomainTensorPurelyInseparabl.lean:6]
    mathlib: [sum_pow_char, Module.Flat.linearIndependent_one_tmul, IsLocalization.exist_integer_multiples_of_finset]
    needs: [concept-tensor-product-of-algebras, concept-flat-modules, linear-algebra, algebraic-closure, concept-integral-closure-fraction-fields]
  - id: f-exists-primitive-element-separability-certificate
    title: A single generator with a separability certificate
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file proves a technical existence result. Take a field F, a transcendence basis s over k (algebraically independent elements over which F is algebraic) such that F is separable over the field they generate, and a finite set T of elements of F. Then there is one element theta, integral over the polynomial ring on s, and a nonzero element H of that ring, with two properties. H lies in the ideal generated by the minimal polynomial of theta and its derivative, proving separability. And H times each element of T lies in the ring generated by theta. The proof uses the primitive element theorem and clears denominators.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsPrimitiveElementSeparabilityCertificate.lean:50]
    mathlib: [Field.exists_primitive_element, minpoly.isIntegrallyClosed_eq_field_fractions', IsLocalization.integerNormalization_spec]
    needs: [f-is-integrally-closed-adjoin, concept-field-extensions-transcendence, concept-separable-polynomials, concept-integral-closure-fraction-fields, polynomials]
  - id: f-exists-finite-separable-point-of-separable-closure-poin
    title: A point over the separable closure lives in a finite separable field
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file proves a reduction step. Let B be an algebra generated by finitely many elements over a field k. Suppose there is a ring map from B into the separable closure of k (the field of all roots of separable polynomials). Then there is a finite, separable extension k' of k and a ring map from B into k'. The proof takes the images of the finitely many generators and adjoins them to k inside the separable closure. Each is separable, so the resulting field is finite-dimensional and separable. The original map then lands inside it.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsFiniteSeparablePointOfSeparableClosurePoin.lean:6]
    mathlib: [IntermediateField.finiteDimensional_adjoin, Algebra.IsSeparable.of_algHom]
    needs: [concept-finitely-generated-algebras, concept-separable-polynomials, concept-field-extensions-transcendence, algebraic-closure]
  - id: f-exists-separable-point-of-geometrically-domain
    title: Geometrically integral algebras have a separable point
    kind: step
    status: explained
    chunk: c0043
    plain: >
      This file proves a theorem from algebraic geometry. Take an algebra B, generated by finitely many elements over a field k, such that tensoring B with every finite purely inseparable extension of k gives a domain. Then B has a point over some finite separable extension of k, meaning a ring map from B to a finite separable field extension. The proof shows the fraction field of B has a separating transcendence basis. It then builds a point with values in the separable closure, using a nonzero separability certificate that avoids zero. A finiteness step turns it into a finite extension.
    lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ExistsSeparablePointOfGeometricallyDomain.lean:61]
    mathlib: [IsSepClosed.exists_root, IsPurelyInseparable]
    needs: [f-is-integrally-closed-adjoin, f-exists-primitive-element-separability-certificate, f-extend-alg-hom-adjoin-integral-root, f-adjoin-hom-extend-of-denominator, f-linear-indep-on-pow-of-is-domain-tensor-purely-inseparabl, f-exists-finite-separable-point-of-separable-closure-poin, concept-field-extensions-transcendence, concept-separable-polynomials, concept-tensor-product-of-algebras, concept-finitely-generated-algebras]
    orphan: true
