nodes:
  - id: f-localization-closure-equal
    title: Two localised subrings coincide when each is generated from the other
    kind: step
    status: explained
    chunk: c0110
    orphan: true
    plain: >
      Take two subrings A and B of one field K, and finitely many nonzero elements t_q. Assume each t_q
      lies in A and its inverse lies in B. Also assume A is generated by B together with the t_q, and B
      is generated by A together with the inverses. Write T for the product of the t_q. Localising
      means adding 1 over something to a ring. The claim is that A with 1/T added equals B with T added.
      The proof shows each side is inside the other, checking generators one at a time.
      Each 1 over t_q is T inverse times a product of the others. The localisation operation
      is defined in a file outside this one.
    lean:
      - Development/AutomorphicSpectrum/Proofs/GeometryProofs/LocalizationClosureEqual.lean:24
    mathlib:
      - Subring.closure_le
      - Finset.prod_inv_distrib
      - Finset.mul_prod_erase
    needs:
      - concept-prime-ideals-localization
      - concept-integral-closure-fraction-fields
      - rings-fields
