nodes:
  - id: f-holomorphic-continuation--is-sing-test
    title: Singular test functions on 2n by 2n matrix groups
    kind: step
    status: explained
    chunk: c0117
    orphan: true
    plain: >
      This file mostly sets up definitions and states two claims without
      proving them. It defines a group of block matrices preserving a fixed form,
      its unitary subgroup (matrices whose inverse is the conjugate transpose),
      and a "singular test function", a continuous function that vanishes
      outside a bounded region and integrates to zero against certain complex
      exponentials built from degenerate Hermitian matrices. Two statements
      are written as named claims, one asserting such a test function with a
      non-zero integral exists, the other a two-sided version of an integral
      identity. The file does not prove either.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/IsSingTest.lean:33"]
    mathlib: []
    needs: [concept-hermitian-unitary-matrices, linear-algebra, fourier-analysis, concept-group-representations]
  - id: f-holomorphic-continuation--null-sec
    title: Gaussian integrals of polynomials, and four unproved claims
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file is mostly definitions plus claims it does not prove. It sets up
      polynomials in complex variables and their conjugates, a Gaussian weight
      (a bell-shaped exp(-c * size squared)), and the "moment" of a polynomial,
      its integral against that weight. A polynomial is called null if it
      integrates to zero after multiplying by any polynomial built from certain
      quadratic expressions. It then states four claims as named propositions
      (an invariant-theory statement, a cyclicity statement, a linear-functional
      statement and a null-iff-integral statement), none proved here.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/NullSec.lean:28"]
    mathlib: [MvPolynomial, MeasureTheory.integral]
    needs: [polynomials, concept-hermitian-unitary-matrices, calculus, complex-numbers]
  - id: f-polynomial-derivatives--fock-mono
    title: Creation operators and the Fock map on polynomials
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file contains only definitions, no theorems. On polynomials in many
      variables it defines a "creation" operator for each variable (minus the
      derivative, plus a constant times multiplication by the partner variable),
      a map built by applying these to the constant polynomial 1, and a
      "contraction" that reads off a weighted sum of coefficients. It also
      defines several first and second order operators built from derivatives
      and multiplication by variables, and the algebra generated by some of them.
      Later files prove facts about these objects.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/FockMono.lean:18"]
    mathlib: [MvPolynomial.pderiv, Algebra.adjoin]
    needs: [f-holomorphic-continuation--null-sec, polynomials, concept-derivations-smoothness, linear-algebra]
  - id: f-polynomial-derivatives--core-st
    title: Operator families on polynomials, and seven unproved claims
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file is mostly definitions, plus seven claims it states but does not
      prove. The definitions split the variables into two families, define the
      subspaces of polynomials using only one family, a weighted inner-product
      style form on polynomials, and two operators D1 and D2 that swap or lower
      variables depending on a sign pattern. It also defines symbols (polynomials
      standing for differential operators). The claims, such as a double
      commutant statement, a density statement and a statement about the form's
      properties, are only written as named propositions.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/CoreSt.lean:30"]
    mathlib: [MvPolynomial.supported, Algebra.adjoin, MvPolynomial.mkDerivation]
    needs: [f-holomorphic-continuation--null-sec, f-polynomial-derivatives--fock-mono, polynomials, linear-algebra, concept-derivations-smoothness]
  - id: f-polynomial-derivatives--equiv-lift
    title: Equivariant lifting claim (stated only)
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file only states a claim, with no proof. It says roughly this. Take a
      finite-dimensional block of polynomials, and a linear map on all
      polynomials that keeps the block inside itself and commutes with a family
      of K-operators there. Then that map agrees on the block with some operator
      from the algebra generated by the first-family operators. It is a
      "lifting" statement, turning a symmetry-respecting map into one coming from
      a specific algebra. Other files take it as a hypothesis.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/EquivLift.lean:9"]
    mathlib: []
    needs: [f-polynomial-derivatives--core-st, f-polynomial-derivatives--fock-mono, polynomials, linear-algebra]
  - id: f-fform-smul-right
    title: The weighted form and contraction are linear
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file proves routine linearity facts. A "contraction" turns a
      polynomial into a single complex number by a weighted sum over its
      coefficients, and a "form" pairs two polynomials by multiplying the
      conjugate of one coefficient with the other and summing with weights. The
      file shows the contraction respects addition and scalar multiples, so it
      is a linear map, and the form respects addition and scalars in its second
      slot. The proofs rewrite each sum over a common finite list of
      monomials, then compare term by term.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/FformSmulRight.lean:65"]
    mathlib: [MvPolynomial.coeff_add, MvPolynomial.coeff_smul, Finset.sum_subset]
    needs: [f-polynomial-derivatives--core-st, f-polynomial-derivatives--fock-mono, polynomials, linear-algebra]
  - id: f-monomial-mem-supported
    title: Spans of monomials, finiteness and splitting
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file proves bookkeeping facts about polynomials in two families of
      variables. A "box" is the span of monomials that use only the first family
      and have prescribed degree pattern. The file shows a box lies inside the
      polynomials using only that family, and that all such polynomials lie in
      the biggest box. It shows boxes grow when the allowed degrees grow, that a
      box with finitely many allowed degrees is finite-dimensional (a monomial
      has bounded exponents), and that any monomial splits into a first-family
      part times a second-family part.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/MonomialMemSupported.lean:21"]
    mathlib: [MvPolynomial.supported, Submodule.span_le, FiniteDimensional.span_of_finite, Finsupp.filter]
    needs: [f-polynomial-derivatives--core-st, polynomials, linear-algebra, counting]
  - id: f-adjoin-first-operators-preserves-family
    title: First-family operators keep polynomials in the first family
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file proves that certain operators on polynomials never leave a
      chosen family. A derivative of a polynomial using only some variables
      still uses only those variables. The file checks that each basic operator
      D1 maps first-family polynomials to first-family polynomials, case by
      case on sign patterns. It also shows another family of operators acts by
      simple multiplication on the second family. Finally, for any operator
      built by adding, scaling and composing the basic ones, it shows the family
      is preserved and a given commuting map still commutes. This uses
      induction over how the algebra is built.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/AdjoinFirstOperatorsPreservesFamily.lean:88"]
    mathlib: [Algebra.adjoin_induction, MvPolynomial.pderiv, MvPolynomial.supported_eq_adjoin_X]
    needs: [f-polynomial-derivatives--core-st, f-polynomial-derivatives--fock-mono, concept-derivations-smoothness, polynomials]
  - id: f-polynomial-derivatives--null-stable-alt
    title: Fock-map and null-stability claims (stated only)
    kind: step
    status: explained
    chunk: c0117
    plain: >
      This file only states claims as named propositions and proves none of
      them. They say that the Fock map is linear, one-to-one and onto and turns
      multiplication by a variable into a creation operator, that it intertwines
      two operator families, that its Gaussian moment equals a constant times
      the contraction, that null polynomials stay null under several operations,
      that it carries one operator to a combination of four others, and a
      "core" claim relating a linear functional to the contraction. Other files
      use them as assumptions.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/NullStableAlt.lean:31"]
    mathlib: []
    needs: [f-polynomial-derivatives--fock-mono, f-polynomial-derivatives--core-st, f-holomorphic-continuation--null-sec, polynomials, linear-algebra]
  - id: f-k-alg-of-adjoin-restrict
    title: Core functional claim from four assumed claims
    kind: step
    status: explained
    chunk: c0117
    orphan: true
    plain: >
      This file proves a conditional result. It does not prove the four claims it
      assumes (double-commutant, equivariant lifting, a representation claim and
      facts about the form). Given those, it proves the "core" claim. Any linear
      functional killed by the second-order operators equals the contraction of
      some operator from a fixed algebra applied to the polynomial. The proof
      restricts to a finite-dimensional block, uses the double-commutant claim
      to show a certain map lies in the algebra, lifts it back to all
      polynomials, and checks the identity monomial by monomial. A helper lemma
      lifts algebra elements from the block.
    lean: ["Development/WeilBound/RepresentationTheoryGL/SiegelWeilProof/HolomorphicContinuation/PolynomialDerivatives/KAlgOfAdjoinRestrict.lean:34"]
    mathlib: [Algebra.adjoin_induction, Submodule.linearProjOfIsCompl, Submodule.exists_isCompl]
    needs: [f-polynomial-derivatives--null-stable-alt, f-polynomial-derivatives--core-st, f-polynomial-derivatives--equiv-lift, f-fform-smul-right, f-monomial-mem-supported, f-adjoin-first-operators-preserves-family, f-polynomial-derivatives--fock-mono, linear-algebra]
