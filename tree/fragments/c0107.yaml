nodes:
  - id: f-capelli-identities--det-mul-expand
    title: Expanding the determinant of a product of two matrices
    kind: step
    status: explained
    chunk: c0107
    plain: >
      Take a k-by-r matrix A and an r-by-k matrix B, so that AB is a square k-by-k matrix. The
      determinant of AB equals a sum over all ways f of choosing one column of A for each row. Each term
      is the product of the chosen entries of A, times the determinant of the rows of B picked out by
      f. This is a version of the Cauchy-Binet formula. The proof writes each row of AB as a sum of
      rows of B, then uses the fact that the determinant is linear in each row separately.
    lean:
      - Development/AutomorphicArithmetic/IntegralCasts/CapelliIdentities/DetMulExpand.lean:3
    mathlib:
      - MultilinearMap.map_sum
      - MultilinearMap.map_smul_univ
      - Matrix.detRowAlternating
    needs:
      - linear-algebra
      - rings-fields

  - id: f-algebraic-independent-of-adjoin
    title: A list generating an independent list of the same size is independent
    kind: step
    status: explained
    chunk: c0107
    orphan: true
    plain: >
      Numbers are algebraically independent if no nonzero polynomial equation links them. Take two
      finite lists u and v of the same length in a field, where u is independent and every u lies in
      the field generated by v. Then v is independent too. The idea is a counting argument. The
      field generated by v has a transcendence basis (a largest independent subset) chosen from v. The
      independent list u forces that basis to have at least as many elements as the list. So it is all of v.
    lean:
      - Development/AutomorphicSpectrum/Proofs/GeometryProofs/AlgebraicIndependentOfAdjoin.lean:7
    mathlib:
      - exists_isTranscendenceBasis_subset
      - AlgebraicIndependent.cardinalMk_le_trdeg
      - IntermediateField.adjoin
    needs:
      - concept-field-extensions-transcendence
      - rings-fields
      - counting

  - id: f-geometry-proofs--exists-unit-of-sum-eq-one
    title: In a local ring, some term of a sum equal to 1 is an invertible element
    kind: step
    status: explained
    chunk: c0107
    plain: >
      The main claim is about a local ring O, a ring with one largest ideal of non-invertible
      elements, sitting inside a field. If finitely many elements of O add up to 1, then one of them
      is nonzero with its inverse also in O. The proof is by contradiction. If none were, all terms
      would lie in the largest ideal, so their sum 1 would too, which is impossible. The file also
      collects minors (determinants of square pieces) of matrices and shows how they behave under
      products and triangular factors. These are used to normalise matrix bases over a local ring.
    lean:
      - Development/AutomorphicSpectrum/Proofs/GeometryProofs/ExistsUnitOfSumEqOne.lean:50
      - Development/AutomorphicSpectrum/Proofs/GeometryProofs/ExistsUnitOfSumEqOne.lean:142
    mathlib:
      - IsLocalRing.maximalIdeal
      - Ideal.eq_top_iff_one
      - Matrix.det_of_lowerTriangular
    needs:
      - f-capelli-identities--det-mul-expand
      - concept-local-rings
      - linear-algebra
      - rings-fields
