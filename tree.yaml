- id: lean-algclosure-q
  title: "Instance: AlgebraicClosure ℚ is an algebraic closure"
  kind: step
  status: explained
  orphan: true
  used_in: 4 files
  plain: >
    Registers a Mathlib fact under a project name, so Lean finds it automatically:
    the field Mathlib calls `AlgebraicClosure ℚ` really is an algebraic closure of
    the rationals (every polynomial with rational coefficients has a root in it).
    No new maths.
  lean: [Formalism/LocalToGlobal/GaloisLevelStructure/DefsGal.lean:5]
  mathlib: [AlgebraicClosure.instIsAlgClosure]
  needs: [algebraic-closure]

- id: lean-common-denominator
  title: Common denominator in a number field
  kind: step
  status: explained
  orphan: true
  used_in: 2 files
  plain: >
    In a number field K, any finite list of elements can be turned into algebraic
    integers by multiplying them all by one nonzero whole number d. It is the
    common-denominator trick: 1/2 and 1/3 both become whole numbers after
    multiplying by 6. A three-line proof from a Mathlib lemma.
  lean: [Development/AutomorphicArithmetic/IntegralCasts/CapelliIdentities/CommonMajorizingLattice.lean:3]
  mathlib: [exists_integral_multiples]
  needs: [number-fields]

- id: lean-char-extend
  title: Characters of a subgroup extend to the group
  kind: step
  status: explained
  orphan: true
  used_in: 7 files
  plain: >
    The statement (only stated in this file): for a commutative group G and a subgroup H,
    every character of H (a homomorphism into the nonzero complex numbers) is the
    restriction of a character of all of G. It is proved separately, in
    UnitsComplexExistsZpow.lean:31. A standard fact; for finite groups it is a
    textbook exercise.
  lean: [Formalism/PeriodIntegrals/CharExtend.lean:5, Formalism/PeriodIntegrals/UnitaryGroupMassFormula/CharacterExtension/UnitsComplexExistsZpow.lean:31]
  needs: [groups, complex-numbers]
  learn:
    - {title: "Serre, A Course in Arithmetic", where: "ch. VI §1 (characters of finite abelian groups)"}

- id: lean-sesquilinear-additive
  title: u·M·conj(v) is additive in v
  kind: step
  status: explained
  orphan: true
  used_in: 1 file (only itself; looks unused)
  plain: >
    For a complex square matrix M and vectors u, v, v', the quantity
    u · M · conj(v) satisfies f(v + v') = f(v) + f(v'). It is a one-line simp
    proof. The file name "ImportsFurtherRest" doesn't match its content.
  lean: [Development/AbelianVarietyTheory/Proofs/DivisorProofs/ImportsFurtherRest.lean:5]
  needs: [linear-algebra, complex-numbers]

- id: number-fields
  title: Number fields, algebraic integers
  kind: concept
  status: textbook
  plain: >
    Number systems like ℚ(√2): the rationals with finitely many roots of polynomials
    added. Algebraic integers are the "whole numbers" inside them (roots of monic
    polynomials with integer coefficients, like √2).
  needs: [rings-fields, polynomials]
  learn:
    - {title: "Marcus, Number Fields", where: "ch. 1–2"}
    - {title: "Stewart & Tall, Algebraic Number Theory and Fermat's Last Theorem", where: "ch. 1–2"}

- id: p-adic-numbers
  title: p-adic numbers
  kind: concept
  status: textbook
  plain: >
    A different way to measure the size of numbers, using a prime p: a number is
    small if it is divisible by a high power of p (so |5| = 1/5, |25| = 1/25, |3| = 1
    for p = 5). Filling in the gaps of ℚ for this size, the way ℝ fills in ℚ for the
    usual size, gives ℚ_p. Not school maths: the "filling in" step is real analysis.
  needs: [primes-divisibility, infinite-series, real-analysis]
  learn:
    - {title: "Gouvêa, p-adic Numbers: An Introduction", where: "ch. 1–3"}

- id: algebraic-closure
  title: Algebraic closure
  kind: concept
  status: textbook
  plain: >
    The smallest bigger field in which every polynomial has a root, as ℂ is for ℝ.
  needs: [rings-fields, polynomials]
  learn:
    - {title: "Dummit & Foote, Abstract Algebra", where: "ch. 13"}

- id: rings-fields
  title: Rings, fields and algebras
  kind: concept
  status: textbook
  plain: Number systems where you can add and multiply (rings), and also divide (fields).
  needs: [groups]
  learn:
    - {title: "OSSU: Introduction to Rings and Fields (NPTEL)", url: "https://nptel.ac.in/courses/111106131"}

