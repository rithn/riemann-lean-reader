- id: lean-placeholder-conditions
  title: Placeholder conditions Sw and TrivialCondition
  kind: step
  status: explained
  orphan: true
  used_in: 3 files (Sw), 8 files (TrivialCondition)
  plain: >
    Two named propositions. `Sw` is defined as False and `TrivialCondition` as True.
    A theorem that assumes `Sw` can never be applied, since nobody can prove False.
    The two theorems that do (`galHodge_of_cgTrue_g`, `sep_conj_g`) appear only in
    `example` self-checks, so they look like dead code, not part of the proof.
    `TrivialCondition` is a no-op hypothesis.
  lean: [Development/AutomorphicArithmetic/Foundations/UnitarySphericalFixing/SatakeParameters/SwOn.lean:3]
  needs: [proofs]

- id: lean-polynomial-function
  title: Polynomial function ℂ → A (IsPF)
  kind: step
  status: explained
  orphan: true
  used_in: 2 files
  plain: >
    A function f from the complex numbers into an algebra A "is polynomial" if some
    polynomial p with coefficients in A gives f(Y) = p(Y) for every Y.
  lean: [Development/AutomorphicArithmetic/IntegralCasts/CapelliIdentities/IsPF.lean:3]
  needs: [polynomials, complex-numbers]

- id: lean-unipotent-upper-triangular
  title: Unipotent upper-triangular matrix (UT)
  kind: step
  status: explained
  orphan: true
  used_in: 2 files
  plain: >
    An n×n matrix with zeros below the diagonal and 1s on the diagonal.
  lean: [Development/AutomorphicArithmetic/IntegralCasts/CapelliIdentities/UpperTriangular.lean:3]
  needs: [linear-algebra]

- id: lean-lower-iff
  title: Downward-closed sets are initial segments
  kind: step
  status: explained
  orphan: true
  used_in: 2 files
  plain: >
    On the numbers 0, ..., n-1: if a property P is downward closed (P(b) and a ≤ b
    imply P(a)), then P(b) holds exactly when b is less than the number of elements
    with P. In other words, P holds on 0, 1, ..., k-1 and nowhere else. A one-line
    proof that reuses a Mathlib lemma.
  lean: [Development/AutomorphicArithmetic/IntegralCasts/CapelliIdentities/LowerIff.lean:3]
  mathlib: [Fin.lt_card_filter_univ_iff_apply_of_imp]
  needs: [counting, proofs]

- id: lean-padic-norm-p
  title: "|p| = 1/p in the algebraic closure of ℚ_p"
  kind: step
  status: explained
  orphan: true
  used_in: 25 files
  plain: >
    In the p-adic world, size is measured by divisibility by p, so p itself is
    "small": |p| = 1/p. This lemma says that stays true after extending the p-adic
    numbers ℚ_p to their algebraic closure.
  lean: [Development/AutomorphicArithmetic/IntegralCasts/CapelliIdentities/NormNatCastPrime.lean:3]
  mathlib: [PadicAlgCl.norm_extends, Padic.norm_p]
  needs: [p-adic-numbers, algebraic-closure]

