# Prerequisite tree for the claimed Lean proof of the Riemann hypothesis.
# A map, not a check: the Lean code has not been compiled or verified.
#
# Each node:
#   id:      short unique name, used in `needs`
#   title:   short label (shown in the diagram)
#   kind:    theorem | step | concept | leaf
#              theorem = a headline result of the project
#              step    = a step of the proof, found in the Lean code
#              concept = background maths you must understand
#              leaf    = school or first-university material (the bottom of the tree)
#   status:  explained | textbook | research | new | unmapped
#              explained = plain-English argument written here
#              textbook  = standard material, see `learn`
#              research  = in research papers, not textbooks
#              new       = appears to exist only in this proof
#              unmapped  = not worked out yet (help wanted)
#   guess:   true if `plain` is a guess from names, not from reading the file
#   plain:   what it says, in plain English
#   lean:    where it is in the project (path relative to lean/src, :line)
#   mathlib: Mathlib facts used directly (proved by Mathlib, not by this project)
#   needs:   ids of the nodes you must understand first
#   learn:   where to learn it (title, where = chapters, url if free online)
#   orphan:  true if found bottom-up and not yet linked to the proof above
#   used_in: for orphans, how many project files mention it (text search)
#   chunk:   for nodes from chunk mapping, the chunk id (see tree/chunks.jsonl)
#
# This file is the core only. Also part of the tree: tree/concepts.yaml (background
# concepts found while mapping chunks) and tree/nodes/part-*.yaml (file nodes from
# chunk mapping, 500 per file). scripts/treelib.py loads them all together.

roots: [riemann-hypothesis, grh-dirichlet]

nodes:

# ===================== headline theorems =====================

- id: riemann-hypothesis
  title: The Riemann hypothesis
  kind: theorem
  status: explained
  plain: >
    Every zero of the zeta function, other than the "trivial" zeros -2, -4, -6, ...,
    has real part exactly 1/2. The statement used is Mathlib's own `RiemannHypothesis`,
    not one written by the project.
  lean: [Main.lean:4, Supplements/Kernels/MainTheorems.lean:9]
  needs: [rh-statement, step-rh-of-every]

- id: grh-dirichlet
  title: GRH for Dirichlet L-functions
  kind: theorem
  status: explained
  plain: >
    The same for Dirichlet L-functions: every zero in the strip 0 < Re s < 1 has
    real part 1/2. Stated in Statements.lean, which imports only Mathlib.
  lean: [Main.lean:12, Statements.lean:14, Supplements/Kernels/MainTheorems.lean:11]
  needs: [step-crit-line]

# ===================== layer 1: the readable end of the proof =====================

- id: step-rh-of-every
  title: L2 for all characters ⇒ RH
  kind: step
  status: explained
  plain: >
    Apply L2 to the trivial character mod 1, whose L-function is ζ itself. That gives
    "ζ has no zeros right of 1/2", and step-rh-of-right finishes.
  lean: [Formalism/GammaFactorNonvanishing/CritLine.lean:29]
  mathlib: [DirichletCharacter.LFunction_modOne_eq]
  needs: [step-rh-of-right, every-character, dirichlet-l-function]

- id: step-rh-of-right
  title: No zeros right of ½ ⇒ RH
  kind: step
  status: explained
  plain: >
    A symmetry argument. If s is a zero with Re s < 1/2, the functional equation
    ζ(s) = 2 (2π)^(s-1) Γ(1-s) cos(π(1-s)/2) ζ(1-s) forces ζ(1-s) = 0, because the
    other factors are nonzero (the cosine vanishes only at trivial zeros). But
    Re(1-s) > 1/2, a contradiction. So every non-trivial zero has Re s = 1/2.
    About 60 lines, mostly edge cases (s = 0, signs of k).
  lean: [Formalism/GammaFactorNonvanishing/RhOfRight.lean:5]
  mathlib: [riemannZeta_one_sub, riemannZeta_zero, Complex.Gamma_ne_zero_of_re_pos, Complex.cos_eq_zero_iff]
  needs: [functional-equation-zeta, factors-nonzero, trivial-zeros, rh-statement]

- id: step-crit-line
  title: L2 ⇒ GRH (mirror trick for L-functions)
  kind: step
  status: explained
  plain: >
    The same mirror argument for a primitive character χ. A zero s of L(χ, s) with
    Re s < 1/2 gives a zero 1-s of L(χ̄, s) with Re > 1/2, which L2 rules out. The mirror
    swaps χ with its conjugate, so L2 must hold for all characters at once.
  lean: [Formalism/GammaFactorNonvanishing/CritLine.lean:11, Formalism/GammaFactorNonvanishing/CritLine.lean:6]
  mathlib: [DirichletCharacter.LFunction_eq_completed_div_gammaFactor, DirichletCharacter.IsPrimitive.completedLFunction_one_sub, DirichletCharacter.conductor_inv]
  needs: [every-character, functional-equation-dirichlet, primitive-characters, gamma-function]

# ===================== layer 2: the hard part =====================

- id: every-character
  title: "L2: no zeros right of ½, every Dirichlet L-function"
  kind: step
  status: unmapped
  plain: >
    For every N, every Dirichlet character χ mod N, and every s with Re s > 1/2:
    L(χ, s) ≠ 0 (except the pole of ζ at s = 1). This is the real content of the
    proof; nearly all 175,000 files exist to prove it.
  lean: [Development/AutomorphicArithmetic/CharacterBoxes/EveryCharacter.lean:13, Development/AutomorphicArithmetic/CharacterBoxes/MainConclusion.lean:10]
  needs: [dirichlet-l-function, l2-literature-of-vwin, l2-local-langlands, l2-galois-local-global, l2-vwin-of-row]

- id: l2-literature-of-vwin
