# ===================== background concepts =====================

- id: rh-statement
  title: What RH says
  kind: concept
  status: textbook
  plain: >
    ζ(s) starts as 1 + 1/2^s + 1/3^s + ..., which converges for Re s > 1, and is
    extended to all s ≠ 1. RH is a statement about where that extended function is zero.
  needs: [zeta-series, analytic-continuation, trivial-zeros]
  learn:
    - {title: "Derbyshire, Prime Obsession", where: "whole book (popular, no prerequisites)"}
    - {title: "Edwards, Riemann's Zeta Function", where: "ch. 1"}

- id: zeta-series
  title: ζ(s) as a series
  kind: concept
  status: textbook
  plain: ζ(s) = Σ 1/n^s for complex s with Re s > 1, where the series converges.
  needs: [complex-powers, infinite-series]
  learn:
    - {title: "Apostol, Introduction to Analytic Number Theory", where: "ch. 11–12"}

- id: analytic-continuation
  title: Analytic continuation
  kind: concept
  status: textbook
  plain: >
    A complex-differentiable function on a region has at most one extension to a
    bigger region. This is how ζ gets a meaning where its series diverges.
  needs: [complex-analysis]
  learn:
    - {title: "Stein & Shakarchi, Complex Analysis", where: "ch. 2.4, 6"}

- id: trivial-zeros
  title: Trivial zeros −2, −4, …
  kind: concept
  status: textbook
  plain: >
    ζ is zero at every negative even integer. In the functional equation this comes
    from the cosine factor; these zeros are "trivial" and excluded from RH.
  needs: [functional-equation-zeta]
  learn:
    - {title: "Edwards, Riemann's Zeta Function", where: "ch. 1"}

- id: functional-equation-zeta
  title: Functional equation of ζ
  kind: concept
  status: textbook
  plain: >
    ζ(1-s) = 2 (2π)^(-s) Γ(s) cos(πs/2) ζ(s): values at s and 1-s are tied together,
    so zeros come in mirror pairs about Re s = 1/2. Proved in Mathlib, not in this
    project. Using it needs only algebra; proving it needs the theta function and
    Poisson summation.
  mathlib: [riemannZeta_one_sub]
  needs: [gamma-function, fourier-analysis, analytic-continuation]
  learn:
    - {title: "Stein & Shakarchi, Complex Analysis", where: "ch. 6"}
    - {title: "Stein & Shakarchi, Fourier Analysis", where: "ch. 4–5 (Poisson summation, theta)"}

- id: factors-nonzero
  title: Γ and cos factors are nonzero
  kind: concept
  status: textbook
  plain: >
    Γ(z) is never zero. cos(z) = 0 exactly at z = π/2 + kπ, also for complex z.
  mathlib: [Complex.Gamma_ne_zero_of_re_pos, Complex.cos_eq_zero_iff]
  needs: [gamma-function, complex-powers, trigonometry]
  learn:
    - {title: "Stein & Shakarchi, Complex Analysis", where: "ch. 6.1"}

- id: gamma-function
  title: The Gamma function
  kind: concept
  status: textbook
  plain: >
    Γ(s) = ∫₀^∞ t^(s-1) e^(-t) dt extends the factorial (Γ(n+1) = n!) to complex s.
  needs: [complex-analysis, calculus]
  learn:
    - {title: "Stein & Shakarchi, Complex Analysis", where: "ch. 6.1"}

- id: fourier-analysis
  title: Fourier analysis, Poisson summation
  kind: concept
  status: textbook
  plain: >
    Writing functions as sums of waves. Poisson summation relates the sum of f(n)
    over integers to the sum of its Fourier transform; it is the engine behind the
    functional equation.
  needs: [real-analysis, complex-numbers]
  learn:
    - {title: "Stein & Shakarchi, Fourier Analysis", where: "ch. 1–5"}

- id: complex-analysis
  title: Complex analysis
  kind: concept
  status: textbook
  plain: Calculus for functions of a complex variable; contour integrals, poles, power series.
  needs: [real-analysis, complex-numbers, infinite-series]
  learn:
    - {title: "MIT 18.04 Complex Variables with Applications", url: "https://ocw.mit.edu/courses/18-04-complex-variables-with-applications-spring-2018/"}
    - {title: "Stein & Shakarchi, Complex Analysis", where: "ch. 1–3"}

- id: complex-powers
  title: Complex powers n^s
  kind: concept
  status: textbook
  plain: n^s = e^(s log n); for s = a + bi this is n^a times a rotation by b log n.
  needs: [complex-numbers, calculus]
  learn:
    - {title: "Stein & Shakarchi, Complex Analysis", where: "ch. 1, 3.6"}

- id: real-analysis
  title: Real analysis
  kind: concept
  status: textbook
  plain: Calculus done rigorously, with limits, continuity and convergence proved.
  needs: [calculus, infinite-series, proofs]
  learn:
    - {title: "OSSU: MIT 18.100A Real Analysis", url: "https://ocw.mit.edu/courses/18-100a-real-analysis-fall-2020/"}

- id: dirichlet-characters
  title: Dirichlet characters
  kind: concept
  status: textbook
  plain: >
    A function χ on whole numbers that repeats every N steps and is multiplicative,
    χ(ab) = χ(a)χ(b). Formally a homomorphism (ℤ/Nℤ)ˣ → ℂˣ.
  needs: [groups, modular-arithmetic, complex-numbers]
  learn:
    - {title: "Apostol, Introduction to Analytic Number Theory", where: "ch. 6"}

- id: dirichlet-l-function
  title: Dirichlet L-functions
  kind: concept
  status: textbook
  plain: >
    L(χ, s) = Σ χ(n)/n^s, ζ twisted by a character. ζ is the case N = 1.
  mathlib: [DirichletCharacter.LFunction]
  needs: [dirichlet-characters, zeta-series, analytic-continuation]
  learn:
    - {title: "Apostol, Introduction to Analytic Number Theory", where: "ch. 6–7, 12"}

- id: primitive-characters
  title: Primitive characters, conductor
  kind: concept
  status: textbook
  plain: >
    χ is primitive if it does not secretly come from a smaller modulus. The conductor
    is that smallest modulus.
  mathlib: [DirichletCharacter.IsPrimitive, DirichletCharacter.conductor]
  needs: [dirichlet-characters]
  learn:
    - {title: "Davenport, Multiplicative Number Theory", where: "ch. 5"}

- id: functional-equation-dirichlet
  title: Functional equation of L(χ, s)
  kind: concept
  status: textbook
  plain: >
    For primitive χ, the completed function Λ(χ, s) (L times a Gamma factor that
    depends on whether χ is even or odd) satisfies Λ(χ, 1-s) = ε Λ(χ̄, s). Proved in Mathlib.
  mathlib: [DirichletCharacter.completedLFunction, DirichletCharacter.IsPrimitive.completedLFunction_one_sub]
  needs: [dirichlet-l-function, primitive-characters, gamma-function, fourier-analysis]
  learn:
    - {title: "Davenport, Multiplicative Number Theory", where: "ch. 9"}

- id: groups
  title: Groups and homomorphisms
  kind: concept
  status: textbook
  plain: First course in abstract algebra.
  needs: [proofs, modular-arithmetic]
  learn:
    - {title: "OSSU: Introduction to Abstract Group Theory (NPTEL)", url: "https://nptel.ac.in/courses/111106113"}
    - {title: "Pinter, A Book of Abstract Algebra", where: "ch. 1–14"}

