meta:
  written: '2026-11-23'
  task: 'tracker #35 (exact references for the spine)'
  spine: 41 clusters of research/seo/indexable-pages.md (main path dist 0-2 plus core 16)
  lean_commit: 40e56bab
  precision_labels:
    exact: theorem, lemma or section number read in the cited text and the stated result matches the Lean statement (see match). Downgraded to section when the match is only related or partial.
    section: right chapter or section, not a specific theorem (chapter title verified from a contents list)
    topic: 'general reference: paper or book cited without a verified locator'
  fields: 'per cluster: id, title, current_book_reference (from site/data/c/<id>.json "source"), current_book_verdict, references[citation, locator, url, doi, precision, match, evidence, note]'
  limits:
  - 'Source type (a) is empty: the Lean files contain no comments or docstrings, so no in-file citations exist.'
  - 'Source type (b): blueprint (chrisflav/riemann-blueprint @137d976) gives author and year only, with 3 locators in the whole blueprint, none for these clusters. Naskrecki gives no sources.'
  - 'Source type (c): MV (Montgomery-Vaughan vol. I) chapter PDFs are hosted by the authors and were read in full text; Zelevinsky 1980 read from numdam. Davenport, Neukirch, Serre, Washington, Scharlau,
    Goodman-Wallach, Birkenhake-Lange, Bushnell-Henniart, Bump, Bombieri-Gubler: chapter lists only (Springer page, Crossref chapter DOIs); theorem numbers in those books are NOT checked.'
  - Third-party locators (Jaswal preprint, Adriazola EXTERNAL_THEOREMS.md) are recorded in evidence or note and never promoted to a locator unless I checked them.
