      text: 'This file collects the definitions behind the discrete series of `G = New.USign ε`. A Harish-Chandra

        parameter `λ` is stored as the integer vector `l = 2λ`, and the root `e_i - e_j` is positive when

        `l j < l i`. The file proves elementary identities for `ρ`, `λ + ρ` and `Λ = λ + ρ - 2ρ_c`, and for

        the gap condition. It then sets up Borel matrices, weights and holomorphic functions of weight `u`

        for the holomorphic discrete series.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/FlenstedJensen/Defs.lean
      line: 11
      endLine: 47
      text: "\n## Main definitions and results\n\n* `New.HCParam.HasGap`, `New.HCParam.HasLargeGap`: `λ` is regular,\
        \ each `λ i` lies in\n  `(n - 1) / 2 + ℤ`, and entries of `λ` with opposite signs `ε` are far apart, at\
        \ least by the gap.\n* `New.paramAddRho`, `New.HCParam.lowestKType`, `New.HCParam.casimirValue`, `New.weylDimensionPoly`:\n\
        \  `λ + ρ`, `λ + ρ - 2ρ_c`, `|λ|² - |ρ|²` and the product of the positive roots at `λ` divided by\n  `∏_{i\
        \ < n} i!`.\n* `New.weightMinors`, `New.HCParam.flenstedJensen`, `New.HCParam.dsCoeff`: a product of principal\n\
        \  minors (`New.principalMinor`), Flensted-Jensen's integral of such products over `K`, and the\n  function\
        \ `c_λ` that it defines.\n* `New.HCParam.formalDegree`, `New.HCParam.dsKernel`: `deg_λ = (∫ |c_λ|²)⁻¹` for\
        \ the measure\n  `New.haarU`, and `e_λ = deg_λ * conj c_λ`.\n* `New.IsPosFirstOrder`, `New.IsKDominant`,\
        \ `New.HasHolGap`: the indices of sign `1` come first; a\n  weight does not increase within a block; a weight\
        \ jumps up by at least `γ` from the first block to\n  the second.\n* `New.IsHolOfWeight`: a function on\
        \ a product of copies of the group extends analytically to the\n  products `h * b`, `b` invertible triangular,\
        \ transforming under `b` by the character of weight\n  `u`; an optional second sign vector restricts `h`\
        \ and `b` to block diagonal matrices.\n\nNotions from other files:\n* `New.USign`: for a vector of signs\
        \ `ε`, the unitary group `U(J)` of the diagonal matrix\n  `J = New.signMatrix ε` with entries `ε i`.\n*\
        \ `New.principalMinor`: the determinant of the square submatrix on the indices with a given\n  property.\n\
        * `New.haarU`: a measure on `U(J)` obtained from Lebesgue measure by a Cayley chart; a Haar measure\n  for\
        \ a hermitian involution `J`.\n\n## Relation to the literature\n\nThe definitions are part of three known\
        \ results, each treated in another file:\n* Flensted-Jensen's function as the coefficient of the lowest\
        \ K-type of a discrete series, in\n  `Lib.DiscreteSeries.FlenstedJensen.PsiKTypes`;\n* the lowest K-type\
        \ and the Casimir value determine a discrete series coefficient, in\n  `Lib.DiscreteSeries.Rigidity.HighestVectorsAndFiltration`;\n\
