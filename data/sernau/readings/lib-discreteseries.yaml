      text: "\n## Main definitions and results\n\n* `New.IsLayering`: finitely many layers, each a list of rows\
        \ paired with columns, of weight `ν`.\n* `New.IsMatch.isLayering`: for matching parameters (`New.IsMatch`)\
        \ the sets of variables\n  `New.FockDualPair.Layer` are layers of weight `New.HCParam.lowestKType l`.\n\
        * `New.IsMatch.exists_isJointHarmonic`: hence a joint harmonic (`New.IsJointHarmonic`) exists.\n* `New.IsJointHarmonic.howe_argument`:\
        \ in the polynomial (Fock) model with its row action\n  `T.oscRows` and column action `T.swap.oscRows`,\
        \ a subspace that is stable under the columns,\n  contains a joint harmonic (`New.IsJointHarmonic`) and\
        \ contains certain images of the row operators\n  is the whole space.\n* `New.OscillatorPair.re_inner_integratedRep_pos`:\
        \ for a joint harmonic `Φ` and `Φ₁ = π(e_λ) Φ`,\n  with `e_λ` the discrete series kernel, `⟨Φ, Φ₁⟩` has\
        \ positive real part.\n* `New.OscillatorPair.integratedRep_integratedRep_eq_self`: `π'(f) Φ₁ = Φ₁` for every\
        \ `f` of\n  suitable decay that reproduces `e_λ'`; the proof compares the Casimir operators of the two groups\n\
        \  on `Φ` and uses `New.integratedRep_fix_of_isKHighest`.\n* `New.OscillatorPair.exists_bump_integratedRep_eq`:\
        \ every `π(e_λ) P` is obtained from `Φ₁` by a\n  bump function of the second group; the proof rests on `New.IsJointHarmonic.howe_argument`.\n\
        \nNotions from other files:\n* `New.HCParam.IsKHighest`: each matrix unit `E a a` acts on `x` by `ν a`,\
        \ and `x` is killed by the\n  compact raising operators, the `E a b` with `ε a = ε b` and `l b < l a`.\n\
        * `New.IsJointHarmonic`: `l` and `l'` match (`New.IsMatch`), and `Φ ≠ 0` is highest for rows and\n  columns,\
        \ of the weights of the two lowest `K`-types, and harmonic along rows and columns.\n* `New.OscillatorPair`:\
        \ two commuting oscillator representations on one Fock space, one acting on\n  the rows and one on the columns.\n\
        * `New.pairSign`: the sign `σ * ε r * ε' c` of the variable in row `r` and column `c`, with\n  `σ = T.globalSign`;\
        \ `T.varSign (r, c)` is this sign.\n* `New.FockDualPair.IsMatchedPair`: the row `r` is matched with the\
        \ column `c`: with `n = card R`,\n  `n' = card C`, `γ = T.rowShift`, `γ' = T.columnShift` and `a = l r -\
        \ 2γ + n'`, one\n  has `a = -(l' c - 2γ' + n)` and `|n - n'| < σ * ε r * ε' c * a`.\n* `New.HCParam.lowestKType`:\
        \ the integer vector Λ = λ+ρ−2ρ_c for a parameter l = 2λ, the highest\n  weight of the lowest K-type.\n\n\
        ## Relation to the literature\n\nKnown result: Theta correspondence of discrete series for real unitary\
        \ dual pairs, with joint\nharmonics. Only matched parameters with large gaps on Fock space are treated.\
        \ The joint harmonic\nexists and is unique up to scalar, and its projection is fixed by the partner's `π'(f)`\
        \ for every\n`f` of suitable decay that reproduces the partner's discrete series kernel. The projection\
        \ of every\npolynomial vector is a compactly supported smoothing, under the second group, of the projected\
        \ joint\nharmonic. Source: J.-S. Li, Theta lifting for unitary representations with nonzero cohomology,\
        \ Duke\nMath. J. 61 (1990) 913-937; R. Howe, Transcending classical invariant theory, J. Amer. Math. Soc.\
        \ 2\n(1989); A. Paul, First occurrence for the dual pairs (U(p,q), U(r,s)), Canad. J. Math. 51 (1999)\n\
        636-657, Theorem 2.7.\n"
