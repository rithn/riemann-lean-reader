      text: "\n\n## Main definitions and results\n\n* `New.HCParam.exists_highest_vector`: a nonzero finite-dimensional\
        \ \U0001D528-stable subspace contains a\n  highest weight vector.\n* `New.HCParam.IsKHighest.finite_filtration`:\
