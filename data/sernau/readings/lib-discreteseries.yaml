      text: 'The group `New.Shape.G₁` is the unitary group of the form `New.Shape.J₁`, of rank `r`, with basis

        `e_a`, `x_i`, `z`, `e*_a`: there are `ϱ` hyperbolic pairs `e_a, e*_a`, the span `X₀` of the `x_i` is

        positive definite of rank `k`, and `z` is negative. The frame is `e_0, …, e_{ϱ-1}, z`, and 𝖴⁰ is the

        unipotent group `New.Shape.Form.besselU0` that fixes it. The file compares Haar measure of G₁ with

        the fibre measure of the Gram map on tuples of vectors.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/Bessel/FrameFibre.lean
      line: 12
      endLine: 35
      text: "\nNotions from other files:\n* `New.LeGramFibre J E m` says that the image of `m` under `g ↦ g E` is\
        \ at most the fibre measure of\n  the Gram map `E' ↦ E'ᴴ J E'` over the Gram matrix of `E`.\n* `New.LeFibreMeasure\
        \ μ ν π b l` says that `l` is at most the fibre measure `dμ / dν` of `π` over\n  `b`.\n* `New.volU j` is\
        \ `vol U(j)`; the measure `volume` on G₁ is Haar measure, normalised through the\n  compact dual, and on\
        \ the unitary group H = U(X₀) it is the Haar measure of mass one.\n\nMain results:\n* `New.LeGramFibre.mconv_embedH_le`:\
        \ tuples with the Gram matrix of the basis vectors outside `X₀`.\n  These vectors have fixer `H = U(X₀)`;\
        \ if their image under `m` is below the fibre measure, then\n  `m ∗ dh` is at most `vol U(r) / (2 ^ (r -\
        \ k) vol U(k))` times Haar measure of G₁.\n* `New.RealPlace.lintegral_eq_unipotent_coords`: Lebesgue measure\
        \ on the `ϱ`-tuples dual to\n  `e_0, …, e_{ϱ-1}` and orthogonal to `z`, in coordinates given by \U0001D5B4\
        ⁰ and the Gram matrix.\n* `New.LeGramFibre.mconv_fixerHaar_le`: frames. The standard frame has fixer \U0001D5B4\
        ⁰ H, with the measure\n  `ds = New.RealPlace.fixerHaar`; if the image of the frame under `m` is below the\
        \ fibre measure,\n  then `m ∗ ds` is at most `vol U(r) / (2 ^ (ϱ + 1) vol U(k))` times Haar measure of G₁.\n\
        \n## Relation to the literature\n\nKnown result: the fibre measure of the Gram map on tuples of vectors,\
        \ in terms of Haar measure of\nthe unitary group. The file proves the inequality that is used. Siegel, Über\
        \ die analytische Theorie\nder quadratischen Formen, Ann. of Math. 36 (1935).\n"
