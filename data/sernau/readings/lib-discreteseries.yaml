        \ twice the gap apart; `New.HCParam.HasLargeGap A` asks for a gap of\n  at least `gapThreshold n A`, which\
        \ puts such entries at least `1000 (card n)³` apart.\n\n## Relation to the literature\n\nKnown result: Lowest\
