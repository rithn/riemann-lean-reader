        \ unitriangular on the first `l` frame vectors, for `l ≤ ϱ + 1`.\n\n`∗ₘ` is convolution of measures, so\
        \ `μ ∗ₘ dirac s` is the right translate of `μ` by `s`.\n\n* `New.Floors.TraceOne.heisenbergElem`, `New.Floors.FloorGroups.exists_eq_heisenbergElem_of_mem`:\n\
        \  `N_a` is a Heisenberg group, given by Eichler maps.\n* `New.Floors.FloorGroups.bijOn_mulVec_eStar`: `u\
        \ ↦ u e*_a` maps `N_a` bijectively onto the\n  isotropic vectors `y` of `V_a` with `h(e_a, y) = 1`.\n* `New.Floors.FloorGroups.existsUnique_prod_of_mem_besselU`:\
        \ an element of `N_(<ϱ)` is a product in\n  `N_0 ⋯ N_(ϱ-1)` with unique factors.\n* `New.Floors.Place.heisenbergMeasure`,\
