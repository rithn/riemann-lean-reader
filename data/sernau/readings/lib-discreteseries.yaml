      endLine: 42
      text: "\nA vector `y` is chosen with given products with earlier basis vectors and with a given norm\n`h(y,\
        \ y)`. Here `New.LeFibreMeasure μ ν π b l` says that the measure `l` is at most the fibre\nmeasure `dμ /\
        \ dν` of the map `π` over the point `b`.\n\n## Main definitions and results\n\n* `New.Floors.leFibreMeasure_frameVector`:\
        \ for the frame vector of a floor, half the quadric measure\n  of the floor is at most the fibre measure.\n\
        * `New.Floors.leFibreMeasure_dualVector`: for the dual vector, half the measure of the Heisenberg\n  group\
        \ of the floor is at most the fibre measure.\n\nThe factor one half arises because these measures are quotients\
        \ by `d(h(y, y) / 2)`. The last\nsection proves that the measures of the Heisenberg groups are invariant\
        \ under inversion, as is the\nHaar measure of the unitary group of the span of the `x_i`, carried into `G₁`.\n\
        \nNotions from other files:\n* `New.Floors.HyperbolicBasis.floorQuadricMeasure`: The measure on a quadric\
        \ in V_b: the image of\n  `New.Floors.Place.quadricMeasure` with parameter β under the basis `F.floorBasis\
        \ b`.\n* `New.Floors.Place.heisenbergMeasure`: The measure on the Heisenberg group of floor `a`: the image\n\
        \  of `dv` times the skew measure under the map that sends `(v, β)` to the isometry with\n  `e*_a ↦ e*_a\
        \ + v + (β - h(v, v) / 2) e_a`. For `a ≥ ϱ` it is the unit mass at `1`.\n* `New.Shape.besselFrame`: The\
        \ frame `(e_0, …, e_(ϱ-1), z)`, with one vector on each floor up to\n  `ϱ`.\n* `New.Floors.complexPlace`:\
        \ The place `ℂ`: `τ = 1/2`, `δ = i/2`, `ν` the image of Lebesgue measure\n  under `r ↦ r i`, modulus `‖x‖\
        \ ^ 2`, character `x ↦ exp (x - x̄)` and constant `c = π ^ 2`.\n\n## Relation to the literature\n\nKnown;\
        \ see `Lib.DiscreteSeries.Bruhat.ComplexPlace` for sources.\n"
