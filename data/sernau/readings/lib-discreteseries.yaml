    excerpt:
      path: grh/src/Lib/DiscreteSeries/Bessel/SchurBound.lean
      line: 6
      endLine: 9
      text: 'This file collects tools for estimating integrals of Bessel functions. It writes σ(u) + conj σ(u⁻¹),

        for the sum σ(u) of simple root entries, as a trace against a fixed matrix. It proves abstract `L²`

        bounds for convolutions on a unimodular group, and shows that norms of Bessel functions are

        invariant under the Bessel subgroup `S = New.Shape.Form.besselS`.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/Bessel/SchurBound.lean
      line: 10
      endLine: 35
      text: "\n## Main definitions and results\n\n* `New.Filling.besselCharMatrix`, `New.Filling.trace_besselCharMatrix_mul`:\
        \ a fixed matrix C with\n  tr(C u) = σ(u) + conj σ(u⁻¹) for every isometry u of the form `New.Shape.Form.splitGram`.\n\
        * `New.IsBoundedMeasurable.integral_inner_translate`: if `F * ψ = F` for an idempotent kernel `ψ`\n  with\
        \ `ψ 1 = d`, the inner products of the right translates of `F` are values of `ψ / d` times\n  `‖F‖²`.\n\
        * `New.IsIdempotentKernel.enorm_integral_convolve_sq_le`: Schur's bound for a family of vectors of a\n \
        \ Hilbert space with these inner products.\n* `New.IsBoundedMeasurable.lintegral_sq_convolve_convolve_le`:\
        \ the bound for `F * x` convolved once\n  more with an integrable function.\n* `New.IsBesselFunction.enorm_besselS_mul`:\
        \ the norm of `W (s y)` equals that of `W y` for `s` in\n  `S`.\n\nNotions from other files:\n* `New.convolve\
        \ F x`: The function `y ↦ ∫ x a⁻¹ • F (y * a)`.\n* `New.IsIdempotentKernel ψ`: `ψ` is continuous and integrable,\
        \ `ψ g⁻¹ = conj (ψ g)`, `ψ 1 ≠ 0`,\n  and `ψ * δ_t * ψ = (ψ t⁻¹ / ψ 1) ψ`.\n* `New.orbitMeasure ρ volume`:\
        \ A measure on `G` against which a left `S`-invariant function has the\n  same integral as on `S \\ G`.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.DiscreteSeries.Bessel.UnipotentHaarMeasure` and `Lib.DiscreteSeries.CuspKernel`\
        \ for\nsources.\n"
