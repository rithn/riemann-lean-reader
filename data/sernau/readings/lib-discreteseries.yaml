      endLine: 11
      text: 'We study the unitary group of the form `T.splitGram` over a commutative ring with involution. This

        form has `𝔰.ϱ` hyperbolic planes and a middle block `T`. We define the floor groups `H_l`, `𝒩_l`,

        `Q_l` and Weyl elements exchanging `e_a` and `e*_a`. These serve a descent through the hyperbolic

        pairs, one pair at a time. We then study the Bessel subgroup `S` (`New.Shape.Form.besselS`),

        generated by the block unitriangular isometries `𝖴` (`New.Shape.Form.besselU`) and the isometries

        `H` (`New.Shape.Form.besselH`) that fix all basis vectors outside `κ`.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/Bruhat/FloorGroups.lean
      line: 12
      endLine: 46
      text: "\n## Main definitions and results\n\n* `New.Shape.Form.floorGroup`: the fixer `H_l` of the floors below\
        \ `l`. It decreases from `⊤` at\n  `l = 0` to `⊥` for `l ≥ ϱ + 2`.\n* `New.Shape.Form.unipotentBelow`, `New.Floors.FloorGroups.floorUnipotent`,\n\
        \  `New.Shape.Form.partialUnitriangularGroup`: the groups `\U0001D4A9_{<l}`, `\U0001D4A9_l = H_l ∩ \U0001D4A9\
        _{<l+1}` and `Q_l`.\n  The first increases to `New.Shape.Form.besselU` and the third decreases to it.\n\
        * `New.Floors.FloorGroups.leadingMinor_frameGram_partialUnitriangularGroup_mul`,\n  `New.Filling.leadingMinor_frameGram_besselU_mul`:\
        \ the leading minors of order at most `l` of the\n  matrix of the products `h(f_a, γ f_b)` depend only on\
        \ the double coset of `γ` under `Q_l`, and all\n  of them only on the double coset under `\U0001D5B4`.\n\
        * `New.besselS_le_normalizer_besselU`: `S` normalises `\U0001D5B4`.\n* `New.div_mem_unitaryLevel_of_besselU_mul`:\
        \ the `h` in `H` with `h y` in `\U0001D5B4 K`, for a principal\n  congruence subgroup `K`, lie in one right\
        \ coset of `H ∩ K`.\n* `New.simpleRootSum`, `New.simpleRootSum_mul`, `New.simpleRootSum_eq_zero_of_mem_besselH`:\
        \ the sum\n  of the entries just above the diagonal on the frame is additive on `S` and zero on `H`.\n\n\
        Notions from other files:\n* `New.Shape.Form.splitGram`: the Gram matrix `J` of ϱ hyperbolic planes and\
        \ a middle space with\n  Gram matrix `T`: identity blocks pair the first and last ϱ indices, `T` is the\
        \ middle block, all\n  else is zero. `T.G` is its unitary group.\n* `New.Shape.BesselIndex`: the basis indices.\
        \ `inl a` is `e_a`, `eStar a` = `inr (inr a)` is `e*_a`;\n  the middle indices are those in `κ` and one\
        \ more, `z`. `\U0001D530.n` is `ϱ + 1`.\n* `New.BesselIndex.level`: `a` at `e_a`, `ϱ` on the middle block,\
        \ `2ϱ - a` at `e*_a`.\n* `New.Shape.besselFrame`: the frame `f = (e_0, …, e_{ϱ-1}, z)`; `\U0001D530.top`\
        \ is the position of `z`.\n* `New.Shape.Form.besselU`: the isometries that are block upper unitriangular\
        \ for the levels.\n\n## Relation to the literature\n\nThe file belongs to two known theories: isotropic\
        \ flags in unitary groups (see\n`Lib.DiscreteSeries.Bruhat.ComplexPlace`), and Poincaré series along a Bessel\
        \ subgroup with their\nunfolding, for which it supplies the groups. Sources: A. Borel, Introduction to automorphic\
        \ forms,\nProc. Sympos. Pure Math. 9 (1966) (Poincaré series); V. Platonov, A. Rapinchuk, Algebraic groups\
        \ and\nnumber theory (1994) §7.1; for the set-up, W. T. Gan, B. Gross, D. Prasad, Astérisque 346 (2012).\n"
