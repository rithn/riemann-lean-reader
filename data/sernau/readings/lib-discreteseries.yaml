      line: 7
      endLine: 12
      text: 'Let `𝔰` be a shape and let 𝖴⁰ ⊆ 𝖴 be the Bessel unipotent subgroups (`New.Shape.Form.besselU0`,

        `New.Shape.Form.besselU`) of the unitary group `𝔰.G₁`, which is `(𝔰.middleGram 1).G` (so 𝖴⁰ is

        `(𝔰.middleGram 1).besselU0`). The elements of 𝖴 are block upper unitriangular for the levels of the

        basis indices, and 𝖴⁰ also fixes the frame e_0, …, e_{ϱ-1}, z. The measures `New.Shape.besselHaar₀`

        on 𝖴⁰ and `New.Shape.besselHaar` on 𝖴 are images of Lebesgue measure under explicit

        parametrisations.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/Bessel/UnipotentHaarMeasure.lean
      line: 13
      endLine: 44
      text: "\n## Main definitions and results\n\n* `New.RealPlace.injective_freeEntries_besselU0`, `New.RealPlace.injective_freeEntries_besselU`:\
        \ the\n  free entries (`New.RealPlace.freeEntries`: the entries at the free positions in the rows e_a, plus\n\
        \  the imaginary parts at (e_a, e*_a)) are injective on \U0001D5B4⁰ and on \U0001D5B4.\n* `New.RealPlace.measurePreserving_freeEntries_besselHaar₀`,\n\
        \  `New.RealPlace.measurePreserving_freeEntries_besselHaar`: the free entries carry these measures to\n\
        \  Lebesgue measure.\n* `New.RealPlace.isUnimodularHaar_besselHaar₀`: `New.Shape.besselHaar₀` is a two-sided\
        \ Haar measure\n  (`New.RealPlace.IsUnimodularHaar`). An instance gives the same for `New.Shape.besselHaar`.\n\
        * `New.RealPlace.eichlerVectors`, `New.RealPlace.eichlerScalars`: the matrices ω and μ that describe\n \
        \ an element of \U0001D5B4⁰ as an Eichler map with matrix entries (`New.RealPlace.eichlerMatrix`).\n* `New.RealPlace.homogeneousBall`:\
        \ the balls ‖ω‖ ≤ ρ, ‖μ‖ ≤ ρ² in \U0001D5B4⁰. Radii add under multiplication\n  (`New.RealPlace.mul_mem_homogeneousBall`),\
        \ and the volume is proportional to a power of the radius\n  (`New.RealPlace.besselHaar₀_homogeneousBall`).\n\
        * `New.RealPlace.exists_tube`: there is a compact set whose slices along \U0001D5B4⁰ have controlled measure\n\
        \  (`New.RealPlace.IsTube`).\n\nNotions from other files:\n* `New.Shape.G₁`: The unitary group of the complex\
        \ hermitian form made of ϱ hyperbolic planes, the\n  standard positive form on κ, and one vector z with\
        \ h(z, z) = −1.\n* `New.Shape.BesselIndex`: The index set of the basis e_a; x_i (i in κ), z; e*_a, where\
        \ a runs over\n  `Fin ϱ`. The level is a at e_a, ϱ on the middle block and 2ϱ − a at e*_a (a counted from\
        \ 0).\n\n## Relation to the literature\n\nNo Bessel model is constructed here. This file gives coordinates\
        \ and Lebesgue–Haar measure on the\nunipotent radical and on its subgroup fixing the frame, balls and tubes\
        \ for the latter, and the\nσ-finiteness of Haar measures on the ambient unitary group. Source for the setting:\
        \ H. Xue, Bessel\nmodels for real unitary groups: the tempered case, Duke Math. J. 172 (2023) 995-1031;\
        \ R.\nBeuzart-Plessis, Astérisque 418 (2020).\n"
