      text: 'The form `(𝔰.middleGram N).splitGram` on the space Y₀ of column vectors indexed by `𝔰.BesselIndex`

        is the sum of ϱ hyperbolic planes, the identity form on X₀ = A^κ and a line of norm −N. Its

        archimedean version is the complex form `New.Shape.J₁`, whose space has basis `e_a`, `x_i`, `z`,

        `e*_a` with `h(z, z) = -1` for the hermitian form `h`, and frame `e_0, …, e_{ϱ-1}, z`. The file

        embeds the unitary group of X₀ in U(Y₀) and in `G₁`. It gives explicit elements of the unipotent

        groups 𝖴⁰ = `New.Shape.Form.besselU0` and 𝖴 = `New.Shape.Form.besselU`, and measures on them. It

        then defines Bessel functions on `G₁`.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/Bessel/Basic.lean
      line: 14
      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.exists_besselU_mul_toBesselH`: for N a unit, a coefficient\
        \ ring with an element of trace one\n  and an invertible hermitian form, every element of `besselS` is a\
        \ product `u h` with `u` in\n  `besselU` and `h` in the image of `New.toBesselH`.\n* `New.Shape.G₁`, `New.Shape.J₁`:\
        \ the group and its form.\n* `New.RealPlace.unipotentOf`, `New.RealPlace.mem_besselU0_iff_unipotentOf`:\
        \ a parametrization of\n  the unipotent group `New.Shape.Form.besselU0` that fixes the frame.\n* `New.RealPlace.embedH`:\
        \ the unitary group of the `x_i` inside `G₁`.\n* `New.Shape.besselHaar₀`, `New.Shape.besselHaar`: measures\
        \ on \U0001D5B4⁰ and \U0001D5B4, pushed forward from\n  Lebesgue measure on the parameters and, for \U0001D5B4\
        , from its product with the measure on \U0001D5B4⁰.\n* `New.IsBesselFunction`: bounded measurable functions\
        \ that transform by a character under the\n  unipotent group `New.Shape.Form.besselU` and by `rep` under\
        \ `U(κ)`.\n\nNotions from other files:\n* `New.Shape.Form.splitGram T`: the Gram matrix of ϱ hyperbolic\
        \ planes and a middle space with Gram\n  matrix T. Identity blocks pair the first and last ϱ indices, T\
        \ is the middle block, and all other\n  entries are zero.\n* `New.inclMatrix`: for a map u : m → n of index\
        \ sets, the n×m matrix whose j-th column is the\n  standard basis vector e_{u(j)}.\n* `New.frameMatrix`:\
        \ the square submatrix on the rows and columns of the frame.\n* `New.Shape.Form.besselS`: the Bessel subgroup,\
        \ generated by the unipotent group \U0001D5B4 =\n  `New.Shape.Form.besselU` and the fixer H = `New.Shape.Form.besselH`\
        \ of the basis vectors that\n  are not indexed by κ.\n\n## Relation to the literature\n\nKnown; see `Lib.DiscreteSeries.Bruhat.FloorGroups`,\
        \ `Lib.DiscreteSeries.Bessel.UnipotentHaarMeasure`\nand `Lib.DiscreteSeries.Bruhat.ComplexPlace` for sources.\n"
