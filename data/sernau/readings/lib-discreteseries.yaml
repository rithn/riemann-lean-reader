      text: 'The group is `New.USign ε = U(diag ε)` with compact subgroup `New.maxCompactU ε = U(diag ε) ∩ U(n)`.

        Every element of the compact subgroup is an exponential, and every element of the group is a product

        of two exponentials, so each element is joined to `1` by an analytic path in the group.'
    remainder:
      path: grh/src/Lib/DiscreteSeries/Holomorphic/HighestVectorExtension.lean
      line: 9
      endLine: 49
      startOffset: 483
      endOffset: 3182
      text: " A function\n`F` on a product of copies of this group is holomorphic of weight `u` for the order `o`\n\
        (`New.IsHolOfWeight ε o u F ε'`) if it extends analytically to products `h * b` of tuples by\n`F' (h * b)\
        \ = (∏ τ, diagChar (u τ) (b τ)) * F h`. Here each `b τ` is triangular for `o`, and `h τ`,\n`b τ` are block\
        \ diagonal for `ε'` (no condition for `ε' = 1`). For injective `o`, products of\nprincipal minors `New.weightMinors`\
        \ of dominant weights (`weightMinors l g` is the product over\nintegers `t` of the principal minor of `g`\
        \ on `{i | t ≤ l i}`, divided by `det g` when `t ≤ 0`) and\ncoefficients of highest vectors are such functions.\
        \ For dominant weights the file computes their\nweighted means over circles and, for a single copy of the\
        \ group, their integrals against\n`conj (weightMinors w)` over `New.maxCompactU ε`.\n\n## Main definitions\
        \ and results\n\n* `New.exists_expU_eq_maxCompactU`: an element of the compact subgroup\n  `New.maxCompactU\
        \ ε = U(diag ε) ∩ U(n)` is the exponential of a block diagonal element of the Lie\n  algebra (take the logarithm\
        \ by the functional calculus).\n* `New.exists_eq_expU_mul_expU`: every element of the group is a product\
        \ of two exponentials, by the\n  polar decomposition `New.exists_polar`.\n* `New.isHolOfWeight_weightMinors`,\
        \ `New.HCParam.IsKHighest.isHolOfWeight_coeffMap`: products of\n  principal minors `New.weightMinors` and\
        \ coefficients of highest vectors are holomorphic of a\n  weight (`New.IsHolOfWeight`).\n* `New.IsHolOfWeight.integral_mul_conj_weightMinors`:\
        \ the integral of `F` against\n  `conj (weightMinors w)` over the compact group `New.maxCompactU ε`.\n\n\
        Notions from other files:\n* `New.unitaryLie J`, `New.expU`: the Lie algebra of U(J), made of the matrices\
        \ `X` with\n  `Xᴴ J + J X = 0`, and its exponential map to U(J).\n* `New.blockDiagAlg ε`: the matrices that\
        \ commute with `diag ε` (`New.signMatrix ε`), that is the\n  block diagonal matrices for the signs `ε`.\n\
        * `New.IsBorelMatrix o b`: `b` is invertible and `b i j = 0` whenever `o j < o i`.\n* `New.diagChar w b`:\
        \ the product `∏ i, b i i ^ w i` of powers of the diagonal entries.\n* `New.IsKDominant ε o w`: `w j ≤ w\
        \ i` whenever `ε i = ε j` and `o i < o j`.\n\n## Relation to the literature\n\nKnown result: the coefficient\
        \ of the highest vector of a holomorphic discrete series representation\nand its reproducing property. Here\
        \ the setting is powers of U(p,q), using functions on the group\nthat extend holomorphically to the group\
        \ times a Borel subgroup instead of the bounded domain.\nSource: Harish-Chandra, Representations of semisimple\
        \ Lie groups IV-VI, Amer. J. Math. 77 (1955), 78\n(1956); A. Knapp (1986); A. Koranyi, A simplified approach\
        \ to the holomorphic discrete series, arXiv\n2312.16350.\n"
