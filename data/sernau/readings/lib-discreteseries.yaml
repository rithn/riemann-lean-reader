      text: 'The block rule compares two discrete series parameters at one place through their shifted entries.

        This file proves that it is equivalent to matching for the oscillator pair, that it is kept by a

        swap, a negation and a shift, and gives its form for a pair with one character. In the code all

        entries are doubled, so that they are integers.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/Theta/BlockRule.lean
      line: 10
      endLine: 30
      text: "\nNotions from other files:\n* `HCParam s`: an integer vector l = 2λ indexed by the domain of the signs\
        \ s; `toHCParam s l` is l\n  read as such a vector.\n* `HasGap h`: the entries of l are distinct, of the\
        \ parity of n − 1 for n entries, and those of\n  opposite signs differ by at least 2h.\n* `FockDualPair.std\
        \ t s γ δ`: the oscillator pair with rows for the signs t, columns for the signs\n  s, row shift γ and column\
        \ shift δ + n' for n' rows (the constants added on the diagonal).\n* `IsMatch`: both parameters have gap\
        \ 500(n+n')³ and each row and each column is either matched,\n  with a sign condition, or lies in the central\
        \ range left by the difference of the ranks.\n* `centredParam`: the entry of a row less twice the row shift,\
        \ plus the number of columns; `swap`\n  exchanges rows and columns.\n* `IsMatchedPair`: the centred entries\
        \ of a row and a column are opposite, and their signs times the\n  centred row entry exceed the absolute\
        \ difference of the ranks.\n\n## Relation to the literature\n\nKnown result: the shape of the theta correspondence\
        \ of discrete series parameters. Only statements\nabout the parameters, as integer vectors, are proved here.\
