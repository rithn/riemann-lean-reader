      path: grh/src/Lib/DiscreteSeries/Haar/TotalMass.lean
      line: 8
      endLine: 14
      text: 'The measure `volume` on `U J` is the compact dual measure `New.haarU J`, normalised by

        `New.volU n = ∏ i < n, 2 π ^ (i + 1) / i!`, the product of the areas of the unit spheres of

        `ℂ, …, ℂ ^ n`. The first part shows that U(n) has mass one, by computing the image of Lebesgue

        measure under the Gram map in two ways. For the second part let `J` be a hermitian involution of

        size `n`, `j : S →* U J` a proper homomorphism, and `ν` a right invariant measure on `S` that is

        finite on compact sets. Then norm balls are compared by a covering argument, with operator norms

        throughout.

        '
    remainder:
      path: grh/src/Lib/DiscreteSeries/Haar/TotalMass.lean
      line: 15
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.exists_hasGramDensity`: near the identity, the image of\
        \ Lebesgue measure under the\n  Gram map `Y ↦ Yᴴ Y` of square matrices is `volU n / 2 ^ n` times Lebesgue\
        \ measure. One column\n  ranges over a sphere, and the parts of the other columns orthogonal to it form\
        \ a square matrix of\n  size `n - 1`.\n* `New.isProbabilityMeasure_haarU`: for `J = 1` the measure has mass\
        \ one, by comparison with the\n  polar formula `New.IsGramSection.lintegral_eq`. The same holds for the\
        \ sign matrix with all signs\n  equal to 1.\n* `New.DiscreteSeries.measure_ball_le_covering`: for `D, R\
        \ ≥ 1` the set `‖j s * y‖ ≤ R` has at most\n  `(3 D R²) ^ (2 n²)` times the measure of the ball `‖j s -\
        \ 1‖ ≤ 1 / D`.\n* `New.DiscreteSeries.integral_decay_le`, `New.DiscreteSeries.lintegral_decay_le`: for `n\
        \ ≥ 1` and a\n  natural number `c > 8 n²` the function `(2 / ‖j s * y‖) ^ c` is integrable, with integral\
        \ at most\n  `16 ^ c` times the measure of `‖j s - 1‖ ≤ 1`.\n\nNotions from other files:\n* `New.gramCoords\
        \ J Y`: the real coordinates `skewCoords (I • (Yᴴ J Y))` of the hermitian matrix\n  `Yᴴ J Y`: with `x =\
        \ I • (Yᴴ J Y)` they are `(x a b).re + (x a b).im`, divided by `√2` for `a ≠ b`.\n* `New.U J`: the group\
        \ of matrices `g` with `gᴴ J g = J`; thus `U 1` is the unitary group.\n* `New.sphereDensity k r`: the number\
        \ `2 π ^ k r ^ (k - 1) / (k - 1)!`.\n\n## Relation to the literature\n\nKnown result: volume of U(n), polynomial\
        \ volume growth of U(J).\nHere J is any hermitian matrix with J² = 1, and the measure is normalised so that\
        \ U(n) has mass one.\nThe covering bound for norm balls holds for any group with a right invariant measure\
        \ and a\nhomomorphism to U(J), with an explicit crude constant. Source: L. K. Hua, Harmonic Analysis of\n\
        Functions of Several Complex Variables in the Classical Domains (1963), ch. III; I. G. Macdonald,\nThe volume\
        \ of a compact Lie group, Invent. Math. 56 (1980); B. Gross, On the motive of a reductive\ngroup, Invent.\
        \ Math. 130 (1997).\n"
