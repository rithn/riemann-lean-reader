        \n## Main definitions and results\n\n* `New.IsMatch.unique`, `New.IsJointHarmonic.exists_eq_smul_of_row_weight`,\n\
        \  `New.IsJointHarmonic.exists_eq_smul_of_column_weight`: the joint harmonic is unique up to a\n  scalar,\
        \ and one of its two weights suffices for this.\n* `New.IsMatch.eval_matchingPoint_ne_zero`: a pre-joint\
        \ harmonic does not vanish at the point\n  `New.FockDualPair.matchingPoint`, the 0-1 matrix of the matching.\n\
        \nNotions from other files:\n* `New.HCParam.HasGap`: `l.HasGap h` says that the entries of `l = 2λ` are\
        \ distinct and congruent to\n  `n − 1` mod 2, where `n` is their number, and `|λ_i − λ_j| ≥ h` whenever\
        \ `ε_i ≠ ε_j`.\n* `New.HCParam.IsKHighest`: `x` is a `K`-highest vector of weight `ν`: each `E a a` acts\
        \ on it by\n  `ν a`, and it is killed by the compact raising operators, the `E a b` with `ε a = ε b` and\n\
        \  `l b < l a`. The second condition alone is `New.GlModule.IsCompactPrimitive`.\n* `New.HCParam.lowestKType`:\
