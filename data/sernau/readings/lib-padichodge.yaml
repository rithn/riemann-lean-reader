    excerpt:
      path: grh/src/Lib/PadicHodge/Crystalline/Regularity.lean
      line: 6
      endLine: 10
      text: 'This file proves the regularity of the period ring `B = New.Period.Bmax` and shows that

        representations admissible along a filter have bases of fixed elements. It proves closure

        properties of crystalline and potentially crystalline representations under subobjects, quotients

        of tensor products and twisted duals. It also shows that a potentially crystalline representation

        is crystalline when the linear Frobenius operators are trivial on inertia.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Crystalline/Regularity.lean
      line: 11
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.Period.fontaine_regularity`, `New.Period.IsAdmissible.exists_basis`:\
        \ regularity of `B`; bases\n  of fixed elements.\n* `New.Period.IsAdmissible.of_jointly_injective`, `New.Period.IsKilledBy.of_jointly_injective`:\n\
        \  subobjects of finite sums.\n* `New.Period.linearFrob_apply`, `New.Period.linearFrob_mul`,\n  `New.Period.linearFrob_twist_cyclotomicGp`,\n\
        \  `New.Period.IsPotentiallyCrystalline.eventually_linearFrob_eq_one`: the operators are\n  multiplicative\
        \ and change by a power of `p` under Tate twists. They are trivial on inertia near\n  `1` if `T` is finite\
        \ free.\n* `New.Period.IsAdmissible.of_bilinear`, `New.Period.linearFrob_baseChangePairing`: quotients of\n\
        \  tensor products.\n* `New.Period.IsAdmissible.of_pairing`: twisted duals.\n* `New.Period.IsPotentiallyCrystalline.isCrystalline_of_inertia_fixes`:\
        \ descent from inertia.\n\nNotions from other files:\n* `New.Period.BPlus`, `New.Period.Bmax`: B⁺ = A_max[1/p]\
        \ and B = B⁺[1/μ], μ = [ε] − 1.\n* `New.Period.nearOne`: The filter 'near 1' on Γ: the pull-back along j:\
        \ Γ → G_p of the filter of\n  neighbourhoods of the identity.\n* `New.Period.IsWeilPair`: (s, m) is a Weil\
        \ pair if s acts on the residue field of the integers of\n  Q̄_p as x ↦ x^(1/p^m); m = 0 means that s is\
        \ in inertia.\n\n## Relation to the literature\n\nKnown result: Potentially crystalline representations,\
        \ Hodge–Tate weights and Weil–Deligne\nFrobenius. Here the representations are abstract modules over any\
        \ p-adic coefficient ring, with\nColmez's B_max as period ring and \"crystalline\" defined by the invariants\
        \ spanning. Polynomials\nkilling one linear Frobenius replace the Weil–Deligne representation. Source: J.-M.\
        \ Fontaine,\nReprésentations p-adiques semi-stables (Exp. III §1, §5) and Représentations l-adiques\npotentiellement\
        \ semi-stables (Exp. VIII 2.3), Astérisque 223 (1994); O. Brinon, B. Conrad, CMI\nSummer School notes on\
        \ p-adic Hodge theory (2009), 2.3.1, 5.2.1, 6.3, 9.1–9.3.\n\nSee also `Lib.PadicHodge.PeriodRings.DeRhamPeriods`\
        \ and `Lib.PadicHodge.Kisin.PeriodMatrixFrame`.\n"
