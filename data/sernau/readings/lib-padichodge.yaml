      text: "\n* `New.Period.ax_mem_closure_fixedField`, `New.Period.tate_eq_zero_of_cyclotomicGp_twist`: for a\n\
        \  subgroup `J` of `G_p`, `ℂ_p^J` lies in the closure of `ℚ̄_p^J`. An element of `ℂ_p(i)`, `i ≠ 0`,\n  fixed\
        \ by an open subgroup is `0`.\n* `New.Period.IsAdmissible.of_jointly_injective`: being crystalline, or potentially\
        \ crystalline,\n  passes to subrepresentations of finite direct sums.\n* `New.Period.crysCocycles.finrank_eq`:\
        \ let `T` be a potentially crystalline `ℤ_p`-lattice with\n  jumps `J`. Then `Z_f(T)` is finitely generated\
        \ of rank `rk T + n · #(negative jumps)`, where `n`\n  is the index of the image of `Γ` in `G_p`.\n* `New.GaloisRep.local_clauses_of_trace_limit`:\
        \ let `r` be a continuous Galois representation with\n  non-degenerate trace form. Let its trace be a uniform\
        \ limit of linear combinations of traces of\n  continuous representations unramified or crystalline at a\
        \ place `A`. Require finitely many\n  approximations, or the same jumps for all terms. Then `r` is unramified\
        \ or crystalline at `A`. Its\n  jumps follow if their multiplicities are compatible with the limit. A polynomial\
        \ killing an\n  element `s` at `A` passes to `r`, given bounded degrees and convergence weighted by each\n\
        \  coefficient.\n\nThe development proves only the parts of the standard theory that it uses: of the Ax–Sen–Tate\n\
        theorem only Ax's weaker form, and of Tate's theorem only the statement on `H⁰`. The notions below\ntake\
        \ the place of Fontaine's admissible representations, of the Weil–Deligne representation and of\nthe Bloch–Kato\
        \ rank formula. For local–global compatibility of automorphic Galois representations,\nonly the passage\
        \ to limits is proved, with `r` given. Crystalline means that the invariants span\n`B ⊗ T`.\n\nIn place\
        \ of the Weil–Deligne representation stands `New.Period.linearFrob`. For `s ∈ Γ` and `m ∈ ℕ`,\nit is a chosen\
        \ `B`-linear endomorphism of `B ⊗ T`. It agrees with `φ^m s ⊗ s` on `D_pcris(T)` when\none exists, where\
        \ `φ` is the Frobenius of `B`. In place of `H¹_f` stands the rank of `Z_f(T)`.\n\nOrganisation of `Lib.PadicHodge`.\
        \ (1) `PeriodRings`: Ax's theorem, `A_inf`, Fontaine's map `θ`,\n`B`, the period `t` of `ℤ_p(1)`, `B_dR`.\
        \ (2) `TateSen`: Tate's theorem, invariants of `B_dR`.\n(3) `Crystalline`: `Basic` (definitions, twists),\
        \ `HodgeTateJumps`, `Regularity` (regularity of\n`B`, using `Kisin`). (4) `BlochKato`: the rank, by the\
        \ fundamental exact sequence; duality is in\n`Lib.ClassField.LocalDuality.CrystallineDuality`. (5) `Limit`:\
        \ the trace-limit theorem.\n\n## Main definitions and results\n\n* `New.Period.exists_uniform_trace_sum_eq_jump`:\
        \ the multiplicity of one jump is `t` times a sum of\n  traces with coefficients of norm at most `1`, where\
        \ `t` is the same for every crystalline lattice\n  with jumps in `[0, n]` and depends only on `Γ`, `n` and\
        \ the jump.\n\nNotions from other files:\n* `New.GaloisRep.HasJumpsAt`: For each local datum at `A` with\
        \ embedding `e` and each `g` in\n  `Gal(ℚ̄_ℓ/ℚ_ℓ)`, the Hodge–Tate jumps of `r` at `g`, with multiplicity,\
        \ are `J` at the embedding\n  `ι_ℓ⁻¹ ∘ g⁻¹ ∘ e` of `E` in `ℂ`.\n* `New.Period.IsKilledBy`: the form of `PolyKillsAt`\
        \ above ℓ. For a Weil pair (s, k), with s acting\n  on residues as x ↦ x^(1/ℓ^k), it says that the representation\
        \ T is potentially crystalline. It\n  also says that P kills the operator β = `linearFrob` on `Bmax ℓ` ⊗\
        \ T, which acts as φ^k s on the\n  elements fixed by all g near 1.\n* `New.Period.IsPotentiallyCrystalline`:\
        \ the elements of B⊗T fixed by all g with j(g) near 1 span\n  B⊗T over B.\n\n## Relation to the literature\n\
        \nKnown result: Limits of crystalline representations with bounded weights are crystalline. Here the\nhypothesis\
        \ is a uniform limit of traces with unbounded coefficients and ranks, and crystallinity is\nLiu's theorem\
        \ applied to the image of the group ring. The file also proves limit formulas for the\nmultiplicities of\
        \ jumps and for killing polynomials. Source: T. Liu, Torsion p-adic Galois\nrepresentations and a conjecture\
        \ of Fontaine, Ann. Sci. ENS 40 (2007) 633–674; L. Berger, Limites de\nreprésentations cristallines, Compositio\
        \ Math. 140 (2004) 1473–1498; for the passage from traces to\nthe image of the group ring, P. Wake, C. Wang-Erickson,\
        \ Deformation conditions for\npseudorepresentations, Forum Math. Sigma 7 (2019).\n"
