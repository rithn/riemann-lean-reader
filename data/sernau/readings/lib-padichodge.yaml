      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.Lift.Chart.IsPeriodMatrix`: period matrices `U` over `B⁺`\
        \ of height `h`.\n* `New.Lift.Chart.IsPeriodMatrix.exists_basis`: a basis `Q`, `Z` for `U`\n  (`New.Lift.Chart.IsPeriodBasis`):\
        \ the `x` over `A_inf` with `E ^ h x ∈ U S_B ^ d` are the `S`-span\n  of the columns of a nonsingular matrix\
        \ `Q`.\n* `New.Lift.Chart.IsChartOf.exists_mem_bicommutant_of_fixed`: elements of `New.Period.Bmax` fixed\
        \ by\n  `Γ` come from `c.bicommutant`, an `S`-subalgebra of `New.Period.BPlus` in which `p` is invertible\n\
        \  (defined as a commutant, `New.Lift.Chart.bicommutant`).\n* `New.Lift.Chart.IsChartOf.exists_isPeriodMatrixOf`:\
        \ if the Hodge–Tate jumps lie in `[-a, b]`, an\n  invariant basis `M` gives the period matrix `(E τ) ^ a\
        \ M` of height `a + b`\n  (`New.Lift.Chart.IsPeriodMatrix`).\n\nNotions from other files:\n* `New.Period.mu`,\
        \ `New.Period.tau`, `New.Period.xi`: The elements μ = [ε] − 1, τ = [ε^{1/p}] − 1\n  and ξ = ∑_{i<p} [ε^{1/p}]^i\
        \ of A_inf, with ξτ = μ; brackets denote Teichmüller lifts, and ε = (1,\n  ζ_p, ζ_{p²}, …) is `New.Period.epsTilt`.\n\
        * `New.Lift.Chart.z`, `New.Lift.Chart.E`: For a chart, the images in S of X and of the series X^e\n  A +\
        \ p, A a unit of Λ[[X]]. Here Λ = `New.Lift.WittFq` = W(F_{p^f}).\n* `New.Period.jump`: The multiplicity\
        \ of an integer as a Hodge–Tate jump of ρ at an embedding.\n* `New.Lift.Chart.IsChartOf`: The field of the\
        \ chart contains the field fixed by the image of j:\n  Γ → G_p: every g in G_p that fixes Λ pointwise and\
        \ fixes θ(z) lies in the image of j.\n* `New.Lift.Chart.extendToBPlus`: a chosen `S`-linear extension to\
        \ `B⁺` of an `S`-linear map\n  `A_inf → A_inf`; it maps `amaxImage` into itself.\n* `New.Period.frobEnd`:\
        \ the Frobenius endomorphism `φ` of the period rings.\n\n## Relation to the literature\n\nKnown; see `Lib.PadicHodge.Kisin.PeriodMatrixFrame`\
        \ for sources.\n"
