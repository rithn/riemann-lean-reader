      line: 14
      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.Lift.mu_sq_dvd_smul_mu_sub`: in `New.Period.Ainf`, the\
        \ Witt vectors of the tilt of the\n  integers of `ℂ_[p]`, an element `g` of the Galois group `New.Gp p`\
        \ sends `μ = [ε] - 1` to `χ(g) μ`\n  modulo `μ ^ 2`. Here `ε` is `New.Period.epsTilt` and `χ` is the cyclotomic\
        \ character. The\n  divisibility `μ ^ 2 ∣ g μ - χ(g) μ` holds in `A_inf` itself; the proof checks it modulo\
        \ every\n  power of the ideal `(p, ξ)`, where `ξ` generates the kernel of Fontaine's map `θ`.\n* `New.Period.exists_tPeriod`:\
        \ some unit multiple `t` of `p μ` has `φ t = p t` and `g t = χ(g) t`.\n* `New.Period.BdR`: the fraction\
        \ field of B_dR⁺; G_p acts on it and B embeds in it equivariantly.\n* An embedding of Q̄_p in B_dR⁺, got\
        \ by lifting along θ since Q̄_p is formally étale over ℚ_p;\n  `New.Period.thetaBdR_algebraMap_padicAlgCl`\
        \ says it is a section of θ,\n  `New.Period.BdR.smul_algebraMap_padicAlgCl` that it is G_p-equivariant.\n\
        * `New.Period.Bmax.fundamental_sequence_surjective`: (φ − 1, inclusion) maps B onto\n  B × B_dR / B_dR⁺,\
        \ the surjectivity in the fundamental exact sequence.\n\nNotions from other files:\n* `New.Period.Amax`:\
        \ The ring A, the p-adic completion of A_inf[ξ/p]; B⁺ = A[1/p].\n* `New.Period.mu`, `New.Period.tau`, `New.Period.xi`:\
        \ The elements μ = [ε] − 1, τ = [ε^{1/p}] − 1\n  and ξ = Σ_{0 ≤ i < p} [ε^{1/p}]^i of A_inf; ξτ = μ and\
        \ φ(τ) = μ.\n\n## Relation to the literature\n\nKnown result: Fontaine's period rings and the fundamental\
        \ exact sequence. Here Colmez's B_max\nreplaces B_cris and the period t is built without logarithms. The\
        \ part of Fontaine's regularity that\nis used, namely that the invariants of the fraction field of B already\
        \ lie in B, is proved in\n`Lib.PadicHodge.Crystalline.Regularity` (`New.Period.fontaine_regularity`). Source:\
        \ P. Colmez,\nThéorie d'Iwasawa des représentations de de Rham d'un corps local, Ann. of Math. 148 (1998),\n\
        III.2-III.3; J.-M. Fontaine, Le corps des périodes p-adiques, Astérisque 223 (1994); X. Caruso, An\nintroduction\
        \ to p-adic period rings (2019), §3.\n"
