      text: '`New.Period.OFlat = O^♭` is the tilt of the ring of integers of `ℂ_p`, and `New.Period.CFlat = C^♭`

        is its fraction field. We write `New.Period.WittCFlat = W(C^♭)` and `A_inf = W(O^♭)`; the prime is

        fixed by `[ThePrime p]`, and `New.Gp p` is the Galois group of `ℚ̄_p` over `ℚ_p`. The ideal

        `W(𝔪) = W(𝔪^♭)` of `A_inf` is introduced, and the sets `W(𝔪) + p ^ m W(C^♭)` serve as neighbourhoods

        of `0` for which the Galois action on `W(C^♭)` is continuous. For a group Γ (`[GroupOverGp p]`,

        elements of type `GroupOverGp.G`) that maps to `Gp p`, and a representation of Γ on a ℤ_p-module T,

        '
    remainder:
      path: grh/src/Lib/PadicHodge/ArtinSchreierSequence.lean
      line: 12
      endLine: 45
      text: "the module W(C^♭) ⊗ T with the diagonal action of ℤ × Γ is built, together with base change of\nlinear\
        \ and bilinear maps. For T = ℤ_p/p^m(1) this gives an Artin–Schreier sequence: φ − 1 is onto,\nand its kernel\
        \ modulo W(\U0001D52A^♭)·(1 ⊗ 1) is ℤ_p/p^m.\n\n## Main definitions and results\n\n* `New.Lift.wittOfMaxIdeal`:\
        \ the kernel of the reduction `A_inf → W(k)`; by\n  `New.Lift.mem_wittOfMaxIdeal` its elements are the Witt\
        \ vectors none of whose coefficients is a\n  unit.\n* `New.Lift.WittCFlat.eventually_smul_sub_mem`: for\
        \ `a`, `d` in `W(C^♭)` and `g` near `1` in\n  `New.Gp p`, the element `(g • a - a) * d` lies in `W(\U0001D52A\
        ) + p ^ m W(C^♭)`.\n* `New.Lift.DiagTensor`: the module W(C^♭) ⊗ T with its diagonal action.\n* `New.Lift.smallPart`:\
        \ the A_inf-submodule W(\U0001D52A^♭)·(1 ⊗ 1) of M = W(C^♭) ⊗ ℤ_p/p^m(1).\n* `New.Lift.TateTwist.exists_eq_phi_smul_sub`,\n\
        \  `New.Lift.TateTwist.exists_sub_mk_one_mem_smallPart_of_phi_smul_sub_mem` and\n  `New.Lift.TateTwist.eq_zero_of_mk_one_mem_smallPart`:\
        \ φ − 1 is onto M, and its kernel modulo\n  W(\U0001D52A^♭)·(1 ⊗ 1) is ℤ_p/p^m.\n* `New.Lift.TateTwist.eventually_map_smul_sub_mem_smallPart`:\
        \ let ρ be a representation with\n  ρ(g)y − y divisible by p^m for g near 1, and let L be a linear map from\
        \ W(C^♭) ⊗ ρ into M. Then\n  for each v, L(gv − v) lies in W(\U0001D52A^♭)·(1 ⊗ 1) for g near 1.\n\nNotions\
        \ from other files:\n* `New.Period.toWittResidue`: the ring map `A_inf = W(O^♭) → W(k)`, `k` the residue\
        \ field of `O^♭`,\n  that reduces each Witt coordinate.\n* `New.Lift.FrobGroup Γ`: the group `ℤ × Γ`; `FrobGroup.snd`\
        \ is the projection to `Γ`, `inr g` is\n  `(0, g)` and `φ` is `(1, 1)`, which acts as the Frobenius.\n*\
        \ `New.Period.nearOne Γ`: the filter \"near `1`\" on `Γ`, pulled back from the neighbourhoods of `1`\n \
        \ in `Gp p`.\n\n## Relation to the literature\n\nKnown result: The Artin–Schreier–Witt resolution over the\
        \ tilt. Only the φ−1 step of Herr's complex\nis treated, on Witt vectors of the tilt of C_p modulo p^m,\
        \ and the Γ-step is not treated. Source: L.\nHerr, Sur la cohomologie galoisienne des corps p-adiques, Bull.\
        \ SMF 126 (1998) 563–600.\n"
