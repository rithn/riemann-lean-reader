      text: 'Let `L` be a lattice datum over a Kummer chart `k`. The ring `S` of `k` has a variable `z` and the

        element `E = z ^ e * unit + p`, and `k.frobE m` is `φ ^ m E`; `phiInvToBdR 0` is the map

        `Ainf → BdR`. Let `h = L.jumpBound` and `τ = [ε^{1/p}] − 1`. A form is an `Ainf`-linear map

        `W(C♭) ⊗ L → B_dR`. Those in `L.forms` are `Γ''`-equivariant on `1 ⊗ L`. They cut out the

        `Ainf`-module `L.kisinAinf` and the Kisin module `N = L.kisinModule` over `S`. `L.ainfLattice` is

        `Ainf ⊗ L`; `L.fracSpan` holds the `x` with `r • x ∈ L.ainfLattice` for some non-zero divisor `r` of

        `Ainf`, and `L.frobKisinAinf l` is `φ ^ l (L.kisinAinf)`.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Kisin/FrameTheorem.lean
      line: 15
      endLine: 82
      text: "\n## Overview of this theory\n\nA chart (`New.Lift.Chart`) is a `Λ`-algebra map `Λ⟦X⟧ → A_inf`, with\
        \ `Λ = W(\U0001D53D_{p^f})`. It sends `X`\nto a non-unit Teichmüller lift `z = [ϖ^♭]`. It sends some `X^e\
        \ V + p`, with `V` a unit, to a\ngenerator `E` of `ker θ`. `S` is its image. `B⁺` (`New.Period.BPlus`) receives\
        \ `A_inf` and maps to\n`B_max` (`New.Period.Bmax`) and `B_dR`. Its `S`-subalgebra `S_B` (`New.Lift.Chart.bicommutant`)\
        \ is\nthe `p`-adic closure of `S[E/p]` with `p` inverted\n(`New.Lift.Chart.adjoinEDivPClosure_eq_bicommutant`).\
        \ Put `μ = [ε] - 1`, with `ε` a compatible\nsystem of `p`-power roots of unity, and `τ = φ⁻¹ μ`.\n\n* Let\
        \ `K` be the field fixed by an open subgroup `G_K` of `Gal(ℚ̄_p/ℚ_p)`. There is a Kummer chart\n  (`New.Lift.KummerChart`)\
        \ with `Λ` and `θ z` fixed by `G_K` and `e f = [K : ℚ_p]`\n  (`New.Lift.exists_kummerChart`).\n* Let `c`\
        \ be a chart for `G_K` (`IsChartOf`). Let `T` be a crystalline `ℤ_p`-lattice with action\n  `ρ`, whose jumps\
        \ (the `k` with `New.Period.jump` nonzero) lie in `[-a, b]`. In a basis of `T`\n  there are three objects.\
        \ The first is `P`, invertible over `B_max`, with `ρ(g) · g P = P`. The\n  second is a unit `v` with `E\
        \ τ v = μ`. The third is `U` over `B⁺`, whose image in `B_max` is\n  `(E τ)^a P`. This `U` satisfies the\
        \ predicate `IsPeriodMatrix` with height `a + b` and Frobenius\n  factor `v^a` (`New.Lift.Chart.IsChartOf.exists_isPeriodMatrixOf`).\n\
        * Take such a `U` of height `h` and factor `v`. There are `Q` and `Q'` over `A_inf`, `Z` over `S_B`\n  and\
        \ `B` over `S` with `Q Q' = τ^h`, `U Z = E^h Q` and `φ Q = v Q B`\n  (`New.Lift.Chart.IsPeriodMatrix.exists_frame`).\n\
        * On a Kummer chart, let `h = jumpBound`. Let `N` be the `S`-module `kisinModule` and `M` its\n  `A_inf`-span\
        \ `kisinAinf`. Then `τ^h` maps `M` into `ainfLattice` and back, and `E^h φ N ⊆ N`. Take\n  a crystalline\
        \ form `λ` (`crysForms`, valued in `B_dR`). Then `E^h λ(N)` lies in the image of\n  `S_B`. Suppose `d ∈\
        \ A_inf` is such that `d ∣ E^m r` in `B⁺` forces `d ∣ r`. Then `x ∈ M` lies in\n  `d M` once, for one `n`,\
        \ `E^n λ(x) ∈ d B⁺` for all such `λ`\n  (`New.Lift.KummerChart.JumpLattice.mem_smul_kisinAinf_of_crysForms`).\n\
        \nThis is a substitute, in the form needed here, for part of Kisin's theorem on the module of a\ncrystalline\
        \ lattice (Kisin 2006; Bhatt–Morrow–Scholze 2018). The inclusion `E^n N ⊆ S φ N` and an\nequivalence of\
        \ categories are not stated.\n\nContents of the files. `Charts`: coordinates and an approximation lemma.\n\
        `Bicommutant`: extension to `B⁺`.\n`PeriodMatrixBasis`: `U`, and `Q` with `det Q ≠ 0`. `PeriodMatrixFrame`:\
        \ `p ∤ det Q`, hence the\nframe. `KummerChartDeRham`: the different, and values in `B_dR`. `Modules`: `M`,\
        \ `N` and the\n`B_dR`-valued forms. `FrameTheorem`: `N` as the `S`-span of the columns of `τ^{-h} Q`, using\n\
        `Lib.PadicHodge.RadiusLemma`.\n\n## Main definitions and results\n\n* `New.Lift.KummerChart.JumpLattice.frame_theorem`:\
        \ a relation `∑ c i • v i = 0` among vectors of\n  `L.valueFieldPoints L.fracSpan` still holds after applying\
        \ any `k.S`-linear `f : Ainf → k.S` to\n  the coefficients (`New.Lift.KummerChart.JumpLattice.FrameProperties`).\n\
        * `New.Lift.KummerChart.JumpLattice.valueFieldPoints_frobKisinAinf_eq_span`: the vectors of\n  `φ ^ l (L.kisinAinf)`\
        \ on which all forms in `L.forms` take values in `k.valueField 0` form the\n  `S`-span of `φ ^ l N`.\n*\
        \ `New.Lift.KummerChart.JumpLattice.smul_mem_kisinAinf`: an element `g` that conjugates `Γ'` into\n  itself\
        \ preserves the module `New.Lift.KummerChart.JumpLattice.kisinAinf`. The reason is that\n  conjugation by\
        \ `g` keeps forms `Γ'`-equivariant\n  (`New.Lift.KummerChart.JumpLattice.conjForm_mem_forms`).\n\nNotions\
        \ from other files:\n* `New.Lift.KummerChart.JumpLattice`: A finite free O-module with an action of Γ, crystalline\
        \ over\n  Γ', together with a finite set of integers for each embedding of O in `ℂ_[p]` that contains the\n\
        \  jumps at that embedding. It also carries finite sets of integers indexed by `Letter`, which this\n  file\
        \ does not use directly.\n* `New.Lift.KummerChart.JumpLattice.Ambient`: The module W(C^♭)⊗L for the lattice\
        \ underlying L;\n  `DiagTensor.mk 1 t` is the vector 1 ⊗ t.\n* `New.Lift.KummerChart.JumpLattice.kisinAinf`:\
        \ The x in A_inf[1/τ] ⊗ L with μ(φ^n x) in B_dR^+ for\n  all n ≥ 1 and all μ in `L.forms`, where τ = [ε^{1/p}]\
        \ − 1. The Kisin module consists of those x on\n  which all forms in `L.forms` take values in the subfield\
        \ `k.valueField 0` of B_dR.\n\n## Relation to the literature\n\nKnown; see `Lib.PadicHodge.Kisin.PeriodMatrixFrame`\
        \ and `Lib.PadicHodge.Kisin.Modules` for sources.\n"
