    excerpt:
      path: grh/src/Lib/PadicHodge/BlochKato.lean
      line: 7
      endLine: 14
      text: 'Let `T` be a finite free `ℤ_[p]`-module of rank d with an action `ρ` of a group Γ, and let

        j = `𝒥.toGp`, given by the structure `𝒥 : New.Period.OverGp Γ p`, map Γ with open image of index n

        to the absolute Galois group `New.Gp` of ℚ_p. The Bloch–Kato cocycles

        Z_f(T) = `New.Period.crysCocycles ρ` are the maps Γ → T that become coboundaries over the period

        ring B = `New.Period.Bmax`. χ = `New.Period.χ` is the cyclotomic character `New.cyclotomicGp`

        composed with j. The file proves basic properties of Z_f(T), builds admissible extensions from

        crystalline cocycles of potentially crystalline representations, studies reduction modulo p^m, and

        computes the rank of Z_f(T) and its vanishing.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/BlochKato.lean
      line: 15
      endLine: 54
      text: "\n## Main definitions and results\n\n* `New.Period.IsPotentiallyCrystalline.exists_hodge_basis`: for\
        \ potentially crystalline T, in a\n  ℤ_p-basis of T, an automorphism of B_dR^ι that makes the action of\
        \ Γ coordinatewise and carries\n  (B_dR^+)^ι to the lattice given by the jumps of T.\n* `New.Period.extensionRep`,\
        \ `New.Period.isAdmissible_extensionRep`: the extension of a trivial\n  module by T given by cocycles in\
        \ `New.Period.crysCocycles` is admissible along the same filter as\n  T (`New.Period.IsAdmissible`).\n*\
        \ `New.Period.IsPotentiallyCrystalline.reducedCocycle`: for an equivariant additive map `q` from `T`\n \
        \ to a discrete module `V` with kernel `p ^ m T`, the map sending a crystalline cocycle `c` to the\n  continuous\
        \ cocycle `q ∘ c`.\n* `New.Period.crysCocycles.finrank_eq`: for potentially crystalline T, Z_f(T) is finitely\
        \ generated\n  over ℤ_p of rank d + n·(number of negative Hodge–Tate jumps).\n* `New.Period.IsPotentiallyCrystalline.exists_coboundary_eq_smul`:\
        \ for potentially crystalline T\n  with positive jumps, Z_f(T) is torsion modulo coboundaries.\n* `New.Period.crysCocycles.apply_eq_zero_of_cyclotomicGp`:\
        \ let Γ act through χ^(−a) with a ≥ 0. Then\n  crystalline cocycles vanish where the action is trivial.\
        \ When a = 0 we also need j(s) to lie in\n  inertia.\n\nNotions from other files:\n* `New.Period.IsPotentiallyCrystalline`:\
        \ the elements of Bmax ⊗ T fixed by all g with j(g) near 1\n  span Bmax ⊗ T over Bmax.\n* `New.DiscreteModule`:\
        \ A discrete Γ-module over R: an R-module with the discrete topology and a\n  continuous R-linear action\
        \ of the topological group Γ.\n* `New.DiscreteModule.HoldsCorestrictions`: for a discrete Γ-module V, an\
        \ open subgroup U of Γ and\n  groups of cocycles Y′ ≤ Z¹(U, V) and Y ≤ Z¹(Γ, V), the group Y contains every\
        \ coboundary and a\n  corestriction of each y in Y′: there is a cocycle F with values in the functions Γ/U\
        \ → V whose\n  Shapiro image is y and whose sum over Γ/U lies in Y.\n* `New.Period.jump`: The multiplicity\
        \ of the Hodge–Tate jump u at γ: the dimension over Q̄_p (zero\n  if infinite) of the γ-semilinear f : T\
        \ → ℂ_p with f(gx) = χ(g)^(−u)·g f(x) for g near 1.\n\n## Relation to the literature\n\nKnown result: Bloch–Kato\
        \ finite local condition, rank formula. Here it is treated on cocycles of a\nlattice in a potentially crystalline\
        \ representation. The rank is counted from the fundamental exact\nsequence. Local duality is not treated\
        \ in this file, only the reduction of crystalline cocycles\nmodulo p^m. Source: S. Bloch, K. Kato, L-functions\
        \ and Tamagawa numbers of motives, Grothendieck\nFestschrift I (1990), Prop. 3.8, Cor. 3.8.4; J. Bellaïche,\
        \ An introduction to the conjecture of\nBloch and Kato, Clay Summer School notes (2009), Prop. 2.8, Thm\
        \ 2.1.\n"
