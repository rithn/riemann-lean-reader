      text: 'The file constructs the `p`-adic avatar of an algebraic Hecke character of a totally complex field

        `K`. This is a continuous character of the absolute Galois group `Γ`, defined after fixing

        `ι : ℂ ≃ ℚ̄_p`. The file then studies local conditions on a Galois representation `r` at a place `A`

        of `Ω`: finite type, good, Hodge–Tate jumps, and polynomials killing an element.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Characters.lean
      line: 12
      endLine: 61
      text: "\n## Main definitions and results\n\n* `New.AlgHeckeChar.avatar`: the continuous character of `Γ` obtained\
        \ from an algebraic Hecke\n  character `(θ, n)` by correcting `ι ∘ θ` at the places above `p`. It is multiplicative\
        \ in\n  `(θ, n)`.\n* `New.GaloisRep.localConditions_twist`: how the local conditions `New.GaloisRep.IsFiniteTypeAt`\n\
        \  (finite type), `New.GaloisRep.IsGoodAt` (unramified, or crystalline above `ℓ`),\n  `New.GaloisRep.JumpsRelAt`\
        \ (Hodge–Tate jumps) and `New.GaloisRep.PolyKillsAt` (a polynomial kills\n  an element) behave when a representation\
        \ is multiplied by a character. It collects the four\n  lemmas `IsFiniteTypeAt.twist`, `IsGoodAt.twist`,\
        \ `JumpsRelAt.twist` and `PolyKillsAt.twist`.\n* `New.Period.isPotentiallyCrystalline_of_unramified_char`:\
        \ take a continuous `p`-adic character `ν`\n  of an open subgroup of `G_p`, trivial on inertia near `1`.\
        \ An algebra on which `ν` acts by scalars\n  is potentially crystalline (`IsPotentiallyCrystalline.of_unramified_char`)\
        \ with the jumps of the\n  trivial action (`jump_eq_jump_one_of_unramified_char`). Weil elements act on\
        \ its Weil–Deligne\n  representation through `ν` (`isKilledBy_X_sub_C_of_unramified_char`).\n* `New.GaloisRep.localConditions_char_of_finite_image_inertia`:\
        \ the conditions for a character with\n  finite image on inertia, collected from `IsFiniteTypeAt.scalar_of_finite_image_inertia`,\n\
        \  `hasJumpsAt_zero_of_finite_image_inertia` and `polyKillsAt_X_sub_C_of_finite_image_inertia`.\n* `New.GaloisRep.AvatarCompatAt`:\
        \ local-global compatibility for the ℓ-adic avatar\n  `New.AlgHeckeChar.avatar` of an algebraic Hecke character\
        \ θ of a totally complex field E;\n  `New.GaloisRep.AvatarCompatAt.isSphericalAbove_of_unramified` is its\
        \ consequence where θ is\n  unramified.\n* `New.GaloisRep.avatarCompatAt_of_type_eq_zero`: it holds at a\
        \ place w of E if the infinity type\n  vanishes at the embeddings over w.\n\nNotions from other files:\n\
        * `New.AlgHeckeChar`: The type of algebraic Hecke characters of K: pairs (θ, n) of a character of\n  the\
        \ finite ideles and its infinity type, as in `New.algHeckeChars`.\n* `New.Period.IsPotentiallyCrystalline`:\
        \ the elements of `Bmax ⊗ T` fixed by all `g` near `1`\n  (`New.Period.Dpcris`) span `Bmax ⊗ T` over `Bmax`.\n\
        * `New.GaloisRep.HasJumpsAt`: For each local datum at `A` with embedding `e`, each `g` in\n  `Gal(ℚ̄_ℓ/ℚ_ℓ)`\
        \ and the embedding `γ` of `ℚ̄_ℓ` in `ℂ_ℓ` given by `g`, the Hodge–Tate jumps of\n  `r` at `γ`, with multiplicity,\
        \ are `J` at the embedding `ι_ℓ⁻¹ ∘ g⁻¹ ∘ e` of `E` in `ℂ`.\n* `New.Period.IsKilledBy`: `T` is potentially\
        \ crystalline and the polynomial `P` kills\n  `New.Period.linearFrob ρ s k`, the `Bmax`-linear extension\
        \ of `φ ^ k s ⊗ ρ s` from `Dpcris`.\n* `New.IsFrob`: `σ` stabilises the valuation subring `A` and `σ • x\
        \ ≡ x ^ q` modulo the maximal\n  ideal for all `x ∈ A`.\n\n## Relation to the literature\n\nKnown result:\
        \ Characters with finite image on inertia are potentially crystalline of weight 0. Only\nthe potentially\
        \ unramified case of the theorem on locally algebraic characters is covered, together\nwith the jumps and\
        \ the action of Weil elements. The period is a solution of Lang's equation for GL_1\nin A_inf with coefficients,\
        \ and no Lubin–Tate theory is used. Source: B. Conrad, Lifting global\nrepresentations with local properties\
        \ (preprint 2011), Appendix B; J.-P. Serre, Abelian l-adic\nrepresentations (1968), III, Appendix.\n\nSee\
        \ also `Lib.ClassField.Avatar.LocalGlobalCompatibility` and\n`Lib.PadicHodge.Crystalline.Regularity`.\n"
