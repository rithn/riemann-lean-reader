      text: 'Let Λ = `New.Lift.WittFq f` be the ring of Witt vectors of the field with p^f elements inside O^♭,

        with p implicit, and let θ be Fontaine''s map from A_inf to O_C. The group ℤ × Γ acts on O^♭, A_inf

        and W(C^♭), where (n, g) acts as φ^n j(g) and φ is the bijective Frobenius. A local field is given

        by `Γ : GroupOverGp p`, a group with a homomorphism j = `toGp` to `Gp p` of open image; the field is

        the subfield of ℚ̄_p fixed by the image. Every such field has a Kummer chart: a chart

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Kisin/KummerChartExistence.lean
      line: 12
      endLine: 33
      text: "S = Λ⟦z⟧ ⊂ A_inf with a subgroup Γ' of Γ of index prime to p, such that j(Γ') fixes Λ and θ(z) and\n\
        moves z to every [ε]^l z.\n\n## Main definitions and results\n\n* `New.Lift.wittToQpBar`: the restriction\
        \ of θ to Λ, with values in the algebraic closure of\n  `ℚ_[p]`; it is injective (`New.Lift.wittToQpBar_injective`).\n\
        * `New.Lift.FrobGroup`: the group ℤ × Γ, with Frobenius `New.Lift.FrobGroup.φ`.\n* `New.Lift.KummerChart`:\
        \ a Kummer chart; `New.Lift.KummerChart.IsUnramified`: it is unramified.\n* `New.Lift.exists_kummerChart`:\
        \ every such field has a Kummer chart, with ef the degree of the\n  field.\n\nNotions from other files:\n\
        * `New.Period.OFlat`: The ring O^♭, the inverse limit of O_C/p along x ↦ x^p, where O_C is the ring\n  of\
        \ integers of C_p.\n* `New.Lift.Chart`: A Λ-algebra map Λ[[X]] → A_inf with image S, sending X to a non-unit\
        \ Teichmüller\n  lift z and a series X^e A + p, A a unit, to an element E that generates ker θ.\n\n## Relation\
        \ to the literature\n\nKnown; see `Lib.PadicHodge.Kisin.PeriodMatrixFrame` and `Lib.PadicHodge.PeriodRings.DeRhamPeriods`\n\
        for sources.\n"
