      text: "It defines the ring S_B of a chart, the elements of B^+ whose multiplication commutes with all\n`S`-linear\
        \ maps of B^+ that keep `amaxImage`. It shows that S_B is the closure of `S[E/p]` with `p`\ninverted, and\
        \ that every `S`-linear map of A_inf extends to an S_B-linear map of B^+ that keeps\n`amaxImage`. Most identities\
        \ for the extensions are checked on A_inf by a density principle: an\nadditive map of B^+ that keeps `amaxImage`\
        \ and kills A_inf is zero\n(`New.Lift.Chart.eq_zero_of_map_ainfToBPlus_eq_zero`). The file ends with results\
        \ on divisibility\nby `z` in B^+.\n\n## Main definitions and results\n\n* `New.Lift.Chart.bicommutant`:\
        \ the ring S_B of the elements of B^+ whose multiplication commutes\n  with all S-linear maps B^+ → B^+\
        \ that keep the image of A_max.\n* `New.Lift.Chart.extendToBPlus`: an S-linear map of A_inf extends to an\
        \ S_B-linear map of B^+\n  keeping the image of A_max.\n\nNotions from other files:\n* `New.Period.Amax`:\
        \ Colmez's period ring A_max, the p-adic completion of A_inf[X]/(pX − ξ).\n* `New.Period.FrobGal`: The monoid\
        \ ℕ × G_p; the pair (n, g) acts on A_inf as φ^n g.\n* `New.Lift.Chart.S`: the ring `S`, the image in A_inf\
