      text: "\n## Main definitions and results\n\n* Tilting for a ring `R` in which `p` is not a unit. `New.Variety.tiltMap`\
        \ makes Mathlib's\n  `PreTilt R p` functorial. For `p`-adically complete `R`, the untilt `x ↦ x^♯` and Fontaine's\
        \ `θ`\n  are natural in `R` (`New.Variety.untilt_tiltMap`, `New.Variety.fontaineTheta_map_tiltMap`). Both\n\
        \  are onto if `R` is absolutely integrally closed\n  (`New.Variety.fontaineTheta_surjective_of_isAbsIntegrallyClosed`).\
        \ The tilt of a `p`-adically\n  complete valuation ring is a valuation ring.\n* The Galois group `New.Gp`\
        \ of `ℚ̄_p / ℚ_p` and its cyclotomic character `New.cyclotomicGp`.\n* The continuous isometric action of\
        \ `New.Gp` on `ℂ_p` (`New.completionAction`), which restricts\n  to an action by ring automorphisms on the\
        \ ring of integers `New.OC`.\n* `O_C` is `p`-adically complete and absolutely integrally closed, with `O_C[1/p]\
        \ = ℂ_p`.\n* `New.Period.ax_mem_closure_fixedField`: Ax's theorem; an element fixed by a subgroup `J` is\
        \ a\n  limit of algebraic elements fixed by `J`.\n* `New.Period.exists_algebraic_of_fixed_near_one`: an\
        \ element fixed by a neighbourhood of `1` is\n  algebraic.\n\nNotions from other files:\n* `New.cyclotomicChar`:\
