      text: 'The period ring `B = B⁺[1/μ]` (`New.Period.Bmax`, `New.Period.BPlus`) lies inside `B_dR`, and `φ`

        denotes its Frobenius. This file shows that bounded poles of the `φ^n y` control the denominators

        of `y` in `μ`, and that a `φ`-fixed element of `B` lying in `B_dR⁺` is in `ℚ_[p]`. Using charts

        (`New.Lift.Chart`), it shows that a ratio of two periods that is fixed by an open subgroup of `G_p`

        lies in `W(𝔽_q)[1/p]` for some `q`.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Crystalline/FixedRatios.lean
      line: 12
      endLine: 32
      text: "\n## Main definitions and results\n\n* `New.Period.pow_smul_mem_range_BPlus`: if the image of `φ^n(y)`\
        \ in `B_dR` lies in\n  `t^(−a)B_dR⁺` for every `n ≥ 0`, then `ν^a y` lies in the image of `B⁺` for every\
        \ `ν` in `A_inf`\n  divisible by `μ`.\n* `New.Period.Bmax.exists_padic_eq_of_frobEnd_fixed`: kernel in the\
        \ fundamental exact sequence: an\n  element `y` of `B` with `φ(y) = y` whose image in `B_dR` lies in `B_dR⁺`\
        \ belongs to `ℚ_[p]`.\n* `New.Period.exists_pow_mul_eq_wittFq_mul_of_isChartOf`, `New.Period.Bmax.exists_witt_ratio`:\
        \ a\n  ratio of two periods that is fixed by an open subgroup of `G_p` lies in `W(\U0001D53D_q)[1/p]` for\
        \ some\n  `q`, for a given chart and in general.\n\nNotions from other files:\n* `New.Period.BdRPlus`: the\
        \ ξ-adic completion of B⁺, with fraction field `New.Period.BdR`.\n* `New.Period.BPlus`, `New.Period.Bmax`:\
        \ B⁺ = A_max[1/p] and B = B⁺[1/μ], μ = [ε] − 1.\n* `New.Lift.Chart.bicommutant`: the S-algebra S_B of the\
        \ y in B⁺ whose multiplication commutes with\n  every S-linear endomorphism of B⁺ that keeps the image of\
        \ A_max.\n\n## Relation to the literature\n\nKnown; see `Lib.PadicHodge.Crystalline.Regularity` for sources.\n"
