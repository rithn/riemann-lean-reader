      text: "\nHere `π` is `WittVector.constantCoeff`, the reduction `A_inf → O^♭` modulo `p`, `ainfToBPlus` is\
        \ the\nmap `A_inf → B⁺`, and `(n, g)` in `New.Period.FrobGal` acts as `φ ^ n g`.\n\nNotions from other files:\n\
        * `New.Lift.Chart.E`: The image in S of the series X^e A + p; it equals ξ times a unit of A_inf.\n* `New.Lift.Chart.bicommutant`:\
        \ The S-subalgebra S_B of those y in B⁺ whose multiplication commutes\n  with every S-linear endomorphism\
        \ of B⁺ that maps `New.Period.amaxImage` into itself.\n* `New.Period.tau`: The element τ = [ε^{1/p}] − 1\
        \ of A_inf, where the brackets denote the\n  Teichmüller lift.\n* `New.Lift.Chart.S`: For a chart, the Λ-subalgebra\
        \ S of A_inf that is the image of the chart's map\n  Λ[[X]] → A_inf.\n* `New.Lift.Chart`: A chart: a Λ-algebra\
        \ map Λ[[X]] → A_inf, Λ = W(F_{p^f}), sending X to a non-unit\n  Teichmüller lift z = [u] and a series X^e\
        \ A + p, A a unit, to ξ times a unit.\n\n## Relation to the literature\n\nKnown result: Kisin lattice (Breuil–Kisin\
        \ module) of a crystalline lattice. Only existence is proved\nhere, of a frame over A_inf with a Frobenius\
        \ matrix over S, which spans the crystalline periods up\nto powers of E. Finite height is not stated, and\
        \ there is no equivalence of categories. The proof\nworks directly by linear retractions onto the Breuil–Kisin\
        \ ring, without slope theory or étale\nφ-modules. Source: M. Kisin, Crystalline representations and F-crystals,\
        \ Progr. Math. 253 (2006),\n459–496; Bhatt–Morrow–Scholze, Integral p-adic Hodge theory, Publ. IHÉS 128\
        \ (2018), 4.26–4.34;\nCais–Liu, On F-crystalline representations, Doc. Math. 21 (2016).\n"
