      text: 'The radius lemma for a chart (`New.Lift.Chart`): a subring S of A_inf, the image of Λ⟦X⟧, where

        Λ = W(𝔽_{p^𝔣}) are the constants; the image z of X is a Teichmüller lift, and E = z^e·(unit) + p is

        an associate of ξ. Further A = `New.Period.Amax`, B⁺ = A[1/p] = `New.Period.BPlus`, φ is the

        Frobenius, and t is a Galois element with `c.FixesThetaZ t`.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/RadiusLemma.lean
      line: 10
      endLine: 36
      text: "\n* `New.Lift.Chart.exists_E_pow_mul_eq_tau_pow_mul_iff`: A_inf[1/τ] ∩ S_B[1/E] = S.\n* `New.Lift.Chart.tau_mul_z_dvd_smul_sub`:\
        \ τz divides ty − y in B⁺ for every y in S_B.\n* `New.Lift.Chart.radius_lemma`: if tz = [ε]z, Z has entries\
        \ in S_B with Z'·Z = E^h and tZ = Z·G for\n  some G over A_inf, and 3e ≤ p^l, then φ^l(Z) = φ^l(E)^b·C·V\
        \ with C constant and V invertible over\n  A (`New.Lift.Chart.IsRadiusFactorization`).\n\nNotions from other\
        \ files:\n* `New.Period.tau`, `New.Period.mu`, `New.Period.xi`: the elements τ = [ε^{1/p}] − 1, μ = [ε]\
        \ − 1\n  and ξ of A_inf, with ξτ = μ; `New.Period.theta` is Fontaine's map θ : A_inf → O_C.\n* `New.Lift.Chart.ainfToBPlus`:\
        \ the structure ring homomorphism from A_inf to B⁺.\n* `New.Lift.Chart.bicommutant`: the S-subalgebra S_B\
        \ of the y in B⁺ whose multiplication commutes\n  with every S-linear endomorphism of B⁺ that preserves\
        \ the image of A. It contains p⁻¹ and is the\n  p-adic closure of S[E/p] with p inverted (`New.Lift.Chart.adjoinEDivPClosure_eq_bicommutant`).\n\
        * `New.Lift.Chart.FixesThetaZ`: `c.FixesThetaZ t` says that t fixes the constants Λ and θ(z).\n\n## Relation\
        \ to the literature\n\nKnown result: Dwork's trick, giving an integral crystalline comparison with a uniform\
        \ denominator.\nHere `radius_lemma` gives φ^l(Z) = φ^l(E)^b·C·V, with C fixed by every g that fixes Λ and\
        \ V\ninvertible over A_max. Whenever e·A ≤ p^l·δ, the y with Vy natural modulo E^A span at least\np^{4δ}S^d.\n\
        Source: M. Kisin, Crystalline representations and F-crystals, Progr. Math. 253 (2006), Lemma 1.2.6;\nM.\
        \ Kisin, Potentially semi-stable deformation rings, JAMS 21 (2008), Lemma 2.2; B. Bhatt,\nP. Scholze, Prismatic\
        \ F-crystals and crystalline Galois representations (2023), proof of Thm 5.6.\n\nSee also `Lib.PadicHodge.Kisin.PeriodMatrixFrame`.\n"
