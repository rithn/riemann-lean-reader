      endLine: 12
      text: 'For a Kummer chart `k : New.Lift.KummerChart Γ` there is a ring S ⊂ A_inf, the image of Λ⟦X⟧ with

        Λ = W(𝔽_{p^f}), and a subgroup Γ'' of Γ. Kisin modules are defined inside `L.Ambient = W(C^♭) ⊗ L`

        for a lattice L with prescribed jump sets. The objects are functorial in L and compatible with

        Frobenius and with Γ''. They split according to the letters `i ∈ 𝔽_{p^f}ˣ`, on which the root of

        unity ζ of the coefficients acts as the Teichmüller lift `ω i = letterTeich i`.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Kisin/Modules.lean
      line: 13
      endLine: 57
      text: "\n## Main definitions and results\n\n* `New.Lift.KummerChart.Letter`: the letters, the units i of \U0001D53D\
        _{p^f}. For coefficients O with\n  ζ^(p^f − 1) = 1 (`New.Lift.KummerChart.Coeffs`), the letter i cuts out\
        \ the part\n  `New.Lift.KummerChart.JumpLattice.letterPart` where ζ = [i].\n* `New.Lift.KummerChart.JumpLattice`:\
        \ a lattice L, crystalline over Γ', with a finite set\n  `jumpSet i` of integers for each letter that holds\
        \ its jumps at the embeddings above i.\n* `New.Lift.KummerChart.JumpLattice.forms`: forms, A_inf-linear\
        \ maps to B_dR that are Γ'-equivariant\n  on 1 ⊗ L.\n* `New.Lift.KummerChart.JumpLattice.kisinAinf`, `New.Lift.KummerChart.JumpLattice.kisinModule`,\n\
        \  `New.Lift.KummerChart.JumpLattice.kisinLoc`: an A_inf-module cut out by forms, the Kisin module N,\n\
        \  and N with all φ^a E inverted.\n* `New.Lift.KummerChart.JumpLattice.mem_letterPart_iff_letterProj`,\n\
        \  `New.Lift.KummerChart.JumpLattice.sum_letterProj`: `e i = letterProj i` projects onto the letter\n  `i`,\
        \ and the `e i` sum to the identity.\n* `New.Lift.KummerChart.JumpLattice.exists_span_formsOfType_mod_pred`:\
        \ the functionals of type `u`\n  at `i`, modulo those of type `u - 1`, are spanned over Q̄_p by at most\
        \ `L.jumpMultiplicity i u` of\n  them.\n* `New.Lift.KummerChart.JumpLattice.formsOfType_subset_pred_of_notMem`:\
        \ if `n ∉ L.jumpSet i`, the\n  functionals of type `n` at `i` are of type `n - 1`.\n\nNotions from other\
        \ files:\n* `New.Lift.KummerChart`: a chart Λ⟦X⟧ → A_inf (ring `S`, element `E` generating ker θ,\n  `frobE\
        \ a` = φ^a(E)) together with a subgroup Γ' of Γ whose fixed field it belongs to.\n* `New.Lift.GalLattice`:\
        \ a finite free O-module with an O-linear representation of Γ.\n* `New.Period.WittCFlat`: the ring W(C^♭)\
        \ of p-typical Witt vectors over the fraction field C^♭ of\n  the tilt O^♭ of the ring of integers of C_p.\n\
        * `New.Period.overZp`: a representation of Γ on a module T over a Z_p-algebra R, regarded as a\n  Z_p-linear\
        \ representation.\n* `New.Period.jump`: the multiplicity of a Hodge–Tate jump u of a representation at an\
        \ embedding γ\n  of the coefficients into ℂ_p.\n\n## Relation to the literature\n\nKnown result: Hodge–Tate\
        \ weights of Kisin modules. This is the analogue, for the Kisin module of one\nKummer chart inside A_inf,\
        \ of the statements on Wach modules in the literature. This file proves\nonly the bounds on the weights,\
        \ not that the Galois action is trivial modulo the variable. It holds\nper unramified embedding of the coefficients,\
        \ and it gives only upper bounds by the multiplicity of\neach jump.\nSource: L. Berger, Limites de représentations\
        \ cristallines, Compositio Math. 140 (2004), 1473–1498,\n§III; N. Wach, Représentations p-adiques potentiellement\
        \ cristallines, Bull. SMF 124 (1996),\n375–400.\n\nSee also `Lib.PadicHodge.Kisin.PeriodMatrixFrame`.\n"
