      path: grh/src/Lib/PadicHodge/Crystalline/HodgeTateJumps.lean
      line: 6
      endLine: 11
      text: 'This file works with the period ring B_dR⁺, its uniformiser `t` and its residue map θ to ℂ_p. An

        invertible matrix `U` of de Rham periods with `N g · g U = U` for `g` near 1 is brought into the

        form `New.Period.hodgeMatrix W k` by an algebraic change of basis, and the columns of θ(W) are then

        Hodge–Tate vectors. From this the file builds Hodge–Tate frames of potentially crystalline

        representations, counts their jumps, and computes the jumps under base change, restriction of

        scalars, twists, duals and submodules of products.

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Crystalline/HodgeTateJumps.lean
      line: 12
      endLine: 52
      text: "\n## Main definitions and results\n\n* `New.Period.exists_isHodgeFrame`: an invertible `U` over B_dR\
        \ with `N g · g U = U` becomes\n  `hodgeMatrix W k`, with `W` invertible over B_dR⁺, after an algebraic\
        \ change of basis of\n  determinant 1.\n* `New.Period.IsPotentiallyCrystalline.exists_isHodgeTateFrame`:\
        \ there is an invertible `P` over\n  `ℂ_[p]` whose columns are Hodge–Tate vectors of weights `k` (`New.Period.IsHodgeTateFrame`);\
        \ the\n  `k i` are the jumps, and the rows of `P⁻¹` form a basis of Hodge–Tate maps\n  (`New.Period.hodgeTateMaps`).\n\
        * `New.Period.IsPotentiallyCrystalline.exists_hasJumps`: the number of jumps is the rank.\n* `New.Period.jump_baseChange`,\
        \ `New.Period.IsPotentiallyCrystalline.sum_jump_eq_jump_overZp`:\n  extension, restriction of scalars.\n\
        * `New.Period.jump_twist_of_period`, `New.Period.jump_twist_cyclotomicGp`,\n  `New.Period.hasJumps_of_cyclotomicGp_zpow`:\
        \ twists shift jumps.\n* `New.Period.exists_jump_of_jointly_injective`: a jump of a submodule of ∏ S_i is\
        \ a jump of some\n  S_i.\n\nNotions from other files:\n* `New.Period.BdRPlus`, `New.Period.BdR` (built for\
        \ the prime p fixed by the instance `ThePrime p`,\n  hence written without `p`): the discrete valuation\
        \ ring B_dR⁺, with uniformiser `t`\n  (`New.Period.tPeriod`) and residue map θ to ℂ_p (`New.Period.thetaBdR`),\
        \ and its fraction field\n  B_dR.\n* `New.cyclotomicGp`: The p-adic cyclotomic character χ of G_p = Gal(Q̄_p\
        \ over Q_p) (`New.Gp`);\n  `New.Period.χ` is its composite with `toGp : Γ → G_p`, the map supplied by the\
        \ class `OverGp Γ p`;\n  the \"open image\" of `toGp` assumed in the lemmas comes with this class.\n* `New.Period.nearOne`:\
        \ The filter 'near 1' on Γ: the pull-back along `toGp` of the filter of\n  neighbourhoods of the identity.\n\
        * `New.Period.IsPotentiallyCrystalline`: ρ is potentially crystalline: the vectors of Bmax ⊗ T (Bmax\n \
        \ the crystalline period ring B_max, a ℤ_p-algebra on which G_p acts) fixed by `toGp g ⊗ ρ g` for\n  `g`\
        \ near 1 span Bmax ⊗ T.\n* `New.Period.hodgeTateMaps`, `New.Period.jump`: the space of γ-semilinear forms\
        \ f on T with f(g\n  x) = χ(g)^(−u) · g f(x) for g near 1, and its dimension, the multiplicity of the jump\
        \ u.\n* `New.Period.overZp`: A representation of Γ on a module T over a Z_p-algebra R, regarded as a\n \
        \ Z_p-linear representation.\n* `New.Period.HasJumps`: The property of a multiset J of integers that for\
        \ every integer u the\n  multiplicity of the jump u of T at γ equals its count in J.\n\n## Relation to the\
        \ literature\n\nKnown; see `Lib.PadicHodge.Crystalline.Regularity` for sources.\n"
