      text: 'This file concerns a representation `ρ` of a group `Γ` on an `R`-module `T`. The group `Γ` carries
        a

        homomorphism `j` (the field `toGp` of `New.Period.OverGp`) with open image in the Galois group

        `New.Gp p` of `ℚ_[p]`. Tensor products are over `ℤ_[p]` and the period ring is `New.Period.Bmax`;

        the class `ThePrime p` makes `p` a prime (it supplies the `Fact p.Prime` needed by `OverGp`).

        '
    remainder:
      path: grh/src/Lib/PadicHodge/Crystalline/Basic.lean
      line: 11
      endLine: 41
      text: "\n\"Near `1`\" means along the filter `New.Period.nearOne`, which takes the place of passing to a finite\n\
        extension. Let `B` be a `ℤ_[p]`-algebra with an action of `New.Gp p`. The diagonal action\n`New.Period.tensorAction`\
        \ of `g` on `B ⊗ T` is `j(g) ⊗ ρ(g)`. For a filter `F` on `Γ`,\n`New.Period.fixedPeriods ρ B F` is the set\
        \ of elements of `B ⊗ T` fixed by the diagonal action for\n`F`-almost all `g`. `New.Period.IsAdmissible\
        \ ρ F` says that for `B = Bmax` this set spans `B ⊗ T`\nover `B`.\n\n## Main definitions and results\n\n\
        * `New.Period.IsCrystalline`, `New.Period.IsPotentiallyCrystalline`: the vectors of `Bmax ⊗ T` fixed\n \
        \ by `Γ`, or fixed near `1` (`New.Period.Dpcris`), span `Bmax ⊗ T`.\n* `New.Period.crysCocycles`: the functions\
        \ `Γ → T` that become coboundaries in `Bmax ⊗ T`.\n* `New.Period.hodgeTateMaps`, `New.Period.HasJumps`:\
        \ Hodge–Tate maps `T → ℂ_[p]` of weight `u` along\n  `γ : R → ℂ_[p]`, and the multiset of weights counted\
        \ with the dimensions of these spaces.\n* `New.Period.IsWeilPair`, `New.Period.linearFrob`, `New.Period.IsKilledBy`:\
