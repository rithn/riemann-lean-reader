      text: "The frame theorem `New.Lift.Chart.IsPeriodMatrix.exists_frame` for a period matrix `U`\n(`New.Lift.Chart.IsPeriodMatrix`)\
        \ over a chart with ring `S ⊂ A_inf`: the basis `Q`, `Z` of\n`New.Lift.Chart.IsPeriodMatrix.exists_basis`\
        \ is completed by partial inverses of `Q` and `Z`, a\nFrobenius matrix `B` over `S`, and the Galois action\
        \ on `Z`. The key point is `p ∤ det Q`; it rests\non\n\n* `New.Lift.Chart.exists_det_ne_zero`: a nonzero\
        \ determinant from a separating set of rows;\n* `New.exists_mulVec_eq_zero_and_forall_comp_eq`: Artin's\
        \ minimal support argument over a valuation\n  ring, applied to the reduction of `Q` modulo `p` over the\
        \ tilt `O^♭`.\n"
