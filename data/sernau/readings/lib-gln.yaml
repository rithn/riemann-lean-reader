        \ coefficient of `New.weylRep κ e` at a highest\n  vector is a product of the functions `New.weightMinors`,\
        \ products of principal minors.\n* `New.schur_orthogonality`: Schur's orthogonality relations on the compact\
        \ group U(n)^Φ.\n\nNotions from other files:\n* `New.schur`: The Schur matrix S_κ(z) of matrices z_τ of\
