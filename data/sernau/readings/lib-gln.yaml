      endLine: 11
      text: 'This file constructs the integral branching map from `GL(n + 1)` to `GL(n) × GL(1)` from its

        value at one point, proves its norm bound, and shows that it spans the maps that are equivariant

        for the unitary block group. Vectors are coordinates indexed by `New.WeylIndexFamily n κ`

        (standard fillings), and `New.schur κ z` is the matrix of `z` in these coordinates. `New.weylRep κ

        e` is its twist by `det ^ e` on invertible matrices, `New.weylNormSq` is the squared norm for the

        Gram matrix, and `New.GL.blockScalar ι g s` is the matrix `diag(g, s)`.

        '
    remainder:
      path: grh/src/Lib/GLn/Branching/IntegralMap.lean
      line: 12
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.SpansBranchingMaps`: a matrix spans the maps that are equivariant\
        \ for the unitary block\n  group.\n* `New.GL.exists_int_branching_of_weylKernel`: an integral equivariant\
        \ matrix from its value at one\n  point.\n* `New.exists_branching_matrix`: the branching map, its norm bound\
        \ and its uniqueness.\n\nNotions from other files:\n* `New.rankAt`: The number of elements of the finite\
        \ row type n_τ at the place τ;\n  `New.GL.rowEquivFin n τ : n τ ≃ Fin (rankAt n τ)` is the fixed numbering\
        \ of these rows, and a\n  row's position is its number.\n* `New.permArray`: For maps e_τ from rows to natural\
        \ numbers, the array over R whose entry at row\n  (τ,a), column i is 1 if e_τ(a)=i and 0 otherwise.\n* `New.toPoly`:\
        \ The linear map from coordinate vectors ξ to polynomials, ξ ↦ Σ_i (Gξ)_i b_i, with G\n  the Gram matrix\
        \ `New.weylGram` (`New.weylGramOver` is its image over another ring) and b_i the\n  basis `New.nablaBasis`\
        \ of products of minors; `New.GL.nablaCombination` is ξ ↦ Σ_i ξ_i b_i.\n* `New.weylEval`: For an array y,\
        \ the evaluation vector `ev_y` with entries b_i(y); its polynomial\n  under `New.toPoly` is `New.weylKernel\
        \ n κ y`.\n* `New.GL.branchVector`: the product of the leading minors to the powers `γ` with the new row\
        \ first\n  and to the powers `κ'` with the new row last.\n\n## Relation to the literature\n\nBranching from\
        \ GL(n+1) to GL(n) with multiplicity one. Here the branching map is given for one\ninterlacing pair as an\
        \ integer matrix that is equivariant over every field of characteristic 0 and\nsatisfies an explicit norm\
        \ bound, and every unitarily equivariant map is a multiple of it. That it\nis non-zero is not part of the\
        \ statement. Source: Goodman, Wallach 2009, Theorem 8.1.1;\nZhelobenko, Compact Lie Groups and their Representations,\
        \ 1973, ch. X; Molev, Gelfand-Tsetlin bases\nfor classical Lie algebras, arXiv math/0211289.\n"
