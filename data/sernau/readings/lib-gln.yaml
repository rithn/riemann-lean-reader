      text: " A colour map `c` assigns each row a place `τ`, and a weight `κ`\ngives the number `κ τ h` of columns\
        \ of height `h` at `τ`. `New.nabla R c l` consists of the `f` with\n`f(y b) = ∏ b(τ, i, i) ^ l(τ, i) · f(y)`\
        \ for upper triangular `b`, one matrix for each colour, and a\nchosen set of products of minors is taken\
        \ as its basis. The Weyl module is the dual module, written\nin the dual basis as `New.WeylIndexFamily n\
        \ κ → R`; `Lib.GLn.SchurModule.TensorModel` embeds it into\na tensor product of exterior powers. Left substitution\
        \ `f ↦ f(z y)` and the Fock pairing\n`⟨p, q⟩ = p(∂) q (0)` are the main tools. The rows of the Schur matrix\
        \ expand the substituted basis\nelements, so it acts on the Weyl module, and the Gram matrix is the coefficient\
        \ matrix of the kernel\n`New.weylKernel` in the basis.\n\n## Main definitions and results\n\n* `New.jet`,\
        \ `New.fockPairing`: the pairing `P(∂) F` at `0`, with power series and with polynomials;\n  `New.fockPairing_linSubst`\
        \ computes adjoints of linear substitutions.\n* `New.nabla`, `New.nablaFamily`: the semi-invariants under\
        \ upper triangular matrices acting on\n  columns.\n* `New.tableauPoly`, `New.IsTableauBasis`, `New.nablaBasis`:\
        \ products of minors, and a chosen basis\n  among them.\n* `New.schur`, `New.weylGram`, `New.weylEval`:\
        \ the matrix of `f ↦ f(z y)`, the Gram matrix and the\n  evaluation vectors in that basis.\n* `New.mem_nabla`,\
        \ `New.minor_mem_nabla`, `New.rowSubst_mem_nabla`: membership as an identity over\n  all algebras; minors\
        \ are members; left substitution `f ↦ f(z y)` (`New.rowSubst`) keeps the\n  weight.\n* `New.fockPairing_comm`,\
        \ `New.fockPairing_rowSubst`, `New.fockPairing_star_self_pos`: the pairing\n  `⟨p, q⟩ = p(∂) q (0)` is symmetric,\
        \ the adjoint of `New.rowSubst z` is substitution by the\n  transposes, and `⟨p̄, p⟩ > 0` for `p ≠ 0`.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.GLn.SchurModule.MinorBasis` for sources.\n"
