        \ `γ i ≤ l i - l (i + 1)` (truncated subtraction).\n  For antitone `l`, these are the `γ ≤ l` such that\
        \ `l - γ` interlaces `l`.\n* `New.GL.exists_bordering`: a filling that avoids `x` is lifted to one whose\
