      endLine: 17
      startOffset: 224
      endOffset: 1143
      text: 'The integral representations of `∏_τ GL(n_τ)` act on lattices with bases of products of minors, and

        a weight `κ` counts the columns of each height. For the reversed weight `κ''_τ(h) = κ_τ(|n_τ| - h)`,

        the representation of weight `κ` composed with `g ↦ g⁻¹ᵀ` is that of weight `κ''` twisted by a power

        of the determinant, through a unimodular, isometric, equivariant integer matrix. With this matrix,

        the representation of mixed weight with positive part `kp` and negative part `km` embeds integrally

        into the tensor product of the representation of weight `kp` with that of weight `km` composed with

        `g ↦ g⁻¹ᵀ`. For a splitting `ε : N ⊕ m ≃ n` of the letters, this embedding sends the Cartan product

        of vectors of weights `kp` and `km` to their tensor, and the squared norm of the product is

        multiplicative. Finally, the representations of `GL n` with parameters `l` and `-l` are paired

        invariantly by an integer matrix.'
    remainder:
      path: grh/src/Lib/GLn/Dual.lean
      line: 17
      endLine: 56
      startOffset: 1143
      endOffset: 3820
      text: "\n\n## Main definitions and results\n\n* `New.GL.exists_star_matrix`: the product of the Hodge stars\
        \ of the columns, a signed bijection\n  between basis tensors that replaces each column by its complement.\n\
        * `New.GL.exists_int_duality_matrix`: the integer matrix by which the star maps one Weyl module to\n  the\
        \ other.\n* `New.GL.IsDualIsometry`, `New.exists_isDualIsometry`: this matrix is unimodular, isometric and\n\
        \  equivariant; `New.exists_dual_isometry` states these properties as one conjunction.\n* `New.GL.MixedCartanEmbedding`:\
        \ the integer matrix of the embedding and the four properties asked\n  of it; `New.GL.weylEvalAt` is the\
        \ evaluation vector at the array `New.permArray` of a map of rows.\n* `New.mixedWeight`: the weight with\
        \ `kp τ i + km τ (card n - i)` columns of height `i`.\n* `New.nonempty_mixedCartanEmbedding`, `New.mixedCartan`:\
        \ such an embedding exists for this weight,\n  and a chosen one.\n* `New.Rows.cartanProduct`: the product;\
        \ `New.Rows.mixedCartan_mulVec_cartanProduct`: `mixedCartan`\n  sends it to the tensor of the factors.\n\
        * `New.exists_isDualPairing_of_isHCParam`: the pairing is invariant and computes `New.ofAlgForm` at\n  `-l`.\
        \ It is invertible up to the hook number. It is isometric for the Gram norms `New.weylNormSq`.\n\nNotions\
        \ from other files:\n* `New.permArray`: For maps e_τ from rows to natural numbers, the array over R whose\
        \ entry at row\n  (τ,a), column i is 1 if e_τ(a)=i and 0 otherwise.\n* `New.nablaFamily`: The module of\
        \ Borel semi-invariant polynomials of weight `New.diagramWeight`,\n  in which `New.nablaBasis` gives coordinates\
        \ (`New.sum_coords_nablaBasis`).\n* `New.weylRep`: The monoid homomorphism from ∏_τ GL(n_τ,R) to square\
        \ matrices sending g to ∏_τ\n  det(g_τ)^{e_τ} times the Schur matrix of g, for integers e_τ.\n* `New.schur`:\
        \ The Schur matrix S_κ(z) of matrices z_τ of size n'_τ×n_τ. Row i holds chosen\n  coordinates of b'_i(zy)\
        \ in the family b_j(y)·∏_τ det(y_τ)^{d_τ}. Here b'_i and b_j are the\n  standard basis polynomials in the\
        \ rows n' and n, and d is given by `New.schurDetExp`.\n* `New.weylEval`: The vector of values of the basis\
        \ minor products at an array y.\n\n## Relation to the literature\n\nKnown result: Dual of a Weyl module\
        \ by Jacobi's complementary minors, and the Cartan component. Here\nthe results are stated for products\
        \ of GL_n. The duality and the Cartan map are given by integer\nmatrices that are isometric and equivariant\
        \ over fields of characteristic 0. The duality has an\nintegral inverse and the Cartan map has an integral\
        \ left inverse. Source: Fulton, Harris,\nRepresentation Theory, 1991, section 15.5; Jantzen 2003; for Jacobi's\
        \ identity, Grinberg, An\nIntroduction to Algebraic Combinatorics, Thm 6.4.48.\n"
