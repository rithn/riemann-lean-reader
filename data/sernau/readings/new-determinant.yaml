        \ a path datum.\n* `New.Data.exists_squareLaw_grid_hasAbsUpToNormPower`: the exchange\n  `New.Exchange.one_square_identity_of_isEdgeFamily`\
        \ on a square of a grid, with a constant\n  `κ / c ϑ` whose denominator has, up to a power of the norm,\
        \ the absolute value\n  `New.Data.turnRatio`.\n* `New.Data.TransfersPeriods`: path data pass forwards, and\
        \ proportionality of periods passes\n  backwards.\n* `New.Data.exists_transfersPeriods_off_diagonal`: a\
        \ turn off the diagonal transfers periods.\n\nNotions from other files:\n* `New.Data.GridNode`: a triple\
        \ `(z, a, b)`, the node `Y^a_b` if `z = false` and `Ỹ^b_a` if\n  `z = true`. Its index set is `D.NodeIndex`,\
        \ which is `D.GridIndex z a b`.\n* `New.Data.EdgeTuple`: a matrix over the residue ring modulo `gridModulus\
        \ ϑ` for each pair of\n  nodes. The modulus is that of the twist `ϑ` times a power of the product of the\
        \ chosen places. A\n  `New.Data.NodeFamily` is an invertible matrix `g q` for each node `q`; it takes the\
        \ matrix `S e`\n  on an edge `e = (p, q)` to `(g q)⁻¹ * S e * g p`. It is admissible (`New.Data.IsAdmissibleFamily`)\n\
        \  if at each of the two starting nodes it lies in the level of the node and at each node\n  `(true, a,\
        \ a)` it is `g ⊕ 1` for its element `g` at `(false, a, a)`.\n* `New.Data.IsPathDatum N w`: a function of\
