      text: "\nIn comments, `d` is the dimension `D.targetDim` of the target `D.targetForms`, the space of good\n\
        forms on `Y₀ = D.spaceY 0`. The letters `x, x₁, b, a, m, k, t, f` are the numbers `D.x`, `D.x₁`, …\nof the\
        \ data `D`; inequalities between them come from `New.Data.le_of_hasLogBound`.\n\nNotions from other files:\n\
        * `D.targetLattice`: the target forms as a twisted lattice, with the lifts `Θ_ξ = D.Θ ξ` indexed by\n  the\
        \ `m`-fold twists `ξ`; the modulus `Q(ξ)` has norm `ξ.normQ`.\n* `D.chainDeterminant ξ` is `Z(ξ) = det (Θ_ξ*\
        \ Θ_ξ)`, and `D.liftDeterminant ξ j` is `Z_j(ξ ^ j)`,\n  the same determinant for the `j`-th single lift.\n\
        * `HeightLe c y`: the family `y` of complex numbers, one for each pair `ι` of a prime `l` and an\n  isomorphism\
        \ `ℂ ≃ ℚ̄_l` (`PrimePadicIso`), has height at most `c`.\n* `D.HasSmallRatios θ`: the `m`-fold twists `ξ_ι\
        \ = θ ι` have `Nm Q(ξ_ι)` prime to the prime of `ι`\n  and inverse ratios of Hecke values of height at most\
        \ `x₁`.\n"
