    excerpt:
      path: grh/src/New/Determinant/Exchange/TheoremForPartners.lean
      line: 8
      endLine: 14
      text: 'The exchange identity compares the theta integrals to U(W) from two spaces of complementary ranks.

        For matched functions at the ramified places of a tame character, it holds with a constant whose

        absolute value is expressed, up to a factor free of the character, through L-values and the ratio

        `New.Exchange.equalRankThetaRatio`. This ratio is the squared absolute value of the theta integral

        in equal rank, divided by the product of L-values `L_*` at half the rank of the space. For a

        suitable Schwartz vector it is a nonzero constant that does not depend on the character. Together

        these give the exchange theorem for finite data given by functions on matrices over `O_E / 𝔪`.

        '
    remainder:
      path: grh/src/New/Determinant/Exchange/TheoremForPartners.lean
      line: 15
      endLine: 59
      text: "\n## Main definitions and results\n\n* `New.Exchange.exchange_of_matches`: the exchange identity, with\
        \ the constant measured by\n  `New.Exchange.lValueProdInt` and `New.Exchange.equalRankThetaRatio`.\n* `New.Exchange.exists_equalRankThetaRatio_eq_const`:\
        \ the value of that ratio on `H ⊕ W`, for `W` of\n  rank `2 k + 2 q` with `q` negative signs and `k ≤ μ`.\n\
        * `New.Exchange.exchange_theorem`, `New.Exchange.exchange_identity`: the exchange theorem, for one\n  choice\
        \ and for all choices of splitting characters.\n\nNotions from other files:\n* `New.PairFock E s t` is the\
        \ Fock space of real data for a pair of spaces with signs `s`, `t`. A\n  vector is a Schwartz vector (`New.Exchange.IsSchwartzVector`)\
        \ if all its moments `fockMoment N v`\n  are finite.\n* `New.Exchange.thetaIntegral S T a b f` is the function\
        \ g ↦ ∫ θ^{S,T}_{a,b}(f)(g,h) dh on U(S), the\n  integral of the theta kernel `New.pairTheta` over [U(T)].\
        \ `New.Exchange.thetaLarge` and\n  `New.Exchange.thetaSmall` are its cases for a datum v ⊗ Φ: Φ is read\
        \ at the ramified places of a\n  tame character, or Φ of the transpose is read at their conjugates.\n* `New.Exchange.SplitTameChar.semilocalChar`\
        \ is the character t ↦ ν(t/t̄) of ∏_{w∈S} E_w, t read as\n  an idele supported on S, extended by 0 to non-invertible\
        \ elements.\n* `New.Exchange.lValueProd` is the number `L_*(e)` = (∏_{w ∈ S} Nw)^(e²) · ∏_{z=1}^{e}\n  |L^S(z,\
        \ ν)|²; `New.Exchange.lValueProdInt` extends it to integers by `L_*(-e) = L_*(e)⁻¹`.\n* `υ` is the splitting\
        \ character of the Weil data, `upsilonU1` its restriction to the norm-one\n  ideles, and `rankTwist a n`\
        \ is the character `a υ ^ ⌊|n| / 2⌋` of [U(1)].\n* `AreMatched O σ χ Φ Ψ` says that `Φ` and `Ψ` are supported\
        \ on the last rows of `k⁻¹` and the first\n  columns of `k`, for `k` invertible over `O` and split by `σ`,\
        \ and differ there by `χ (det k)`.\n* `stdRowDatum σ χ z` and `stdColDatum χ z` are the standard functions\
        \ of an integral matrix `z`:\n  they send `x` to `χ⁻¹` of the determinant of `z` stacked on `x`, respectively\
        \ of `z * x`, and to\n  zero where this is not defined over the integers.\n* `localDatum S T v Φ r` is the\
        \ vector with real part `v`, the function `Φ` at the places that `r`\n  reads, and the vacuum elsewhere;\
        \ `modDatum S T \U0001D52A Φ v` is the same for a function `Φ` modulo `\U0001D52A`.\n\n## Relation to the\
        \ literature\n\nLet V and V' be hermitian spaces of type `New.Space` over a CM field with `New.WeilData`\
        \ whose ranks\nand negative signs add up to those of W, which has q negative signs, with 2q + 2 ≤ rk W and\
        \ rk\nV − rk V' = 2e ≥ 0, and let the weights μ satisfy rk W ≤ 2μ + 2q. Then theta integrals over U(V) and\n\
        U(V') agree on matched ramified data up to a nonzero constant c, so theta lifts can be exchanged.\nOnly\
        \ |c|² is given, up to an uncomputed factor: it is sized by the conductor and the Hecke L-values\nat 1,…,e.\
        \ Equal theta lifts of characters of complementary groups are known for trivial characters\n(Siegel–Weil)\
        \ and for O(3), O(1) to Mp(2). Related work: Snitz, Theta correspondence of automorphic\ncharacters, J.\
        \ Number Theory 122 (2007), arXiv math/0509486; Erez, Morphisms of global theta lifts\nof non-trivial automorphic\
        \ characters of orthogonal groups, arXiv 2401.13469, 2024; Gan–Qiu–Takeda,\nThe regularized Siegel–Weil\
        \ formula (second term identity) and the Rallis inner product formula,\n2014.\n"
