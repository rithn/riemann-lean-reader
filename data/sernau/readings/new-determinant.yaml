        chains along a row are injective on `V`. If the constants of the squares have prescribed moduli\n`L r k`,\
        \ the squares obey an adjoint law and the Gram forms of the first arrows are given, then the\nGram form\
        \ of a full chain and the modulus of its constant are computed by induction. In the\napplication `F i n`\
