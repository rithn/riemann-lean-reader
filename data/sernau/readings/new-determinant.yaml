      path: grh/src/New/Determinant/AuxiliaryForms/DeepLevelVanishing.lean
      line: 10
      endLine: 13
      text: 'A form `y` of level `J_M = D.chosenLevel` on a hermitian space `V` is zero if it is orthogonal to

        the restrictions of all forms of the deep level `J(𝔟)` on `V ⊕ ⟨1⟩`, translated by a suitable real

        point `ω`. This requires size conditions on the level and a lower bound for the pairing of the

        matrix coefficients for the parameter `l` of `V` and the parameter `l''` of `V ⊕ ⟨1⟩`.

        '
    remainder:
      path: grh/src/New/Determinant/AuxiliaryForms/DeepLevelVanishing.lean
      line: 14
      endLine: 59
      text: "\nEvery bound `S` of `‖y‖` is halved. The smoothing of `y` is its convolution with the translated\n\
        coefficient for `l'`; the point `ω` with the lower bound for the pairing comes from steepness, in\nthe proof\
        \ of `New.Data.exists_eq_zero_of_orthogonal_gridLevelForms`.\n\n1. Decay: `New.Exchange.integral_typeKernelMajorant_le`.\n\
        2. The cusp: `New.Exchange.norm_le_half_of_firstMinimum_lt`.\n3. A Poincaré series is a form, so its period\
        \ is zero:\n   `New.Exchange.poincare_period_translatedCoeff_eq_zero`.\n4. Unfolding shows that the smoothing\
        \ of `y` is small: `New.Exchange.norm_poincare_period_sub_le`\n   and `New.Exchange.norm_realConv_translatedCoeff_le`.\n\
        5. Undoing the smoothing: `New.Exchange.norm_le_half_of_le_firstMinimum`.\n\n## Main definitions and results\n\
        \n* `New.Exchange.HasDeepLevelSizes`: the size conditions. The real number `m` in them is at least a\n \
        \ power of `β` that absorbs all constants in the estimates.\n* `New.Exchange.eq_zero_of_petersson_translate_eq_zero`:\
        \ the criterion at a given real point;\n  `New.Exchange.exists_forall_eq_zero_of_petersson_restrict_eq_zero`\
        \ chooses the point place by\n  place.\n* `New.Data.exists_eq_zero_of_orthogonal_gridLevelForms`: the forms\
        \ of level `J(\U0001D51F)` on `Ỹ^0_0`,\n  restricted to `U(Y₀)` after translation by one real point, detect\
        \ every nonzero form of level\n  `J_M` on `Y₀`.\n\nNotions from other files:\n* `New.typeKernel`: `typeKernel\
        \ l s` is the product over the infinite places `w` of the formal\n  degree times the conjugate matrix coefficient\
        \ `(l w).dsCoeff` of the parameter `l w`.\n* `New.Space.IsForm`: `V.IsForm e F` says that `F` is automorphic,\
        \ bounded, and fixed by the right\n  convolution `New.realConv` with `e` over the real points (if `e` is\
        \ integrable).\n* `New.Space.firstMinimum`: the least norm of a nonzero vector of the lattice of a space,\
        \ cut off at\n  `1`; `V.move x` is the space `V` with its adelic frame multiplied by `x`.\n* `New.Data.principalForms`,\
        \ `New.Data.gridLevelForms`: the forms fixed by `D.chosenLevel`, and the\n  forms on `Ỹ^i_0` fixed by the\
        \ deep level, that is, the principal level of\n  `D.gridLevelGen = D.piM ^ D.natB`, where `D.piM * star\
        \ D.piM = D.M` is `M`.\n* `New.Data.spaceY`: the hermitian space `Y_j` with its adelic frame, chosen as\
        \ in\n  `New.Data.exists_space_isStd_of_le_and_gram_eq_of_lt`.\n* `(l w).HasLargeGap B`: the entries of\
        \ `l w = 2λ` are distinct, of the parity of `card n - 1`, and\n  entries of `λ` with different signs are\
        \ at least `500 n³ + B` apart; `dsCoeff` is the matrix\n  coefficient of the parameter and `dsKernel` its\
        \ conjugate times the formal degree.\n\n## Relation to the literature\n\nNonvanishing periods via Poincaré\
        \ series of deep level and restriction results of Burger–Sarnak type\nare known in the literature. Related\
        \ work: Prasad–Schulze-Pillot, Generalised form of a conjecture\nof Jacquet, 2008; Harris, Testing rationality\
        \ of coherent cohomology of Shimura varieties, 2014;\nMuić, Fourier coefficients of automorphic forms and\
        \ integrable discrete series, 2015.\n"
