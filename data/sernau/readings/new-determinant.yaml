      startOffset: 945
      endOffset: 3288
      text: "\n\n## Main definitions and results\n\n* `New.DescentPair.thetaLift`: the lift Θ_W from forms on W\
        \ to forms on V. It is the lift\n  `New.formLift` by the datum `New.DescentPair.fockDatum` of the highest\
        \ vector, read as an\n  algebraic form.\n* `New.Data.singleLift`: the lift Θ_{j,ξ} on `New.Data.principalForms`\
        \ on W_j. It is Θ_W for the\n  pair `New.Data.descentPair` when 1 ≤ j ≤ m and 0 otherwise.\n* `New.DescentPair.inner_thetaLift`:\
        \ `New.DescentPair.normalizedDescent` is adjoint to\n  `New.DescentPair.thetaLift`, for the Petersson product\
        \ on `W` and the class sum product on `V`.\n* `New.Data.coe_adjoint_singleLift`, `New.Data.normalizedDescent_eq_zero_iff`:\
        \ the adjoint of\n  Θ_{j,ξ} is the descent θ, so θ kills exactly the forms orthogonal to the lifts.\n* `New.Data.singleLift_injective`,\
        \ `New.Data.exists_hasSum_rallisTerm_inner_singleLift`: Θ_{j,ξ} is\n  injective, and its Gram form is a\
        \ constant `A` times the factor `New.DescentPair.gramFactor` of\n  the pair times the sum of the terms `New.Data.rallisTerm`.\n\
        * `New.Data.exists_hasSum_inner_singleLift`: the same Gram form as a constant `c` times\n  `New.DescentPair.twistFactor`\
        \ times the sum of the terms `cosetTerm`.\n\nNotions from other files:\n* `New.Data.descentPair`: the pair\
        \ of W_j, of rank r, and the definite space V_j, of rank r + t,\n  with the character χ_j ξ = `New.Data.liftChar`\
        \ of weight −κ_j and the places\n  `New.Data.levelPlaces`.\n* `New.Data.principalForms`: the forms of parameter\
        \ λ^Y (twice it is `New.Data.paramW`) and level\n  `J_M`, which is principal at the chosen places and maximal\
        \ elsewhere.\n\n## Relation to the literature\n\nFor every tame twist, the theta lift from U(W_j) to a definite\
        \ unitary group of much larger rank is\ninjective, and its Gram form is a non-zero twist-free constant times\
        \ an explicit count at the level\nand the twist's conductor times a sum of Hecke operators. The Rallis inner\
        \ product in the convergent\nrange, with small-support data giving injectivity at a level, is known in the\
        \ literature. Related\nwork: J.-S. Li, Non-vanishing theorems for the cohomology of certain arithmetic quotients,\
        \ 1992;\nCossutta–Marshall, Theta lifting and cohomology growth in p-adic towers, arXiv 1106.2765, 2011;\n\
        Rallis, Injectivity properties of liftings associated to Weil representations, 1984; Rallis,\nL-functions\
