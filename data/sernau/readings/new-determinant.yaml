  - sentence: Chain.SquareLaw develops linear algebra over a finite ring with a multiplicative character, relating
      functions on two matrix spaces through matched functions.
    citations:
    - module: New.Determinant.Chain.SquareLaw
      line: 4
      endLine: 14
  - sentence: "Under the specified matrix shapes, primitive additive and multiplicative characters, and an assumed square law, `Chain.SquareLaw` proves an identity between sums involving the Fourier transforms of the weights."
    citations:
    - module: New.Determinant.Chain.SquareLaw
      line: 18
      endLine: 21
    - module: New.Determinant.Chain.SquareLaw
      line: 477
      endLine: 493
  - sentence: "For a square satisfying `IsSquare`, `Exchange.OneSquare` proves that the down-then-up sum weighted by one function equals a possibly zero scalar times the up-then-down sum weighted by its matching function."
