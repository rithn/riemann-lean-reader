      text: "\n\n## Main definitions and results\n\n* `New.Rows.matchedPoly`: the explicit polynomial for the pair\
        \ of signs on `b` and on `n`.\n* `New.Rows.realPairWeil_stackedDetProd`, `New.Rows.realPairWeil_matchedPoly`:\
        \ the laws of\n  `New.Rows.stackedDetProd` and `New.Rows.matchedPoly` under the real Weil representation\n\
        \  `New.realPairWeil`.\n* `New.Rows.exists_mul_apply_eq_apply_matchedPoly`: the matching of `New.Rows.stackedDetProd`\
        \ with\n  `New.Rows.matchedPoly`.\n* `New.Rows.exists_stdClassSum_eq_mul_integral_modKernel`: a multiple,\
        \ possibly zero, of the class\n  sum equals a non-zero multiple of the integral over the group of the complementary\
        \ space.\n* `New.Rows.exists_mul_stdClassSum_eq_integral_modKernel`: the same identity divided by its non-zero\n\
        \  constant, with the characters absorbed into the kernels and a free character for `I_a`.\n\nNotions from\
        \ other files:\n* `New.GInf`: The archimedean unitary group G_∞ for signs s: one copy of the complex unitary\
        \ group\n  U(diag s) for each infinite place of E.\n* `New.PairFock`, `New.Fock.polyVector`, `New.realPairWeil`:\
        \ the Fock space of a pair of signs, the\n  vector in it attached to a polynomial, and the real Weil representation\
        \ of the pair on it.\n* `New.Rows.stackedDetProd`: The product over τ and k of the determinants of M_{τk}\
        \ stacked over the\n  variable matrix x_τ (`New.Rows.stackedDet`), columns ordered by e.\n* `New.AreMatched`:\
        \ Φ lives on the rows `a` of k⁻¹ and Ψ on the columns `b` of k, for k in GL_n(O),\n  and there the values\
        \ differ by the factor χ(det k). Here the subring O is always `⊤`.\n* `New.Exchange.lValueProd`: The number\
        \ (∏_{w ∈ S} Nw)^(e²) · ∏_{z=1}^{e} |L^S(z, ν)|², for a\n  natural number e.\n\n## Relation to the literature\n\
        \nA multiple of a theta kernel summed over a definite unitary group equals a kernel integrated over a\n\
        unitary group of no larger rank, with explicit determinant polynomials on both sides. The size of\nthe multiple\
        \ is given by Hecke L-values and the conductor up to one fixed factor, which may be zero.\nThe first term\
        \ identity between theta integrals of complementary spaces and the harmonic polynomials\ngiven by determinants\
        \ are known in the literature. Related work: Gan–Qiu–Takeda, The regularized\nSiegel–Weil formula, 2014\
        \ (after Kudla–Rallis, 1994; Ichino, 2004); Kashiwara–Vergne, On the\nSegal–Shale–Weil representations and\
        \ harmonic polynomials, 1978; Böcherer–Schulze-Pillot, Siegel\nmodular forms and theta series attached to\
        \ quaternion algebras, 1991.\n"
