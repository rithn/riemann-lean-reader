      endLine: 15
      text: 'This file proves the two commutation relations in the squares of the triangle of lifts and

        computes the adjoints of descents. With these, the lifts satisfy the conditions

        `New.Exchange.IsTriangle`. This file then compares the chain ι_ϑ (`New.Data.lowerChainAtLevel`)

        with the weighted chain of the triangle `z = false`. Here J_M is the principal level at the chosen

        places `New.Data.chosenPlace`, and Q is the product of the places of the twist ϑ. The weighted

        chain `New.Exchange.weightedChain` is the composite of the lifts `New.Data.triangleLift`, the n-th

        multiplied by N_n = `New.Data.triangleGLCard` false ϑ n, an order of GL over a residue ring.

        '
    remainder:
      path: grh/src/New/Determinant/Chain/ChainNorms.lean
      line: 16
      endLine: 61
      text: "\nThe node `(i, n)` of a triangle is the space of the interval `[i + 1, i + n]`: it has the stem and\n\
        the blocks `i + 1, …, i + n`. The nodes `(i, 0)` are the empty intervals; they carry the space at\n`(0,\
        \ 0)` negated `i` times. The lift `triangleLift` goes along a right pair and adds the last block.\nThe descent\
        \ `triangleTransposedLift` is a transposed lift along a left pair and removes the first\nblock; it stands\
        \ for the adjoint of the map that adds this block. The ascent `triangleReversedLift`\nis a transposed lift\
        \ along the reversed pair and adds the first block. The flag `z = false` selects\nthe chain Y₀, …, Y_m,\
        \ and `z = true` the second chain, which is untwisted, has blocks of length\n`t - 1` and starts from Y₀\
        \ plus a line.\n\n## Main definitions and results\n\n* `New.Data.exists_triangleLift_triangleTransposedLift_comm`,\n\
        \  `New.Data.exists_triangleTransposedLift_adjoint_comm`: the two commutation relations, with the\n  moduli\
        \ of their constants.\n* `New.Data.exists_isTriangle`: with suitable descents these data satisfy the conditions\n\
        \  `New.Exchange.IsTriangle`; for `z = false` also `New.Exchange.HasSquareModuli`, with the ratios of\n\
        \  Hecke values `New.Data.quotientRatio` as moduli.\n* `New.Data.inner_lowerChainAtLevel`: inner products\
        \ of lifts are a multiple of those along the\n  chain.\n* `New.Data.lowerChainAtLevel_injective`: ι_ϑ is\
        \ injective, because the chain is.\n\nNotions from other files:\n* `New.Data.RowIndex`, `New.Data.Y`: The\
        \ basis index set of Y₀: e₁, …, e_ϱ, the indices of X₀, a\n  middle vector, and e*₁, …, e*_ϱ. The basis\
        \ index set of Y_j: the block `RowIndex`, then j blocks\n  of t indices each.\n* `New.Data.MFoldTwist`:\
        \ a twist ϑ whose tame part ψ has ψ_wⁿ non-trivial for all places w in its\n  set Q and 1 ≤ n ≤ m.\n* `New.Data.chosenLevel`,\
        \ `New.Data.lastLevel`: The level J_M consists of the elements of\n  K₀ = `New.stdLevel` that are 1 modulo\
        \ the chosen places `New.Data.chosenPlace`. The level J_ϑ(Y_m)\n  on Y_m consists of those elements of J_M\
        \ that are block upper triangular modulo Q.\n* `New.Data.triangleModulus`, `New.Data.triangleGLCard`: the\
        \ modulus \U0001D52A of the triangle, and the\n  order of the general linear group of a node modulo \U0001D52A\
        . A lift times this order is the lift for the\n  measure that gives the principal level of \U0001D52A the\
        \ volume 1.\n* `New.Data.HasAbsUpToNormPower c f`: `‖c ϑ‖²` is `(f ϑ)²` times a constant, possibly zero,\
        \ and a\n  fixed integral power of the norm of Q.\n\n## Relation to the literature\n\nThe chain of m theta\
        \ lifts from U(Y_0) to the definite U(Y_m), mostly outside the range of Rallis's\nformula, is injective\
        \ at level J_M. On target forms its Gram form is that of a product of m Hecke\noperators times a scalar\
        \ whose modulus is a product of ratios of Hecke values. The norm and\ninjectivity of a single cuspidal theta\
        \ lift, also below Weil's range, are known in the literature.\nRelated work: Gan–Qiu–Takeda, Regularized\
        \ Siegel–Weil formula and Rallis inner product formula (Thm\n1.3), 2014; Bruinier–Funke, Injectivity of\
        \ the Kudla–Millson lift, 2010; He, Compositions of theta\ncorrespondences, 2005.\n"
