      endLine: 35
      text: "\n## Main definitions and results\n\n* `New.Data.columnPeriod`, `New.Data.rowPeriod`: the integrals\
        \ over the group of `S`.\n* `New.Data.isProportional_of_columnPeriod`, `New.Data.IsProportional.exists_rowPeriod_eq_mul`:\
        \ the\n  seesaws.\n* `New.Data.exists_columnLineKernel_eq`: reversing the line.\n* `New.Data.exists_transfersPeriods_of_turn`:\
        \ one turn, with the absolute value of its constant.\n* `New.Data.exists_transfersPeriods_first_last`: the\
        \ `m ^ 2` turns composed.\n\nNotions from other files:\n* `D.gridSpace 0 false a b` is the space `Y^a_b`\
        \ and `D.gridSpace 0 true a b` is `Ỹ^b_a`; their\n  bases are indexed by `D.GridIndex`.\n* `modKernel S\
        \ T a b \U0001D52A Ψ p` is the theta kernel of the pair `(S, T)` with characters `a`, `b` of\n  `[U(1)]`,\
        \ for a function `Ψ` on matrices modulo `\U0001D52A` and a polynomial `p`. On a space of rank `k`\n  the\
        \ character `a` gives the splitting character `New.AutChar.spaceChar`, the base change of `a`\n  times `υ\
        \ ^ (-k)`.\n* `D.GridForm false a b` holds the conjugate forms on `Y^a_b`, and `D.GridForm true a b` the\
        \ forms\n  on `Ỹ^b_a`. In sums over tuples of matrices, one for each edge, the letter `S` names the tuple.\n\
        * `IsProportional Γ Ψ Ξ`, written `Ψ ∝ Ξ`: the periods of `Ψ` on the path `Γ` are multiples of `Ξ`\n  by\
        \ numbers that depend neither on the twist nor on the forms.\n* `TransfersPeriods Γ' Γ k c`: path data `Ψ'`\
