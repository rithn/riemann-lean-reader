        \ Q` with `\U0001D51F = ϖ ^ D.natB`. For the twist `1` it is `\U0001D51F`\n  (`New.Data.gridModulus_one_ideal`).\n\
        * `New.Data.liftMove`, `New.Data.transposedMove`: the theta lift `(a, b) → (a + 1, b)` and the\n  transposed\
