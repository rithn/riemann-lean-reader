      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.Exchange.isForm_neg_iff_and_integral_neg`: passing to the\
        \ opposite signs (`G.neg`, the\n  identity on matrices) preserves forms of a given type and integrals over\
        \ the quotient, if it\n  matches the rational points of the two spaces.\n* `New.Exchange.exists_thetaLarge_thetaSmall_eq_circle_mul`:\
        \ triples of spaces with the same signs\n  have the same integrals `thetaLarge` and `thetaSmall`, up to\
        \ one translation and numbers of\n  modulus one.\n* `New.Exchange.RowColExchangeIdentity.cone`: the identity\
        \ descends along one plane of adapted\n  splittings, to the cone integral of the real vector, if `rk W`\
        \ is even and `rk V ≥ rk W / 2`;\n  `New.Exchange.RowColExchangeIdentity.dualCone` is the case `rk V < rk\
        \ W / 2`, on the other side of\n  Poisson's formula.\n* `New.Exchange.exists_rowColExchangeIdentity_removing_planes`:\
        \ the identity descends along the\n  planes of an adapted splitting, if `rk W` is even and `V'` has as many\
        \ more negative signs than\n  `V` as planes.\n\nNotions from other files:\n* `New.Exchange.RowColExchangeIdentity\
        \ W V U μ σ x y ℓ`: the real vectors `x`, `y` are Schwartz\n  vectors (all their weighted norms are finite),\
        \ and for every tame character `\U0001D520` of weight `μ` the\n  theta integrals `thetaLarge` over `[U(V)]`\
        \ and `thetaSmall` over `[U(U)]` are proportional on\n  standard data, with a factor `c` such that `D |c|\
        \ ^ 2` is\n  `lValueProdInt \U0001D520 (rk V - rk W / 2) * ℓ \U0001D520` for a constant `D` that does not\
        \ depend on `\U0001D520`. The\n  bijection `σ : b ⊕ r ≃ n` of the index sets of `U`, `V`, `W` orders the\
        \ rows of the standard data.\n* `New.Space.Splitting`: a decomposition V = (lE^p ⊕ kE^p) ⊥ iV₀ over E: isotropic\
        \ frames l, k with\n  l*Jk = 1, an isometry i from V₀ orthogonal to both, and rk V = rk V₀ + 2p.\n* `New.Exchange.realSlice\
