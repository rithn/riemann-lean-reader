      endLine: 46
      startOffset: 492
      endOffset: 3237
      text: "\n\n## Main definitions and results\n\n* `New.Data.exists_isSteep`: for one numbering of the indices,\
        \ the parameter of `Y₀` (`z = false`)\n  and minus that of `Ỹ^0_0` (`z = true`) satisfy `New.DiscreteSeries.IsSteep`\
        \ at every infinite\n  place `τ`. That is, the highest weight `New.HCParam.lowestKType` of the lowest `K`-type\
        \ vanishes\n  on a block of indices of sign `+`. On the other indices the signs alternate and it decreases\n\
        \  strictly within `[-3B, -B]`, `B = D.liftWeight 0 τ`. `New.Data.gridSigns` gives the signs and\n  `New.Data.gridParam`\
        \ twice these parameters.\n* `New.Exchange.poincareKernel`: the function whose translates a Poincaré series\
        \ sums. Its real\n  factor here is `New.Exchange.translatedCoeff`, a translated product of matrix coefficients.\n\
        * `New.Space.IsLastColumn`: a rational vector of `V ⊕ ⟨1⟩` is the last column of a group element\n  `γ`,\
        \ that is, the vector `γ ẽ` for the last basis vector `ẽ`. Last columns index the cosets, and\n  `New.Space.IsLastColumn.le_norm_archCoords_sub`\
        \ separates them.\n* `New.Exchange.norm_poincare_period_sub_le`: at deep level the period equals the term\
        \ of the\n  identity coset up to a small error.\n\nNotions from other files:\n* `New.Data.Φ`: the set of\
        \ infinite places of the field `E` of the data `D`. Also, `D.ϱ` is the\n  number of hyperbolic planes of\
        \ `Y₀`, `D.InitIndex 0` the set of basis indices of `X₀` other than\n  the last and `D.GridIndex z 0 0`\
        \ the index set of `Y₀` or `Ỹ^0_0`.\n* `Φ w` in the bounds `R ≤ ‖Φ w a‖`: the complex embedding of `E` at\
        \ the infinite place `w`.\n* `V.move x`, `vecAtPoint`, `archCoords`: the space `V` at the point `x` of the\
        \ adelic group, the\n  adelic coordinates of a rational vector there, and their infinite part as a Euclidean\
        \ vector.\n* `New.Data.liftWeight`: the number `κ_j(σ) = κ(σ) + (j + 1/2) Δ` at the infinite place `σ`,\
        \ where\n  `κ` is `D.weight`, `Δ = D.gap` the gap and `D.halfGap` half the gap.\n* `New.GInf E s`: the product\
        \ of one copy `New.USign s` of the complex unitary group `U(diag s)`\n  for each infinite place of `E`.\
        \ For an integer vector `l : New.HCParam s`, read as twice a\n  Harish-Chandra parameter, `l.dsCoeff` is\
        \ the Flensted-Jensen matrix coefficient on `U(diag s)`,\n  and `l.HasLargeGap A` says that `l` has gap\
        \ at least `500 n ^ 3 + A`, for `n` the rank.\n* `New.signedSpace E s`: the standard space with matrix `diag(s)`;\
        \ it needs a primitive root of\n  unity of order `5040` in `E` (`New.HasPrimitiveRoot5040`).\n* `New.Space.Γ`,\
        \ `New.Space.quotMeasure`: the rational points of a hermitian space `V` inside the\n  adelic unitary group\
        \ `G E s`, and the measure on a fundamental domain for them.\n* `New.principalLevel`: the finite adelic\
        \ integral points congruent to `1` modulo an element `a`\n  of the ring of integers of `E`.\n"
