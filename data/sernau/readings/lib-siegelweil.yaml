      text: 'Let `S` and `T` be hermitian spaces. The two unitary groups act by `New.SiegelWeil.splitWeil S T` on

        the function space of `Hom(S, T)`. The file defines complete splittings of `S`, Lagrangians and the

        zero term of a Lagrangian: the mean of `θ (ϱ z f)` over the maps `z : S → T` vanishing on it, adelic

        modulo rational, where `ϱ z` is the Heisenberg translation by `z`. It computes the norm of the zero

        term `P.lagrangian.zeroTerm T` of a splitting `P` under the parabolic, and bounds it along the

        normalised torus of a second splitting. It then shows, by the Hecke maximum principle, that a

        continuous invariant functional vanishes if it is dominated by the norms of the zero terms of the

        vacuum and `rank T > rank S > 0`.'
    remainder:
      path: grh/src/Lib/SiegelWeil/Formula/LagrangianZeroTerms.lean
      line: 14
      endLine: 48
      startOffset: 897
      endOffset: 3018
      text: "\n\n## Main definitions and results\n\n* `New.SiegelWeil.CompleteSplitting S p`: splittings of `S`\
        \ into `p` hyperbolic planes;\n  `New.SiegelWeil.Lagrangian S`: Lagrangians. Every Lagrangian comes from\
        \ a splitting\n  (`New.SiegelWeil.Lagrangian.exists_completeSplitting`), and one is chosen for each\n  (`New.SiegelWeil.Lagrangian.chosenSplitting`).\n\
        * `New.SiegelWeil.mixedValue`, `New.SiegelWeil.Lagrangian.zeroTerm`: the value `f[x]` in the model\n  of\
        \ a splitting, and the zero term `f[0]` of a Lagrangian, which depends on the Lagrangian only\n  (`New.SiegelWeil.zeroTerm_lagrangian_eq_theta`).\n\
        * `New.SiegelWeil.theta_normalisedTorus_le`: if `rank T > rank S`, an integrable bound for theta,\n  uniform\
        \ along the torus `New.SiegelWeil.normalisedTorus`.\n* `New.SiegelWeil.norm_zeroTerm_parabolic_mul`: an\
        \ element `g` with `g k = k a` multiplies the norm\n  of the zero term by `√|det a| ^ rank T`.\n* `New.SiegelWeil.exists_zeroTerm_normalisedTorus_le`:\
        \ an upper bound, along the normalised torus\n  `New.SiegelWeil.normalisedTorus T P x`, for the zero term\
        \ of a second splitting.\n* `New.SiegelWeil.eq_zero_of_le_tsum_zeroTerm`: let `S` have even positive rank\
        \ less than that of\n  `T`, with summable zero terms. A continuous functional `ℓ` that is invariant under\
        \ the group of\n  `T` and is dominated, up to an additive constant, by the sum of the norms of the zero\
        \ terms of the\n  translated vacuum is zero.\n\nNotions from other files:\n* `New.pairWeil`: the representation\
        \ `(g, h) ↦ a (det h) b (det g)⁻¹ ω (x ↦ h x g⁻¹)` of the product\n  of the two adelic unitary groups on\
        \ the function space of `Hom(S, T)`.\n* `New.Space.Splitting.homSource`, `New.Space.Splitting.homSlice`:\
        \ the splitting of `Hom(S, T)` over\n  `Hom(S₁, T)` induced by a splitting of `S` over `S₁`, and the term\
        \ `f ↦ f[x]` of its mixed model\n  at an adelic matrix `x`.\n* `New.Space.schrodingerOp`: the operator on\
        \ `\U0001D4AE V` attached to a function `Ψ` above a set of split\n  places; the indicator `New.boxIndicator`\
        \ gives the projection `New.Space.projOn` on the vacua\n  there.\n\n## Relation to the literature\n\nKnown;\
        \ see `Lib.SiegelWeil.Formula.WeilRange` for sources.\n"
