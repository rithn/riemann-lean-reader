      endOffset: 3666
      text: "\n\n## Main definitions and results\n\n* `New.Exchange.closurePart`: the endomorphism that keeps the\
        \ components on `S ∪ S̄` and replaces\n  all others by 1.\n* `New.Exchange.StraightPoint`, `New.Exchange.exists_straightPoint`:\
        \ points whose lattice splits\n  along the two isotropic lines, and the straightening of a point by singularity.\n\
        * `New.Exchange.centreCoeff_eq_zero_of_unimodular`: the vanishing theorem.\n\nNotions from other files:\n\
        * `New.Space.Splitting`: a decomposition of a hermitian space into two dual isotropic frames k, l\n  and\
        \ an orthogonal complement with inclusion ι and form ε₀; `A.symm` exchanges k and l, and\n  `A.comp B` has\
        \ the frame (k_A, ι_A k_B).\n* `New.Space.Splitting.radicalElement`: For adelic c (n₀×p, where n₀ indexes\
        \ the complement) and b\n  (p×p), the element of G with k ↦ k, ι ↦ ι + kc*ε₀, l ↦ l − ιc − k(½ȷ⁻¹(b + b*)\
        \ + ½c*ε₀c).\n* `New.Space.Splitting.lineShift`: n₊(a) = `A.lineShift B a` shifts the isotropic vector u\
        \ of A to\n  u − ι k_B aᴴ; n₋(b) = `A.symm.lineShift B b` shifts that of `A.symm`.\n* `IsBaseAdapted`: the\
        \ frames of a splitting are orthonormal at the infinite places and integral at\n  the finite ones. `stdLevel\
        \ E n` consists of the points that are integral at the finite places.\n* `New.Space.Splitting.partialMean`,\
        \ `New.Space.Splitting.shiftedMean`: f⁺(g) is the mean over b of\n  the coefficient of f along D at T at\
        \ n₋(b) g, and φ⁺_g(a) = f⁺(n₊(a) g); f⁻ and φ⁻ are those for\n  `A.symm`.\n* `New.Space.Splitting.frameStabilizer`:\
        \ the points that fix a given multiple of the frame of D.\n* `New.WeilData`: Weil data on a stably unramified\
        \ E. They consist of ȷ in E with ȷ = −ȷ̄, Im τȷ > 0\n  for every τ in the CM type and (1 − ȷ⁻¹)/2 integral;\
        \ a finite idele α for which the completed\n  integers Ô are self-dual under (z, u) ↦ ψ_f(ȷαᾱzu); and a\
        \ splitting character υ equal to −1 at\n  uniformisers of the places w with w = w̄.\n\n## Relation to the\
        \ literature\n\nKnown result: Singular forms are governed by their coefficients at unimodular indices. Here\
        \ the\nsetting is adelic, unitary and not holomorphic, and singularity comes from invariance under shears\n\
        at a nonempty set of places. The result here is the vanishing criterion\n`centreCoeff_eq_zero_of_unimodular`,\
        \ proved by choosing a point at which the denominator of the\ninverse determinant of the index is least.\
