      text: 'This file develops reduction theory for a hermitian space `S` split into `p` hyperbolic planes

        (`P : New.SiegelWeil.CompleteSplitting S p`). It proves the Siegel–Weil formula for a space `T` of

        rank greater than `2 p`. Write `a_x` for the Levi element `P.levi (Core.dyadicDiag x, 1)`, where

        `New.Core.dyadicDiag x` is diagonal with entries `2 ^ x i` at the infinite places and `1` at the

        finite places. Write `n(ν)` for `P.radicalElement 0 ν`. Siegel sets give the bound in the cusp used

        in the proof of the formula.

        '
    remainder:
      path: grh/src/Lib/SiegelWeil/Formula/WeilRange.lean
      line: 13
      endLine: 53
      text: "\n## Main definitions and results\n\n* `New.SiegelWeil.exists_compact_parabolic_normal_form`: a normal\
        \ form `δ⁻¹ g = n(ν) a_x⁻¹ κ`\n  adapted to a given rational Lagrangian.\n* `New.SiegelWeil.exists_siegel_set`:\
        \ every adelic point is `γ a_x κ` with `γ` rational, `x ≥ 0`,\n  `κ` in a compact set.\n* `New.SiegelWeil.exists_summable_zeroTerm_bound`:\
        \ in Weil's range the zero terms\n  `New.SiegelWeil.Lagrangian.zeroTerm`, composed with the normalised torus\
        \ action\n  `New.SiegelWeil.normalisedTorus` (`splitWeil S T`, the Weil representation on `\U0001D4AE (S.hom\
        \ T)`, of\n  `a_x` scaled by `2 ^ (-d * card m * ∑ i, x i)`, with `d` the number of infinite places), are\n\
        \  bounded by one summable function of the Lagrangian.\n* `New.SiegelWeil.siegel_weil`: the mean of theta\
        \ over `[U(T)]` is the sum of the zero terms.\n\nNotions from other files:\n* `New.Space`: a hermitian space\
        \ with a point, given by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal to diag(s) at the\
        \ infinite places and 1 at the finite places.\n* `New.SiegelWeil.CompleteSplitting`: The splittings S =\
        \ lE^p ⊕ kE^p into two isotropic frames l and\n  k, which pair to p hyperbolic planes; `P.k` is the isotropic\
        \ frame k and `P.kAdelic` is x⁻¹k, the\n  same frame in standard coordinates.\n* `New.Space.Splitting.levi`:\
        \ The homomorphism GL_p(\U0001D538) × G(V₀) → G(V) sending (m, g₀) to the element\n  with k ↦ km, ι ↦ ιg₀,\
        \ l ↦ l m*⁻¹.\n* `New.Space.Splitting.radicalElement`: `P.radicalElement 0 b`, written `n(b)`, is the unipotent\n\
        \  element with k ↦ k and l ↦ l − k(½ȷ⁻¹(b + b*)), where ȷ is the purely imaginary element of\n  `WeilData\
        \ E`.\n* `New.SiegelWeil.Lagrangian.zeroTerm`: The zero term along a Lagrangian L, which is the value at\
        \ 0\n  (`New.SiegelWeil.mixedValue`) in the Schrödinger model of a chosen complete splitting with\n  kE^p\
        \ = L.\n\n## Relation to the literature\n\nSiegel–Weil formula in the convergent range. Here a split space\
        \ of rank 2p is paired\nwith a hermitian space of rank above 2p, both unimodular at every finite place,\
        \ over a CM field `E`\nwith `WeilData E` (so it contains the 5040th roots of unity and E/E⁺ is unramified\
        \ at the finite\nplaces), and the Eisenstein series is written as a sum over Lagrangians. Source: A. Weil,\
        \ Sur la\nformule de Siegel dans la théorie des groupes classiques, Acta Math. 113 (1965), n° 52 Thm 5;\
        \ the\nmethod of proof follows Andrianov (1979), Harris (1981), and P. Garrett, The Siegel-Weil formula\
        \ in\nthe convergent range (notes, 2005).\n\nReduction theory, namely the existence of Siegel sets. The\
        \ compactness criterion of Mahler that it\nuses is from `Lib.Adelic.Reduction.FiniteVolume`.\n"
