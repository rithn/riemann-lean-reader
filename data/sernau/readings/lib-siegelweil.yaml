      endLine: 50
      startOffset: 540
      endOffset: 3293
      text: "\n\nNeither side of Poisson's formula on the line has a term at `0`, so `\U0001D4B5` is analytic on\
        \ the real\nline. For `x ≥ 1` its value is, up to an explicit factor, `L(x)` times the theta integral of\n\
        `(W, V)` at a cone integral (`New.Exchange.exists_zetaIntegral`). This gives the constant term for\n`e ≥\
        \ 0` (`New.Exchange.exists_planeConstantTerm_eq_thetaLarge_cone`) and, through the other side of\nPoisson's\
        \ formula, for `e < 0` (`New.Exchange.exists_planeConstantTerm_eq_thetaLarge_dualCone`).\n\n## Main definitions\
        \ and results\n\n* `New.Exchange.exists_planeConstantTerm_eq_thetaLarge_cone`: for `z = rk V - rk W / 2\
        \ ≥ 0`, with\n  `rk W = card n` even, a Schwartz vector `v'` and integral `y`, the constant term along `A`\
        \ of the\n  theta integral of `(W', V')` is `γ` times the theta integral of `(W, V)` on\n  `cone A X μ (z\
        \ + 1) v'` and `stdRowDatum σ \U0001D520.semilocalChar y`.\n* `New.Exchange.exists_planeConstantTerm_eq_thetaLarge_dualCone`:\
        \ the same for\n  `rk V - rk W / 2 = -z - 1 < 0`, at `u = 1`, with `dualCone A X μ (z + 1) v'` in place\
        \ of the cone.\n\nNotions from other files:\n* `\U0001D520 : SplitTameChar E μ` is a character `\U0001D520\
        .character` of `[U(1)]` of positive weight `μ`, tamely\n  ramified exactly on a finite set `\U0001D520.ramifiedPlaces`\
        \ of places disjoint from its conjugate;\n  `\U0001D520.semilocalChar` is `t ↦ ν(t / t̄)`, for `ν = \U0001D520\
        .character`, on the product\n  `LocProd \U0001D520.ramifiedPlaces` of the completions at `\U0001D520.ramifiedPlaces`.\n\
        * `A : W'.Splitting W Unit` is a decomposition `W' = W ⊕ H`; it is `IsBaseAdapted` if its frames are\n \
        \ orthonormal at the infinite places and integral at the finite places.\n* `localDatum W V v Φ \U0001D520\
        .readsAt` is the datum on `Hom(W, V)` with real part `v`, the function `Φ` at\n  the places of `\U0001D520\
        .ramifiedPlaces` and the vacuum elsewhere; `thetaLarge W V \U0001D520 v Φ` is its theta\n  integral over\
        \ `[U(V)]`.\n* `stdRowDatum σ χ y` sends `x` to `χ⁻¹` of the determinant of the matrix with the rows of\
        \ `y` and\n  `x` if that matrix is integral with integral inverse, and to `0` otherwise.\n* `New.Exchange.lSharp`\
        \ (from `Lib.SiegelWeil.Tower.FiniteTateIntegral`) is\n  `L♯(z) = |L^S(z, ν)| ∏_{w ∈ S} q_w ^ (z - 1/2)`\
        \ for `ν = \U0001D520.character`, `S = \U0001D520.ramifiedPlaces`.\n\n## Relation to the literature\n\n\
        Known result: the tower property for the constant term of a theta lift along an isotropic line. In\nthe\
        \ literature the lifted form is cuspidal, whereas here it is a character, the data are ramified,\nand the\
        \ isotropic orbit survives as a Tate integral. The constant term is therefore the smaller lift\ntimes a\
        \ factor whose size is given by a Hecke L-value. Source: S. Rallis, On the Howe duality\nconjecture, Compositio\
        \ Math. 51 (1984), Thm I.1.1; for the unitary case, C. Wu, Irreducibility of\ntheta lifting for unitary\
        \ groups, J. Number Theory 133 (2013), Prop. 3.1.\n"
