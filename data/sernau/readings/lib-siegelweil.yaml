      text: "This file derives Siegel's formula for representation numbers from the Siegel–Weil formula\n`New.SiegelWeil.siegel_weil`.\
        \ It applies that formula to the hyperbolic plane and to the positive\ndefinite space `stdSpace E κ` with\
        \ form x*x, of rank at least 3. Laplace's integral for 1/Γ supplies\nthe archimedean factor.\n\n## Main\
        \ definitions and results\n\n* `New.SiegelWeil.siegel_weil_one_vector`: the mean of `∑_ξ Ψ(h⁻¹ ξ)` is `Ψ(0)`\
        \ plus the sum over\n  β in E⁺ of the integrals `∫ Ψ(x) ψ(β x* x / 2) dx`.\n"
    remainder:
      path: grh/src/Lib/SiegelWeil/OneVector/SiegelClassSum.lean
