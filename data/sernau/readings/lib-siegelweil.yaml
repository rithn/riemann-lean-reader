      text: " A vector x that is\nsupported at w, lies outside L, and has ϖx ∈ L and ⟨x, x⟩ integral defines a neighbour\
        \ L₁ = L₀ + Ôx\nof L, where L₀ = {z ∈ L : ⟨x, z⟩ integral}. A quasi-reflection ρ supported on w and its\
        \ conjugate\nmaps L₁ into L. The same ρ serves all x with the same line of ϖx in k_w^n and the same residue\
        \ of\nϖ⟨b, cx − b⟩, where b is a fixed such vector with this line and c a unit with cx − b ∈ L; these\n\
        residues number at most √q_w, and at most one if w is split. A lattice γL ≠ L, for γ unitary, holds\nsuch\
        \ a vector x at some place w, and passing from γ to ργ divides the index [L : L ∩ γ⁻¹L] = [γL : L\n∩ γL]\
        \ by at least q_w. So a step from L to L₁ towards γL is read as a step from γL to ργL towards L.\nThis file\
        \ treats one step; the steps are summed in `Lib.SiegelWeil.UnramifiedSeries.RallisSeries`.\n\nIf w is split,\
        \ L₁ is L enlarged by a line at w and cut down to a hyperplane at w̄. So the steps at w\nand at w̄ go up\
        \ by a line and down by a hyperplane at w. If w is inert, the line of ϖx determines L₀\nand its dual L +\
        \ Ôx, and the residues index the isotropic lines other than L/L₀ in the hermitian\nplane (L + Ôx)/L₀.\n\n\
        ## Main definitions and results\n\n* `New.SiegelWeil.IsNeighbourVector`, `New.SiegelWeil.MapsNeighbour`:\
        \ the vector x, and the relation\n  ρL₁ ⊆ L.\n* `New.SiegelWeil.neighbourResidues`: the residue classes\
        \ that tell apart the neighbours with the\n  same line; `New.SiegelWeil.card_neighbourResidues_le_one` and\n\
        \  `New.SiegelWeil.card_neighbourResidues_sq_le` bound their number.\n* `New.SiegelWeil.exists_family_mapsNeighbour`:\
        \ a family of ρ, indexed by lines and residue classes,\n  serves all x.\n* `New.SiegelWeil.exists_isNeighbourVector_mulVec`:\
        \ a lattice γL ≠ L holds such a vector.\n* `New.SiegelWeil.q_mul_norm_finMultiplier_mul_sq_le`: one step\
        \ lowers the index.\n\nNotions from other files:\n* `New.stdLattice E n`: the standard lattice Ô^n, where\
        \ `Ô E` is the ring of integral finite adeles\n  in the finite adele ring `\U0001D538f E`; `singleAdele\
        \ w a` is the finite adele with component a at w and 0\n  elsewhere, so `singleAdele w c • x` is the multiple\
        \ c x at w.\n* `New.finMultiplier γ`: its squared absolute value is the index [L : L ∩ γ⁻¹L].\n\n## Relation\
        \ to the literature\n\nKnown result: Kneser's neighbours. Here only the standard lattice over the integral\
        \ finite adeles\nand its translates by unitary elements are treated; split and inert places are treated\
        \ by the same\nstep, taken at w or at its conjugate. Source: M. Greenberg, J. Voight, Lattice methods for\
