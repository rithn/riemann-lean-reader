      endLine: 42
      text: "Conventions: `New.G E s` is the adelic unitary group, a pair of an archimedean and a finite part;\n\
        `New.pairWeil S T a b` is the twisted Weil representation of `U(S) × U(T)` on the data\n`\U0001D4AE (S.hom\
        \ T)`, with inner product `New.Space.dataInner`; `New.localLevel n A` consists of the\nfinite points that\
        \ are integral at the places of `A`, and `New.stdLevel E n` of those integral at\nall places, the stabiliser\
        \ of `Ô ^ n`.\n\n## Main definitions and results\n\n* `New.SiegelWeil.integral_conj_theta_mul_theta`: the\
        \ doubling identity for `2 n < m`:\n  apply Siegel–Weil (`New.SiegelWeil.siegel_weil`) to `S ⊕ S⁻`; for\
        \ a clean datum\n  (`New.SiegelWeil.IsClean`) only the Lagrangians that are graphs of isometries contribute\n\
        \  (`New.SiegelWeil.exists_graph_eq_of_zeroTerm_ne_zero`, `New.SiegelWeil.zeroTerm_graphSplitting`).\n*\
        \ `New.SiegelWeil.inner_product_formula`: Rallis' inner product formula, obtained by integrating\n  the\
        \ doubling identity against two functions on `[U(S)]`.\n\nNotions from other files:\n* `New.Space`: a hermitian\
        \ space with a point, given by signs s, a matrix J over E and x in GL_n(\U0001D538)\n  with xᴴJx equal to\
        \ diag(s) at the infinite places and 1 at the finite places.\n* `New.SiegelWeil.Lagrangian.zeroTerm`: the\
        \ term of a Lagrangian L in the Siegel–Weil formula, the\n  value at 0 in the Schrödinger model of a complete\
        \ splitting along L.\n* `New.Space.projOn`: the mean of the finite Heisenberg operators of the integral\
        \ vectors above a\n  set A of places and its conjugate; the data that it fixes are the vacua above A.\n\n\
        ## Relation to the literature\n\nRallis inner product formula by doubling. Here only Weil's range is treated,\
        \ with forms that are\nrapidly decreasing rather than cuspidal. The boundary orbits are removed by the test\
        \ datum. Source:\nS. Rallis, L-functions and the oscillator representation, LNM 1245 (1987); J.-S. Li, Crelle\
        \ 428\n(1992); the unitary unfolding is written out in Y. Liu (2011) Prop 2.3 and\nEischen–Harris–Li–Skinner\
        \ 4.1.4.\n"
