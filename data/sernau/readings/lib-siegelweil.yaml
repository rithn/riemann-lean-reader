      endLine: 55
      text: "* `New.SiegelWeil.siegel_weil_fourierCoeff`: the part of this formula that counts the vectors of\n\
        \  one norm α ≠ 0, detected by a phase.\n* `New.normDensity`: the density at α of a function Φ₀ of finite\
        \ adelic vectors, a Fourier integral\n  over the self-adjoint finite adeles.\n* `New.classSum_eq_mul_normDensity`:\
        \ for totally positive α, the class sum (`New.classSum`) of the\n  numbers of representations of α by x*x,\
        \ weighted by Φ₀, is the class sum of 1 times |D_E|^(1/4),\n  the factors at the infinite places and the\
        \ density of Φ₀ at α.\n* One step of the mass formula, with an error term: `New.abs_log_mass_ratio_sub_le`\
        \ estimates the\n  ratio of the masses `New.mass E (j + 1)` and `New.mass E j` of the genera of standard\
        \ lattices. It\n  applies Siegel's formula `New.classSum_eq_mul_normDensity` to the vectors of norm `1`\
        \ in the\n  standard lattice, whose class sum is `New.mass E j` by `New.classSum_card_norm_one_eq_mass`,\
        \ and\n  bounds the density by a Gauss sum estimate.\n\nNotions from other files:\n* `New.SiegelWeil.mixedValue`:\
        \ the slice f[x], the value of a test function f at a point x in the\n  Schrödinger model. The function\
        \ x ↦ f[x] is called the Schrödinger function of f.\n* `New.SiegelWeil.Lagrangian.zeroTerm`: the functional\
        \ ev_L attached to a Lagrangian L, the value\n  at 0 in a Schrödinger model along L.\n* `New.classSum`:\
        \ the sum of a function over the classes of a level, weighted by 1/#Aut.\n* `New.mass`: the mass of the\
        \ genus of O_E^l, the sum of 1/#Aut over its classes.\n\n## Relation to the literature\n\nKnown result:\
        \ Siegel's formula for representing a number by a hermitian form. Here it is stated for\nthe representations\
        \ of a totally positive number by a sum of at least three norms over a CM field\nwith enough roots of unity,\
        \ a splitting character and a self-dual lattice, at any level and for any\nnonnegative invariant test function.\
        \ The singular series is left as one adelic Fourier integral, and\nthe formula is read off from the Siegel–Weil\
        \ formula. The local densities are not evaluated: for the\nstandard lattice the integral is estimated by\
        \ Gauss sums and a zeta value. Source: A. Weil, Acta\nMath. 113 (1965), Thm 5 for one vector; classically,\
        \ C. L. Siegel, Ann. of Math. 36 (1935), and\nH. Braun, Zur Theorie der hermitischen Formen, Abh. Math.\
        \ Sem. Hamburg 14 (1941).\n\nKnown result: Mass formula for unimodular hermitian lattices, as the ratio\
        \ of consecutive masses.\nOnly this ratio in large rank is obtained, up to an explicit error that depends\
        \ on the field only\nthrough its degree, for CM fields with enough roots of unity (so unramified over the\
        \ real subfield),\na splitting character and a self-dual rank-one lattice. It is derived from Siegel's formula\
        \ for\nvectors of norm one and a Gauss sum bound. Source: W. T. Gan, J. Hanke, J.-K. Yu, On an exact mass\n\
        formula of Shimura, Duke Math. J. 107 (2001); M. Kirschmer, Definite quadratic and hermitian forms\nwith\
        \ small class number (2016), 4.2.7, 4.2.9.\n"
