      text: 'This file extends the bound on the coefficients of the vacuum to all sets of places, by induction

        over the weights `New.SiegelWeil.stepWeight`. For `2 n < m` it proves that the coefficients are

        absolutely summable and that the series `New.SiegelWeil.rallisSeries` converges uniformly. It proves

        that the series keeps levels and forms, is multiplicative over the places and is injective. The last

        section defines the sum of the coefficients `New.SiegelWeil.vacuumSum` and writes it as a product

        over the pairs of conjugate places.

        '
    remainder:
      path: grh/src/Lib/SiegelWeil/UnramifiedSeries/RallisSeries.lean
      line: 13
      endLine: 63
      text: "\nLet `G_f` be the finite adelic unitary group of rank `n` over the CM field `E`, and let `A` be a\
        \ set\nof finite places. The series `∑ mc(γ) R(γ) y` runs over the cosets `γ` of the points integral at\n\
        `A`; here `R` is right translation and `mc(γ)` is the coefficient of the vacuum for a second space\nof rank\
        \ `m`, of modulus `[γ L : L ∩ γ L] ^ (-m / 2)` for the standard lattice `L`. In the inner\nproduct formula\
        \ `A` is the set of the places off the level and its conjugate. For `2 n < m` the\ncoefficients are absolutely\
        \ summable, and, if the character in `mc` is unramified on `A`\n(`IsUnramifiedOn`: `b ∘ det` is trivial\
        \ on the integral points supported on `A` and its conjugate),\nthe series is an injective operator on the\
        \ bounded functions fixed by the integral points supported\non `A` and its conjugate.\n\nBoth facts come\
        \ from counting lattices through neighbours. A lattice other than `L` is brought\nnearer to `L` by a step\
        \ at a place `w`. The weight `s_w` is the number of steps at `w` times\n`q_w ^ (-m / 2)`, where `q_w` is\
        \ the order of the residue field at `w`. For `2 n < m` it is at most\n`1 / (q_w - 1)`, and at most `1 /\
        \ ((q_w - 1) √q_w)` if `w` is split. If the `s_w` over `A` and its\nconjugate add up to `ϱ ≤ 1 / 3`, the\
        \ nontrivial cosets contribute at most `ϱ + ϱ ^ 2 + ⋯ ≤ 1 / 2`,\nso the series is close to the identity.\
        \ This holds for one place and its conjugate, because\n`q_w ≥ 4` (under `WeilData E`, `E` has a primitive\
        \ root of unity of order `5040`, hence the third\nand fourth roots of unity), and for the places outside\
        \ a finite set, because `∑ s_w` converges. The\nseries is multiplicative over the places, which gives all\
        \ `A`. The last section writes the sum of\nthe coefficients as a product over the pairs of conjugate places.\n\
        \n## Main definitions and results\n\n* `New.SiegelWeil.summable_norm_vacuumCoeff`: the coefficients are\
        \ absolutely summable.\n* `New.SiegelWeil.exists_form_eq_rallisSeries`: the series keeps forms and their\
        \ levels.\n* `New.SiegelWeil.rallisSeries_union`: the series is multiplicative over the places.\n* `New.SiegelWeil.eq_zero_of_rallisSeries_eq_zero`:\
        \ a function with series `0` is `0`.\n\nNotions from other files:\n* `localLevel n A`: the points of `G_f`\
        \ integral at the places of `A`; `stdLevel E n`: the points\n  integral at all finite places; `supportedOn\
        \ n A`: the points with component `1` outside `A` and\n  its conjugate, whose union is `A.conjClosure`.\n\
        * `HasLevel y K`: right translation by each point of `K` fixes the function `y` on the adelic points\n \
        \ `G E s`, the products of a point of `GInf E s` (the real points, the only part that depends on the\n \
        \ signs `s : n → ℤˣ`) and a point of `Gf E n`.\n* `New.SiegelWeil.rallisSeries M b A y`: the series `∑ mc(q)\
        \ R(q) y`, with coefficient\n  `New.SiegelWeil.vacuumCoeff M b` and right translation taken at `New.SiegelWeil.cosetRep\
        \ q`.\n* `New.SiegelWeil.stepWeight n M w`: the number of steps at `w` to a neighbouring lattice times\n\
        \  `q_w ^ (-M / 2)`.\n* `New.SiegelWeil.IsUnramifiedOn`: `b ∘ det` is trivial on the integral finite points\
        \ supported on\n  `A` and its conjugate.\n\n## Relation to the literature\n\nPart of a known result: non-vanishing\
        \ of theta lifts in large rank. See\n`Lib.SiegelWeil.RallisInner.SharpData`. The series is the contribution\
        \ of the unramified places to\nRallis' inner product formula, left as a sum over cosets instead of being\
        \ evaluated as an L-value;\nfor the constant `1` in rank one it is evaluated in `New.vacuumSum_eq_L_div_eulerProd`.\
        \ The count of\nlattices uses neighbours in Kneser's sense; see M. Greenberg and J. Voight, Lattice methods\
        \ for\nalgebraic modular forms on classical groups (2014), §5.\n"
