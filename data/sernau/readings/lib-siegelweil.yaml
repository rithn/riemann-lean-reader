        \  `New.Space.Splitting.shiftedMean_symm_eq_smul`: for det T ≠ 0, a relation φ⁺_{g'} = c φ⁺_g passes\n \
        \ to the coefficients along `D` at the points n₋(b) n₊(a) g and to φ⁻.\n* `New.Space.Splitting.partialMean_radicalElement_mul`:\
        \ singularity. Let f⁺ be invariant under the\n  shears at a nonempty set of finite places (`New.Space.Splitting.ShearInvariant`)\
        \ at all points\n  that fix e·k for an adele e (`New.Space.Splitting.frameStabilizer`). Then f⁺(h g) = f⁺(g)\
        \ for h in\n  the adelic radical of the stabiliser of the line of u, whenever g and h g fix e·k. The proof\n\
