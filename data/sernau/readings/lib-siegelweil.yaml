      text: "\n\n## Main definitions and results\n\n* `New.SiegelWeil.vacuumCoeff`, `New.SiegelWeil.cosetRep`, `New.SiegelWeil.rallisSeries`:\
        \ the\n  coefficients, the representatives of the cosets and the series.\n* `New.SiegelWeil.stepWeight`:\
        \ the number `stepWeight n M w`, with the bounds\n  `New.SiegelWeil.tsum_stepWeight_conjClosure_singleton_le`\
        \ and\n  `New.SiegelWeil.summable_stepWeight`.\n\nNotions from other files:\n* `localLevel n A`: the points\
        \ of `Gf E n` integral at the places of `A`; `stdLevel E n`: the points\n  integral at all finite places.\n\
        * `supportedOn n A`: the points with component `1` outside `A` and its conjugate, whose union is\n  `A.conjClosure`;\
        \ `trivialOn n A`: the points with component `1` at `A`.\n* `finMultiplier`: the multiplier of a finite\
        \ point; its squared modulus is the index\n  `[L : L ∩ γ⁻¹ L] = [γ L : L ∩ γ L]` at the point `γ`.\n* `AutChar\
        \ E`: the characters `b` of the norm-one adeles of `E` trivial on the norm-one elements of\n  `E`; `detFin\
        \ 1 g`: the determinant of the finite point `g`, as such an adele with component `1` at\n  the infinite\
        \ places.\n* `HasLevel y K`: right translation by each point of `K` fixes the function `y` on the adelic\
        \ points\n  `G E s`, the products of a point of `GInf E s` (the real points, the only part that depends\
        \ on the\n  signs `s : n → ℤˣ`) and a point of `Gf E n`.\n\n## Relation to the literature\n\nKnown; see\
        \ `Lib.SiegelWeil.UnramifiedSeries.RallisSeries` for sources.\n"
