      path: grh/src/Lib/SiegelWeil/Formula/StrongApproximation.lean
      line: 7
      endLine: 13
      text: 'This file proves that an automorphic function on a unitary group with a hyperbolic plane is constant

        under level and torus hypotheses. This is the step that makes the period of a theta lift between

        spaces of equal rank a constant. Strong approximation gives invariance under two opposite unipotent

        radicals, Witt''s theorem reaches the rational points of the Levi factor, and weak approximation

        with the Iwasawa decomposition gives all points. `New.Exchange.IsAutFunction W D` says that `D` is

        continuous on the adelic unitary group of `W` and left invariant under rational points, and

        `H : W.Splitting W₀ Unit` splits off a hyperbolic plane.

        '
    remainder:
      path: grh/src/Lib/SiegelWeil/Formula/StrongApproximation.lean
      line: 14
      endLine: 48
      text: "\n## Main definitions and results\n\n* `New.Exchange.IsAutFunction.apply_eq_apply_one`: an automorphic\
        \ function on a unitary group with a\n  hyperbolic plane is constant if it is right invariant under `Gf.supportedOn\
        \ n S` for a nonempty\n  set `S` of finite places, has level `stdLevel` away from `S`, and satisfies a hypothesis\
        \ on the\n  torus of the plane.\n* `New.Exchange.exists_torus_mul_rational_fixes`: if `D` is left invariant\
        \ under the radical\n  elements of every splitting of a hyperbolic plane off `W` with complement `W₀`, then\
        \ for each set\n  `R` of finite places and each rational point `γ` of `W₀` it is left invariant under the\
        \ components\n  on `R ∪ R̄` (`closurePart R`) of a Levi element with `W₀`-block `γ`.\n\nNotions from other\
        \ files:\n* `New.Space`: a hermitian space with a point, given by a matrix J over E and x in GL_n(\U0001D538\
        ) with xᴴJx\n  equal to diag(s) at the infinite places and 1 at the finite places.\n* `New.Space.Splitting.levi`:\
        \ The homomorphism GL_p(\U0001D538) × G(V₀) → G(V) sending (m, g₀) to the element\n  with k ↦ km, ι ↦ ιg₀,\
        \ l ↦ l m*⁻¹.\n* `New.Space.Splitting.radicalElement`: `P.radicalElement 0 b`, written `n(b)`, is the unipotent\n\
        \  element with k ↦ k and l ↦ l − k(½ȷ⁻¹(b + b*)), where ȷ is the purely imaginary element of\n  `WeilData\
        \ E`.\n\n## Relation to the literature\n\nA weak substitute for strong approximation for special unitary\
        \ groups. Only the constancy of a\ncontinuous function `D` on the adelic points of the full unitary group\
        \ is proved, under three\nhypotheses. First, `D` is left invariant under the rational points. Second, for\
        \ a nonempty set `S`\nof finite places, `D` is right invariant under the points supported on `S` and the\
        \ complex\nconjugates of its places, and under the integral finite adelic points that are trivial on `S`.\n\
        Third, for a splitting of a hyperbolic plane: if `D` is left invariant under the unipotent radical\nof the\
        \ parabolic subgroup fixing the isotropic line, then the values of `D` on the Levi subgroup\n`GL₁ × G(W₀)`,\
        \ with `W₀` the complement of the plane, do not depend on the `GL₁` component.\n\nSource: M. Kneser, Starke\
        \ Approximation in algebraischen Gruppen I, J. reine angew. Math. 218\n(1965); G. Shimura, Arithmetic of\
        \ unitary groups, Ann. of Math. 79 (1964); survey A. Rapinchuk, MSRI\nPubl. 61 (2013).\n"
