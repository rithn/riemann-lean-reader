        `1 ≤ z < min μ + 1`. As `L` has no zero at real `x ≥ 1`, the extension has no zero at the integers

        `j > -min μ` (`exists_analytic_extension_ne_zero`). The file also computes the theta kernels of

        pairs in which one space is `0`.'
