      text: 'Let `W'' = W ⊕ H` and `V'' = V ⊕ H` be hermitian spaces over the CM field `E`, with `H` a hyperbolic

        plane and `W` of even rank. On standard data, the constant term of the theta integral of `(W'', V'')`

