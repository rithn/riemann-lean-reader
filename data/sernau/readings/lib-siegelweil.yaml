        \ in\n  `New.SiegelWeil.IsSharp.hasSum_integral_weilMatrixCoeff_mul`.\n* `New.SiegelWeil.exists_petersson_formLift_eq_rallisSeries`:\
        \ for `v` an edge (`New.IsEdge`) from\n  type `e`, the lift is injective on `J`-invariant forms of type\
        \ `e`, and the product of two lifts\n  is a multiple of the pairing with the series; `New.SiegelWeil.rallis_inner_product_cosetTerm`\n\
        \  expands the series.\n* `New.SiegelWeil.IsSharpFn.isSharp`: if all signs of `S` agree or \U0001D52A ≠\
        \ (1), a function on matrices\n  modulo \U0001D52A that is sharp for a level J (`New.SiegelWeil.IsSharpFn`)\
        \ gives a finite datum whose\n  matrix coefficient is constant on J and zero at the other points integral\
        \ off \U0001D52A\U0001D52Ā\n  (`New.SiegelWeil.IsSharp`). `New.SiegelWeil.isSharp_vacuumDatum_of_mul_eq_one`\
        \ is the case of the\n  principal level.\n* `New.vacuumSum_eq_L_div_eulerProd`: in rank one and for target\
        \ rank 2k with k > 1, the sum\n  `New.SiegelWeil.vacuumSum` of the vacuum coefficient over the cosets at\
        \ the places off a set and\n  its conjugate, where the tame part is trivial, is a partial Hecke L-value\
