    excerpt:
      path: grh/src/New/Appendix/DiscreteSeries/Localization.lean
      line: 7
      endLine: 12
      text: 'This file treats a group `S` with a map `j : S →* U(ε) × U(η)` that satisfies

        `New.DiscreteSeries.IsLaplaceDatum`. It proves facts about `New.HCParam.laplaceIntegrand`, the

        product of the first discrete series coefficient, the conjugate of the second and `exp (-φ)`. It

        shows that a coefficient with a large gap decays away from the maximal compact subgroup. It also

        shows that, if `1 ≤ B` and both noncompact parts at `s` are small, the integrand takes the same

        value at some `t` for which both components of `j t` are near `1`.

        '
    remainder:
      path: grh/src/New/Appendix/DiscreteSeries/Localization.lean
      line: 13
      endLine: 37
      text: "\n## Main definitions and results\n\n* `New.DiscreteSeries.noncompactPart ε g`: the noncompact part\
        \ `g - blockDiagPart ε g` of a\n  matrix `g`.\n* A coefficient with a large gap is small where the noncompact\
        \ part of its argument is large\n  (`New.DiscreteSeries.norm_dsCoeff_pow_four_le`).\n* If `1 ≤ B` and both\
        \ noncompact parts at `s` are small, then `laplaceIntegrand` takes the same\n  value at some `t` for which\
        \ both components of `j t` are near `1`\n  (`New.DiscreteSeries.IsLaplaceDatum.exists_laplaceIntegrand_eq_and_norm_subOnePair_le`).\n\
        \nNotions from other files:\n* `New.USign ε`: the unitary group `U(ε)` of the diagonal matrix `signMatrix\
        \ ε` of the signs `ε`.\n* `New.blockDiagPart ε g`: the compact part of `g`, which keeps the entries `g i\
        \ j` with\n  `ε i = ε j`.\n* `New.HCParam.lowestKType l`, `New.HCParam.dsCoeff l`: the highest weight of\
        \ the lowest `K`-type\n  of the parameter `l`, and the matrix coefficient of that `K`-type.\n* `New.DiscreteSeries.IsLaplaceDatum`:\
        \ the properties of `j` and `φ` that Laplace's method uses.\n* `New.HCParam.laplaceIntegrand`: the function\
        \ to which Laplace's method applies.\n\n## Relation to the literature\n\nThis file uses the discrete series\
        \ coefficient that is known as Flensted-Jensen's function, the\ncoefficient of the lowest `K`-type of a\
        \ discrete series\n(defined in `Lib.DiscreteSeries.FlenstedJensen.Defs`).\n"
