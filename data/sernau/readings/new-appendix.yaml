    excerpt:
      path: grh/src/New/Appendix/DiscreteSeries/GaussianShape.lean
      line: 7
      endLine: 12
      text: 'Near `1` the coefficient `l.dsCoeff g` of a discrete series with a large gap is nearly the phase

        `exp (tr μ log g)` times a number in `[0, 1]`, where `μ` is the weight `l.lowestKType`

        (`exists_norm_dsCoeff_div_cexp_sub_le`). The coefficient is a mean over `K` of a quotient of

        products of minors, and the estimates for one minor are multiplied over the sets `{i | t ≤ w i}` of

        a weight `w`. In the comments, `λ^ρ` is `paramAddRho l`, `Q_w` is `gapWeightedNormSq w`, and `ĝ` is

        `reducedExp ε l Z`. The Gaussian is `exp (-q)` with `q = Q_{-λ^ρ} (log g) / 4`; note `Q_{-w} = Q_w`.

        '
    remainder:
      path: grh/src/New/Appendix/DiscreteSeries/GaussianShape.lean
      line: 13
      endLine: 29
      text: "Except in the first section, the norm of a matrix is the Frobenius norm.\n\n* `USign ε` is the unitary\
        \ group of the form `diag ε`; `K = maxCompactU ε` is its subgroup of\n  unitary matrices, with the Haar\
        \ measure `haarK ε` of mass one.\n* `l : HCParam ε` is a doubled Harish-Chandra parameter `2λ`; `paramAddRho\
        \ l` is `λ + ρ` and\n  `l.lowestKType` is `λ + ρ - 2ρ_c`.\n* `weightMinors w g` is the product over `t :\
        \ ℤ` of the principal minors of `g` on the sets\n  `{i | t ≤ w i}`, those with `t ≤ 0` divided by `det g`;\
        \ `w.kTypeNormSq` is the mean of its\n  squared modulus over `K`.\n* `l.flenstedJensen g z` is the mean\
        \ over `k ∈ K` of\n  `weightMinors μ (g k) * conj (weightMinors μ k) / weightMinors (-paramAddRho l) (kᴴ\
        \ z k)`,\n  divided by `μ.kTypeNormSq` (Flensted-Jensen's integral); the matrix coefficient `l.dsCoeff`\
        \ is\n  defined through it.\n\n## Relation to the literature\n\nSee `New.Appendix.DiscreteSeries.Periods`\
        \ for related work.\n"
