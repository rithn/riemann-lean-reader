      text: 'This file proves lower bounds for periods of discrete series coefficients. Let

        `j : S →* U(ε) × U(η)` be a homomorphism and write `θ` for the function `laplaceIntegrand` on `S`.

        Laplace''s method bounds the volume of a large ball by a power of `β` times `‖∫ θ‖`, where `β` bounds

        the dimensions and the entries of the parameters.'
    remainder:
      path: grh/src/New/Appendix/DiscreteSeries/Periods.lean
      line: 11
      endLine: 55
      startOffset: 527
      endOffset: 3505
      text: "\n\n## Main definitions and results\n\n* The values of `θ` lie in a cone about the positive real axis,\
        \ up to an exponentially small error\n  (`IsLaplaceDatum.norm_laplaceIntegrand_le_mul_re_add`). With the\
        \ decay of the coefficients, `θ` is\n  integrable and the volume of a large ball is at most a power of `β`\
        \ times `‖∫ θ‖`\n  (`IsLaplaceDatum.laplace_method`). The file `PositionGroup` applies this to the group\
        \ of a\n  stationary position.\n\nNotions from other files:\n* `USign ε` is the unitary group `U(ε)` of\
        \ the diagonal form with signs `ε`, and\n  `U.sum (signMatrix_sum ε η)` is the block embedding `(g, g')\
        \ ↦ g ⊕ g'` of `U(ε) × U(η)`.\n* `l.dsCoeff g` is the discrete series coefficient with doubled Harish-Chandra\
        \ parameter\n  `l = 2λ : HCParam ε`, given by Flensted-Jensen's integral and normalised to take the value\
        \ `1`\n  at the identity; `l.lowestKType` is the highest weight of its lowest `K`-type. On the maximal\n\
        \  compact subgroup it is the coefficient at the highest weight vector of this `K`-type\n  (`New.dsCoeff_of_mem_maxCompactU`).\n\
        * A parameter `l = 2λ` indexed by `n` has gap `A` if its entries are distinct and congruent to\n  `card\
        \ n - 1` mod 2, and `|λ a - λ b| ≥ A` whenever `ε a ≠ ε b`; `l.HasLargeGap h` says that `l`\n  has gap `500\
        \ (card n)³ + h`.\n* `l.laplaceIntegrand k j φ s` is the coefficient of `l` at the first component of `j\
        \ s`, times the\n  conjugate of the coefficient of `k` at the second, times `exp (-φ s)`.\n* `IsLaplaceDatum\
        \ l k j τ B e φ` collects the hypotheses of Laplace's method. Let `μ`, `μ'` be the\n  weights `l.lowestKType`,\
        \ `k.lowestKType` and let `j s = (g, g')`.\n  - The parameter `l` is steep (`IsSteep`) for the splitting\
        \ `e : X ⊕ Fin M ≃ n`: on `X` the sign is\n    `+1` and `μ` is `0`; on the other `M` indices the signs are\
        \ `+, -, +, …` and `μ` decreases\n    strictly in `[-3 B, -B]`.\n  - The weight `μ'` is nonnegative, at\
        \ most `3 B` if `η` takes both signs, and `0` on the image of\n    `τ : X → m`, where the sign is `+1`.\n\
        \  - The phase `φ s = tr (μ (g - 1)) - tr (μ' (g' - 1))` is additive and imaginary, and\n    `tr (g - 1)\
        \ = tr (g' - 1)`.\n  - For each unitary `u` indexed by `X` there is an `s` such that `g - 1` and `g' - 1`\
        \ are `u - 1`\n    extended by zero along `e` and along `τ`.\n\n## Relation to the literature\n\nThis file\
        \ is the step of Laplace's method that makes restriction periods explicitly large. Near 1 a\ndiscrete series\
        \ coefficient of U(p,q) is an explicit phase times a number close to the interval\n[0,1], up to a tenth\
        \ of its size and an exponentially small error, so that the losses at the\narchimedean places are at most\
        \ powers of the weights. The integral formula for coefficients,\nnon-vanishing of periods and fixed-rank\
        \ asymptotics for coherent states are known in the literature.\nRelated work: Nelson–Venkatesh, The orbit\
        \ method and analysis of automorphic forms, 2021; H. He, On\nthe Gan–Gross–Prasad conjecture for U(p,q),\
        \ 2017; B. Sun, Matrix coefficients of cohomologically\ninduced representations, 2007.\n"
