    excerpt:
      path: grh/src/New/Appendix/DiscreteSeries/OneMinor.lean
      line: 7
      endLine: 14
      startOffset: 150
      endOffset: 902
      text: 'Estimates for one principal minor `det_S`, in terms of the blocks that cross the set `S` of indices,

        that is, the entries `(i, j)` with exactly one of `i`, `j` in `S`: its size on a unitary matrix

        (`norm_principalMinor_sq_le_exp`), and its form on `kᴴ ĝ k` for `k` unitary and block diagonal and

        `ĝ = reducedExp ε o Z` for a small `Z` in the Lie algebra of `U(J)`, with `o` injective and

        `o i < o j` whenever `i ∈ S` and `j ∉ S` (`exists_principalMinor_conj_reducedExp_eq_cexp`): up to an

        error, `exp (tr P Z + ‖[P, Z]‖² / 4)`, where `P` is the projection to `S` and `‖[P, Z]‖` is the norm

        of the two blocks of `Z` that cross `S`. A third estimate for one minor is

        `exists_det_one_add_proj_mul_eq_exp` in `New.Appendix.DiscreteSeries.MinorSecondOrder`.'
    remainder:
      path: grh/src/New/Appendix/DiscreteSeries/OneMinor.lean
      line: 14
      endLine: 30
      startOffset: 902
      endOffset: 1768
      text: "\n\nThe matrix `ĝ` differs from `exp Z` by unipotent factors. Block diagonal triangular factors multiply\n\
        Flensted-Jensen's coefficient by a character of their diagonal if the matrices involved are\naccretive (`flenstedJensen_triangular_mul_mul_triangular`),\
        \ so for small `Z` the coefficient is the\nsame at `ĝ` and at `exp Z` (`flenstedJensen_reducedExp`).\n\n\
        All norms of matrices are Frobenius norms, and `ε : n → ℤˣ` is a vector of signs. Notation:\n* `principalMinor\
        \ X p`, `coordProj p`: the principal minor `det_S X` and the diagonal projection for\n  the set `S` of indices\
        \ satisfying `p`.\n* `blockDiagAlg ε`: the matrices that vanish at `(i, j)` whenever `ε i ≠ ε j`.\n* `lowerMask\
        \ ε o Z`: the matrix that keeps the entries `(i, j)` of `Z` with `o j < o i` and\n  `ε i = ε j`.\n\n## Relation\
        \ to the literature\n\nSee `New.Appendix.DiscreteSeries.Periods` for related work.\n"
