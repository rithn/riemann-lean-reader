    excerpt:
      path: grh/src/New/Appendix/DiscreteSeries/MinorSecondOrder.lean
      line: 6
      endLine: 10
      text: 'For an orthogonal projection `Q` and small matrices `A₁`, `A₂`, `A₃` we expand

        `log det (1 + Q (exp A₁ exp A₂ exp A₃ - 1))` to second order. The rest vanishes to order three in

        the `Aᵢ` and to order two in their parts that cross `Q`; Schwarz''s lemma turns this into the bound

        `O(δ ζ²)`, where `δ` bounds the `Aᵢ` and `ζ` bounds the commutators `⁅Q, Aᵢ⁆`. All norms are

        Hilbert–Schmidt (Frobenius) norms, and no constant depends on the dimension.

        '
    remainder:
      path: grh/src/New/Appendix/DiscreteSeries/MinorSecondOrder.lean
      line: 11
      endLine: 24
      text: "\nThe main result is `exists_det_one_add_proj_mul_eq_exp`. The order three is obtained by direct\n\
        estimates of the exponential series and of the integral that defines the logarithm. The rest\n`logMinorRemainder`\
        \ is a principal logarithm, holomorphic in the factor `τ` that scales the crossing\nparts, and Schwarz's\
        \ lemma is applied in `τ`.\n\nNotions from other files:\n* `logOneAdd M = ∫ s in 0..1, (1 + s M)⁻¹ M` is\
        \ the matrix logarithm `log (1 + M)`, used for\n  `‖M‖ ≤ 1 / 2`.\n* `IsStarProjection Q` says that `Q` is\
        \ an orthogonal projection: self-adjoint and idempotent.\n\n## Relation to the literature\n\nSee `New.Appendix.DiscreteSeries.Periods`\
        \ for related work.\n"
