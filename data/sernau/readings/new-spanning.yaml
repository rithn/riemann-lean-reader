      startOffset: 172
      endOffset: 1103
      text: 'The file sets up the objects that connect the analysis at one real place with the filling argument.

        `New.Shape.G₁` is the unitary group of a hermitian form made of ϱ hyperbolic planes, a positive

        space X₀ with basis κ and a vector z with h(z, z) = −1. The frame is (e₁, …, e_ϱ, z). The Bessel

        subgroup `New.Shape.Form.besselS` is generated by the unipotent group 𝖴 = `New.Shape.Form.besselU`

        and by `New.Shape.Form.besselH` = U(X₀). `New.frameVector y a` is the image under `y⁻¹` of the

        `a`-th frame vector. The file first proves elementary bounds on the length `New.besselLength y`, the

        infimum of `‖s * y‖ + 1` over `s` in `besselS`. It then defines the lattice basis, the discriminant

        𝗀 and the link, and the structure `New.BesselSystem` listing what is used of a Bessel function W and

        its cut W♭. Norms on G₁ are those of the Euclidean norm for which the basis e_a, x_i, z, e*_a is

        orthonormal. The frame has n = ϱ + 1 vectors.'
    remainder:
      path: grh/src/New/Spanning/Bessel/Basic.lean
      line: 16
      endLine: 46
      startOffset: 1103
      endOffset: 2906
      text: "\n\n## Main definitions and results\n\n* `New.norm_add_one_le_of_mem_frameBox`: `‖y‖` is bounded by\
        \ the lengths of `y⁻¹ e_a`, `y⁻¹ z` and\n  `y⁻¹ e*_a`.\n* `New.orthoFrame`, `New.gramSchmidtMatrix`: Gram–Schmidt\
        \ for the frame. The orthogonal vectors are\n  left invariant under `besselS` (`New.orthoFrame_besselS_mul`),\
        \ and the Bessel length bounds their\n  lengths on both sides (`New.norm_orthoFrame_mem_Icc`). The triangular\
        \ matrix depends continuously\n  on the point (`New.continuous_gramSchmidtMatrix`).\n* `New.besselLength_le_of_norm_orthoFrame`:\
        \ conversely, these lengths bound `besselLength y`; the\n  proof corrects `y` on the left until the first\
        \ bound applies. `New.besselLength_le_of_dual` is the\n  case of a frame with a bounded triangular dual\
        \ system.\n* `New.besselLatticeBasis`: the basis of the lattice, in which `x_{k₀}` is replaced by\n  `v\
        \ = x_{k₀} / p̄ + z / N`. `New.gram_besselLatticeBasis` gives its Gram matrix, with middle block\n  `New.latticeMiddleGram`.\n\
        * `New.frameDisc`: the quantity `|D_{ϱ+1}|² - N² |D_ϱ|²` in the leading minors `New.leadingMinor`,\n  written\
        \ `\U0001D5C0`. Up to sign it is the Gram determinant of the frame and its image under an isometry\n  (`New.det_gram_framePair`).\n\
        * `New.IsCutPair`: the L² bounds of W and W♭, the support of W♭, and decay below a common integrable\n \
        \ majorant (`New.IsDecayMajorant`).\n\nNotions from other files:\n* `New.Shape.besselFrame`: The indices\
        \ of the frame (e₁, …, e_ϱ, z) among the basis indices.\n* `New.Shape.middleGram`: for a scalar N, the diagonal\
        \ matrix on κ plus one point, with entries 1 on\n  κ and −N at the extra point.\n\n## Relation to the literature\n\
        \nReferences on Bessel functions and kernels are in `New.Spanning.Bessel.FillingData`; references on\nthe\
        \ decay of discrete series coefficients are in `New.Spanning.Bessel.CutTailBound`.\n"
