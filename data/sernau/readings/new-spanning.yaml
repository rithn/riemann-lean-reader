      path: grh/src/New/Spanning/Unfolding/PoincareSeries.lean
      line: 8
      endLine: 16
      text: 'This file builds Poincaré series from the Bessel functions of filling data S (`New.Filling`) on a

        hermitian space V that fits S, and computes their Petersson products.


        K = `New.Filling.latticeStabilizer` and K(M) = `New.Filling.principalLevel` are levels in the

        lattice basis of S. Here K(M) is the kernel of reduction at the chosen places, and M in this

        notation is the product of the two level primes, not an adelic point. For a graded space Y on V that

        fits S, the groups attached to Y correspond to those of S under `New.Filling.Fits.adelicEquiv` and

        `New.Filling.Fits.finiteEquiv`, and algebraic forms of level `S.sourceLevel` get coordinates indexed

        by classes and indices.

        '
    remainder:
      path: grh/src/New/Spanning/Unfolding/PoincareSeries.lean
      line: 17
      endLine: 50
      text: "\n## Main definitions and results\n\n* `New.Filling.Fits`: V matches S; this gives the identifications\
        \ `New.Filling.Fits.ratEquiv`\n  (rational points), `New.Filling.Fits.realHomeomorph` (infinite places)\
        \ and\n  `New.Filling.Fits.finiteEquiv` (finite places).\n* `New.Filling.Fits.cutBessel`, `New.Filling.Fits.poincareSeries`:\
        \ a coordinate i of the Bessel\n  function, cut off and supported on the coset of a class c, and the series\
        \ ∑_a φ_a ∑_γ of these,\n  a = (c, i).\n* `New.Filling.Fits.petersson_poincare`: the Petersson products\
        \ of translated series are the\n  amplitude sums `New.Filling.amplitudeSum` times the volume of the level.\n\
        * `New.Filling.Fits.poincareMap`, `New.Filling.Fits.coe_poincareMap`: the series are forms of level\n  `New.Filling.stdPrincipalLevel`,\
        \ linear in φ.\n* `New.Filling.Fits.sourceFormCoords`: algebraic forms of level `S.sourceLevel` as vectors\
        \ of the\n  Euclidean space on classes times indices.\n* `New.Filling.Fits.finrank_levelSpace_eq_sourceDim`:\
        \ the dimension of the space of these forms is\n  the number of classes times the dimension of the weight,\
        \ and it is positive.\n\nNotions from other files:\n* `New.Filling.besselFn`: W_i(y), the product over the\
        \ infinite places v of the i_v-th coordinate of\n  the local Bessel function W_v at y_v. Only the full (not\
        \ the cut) function is used: `.full`.\n* `New.Filling.classRep`, `New.Filling.classUnipotent`, `New.Filling.classCutoff`:\
        \ for a class c,\n  its representative h_c, the group \U0001D5B4_c(M) of rational unipotent u with h_c⁻¹\
        \ u h_c ∈ K(M), and a\n  cutoff β_c at the infinite places whose translates under \U0001D5B4_c(M) sum to\
        \ 1.\n* `New.Filling.termsOver`: the rational γ such that h_c⁻¹ γ h_c' lies in K and has reduction s.\n\
        * `New.Shape.Form.besselU`: the Bessel unipotent group \U0001D5B4: the isometries of\n  `New.Shape.Form.splitGram`\
        \ T that are block upper unitriangular for the levels\n  `New.BesselIndex.level`, so trivial on the middle\
        \ block.\n* X₀ is the hermitian space on κ with the standard form, all signs +1; U(X₀) is its unitary group.\n\
        \n## Relation to the literature\n\nThe file also contains known results stated on this proof's data: Poincaré\
        \ series along a Bessel\nsubgroup and their unfolding. See `Lib.DiscreteSeries.Bruhat.FloorGroups`.\n"
