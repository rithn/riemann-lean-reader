      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.Filling.IsFillingData.mul_sum_norm_sum_cosetAmplitude_sq_le`:\
        \ Siegel's step, which bounds the\n  squared norms of finitely many class sums by densities at finite places\
        \ weighted by the local\n  bounds.\n* `New.Filling.sum_norm_sum_cosetAmplitude_sq_le`: the estimate for\
        \ finitely many distinct classes\n  whose reductions fix the vectors at `Sg`. The bound is (1 + b⁻⁴) b^(−6\
        \ \U0001D530.k |Sg|) times the main\n  second moment times `unipotentCovolume`².\n* `New.Filling.linkSecondMoment_isOpenElement_le`:\
        \ the squared norms of the class sums of the cut\n  function add up to at most the same bound. The sum runs\
        \ over all links, pairs of classes and\n  reductions s that are open and fix the vectors at `Sg`; only terms\
        \ with `termDisc γ ≠ 0` enter.\n\nNotions from other files:\n* `New.Filling.IsAdmissible`: The standing\
