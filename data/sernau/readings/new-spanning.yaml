      text: 'The level `M` is the product of the primes `D.levelPrime 0`, `D.levelPrime 1`, and `D.chosenPlace`

        runs through the chosen places above it. The spherical Hecke operators away from `M` form an algebra

        that acts at once on the forms `D.principalForms V` of principal level for all hermitian spaces `V`.

        It commutes with the finite group `D.chosenGL`, so it acts on the good forms `D.goodForms V`, the

        image of the idempotent `D.e₀`.

        '
    remainder:
      path: grh/src/New/Spanning/Multiplicities/HeckeEigensystems.lean
      line: 12
      endLine: 33
      text: "\n## Main definitions and results\n\n* `New.Data.sphericalAlgebra`, `New.Data.heckeAlgebra`: the spherical\
        \ elements of the group algebra\n  and the operators that they give; `New.Data.heckeOnGood` is the action\
        \ on good forms.\n* `New.Data.heckeOperator`: the operators `T_{w,i}` at the places `New.Data.IsSplitOffLevel`,\
        \ as\n  members of the Hecke algebra; `New.Data.principalHeckeSplit` is the operator on one space.\n* `New.Data.eigenPart`:\
        \ the part with a given eigensystem. The parts are independent\n  (`New.Data.iSupIndep_eigenPart`), and\
        \ in finite dimension they span the forms\n  (`New.Data.iSup_eigenPart_eq_top`).\n* `New.Data.exists_hecke_proj_eigenPart`:\
        \ a Hecke operator that is `1` on one part and `0` on\n  finitely many others.\n\nNotions from other files:\n\
        * `New.Data.principalForms`: the forms on `V` of archimedean type `typeKernel D.paramW s` that are\n  fixed\
        \ by the principal level `J_M = D.chosenLevel` at the chosen places; `V.formRep` is the\n  action of the\
        \ finite adelic unitary group `G_f = Gf E n` on forms, and `K₀ = stdLevel E n` is its\n  standard maximal\
        \ compact subgroup.\n* `New.heckeSplit`: the Hecke operator `T_{w,i}` at a split place `w`, of the double\
        \ coset of\n  `diag (ϖ 1_i, 1)`.\n* `New.universalLevelAlgebra`: the elements of a group algebra that keep\
        \ the vectors of a given\n  level in every representation.\n"
