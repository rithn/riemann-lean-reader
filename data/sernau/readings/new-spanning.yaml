      endLine: 9
      text: 'The positions are cut into shells by their height. On one shell the bound for one frame loses a

        power of the height. Below a threshold this loss is affordable. Above it every position has a deep

        vector, whose gain pays for the loss. The argument is the same at a real place and at the finite

        places; the shells that are summed have the powers of 2 as heights.

        '
    remainder:
      path: grh/src/New/Spanning/Frames/Shells.lean
      line: 10
      endLine: 27
      text: "\nNotions from other files:\n* A `PlaceData` `F` at the place is its data: a unit `F.levelUnit`, the\
        \ positions, a compact box and\n  measures.\n* A gauge `Γ` is a notion of size at the place, with a scale\
        \ `Γ.loss ≥ 2` that bounds volumes.\n* `F.formMajorant` is the integral of the moduli of the two correlations\
        \ of `W` at a position, and\n  `Γ.weightedSquareProduct` is the product of their second moments, with a\
        \ constant.\n* `F.FloorMassLe j V 1` says that the mass of floor `j` near the next floor is at most `V`.\n\
        \nContents of this file:\n* `New.Floors.Gauge.IsShell`: a set of positions with a finite height at least\
        \ 1. It is covered by\n  few position balls (`New.Floors.Gauge.positionsOfSize`, each for its own gauge).\n\
        * `New.Floors.Gauge.IsShell.setLIntegral_le`: one shell.\n* `New.Floors.Gauge.IsShell.setLIntegral_formMajorant_le`:\
        \ the gain on a remote shell.\n* `New.Floors.Gauge.IsShell.setLIntegral_le_inv_height`: a few factors of\
        \ the gain pay for the\n  growth in the height.\n* `New.Floors.Gauge.lintegral_le_of_shells`: the sum over\
        \ the shells. The integral over a shell is\n  at most a common bound times the inverse of the height, and\
        \ `∑ 2⁻¹ ^ i = 2`.\n"
