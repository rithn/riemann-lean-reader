      text: "\n\nOn the frames `y = γ e` the fibre measure of the Gram map is compared with Haar measure in\n`New.LeGramFibre.mconv_fixerHaar_le`.\
        \ This file bounds the same fibre measure from below, by `dZ`\ntimes a measure on the frames whose products\
        \ with `e` form the matrix `Z`. Such a frame is `y' Z`\nwith `y'` dual to `e`. The first `ϱ` vectors of\
        \ `y'` are moved by `\U0001D5B4⁰`, and the part of the last one\nin `X₀ = ℂ ^ κ` runs over a sphere.\n\n\
        One can find the measure on the frames over `Z` by letting both frames vary and dividing two\nequalities\
        \ of fibre measures, the one on pairs of frames, which are tuples of `2 (ϱ + 1)` vectors\nwith an invertible\
        \ Gram matrix, by the one on frames. Here a fibre measure enters only through the\nrelation of being at\
        \ most it (`New.LeFibreMeasure`); the measure over `Z` is computed directly in\ncoordinates as a lower bound,\
        \ and the fibre measure on frames is used as an upper bound.\n\n* `New.RealPlace.lintegral_eq_lintegral_sphereMass_mul_dualFrameOfGram`:\
        \ Lebesgue measure on the\n  tuples dual to the frame, in terms of their Gram matrix and of `R°`.\n* `New.RealPlace.leGramFibre_gramSectionMeasure`:\
        \ the law of `s γ_Z e`, with a density proportional\n  to `New.RealPlace.gramDiscReal Z ^ (|κ| - 1)`, is\
        \ at most the fibre measure.\n* `New.RealPlace.lintegral_gramSection_le`: the mean value inequality for\
        \ the integral of\n  `f (s' γ_Z s)` over `s, s'` in `R°` and `Z` in `Ω`.\n\nNotions from other files:\n\
        * `fixerHaar \U0001D530`: the measure `du dh` on `R°`, with `u = unipotentOf q` for Lebesgue measure `dq`\
        \ and\n  `embedH h` for the Haar probability measure `dh` on `U(κ)`.\n* `frameCols`, `dualCols`, `isotropicCols`,\
        \ `definiteCols`, `freeCols`: the matrices with the\n  columns `(e₁, …, e_ϱ, z)`, `e*_b`, `e_b`, `x_i`,\
        \ and `(e_b, x_i)` respectively.\n* `J₁`: the hermitian form on the space with the basis `e_b, x_i, z, e*_b`,\
