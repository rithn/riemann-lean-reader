        \ and\n  `New.Filling.linkDiscSq` is the squared discriminant of a lattice for it.\n* `New.Filling.HasIntegralLifts`:\
        \ the predicate that the columns of an adelic matrix are images\n  under `New.linkMatrix γ` of vectors of\
        \ `h_c Λ₀` that are adelic combinations of rational vectors\n  orthogonal to `A` and `γ A`.\n* `New.Filling.paddedLeading`:\
        \ the first `j` rows of a matrix, completed by rows of `1`; its\n  determinant is the leading minor of order\
        \ `j` (`New.Filling.det_paddedLeading`). For the matrix\n  `S.frameProducts γ` its inverse gives the vectors\
        \ that `f` and `γ f` share\n  (`New.Filling.HasCellRank.exists_shared_frame_vector`).\n* `New.Filling.latticeDisc`,\
        \ `New.Filling.isotropicRowsIndex`, `New.Filling.torsionIndex`: a\n  discriminant and two lattice indices.\
        \ `New.submoduleIndex M M'` is the index of `M ⊓ M'` in `M'`,\n  `New.colLattice` a column span.\n* `New.Filling.subframeMinor`:\
        \ the minor `δ_*(γ)`, nonzero for a term with a cell rank\n  (`New.Filling.HasCellRank.subframeMinor_ne_zero`).\n\
        * `New.Filling.minorGauge`, `New.Filling.maxGauge`: the gauges of a term.\n  `New.Filling.IsNearRepresentative`\
