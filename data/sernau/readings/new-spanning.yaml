    excerpt:
      path: grh/src/New/Spanning/Bessel/FillingData.lean
      line: 12
      endLine: 16
      text: 'The filling theorem is stated for abstract data (`New.Filling`). This file builds such data from

        admissible data D (`New.Data`). At each real place it constructs a Bessel system of the type fixed

        by D. It then assembles these systems, the relevant primes and places, and the level `D.levelX 0`

        into the filling data. It identifies that level with the preimage of the level K(M) of

        `New.Filling.principalLevel`: here M = p₀ p₁, and K(M) includes a congruence modulo π.

        '
    remainder:
      path: grh/src/New/Spanning/Bessel/FillingData.lean
      line: 17
      endLine: 44
      text: "\n## Main definitions and results\n\n* `New.Data.exists_besselSystem`: the Bessel function at a real\
        \ place, with its normalisation,\n  Schur's bound, decay, cut and local bounds. That its coordinates are\
        \ orthonormal is\n  `New.BesselSystem.orthonormal`, in `New.Spanning.Bessel.Orthonormality`.\n* `New.Data.filling`:\
        \ the prime `New.Data.N`, the primes p₀, p₁ (field `levelPrime`) with their\n  chosen places, the level\
        \ `D.levelX 0` and a Bessel system at each infinite place.\n* `New.Data.levelX_zero_eq_comap`: the level\
        \ `D.levelX 0` is the preimage of the principal\n  congruence subgroup K(M), that is `New.Filling.principalLevel`.\n\
        \nNotions from other files:\n* `New.Data.piNIdele`: the principal finite idele of `π`, where `N = π π̄`;\
        \ `New.Data.piNPlaces` is\n  the set of places dividing `π`.\n* `New.Data.piM`: the conjugate of the integer\
        \ `D.piMBar` of norm `p₀ p₁`; the chosen places are its\n  prime divisors.\n\n## Relation to the literature\n\
        \nAt a real place, integrals of a Bessel function on an indefinite unitary group against its\ntranslates\
        \ have Fourier transforms decaying beyond a band; the bounds themselves are proved in the\nimported files.\
        \ These integrals replace Petersson's J-Bessel kernel in showing that few translates\nalmost span the target\
        \ forms. Rank one is classical, and Bessel kernels are studied for GL(n) and\nGSp(4).\n\nRelated work: Petersson,\
        \ Über die Entwicklungskoeffizienten der automorphen Formen, 1932; NIST DLMF\n§10.22; Baruch, Bessel distributions\
        \ on the open cell, 2001–2004; Comtat et al., Effective Kuznetsov\ntrace formula for GSp(4), 2025.\n"
