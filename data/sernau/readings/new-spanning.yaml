      line: 7
      endLine: 10
      startOffset: 95
      endOffset: 415
      text: 'Let `S : Filling E 𝔰` be admissible data for a CM field `E` and a shape `𝔰`, with `M = S.M` the

        level and `b = S.b`. Consider the tuples of complex numbers, one for each infinite place, modulo

        `M 𝓞_E`, and fix a measurable set `D` of representatives, each coordinate of each point of `D`

        having modulus at most `b ^ 26`.'
    remainder:
      path: grh/src/New/Spanning/RemainingTerms/Box.lean
      line: 10
      endLine: 30
      startOffset: 415
      endOffset: 1561
      text: "\n\nAn archimedean point `y` is reduced if the entries above the diagonal of its triangular matrix\n\
        `S.ratTriangle y` lie in `D`. It is boxed if it is reduced and lies in the cut at every place `v`,\nthat\
        \ is, `besselLength (y v) ≤ b ^ (6 n + 2)`, where `n = \U0001D530.n = \U0001D530.ϱ + 1`.\n\nNotions from\
        \ other files:\n* `frameVector z a`: for `z` in `\U0001D530.G₁`, the image of the `a`-th frame vector under\
        \ `z⁻¹`;\n  `orthoFrame z` is the result of the Gram–Schmidt process on these vectors.\n* `gramSchmidtMatrix\
        \ z`: the unitriangular matrix of the coefficients of `frameVector z` in\n  `orthoFrame z`; `S.ratTriangle`\
        \ reads it in the rational frame.\n* `besselLength z`: the infimum of `‖s * z‖ + 1` over `s` in the Bessel\
        \ subgroup.\n* `frameBox r`: the points at which all frame vectors have length at most `r`.\n\n## Main definitions\
        \ and results\n\n* `New.Filling.exists_isResidueDomain`: such a set `D` exists.\n* `New.Filling.boxedPoints`:\
        \ the boxed points.\n* `New.Filling.mul_mem_boxedPoints_iff`: invariance under the unipotent elements fixing\
        \ the frame.\n* `New.Filling.mem_frameBox_of_mem_boxedPoints`: at a boxed point the frame vectors have length\
        \ at\n  most `b ^ (37 n)`.\n"
    needs_draft: true
    reason: Only sets up admissible data and a set of representatives; it states no result.
    standaloneReview:
      verdict: needs-draft
      reason: Only sets up admissible data and a set of representatives; it states no result.
