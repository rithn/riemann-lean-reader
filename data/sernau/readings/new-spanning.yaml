      line: 12
      endLine: 38
      text: "Here `d T = New.Filling.sublatticeDiscriminant u.val.val_inv T` is the discriminant of `T ∩ u Ô^κ`;\n\
        the first argument proves `u u⁻¹ = 1`.\n\n## Main definitions and results\n\n* `New.Filling.sublatticeBasis`,\
        \ `New.Filling.sublatticeDiscriminant`: a basis and the discriminant\n  of the points of a subspace `V`\
        \ that `H` makes integral.\n* `New.Filling.siegel_lemma`: a subspace of codimension `s` is cut out by `s`\
        \ short vectors.\n* `New.Filling.tsum_sublatticeDiscriminant_inv_le`: an explicit bound for `∑ (d T)⁻¹ ^\
        \ (#κ + 1)`\n  over the subspaces `T` of `E^κ` of codimension `s`. It follows from `New.Filling.siegel_lemma`:\n\
        \  each `T` is charged to its tuple of vectors, and a packing bound sums over the lattice.\n\nNotions from\
        \ other files:\n* `New.CMType E`: `E` is a CM number field (it extends `NumberField E` and `IsCMField E`)\
        \ with a\n  chosen complex embedding `Φ v` inducing each infinite place `v`.\n* `New.IsPrimitiveMatrix O\
        \ X`: `X` has entries in `O` and a left inverse with entries in `O`.\n* `New.genIndex a`: the inverse of\
        \ the factor by which a unit `a` scales Haar measure, `0` for a\n  non-unit.\n\n## Relation to the literature\n\
