      text: "\n* `New.Filling.sum_ratPoint_le_mul_add_integral_of_fourier_le`: one-sided Poisson summation over\
        \ the\n  infinite places and `T`, at rational points integral off `T`.\n* `New.Filling.entryDensity`, `New.Filling.densitySum`:\
