        \ coordinates and an index.\n* `New.Filling.mainSecondMoment`: The real number `sourceDim`² / (`besselDegree`\
        \ · mass), with the\n  mass `New.mass` of the genus of the standard lattice of rank dim V.\n* `New.Filling.termsOver`\
        \ c s c': The terms over (c, s, c'): rational γ such that h_c⁻¹ γ h_c' lies\n  in the stabiliser K of the\
        \ lattice and has reduction s.\n\n## Relation to the literature\n\nIn the unfolded second moment of the\
        \ Poincaré series, the summed main terms are dominated by the\nquadratic form of a positive kernel of local\
