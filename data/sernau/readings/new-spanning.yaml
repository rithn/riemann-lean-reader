        \ is `S.latticeMiddle`; in rational coordinates\n  it is `S.ratMiddle = diag(1, -N)`, and `S.linkForm` is\
        \ the form `diag(T, -T)` for this matrix `T`.\n* `New.genIndex`: the generalised index `[a]` of an adele\
        \ `a`; it is `0` for a non-unit.\n"
