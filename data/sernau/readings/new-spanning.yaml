      text: 'This file bounds the share of the bad types for tuples of polynomials over fields with q elements.

        A label is a monic squarefree polynomial of degree `r` that does not vanish at `0`. The file

        counts the monic polynomials that are not allowed and the primitive polynomials. It then bounds

        the coefficient at the identity of one minus the sum of the idempotents of the good tuples.

        '
    remainder:
      path: grh/src/New/Spanning/MainTerm/BadTypes.lean
      line: 12
      endLine: 33
      text: "\n## Main definitions and results\n\n* `New.card_not_primitive_mul_le`: for `1 < r < q`, with every\
        \ polynomial weighted by\n  `(1 - r / q) / q ^ r`, the monic polynomials of degree `r` that are not primitive\
        \ polynomials\n  weigh at most `exp (-1 / (2 r (2 r log q + 1)))` in total.\n* `New.re_coeff_one_sub_sum_tupleIdem_le`:\
        \ the bound on the coefficient at the identity of one minus\n  the sum of the idempotents of the good tuples.\n\
        \nNotions from other files:\n* `New.tupleIdem`: For a tuple (c_w) of polynomials over the fields k_w, the\
        \ tensor product of the\n  polynomial idempotents e_{c_w} in the group algebra of ∏ GL_n(k_w).\n\n## Relation\
        \ to the literature\n\nIn the regular representation of a product of groups GL_r(F_q), types that are not\
        \ good have share\nat most a multiple of 1/q per factor plus a term decaying exponentially in the number\
        \ of factors. So\nthe projection to good types discards little when translates of the Poincaré series fill\
        \ the rows.\nIt computes the Plancherel shares for GL_r(F_q) from Green's degree formula and counts of squarefree\n\
        and primitive polynomials over F_q, followed by a union bound over the factors. Related work: Green,\nThe\
        \ characters of the finite general linear groups, 1955; Dudko, Plancherel measures for GL(n,q),\narXiv 0806.1345,\
        \ 2008; Lidl–Niederreiter, Finite Fields, ch. 3, 1983.\n"
