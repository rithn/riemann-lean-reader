        \ from other files:\n* `New.Filling`: the data `S`, among them the size parameter `b = S.b`, the level `M\
        \ = S.M`, the\n  prime `N = S.N` and a generator `ϖ = S.deltaE` of the different of `E`.\n* `New.Filling.IsAdmissible`:\
        \ the standing hypotheses on `S`, among them `1 ≤ |S.realM v| ≤ b ^ 23`\n  and `N ≤ b ^ (60 n)`.\n* `New.ψf\
        \ E`, written `ψ_f`: the character of the finite adeles with `ψ_f(x) = exp (2πi Tr a)` for\n  any `a ∈ E`\
        \ with `x - a` integral. `New.stdAddChar E` is the standard character of the adeles, and\n  `New.Filling.selfDualChar`\
        \ is `x ↦ ψ_f(-x / ϖ)`.\n* `New.LocProd T`: the product of the completions at `T`, with integers `New.SemilocalField.O`;\n\
        \  `New.evalPlaces T` and `New.ratToPlaces T` map the finite adeles and `E` to it.\n* `New.integralOff T`,\
        \ `New.Filling.ratIntegralOff T`: the finite adeles and the elements of `E`\n  (the `T`-integers) that are\
        \ integral at every finite place outside `T`.\n* `New.genIndex a`, `New.denomIndex O a`: the generalised\
