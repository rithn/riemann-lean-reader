        \ of `jetSeries V a f`.\n* `New.Parameters.IsResolutionProduct`: the theta functions of the rational translates\
        \ of a vector\n  are products of translated entire functions of linear forms; `IsResolutionProduct.theta_translate`\n\
        \  and `IsResolutionProduct.jetSeries_translate` give their theta values and Taylor series.\n* `New.Parameters.exists_isResolutionProduct_of_isTightFrame`:\
        \ a product of monomial sections,\n  pulled back along a tight frame, is the theta function of a vector\
        \ with integral values.\n\nNotions from other files:\n* `New.Parameters`: a multiple `q₀` of `18480 = 16\
        \ · 3 · 5 · 7 · 11` and a prime `d` with\n  `d ≡ q₀/2 - 1 mod q₀`. The CM field `E = P.E s` is generated\
        \ over `K` by a primitive `q₁`-th root\n  of unity `ζ`, `q₁ = P.q₁ s`, and `Φ τ : E →+* ℂ` is the embedding\
        \ of its CM type at the infinite\n  place `τ`.\n* `New.finiteImage`: for a family `γ` in `E`, the finite\
        \ adeles `α⁻¹ γ k`, with `α = P.α s` the\n  idele of the fractional ideal `\U0001D51E₀`; so `finiteImage\
        \ id y ∈ Ô E` says that `y` lies in\n  `\U0001D51E₀ = E ∩ α Ô`.\n* `New.PadicPlace`: a `p`-adic place of\
        \ `ℂ`, that is, a ring homomorphism `ιₚ : ℂ →+* ℂ_[p]`.\n* `New.Space.entireTheta`: for `f` in the space\
        \ `\U0001D4AE V` of a hermitian space `V`, the function\n  `y ↦ θ(ϱ(y) f) exp(|y|²/2)` of a real vector\
        \ `y` in Fock coordinates, with `θ` the theta\n  functional `V.θ` and `ϱ` the Heisenberg representation\
        \ `V.ϱ`.\n* `finVec x`: the adelic vector with finite part `α x` and real part zero. So\n  `V.ϱ (finVec\
