      endLine: 13
      text: 'Fix admissible data `D` (`New.Data`) with primes p₀, p₁ (p_i is `D.levelPrime i`) and an integer

        `D.piMBar` of K of norm p₀p₁. The chosen places are the finite places of E that divide the complex

        conjugate of `D.piMBar`.


        The file defines residue characters at the chosen places, characters of U(1)(𝔸) of given weight and

        pairs, and proves that there are finitely many pairs. It also bounds the generator of the different

        of E and the root discriminant at the infinite places between `x ^ 10` and `x ^ 12`, where `log x`

        is `D.logX`.

        '
    remainder:
      path: grh/src/New/Derivatives/Field/ChosenPlaces.lean
      line: 14
      endLine: 47
      text: "\n## Main definitions and results\n\n* `New.Data.IsChosen`, `New.Data.ChosenPlace`: the chosen places,\
        \ and those above p_i. Each lies\n  above p₀ or p₁ (`New.Data.exists_levelPrime_mem_of_isChosen`). A place\
        \ above p_i has norm p_i\n  (`New.Data.q_eq_levelPrime`).\n* `New.Data.chiMLocal`: residue characters of\
        \ order q₂ at the chosen places, trivial elsewhere. At a\n  chosen place it is the q₂-th power of a character\
        \ `New.Data.chiMLocalRoot` of order q₂².\n* `New.Data.chiZero`, `New.Data.chiM`: characters of U(1)(\U0001D538\
        ) of weight -w₀ and trivial tame part,\n  and of weight 0 and tame part `New.Data.chiMLocal`. By\n  `New.AutChar.exists_hasWeight_of_prod_eq_one`\
        \ they exist because the formula of\n  `New.AutChar.HasWeight` gives 1 on the integral rational points of\
        \ U(1), which are q₁-th roots of\n  unity (`New.Data.exists_char_hasWeight`).\n* `New.Data.CriticalPair`:\
        \ a character of weight -c with tame part trivial off the chosen places,\n  and an integer z with 1 ≤ z\
        \ ≤ t and z ≤ c ≤ 4b. There are finitely many\n  (`New.Data.finite_criticalPair`).\n* `New.Data.hasLogBound_deltaE`:\
        \ at every infinite place the generator `New.Parameters.deltaE` of\n  the different has absolute value in\
        \ `[x ^ 10, x ^ 12]`.\n* `New.Data.rootDisc_mem_Icc`, `New.Data.hasLogBound_rootDisc`: so does the root\
        \ discriminant\n  `New.Data.rootDisc`, their geometric mean. The class `D.HasLogBound u F l` says `|F| ≤\
        \ exp l` for\n  `u = true` and `exp l ≤ F` for `u = false`; so `(if u then 12 else 10) * log x` gives both\
        \ bounds\n  at once.\n\nNotions from other files:\n* `New.Data.E`: The field E = K(ζ), ζ a primitive root\
        \ of unity of order q₁, a multiple of q₀ that\n  depends on the exponent s = `D.towerExp` of the data; `New.Data.Φ`\
        \ is the type of its infinite\n  places.\n* `New.AutChar`: The group of continuous circle-valued characters\
        \ of U(1)(\U0001D538), the norm-one adeles of\n  the CM field E, trivial on elements coming from E.\n* `New.AutChar.HasWeight`:\
        \ μ has weight e and tame part ψ: almost all residue characters ψ_w are\n  trivial, and μ(u) = ∏_v u_v^{e(v)}\
        \ · ∏_w ψ_w(u mod w) whenever u has integral finite part.\n* `New.Parameters.q₂`: The natural number q₂\
        \ = (q₀d)^(s+6); q₂² divides p_i - 1.\n* `New.Data.liftWeight`: The number w_j(σ) = κ(σ) + (j + 1/2) Δ,\
        \ with κ = `New.Data.weight`, the gap\n  Δ = `New.Data.gap` and Δ/2 = `New.Data.halfGap`.\n"
