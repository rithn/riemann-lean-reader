      text: "* `New.norm_jet_le_of_isHomogeneous`: Legendre's bound for the jet of an integral series along a\n\
        \  homogeneous integral polynomial.\n* `New.minorProd`, `New.predictedDivisibility`: products of minors,\
        \ and the divisibility predicted\n  by their shape.\n* `New.Parameters.norm_jet_minorProd_le_of_hasNormalForm`:\
        \ the count. The jet of a series with the\n  normal form along a product of minors has the predicted divisibility,\
        \ up to an error term.\n* `New.Parameters.norm_jet_minorProd_le_of_charges`: the count with charges. The\
        \ columns of height\n  one at a set of marked places are removed from the prediction, and powers `p ^ w`\
        \ of `p` on the\n  rows, the charges, pay for them. The exponents `w` satisfy the condition of `New.IsChargeExponent`\n\
        \  for pairs of columns that occur in `κ`, and `New.fillingCharge` is their sum over the boxes.\n* `New.exists_norm_schurJet_le_norm_jet_minorProd`:\
        \ an entry of the Schur matrix may be replaced by\n  a product of minors of `z y` with `y` integral."
    remainder:
      path: grh/src/New/Derivatives/Divisibility/Count.lean
      line: 18
      endLine: 56
      startOffset: 1170
      endOffset: 3847
      text: "\n\nA linear substitution makes the couplings that matter in the degree of the jet divisible by `π_p`,\n\
        so that the series becomes integral in that degree. Legendre's bound applies, and the chain rule\ngives\
        \ the factor whose valuation is deducted. Each box gains about `γ_p`, and the deduction is\n`v(π_p)` times\
        \ a sum of numbers `New.deductionTerm`. The argument is carried out once, with charges\n(`New.Parameters.norm_jet_minorProd_le_of_isChargeExponent`);\
        \ the count itself is the case without\nmarked places and with all charges equal to one.\n\nNotions from\
        \ other files:\n* `valRingCp p`: the valuation ring of `ℂ_[p]`; its elements are called integral, and a\
        \ lower bound\n  for a valuation is written as an upper bound for the norm.\n* `New.jet R Q F`: the number\
        \ `(Q(∂) F)(0)`, for a polynomial `Q` and a power series `F`.\n* `New.WeylIndex n κ`, `New.schur`, `New.schurJet`:\
        \ `κ τ h` is the number of columns of height `h`\n  of a diagram at the place `τ`. The standard fillings\
        \ of these diagrams index the Schur matrix of a\n  family of matrices `z_τ`, and `schurJet κ F` is the matrix\
        \ of jets of `F` along its entries.\n* `New.coupling pr e`: the series `Γ_e = ∑ z_(τ, c) ^ p ^ e * z_(pr\
        \ e τ, c)`, where `pr e τ` is the\n  partner of the place `τ`. `New.deductionTerm p κ N marked τ τ' e` is\
        \ the real number\n  `min (t / p ^ e) (r' + t') + r / p ^ e + min (B / p ^ e) B'`. Only heights below `N`\
        \ count: `t`\n  is the number of columns of height one at `τ` (zero if `τ ∈ marked`), `r` that of the low\
        \ columns\n  (the other ones) and `B` that of their boxes. The primed letters refer to `τ'`.\n* For `K =\
        \ ℚ(√-d)`: `χ_K = New.chiK d`, `π_p = New.piPrimeInt d` has valuation\n  `v(π_p) = New.piPrimeValuation\
        \ d p`, `ρ_p = New.varpiValuation d p`, and\n  `γ_p = New.gammaPrime d p = 1 / (p - 1) - ρ_p`. The set `I_p°\
        \ = New.partnerExponents d p` consists\n  of the odd numbers if `p` is inert and of all numbers if `p =\
        \ d`, and\n  `I_p = New.positivePartnerExponents d p` of its positive elements. `New.Parameters.partner`\
        \ is the\n  partner `-p ^ e τ` of `τ`.\n* `New.HasNormalForm`: `F(ϖ z)` is an integral series times the\
        \ exponential of `ϖ ^ (p + 1) / p`\n  times an integral combination of the powers `Γ_e ^ p ^ j`.\n\n## Relation\
        \ to the literature\n\nOne- and two-variable divisibility at inert `p` over an imaginary quadratic field\
        \ is known in the\nliterature.\n\nRelated work: Katz, Divisibilities, congruences, and Cartier duality,\
        \ 1981; Chellali, Congruences\nentre nombres de Bernoulli–Hurwitz dans le cas supersingulier, 1990; Fujiwara,\
        \ On divisibilities of\nspecial values of real analytic Eisenstein series, 1988; Bannai–Kobayashi–Yasuda,\
        \ Radius of\nconvergence of the p-adic sigma function, 2017.\n"
    standaloneReview:
      verdict: clear
      reason: States the jet divisibility count and its charged version.
