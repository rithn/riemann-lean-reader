        \ `ρ_p` the series `θ(ϖ z)` is\n  integral up to one exponential `exp (c_ϖ Ξ₁)`, where `c_ϖ = ϖ ^ (p + 1)\
        \ / p`, the series `Ξ₁` is\n  integral, and modulo `π_p` it has only terms `(z ^ p ^ e * z) ^ p ^ j` with\
        \ `e ∈ I_p°`\n  (`partnerExponents d p`: the odd numbers, and all numbers if `p = d`).\n"
    remainder:
