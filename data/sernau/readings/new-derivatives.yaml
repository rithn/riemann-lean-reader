      text: "\nThe proof has four steps.\n\n1. Averaging `ζ ^ (-p - 1) g(ζ z)` over the `(q_p - 1)`-th roots of\
        \ unity `ζ` replaces `g = -log θ`\n   by its part `g^♭` in the degrees `≡ p + 1` mod `q_p - 1`.\n2. The\
        \ Frobenius congruence gives a functional equation for `Ξ₁ = -g^♭(ϖ z) / c_ϖ`.\n3. The equation is solved\
        \ degree by degree. With `Y = T(ϖ z) / ϖ ≡ ∑_j z ^ q_p ^ j` and a number\n   `λ ∈ \U0001D4AA` one has `Ξ₁\
        \ ≡ λ Y ^ (p + 1)` for inert `p` and `Ξ₁ ≡ λ (Y ^ 2 - z ^ 2 / 2)` for `p = d`.\n   The coefficients of the\
        \ terms are `λ` in the first case, and `λ / 2`, `λ` or `2 λ` in the second.\n4. For inert `p` the coefficient\
        \ of `z ^ (p + 1)` in `Ξ₁` is a unit, and so is `λ`.\n\nNotions from other files:\n* `chiK d p` is the Legendre\
        \ symbol `(p / d)`; the prime `p` is non-split if `chiK d p ≠ 1`.\n* `q_p = primeNorm d p` is the norm of\
        \ a prime above `p`, `π_p = piPrime d p` is `√-d` if `p = d`\n  and `p` otherwise, and `ρ_p = varpiValuation\
        \ d p` is `v(π_p) / (q_p - 1)` with `v(p) = 1`.\n* `C : CMLattice d` is a lattice in `ℂ` that is stable\
        \ under the ring of integers of `ℚ(√-d)`, with\n  a chosen point `t` of order two.\n* `taylorVia ιₚ C.θ`\
        \ is the Taylor series over `ℂ_p` of the theta function `θ` of `C`, along the\n  embedding `ιₚ : ℂ →+* ℂ_[p]`\
        \ fixed by `PadicPlace p`, and `C.negLogTheta` is `g = -log θ`.\n* `C.integralSeriesRing` is the ring `\U0001D4AA\
        [[y]] = \U0001D4AA[[T]]`, where `y` is the Taylor series of\n  `C.translatedY` and `T = C.formalParam` is\
        \ the formal parameter.\n\n## Relation to the literature\n\nEarlier bounds for one curve at inert primes,\
        \ which are not used: Bannai–Kobayashi, Algebraic theta\nfunctions and the p-adic interpolation of Eisenstein–Kronecker\
        \ numbers (first arXiv version, Theorem\n4.1); Bannai–Kobayashi, Integral structures on p-adic Fourier theory;\
        \ Bannai–Kobayashi–Yasuda, The\nradius of convergence of the p-adic sigma function; Fujiwara, On divisibilities\
        \ of special values of\nreal analytic Eisenstein series.\n"
