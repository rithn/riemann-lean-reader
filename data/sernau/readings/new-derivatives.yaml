        \ the Fock vector of the monomial `z ^ k`.\n\n## Relation to the literature\n\nA product of monomial sections\
        \ of a CM curve, pulled back along a tight frame at scale `a / δ̄`, for\nan integer `δ` of `K` and a point\
        \ `a` of the lattice of the curve, is the theta function of a vector\nof the finite part, by Fourier inversion.\
