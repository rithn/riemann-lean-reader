      text: "\n## Main definitions and results\n\n* `New.Parameters.areaScale` is `√(2π / √d)`, and `New.Parameters.periodFactor`\
        \ is `vacuumRoot`\n  divided by the unit of `New.CMLattice.chowla_selberg`.\n* `New.Parameters.jetScale`:\
