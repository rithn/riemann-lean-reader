      path: grh/src/New/Derivatives/Divisibility/NullFrames.lean
      line: 7
      endLine: 11
      text: 'This file gives matrices over the integers of `ℂ_p`, one for each place and height, that change

        given directions. For a divisor `π` of `p`, the pairings `∑ β_a ^ p ^ e * β''_a` of new directions at

        a place and at its partner become divisible by `π`, apart from the exempt pairs of heights, which

        involve a marked place. The valuations of the determinants, one for each column, add up to at most

        the deduction: `v(π)` times the sum of the numbers `New.deductionTerm`.

        '
    remainder:
      path: grh/src/New/Derivatives/Divisibility/NullFrames.lean
      line: 12
      endLine: 24
      text: "\n## Main definitions and results\n\n* `New.deductionTerm`: the term of the deduction for a place,\
        \ a partner and an exponent `e`.\n* `New.CongruenceChoice`, `New.exists_congruenceChoice_cost_eq_and_covers`:\
        \ which congruences are\n  imposed for a place and a partner; a choice of cost `New.deductionTerm` covers\
        \ the pairs of\n  heights that are not exempt (`New.IsExemptPair`).\n* `New.newDirection`, `New.exists_newDirection_dvd`:\
        \ integral changes of direction at each place\n  and height that make the pairings that are not exempt divisible\
        \ by `π`, and whose determinants\n  cost at most the deduction.\n\nNotions from other files:\n* `New.valRingCp\
        \ p`: the integers of `ℂ_p`.\n"
