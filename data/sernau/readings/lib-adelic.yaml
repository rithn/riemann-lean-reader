      text: 'A simple trace formula for the unitary group of a hermitian space `V`, with terms sorted by the

        characteristic polynomials `R` of rational points. The test function is `e ⊗ φ`, with `e` a cusp

        kernel on the real group and `φ` locally constant of compact support on the finite adelic group.


        This file proves the Selberg principle: orbital integrals of an irreducible `R` with a root off

        the unit circle vanish. For `R` with all roots on the unit circle, it splits orbital integrals into

        real and finite factors and matches the classes of different signs. It concludes that the trace on

        forms depends neither on the space nor on its signs.

        '
    remainder:
      path: grh/src/Lib/Adelic/TraceFormula/TraceComparison.lean
      line: 16
      endLine: 61
      text: "\n## Main definitions and results\n\n* `New.Space.orbitalIntegral_eq_zero`: the orbital integral is\
        \ `0` if `R` is irreducible with a root\n  off the unit circle.\n* `New.Space.exists_geometricSide_singleton_eq`:\
        \ if `R` is irreducible with all roots on the unit\n  circle, `E` contains the 5040th roots of unity and\
        \ has an even number of infinite places, and the\n  parameter has a large gap, its term is a product of\
        \ characters of the compact unitary group times\n  a number that depends only on `R` and `φ`.\n* `New.trace_comparison`:\
        \ let `E` contain the 5040th roots of unity and have an even number of\n  infinite places, let `n ≥ 2`,\
        \ and let the parameter have a large gap. If `φ` is cuspidal at a\n  split place and, at a place `w'`, the\
        \ elements of its support are integral with `0` a simple root\n  of the characteristic polynomial modulo\
        \ `w'`, the reducible `R` contribute nothing, so the trace\n  depends neither on the space nor on its signs.\n\
        \nNotions from other files:\n* `New.Space E n s`: a hermitian form `J` over `E` with an adelic frame `x`\
        \ in which it is `diag s`\n  at infinity and `1` at the finite places. `V.ratEmbed` embeds `U(J)(E)` in\
        \ `G = G_∞ × G_f` with\n  image `Γ = V.Γ`, and `V.quotMeasure` integrates over `[G] = Γ \\ G`.\n* `New.IsCuspKernel\
        \ B e`: `e` is a minimal convolution idempotent on `G_∞` with moment of order\n  `B + 1` and decay of order\
        \ `B`, and `α ⋆ e = e` for some continuous compactly supported `α`.\n* `V.polyTerm k φ S γ x`: the value\
        \ of `k ⊗ φ` at `x⁻¹ γ x` if the characteristic polynomial of `γ`\n  lies in `S`, and `0` otherwise.\n*\
        \ `V.formRep e`: the action of `G_f` on the forms of type `e`, which for integrable `e` are the\n  bounded\
        \ automorphic functions on `G` fixed by right convolution with `e`; a level `K` is an open\n  subgroup of\
        \ the standard compact subgroup.\n* `New.Space.orbitalIntegral` (in `Lib.Adelic.TraceFormula.OrbitalUnfolding`):\
        \ the orbital integral\n  `I_γ`, the integral of the term of `γ` over `G` modulo the rational centraliser\
        \ of `γ`.\n\n## Relation to the literature\n\nComparison of simple trace formulas for unitary groups that\
        \ differ only at real places. Here\nintegrable idempotent kernels of very regular discrete series replace\
        \ pseudo-coefficients, and the\nCM field contains the 5040th roots of unity and has an even number of infinite\
        \ places. There is no\ntruncation and no endoscopy. Source: Labesse, Changement de base CM et séries discrètes\
        \ (2011),\nThms 5.4, 5.5 and their proofs; Arthur and Clozel (1989), ch. 1, Lemmas 2.4-2.6; integrable test\n\
        functions as in Knightly and Li, Traces of Hecke operators (2006); for the simple trace formula\nwith a\
        \ cuspidal component, Flicker and Kazhdan (1988) and Harris and Labesse (2004), Prop. 1.10.5.\n\nSelberg\
        \ principle that orbital integrals of an idempotent vanish off the elliptic set. Here the\nidempotent is\
        \ a minimal convolution idempotent with polynomial decay on a product of groups\nU(p,q), placed inside the\
        \ adelic orbital integral of a rational point with irreducible\ncharacteristic polynomial. If some eigenvalue\
        \ has absolute value other than 1, this integral is\nzero. Source: Harish-Chandra, Discrete series II, Acta\
        \ Math. 116 (1966), Thm 11; Blanc and\nBrylinski, Cyclic homology and the Selberg principle, J. Funct. Anal.\
        \ 109 (1992); Hochs and Wang,\nOrbital integrals and K-theory classes (2019), Cor 4.8.\n"
