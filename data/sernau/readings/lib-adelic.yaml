        \ `e τ` of the determinant.\n\n## Main definitions and results\n\n* `New.AlgForm`: functions `φ` on the\
        \ finite adelic points `New.Gf` with `φ(γ g) = ρ(γ) φ(g)` for\n  rational `γ`, where `ρ = New.Space.weightRep`,\
        \ whose stabiliser under right translation is open;\n  `New.algFormRep` is right translation.\n"
