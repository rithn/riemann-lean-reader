      endLine: 12
      text: 'The file collects local and idelic facts about number fields. For a CM field `E` it computes values

        of the splitting character `υ`, and with `New.HasPrimitiveRoot5040 E` it shows that `New.Ô E` in the

        finite adeles forms an adelic pair. It defines Schwartz–Bruhat functions, semilocal fields and tame

        local characters, and shows that a finite product of completions is a semilocal field. An auxiliary

        fact gives the valuation of natural numbers prime to one of valuation less than 1.

        '
    remainder:
      path: grh/src/Lib/Adelic/Adeles/LocalFactors.lean
      line: 13
      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.exists_reduction_and_idele_generator`: a nonzero ideal\
        \ `I` of `\U0001D4DE E` has an idelic generator\n  `t` in the integral finite adeles `New.Ô`, and `Ô / t\
        \ Ô = \U0001D4DE / I`.\n* `New.upsilon_toAdele`: the splitting character `υ` (`New.SplittingChar`) is trivial\
        \ on the\n  principal ideles.\n* `New.upsilon_eq_prod_mul_of_v_eq`, `New.upsilon_eq_atUniformizer_zpow`,\n\
        \  `New.upsilon_atUniformizer_mul_star`: values of `υ`, which is unramified at all finite places,\n  computed\
        \ from the valuations of the finite part and the values at the chosen uniformisers.\n* `New.schwartzBruhat`:\
        \ locally constant, compactly supported complex functions that vanish outside\n  a set. `New.schwartzBruhat.comp`,\
        \ `New.schwartzBruhat.isLocallyConstant_curry` and\n  `New.integral_mem_of_isLocallyConstant` are tools\
        \ for substituting and averaging.\n* `New.SemilocalField`: conditions on a topological ring `F` that a finite\
        \ product of\n  non-archimedean local fields meets, with ring of integers `O` and uniformiser `ϖ`.\n* `New.invOnUnits`,\
        \ `New.TameLocalChar`: `χ⁻¹` cut off to the units of `O`, and the data showing\n  that it comes from a primitive\
        \ character (`New.Exchange.IsPrimitiveMulChar`) of the finite ring\n  `O / ϖ`.\n\nNotions from other files:\n\
        * `New.IsAdelic`: The properties of the pair Ô ⊂ \U0001D538_f abstracted to R ⊂ A: R is open, compact and\n\
        \  stable under conjugation, locally a valuation ring, contains a skew element i with −i·i = 1 and an\n\
        \  element of trace 1, and −1 is a norm from R.\n* `New.HasPrimitiveRoot5040`: `E` contains a primitive\
        \ root of unity of order `7! = 5040`.\n* `New.SplittingChar`: a unitary Hecke character `υ` of `E` that\
        \ complex conjugation inverts and\n  whose value at an idele `x` with unit finite part is `∏ x_τ / |x_τ|`\
        \ over the infinite places\n  `τ`; `υ.atUniformizer w` is its value at the chosen uniformiser at the finite\
        \ place `w`.\n\n## Relation to the literature\n\nKnown; see `Lib.ClassField.Global.CMSplittingCharacters`\
        \ and `Lib.Weil.TameGaussSum` for sources.\n"
