      text: "This file concerns algebraic modular forms. These are functions on a group that transform on the\n\
        left by a representation of a group `Γ` embedded in it, and on the right by a character of a level.\n`New.levelSpace\
        \ π K χ` is the space of vectors on which `K` acts through `χ`.\n\n## Main definitions and results\n\n*\
        \ `New.deltaForm`: the form supported on one double coset, made from a vector. Its values are sums\n  over\
        \ the finite sets `New.transporter` (`New.deltaForm_apply`); `New.classSum_deltaForm` gives the\n  class\
        \ sum of its values under an invariant family of additive maps `W →+ ℂ`.\n"
