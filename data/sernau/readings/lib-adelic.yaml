      text: "The translates `g⁻¹ γ x B` of a small box `B` are disjoint, the majorant at the base point of each\n\
        is at most a bounded multiple of its values there, and it is integrable.\n\n* `New.tsum_mul_measure_le_lintegral`:\
        \ a sum over disjoint translates against an integral.\n* `New.Space.exists_levelBox_disjoint`: the translates\
        \ of the box `New.levelBox` are disjoint.\n* `New.Space.exists_tsum_majorant_le`: the bound for the sum\
        \ of `New.Space.majorant`.\n\nNotions from other files:\n* `G E s = GInf E s × Gf E n` is the adelic unitary\
        \ group: one copy of the real unitary group\n  `USign s` of the signs `s` at each infinite place, times\
        \ the finite adelic group `Gf E n`.\n* `stdLevel E n` is the subgroup of integral points of `Gf E n`; a\
        \ level is an open subgroup of it.\n* For `V : Space E n s`, a hermitian space on `Eⁿ` with a base lattice\
        \ `V.baseLattice`, `U V.J` is\n  the group of rational points and `V.ratEmbed` its embedding into `G E s`.\n\
        * `V.height x` is the inverse of the first minimum, cut off at `1`, of the lattice of `V` at `x`,\n  that\
        \ is, of the base lattice of the translate `V.move x`.\n* `TestFunction (Gf E n)` is the Schwartz–Bruhat\
        \ space of `Gf E n` (locally constant functions of\n  compact support).\n\n## Relation to the literature\n\
        \nKnown result: Sum over the rational points of a majorant of a test function, bounded by a power of\nthe\
