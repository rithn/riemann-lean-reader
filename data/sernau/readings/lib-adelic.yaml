      path: grh/src/Lib/Adelic/AutomorphicForms/Basic.lean
      line: 6
      endLine: 13
      text: 'This file studies functions on the adelic unitary group G = G_∞ × G_f of a hermitian space V over E

        with signs s. Here Γ = `V.Γ` is its group of rational points, and `V.quotMeasure` is the measure for

        integrals over Γ\G. The forms of type e (see `New.Space.IsForm` below) make up an inner product

        space under the Petersson product and carry an action of G_f. The height `New.Space.height` is the

        inverse of the first minimum `New.Space.firstMinimum`, cut off at `1`. Moderate growth and rapid

        decay are measured against the height, and the rapidly decaying automorphic functions form a

        subrepresentation. When Γ is cocompact, in particular when all signs of V are equal, every

        automorphic function has rapid decay.

        '
    remainder:
      path: grh/src/Lib/Adelic/AutomorphicForms/Basic.lean
      line: 14
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.Space.IsAutomorphic`: continuous, left Γ-invariant functions\
        \ with a level.\n* `New.Space.IsForm`: bounded automorphic functions that are fixed by convolution with\
        \ a kernel e if\n  e is integrable (for e not integrable this condition is empty). A form is bounded and\
        \ measurable\n  (`IsBoundedMeasurable`, which follows from bounded and continuous), hence lies in L²(Γ\\\
        G).\n* `New.Space.Form`: the space of these forms, an inner product space under the Petersson product\n\
        \  `New.Space.petersson`, with the action `New.Space.formRep` of G_f.\n* `New.Space.rapidFunctions`: the\
        \ automorphic functions of rapid decay form a subrepresentation.\n* `New.Space.isRapid_of_isCocompact`:\
        \ continuous Γ-invariant functions are rapid when Γ is\n  cocompact.\n* `New.Space.IsAutomorphic.mem_rapidFunctions`:\
        \ automorphic functions are rapid when all signs are\n  equal.\n\nNotions from other files:\n* `New.Space`:\
        \ a hermitian space with a point, given by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal\
        \ to diag(s) at the infinite places and 1 at the finite places.\n* `New.Space.Γ`: for a space (J, x), the\
        \ subgroup x^{-1} U(J)(E) x of G, the image of the rational\n  unitary group.\n* `New.GInf`: the archimedean\
        \ unitary group G_∞ for signs s: one copy of the complex unitary group\n  U(diag s) for each infinite place\
        \ of E.\n* `New.Space.IsModerate`, `New.Space.IsRapid`: |F| ≤ C·ht^B for some C and B; |F|·ht^B is bounded\n\
        \  for every B.\n\n## Relation to the literature\n\nKnown result: automorphic forms on unitary groups and\
        \ their rapid decay. Cusp forms are treated in\n`Lib.Adelic.AutomorphicForms.Cuspidality`.\n"
