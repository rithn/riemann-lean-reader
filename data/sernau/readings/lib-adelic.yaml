      endLine: 14
      text: 'Fix a prime `p` and a map `ιₚ : ℂ →+* ℂ_[p]`, written ι in prose and given by the instance

        `[ι : PadicPlace p]`. The gauge `New.weylGauge κ e g ξ` is the largest `p`-adic absolute value of a

        coordinate of `g⁻¹ ι(ξ)`, for a finite adelic unitary point `g` acting in weight `(κ, e)`. It

        measures the `p`-integrality of the values of algebraic forms (`New.AlgForm`). The file proves

        invariance properties of the gauge, bounds the forms `New.deltaForm` on `New.stdSpace E n` that are

        supported on one double coset, bounds class sums over `Γ \ G / K`, and studies the sizes of

        algebraic forms whose level is cut out at finitely many split places.

        '
    remainder:
      path: grh/src/Lib/Adelic/AutomorphicForms/PAdicGauge.lean
      line: 15
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.exists_mul_mem_integralAbove`: a rational point moves `g`\
        \ to a point integral above `p`.\n* `New.LevelPlaces.LevelForm`: forms of weight (κ, e) on which the level\
        \ `New.levelOf` of H acts\n  through χ, a finite-dimensional inner product space under the class sum of\
        \ the Gram pairing.\n* `New.gramForm_mem_embValRing`: the Gram pairing of two vectors of gauge at most one,\
        \ for\n  `ι ∘ conj` and for `ι`, is integral; `New.LevelPlaces.LevelForm.norm_nsmul_inner_le_one`: so is\n\
        \  the inner product of two such forms, after multiplication by a common multiple of the orders of\n  the\
        \ stabilisers.\n* `New.LevelPlaces.LevelForm.valueCoord`, `New.LevelPlaces.LevelForm.valueMetric`: coordinates\
        \ of a\n  form in which the inner product has a rational matrix, if the classes have no nontrivial\n  automorphisms.\n\
        * `New.Rows.weylGauge_classSum_le_one`: `p`-integrality (gauge `New.weylGauge` at most one) passes\n  to\
        \ the class sum after multiplication by a common multiple of the orders of the stabilisers.\n\nNotions from\
        \ other files:\n* `New.weylGauge`: at the infinite place τ, g⁻¹ acts through its component at the prime\
        \ induced by\n  the embedding x ↦ ι(Φ_τ(x̄)) of E into ℂ_p.\n* `New.stdSpace`: the definite space `I_n`,\
        \ the sum of `n` norms with its standard lattice.\n* `New.integralAbove`: the subgroup of finite adelic\
