      path: grh/src/Lib/Adelic/Reduction/FirstMinimumShortBases.lean
      line: 7
      endLine: 10
      text: 'Minkowski''s bound and weak transference in a Euclidean space `E` of dimension `m` give short vectors

        and a covering radius for a subgroup `Λ` whose dual has no nonzero vectors shorter than `ρ > 0`. For

        a hermitian space `V` with a point, the lattice of `V` defines a first minimum, cut off at `1`, and

        a height on the adelic unitary group, against which growth and decay are measured.

        '
    remainder:
      path: grh/src/Lib/Adelic/Reduction/FirstMinimumShortBases.lean
      line: 11
      endLine: 50
      text: "\n## Main definitions and results\n\n* `New.weak_transference`: if `m ≥ 1`, `Λ` has a nonzero vector\
        \ shorter than `2 m / ρ`.\n* `New.weak_transference_covering_radius`: every vector is within `m ^ 2 / ρ`\
        \ of `Λ`.\n* `New.Space.archCoords`, `New.Space.firstMinimum`, `New.Space.height`: the archimedean coordinates\n\
        \  of a rational vector, the first minimum of the lattice cut off at `1`, and the inverse of the\n  first\
        \ minimum of the moved space `V.move g`, the height at `g`.\n* `New.Space.IsModerate`, `New.Space.IsRapid`:\
        \ moderate growth and rapid decay against the height.\n* `New.Space.form_eq_zero_of_norm_mul_lt_one`, `New.Space.firstMinimum_move_eq_one`,\n\
        \  `New.Space.firstMinimum_pos`: lattice vectors whose lengths have product below `1` are orthogonal;\n\
        \  the minimum is `1` in a definite space, and positive in any space as the lattice is discrete. The\n \
        \ comparison of heights on `Γ g Ξ` for compact `Ξ` is `New.Space.exists_height_le_mul` in\n  `Lib.Adelic.AutomorphicForms.Basic`.\n\
        * `New.Space.exists_short_basis`: the lattice contains a basis of vectors of length at most a\n  constant\
        \ over the first minimum.\n\nNotions from other files:\n* `New.Space`: a hermitian space with a point, given\
        \ by a matrix J over a CM field E (class\n  `CMType E`) and x in GL_n(\U0001D538) with xᴴJx equal to diag(s)\
        \ at the infinite places and 1 at the finite\n  places; `V.move g` is (J, xg).\n* `New.G`: the adelic unitary\
        \ group G = G_∞ × G_f for signs s at the infinite places and the\n  identity matrix at the finite places.\n\
        * `New.Space.vecAtPoint`: for a space (J, x), the adelic coordinates x⁻¹y of a vector y in E^n.\n* `New.Space.baseLattice`:\
        \ for a space (J, x), the lattice E^n ∩ x_f Ô^n, as an additive subgroup of\n  E^n.\n* `New.Space.sum`:\
        \ for spaces V, W with signs s, t, the space with concatenated signs whose matrix\n  and point are the block\
        \ diagonal sums of those of V and W.\n\n## Relation to the literature\n\nKnown result: Transference theorem\
        \ for the covering radius of a lattice against its dual's first\nminimum. The constant here is m squared\
        \ in dimension m, where the sharp forms have a constant linear\nin m. The result holds for any subgroup\
        \ of a Euclidean space whose dual has no short nonzero vector,\nand is proved by projecting along a short\
        \ vector. Source: Lagarias-Lenstra-Schnorr, Korkin-Zolotarev\nbases and successive minima of a lattice and\
        \ its reciprocal lattice, Combinatorica 10 (1990); sharp\nforms in Banaszczyk, Math. Ann. 296 (1993), and\
        \ Miller-Stephens-Davidowitz, Kissing numbers and\ntransference theorems from generalized tail bounds, SIAM\
        \ J. Discrete Math. 33 (2019).\n\nSee also `Lib.Adelic.AutomorphicForms.Cuspidality` and `Lib.Adelic.Reduction.FiniteVolume`.\n"
