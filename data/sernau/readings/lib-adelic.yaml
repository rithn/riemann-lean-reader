      endLine: 13
      text: 'This file develops the finite adeles `New.𝔸f E` of a number field `E` and their subring `New.Ô E` of

        integral adeles. The valuation `Valued.v` of a completion, written `v`, is multiplicative with

        values in `ℤᵐ⁰` (the integers, written multiplicatively by `exp`, with a zero adjoined), so that

        integral elements have `v ≤ 1`. The file covers the topology of completions and finite adeles, and

        the idempotents `New.idem` of sets of places. It also covers functoriality along embeddings of

        number fields through `New.adeleMap`, and base change along an extension `L / K`. For CM fields,

        complex conjugation `star` is extended to places and finite adeles, and commutes with

        `New.adeleMap`; it induces maps `New.conjLoc` between the completions at conjugate places.

        '
    remainder:
      path: grh/src/Lib/Adelic/Adeles/Basic.lean
      line: 14
      endLine: 37
      text: "\n## Main definitions and results\n\n* `New.FinPlace`, `New.LocField`, `New.LocInt`, `New.ResField`:\
        \ finite places, completions, their\n  integers and residue fields; `New.\U0001D538f`, `New.Ô`: finite adeles\
        \ and integral finite adeles;\n  `New.evalAt w` is the ring homomorphism taking a finite adele to its component\
        \ in the completion\n  `New.LocField w`.\n* `New.isCompact_Ô`, `New.isOpen_Ô`: the integral adeles `New.Ô\
        \ E` are compact and open.\n* `New.denseRange_algebraMap_Ô`, `New.denseRange_algebraMap_finAdele`: `\U0001D4DE\
        \ E` is dense in `Ô E` and\n  `E` is dense in the finite adeles (strong approximation), which are a Polish\
        \ space.\n* `New.adeleCombination`: for a basis `b` of `L / K`, the map `(a i) ↦ ∑ a i • b i` from `ι →\
        \ \U0001D538f K`\n  to `\U0001D538f L`.\n* `New.isHomeomorph_adeleCombination`: this map is a homeomorphism.\n\
        * `New.mem_range_finAdeleIncl_iff`: for `L / K` Galois, the adeles fixed by `Gal(L/K)` are those\n  from\
        \ `K`.\n\n## Relation to the literature\n\nKnown result: the topology of the finite adeles of a number field,\
        \ strong approximation and base\nchange. Base change is proved for finite adeles only, and the full adeles\
        \ are those of totally\ncomplex fields with chosen embeddings.\n\nSource: J. W. S. Cassels, Global Fields,\
        \ in Cassels-Fröhlich, Algebraic Number Theory, 1967, ch. II\n§§14-16; A. Weil, Basic Number Theory, ch.\
        \ IV.\n"
