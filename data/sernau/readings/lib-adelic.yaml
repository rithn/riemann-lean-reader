    excerpt:
      path: grh/src/Lib/Adelic/Adeles/IdeleModulus.lean
      line: 7
      endLine: 13
      text: 'This file studies the module of an idele of a number field `E`, its relation to Haar measure, and

        its behaviour under norms. Here `New.𝔸 E` has one copy of `ℂ` for each infinite place. The module

        `New.ideleAbs` is therefore the product of the squared norms at the infinite places and of the norms

        at the finite places. The generalised index `New.genIndex a` of a finite idele, defined through the

        scaling of Haar measure, is the inverse of its module; it is `[Ô : a Ô]` when `a` is integral. For

        an extension `L / K` of number fields, the algebra norm `New.adeleNorm` on finite adeles preserves

        the module.

        '
    remainder:
      path: grh/src/Lib/Adelic/Adeles/IdeleModulus.lean
      line: 14
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.ideleAbs`: the module is multiplicative, and it is a continuous\
        \ positive character\n  (`New.continuous_ideleAbs`, `New.ideleAbs_pos`).\n* `New.ideleAbs_toAdele`: the\
        \ product formula for the diagonal embedding `New.toAdele`, for a\n  totally complex `E`.\n* `New.finIdeleAbs`:\
        \ the module `∏ ‖x_w‖` of a finite idele; `New.finIdeleAbs_principalIdele` is the\n  finite part of the\
        \ product formula.\n* `New.genIndex_eq_inv_finIdeleAbs`, `New.genIndex_eq_inv_norm`: for a finite idele,\
        \ or an element\n  of `E_wˣ`, the index `New.genIndex` is the inverse of its module.\n* `New.map_mulVec_haar_finAdele`,\
        \ `New.volume_map_mulVec_adele`, `New.volume_map_mul_mul_adele`:\n  pushing Haar measure forward along `x\
        \ ↦ a x` or `x ↦ a x b` divides it by the module of the\n  determinant of that map.\n* `New.finIdeleAbs_adeleNorm`:\
        \ the norm keeps the module `New.finIdeleAbs` of a finite idele.\n\nNotions from other files:\n* `New.\U0001D538\
        f E`, `New.Ô E`: the finite adeles of `E`, and the subring of those that are integral at\n  every finite\
        \ place.\n* `New.FinPlace E`, `New.LocField w`: the finite places of `E` and the completion `E_w`; `w.q`\
        \ is\n  the order of the residue field at `w`, and `w.below K` is the place of a subfield `K` below `w`.\n\
        * `New.locIdele w x`: the finite idele with component `x` at `w` and `1` elsewhere.\n* `New.idelesUnitOff\
        \ S`: the finite ideles that are units at all places outside `S`.\n* `New.genIndex a`: the inverse of the\
        \ factor by which multiplication by a unit `a` scales Haar\n  measure, and `0` for a non-unit.\n\n## Relation\
        \ to the literature\n\nKnown result: the module of an idele, the product formula and the scaling of Haar\
        \ measure.\n\nPart of a known result: functoriality of ideles under the norm map, restricted here to the\
        \ module\nand to supports.\n"
