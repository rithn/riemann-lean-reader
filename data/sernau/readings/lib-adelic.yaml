      text: "\n\n## Main definitions and results\n\n* `New.quasiReflection`: the quasi-reflection along `v`, for\
        \ a unit `σ` with `σ + star σ = h(v, v)`.\n* `New.witt_of_quasiReflection_mem`: left invertible `X`, `Y`\
        \ with the same Gram matrix satisfy\n  `g * X = Y` for some `g` in any subgroup of `New.U J` that contains\
        \ all quasi-reflections.\n* `New.witt`: the same with `g` in `New.U J`.\n* `New.exists_orthonormal_Ô`: a\
        \ hermitian matrix invertible over `Ô` is `Ô`-congruent to `1`.\n* `New.witt_Ô`: Witt's theorem for primitive\
        \ `n × k` matrices over `Ô`.\n* `New.exists_unitary_eq_eichlerMap`: for hermitian `J`, the Eichler map\n\
        \  `v ↦ v + h(u, v) x - h(x, v) (u + ς x)` (`New.eichlerMap`) is an isometry if `x` is isotropic, `u`\n\
        \  is orthogonal to `x` and `ς + star ς = h(u, u)`.\n\nNotions from other files:\n* `New.Shape`: the data\
        \ `\U0001D530` of a number `ϱ` of hyperbolic planes and a finite index set `κ`. A\n  `T : \U0001D530.Form\
        \ A` is a square matrix indexed by `κ` and one more index `z`.\n* `New.Shape.Form.splitGram`: the Gram matrix\
        \ of ϱ hyperbolic planes and a middle space with Gram\n  matrix T: identity blocks pair the first and last\
        \ ϱ indices, T is the middle block, all else is\n  zero. Its unitary group is `T.G`.\n* `New.Shape.Form.frameGram`:\
        \ the (ϱ+1) × (ϱ+1) matrix of the products h(f_j, γ f_l) of the frame f\n  with its image under γ, where\
        \ h is the form `New.Shape.Form.splitGram T`.\n* `New.frameMatrix`: the submatrix of γ on the rows and columns\
        \ of the frame.\n* `New.intGL`: for a subring O of R, the subgroup GL_n(O) of GL_n(R): matrices with entries\
        \ in O\n  whose inverse has entries in O.\n\n## Relation to the literature\n\nKnown; see `Lib.Adelic.Witt.IwasawaDecomposition`,\
