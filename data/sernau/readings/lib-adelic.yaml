      text: "\n## Main definitions and results\n\n* `New.Space.discreteTopology_Gamma`: `New.Space.Γ` is discrete,\
        \ because the rational matrices\n  `New.ratMatrices` are discrete among the adelic ones. So the image under\
        \ `New.Space.ratEmbed` of\n  any subgroup is discrete.\n* `New.stdAddChar_toAdele`, `New.mem_ratAdeles_of_stdAddChar_eq_one`:\
        \ for `E` totally complex,\n  `New.stdAddChar` is trivial on `E`. An adele that pairs trivially with all\
        \ of `E` lies in `E`. So\n  `E` is its own annihilator.\n* `New.isDualFamily_ratAdeles`: the characters\
        \ `x ↦ stdAddChar E (toAdele a * x)`, `a : E`, form a\n  dual family for the adeles modulo `E`.\n* `New.isDualFamily_ratMatrices`:\
        \ the same for matrices, with the trace pairing.\n* `New.strong_approximation`: strong approximation; `E`\
        \ plus the adeles supported on a nonempty set\n  `S` of finite places is dense in the adeles.\n* `New.Exchange.denseRange_rat_matrix_add`:\
        \ strong approximation for matrices.\n\nNotions from other files:\n* `New.\U0001D538f E`, `New.Ô E`: the\
        \ finite adeles of `E` and the subring of integral finite adeles.\n* `New.PlaceEmbedding.Φ`: a chosen complex\
        \ embedding `Φ w` of `E` for each infinite place `w`; the\n  adele ring `New.\U0001D538 E` is the product\
        \ of one copy of `ℂ` for each `w` with `New.\U0001D538f E`.\n* `New.ratAdeles`, `New.ratMatrices`: the images\
        \ of `E` and of the matrices over `E` under\n  `New.toAdele`, as additive subgroups.\n* `New.IsDualFamily\
        \ B₀ χ`: `i ↦ χ i` is an injective homomorphism to the continuous unitary\n  characters trivial on `B₀`,\
        \ and the common kernel of the `χ i` lies in `B₀`.\n\n## Relation to the literature\n\nKnown result: Self-duality\
        \ of a number field in its adeles, strong approximation and a Poisson\ninequality. For totally complex fields\
        \ only, the field is shown to be its own annihilator and the\npairing is shown to be non-degenerate. Strong\
        \ approximation omits a nonempty set of finite places\nand is deduced from duality. Poisson summation is\
        \ proved only as an inequality, for nonnegative\nintegrable functions that are lower semicontinuous at the\
        \ rational points of the sum. Source: J.\nTate, Fourier analysis in number fields and Hecke's zeta-functions,\
        \ thesis 1950, in Cassels-Fröhlich\nch. XV, Theorem 4.1.4; for strong approximation, Cassels, ch. II §15.\n\
        \nSee also `Lib.Adelic.Unitary.WeakApproximation`.\n"
