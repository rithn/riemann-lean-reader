      text: 'This file defines the adelic unipotent radical `New.unipotentRadical` of the stabiliser of the

        span of the columns of an isotropic adelic matrix. A bounded continuous function that is fixed by

        right convolution with a cusp kernel `e` (`New.IsCuspKernel`) and invariant under the rational

        points of the radical, of finite covolume, has mean zero along the radical. From this it derives a

        bound by the oscillation for such functions. It also gives the matrix algebra for the reduction

        step, `New.Reduction.radicalElem` and `New.Reduction.IsIntBounded`, which moves an adelic point of a

        unipotent radical close to `1` by a rational element.

        '
    remainder:
      path: grh/src/Lib/Adelic/AutomorphicForms/UnipotentRadical.lean
      line: 14
      endLine: 36
      text: "\n## Main definitions and results\n\n* `New.Space.integral_unipotentRadical_eq_zero`: the mean along\
        \ the radical vanishes.\n* `New.unipotentRadical`: the points `g` of the adelic unitary group that fix the\
        \ span `A` of the\n  columns of `a` pointwise and satisfy `uᴴ J (g v) = uᴴ J v` for all `u`, `v` in `A^⊥`,\
        \ where\n  `J = stdForm E s`.\n\nNotions from other files:\n* `New.Space`: a hermitian space with a point,\
