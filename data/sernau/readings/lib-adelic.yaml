      endOffset: 1953
      text: " Let `J_line ⊂ GL_n(\U0001D4AA)` be the stabiliser of the line of a basis\nvector `e_i` modulo `w`.\
        \ We write `diag (ϖ, 1, …, 1)` for the diagonal matrix with `ϖ` at the index\n`i` and `1` elsewhere. Let\
        \ `T⁺`, `T⁻` be the operators of the double cosets of this matrix and of\nits inverse, and let `e_sph` be\
        \ the mean over chosen lifts to `GL_n(\U0001D4AA)` of the elements of `GL_n` of\nthe residue field, which\
        \ on vectors fixed by the kernel of the reduction modulo `w` is the mean over\n`GL_n(\U0001D4AA)`. On the\
        \ vectors fixed by `J_line`, `T⁻` is the adjoint of `T⁺` in a unitary representation\n(`inner_lineRaise`),\
        \ and `T⁺ T⁻ = q ^ (n - 2) (1 + (q ^ n - 1) e_sph)` (`lineRaise_lineLower`). The\npositive powers of `lineHecke`,\
        \ the element of the group algebra that acts as `T⁺`, are supported on\nintegral matrices whose characteristic\
        \ polynomial has the simple root `0` modulo `w`\n(`lineHecke_pow_mem_spanOn`).\n\nNotions from other files:\n\
