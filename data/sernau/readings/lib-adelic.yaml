      endLine: 52
      text: "\n## Main definitions and results\n\n* `New.Space.exists_splitting`: every isotropic frame `k` of a\
        \ hermitian space `V` is part of a\n  splitting `V = range l ⊕ V₀ ⊕ range k` (`New.Space.Splitting`, a Witt\
        \ decomposition). The proof\n  compares `V` with the sum of a hyperbolic space and a standard space by Landherr's\
        \ theorem\n  (`New.Space.landherr`) and moves the frame by Witt's theorem (`New.Space.witt`).\n* `New.Space.Splitting.radicalCentre`:\
        \ the centre of the radical, parametrised additively by adelic\n  matrices M through M − M*; it sends rational\
        \ matrices to rational points.\n* `New.Space.Splitting.centreCoeff`: the Fourier coefficients of a function\
        \ along this centre.\n* `New.Space.Splitting.iwasawa`: the Iwasawa decomposition for the maximal compact\
        \ subgroup\n  `New.maxCompact`, obtained at each infinite place and over the finite adeles from Witt's theorem\n\
        \  (`New.Space.Splitting.iwasawa_of_witt`). The compact factor can be taken trivial where the given\n  element\
        \ is (`New.Space.Splitting.exists_mem_maxCompact_actsOnFrame_and_eq_one`).\n* `New.Space.Splitting.exists_eq_radicalElement_mul_levi_mul_isAdapted`:\
        \ every element is a product\n  of an element of the radical, a Levi element and an element adapted to the\
        \ splitting.\n\nNotions from other files:\n* `New.G E s`: the adelic unitary group of the form ε (`New.stdForm`)\
        \ that is diag(s) at the\n  infinite places and the identity at the finite places; `g.adeleMatrix` is the\
        \ adelic matrix of\n  `g`.\n* `New.Space`: a hermitian space with a point, given by a matrix J over E and\
        \ x in GL_n(\U0001D538) with\n  xᴴJx = ε; `W.Γ` is the group of rational points in `New.G E s`.\n* `New.U\
        \ A`: the unitary group of a matrix A.\n* `New.parabolic`: the invertible matrices that are block upper\
        \ triangular for a level function.\n\n## Relation to the literature\n\nKnown results: Witt's extension theorem\
        \ for hermitian forms and for unimodular hermitian lattices,\nand the Iwasawa decomposition. Witt's theorem\
        \ is imported: over fields with a nontrivial involution\nfor invertible hermitian forms (`New.witt`), and\
        \ over the integral finite adeles only for primitive\nframes of the identity form over a CM field containing\
        \ the roots of unity of order 5040\n(`New.witt_Ô`). Its form in the maximal compact subgroup at an infinite\
        \ place is deduced here: an\nisotropic subspace is the graph of an isometry between the coordinates of the\
        \ two signs. Source: U.\nA. First, Witt's extension theorem for quadratic spaces over semiperfect rings,\
        \ J. Pure Appl.\nAlgebra 219 (2015), Cor. 4.9 (for fields, Dieudonné, La géométrie des groupes classiques,\
        \ 1955; for\nlattices, Jacobowitz, Amer. J. Math. 84 (1962)). For the Iwasawa decomposition at the finite\
        \ places:\nJ. Tits, Reductive groups over local fields, Proc. Sympos. Pure Math. 33 (1979), part 1, 3.3.2\
        \ and\n3.8.1.\n"
