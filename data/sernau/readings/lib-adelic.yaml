      endLine: 48
      text: "* `New.algFormCoeff`, `New.ofAlgForm`: from a form `φ` to the function `(x, g) ↦ L (ρ(x⁻¹) φ(g))`,\n\
        \  `ρ = New.conjWeylRep`, for any linear form `L` and for the pairing with `New.highestVector`.\n* `New.smoothPairing`,\
        \ `New.smoothPairing_formTranslation`: a pairing B of coefficient vectors\n  invariant under `New.Space.weightRep`\
        \ gives a pairing of forms, by integration over Γ\\G_f,\n  invariant under G_f.\n* `New.IsHCParam.eq_hcParameter`,\
        \ `New.IsHCParam.exists_decreasingPosition_eq`: the entries of a\n  parameter `l` are those of `New.hcParameter`,\
