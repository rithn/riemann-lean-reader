      path: grh/src/Lib/Adelic/Reduction/FiniteVolume.lean
      line: 8
      endLine: 11
      text: 'This file develops reduction theory for `GL_n` over the adeles: every adelic frame `y` has a

        rational basis `Y` such that `y⁻¹ Y` lies in one fixed compact set after its columns are scaled by

        powers of `2` at the infinite places. For a hermitian space `V` (`New.Space`), a weighted Haar

        measure on the adelic unitary group `G` computes integrals over `[G] = V.Γ \ G`.

        '
    remainder:
      path: grh/src/Lib/Adelic/Reduction/FiniteVolume.lean
      line: 12
      endLine: 50
      text: "\n## Main definitions and results\n\n* `New.Core.exists_isCompact_profileBases`: one compact set `M`\
        \ bounds a reduced basis at every `y`.\n* `New.exists_isBoundedDualBasis`: Mahler's criterion for frames\
        \ of forms that may vary. The\n  criterion for the unitary group of one space is `New.Space.mahler_criterion`\
        \ in\n  `Lib.Adelic.Reduction.DefiniteClassSums`.\n* `New.Space.quotMeasure`: for a space `V` with rational\
        \ points `New.Space.Γ`, the measure\n  `Subgroup.quotMeasure` on `G` for counting measure on `Γ`. It integrates\
        \ `Γ`-invariant functions\n  over `[G] = Γ \\ G`.\n* `New.Space.lintegral_encard_ne_top`: the count of rational\
        \ `n × t` matrices is integrable over\n  `V.Γ \\ G` if `2 t < n`.\n* `New.Space.isFiniteMeasure_quotMeasure`:\
        \ finite volume, the case `t = 0`.\n\nNotions from other files:\n* `New.\U0001D538`: the ring `ℂ ^ f × \U0001D538\
        _f`, one copy of `ℂ` for each infinite place of `E` times the finite\n  adeles. It is the adele ring of\
        \ `E` when `E` is totally complex; `New.toAdele` embeds `E` in it.\n* `New.ideleAbs`: the module (adelic\
        \ absolute value) of an idele.\n* `New.Core.twoAtInfinity`: the idele of `E` that is `2` at all infinite\
        \ places and `1` at the\n  finite places.\n* `New.Core.profileBases M x y`: the `Y` in `GL_n(E)` with `y⁻¹\
        \ Y (D x)⁻¹ ∈ M`, where\n  `D x = New.Core.dyadicDiag x` is diagonal with entries `twoAtInfinity E ^ x i`.\
        \ The integer vector\n  `x` is called the profile of such a basis.\n* `New.Space`: a matrix `J` over `E`\
        \ and a point `x` in `GL_n(\U0001D538)` with `xᴴ J x` equal to `diag s` at\n  the infinite places, for signs\
        \ `s`, and `1` at the finite places.\n\n## Relation to the literature\n\nKnown results: reduction theory\
        \ for adele groups (the compactness criterion of Mahler and Godement,\nfinite covolume) and Weil's convergence\
        \ criterion. Finite volume is proved here only for unitary\ngroups over CM fields, by counting reduced bases,\
        \ and Weil's criterion only when twice the number of\nvectors is below the rank. The adelic Minkowski theorems\
        \ come from\n`Lib.Adelic.Reduction.MinkowskiTheorems`, with crude explicit constants. Source: A. Borel,\
        \ Some\nfiniteness properties of adele groups over number fields, Publ. IHES 16 (1963), 4.5-5.8; A. Weil,\n\
        Sur la formule de Siegel dans la théorie des groupes classiques, Acta Math. 113 (1965), Prop. 8;\nBombieri-Vaaler,\
        \ On Siegel's lemma, Invent. Math. 73 (1983).\n\nFor the adelic points of unitary groups and their Haar\
        \ measures, see\n`Lib.Adelic.Unitary.WeakApproximation`.\n"
