      text: 'For subgroups `Γ`, `K` of a topological group `G`, `New.classSum Γ K f` is the sum of

        `f g / #(Γ ∩ g K g⁻¹)` over representatives `g` of `Γ \ G / K`, where

        `Γ ∩ g K g⁻¹ = New.classAut Γ K g`. The integral over `Γ \ G` with `vol K = 1` is defined from class

        sums as the finite sum `New.classIntegral`, also called the mean (it is an average when `Γ = ⊥` and

        `K` is the whole group). No measure theory is used. The mean `New.classIntegral` is used to average

        smooth representations over compact subgroups.

        '
    remainder:
      path: grh/src/Lib/Adelic/Hecke/ClassSums.lean
      line: 13
      endLine: 41
      text: "\n## Main definitions and results\n\n* `New.classIntegral`: the class sum at the level `rightStabilizer\
        \ f ⊓ K`, divided by its index in\n  `K`.\n* `New.HasFiniteType`: finitely many classes and finite stabilisers,\
        \ with `K` open and compact.\n* `New.classSum_eq_relIndex_smul`: change of level, by double counting.\n\
        * `New.classIntegral_eq_classSum_mul`, `New.classIntegral_eq_inv_smul_classSum`: for left\n  Γ-invariant\
        \ f, the mean can be computed at a smaller open level that fixes f, or one whose\n  conjugate by some a\
        \ lies in K and fixes f (then for the right translate of f by a).\n* `New.classIntegral_sum`: for smooth\
        \ left Γ-invariant functions, the mean commutes with finite\n  sums, additive maps and right translation.\n\
        * `New.compactMean ρ H`: the mean over H. It is invariant under H on both sides\n  (`New.apply_compactMean`,\
        \ `New.compactMean_apply`), projects onto the H-fixed vectors\n  (`New.compactMean_mem_levelSpace`, `New.compactMean_eq_self`),\
        \ and is self-adjoint for an\n  invariant scalar product (`New.IsUnitary.compactMean_adjoint`).\n\nNotions\
        \ from other files:\n* `Subgroup.FixesLeft`: `Γ.FixesLeft f` says that `f (γ * g) = f g` for all γ in Γ\
        \ and g in G.\n* `New.levelSpace π K χ`: For a representation π of G, a subgroup K and a character χ of\
        \ K (by\n  default trivial), the submodule of vectors v with π(k)v = χ(k)v for all k in K.\n\n## Relation\
        \ to the literature\n\nKnown result: weighted class sums for a pair (G,K), as in the theory of abstract\
        \ Hecke operators and\nof algebraic modular forms. They make sense for values in any rational vector space,\
        \ without a Haar\nmeasure. Source: G. Shimura, Introduction to the Arithmetic Theory of Automorphic Functions\n\
        (1971), ch. 3; B. Gross, Algebraic modular forms, Israel J. Math. 113 (1999) 61-93; M. Greenberg and\nJ.\
        \ Voight, Lattice methods for algebraic modular forms on classical groups, arXiv 1209.2460.\n"
