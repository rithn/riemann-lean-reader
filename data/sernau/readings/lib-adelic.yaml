      line: 6
      endLine: 10
      text: 'A group `H` with a measure `ν` acts on a measure space `(X, μ)`. Integration over `H \ X` is done on

        `X` itself. A cutoff (`New.IsCutoff ν β`) is a measurable `β : X → [0, ∞]` with

        `∫ β (h • x) dν(h) = 1` for every `x`. For a discrete subgroup `Γ` of a group `G` with counting

        measure, and a Haar measure `μ` on `G`, `Γ.quotMeasure μ` integrates over `Γ \ G`, and its total

        mass is the covolume of `Γ`.

        '
    remainder:
      path: grh/src/Lib/Adelic/QuotientMeasure/Basic.lean
      line: 11
      endLine: 36
      text: "\n## Main definitions and results\n\n* `New.orbitMeasure`: the measure `β μ` on `X`, for the chosen\
        \ weight `β = New.chosenCutoff ν`. It\n  is meant for `H`-invariant integrands, and for actions where a\
        \ cutoff exists (`New.HasCutoff`);\n  then `β` is a cutoff (`New.isCutoff_chosenCutoff`).\n* `New.IsCutoff.measurePreserving`,\
        \ `New.measurePreserving_orbitMeasure`: the map `(x, h) ↦ h • x`\n  carries `(β μ) × ν` to `μ`; the other\
        \ results on unfolding follow from this and Fubini's theorem.\n* `New.identDistrib_orbitMeasure_of_unfold`,\
        \ `New.identDistrib_orbitMeasure`: invariant functions\n  have the same distribution for every measure that\
        \ unfolds to `μ`. So the choice of cutoff does not\n  matter when `ν` is inversion invariant and `μ` is\
        \ invariant, both s-finite.\n* `New.integral_quotMeasure_tsum`: `∫_{Γ\\G} ∑_γ f(γ g) = ∫_G f`.\n* `New.isMulRightInvariant_of_finite_covolume`:\
        \ a group with a discrete subgroup of finite covolume\n  is unimodular.\n* `New.quotMean_tsum_eq_integral`:\
        \ the mean of `x ↦ ∑ γ, F (γ + x)` is `∫ F dμ` divided by the\n  covolume.\n\n## Relation to the literature\n\
        \nKnown result: Invariant integration on a quotient (Weil's formula), unfolding and unimodularity.\nHere\
        \ the quotient integral is integration against a measurable weight of total mass one on each\norbit, so\
        \ no orbit space or section is needed to define it; existence is proved for proper actions\nand for discrete\
        \ subgroups. Source: O. Kallenberg, Invariant measures and disintegrations with\napplications to Palm and\
        \ related kernels, Probab. Theory Related Fields 139 (2007) 285-310 (as\ncited in D. Gentner, G. Last, Math.\
        \ Z. 267 (2011), §2); for the classical form, N. Bourbaki,\nIntégration VII, 1963.\n"
