      text: 'This file concerns the adelic unitary group `New.G E s = G_∞ × G_f` over a CM field `E` (hypothesis

        `IsCMField E`; the discreteness instance and the `New.Space` results assume `CMType E` instead,

        which makes `E` a CM field), together with the rational points of a hermitian space `V` with signs

        `s`. When all signs are `1`, the finite parts of the rational points form a discrete subgroup of

        `G_f`.

        '
    remainder:
      path: grh/src/Lib/Adelic/Unitary/WeakApproximation.lean
      line: 11
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.G.isClosedEmbedding_adeleMatrix`: sending `g` to its adelic\
        \ matrix is a closed embedding.\n  Hence a map into the group is continuous when its matrix is (`New.G.continuous_iff`),\
        \ and elements\n  with the same matrix are equal (`New.G.ext_adeleMatrix`).\n* An instance: for a space\
        \ `W` whose signs are all `1`, the group `New.Space.Γf` of finite parts of\n  the rational points is discrete\
        \ in `G_f`.\n* `New.Space.cayleyMap`: a map from all rational matrices to the rational points, through the\
        \ Cayley\n  transform of a rational skew matrix.\n* `New.Space.eventually_tendsto_cayleyMap`: for all but\
        \ finitely many parameters `c`, the image of\n  `A` under this map tends to `g` at a given place as `A +\
        \ e • B` (`A` rational, `B` adelic) tends\n  to `V.toRatCoords g`, if the place kills the adeles `e` and\
        \ `star e`.\n* `New.Space.weak_approximation`: weak approximation. The consequence that a rational translate\
        \ of a\n  finite adelic point is integral above a prime is `New.exists_mul_mem_integralAbove`, in\n  `Lib.Adelic.AutomorphicForms.PAdicGauge`.\n\
        \nNotions from other files:\n* `New.G E s`: the adelic unitary group for the signs `s`; `New.G.adeleMatrix\
        \ g` is the `n × n`\n  matrix over the adeles of its element `g`.\n* `New.Space E n s`: a hermitian space\
        \ with a point, given by a matrix `J` over `E` and `x` in\n  `GL_n(\U0001D538)` with `xᴴ J x` equal to `diag\
        \ s` at the infinite places and `1` at the finite places.\n* `New.Space.ratEmbed`, `New.Space.embFin`: `γ\
        \ ↦ x⁻¹ γ x` from the rational unitary group of `J` to\n  `G`, and its finite part; their images are `New.Space.Γ`\
        \ and `New.Space.Γf`.\n* `New.Space.toRatCoords`: `g ↦ x g x⁻¹` from `G` to the adelic unitary group of\
        \ `J`.\n\n## Relation to the literature\n\nKnown result: weak approximation for unitary groups. Source:\
        \ V. Platonov, A. Rapinchuk, Algebraic\nGroups and Number Theory, 1994, ch. 7. Here a hermitian space comes\
        \ with an adelic frame to a fixed\ndiagonal form, and this form is the identity at all finite places, so\
        \ every space of one signature\nshares one adelic group.\n"
