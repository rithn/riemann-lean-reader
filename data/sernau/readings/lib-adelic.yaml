      startOffset: 271
      endOffset: 1096
      text: 'This file studies forms of type `e` (`New.Space.IsForm`) on the adelic unitary group of a hermitian

        space `V`, for a cusp kernel `e` (`New.IsCuspKernel`). At a point with a short lattice vector,

        short vectors span a cusp: a rational isotropic subspace whose radical is covered by its rational

        points times a small real ball and a level. A bounded continuous function that is fixed by `e` and

        invariant under the rational points of a unipotent radical, of finite covolume, has mean zero along

        the radical (`New.Space.integral_unipotentRadical_eq_zero`, in

        `Lib.Adelic.AutomorphicForms.UnipotentRadical`). The rational points are cocompact in the radical

        of a rational isotropic subspace, so forms are cuspidal. Forms then decay faster than every power

        of the height, and those of a fixed level span a finite-dimensional space.'
    remainder:
      path: grh/src/Lib/Adelic/AutomorphicForms/Cuspidality.lean
      line: 17
      endLine: 66
      startOffset: 1096
      endOffset: 4672
      text: "\n\n## Main definitions and results\n\n* `New.Space.exists_cuspFrame`: let `N ≠ 0` be a natural number\
        \ in the different of `E`, `M ≠ 0` and\n  `0 < δ ≤ 1`. If the first minimum is less than `(δ / (M κ²))ⁿ`,\
        \ with `κ = New.cuspConst E n N`,\n  short lattice vectors span a rational isotropic subspace `A ≠ 0` and\
        \ its orthogonal\n  (`New.Space.CuspFrame`), and `N_A` lies in `(Γ ∩ N_A) Z_δ J(M)` (`New.Space.RadicalCovered`),\n\
        \  where `Z_δ` is the real ball of radius `δ` about `1` and `J(M)` is the principal level `M`.\n* `New.Space.IsCuspidal`,\
        \ `New.Space.IsForm.isCuspidal`: cuspidal functions; forms are cuspidal.\n* `New.Space.IsCuspidal.norm_le_of_firstMinimum_lt`:\
        \ at such a point `g`, a cuspidal function of\n  level `M` is at most its oscillation under real right translations\
        \ of size `δ`.\n* `New.Space.exists_norm_mul_height_pow_le`, `New.Space.IsForm.mem_rapidFunctions`: forms\
        \ decay\n  faster than every power of the height, uniformly at a fixed level.\n* `New.Space.finite_levelSpace`:\
        \ the forms of a fixed level span a finite-dimensional space.\n\nNotions from other files:\n* `New.Space`:\
        \ a hermitian space with a point, given by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal\
        \ to diag(s) at the infinite places and 1 at the finite places (in the coordinates x⁻¹ X this\n  form is\
        \ the adelic matrix `stdForm E s`); `V.Γ` is its group of rational points in the adelic\n  group G = G_∞\
        \ × G_f, and `V.move g` has the point xg.\n* `New.realConv`, `New.Space.IsForm`: R(k)F(g) = ∫ k(x) F(gx)\
        \ dx over G_∞ (`New.GInf`, one copy of\n  U(diag s) for each infinite place of E), for k on G_∞ and F on\
        \ G. For integrable e, a form of\n  type e is a bounded automorphic function fixed by R(e). Here e is a\
        \ cusp kernel\n  (`New.IsCuspKernel`): a minimal idempotent for convolution on G_∞ that decays polynomially\
        \ and\n  is reproduced by a compactly supported function.\n* `New.Space.height`: the height ht(g) = 1/λ,\
        \ with λ the first minimum cut off at 1\n  (`New.Space.firstMinimum`) of the moved space `V.move g`.\n*\
        \ `New.unipotentRadical` (in `Lib.Adelic.AutomorphicForms.UnipotentRadical`): the adelic unipotent\n  radical\
        \ of the stabiliser of the span of the columns of an isotropic matrix.\n* `New.Reduction.radicalElem` (in\
        \ `Lib.Adelic.AutomorphicForms.UnipotentRadical`): the matrix\n  `1 + 2 (T - Tᴴ - Tᴴ J T) J`; for hermitian\
        \ `J` and `T = w aᴴ` with `aᴴ J a = aᴴ J w = 0`, it\n  preserves `J`, fixes `a` and acts trivially on `a^⊥\
        \ / a`.\n\n## Relation to the literature\n\nKnown results: cusp forms decay rapidly, and those of a fixed\
        \ type and level make up a space of\nfinite dimension. Here a form is a bounded function reproduced by an\
        \ integrable minimal idempotent,\nwith no differential equation. Cuspidality is used as a bound by the oscillation\
        \ along unipotent\norbits, with an explicit depth, and the cusp is spanned by the shortest vectors of a\
        \ sorted\nMinkowski basis.\n\nSources: A. Borel, Automorphic forms on reductive groups (Park City lectures),\
        \ IAS/Park City Math.\nSer. 12 (2007) 7-39, sections 7.6-7.9 and 8.3-8.4; I. Satake, Caractérisation de\
        \ l'espace des\nSpitzenformen, Sém. H. Cartan 10 (1957/58), exp. 9 bis; R. Godement, Série de Poincaré et\n\
        Spitzenformen, ibid., exp. 10; R. Godement, The spectral\ndecomposition of cusp forms, Proc. Sympos. Pure\
        \ Math. 9 (1966) 225-234; S. Miller and W. Schmid, On\nthe rapid decay of cuspidal automorphic forms, Adv.\
        \ Math. 231 (2012), arXiv 1106.2149; G. Muić,\nSmooth cuspidal automorphic forms and integrable discrete\
        \ series, arXiv 1610.05483 (cuspidality\nthrough N. Wallach, On the constant term of a square integrable\
        \ automorphic form, 1984).\n"
