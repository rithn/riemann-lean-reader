      line: 6
      endLine: 12
      text: 'Let `E` be a CM field with `New.HasPrimitiveRoot5040 E`, and let `F` be its maximal real subfield.

        The file starts with a result on sums of two squares in quadratic algebras over `F`. It then proves

        Landherr''s theorem: a hermitian space that has an orthonormal frame at the finite places is

        determined up to rational isometry by its signs at the infinite places. Finally it proves the Hasse

        principle for cocycles of a cyclic Galois group of prime order in the definite unitary group, which

        is used for base change. There `E'' / E` is a Galois extension of CM fields of prime degree, and

        `σ ≠ 1` generates its group.

        '
    remainder:
      path: grh/src/Lib/Adelic/Landherr.lean
      line: 13
      endLine: 46
      text: "\n## Main definitions and results\n\n* `New.exists_sq_add_sq_quadraticAlgebra`: for `E` with a CM type,\
        \ a totally positive `p` in `F` is\n  a sum of two squares in `F[X] / (X² - (q p - B²))` for every `B` in\
        \ `F`. This holds when `p` has\n  valuation `1` outside a set `S` of finite places of `E`, and `q` has valuation\
        \ `1` at the places\n  of `S` and at their complex conjugates.\n* `New.Core.exists_form_eq_one`: a hermitian\
        \ matrix representing `1` over the adeles does so over\n  `E`.\n* `New.Core.exists_rat_frame_of_adelic`:\
        \ the same for a diagonal matrix of signs, by induction on\n  the columns.\n* `New.Space.landherr`, `New.Space.exists_x_eq_and_ratEmbed_conj_eq`:\
        \ two spaces with the same signs\n  differ by a rational change of basis and by moving the point.\n* `New.U.hasse_principle_coboundary`:\
        \ a cocycle that splits over the finite adeles splits\n  rationally; the proof combines Hilbert 90 for `GL\
        \ n` with Landherr's theorem `New.Space.landherr`.\n\nNotions from other files:\n* `New.CMType`: makes the\
        \ field `E` a CM number field with a chosen complex embedding `Φ w` of `E`\n  for each infinite place `w`.\n\
        * `New.\U0001D538`: the product of one copy of `ℂ` for each infinite place of `E` and the finite adeles\n\
        \  `\U0001D538f E`; this is the adele ring of `E` when `E` is totally complex.\n* `New.Space`: a hermitian\
        \ space with a point. It is a matrix `J` over `E` and `x : GL n (\U0001D538 E)`\n  with `xᴴ J x` equal to\
        \ `New.stdForm E s`, which is `diag(s)` at the infinite places and `1` at\n  the finite places.\n\n## Relation\
        \ to the literature\n\nKnown result: Landherr's Hasse principle for hermitian forms. The Hasse principle\
        \ is proved only\nfor adelically unimodular spaces of equal signature over a CM field containing the roots\
        \ of unity of\norder 5040. It uses Hasse's norm theorem and strong approximation for the adeles instead\
        \ of\nHasse-Minkowski. Source: W.\nLandherr, Äquivalenz Hermitescher Formen über einem beliebigen algebraischen\
        \ Zahlkörper, Abh. Math.\nSem. Hamburg 11 (1936) 245-248; M. Kneser, Lectures on Galois cohomology of classical\
        \ groups, TIFR\n47 (1969), §5.5.\n"
