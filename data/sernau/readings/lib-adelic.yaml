      line: 7
      endLine: 13
      startOffset: 175
      endOffset: 796
      text: 'For a hermitian space `V : New.Space E n s`, the rational unitary group embeds in the adelic unitary

        group `New.G E s` with image `V.Γ`, and in its finite part with image `V.Γf`. Mahler''s criterion

        follows from short bases, whose Gram matrices take finitely many values. It gives compactness modulo

        the rational points when all signs agree. For the signs `1`, it also gives finiteness of classes.

        For such a space, the integral over `Γ \ G` of a suitable invariant function is then a class

        sum. Here `K₀` is `New.stdLevel`, and `New.classSum` sums over the double cosets `Γf \ G_f / K` with

        weights `1 / #(Γf ∩ g K g⁻¹)`.'
    remainder:
      path: grh/src/Lib/Adelic/Reduction/DefiniteClassSums.lean
      line: 13
      endLine: 42
      startOffset: 796
      endOffset: 2520
      text: "\n\n## Main definitions and results\n\n* `New.Space.mahler_criterion`: Mahler's criterion; the `g`\
        \ of bounded height lie in `V.Γ * C` for\n  one compact set `C`.\n* `New.Space.isCocompact_of_definite`:\
        \ if all signs agree, the adelic group is compact modulo\n  `V.Γ`. `New.Space.isCocompact_Gamma` is the\
        \ case of the signs `1`.\n* `New.Space.isCocompact_finitePart`: for the signs `1`, the finite part of the\
        \ group is\n  compact modulo `V.Γf`.\n* `New.Space.hasFiniteType_of_isLevel`: for the signs `1`, finitely\
        \ many classes with finite\n  stabilisers.\n* `New.Space.integral_quotMeasure_eq_classSum`: take a space\
        \ with signs `1` and a continuous, left\n  `Γ`-invariant function on `G`. Suppose that its average over\
        \ the infinite places is fixed under\n  right translation by an open `K ≤ K₀`. Then its integral over `Γ\
        \ \\ G` is `[K₀ : K]⁻¹` times the\n  class sum of this average. `New.Space.classIntegral_eq_integral` is\
        \ the case of functions of the\n  finite part.\n\nNotions from other files:\n* `New.Space`: a hermitian\
        \ space with a point, given by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal to diag(s),\
        \ with s the signs, at the infinite places and 1 at the finite places.\n* `New.Space.move`: the space `V.move\
        \ g` is the space with the same J and the point x g; its lattice\n  `baseLattice` is the lattice at `g`,\
        \ and the norm of `archCoords u` is the length of u at `g`.\n* `New.Space.height`: the height ht(g) = 1/λ,\
        \ with λ the first minimum cut off at 1\n  (`New.Space.firstMinimum`) of the moved space `V.move g`.\n*\
        \ `New.IsLevel`: an open subgroup of `K₀`, with index `New.stdLevelIndex` in `K₀`.\n\n## Relation to the\
        \ literature\n\nKnown; see `Lib.Adelic.Reduction.FiniteVolume` and `Lib.Adelic.QuotientMeasure.Basic` for\
        \ sources.\n"
