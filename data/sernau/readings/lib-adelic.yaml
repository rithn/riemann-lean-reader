        \ the integral of `w m * F (i m * k)`, where conjugation by\n  `i m` scales the Haar measure of `N` by `w\
        \ m`.\n\n## Relation to the literature\n\nKnown result: The unfolding trick and the integration formula\
        \ in Iwasawa coordinates on a quotient\nby a discrete subgroup. Weil's formula for invariant integration\
        \ on a quotient is in\n`Lib.Adelic.QuotientMeasure.Basic`.\n"
