      endLine: 44
      startOffset: 893
      endOffset: 2822
      text: "\n\n## Main definitions and results\n\n* `New.exists_congruenceGL_subset`: every neighbourhood of `1`\
        \ in `GL n` of the finite adeles\n  contains a principal congruence subgroup of integer level. Here `New.Ô`\
        \ is the ring of integral\n  finite adeles, and `New.congruenceGL I id` is the group of matrices in `GL\
        \ n` of it that are `1`\n  modulo `I`.\n* `New.principalLevel`, `New.isOpen_principalLevel`: the principal\
        \ level of an integer a, open for\n  a ≠ 0.\n* `New.levelOf`: the k in K₀ whose reductions at a family of\
        \ places w_i lie in a subgroup H of ∏\n  GL_n(k_{w_i}); it is open for a finite family (`New.isOpen_levelOf`).\n\
        * `New.exists_reduceFamily_eq`, `New.relIndex_levelOf`: if the w_i are finitely many, distinct, and\n  none\
        \ is conjugate to a w_j, reduction is onto the product and the level has index [∏ GL_n : H].\n* `New.relIndex_principalLevel_le`:\
        \ the index of the principal level of `a ≠ 0` is at most\n  `N(a) ^ (n ^ 2)`, where `N(a)` is the norm of\
        \ `a`.\n* `New.levelRep`: a group that normalises `H` and fixes `χ` acts on the vectors on which the level\n\
        \  `New.levelOf w H` acts through reduction and `χ`.\n\nNotions from other files:\n* `New.Gf.atPlace`, `New.stdLevel.reduceAt`:\
        \ The component at w of an element of G_f, and the\n  reduction modulo w of an element of K₀. Elements of\
        \ `trivialOn n P` have component 1 at each place\n  in P.\n* `New.ResField`: The residue field of the completion\
        \ E_w of E at the finite place w.\n* `New.levelSpace`: The vectors v with π(k)v = χ(k)v for all k in the\
        \ level.\n\n## Relation to the literature\n\nKnown result: Congruence subgroups and level structures of\
        \ adelic groups. Here levels are preimages\nof subgroups of the reductions at a family of places, or principal\
        \ levels of a global modulus, in\nthe unitary group of the identity form. Source: V. Platonov, A. Rapinchuk,\
        \ Algebraic groups and\nnumber theory, ch. 3 and 5; B. H. Gross, Algebraic modular forms, Israel J. Math.\
        \ 113 (1999) 61-93.\n"
