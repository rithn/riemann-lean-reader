      endLine: 28
      text: "The file proves two steps of the descent of invariant distributions from `C` to `X`.\n\n* Step 1, images.\
        \ Integration over the fibres takes a test function `Ψ` on `Γ × G` to a test\n  function on `C`. A test\
        \ function on `G` that extends it is an image of `Ψ` (`IsImage`), and one\n  exists (`IsSlice.exists_isImage`).\n\
        * Step 2, Haar measure. An invariant distribution on `C` kills the image of `Ψ` as soon as the\n  integrals\
        \ of `Ψ (·, y)` over `Γ` vanish for all `y ∈ X`\n  (`IsInvariantDistribution.eq_zero_of_isImage`).\n\nFunctions\
        \ on `Γ × X` and on `C` are handled as restrictions of test functions on `Γ × G` and on `G`.\n\nNotions\
        \ from other files:\n* `TestFunction G`: the locally constant functions of compact support from `G` to `ℂ`.\n\
        * `TestFunction.translate (a, b) f`: the test function `x ↦ f (a⁻¹ * x * b)`.\n* `compactMean ρ L x`: the\
        \ mean of the orbit of the vector `x` under a compact subgroup `L`.\n\n## Relation to the literature\n\n\
        Known result: descent of invariant distributions to a slice, after Harish-Chandra.\n"
