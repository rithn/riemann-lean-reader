      line: 6
      endLine: 10
      text: 'This file studies integrals over a quotient `Γ \ G` by a discrete subgroup `Γ`, with `μ` a Haar

        measure. For a `Γ`-invariant `F`, `(Γ.quotMeasure μ)[F]` is the integral of `F` over `Γ \ G`. Such

        integrals are compared with integrals over a quotient `Λ \ H` of a second group mapping to `G`, and

        are written as iterated integrals with inner integral over `Λ \ H`. From this follow two criteria

        for the integral of a continuous left `Γ`-invariant function to vanish.

        '
    remainder:
      path: grh/src/Lib/Adelic/QuotientMeasure/UnfoldingInStages.lean
      line: 11
      endLine: 33
      text: "\n## Main definitions and results\n\n* `New.exists_integral_comp_quotMeasure_eq_smul`: for a continuous\
        \ surjection `H → G` of unimodular\n  groups taking `Λ` into `Γ`, the integral over `Λ \\ H` of a pulled-back\
        \ invariant function is a\n  fixed multiple of its integral over `Γ \\ G`. Unimodular means the Haar measures\
        \ are also right\n  invariant.\n* `New.integral_quotMeasure_stages`: the integral over `Γ \\ G` is an iterated\
        \ integral whose inner\n  integral is over `Λ \\ H`.\n* `New.integral_quotMeasure_eq_integral_cosetMeasure`:\
        \ the case of a closed subgroup, with the outer\n  integral over `i(H) \\ G` (`New.cosetMeasure`).\n* `New.Exchange.exists_integral_stages_eq_mul`:\
        \ for a subgroup `L × H`, if the inner integrals\n  through every `g` are `ρ g * c`, with `re ρ` nonnegative\
        \ and nonzero near some point, then the\n  integral over `Γ \\ G` is `R * c` for a fixed `R ≠ 0`, with `Γ`\
        \ the image of `Λ ≤ H`.\n* `New.integral_quotMeasure_eq_zero_of_mean`: the integral vanishes if an average\
        \ of translates of\n  `F` by elements of a closed subgroup `H ≥ Γ` is `a • F` and these elements scale the\
        \ Haar measure\n  of `H` by `d ≠ a`.\n* `New.integral_quotMeasure_eq_zero_of_twist`: the integral vanishes\
        \ if `F (u * y) = c • F y` with\n  `‖c‖ = 1` and `c ≠ 1`.\n\n## Relation to the literature\n\nKnown; see\
        \ `Lib.Adelic.QuotientMeasure.Basic` for sources.\n"
