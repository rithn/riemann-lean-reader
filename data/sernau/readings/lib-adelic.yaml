      text: 'Let G = G_∞ × G_f be the adelic unitary group, and let R(α)F(g) = ∫ α(x) F(gx) dx over G_∞ be right

        convolution over the real points (`New.realConv`). For integrable α, R(α) preserves bounded

        automorphic functions, and convolving with an idempotent kernel e produces forms of type e. The

        product of discrete series kernels over the infinite places is a cusp kernel under a gap condition.

        '
    remainder:
      path: grh/src/Lib/Adelic/AutomorphicForms/RealConvolution.lean
      line: 12
      endLine: 49
      text: "For the Petersson product, right translation is unitary, and a cusp kernel e projects every real\n\
        translate of a form of type e to a multiple of it. A bounded Poincaré series, projected term by\nterm, is\
        \ a form.\n\n## Main definitions and results\n\n* `New.continuous_realConv`, `New.Space.isAutomorphic_realConv`:\
        \ for integrable α, R(α)F is\n  continuous when F is bounded, measurable and has an open level, and it is\
        \ automorphic and bounded\n  when F is also invariant under the rational points.\n* `New.Space.exists_form_eq_realConv`:\
        \ convolving with an idempotent kernel gives a form of type e.\n* `New.IsCuspKernel`: minimal idempotents\
        \ e on G_∞ with a moment of order B + 1 and decay of order\n  B, and with α ∗ e = e for some continuous\
        \ compactly supported α.\n* `New.isCuspKernel_typeKernel`: the product kernel `New.typeKernel` over the\
        \ infinite places is\n  such a kernel when the parameters satisfy a gap condition.\n* `New.Space.IsForm.realConv_translate`,\
        \ `New.Space.IsForm.petersson_real_translate`: `e` projects\n  each real translate of a form to a multiple\
        \ of the form.\n* `New.Space.exists_form_eq_tsum_of_fixesLeft`: if an absolutely bounded sum of measurable\
        \ functions\n  is left invariant under `V.Γ` and has level `K`, projecting each term by R(e) gives a form\
        \ of type\n  `e`; `New.Space.exists_form_eq_tsum` is the case of a sum over `V.Γ` of translates of one\n\
        \  function. `New.levelSpace (V.formRep e) K` is the space of forms of type `e` fixed by the open\n  subgroup\
        \ `K` of the finite points.\n\nNotions from other files:\n* `New.Space.IsAutomorphic`: continuous, left\
        \ invariant under the rational points `V.Γ`, and right\n  invariant under some open subgroup of G_f.\n*\
        \ `New.HCParam.dsKernel`: for a parameter l = 2λ, the function e_λ on U(diag s), the formal degree\n  times\
        \ the conjugate of the discrete series coefficient c_λ (`New.HCParam.dsCoeff`).\n* `New.IsIdempotentKernel`\
        \ (part of `New.IsCuspKernel`): e is continuous and integrable, e(g⁻¹) is\n  the conjugate of e(g), e(1)\
        \ ≠ 0, and ∫ e(z)e(x⁻¹z⁻¹y) dz = e(x⁻¹)e(y)/e(1).\n* `New.Space`: a hermitian space with a point, given\
        \ by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal to diag(s) at the infinite places and\
        \ 1 at the finite places.\n* `New.Space.quotMeasure`: the measure on `G` that computes integrals over `Γ\
        \ \\ G`.\n\n## Relation to the literature\n\nKnown result: convolution over real points, cusp kernels, the\
        \ Petersson product and Poincaré series\nprojected to forms, from the theory of cusp forms. For sources\
        \ see\n`Lib.Adelic.AutomorphicForms.Cuspidality`.\n"
