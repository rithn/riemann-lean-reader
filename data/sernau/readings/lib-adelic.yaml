        \  `ResField w`.\n* `parabolic lev` is the subgroup of invertible matrices that are block upper triangular\
        \ for the\n  level function `lev`.\n* `levelSpace ρ J` is the space of vectors fixed by `J` in the representation\
        \ `ρ`.\n* `heckeCoset ρ J t` is the sum of `ρ g` over chosen representatives `g` of the cosets in\n  `J\
        \ t J / J`.\n\n## Relation to the literature\n\nA relation in the Hecke algebra of a parahoric subgroup\
