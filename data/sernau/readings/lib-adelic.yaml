      line: 14
      endLine: 39
      text: "\n## Main definitions and results\n\n* `New.Space.exists_kernel_form`, `New.Space.partialKernel_convIndicator_eq_sum`:\
        \ the conjugate of\n  the kernel of a level `K` is a form, and the kernel of `e ⊗ (a ⋆ 1_K)`, for `a` in\
        \ the group\n  algebra of `G_f`, expands in an orthonormal basis.\n* `New.Space.volume_mul_trace_eq`: the\
        \ volume of the level times the trace on forms is the integral\n  over `Γ \\ G` of the kernel on the diagonal.\n\
        * `New.frameClass`, `New.Space.orbitalIntegral_unfold`: classes of pairs (finite frame, rational\n  matrix)\
        \ index the conjugacy classes of all spaces at once, and for irreducible `R` the term of `R`\n  unfolds\
        \ into orbital integrals.\n\nNotions from other files:\n* `New.Space E n s`: a hermitian form `J` over `E`\
        \ with an adelic frame `x` in which it is `diag s`\n  at infinity and `1` at the finite places. `V.ratEmbed`\
        \ embeds `U(J)(E)` in `G = G_∞ × G_f` with\n  image `Γ = V.Γ`, and `V.quotMeasure` integrates over `[G]\
        \ = Γ \\ G`.\n* `New.IsCuspKernel B e`: `e` is a minimal convolution idempotent on `G_∞` with moment of\
        \ order\n  `B + 1` and decay of order `B`.\n* `V.polyTerm k φ S γ x`: the value of `k ⊗ φ` at `x⁻¹ γ x`\
        \ if the characteristic polynomial of `γ`\n  lies in `S`, and `0` otherwise.\n* `V.formRep e`: the action\
        \ of `G_f` on the forms of type `e`, which are the bounded automorphic\n  functions on `G` fixed by `e`;\
        \ a level `K` is an open subgroup of the standard compact subgroup.\n\n## Relation to the literature\n\n\
