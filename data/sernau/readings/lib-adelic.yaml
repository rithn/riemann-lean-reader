      text: 'The adeles `New.𝔸` of a number field `E` are one copy of `ℂ` for each infinite place, times the

        finite adeles `New.𝔸f`; this is the adele ring when `E` is totally complex. `New.Ô` is the ring of

        integral finite adeles. The file defines the standard additive character and the Haar measures

        used in Fourier analysis on `New.𝔸`. For a totally complex field `E`, it proves that `E`, embedded

        diagonally by `New.toAdele`, is a cocompact lattice of covolume one, and so are vectors and matrices

        over `E`. The proof uses a fundamental domain built from a fractional ideal.

        '
    remainder:
      path: grh/src/Lib/Adelic/Adeles/AdditiveCharacter.lean
      line: 14
      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.ψf`: the character of the finite adeles that is trivial\
        \ on `New.Ô` (`New.ψf_eq_one_of_mem`)\n  and is `\U0001D41E (tr a)` on `a ∈ E` (`New.ψf_coe`), where `\U0001D41E\
        \ t = exp (2πi t)`. These two properties\n  define it, since every finite adele is an element of `E` plus\
        \ an integral one.\n* `New.stdAddChar`: its product with `\U0001D41E (-∑_w 2 re x_w)`. Here `x_w` is the\
        \ component of the adele\n  at the infinite place `w`.\n* `New.volume_Ô`: `volume` on the finite adeles\
        \ gives `New.Ô` the mass `New.volÔ`. On a completion\n  `New.LocField w`, `volume` gives the local integers\
        \ mass one (`New.volume_LocInt`). On the adeles\n  it is the product with Lebesgue measure on each `ℂ`.\n\
        * `New.ratAdeles`, `New.ratVectors`, `New.ratMatrices`: the rational points, vectors and matrices.\n* `New.HasFundDomain`:\
        \ a compact set contains a fundamental domain of volume one.\n* `New.IsCovolOneLattice`: a discrete cocompact\
        \ subgroup whose quotient measure has mass one.\n\nNotions from other files:\n* `New.LocField`, `New.LocInt`:\
        \ The completion E_w of E at the finite place w and its ring of\n  integers.\n* `New.PlaceEmbedding E`:\
        \ a choice, for each infinite place `w`, of a complex embedding `Φ w` of\n  `E` that induces `w`. The map\
        \ `New.toAdele` uses these embeddings at the infinite places.\n\n## Relation to the literature\n\nFor totally\
        \ complex `E` the file proves a known result: a number field is a discrete subgroup of its\nadeles with\
        \ compact quotient, here with a measure for which the covolume is one.\n"
