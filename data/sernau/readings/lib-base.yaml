    draft:
    - sentence: The lemma `star_mulVec_dotProduct` pairs two vectors with the standard Hermitian dot product, so
        the first vector is starred before taking the dot product.
      citations:
      - module: Lib.Base
        line: 13
        endLine: 16
    - sentence: For a rectangular matrix `B`, applying `B` to the first vector gives the same pairing as applying
        its conjugate transpose `Bᴴ` to the second vector.
      citations:
      - module: Lib.Base
        line: 14
        endLine: 16
    - sentence: The proof expands the star of the matrix–vector product, then rewrites the dot product so that `Bᴴ`
        acts on the second vector.
