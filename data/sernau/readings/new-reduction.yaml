      path: grh/src/New/Reduction/Lattices/TwistedLattice.lean
      line: 8
      endLine: 15
      startOffset: 151
      endOffset: 883
      text: 'A twisted lattice on a complex vector space `V` is a family of linear maps `Θ_ξ` from `V` to inner

        product spaces, one for each twist `ξ`, with a module of integral vectors at every `ι ∣ l` in each

        of these spaces, and coordinates on the space for the trivial twist in which the inner product

        has a rational matrix. A twist is a member of an index type `T`, the trivial twist is `1`, and for

        each prime `l` some twists are called allowed at `l` (`IsAllowed`). A vector of `V` is integral at

        `ι ∣ l` if its images for all twists allowed at `l` are (`integralVectors`), while the covolume

        refers to the trivial twist alone. An inner product on `V` and its finite dimension are assumed only

        from the definition of the number `Z(ξ)` on.'
    remainder:
      path: grh/src/New/Reduction/Lattices/TwistedLattice.lean
      line: 15
      endLine: 38
      startOffset: 883
      endOffset: 2320
      text: "\n\n* `New.TwistedLattice.IndexLe`, `New.TwistedLattice.CovolumeLe`, `New.TwistedLattice.volume`: index\n\
        \  and covolume of a family in `V`, and the number `Z(ξ) = det (Θ_ξ* Θ_ξ)`.\n* `New.TwistedLattice.CovolumeLe.norm_map_det_gram_le`,\
        \ `New.TwistedLattice.CovolumeLe.sumElim`,\n  `New.TwistedLattice.norm_det_mul_det_gram_le_one`: conjugates\
        \ of Gram determinants, adjoining\n  vectors, and valuations of Gram determinants.\n* `New.TwistedLattice.covolume_add_index_nonneg`:\
        \ given an allowed twist `ξ_ι` for each `ι`, a\n  lower bound for the covolume of a family in terms of its\
        \ index, the height of `Z(1) / Z(ξ_ι)`,\n  and the sizes and denominators of vectors that complete the family\
