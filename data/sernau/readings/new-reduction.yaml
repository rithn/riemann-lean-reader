      text: 'The data `D` (`New.Data`) fix a CM field `E = D.E`, scales `x ≤ x₁ ≤ b`, a number `m` of lifts,

        weights `κ` and `κ_j = D.liftWeight j` at the infinite places and a level `N`. The file bounds the

        weight `κ` (`New.Data.weight`) and the numbers `κ_s` (`New.Data.shiftedWeight`,

        `New.Data.liftWeight`). For a chain of lifts one takes powers `ϑ ^ j` of an m-fold twist `ϑ`, whose

        powers of exponent `1, …, m` are all twists.

        '
    remainder:
      path: grh/src/New/Reduction/Data/LevelAndTwists.lean
      line: 12
      endLine: 40
      text: "\n## Main definitions and results\n\n* `New.Data.targetParameter`: the row parameter, a sequence of\
        \ integers at each infinite place.\n  `New.Data.targetParameter_eq` writes its later entries as `Δ / 2 -\
        \ κ_j`.\n* `New.Data.logLevelTarget`: the logarithm of the lower end of the range for the level, between\n\
        \  `m log b` and `24 m log b`. `New.Data.log_N_mem_Icc_logLevelTarget` puts `log N` within `√(log b)`\n\
        \  above it, so `log N` lies between `m log b` and `30 m log b`. `New.Data.N_modEq_one` gives `N ≡ 1`\n\
        \  modulo `New.Data.cyclotomicConductor`.\n* `New.Data.TameChar`, `New.Data.Twist`: characters of `U(1)(\U0001D538\
        )` of weight `0` with tame part\n  `tamePart` supported on a finite set `Q` of places; a twist has `tamePart\
        \ w ≠ 1` on `Q`.\n* `New.Data.untwistedLiftChar`, `New.Data.liftChar`: the characters `μ_j⁰` and `μ_j⁰ ϑ`\
        \ of weight\n  `-κ_j`.\n* `New.Data.MFoldTwist`: twists whose powers of exponent `1, …, m` are twists\n\
        \  (`New.Data.MFoldTwist.powTwist`).\n* `New.Data.chainChar`: the character `μ_j⁰ ϑ ^ j` of lift `j` of\
        \ a chain. It is given by\n  `New.Data.liftChar` applied to `ϑ ^ j` and `j`.\n\nNotions from other files:\n\
        * `New.Data.weight`: the weight `κ` of an infinite place of `E`. It is `b = a / x` at the\n  `b`-places,\
        \ which form a chosen finite set `D.bPlaces`, and `a / x₁` at the others; `a = x b`.\n* `New.Data.shiftedWeight`,\
        \ `New.Data.liftWeight`: `D.shiftedWeight i σ` is `κ_s = κ + (s + 1/2) Δ`\n  at `s = i / 2`, and `D.liftWeight\
        \ j σ` is `κ_j`; the gap is `Δ = D.gap = 2 * D.halfGap`.\n* `New.Data.HasLogBound`: `D.HasLogBound u F l`\
        \ is `|F| ≤ exp l` if `u` is true (`D.HasLogUpper`)\n  and `exp l ≤ F` if `u` is false (`D.HasLogLower`).\n\
        * `New.AutChar`: the group of automorphic characters of `U(1)(\U0001D538)`.\n* `New.AutChar.HasWeight`:\
        \ `μ.HasWeight e ψ` says that the character `μ` has weight `e` and tame\n  part `ψ`, that is, almost all\
        \ residue characters `ψ_w` are trivial and\n  `μ(u) = ∏_v u_v ^ e(v) * ∏_w ψ_w(u mod w)` whenever `u` has\
        \ integral finite part.\n"
