      line: 9
      endLine: 38
      startOffset: 349
      endOffset: 1767
      text: "\n\nLetters used in comments, and the names in the code:\n\n| letter | code |\n|---|---|\n| `p₀`, `p₁`\
        \ | `D.levelPrime 0`, `D.levelPrime 1` |\n| `π_M`, `π_N` | `star D.piMBar`, `D.piN` |\n| `κ(τ)`, `κ_j(τ)`\
        \ | `D.weight τ`, `D.liftWeight j τ` |\n| `s`, `Δ` | `D.towerExp`, `D.gap` |\n| `s_∞`, `s_fin` | `D.jetSize`,\
        \ `D.primeSum` |\n\n## Main definitions and results\n\n* `New.Data`: the data; `New.Parameters.IsSparse`\
        \ is the condition on the `b`-places. The scales and\n  ranks are asked to lie in ranges only. The data\
        \ with the exact values are\n  `New.Parameters.IsAdmissibleData`; they are admissible for large `x`\n  (`New.eventually_exists_data_of_isAdmissibleData`).\
        \ Sizes are compared in the files `Magnitudes`\n  and `Sizes` of this folder.\n* `New.Parameters.logLevelMin_mem_Icc`:\
        \ the lower end `N₋` of the range for the level has logarithm\n  between `m log b` and `24 m log b`.\n\n\
        Notions from other files:\n* `New.Parameters`: a multiple `q₀` of `18480 = 16 · 3 · 5 · 7 · 11` and a prime\
        \ `d` with\n  `d ≡ q₀/2 - 1 mod q₀`; they determine the field `P.K = ℚ(√-d)`.\n* `New.towerDeg s`: the number\
        \ `3 l₀ 2 ^ s`, where `l₀ = New.l₀ s` is, for `s ≥ 1`, the least power\n  of `3` above `27 s`. The modulus\
        \ `P.q₁ s` is `q₀ * towerDeg s`.\n* `P.E s`, `P.Φ s`: the field `E = K(ζ)`, with `ζ` a primitive `q₁`-th\
        \ root of unity, and its\n  infinite places, which form a group isomorphic to `(ℤ/q₁)ˣ`.\n* `P.q₂ s`: the\
        \ number `(q₀ d) ^ (s + 6)`.\n"
