    excerpt:
      path: grh/src/New/Reduction/Data/FieldsAndPlaces.lean
      line: 7
      endLine: 12
      text: 'Fix a multiple `q₀` of `18480` and a prime `d ≡ q₀/2 - 1 mod q₀`. Let `K = ℚ(√-d)`, and let

        `E = K(ζ)` with `ζ` of order `q₁ = q₀ * towerDeg s`. The file counts the places, describes how they

        act on `ζ`, shows that every root of unity of `E` is a power of `ζ`, and writes norms from `E` to

        `K` as products over the embeddings `Φ v`. In the comments `c = ⌊log₃ s⌋ + 5`, so that

        `towerDeg s = 3^c 2^s`, `φ` is Euler''s totient function, and `P.Φ s` is the type of infinite places

        of `E`.

        '
    remainder:
      path: grh/src/New/Reduction/Data/FieldsAndPlaces.lean
      line: 13
      endLine: 41
      text: "\n## Main definitions and results\n\n* `New.Parameters`: a multiple `q₀` of `18480` and a prime `d\
        \ ≡ q₀/2 - 1 mod q₀`. Then `d ≡ 7 mod 8`\n  and `(p / d) = 1` for each prime `p ∣ q₁` (`New.Parameters.chiK_eq_one_of_dvd`).\n\
        * `New.Parameters.irreducible_cyclotomic`: the cyclotomic polynomial of order `q₁` is irreducible\n  over\
        \ `K`, so `Gal(E/K) = (ℤ/q₁)ˣ`. `E` embeds in `ℚ(ζ_{q₁ d})`, hence is abelian over `ℚ`.\n* `New.Parameters.galOfPlace`,\
        \ `New.Parameters.placeMulEquiv`: the infinite places of `E` form a\n  group, identified with `Gal(E/K)`\
        \ and `(ℤ/q₁)ˣ`. Composing a fixed embedding of `E` in `ℂ` over\n  `K` with these automorphisms gives one\
        \ embedding for each infinite place, the CM type of `E`.\n* `New.Parameters.numInfPlaces_E`, `New.Parameters.card_placeClass_eq_one_eq_towerDeg`:\
        \ there are\n  `towerDeg s * φ(q₀)` places, `towerDeg s` of them of class `1` modulo `q₀`; this rests on\n\
        \  `cyclotomic q₁ = (cyclotomic q₀)(X ^ towerDeg s)` (`New.Parameters.expand_towerDeg_cyclotomic`).\n* `New.Parameters.exists_zeta_pow_eq`:\
        \ every root of unity of `E` is a power of `ζ`.\n* `New.Parameters.prod_phi_eq_norm`: the product of the\
        \ images of `y` under the `K`-embeddings `Φ v`\n  of `E` in `ℂ` is the norm of `y` from `E` to `K`.\n\n\
        The basic facts on the field `E` are proved in `Lib` or in\n`New.Derivatives.Field.PrimeDecomposition`:\n\
        * the ring of integers: `New.Parameters.adjoin_betaKInE_zetaInt_eq_top`, in the latter file;\n* the different\
        \ of `E` over its real subfield and the places fixed by conjugation:\n  `New.differentIdeal_eq_top_of_add_star_eq_one`,\
        \ `New.two_notMem_of_star_eq` and\n  `New.exists_sq_eq_q_of_star_eq` in `Lib`, `New.Parameters.natCast_eq_neg_one_of_star_eq`\
        \ in the\n  latter file.\n\nNotions from other files:\n* `New.chiK d` is the Legendre symbol `(· / d)`,\
        \ the character of `ℚ(√-d)` for `d ≡ 3 mod 4`.\n* `New.CMType E` is a choice, for each infinite place of\
        \ the CM field `E`, of an embedding in `ℂ`\n  that induces it; `Φ v` is the embedding chosen at `v`.\n"
