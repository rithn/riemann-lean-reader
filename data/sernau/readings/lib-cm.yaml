      endLine: 40
      text: "\nThe statements use the following notions, for primes `p` and `d`; from `piPrime_mem_quadInt` on,\n\
        `d ≡ 7 mod 8` is assumed, and `quadInt d` is the ring of integers of `K` inside `ℂ`.\n\n* `chiK d p`: the\
        \ Legendre symbol `(p / d)`; for `d ≡ 7 mod 8` it is `1`, `-1`, `0` when `p` is\n  split, inert, ramified\
        \ in `K`.\n* `primeNorm d p`, also written `q_p`: `p ^ 2` if `(p / d) = -1`, and `p` otherwise.\n* `ιₚ :\
        \ ℂ →+* ℂ_[p]`: the embedding given by an instance `PadicPlace p`; the valuation `v` of\n  `ℂ_[p]` with\
        \ `v(p) = 1` is expressed by `‖x‖ = p ^ (-v(x))`.\n\n## Main definitions and results\n\n* `New.piPrime`,\
        \ `New.piPrimeValuation`: the number `π_p`, which is `√-d` for `p = d` and `p`\n  otherwise, and its valuation\
        \ `v(π_p)`, which is `1 / 2` for `p = d` and `1` otherwise.\n* `New.varpiValuation`, `New.gammaPrime`: the\
        \ numbers `ρ_p = v(π_p) / (q_p - 1)` and\n  `γ_p = 1 / (p - 1) - ρ_p`.\n* `New.partnerExponents`, `New.positivePartnerExponents`:\
        \ the sets `I_p°` and `I_p`. The set `I_p°`\n  consists of the odd numbers if `p` is inert, of all numbers\
        \ if `p = d`, and is empty if `p`\n  splits; `I_p` consists of its positive elements.\n* `New.hasSum_gammaPrime`:\
        \ `γ_p = v(π_p) ∑_{e ∈ I_p} p⁻ᵉ`.\n* `New.piPrime_mul_conj`, `New.norm_piPrime`, `New.norm_piPrime_eq_rpow_pow`:\
        \ the norm of `π_p` at a\n  non-split prime, its valuation, and the relation `v(π_p) = (q_p - 1) ρ_p`.\n\
        * `New.exists_mul_conj_eq_pow`: for a prime `p` that splits in `K` there is an `α` in the ring of\n  integers\
        \ with `α ᾱ` a positive power of `p` and `ᾱ` a `p`-adic unit; the proof takes a generator\n  of a power\
        \ of the prime of `K` induced by the `p`-adic place.\n\n## Relation to the literature\n\nKnown result: decomposition\
        \ of primes in `ℚ(√-d)` and elements of prime-power norm at split primes.\nThe existence of `α` follows\
        \ from the finiteness of the class group. The numbers `ρ_p`, `γ_p` and\nthe sets of exponents are notation,\
        \ and the sum for `γ_p` is a geometric series.\n"
