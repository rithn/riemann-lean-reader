      startOffset: 118
      endOffset: 785
      text: 'Let `σ` be a field automorphism of `ℂ`, and let `C`, `C''` be CM data (`New.CMLattice`) with

        `C''.a₁ = σ C.a₁`, so that their cubics y² + a₁xy = x³ + x are conjugate under `σ`. Write `θ`, `θ''`

        for their theta functions, and `New.taylorVia σ f` for the Taylor series of `f` at 0 with `σ`

        applied to its coefficients. The bare letter `σ` is the automorphism, while `C.σ` is the sigma

        function of the lattice of `C`. For `σ ∈ Aut(ℂ/K)` with `K = ℚ(√-d)` (`quadInt d` is the image of

        `𝓞_K` in `ℂ`, fixed by `σ`), a conjugate CM datum exists, and conjugation extends to isogenies and

        to translates of `θ`; this is a step towards `New.CMLattice.complex_multiplication_theta`.'
    remainder:
      path: grh/src/Lib/CM/ConjugateCurve.lean
      line: 12
      endLine: 47
      startOffset: 785
      endOffset: 3074
      text: "\n\n## Main definitions and results\n\n* `New.thetaQuotient`: the quotient `θ' / σ θ` of power series,\
        \ by which the theta functions differ.\n* `New.taylorAtZero_monomialSection`, `New.exists_conjugate_section`:\
        \ monomial sections, and hence\n  all sections `f` of degree `m` of `C`, have conjugates with Taylor series\
        \ `(θ' / σ θ) ^ m * σ f`;\n  the second lemma transports points as well.\n* `New.CMLattice.exists_galConjugate_of_g₂_g₃`,\
        \ `New.CMLattice.galConjugate`: a lattice with the\n  invariants `σ g₂`, `σ g₃` carries a CM datum with\
        \ the number `σ a₁`, and one such datum is chosen.\n* `New.CMLattice.thetaQuotient_eq_one`, `New.CMLattice.taylorAtZero_theta_eq_taylorVia`:\
        \ for a CM\n  datum `D` with invariant `σ a₁`, the Taylor series of the theta function is the conjugate\
        \ of that\n  of `θ`.\n* `New.CMLattice.exists_taylorVia_twistedTranslate_theta`: when the lattice of `C`\
        \ is `Ω \U0001D4DE_K` and\n  `S` is a finite subset of `K`, there is a period `v` of `D` such that, for\
        \ all `s ∈ S`, the Taylor\n  series of the translate by `s v` of the theta function of `D` is the conjugate\
        \ of that of the\n  translate of `θ` by `s Ω`.\n\nNotions from other files:\n* `New.CMLattice.θ`: The twisted\
        \ translate (`twistedTranslate 1 u f` is\n  `z ↦ exp(−π(zū + |u|²/2)/area Λ) f(z + u)`) of the sigma function\
        \ `C.σ` by the point t of order\n  two, normalised to 1 at 0; it vanishes exactly on t + Λ.\n* `New.CMLattice.translatedX`,\
        \ `New.CMLattice.translatedY`: The coordinates x(z) = ℘(z + t) − ℘(t)\n  and y(z) = ½(℘′(z + t) − a₁x(z))\
        \ of the curve.\n* `New.CMLattice.sections`: The sections of degree m: theta functions for the lattice Λ\
        \ with\n  hermitian form mH and multiplier χ^m, for the hermitian form H and multiplier χ of `θ`.\n* `PeriodPair.IsIsogeny`:\
        \ L.IsIsogeny M a N says that a maps the periods of L to those of M and that\n  a·ā·area(L) = N·area(M).\n\
        * `New.CMLattice.monomialSection`: For j = (a, b, c), the section θ^a·(C.σ²)^b·G^c of degree\n  a + 2b +\
        \ 3c, with C.σ the sigma function and G = `New.CMLattice.translatedYThetaCube`.\n\n## Relation to the literature\n\
        \nPart of a known result: Main theorem of complex multiplication for elliptic curves, soft form. See\n`Lib.CM.ChowlaSelberg`.\
        \ No reciprocity law is used: the conjugate lattice comes from uniformisation,\nand points are matched by\
        \ transporting sections.\n"
