        \ E the Riemann form of B.\n* `New.CMLattice.translatedYThetaCube`: The entire function G = σ·(σ′θ − σ·(θ′\
        \ + ½a₁θ)), written as\n  a pointwise product of functions.\n\n## Relation to the literature\n\nKnown results:\
        \ sigma and theta functions of a lattice, their addition formulas, the Weierstrass\nequation and the elliptic\
