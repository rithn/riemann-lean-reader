      text: 'Throughout, `K = ℚ(√-d)` (`New.QuadField d`) for a prime `d ≡ 7 mod 8` (`New.PrimeSevenModEight d`),

        and `χ` is the Legendre symbol modulo `d`. For such `K` the class number is odd, and the Dedekind

        zeta function factors as `ζ_K(s) = ζ(s) L(s, χ)`. The second part treats curves with complex

        multiplication by `K`, given by CM lattices `C : New.CMLattice d`. For these curves the file proves

        a complex multiplication law for the translates of the theta function when the lattice is `Ω₀ 𝓞_K`,

        and the formula of Chowla and Selberg for the areas of the conjugate lattices.

        '
    remainder:
      path: grh/src/Lib/CM/ChowlaSelberg.lean
      line: 17
      endLine: 63
      text: "\n## Main definitions and results\n\n* `New.QuadField.classGroup_sq_bijective`: squaring permutes the\
        \ class group, that is, the class\n  number is odd.\n* `New.QuadField.eulerProd_one_eq_zeta_mul`: `ζ_K(s)\
        \ = ζ(s) L(s, χ)` for real `s > 1`, with `χ` the\n  Legendre symbol modulo `d`.\n* `New.CMLattice.IsComplexMultiplicationData`,\
        \ `New.CMLattice.complex_multiplication_theta`: the\n  action of `σ` on the translates of `θ` by torsion\
        \ points is given by one finite adele of `K`, if\n  the lattice is `Ω₀ \U0001D4DE_K`.\n* `New.CMLattice.sum_kronecker_terms`:\
        \ Kronecker's limit formula summed over the class group.\n* `New.CMLattice.chowla_selberg`: after scaling\
        \ by the conjugates of one unit, all conjugate\n  lattices have the area that this sum gives.\n\nNotions\
        \ from other files:\n* `New.CMLattice`: A lattice `Λ` stable under the integers of `ℚ(√-d)`, with a point\
        \ `t` of order\n  two modulo `Λ` such that `ω t`, `ω̄ t ∉ Λ` for `ω = (1 + √-d) / 2`, scaled so that `℘''(t)\
        \ = 2`,\n  and a square root `a₁` of `12 ℘(t)`; the discriminant of `Λ` is `a₁⁴ - 64`.\n* `New.CMLattice.θ`:\
        \ The twisted translate of the sigma function by `t`, normalised to `1` at `0`.\n* `PeriodPair.area`: The\
        \ area |Im(ω̄₁ω₂)| of the fundamental parallelogram spanned by the periods\n  ω₁, ω₂ of a period pair.\n\
        * `New.chowlaSelbergConst`: The real number `γ - Re L'/L(1, χ_K)`, with `γ` Euler's constant.\n\n## Relation\
        \ to the literature\n\nKnown result: The class number of an imaginary quadratic field of prime discriminant\
        \ is odd. Here it\nis stated as bijectivity of squaring on the class group, for primes congruent to 7 modulo\
        \ 8. Source:\nC. F. Gauss, Disquisitiones; D. Cox, Primes of the form x²+ny² (1989), §3 and §6.\n\nKnown\
        \ result: The Dedekind zeta function of a quadratic field is the product of the Riemann zeta\nfunction and\
        \ the L-function of its character, and the sum of the zeta functions of its ideal\nclasses. Source: J. Neukirch,\
        \ Algebraic Number Theory (1999), VII.5 and VII.10.\n\nKnown result: The formula of Lerch and of Chowla\
        \ and Selberg for the geometric mean of\narea · |disc|^(1/6) over the ideal classes (`New.CMLattice.sum_kronecker_terms`).\
        \ Here the\ndiscriminant is prime with 2 split, and the mean is left in terms of the logarithmic derivative\
        \ of\nthe L-function at 1, with no Gamma values. The integrality of isogenies then gives one number, a\n\
        unit at every p-adic place, whose conjugates scale all conjugate lattices to this area. Source: A.\nSelberg,\
        \ S. Chowla, On Epstein's zeta-function, J. reine angew. Math. 227 (1967) 86-110; B. Gross,\nOn the periods\
        \ of abelian varieties, arXiv 2005.04194.\n\nKnown result: The main theorem of complex multiplication for\
        \ elliptic curves, without the\nreciprocity law. It is shown that the conjugate lattice is `Ω \U0001D520\
        ² / N(\U0001D520)` and that one finite adele\ndescribes the Galois action on the translates of the theta\
        \ function by torsion points. The adele is\nnot identified with the Artin map and is not shown here to be\
        \ a unit. Source: G. Shimura,\nIntroduction to the Arithmetic Theory of Automorphic Functions (1971), Thm\
        \ 5.4; J. Milne, Complex\nMultiplication (2020), 9.17.\n"
