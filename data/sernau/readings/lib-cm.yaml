      startOffset: 359
      endOffset: 1415
      text: "\n\nFor the lattice `ℤ τ + ℤ`, each row `∑ n, |m τ + n|^(-2s)` with `m ≥ 1` is compared with the\n\
        integral `∫ |m τ + t|^(-2s) dt` (`New.hasSum_shiftedTerm`). The errors `New.meanError` sum to a\nfunction\
        \ continuous on `[1, 2]`, the integrals to a multiple of `ζ(2s - 1)`, which has a simple pole\nat 1. At\
        \ `s = 1` the cotangent series expresses the errors through `log |∏ (1 - q ^ n)|`\n(`New.tsum_meanError_one`).\n\
        \nNotions from other files:\n* `PeriodPair.area`: The area |Im(ω̄₁ω₂)| of the fundamental parallelogram\
        \ spanned by the periods\n  ω₁, ω₂ of a period pair.\n\n## Relation to the literature\n\nKnown result: Kronecker's\
        \ first limit formula. Here the real limit from the right is proved for any\nlattice and stated with the\
