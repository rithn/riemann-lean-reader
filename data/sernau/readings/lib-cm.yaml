        \ σ(z)⁴`.\n* `New.CMLattice d`: a lattice `Λ` with a point `t` of order two such that `℘''(t) = 2` and a\n\
        \  square root `a₁` of `12 ℘(t)`. For `d ≠ 0` the lattice is also stable under multiplication by\n  `New.quadInt\
        \ d`, and neither `ω t` nor `ω̄ t` lies in it, where `ω = New.quadGen d`.\n* `New.exists_lattice_eq_mul_tau`:\
        \ every lattice is a(ℤτ + ℤ) with τ in the upper half plane.\n* `New.g₂_eq_eisenstein`, `New.g₃_eq_eisenstein`,\
        \ `New.g₂_pow_three_sub_g₃_sq_eq_discriminant`: g₂,\n  g₃ and g₂³ − 27 g₃² of that lattice in terms of E₄(τ),\
        \ E₆(τ) and Δ(τ).\n* `New.exists_lattice_of_g₂_g₃`: conversely, every pair (a, b) with a³ − 27 b² ≠ 0 is\
        \ (g₂, g₃) of a\n  lattice (uniformization). The proof finds τ as a zero of a form of weight 12 that tends\
        \ to 1 at\n  the cusp: without a zero, its inverse would be a nonzero modular form of negative weight.\n\
        \nNotions from other files:\n* `New.RealComplexForm.thetaSpace` Λ B χ: the entire f with f(z + l) = χ(l)·exp(B(l,\
        \ z) + B(l,\n  l)/2)·f(z) for l ∈ Λ. A `New.ThetaTori.LatticeForm Λ` is a form B that carries Λ in its type.\n\
        * `New.RealComplexForm.riemannForm`: the Riemann form of B, E(u, v) = Im(B(u, v) − B(v, u))/(2π).\n* `New.IsAppellHumbert`:\
        \ Appell–Humbert data: Re B is symmetric, and on Λ one has |χ| = 1 and\n  χ(l + m) = χ(l)χ(m)·exp(πi E(m,\
        \ l)).\n\n## Relation to the literature\n\nKnown result: Sigma and theta functions of a lattice, their addition\
        \ and doubling formulas, and\nuniformisation. Here sigma is the odd section of a canonical factor of automorphy\
        \ rather than a\nproduct, and the origin is moved to a point of order two. Uniformisation comes from the\
        \ vanishing of\nmodular forms of negative weight. Source: J. Silverman, The Arithmetic of Elliptic Curves,\
        \ VI, and\nAdvanced Topics (1994), I.5; A. Weil, Elliptic Functions according to Eisenstein and Kronecker\n\
        (1976); for uniformisation, A. Sutherland, 18.783 Lecture 15 (2023), Cor. 15.12.\n"
