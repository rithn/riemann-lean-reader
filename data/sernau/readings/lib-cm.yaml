      endLine: 10
      text: 'Let `K = ℚ(√-d) ⊂ ℂ` (`New.QuadField`), where `d` is a prime `≡ 7 mod 8` (`New.PrimeSevenModEight`).

        We show that the lattice of every datum `New.CMLattice d` is a multiple `u 𝔞` of a fractional ideal

        of `K` and that every ideal gives one, and we compute the covolumes. We then follow isogenies of

        degree two through the class group. This shows that the discriminant of a CM lattice, normalised by

        `℘''''(t) = 2`, is a unit at every prime, as it is for a curve with good reduction.

        '
    remainder:
      path: grh/src/Lib/CM/GoodReduction.lean
      line: 11
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.CMLattice.latticeModule`: the lattice of a datum as an\
        \ `\U0001D4DE K`-module;\n  `New.QuadField.scaledIdeal`: `(u, \U0001D51E) ↦ u \U0001D51E`.\n* `New.CMLattice.exists_latticeModule_eq_scaledIdeal`:\
        \ the lattice of every datum has the form\n  `u \U0001D51E`.\n* `New.QuadField.exists_cmLattice_latticeModule_eq_scaledIdeal`:\
        \ every `\U0001D51E` has a multiple `u \U0001D51E` that\n  is the lattice of a datum.\n* `New.QuadField.area_eq_of_eq_scaledIdeal`:\
        \ the covolume of `u \U0001D51E` is `|u|² N(\U0001D51E) √d / 2`.\n* `PeriodPair.IsOrderTwo.scaledDisc_sum_prod`,\
        \ `PeriodPair.IsOrderTwo.scaledDisc_mul_of_isogeny`:\n  identities for the discriminants `s(u)` of a lattice\
        \ scaled to `℘''(u) = 2` at the points `u` of\n  order two.\n* `New.CMLattice.norm_scaledDisc_le_one`, `New.CMLattice.prod_scaledDisc_t`:\
        \ for a family of data,\n  one in each ideal class, the numbers `s(u)` are integral, and those at the points\
        \ `t` have the\n  product `±1`.\n* `New.CMLattice.norm_disc_eq_one`: the discriminant `a₁⁴ - 64` of a CM\
        \ lattice is a unit at every\n  prime.\n\nNotions from other files:\n* `New.CMLattice d`: a period lattice\
        \ `Λ` stable under `\U0001D4DE K`, with a point `t` of order two and a\n  number `a₁`.\n* `PeriodPair.area`:\
        \ the area `|Im(ω̄₁ω₂)|` of the fundamental parallelogram spanned by the periods\n  `ω₁`, `ω₂` of a period\
        \ pair.\n\n## Relation to the literature\n\nKnown result: lattices stable under `\U0001D4DE K` are the multiples\
        \ of fractional ideals. Source: Silverman,\nAdvanced topics in the arithmetic of elliptic curves.\n\nKnown\
        \ result: Siegel units. For a torsion point `u`, the twelfth power of Klein's form at `u` times\nthe discriminant\
        \ is an algebraic integer, and a unit if two different primes of `K` divide the\nannihilator of `u`. The\
        \ file proves the case of the point `t`, whose annihilator is `(2)`; there the\nnumber is the discriminant\
        \ `a₁⁴ - 64`. Source: Kubert, Lang, Modular Units. Up to sign the numbers\n`s(u)` are the 24-th powers of\
        \ Weber's functions. Source: Birch, Weber's class invariants, 1969.\n"
