      text: "\n## Main definitions and results\n\n* `New.IsSeriesGenerator A T`: the series `T = X + ⋯` generates\
        \ `A`, that is, `A = \U0001D52C[[T]]`. Such a\n  ring is closed under integral scalars. It is closed under\
        \ `f ↦ f(a X)` when it contains `T(a X)`.\n  Its elements whose constant term has norm `1` are invertible.\
        \ Any series `f = X + ⋯` in `A`\n  generates it too (`New.IsSeriesGenerator.of_mem`).\n* `New.CMLattice.integralSeriesRing\
        \ C`: the ring `\U0001D52C[[y]]`. Here `y` (`New.CMLattice.translatedY`)\n  and `x` (`New.CMLattice.translatedX`)\
        \ are the coordinates of the CM curve `y² + a₁ x y = x³ + x`.\n  `New.taylorVia ιₚ f` is the Taylor series\
        \ of `f` at `0` with the p-adic place `ιₚ : ℂ →+* ℂ_[p]`\n  applied to the coefficients.\n* `New.CMLattice.taylorVia_translatedX_mem_integralSeriesRing`,\n\
        \  `New.CMLattice.derivative_mem_integralSeriesRing`: `\U0001D52C[[y]]` contains `x` and is stable under\n\
        \  `d/dz`.\n* `New.congruencePart_eq_sum`: for `m ≠ 0`, the part of a series in the degrees of one class\
        \ mod `m`\n  is a mean over the `m`-th roots of unity; `New.congruencePart_subst`: taking it commutes with\
        \ the\n  substitution of a series `T` with `T(0) = 0` that has only degrees `≡ 1` mod `m`.\n* `New.exists_seriesToCp_eq_of_rescale_eq`:\
        \ for `0 < |π| < 1`, `q > 1` and `E` integral of order at\n  least two, a solution `Y = z + ⋯` of `Y(π z)\
        \ / π = Y - Y ^ q + π E(Y)` is integral, by induction\n  on the degree (`New.mem_range_seriesToCp_of_rescale_eq_X_sub_X_pow`),\
        \ and `Y - Y ^ q ≡ z` modulo\n  `π` (`New.C_dvd_sub_pow_sub_X_of_rescale_eq`).\n* `New.dvd_coeff_sub_of_C_dvd_sub_pow_sub_X`:\
        \ let `π` be a non-unit dividing `p` and `q > 1` a power\n  of `p`. If `Y(0) = 0` and `Y - Y ^ q ≡ z` modulo\
        \ `π`, then `Y ≡ ∑ z ^ q ^ j` modulo `π`.\n\nNotions from other files:\n* `New.CMLattice d`: a lattice `Λ`\
        \ stable under the integers of `ℚ(√-d)`, with a point `t` of order\n  two modulo `Λ` such that `ω t`, `ω̄\
        \ t ∉ Λ` for `ω = (1 + √-d) / 2`, scaled so that `℘''(t) = 2`,\n  and a square root `a₁` of `12 ℘(t)`.\n\
        * `New.PrimeSevenModEight d`: the number `d` is a prime congruent to `7` modulo `8`.\n\n## Relation to the\
        \ literature\n\nKnown result: elementary facts on power series; the induction is that of the functional\
        \ equation of\na Lubin–Tate group. Source: Lubin–Tate, Formal complex multiplication in local fields.\n\n\
        The statements on the CM curve use only that `a₁` is integral; `x ∈ \U0001D52C[[y]]` is Hensel's lemma for\n\
        the cubic.\n"
