      text: 'Let `d ≡ 7` mod `8` be a prime and `C` a lattice with complex multiplication by the integers of

        `K = ℚ(√-d)`. Let `p` be a prime, `ιₚ : ℂ →+* ℂ_[p]` a fixed embedding and `𝒪` the valuation ring of

        `ℂ_[p]`. Power series are in the variable `z`, which is `X` in the code; so the formal parameter is

        written `T`.

        '
    remainder:
      path: grh/src/Lib/CM/FormalGroup/FormalParameter.lean
      line: 11
      endLine: 34
      text: "\n* `New.CMLattice.isSeriesGenerator_formalParam`: the part `T` of `y` in degrees `≡ 1` mod `q - 1`\n\
        \  generates `\U0001D4AA[[y]]`.\n* `New.CMLattice.exists_scaled_formalParam`: for some `ϖ` of valuation\
        \ `ρ_p` the series\n  `Y = T(ϖ z) / ϖ` is integral, and `Y - Y ^ q ≡ z`, `Y ≡ ∑ z ^ q ^ j` mod `π_p`. The\
        \ proof writes\n  `T(π_p z) = π_p T + b₁ T ^ q + ⋯` with a unit `b₁` and takes `ϖ ^ (q - 1) = -π_p / b₁`.\n\
        * `New.CMLattice.rescale_mem_range_seriesToCp`, `New.CMLattice.norm_coeff_le_one_of_lt`: for\n  `g ∈ \U0001D4AA\
        [[y]]` the series `g(ϖ z)` is integral, and `g` is integral in the degrees below `q`.\n\n## Notation\n\n\
        * `q = primeNorm d p` is the norm of a prime of `K` above `p`.\n* `π_p = piPrime d p` is `√-d` if `p = d`\
        \ and `p` otherwise; `piPrimeInt d` is its image in `\U0001D4AA`.\n* `y = taylorVia ιₚ C.translatedY` is\
        \ the Taylor series at `0` of the coordinate function\n  `C.translatedY`, moved to `ℂ_[p]` by the embedding\
        \ `ιₚ`.\n* `\U0001D4AA[[y]] = C.integralSeriesRing` is the ring of the series `g(y)` with `g` a series over\
        \ `\U0001D4AA`.\n* `ρ_p = varpiValuation d p` is the valuation of `π_p` divided by `q - 1`.\n\n## Relation\
        \ to the literature\n\nKnown result: multiplication by `π_p` on the formal group of a curve with complex\
        \ multiplication is\nan endomorphism in the sense of Lubin and Tate. That `b₁` is a unit follows from the\
        \ bound for the\nheight of the formal group (`New.CMLattice.insepDegree_piPrime_le`), and the scaling is\
        \ an\nelementary consequence. Lubin–Tate, Formal complex multiplication in local fields.\n"
