      text: "\n\n## Main definitions and results\n\n* `New.CMLattice.theta_add_mul_theta_sub`, `New.CMLattice.theta_sq`:\
        \ the addition formula for\n  θ(z + w)θ(z − w) with z off t + Λ, and θ² = (℘ − ℘(t))σ² off Λ.\n* `New.CMLattice.deriv_translatedX_sq`,\
        \ `New.CMLattice.weierstrass_equation`,\n  `New.CMLattice.deriv_translatedY_eq`: off t + Λ, x′² = x(4x²\
        \ + a₁²x + 4), y² + a₁xy = x³ + x and\n  y′ = 1 + 3x² − a₁y.\n* `New.CMLattice.translatedYThetaCube_sq_add`:\
        \ G² + a₁σ²θG = σ⁶ + σ²θ⁴ everywhere.\n* `New.CMLattice.comp_mul_mem_sections`, `New.CMLattice.twistedTranslate_comp_mem`:\
        \ for d a\n  prime ≡ 7 mod 8, sections pull back along isogenies z ↦ az, and z ↦ (T_uθ)(δ̄z) is a section\
        \ of\n  degree N when z ↦ δ̄z is a degree-N isogeny of C to itself and δu lies in Λ.\n* `New.CMLattice.exists_mul_eq_of_mem_sections`:\
        \ division by a section z ↦ (T_uθ)(az) with a ≠ 0,\n  where T_u = `D.twistedTranslate 1 u` and θ belong\
        \ to a CM datum D. The zeros of such a section are\n  simple (`New.CMLattice.deriv_twistedTranslate_theta_comp_mul_ne_zero`).\n\
        * `New.CMLattice.monomialDeg`, `New.CMLattice.monomialSection`: the degree a + 2b + 3c of a triple\n  (a,\
        \ b, c) and the monomial θ^a σ^{2b} G^c.\n* `New.CMLattice.sections_le_span_monomialSection`: the monomials\
        \ with c ≤ 1, a + 2b + 3c = m (the\n  triples in `New.CMLattice.spanningExponents` m) span the sections\
        \ of degree m.\n\nNotions from other files:\n* `New.CMLattice`: A lattice `Λ` stable under the integers\
        \ of `ℚ(√-d)`, with a point `t` of order\n  two modulo `Λ` such that `ω t`, `ω̄ t ∉ Λ` for `ω = (1 + √-d)\
        \ / 2`, scaled so that `℘''(t) = 2`,\n  and a square root `a₁` of `12 ℘(t)`. The conditions on `ℚ(√-d)`\
