      text: 'The main result, `New.OddPart.exists_isKolyvaginSystem`, constructs Kolyvagin''s cocycles `κ S` with

        values in `O/lⁿ` from the Jacobi-type quotients `J` of `New.OddPart.exists_isJacobiFamily`. One

        takes `lⁿ`-th roots `y` of `J`, forms the roots of unity `γ y / (g γ g⁻¹) y`, applies the derivative

        operators at the primes of `S` and sums against `aᵉ ψ(a)`. The local properties are read modulo a

        place, where roots of unity of order prime to it stay distinct.

        '
    remainder:
      path: grh/src/Lib/Cyclotomic/Kolyvagin/DerivativeCocycles.lean
      line: 12
      endLine: 41
      text: "\n* `New.OddPart.IsKolyvaginSystem`: the properties of the cocycles `κ S`.\n* `New.OddPart.exists_isKolyvaginSystem`:\
        \ a Kolyvagin system exists.\n* `New.OddPart.derivativeSum`: the derivative operators followed by the character\
        \ sum.\n\nConventions: `Ω = ℚ̄` is an algebraic closure of `ℚ`, and its places are valuation subrings\n\
        (`ClosurePlace`); `DiscreteUnits Ω` is `Ω^×` written additively, so `n • u` is `uⁿ`, and\n`galUnitsRep g`\
        \ is the action of `g` on it; `New.QZ.ofZMod M a` is `a/M` in `ℚ/ℤ`;\n`QuotSpan (l ^ n : O)` is `O/lⁿ`;\
        \ `floorDiff c x` is `⌊c ⟨x⟩⌋ - ⌊c ⟨-x⟩⌋`, where `⟨x⟩` is the\nrepresentative of `x` in `[0, 1)`.\n\nNotions\
        \ from other files:\n* `New.OddPart.principalUnits B`: the units of `Ω` congruent to `1` modulo the maximal\
        \ ideal of `B`,\n  as an additive subgroup of `DiscreteUnits Ω`.\n* `New.IsFrob B q σ`: `σ` stabilises `B`,\
        \ and `σ x ≡ x ^ q` modulo the maximal ideal of `B` for\n  every `x` in `B`; for `q = 1` this says that\
        \ `σ` lies in the inertia group of `B`.\n* `New.rootPowHom Ω m`: the map `ℤ/m → Ω^×`, `t ↦ ζᵗ`, for a fixed\
        \ primitive `m`-th root of unity\n  `ζ`; it is injective, and its image is the set of `m`-th roots of unity.\n\
        * `New.cyclotomicPowDirichlet l e ψ`: the character `cycᵉ ψ` of `Gal(ℚ̄/ℚ)` with values in `Oˣ`,\n  where\
        \ `cyc` is the `l`-adic cyclotomic character.\n\n## Relation to the literature\n\nKnown result: Kolyvagin's\
        \ derivative classes of the Euler system of Gauss sums. Here the classes\ncarry a Tate twist and a Dirichlet\
        \ character and are cocycles over the rationals that vanish at one\nfixed element. Their ramification, the\
        \ relation between Frobenius and inertia, and the link between\nthe bottom class and the Stickelberger element\
        \ are also covered. Source: K. Rubin, Kolyvagin's\nsystem of Gauss sums, Arithmetic Algebraic Geometry (Texel\
        \ 1989), Progr. Math. 89, 1991, 309-324;\nwith a Tate twist: G. Banaszak, W. Gajda, Euler systems for higher\
        \ K-theory of number fields, J.\nNumber Theory 58 (1996).\n"
