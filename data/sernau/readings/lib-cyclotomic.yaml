        '
    remainder:
      path: grh/src/Lib/Cyclotomic/OddSha.lean
      line: 11
      endLine: 73
      text: "\n## Overview of this theory\n\nFor a CM field `E` inside `ℚ(μ_N)`, and `O` the integers of a finite\
        \ extension of `ℚ_ℓ` with enough\nroots of unity for the characters mod `N`, `New.Selmer.shaOdd` is a module\
        \ of cocycles of `Gal(Ω/E)`\nwith values in `O/ℓⁿ(-e)`, modelled on the odd part of `Ш¹(E, O/ℓⁿ(-e))`; no\
        \ comparison with `Ш¹` is\nproved. For `e = 0` it consists of the everywhere unramified homomorphisms. Here\
        \ `ℓ` is a prime and\n`e, n ≥ 0`.\n\n* `New.exists_length_shaOdd_le`: for each `t ≥ 0` there is an integer\
        \ `X`, depending on `E`, `N` and\n  `t`, with `0 < X ≤ 2^(4T²⁷) h_E`. Here `T = N + t + 3` and `h_E` is\
        \ the class number of `E`. The\n  length of `New.Selmer.shaOdd` over `O` is at most `v_O(X)` for all `ℓ`,\
        \ `O`, `n` and all `e < t`.\n\nNo equality of characteristic ideals (the main conjecture of Mazur and Wiles)\
        \ is proved.\n\nProof outline: 1. `Voronoi`: `New.OddPart.exists_isStickelbergerBound` gives, for `e ≥ 1`,\
        \ an\ninteger `0 < X ≤ 2^((N+e+3)⁶)` satisfying `New.OddPart.IsStickelbergerBound N e X`. This is a\nbounded\
        \ divisibility of twisted Stickelberger sums.\n\n2. `Stickelberger`: `New.OddPart.exists_isJacobiFamily`\
        \ fixes a prime `p`, a place `B` above `p` and\n   any `c ∈ ℕ`. It builds a map `J` from `ℚ/ℤ` to units,\
        \ a variant of Jacobi sums. For `p ≡ 1 mod M`\n   and `Mx = 0`, `J(x)` is a unit at places not above `p`.\
        \ It has absolute value one in every\n   complex embedding. Its order at `B` is `New.OddPart.floorDiff c\
        \ x`. It also satisfies Galois and\n   product relations.\n3. `Kolyvagin.DerivativeCocycles`: `New.OddPart.exists_isKolyvaginSystem`\
        \ builds\n   `cyc^(e+1)ψ`-cocycles `κ_S : G_ℚ → O/ℓⁿ`. Here `cyc` is the `ℓ`-adic cyclotomic character and\
        \ `ψ`\n   a Dirichlet character mod `N`. The sets `S` range over subsets of a finite set `P` of primes\n\
        \   `≡ 1 mod cNℓⁿ`, and `p ≡ 1 mod Nℓⁿ∏P`. For `q ∈ P ∖ S` and a place `A` above `q`, the value of\n   `κ_S`\
        \ at a Frobenius at `A` is a value of `κ_{S∪{q}}` on inertia at `A`.\n4. `Kolyvagin.ReciprocityComponentBounds`:\
        \ take `e ≥ 1` and `cycᵉψ` odd. Then `4X²` kills\n   `New.OddPart.component`, a set of cocycles `G_ℚ → O/ℓ^ν`\
        \ attached to `cycᵉψ`\n   (`New.OddPart.nsmul_component_eq_zero`, an analogue of Stickelberger's theorem).\
        \ If moreover\n   `ℓ > N + e + 3`, there are `v_ℓ(X) + 1` elements of `G_ℚ` with the following property:\
        \ a cocycle\n   in the component vanishing at all of them is zero\n   (`New.OddPart.exists_detecting_points_component`).\n\
        5. `OddSha`: for `e > 0`, the group is split by characters `ψ`, and step 4 gives an integer killing\n  \
        \ `New.Selmer.shaOdd`. A bounded number of suitable elements of `G_E` suffice to test whether a\n   cocycle\
        \ is zero. For small `ℓ` this uses ray classes, and for large `ℓ` it uses step 4. Together\n   these bound\
        \ the length. For `e = 0`, the class number `h_E` serves.\n\n## Main definitions and results\n\n* `New.OddPart.exists_detecting_points_cocycles`:\
        \ the detecting set and the bound on its size.\n* `New.OddPart.nsmul_shaOdd_eq_zero_of_isStickelbergerBound`:\
        \ an integer that kills\n  `New.Selmer.shaOdd` for e ≠ 0, at every prime l.\n* `New.OddPart.length_shaOdd_le_of_le_sq`,\
        \ `New.OddPart.length_shaOdd_le_of_sq_lt`: the bounds on\n  the length for small and for large primes l.\n\
        \nNotions from other files:\n* `Ω`: the fixed algebraic closure of ℚ; `Gal(Ω/E)` is its group of automorphisms\n\
        \  over `E`, the absolute Galois group of `E`.\n* `New.Selmer.tateTwist`: the rank-one representation O(−e),\
        \ the character cyc^{−e} with values in\n  O, as 1 × 1 matrices.\n* `New.conjGal`: the endomorphism g ↦\
        \ c g c of Gal(Ω / E), where c is `New.cmConj`, the complex\n  conjugation fixed in Gal(Ω / ℚ); a cocycle\
        \ z is odd if z (c g c) = -z g.\n\n## Relation to the literature\n\nFor large `l` a bound of this kind follows\
        \ from the Iwasawa main conjecture of Mazur and Wiles; only\nan upper bound for the length at finite level,\
        \ by an integer of explicit size, is proved here. One\nnon-zero integer serves at all primes, 2 included;\
        \ small primes are handled by a crude count of\ngenerators of the ray class group. Source: B. Mazur, A.\
        \ Wiles, Class fields of abelian extensions of\nQ, Invent. Math. 76 (1984); C. Greither, Ann. Inst. Fourier\
        \ 42 (1992), Thm 3.2.\n"
