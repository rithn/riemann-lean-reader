      text: "\n* `New.OddPart.exists_isStickelbergerBound`: such an X exists with X ≤ 2 ^ (N + e + 3) ^ 6, for\n\
        \  e ≥ 1.\n\nThe idea: the generalised Bernoulli numbers of all characters mod N, corrected where they vanish\
        \ for\nreasons of parity, are the eigenvalues of one integer matrix. Its determinant is nonzero\n(`New.OddPart.sum_mul_bernoulli_ne_zero`),\
        \ is divisible by each eigenvalue, and is bounded by\nthe Fourier series of the Bernoulli polynomial. Voronoi's\
        \ congruence\n(`New.OddPart.voronoi_congruence_bernoulli`) links the Bernoulli numbers to the Stickelberger\
        \ sums;\nit rests on a congruence for power sums along an arithmetic progression\n(`New.OddPart.exists_sq_dvd_factorial_mul_sum_pow_sub`).\n\
        \n## Relation to the literature\n\nKnown result: Voronoi's congruence for twisted power sums and the trivial\
        \ zeros of Dirichlet\nL-functions. Here the congruence is twisted by a possibly imprimitive character and\
        \ stated for power\nsums. One non-zero integer with an explicit size bound has the following property. For\
        \ c ≡ 1 mod N,\n(c ^ (e + 1) - 1) X is congruent, modulo every m prime to c, to 2 w times the twisted Stickelberger\n\
        sum, where w does not depend on m. This holds for every character ψ with ψ(-1) = -(-1) ^ e and\nvalues in\
        \ a domain of characteristic 0. In addition, for every prime l, some c ≡ 1 mod N prime to l\nhas (c ^ e\
        \ - 1) (c ^ (e + 1) - 1) ∣ X. Source: K. Ireland, M. Rosen, A Classical Introduction to\nModern Number Theory,\
        \ 2nd ed. 1990; for the untwisted statement also M. Eberl, Kummer's congruence,\nArchive of Formal Proofs\
        \ 2024.\n"
    standaloneReview:
      verdict: clear
      reason: States the controlled integer required for the Stickelberger bound.
