      endOffset: 1106
      text: 'The file studies cocycles on `Gal(Ω/ℚ)`, with `Ω` an algebraic closure of ℚ. Here

        `New.cyclotomicPowDirichlet l e ψ` is `cyc^e ψ` with `cyc` the `l`-adic cyclotomic character. The

        module `New.OddPart.component l e ψ ν` consists of the cocycles for `(cyc^e ψ)⁻¹` with values in

        `O / l^ν`, where `O` (`PadicIntegerRing O l`) is the integer ring of a finite extension of ℚ_l, that

        satisfy three conditions. They are unramified off `l` over ℚ(μ_N), split at `l` over ℚ(μ_{N l^∞})

        and zero at `New.cmConj`, a complex conjugation. Reciprocity laws at primes `q ≡ 1` relate the value

        of one cocycle at a Frobenius element to the ramification of another. Using these laws and

        Chebotarev''s theorem, the file bounds these components in two ways. One bound is an annihilation

        result analogous to Stickelberger''s theorem. The other uses Kolyvagin''s descent with the Euler

        system of Gauss sums.'
    remainder:
      path: grh/src/Lib/Cyclotomic/Kolyvagin/ReciprocityComponentBounds.lean
      line: 17
      endLine: 52
      startOffset: 1106
      endOffset: 3417
      text: "\n\n## Main definitions and results\n\n* `New.OddPart.artin_reciprocity_of_mem_component`: Artin reciprocity\
        \ over ℚ(μ_{N m}), where the\n  prime q ≡ 1 splits completely, pairs a cocycle `x` with a number `y`; only\
        \ the places above q\n  contribute.\n* `New.OddPart.reciprocity_mod_ell`: the same law modulo `l` for a\
        \ cocycle κ for cyc^(e+1) ψ; if\n  `2 (a ^ e - 1) x φ ≠ 0`, then κ vanishes on the inertia group of `B`.\n\
        * `New.OddPart.nsmul_component_eq_zero`: if `X` has the Stickelberger property\n  (`New.OddPart.IsStickelbergerBound\
        \ N e X`), `cyc^e ψ` is odd and `e ≠ 0`, then `4 X²` kills\n  `New.OddPart.component l e ψ ν` (an analogue\
        \ of Stickelberger's theorem).\n* `New.OddPart.exists_detecting_points_component`: for large `l`, a cocycle\
        \ in\n  `New.OddPart.component l e ψ ν` is determined by its values at `v_l(X) + 1` elements (Kolyvagin's\n\
        \  descent with the Euler system of Gauss sums).\n\nNotions from other files:\n* `New.cyclotomicPowDirichlet\
        \ l e ψ`: the character `cyc^e ψ` of `Gal(Ω/ℚ)` with values in `Oˣ`; the\n  Dirichlet character `ψ` is read\
        \ through the action on the `N`-th roots of unity.\n* `New.OddPart.vanishingCocycles χ M s`: the `O`-module\
        \ of locally constant maps `x : Gal(Ω/ℚ) → M`\n  with `x (g h) = x g + χ(g) x h` (cocycles for `χ`) that\
        \ vanish on `s`.\n* `New.IsFrob A q σ`: `σ` stabilises the place `A` and `σ • x ≡ x ^ q` modulo its maximal\
        \ ideal for\n  all `x ∈ A`.\n* `New.ordRat K A`: the order `Ωˣ → ℚ` at the place `A`, normalised to be `1`\
        \ on uniformisers of\n  `K`. `New.cyclotomicCharMod Ω n` gives the action on the `n`-th roots of unity,\
        \ in `(ℤ/n)ˣ`.\n\n## Relation to the literature\n\nKnown result: Stickelberger annihilation and the Kolyvagin–Rubin\
        \ bound for odd twisted components.\nHere the value is taken at a negative integer instead of at zero, and\
        \ for an integer X whose\nmultiples (a^(e+1) − 1) X, for a ≡ 1 mod N, are congruent modulo each m prime\
        \ to a to 2w times the\nStickelberger sum at level N m, and which for each prime ℓ is divisible by (a^e\
        \ − 1)(a^(e+1) − 1)\nfor some such a prime to ℓ, 4X² kills the odd component at every prime. For large primes\
        \ ℓ, at most\nv_ℓ(X)+1 Galois elements detect its classes. Source: J. Coates, W. Sinnott, An analogue of\n\
        Stickelberger's theorem for the higher K-groups, Invent. Math. 24 (1974); K. Rubin, Euler Systems,\n2000,\
        \ III.4, Thm 4.6.\n"
