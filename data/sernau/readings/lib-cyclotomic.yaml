        \ c`. `galUnitsRep σ` is the action of `σ ∈ Gal(Ω/ℚ)` on it.\n* `ClosurePlace`: a valuation subring `B`\
        \ of `Ω`; it lies above `p` when `B.valuation p < 1`, and\n  `centrePrime Ω B` is the prime ideal of `\U0001D4DE\
        \ Ω` that it defines; `principalUnits B` is the subgroup\n  of `DiscreteUnits Ω` of the `u` with `B.valuation\
        \ (u - 1) < 1`, that is `u ≡ 1` at `B`.\n* `ordRat ℚ B u`: the order of `u` at `B`, normalised so that a\
        \ prime `p` below `B` has order one.\n* `cyclotomicCharMod Ω N σ`: the cyclotomic character of `σ` modulo\
        \ `N`, the unit `a` with\n  `σ ζ = ζ ^ a` for every `N`-th root of unity `ζ`.\n* `New.QZ`: the group `ℚ/ℤ`;\
        \ `New.QZ.fracRep x = ⟨x⟩` is the representative in `[0, 1)`, and\n  `New.QZ.ofZMod r b = b / r`.\n\n##\
        \ Relation to the literature\n\nKnown result: Stickelberger's factorisation of Gauss sums and the Davenport–Hasse\
        \ product relation.\nHere only prime fields are treated, and characters are named by the valuation of their\
        \ Gauss sum.\nThe product relation is proved for Jacobi-type quotients of Gauss sums and only up to a root\
        \ of\nunity. Source: L. Washington, Introduction to Cyclotomic Fields, 2nd ed. 1997, 6.2 and Thm 15.1; for\n\
        the product relation, H. Davenport, H. Hasse, J. reine angew. Math. 172 (1935).\n"
