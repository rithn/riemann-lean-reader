      line: 6
      endLine: 11
      text: 'This part shows that the twist of a Dirichlet character by the Legendre symbol of an odd prime not

        dividing the modulus is not principal. It defines `New.IsPolar`, the condition that a Laplace-type

        transform of an error term continues meromorphically with at most simple poles in the right

        half-plane. It also expresses `∑ χ(n) Λ(n) n^{-s}` through the logarithmic derivative of

        `New.entireL χ` and identifies the residues of that logarithmic derivative with the orders of the

        zeros of `New.entireL χ`.

        '
    remainder:
      path: grh/src/Lib/Analytic/EntireLFunction.lean
      line: 12
      endLine: 31
      text: "\n## Main definitions and results\n\n* `New.quadTwist_ne_one`: the twist of a character modulo `N`\
        \ by the Legendre symbol `(·/d)`, for an\n  odd prime `d` prime to `N`, is not principal.\n* `New.IsPolar`:\
        \ `E` is measurable, `|E v| ≤ C e^v` for `v ≥ 0`, and `∫₀^∞ E(v) e^{(1-s)v} dv`\n  continues to a meromorphic\
        \ function of `s` with at most simple poles of residue `r ρ` in\n  `re ρ > 0`.\n* `New.LSeriesHasSum_mul_vonMangoldt`:\
        \ `∑ χ(n) Λ(n) n^{-s}` in terms of the logarithmic derivative\n  of `New.entireL χ`.\n* `New.tendsto_sub_mul_logDeriv_entireL_analyticOrderNatAt`:\
        \ the residues of that logarithmic\n  derivative are the orders of the zeros of `New.entireL χ`.\n\nNotions\
        \ from other files:\n* `New.entireL`: The entire function equal to L(s, χ) if χ is not principal, and to\
        \ the continuation\n  of (s − 1)L(s, χ) if χ is principal.\n\n## Relation to the literature\n\nKnown; see\
        \ `Lib.Analytic.Landau` for sources.\n"
