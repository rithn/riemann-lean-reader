        \ of `|θ_χ(u)| du / u` over `u < q ^ (-1/2)` equals that over `u > q ^ (-1/2)`. The\n   truncated transform\
        \ `\U0001D4DC` of `θ_{μχ}` (`mollifier`) approximates `Γ_j / L` on `re s = 2`.\n2. For large `T` a zero\
        \ in the box forces `J(χ, T) > T ^ (2 δ)`\n   (`eventually_rpow_lt_thetaTailIntegral`). Otherwise `Γ_j L\
        \ \U0001D4DC - Γ_j²` is `≪ T ^ (4 δ)` on\n   `re s = 1/2` and `≪ 1 / T` on `re s = 2`, so it is small at\
        \ the zero by the three-lines theorem,\n   while it equals `-Γ_j²` there.\n3. In the mean over `v ≤ T²`\
        \ the theta series with coefficients `αₙ (-v/n°)`, where `n°` is the odd\n   part of `n`, are small (`sum_sq_thetaSeries_jacobiSym_le`):\
        \ expand the square, bound the pairs\n   with `(n n')°` a square trivially and the others by Pólya–Vinogradov.\
        \ So the sum of the `J` is\n   `≪ T ^ (2 + δ)`.\n4. By reciprocity `(n/d) = (-d/n°)`, so 2 and 3 give the\
        \ count, with `T² = N X`, after passing from\n   `ξ` to the primitive character that induces it.\n5. If\
        \ all primes of an invertible class were bad, the sum of `log p / p` over the class would\n   converge;\
        \ it diverges, so some prime of the class is not bad\n   (`exists_entireL_quadTwist_ne_zero`).\n\nNotions\
        \ from other files:\n* `gaussianMonomial j` is the weight `w(z) = z ^ j e^(-π z²)` of parity `j`, and `gaussianMellin\
        \ j`\n  is its Mellin transform `Γ_j(s) = ∫_0^∞ w(z) z ^ s dz / z`.\n* `thetaSeries j c u` is `θ_c(u) =\
        \ u ^ (1/2) ∑_{n ≥ 1} c(n) w(n u)`.\n* `quadTwist χ d` is the character `χ (·/d)` modulo `N d`, for `χ`\
        \ modulo `N` and a prime `d`.\n\n## Relation to the literature\n\nKnown result: zero density for quadratic\
        \ twists by mean values over real characters. Sources:\nJutila, On mean values of Dirichlet polynomials\
        \ with real characters, Acta Arith. 27 (1975);\nHeath-Brown, A mean value estimate for real character sums,\
        \ Acta Arith. 72 (1995). Form here: a weak\ndensity bound for the twists of the characters of a fixed modulus,\
        \ by a smoothed mean square of\nJacobi symbol sums.\n"
