      endLine: 9
      text: 'This part proves Landau''s lemma: the moment generating function of a measure is not analytic at

        its abscissa of convergence. It applies the lemma to transforms satisfying `New.IsPolar`. Assume

        a one-sided bound on the error term `E`, and assume that the residues `r x` at real `x > β` have

        non-negative real part. Then the part concludes that there is no pole to the right of `β`.

        '
    remainder:
      path: grh/src/Lib/Analytic/Landau.lean
      line: 10
      endLine: 30
      text: "Together with `Lib.Analytic.EntireLFunction`, these are the analytic tools for passing from a\none-sided\
        \ bound on an error term to the absence of zeros of L-functions.\n\n## Main definitions and results\n\n\
        * `New.exists_Ioi_subset_integrableExpSet_of_analyticAt`: Landau's lemma; the Laplace transform of\n  a\
        \ measure is not analytic at its abscissa of convergence.\n* `New.IsPolar.landau`: let `β > 0`. If `E v\
        \ ≤ e^{(β-1)v}` for all large `v` and `re (r x) ≥ 0`\n  for real `x > β`, then `r ρ = 0` for `re ρ > β`.\n\
        \nNotions from other files:\n* `New.IsPolar` (from `Lib.Analytic.EntireLFunction`): `E` is measurable, `|E\
        \ v| ≤ C e^v` for\n  `v ≥ 0`, and `∫₀^∞ E(v) e^{(1-s)v} dv` continues meromorphically with at most simple\
        \ poles of\n  residue `r ρ` in `re ρ > 0`.\n\n## Relation to the literature\n\nKnown result: Landau's lemma\
        \ on Dirichlet integrals of one sign. It is applied to transforms with\nsimple poles whose residues at real\
        \ points have non-negative real part: no pole lies to the right\nof the abscissa given by the one-sided\
        \ bound. Source: Montgomery and Vaughan, Multiplicative\nNumber Theory I, 2007, Lemma 15.1 (Widder, The\
        \ Laplace Transform, 1941, II Thm 5b).\n"
