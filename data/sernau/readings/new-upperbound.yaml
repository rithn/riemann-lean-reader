      endLine: 14
      text: "Let `l` be a place of a marked set `Λ` above a prime `p`. This file carries the theorem on\nelementary\
        \ divisors, `New.FrobeniusCycle.elementary_divisors`, for the edge Hecke operator over\nto the normalised\
        \ Hecke operator `New.Data.IsMarked.scaledHeckeOperator` at `l`. It assumes a\nFrobenius cycle that matches\
        \ the places above `l`. The proof identifies the two operators in\nfour steps:\n* The edges: the cosets\
        \ of the Hecke operator at `l` are indexed by edges. An edge is determined\n  by its origin and its basis\
        \ change there, because the rational points act freely on the cosets\n  of the level (`New.Columns.HeckeEdges.eq_of_origin_eq_of_mem_parahoric`).\n"
    remainder:
      path: grh/src/New/UpperBound/Divisibility/HeckeEdges.lean
      line: 15
      endLine: 44
      text: "* The variables: at an a-place that induces `l` or its conjugate, an edge acts by letter matrices\n\
        \  and powers of `p` (`New.Columns.kroneckerPi_symPowMatrix_eq_letterRep`).\n* The weight space splits into\
        \ monomials at these a-places and a factor on which the edges act\n  integrally (`New.Columns.exists_weylIndex_equiv`,\
        \ `New.Columns.exists_schur_eq_map`).\n* The module: integral source forms are families of integral vectors\
        \ indexed by the classes\n  (`New.Columns.range_sourceFormOfValues`).\n\n## Main definitions and results\n\
        \n* `New.Columns.isOntoUpToColength_scaledHeckeOperator_of_frobeniusCycle`: given a Frobenius cycle\n  that\
        \ matches the places above `l`, the operator is an edge Hecke operator, so the bound of the\n  theorem holds\
        \ for it.\n* `New.Columns.HeckeEdges.heckeSplit_apply_rep`: The Hecke operator as a sum over edges.\n\n\
        Notions from other files:\n* `New.IsOntoUpToColength`: The endomorphism `y` keeps `M`, and for some natural\
        \ number `i ≤ c` the\n  sum `y (M) + p ^ j₀ • M` has index dividing `p ^ i` in `M` (in the sense of `New.ColengthDvd`):\n\
        \  `y` is onto on `M` modulo `p ^ j₀` up to an index `p ^ i`.\n* `New.Data.IsMarked`: a marked set `Λ` of\
        \ primes of `E` is disjoint from its complex conjugate,\n  each of its primes is induced by an a-place (an\
        \ element of `D.aPlaces`), `p` is exceptional\n  (`New.Data.IsExceptional`), and `p` is below `D.x₁` and\
        \ not split in the imaginary quadratic\n  field.\n* `New.Data.integralSourceForms`: the module of the elements\
        \ of `D.SourceForm` of gauge at most `1`.\n* `New.FrobeniusCycle`: ring maps `ι s : W → R` for `s` in `ℤ/N`,\
        \ alternately even and odd, with\n  `ι (s + 1) ≡ ι s ^ P` modulo `p`, where `P = p ^ frobExp` and the residue\
        \ field of `W` has\n  `P ^ N` elements.\n\n## Relation to the literature\n\nSee `New.UpperBound.Divisibility.MarkOperator`\
        \ for related work.\n"
