      text: "This file shows which monomials can carry the least w-adic order plus weight among all translates\n\
        of a polynomial.\n\n* `New.stepanov_count`: Stepanov's count of zeros at the residue classes of a local\
        \ ring.\n* `New.IsRealFiltration`, `New.adicFiltration`, `New.gaussFiltration`: multiplicative filtrations\n\
        \  indexed by ℝ, the w-adic one, and the Gauss filtration on polynomials with weighted variables.\n* `New.FrobeniusCycle.RootAt`:\
        \ a root and a letter, with the variables X_s, Y_s, the substitution\n  that defines the auxiliary polynomial,\
        \ and its expansions at the rational points.\n* `New.FrobeniusCycle.defect_nonpos_of_extreme_term`: for\
        \ weights that rise by an amount in [1/2, 1]\n  from X_s to Y_s, a term of least order plus weight among\
        \ all translates by SL₂(W) has defect at\n  most 0 (see `New.FrobeniusCycle.defectWeight`).\n\nThe proof\
        \ compares the degree of an auxiliary binary form with its zeros at the q + 1 rational\npoints of the projective\
        \ line, in the affine coordinate t. For an extreme term it writes the defect\nin the two variables X_s,\
        \ Y_s of each letter, substitutes polynomials in t for them, and expands one\ncoefficient at infinity (which\
        \ gives its degree) and at the q finite points.\n\nNotions from other files:\n* `New.FrobeniusCycle.polyAction`:\
        \ the action of GL_k(W) on polynomials in the variables x_{b,s}; g\n  sends x_{b,s} to ∑_c (g_s)_{cb} x_{c,s},\
        \ where g_s is ι_s(g) for even letters s and ι_s of the\n  inverse transpose of g for odd s.\n* `New.levi`:\
        \ the Levi subgroup of a labelling τ of the indices, the matrices in GL_k(W) whose (i,j)\n  entry vanishes\
        \ whenever τ(i) ≠ τ(j).\n* `New.FrobeniusCycle.rootVar`: for indices a, a' and a letter s, the variable\
        \ (a',s) if s is even\n  and (a,s) if s is odd.\n* `New.FrobeniusCycle.defectWeight`: at a letter i along\
        \ a root (a, a'), the weight of x_{b,s} is a\n  signed multiple of P^((s - i) mod N) / (q - 1) at the variables\
        \ X_s, Y_s and 0 elsewhere, plus 1\n  at Y_i; the sum of these weights over a monomial is its defect.\n\n\
        ## Notation\n\nAfter the substitution the variable Y_s, s ≠ i, is kept by `mainSubst` as the variable\n\
        `X (D.varY s)` of the letter s. The functions `RootAt.sign` and `RootAt.moveSign` carry the signs.\n\n##\
        \ Relation to the literature\n\nThe group SL₂(W), placed in two rows and columns of GL_k(W), acts on polynomials\
        \ in a circle of\nvariable sets, alternately by Frobenius twists and by inverse transposes, and a term that\
        \ is least\nfor valuation plus a suitable weight among all translates has exponents obeying linear inequalities.\n\
        Other files use them to bound the elementary divisors of the Hecke operator. Twisted Dickson forms\non Frobenius\
        \ twists of symmetric powers, weight inequalities via the Lang map, and the count of\nzeros against degree\
        \ are known in the literature. Related work: Ghate–Jana, Modular representations\nof GL2(F_q) using calculus,\
        \ 2025; Imai–Koskivirta, Automorphic vector bundles on the stack of\nG-zips, 2021; Bombieri, Counting points\
        \ on curves over finite fields, Sém. Bourbaki 430, 1973.\n"
