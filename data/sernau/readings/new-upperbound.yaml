      line: 6
      endLine: 11
      text: 'A chain datum `Ψ` has a plain tensor `φ♭` and a glued tensor `Glue φ♭`, and the latter is jointly

        invariant. Expanding the gluing writes `Glue φ♭` as a double sum of translates of the vacuum

        (`IsChainDatum.gluedTensor_eq_sum_translates`), and collecting its terms gives a weak chain datum

        (`IsChainDatum.exists_isWeakChainDatum_compositeLift_eq`); this serves for sums of norms and for the

        primes `p ≠ N`. The projection on vacua above `N` takes `Glue φ♭` to `φ♭`, so `φ♭` is jointly

        invariant too (`IsChainDatum.isWeakChainDatum`); this serves for `p = N`.

        '
    remainder:
      path: grh/src/New/UpperBound/Divisibility/ChainDatumExpansion.lean
      line: 12
      endLine: 35
      text: "\nNotions from other files:\n* `D : Data P`: a CM field `E` with `f` infinite places, spaces `X_0,\
        \ …, X_m` over it in a chain of\n  `m` theta lifts, `X_j` of rank `n_j`, and a prime level `N = π π̄` with\
        \ `π = D.piN`.\n* `D.piNPlaces`: the places `w ∣ π`.\n* `D.X j = D.InitIndex j ⊕ Unit`: the basis indices\
        \ of `X_j`; the last one is the `Unit` summand.\n* A tuple of translations `t`: a finite adelic matrix `t\
        \ j` for each `j`, with rows indexed by\n  `X_{j+1}` and columns by `X_j`. It is admissible for `q` if each\
        \ `t j`, times the conjugate of\n  `D.piM`, is integral at the places prime to `q`.\n* `D.translateDatum\
        \ t j`: the integral vacuum of `Hom(X_j, X_{j+1})` translated by the matrix `t j`.\n* `D.gluedDoubleLiftDatum\
        \ v i`: the gluing, the sum over `y` modulo `N` of the translates of\n  `v (2 i) ⊗ v (2 i + 1)` by the last\
        \ column `-y / N` and the last row `-ȳ / N`.\n* `plainTensor Ψ`, `gluedTensor Ψ`: the tensors `φ♭ = ∑ x,\
        \ Ψ x • ⊗ⱼ translateDatum x j` and\n  `Glue φ♭`.\n* `IsAdmissibleCombination v A q d p B z`: `z = ∑ x, r\
        \ x • v x` with `r` supported in `A`, each\n  `d * r x` integral away from `q` and, if `p` holds, all conjugates\
        \ of `r` of `ℓ¹`-norm at most\n  `B`.\n* `IsChainDatum ϑ Ψ`, `IsWeakChainDatum ϑ Ψ`: admissible coefficients\
        \ whose glued, respectively\n  plain, tensor is jointly invariant under the levels `D.levelX j`; the conditions\
        \ on support and\n  sum of norms are weaker for a weak chain datum.\n\n## Relation to the literature\n\n\
        See `New.UpperBound.Divisibility.LocalDivisibility` for related work.\n"
