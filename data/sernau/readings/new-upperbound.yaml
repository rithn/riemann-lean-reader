        \ (odd), both on polynomials and on coefficient vectors of\n  forms of degree `n` in each letter. `New.FrobeniusCycle.polyAction_polyOfCoeffs`\
        \ says that the two\n  actions agree.\n* `New.FrobeniusCycle.depth`, `New.FrobeniusCycle.defectWeight`:\
