      endLine: 32
      text: "\n## Main definitions and results\n\n* `New.Rows.modKernelStdSpace_embFin_mul`: moving the points by\
        \ rational elements substitutes the\n  variables of `Q` (`New.Rows.twoSidedSubst`) and multiplies by determinants.\n\
        * `New.Rows.IsModKernelScale`, `New.Rows.exists_ne_zero_isModKernelScale`: after one\n  normalising constant,\
        \ kernels with `p`-integral input are `p`-integral and, under bounds on the\n  sizes of the input, their\
        \ conjugates are bounded.\n\nNotions from other files:\n* `New.stdSpace`: the definite space `I_n`, the\
        \ sum of `n` norms with its standard lattice.\n* `New.Gf`, `New.integralAbove`: the finite adelic unitary\
