      text: 'An automorphism `σ` of `ℂ` over `K = ℚ(√-d)` acts on the jets of theta functions. This action is

        realized as a `σ`-semilinear map `L` on `𝒮 V`, whose laws hold on `V.finitePart`. We then prove

        archimedean bounds for the conjugates of the jets of admissible combinations of the operators

        `New.Space.finHeisenbergOp` applied to the integral vacuum, moved by finite points of a pair of

        groups.

        '
    remainder:
      path: grh/src/New/UpperBound/Kernels/JetConjugatesAndBounds.lean
      line: 15
      endLine: 52
      text: "\n## Main definitions and results\n\n* `New.Parameters.exists_isJetConjugation`: existence of `L`;\n\
        \  `New.Parameters.IsJetConjugation.exists_map_schrodingerOp`: its action on the vacuum `vacElem` and\n\
        \  on the data `Ψ ⊗ vacElem` for Schwartz–Bruhat functions `Ψ`;\n  `New.Parameters.IsJetConjugation.norm_map_intVacuum_le`:\
        \ a bound, with constant `P.constantBound`,\n  for the images of the translates of `ω g (intVacuum V)`;\
        \ it rests on\n  `New.Parameters.norm_omega_vac_le`.\n* `New.Parameters.norm_jet_le_of_isVacuumCombination`\
        \ and\n  `New.Parameters.sqrt_weylNormSq_schurJet_le_of_isVacuumCombination`: archimedean bounds for the\n\
        \  conjugates by `σ ∈ Aut ℂ` of the jets, and for their Schur matrices;\n  `New.Parameters.isVacuumCombination_of_isAdmissibleCombination`\
        \ makes them apply to admissible\n  combinations.\n\nNotions from other files:\n* `New.Parameters.E`: The\
        \ field `P.E s = K(ζ)`, for a primitive root of unity `ζ` of order\n  `P.q₁ s`; `P.Φ s` is the set of its\
        \ infinite places, a group isomorphic to `Gal(E/K)`.\n* `New.Parameters.jetScale`: A nonzero complex number,\
        \ the period factor times the area scale over\n  the period `Ω₀`, at which Taylor series of theta functions\
        \ are scaled.\n* `New.Parameters.bigOmega`: The real number Ω = exp(γ − Re L′/L(1, χ_K))·2π/rd_E, with γ\
        \ Euler's\n  constant and rd_E the root discriminant of E.\n* `New.Parameters.intVacuum`: The vacuum of\
        \ rank n multiplied by the n-th power of a fixed number\n  that makes its values at finite vectors integral.\n\
        * `New.Space`: a hermitian space with a point, given by a matrix J over E and x in GL_n(\U0001D538) with\
