        \ k` and a letter `s : ZMod N`.\n\n## Main definitions and results\n\n* `New.FrobeniusCycle`: a prime number\
        \ `p` with a square root `sqrtPrime` in `R`, a power `P` of\n  `p`, and ring maps `embedding s : W → R`,\
        \ each marked even or odd, and each the `P`-th power of\n  the one before modulo `p`.\n"
