      line: 17
      endLine: 35
      text: "\n## Main definitions and results\n\n* `New.chain`: the composite of the first `j` lifts. It is equivariant\
        \ (`New.chain_equivariant`),\n  and its values are linear in the pure tensor of the data\n  (`New.exists_linearMap_chain_eq_apply_pure`).\n\
        * `New.IsJointlyInvariant.sum_chain_mem_nsmul`: at free levels, a jointly invariant combination of\n  chains\
        \ is a sum with one term for each tuple of double cosets, with no denominators.\n* `New.Data.principalLevel_le_chosenLevel`,\
        \ `New.Data.classAut_eq_bot_of_le_chosenLevel`: in bounded\n  rank, levels that reduce to `1` at the chosen\
        \ places are free.\n* `New.Data.card_classAut_dvd_chosenGroupOrder`: in rank at most `2 * D.n D.m` and for\
        \ every\n  integral level the stabilisers have order dividing `chosenGroupOrder`.\n\nNotions from other\
        \ files:\n* `New.TensorChain`: The complex tensor product S_{j−1} ⊗ ⋯ ⊗ S_0, equal to ℂ for j = 0.\n* `New.classAut`:\
        \ `classAut Γ K g` is Γ ∩ gKg⁻¹, the stabiliser in Γ of the coset gK; here\n  Γ = `stdRatPoints` is the\
        \ rational unitary group of the standard definite space `New.stdSpace`,\n  inside the finite adelic group.\n\
        * `New.Data.n`: The rank \U0001D5C7_j = k + j(t + 1) of X_j.\n"
