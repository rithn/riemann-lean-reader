        \ `New.Data.weylNormSq_compositeLift_le`: the size bounds\n  for the restricted chain and for the composite\
        \ lift.\n* `New.Data.lowerChain_goodProjTranslate_apply`: the lift of `|\U0001D5A6| e₀ s z` is a combination\
        \ of right\n  translates of the lift of `z`, with the coefficients of `|\U0001D5A6| e₀`.\n\nNotions from\
        \ other files:\n* `New.Data.jetSize`: The size `s_∞(j) = log j! + j log (M / Ω)` of a derivative of order\
        \ `j`.\n* `New.Data.restrictedChain`: For coefficients `Ψ` on translations of the integral vacuum, the\n\
        \  combination of the chains of `m` lifts of these translates, restricted to `Y_m`. `Ψ` is a weak\n  chain\
        \ datum (`New.Data.IsWeakChainDatum`) if the combined tensor is invariant and the coefficients\n  are admissible.\n\
        * `New.Data.gain`: The divisibility at a prime `p` that is asked of the chain.\n* `New.LevelPlaces.LevelForm.integralForms`:\
