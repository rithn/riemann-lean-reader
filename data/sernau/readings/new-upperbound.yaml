    excerpt:
      path: grh/src/New/UpperBound/Divisibility/ChainValuation.lean
      line: 7
      endLine: 12
      text: 'This file proves that the value of a chain of theta lifts is a sum over classes. It deduces a

        general p-adic gauge bound for the chain. It then gives gauge and norm bounds for the restriction

        `New.Data.restrictToY` to `Y_m`, and describes the values of source forms. `New.weylGauge` is the

        gauge of a vector at a finite point `g`: a maximum of p-adic absolute values read through the

        embedding ι of `[PadicPlace p]`. `New.GaugeLe d c φ` says that `φ g` has gauge at most `c` at

        `g * d` for all `g`.

        '
    remainder:
      path: grh/src/New/UpperBound/Divisibility/ChainValuation.lean
      line: 13
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.Data.chainCombination_eq_sum`: take a chain that is jointly\
        \ invariant for the kernels\n  `D.liftKernel ϑ`. Its value at `g D.m` is a sum over tuples of classes for\
        \ the levels\n  `D.levelX j`, `j < D.m`, and over the tuples x in the support of Ψ. The terms are the kernel\n\
        \  products times Ψ x.\n* `New.Data.IsWeakChainDatum.gaugeLe_chain`: let `Ψ` be a weak chain datum for the\
        \ twist `ϑ`, and\n  let the places of `ϑ` have norm prime to `p`. Suppose every datum of the chain, changed\
        \ by an\n  operator `t j` that commutes with the levels, multiplies gauges by at most `p ^ r j` from the\
        \ base\n  point `d j` to `d (j + 1)`. Then the `Ψ`-combination of the chains sends a source form of gauge\
        \ at\n  most 1 at `d 0` to a form of gauge at most `p ^ ∑ r j` at `d D.m`.\n\nThroughout, `D : Data P` fixes\
        \ a CM field `E = D.E`, primes `p₀`, `p₁`, `N = D.N`, an integer\n`π = D.piN` of `E` with `π π̄ = N`, and\
        \ a length `m = D.m`. The type `D.X j` indexes a basis of a\ndefinite hermitian space `X_j` over `E`, and\
        \ `Gf D.E (D.X j)` is the group of finite adelic points\nof its unitary group. Forms on `X_j` (`D.FormX\
        \ j`) are algebraic automorphic forms on this group.\nThe level of `X_j` is `D.levelX j`, the elements of\
        \ the integral subgroup `D.chosenLevel` whose last\nrow is `(0, …, 0, 1)` modulo `π`. Source forms are the\
        \ forms on `X_0` fixed by `D.levelX 0`.\n\nNotions from other files:\n* `New.Data.Twist`: A twist: a tame\
        \ character (`New.Data.TameChar`) whose tame part is non-trivial\n  at every place of its set Q.\n* `New.Data.Translations`:\
        \ Tuples (x_j) of finite adelic matrices with rows X_{j+1} and columns X_j,\n  the translations that define\
        \ the data of a chain.\n* `New.IsJointlyInvariant`: the tensor ∑_x L_x ⊗ Φ_{x,m−1} ⊗ ⋯ ⊗ Φ_{x,0} is unchanged\
        \ by the joint\n  action of the levels K_j, j < m.\n* `New.Data.translateDatum`: The j-th datum of the tuple\
        \ x: the normalised vacuum of Hom(X_j,\n  X_{j+1}) translated by the finite Heisenberg operator of x_j.\n\
        * `New.Data.piNPlaces`: the set of primes dividing `π`, where `π π̄ = N`.\n"
