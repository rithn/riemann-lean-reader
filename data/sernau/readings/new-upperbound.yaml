      text: "\nNotions from other files:\n* `Grading V N (X ⊕ Unit) s` splits the index set `ι` of the basis of\
        \ `V` into `X ⊕ Unit`, on\n  which the Gram matrix is `1`, and a string of `s` vectors, orthogonal to it\
        \ and with a fixed Gram\n  matrix that depends on `N`; `Y.inclXFin` is the resulting map on finite adelic\
