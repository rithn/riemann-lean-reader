      text: 'Let `l` be a place of a marked set `Λ` above a prime `p`, and write `o₀ = D.o₀ p`. This file

        applies the theorem on elementary divisors, `New.FrobeniusCycle.elementary_divisors`, to the

        normalised Hecke operator `New.Data.IsMarked.scaledHeckeOperator` at `l`, acting on the integral

        source forms `New.Data.integralSourceForms`. The a-places that induce `l` or its conjugate form one

        orbit under the place named by `-p ^ o₀` (`New.Data.exists_orbit_of_mem_aPlaces`), where the place

        named by an integer acts on infinite places by multiplication. This orbit gives a Frobenius cycle.

        '
    remainder:
      path: grh/src/New/UpperBound/Divisibility/MarkOperator.lean
      line: 12
      endLine: 40
      text: "\n## Main definitions and results\n\n* `New.Data.IsMarked.exists_frobeniusCycle`: such a Frobenius\
        \ cycle exists.\n* `New.Data.IsMarked.isOntoUpToColength_scaledHeckeOperator`: the operator keeps the integral\
        \ source\n  forms and is onto modulo `p ^ j₀` up to a bounded colength.\n\nNotions from other files:\n*\
        \ `New.IsOntoUpToColength`: The endomorphism `y` keeps `M`, and for some natural number `i ≤ c` the\n  sum\
        \ `y (M) + p ^ j₀ • M` has index dividing `p ^ i` in `M` (in the sense of `New.ColengthDvd`):\n  `y` is\
        \ onto on `M` modulo `p ^ j₀` up to an index `p ^ i`.\n* `New.Data.IsMarked`: a marked set `Λ` of primes\
        \ of `E` is disjoint from its complex conjugate,\n  each of its primes is induced by an a-place (an element\
        \ of `D.aPlaces`), `p` is exceptional\n  (`New.Data.IsExceptional`), and `p` is below `D.x₁` and not split\
        \ in the imaginary quadratic\n  field.\n* `New.Data.integralSourceForms`: the module of the elements of\
        \ `D.SourceForm` of gauge at most `1`.\n* `New.FrobeniusCycle`: ring maps `T.embedding i : W → R` for `i`\
        \ in `ℤ/N`, alternately even and\n  odd, with `T.embedding (i + 1) ≡ T.embedding i ^ P` modulo `p`, where\
        \ `P = p ^ frobExp` and the\n  residue field of `W` has `P ^ N` elements.\n\n## Relation to the literature\n\
        \nAn integrally scaled Hecke operator above p, acting on forms at a-places linked in a circle by\nFrobenius\
        \ and conjugation, has elementary divisors of small mean exponent outside a small share. So\nusing it once\
        \ per theta lift, to keep divisibility when the partner of an a-place is an a-place,\ncosts little colength.\
        \ Slopes of T_p of at most about k/(p+1) for GL(2) over Q and regular p, and\nintegral scalings of Hecke\
        \ operators, are known. Related work: Arsovski, Limiting measures of\nsupersingularities, 2019; Liu–Truong–Xiao–Zhao,\
        \ Slopes of modular forms and geometry of eigencurves,\n2023; Fakhruddin–Pilloni, Hecke operators and the\
        \ coherent cohomology of Shimura varieties, 2021.\n"
