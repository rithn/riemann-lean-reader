        \ by the basis tensors of\n  large weight.\n\nAll `k ^ 2` entries are variables; a monomial with an entry\
        \ outside the blocks has `ψ♯ = 0`.\nThe row weight of a monomial `α` is `∑ α (i, j) • ρ i`; the column weight\
        \ has `ρ j` in place of\n`ρ i`. The Schur algebra is built on the transpose of the matrix of variables,\
        \ so the row indices\nof a monomial are the column indices of `ψ♯`, and no transpose appears in the rule\
