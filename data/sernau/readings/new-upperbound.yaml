      endLine: 35
      text: "This file shows that a full mark exists and defines, with `A_\U0001D529` the number\n`New.Data.heckeScalingExponent`\
        \ of a prime `\U0001D529`, a scaled Hecke operator on the space\n`D.SourceForm` of source forms.\n\n## Main\
        \ definitions and results\n\n* `New.Data.IsFullMark`: a marked set that meets each pair of a prime induced\
        \ by an a-place and its\n  conjugate.\n* `New.Data.exists_isFullMark`: a full mark exists for every exceptional\
        \ `p < x₁`.\n* `New.Data.IsMarked.scaledHeckeOperator`: the operator `p ^ A_\U0001D529 • T_{\U0001D529,\U0001D52F\
        }` at a marked prime, on\n  the space of source forms.\n\nNotions from other files:\n* `New.Data.aPlaces`:\
        \ The `a`-places: the infinite places of `E` whose class in `(ℤ/q₁)ˣ` is `1`\n  modulo `q₀`.\n* `New.Data.IsExceptional`,\
        \ `New.Data.ceilLogLifts`: A condition on `p` alone: `(p/d) = -1`,\n  `p ≢ ±1` modulo `m`, and the order\
        \ `o₀` of `-p` modulo `q₀` is odd and at most `\U0001D52F`, the least\n  natural number with `m ≤ p^\U0001D52F\
        `.\n* `New.placeOfEmb`: The prime of `E` induced by an embedding `σ : E →+* F` into an ultrametric\n  normed\
        \ field over `ℚ_p`: the centre on the integers of `E` of the valuation ring\n  `{x : E | ‖σ x‖ ≤ 1}`.\n\
        * `New.Data.placeOfInt`: The infinite place of E named by the class of the integer ν modulo q₁ if ν\n  is\
