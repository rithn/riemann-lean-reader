      text: "Let `P` contain one place of each conjugate pair above the split prime `N` of the CM field `E`. A\n\
        marked lattice at `P` is a lattice `L` with a vector `ε` of `L / N L` that is non-zero at every\nplace.\
        \ Everything here is written in a basis of `L` whose last vector lifts `ε`, at all places of\n`P` at once:\n\
        * the stabiliser of `(L, ε)` is `mirabolic`, and `diagNInv` takes `L` to `L⁺ = L + \U0001D4AA ε / N`;\n\
        * the direct datum `1[S L ⊆ L', S ε = ε']` is `directDatum`; in bases of `L⁺` and `L'⁺` it is\n  `lastRowDatum`;\n\
        * the mirror datum `1[S L ⊆ L'⁺] ψ_N (u' (S ε))`, where `u'` is the linear form on `L'⁺` with kernel\n \
        \ `L'` and `u' (ε' / N) = 1`, is `mirrorDatum` in bases of `L` and `L'⁺`;\n* the operator `Up`, which replaces\
        \ `L` by `L⁺` and sums against `ψ_N` over the primitive vectors\n  with unit last entry, is `upOperator`."
    remainder:
      path: grh/src/New/UpperBound/Objects/LiftLawsModuloN.lean
      line: 17
      endLine: 33
      startOffset: 991
      endOffset: 2089
      text: "\n\nA `LiftLaw` records how a lift depends on its datum. On ramified vectors the following hold. A\n\
        mirror lift, moved by `diagNInv`, is `Up` after a direct lift, and `Up` moves through a direct lift\nup\
        \ to the factor `γ` of its law. A glued double lift is the number of primitive vectors times a\nmirror lift\
        \ after a direct lift; hence, moved by `diagNInv`, it is a scalar times two direct lifts\nafter `Up`. So\
        \ a chain of glued double lifts is a scalar times a chain of direct lifts after a power\nof `Up`.\n\nNotions\
