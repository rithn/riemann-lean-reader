      text: 'Fix a prime `p`. The divisibility bound of stage `j` at `p` measures the `p`-divisibility of a lift;

        it depends on a set `S` (also written `ev`) of places whose long rows are removed.


        This file defines it and bounds it from below by the gain at `p` when `p < x₁` is non-split.'
    remainder:
      path: grh/src/New/UpperBound/Divisibility/JetExponent.lean
      line: 10
      endLine: 28
      startOffset: 423
      endOffset: 1508
      text: " Apart\nfrom an error term, only collisions lose; a collision is a pair `(τ, e)` with `e ∈ I_p` (`e`\
        \ odd, or\n`p = d`) such that `τ` and `(-p ^ e) τ` are `a`-places outside `ev`. In `lowColumns` and `lowBoxes`\n\
        a column is a column of a diagram; they count the columns of height below `n_{j+1}` and different\nfrom\
        \ `1`, and the boxes in them.\n\n## Main definitions and results\n\n* `New.Data.divisibilityBound`: the\
        \ divisibility bound at `p` of stage `j`, for a set `S` of places.\n* `New.Data.le_divisibilityBound`: the\
        \ lower bound for the divisibility bound by the gain at `p`.\n\nNotions from other files:\n* `New.Data.aPlaces`:\
        \ The `a`-places: the infinite places of `E` whose class in `(ℤ/q₁)ˣ` is `1`\n  modulo `q₀`.\n* `New.Data.IsExceptional`,\
        \ `New.Data.ceilLogLifts`: A condition on `p` alone: `(p/d) = -1`,\n  `p ≢ ±1` modulo `m`, and the order\
        \ `o₀` of `-p` modulo `q₀` is odd and at most `\U0001D52F`, the least\n  natural number with `m ≤ p^\U0001D52F\
        `.\n* `New.Data.placeOfInt`: The infinite place of E named by the class of the integer ν modulo q₁ if ν\n\
        \  is prime to q₁, and the identity place otherwise.\n"
