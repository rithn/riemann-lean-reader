        \ of `Y'`, and over\n  that of `Y` against an equivariant function `W`. The result is an integral over the\
        \ unitary group\n  of `X`. Its integrand is `W` times a constant times a theta integral over the unitary\
        \ group of\n  `X'`. The theta integral is of the datum translated by `New.Seesaw.stackedStringMap` and cut\
        \ down\n  along `New.Seesaw.DoubleLiftData.splitting`.\n* `New.Data.unfoldStage`: the function `\U0001D4B2\
