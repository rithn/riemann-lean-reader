      endLine: 15
      text: 'On the definite space `Y_m`, the integral of a matrix coefficient of a form on `X_m` against a form

        on `Y_m` is a multiple of the inner product with the restricted form. To prove the seesaw identity,

        we pair `Θ_ξ 𝒫 φ` with a form on `Y_m` and move the Bessel period up the lower chain, one lift at a

        time. Each outer integral is a real integral times a weighted sum over the classes `Ω_j`. What

        remains is the upper chain for the tensor `φ_ξ`, a multiple of which is the glued tensor of a chain

        datum.

        '
    remainder:
      path: grh/src/New/UpperBound/Seesaw/SeesawIdentity.lean
      line: 16
      endLine: 50
      text: "\nNotions from other files:\n* `D.spaceY j`, `D.FormY j`: the space `Y_j` of the lower chain and the\
        \ forms on its unitary group.\n* `liftY ϑ j`, `lowerChainUpTo ϑ j`: the theta lift from `Y_j` to `Y_(j+1)`\
        \ with twist `ϑ`,\n  normalised by the index of its level, and the composite of the first `j` lifts.\n*\
        \ `D.poincareAt g t`: the Poincaré map `\U0001D4AB` from forms on `X_0` to forms on `Y_0`.\n* `Grading`,\
        \ `unfoldStage`: a grading of a space, with its Bessel group `R`, and the function `\U0001D4B2`\n  that\
        \ is left after some steps of unfolding.\n* `cutPoints ϑ j`, `cutSum`: the classes `Ω_j` of the finite variables\
        \ and the weighted sum over\n  them.\n\nIn the notation of the comments the subscript `ξ` of `Θ_ξ`, `J_ξ`\
        \ and `φ_ξ` stands for the twist\n`ϑ`: `Θ_ξ = lowerChainUpTo ϑ`, `J_ξ(Y_j) = levelY ϑ j`. A `ξ` by itself\
        \ is the tuple of real parts\nof the outer variables. The lattice stabiliser `stdLevel` is written `J°`,\
        \ and the index\n`stdLevelIndex J` is `[J° : J]`. A tame character `ϑ` is an automorphic character of `U(1)`\
        \ of\nweight `0` with a finite set `ϑ.Q` of places (its modulus) outside which its tame part is trivial;\n\
        it is a twist if the tame part is nontrivial at every place of `ϑ.Q`. The chosen places, those\ndividing\
        \ `D.piM`, are fixed by the data `D` and do not depend on `ϑ`.\n\n## Relation to the literature\n\nFor ramified\
        \ source forms φ and every twist, the restricted definite chain of lifts of φ, with data\nof controlled\
        \ support and denominators, is a non-zero constant, free of φ and the twist, times the\nindefinite chain\
        \ of lifts of the Poincaré series of φ. The transfer of a Bessel or Fourier–Jacobi\nperiod under one theta\
        \ lift is known, locally and globally. Related work: B. Wang, Global theta\nlifting and periods associated\
        \ to nilpotent orbits, 2025; Gomez–Zhu, Local theta lifting of\ngeneralized Whittaker models, 2014; Gan–Ichino,\
        \ The Gross–Prasad conjecture and local theta\ncorrespondence, 2016.\n\nEach period in the seesaw unfolding\
        \ is a constant times a finite sum over cosets of a small level,\nweighted by reciprocals of stabiliser\
        \ indices that divide powers of the norm of the twist's\nconductor. So the coefficients of the definite\
        \ chain get no new denominators away from the\nconductor. Related work: Gross, Algebraic modular forms,\
        \ 1999; Hsieh–Namikawa, Bessel periods and\nnon-vanishing of Yoshida lifts modulo a prime, 2015; X. Zhang,\
        \ Non-vanishing mod p of theta lifts\nfor (O(2n+1), Mp(4n)), 2022.\n"
