      text: 'Let `T` be a Frobenius cycle (`New.FrobeniusCycle`) over a field `K` of characteristic `p`, with

        `P = T.P` and `q = T.q = P ^ N`. Exponents are indexed by `(b, s) ∈ Fin k × ZMod N`, and `s` is

        called the letter. The defect of an exponent `β` at the letter `i` along the root `(a, a'')` is the

        linear form `∑ x, T.defectWeight i a a'' x * β x`. Pieri''s inequalities say that the defects along

        the simple roots `(b, b + 1)` are at most `0`.

        '
    remainder:
      path: grh/src/New/UpperBound/ElementaryDivisors/DefectCount.lean
      line: 14
      endLine: 59
      text: "\nThe forms whose translates by a Levi subgroup with two blocks have bounded defect along the root\n\
        between the blocks are counted by flags and lattice points. One substitutes `x ^ m` for the\nvariables,\
        \ `m` a power of `q`, and multiplies by one monomial for each class of exponents modulo\n`m`. Give the variable\
        \ `(b, s)` the height `b` for even `s` and `-b` for odd `s`. Among the terms of\nall translates of the resulting\
        \ polynomial by the Levi subgroup, one of least height has defect at\nmost `0` along the other simple roots,\
        \ and it occurs in the translate by a representative of a flag,\nthat is, of a coset of the lower Iwahori\
        \ subgroup. A shift by an integral vector moves its exponent,\ndivided by `m`, into the cone of Pieri's\
        \ inequalities. As `m` grows, the count of these exponents\nbecomes the volume of the cone cut by a slab,\
        \ and the share of the cone in a slab is the inverse of\nthe number of all flags.\n\n## Main definitions\
        \ and results\n\n* `New.FrobeniusCycle.defectCone`: the real vectors of bounded defect along the simple\
        \ roots.\n* `New.powerPacking`: a family of forms in the `m`-th powers of the variables, packed into one\n\
        \  polynomial.\n* `New.FrobeniusCycle.exists_finrank_defectConditions_le_volume`: the dimension of the forms\
        \ of\n  bounded defect is at most a number of flags times the volume of the part of a slab in which\n  Pieri's\
        \ inequalities hold.\n* `New.FrobeniusCycle.index_mul_finrank_defectConditions_le`: in large degree, the\
        \ parahoric index\n  times the dimension of the forms of bounded defect is at most `1 + θ` times the number\
        \ of\n  exponents.\n\nNotions from other files:\n* `New.parahoric`: The parahoric subgroup of a labelling\
        \ τ: matrices in GL_k(W), W local, whose\n  (i,j) entry lies in the maximal ideal whenever τ(i) < τ(j).\n\
        * `New.FrobeniusCycle.defectConditions`: The forms F such that, for every g block diagonal with\n  blocks\
        \ of sizes a', k − a' and every β of defect above h along (a, a') at some letter, the\n  coefficient of\
        \ g·F at β lies in a given ideal I. In this file I = ⊥.\n* `levi W (twoBlock k r)`: The block diagonal matrices\
        \ with blocks r and k − r.\n* `degreeSlab k D`: The real vectors β ≥ 0 whose degree ∑_b β(b,s) in each letter\
        \ s lies in [D\n  s − 1, D s].\n\n## Notation\n\nIn the count, `m = q ^ j` is a power of `q`. As matrices\
        \ act transposed, the lower Iwahori subgroup\nis used.\n\n## Relation to the literature\n\nVolumes of interlacing\
        \ regions, Frobenius amplification and counting by leading terms along flags\nare known in the literature.\
        \ Related work: Forrester–Zhang, Corank-1 projections and the randomised\nHorn problem, 2021 (after Dixon,\
        \ 1905; Anderson, 1991); Bombieri, Counting points on curves over\nfinite fields, Sém. Bourbaki 430, 1973;\
        \ Okounkov, Brunn–Minkowski inequality for multiplicities,\n1996.\n"
