      text: 'This file bounds the gauge of the composite lift `New.Data.compositeLift` at a prime p, for a fixed

        embedding ι : ℂ → ℂ_p; for p ≠ N it does so through the expansion `New.Data.restrictedChain` into

        chains of `m` lifts. At the exceptional primes it uses the bound of

        `New.Data.IsMarked.isOntoUpToColength_scaledHeckeOperator` for the elementary divisors of the

        normalised Hecke operators `New.Data.IsMarked.scaledHeckeOperator`.'
    remainder:
      path: grh/src/New/UpperBound/Divisibility/LocalDivisibility.lean
      line: 14
      endLine: 77
      startOffset: 737
      endOffset: 5123
      text: "\n\nA form *has valuation at least* `v` if its gauge at the base point `1` is at most `p ^ (-v)`. The\n\
        *a-places* (`New.Data.aPlaces`) are the infinite places ≡ 1 modulo q₀. At a non-split prime `p < x₁`\nthat\
        \ is not *exceptional* (`New.Data.IsExceptional`), the loss pays for all collisions between\na-places. For\
        \ an exceptional prime `p < x₁`, a *full mark* is a choice `Λ` of one prime from each\nconjugate pair induced\
        \ by the a-places; the places *inducing* `Λ` are those that induce a prime of\n`Λ`, the *odd* places those\
        \ that induce the conjugate of one.\n\nWith `m` the number of lifts, `f` the number of infinite places of\
        \ `E` and `a` the length of a long\nrow, the exponents below are built from the following numbers.\n\n*\
        \ `D.heckeScalingExponent l` is `a` times the number of a-places that induce the prime `l`.\n* `D.collisionExponent\
        \ p`, written `j_p`, is the ceiling of `2 m f a / p`.\n* `D.collisionSum p ev` is the sum of `a / p ^ e`\
        \ over the collisions `(τ, e)` outside the set of\n  places `ev` (`New.Data.IsCollision`).\n\n## Main definitions\
        \ and results\n\n* `New.Data.IsWeakChainDatum.gaugeLe_restrictedChain_one`: for p different from N and d,\
        \ the chain\n  of lifts keeps integrality.\n* `New.Data.IsWeakChainDatum.gaugeLe_restrictedChain_collisionSum`:\
        \ at a non-split prime `p < x₁`\n  the bounds for single lifts add up to the gain, less the loss and `m`\
        \ times the collision sum.\n* `New.Data.IsWeakChainDatum.gaugeLe_restrictedChain_of_isFullMark`: for a full\
        \ mark Λ, the bound\n  for `New.Data.restrictedChain` on the image of the m-th power of the product of the\
        \ operators\n  `New.Data.IsMarked.scaledHeckeOperator`.\n* `New.Data.IsMarked.isOntoUpToColength_prod_scaledHeckeOperator_pow`:\
        \ this power keeps the integral\n  source forms and is onto modulo `p ^ j_p` up to a small colength.\n*\
        \ `New.Data.exists_colengthDvd_gaugeLe_compositeLift`: there is a module of source forms whose\n  integral\
        \ members have colength at most l in the integral source forms, with\n  l ≤ allowedLoss(p) · dim (source\
        \ forms), and on whose ramified members the composite lift of a\n  chain datum has valuation at least gain(p)\
        \ − allowedLoss(p).\n* `New.Data.exists_err_gaugeLe_compositeLift`: the same bound for all primes p, on\
        \ a submodule of\n  the integral ramified source forms, with losses err(p) such that every finite sum ∑\
        \ err(p) log p\n  is at most `New.Data.errorUnit`.\n\nNotions from other files:\n* `New.GaugeLe d c φ`:\
        \ for every `g`, the p-adic gauge of the value `φ g` at `g * d` is at most `c`.\n* `New.ColengthDvd M N\
        \ z`: the index of `N` in `M` divides `z`, that is, each finite family in `M`\n  has combinations in `N`\
        \ by a matrix whose determinant divides `z`.\n* `New.IsOntoUpToColength p M n y c`: the endomorphism `y`\
        \ keeps `M`, and `y (M) + p ^ n • M` has\n  index dividing `p ^ l` in `M` for some natural number `l ≤ c`.\n\
        * `New.Data.allowedLoss`: 2·loss(p) for a non-split prime p < x₁ (`New.Data.loss`); otherwise 2mfb\n  if\
        \ p = N, and 0 if not.\n* `New.Data.gain`: the divisibility asked of the chain of lifts at p.\n\n## Relation\
        \ to the literature\n\nFor each prime p and twist of conductor prime to p, the chain of theta lifts is divisible\
        \ by the\npredicted power of p, less an error, on a submodule of the ramified source forms whose colength\
        \ per\ndimension is at most that error. The errors times log p have a small sum, which gives the\ndivisibility\
        \ side of the bound. p-integrality of single theta lifts is known in the literature.\nRelated work: X. Zhang,\
        \ Non-vanishing mod p of theta lifts for (O(2n+1),Mp(4n)), 2022; Berger,\nArithmetic properties of similitude\
        \ theta lifts, 2009; Prasanna, Integrality of a ratio of Petersson\nnorms, 2006.\n\nAt an inert prime p\
        \ pairing two a-places, each lift may lose divisibility. Outside a sparse set of\nsuch p, the chain regains\
        \ the predicted power of p, up to about one lift's loss, on the image of\nscaled Hecke operators above p\
        \ applied once per lift. Once enlarged by a p-power multiple of all\nsource forms, this image has small\
        \ colength. Hecke operators passing through theta lifts, p-power\nscaling by weight and p-adapted lifts\
        \ at ordinary p are known in the literature. Related work:\nRallis, Langlands' functoriality and the Weil\
        \ representation, 1982; V. Lafforgue, Estimées pour les\nvaluations p-adiques des valeurs propres des opérateurs\
        \ de Hecke, 2011; Z. Liu, Test Schwartz\nfunctions at p for theta lifts of Hida families, arXiv 2510.21644,\
        \ 2025.\n"
