      endLine: 52
      startOffset: 958
      endOffset: 3478
      text: "\n\n## Main definitions and results\n\n* `New.Variety.PadicTest.tiltPiEquiv`, `New.Variety.PadicTest.isPerfectTorsionFree_tilt`:\
        \ S♭ is the\n  product of the tilts of the cells; it is perfect and has no π-torsion.\n* `New.Variety.PadicTest.ker_theta`:\
        \ the kernel of Fontaine's θ : W(S♭) → S is generated by ξ.\n* `New.Variety.PadicTest.thetaIso`: O_C ⊗_{A_inf}\
        \ W(S♭) ≅ S, naturally in the test.\n* `New.Variety.homTiltIso`: for perfect `b`, algebra maps `b → c.TiltRing`\
        \ correspond to algebra\n  maps `O_C ⊗ W(b) → c.ProdRing` by `f ↦ θ ∘ W(f)`, naturally in the test `c`.\n\
        * `New.Variety.hasCoveringPoints_padic`: if an algebra has a point in some test, then all its points\n \
        \ in tests factor through a single point.\n* `New.Variety.IsAffinelyCovered.hasFlatBaseChange`, `New.Variety.hasFlatBaseChange_of_iso_reprBy`:\n\
