      text: 'The `p`-adic cohomology `New.Variety.ellAdicCohom` of a proper scheme `Y` is crystalline when `Y` is

        charted (`New.Variety.IsCharted`) over a noetherian ring `R` that maps into the valuation ring of a

        `p`-adic place of `Ω`, and over `Ω`. A congruence relation Σ n_i [Frob^{a_i} u_i(x)] = 0 between

        maps of proper schemes (`New.Variety.CongruenceRelation`) gives the same relation between the

        operators on `New.Period.Bmax ⊗ Vⁿ(Y)`.

        '
    remainder:
      path: grh/src/Lib/PadicComparison/CrystallineFrobenius.lean
      line: 12
      endLine: 79
      text: "\n## Overview of this theory\n\nLet `R` be a commutative ring and `Ω` a fixed algebraic closure of\
        \ `ℚ` that is an `R`-algebra. Call\na scheme charted over a ring if it is built from charts étale over tori\
        \ (`New.Variety.IsCharted`).\nLet `Vⁿ(Y)` be `New.Variety.ellAdicCohom` for `ℓ = p`, that is, `ℚ_p ⊗ Hⁿ(Y_Ω,\
        \ ℤ_p)`. A place above\n`p` is given by a valuation ring `A` of `Ω` containing the image of `R`.\n\n* `New.Variety.finite_and_primitive_comparison`:\
        \ let `Y` be proper over `R` and charted over an\n  algebraically closed field `Ω` mapping to `ℂ_p`. Let\
        \ `M` be a module over the tilt `O♭` of\n  `O_{ℂ_p}`, with `B ↦ B ⊗ M` acyclic along tilting at perfect\
        \ `O♭`-algebras. Then the cohomology of\n  `Y_Ω` commutes with flat extension of coefficients, and each\
        \ `Hⁿ(Y_Ω, \U0001D53D_p)` is finite. If also `R`\n  maps compatibly to `O_{ℂ_p}`, the cohomology of `Y_Ω`\
        \ with coefficients (locally constant `O♭`)\n  `⊗ M` maps bijectively to that of `S ↦ Y(S)`. Here `S` runs\
        \ over the `p`-adic test rings\n  (`New.Variety.PadicTest`), with coefficients `S♭ ⊗ M`.\n* `New.Variety.exists_period_map`:\
        \ let `R` map to `O_{ℂ_p}` compatibly with an embedding `Ω → ℚ̄_p`.\n  Let `S` be a `p`-torsion-free, `p`-adically\
        \ complete `A_inf`-algebra and `K` a flat `S`-algebra\n  over `ℚ_p`, as in `IsPeriodRingPair`. There are\
        \ `K`-linear maps from `K ⊗ Vⁿ(Y)` to `Hⁿ` of\n  `T ↦ Y(T)` on test rings `T`, with coefficients built from\
        \ `K` and `W(T♭)`. These maps are natural\n  and Galois-compatible. They are bijective when `Y` is proper\
        \ and charted over `Ω`.\n* `New.Variety.ellAdicCohom.isCrystalline_and_linearFrob_rel`: let `R` be noetherian,\
        \ `K` a field,\n  and `Y` proper and charted over `R` and over `Ω`. Then the decomposition group of `A`\
        \ over `K`\n  acts crystallinely on `Vⁿ(Y)`. Let `W` be proper and charted over `Ω`, with maps `uᵢ : W ⟶\
        \ Y`.\n  Suppose that `∑ mᵢ [Frob^{aᵢ}(uᵢ x)] = 0` at the field-valued points `x` of the special fibre of\n\
        \  `W`. Suppose also that each `γᵢ` in the decomposition group acts on the residue field as\n  `x ↦ x ^\
        \ (1/p^aᵢ)`. Then `∑ mᵢ uᵢ^* ∘ linearFrob(γᵢ, aᵢ) = 0` on `Bmax ⊗ Vⁿ(Y)`.\n* `New.Variety.exists_hasHodgeTateWeight`:\
        \ let `Y` be proper, smooth of relative dimension `d` and\n  charted over `Ω`. Let `E` be a field between\
        \ `R` and `Ω`, and let `E → k → ℚ̄_p` be compatible,\n  with a section `ε` of `k → ℚ̄_p`. Fix `h`, a proper\
        \ `W`, and a class `x` in degree-`q` Hodge\n  cohomology of `Y` over `E`. Then there are `v` in `ℂ_p ⊗ V^(q+h)(Y)`\
        \ and an `ε`-semilinear map `Θ`\n  with two properties. First, `v` has Hodge–Tate weight `h` for the decomposition\
        \ group over `E`.\n  Second, `hodgeTateMap h (u^* x) = Θ(u^* v)` for every `u : W ⟶ Y`.\n\nThese replace\
        \ the primitive, crystalline and Hodge–Tate comparison theorems (Faltings, Scholze,\nBhatt–Morrow–Scholze)\
        \ as used in `Lib.Shimura.Eigenspace`. There is no integral form, no Hodge–Tate\ndecomposition, and no identification\
        \ with étale or crystalline cohomology.\n\n`Descent` defines the test rings and proves acyclicity for almost\
        \ coefficients. `Duality` on powers\nof `ℙ¹`, with `Lib.Cohomology.SmoothBaseChange`, extends the comparison\
        \ from a point to `Y`.\n`Primitive` deduces the first result and lifts it to periods by `Completion`; the\
        \ map is in\n`HodgeTate.PeriodMap`. `Crystalline` uses `ToricTower` (roots of one unit at a time) for the\n\
        crystalline statement, and `CrystallineFrobenius` treats Frobenius. `HodgeTate` builds the\nHodge–Tate map.\n\
        \n## Main definitions and results\n\n* `New.Variety.exists_cancels_frobPow_locally`: if p divides a power\
        \ of z and a fixed power of z\n  divides the image of \U0001D534, then near each maximal ideal of a test\
        \ the relation holds modulo z.\n\nNotions from other files:\n* `New.Variety.Cancels`: the integers m_i add\
        \ up to zero on every fibre of a family v_i, that is, Σ\n  m_i [v_i] = 0 in the free abelian group on the\
        \ v_i.\n* `New.Variety.CongruenceRelation`: Σ m_i [F_i u_i(x)] = 0 (`New.Variety.Cancels`) for every point\
        \ x\n  of W in a field of characteristic p that kills \U0001D534, where F_i is the a_i-th iterate of Frobenius.\n\
        * `New.Period.Bmax`: The period ring B = B^+[1/μ] (Colmez's B_max, not Fontaine's B_cris), over\n  which\
        \ crystalline representations are defined.\n* `New.Period.linearFrob`: β_{s,m}: a chosen B-linear endomorphism\
        \ of B⊗T agreeing with φ^m\n  j(s) ⊗ ρ(s) on D_pcris(T), if one exists (arbitrary otherwise).\n\n## Relation\
        \ to the literature\n\nKnown result: Congruence relation for the crystalline Frobenius. In the literature,\
        \ characteristic\npolynomials are compared through cycle classes. Here a relation among Frobenius twists\
        \ of maps,\ngiven on points of the special fibre, is carried directly to a relation among operators on\n\
        crystalline invariants. Source: Scholl, Motives for modular forms, 1990, Invent. Math. 100, §4.2.3,\nthrough\
        \ Katz–Messing, Some consequences of the Riemann hypothesis for varieties over finite fields,\n1974, Invent.\
        \ Math. 23, Thm 2(2); for the ramified base, Berthelot–Ogus, F-isocrystals and de Rham\ncohomology I, 1983,\
        \ Invent. Math. 72.\n"
