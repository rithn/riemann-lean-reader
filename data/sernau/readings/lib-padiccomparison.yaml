      text: 'This file concerns a proper scheme `Y` over `R` that is charted over an algebraic closure `Ω` of `ℚ`

        (`New.Variety.IsCharted`). A p-adic test is a product of valuation rings over `O_C`, the integers of

        `ℂ_p`, and `O^♭` is the tilt of `O_C`. The primitive comparison theorem compares the mod `p`

        cohomology of `Y`, tensored with `O^♭`, with the cohomology of its points in p-adic tests with

        tilted coefficients.

        '
    remainder:
      path: grh/src/Lib/PadicComparison/Primitive/ComparisonTheorem.lean
      line: 11
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.Variety.finite_and_primitive_comparison`: let `Y` be proper\
        \ over `R` and charted over `Ω`,\n  and assume `IsAcyclicOnPerfect (moduleCoeff (tensorCoeff M))`. Then\
        \ `Y_Ω` has flat base change and\n  finite mod `p` cohomology, and the comparison map is bijective.\n* `New.Variety.finite_padic_cohomology`:\
        \ the cohomology with coefficients `ℤ_p` is finitely\n  generated; hence `New.Variety.ellAdicCohom R Ω n`,\
        \ which is `ℚ_p ⊗` this module, is\n  finite-dimensional at `Y`.\n* `New.Variety.ellAdicCohom.continuous_galoisAction`:\
        \ the Galois action\n  `New.Variety.ellAdicCohom.galoisAction` is continuous, tested on a vector and a linear\
        \ map to\n  `Q̄_p ^ N`. Modulo `p ^ k` a class is defined over finitely many elements of `Ω`, so it is fixed\n\
        \  by an open subgroup.\n\nNotions from other files:\n* `New.Variety.genericTestOver`: The functor sending\
        \ a p-adic test with ring R to R[1/p], a test\n  over Ω with algebra structure through Ω → ℂ_p.\n* `New.Variety.primitiveMap`:\
