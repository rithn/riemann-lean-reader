      endOffset: 4582
      text: " Fix an action of A_inf on A_max satisfying\n`New.Variety.CrysPeriodAlgebra`. For a functor P on O_C-algebras,\
        \ the crystalline comparison\ncompares two cohomologies. The first is that of D ↦ P(D/\U0001D521(D)) on\
        \ p-torsion-free p-complete\nA_max-algebras D, with coefficients B_max ⊗ D. The second is that of P on p-adic\
        \ tests. Finally, let\nS be a complete discrete valuation ring with uniformiser p, let O_C be an algebra\
        \ over a ring R with\na map R → S/\U0001D521(S), let A_max be an S-algebra, and assume a given natural map\
        \ from D ↦ D/\U0001D521(D) (as\nR-algebras via O_C → A_max/\U0001D521(A_max)) to D ↦ D/\U0001D521(D) (via\
        \ R → S/\U0001D521(S)) on p-torsion-free p-complete\nA_max-algebras is an isomorphism; let V be a subfunctor\
        \ of a functor X on R-algebras with\n`New.Variety.IsCharting` V (V covers X and is built from charts étale\
        \ over tori). Then the classes\npulled back from D ↦ V(D/\U0001D521) on p-torsion-free p-complete S-algebras\
        \ span the period cohomology of V\nover B_max when it is finite.\n\n## Main definitions and results\n\n\
        * `New.Variety.CrysPeriodAlgebra`: the properties of an A_inf-algebra structure on A_max that the\n  comparison\
        \ needs.\n* `New.Variety.exists_crysPeriodAlgebra`: for each y in O_C with p ∣ y^N, there is an algebra\n\
        \  structure as in `New.Variety.CrysPeriodAlgebra` that is equivariant for Frobenius and Galois and\n  whose\
        \ map O_C → A_max/\U0001D521(A_max) kills y.\n* `New.Variety.HasCrysComparison`: the comparison along `New.Variety.crysThickening`\
        \ and\n  `New.Variety.testToPdReduction` is bijective in every degree.\n* `New.Variety.hasCrysComparison_of_witt`,\
        \ `New.Variety.hasCrysComparison_of_etale`:\n  `New.Variety.HasCrysComparison` holds for P = Hom_{A_inf}(T,\
        \ −), with scalars restricted from O_C\n  to A_inf, when the A_inf-algebra T maps to W(b), for a perfect\
        \ π-torsion-free O^♭-algebra b, by a\n  map bijective on p-adic completions. It also holds for P = Hom(B,\
        \ −) with B étale over O_C[G],\n  where G is a ℚ≥0-module.\n* `New.Variety.hasCrysComparison_chart`: the\
        \ comparison holds for Hom_R(B, −) on O_C-algebras when B\n  is étale over R[X_1, …, X_d], each X_i going\
        \ to a unit t_i. Adjoining all roots of the t_i reduces\n  it to `New.Variety.hasCrysComparison_of_etale`.\n\
        * `New.Variety.span_range_crysComparison_pull_eq_top`: for S a complete discrete valuation ring with\n \
        \ uniformiser p, the classes pulled back from the cohomology of D ↦ V(D/\U0001D521) span the period\n  cohomology\
        \ of V over B_max when it is finite.\n\nNotions from other files:\n* `New.OC`: The ring of integers O_C\
        \ of the field C_p of p-adic complex numbers.\n* `New.Period.OFlat`: The ring O^♭, the inverse limit of\
        \ O_C/p along x ↦ x^p;\n  π = p♭ = `New.Variety.pFlat` is ξ mod p, the zeroth Witt coefficient of ξ.\n*\
        \ `New.Variety.PadicTest`: A p-adic test: a non-empty family of cells (`New.Variety.IsCell`) with a\n  ring\
        \ map from O_C to their product S (`ProdRing`); S^♭ is the tilt of S and θ : W(S^♭) → S is\n  Fontaine's\
        \ map.\n* `New.Period.Amax`: Colmez's period ring A_max, the p-adic completion of A_inf[X]/(pX − ξ).\n*\
        \ `New.Variety.compatibleRoots`: The functor of characters ℚ≥0 → A on O_C-algebras A, with the twist\n \
        \ by s ↦ (ε^s)^♯ as an endomorphism (a functor on O_C-algebras × Bℕ, `New.Variety.TimesBNat`).\n* `New.Variety.IsLine`:\
        \ A map Y → U from a functor with an endomorphism is a line if the cohomology\n  of U maps bijectively to\
        \ that of Y on the product with Bℕ.\n\n## Relation to the literature\n\nKnown result: Crystalline comparison\
        \ for p-adic étale cohomology with good reduction. Only\ncrystallinity is proved here. It is for cohomology\
        \ on p-adic test rings, which is not identified\nwith étale cohomology. There is no filtration and no identification\
        \ with crystalline cohomology.\nInvariants come from p-complete torsion-free rings modulo elements with\
        \ divided powers, and they are\ncompared on toric towers one coordinate at a time. Source: Bhatt, Morrow,\
        \ Scholze, Integral p-adic\nHodge theory, 2018, Publ. IHÉS 128, Thm 1.1(i) (first proved in Faltings, Crystalline\
        \ cohomology and\np-adic Galois representations, 1989); for the site, Bhatt, Prismatic F-gauges, 2022, Rem.\
        \ 2.5.12;\nfor the line lemma, Andreatta–Brinon, Acyclicité géométrique de B_cris relatif, 2013, Comment.\
        \ Math.\nHelv. 88.\n"
