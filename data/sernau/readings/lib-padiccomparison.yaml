        \ an algebra over `O♭ = OFlat`. Here `^` denotes `p`-adic\ncompletion. `S` is an `A_inf`-algebra and `K`\
        \ is an `S`-algebra.\n\n## Main definitions and results\n\n* `New.Variety.bijective_prod_tilt`: bijectivity\
        \ of `x ↦ (f x, g x)`, which recognises a product,\n  passes from the rings of `p`-adic tests to their tilts.\n"
