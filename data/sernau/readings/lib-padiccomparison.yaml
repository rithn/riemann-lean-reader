        \ Yoneda power of the class of the\n  contraction cocycle `New.Variety.HodgeTatePair.contractionCocycle`,\
        \ followed by the projection to\n  degree zero. It is `k`-linear (`New.Variety.HodgeTatePair.act_comp_contractionPow`)\n\
        \  and has weight `h` (`New.Variety.HodgeTatePair.scaleModule_comp_contractionPow`).\n* `New.Variety.hodgeTateMap`:\
        \ restrict a class of `New.Variety.HodgeH` to these pairs and compose\n  with `contractionPow h`. `New.Variety.restrictToPairs`\
        \ maps the degree-`n` cohomology of `N(T)` on\n  `p`-adic tests to the same target `New.Variety.PairH`.\n\
        * `New.Variety.PairRestrictBijective`: restriction along `B_{S,M} → T` is bijective on cohomology in\n \
        \ all degrees.\n* `New.Variety.PairRestrictBijective.exists_hodgeTateMap_eq`: under this hypothesis,\n \
        \ `hodgeTateMap h x` for `x` of degree `q` comes from a class of degree `q + h`.\n* `New.Variety.IsChartCovered.pairRestrictBijective`:\
        \ `PairRestrictBijective` holds for `ℤ[X]` if\n  `X` is covered by étale charts. The map `B_{S,M} → T` is\
