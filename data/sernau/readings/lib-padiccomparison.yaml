        * `New.Variety.IsCompleteTorsionFree` and `New.Variety.CrysTest`: p-torsion-free p-complete rings,\n  and\
        \ the category of such S-algebras. `New.Variety.CrysTest.restrictScalars` restricts scalars.\n* `New.Variety.baseChangeMap`,\
        \ `New.Variety.HasFlatBaseChange`: the map M ⊗ H^n(N, Φ) → H^n(N,\n  M ⊗ Φ), and the statement that it is\
        \ bijective for flat M.\n* `New.Variety.IsCell`, `New.Variety.PadicTest`: cells, and p-adic tests, which\
        \ are non-empty\n  products S of cells with a map from O_C = `New.OC`.\n* `New.Variety.PadicTest.tilt`,\
        \ `New.Variety.algCompletion`, `New.Variety.wittFunctor`,\n  `New.Variety.periodAlg`: tilt, p-adic completion,\
        \ Witt vectors, and the completion of T ⊗ W(b)\n  over A_inf.\n\nNotions from other files:\n* `New.Variety.Comparison`:\
        \ A comparison from F on C to F' on C': a functor φ: C' → C with a natural\n  transformation β: F∘φ → F'.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.PadicComparison.Crystalline.ComparisonMap`, `Lib.PadicComparison.Completion`,\n\
        `Lib.PadicComparison.Descent.AlmostDescent` and `Lib.PadicComparison.HodgeTate.PeriodMap` for\nsources.\n"
