    excerpt:
      path: grh/src/Lib/PadicComparison/Completion.lean
      line: 6
      endLine: 10
      text: 'This file shows that comparison maps of cohomology are bijective, by reduction modulo a scalar and

        successive approximation. `New.Variety.H N F n` is `Extⁿ(N, F)` in the category `AbFunctor C` of

        functors `C ⥤ Ab`. `New.Variety.moduleCoeff Φ` is a module-valued functor `Φ` (`act a` is

        multiplication by `a` on it, `push N q n` is the map on `Hⁿ` induced by `q`, and `a • x` on `Hⁿ` is

        `push N (act a) n x`), read as such a functor of coefficients.

        '
    remainder:
      path: grh/src/Lib/PadicComparison/Completion.lean
      line: 11
      endLine: 46
      text: "\n## Main definitions and results\n\n* `New.Variety.IsDerivedComplete`: derived π-completeness, the\
        \ bijectivity of `New.shiftDiff π` on\n  sequences. It passes to powers `ι → X`, to retracts up to a power\
        \ of π, to cohomology\n  (`New.Variety.IsDerivedComplete.cohomology`) and, in finite rank, to base change\n\
        \  (`New.Variety.IsDerivedComplete.baseChange`).\n* `New.Variety.Comparison.IsBijective.of_mod`: a comparison\
        \ of complete cohomology groups that is\n  bijective modulo `a` is bijective.\n* `New.Variety.IsCompletionBijective`,\
        \ `New.Variety.moduleCompletionIso`: linear maps that are\n  bijective on p-adic completions, and the p-adic\
        \ completion of an algebra, as a module.\n* `New.Variety.HasFlatBaseChange.isBijective_of_isReductionMod`:\
        \ `Hⁿ(N, S ⊗ Θ) → Hⁿ(N, X)` is\n  bijective if `S ⊗ Θ → X` is so modulo p. The cohomology of `N` must commute\
        \ with flat base change.\n  `W` must be a discrete valuation ring with uniformiser p, and `S` must be flat\
        \ over `W`. The lemma\n  also needs completeness and no p-torsion of `W`, `S` and every value of `Θ` and\
        \ `X`, and finite\n  rank of `Hⁿ(N, Θ)` for each n where the kernel of the map on `Hⁿ` is p-divisible.\n\
        \nNotions from other files:\n* `New.shiftDiff`: The operator (x_j) ↦ (x_j − π x_{j+1}) on sequences in a\
        \ module.\n* `New.Variety.Comparison.IsBijective`: For a functor φ: C' → C, a map β: F∘φ → F' and α: N'\
        \ → N∘φ,\n  the map Ext^n(N, F) → Ext^n(N', F') is bijective for every n.\n* `New.Variety.IsReductionMod`:\
        \ The map f is surjective, and f(x) = 0 exactly when x is a multiple\n  m·y of m.\n* `New.Variety.HasFlatBaseChange`:\
        \ a functor N to abelian groups has it if M ⊗_S Hⁿ(N, Φ) → Hⁿ(N, M\n  ⊗_S Φ) is bijective for all n, all\
        \ functors Φ to S-modules and all S-flat M.\n* `New.Variety.Comparison.restrict`: The cohomological comparison\
        \ datum along a functor φ: C' → C\n  from an abelian-group-valued functor N to N∘φ, with identity coefficient\
        \ map.\n\n## Relation to the literature\n\nKnown result: Derived completeness for a principal ideal, covering\
        \ Nakayama, finiteness and\ncompleted base change. Only modules and Ext groups are treated, and completeness\
        \ is defined as\nbijectivity of x_n - a x_(n+1) on sequences. Base change is proved for modules of finite\
        \ rank over a\ndiscrete valuation ring, with bounded torsion shown by hand. Source: Stacks Project 091N,\
        \ 091P,\n0G1U, 09BA, 0CQY; B. Bhatt, Torsion completions are bounded, JPAA (2019); L. Positselski,\nContraadjusted\
        \ modules, contramodules, and reduced cotorsion modules, arXiv 1605.03934.\n"
