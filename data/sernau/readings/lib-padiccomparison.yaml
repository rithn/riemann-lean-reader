      text: 'This file compares the geometric cohomology `New.Variety.ellAdicCohom R Ω n` of an `R`-scheme `Y`

        (`Ω` an `R`-algebra on which a group `Γ` acts by ring maps fixing the image of `R`), written

        `V^n(Y)`, with the cohomology of the points of `Y` in `p`-adic tests. A vector has weight `h`

        (`New.HasHodgeTateWeight`) if Galois acts on it by the `(-h)`-th power of the cyclotomic character.

        '
    remainder:
      path: grh/src/Lib/PadicComparison/HodgeTate/PeriodMap.lean
      line: 13
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.Variety.toTwistAlg`: the identity of a `p`-adic test as\
        \ an `R`-algebra map to its Galois\n  twist.\n* `New.Variety.exists_period_map`: the period map is natural,\
        \ Galois equivariant, and bijective for\n  proper charted `Y`. It is the pull-back along the comparison\
        \ of\n  `New.Variety.exists_primitive_period_comparison`.\n* `New.Variety.exists_hasHodgeTateWeight`: the\
        \ value of the Hodge–Tate map on a Hodge class comes\n  from a vector of weight `h`, naturally in maps to\
        \ `Y`.\n\nNotions from other files:\n* `New.Variety.PadicTest`: A p-adic test c: a non-empty family of cells,\
        \ whose product is the ring\n  `c.ProdRing`, with a ring map from O_C, the integers of ℂ_p, to that product.\n\
        * `New.Variety.PadicTest.twist`: For g in G_p, the endofunctor of p-adic tests that keeps the ring\n  and\
        \ precomposes its structure map O_C → c.ProdRing with the action of g.\n\n## Relation to the literature\n\
        \nKnown result: The primitive comparison theorem and the period isomorphism. Here coefficients are\nconstant,\
        \ schemes are proper and charted (`New.Variety.IsCharted`), cohomology is taken on test\nrings, and the\
        \ maximal ideal is put into the coefficients. The result is deduced from the duality\ncomparison on products\
        \ of projective lines, without almost finiteness. Source: P. Scholze, p-adic\nHodge theory for rigid-analytic\
        \ varieties, Forum Math. Pi 1 (2013), Thm 1.3 and 5.1; for the method,\nB. Zavyalov, Poincaré duality in\
        \ abstract 6-functor formalisms, arXiv 2301.03821, Thm 3.3.3 and\nAppl. 1.3.4; Li–Reinecke–Zavyalov, arXiv\
        \ 2410.08200, §6.4.\n\nKnown result: The Hodge–Tate map from Hodge cohomology to p-adic étale cohomology.\
        \ The target here\nis cohomology on test rings, which is not identified with étale cohomology. Only the\
        \ natural\nmultiplicative map into the part of weight h is built, from the torsor of lifts modulo the square\
        \ of\nthe kernel of Fontaine's map, and bijectivity is not proved. Source: Scholze, p-adic Hodge theory\n\
        for rigid-analytic varieties, Forum Math. Pi 1 (2013), Cor. 1.8; the construction follows Bhatt, The\nHodge–Tate\
        \ decomposition via perfectoid spaces, Arizona Winter School 2017, §3.4.\n"
