      line: 11
      endLine: 39
      text: "Finally it treats one divided power variable `z = t - v`.\n\n## Main definitions and results\n\n* `New.Variety.IsCompleteTorsionFree.monoidHom_lift_bijective`,\n\
        \  `New.Variety.IsCompleteTorsionFree.existsUnique_witt_lift`: multiplicative maps from a perfect\n  monoid,\
        \ and ring maps from a perfect ring via its Witt vectors, lift uniquely from `S ⧸ pdIdeal S`\n  to `S`.\n\
        * `New.Variety.IsCompletionBijective.comp_bijective`: maps to a `p`-complete ring extend uniquely\n  along\
        \ a map that is bijective modulo every power of `p` (`New.Variety.IsCompletionBijective`).\n* `New.Variety.preEnvelope`,\
        \ `New.Variety.Envelope`: adjoin the `x ^ n / n !`, `x ∈ J`, inside\n  `T ⊗ ℚ`, then complete; `New.Variety.Envelope.existsUnique_lift`\
        \ is the universal property.\n* `New.Variety.exists_preEnvelope_basis`: if `T` has the `B`-basis `u a *\
        \ v ^ n`, the uncompleted\n  envelope of `z = t - v` has the basis `u a * z ^ n / n !`.\n* `New.Variety.koszulExact_pd_line`:\
        \ take an endomorphism `γ` that scales the unit `v` by `1 + q`\n  with `p ^ 3 ∣ q`. It must also scale each\
        \ `u a` with `a ≠ 0` by `1 + η` with `p * η ∣ q`, and\n  `u 0 = 1`. Then the sequence `0 → B → E → E → 0`\
        \ given by `γ - 1` is exact after a base change\n  that inverts `q`. The proof uses a shift `S` of the basis\
        \ such that `(γ - 1) S` is `q * v` times\n  `1 - p W` for an endomorphism `W`.\n\nNotions from other files:\n\
        * `New.Variety.CrysTest`: the category of `p`-torsion-free, `p`-adically complete `S`-algebras\n  (`New.Variety.IsCompleteTorsionFree`);\
        \ an object `E` is read as its underlying ring.\n* `New.Variety.KoszulExact`: for a map `i` and an endomorphism\
        \ `g`, the map `i` is injective, every\n  fixed point of `g` lies in the image of `i`, and `z ↦ g z - z`\
        \ is onto.\n\n## Relation to the literature\n\nKnown; see `Lib.PadicComparison.Crystalline.ComparisonMap`\
        \ for sources.\n"
