        \ point t(q) is moved to t(q') by\n  multiplying with the classes η(q_j) + η(q'_j).\n* `New.Variety.TorsionCoeff.HasLineFormula.integrate`:\
        \ integration `a + η b ↦ b` over `ℙ¹`, given\n  `New.Variety.TorsionCoeff.HasLineFormula`.\n* `New.Variety.ComparedTheory`,\
