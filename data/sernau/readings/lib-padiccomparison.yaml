      endLine: 13
      text: 'The tilt O♭ (`New.Period.OFlat`) has maximal ideal 𝔪 (`New.Variety.MaxIdealFlat`) and contains p♭

        (`New.Variety.pFlat`); N is an O♭-module killed by p♭. The coefficient functor

        `New.Variety.almostCoeff N` sends an O♭-algebra b to b ⊗ N ⊗ 𝔪, a case of

        `New.Variety.tensorCoeff`.

        For these coefficients, a map of perfect O♭-algebras that is onto on points in tilts of tests is a

        cover. By Čech descent, the points of a perfect algebra in tilts are acyclic. Auxiliary results

        treat 𝔪² = 𝔪 and Witt vectors of O♭-algebras.

        '
    remainder:
      path: grh/src/Lib/PadicComparison/Descent/AlmostDescent.lean
      line: 14
      endLine: 44
      text: "\n## Main definitions and results\n\n* `New.Variety.isCover_of_points`: if p^♭ kills N, a map b → b'\
        \ of perfect O^♭-algebras that is onto\n  on points with values in tilts of tests is a cover (`New.Variety.IsCover`)\
        \ for the coefficients\n  D ↦ D ⊗ N ⊗ \U0001D52A.\n* `New.Variety.isAcyclicAt_perfectTilt`: for N killed\
        \ by p♭, the points of a perfect O♭-algebra in\n  tilts of tests are acyclic (`New.Variety.IsAcyclicAt`)\
        \ for the coefficients b ↦ b ⊗ N ⊗ \U0001D52A. This\n  holds on the category of perfect O♭-algebras.\n*\
        \ `New.Variety.isAcyclicOnPerfect_almostCoeff`: the same on all O♭-algebras, for b perfect.\n\nNotions from\
        \ other files:\n* `New.Period.OFlat`: The ring O^♭, the inverse limit of O_C/p along x ↦ x^p, where O_C\
        \ is the ring\n  of integers of C_p.\n* `New.Variety.moduleCoeff`, `New.Variety.tensorWith`: A functor Φ\
        \ to S-modules regarded as\n  coefficients for cohomology, and M ⊗_S Φ for an S-module M.\n* `New.Variety.pFlat`:\
        \ The element p^♭ = ξ mod p of O^♭ = A_inf/p, the zeroth Witt coefficient of\n  the generator ξ of the kernel\
        \ of θ.\n* `New.Variety.PadicTest`: A non-empty family of cells (`New.Variety.IsCell`) with a ring map from\n\
        \  O_C = `New.OC` to their product; `TiltRing` is the tilt of the product.\n\n## Relation to the literature\n\
        \nKnown result: Almost acyclicity of the structure sheaf for the v-topology. The statement holds for\nany\
        \ perfect algebra over the tilt of O_C, as cohomology on products of complete absolutely\nintegrally closed\
        \ valuation rings modulo p♭, with the maximal ideal put into the coefficients so\nthat the result is exact.\
        \ The proof passes to a valuation ring. Source: P. Scholze, Étale cohomology\nof diamonds, arXiv 1709.07343\
        \ (2017), Theorem 8.7, Proposition 8.8; for perfect rings B. Bhatt, P.\nScholze, Projectivity of the Witt\
        \ vector affine Grassmannian, Invent. Math. 209 (2017), Theorem 4.1;\npoints argument O. Gabber, S. Kelly,\
        \ Points in algebraic geometry, J. Pure Appl. Algebra 219 (2015),\nTheorem 2.3.\n"
