      text: "\n\n## Main definitions and results\n\n* `New.Variety.TimesBNat.shortExact_wangComplex`: the short\
        \ exact sequence\n  0 → ℤ[Y × ℕ] → ℤ[Y × ℕ] → ℤ[Y] → 0 (`New.Variety.TimesBNat.wangComplex`;\n  `New.Variety.TimesBNat.shortExact_induced`\
        \ is the same with the two maps written out). Its long\n  exact sequence is the Wang sequence, since Y ×\
        \ ℕ on C × Bℕ has the cohomology of Y on C\n  (`New.Variety.TimesBNat.isLine_fst`).\n* `New.Variety.IsLine.of_acyclic`:\
        \ a criterion for Y to be a line over a representable functor\n  Hom(A, −), in terms of the kernel and cokernel\
        \ of γ - 1 on coefficients\n  (`New.Variety.KoszulExact`).\n* `New.Variety.compatibleRoots`: A ↦ characters\
        \ ℚ≥0 → A, that is, elements with a compatible system\n  of n-th roots for all n ≥ 1.\n* `New.Variety.CompatibleRootsAreLines`:\
        \ the property of coefficients F and a functor ψ to\n  O_C-algebras that the root systems of every unit\
        \ of every ψ(A) form a line (`New.Variety.IsLine`)\n  over Hom(A, −).\n* `New.Variety.periodicSeq.koszulExact_shift`:\
        \ in characteristic `p`, the constants contain the\n  kernel of the shift minus the identity, and this map\
        \ is onto (`New.Variety.KoszulExact`). This\n  also holds after tensoring with a module.\n* `New.Variety.PadicTest.isLine_compatibleRoots`:\
