      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.Space.schrodingerOp`: sends ∑ c_y (translate of the indicator\
        \ by y) to the operator ∑ c_y\n  ϱ(αy₊) P^S, with y₊ the part of y above S ∪ S̄ and P^S = `New.Space.projOn`\
        \ S.\n* `New.Space.rho_schrodingerOp`: naming is equivariant for the Heisenberg operators of the parts of\n\
        \  vectors above S ∪ S̄.\n* `New.Space.dataInner_schrodingerOp`: the inner product of two named vectors\
        \ factors.\n* `New.Space.schrodingerOp_union`: for disjoint `S`, `T` with `S ∪ T` disjoint from its conjugate,\
        \ a\n  product of functions names the composite.\n* `New.Space.omega_schrodingerOp`: for any `g`, `ω g (schrodingerOp\
        \ Ψ f) = schrodingerOp (Ψ ∘ g_f⁻¹)\n  u`, where `u` is `ω g` applied to the name of the box function composed\
        \ with `g_f`, and `u` is\n  fixed by `V.projOn S`.\n* `New.Space.omega_schrodingerOp_of_mem_supportedOn`:\
        \ `g` supported on `S ∪ S̄` acts by\n  `Ψ ↦ Ψ ∘ g⁻¹`, times the conjugate of `New.chiAdelic` at the `S`-part\
        \ of `det g`.\n\nNotions from other files:\n* `New.Space`: a hermitian space with a point, given by a matrix\
        \ J over E and x in GL_n(\U0001D538) with\n  xᴴJx equal to the diagonal matrix of its signs at the infinite\
        \ places and 1 at the finite places.\n* `New.Space.ϱ`: the Heisenberg operator of an adelic vector `y` on\
        \ `\U0001D4AE V`.\n* `New.Space.projOn`: the operator P^S on \U0001D4AE(V), the mean over y in Ô^n of the\
        \ finite Heisenberg\n  operators `New.Space.finHeisenbergOp` at the part of y above S ∪ S̄ (`S.conjClosure`).\n\
        * `New.localInner`: the integral of conj(Ψ) Ψ′ over the finite adelic vectors integral off S,\n  normalised\
        \ so that Ô^n has mass one.\n* `New.WeilData`: Weil data on a stably unramified E. They consist of ȷ in\
        \ E with ȷ = −ȷ̄, Im τȷ > 0\n  for every τ in the CM type and (1 − ȷ⁻¹)/2 integral; a finite idele α for\
        \ which the completed\n  integers Ô are self-dual under (z, u) ↦ ψ_f(ȷαᾱzu); and a splitting character υ\
