      text: 'Let V be a hermitian space with a point over a CM field E, with data space 𝒮(V). Let `α` be

        the finite idele of the Weil data, let `finVec x` be the adelic vector `(0, α x)`, let

        `finiteImage γ` be `α⁻¹ γ` in `(𝔸f E)ⁿ` (finite adeles) for γ in Eⁿ, so that

        `finVec (finiteImage γ)` is `(0, γ)`, and let `V.ϱ (finVec x)` be translation along a finite vector

        `x`. The file turns theta functions into Taylor series and Schur jet matrices, and defines when the

        jets of two data are conjugate. For a standard space V it shows that translation by the finite image

        '
    remainder:
      path: grh/src/Lib/Weil/Construction/ThetaJets.lean
      line: 15
      endLine: 45
      text: "of a rational vector acts on theta functions as the opposite real translation.\n\n## Main definitions\
        \ and results\n\n* `New.Space.jetSeries`: the series of the theta values of `f` along the monomials; for\
        \ standard `V`\n  and `f` in the finite part it is the Taylor series of the theta function of `f`, scaled\
        \ by `a`.\n* `New.schurJet`: the matrix of jets of a power series along the entries of the Schur matrix.\n\
        * `New.Space.IsJetConjugate`: the jets of `f'` are the `σ`-conjugates of the jets of `f`, up to a\n  permutation\
        \ of the infinite places.\n* `New.entireTheta_translate_finiteImage`: for standard `V`, `New.Space.entireTheta`\
        \ turns\n  translation by `finiteImage γ` into the twisted translation by `-realImage γ`.\n* `New.semichar_finiteImage`:\
        \ the semicharacter at the finite image of a rational vector is the\n  inverse of the canonical multiplier\
        \ at minus its real image.\n\nNotions from other files:\n* `New.Space`: a hermitian space with a point,\
        \ given by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal to the diagonal matrix of its\
        \ signs at the infinite places and 1 at the finite places.\n* `New.Space.θ`, `New.Space.integrated`: The\
        \ theta functional on the space `New.\U0001D4AE V` of data, and\n  the datum v ⊗ f for v in the Fock space\
        \ and f in `New.\U0001D4AE V`.\n* `New.WeilData`: supplies the purely imaginary `j` (ȷ) in E, the finite\
        \ idele `α` and the integer\n  `traceOne` (c₀) with c₀ + c̄₀ = 1.\n* `New.Space.entireTheta` sends `f` to\
        \ `y ↦ f(y) exp(|y|²/2)` on real points; `New.Space.ϱ` is\n  Heisenberg translation; `New.Space.finitePart`\
        \ is the span of the finite translates of the vacuum.\n\n## Relation to the literature\n\nKnown result:\
        \ the theta functions of the Fock model of the adelic Weil representation. Source: Weil,\nSur certains groupes\
