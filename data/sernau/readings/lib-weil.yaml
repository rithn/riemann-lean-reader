      text: "\n## Main definitions and results\n\n* `New.heckeSplit`: the operator `T_{w,j}` of the double coset\
        \ `New.basicDoubleCoset` of\n  `diag (ϖ 1_j, 1)`.\n* `New.heckeSplit_star`: on vectors spherical at `w`,\
        \ `T_{w̄,j}` is the action at `w` of the inverse\n  double coset. Hence `New.heckeSplit_dual` (`ϖ T_{w̄,i}\
        \ = T_{w,n-i}` on such vectors) and\n  `New.heckeSplit_adjoint` (`T_{w̄,j}` is adjoint to `T_{w,j}` on spherical\
        \ vectors, for a\n  `G_f`-invariant pairing).\n* `New.heckeSplit_comm`: the operators at two split places\
        \ commute on vectors spherical at both.\n* `New.IsUnitary.le_span_joint_eigenvectors`: in a representation\
        \ unitary for a form `B`\n  (`B y y > 0` for `y ≠ 0`, `B (π g x) (π g y) = B x y`), a finite-dimensional\
        \ stable space of\n  spherical vectors is spanned by joint eigenvectors. `New.IsUnitary.le_span_hecke_eigenvectors`\
        \ is\n  the form for places given by a predicate.\n* `New.heckePolyEval`, `New.heckePolyOp`: the Hecke polynomial\
        \ `∑ (-X)^i q^(i choose 2) T_{w,i}`,\n  where `i` runs from `0` to `n`, `q` is the order of the residue\
        \ field at `w`, and\n  `New.heckePolyOp` takes the `T_{w,i}` to be the operators `New.heckeSplit`, while\n\
        \  `New.heckePolyEval` allows any coefficients `t i`.\n* `New.HasHeckePolynomial`: vectors spherical at\
        \ `w` (`New.sphericalAt`) on which this polynomial\n  acts by given scalars.\n\nNotions from other files:\n\
        * `New.levelSpace`: For a representation π of G, a subgroup K and a character χ of K, the submodule\n  of\
        \ vectors v with π(k)v = χ(k)v for all k in K.\n* `New.heckeFun`: For a function f on G, the operator ∑\
        \ f(g)π(g), summed over representatives g of\n  G/K.\n* `New.stdLevel`: The subgroup K₀ = G_f ∩ GL_n(Ô)\
        \ of the finite adelic unitary group.\n* `New.Gf.supportedOn`: The subgroup of G_f of elements supported\
        \ on S ∪ S̄, that is, with component\n  1 at every place outside S ∪ S̄; `New.Gf.trivialOn`: those with\
        \ component 1 at every place in S.\n* `New.localIntGL`: For a finite place w of E, the subgroup GL_n(O_w)\
        \ of GL_n(E_w) of matrices that,\n  with their inverses, have entries in the local integers.\n\n## Relation\
        \ to the literature\n\nKnown; see `Lib.General.LinearAlgebra.IntegralLattices` for sources.\n"
