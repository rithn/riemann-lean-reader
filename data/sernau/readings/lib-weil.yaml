      text: 'A hermitian space `V : New.Space E n s` has Gram matrix `V.J` over `E` and an adelic frame `V.x`

        taking it to `New.stdForm E s`. `New.G E s` is the adelic unitary group of that form, and `V.Γ` is

        its group of rational points. Here `E` is a CM field (`CMType E`), and `WeilData E` supplies the

        purely imaginary `j` (`star j = -j`) used below. The file constructs hyperbolic space together with

        its frame, and defines adelic matrices that are orthonormal at the infinite places and integral at

        the finite ones. It then studies a splitting, or Witt decomposition,

        `V = (range l ⊕ range k) ⊥ i V₀` with `l` and `k` isotropic and dual: it gives the frames and

        '
    remainder:
      path: grh/src/Lib/Weil/MixedModel/IsotropicSplitting.lean
      line: 14
      endLine: 47
      text: "coordinates of the splitting in adelic form, the Levi and unipotent elements of the stabiliser of\n\
        `range k`, the law of a mixed model, and points adapted to the splitting.\n\n## Main definitions and results\n\
        \n* `New.hyperbolicSpace`: the hyperbolic space of rank `2 p` as a `New.Space`, that is, with an\n  adelic\
        \ frame that carries its Gram matrix to the standard form of signs `New.hyperbolicSigns p`\n  (`p` times\
        \ `+1`, `p` times `-1`).\n* `New.Exchange.IsOrthoIntegral`: adelic matrices with orthonormal columns at\
        \ the infinite places\n  and integral finite part. The frame of `New.hyperbolicSpace` and its inverse are\
        \ such\n  (`New.Exchange.isOrthoIntegral_hyperbolicSpace`), and the property is stable under products, block\n\
        \  sums and choice of columns.\n* `New.Space.Splitting.levi`, `New.Space.Splitting.radicalElement`: Levi\
        \ and unipotent elements;\n  every `g` with `g k = k a` is a product of the two\n  (`New.Space.Splitting.exists_eq_radicalElement_mul_levi`),\
        \ and the unipotent elements make up the\n  unipotent radical (`New.Space.Splitting.exists_eq_radicalElement_iff`).\n\
        * `New.Space.Splitting.IsAdapted`: elements of `G` adapted to a splitting and to `t` in `GL_p(\U0001D538\
        )`;\n  they exist (`New.Space.Splitting.exists_isAdapted_and_frame_eq`).\n* `New.Space.Splitting.siegelParabolic_sup_symm_eq_top`:\
        \ if `V₀` is zero, the stabilizers of the\n  spans of `k` and of `l` generate the rational unitary group\
        \ of `V`.\n* `New.Space.Splitting.exists_isCompact_rat_mul_radicalElement_mem`: the rational points of the\n\
        \  unipotent radical are cocompact.\n\nNotions from other files:\n* `New.stdForm E s`: the diagonal adelic\
        \ matrix that is `diag s` at every infinite place and the\n  identity at the finite places.\n* `New.G.adeleMatrix`:\
        \ the `n × n` adelic matrix of an element of the adelic unitary group\n  `New.G E s`.\n* `New.evalInf w`:\
        \ evaluation of an adele at the infinite place `w`, a ring map to `ℂ`.\n* `Ô E`: the integral finite adeles.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.Adelic.Witt.IwasawaDecomposition` and `Lib.Weil.MixedModel.ZeroTerm`\
        \ for sources.\n"
