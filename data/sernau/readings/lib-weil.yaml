      endLine: 30
      text: "\nThe map between the corrected basis and that part is a unipotent isometry.\n\nNotions from other\
        \ files:\n* `New.Grading`: an indexing of the basis of a hermitian space by `X` and a string of `s` vectors\
        \ in\n  which the Gram matrix `V.J` is the standard one, `gradedGram Y.indexEquiv N`, with constant `N`\n\
        \  (and `V.J⁻¹` is the one with constant `N⁻¹`); it gives every index a grade `Y.gradeOf i`.\n* `New.HasDegreeGe\
        \ w' w d A`: the entry `A i k` is `0` whenever `w' i < w k + d`.\n* `New.intGL ι (Ô E)`: the invertible\
        \ matrices with entries in the integral finite adeles `Ô E`\n  whose inverse has entries there too.\n* `New.Space.lattice\
        \ V x`: the vectors whose coordinates in the frame `V.xFin * x` are integral,\n  where `x` is a finite adelic\
