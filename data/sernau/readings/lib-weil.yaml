      path: grh/src/Lib/Weil/Construction/WeilOperators.lean
      line: 6
      endLine: 11
      text: 'This file defines the Weil operators of a multiplier action of a group `G` on `W` on the

        reproducing model of a vacuum. It proves their cocycle relation, and shows that they preserve the

        inner product. For cocycle `1` it defines the Weil representation and proves that it intertwines

        the Heisenberg operators and is continuous. The file then treats orthogonal sums `W = W₁ × W₂`,

        with tensor products of model vectors and Wiener''s bound, and the transport of the model along

        isomorphisms.

        '
    remainder:
      path: grh/src/Lib/Weil/Construction/WeilOperators.lean
      line: 12
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.Heisenberg.IsVacuum.weilOp_mul`, `New.Heisenberg.IsVacuum.modelInner_weilOp`:\
        \ if c(g, 1) = 1,\n  the Weil operators `New.Heisenberg.IsVacuum.weilOp` multiply up to the cocycle c and\
        \ preserve the\n  inner product.\n* `New.Heisenberg.IsVacuum.weilRep`: for c = 1 the Weil representation;\
        \ it intertwines ρ(x) and\n  ρ(gx) (`New.Heisenberg.IsVacuum.weilRep_heisenbergOp`) and, for first countable\
        \ G, is jointly\n  continuous (`New.Heisenberg.IsVacuum.continuous_weilRep`). Elements that preserve `e`\
        \ act by Δ(g)\n  times substitution (`New.Heisenberg.IsVacuum.weilRep_apply_of_vacuum_smul`). The operator\
        \ of g\n  has norm at most ‖vac‖ |Δ(g)| (`New.Heisenberg.IsVacuum.norm_weilRep_le`).\n\nNotions from other\
        \ files:\n* `New.Heisenberg.IsVacuum.Model`: the integrable functions v with v x = ∫ v y β(y, x) e(x - y),\n\
        \  with the L¹ norm and the inner product `New.Heisenberg.IsVacuum.modelInner`.\n* `New.Heisenberg.MultiplierAction`:\
        \ an action of `G` on `W` preserving `β` and `μ`, with a\n  multiplier `Δ` and a cocycle `c`.\n* `New.Heisenberg.IsVacuum.heisenbergOp`,\
        \ `New.Heisenberg.IsVacuum.vacElem`: the Heisenberg\n  operators ρ(x) on the model and the vacuum `e` as\
        \ an element of the model.\n\n## Relation to the literature\n\nThis file contributes to the adelic Weil\
        \ representation of a unitary group and the invariant theta\nfunctional. See `Lib.Weil.MixedModel.ZeroTerm`.\
        \ Sources: Weil; Kudla.\n\nThe usual proof of the product rule ω(g) ω(h) = ω(gh) compares ω with a Schrödinger\
        \ model on a\nSiegel parabolic subgroup of a split space, and then uses the Iwasawa decomposition and the\
        \ sum\nV ⊕ V⁻. The proof here does not use a Schrödinger model. The scalar c(g, h) in\nω(g) ω(h) = c(g,\
        \ h) ω(gh) is an integral of three vacua times values of the multiplier\n(`New.Heisenberg.IsVacuum.weilOp_inv_mul_weilOp_mul_weilOp`).\
        \ Later files show directly that it is\n1, from three local facts: a Gaussian determinant at the real places\
        \ (`New.Fock.realAction`),\npositivity at the split places and the sign of a Gauss sum at the inert places\n\
        (`New.stdLattice.mem_cocycleRadical`). The formulas of the Schrödinger model are then proved for the\nslices\
        \ in `Lib.Weil.MixedModel.ZeroTerm`.\n"
