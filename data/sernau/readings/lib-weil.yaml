    excerpt:
      path: grh/src/Lib/Weil/DualPair/HolomorphicData.lean
      line: 6
      endLine: 11
      text: 'This file sets up vocabulary for holomorphic automorphic functions on a unitary group over the CM

        field E. It covers holomorphic data in the Fock space, adelic holomorphy, rapidly decreasing

        functions of a given level, and additive characters of matrices modulo 𝔪. It also proves that

        multiplication by a theta kernel `New.modKernel` preserves level N. Here the kernel''s finite datum

        is a function on matrices modulo 𝔪, and 𝔪 is generated by N. This needs the character `b` to have a

        tame part that is trivial off the places of 𝔪.

        '
    remainder:
      path: grh/src/Lib/Weil/DualPair/HolomorphicData.lean
      line: 12
      endLine: 48
      text: "\n## Main definitions and results\n\n* `New.Rows.holomorphicData`: Fock vectors all of whose matrix\
        \ coefficients on the first group are\n  holomorphic of weight u. `New.Rows.prod_mem_holomorphicData` and\n\
        \  `New.Rows.mem_holomorphicData_of_highestVector` give such vectors.\n* `New.Rows.IsAdelicHol`: adelic\
        \ functions holomorphic in the archimedean variable.\n  `New.Rows.isAdelicHol_pairTheta` passes from a holomorphic\
        \ vector to its theta kernel.\n* `New.Rows.rapidOfLevel`: rapidly decreasing automorphic functions (members\
        \ of `V.rapidFunctions`)\n  of a given level. The set is closed under conjugation, and `New.Rows.mul_sum_mem_rapidOfLevel`\n\
        \  treats products with linear combinations.\n* `New.Rows.mul_modKernel_mem_rapidFunctions`, `New.Rows.mul_modKernel_mem_rapidOfLevel`:\n\
        \  multiplying by the kernel in the first variable keeps rapid decay, and keeps the level `N` if `N`\n \
        \ generates the modulus.\n\nNotions from other files:\n* `New.PairFock`: The Fock space for the signs s′_i\
        \ s_j of the pair, at all infinite places.\n* `New.Space`: A hermitian space over E; its automorphic functions\
        \ live on the adelic group `New.G`,\n  and `New.Space.IsRapid` is decay faster than every power of the height.\n\
        * `New.pairTheta`: The theta kernel θ(ω_{a,b}(g,h)f) of two hermitian spaces; `New.modKernel` is\n  this\
        \ kernel for the datum made of a function on matrices modulo \U0001D52A and the Fock vector of a\n  polynomial.\n\
        * `New.AutChar.HasWeight b e ψ`: The character b has weight e at the infinite places and tame part\n  ψ,\
        \ given by a character of each residue field.\n\n## Relation to the literature\n\nKnown result: Harmonic\
        \ highest vectors for (U(p,q), U(n)) give holomorphic vectors. Proves a special\ncase: highest vectors,\
        \ such as products of leading minors, that are killed by each mixed\nsecond derivative ∂²/∂x_{ca}∂x_{cb}\
        \ with a, b of opposite signs have matrix coefficients that extend\nholomorphically with an explicit weight.\
        \ This hypothesis is stronger than pluriharmonic in the sense\nof Kashiwara–Vergne, where only the sums\
        \ over c must vanish. Source: M. Kashiwara, M. Vergne, On the\nSegal–Shale–Weil representations and harmonic\
        \ polynomials, Invent. Math. 44 (1978) 1–48, III 6.3,\n7.2; M. G. Davidson, The harmonic representation\
        \ of U(p,q) and its connection with the generalized\nunit disk, Pacific J. Math. 129 (1987) 33–55.\n\nSee\
        \ also `Lib.Weil.DualPair.ThetaLiftConvergence`.\n"
