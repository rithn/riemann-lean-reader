      text: 'The adelic Heisenberg datum β = `New.adelicHeisenberg E s` on `𝔸 ^ n`, with vacuum function e =

        `New.vacuumFn`, splits into a real and a finite part. The data of the adelic Weil representation

        (measure, multiplier Δ and action of the adelic unitary group `New.G E s`) are built as products of

        the real and the finite data. For a hermitian space with a point `V` (`New.Space`), the space

        `New.𝒮 V`, whose vectors are also called data, is the model `Model (adelicHeisenberg E s)`. It

        carries the Heisenberg operators `New.Space.ϱ` (`ρ x` or `heisenbergOp x` on the model), the Weil

        representation `New.Space.ω`, the inner product `New.Space.dataInner` (`⟨·, ·⟩`, conjugate linear on

        '
    remainder:
      path: grh/src/Lib/Weil/Construction/AdelicRepresentation.lean
      line: 15
      endLine: 54
      text: "the left) and the vacuum `New.Space.vacElem`. A theta functional is a bounded functional on the\nmodel\
        \ that is invariant under the rational vectors `New.Space.ratVectors` and normalised;\n`New.Space.θ` is\
        \ a definite choice of one. A vector `f : \U0001D4AE V` applied to `x` is its theta function\nθ(ϱ(x) f),\
        \ not the integrable function `f.1 x = ⟨ϱ(x) vac, f⟩`.\n\n## Main definitions and results\n\n* `New.adelicSum`:\
        \ multiplication by the idele `New.WeilData.scaleIdele` identifies complex\n  coordinates, indexed by pairs\
        \ (infinite place, index), times finite adelic vectors with `\U0001D538 ^ n`.\n  The bicharacter and `New.vacuumFn`\
        \ become products of those of `New.Fock.realHeisenberg` and\n  `New.stdLattice.finHeisenberg` (`New.Heisenberg.OrthogonalSum`).\
        \ This scaling turns the adelic\n  Gaussian into the standard one (`New.WeilData.conj_scaleIdele_mul`).\n\
        * `New.adelicAction`: the adelic unitary group `New.G` acts on `\U0001D538 ^ n` by matrices, keeping the\n\
        \  bicharacter and the measure, and `Δ` satisfies the identity of `New.Heisenberg.MultiplierAction`\n  with\
        \ trivial cocycle.\n* `New.Space.omega_rho`, `New.Space.dataInner_omega`, `New.Space.dataInner_vacElem_omega_vacElem`:\n\
        \  `ω g` takes `ϱ x` to `ϱ (g x)`, keeps the inner product, and has overlap `(conj (Δ g))⁻¹` with the\n\
        \  vacuum.\n* `New.Space.exists_isThetaFunctional`, `New.Space.IsThetaFunctional.eq_smul`: a theta functional\n\
        \  exists, and every invariant functional is a multiple of it.\n* `New.Space.dataInner_eq_quotMean`, `New.Space.hasSum_dataInner`:\
        \ the inner product as a mean of\n  theta functions, and the product of two theta values as a sum of inner\
        \ products.\n\nNotions from other files:\n* `New.adelicHeisenberg`: the Heisenberg datum on adelic n-space\
        \ with bicharacter β(x,y)=ψ(½ȷ\n  h(y,x)), h being the standard hermitian form of signs s and ȷ = −ȷ̄ the\
        \ element `j` of the Weil\n  data.\n* `New.Heisenberg.OrthogonalSum`: an isomorphism W₁ × W₂ ≃ W along which\
        \ the bicharacter and the\n  vacuum function of W are the products of those of W₁ and W₂.\n* `New.Heisenberg.MultiplierAction`:\
        \ an action of a group on W that keeps β and the measure, with a\n  multiplier Δ that satisfies the cocycle\
