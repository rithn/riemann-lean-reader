    excerpt:
      path: grh/src/Lib/Weil/Fock/WeightedNorms.lean
      line: 6
      endLine: 10
      text: 'The Fock space `New.Fock.fockSpace` consists of functions on ℂ^ι reproduced by the Gaussian. This

        file defines weighted L¹ norms ∫ (1 + ‖y‖)^N |v y| dy on it, with values in [0, ∞], and proves

        growth estimates that justify integrals and limits at the real places. Vectors whose moments are all

        finite are approximated in all these norms by polynomial vectors. A functional controlled by its

        differences under short Heisenberg translations is then bounded by moments.

        '
    remainder:
      path: grh/src/Lib/Weil/Fock/WeightedNorms.lean
      line: 11
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.Fock.fockMoment`: the weighted L¹ norm ∫ (1 + ‖y‖)^N |v\
        \ y| dy, with values in [0, ∞];\n  `New.Exchange.IsSchwartzVector`: all these norms are finite (a Schwartz\
        \ vector).\n* `New.Fock.fockMoment_realHeisenbergOp_le`, `New.Fock.fockMoment_realWeil_le`,\n  `New.Fock.fockMoment_integral_le`:\
        \ bounds under the Heisenberg translations\n  `New.Fock.realHeisenbergOp`, the Weil representation `New.Fock.realWeil`,\
        \ and integrals of\n  vectors.\n* `New.Fock.fockMoment_polyVector_ne_top`, `New.Fock.exists_tendsto_fockMoment`:\
        \ the vectors\n  polynomial times Gaussian (`New.Fock.polyVector`) have finite norms, and approximate in\
        \ all norms\n  at once every vector whose norms are finite.\n* `New.Fock.exists_norm_realHeisenbergOp_polyVector_le`:\
        \ for a functional ℓ controlled by its\n  differences under translations of size at most t ≤ 1, the value\
        \ at the translate by z of a\n  polynomial vector is at most C ‖ℓ‖ tᴺ (1 + ‖z‖)ᴺ.\n* `New.Fock.exists_enorm_le_mul_fockMoment_of_norm_sub_le`:\
        \ the bound ‖ℓ v‖ ≤ C ‖ℓ‖ tᴺ times the\n  N-th moment of v, for every vector v.\n\nNotions from other files:\n\
        * `New.Fock.fockSpace`: the Fock space of integrable functions c on ℂ^ι with c(x) = ∫ c(y) β(y,x)\n  e(x−y)\
        \ dy, where e is the Gaussian exp(−|x|²/2), under the L¹ norm.\n* `New.Fock.realHeisenberg`: For signs ε,\
        \ the Heisenberg datum on ℂ^ι given by the continuous\n  unit-modulus bicharacter β(x,y) = exp((y*εx − x*εy)/2)\
        \ = exp(i Im y*εx).\n* `New.Fock.realHeisenbergOp` y: the Heisenberg translation c ↦ (z ↦ β(y,z) c(z − y))\
        \ on the Fock\n  space.\n* `New.Fock.vacVector`: the Gaussian `New.Fock.realVac` as a vector of the Fock\
        \ space.\n* `New.Fock.holomorphicCoord` ε x: the holomorphic coordinates of x, x̄ᵢ where εᵢ = 1 and xᵢ\n\
        \  otherwise.\n\n## Relation to the literature\n\nKnown; see `Lib.Weil.Fock.OscillatorPair` for sources.\n"
