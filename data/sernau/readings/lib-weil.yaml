      text: 'This file proves growth estimates for theta kernels `(g, h) ↦ θ (ω (g, h) φ)` on the product of

        the adelic groups of two spaces `S` and `T`, for a representation `ω`, a functional `θ` and a

        vector `φ`. Using reduction theory, it first bounds the norm of `ω (g₀, γ g)`, for fixed `g₀` and

        a suitable rational translate `γ g`, by a power of the height `New.Space.height` of `g`. The lift

        `New.Space.lift` of a function `y` integrates the kernel against `y g` over `[S] = Γ_S \ G_S`.

        '
    remainder:
      path: grh/src/Lib/Weil/DualPair/ThetaLiftConvergence.lean
      line: 13
      endLine: 39
      text: "For `y` of rapid decay the lift converges, the lifts from `S` and from `T` are transposes of each\n\
        other, and the adjoint of the lift for the Petersson products is the descent.\n\n## Main definitions and\
        \ results\n\n* `New.ThetaKernel.moderate_growth`: the kernel grows at most like a power of the heights\n\
        \  `New.Space.height`.\n* `New.ThetaKernel.integrable_theta_mul`, `New.ThetaKernel.liftBilin`,\n  `New.ThetaKernel.exists_clm_lift`:\
        \ for `y` of rapid decay (`New.Space.rapidFunctions`) the lift\n  converges, is bilinear in `φ` and `y`,\
        \ and is continuous in `φ`.\n* `New.ThetaKernel.integral_mul_lift_eq_integral_mul_lift_swap`,\n  `New.ThetaKernel.petersson_lift_eq_petersson_descent`:\
        \ the lifts from `S` and from `T` are\n  transposes of each other, and the descent is the adjoint of the\
