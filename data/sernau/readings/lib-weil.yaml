      text: "\nThe quadratic Gauss sum that gives the product rule of the Weil representation at the finite places\n\
        is a different one; it is in `Lib.Weil.Construction.FiniteCocycle`.\n\n## Main definitions and results\n\
        \n* `New.Exchange.IntegralFrame`: an integral basis in three blocks of columns `K, I, L` with its dual\n\
        \  basis; `New.Exchange.IntegralFrame.blockRelations` lists the relations between the blocks.\n* `New.Exchange.exists_local_gauss_sum`:\
        \ the Fourier transform of the inverse of a tamely ramified\n  character χ, cut off to the units, equal\
        \ to γ·χ(ϖ t) when ϖ t is an integral unit and zero\n  otherwise, for some γ with ‖γ‖² = 1 / card R.\n*\
        \ `New.Exchange.IntegralFrame.stdDatum`: the function x ↦ G(x (K I)) on integral matrices x, zero\n  elsewhere.\n\
        \nNotions from other files:\n* `New.SemilocalField`: Conditions met by a finite product of non-archimedean\
        \ local fields: a\n  locally compact ring with Haar measure, compact open subring O of volume one, a topologically\n\
        \  nilpotent invertible ϖ in O, and `New.IsValuationPair O`.\n* `New.HasIntegralConductor`: The additive\
        \ character ψ is continuous and has conductor O: ψ is\n  trivial on tO exactly when t lies in O.\n* `New.IsIntegralUnit`\
        \ x: x lies in O and has an inverse in O. `New.IsIntMatrix` O M: every entry of\n  the matrix M lies in\
        \ O.\n\n## Relation to the literature\n\nKnown result: Gauss sums of a character of the determinant over\
        \ matrix rings. Only one-dimensional\nramified characters are treated, and the exact value is not computed.\
        \ For matrices over a finite\nring, the eigen-relation, the vanishing at singular index and the modulus\
        \ are proved in another file\n(`New.Exchange.exists_matrixFourier_eq_mul_inv_det`, used here). This file\
        \ proves the scalar case\nover the integers of a product of local fields, with the modulus. Source: T. Kondo,\
        \ On Gaussian sums\nattached to the general linear groups over finite fields, J. Math. Soc. Japan 15 (1963)\
        \ 244–255; for\nthe scalar case over finite rings, E. Lamprecht, Math. Nachr. 9 (1953), see K. Conrad, Gauss\
        \ and\nJacobi sums on finite fields and Z/mZ, §4; for the local scalar case, Tate's thesis §2.5.\n\nSee\
        \ also `Lib.Weil.MixedModel.ZeroTerm`.\n"
