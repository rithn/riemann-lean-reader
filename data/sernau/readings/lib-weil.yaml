      endLine: 12
      text: 'This file defines the predicate `New.SiegelWeil.DescentsVanish`, the vanishing of all theta descents

        of a function on `U(V)(𝔸)` to `U(W)(𝔸)` for data that are vacua above given places. It studies the

        Fourier coefficients of theta lifts between unitary groups along the centre of the unipotent

        radical. These coefficients are written as sums over rational frames. Then, for an invertible Gram

        matrix, Witt''s theorem writes them as integrals modulo a stabiliser.

        '
    remainder:
      path: grh/src/Lib/Weil/Periods/DescentVanishing.lean
      line: 13
      endLine: 48
      text: "\n## Main definitions and results\n\n* `New.SiegelWeil.DescentsVanish`: the descents of `Y` vanish\
        \ for all data that are vacua above the\n  places of `S`.\n* `New.Space.Splitting.centreCoeff_integral_eq_tsum`:\
        \ the coefficient at `j β` keeps the frames `x`\n  with Gram matrix `β`.\n* `New.SiegelWeil.integral_blockEmb_eq_zero_of_descentsVanish`:\
        \ split `V = V″ ⊕ V°` into blocks of\n  ranks `n₁` and `n₂`. Let `o₁` be the frame of `V″` and `I(h)` the\
        \ period over `[U(V°)]` of the\n  right translate by `h`. The vanishing of a Fourier coefficient of the\
        \ descents makes `I`, times a\n  weight, orthogonal to every additive character of the frame `h⁻¹ o₁` that\
        \ ignores its components\n  at the places of `T` and their conjugates, hence, by Stone–Weierstrass, to every\
        \ continuous\n  function of these characters. On the support of the weight `I` is such a function, so it\
        \ vanishes\n  there.\n\nNotions from other files:\n* `New.\U0001D4AE`: the Banach space of data on which\
        \ the Weil representation of a hermitian space acts;\n  `New.Space.projOn` projects it on the vectors that\
        \ are vacua above a set of finite places and\n  their conjugates.\n* `New.pairTheta W V a b f`: the theta\
        \ kernel on `U(W)(\U0001D538) × U(V)(\U0001D538)` of a datum `f` on `Hom(W, V)`,\n  twisted by the characters\
        \ `a`, `b` of `U(1)`. `New.pairThetaKer` bundles it, and `New.Space.lift`\n  for `(pairThetaKer W V a b).swap`\
        \ integrates a function on `U(V)(\U0001D538)` against it.\n* `New.Space.Splitting.radicalCentre`: the parametrisation\
        \ of the centre of the unipotent radical by\n  adelic `p × p` matrices; `centreCoeff T F g` is the mean\
        \ of `ψ (tr (T M)) * F (z M * g)` over the\n  `M` modulo rational matrices, `z` being this parametrisation.\n\
        * `New.WeilData.upsilonU1`: the restriction of the splitting character υ to the norm-one ideles.\n\n## Relation\
        \ to the literature\n\nKnown result: Fourier coefficients of theta lifts as periods over stabilisers. Here\
        \ a single\nnon-degenerate coefficient of a theta lift to a split unitary group is unfolded once by Witt's\n\
        theorem. Hence a form on the definite U(n) orthogonal to the theta kernels of the split space has\nzero\
        \ period over the complementary unitary group. Source: P. Walls, The theta correspondence,\nperiods of automorphic\
        \ forms and special values of standard automorphic L-functions, arXiv\n1501.01565 (2015), Prop. 2.1.1; S.\
        \ Rallis, On the Howe duality conjecture, Compositio Math. 51\n(1984) 333–399.\n"
