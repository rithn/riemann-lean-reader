        \  which `q` has valuation `1`.\n* `New.Grading.exists_finite_representatives`: let `E` contain a primitive\
        \ root of unity of order\n  5040, let `q` be invertible and have valuation `1` outside `Q`. Among the double\
        \ cosets under the\n  finite Bessel subgroup and the stabiliser of the standard lattice, those with bounded\
        \ orbit have\n  finitely many representatives, supported on `Q ∪ Q̄`.\n\nNotions from other files:\n* `New.Grading`:\
