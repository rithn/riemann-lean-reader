      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.AutChar.frobValue`: the complex number `χ(ϖ_w) q_w^(N/2)`,\
        \ with\n  `χ = New.AutChar.spaceChar a N` and `N = Fintype.card n`.\n* `New.SiegelWeil.heckePolyOp_pairWeilTarget`:\
        \ the identity on the vacuum.\n  `New.SiegelWeil.hecke_transfer_of_equivariant` is its image under an equivariant\
        \ linear map.\n* `New.SiegelWeil.hecke_transfer_of_pairing`, `New.SiegelWeil.lift_swap_heckePolyOp`: the\
        \ transfer\n  through an equivariant bilinear map and through the transposed theta lift.\n* `New.SiegelWeil.hasHeckePolynomial_of_pairing`,\
        \ `New.SiegelWeil.hasHeckePolynomial_formLift`: the\n  Hecke polynomial of a lift.\n* `New.SiegelWeil.hasHeckePolynomial_qPochhammer`:\
        \ the Hecke polynomial of a fixed vector.\n\nNotions from other files:\n* `New.WeilData`: Weil data on a\
        \ stably unramified E. They consist of ȷ in E with ȷ = −ȷ̄, Im τȷ > 0\n  for every τ in the CM type and\
        \ (1 − ȷ⁻¹)/2 integral; a finite idele α for which the completed\n  integers Ô are self-dual under (z, u)\
        \ ↦ ψ_f(ȷαᾱzu); and a splitting character υ equal to −1 at\n  uniformisers of the places w with w = w̄.\n\
        * `New.ofSplitPlace`: the map GL_n(E_w) → G_f, g ↦ the unitary element that is g at w and 1 off w,\n  w̄.\n\
        * `New.LocField`: the completion E_w of E at the finite place w.\n\n## Relation to the literature\n\nKnown\
