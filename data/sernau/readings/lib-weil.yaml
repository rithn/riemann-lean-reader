      text: "`\U0001D49E = New.Grading.agreeingClasses` by the rational points of `U(V')` contribute. This writes\
        \ the\nperiod as a sum of values of `New.Grading.unfoldStep`, and its integral against a rapidly decreasing\n\
        automorphic `y` as an integral of `New.Grading.unfoldStep` times `y`.\n\n## Main definitions and results\n\
        \n* `New.Grading.hasSum_unfoldStep`: for `W` equivariant, the period of `W` against the theta kernel\n \
        \ at `h` is the sum of the values of `New.Grading.unfoldStep` at `γ h` over the rational points `γ`\n  of\
        \ `U(V')`, modulo those of `Y'.besselGroup` on the left.\n* `New.Grading.integral_besselGroup_unfold`: the\
        \ period of `W` against the theta integral of a\n  rapidly decreasing automorphic `y` unfolds to the integral\
        \ of `New.Grading.unfoldStep` times `y`\n  modulo the rational points of `Y'.besselGroup`.\n\nNotions from\
        \ other files:\n* `New.\U0001D4AE`: The Banach space \U0001D4AE(V) of integrable functions c on \U0001D538\
        ^n with c(x) = ∫ c(y)β(y,x)e(x−y) dy,\n  under the L¹ norm; β is the adelic bicharacter and e the vacuum\
        \ function `New.vacuumFn`.\n* `New.Grading.ratBessel`: The rational points of U(V) that lie in the Bessel\
        \ (Fourier–Jacobi)\n  subgroup of the grading Y.\n* `New.Grading.constTerm`: the constant term of `f` at\
        \ `w` along the maps of positive degree.\n* `New.Grading.unfoldStep`: the function `h ↦ ∫ W(r) * Y.constTermAtStringMap\
        \ Y' α f r h dr` on\n  U(V′)(\U0001D538), integrated over the Bessel group of `Y` modulo its rational points.\n\
        * `New.Grading.agreeingClasses`: the set `\U0001D49E` of classes whose chosen representative agrees with\n\
        \  `T = Y.stringMap Y'` (`New.Grading.AgreesWithStringMap`).\n\n## Relation to the literature\n\nTransfer\
        \ of Bessel and Fourier–Jacobi periods under a theta lift (one unfolding step).\nHere the setting is unitary\
        \ pairs and hook orbits with a definite complement, and the Bessel and\nFourier–Jacobi cases are treated\
        \ together. The period is taken against any continuous automorphic\nfunction with the generic unipotent\
        \ character, for a rapidly decreasing form, and the unfolded\nintegral converges absolutely. Source: B.\
        \ Wang Peng Jun, Global theta lifting and automorphic\nperiods associated to nilpotent orbits, J. Number\
        \ Theory 271 (2025) 122–149, Prop. 3.2 and Thm. 4.5;\nfor the local case, R. Gomez, C.-B. Zhu, GAFA 24 (2014)\
        \ 796–853; for unitary hooks, M. Furusawa, K.\nMorimoto, Math. Ann. 391 (2025) §3.\n"
