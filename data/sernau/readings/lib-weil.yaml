        \ and the span of `k`. It studies families obeying the mixed law at adapted points, bounds\nsums of slices\
        \ over rational points and writes θ_V as the sum of θ_{V₀} over the slices.\n\n## Main definitions and results\n\
        \n* `New.Space.Splitting.zeroTerm`: the zero term `\U0001D4AE V → \U0001D4AE V₀`, the mean of `f (ι y +\
        \ k b)` over\n  `b ∈ \U0001D538^p / E^p`; `New.Space.Splitting.slice x` is `D.zeroTerm ∘L V.ϱ (D.lAdelic\
        \ *ᵥ x)`.\n* `New.Space.Splitting.tsum_enorm_slice_le`, `New.Space.Splitting.hasSum_theta_slice`:\n  over\
        \ the rational points `ξ`, `∑_ξ ‖f[ξ]‖ ≤ M ‖f‖` and `θ_V f = ∑_ξ θ_{V₀} (f[ξ])`.\n* `New.Space.Splitting.IsAdapted.slice_omega_vacElem`:\
        \ for `g` adapted to `t`, the slices of\n  ω(g) vac are a nonzero constant times `‖vacuumFn (tᴴ x)‖ ^ 2`\
