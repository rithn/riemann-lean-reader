      line: 6
      endLine: 9
      text: 'For hermitian spaces `S`, `T` (`New.Space`) of ranks `n`, `n''`, the `n'' × n` matrices form a space

        `Hom(S, T)`. The pair `(g, h)` acts on it by `x ↦ h x g⁻¹`. The Weil representation `New.Space.ω` of

        that space restricts to the pair. Theta kernels are also built from a polynomial at the real places

        and a function modulo an ideal at the finite places.

        '
    remainder:
      path: grh/src/Lib/Weil/DualPair/Defs.lean
      line: 10
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.Space.hom`, `New.G.onHom`: the space `Hom(S, T)` and the\
        \ map `U(S) × U(T) → U(Hom(S, T))`.\n* `New.pairWeil S T a b`: the representation of the pair, twisted by\
        \ `a (det h) * b (det g)⁻¹`\n  (`New.pairChar`), for characters `a, b` of `[U(1)]` (`New.AutChar`).\n* `New.pairTheta`:\
        \ the theta kernel, the theta functional `New.Space.θ` of\n  `pairWeil S T a b (g, h) f`.\n* `New.Modulus`:\
        \ a non-zero ideal `\U0001D52A` of `\U0001D4DE E` such that no prime `w` divides it together with the\n\
        \  complex conjugate of `w`; `New.Modulus.ResidueRing` is the finite ring `\U0001D4DE E ⧸ \U0001D52A`,\n\
        \  `New.Modulus.places` the set of primes dividing `\U0001D52A` and `New.Modulus.reduction` a reduction\
        \ map\n  from `New.Ô E`.\n* `New.modDatum`: the vector in the data space of `New.Space.hom S T` with real\
        \ part `v`, with `Ψ`\n  at the primes dividing `\U0001D52A` (`New.Space.schrodingerOp`) and the vacuum elsewhere.\n\
        * `New.modKernel`: its theta kernel `New.pairTheta`, for `v` the Fock vector of a polynomial;\n  `New.stdKernel`:\
        \ this kernel for the standard characters `New.stdChar` of `S` and `T`.\n\nNotions from other files:\n*\
        \ `New.Space`: a hermitian space over a CM field E with `CMType E` (a chosen embedding at each\n  infinite\
        \ place; it contains `NumberField E` and `IsCMField E`), with a point, given by a matrix J\n  over E and\
        \ x in GL_n(\U0001D538) with xᴴJx equal to diag(s), for a sign vector s, at the infinite places\n  and 1\
        \ at the finite places; `\U0001D4AE V` is the data space of such a space V, on which the Weil\n  representation\
        \ acts.\n* `New.WeilData`: the fixed choices that the Weil representation needs, among them a splitting\n\
        \  character `υ` of the ideles of E.\n* `New.AutChar`: a continuous circle-valued character of U(1)(\U0001D538\
        ), the norm-one adeles of E, that is\n  trivial on the elements coming from E.\n* `New.Fock.polyVector`:\
        \ the vector P(ζ(x)) exp(−|x|²/2) of the Fock space, for a polynomial P in\n  the Fock coordinates ζ(x)\
        \ of a real vector x.\n* `New.Space.integrated`: the bilinear map (v, f) ↦ v ⊗ f = ∫ v(y) ϱ(y)f dy over\
        \ real vectors y, for\n  v in the Fock space and f in \U0001D4AE(V), with ϱ the Heisenberg representation\
        \ on \U0001D4AE(V).\n\n## Relation to the literature\n\nKnown; see `Lib.Weil.DualPair.ThetaLiftConvergence`,\
        \ `Lib.Weil.MixedModel.ZeroTerm` and\n`Lib.Adelic.Unitary.WeakApproximation` for sources.\n"
