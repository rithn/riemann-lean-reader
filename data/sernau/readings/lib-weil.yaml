      endLine: 62
      text: "\n## Main definitions and results\n\n* `New.Exchange.modLift`, `New.Exchange.modTransposedLift`: the\
        \ lift of forms from `S` to `T` and\n  the transposed lift back.\n* `New.Exchange.IsConjKernelPair`, `New.Exchange.IsEdgeFamily`:\
        \ a pair of conjugate cuspidal types;\n  a family of characters with common weights for which two such pairs\
        \ and a polynomial form a real\n  edge (`New.IsEdge`). `New.Exchange.isEdgeFamily_of_paramsCorrespond` produces\
        \ edges from\n  corresponding parameters.\n* `New.Exchange.pairLift`, `New.Exchange.pairTransposedLift`,\
        \ `New.Exchange.IsPairEdge`: lift,\n  transposed lift and edge when the two characters of the pair are given\
        \ separately. `IsPairEdge`\n  has one type on each group and lets the two characters have different tame\
        \ parts.\n* `New.Exchange.IsEdgeFamily.exists_lift_eq_realConv`,\n  `New.Exchange.IsEdgeFamily.petersson_lift_eq_mul_inner_modTransposedLift`:\
        \ replacing the\n  polynomial of the edge by another one changes the lift by right convolution with a continuous\n\
        \  compactly supported function on the real points; the Petersson product of a form with this lift is\n\
        \  a constant times that of its transposed lift. The function and the constant do not depend on the\n  finite\
        \ data.\n* `New.Space.periodPairing`: the bilinear period `∫ M z * f z * y (j z * r)` of a form `f` on `S`\n\
        \  and a form `y` on `T`, for a moderate weight with function `M` and map `j` and a real point `r`.\n* `New.Exchange.seesaw_periods`:\
        \ suppose the theta kernels of two pairs agree up to moderate weights\n  on a spanning set of polynomials\
        \ (`New.Exchange.IsSeesawMatched`). Then proportionality to a fixed\n  vector passes from the periods of\
        \ lifts (`New.Exchange.modLift`) to the periods of transposed\n  lifts (`New.Exchange.modTransposedLift`).\n\
        \nNotions from other files:\n* `New.Space`: a hermitian space with a point, given by a matrix J over E and\
        \ x in GL_n(\U0001D538) with xᴴJx\n  equal to diag(s) at the infinite places (s the signs) and 1 at the\
        \ finite places.\n* `New.IsEdge`: a relation between kernels e, e' on the two real groups and a Fock vector\
        \ Φ. The\n  kernel e is a cusp kernel and the doubling zeta integral of Φ against ē is not zero. For a form\
        \ of\n  type e, the lift with Φ is a form of type e' if it has a level, and for a polynomial v the lift\n\
        \  with v is the convolution of the lift with Φ by some α ∈ C_c. The same holds with the groups\n  exchanged\
        \ and the kernels ē', ē.\n* `New.IsArrow`: the datum φ is an arrow e → e' for the theta kernel K if forms\
        \ of type e on S are\n  rapid and their lifts by φ are forms of type e' on T.\n* `New.Space.Form`: `S.Form\
        \ e` is the space of bounded automorphic functions on the group of `S`\n  that right convolution with `e`\
        \ fixes (when `e` is integrable).\n* `New.modKernel`: the theta kernel of the datum `New.modDatum` made\
        \ of the Fock vector of a\n  polynomial and a function on matrices modulo `\U0001D52A`. Along an edge the\
        \ lift and the transposed lift\n  integrate a form against this kernel, in the first and in the second variable.\n\
        \n## Relation to the literature\n\nKnown result: Seesaw identity for periods of theta lifts. Here the statement\
        \ holds for two unitary\npairs whose kernels agree up to moderate factors for a spanning set of Fock polynomials.\
        \ Both pairs\ncarry edge families (`IsEdgeFamily`), and the data are taken modulo an ideal. If finite sums\
        \ of\nperiods of the lift are proportional to a fixed family of numbers at all real translates, then so\n\
        are those of the transposed lift. Source: S. Kudla, Seesaw dual reductive pairs, in Automorphic\nforms of\
        \ several variables (Katata 1983), Progr. Math. 46, Birkhäuser 1984, 244–268.\n\nSee also `Lib.Weil.Lift`.\n"
