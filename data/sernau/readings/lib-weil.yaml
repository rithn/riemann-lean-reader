        \ and 1 at the finite places; Γ = x⁻¹U(J)(E)x.\n* `New.Space.IsAutomorphic`, `New.Space.IsRapid`: a function\
        \ F is automorphic if it is continuous,\n  left Γ-invariant and right invariant under an open subgroup of\
