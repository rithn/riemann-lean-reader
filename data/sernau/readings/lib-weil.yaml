    excerpt:
      path: grh/src/Lib/Weil/Construction/HeisenbergModel.lean
      line: 6
      endLine: 10
      text: 'This file sets up an abstract setting for the Weil representation that covers the real places

        and the adeles. The data are a topological abelian group `W` with a measure `μ`, a Heisenberg

        cocycle `β` on `W`, and a vacuum `e` for it. It also defines multiplier actions of a group `G` on

        `W`. The vacuum defines a space of integrable functions reproduced by a kernel, on which `W` acts

        by a Heisenberg representation `ρ`. The file proves superposition and Schur''s lemma for this model.

        '
    remainder:
      path: grh/src/Lib/Weil/Construction/HeisenbergModel.lean
      line: 11
      endLine: 30
      text: "\n## Main definitions and results\n\n* `New.Heisenberg W`: a continuous alternating bicharacter `β`,\
        \ the cocycle of a Heisenberg group.\n* `New.Heisenberg.IsVacuum`: a function `e` on `W` that plays the\
        \ part of the matrix coefficient of\n  a vacuum vector (a Gaussian, or a lattice indicator times a semicharacter).\n\
        * `New.Heisenberg.MultiplierAction`: a group `G` acting on `W` by symmetries, with a multiplier `Δ`\n  that\
        \ turns a double integral of `e` and `β` attached to the action into a given `c` (by default\n  `1`).\n\
        * `New.Heisenberg.IsVacuum.Model`: integrable v with v x = ∫ v y β(y, x) e(x - y), a Banach space\n  for\
        \ the L¹ norm, with the representation `New.Heisenberg.IsVacuum.heisenbergRep`, the vector\n  `New.Heisenberg.IsVacuum.vacElem`\
        \ and the form `New.Heisenberg.IsVacuum.modelInner`.\n* `New.Heisenberg.IsVacuum.form_eq_mul_modelInner`,\n\
        \  `New.Heisenberg.IsVacuum.eq_smul_one_of_commute`: Schur's lemma. An invariant form is a multiple\n  of\
        \ the inner product, and a bounded operator that commutes with the representation is a scalar.\n  `New.Heisenberg.IsVacuum.integral_form_eq_mul_modelInner`\
        \ treats a form given as an integral.\n\n## Relation to the literature\n\nKnown; see `Lib.Weil.Construction.WeilOperators`\
        \ for sources.\n"
