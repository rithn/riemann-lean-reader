    excerpt:
      path: grh/src/Lib/Weil/Construction/VacuumProjections.lean
      line: 8
      endLine: 13
      text: 'This file studies the projection P^S = `New.Space.projOn` S on the vectors that are vacua above a

        set S of finite places. It shows that P^S is a self-adjoint projection and relates it to the

        Heisenberg operators and to the Weil representation. It defines the finite part

        `New.Space.finitePart` and shows that this subspace is stable under ϱ_f, under the projections and

        under the finite unitary group. It also shows that the translates of the vacuum by representatives

        modulo Ô^n form an orthonormal spanning family of the finite part.

        '
    remainder:
      path: grh/src/Lib/Weil/Construction/VacuumProjections.lean
      line: 14
      endLine: 49
      text: "\nThe Weil representation ω of the adelic unitary group acts on \U0001D4AE(V) = `New.\U0001D4AE`, together\
        \ with the\nHeisenberg operators ϱ(y) = `New.Space.ϱ` y. The operators of finite vectors,\nϱ_f = `New.Space.finHeisenbergOp`,\
        \ are normalised to represent Ô^n = `New.stdLattice`:\nϱ_f(y) = `semichar` y • ϱ(`finVec` y), where finVec\
        \ y has real part 0 and finite part αy (α the\nfinite idele of the Weil data) and `semichar` y is a root\
        \ of unity, and vac = `New.Space.vacElem` is\nthe vacuum; ψ₀ = `selfDualAddChar E` is a character of \U0001D538\
        f E trivial on Ô, `half` is ½, and\n`traceOneAdele` t satisfies t + t̄ = 1. For a set S of finite places\
        \ of E, P^S = `New.Space.projOn`\nS is the mean of ϱ_f(`idem` T • y) over y ∈ Ô^n, where `idem` T is the\
        \ finite adele equal to 1 above\nT and 0 elsewhere, for T = S ∪ S̄ = `Set.conjClosure` S; it projects onto\
        \ the vectors that are vacua\nabove S. The finite part `New.Space.finitePart` is the span of the ϱ_f-translates\
        \ of vac.\n\n## Main definitions and results\n\n* `New.Space.omega_projOn`, `New.Space.projOn_omega`: ω(g)\
        \ commutes with P^S if g is integral on S;\n  P^S ω(g) is a scalar on the image of P^S if g is supported\
        \ above S.\n* The finite part is stable under ϱ_f, under the projections `New.Space.projOn` and under the\
        \ finite\n  unitary group (`New.Space.omega_mem_finitePart`). The real vacuum projection `New.Space.projReal`\n\
        \  fixes it.\n* `New.Space.dataInner_finHeisenbergOp_rep_vacElem`, `New.Space.span_finHeisenbergOp_rep_vacElem`:\n\
        \  the translates of vac by representatives of the classes modulo Ô^n are orthonormal and span the\n  finite\
        \ part.\n* `New.Space.exists_eq_smul_omega_vacElem`: a vector of the finite part fixed by the lattice `g\
        \ Ô^n`\n  is a multiple of `ω(g) vacElem`.\n\nNotions from other files:\n* `New.Space`: a hermitian space\
        \ with a point, given by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal to the diagonal\
        \ matrix of its signs at the infinite places and 1 at the finite places.\n* `New.\U0001D4AE`: The Banach\
        \ space \U0001D4AE(V) of integrable functions c on \U0001D538^n with c(x) = ∫ c(y)β(y,x)e(x−y) dy,\n  under\
        \ the L¹ norm; β is the adelic bicharacter and e the vacuum function `New.vacuumFn`.\n* `New.Space.vacElem`:\
        \ The vacuum: the function e (Gaussian times twisted lattice indicator) as an\n  element of \U0001D4AE(V).\n\
        \n## Relation to the literature\n\nKnown; see `Lib.Weil.MixedModel.ZeroTerm` and `Lib.Weil.Fock.OscillatorPair`\
        \ for sources.\n"
