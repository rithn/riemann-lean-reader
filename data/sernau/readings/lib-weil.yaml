      endLine: 59
      text: "\n## Main definitions and results\n\n* `New.Space.Splitting.zeroTerm_omega_levi`: on the Levi subgroup,\
        \ ev ω(g) = χ_\U0001D538(det a)⁻¹ ω(g₀) ev.\n  The modulus of the scalar comes from `New.Space.Splitting.integral_dataInner_slice`.\
        \ Its phase\n  comes from `New.Space.Splitting.exists_hyperbolic_levi_multiplier_nonneg`.\n* `New.Space.theta_omega_ratEmbed`:\
        \ θ is invariant under the rational unitary group, acting through\n  `New.Space.ratEmbed` and `New.Space.ω`.\
        \ On a split space two opposite parabolic subgroups fix θ\n  and generate the group (`New.Space.theta_omega_ratEmbed_of_splitting`).\
        \ The general case follows\n  by doubling: `V ⊕ V⁻` is split, and `γ` acts on it as `(γ, 1)`.\n\nNotions\
        \ from other files:\n* `New.Space`: a hermitian space with a point, given by a matrix J over E and x in\
        \ GL_n(\U0001D538) with xᴴJx\n  equal to diag(s) at the infinite places and 1 at the finite places.\n* `New.\U0001D4AE\
        `: The Banach space \U0001D4AE(V) of integrable functions c on \U0001D538^n with c(x) = ∫ c(y)β(y,x)e(x−y)\
        \ dy,\n  under the L¹ norm; β is the adelic bicharacter and e the vacuum function `New.vacuumFn`.\n* `New.Space.Splitting`:\
        \ A decomposition V = (lE^p ⊕ kE^p) ⊥ ιV₀ over E: isotropic frames l, k with\n  l*Jk = 1, an isometry ι\
        \ from V₀ orthogonal to both, and rk V = rk V₀ + 2p.\n* `New.WeilData`: Weil data on a stably unramified\
        \ E. They consist of ȷ in E with ȷ = −ȷ̄, Im τȷ > 0\n  for every τ in the CM type and (1 − ȷ⁻¹)/2 integral;\
        \ a finite idele α for which the completed\n  integers Ô are self-dual under (z, u) ↦ ψ_f(ȷαᾱzu); and a\
        \ splitting character υ equal to −1 at\n  uniformisers of the places w with w = w̄.\n* `New.Space.Splitting.zeroTerm`,\
        \ `New.Space.Splitting.slice` (in `Lib.Weil.MixedModel.ZeroTerm`):\n  the zero term ev : \U0001D4AE V →\
        \ \U0001D4AE V₀, the integral of `f (ι y + k b)` over `b ∈ \U0001D538^p`, and the slice\n  f[x] = ev(ϱ(l\
        \ x) f).\n\n## Relation to the literature\n\nKnown result: Schrödinger and mixed models of the Weil representation\
        \ and the action of parabolic\nsubgroups. Here the groups are adelic unitary groups of spaces `New.Space`\
        \ over a CM field with\n`New.WeilData`, and the vectors have integrable coefficients instead of being Schwartz\
        \ functions.\nThe representation is normalised by its vacuum coefficient, so the formulas for the parabolic\n\
        subgroup are proved rather than taken as the definition. Source: C. Mœglin, M.-F. Vignéras, J.-L.\nWaldspurger,\
        \ Correspondances de Howe sur un corps p-adique, LNM 1291, 1987; S. Kudla, Splitting\nmetaplectic covers\
        \ of dual reductive pairs, Israel J. Math. 87 (1994) 361–401; A. Weil, Acta Math.\n111 (1964) n° 16–19,\
        \ 41.\n\nKnown result: Adelic Weil representation of a unitary group and the invariant theta functional.\
        \ Here\nthe CM fields have enough roots of unity and carry a splitting character and a self-dual rank-one\n\
        lattice, and the Weil representation is built without a polarisation. Vectors are integrable\ncoefficients\
        \ against a vacuum, the splitting is fixed by the vacuum coefficient, and the sign of the\nfinite cocycle\
        \ comes from a congruence modulo 4. Source: A. Weil, Sur certains groupes d'opérateurs\nunitaires, Acta\
        \ Math. 111 (1964), n° 16-19 Thm 4, n° 41 Thm 6; S. Kudla, Splitting metaplectic\ncovers of dual reductive\
        \ pairs, Israel J. Math. 87 (1994) 361-401; H. Reiter, Metaplectic Groups and\nSegal Algebras, LNM 1382\
        \ (1989) (space of data, after H. Feichtinger, On a new Segal algebra,\nMonatsh. Math. 92 (1981)); E. Zelenov,\
        \ p-adic Heisenberg group and Maslov index, Comm. Math. Phys.\n155 (1993) 489-502, Prop. 4 (cocycle of three\
        \ lattices); Robinson and Rawnsley, Mem. AMS 410 (1989)\n(real normalisation).\n"
