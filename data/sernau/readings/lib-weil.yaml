      line: 13
      endLine: 36
      text: "\n## Main definitions and results\n\n* `New.Grading.isCocompact_ratBessel`: the adelic group `B` is\
        \ compact modulo its rational points.\n* `New.Grading.besselMeasure`: the measure that integrates over `B`\
        \ modulo its rational points.\n* `New.Grading.integral_besselMeasure_eq_of_mean`: such an integral is a\
        \ fixed multiple of an\n  integral over `U(X)` modulo its rational points, after averaging over the row\
        \ of the unipotent\n  part.\n* `New.Grading.Survives`: no unipotent twist kills the term at `w`.\n* `New.Grading.exists_agreesWithStringMap`:\
        \ a rational `w` that is not killed can be moved by a\n  rational unitary element of `V'` to a map of type\
        \ `New.Grading.AgreesWithStringMap`;\n  `New.Grading.agreesWithStringMap_mul_iff`: that element is unique\
        \ up to `Y'.besselGroup`.\n* `New.Grading.hasDegreeGe_of_survives`: a map of type `New.Grading.AgreesWithStringMap`\
