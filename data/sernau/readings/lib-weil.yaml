      text: "\n## Main definitions and results\n\n* `New.flipCoords`: the adjoint, twisted by the idele `New.flipIdele`,\
        \ as a change of coordinates\n  `New.CoordChange`; it depends on a unit `c` of `Ô` with `c̄ c = -1`. `New.Seesaw.flipSpace`\
        \ is the\n  opposite space `V⁻`.\n* `New.flipCoords_map_pairWeil`, `New.exists_theta_flipCoords_map_eq_mul`,\n\
        \  `New.flipCoords_map_schrodingerOp`: it intertwines the actions of the pairs once the characters\n  are\
        \ changed, keeps the theta functional up to a number of modulus one, and moves a datum to the\n  conjugate\
        \ places.\n* `New.exists_pairTheta_flip`: the resulting identity of theta kernels, after a change of point.\n\
        * `New.Modulus.exists_modKernel_flip`: a kernel `New.modKernel` of (V, S) as a constant times a\n  kernel\
        \ of (S, T), where V has the signs opposite to T.\n* `New.Exchange.exists_conj_modKernel_eq_swap`: the complex\
        \ conjugate of a kernel of (S, T) as a\n  kernel of (T, S).\n\nNotions from other files:\n* `New.WeilData`:\
        \ Weil data on a stably unramified E. They consist of ȷ in E with ȷ = −ȷ̄, Im τȷ > 0\n  for every τ in the\
        \ CM type and (1 − ȷ⁻¹)/2 integral; a finite idele α for which the completed\n  integers Ô are self-dual\
        \ under (z, u) ↦ ψ_f(ȷαᾱzu); and a splitting character υ equal to −1 at\n  uniformisers of the places w\
        \ with w = w̄; its restriction to the norm-one ideles is\n  `New.WeilData.upsilonU1`.\n* `New.Modulus`:\
        \ a nonzero ideal \U0001D52A of O_E prime to its complex conjugate; `\U0001D52A.ResidueRing` is O_E/\U0001D52A\
        ,\n  `\U0001D52A.generator` a finite idele generating \U0001D52A in Ô, equal to 1 off \U0001D52A, and `\U0001D52A\
        .primAddChar` the\n  primitive additive character x ↦ ψ_f(ȷαᾱ x / \U0001D52A.generator) of O_E/\U0001D52A\
        .\n* `New.Space`: a hermitian space with a point, given by a matrix J over E and x in GL_n(\U0001D538) with\
        \ xᴴJx\n  equal to the diagonal matrix of its signs at the infinite places and 1 at the finite places.\n\
        * `New.\U0001D4AE`: The Banach space \U0001D4AE(V) of integrable functions c on \U0001D538^n with c(x) =\
        \ ∫ c(y)β(y,x)e(x−y) dy,\n  under the L¹ norm; β is the adelic bicharacter and e the vacuum function `New.vacuumFn`.\n\
        * `New.pairWeil`: The action ω_{a,b}(g, h) = χ_{a,b}(g, h) ω(x ↦ hxg⁻¹) on \U0001D4AE(Hom(S, T)), where\n\
        \  χ_{a,b}(g, h) = a(det h) b(det g)⁻¹ is `New.pairChar`. The theta kernel `New.pairTheta` S T a b f\n \
        \ (g, h) is θ(ω_{a,b}(g, h) f), where θ is the theta functional `New.Space.θ`.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.Weil.DualPair.ThetaLiftConvergence` for sources.\n"
