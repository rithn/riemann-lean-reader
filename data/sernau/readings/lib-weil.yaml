      endLine: 12
      text: 'This file treats the matrix action of the finite unitary group `New.Gf` on the finite Heisenberg

        datum `New.stdLattice.finHeisenberg` of vectors `ι → 𝔸f E`, with vacuum `New.stdLattice.finVac` and

        multiplier `New.finMultiplier`. We write `Ô` for `New.Ô E`, `ψ₀` for

        `New.stdLattice.selfDualAddChar E`, `x* y` for `star x ⬝ᵥ y`, and `c₀` for `WeilData.traceOne`.

        The double integral in the resulting cocycle is a finite Gauss sum, and the cocycle equals `1`.

        '
    remainder:
      path: grh/src/Lib/Weil/Construction/FiniteCocycle.lean
      line: 13
      endLine: 35
      text: "\n## Main definitions and results\n\n* `New.stdLattice.exists_gauss_sum_finProjAction`: the double\
        \ integral in the cocycle is a Gauss sum\n  over a finite module over `New.Ô`, the ring of integral finite\
        \ adeles.\n* `New.stdLattice.mem_cocycleRadical`: the cocycle is `1` at all `g` and `s`.\n* `New.finAction`:\
        \ the same action with cocycle `1`, as used for the adelic Weil representation.\n\nNotions from other files:\n\
        * `New.WeilData`: Weil data on a CM field E: ȷ in E with ȷ = −ȷ̄, a finite idele α for which Ô is\n  self-dual\
        \ under (z, u) ↦ ψ_f(ȷαᾱzu), and a splitting character υ.\n* `New.Heisenberg.IsVacuum`: a vacuum for β and\
        \ μ is a continuous, integrable, even, real function e\n  with e(0) = 1 and ∫ e(z)e(x−y−z)β(z,y)β(z+y,x)\
