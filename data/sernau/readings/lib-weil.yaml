      line: 9
      endLine: 14
      text: 'This file studies theta lifts between spaces of automorphic forms on unitary groups. Over the reals,

        `Ω` assigns operators on a Fock space to the points of a pair of real unitary groups, and `e`, `e''`

        are kernels on the two groups; the forms of parameter `l` are those of type `New.typeKernel l s`. A

        half edge relates `e` to `e''` through a Fock vector `Φ` and its lifts; an edge does so in both

        directions. Edges together with finite data give arrows, data for which the global lift sends forms

        to forms. The lift is equivariant under the finite points. The transposed lift is the lift for the

        '
    remainder:
      path: grh/src/Lib/Weil/Lift.lean
      line: 15
      endLine: 54
      text: "swapped kernel, and the descent `y' ↦ conj (transposed lift of conj y')` is the adjoint of the lift.\n\
        \n## Main definitions and results\n\n* `New.isJointHighest_prod_det_pow_staircaseWeight`: a product of powers\
        \ of nested minors, one nest\n  for each sign, is nonzero, harmonic for both groups, and a highest weight\
        \ vector for the rows and\n  for the columns.\n* `New.ParamsCorrespond`, `New.jointHarmonic`: parameters\
        \ `l`, `l'` that correspond at every\n  infinite place, and a chosen product of joint harmonics (`New.IsJointHarmonic`)\
        \ for them.\n* `New.IsHalfEdge`, `New.IsEdge`: `e` is a cusp kernel, and the integral of `⟨Φ, Ω (x, 1) Φ⟩`\n\
        \  against `conj e` is not zero. The lift with `Φ` of a form of type `e` is a form of type `e'` once\n \
        \ it has a level. The lift with each polynomial Fock vector is a real convolution of it. An edge has\n \
        \ this both ways.\n* `New.ParamsCorrespond.isEdge_jointHarmonic`: for corresponding parameters the chosen\
        \ product is\n  an edge for the real Weil representation.\n* `New.formLift`, `New.IsArrow`: the lift on\
        \ forms, and the data φ for which it sends forms of type\n  e to forms of type e'.\n* `New.IsEdge.isArrow`,\
        \ `New.IsEdge.isForm_star_lift_swap`: an edge tensored with any finite datum\n  gives arrows in both directions,\
        \ and the descent sends forms of type e' to forms of type e.\n\nNotions from other files:\n* `New.Space`,\
        \ `New.Space.lift`: a hermitian space with a point, given by a matrix J over E and x in\n  GL_n(\U0001D538\
        ) with xᴴJx equal to diag(s) at the infinite places and 1 at the finite places; the theta\n  lift h ↦ ∫_{[S]}\
        \ θ(ω(g, h)φ) y(g) dg of y with datum φ.\n* `New.Space.IsForm`, `New.typeKernel`: a form of type e is a\
        \ bounded automorphic function that\n  right convolution (`New.realConv`) with e fixes; `typeKernel l s`\
        \ is the product over the infinite\n  places of the kernels `dsKernel` with parameters l.\n* `New.Fock.fockSpace`,\
        \ `New.Fock.polyVector`, `New.Fock.piTensor`: the Fock space on ℂ^ι with its\n  L¹ norm, the vector (polynomial\
        \ times Gaussian) of a polynomial, and the product of Fock vectors\n  in separate variables.\n* `New.integratedRep`:\
        \ for a representation π of U(diag ε) by bounded operators and a function f,\n  the operator π(f) with π(f)x\
        \ = ∫ f(g)π(g)x dg, when such a bounded operator exists.\n\n## Relation to the literature\n\nKnown result:\
        \ Joint harmonics and global theta lifts between discrete series types. Here the\nparameter has large gaps,\
        \ and the types are given by integrable projector kernels. The lift is shown\nto carry forms fixed by one\
        \ kernel to forms fixed by the other, in both directions, without Howe\nduality. Source: J.-S. Li, Theta\
        \ lifting for unitary representations with nonzero cohomology, Duke\nMath. J. 61 (1990); Howe, JAMS 2 (1989);\
        \ A. Ichino, arXiv 2002.09148, Lemma 7.8.\n"
