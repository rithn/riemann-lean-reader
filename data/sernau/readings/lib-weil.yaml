      text: "An abstract theta kernel is an action of `G × G'` on a space of data, with a jet matrix for each\n\
        datum that is equivariant for the rational points. Such a kernel lifts algebraic forms from rank `n`\nto\
        \ rank `n'`.\n\n* `New.IsLiftWeight`: the condition on ranks and weights under which the lift exists.\n\
        * `New.Kernel`: the abstract theta kernel.\n* `New.Kernel.lift`, `New.Kernel.lift_equivariant`: the theta\
        \ lift of a kernel and its equivariance\n  under `G × G'`.\n"
    remainder:
      path: grh/src/Lib/Weil/CompactLift/ThetaKernelDefs.lean
      line: 14
      endLine: 33
      text: "* `New.schurCoeffPoly`: the polynomial `Aᵀ S(z) ξ`, with `S = schur κ`.\n  `New.dotProduct_schurJet_mulVec`\
        \ writes the entries of the jet matrix as jets along it.\n  `New.realPairWeil_schurCoeffPoly` gives the\
        \ action of the real points on it, and\n  `New.theta_pairWeil_schurCoeffPoly` its theta function as a coefficient\
        \ of the jet matrix.\n* `New.thetaKernel`: the kernel of the definite pair, which sends `f` to\n  `schurJet\
        \ κ (jetSeries _ c f)`.\n\nNotions from other files:\n* `New.\U0001D4AE`: The Banach space \U0001D4AE(V)\
        \ of integrable functions c on \U0001D538^n with c(x) = ∫ c(y)β(y,x)e(x−y) dy,\n  under the L¹ norm; β is\
        \ the adelic bicharacter and e the vacuum function `New.vacuumFn`.\n* `New.Space.finitePart`: The finite\
        \ part \U0001D4AE_f: the subspace of \U0001D4AE(V) spanned by the translates of the\n  vacuum under the\
        \ finite Heisenberg operators `New.Space.finHeisenbergOp`.\n* `New.rightStabilizer`: The subgroup of k in\
        \ G with f(gk) = f(g) for all g.\n* `New.AlgForm`: Smooth algebraic forms of weight (κ, e): functions φ\
        \ on G_f with values in vectors\n  indexed by `New.WeylIndex n κ`, with φ(γg) = ρ(γ)φ(g) for rational γ\
        \ and an open stabiliser.\n* `New.schurJet`: The matrix of jets of a power series along the entries of `schur\
        \ κ`.\n\n## Relation to the literature\n\nKnown; see `Lib.Weil.CompactLift.DefiniteThetaLift` for sources.\n"
