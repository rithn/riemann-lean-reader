      text: 'A mixed model reads a vector `Φ` of a large Fock space `New.Fock.fockSpace` as a function

        `x ↦ h.slice x Φ` on `ℂ ^ p` with values in a smaller Fock space. An adapted splitting of a

        hermitian space induces one at the infinite places (`New.Space.Splitting.IsAdapted.mixedModel`). A

        vector is a Schwartz vector (`New.Exchange.IsSchwartzVector`) if all its moments `fockMoment N

        v = ∫⁻ y, (1 + ‖y‖) ^ N * ‖v y‖ ∂normalizedVolume` are finite; `New.Fock.realWeil` is the Weil

        representation.

        '
    remainder:
      path: grh/src/Lib/Weil/MixedModel/FockSections.lean
      line: 13
      endLine: 39
      text: "\nThe file shows that the values of a mixed model decay rapidly. It also constructs Schwartz vectors\n\
        with prescribed smooth compactly supported values, using Fourier inversion in `x` and non-stationary\nphase.\n\
        \n## Main definitions and results\n\n* `New.Fock.MixedModel`: the structure, described by the action of\
        \ the Heisenberg operators\n  `New.Fock.realHeisenbergOp` and by the value of the vacuum.\n* `New.Fock.MixedModel.exists_fockMoment_slice_le`:\
        \ the values decay rapidly in `x`, in the moments\n  `New.Fock.fockMoment`.\n* `New.Fock.MixedModel.exists_isSchwartzVector_slice_eq`:\
        \ if `τ` is smooth of compact support, `u`\n  is a smooth unitary family and `ξ` is a Schwartz vector, then\
        \ `x ↦ τ x • realWeil (u x) ξ` is\n  `x ↦ h.slice x Φ` for a Schwartz vector `Φ`.\n\nNotions from other\
        \ files:\n* `New.Fock.fockSpace`: the Fock space: integrable functions c on ℂ^ι with c(x) = ∫ c(y)β(y,x)e(x−y)\n\
        \  dy, e the Gaussian exp(−|x|²/2), under the L¹ norm for the measure `New.Fock.normalizedVolume` on\n \
        \ ℂ^ι.\n* `New.Fock.vacVector`: the Gaussian exp(−|x|²/2) regarded as an element of the Fock space.\n* `New.Fock.realHeisenberg`:\
        \ for signs ε, the Heisenberg datum on ℂ^ι given by the continuous\n  unit-modulus bicharacter β(x,y) =\
        \ exp((y*εx − x*εy)/2) = exp(i Im y*εx), where ε stands for\n  `signMatrix ε`, the diagonal matrix of the\
        \ signs.\n\n## Relation to the literature\n\nKnown; see `Lib.Weil.MixedModel.ZeroTerm` for sources.\n"
