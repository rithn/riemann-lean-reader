      endLine: 11
      text: 'On a CM field `E` with CM type `Φ` (`New.CMType`; `Φ w` is the embedding τ : E → ℂ chosen at the

        infinite place w), this file fixes the arithmetic data that determine the Weil representation. From

        these data the file builds the adelic Heisenberg bicharacter and the vacuum function on `𝔸^n`, the

        two ingredients of the adelic Weil representation.

        '
    remainder:
      path: grh/src/Lib/Weil/Construction/WeilData.lean
      line: 12
      endLine: 36
      text: "\n## Main definitions and results\n\n* `New.SplittingChar`: a splitting character `υ`, a unitary Hecke\
        \ character with prescribed values\n  on ideles whose finite part is a unit.\n* `New.WeilData`: `υ` together\
        \ with a purely imaginary `ȷ ∈ E`, which turns the hermitian form into\n  a Heisenberg cocycle, and a finite\
        \ idele `α`, which scales the vacuum lattice.\n* `New.WeilData.scaleIdele`: the idele with finite part `α`\
        \ that normalises the real coordinates.\n* `New.adelicHeisenberg`: the bicharacter β(x, y) = ψ(½ȷ y*Sx),\
        \ where S is `New.stdForm`, the\n  diagonal form with signs `s` at the infinite places and 1 at the finite\
        \ ones.\n* `New.vacuumFn`: the vacuum, a Gaussian at the infinite places times a function of modulus one\
        \ on\n  the lattice αÔ^n of finite vectors (zero off the lattice). It does not depend on `s`.\n\nNotions\
        \ from other files:\n* `New.\U0001D538`: The ring ℂ^f × \U0001D538_f, one copy of ℂ for each infinite place\
        \ of E times the finite adeles:\n  the adele ring of E when E is totally complex.\n* `New.ψf`: The standard\
        \ additive character of the finite adeles: ψ_f(x) = exp(2πi Tr_{E/ℚ}(a)) for\n  any a in E with x − a integral.\n\
        * `New.Heisenberg`: A continuous function β on W × W, W a topological abelian group, with values of\n  modulus\
        \ one, multiplicative in each variable, and β(x,x) = 1.\n\n## Relation to the literature\n\nKnown; see `Lib.Weil.MixedModel.ZeroTerm`\
        \ and `Lib.ClassField.Global.CMSplittingCharacters` for\nsources.\n"
