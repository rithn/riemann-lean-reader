      text: 'This file proves that the theta kernel `New.pairTheta` of the dual pair U(S) × U(T), acting on

        data on Hom(S, T) through `New.pairWeil`, decays rapidly under support conditions on the finite

        datum `Ψ`. The kernel is `(g, h) ↦ θ (ω (g, h) φ)`, with `g` in the adelic group of `S` and `h` in

        that of `T`. At a point of large height the proof uses short pairs of rational matrices

        (`New.IsShortPair`) and the rational maps of rank one `dᵢ ⟨cⱼ, ·⟩` that they span.

        '
    remainder:
      path: grh/src/Lib/Weil/DualPair/KernelDecay.lean
      line: 12
      endLine: 48
      text: "`New.modDatum S T \U0001D52A Ψ v` is the datum `v ⊗ Ψ ⊗ vac` on `Hom(S, T)`, where `Ψ` is a function\
        \ on\nmatrices modulo an ideal `\U0001D52A` prime to its conjugate (`New.Modulus`), and `New.pairTheta`\
        \ is its\ntheta kernel on `U(S) × U(T)`.\n\n## Main definitions and results\n\n* `New.pairTheta_decay_of_onto`:\
        \ rapid decay of the theta kernel on U(T) when Ψ is supported on\n  surjective maps.\n* `New.pairTheta_decay_of_injective`:\
        \ rapid decay of the theta kernel on U(S) when Ψ is supported on\n  injective maps.\n* `New.pairTheta_modDatum_decay`:\
        \ suppose some place divides `\U0001D52A` and `Ψ` is supported on left\n  invertible matrices. Then the\
        \ kernel decays rapidly in the height of `g`, with polynomial growth\n  in the height of `h`.\n\nNotions\
        \ from other files:\n* `New.Space`: A hermitian space with a point: a matrix J over E and x in GL_n(\U0001D538\
        ) with xᴴJx equal to\n  diag(s) at the infinite places and 1 at the finite places; Γ = x⁻¹U(J)(E)x.\n* `New.Space.IsAutomorphic`,\
        \ `New.Space.IsRapid`: a function F is automorphic if it is continuous,\n  left Γ-invariant and right invariant\
        \ under an open subgroup of G_f; it is rapid if |F(g)|·ht(g)^B\n  is bounded for every B, and moderate (`New.Space.IsModerate`)\
