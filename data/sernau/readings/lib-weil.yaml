      text: 'This file gives an abstract form of the Galois law for the Weil representation. A map `L` on the

        data `𝒮 V` that is semilinear along `σ : ℂ →+* ℂ` may keep the finite part and turn the finite

        Heisenberg translation by `x` into that by `b x`, where `σ` takes `ψ z` to `ψ (b b̄ z)` for the

        additive character `ψ = New.stdLattice.selfDualAddChar E` of the finite adeles. Such a map also

        intertwines the Weil action, on the finite part and for finite points, up to the factor σ(Δ_f)/Δ_f,

        with Δ_f the finite multiplier `New.finMultiplier`. Writing `b = u a` with `u` unitary and `a` a

        '
    remainder:
      path: grh/src/Lib/Weil/DualPair/GaloisLaw.lean
      line: 12
      endLine: 39
      text: "unit of `Ô`, the laws are first proved for `ω(u)⁻¹ L`, which scales translations by `a`. Finite\nvectors\
        \ are read through `finVec x = (0, α x)`, with `α` the idele of the Weil data.\n\n## Main definitions and\
        \ results\n\n* `New.Space.ScalesTranslations`: the property of a `σ`-semilinear map to keep the finite part\
        \ and\n  to turn the finite translation by `x` into that by `b x`, while `σ` takes `selfDualAddChar E z`\
        \ to\n  `selfDualAddChar E (b b̄ z)`; `New.Space.ScalesTranslations.map_omega` is its law for `ω`, and\n\
        \  `New.Space.ScalesTranslations.exists_map_schrodingerOp` its law for the vacuum and for the vectors\n\
        \  `V.schrodingerOp R Ψ V.vacElem` with `Ψ` Schwartz–Bruhat at a set `R` of finite places.\n* `New.multiplierRatio`:\
        \ The factor `σ (Δ g) / Δ g`, for the multiplier `Δ = New.finMultiplier` of a\n  finite unitary point `g`.\n\
        \nNotions from other files:\n* `New.Space.ϱ`, `New.Space.ω`, `New.Space.vacElem`: The Heisenberg operators,\
        \ the Weil\n  representation and the vacuum vector of the space of data `New.\U0001D4AE V`.\n* `New.scalarFin`\
        \ (`Lib.Weil.DualPair.FiniteAction`): the scalar matrices, as a homomorphism from\n  the finite adeles of\
        \ norm one to `Gf E n`.\n\n## Relation to the literature\n\nKnown result: Galois action on CM theta functions\
        \ and on the finite Weil representation. Here it is\nstated for semilinear maps on the finite part of the\
