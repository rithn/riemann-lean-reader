      text: 'Let `Y` be a grading of the hermitian space `V` (`New.Grading`): a splitting of its basis into a

        set `X` and a string of `s` vectors. It gives the Bessel group `R = U ⋊ H`

        (`New.Grading.besselGroup`). Here `U` (`New.Grading.unipotent`) is the group of points whose matrix

        in rational coordinates, minus `1`, raises grades, and `H` is the unitary group of the standard

        definite space on `X`, embedded by `New.Grading.inclX`. Write `U^{≥2}` for the points whose matrix

        minus `1` raises grades by at least `2`.

        '
    remainder:
      path: grh/src/Lib/Weil/Periods/Equivariant.lean
      line: 13
      endLine: 33
      text: "\nThis file defines the projection `R → H` (`New.Grading.leviPart`) and the function\n`ψ_U (u) = ψ\
        \ (½ ȷ tr (\U0001D522 u))` (`New.Grading.unipotentChar`). It shows that `ψ_U` is a character on\n`U^{≥2}(\U0001D538\
        )`, trivial on rational points and invariant under conjugation by `H(\U0001D538)`. It defines\n`ψ_U`-equivariant\
        \ functions on `[R]` (`New.Grading.IsEquivariant`) and the function `\U0001D4B2_φ`\n(`New.Grading.sourceFn`)\
        \ of an algebraic form `φ`. It shows that `\U0001D4B2_φ` is `ψ_U`-equivariant when `s`\nis odd, since then\
        \ `U = U^{≥2}`, and that it is the only such function with its values on `H`.\n\nNotions from other files:\n\
        * `New.Grading.gradeOf`: the grade of a basis index, `0` on `X` and `s - 1 - 2 i` on the string\n  vector\
