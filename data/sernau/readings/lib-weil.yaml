      endLine: 58
      text: "\n## Main definitions and results\n\n* `New.pairWeil_of_mem_Gamma`: rational points (`New.Space.Γ`)\
        \ act by `f ↦ f (h⁻¹ · g)`.\n* `New.pairTheta_mul`, `New.continuous_pairTheta`: the theta kernel `New.pairTheta`\
        \ satisfies\n  `pairTheta S T a b f (p * q) = pairTheta S T a b (pairWeil S T a b q f) p`, and it is continuous.\n\
        * `New.realPairWeil γ γ'`: the representation on the Fock space `New.PairFock E s s'` of\n  `Hom(S, T)`.\
        \ It is the oscillator operator of `z ↦ y z x⁻¹` times `det y ^ γ * det x ^ (-γ')` at\n  each place.\n*\
        \ `New.pairWeil_integrated`, `New.pairWeil_integrated_all`: on `New.Space.integrated _ v f`, the\n  vector\
        \ `f` with its real vacuum replaced by `v`, real points act on `v` by `New.realPairWeil` and\n  finite points\
        \ act on `f`.\n* `New.exists_level_pairWeil`: a datum in the finite part `New.Space.finitePart` of `Hom(S,\
        \ T)` (the\n  span of finite Heisenberg translates of the vacuum) is fixed under `New.pairWeil` by a product\
        \ of\n  open subgroups of the two finite adelic unitary groups.\n* `New.Space.IsThetaLift`: a family of\
        \ maps between spaces of forms computes the theta integrals\n  between standard positive spaces.\n\nNotions\
        \ from other files:\n* `New.G`: The adelic unitary group G = G_∞ × G_f for signs s at the infinite places\
        \ and the\n  identity matrix at the finite places.\n* `New.GInf E s`: the real points, one complex unitary\
        \ group `U(diag s)` for each infinite place;\n  `New.homSigns s s'` is the sign vector `(i, j) ↦ s' i *\
        \ s j` of `Hom(S, T)`, and `New.realSigns`\n  repeats a sign vector at every infinite place.\n* `New.Fock.realWeil`:\
        \ The Weil representation of U(ε) on the Fock space `\U0001D4D5 ε`; its multiplier\n  `New.Fock.realMultiplier\
        \ u` is the conjugate of the determinant of the negative block of u.\n* `New.blockDiagAlg ε`: the complex\
        \ matrices that commute with `diag ε`, that is, the block\n  diagonal matrices for the partition of the\
        \ indices by sign; `New.principalMinor y p` is the\n  determinant of the block of `y` on the indices that\
        \ satisfy `p`.\n* `New.Space`: a hermitian space with a point, given by a matrix J over E and x in GL_n(\U0001D538\
