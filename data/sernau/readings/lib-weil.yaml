        \ `p`\n  basis vectors and `k` is the last `p` basis vectors.\n* `New.Exchange.removePlanes`: the tautological\
        \ splitting over V of the sum\n  `New.Exchange.hyperbolicSum` of hyperbolic planes and V. An instance shows\
        \ that the tautological\n  splitting is adapted.\n* `New.Exchange.adaptedHomBasis`: the change of basis\
        \ `(x⁻¹)ᴴ ⊗ 1` given by the adelic frame `x` of\n  `T`.\n* `New.Exchange.homSlice_eq_adapted_slice`: the\
        \ term `A.homSlice T x` is a mixed term of\n  `A.homSource T`, after the change of basis `adaptedHomBasis\
        \ p T`.\n* `New.Exchange.isAdapted_homSource`: if `A` is adapted, `A.homSource T` is adapted in the basis\n\
        \  `adaptedHomBasis p T`.\n* `New.Exchange.exists_isBaseAdapted_reindex`,\n  `New.Exchange.exists_isBaseAdapted_comp_removePlanes`:\
        \ an adapted splitting with a single plane\n  (`e : Unit ≃ p`) can be reindexed by `Unit`. An adapted splitting\
        \ can be factored through `V` plus\n  some of the planes.\n\nNotions from other files:\n* `New.Space`: a\
        \ hermitian space with a point, given by a matrix J over E and x in GL_n(\U0001D538) with xᴴJx\n  equal\
        \ to the diagonal matrix of its signs at the infinite places and 1 at the finite places.\n* `New.Space.Splitting.IsAdapted`:\
        \ `D.IsAdapted g t` says that the matrix g⁻¹(l tᴴ⁻¹, k t, ι) of\n  adelic frames (`frameAt`) is `IsOrthoIntegral`.\n\
        * `New.Space.Splitting.homSource`: From a splitting (k, l, ι) of V over V₀, the splitting of\n  Hom(V,T)\
