    excerpt:
      path: grh/src/Lib/Weil/CompactLift/DefiniteThetaLift.lean
      line: 9
      endLine: 12
      text: 'This file studies the theta correspondence from the definite space `I_n` to `I_n''` (`New.stdSpace`),

        for a weight that goes up from rank `n` to the larger rank `n''` (`New.IsLiftWeight`). There are two

        lifts between these groups. The theta lift is an integral of a theta kernel over `[U(n)]`, and the

        algebraic lift is a class sum with the matrix of jets `New.thetaKernel`.

        '
    remainder:
      path: grh/src/Lib/Weil/CompactLift/DefiniteThetaLift.lean
      line: 13
      endLine: 41
      text: "\n## Main definitions and results\n\n* `New.IsHCParam.paramsCorrespond_iff`: the parameter `l` of the\
        \ weight in rank `n` corresponds to\n  `l'` (`New.ParamsCorrespond`) exactly when `l'` is the parameter\
        \ of the weight `(κ, ea)` in rank\n  `n'`, with the same columns `κ`.\n* `New.exists_lift_ofAlgForm_eq_smul`:\
        \ the analytic theta lift `New.Space.lift` with the joint\n  harmonic `New.jointHarmonic` as real datum\
        \ is a constant (possibly zero), divided by the index of\n  the level, times the lift `New.Kernel.lift`\
        \ of algebraic forms by `New.thetaKernel`.\n* `New.isThetaLift_thetaKernel`: the lifts of the kernels of\
        \ jets are theta lifts in the sense of\n  `New.Space.IsThetaLift`.\n\nNotions from other files:\n* `New.IsLiftWeight`:\
        \ `n < n'`, no column of `κ` has height strictly between the two ranks, and the\n  exponent in rank `n`\
        \ is `eb` plus the number `κ w (card n)` of columns of height `n`.\n* `New.thetaKernel`: the kernel whose\
        \ matrix at a finite datum is made of the Taylor coefficients\n  (jets) of its theta series, paired with\
        \ Schur polynomials.\n* `New.IsHCParam`: `l` lists twice the Harish-Chandra parameter of the weight `(κ,\
        \ e)`, in some\n  order: at each place `w` the numbers `l w i` are distinct, and each of them is\n  `hcParameter\
        \ κ e (card n) w p` for some position `p < card n`.\n* `New.stdSpace`: the definite space `I_n`, the sum\
        \ of `n` norms with its standard lattice.\n\n## Relation to the literature\n\nKnown result: Theta lift for\
        \ a definite unitary pair as a class sum on algebraic modular forms. The\npair is U(n)×U(n′) over a CM field\
        \ with `New.WeilData`, n < n′, and the kernel is the matrix of\nTaylor coefficients of the theta function\
        \ against Schur polynomials. The constant is left\nunspecified. Source: B. Gross, Algebraic modular forms,\
        \ Israel J. Math. 113 (1999); Kashiwara–Vergne\n1978; R. Howe, Transcending classical invariant theory,\
        \ JAMS 2 (1989).\n"
