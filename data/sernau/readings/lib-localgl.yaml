      text: "residue field relates `r` and `r + 1` and gives Satake's formula for the eigenvalue on an exponent.\n\
        It also proves a duality of lattices for these operators.\n\n## Main definitions and results\n\n* `New.heckeFun_iwahoriDoubleCoset_eq_iwahoriDegree_smul`:\
        \ the operator of a dominant double coset\n  `K t K` (`K = proIwahori`) on `K`-fixed vectors, through the\
        \ number `New.iwahoriDegree t` of its\n  cosets.\n* `New.partialCosets`, `New.partialHecke`: the lattices\
        \ that contain the first `r` basis vectors,\n  and the sum over them. It is the `j`-th Hecke operator for\
        \ `r = 0`, and `0` for `r = N`, `0 < j`.\n* `New.echelonRows`, `New.card_echelonRows_mem_residueKer`: the\
