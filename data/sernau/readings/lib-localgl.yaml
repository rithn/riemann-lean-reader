      text: "`P = New.blockParahoric (min m)`, whose columns before `m` lie in `\U0001D52D` below the diagonal,\
        \ and the\npermutation matrices `New.permGL`. For `F` the completion of a number field at a finite place,\
        \ it\nalso shows that the Hecke operator of `diag (ϖ, 1, …, 1)` keeps the `New.proIwahori`-fixed\neigenvectors,\
        \ with eigenvalue depending only on the top left entry, of the stabiliser of a line,\n`New.blockParahoric\
        \ (min 1)`, the matrices in `GL_N(\U0001D4AA)` whose first column is in `\U0001D52D` below the\ncorner.\n\
        \n## Main definitions and results\n\n* `New.Patching.parahoricEigenspace`: for a level function `f` and\
        \ a function `c` on the group, the\n  vectors fixed by `New.proIwahori` on which each `k` in the parahoric\
        \ subgroup of `f` acts by the\n  scalar `c k`.\n* `New.Patching.parahoricEigenspace_mem_invtSubmodule`:\
        \ the Hecke operator of `diag (ϖ, 1, …, 1)`\n  keeps this space when `f = min 1` and `c` is a function of\
        \ the top left entry.\n* `New.IsExponent.eq_zero_of_eq_zero_on_spherical`: if `l ≠ 0`, the `θ_i` are unramified\
        \ and\n  `|θ_i(ϖ)|` is non-increasing in `i`, then `l` is non-zero on the vectors fixed by `GL_N(\U0001D4AA\
        )`.\n\nNotions from other files:\n* `New.blockParahoric`: For a level function b on the indices, the g in\
        \ GL_N(\U0001D4AA) with g_ij in the\n  maximal ideal whenever b(j) < b(i).\n* `New.IsExponent`: For a character\
        \ ξ of the torus, the linear form l satisfies l(ρ(t) · mean of x\n  over K0) = ξ(t) l(x) for all x and all\
        \ dominant t.\n* `New.heckeCoset`: The Hecke operator of the double coset KgK: the sum of ρ(h) over chosen\n\
        \  representatives h of the cosets hK in KgK.\n* `New.compactMean`: The mean of ρ(h)x over h in a compact\
