        \ heckeGL ρ m x` and `partialHecke ρ r 0 x = x`.\n\n## Relation to the literature\n\nKnown result: the Satake\
        \ parameters of unitary unramified representations of GL_N come in chains.\nBoth statements follow from\
        \ Tadić's classification of the unitary dual and the geometric lemma of\nBernstein and Zelevinsky. The file\
