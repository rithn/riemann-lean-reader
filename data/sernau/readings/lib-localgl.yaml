      text: 'Let `k` be a finite field. `New.Hall k` is the ring of functions on the similarity classes

        `New.SimClass k` of endomorphisms over `k`, with the parabolic induction product. In it,

        𝟙 = `New.Hall.constOne` is the constant function 1, μ = `New.Hall.moebius` is its inverse, and

        C_η = `New.Hall.greenCuspidal k η`. The file proves that C_η is cuspidal and that cuspidal functions

        vanish off classes whose characteristic polynomial is a power of an irreducible polynomial. It

        computes μ and C_η at multiplication by a field generator, and writes the inner product of C_η with

        B·μ as a mean over the units of a field extension.

        '
    remainder:
      path: grh/src/Lib/LocalGL/Green/CuspidalFunctions.lean
      line: 15
      endLine: 49
      text: "\n## Main definitions and results\n\n* `New.Hall.crapo_complementation`, `New.Hall.isSemisimple_of_moebius_ne_zero`:\
        \ μ is a Möbius\n  function on the lattice of stable subspaces, so it vanishes off semisimple classes.\n\
        * `New.Hall.greenCuspidal_mul_constOne`, `New.Hall.isCuspidal_greenCuspidal`: C_η ∗ \U0001D7D9 = −β_η, and\n\
        \  C_η is cuspidal.\n* `New.Hall.IsCuspidal.exists_charpoly_eq_pow`: a cuspidal function vanishes at the\
        \ class of `g`\n  unless the characteristic polynomial of `g` is a power of an irreducible one.\n* `New.greenCuspidal_simClassOf_eq_mul`:\
        \ the value of `New.Hall.greenCuspidal k η` at the class of\n  `g` depends on `η` only at the elements whose\
        \ Frobenius orbit gives all eigenvalues of `g`.\n* `New.rankInner_greenCuspidal_mulMoebius`: the inner product\
        \ on GL_{[L:k]}(k) of C_η\n  (`New.Hall.greenCuspidal`) with B·μ (`New.Hall.mulMoebius`) is the mean over\
        \ z ∈ L^× of conj η(φz)\n  times B at multiplication by z.\n\nNotions from other files:\n* `New.Hall.IsCuspidal`:\
        \ F is cuspidal when its average over block triangular endomorphisms with\n  diagonal blocks a, b vanishes\
        \ whenever both a and b have nonzero dimension.\n* `New.Hall.brauerLift`: The class function β_η sending\
        \ an endomorphism to the sum of η over the\n  roots in K of its characteristic polynomial, counted with\
        \ multiplicity.\n* `New.Hall.greenCuspidal`: The class function C_η = (β_η·μ) ∗ \U0001D7D9: the pointwise\
        \ product of the\n  eigenvalue sum β_η with the inverse μ of \U0001D7D9, multiplied in the induction product\
        \ by the constant\n  function \U0001D7D9.\n\n## Relation to the literature\n\nKnown result: Brauer lift\
        \ is a virtual character; cuspidal times Steinberg is induced from a torus.\nBrauer induction is not used\
        \ here. The character induced from the Coxeter torus is instead divided\nby the Steinberg character, read\
        \ as a Möbius function on semisimple classes compatibly with the\nGalois action, and only the vanishing\
        \ half of Crapo's theorem is used. Source: Green 1955, Thm 1; T.\nA. Springer, Sém. Bourbaki 441 (1973/74),\
        \ 1.1-1.7; R. Carter, Finite groups of Lie type (1985), for\nSteinberg times a torus character; P. Hall's\
        \ lemma, D. Krasula, arXiv 2403.05656, Lemma 23, and H.\nCrapo's complementation theorem, for the vanishing\
        \ of the Möbius number off semisimple modules.\n\nSee also `Lib.LocalGL.Green.TauFunctions`.\n"
