        \ induction of class functions\n  along `ρ` over `Γ`.\n\n## Relation to the literature\n\nKnown; see `Lib.LocalGL.Shintani.LiftingGreenCharacters`\
        \ and `Lib.LocalGL.Green.CuspidalFunctions`\nfor sources.\n"
