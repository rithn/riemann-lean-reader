        \ …,\n  cq^(k−1) of roots.\n* `New.Patching.pairing_aeval_heckeCoset_eq_zero`: of a chain of roots, the\
        \ operator U of diag(ϖ, 1,\n  …, 1) at the level `proIwahori` sees only the top one. If P is a chain with\
        \ top root c' times S,\n  then x is orthogonal to (U − c') S(U) y for every y fixed by `proIwahori`.\n*\
        \ `New.Patching.chain_lemma`: the common source of both results, with a lower bound for the top root\n \
        \ of a chain (`New.Patching.le_norm_sq_of_isRoot_of_not_isRoot_mul`).\n\nNotions from other files:\n* `New.heckeGL`:\
        \ The j-th Hecke operator on a representation π of GL_n(E_w): the action\n  (`New.heckeFun`) of the indicator\
        \ function of `New.basicDoubleCoset` j, for K = GL_n(O_w).\n* `New.proIwahori`: The pro-p Iwahori subgroup\
        \ of GL_n(O_w): matrices that are upper triangular with\n  ones on the diagonal modulo the maximal ideal.\
