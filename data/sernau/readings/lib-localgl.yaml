      text: "size `q`; for `x` in `k`, `thetaChar T |k| x` at the norm from `k'` is `thetaChar T |k'| x`.\n`New.Lift\
        \ Z F F'` says that in each rank `m` one `Z`-combination of characters of\n`GL_m(k') ⋊ Gal(k'/k)` restricts\
        \ to `F'` on `GL_m(k')` and is `F` of the norm on the cosets of the\n`σ` with fixed field `k` (`New.DescendsTo\
        \ Φ F` for `F` over `k`; for `F'` over `k'`,\n`DescendsTo Φ F'` means `Φ ∘ inl = F'.evalGL`).\n\n## Main\
        \ definitions and results\n\n* `New.sum_evalGL_prod_eq_zero_iff`: the element `∑ conj (χ g) g` of a parabolically\
        \ induced\n  character `χ` kills a vector `v` if and only if the corresponding sum over the block upper\n\
        \  triangular matrices kills all translates of `v`.\n* `New.exists_isChar_descendsTo_labelChar`: let `P`\
        \ be irreducible of degree `r = [L : k]`, a label\n  (`IsLabel r P`), with a root `x`. Then one character\
        \ of `GL_r(k') ⋊ Gal(k'/k)` descends both to\n  the cuspidal function of `θ_x` times `μ` and to `(-1) ^\
        \ r Ξ_P μ` over `k'`. This is used to lift\n  `Ξ_P` from `k` to `k'`.\n* `New.lift_detChar`: the lift of\
        \ `χ ∘ det`.\n* `New.DescendsTo.card_mul_classInner`: the inner product of two lifts in terms of the inner\n\
        \  products over `k'` and over `k`.\n* `New.shintani_lift_labelChar`: the lift by true characters for any\
        \ label (`New.IsLabel`: monic,\n  squarefree, non-zero constant term).\n\nNotions from other files:\n* `New.Hall.evalGL`:\
        \ for `F : Hall k` and `g : GL n k`, the value of `F` at the similarity class of\n  the endomorphism of\
        \ `n → k` given by `g`.\n* `New.blockHom b a`: the homomorphism sending a block upper triangular invertible\
        \ matrix (for the\n  level function `b`) to its diagonal block of level `a`.\n* `New.classInner f h`: the\
        \ inner product of complex functions on a finite set, the average of\n  `conj (f g) * h g`; `New.Hall.rankInner\
        \ n F H` is the same over `GL_n(k)` for functions on\n  classes, `F.mulMoebius` is `F` times `μ`, and `New.finMean\
        \ f` is the average of `f` over a finite\n  type.\n\n## Relation to the literature\n\nKnown result: Shintani\
        \ lifting of characters of GL_n(F_q) to an extension field, with the lift\nidentified for Green's characters.\
        \ Here the degree is prime, and only Green's characters with\nsquarefree labels and characters of the determinant\
        \ are treated. For these, one character of the\nsemidirect product with the Galois group is the lifted character\
        \ on GL_n(k'), and on the cosets of\nthe σ with fixed field k it is the original character at the norm;\
