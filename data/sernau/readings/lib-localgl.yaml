      text: 'This file applies descent along a coset to `GL_n(k'') ⋊ Gal(k''/k)` for an extension `k''/k` of finite

        fields. Here functions on similarity classes of matrices (`New.Hall k`) are multiplied by parabolic

        induction. It defines lifts of such functions from `k` to `k''` and proves that they are stable under

        differences and products. It then shows that the eigenvalue sums `New.Hall.brauerLift k θ` have

        virtual lifts.

        '
    remainder:
      path: grh/src/Lib/LocalGL/Shintani/CosetDescent.lean
      line: 13
      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.DescendsTo Φ X`: a function Φ on GL_n(k') ⋊ Gal(k'/k) (`New.GalSemidirect`)\
        \ descends to X,\n  that is, Φ(s) = X(s^{ord σ}) on the coset of each σ whose fixed field is the field of\
        \ X.\n* `New.Lift Z F F'`: in each rank, some `Z`-combination of characters of `GL_n(k') ⋊ Gal(k'/k)`\n\
        \  descends to `F` over `k` and to `F'` over `k'`.\n* `New.Lift.sub`, `New.Lift.mul`, `New.Lift.mulMoebius`,\n\
        \  `New.Lift.rankPart_mulMoebius_mul_constOne`: lifts are stable under differences, under the\n  product,\
        \ and under pointwise multiplication by the inverse μ (`moebius`; `F.mulMoebius` is F·μ) of\n  the constant\
        \ function 1.\n* `New.exists_torus_induced_descendsTo`: the character induced from (k' ⊗ L)ˣ ⋊ Gal(k'/k),\
        \ for\n  [L:k] = m, descends to C_θ·μ over k, where C_θ = `New.Hall.greenCuspidal` k θ.\n* `New.exists_lift_brauerLift`:\
        \ the eigenvalue sum `β_θ = New.Hall.brauerLift k θ` has a virtual\n  lift. It is obtained from `New.exists_torus_induced_descendsTo`\
        \ by recursion on the rank and\n  `β_θ = −C_θ ∗ \U0001D7D9`.\n\nNotions from other files:\n* `New.Hall.constOne`:\
        \ The complex-valued function on classes of endomorphisms that takes the value\n  1 on every class, in every\
        \ dimension.\n* `New.Hall.rankPart`: The function on similarity classes equal to F on classes of dimension\
        \ n and\n  zero on the others.\n* `New.Hall.rankInner`: For complex functions F, H on similarity classes,\
        \ the average over GL_n(k)\n  of the conjugate of F times H.\n* `New.IsRootChoice` (`Lib.LocalGL.Shintani.CosetRootChoice`):\
