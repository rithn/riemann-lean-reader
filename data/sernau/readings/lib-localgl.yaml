    excerpt:
      path: grh/src/Lib/LocalGL/Green/TauFunctions.lean
      line: 6
      endLine: 12
      text: 'This file studies Green''s characters of `GL n k` over a finite field `k` that are attached to

        squarefree polynomials. These characters live in `New.Hall k`, the complex-valued functions on

        similarity classes of square matrices of all sizes, with parabolic induction as product. A faithful

        character `T` of the algebraic closure `K` gives characters `θ_x = New.thetaChar T Q x`. For a label

        `c`, they also give the product `Ξ_c = New.labelChar T c` of the `τ_P` over the irreducible factors

        `P` of `c`. The file proves the symmetries of `θ_x`. It shows that the `τ_P` are cuspidal and

        orthonormal and do not depend on the chosen root.

        '
    remainder:
      path: grh/src/Lib/LocalGL/Green/TauFunctions.lean
      line: 13
      endLine: 49
      text: "\n## Main definitions and results\n\n* `New.faithfulChar`, `New.thetaChar`: a faithful character `T`\
        \ of the algebraic closure, and the\n  power `θ_x` of `T` attached to an element `x` of the subfield with\
        \ `Q` elements.\n* `New.greenTau`, `New.labelChar`: the function `τ_P` of an irreducible `P`, and the product\
        \ `Ξ_c`\n  of the `τ_P` over the irreducible factors of `c`.\n* `New.IsLabel`: labels of degree `r`, which\
        \ are monic squarefree polynomials with nonzero constant\n  term.\n* `New.charName`: for `T` faithful, the\
        \ isomorphism χ ↦ x_χ from the multiplicative characters of\n  the finite field k onto k^×; its inverse\
        \ sends a unit a to the restriction of θ_a to k.\n* `New.rankInner_greenTau`: the `τ_P` are orthonormal.\n\
        * `New.labelChar_degree_bounds`: let `q = |k|`. Let `c` be a label of degree `r`\n  (`New.IsLabel r c`),\
        \ with `r = card n`. Let `Ξ = New.labelChar T c` on `GL n k`. Then the real\n  part of `Ξ(1)` is non-negative.\
        \ Also `Ξ(1) conj Ξ(1) / |GL n k|` is at least\n  `(1 - r / q) / q ^ r`.\n\nNotions from other files:\n\
        * `New.Hall.greenCuspidal`: The class function C_η = (β_η·μ) ∗ \U0001D7D9: the pointwise product of the\n\
        \  eigenvalue sum β_η with the inverse μ (`moebius`) of \U0001D7D9 (for any F, `F.mulMoebius` is the pointwise\n\
        \  product F·μ), multiplied in the induction product by the constant function \U0001D7D9.\n* `New.Hall.brauerLift`:\
        \ The class function β_η sending an endomorphism to the sum of η over the\n  roots in K of its characteristic\
        \ polynomial, counted with multiplicity.\n* `New.Hall.evalGL`: For a complex function F on similarity classes\
        \ and an invertible matrix g in\n  `GL n k`, indexed by a finite type n, the value of F at the class of\
        \ the endomorphism of `n → k`\n  given by g.\n* `New.Hall.rankInner`: For n and complex functions F, H on\
        \ similarity classes, the average over\n  GL_n(k) of the conjugate of F times H.\n\n## Relation to the literature\n\
        \nKnown result: Green's characters of GL_n(F_q) and the parabolic-induction ring. Only cuspidal\ncharacters\
        \ and their products over squarefree polynomials are treated, named through a fixed\ncharacter of the algebraic\
        \ closure, with cuspidality, orthonormality, independence of the chosen\nroot and a degree bound. Hall polynomials\
        \ are not covered. Source: J. A. Green, The characters of\nthe finite general linear groups, Trans. AMS\
        \ 80 (1955), Thms 2, 9, 12-14; for the ring on all\nmatrices, Z. Chen, arXiv 2408.06191, Prop. 3.2.\n"
