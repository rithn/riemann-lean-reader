      endLine: 12
      text: 'This file develops the structure theory of `GL_n(F)` that is needed to describe representations by

        their vectors of Iwahori level. Here `F` is a field with a discrete valuation and compact ring of

        integers. The valuation `v` is multiplicative with values in `ℤᵐ⁰`, and `v x ≤ 1` means that `x` is

        integral. The file defines the parahoric and pro-`p` Iwahori subgroups. For a complex representation

        `ρ` of a group `G`, it also constructs the subrepresentation generated by a vector and the

        subrepresentation of smooth vectors.

        '
    remainder:
      path: grh/src/Lib/LocalGL/Iwahori/ParahoricStructure.lean
      line: 13
      endLine: 49
      text: "\n## Main definitions and results\n\n* `New.blockParahoric`, `New.proIwahori`: parahoric subgroups\
        \ and the pro-`p` Iwahori subgroup I₁.\n  They are compact and open.\n* `New.exists_iwasawa_bruhat`: the\
        \ Iwasawa–Bruhat decomposition and the Iwahori factorisation.\n* `New.iwahoriHeckeHom`: the operators `U_t`\
        \ = (mean over I₁) ∘ `ρ(t)` on the I₁-fixed vectors are\n  multiplicative in the dominant diagonal `t` (`New.dominantTorus`).\n\
        * `New.IsIwahoriEigen`, `New.IsExponent`: eigenvectors and eigenforms of the `U_t`. `New.torusChar`\n  builds\
        \ characters of the torus from characters of `Fˣ`.\n\nNotions from other files:\n* `New.IsSmoothRep`: The\
        \ representation ρ is smooth: every vector is fixed by all g in some\n  neighbourhood of 1.\n* `New.intGL`:\
        \ For a subring O of R, the subgroup GL_n(O) of GL_n(R): matrices with entries in O\n  whose inverse has\
        \ entries in O.\n* `New.parabolic`: The subgroup of GL_n(R) of matrices that are block upper triangular\
        \ for a given\n  level function on the indices.\n* `New.diagGL`: The homomorphism sending a family of units\
        \ of R to the diagonal matrix in GL_n(R)\n  with these entries.\n* `New.unitriangular lev R`: the matrices\
        \ in GL_n(R) that agree with the identity matrix at every\n  entry `(i, j)` with `lev j ≤ lev i`; for `lev\
        \ = id` these are the upper unitriangular matrices.\n\n## Relation to the literature\n\nKnown result: Iwasawa–Bruhat\
        \ decomposition of GL_n over a local field, and the Iwahori\nfactorisation. Only existence is proved here.\
        \ By row operations, every element is a unitriangular\nmatrix times a monomial matrix times an element of\
        \ the pro-p Iwahori group, and that group factors\ninto upper and lower parts. The statement does not use\
        \ double cosets, and uniqueness is not proved.\nSource: Iwahori–Matsumoto, Publ. IHES 25 (1965); Casselman,\
        \ Introduction to admissible\nrepresentations of p-adic groups: GL_n (notes), §13.\n\nThe last section proves\
        \ conjugacy in I₁ t I₁, twisted by an isometric automorphism of the field\n(`New.exists_inv_mul_mul_map_eq_diagGL_mul`).\
        \ Source: Görtz–Haines–Kottwitz–Reuman, Compositio 146\n(2010), Thm 1.1.5 (conjugacy in I t I).\n\nSee also\
        \ `Lib.LocalGL.Iwahori.HeckeDegrees`.\n"
