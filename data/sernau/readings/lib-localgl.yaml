    excerpt:
      path: grh/src/Lib/LocalGL/Green/HallAlgebra.lean
      line: 7
      endLine: 13
      text: '`New.Hall k` is the space of complex-valued functions on similarity classes of square matrices of

        all sizes over a field `k`. For finite `k` it is a commutative ℂ-algebra in which the constant

        function `New.Hall.constOne` is invertible. From here on `k` is finite. Let δ denote the block

        average `New.Hall.blockAverage` over block triangular matrices. Then δ is multiplicative (Mackey''s

        formula) and adjoint to the induction product. This yields the adjoint `New.Hall.skew` of

        multiplication, a derivation for cuspidal functions, and Frobenius reciprocity along parabolic

        subgroups.

        '
    remainder:
      path: grh/src/Lib/LocalGL/Green/HallAlgebra.lean
      line: 14
      endLine: 40
      text: "\n## Main definitions and results\n\n* `New.Hall k`: complex-valued functions on `New.SimClass k`.\
        \ The product is\n  `(f * h) g = ∑ W, f (g | W) * h (g | V / W)` over stable `W` (a `finsum`), and `1` is\
        \ the\n  indicator of size `0`. The constant function with value `1` is `New.Hall.constOne`.\n* `New.Hall.blockAverage`,\
        \ `New.Hall.IsCuspidal`: the average over block triangular maps;\n  cuspidality.\n* `New.Hall.blockAverage_mul`:\
        \ Mackey's formula, `δ(F * H) = δF * δH`, by a bijection between the\n  stable subspaces of the block maps\
        \ and triples (pair of stable subspaces, map, shear).\n* `New.Hall.rankInner_mul_eq_rankInner_skew`: for\
        \ `f` supported in dimension `d`,\n  `New.Hall.skew d f` is adjoint to multiplication by `f`.\n* `New.Hall.skew_mul`:\
        \ for cuspidal `c` and `d ≠ 0`, `New.Hall.skew d c` is a derivation. It follows\n  from Mackey's formula\
        \ `New.Hall.blockAverage_mul` and the degree-zero case\n  `New.Hall.rankInner_mul_of_isCuspidal`.\n* `New.classInner_evalGL_prod`:\
        \ the inner product `New.classInner` of a product with a class\n  function `Y` is a mean over the group\
        \ `New.parabolic b` of matrices that are block upper\n  triangular for the levels `b : n → ι`; `New.blockHom\
        \ b a` is the diagonal block of level `a`.\n\nNotions from other files:\n* `New.finMean`: the average of\
        \ a complex function `f` on a finite set `G`: the sum of its values\n  divided by the cardinality of `G`.\n\
        * `New.classInner f h`: the average over a finite group of `conj (f g) * h g`.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.LocalGL.Green.TauFunctions` and `Lib.LocalGL.Green.CuspidalFunctions` for sources.\n"
