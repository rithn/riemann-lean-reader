      text: "\nNotions from other files that the statements use:\n* `New.IsStep E' μ`: `E` contains a primitive\
        \ 5040th root of unity, `E'` is a CM field, Galois of\n  prime degree over `E`, with an integer of trace\
        \ `1`, and `μ` is a character of the finite ideles\n  of `E` with open kernel, trivial on `E^×`, such that\
        \ `μ (z z̄) = 1` exactly when `z` is an element\n  of `E^×` times the norm of a finite idele of `E'`.\n\
        * `Z.conjClosure` is `Z ∪ Z̄`, and `New.placesAbove E' Z` is the set of places of `E'` above it.\n* `New.sphericalAt\
        \ π w`: the vectors fixed by the integral elements supported at `w` and `w̄`.\n  `New.HasHeckePolyAt f w\
        \ hw P`: `f` is spherical at `w` and an eigenvector of each `New.heckeSplit`\n  there, and `P` is built\
