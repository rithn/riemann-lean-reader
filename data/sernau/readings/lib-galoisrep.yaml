        \ polynomials and jumps pass from\n  `r'` to a representation `r` that embeds in `r'` near the identity.\n\
        \nNotions from other files:\n* `New.Gp`: The absolute Galois group G_p = Gal(Q̄_p over Q_p).\n* `New.Period.IsCrystalline`:\
        \ The elements of B⊗T fixed by the whole group (for\n  `New.Period.IsPotentiallyCrystalline`: by the elements\
        \ near 1) span B⊗T over the period ring B.\n* `New.Period.IsWeilPair`: (s, m) with s in G_p acting on the\
        \ residue field as x ↦ x^(1/p^m).\n* `New.Period.IsKilledBy`: T is potentially crystalline and P(β_{s,m})\
        \ = 0 on B⊗T, where β_{s,m} is\n  the operator `New.Period.linearFrob` of the pair (s, m).\n* `New.IsFrob`:\
