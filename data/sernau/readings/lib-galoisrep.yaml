    excerpt:
      path: grh/src/Lib/GaloisRep/BaseChange/CommutingHeckeFamilies.lean
      line: 7
      endLine: 12
      text: 'This file sets up base change along an extension `E''/E` of prime degree. It records

        place-by-place properties of base change `New.baseChangeGf` and of the Galois action

        `New.galoisGf` on the finite adelic unitary group. It defines matching pairs of test functions at

        the places above a set `S` of places. It relates operators on fixed vectors to functions on the

        group through a common element of the group ring, and builds commuting families of local and

        spherical Hecke operators.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/BaseChange/CommutingHeckeFamilies.lean
      line: 13
      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.IsStep`: the extension `E'/E` with a character `μ` of the\
        \ finite ideles of `E` that detects\n  norms: `μ (z z̄) = 1` exactly when `z` is a principal idele times\
        \ a norm from `E'`.\n* `New.IsMatched`: the places of `E` that split completely in `E'` and at which `μ`\
        \ is trivial.\n* `New.placesAbove E' S`: the places of `E'` above `S ∪ S̄`; `New.IsMatchingPairAbove`: matching\n\
        \  pairs of functions (`New.IsMatchingPair`) at these places.\n* `New.IsLocalRetraction`, `New.isLocalRetraction_ofSplitPlace`:\
        \ a group `A` that is a retract of\n  the finite adelic unitary group at a set `S` of places; GL_n of the\
        \ completion at a split place is\n  one.\n* `New.exists_isHeckeFunctionRelation`: the Hecke operators of\
        \ `A` and spherical operators away from\n  `S` commute on the vectors fixed by the level, and their products\
        \ are operators of functions.\n\nNotions from other files:\n* `New.adeleNorm`: for an extension `L/K` of\
        \ number fields, the norm from the finite adeles of `L`\n  to the finite adeles of `K`, as a multiplicative\
        \ map.\n* `New.Gf.supportedOn`, `New.Gf.trivialOn`: the elements with component `1` at every place outside\n\
        \  `S ∪ S̄`, and those with component `1` at every place of `S`.\n* `New.localLevel`: the elements whose\
        \ component at each `w ∈ S` lies in `K w`; by default `K w` is\n  `New.localIntGL`, the integral matrices\
        \ with integral inverse.\n\n## Relation to the literature\n\nKnown; see `Lib.GaloisRep.BaseChange.PrimeDegreeTransfer`\
        \ and `Lib.Adelic.Hecke.ClassSums` for\nsources.\n"
