      text: 'This file sets up the statement that eigenforms on a definite unitary group have attached Galois

        representations. Here `ιℓ` identifies `ℂ` with an algebraic closure of `ℚ_ℓ`, and `P` is a system of

        complex polynomials, one for each finite place. A continuous representation `ρ` with non-degenerate

        trace form, with an open map `j` to the Galois group, is attached to `P` when, along most Frobenius

        elements (the filter `New.mostFrobenii`), its characteristic polynomials approach `ιℓ (P w)`. The

        file shows that the characteristic polynomials are then determined by `P`, so two attached

        representations have the same traces. It also shows that the representation attached to an

        eigenform on the definite unitary group of rank one is the avatar of an algebraic Hecke character.'
    remainder:
      path: grh/src/Lib/GaloisRep/Main/AttachedRepresentations.lean
      line: 15
      endLine: 47
      startOffset: 973
      endOffset: 3055
      text: "\n\n## Main definitions and results\n\n* `New.GaloisRep.Attached`: a representation `ρ` of a topological\
        \ group `H`, together with a map `j`\n  from `H` to the Galois group (by default the identity), is attached\
        \ to `P`. This means that `ρ` is\n  continuous, has a non-degenerate trace form (`New.IsTraceNondeg`), `j`\
        \ is open, and along most\n  Frobenius elements the characteristic polynomials of `ρ` approach `ιℓ (P w)`.\n\
        * `New.GaloisRep.SphericalCompat`: the statement that an attached representation exists, and that\n  every\
        \ attached representation satisfies `New.GaloisRep.IsCompatibleAt` (unramified or crystalline,\n  Hodge–Tate\
        \ jumps, Hecke polynomial) at a place `w` where the form is spherical.\n* `New.GaloisRep.Attached.tendsto_charpoly_coeff`:\
        \ `ιℓ (P w)` tends to `det (X - ρ x)` as the\n  Frobenius element at `w` tends to `j x`.\n* `New.GaloisRep.Attached.trace_eq`:\
        \ two representations attached to `P` have the same traces.\n* `New.IsRankOneCharacter`: the infinity type\
        \ of an algebraic Hecke character `θ` and its values at\n  split places are read off from a form on `U(1)`\
        \ and its weight.\n* `New.GaloisRep.Attached.exists_det_eq_avatar`: in rank one, an attached representation\
        \ is the\n  avatar of such a character `θ`.\n\nNotions from other files:\n* `New.Ω`: an algebraic closure\
        \ of `ℚ`.\n* `New.Gf E n`: the finite adelic points of the definite unitary group of the CM field `E`.\n\
        * `New.IsEigenform f P`: `f ≠ 0`, and at almost all `w` of prime norm, `w` is split and `f` is\n  spherical\
        \ with Hecke polynomial `P w` (`New.HasHeckePolyAt`).\n* `New.mostFrobenii E`: a filter on triples `(w,\
        \ A, s)` of a place `w` of prime norm, a place `A` of\n  `Ω` over `w` and a geometric Frobenius element\
        \ `s` at `A` (`New.FrobeniusDatum`). \"Most\" means:\n  every non-empty open set of the Galois group has\
        \ a non-empty open part `O` such that, for almost\n  all `w`, the property holds for every triple with `s`\
        \ in `O`.\n* `New.mostFrobeniiAt E g`: the same filter, refined by the condition that `s` lies near `g`.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.GaloisRep.Main.OddRank` for sources.\n"
