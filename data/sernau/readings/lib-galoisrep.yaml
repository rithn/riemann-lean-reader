      path: grh/src/Lib/GaloisRep/Pseudocharacter/Pseudorepresentations.lean
      line: 7
      endLine: 12
      text: 'This file gives a criterion for the image of a lattice to span the matrix algebra over the

        coefficient ring `O`, using a tame pair with incongruent eigenvalues. It studies uniform

        approximation of eigensystems through `New.IsApproximatingMonoid`, and Newton''s identities through

        `New.newtonPoly`. It proves that over an algebraically closed field of characteristic `0`, a

        function obeying every polynomial identity among traces is the trace of a representation. It also

        proves that a limit of traces of continuous representations is such a trace.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/Pseudocharacter/Pseudorepresentations.lean
      line: 13
      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.exists_rep_of_trace_identities`: over an algebraically\
        \ closed field of characteristic `0`, a\n  function on `G` that obeys every polynomial identity among traces\
        \ of homomorphisms `G → GL n k` is\n  the trace of such a homomorphism with non-degenerate trace form (`New.IsTraceNondeg`).\n\
        * `New.GaloisRep.exists_continuous_isTraceNondeg_of_tendsto_trace`: a limit, in the sense of\n  `IsApproximatingMonoid`\
        \ (uniform approximation by linear combinations), of traces of continuous\n  representations is the trace\
        \ of a continuous representation.\n\nNotions from other files:\n* `New.IsTraceNondeg`: Non-degeneracy of\
        \ the trace form on the span of r(G): any x in that span with\n  tr(x r(g)) = 0 for all g is zero.\n* `New.CoeffRing`:\
        \ Rings of integers of finite Galois extensions of `ℚ_ℓ` inside `ℚ̄_ℓ`, where the\n  class `ThePrime ℓ`\
        \ records that ℓ is the fixed prime.\n* `New.Selmer.IsLatticeIn`: an `O`-valued representation `u` is conjugate\
        \ in `GL n ℚ̄_ℓ` to a given\n  ℓ-adic representation `r`.\n\n## Relation to the literature\n\nKnown result:\
        \ a function obeying the trace identities is the trace of a representation\n(pseudocharacters), and the\
        \ lattice stable under a family spanning the matrix algebra is unique up\nto scalars. Here all polynomial\
        \ identities among traces are assumed, not only the Frobenius\nidentity, so no invariant theory is needed.\n\
        Semisimple means a non-degenerate trace form on the span of the image, in characteristic 0. The file\nalso\
        \ proves that a limit of traces of continuous representations is the trace of a continuous\nrepresentation.\
        \ Source: R. Taylor, Galois representations associated to Siegel modular forms of low\nweight, Duke Math.\
        \ J. 63 (1991), Theorem 1; R. Rouquier, Caractérisation des caractères et\npseudo-caractères, J. Algebra\
        \ 180 (1996); K. Conrad, Compact subgroups of GL_n(Qbar_p) (note).\n\nSee also `Lib.GaloisRep.WeightCongruence`.\n"
