      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.Weight`, `New.jumps`: weights, and the multiset of integers\
        \ attached to an embedding.\n* `New.heckePoly`, `New.HasHeckePolyAt`: the polynomial made from the eigenvalues\
        \ of the Hecke\n  operators `New.heckeSplit`, and the statement that `f` is spherical at `w` with this polynomial.\n\
        * `New.IsEigenform`, `New.IsSphericalOff`: eigenforms at almost all places of prime norm, and at all\n \
        \ split places outside a finite set and its conjugate.\n* `New.HasHeckePolyAt.isMonicOfDegree`: the Hecke\
        \ polynomial of a nonzero spherical eigenvector\n  (`New.HasHeckePolyAt`) of rank `n` is monic of degree\
        \ `n`.\n* `New.mostFrobenii`: the filter. `New.mostFrobeniiAt` adds that the Frobenius element `frob` tends\n\
        \  to `g`.\n* `New.dense_of_mostFrobenii`: a property of most Frobenius elements holds on a dense set; hence\
        \ the\n  filters `New.mostFrobeniiAt` are not trivial.\n\nNotions from other files:\n* `New.IsFrob`: `σ`\
        \ stabilises the valuation subring `A` and `σ • x ≡ x ^ q` modulo the maximal\n  ideal for all `x ∈ A`.\n\
        * `New.IsPlaceOver`: The valuation subring A of Ω lies over the prime w of E: an integer of E is in\n  the\
        \ maximal ideal of A exactly when it lies in w.\n* `New.stdLevel`: The subgroup K_0 = G_f ∩ GL_n(Ô) of the\
        \ finite adelic unitary group, the\n  stabiliser of the standard lattice Ô^n.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.GaloisRep.Main.OddRank`, `Lib.GaloisRep.LocalGlobal.LabelCompatibility` and\n`Lib.ClassField.Global.Chebotarev`\
