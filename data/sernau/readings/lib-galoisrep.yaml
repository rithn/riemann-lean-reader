    excerpt:
      path: grh/src/Lib/GaloisRep/WeightCongruence.lean
      line: 7
      endLine: 11
      text: 'A prime `l` and an isomorphism `ιℓ` from `ℂ` to the algebraic closure of `ℚ_[l]` are fixed. Twisting

        an algebraic modular form by its weight, evaluated at the components of `g` above `l`, gives its

        `l`-adic model. An ultrametric Stone–Weierstrass theorem is proved. It shows that combinations of

        matrix coefficients of free weights are uniformly dense among continuous `l`-adic functions that

        factor through general linear groups over one finite extension of `ℚ_[l]`.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/WeightCongruence.lean
      line: 12
      endLine: 59
      text: "\n## Main definitions and results\n\n* `New.padicComponents`: the continuous homomorphism sending `g`\
        \ to its components at the places\n  above `l` induced by the embeddings `New.weightEmbedding`, one for\
        \ each infinite place.\n* `New.padicModel`: the `ιℓ`-semilinear map `f ↦ (g ↦ M ρ_κ'(z g)⁻¹ ιℓ(f g))`, where\
        \ `ρ` is\n  `New.weylRep` and `z` is `New.padicComponents`.\n* `New.stoneWeierstrass_ultrametric`: a function\
        \ that agrees with an element of `N` on each fibre of\n  the family of all multipliers lies in the closure\
        \ of `N`.\n* `New.mem_uniformClosure_weylRep_coeff`: a continuous function that factors through\n  `z :\
        \ X → ∏ GL_N(k)`, whose entries lie in one finite extension of `ℚ_[l]`, is a uniform limit\n  (`New.uniformClosure`)\
        \ of combinations of matrix coefficients of free weights.\n* `New.GaloisRep.exists_padicModel_hecke_contraction`:\
        \ a Hecke operator at a split place, acting on\n  `l`-adic functions without increasing the sup norm. It\
        \ acts on the model of an eigenform by a\n  fixed multiple of a coefficient of the Hecke polynomial.\n*\
        \ `New.padicModel_mem_uniformClosure`: the model of a form `f` is a uniform limit from the span of\n  models\
        \ of forms of level `K` and character `θ` whose weights are free (`New.HasNoSmallRelations`)\n  at a chosen\
        \ set `T` of places, if the elements of `K` trivial over `T` fix `f` and have `θ = 1`.\n\nNotions from other\
        \ files:\n* `New.Space.forms`: Algebraic modular forms of weight κ on a definite space V: functions f on\
        \ G_f\n  with open right stabiliser and f(γg) = ρ_κ(γ)f(g) for rational γ, ρ_κ = `New.Space.weightRep`.\n\
        * `New.Weight`: for `κ : Weight E` and an infinite place `v` of `E`, `κ.1 v h` is the number of\n  columns\
        \ of height `h` of a Young diagram, and `κ.2 v` is an integer exponent of the determinant.\n* `New.weylRep`:\
        \ The monoid homomorphism from ∏_τ GL(n_τ,R) to square matrices sending g to ∏_τ\n  det(g_τ)^{e_τ} times\
        \ the Schur matrix of g, for integers e_τ; its rows and columns are indexed by\n  `WeylIndex`/`WeylIndexFamily`,\
        \ the coordinates of vectors of weight κ.\n* `New.HasHeckePolyAt`: At the split place w, f is fixed by K_w,\
        \ each Hecke operator T_{w,j} acts on\n  f by a scalar t_j, and P = Σ(−1)^j q_w^{j(j−1)/2} t_j X^{n−j}.\n\
        * `New.ofSplitPlace`: For a split place w, the homomorphism GL_n(E_w) → G_f sending g to the unitary\n \
        \ element with component g at w and 1 off w, w̄.\n\n## Relation to the literature\n\nKnown result: Non-archimedean\
        \ Stone–Weierstrass theorem for modules (localisation form). The result\nconcerns scalar-valued functions\
        \ on a compact space over an ultrametric normed field. A continuous\nfunction that agrees with some member\
        \ of a subspace on each level set of the subspace's multipliers\nlies in the closure of that subspace. Source:\
        \ Dieudonné 1944; Kaplansky, The Weierstrass theorem in\nfields with valuations (1950); module form as in\
        \ Prolla, Approximation of Vector Valued Functions\n(1977) and Topics in Functional Analysis over Valued\
        \ Division Rings (1982).\n\nKnown result: Density of algebraic vectors, congruences to supercuspidal types,\
        \ and limits of\neigensystems. For definite unitary groups, a form is an l-adic uniform limit of forms with\
        \ very\ndifferent weight gaps at some embeddings and a prescribed character on the level, such as a wild\n\
        type. No completed cohomology or congruences modulo powers of l are used. Source: M. Emerton, V.\nPaškūnas,\
        \ On the density of supercuspidal points of fixed regular weight, J. Éc. polytech. Math. 7\n(2020); J. Fintzen,\
