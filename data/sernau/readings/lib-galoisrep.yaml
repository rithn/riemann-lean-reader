      path: grh/src/Lib/GaloisRep/BaseChange/GlobalRoot.lean
      line: 9
      endLine: 15
      text: 'The main setting is a cyclic extension `E''/E` of CM fields of prime degree with character `μ`

        (`New.IsStep`: `μ` kills `Eˣ`, and each idele `t` of `E` with `μ (t * star t) = 1` is a norm from

        `E''` times an element of `Eˣ`) and Galois automorphism `σ`. For a unitary matrix `γ` and a

        polynomial `z`, `New.IsRootQuotient γ z a` means `a * z(γ)ᴴ = z(γ)`. The file proves a Hasse

        principle for ideles in a single CM field `L` and develops the calculus of this relation. It

        combines the two to show that an adelic root for a `σ`-fixed characteristic polynomial is rational

        up to a coboundary.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/BaseChange/GlobalRoot.lean
      line: 16
      endLine: 39
      text: "\n## Main definitions and results\n\n* `New.exists_isSelfAdjoint_principalIdele_mul`: an adele `w`\
        \ with `w = x * star w`, `x` in `L`,\n  becomes conjugation invariant after multiplication by an element\
        \ of `Lˣ`.\n* `New.IsStep.exists_isSelfAdjoint_of_mem_kerCompNorm`: the twisted form, for an idele in\n\
        \  `kerCompNorm L μ` whose norm under a Galois automorphism `g` has this property, where `x` is fixed\n\
        \  by `g` and `E'[x] = ⊤`. It uses the Artin map, Hasse's norm theorem and Hilbert 90 for ideles.\n* `New.U.existsUnique_isRootQuotient`:\
        \ if `z(γ)` is invertible there is exactly one unitary `a`.\n* `New.exists_global_root`: let `z` be a root\
        \ for `P`, where `P` is the characteristic polynomial of\n  a unitary matrix over `E'` and is fixed by `σ`.\
        \ Then there are a rational `w` and an adelic `c`\n  with the following property. Let `x = w * z * σ c`.\
        \ At every adelic unitary `γ` killed by the\n  radical of `P`, `x(γ)` is invertible, and `a = x(γ) / x(γ)ᴴ`\
        \ satisfies `a * c(γ)ᴴ = c(γ)`.\n\nNotions from other files:\n* `New.adeleMap`: For an embedding f: K →\
        \ L of number fields, the induced ring homomorphism from the\n  finite adeles of K to those of L.\n* `New.kerCompNorm`:\
        \ The group of finite ideles of E' whose norm to E is killed by μ.\n* `New.U.mapEnd`: The endomorphism of\
        \ the unitary group {g : gᴴg = 1} over R given by applying\n  entrywise a ring endomorphism σ commuting\
        \ with the involution.\n\n## Relation to the literature\n\nKnown; see `Lib.GaloisRep.BaseChange.PrimeDegreeTransfer`\
        \ for sources.\n"
