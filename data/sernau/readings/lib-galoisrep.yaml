      text: "\n\n## Main definitions and results\n\n* `New.GaloisRep.IsTameExponent w A T f s a`: the inertial element\
        \ `s` moves a `(q ^ f - 1)`-th root\n  of a uniformiser by the root of unity that `T` reads as `exp (2πi\
        \ a / (q ^ f - 1))`.\n* `New.GaloisRep.IsLabelledAt`: for a polynomial `c` over the residue field, the polynomial\
        \ with\n  roots `ιℓ ((T ^ a) x)` satisfies a given condition at each such `s`. Here `x` runs over the roots\n\
        \  of `c`, `ιℓ` is the fixed map from `ℂ` to `PadicAlgCl ℓ`, and `T ^ a` is the `a`-th power of the\n  character\
        \ `T`.\n* `New.GaloisRep.IsTameExponent.pow_apply_charName`: comparison with the local Artin map, for\n\
        \  characters of `k_wˣ`.\n* `New.GaloisRep.exists_isTameExponent`: exponents exist when `f` is a factorial.\n\
        * `New.GaloisRep.Attached.isLabelledAt`: if an eigenform has, at a split place `w`, a type for\n  `GL n`\
        \ of the residue field given by a label (`New.HasProductLabel`: a polynomial `c` of degree\n  `d` and characters\
        \ `χ l` with multiplicities `t l`, where `d + ∑ l, t l` is the rank and the roots\n  of `c` and the names\
        \ of the `χ l` are all distinct), then inertia at `w` acts on the attached\n  Galois representation through\
        \ the tame characters given by the roots of the polynomial of the\n  label (`New.GaloisRep.IsLabelledAt`,\
        \ `New.GaloisRep.IsTameExponent`). The proof uses base changes\n  of prime degree in which `w` is inert\
        \ to reduce to the case where `c` splits into linear factors.\n  That case follows from `New.GaloisRep.Attached.local_global_of_eigencharacter`\
        \ applied to local\n  units.\n\nNotions from other files:\n* `New.IsPlaceOver A w`: the valuation subring\
        \ `A` of `Ω` lies over `w`, that is, an integer of `E`\n  is in the maximal ideal of `A` exactly when it\
        \ lies in `w`.\n* `New.Cohomology.centrePrime Ω A`: the integers of `Ω` that lie in the maximal ideal of\
        \ `A`.\n* `New.charName T χ`: the unit of `k_w` that names the character `χ` of `k_wˣ`; the map `χ ↦ x_χ`\
        \ is\n  an isomorphism from the character group of `k_wˣ` to `k_wˣ` that depends on `T`.\n* `New.GaloisRep.PolyKillsAt\
        \ r A s Q`: the polynomial `Q` kills `r s` if `ℓ` is a unit at `A`, and\n  kills the action of `s` on the\
        \ periods of `r` if `A` lies above `ℓ`.\n\n## Relation to the literature\n\nKnown result: Local-global compatibility\
        \ at tame level, away from ℓ and at ℓ. Here it is proved only\nat split places, for depth-zero types induced\
        \ from a squarefree type and characters of the\ndeterminant. It is stated as polynomials that kill inertia\
        \ elements, without the local Langlands\ncorrespondence, and it is reduced by cyclic base change to the\
        \ case of sorted tame Iwahori\neigencharacters. Source: Harris, Taylor, The geometry and cohomology of some\
        \ simple Shimura\nvarieties (2001); Taylor, Yoshida, J. Amer. Math. Soc. 20 (2007); Barnet-Lamb, Gee, Geraghty,\n\
        Taylor, Local-global compatibility for l = p, II (2014), Thm 1.1.\n\nSee also `Lib.ClassField.Local.ArtinMap`.\n"
