      endLine: 53
      text: "* `New.Variety.exists_levelGU_invTransposeGL_le`: an open subgroup that contains the integral points\n\
        \  trivial at a finite set `S` of places contains a principal level `\U0001D511` (up to inverse transpose).\n\
        \  The primes of `\U0001D511` are those of a given `N` and of a set `B` meeting each pair `w, w̄` of `S`.\n\
        * `New.GaloisRep.exists_rep_span_diagonal`: Galois representations `ρ τ`, one for each embedding `τ`\n \
        \ of `E` in `ℂ`, combine into one representation `r`. This `r` is multiplicity free (the span of its\n \
        \ image contains the diagonal matrices) and has the prescribed integers among its Hodge–Tate jumps\n  at\
        \ every `τ`. It is built from the semisimplification of the sum of the `ρ τ`, keeping each\n  irreducible\
        \ constituent once.\n* `New.Period.aeval_cocharacter_eq_zero`: let `x i ∈ ℂ_p` and integers `κ i` be given.\
        \ A polynomial\n  over `ℂ_p` that vanishes at `(χ(g) ^ (-κ i) g(x i))_i` for all `g ∈ G_p` near `1` also\
        \ vanishes at\n  `(T ^ (κ i) x i)_i`, with `T` the variable of the Laurent polynomials over `ℂ_p`.\n\nNotions\
