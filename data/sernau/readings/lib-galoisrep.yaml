      text: "\nNotions from other files:\n* `New.AutChar.HasWeight`: `b.HasWeight c 1` says that `b u = ∏_v u_v\
        \ ^ c v` whenever `u` has\n  integral finite part.\n* `New.WeilData`: Weil data on a stably unramified E.\
        \ They consist of ȷ in E with ȷ = −ȷ̄, Im τȷ > 0\n  for every τ in the CM type and (1 − ȷ⁻¹)/2 integral;\
        \ a finite idele α for which the completed\n  integers Ô are self-dual under (z, u) ↦ ψ_f(ȷαᾱzu); and a\
        \ splitting character υ equal to −1 at\n  uniformisers of the places w with w = w̄.\n\n## Relation to the\
        \ literature\n\nKnown result: Theta lift to larger rank, the step that reduces even rank to odd rank. Here\
        \ a\nnon-zero theta lift in the convergent range from definite U(n) to U(n+s), with s > n, replaces\nendoscopic\
        \ transfer. It keeps spherical places, and its Hecke polynomials are twisted and gain the\nstring of a character\
        \ of U(1). Source: Blasius, Rogawski, Motives for Hilbert modular forms, Invent.\nMath. 114 (1993) and Shin,\
        \ Ann. of Math. 173 (2011) for the idea (endoscopic transfer to odd rank);\nHarris, Soudry, Taylor, Invent.\
        \ Math. 112 (1993) for theta lifts with a varying character.\n"
