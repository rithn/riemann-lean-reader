        \ to `1`\n  modulo `ϖ ^ (m + 1)`; so `m = 0` gives `1 + ϖ M_n(O_w)` and `m = 1` gives `1 + ϖ² M_n(O_w)`.\n\
        * `New.stdLevel E n`: the integral points of the finite adelic unitary group, the stabiliser of\n  `Ô ^\
