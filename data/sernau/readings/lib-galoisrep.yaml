      text: "This file concerns base change along a step `E' / E` (`New.IsStep`): an extension of prime degree\n\
        with a character `μ` of the finite ideles of `E`. It constructs levels at which the unit functions\nmatch\
        \ in the sense of `New.IsMatchingPair`.\n\n## Main definitions and results\n\n* `New.cocyclesSplit_and_isMatchingPair_of_congruence`:\
        \ at a principal congruence level over a\n  profinite ring with tame action, the cocycles split and the\
        \ indicator functions of the level form\n  a matching pair.\n"
    remainder:
      path: grh/src/Lib/GaloisRep/BaseChange/CongruenceLevelMatching.lean
      line: 16
      endLine: 36
      text: "* `New.IsStepUnramifiedAt`: `w` is unramified in `E'`, and `μ ∘ Nm` kills the local units above `w`.\n\
        * `New.exists_isTameAtLevel_intAdeleMap`: `σ ≠ 1` is tame (`New.IsTameAtLevel`) on the integral\n  adeles\
        \ of `E'` at every `σ`-fixed level that vanishes at the totally ramified places dividing a\n  fixed integer\
        \ `C`.\n* `New.exists_isBaseChangeLevel`: below any open subgroup `H` over `E` there are local levels over\n\
        \  `E'` whose groups above any set of places are `σ`-stable, have split cocycles, and carry matching\n \
        \ indicator functions.\n\nNotions from other files:\n* `New.IsTameAtLevel`: the conditions on a ring endomorphism\
        \ `τ` with `τ ^ p = 1` and a level `m`\n  under which descent works.\n* `New.CocyclesSplit`: every `s` in\
        \ `K` of twisted norm `1` under `τ` is a coboundary `t * (τ t)⁻¹`\n  on the support of `u`, for some `t\
        \ ∈ K` that is `1` off it.\n* `New.IsMatchingPair`: a function `f` and a twisted function `φ` match, one\
        \ characteristic\n  polynomial at a time, through a polynomial root (`New.IsNormRoot`).\n* `New.localLevel`:\
        \ the elements of `New.Gf E n` whose component at each place of a set `S` lies in\n  a given local group,\
        \ by default `GL_n` of the local integers, with no condition outside `S`.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.GaloisRep.BaseChange.PrimeDegreeTransfer` for sources.\n"
