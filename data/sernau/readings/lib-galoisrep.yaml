      endLine: 43
      text: "This map respects Frobenius elements, inertia and the cyclotomic character. Finite type and killing\n\
        polynomials pass from a representation to one that embeds in it near the identity. This covers\nsubrepresentations,\
        \ restriction to open subgroups and conjugation by automorphisms of `Ω`.\n\n## Main definitions and results\n\
        \n* `New.GaloisRep.IsGoodAt`: unramified, or crystalline.\n* `New.GaloisRep.IsFiniteTypeAt`: trivial on\
        \ an open part of inertia, or potentially crystalline.\n* `New.GaloisRep.PolyKillsAt`: the polynomial `P`\
        \ kills `s`.\n* `New.GaloisRep.JumpsRelAt`, `New.GaloisRep.HasJumpsAt`: the Hodge–Tate jumps compared with\n\
        \  multisets `J`.\n* `New.GaloisRep.IsSphericalAbove`: the three conditions that hold at a spherical place\
