      endLine: 34
      text: "`New.IsProfiniteRing R` means: every sequence `x` has a unique `L` with `x N ≡ L` modulo each\nnatural\
        \ number `M ≠ 0`, for `N` in a set of the hyperfilter.\n`New.twistedNorm τ p δ` is the twisted norm `δ ·\
        \ τ δ ⋯ τ^(p-1) δ` of `δ` in a monoid.\n\n## Main definitions and results\n\n* `New.IsTameAtLevel.hilbert90_gl`,\
        \ `New.IsTameAtLevel.hilbert90_unit`: a cocycle `≡ 1 mod m` is a\n  coboundary of an element `≡ 1 mod m`,\
        \ for `GL n` and for units.\n* `New.IsTameAtLevel.exists_prod_range_pow_apply_eq`: a fixed unit `≡ 1 mod\
        \ m` is the norm of a unit\n  `≡ 1 mod m`.\n* `New.IsProfiniteRing.exists_algHom_semiconj`, `New.IsProfiniteRing.finite_quotient_natCast`,\n\
        \  `New.isTameAtLevel_quotientNatMap`, bundled in\n  `New.IsTameAtLevel.exists_algHom_semiconj_quotientNatMap`:\
        \ a limit map from the finite quotients\n  `R ⧸ (N !)` reduces the profinite case to the finite one.\n\n\
        ## Relation to the literature\n\nKnown result: Hilbert 90 for GL_n and norm surjectivity on units, cyclic\
        \ action, congruence level.\nThis is done over Artinian, finite or profinite rings, where the action need\
        \ only be free away from\nan invariant element m and have an element of trace one modulo m. Cocycles, coboundaries\
        \ and units\nare congruent to 1 modulo m. Source: A. Speiser 1919;\nJ.-P. Serre, Corps locaux, 1962, Ch.\
