      text: "\n## Main definitions and results\n\n* `New.IsSampleTotal`: a number `a` is a weighted sum of `F` over\
        \ finitely many points, and the\n  weighted number of moves from these points to each relevant point is\
        \ `c`.\n* `New.IsSampleTotal.mul_eq_mul_of_bijOn`: two such sums `a`, `b` with weights `c`, `d` satisfy\n\
        \  `b * c = d * a` when a map between the point sets matches values and moves.\n* `New.Weight.baseChange`:\
        \ the weight of `E'` that has at each infinite place the data of `κ` at the\n  place below.\n* `New.exists_trace_mul_weightRep_eq_of_twistedNorm_eq`:\
        \ the twisted character of `κ.baseChange` at\n  `δ` is the character of `κ` at the norm of `δ`.\n\nNotions\
        \ from other files:\n* `New.Space.forms V κ`: the forms of weight `κ` on a space `V`, smooth functions `ψ`\
        \ on the finite\n  adelic unitary group `Gf E n` (`U (1 : Matrix n n (\U0001D538f E))`; `U V.J` is the rational\
        \ one) with\n  `ψ (V.embFin γ * g) = ρ γ (ψ g)` for rational `γ`, where `ρ` is `V.weightRep κ.fst κ.snd`\
        \ and\n  `V.embFin` embeds the rational unitary group; `V.formTranslation κ` is right translation on them.\n\
        * `levelSpace π L`: the vectors fixed by `π k` for every `k ∈ L`.\n* `New.IsOperatorOf π L T φ`: `T` is\
