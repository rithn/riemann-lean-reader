      endLine: 10
      text: 'A Galois representation that is only known to be killed, for most Frobenius elements (the filter

        `New.mostFrobenii`), by monic polynomials of degree `n` is shown to have rank `n`, given that the

        span of its image contains the diagonal matrices and that a one-parameter torus with `n` free

        weights (`New.HasNoSmallRelations`) lies in the Zariski closure of a conjugate of the image of every

        neighbourhood of `1`.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/KillingPolynomials.lean
      line: 11
      endLine: 46
      text: "\n* `New.powMinor y m a`: a minor of order `m` of the matrix whose column `j < m` lists the entries\
        \ of\n  `y ^ j`. Over a field all of them vanish exactly when `1, y, …, y ^ (m - 1)` are linearly\n  dependent.\n\
        * `New.exists_factor_charpoly`: over an integrally closed domain, if these minors all vanish, a\n  factor\
        \ of degree less than `m` of the characteristic polynomial of `y` kills `y`.\n* `New.HasNoSmallRelations.inv_scalar_on_blocks`:\
        \ if these minors vanish, with `m ≤ n + 1` and `c`\n  surjective, for `diagonal (T ∘ e ∘ c) * x` over the\
        \ Laurent polynomials, then `n < m` and on each\n  fibre of `c` the block of `x⁻¹` is a scalar matrix.\n\
        * `New.card_eq_and_charpoly_eq`: the rank is `n` and the polynomials are the characteristic\n  polynomials.\n\
        \nNotions from other files:\n* `New.Ω`: the field `Ω` is an algebraic closure of `ℚ`: it has characteristic\
        \ zero, is\n  algebraically closed and is algebraic over `ℚ`.\n* `New.HasNoSmallRelations e`: for `e : Fin\
        \ n → ℤ`, distinct exponent vectors `α` of the same total\n  degree at most `(n + 1) ^ 2` have distinct\
        \ weights `∑ i, α i * e i`.\n* `New.FrobeniusDatum E`: a place of degree one of `E` with a Frobenius element\
        \ `frob` above it.\n* `New.mostFrobenii E`: the filter of sets of such data that, inside every nonempty\
        \ open set of\n  `Gal(Ω/E)`, contain all data at almost all places whose Frobenius lies in a smaller nonempty\
        \ open\n  set.\n* `T i`: the monomial of degree `i` in the Laurent polynomials `k[T;T⁻¹]`.\n\n## Relation\
        \ to the literature\n\nKnown result: Rank n and characteristic polynomials from Frobenius polynomial relations.\
        \ Let a\ncontinuous representation have image spanning the diagonal matrices, and let monic degree-n\npolynomials\
        \ kill it at most Frobenius elements. If a cocharacter with free (very different)\nexponents constrains\
        \ it, then its rank is n and the polynomials are its characteristic polynomials\nat most Frobenius elements.\
        \ This is one step inside the known construction of Galois representations\nfor definite unitary groups.\
        \ In the literature, Frobenius polynomial relations on a dense set\ndetermine a representation when the\
        \ n-dimensional one is known and large. Related work:\nBoston–Lenstra–Ribet 1991; Nekovář, Eichler–Shimura\
        \ relations and semisimplicity, 2018;\nFayad–Nekovář 2019; Harris–Taylor 2001, VII.1.8.\n\nSee also `Lib.GaloisRep.Main.OddRank`.\n"
