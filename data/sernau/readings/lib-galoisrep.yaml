      text: "The file proves four results on unitary groups and Galois representations. Here `O_w` is the ring of\n\
        integers at a place `w` of `E` with uniformiser `ϖ`, and `χ` is the cyclotomic character.\n\n## Main definitions\
        \ and results\n\n* `New.Variety.exists_isCuspidalType`: a character of `1 + ϖ M_N(O_w)`, trivial on\n  `1\
        \ + ϖ² M_N(O_w)`, that is nontrivial on every unipotent radical. It is\n  `k ↦ exp (2πi u (tr (b (k - 1))))`\
        \ for an integral matrix `b` with irreducible characteristic\n  polynomial modulo `w` and an additive character\
        \ `u : E_w / ϖ² → ℚ/ℤ` with `u ϖ ≠ 0`.\n"
    remainder:
