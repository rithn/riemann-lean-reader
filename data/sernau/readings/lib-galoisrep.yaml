        \ pair of test functions for the\n  twisted trace identity at the places above `Z`, at level `K`.\n* `New.heckeFun\
        \ ρ L F` is the Hecke operator `∑_{g ∈ G/L} F g • ρ g`, `New.levelSpace ρ L` is the\n  `L`-fixed space,\
        \ and `New.Weight.baseChange` is the weight pulled back to `E'`.\n\n## Relation to the literature\n\nKnown\
