      endLine: 11
      text: 'This file proves that eigenforms on the definite space `New.stdSpace` of odd rank over stably

        unramified CM fields have attached Galois representations. It first proves a descent result along

        a step of weak base change. The general odd-rank case is then reduced to the split case of

        `Lib.GaloisRep.Main.SplitCase` by quadratic base changes, whose representations are glued on open

        subgroups of the Galois group.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/Main/OddRank.lean
      line: 12
      endLine: 53
      text: "\n## Main definitions and results\n\n* `New.IsWeakBaseChange.hasHeckePolyAt_of_decompGroup_le`: along\
        \ a step of weak base change from f\n  to f', at a split place off S and its conjugate whose decomposition\
        \ group lies in the open\n  subgroup N of the step, the Hecke polynomial of f passes to f'.\n* `New.IsWeakBaseChange.attached_comp_stepKerInclusion`:\
        \ a representation r' attached to f',\n  restricted to N (`New.QZChar.stepKer`), is attached to the polynomials\
        \ of f.\n* `New.IsWeakBaseChange.descendsAt`: the local conditions on r' pass to every representation\n\
        \  attached to f (`New.GaloisRep.DescendsAt`).\n* `New.GaloisRep.sphericalCompat_of_odd`: the statement\
        \ `New.GaloisRep.SphericalCompat` (an\n  eigenform has an attached Galois representation, and every attached\
        \ representation is compatible\n  at a spherical place w) for the definite space `New.stdSpace` of odd rank\
        \ over a stably unramified\n  CM field (`New.HasPrimitiveRoot5040`). The split case is applied to base changes\
        \ of f along\n  quadratic steps. The representations obtained on open subgroups are glued\n  (`New.GaloisRep.exists_attached_of_open_subgroups`),\
        \ and the local properties at w descend from\n  one step (`New.IsWeakBaseChange.isCompatibleAt_of_attached`).\n\
        \nNotions from other files:\n* `New.IsWeakBaseChange` μ Z f f': the set Z is finite and, for u above w ∉\
        \ Z ∪ Z̄, sphericity\n  passes from f to f' at `New.IsStepUnramifiedAt` places, and Hecke polynomials pass\
        \ from f to f' at\n  `New.IsMatched` places.\n* `New.IsEigenform`: f ≠ 0, and almost all places w of prime\
        \ norm are split and f has the Hecke\n  polynomial P w at w.\n* `New.GaloisRep.Attached` P r i: r is continuous\
        \ with non-degenerate trace form, i (by default the\n  identity) is an open map to Gal(Ω/E), and at most\
        \ Frobenius elements the characteristic\n  polynomials of r are ℓ-adically close to those given by P.\n\n\
        ## Relation to the literature\n\nGalois representations attached to forms on definite unitary groups. The\
        \ form proved\nis for the standard definite unitary group of odd rank over a stably unramified CM field\n\
        (`New.HasPrimitiveRoot5040`). At a place whose local compact group fixes the form,\neach attached ℓ-adic\
        \ representation is unramified or crystalline with the Hodge–Tate jumps of the\nweight, and each Hecke polynomial\
        \ there kills geometric Frobenius. Here \"attached\" asks, beyond\ncontinuity and a non-degenerate trace\
        \ form, only that Hecke polynomials are ℓ-adically close to\ncharacteristic polynomials at most Frobenius\
        \ elements. The construction uses ℓ-adic limits, and\nquadratic base changes whose representations are glued\
        \ on open subgroups of the Galois group.\nSource: Chenevier, Harris, Construction of automorphic Galois\n\
        representations II, Camb. J. Math. 1 (2013), Thm 3.2.3; with Labesse, Changement de base CM et\nséries discrètes\
        \ (2011), Cor. 5.3, and Barnet-Lamb, Gee, Geraghty, Taylor, Potential automorphy and\nchange of weight (2014),\
        \ Thm 2.1.1.\n"
