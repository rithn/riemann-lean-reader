      text: 'This file treats algebraic modular forms on a definite unitary group and their attached Galois

        representations. The statement `New.GaloisRep.SphericalCompat` asserts the existence of an attached

        Galois representation and local–global compatibility at a place where the form is spherical.


        ## Overview of this theory


        Let `ℓ` be a prime and `ι : ℂ ≃ ℚ̄_ℓ` a fixed isomorphism.'
    remainder:
      path: grh/src/Lib/GaloisRep/Main/AllRanks.lean
      line: 13
      endLine: 79
      startOffset: 562
      endOffset: 5401
      text: " Let `E` be a CM field with `New.WeilData`\n(auxiliary adelic data). Let `f` be an eigenform of weight\
        \ `κ`, with Hecke polynomials `P w` at\nfinite places `w`, on the unitary group of the standard definite\
        \ hermitian space of rank `n ≥ 1`. A\ncontinuous `r : Gal(Ω/E) → GL_n(ℚ̄_ℓ)` with non-degenerate trace form\
        \ is `New.GaloisRep.Attached` to\n`P` if, for each `ε > 0`, `det (X - r s)` is coefficientwise within `ε`\
        \ of `ι(P w)` for most\nFrobenii `s` at places `w` (`New.mostFrobenii`).\n\n* `New.GaloisRep.sphericalCompat_std`:\
        \ such an `r` exists. If `f` has maximal level at `w`, every\n  such `r` is unramified or crystalline above\
        \ `w`, with the Hodge–Tate jumps of `κ`; for split `w`\n  the Hecke polynomial kills geometric Frobenius.\
        \ `New.GaloisRep.Attached.trace_eq`: `P` determines\n  `tr r`.\n* `New.GaloisRep.Attached.local_global_of_eigencharacter`:\
        \ let `w` be split (`w̄ ≠ w`) and `A` a\n  place above it. Let `f` be a pro-`p` Iwahori eigenvector (`p`\
        \ below `w`) with character\n  `ξ = (ξᵢ)`, where `‖ξᵢ(ϖ)‖` is non-increasing for the uniformiser `ϖ`. Then\
        \ `r` is of finite type\n  at `A` (`New.GaloisRep.IsFiniteTypeAt`) and has the jumps of `κ`. Also `∏ (X\
        \ - ι ξᵢ(x))` kills, in\n  the sense of `New.GaloisRep.PolyKillsAt`, each `s` in the decomposition group\
        \ with `s⁻¹` the\n  `q^k`-th power on the residue field (`q` the residue cardinality, `k ≥ 0`). Here `x\
        \ ∈ E_wˣ` has\n  order `k` and local Artin symbol the class of `s`.\n* `New.GaloisRep.Attached.isLabelledAt`:\
        \ the first two conclusions also hold if `f` has a\n  `New.HasProductLabel` at `w`. Then a polynomial built\
        \ from the values of the label's tame\n  characters kills each element of inertia, in the same sense.\n\n\
        These replace base change to `GL_n` (Labesse), Galois representations with local–global\ncompatibility (Shin,\
        \ Chenevier–Harris, Barnet-Lamb–Gee–Geraghty–Taylor) and the local Langlands\ncorrespondence. Local polynomials\
        \ kill but need not be characteristic. No Weil–Deligne\nrepresentation is built.\n\nPlan. `Lib.Shimura`:\
        \ models of signature `(1, n - 1)`, the congruence relation and, for odd `n`,\neigenvalues of forms with\
        \ a cuspidal type in cohomology. `Lib.Cohomology`: base change, fixed point\nformula. `Lib.PadicComparison`:\
        \ cohomology above `ℓ` is crystalline; Hodge classes give jumps.\n`Main.SeedRepresentation` cuts it to rank\
        \ `n` by `KillingPolynomials`. `Main.OddRank`: all forms by\n`ℓ`-adic limits (`WeightCongruence`, `Pseudocharacter`,\
        \ `Lib.PadicHodge.Limit`), then fields with\nWeil data by `Main.QuadraticStep` and `BaseChange`. `Main.ThetaLift`,\
        \ `Main.AllRanks`: two lifts to\nrank `2n + 1`, then cancel characters. `LocalGlobal`: tame base change\
        \ down to the spherical case.\n\n## Main definitions and results\n\n* `New.GaloisRep.sphericalCompat_std`:\
        \ `New.GaloisRep.SphericalCompat` holds in every positive rank\n  n. The proof lifts the eigenform to the\
        \ odd rank 2n + 1 along two different characters and cancels\n  the n + 1 extra characters from each of\
        \ the two representations.\n* `New.Patching.eigenformsAt`: forms spherical at `w` with given eigenvalues\
        \ (no condition if `w` is\n  not split).\n* `New.Patching.Isotypic`: the isotypic spaces, each the `liminf`\
        \ of the `New.Patching.eigenformsAt`\n  over the places. They are kept by operators supported at one place\n\
        \  (`New.Patching.Isotypic.map_mem`).\n* `New.Patching.Isotypic.iSupIndep_val`: the isotypic spaces are\
        \ independent.\n* `New.Patching.Isotypic.galRep`, `New.Patching.Isotypic.attached_galRep`: a chosen Galois\n\
        \  representation of an isotypic space, attached to its Hecke polynomials when the space is nonzero\n  (`New.Patching.Isotypic.exists_attached`,\
        \ `New.Patching.Isotypic.attached_galRep_of_exists`).\n\nNotions from other files:\n* `New.WeilData`: Weil\
        \ data on a stably unramified E: ȷ in E with ȷ = −ȷ̄, Im τȷ > 0 for every τ in\n  the CM type and (1 − ȷ⁻¹)/2\
        \ integral; a finite idele α for which the completed integers Ô are\n  self-dual under (z, u) ↦ ψ_f(ȷαᾱzu);\
        \ and a splitting character υ equal to −1 at uniformisers of\n  the places w with w = w̄.\n* `New.AutChar.HasWeight\
        \ μ e ψ`: the character μ of U(1)(\U0001D538) has weight e and tame part ψ, that is\n  μ(u) = ∏_v u_v^{e(v)}\
        \ · ∏_w ψ_w(u mod w) when u has integral finite part. From it,\n  `HasWeight.toAlgebraic k j` is the algebraic\
        \ Hecke character μ(x/x̄) υ(x)^{−k} |x|^{j−k/2}, and\n  `New.heckeCoeff χ ∅ w` is the value of a Hecke character\
        \ χ at the chosen uniformiser of w.\n* `New.IsTraceNondeg r`: the trace form on the span of the image of\
        \ r is non-degenerate.\n* `New.Space`: a hermitian space with a point, given by a matrix J over E and x\
        \ in GL_n(\U0001D538) with xᴴJx\n  equal to the diagonal matrix of its signs at the infinite places and\
        \ 1 at the finite places.\n\n## Relation to the literature\n\nKnown; see `Lib.GaloisRep.Main.OddRank`, `Lib.ClassField.Global.CMSplittingCharacters`\
        \ and\n`Lib.Adelic.AutomorphicForms.SmoothAlgebraicForms` for sources.\n"
