      startOffset: 182
      endOffset: 730
      text: 'Base data `D` consist of a finite set `D.places` of places and a space `D.forms` of forms of a fixed

        type at `D.places`. The forms of principal level at finitely many further places make up a

        finite-dimensional space with an integral lattice. Functions on the systems of eigenvalues act on

        this space, by a scalar on the forms of each system. Those that keep integral forms make up a closed

        integral Hecke algebra. At the auxiliary places, translations and the action of `GL_N` over the

        residue fields give operators that commute with this algebra.'
    remainder:
      path: grh/src/Lib/GaloisRep/TaylorWiles.lean
      line: 12
      endLine: 48
      startOffset: 730
      endOffset: 3187
      text: "\n\n## Main definitions and results\n\n* `New.Patching.TaylorWilesPlaces`: Frobenius data at places\
        \ `w j` whose residue fields have\n  order ≡ 1 mod m.\n* `New.Patching.BaseLevel.formsOfLevel`: the forms\
        \ of that type and principal level at `L`, with the\n  lattice `New.Patching.BaseLevel.ellIntegralForms`\
        \ of integral forms and the algebra\n  `New.Patching.BaseLevel.integralEnd` that keeps it.\n* `New.Patching.BaseLevel.heckeAlgebra`,\
        \ `New.Patching.BaseLevel.heckeAction`: the functions whose\n  operator keeps integral forms, and their\
        \ action; `New.Patching.BaseLevel.isClosed_heckeAlgebra`:\n  they form a closed set for the product topology\
        \ on functions from systems to `PadicAlgCl ℓ`.\n* `New.Patching.BaseLevel.localOperators`: the operators\
        \ that come from translations at one place\n  `w j`. They commute with the Hecke algebra.\n* `New.Patching.BaseLevel.residueRep`:\
        \ the action of the groups `GL_N` over the residue fields,\n  `N = |n|`; its fixed forms are those of base\
        \ level\n  (`New.Patching.BaseLevel.mem_formsOfLevel_empty_iff_residueRep_fixed`).\n* `New.Patching.BaseLevel.exists_higman_operator`:\
        \ for a finite group `Δ` embedded in the product of\n  the groups `GL_N` over the residue fields at the\
        \ places `w j` (all off level), an operator `Ψ`\n  with `∑ g⁻¹ Ψ g = c`.\n\nNotions from other files:\n\
        * `New.levelOf`: The elements of K₀ = `stdLevel E n` whose reductions modulo the places w_i lie in a\n \
        \ subgroup H of ∏_i GL_n(k_{w_i}); for H = ⊥ this is the principal level at these places.\n* `New.Space.forms`:\
        \ Algebraic modular forms of weight κ on a definite space V: functions f on G_f\n  with open right stabiliser\
        \ and f(γg) = ρ_κ(γ)f(g) for rational γ, ρ_κ = `New.Space.weightRep`.\n* `New.Patching.Isotypic`: An isotypic\
        \ space of forms: for a system t of Hecke eigenvalues at the\n  finite places, the forms that are Hecke\
        \ eigenforms with eigenvalues t at almost all places.\n* `New.Patching.localFormRep`: The action of GL_N(E_w),\
        \ N = |n|, on forms at a split place w.\n\n## Relation to the literature\n\nKnown result: Taylor–Wiles freeness\
        \ at auxiliary primes, up to the orders of the stabilisers. Here\nthe setting is integral forms of principal\
        \ level on a definite unitary group, with any finite\nsubgroup of the product of the finite general linear\
        \ groups at the auxiliary places. Freeness holds\nonly up to a fixed integer and is expressed as one Higman\
        \ operator. Source: Taylor–Wiles, Ann. Math.\n141 (1995); Clozel–Harris–Taylor, Publ. IHES 108 (2008), §3.\n"
    standaloneReview:
      verdict: clear
      reason: Describes the integral Hecke algebra and commuting auxiliary operators.
