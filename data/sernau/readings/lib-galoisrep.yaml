      text: 'This file sets up base change for unitary groups along a ring endomorphism `σ` of finite order.

        Finally it defines the Galois action on `New.Gf E'' n` and the base change map from the finite adelic

        unitary group `New.Gf E n`, the matrices `g` over the finite adeles with `gᴴ g = 1`, for an

        extension `E''/E` of CM fields.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/BaseChange/Defs.lean
      line: 10
      endLine: 36
      text: "\n## Main definitions and results\n\n* `New.twistedNorm`: the twisted norm `δ · τ δ ⋯ τ^(p-1) δ` in\
        \ a monoid. `New.twistedNorm_conj`\n  shows that twisted conjugation of `δ` conjugates the norm. `New.twistedNorm_mem`\
        \ and\n  `New.map_twistedNorm` show that it respects stable subgroups and equivariant maps.\n* `New.IsTameAtLevel`:\
        \ the conditions on a ring endomorphism `σ` and a level `m` under which descent\n  works.\n* `New.IsRootQuotient`,\
        \ `New.IsNormRoot`: a polynomial `z`, depending only on the characteristic\n  polynomial of `γ`, that gives\
        \ a candidate `a = z(γ) / z(γ)ᴴ` for an element of norm `γ`.\n* `New.IsMatchingPair`: `φ` is invariant under\
        \ twisted conjugation by `K`, and `f` and `φ` match\n  point by point along `γ ↦ a`.\n* `New.CocyclesSplit`:\
        \ the cocycles in `K` are coboundaries on the support of `u`.\n* `New.baseChangeGf`: the map `Gf E n → Gf\
        \ E' n` induced by the inclusion of finite adeles.\n\nNotions from other files:\n* `New.U J`: the unitary\
        \ group of a matrix `J` over a commutative ring with involution, the `g` in\n  `GL_n(R)` with `gᴴ J g =\
        \ J`. In this file `J = 1`.\n* `New.U.map`: for a ring homomorphism `f` commuting with the involutions and\
        \ carrying `J` to `J'`,\n  the homomorphism `U(J) → U(J')` applying `f` to each entry.\n* `New.FinPlace\
        \ E`: the finite places of a number field `E`. For a finite place `u`, `u.comap f` is\n  the place below\
        \ `u` along a ring homomorphism `f`, and `u.below E` is the place of `E` below `u`.\n* `New.adeleMap`: for\
        \ an embedding of number fields, the induced ring homomorphism of finite adeles.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.GaloisRep.BaseChange.PrimeDegreeTransfer` for sources.\n"
