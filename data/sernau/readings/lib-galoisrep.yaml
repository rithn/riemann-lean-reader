        \ of `n` norms with its standard lattice.\n* `New.twistedNorm τ p δ`: the product `δ * τ δ * ⋯ * τ^[p -\
        \ 1] δ`.\n\n## Relation to the literature\n\nKnown; see `Lib.GaloisRep.BaseChange.PrimeDegreeTransfer` for\
