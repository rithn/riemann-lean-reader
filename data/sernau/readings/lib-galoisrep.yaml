      text: 'This file proves that eigenforms on the definite space `New.stdSpace` of odd rank have attached

        Galois representations in the split case. Here `E` is a CM field containing a primitive 5040th

        root of unity and `ℚ(√−D)`, with `D ≡ 3 mod 4`. The spherical place `u` and the places above `ℓ`

        lie over split primes of `ℚ(√−D)`. The proof is an ℓ-adic limit argument. For it, the file

        constructs places apart from given places and levels of a given type at a split place.

        '
    remainder:
      path: grh/src/Lib/GaloisRep/Main/SplitCase.lean
      line: 13
      endLine: 40
      text: "\n## Main definitions and results\n\n* `New.GaloisRep.sphericalCompat_of_split`: in odd rank, eigenforms\
        \ have attached Galois\n  representations compatible at a spherical place `u`, when `u` and the places above\
        \ `ℓ` lie over\n  split primes of `ℚ(√−D)`. The eigenvalues of f are ℓ-adic limits of combinations of eigenvalues\n\
        \  of forms that satisfy the hypotheses of `New.GaloisRep.exists_rep_of_cuspidal_type`. The limit of\n \
        \ the traces of their representations is the trace of a representation attached to f\n  (`New.GaloisRep.Attached`),\
        \ and the local properties at `u` pass to the limit.\n* `New.GaloisRep.exists_isTypeLevel`: Let `v` and\
        \ `x` be split places with `v` apart from `x` and\n  its conjugate, `H` an open subgroup, and `ϑ` a character\
        \ of the matrices `≡ 1` modulo `v` that is\n  trivial on those `≡ 1` modulo `v ^ 2`. Then there is a level\
        \ of type `ϑ` at `v` that lies in `H`\n  away from `v` and `x`.\n\nNotions from other files:\n* `New.IsEigenform`:\
        \ f ≠ 0, and almost all places w of prime norm are split and f has the Hecke\n  polynomial P w at w.\n*\
        \ `New.GaloisRep.Attached` P r i: r is continuous with non-degenerate trace form, i (by default the\n  identity)\
        \ is an open map to Gal(Ω/E), and at most Frobenius elements the characteristic\n  polynomials of r are\
        \ ℓ-adically close to those given by P.\n* `New.InducesPlacePair` w τ: the place of E that the ℓ-adic embedding\
        \ belonging to the infinite\n  place τ induces is w or its conjugate.\n* `New.GaloisRep.IsSplitPrimeToDisc`\
        \ u: the place u of ℚ(√−D) contains some (1 + √−D)/2 − b\n  (b an integer) that is coprime to its conjugate;\
        \ in particular u is split.\n\n## Relation to the literature\n\nKnown; see `Lib.GaloisRep.Main.OddRank`\
        \ for sources.\n"
