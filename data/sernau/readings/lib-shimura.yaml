        \ E` and an infinite place `v` of `E`, `κ.1 v h` is the number of\n  columns of height `h` of a Young diagram,\
        \ and `κ.2 v` is an integer exponent of the determinant.\n* `New.Variety.entryConj`: The endomorphism of\
        \ the unitary group {g : gᴴg = 1} of matrices over R\n  indexed by `n` that applies the involution of R\
        \ to each entry.\n* `New.jumps`: The multiset {j − 1 − λ_j} if σ is in the CM type, else {λ_j + a − j},\
        \ 1 ≤ j ≤ a,\n  with λ the highest weight of κ at σ.\n* `New.Space.weightRep`: The representation of the\
        \ rational unitary group on coordinate vectors of\n  weight `(κ.1, κ.2)`, through its components at the\
        \ infinite places and `New.conjWeylRep`.\n\n## Relation to the literature\n\nKnown result: Transfer of eigensystems\
        \ between unitary inner forms differing at a real place. Only\nthe occurrence is proved here, namely that\
        \ the Hecke eigensystem of a definite form occurs, in each\nHodge weight, on the variety for signature (1,\
        \ n-1), with n odd and a cuspidal type at one split\nplace. It is proved by comparing two finite counts,\
        \ without stabilisation. Source: Harris and\nLabesse, Conditional base change for unitary groups, Asian\
        \ J. Math. 8 (2004), Thm 2.1.2; Labesse,\nChangement de base CM et séries discrètes (2011), Thm 5.4; count\
