      line: 10
      endLine: 16
      text: 'The structure `New.Variety.Model` collects the geometry of a tower of Kuga–Sato varieties that the

        point count uses. K(𝔑) denotes the principal level `New.Variety.levelGU n 𝔑`. τ_{w,j} denotes the

        Hecke element `New.Variety.heckeSum` at a safe split place w of E. The file shows that these

        elements lie in the Hecke algebra of K(𝔑). It counts the `I`-torsion of the adelic module

        `New.AdelicTorsion E n`: it has N(I) ^ card n elements, where N(I) is the norm of the ideal I. It

        proves finiteness statements for multiplication by integers on the abelian schemes of a family

        `X : New.ThetaFamily D Z τ`.

        '
    remainder:
      path: grh/src/Lib/Shimura/HeckeTower/Model.lean
      line: 17
      endLine: 50
      text: "\n## Main definitions and results\n\n* `New.Variety.Model`: the tower of varieties with its properties.\n\
        * `New.Variety.asAlgebraHom_heckeSum`: τ_{w,j} acts on K(\U0001D511)-fixed vectors as a central element\
        \ times\n  the j-th Hecke operator of GL_n(E_w); `New.Variety.tauHecke` is τ_{w,j} in the Hecke algebra.\n\
        * `New.Variety.Model.exists_isHeckeAction`: the commuting operators on F(Z), for the base Z of a\n  model\
        \ and a functor F with descent.\n* `New.card_torsionBySet_adelicTorsion`: for `I ≠ 0` the `I`-torsion of\
        \ `New.AdelicTorsion E n` has\n  `N(I) ^ card n` elements.\n* `New.Variety.exists_level_conj_mem`: a principal\
        \ level deep enough for finitely many isogenies.\n\nNotions from other files:\n* `New.Variety.SplitFinPlace`:\
        \ The finite places w of E with w̄ ≠ w, that is, those split over the\n  maximal real subfield.\n* `New.Variety.levelGU`:\
        \ the principal level K(\U0001D511), the similitudes in `GL_n(Ô E)` that are congruent\n  to `1` modulo\
        \ `\U0001D511`.\n* `New.Variety.conjAtSplit w g`: for a split place w, the adelic matrix that is g⁻ᵀ at\
        \ w, the\n  conjugate of g at w̄, and 1 elsewhere.\n* `New.Variety.heckeSum n k w j`: the Hecke element\
        \ τ_{w,j}, the sum of\n  `New.Variety.invHeckeIsogeny w U` over the subspaces U of dimension j.\n* `New.Variety.IsSafe`:\
        \ Safe places w of E: the place u of ℚ(√−d₀) below w satisfies\n  `New.GaloisRep.IsSplitPrimeToDisc`, and\
        \ \U0001D511 lies neither in w nor in any place above ū.\n\n## Relation to the literature\n\nKnown result:\
        \ Hecke algebra of a pair acting by correspondences on the base of a tower. Here only a\nsemigroup acts,\
        \ and only far enough up the tower, and the algebra is a subalgebra of the group ring.\nThe cohomology theory\
        \ may be any functor to modules for which the base is the invariants of each\ncover. Source: Shimura, Introduction\
        \ to the arithmetic theory of automorphic functions, 1971, ch. 3\nand 7–8.\n\nSee also `Lib.Shimura.IntegralModel.TowerExistence`,\
        \ `Lib.Shimura.Uniformisation.AppellHumbert` and\n`Lib.Shimura.AbelianScheme.IsogenyFlatness`.\n"
