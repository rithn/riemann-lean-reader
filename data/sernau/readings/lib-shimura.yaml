        \ an orthogonality relation for these translates. It then studies the\nballs of a sup norm ‖f‖ on theta\
        \ functions, built from the values at torsion points.\n\n## Main definitions and results\n\n* `New.IsAppellHumbert.sum_shift_mul_shift`:\
        \ the orthogonality relation for the translates of two\n  theta functions.\n"
