      endOffset: 483
      text: 'A morphism `f : X'' → X` and an isomorphism `f^* L ≅ L''` induce a map on global sections

        `Φ : H⁰(L) → H⁰(L'')`. Over a local ring `R`, these maps let translations of an abelian scheme act on

        sections of a line bundle. For a theta structure on `N` indexed by a group `H`, it also gives a

        bound on the exponent of `K([N])`, under further hypotheses.'
    remainder:
      path: grh/src/Lib/Shimura/ThetaGroup.lean
      line: 9
      endLine: 40
      startOffset: 483
      endOffset: 2296
      text: "\n\n## Main definitions and results\n\n* `New.Variety.IsSectionLift`: `Φ` comes from some isomorphism\
        \ `f^* L ≅ L'`;\n  `New.Variety.IsTranslationLift` is the case of a translation; `New.Variety.coordSection`\
        \ is the\n  `j`-th coordinate section of a linear system.\n* `New.Variety.exists_isSectionLift`, `New.Variety.IsSectionLift.picClass_eq`:\
        \ a lift exists when\n  `[L'] = f^* [L]`, and only then.\n* `New.Variety.IsTranslationLift.mul`, `New.Variety.IsTranslationLift.pow`,\n\
        \  `New.Variety.exists_isTranslationLift_iff`: lifts of translations multiply, and the translation by\n\
        \  `z` lifts to `L`, over a local ring `R`, exactly when the pairing `New.Pic.pairing` of `[L]`\n  vanishes\
        \ on `z` and the identity, that is, when `z` lies in the kernel `K([L])`.\n* `New.Variety.IsThetaStructure`:\
        \ a linear system with coordinates indexed by a group `H`, permuted\n  up to a cocycle by lifts of the maps\
        \ `y ↦ ± y + η s`.\n* `New.Variety.IsThetaStructure.pull_eq_of_picClass_eq`: rigidity of theta structures\
        \ along a\n  homomorphism.\n* `New.Variety.IsThetaStructure.card_nsmul_eq_zero_of_isTranslationLift`: the\
        \ order of `H` kills\n  every section whose translation lifts to `N`, when `N` is a projective embedding;\
        \ over a local\n  ring these are the sections in `K([N])`.\n\nNotions from other files:\n* `New.LineBundle.pull`:\
        \ the pull-back of the line bundle (U_i, g_ij) along p: Y → X, with cover\n  p⁻¹U_i and transition functions\
        \ p*g_ij.\n* `New.LineBundle.IsLinearSystem`: L is a linear system, the model being g_ij = s_j / s_i on\n\
        \  U_i = {s_i ≠ 0} for sections s_i without common zero.\n* `New.HasConstFunctions`: for s : X → S, a function\
        \ regular on all of X takes equal values at two\n  ring-valued points with the same image under s.\n\n##\
        \ Relation to the literature\n\nKnown; see `Lib.Shimura.IntegralModel.UniversalFamily` for sources.\n"
    standaloneReview:
      verdict: clear
      reason: Describes induced maps on sections and the exponent bound.
