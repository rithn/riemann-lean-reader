      line: 10
      endLine: 16
      text: 'Except in `New.Uniformisation.hasSignature_iff`, where `O` is any commutative ring acting on `A`,

        `O` is a valuation ring with fraction field `ℂ` (`New.ValuativeArc`), for example `ℂ` itself. This

        file develops calculus for families of complex points of schemes over `O` without an

        analytification: holomorphic families, jets and a chain rule. These notions are applied to a

        uniformisation `V / L ≅ A(O)` of a commutative group scheme `A`, which yields a count of its torsion

        points. The file also treats linear systems whose homogeneous coordinates are theta functions, and

        their behaviour under operations on line bundles.

        '
    remainder:
      path: grh/src/Lib/Shimura/Uniformisation/HolomorphicFamilies.lean
      line: 17
      endLine: 52
      text: "\n## Main definitions and results\n\n* `New.HolomorphicAt.exists_isJet`, `New.IsJet.unique`, `New.isJet_comp_iff`:\
        \ jets exist and are\n  unique, and they obey the chain rule.\n* `New.HolomorphicAt.isFirstOrderConst_of_nsmul`:\
        \ on a smooth commutative group scheme, if `n • φ`\n  is constant to first order in a direction, for some\
        \ `n ≠ 0`, then so is `φ`.\n* `New.Uniformisation.hasSignature_iff`: the condition `New.HasSignature` on\
        \ the matrices of the\n  action of `O` in algebraic coordinates holds iff the space `V` of a uniformisation\
        \ has a common\n  eigenvector `Y ≠ 0` of the maps `F a`, with eigenvalues `ρ a`, such that `F b - ρ c` maps\
        \ `V` into\n  the line of `Y`.\n* `New.Uniformisation.card_torsion`: A(O) has m^(2 dim V) points killed\
        \ by m ≠ 0.\n* `New.HasThetaCoords.pull`, `New.HasThetaCoords.pow`, `New.HasThetaCoords.pull_translate`,\n\
        \  `New.HasThetaCoords.mul`: pull-back, power, translation and tensor product.\n* `New.HasThetaCoords.riemannForm_eq_of_isFrame`:\
        \ if `N ⊗ M⁻¹` has a frame, the Riemann forms and\n  the multipliers of `N` and `M` agree, and along the\
        \ family the frame is a constant times\n  exp((B − B′)(z, z)/2)·θ′/θ.\n\nNotions from other files:\n* `New.PointFn`:\
        \ a function on the points of a scheme X; it assigns to each point Spec R → X, for\n  every ring R, an element\
        \ of R, with no compatibility required.\n* `New.LandsIn`: the point t : Spec R → X lands in the open U when\
        \ all of Spec R maps into U.\n* `New.IsAppellHumbert`: Appell–Humbert data (B, χ) for a lattice L: Re B\
        \ is symmetric, and on L one\n  has |χ| = 1 and χ(l + m) = χ(l)χ(m)·exp(πi E(m, l)), where E(u, v) = Im(B(u,\
        \ v) − B(v, u))/(2π) is\n  the Riemann form of B (`New.RealComplexForm.riemannForm`).\n* `New.RealComplexForm.thetaSpace`:\
        \ the entire functions f on V with f(z + l) = χ(l)·exp(B(l,\n  z) + B(l, l)/2)·f(z) for l in L.\n* `New.LineBundle.IsHomogeneousCoords`,\
        \ `New.LineBundle.IsLinearSystem`: v is a vector of\n  homogeneous coordinates of the point t for the line\
        \ bundle N when t lands in the chart U_j exactly\n  when v_j is a unit, and then g_jk(t) = v_k/v_j. N is\
        \ a linear system when each transition function\n  g_ij is regular on U_i and zero at the points outside\
        \ U_i, and the g_ij(t), j varying, are\n  homogeneous coordinates of every point t of U_i.\n\n## Relation\
        \ to the literature\n\nKnown; see `Lib.Shimura.Uniformisation.AppellHumbert` and `Lib.Shimura.ArcExtension`\
        \ for sources.\n"
