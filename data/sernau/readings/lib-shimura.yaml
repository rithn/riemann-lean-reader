      text: 'The file studies how kernels of isogenies of abelian schemes in a family `X : New.ThetaFamily D Z τ`

        reduce from a valuation subring of `ℂ` to a field. The file records what goodness of the PEL data

        gives at the kernel of a map to a field. It also finds the line of tangent vectors on which `𝓞 E`

        acts through `x.baseHom`. From this line it gets a function that detects tangent vectors, and from

        that function a parameter `t` whose powers are local equations for the torsion sections.

        '
    remainder:
      path: grh/src/Lib/Shimura/CongruenceRelation/KernelReduction.lean
      line: 11
      endLine: 46
      text: "\n## Main definitions and results\n\n* `New.Variety.cartier`: a function on a finite flat subgroup\
        \ scheme (or coset) of a commutative\n  group scheme that vanishes at all `K`-points is zero, for `K` an\
        \ algebraically closed field of\n  characteristic zero containing the base ring.\n* `New.Variety.ker_factors_of_points`:\
        \ over a valuation ring with fraction field `ℂ`, a closed\n  condition that holds for the torsion complex\
        \ points of the kernel of a finite flat homomorphism\n  holds for all points of the kernel.\n* `New.Variety.placeTorsion`:\
        \ the points of `x.groupScheme` with values in a `k`-algebra `C` that\n  are killed by the kernel of `x.baseHom`.\n\
        * `New.Variety.ker_factors_of_torsionPoint`: the torsion sections are dense in the kernel of an\n  isogeny.\n\
        * `New.Variety.exists_isLieLine`: the line of tangent vectors on which `\U0001D4DE E` acts through\n  `x.baseHom`.\n\
        * `New.Variety.exists_isLocalEquation_pow_sectionCount`: at a local point `z` of the special fibre\n  killed\
        \ by a power of `β - b`, the power `t ^ N` of a parameter `t` is a local equation for a\n  family of torsion\
        \ sections, `N` of which pass through the closed point of `z`.\n* `New.Variety.exists_param_pow_card_eq_zero`:\
        \ the resulting parameter at a point killed by\n  `ker x.baseHom`, and a nonzero torsion section that reduces\
        \ to zero.\n\nNotions from other files:\n* `New.ThetaObject`: An object of the family X over a scheme T:\
        \ a morphism x from T to the base of\n  X; `x.groupScheme` is the pull-back of the abelian scheme along\
        \ it.\n* `New.ThetaObject.baseHom`: For an object x over Spec R, the ring homomorphism O_E → R induced by\
        \ x\n  and the structure morphism of the base of the family to Spec O_E.\n* `New.AddObj`: A commutative\
        \ group object.\n* `New.specOver`: The spectrum of an R-algebra B, as a scheme over Spec R.\n* `New.ValuativeArc`:\
        \ A valuation ring O with fraction field ℂ, with its generic point Spec ℂ → Spec\n  O.\n\n## Relation to\
        \ the literature\n\nKnown; see `Lib.Shimura.AbelianScheme.IsogenyFlatness`,\n`Lib.Shimura.CongruenceRelation.HeckeNeighbours`,\
        \ `Lib.Shimura.Deformation.TangentBound` and\n`Lib.Shimura.ThetaModuli.UniversalFamily` for sources.\n"
