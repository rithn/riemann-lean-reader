      path: grh/src/Lib/Shimura/TraceFormula/MarkedDefiniteSums.lean
      line: 14
      endLine: 42
      text: "\nIdea: both sums run over the classes of triples `(xK, y, μ)` under `GL n E`. Classes with\nirreducible\
        \ characteristic polynomial are matched by a change of signs. For a reducible one, an\nidempotent at the\
        \ split place gives a unipotent group, whose orbits cut the triples into blocks;\ntranslation along it multiplies\
        \ the terms by a value of the character that is not 1, so they sum to\nzero on each block.\n\nNotions from\
        \ other files:\n* `New.Variety.MarkedTriple`: triples `(xK, y, μ)` of an adelic coset, an element `y` of\
        \ `GL n E`\n  and an index `μ` of an eigenvalue of `y`.\n* `New.Variety.countTerm`: the term `f(x⁻¹ y⁻¹\
        \ x K) * u(charpoly y, μ)` of the class of\n  `(xK, y, μ)` if `IsSignedFrame x (eigenReflection ε y μ)`\
        \ holds (the sign condition), else `0`;\n  `ε = True` gives the marked count and `ε = False` the definite\
        \ count.\n* `New.Variety.conjAtSplit`: places an element of `GL n` over the completion at a split place\
        \ `w₀`\n  in the adelic similitude group; `New.Variety.dualComponent` is a left inverse.\n* `New.Variety.IsRegularHecke`:\
        \ `f(x⁻¹ y⁻¹ x K) ≠ 0` forces the characteristic polynomial of `y` to\n  be separable.\n* `New.Variety.IsCuspidalType`:\
        \ for every idempotent matrix `e ≠ 0, 1`, the character `χ` is\n  non-trivial on the elements of `J` in\
        \ the unipotent group `1 + e M_n (1 - e)`.\n\n## Relation to the literature\n\nKnown result: Simple trace\
        \ formula on a definite group, with vanishing non-elliptic terms. This\nfile proves the comparison of orbit\
        \ sums that is used, for unitary similitudes at a neat level, with\nHaar integrals replaced by finite sums\
        \ over cosets. The non-elliptic terms cancel for a regular test\nfunction with a cuspidal type at one split\
        \ place; the elliptic terms match for n odd.\nSource: Dummigan, A simple trace formula for algebraic modular\
        \ forms, Exp. Math. 22 (2013); Arthur\nand Clozel, Simple algebras, base change and the advanced theory\
        \ of the trace formula (1989), ch. 1\n§2, after Deligne and Kazhdan.\n"
