      text: "The end of the construction of the moduli tower. It goes from a universal family of PEL type\n(`New.Variety.UniversalFamily`)\
        \ to the structure `New.Variety.Model`, which is all that the point\ncounts use.\n\n* `New.Variety.exists_model`:\
        \ the model exists.\n* `New.Variety.UniversalFamily.GraphClosure.congruenceRelation`,\n  `New.Variety.UniversalFamily.GraphClosure.isTangentPoly_localTerm_of_translate`:\
        \ the congruence\n  relation and the tangent map at a fixed point, for the legs of a cover."
    remainder:
      path: grh/src/Lib/Shimura/IntegralModel/TowerExistence.lean
      line: 15
      endLine: 41
      startOffset: 713
      endOffset: 2624
      text: "\n\nNotions from other files:\n* `New.Variety.UniversalFamily`: a universal family of PEL type over\
        \ `R`: a base scheme with an\n  abelian scheme over it and its standing hypotheses. `New.Variety.UniversalFamily.GraphClosure`\
        \ is\n  the reduced closure of the graph of finitely many translations `a ↦ a·(g_j, 1)` of complex points;\n\
        \  `C.proj j` projects it to the factor `j`, sending `C.point a` to `U.datumPoint \U0001D52A (a.act g)`,\
        \ the\n  complex point of level `\U0001D52A`, when `γ j = (\U0001D52A, g)`.\n* `New.Variety.Model`: the\
        \ tower of Kuga–Sato varieties over `R`, given by a list of properties.\n* `New.Variety.Cancels`: The integers\
        \ `m i` add up to zero on every fibre of `v`, that is,\n  `∑ m i • [v i] = 0` in the free abelian group\
        \ on `V`.\n* `New.Variety.IsSafe`: Safe places w of E: the place u of ℚ(√−d₀) below w satisfies\n  `New.GaloisRep.IsSplitPrimeToDisc`,\
        \ and \U0001D511 lies neither in w nor in any place above ū.\n* `New.Variety.IsNeat`: The level \U0001D511\
        \ is neat: \U0001D511 ≠ 0 and, whenever `x` is a signed frame with `ℓ` for\n  some form (`New.Variety.IsSignedFrame`),\
        \ every y in GL_n(E) with x⁻¹yx in `levelGU n \U0001D511` (the\n  subgroup of level \U0001D511 of GL_n(\U0001D538\
        f E), inside `GUPlus E n`, whose elements translate moduli points by\n  `a.act`) that fixes ℓ under `New.Variety.ratConj`\
        \ equals 1.\n\n## Relation to the literature\n\nKnown result: Integral Kuga–Sato models for GU(1,n−1) with\
        \ level covers and the congruence relation.\nHere the smooth proper base is a closure of theta values with\
        \ no moduli property. The covers are\nreduced projective closures of tuples of isogenous points. The model\
        \ asks for smoothness of the base\nonly, and of the covers that they are Galois on points in characteristic\
        \ zero. The congruence\nrelation at good split places is part of the statement.\nSource: Harris, Taylor,\
        \ The geometry and cohomology of some simple Shimura varieties, 2001, III.4;\nKottwitz, Points on some Shimura\
        \ varieties over finite fields, JAMS 5 (1992), §5.\n"
