      endLine: 10
      text: 'From a complex point of a family of abelian schemes back to linear algebra: an object `x` over `ℂ`

        with structure map `Φ v₀` (the complex embedding of `E` at the fixed infinite place `v₀`) on `𝓞 E`

        and a full structure `e` (a trivialisation of all torsion, `New.ThetaObject.FullLevelStructure`) is

        a complex torus described by an adelic frame `g` and a reflection `ℓ`.

        '
    remainder:
      path: grh/src/Lib/Shimura/Uniformisation/ModelExists.lean
      line: 11
      endLine: 32
      text: "\n* `New.Variety.exists_torusModel`: a polarised period map on `ℂ^d` for `(g, ℓ)` and a model of `x`\n\
        \  on it whose torsion points are those of `e`, with `ℓ` a reflection.\n* `New.Variety.exists_torusModel_of_isPeriodMap`:\
        \ the same model on a given period map `Q` whose\n  exponential lifts the torsion points of `e`; the frame\
        \ is found from the Weil pairing of `e`.\n\n`New.ThetaObject.TorusModel` is a model of `x` on a given polarised\
        \ period map `Q`\n(`New.ThetaTori.PeriodMap`). It is a uniformisation of `x.groupScheme` whose kernel is\
        \ the period\nlattice.\n\nNotions from other files:\n* `New.ψf`: the additive character of the finite adeles\
        \ with ψ_f(x) = exp(2πi Tr_{E/ℚ}(a)) for any a\n  in E with x − a integral. In the code `\U0001D41E t` is\
        \ exp(2πi t).\n* `New.ThetaObject.groupScheme`: The group scheme with O_E-action of an object x over S:\
        \ the\n  pull-back of the abelian scheme of the family along x : S → base.\n* `New.ThetaObject.baseHom`:\
        \ For an object x over Spec R, the ring homomorphism O_E → R induced by x\n  and the structure morphism\
        \ of the base of the family to Spec O_E.\n* `New.ThetaObject`: An object of the family X over a scheme T:\
        \ a morphism from T to the base of X.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.Uniformisation.AppellHumbert`\
        \ for sources.\n"
