      text: "The Eichler–Shimura argument: a relation between Frobenius twists of points in characteristic p\ngives\
        \ a relation between pull-backs and Galois action on ℓ-adic cohomology.\n\n* `New.Variety.ellAdicCohom.ellAdicPull_frobEnd`:\
        \ the absolute Frobenius acts trivially on\n  cohomology.\n* `New.Variety.ellAdicCohom.congruence_relation`:\
        \ the congruence relation\n  `New.Variety.CongruenceRelation` on points gives ∑ mᵢ uᵢ^* g^(−eᵢ) = 0 on Vⁿ(Y),\
        \ for a Frobenius\n  element g."
    remainder:
      path: grh/src/Lib/Shimura/CongruenceRelation/EichlerShimura.lean
      line: 13
      endLine: 37
      startOffset: 589
      endOffset: 2063
      text: "\n* `New.Variety.ellAdicCohom.galoisAction_eq_one_of_inertia`: inertia acts trivially (the case q =\
        \ 1\n  of the relation).\n\nThe idea: extend classes from Ω to the valuation ring A, then restrict to the\
        \ special fibre.\n`New.Variety.ellAdicCohom` is X ↦ Vⁿ(X) = ℚ_ℓ ⊗ Hⁿ(X_Ω, ℤ_ℓ), with the action\n`New.Variety.ellAdicCohom.galoisAction`\
        \ of Γ; `New.Variety.ellAdicPull` is the pull-back along a map\nof free abelian functors (`freeAb` sends\
        \ a functor to its pointwise free abelian group);\n`New.Variety.IsCharted` is the hypothesis on Y that stands\
        \ in for smoothness: it gives smooth base\nchange, so that pull-back from A to Ω is bijective on the cohomology\
        \ of Y.\n\nNotions from other files:\n* `New.IsFrob`: σ stabilises the valuation subring A and σx ≡ x^q\
        \ modulo the maximal ideal for all x\n  in A; for q = 1 this is membership in the inertia group.\n* `New.Variety.mapOnTests`:\
        \ For a map u: X → Y of set-valued functors on rings, its restriction to a\n  map of functors on test rings.\n\
        * `New.Variety.ellAdicCoeff`: The coefficient `ℤ_ℓ`: a test ring `A` goes to the Witt vectors of the\n \
        \ ring of locally constant functions `Spec A → \U0001D53D_ℓ`.\n\n## Relation to the literature\n\nKnown\
        \ result: Smooth proper reduction gives unramified ℓ-adic cohomology, and Frobenius relations\npass to it.\
        \ Here the base is the valuation ring of a place. Source: Stacks project, Tags 0GKD (SGA4\nXVI 2.2) and\
        \ 03SN (SGA5 XV); Deligne, Formes modulaires et représentations ℓ-adiques, Sém. Bourbaki\n355 (1969).\n"
