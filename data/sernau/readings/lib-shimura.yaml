      text: "Two facts on isogenies. Over an Artinian ring, a homomorphism that kills the kernel of an isogeny\n\
        factors through it. Over a local ring, a quasi-finite surjective homomorphism of abelian schemes is\nan\
        \ isogeny.\n\n* `New.Variety.exists_isAdditive_comp_eq_of_isIsogeny`: over an Artinian ring, a homomorphism\
        \ that\n  kills the kernel of an isogeny `f`, tested on finite local algebras, factors through `f`.\n"
    remainder:
      path: grh/src/Lib/Shimura/AbelianScheme/IsogenyFlatness.lean
      line: 13
      endLine: 29
      text: "* `New.Variety.isIsogeny_of_locallyQuasiFinite`: over a local ring, a locally quasi-finite\n  surjective\
        \ homomorphism of abelian schemes is finite and flat.\n\nNotions from other files:\n* `New.specOver`: The\
        \ spectrum of an R-algebra B, as a scheme over Spec R.\n* `New.IsAbelianScheme`: A commutative group scheme\
        \ that is smooth and proper over the base, and on\n  which multiplication by every m ≠ 0 is surjective.\n\
        * `New.IsIsogeny`: A homomorphism that is finite, flat and surjective.\n\n## Relation to the literature\n\
        \nKnown result: Factorisation through an isogeny, and quasi-finite surjective homomorphisms of abelian\n\
        schemes are finite flat. Here an abelian scheme means a smooth and proper commutative group scheme\non which\
        \ multiplication by every m ≠ 0 is surjective; the base is an Artinian ring for the first\nresult and a\
        \ local ring for the second. Source: B. Edixhoven, G. van der Geer, B. Moonen, Abelian\nVarieties (draft),\
