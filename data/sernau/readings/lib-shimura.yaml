        \ the\n  kernel `a⁻¹ L / L` of `a ≠ 0` on the torus has order `|det (F a)|²`.\n* `New.ThetaTori.IsHermitianAction.normShift_sum_eq_char_smul`:\
        \ averaging normalised translates over\n  this kernel against a character gives an eigenvector.\n* `New.ThetaTori.IsHermitianAction.sum_conj_pow_four_eq_sum_pow_four`:\
        \ a quadratic Gauss sum over\n  `κ⁻¹ L / L` has a real fourth power.\n* `New.ThetaTori.IsHermitianAction.isSelfAdjoint_quotMean_pow`:\
        \ the mean of `x ↦ K(c̄ x, c x)` times\n  `conj (det c̄)` has a real fourth power; unfolding writes the\
        \ mean as a Gauss sum times a Gaussian\n  integral.\n\nNotions from other files:\n* `New.RealComplexForm.riemannForm`:\
