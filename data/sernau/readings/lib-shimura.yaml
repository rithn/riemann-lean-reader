      text: "Let `V / L` be a complex torus with multiplications `F` by a ring `R` with involution and a\npolarising\
        \ hermitian form `B`. The hypothesis `New.ThetaTori.IsHermitianAction` gives the\ncompatibilities between\
        \ these data.\n\n## Main definitions and results\n\n* `New.ThetaTori.IsHermitianAction`: `B` is positive\
        \ hermitian, its Riemann form is integral on `L`,\n  `F (star a)` is adjoint to `F a`, and `star β = 1 -\
        \ β`.\n"
