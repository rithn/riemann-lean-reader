    excerpt:
      path: grh/src/Lib/Shimura/AbelianScheme/Pairings.lean
      line: 10
      endLine: 15
      text: 'This file studies classes of line bundles on commutative group schemes and abelian schemes. Line

        bundles are cocycles (`New.LineBundle`), and `New.Pic` is written additively. For a class `c` and

        points `x`, `y`, the pairing `New.Pic.pairing c x y` is the class (x + y)^*c − x^*c − y^*c + 0^*c.

        The file proves rules for the pairing, a quasi-finiteness criterion, and stability of abelian

        schemes under base change. It also treats the descent of identities between pairings along an fpqc

        cover.

        '
    remainder:
      path: grh/src/Lib/Shimura/AbelianScheme/Pairings.lean
      line: 16
      endLine: 37
      text: "\n## Main definitions and results\n\n* `New.Variety.locallyQuasiFinite_of_pull_picClass`: a map that\
        \ pulls a class back to a nonzero\n  multiple of an embedding class is locally quasi-finite.\n* `New.Pic.ParallelogramLaw.pairing_nsmul_left`,\
        \ `New.Variety.pairing_comm`,\n  `New.Variety.pairing_comp`: rules for the pairing.\n* `New.Variety.pull_nsmul_eq_sq_smul`:\
        \ over a local ring, multiplication by `m` pulls `c` back to\n  `m² c` if `c` satisfies the parallelogram\
        \ law.\n\nNotions from other files:\n* `New.Pic.atPoint`: For c in Pic A and a T-point x of A, the pull-back\
        \ x^*c in Pic T.\n* `New.Pic.ParallelogramLaw`: (x + y)^*c + (x − y)^*c + 2·0^*c = 2(x^*c + y^*c) for all\
        \ points.\n* `New.IsAbelianScheme`: a commutative group scheme A over S is abelian if it is smooth and proper\n\
        \  over S and multiplication by every m ≠ 0 is surjective.\n* `New.LineBundle.IsProjEmbedding L s`: `L`\
        \ embeds `X` in projective space over `S`: it is a linear\n  system, `s` is proper, and points of one chart\
        \ with the same coordinates and the same image in `S`\n  are equal.\n\n## Relation to the literature\n\n\
        Known; see `Lib.Shimura.AbelianScheme.IsogenyFlatness` for sources.\n"
