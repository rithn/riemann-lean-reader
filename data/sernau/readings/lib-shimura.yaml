      text: "Let A be a commutative group scheme over S with an action of a ring O. The file studies the tangent\n\
        space of A at 0 through coordinate functions evaluated at points that vanish modulo a square-zero\nideal.\n\
        \n## Main definitions and results\n\n* `New.IsSqZeroExt`, `New.IsInfinitesimal`, `New.tangentCoords`: square-zero\
        \ extensions ψ, points\n  that vanish modulo ker ψ, and their coordinates z(y) − z(0).\n"
    remainder:
      path: grh/src/Lib/Shimura/AbelianScheme/TangentCoordinates.lean
      line: 14
      endLine: 33
      text: "* `New.IsEtaleChart`, `New.exists_isEtaleChart`: étale coordinates; they exist on a smooth scheme.\n\
        * `New.IsLieChart`, `New.exists_isLieChart`: coordinates at 0 that are additive on infinitesimal\n  points\
        \ and in which O acts by matrices.\n* `New.HasSignature`, `New.HasSignature.of_points`: the rank-one signature\
        \ condition for ρ, b, b' on\n  these matrices passes from a jointly injective family of ring maps to every\
        \ map φ into a local\n  ring for which φ(ρ b − ρ b') is a unit.\n* `New.Variety.eq_zero_of_nsmul_eq_zero_of_comp_eq_zero`:\
        \ torsion of invertible order in an abelian\n  scheme over a local ring is unramified. The ideal I cutting\
        \ out the locus where the section\n  vanishes satisfies I ≤ I² by\n  `New.IsInfinitesimal.eq_zero_of_isUnit_and_nsmul_eq_zero_of_cast_eq_zero`,\
        \ so I = 0 by Nakayama's\n  lemma.\n\nNotions from other files:\n* `New.IsAbelianScheme`: a commutative\
        \ group scheme A over S is abelian if it is smooth and proper\n  over S and multiplication by every m ≠\
        \ 0 is surjective.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.AbelianScheme.IsogenyFlatness`\
        \ and `Lib.Shimura.ThetaModuli.UniversalFamily`\nfor sources.\n"
