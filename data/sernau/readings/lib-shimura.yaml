      endLine: 44
      text: "\n## Main definitions and results\n\n* `New.trace_eq_weighted_sum`: the trace of the twisted Hecke\
        \ operator `T` on a finite-dimensional\n  space of algebraic forms, from representatives `r i` with weights\
        \ `w i`.\n* `New.Variety.finite_isSignedFrame_classes`: for an open subgroup V, only finitely many double\n\
        \  cosets GL_n(E) x (GU ∩ V) contain a signed frame.\n* `New.Variety.definiteForms`: the forms with values\
        \ in a representation `ξ` of `GL n E` that\n  are left `GL n E`-equivariant, vanish off the definite frames\
        \ and are right invariant under the\n  level.\n* `New.Variety.definiteForms.rep`: the action of the Hecke\
        \ algebra `New.Variety.heckeAlgebra` on it.\n* `New.Variety.finite_definiteForms`, `New.Variety.finite_support_countTerm_definite`,\n\
        \  `New.Variety.trace_definiteForms_eq_finsum_countTerm`: finite dimension, finite support and the\n  trace\
        \ formula.\n\nNotions from other files:\n* `New.levelSpace π K`: The vectors fixed by the subgroup `K` under\
        \ the representation `π`; here\n  `π` is `New.rightRegular`, the action of `G` on functions `G → W` by right\
