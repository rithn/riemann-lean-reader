      path: grh/src/Lib/Shimura/ThetaNormality/NormalGeneration.lean
      line: 15
      endLine: 45
      text: "* `New.IsAppellHumbert.exists_proportional_orbit_lattice`: over a valuation ring of `ℂ`, the modules\n\
        \  generated by the translates of two finite families are proportional. This needs that neither\n  family\
        \ is zero. It also needs a natural number that is a unit of the ring and kills the dual\n  lattice modulo\
        \ `L`.\n* `New.ThetaTori.HasGoodReduction.normBall`: the theta functions of norm at most ‖f‖.\n* `New.ThetaTori.HasGoodReduction.mem_of_mem_normBall`\
        \ (from\n  `New.ThetaTori.HasGoodReduction.exists_smul_thetaNorm_eq`): if f is also a theta function for\
        \ an\n  Appell–Humbert datum (L₀, B, ζ), L₀ ⊇ L, a module that contains the translates\n  `New.RealComplexForm.thetaShift\
        \ B u f` of f by the dual of L₀ contains the theta functions for\n  (L₀, B, ζ) in the ball of f. The later\
        \ results rest on this.\n* `New.ThetaTori.HasGoodReduction.normBall_pow_pow`: if f is also a theta function\
        \ for an\n  Appell–Humbert datum (L₀, B, ζ) with L₀ ⊇ L/r, the r ^ j-th power of the ball of f is the ball\
        \ of\n  f ^ r ^ j.\n* `New.ThetaTori.HasGoodReduction.finrank_reduction_eq`: the reduction of a finitely\
        \ generated ball\n  has dimension dim `New.RealComplexForm.thetaSpace`.\n\nNotions from other files:\n*\
        \ `New.RealComplexForm.thetaShift`: The twisted translation by `a`, a complex-linear map on all\n  functions\
        \ `V → ℂ`: `thetaShift B a f z = exp (-(B a z + B a a / 2)) * f (z + a)`.\n* `New.IsAppellHumbert`: Appell–Humbert\
