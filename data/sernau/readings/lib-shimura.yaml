      endLine: 15
      text: 'This file defines theta functions on a finite-dimensional complex vector space `V` for a subgroup

        `L` and a form `B`. The form has type `ThetaTori.LatticeForm L`, which is `RealComplexForm V`

        tagged with `L` and imposes no condition. `B` is real linear in the first argument and complex

        linear in the second, and is not assumed hermitian. The file also defines the Riemann form

        `E = New.RealComplexForm.riemannForm B`, Appell–Humbert data, twisted translations and the dual

        lattice, and proves their first properties. Under the assumption that `L` is a full lattice, it

        treats factors of automorphy, positive Riemann forms and theta functions without zeros. Below,

        `𝐞 t` is `exp (2πi t)` (`New.coe_fourierChar_eq_exp`).

        '
    remainder:
      path: grh/src/Lib/Shimura/ComplexTheta/AppellHumbertData.lean
      line: 16
      endLine: 32
      text: "\n## Main definitions and results\n\n* `New.RealComplexForm.thetaSpace`: the entire `f` with\n  `f\
        \ (z + l) = χ l * exp (B l z + B l l / 2) * f z` for `l ∈ L`. Products and powers of theta\n  functions\
        \ are theta functions (`New.thetaSpace.mul`, `New.thetaSpace.pow`).\n* `New.IsAppellHumbert`: Appell–Humbert\
        \ data; then `riemannForm B` is integral on `L`\n  (`New.IsAppellHumbert.le_dualLattice`).\n* `New.RealComplexForm.thetaShift`:\
        \ translation by `a` twisted by `exp (-(B a z + B a a / 2))`. Two\n  of these commute, for Appell–Humbert\
        \ data, up to `\U0001D41E (E u v)`\n  (`New.IsAppellHumbert.thetaShift_comm`). Those by vectors of the dual\
        \ lattice\n  `New.RealComplexForm.dualLattice` preserve, for such data, the theta functions\n  (`New.IsAppellHumbert.thetaShift_mem_of_mem_dualLattice`).\n\
        \n## Relation to the literature\n\nKnown; see `Lib.Shimura.ComplexTheta.DimensionFormula` for sources.\n"
