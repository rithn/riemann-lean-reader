    excerpt:
      path: grh/src/Lib/Shimura/Uniformisation/LieExponential.lean
      line: 8
      endLine: 13
      text: 'The complex points `New.ComplexPoint A` of a scheme `A` over ℂ carry the classical topology. Here

        `A` is an object of `Over (Spec ℂ)`, and a point is a morphism from `Spec ℂ` over it. A smooth

        scheme has holomorphic charts, and a projective variety has compact complex points. For an abelian

        variety A with a projective embedding (`New.LineBundle.IsProjEmbedding`), the group A(ℂ) is

        therefore compact and commutative with a holomorphic chart at 0. An exponential map exists for any

        such group, and it gives a uniformisation of A by ℂᵈ, where d is the dimension of A.

        '
    remainder:
      path: grh/src/Lib/Shimura/Uniformisation/LieExponential.lean
      line: 14
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.exists_lie_exponential` constructs the exponential map\
        \ of a compact commutative group with a\n  chart at `0` in which addition is complex analytic. The value\
        \ at `v` is a limit of `n • ψ (v / n)`\n  along an ultrafilter on `ℕ`, which exists by compactness; no differential\
        \ equation is solved.\n* `New.exists_holomorphic_chart`: a smooth scheme has a holomorphic chart at every\
        \ complex point.\n* `New.LineBundle.IsProjEmbedding.compactSpace_complexPoint`: the complex points of a\
        \ projective\n  variety are compact.\n* `New.LineBundle.IsProjEmbedding.nonempty_uniformisation`: an abelian\
        \ variety of dimension d is\n  uniformised by ℂᵈ.\n\nNotions from other files:\n* `New.IsFullRankLattice\
        \ L`: the `ℤ`-submodule `L` of `V` is discrete and spans `V` over `ℝ`. Here\n  `V` is a `FinComplexSpace`,\
        \ that is, a finite-dimensional complex normed space.\n* `New.IsAbelianScheme`: a commutative group scheme\
        \ A over S is abelian if it is smooth and proper\n  over S and multiplication by every m ≠ 0 is surjective.\n\
        * `New.Uniformisation`: a surjective homomorphism from a complex vector space V to the complex\n  points\
        \ of A, with kernel a lattice, holomorphic and immersive, through which homomorphisms\n  holomorphic at\
        \ 0 factor ℂ-linearly.\n* `New.LineBundle.IsProjEmbedding`: The linear system N embeds the proper scheme\
        \ X in projective\n  space: points in one chart with the same affine coordinates and the same base point\
        \ are equal.\n* `New.HasGermAt`: For each open U of X containing φ(w₀) and each f regular on U: φ(w) lies\
        \ in U for\n  w near w₀, and the function f∘φ satisfies Q. `New.HolomorphicAt` is the case where Q is\n\
        \  analyticity at w₀.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.Uniformisation.AppellHumbert`\
        \ for sources.\n"
