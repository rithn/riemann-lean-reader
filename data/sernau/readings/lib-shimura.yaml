    excerpt:
      path: grh/src/Lib/Shimura/IntegralModel/UniversalFamily.lean
      line: 9
      endLine: 17
      startOffset: 251
      endOffset: 1045
      text: 'This file studies the universal abelian scheme 𝒜 → S of PEL data D and describes its complex points

        by linear algebra. Over an arc `O` (`New.ValuativeArc`, a valuation ring with fraction field `ℂ`), a

        description of the generic fibre as a complex torus (`New.ThetaObject.TorusModel`) is also a

        description of the object over `O`. The geometric fibres of such a modelled object are rigid

        (`New.ThetaObject.HasSpanningCoords`): on each of their pull-backs to a noetherian local ring `B`,

        global functions come from the base (`New.HasConstFunctions`), and the coordinates span the sections

        of the line bundle `N` of the object over `B`. A linear datum a = (x, ℓ, P)

        (`New.Variety.ModuliPoint`) consists of an adelic frame x, a reflection ℓ of ℂⁿ (1 on a line, −1 on

        a complement), and vectors P_i.'
    remainder:
      path: grh/src/Lib/Shimura/IntegralModel/UniversalFamily.lean
      line: 17
      endLine: 56
      startOffset: 1045
      endOffset: 3745
      text: "\n\n## Main definitions and results\n\n* `New.Variety.UniversalFamily`: the universal object, with\
        \ the standing hypotheses.\n* `New.ThetaFamily.IsPointOf`, `New.Variety.UniversalFamily.datumPoint`: the\
        \ point of a fibre power\n  of \U0001D49C given by a fibre modelled on a, its non-zero \U0001D52A-torsion\
        \ points and the images of the P_i.\n* `New.ThetaFamily.IsPointOf.eq_iff`, `New.Variety.UniversalFamily.datumPoint_eq_iff`:\
        \ two such\n  points are equal exactly when the data are isomorphic (`New.Variety.ModuliPoint.IsLevelIso`)\
        \ at\n  level K(\U0001D511) ∩ K(\U0001D52A), where K is the principal level `New.Variety.levelGU` and \U0001D511\
        \ the level of D. Here\n  a ≅ b via z in GL_n(E) means: b.x⁻¹ z a.x lies in the level group, z conjugates\
        \ a's reflection to\n  b's, and z P_i − b.P_i lies in the lattice of b.x.\n* `New.Variety.UniversalFamily.GraphClosure`:\
        \ the closure of the graph of finitely many translations\n  a ↦ a·(g_j, 1).\n* `New.Variety.UniversalFamily.smooth_and_isDenseFamily_and_exists_comp_eq_act`:\
        \ at level 1 the\n  fibre power is smooth over R, and the points of linear data are dense in it.\n\nNotions\
        \ from other files:\n* `New.ThetaObject`: an object of the family X over a scheme T: a morphism from T to\
        \ the base of X;\n  `x.IsPullbackAlong f y` means x = f ≫ y, the pull-back of y along f.\n* `New.Variety.ModuliPoint.act`:\
        \ a·(g, α) = (x g, ℓ, α_i P_i) for a = (x, ℓ, P), an adelic\n  similitude g and integers α_i of E.\n* `New.ThetaObject.TorusModel.π`:\
        \ for a model m, the map from (E ⊗ ℝ)ⁿ to the sections of the\n  object; `m.fullStructure.torsionPoint`\
        \ labels the torsion sections by `New.AdelicTorsion`.\n* `New.Variety.NonzeroTorsion`: for a non-zero element\
        \ \U0001D52A of O_E, the set of non-zero elements of\n  (\U0001D538_f / Ô)ⁿ ≅ (E / O_E)ⁿ killed by \U0001D52A\
        .\n\n## Relation to the literature\n\nKnown result: the sections of an ample line bundle on an abelian variety\
        \ are spanned by theta\nfunctions. Here it is stated for the coordinates of an object with a torus model,\
        \ on the pull-backs\nof its geometric fibres to noetherian local rings (`hasSpanningCoords_of_specMap_comp_eq`).\
        \ Spanning\nof the sections is proved by reduction from the complex numbers rather than by Riemann–Roch,\
        \ and the\nonly consequence drawn is that a map of such objects respecting the pairing and the level points\n\
        lies over the family, which gives the criterion for equal points (`IsPointOf.eq_iff`). Source: D.\nMumford,\
        \ On the equations defining abelian varieties I, Invent. Math. 1 (1966), §§1–2; S. W. Shin,\nAbelian varieties\
        \ and Weil representations, Algebra Number Theory 6 (2012), Prop. 2.12 (over a\nbase); M. Bolognesi, A.\
        \ Massarenti, Comment. Math. Helv. 91 (2016), Lemma 4.1 (odd type).\n\nSee also `Lib.Shimura.ArcExtension`\
        \ and `Lib.Shimura.IntegralModel.TowerExistence`.\n"
