      endLine: 17
      text: '`New.Variety.ThetaNull.nonempty_universalFamily` shows, when `R` is a localization of `𝓞 E` at a

        submonoid of non-zero-divisors and every maximal ideal of `R` lies over a good prime for `D`

        (`IsGoodOver D R`), that the type `New.Variety.UniversalFamily D R` of universal objects is

        nonempty. A universal object is a family of theta-embedded abelian schemes for the PEL data `D`

        (`New.ThetaFamily`) over a projective `R`-scheme that is smooth of relative dimension

        `card D.Index - 1`. Its fibres at a dense set of complex points are the theta tori

        (`New.ThetaTori.ThetaTorus`) of all analytic families (`New.Variety.AnalyticFamily`). Its

        uniformisations are holomorphic in the parameter and in the fibre.

        '
    remainder:
      path: grh/src/Lib/Shimura/ThetaModuli/UniversalFamily.lean
      line: 18
      endLine: 44
      text: "\nThe base is the reduced closure of the theta coordinates of the level points in a product of\nprojective\
        \ spaces. `New.Variety.exists_thetaFamily_of_points` puts a family on it, using good\nreduction at the level\
        \ points. Smoothness comes from the immersion of the balls and the tangent\nbound.\n\nNotions from other\
        \ files:\n* `New.ThetaObject.TorusModel`: a model of a fibre of the family on the complex torus of a polarised\n\
        \  period map, with its uniformisation and its theta functions `θ`.\n* `LineBundle.IsHomogeneousCoords L\
        \ t v`: `v` are homogeneous coordinates of the point `t` for `L`:\n  `t` lies in the chart `j` of `L` exactly\
        \ when `v j` is a unit, and there the transition function\n  to the chart `k` is `v k / v j`. For a linear\
        \ system (`IsLinearSystem`), the transition functions\n  are regular on the charts and give homogeneous\
        \ coordinates.\n* `ReducedClosure`: the reduced Zariski closure `W` of a family of tuples of complex points\
        \ in a\n  product of schemes, with its complex points `point a`, which are dense.\n* `PEL.IsGoodAt D w`:\
        \ the prime `w` of `\U0001D4DE E` is good for the data `D`: it contains neither\n  `D.paddedNorm` nor the\
        \ order of `D.dualTorsion`, and it contains a prime number `p` and `D.β - b`\n  for an integer `b` with\
        \ `D.β - b` coprime to `star D.β - b`, and two further conditions hold\n  (see its definition).\n\n## Relation\
        \ to the literature\n\nKnown result: Moduli of abelian varieties by theta values via theta-null embedding\
        \ and universal\nfamily. Here the base is the closure of the theta values at the level points of PEL tori,\
        \ not a\nlocus cut out by quartic relations; the family on it comes from\n`New.Variety.exists_thetaFamily_of_points`.\
        \ Source: D. Mumford, On the equations defining abelian\nvarieties II, Invent. Math. 3 (1967) 75-135; theta\
        \ groups in part I, Invent. Math. 1 (1966) 287-354.\n"
