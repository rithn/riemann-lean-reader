      path: grh/src/Lib/Shimura/HeckeTower/HeckeData.lean
      line: 8
      endLine: 12
      text: 'Hecke operators for a group `G` with a subgroup `K` are realised inside the group ring `k[G]`, so

        they act on every representation of `G` without convolution. With this, the file sets up the data

        for counting fixed points of Hecke correspondences for a CM field `E` over K₀ = ℚ(√-d₀). A rigidity

        result for frames then shows that the objects counted have no automorphisms at deep level: levels

        inside a large place are neat.

        '
    remainder:
      path: grh/src/Lib/Shimura/HeckeTower/HeckeData.lean
      line: 13
      endLine: 50
      text: "\n## Main definitions and results\n\n* `New.Variety.fixedToEigen`: the elements that send `K`-fixed\
        \ vectors to eigenvectors of a\n  subgroup, in every representation.\n* `New.Variety.MarkedTriple`, `New.Variety.countTerm`:\
        \ triples (coset, rational matrix, mark) and\n  the term that an orbit of triples contributes; `New.Variety.IsRegularHecke`:\
        \ only separable\n  matrices contribute.\n* `New.Variety.IsSafe`, `New.Variety.invHeckeIsogeny`, `New.Variety.heckeSum`:\
        \ the safe split places\n  and the Hecke elements that appear in the congruence relation.\n* `New.Variety.localTerm`:\
        \ the local term of a fixed point, a polynomial whose coefficients are\n  built from the roots of the characteristic\
        \ polynomial.\n* `New.Variety.IsSignedFrameFor.similitude_and_root_norm`: an automorphism scales the form,\
        \ and its\n  eigenvalues have equal moduli.\n* `New.Variety.IsSignedFrameFor.eq_one_of_congr_large_norm`:\
        \ if such an automorphism is congruent to\n  `1` modulo an ideal of large norm, it is `1`.\n* `New.Variety.eventually_isNeat`:\
        \ hence levels inside a large place are neat.\n\nNotions from other files:\n* `New.levelSpace`: For a representation\
        \ π of G, a subgroup K and a character χ of K, the submodule\n  of vectors v with π(k)v = χ(k)v for all\
        \ k in K; for χ = 1, the K-fixed vectors.\n* `New.ofSplitPlace`: For a split place w, the homomorphism sending\
        \ g in GL_n(E_w) to the unitary\n  finite adelic matrix with component g at w and 1 off w, w̄.\n* `New.Variety.GU`:\
        \ The unitary similitudes: the frames of the scalar forms `c • 1`, `c > 0`\n  rational. `New.Variety.GUPlus`:\
        \ those whose inverse has integral entries.\n* `New.Gf`: The finite adelic unitary group G_f: matrices g\
        \ in GL_n(\U0001D538_f) with gᴴg = 1;\n  `New.stdLevel` is its subgroup of integral points, `New.stdSpace\
        \ E n` the definite space with form\n  `1`.\n* `New.basicCosetRep U`: for a subspace U of k_wⁿ of dimension\
        \ r (k_w the residue field at w), a\n  chosen g in GL_n(E_w) with g and ϖg⁻¹ integral, det g of valuation\
        \ r, and U the kernel of the\n  reduction of g.\n* `New.levelOf w H`: the elements of `New.stdLevel` whose\
        \ reductions modulo the places `w i` lie in\n  `H`; `New.classAut Γ K g`: the stabiliser Γ ∩ gKg⁻¹ of the\
        \ coset gK.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.HeckeTower.Model`, `Lib.Shimura.IntegralModel.TowerExistence`\
        \ and\n`Lib.Shimura.Uniformisation.AppellHumbert` for sources.\n"
