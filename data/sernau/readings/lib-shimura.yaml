      startOffset: 1175
      endOffset: 7116
      text: "\n\n## Overview of this theory\n\nLet `E` be a CM field strictly containing `K₀ = ℚ(√-d)`, with `d\
        \ ≡ 3` mod 4. Let `v₀` be the base\ninfinite place of a CM type `Φ` of `E`, and let `\U0001D511` be a nonzero\
        \ neat level in `\U0001D4DE_E`. A finite place\n`w` of `E` over a place `u` of `K₀` is *safe* if `u` is\
        \ split and prime to `d`, and `\U0001D511` is prime to\n`w` and `ū`. The unitary similitude group, of rank\
        \ `n ≥ 1`, has signature `(1, n - 1)` at `v₀` and\nis definite at the other infinite places.\n\n* `New.Variety.exists_model`:\
        \ an integral model `Z` of Kuga–Sato type for this group, with level\n  covers and the congruence relation\
        \ at safe places. It lives over a localisation `R ⊆ E` of `\U0001D4DE_E`\n  whose maximal ideals lie over\
        \ primes good for the PEL data. The inputs are PEL data\n  (`New.Variety.exists_pel`) and a family of abelian\
        \ schemes over such `R`\n  (`New.Variety.ThetaNull.nonempty_universalFamily`), for which no universal property\
        \ is proved. If\n  `E` contains a primitive root of unity of order `7! = 5040`, the PEL data exist for a\
        \ suitable CM\n  type and for every nonzero `\U0001D511` divisible by an integer `N ≠ 0`, which can be taken\
        \ prime to any\n  given finite set of places.\n* `New.Variety.exists_isCoefficientSystem`: let `n` be odd,\
        \ `κ` a weight, and `Φ` a CM type in which\n  `Φ v₀` differs on `K₀` from every other `Φ v`. Take a Hecke\
        \ eigenform of neat level on the\n  definite side, with coefficients in an extension of the weight `κ` to\
        \ `GL_n(E)` that the theorem\n  supplies. At one split place it is of cuspidal type. At another split place\
        \ it is spherical, and\n  there the level is pro-`p` Iwahori, `p` being the residue characteristic of that\
        \ place. Then its\n  Hecke eigenvalues `θ` at safe places occur, in the sense of `New.Variety.OccursInWeight`,\
        \ in\n  weight `z + μ` for each jump `z` of `κ` at `Φ v₀`. The jumps are integers given by `New.jumps`.\n\
        \  Here `μ ∈ ℕ` does not depend on the form or the level.\n* `New.Variety.Model.exists_galois_rep`: let\
        \ `ℓ` be a prime, `ιℓ : ℂ ≃ ℚ̄_ℓ`, and `θ` a system of\n  Hecke eigenvalues at safe places. Let `R` be a\
        \ localisation of `\U0001D4DE_E` at elements prime to the safe\n  places. Take a model `Z` over `R` and\
        \ weights `h ≥ 0` in which `θ` occurs. Then there is a\n  continuous `ρ : Gal(Ē/E) → GL_m(ℚ̄_ℓ)` of undetermined\
        \ dimension `m`; the proof cuts it out of the\n  cohomology of `Z`. At safe places `ρ` is unramified or\
        \ crystalline, and the Hecke polynomial of\n  `ιℓ ∘ θ` kills geometric Frobenius. If the place over `ℓ`\
        \ induced by `ιℓ` and the given embedding\n  of `E` into `ℂ` is safe, the jumps (Hodge–Tate weights) of\
        \ `ρ` at that embedding include the given\n  weights. Other embeddings and multiplicities are not controlled.\n\
        \nThis theory proves the cases that are used of PEL integral models (Kottwitz) and of the geometric\nstep\
        \ in the Galois representations of cuspidal forms on `GL_n` (Shin). A direct comparison of two\nfinite counts\
        \ replaces the description of automorphic forms on unitary groups via `GL_n` (Labesse).\nNo moduli functor\
        \ is represented, nothing is transferred to `GL_n`, and no dimension is computed\nhere.\n\n1. `ComplexTheta`,\
        \ `AbelianScheme`, `ThetaGroup`, `Uniformisation`: theta functions and the complex\n   uniformisation.\n\
        2. `GoodReduction`, `ThetaNormality`, `ArcExtension`: good reduction along a valuation ring of `ℂ`.\n3.\
        \ `ThetaModuli`, `Deformation`: the closure of the theta-null points of the PEL abelian varieties\n   carries\
        \ a family of abelian schemes and is smooth.\n4. `HeckeTower` (the list of properties of a model), `CongruenceRelation`,\
        \ `IntegralModel`: level\n   covers, the congruence relation and the model.\n5. `TraceFormula`, `Transfer`:\
        \ the comparison with the definite unitary group. Last, `Eigenspace`:\n   the Galois representation.\n\n\
        ## Main definitions and results\n\n* `New.Variety.IsEigenQuotient`, `New.Variety.exists_isEigenQuotient`:\
        \ the definition; existence and\n  continuity.\n* `New.Variety.IsEigenQuotient.isCrystalline`: `r` is crystalline\
        \ if the `ρ i` are.\n* `New.Variety.IsEigenQuotient.isKilledBy`: a relation between `T` and Frobenius gives\
        \ a polynomial\n  that kills Frobenius on `r`.\n* `New.Variety.IsEigenQuotient.exists_sum_baseChange_eq_zero_of_jump_eq_zero`:\
        \ let the `ρ i` be\n  crystalline and the `T i s` commute with each other and with `Γ`. If `u` is not a\
        \ Hodge–Tate jump\n  of `r` at an embedding `γ` given by `a ∈ Gal(ℚ̄_ℓ/ℚ_ℓ)`, some polynomial in `T` that\
        \ is `1` at\n  `a ∘ θ` kills the vectors of weight `u`.\n\nNotions from other files:\n* `New.Period.IsCrystalline`:\
        \ T is crystalline: the elements of B⊗T fixed by all of Γ span B⊗T over\n  B.\n* `New.HasHodgeTateWeight`:\
        \ The element y of C_p⊗T (over Z_p) has Hodge–Tate weight u:\n  (j(g)⊗ρ(g))y = χ(j(g))^(−u)·y for all g\
        \ in Γ, with χ the cyclotomic character.\n* `New.Period.jump`: The multiplicity of the Hodge–Tate jump u\
        \ at γ: the dimension over Q̄_p (zero\n  if infinite) of the space `New.Period.hodgeTateMaps` of forms of\
        \ weight u: γ-semilinear f :\n  T → C_p with f(gx) = χ(g)^(−u)·g f(x) for g near 1.\n* `New.Period.IsKilledBy`:\
        \ The polynomial P over R kills (s, m): T is potentially crystalline and\n  P(β_{s,m}) = 0 on B⊗T, the coefficients\
        \ acting through T.\n* `New.Period.linearFrob`: β_{s,m}: a chosen B-linear endomorphism of B⊗T agreeing\
        \ with φ^m\n  j(s) ⊗ ρ(s) on D_pcris(T), if one exists (arbitrary otherwise).\n\n## Relation to the literature\n\
        \nKnown result: Galois representation cut out of cohomology by a Hecke eigensystem, and the\nEichler-Shimura\
        \ relation. Here the representation is a quotient of total cohomology rather than an\nisotypic part. No\
        \ dimension or semisimplicity is stated, only good reduction, annihilation by the\nHecke polynomial and\
        \ the occurrence of given Hodge-Tate weights. Source: Deligne, Formes modulaires\net représentations l-adiques,\
        \ Sém. Bourbaki 355 (1969), Thm 4.9; Harris and Taylor, The geometry and\ncohomology of some simple Shimura\
        \ varieties (2001), ch. VII; Wedhorn, Congruence relations on some\nShimura varieties, J. reine angew. Math.\
        \ 524 (2000).\n"
