      endLine: 18
      text: "This file models the objects of a PEL family `X` (`New.ThetaFamily`) over a valuation ring with\nfraction\
        \ field ℂ on complex tori `V` modulo a lattice given by a polarised period map. It then\ndescribes homomorphisms\
        \ of modelled objects by matrices `z ∈ GL_n(E)`.\n\n## Main definitions and results\n\n* `New.ThetaObject.TorusModel`:\
        \ `y.groupScheme` is uniformised by `V` modulo that lattice, with\n  theta coordinates.\n"
    remainder:
      path: grh/src/Lib/Shimura/Uniformisation/TorusModel.lean
      line: 19
      endLine: 48
      text: "* `New.ThetaTori.PeriodMap.exists_uniformisation_of_isSeparatingFamily`: a dense map given by theta\n\
        \  functions is a uniformisation.\n* `New.ThetaObject.TorusModel.fullStructure`: a model trivialises all\
        \ torsion, compatibly with the\n  Weil pairing. `New.ThetaObject.TorusModel.exists_unit_on_roots_of_unity`\
        \ supplies the unit of Ẑ\n  through which a ring homomorphism `O → ℂ` acts on roots of unity.\n* `New.ThetaObject.TorusModel.exists_isTranslationLift_of_dualLattice`\
        \ (with its parts\n  `New.ThetaObject.TorusModel.card_nsmul_mem_of_mem_dualLattice` and\n  `New.ThetaObject.TorusModel.exists_isTranslationLift_of_mem_dualLattice`),\n\
        \  `New.ThetaObject.TorusModel.multiplier_eq_canonicalMultiplier`: translations by the dual lattice\n  lift\
        \ to `y.lineBundle`, and the multiplier of the theta coordinates is the canonical one.\n* `New.ThetaObject.TorusModel.exists_matrix_of_hom`:\
        \ a linear `ψ` of multiplier `μ ≠ 0` comes from a\n  `z`.\n* `New.ThetaObject.TorusModel.exists_isIsogenyOfMatrix`,\n\
        \  `New.ThetaObject.TorusModel.exists_isogeny`: a `z` with `z ℓ z⁻¹ = ℓ'` and `g'⁻¹ z g` an integral\n \
        \ similitude of multiplier `μ` gives an isogeny (`New.ThetaObject.TorusModel.IsIsogenyOfMatrix`);\n  objects\
        \ with models have the same map from `\U0001D4DE E`\n  (`New.ThetaObject.TorusModel.baseHom_eq_baseHom`).\n\
        \nNotions from other files:\n* `New.ThetaTori.PeriodMap`: the linear part of a model: a real isomorphism\
        \ Q from (E ⊗ ℝ)ⁿ onto V,\n  a form β with frame g, and a form B on V whose Riemann form pulls back to\n\
        \  `New.Variety.polarisationForm`.\n* `New.Variety.frameCoords`: the map y ↦ g⁻¹y from Eⁿ to n-tuples of\
        \ finite adeles.\n* `New.Variety.realVecAction`: the action of a matrix A over E on (E ⊗ ℝ)ⁿ, through Φ_v(A)\
        \ at the\n  infinite place v.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.Uniformisation.AppellHumbert`\
        \ and `Lib.Shimura.ThetaModuli.UniversalFamily`\nfor sources.\n"
