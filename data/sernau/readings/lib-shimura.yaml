      text: "\n\n## Main definitions and results\n\n* `New.Variety.AgreeModEps`: points of `x.groupScheme` and `x'.groupScheme`\
        \ with the same reduction\n  modulo `ε`. The points that agree with `0` are those that vanish modulo `ε`.\n\
        \  `New.Variety.AgreeModEps.ringChar_smul_and_smul_eq_zero` gives elements that kill them.\n* `New.Variety.drinfeld_lift`:\
        \ if `c` kills the points of `x'.groupScheme` that vanish modulo `ε`,\n  then multiplication by `c` on `x₀.groupScheme`\
        \ lifts to a homomorphism\n  `x.groupScheme ⟶ x'.groupScheme`.\n* `New.Variety.isLinear_and_pairing_eq_of_reduction`:\
        \ such an `f` is linear, and `a` kills its\n  kernel modulo `ε`. The lemma also describes its effect on\
        \ the pairing.\n* `New.Variety.finrank_tangent_le_card_index_sub_one`: under the hypotheses stated in its\
        \ docstring,\n  if a first-order deformation `x` over `k ⊕ M*` of `x₀` has no constant direction in `M`,\
        \ then\n  `finrank k M ≤ Fintype.card D.Index - 1`.\n\nNotions from other files:\n* `New.ThetaObject`: An\
        \ object of the family X over a scheme T: a morphism from T to the base of X.\n* `New.ThetaObject.groupScheme`:\
        \ The group scheme with O_E-action of an object x over S: the\n  pull-back of the abelian scheme of the\
        \ family along x : S → base.\n* `New.Pic.pairing`: For c in Pic A and T-points x, y of A, the class ⟨x,\n\
        \  y⟩ = (x + y)^*c − x^*c − y^*c + 0^*c in Pic T (`New.Pic.atPoint` is x ↦ x^*c).\n* `New.IsGroupBaseChange.pointEquiv`:\
        \ For an O-compatible base change p : A' → A and an S'-scheme T,\n  the O-linear bijection x ↦ p∘x from\
        \ T-points of A' over S' to T-points of A over S.\n\n## Relation to the literature\n\nKnown result: Deformations\
        \ of the PEL object have at most n - 1 parameters, where n is the size of\nthe index set `D.Index`. Only\
