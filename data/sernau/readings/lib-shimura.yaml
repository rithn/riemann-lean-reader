      line: 8
      endLine: 12
      text: 'The moduli problem for a PEL datum `D : New.PEL E` is studied through one family `New.ThetaFamily`.

        An object is rigid if it satisfies a constancy and spanning condition over Noetherian local rings.

        Over a local Noetherian ring, rigidity yields a criterion for points in the kernel of the

        polarisation to vanish. It also yields the identification of objects related by compatible

        homomorphisms.

        '
    remainder:
      path: grh/src/Lib/Shimura/ThetaModuli/ThetaFamilyRigidity.lean
      line: 13
      endLine: 41
      text: "\n## Main definitions and results\n\n* `New.ThetaFamily`: an abelian scheme with `\U0001D4DE E`-action,\
        \ theta coordinates and level points.\n* `New.ThetaObject`: a point of the base; its abelian scheme, bundle\
        \ and level points are\n  pull-backs.\n* `New.ThetaObject.FullLevelStructure`, `New.ThetaObject.FullLevelStructure.exists_pullback`:\n\
        \  trivialisations of all torsion, and their pull-back along a local homomorphism to `ℂ`.\n* `New.ThetaObject.HasSpanningCoords`:\
        \ constant functions and spanning coordinates on every\n  pull-back to a Noetherian local ring; such an\
        \ object is called rigid.\n* `New.ThetaObject.HasSpanningCoords.eq_zero_of_pairing_eq_zero`: a criterion,\
        \ in characteristic\n  `l`, for a point in the kernel of the polarisation to be zero.\n* `New.ThetaObject.HasSpanningCoords.eq_and_comp_toFamily_eq_of_hom`:\
        \ for two objects with the same\n  map `\U0001D4DE E → B`, a homomorphism that respects the action, the\
        \ pairing and the level points\n  identifies them.\n\nNotions from other files:\n* `New.PEL.levelTorsion`:\
        \ the level module: the O_E-submodule of (\U0001D538_f / Ô)^rank of elements killed\n  by the level \U0001D511\
        .\n* `New.Pic.pairing`: for c in Pic A and T-points x, y of A, the class\n  ⟨x, y⟩ = (x + y)^*c − x^*c −\
        \ y^*c + 0^*c in Pic T.\n* `New.Variety.IsSectionLift`: a map H⁰(L) → H⁰(L') that is pull-back along f followed\
        \ by some\n  isomorphism f^*L ≅ L'; `New.Variety.IsTranslationLift` is the case of a translation, L' = L.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.Shimura.ThetaModuli.UniversalFamily`,\n`Lib.Cohomology.ProjectiveLine.ConstantLineFormula`\
        \ and `Lib.Shimura.IntegralModel.UniversalFamily`\nfor sources.\n"
