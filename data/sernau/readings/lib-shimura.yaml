      text: 'The file gives a criterion for the main condition of good reduction of a torus `V / L` with

        multiplications `New.ThetaTori.IsHermitianAction`. The condition

        (`New.ThetaTori.HasMultiplicativeNorm`) is that the sup norm of sizes of theta functions is

        multiplicative at the valuation `v`. The tool is a shift bound: `A.HasShiftBound v w C` (`w` has

        the constant `C` in degree `A`) says `φ y ^ 2 ≤ C * ⨆ x, φ x * φ (x + w)` for all sizes `φ` of theta

        functions of degree `A` and all torsion points `y`. Constants are obtained on the kernels of

        multiplications `c` and descend along `c`, which gives multiplicativity.

        '
    remainder:
      path: grh/src/Lib/Shimura/GoodReduction/MultiplicativeNorm.lean
      line: 15
      endLine: 47
      text: "\n## Main definitions and results\n\n* `New.ThetaTori.IsHermitianAction.hasShiftBound_one_of_ker`:\
        \ under arithmetic conditions on `c`,\n  its kernel has the constant `1`.\n* `New.ThetaTori.IsHermitianAction.hasShiftBound_of_torsionAction`,\n\
        \  `New.ThetaTori.IsHermitianAction.eventually_hasShiftBound`: a constant descends along `c`; some\n  constant\
        \ exists.\n* `New.ThetaTori.IsHermitianAction.hasMultiplicativeNorm_of_frequently_hasShiftBound`: if such\
        \ `c`\n  have arbitrarily small inverses, `New.ThetaTori.HasMultiplicativeNorm` holds.\n* `New.ThetaTori.hasMultiplicativeNorm_of_expanding`:\
        \ the multiplicative norm from arithmetic\n  conditions on `R`, `B` and `p`.\n* `New.ThetaTori.ThetaTorus.hasGoodReduction_and_val_card_eq_one`:\
        \ let `v` be a valuation on `ℂ`\n  whose valuation ring receives `\U0001D4DE E` compatibly with `Φ v₀`,\
        \ over a prime that is good for `D`.\n  Then a theta torus has good reduction for `v`, and the order of\
        \ `D.dualTorsion` is a unit.\n\nNotions from other files:\n* `New.ThetaTori.IsHermitianAction.multiplier`:\
        \ The canonical multiplier x ↦ exp(πi E(βx, x)) of the\n  hermitian data, where E is the Riemann form of\
        \ B.\n* `New.ThetaTori.HasGoodReduction`: a polarisation whose dual lattice is mapped into the lattice by\n\
        \  a `v`-unit, a level `r > 1` that is a `v`-unit, and a multiplicative sup norm of theta functions\n  on\
        \ the torsion points.\n\n## Relation to the literature\n\nKnown result: Good reduction of unitary PEL abelian\
        \ varieties, in analytic form without toric\ndegeneration. Suppose a torus with polarisation prime to p\
        \ has non-unit multipliers that expand\narbitrarily, divide a power of p and are prime to their conjugates,\
        \ and whose conjugates have unit\ndeterminant on the Lie algebra. Then the supremum of a valuation of theta\
        \ values at torsion points\nis multiplicative. Source: K.-W. Lan, Elevators for degenerations of PEL structures,\
        \ Math. Res.\nLett. 18 (2011); R. Kottwitz, Points on some Shimura varieties over finite fields, J. Amer.\
        \ Math.\nSoc. 5 (1992), §5 (division algebra case); for the CM case B. Conrad, Semistable reduction for\n\
        abelian varieties (notes), Prop. 6.3, after Serre and Tate, Ann. of Math. 88 (1968).\n"
