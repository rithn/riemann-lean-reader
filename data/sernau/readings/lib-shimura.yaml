      text: 'An ideal of polynomials is cut out by points in the chart `c` if it contains `X c - 1`, the forms of

        degree `r ^ j` have prescribed ranks modulo the ideal, and its forms of degree `r ^ j` with `j ≤ i`

        are those that vanish at given points. When the points are the images of the same `A`-valued points,

        such ideals fit into a flat family over `A`, and a degree bound for monomial ideals shows that

        finitely many degrees suffice.

        '
    remainder:
      path: grh/src/Lib/Shimura/ThetaModuli/FlatClosure.lean
      line: 13
      endLine: 44
      text: "\n## Main definitions and results\n\n* `New.Variety.ThetaNull.IsCutDegree`, `New.Variety.ThetaNull.eventually_isCutDegree`:\
        \ for every\n  large enough `d`, a monomial ideal with at most `σ i` standard monomials of degree `r ^ i`\
        \ for all\n  `i ≤ d` has at most `σ i` of them in every degree `r ^ i`.\n* `New.Variety.ThetaNull.eq_map_and_flat_of_isCutOut`:\
        \ let `I₀` and the `I n` be cut out by the\n  images of the same `A`-valued points along a local map `φ`\
        \ and jointly injective maps `ψ n` to one\n  field `K`, with `r > 1` and `i` such a bound. Let `T` be the\
        \ polynomials over `A` that map into\n  every `I n`. Then `I₀` is the reduction of `T`, and the quotient\
        \ by `T` is flat.\n* `New.Variety.ThetaNull.IsCutOutAt`: at a field-valued point `t` of `S`, the vanishing\
        \ ideals of a\n  set `Z` in the affine charts are cut out (`New.Variety.ThetaNull.IsCutOut`) by the values\
        \ at `t`\n  of given maps `P a` from `S` to projective space.\n* `New.Variety.ThetaNull.exists_isFlatClosure`:\
        \ for points `θ n z` of projective space over complex\n  points `η n` of a reduced `S`, cut out (`New.Variety.ThetaNull.IsCutOutAt`)\
        \ at each `η n` by\n  linear systems `P`, with `r > 1` and `i` a degree bound (`New.Variety.ThetaNull.IsCutDegree`),\n\
        \  where every point of `S` specialises to a geometric point at which some set is cut out, the\n  reduced\
        \ closure of the points over a finite dense set of the `η n` is flat over `S`, and every\n  point of `S`\
        \ specialises to a geometric point with reduced fibre.\n\nNotions from other files:\n* `AddSemigroupIdeal\
        \ (J →₀ ℕ)` (Mathlib): a set of exponents that is closed under adding any\n  exponent, that is, a monomial\
        \ ideal.\n* `New.LineBundle` with `New.LineBundle.IsLinearSystem`: a map from a scheme to projective space,\n\
        \  given by charts and the ratios of coordinates on them.\n* `New.IsDenseFamily`: a family of complex points\
        \ of a scheme whose images are dense.\n* `New.Variety.AllSpecializeTo`: every point of a scheme S specialises\
        \ to the image of some point\n  over an algebraically closed field that satisfies a property Q of field-valued\
        \ points.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.ThetaModuli.UniversalFamily` for sources.\n"
