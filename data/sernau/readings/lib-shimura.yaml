      endLine: 11
      text: 'This file treats Appell–Humbert data `(B, χ)` with positive Riemann form `E` for a full lattice

        `L` in a finite-dimensional complex space `V`. It proves the convergence of theta series and the

        existence of a nonzero theta function. It proves that the square of the dimension of the space of

        theta functions equals the index of `L` in its dual lattice, and that the twisted translations by

        the dual lattice act irreducibly. It shows that multiples of a positive type have no base point.

        '
    remainder:
      path: grh/src/Lib/Shimura/ComplexTheta/DimensionFormula.lean
      line: 12
      endLine: 43
      text: "It also defines the canonical multiplier and the normalised translations.\n\n## Main definitions and\
        \ results\n\n* `New.IsAppellHumbert.finrank_sq_eq_relIndex`: for Appell–Humbert data with positive `E`,\n\
        \  `(dim thetaSpace)² = [dual : L]`, the dimension is positive, and the twisted translations by the\n  dual\
        \ lattice span all endomorphisms of the space of theta functions; so the space is irreducible\n  (`New.IsAppellHumbert.thetaSpace_le_of_thetaShift_mem`,\
        \ `New.IsAppellHumbert.schur_lemma`).\n* `New.IsAppellHumbert.exists_mem_thetaSpace_nsmul_apply_ne_zero`:\
        \ for Appell–Humbert data with\n  positive `E` and `n ≥ 2` the theta functions of type `(n B, χ ^ n)` have\
        \ no common zero.\n* `New.ThetaTori.canonicalMultiplier`, `New.ThetaTori.normalizedShift`: a canonical multiplier\n\
        \  `exp (πi E(b x, x))` for a linear map `b`, and the twisted translations divided by it, which, for\n \
        \ Appell–Humbert data and `b` with `E (b u) w = E u w - E u (b w)`, obey a Heisenberg law\n  (`New.IsAppellHumbert.normalizedShift_normalizedShift`).\n\
        \nNotions from other files:\n* `New.RealComplexForm.thetaSpace`: the entire `f` with\n  `f (z + l) = χ l\
        \ * exp (B l z + B l l / 2) * f z` for `l ∈ L`.\n* `New.RealComplexForm.thetaShift`: translation by `a`\
        \ twisted by `exp (-(B a z + B a a / 2))`.\n* `New.RealComplexForm.dualLattice`: the `v` in `V` with `E(v,\
        \ l)` an integer for all `l` in `L`.\n\n## Relation to the literature\n\nFrobenius' dimension formula and\
        \ irreducibility of the theta group. Here the statement is\nbasis-free, with the square of the dimension\
        \ equal to the index of the lattice in its dual. It is\nproved together with irreducibility from a theta\
        \ kernel on the torus without a symplectic basis, and\nthe orthogonality relation and the absence of base\
        \ points follow. Source: G. Frobenius, Über die\nGrundlagen der Theorie der Jacobischen Functionen, Crelle\
        \ 97 (1884); Birkenhake–Lange, Complex\nAbelian Varieties, 3.2.7, 4.1.5, 6.4; survey of proofs in D. Bump,\
        \ A. Pekker, Proc. AMS 130 (2002)\n3473–3481.\n\nSee also `Lib.Shimura.Uniformisation.AppellHumbert`.\n"
