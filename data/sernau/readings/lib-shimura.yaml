        \ is an adelic frame, a\nreflection (1 on a line, −1 on a complement) and marked vectors.\n\n* `New.Variety.AnalyticFamily.isHolomorphicImmersionAt_of_holomorphicAt`:\
        \ let the objects `x b'`\n  have models of the tori of an analytic family. Let `b` be in its domain. Suppose\
