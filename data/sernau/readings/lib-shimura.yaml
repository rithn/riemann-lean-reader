        \ polynomial of `y` to\n  be separable.\n* `New.Variety.IsNeat`: The level \U0001D511 is neat: \U0001D511\
        \ ≠ 0 and, whenever `x` is a signed frame with `ℓ` for\n  some form (`New.Variety.IsSignedFrame`), every\
        \ y in GL_n(E) with x⁻¹yx in `levelGU n \U0001D511` that fixes\n  ℓ under `New.Variety.ratConj` equals 1.\n\
