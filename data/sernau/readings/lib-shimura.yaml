      endLine: 13
      text: 'This file builds objects from their values at a dense family of complex points. A linear system is
        a

        line bundle whose transition functions are the ratios `s j / s i`, that is, a map to projective

        space. `New.Variety.ThetaNull.exists_isLinearSystem` extends coordinates given at a dense family `ξ`

        of complex points of a reduced scheme (`New.IsSeparatingFamily`) to a linear system. It needs a

        linear system `M` with homogeneous coordinates `m a` at each `ξ a`. It also needs each of `w`, `m`

        to be locally a regular function times sums of the other. The result has the Picard class of `M`.

        '
    remainder:
      path: grh/src/Lib/Shimura/ThetaModuli/FamilyFromPoints.lean
      line: 14
      endLine: 43
      text: "The second part builds a family of theta-embedded abelian schemes `New.ThetaFamily D` over a base\n\
        `S` from complex points `η k` of `S` that carry theta tori `x k`. The scheme `A` is the closure of\nthe\
        \ theta points. The group law, the action and all identities extend from these points by density,\nusing\
        \ Riemann's relation for theta functions.\n\n## Main definitions and results\n\n* `New.exists_isAbelianScheme`:\
        \ group and module axioms pass from dense families of vector spaces to\n  `A`.\n* `New.Variety.exists_maps_of_riemann_relation`:\
        \ the extension step along Riemann's relation.\n* `New.Variety.exists_add_and_intAction`: the addition and\
        \ the action of `\U0001D4DE E` extend to `A`.\n* `New.Variety.exists_isThetaStructure`: the theta law on\
        \ base changes to local rings.\n* `New.Variety.exists_thetaFamily_of_points`: the family exists, modelled\
        \ on `x i` at each `η i`.\n  The remaining lemmas of the second part are steps of its proof.\n\nNotions\
        \ from other files:\n* `New.LineBundle.IsHomogeneousCoords`: a vector `v` gives homogeneous coordinates\
        \ of a point `t`\n  for a line bundle: `v j` is a unit exactly when `t` lands in chart `j`, and there the\
        \ transitions\n  from chart `j` are the ratios `v k / v j`.\n* `New.LineBundle.IsLinearSystem`: a line bundle\
        \ whose transitions are regular on their charts,\n  vanish off them, and are homogeneous coordinates of\
        \ every point of the chart.\n* `New.PointFn.IsRegularOn`: a function `f` is regular on an open `U`: at points\
        \ `t : Spec A → X`\n  that land in `U`, its value commutes with all ring maps `φ : A → B`.\n* `New.Variety.AllSpecializeTo\
        \ S Q`: every point of `S` specialises to the image of a point over an\n  algebraically closed field with\
        \ the property `Q`.\n* `New.ThetaTori.ThetaTorus.IsRiemannTuple`: coefficient tuples for Riemann's relation.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.Shimura.ThetaModuli.UniversalFamily` for sources.\n"
