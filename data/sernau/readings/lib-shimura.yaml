      endLine: 12
      text: 'Φ v denotes the embedding E → ℂ that the CM type chooses at the infinite place v, and v₀ is the base

        infinite place fixed by `New.CMBase`. Theta tori that vary analytically with a parameter b in a

        domain of ℂⁿ⁻¹, all uniformised by one fixed space V, form analytic families. Near each b₀, their

        theta coordinates become analytic after a common factor c(b) ≠ 0. For a fixed frame, the positive

        lines form a ball, and the moduli points with this frame are the points of a single analytic family

        over that ball.

        '
    remainder:
      path: grh/src/Lib/Shimura/Uniformisation/BallModel.lean
      line: 13
      endLine: 49
      text: "\n## Main definitions and results\n\n* `New.ThetaTori.PeriodMap.isSignedFrameFor`: the sign condition\
        \ on the matrix of a polarised period\n  map.\n* `New.Variety.AnalyticFamily`: a family of theta tori, with\
        \ periods Q_b analytic in b and with\n  B(Q_b ·, ·) independent of b.\n* `New.Variety.AnalyticFamily.exists_analytic_thetaCoord`:\
        \ near b₀, after a common factor c(b) ≠ 0,\n  the theta coordinates are analytic in (b, z).\n* `New.Variety.positiveBall`,\
        \ `New.Variety.exists_ball_chart`: the positive lines, in coordinates\n  ℂ × ℂ^(n−1); the set is star-convex,\
        \ hence connected.\n* `New.Variety.ballPeriod`: an explicit period map (E ⊗ ℝ)ⁿ → `New.Variety.BallFibre`,\
        \ affine in the\n  point.\n* `New.Variety.exists_analyticFamily_positiveBall`: the ball carries an analytic\
        \ family\n  `New.Variety.AnalyticFamily` with these periods and the reflections `New.Variety.formReflection`.\n\
        * `New.Variety.IsBallFamily`, `New.Variety.exists_isBallFamily`: the points with the frame of a\n  given\
        \ point o are the points `New.Variety.AnalyticFamily.ballPoint` of one analytic family. An\n  isomorphism\
        \ z in GL_n(E) from a translate o·(g, α) to o acts on the parameters near 0 by a linear\n  map K, and its\
        \ local term, a complex polynomial p (`New.Variety.localTerm`), satisfies\n  p(t) = p(0)·det(1 − tK) for\
        \ all t in ℂ.\n\nNotions from other files:\n* `New.Variety.IsSignedFrameFor` g ℓ β: the adelic matrix `g`\
        \ is a frame for the matrix `β` over E,\n  the matrix `β.map (Φ w)` is positive definite for every infinite\
        \ place `w ≠ v₀`, and\n  `β.map (Φ v₀) * ℓ` is positive definite.\n* `New.Variety.IsPeriodMap` ℓ Q: Q carries\
        \ iℓ at v₀ and i at the other places to multiplication by\n  i.\n* `New.Variety.BallBase`: The complex vector\
        \ space ℂ^(n−1), which contains the parameter domains of\n  the families of periods.\n* `New.Variety.RealVectors`:\
        \ The space (E ⊗ ℝ)ⁿ, written as n-tuples of elements of the product of\n  copies of ℂ over the infinite\
        \ places of E.\n* `New.Variety.BallFibre`: The complex space (ℂ × ℂ^(n−1)) × ∏_{v ≠ v₀} ℂⁿ, the common target\
        \ of the\n  period maps of a family.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.Uniformisation.AppellHumbert`\
        \ for sources.\n"
