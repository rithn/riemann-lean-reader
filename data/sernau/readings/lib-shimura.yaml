      text: 'Fix a split place `w` of the CM field `E` and a subspace `C` of `(𝓞 / w)ⁿ`, and let `q` be the order

        of the residue field. This file describes how the Hecke element `New.Variety.invHeckeIsogeny w C`

        acts on the torsion module `New.AdelicTorsion E n`, which is `(𝔸_f / Ô)ⁿ`. These computations are

        combined with Frobenius-twisted reductions of linear maps to prove

        `New.Variety.UniversalFamily.exists_ne_bot_factorsThrough_sup`. This result is the geometric step

        behind the congruence relation at `w`.

        '
    remainder:
      path: grh/src/Lib/Shimura/CongruenceRelation/HeckeNeighbours.lean
      line: 13
      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.Variety.exists_residue_torsion_emb`: the `w`-torsion is\
        \ `(\U0001D4DE / w)ⁿ`, compatibly with integral\n  matrices.\n* `New.Variety.frobeniusTwist`: the absolute\
        \ Frobenius of a `k`-scheme, as a map between its two\n  structures over `V`.\n* `New.Variety.IsTwistedReduction`:\
        \ a map between reductions is the reduction of a map `ψ` twisted\n  by a Frobenius.\n* `New.Variety.IsTwistedReduction.exists_comp_eq_smul`:\
        \ a multiple of one twisted reduction factors\n  through another.\n\nNotions from other files:\n* `New.Variety.invHeckeIsogeny`:\
        \ For a subspace U of k_wⁿ of dimension r, the product of a central\n  factor, the conjugate of N(ϖ_w)^(−r)\
        \ with N the norm from E to ℚ(√−d₀), and a unitary local\n  factor, which is (`New.basicCosetRep` U)⁻¹ at\
        \ w and 1 away from w and w̄.\n* `New.basicCosetRep`: For a subspace U of k_wⁿ of dimension r, a matrix\
        \ in the double coset of\n  diag(ϖ 1_r, 1) in GL_n(E_w) whose reduction modulo w has kernel U.\n* `New.Variety.SplitFinPlace`:\
        \ The finite places w of E with w̄ ≠ w, that is, those split over the\n  maximal real subfield.\n* `New.Variety.IsSafe`:\
        \ The place u of ℚ(√−d₀) below w contains some (1 + √−d₀)/2 − b coprime to its\n  conjugate (so u is split),\
        \ and the level \U0001D511 lies neither in w nor in a place above ū.\n\n## Relation to the literature\n\n\
