    excerpt:
      path: grh/src/Lib/Shimura/AbelianScheme/Basic.lean
      line: 7
      endLine: 12
      text: 'This file sets up abelian schemes over a base `S` in terms of `T`-points `T ⟶ A` in `Over S`,

        written additively. It shows how points, sections and `O`-linear homomorphisms pass to a base

        change. It proves that the kernel of a finite homomorphism into a separated commutative group scheme

        over `Spec R` is `Spec S` for a finite `R`-algebra `S` (`New.Variety.exists_finite_kernel_ring`). It

        also proves that global functions on the base change of an integral abelian scheme over a field to

        an affine base are constant on the fibres (`New.Variety.hasConstFunctions_of_isPullback`).

        '
    remainder:
      path: grh/src/Lib/Shimura/AbelianScheme/Basic.lean
      line: 13
      endLine: 31
      text: "\n## Main definitions and results\n\n* `New.AddObj`, `New.ModuleObj O`: commutative group objects,\
        \ and actions of a ring `O` on points.\n* `New.IsGroupBaseChange`: base change, compatible with the group\
        \ structure and the `O`-action;\n  Mathlib's pullback carries both structures.\n* `New.IsAbelianScheme`:\
        \ smooth and proper, with surjective multiplication by every `m ≠ 0`.\n  Divisibility is asked for where\
        \ one usually asks for connected fibres.\n* `New.Pic.atPoint`, `New.Pic.pairing`, `New.Pic.ParallelogramLaw`:\
        \ for a class `c` in the Picard\n  group `New.Pic` (written additively), its pull-back along a point, the\
        \ pairing of two points, and\n  the parallelogram law.\n\nNotions from other files:\n* `New.Pic.pull`: For\
        \ p: Y → X, the homomorphism Pic X → Pic Y sending the class of a line bundle to\n  the class of its pull-back.\n\
        \n## Relation to the literature\n\nKnown; see `Lib.Shimura.AbelianScheme.IsogenyFlatness` for sources.\n"
