      endLine: 14
      text: "The existence half of the Appell–Humbert theorem, for a projective embedding N of a uniformised\ngroup\
        \ A(ℂ) = V/L whose class satisfies the parallelogram law.\n\n* `New.Uniformisation.appell_humbert`: the\
        \ coordinates of N are theta functions for some\n  Appell–Humbert data (L, B, χ) with positive Riemann form.\n\
        * `New.exists_analyticAt_double_eq`, `New.exists_extension_double`, `New.induction_on_double`: the\n  doubling\
        \ equation near 0, and its continuation to the whole space by halving.\n"
    remainder:
      path: grh/src/Lib/Shimura/Uniformisation/AppellHumbert.lean
      line: 15
      endLine: 47
      text: "\nIdea: the parallelogram law gives a frame on A × A, and its values define a function c. After\nmultiplying\
        \ c by exp q(z, z) for a suitable quadratic form q, the doubling equation\nσ(2z) = σ(z)⁴c(z) is solved near\
        \ 0 and continued to V by halving. Then σ trivialises the pullback of\nN.\n\n`New.Uniformisation` A V is\
        \ a surjective homomorphism e = `u.expMap` : V → A(ℂ), holomorphic and\nimmersive, with kernel the lattice\
        \ L = `u.lattice`. `New.HasThetaCoords` says that θ(z) gives\nhomogeneous coordinates of e(z), each θ_i\
        \ a theta function of type (B, χ): entire, with\nθ_i(z + l) = χ(l)·exp(B l z + B l l / 2)·θ_i(z) for l in\
        \ L.\n\nNotions from other files:\n* `New.atGeneric`: For a family s of sections of A over Spec O, O a valuation\
        \ ring of ℂ, the complex\n  point of A given by s(z) at the generic point.\n* `New.LineBundle.IsHomogeneousCoords`:\
        \ v is a vector of homogeneous coordinates of the point t for\n  L: t lands in U_j exactly when v_j is a\
        \ unit, and then g_jk(t) = v_k/v_j.\n* `New.IsAppellHumbert`: Re B is symmetric, and on L one has |χ| =\
        \ 1 and χ(l + m) = χ(l)χ(m)·exp(πi\n  E(m, l)), E the Riemann form of B.\n* `New.IsPosRiemann`: The Riemann\
        \ form E of B is positive: E(u, iu) > 0 for every u ≠ 0.\n* `New.Pic.ParallelogramLaw`: The parallelogram\
        \ law for a class c in Pic A:\n  (x+y)^*c + (x−y)^*c + 2·0^*c = 2(x^*c + y^*c) in Pic T for all T-points\
        \ x, y of A and all\n  S-schemes T.\n\n## Relation to the literature\n\nKnown result: Appell–Humbert theorem,\
        \ a step in the complex uniformisation of PEL abelian varieties.\nFor a given uniformisation, this file\
        \ proves the existence half, for a very ample class obeying the\nparallelogram law. Source: J. S. Milne,\
        \ Introduction to Shimura Varieties (2005/2017), Theorem 8.17\nand Lemma 5.12; R. Kottwitz, Points on some\
        \ Shimura varieties over finite fields, J. AMS 5 (1992)\n§8; G. Shimura, On analytic families of polarized\
        \ abelian varieties and automorphic functions, Ann.\nMath. 78 (1963); A. Borel, Some finiteness properties\
        \ of adele groups over number fields, Publ. IHES\n16 (1963); D. Mumford, Abelian Varieties §§1–2; L. Breen,\
        \ Fonctions thêta et théorème du cube, LNM\n980 (1983).\n"
