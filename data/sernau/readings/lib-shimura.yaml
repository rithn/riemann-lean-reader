        \ g = ε • 1` for some\n  rational `c > 0` and unit `ε` of `Ẑ`, that is, the frames of the forms `c • 1`.\n\
        * `New.Variety.levelGU`: the principal level K(\U0001D511), the similitudes in `GL_n(Ô E)` that are congruent\n\
