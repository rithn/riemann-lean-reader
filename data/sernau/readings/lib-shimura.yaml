      text: 'Let `E` be a CM field with ring of integers `𝓞 E`. The file sets up the PEL data for the moduli

        problem of abelian schemes with an action of `𝓞 E`. It studies polarised period maps

        `x : New.ThetaTori.PeriodMap` for such data `D`. With `T = D.dualTorsion` the kernel of the

        polarisation, of odd order, and `L = D.lagrangian ≤ T` Lagrangian, the file constructs lattices over

        groups of torsion classes and canonical theta coordinates `θ_t` for `t ∈ T`.

        '
    remainder:
      path: grh/src/Lib/Shimura/ThetaModuli/PELThetaTori.lean
      line: 13
      endLine: 49
      text: "\n## Main definitions and results\n\n* `New.PEL`: the data (rank, polarization type, level, theta structure)\
        \ and their numerical\n  conditions. `New.PEL.levelTorsion` is the torsion of the level.\n* `New.PEL.HasClassLaws`:\
        \ the laws required of the class of the embedding line bundle.\n* `New.ThetaTori.PeriodMap`: a period map\
        \ onto a complex vector space, with a polarisation whose\n  Riemann form pulls back to `New.Variety.polarisationForm`.\n\
        * `New.Variety.fourierChar_polarisationForm`: if `gᴴ β g = a · 1`, its exponential is a value of\n  `New.ψf`\
        \ in the coordinates of `g`.\n* `New.ThetaTori.PeriodMap.latticeOver`: the lattice in `V` over a group `S`\
        \ of torsion classes.\n  `New.ThetaTori.PeriodMap.periodLattice` is the lattice for `S = 0`, and its dual\
        \ for the Riemann\n  form is the lattice over `T` (`New.ThetaTori.PeriodMap.dualLattice_periodLattice`).\n\
        * `New.ThetaTori.PeriodMap.thetaCoord`: for `t ∈ T`, the normalised translate `θ_t` by a lift of `t`\n \
        \ of the theta function `New.ThetaTori.PeriodMap.lagrangianTheta` for the\n  lattice over `L`. That theta\
        \ function is unique up to a scalar.\n* `New.ThetaTori.PeriodMap.formSpan_eq_normBall`,\n  `New.ThetaTori.PeriodMap.thetaCoord_vector_ne_zero`:\
        \ at a valuation of good reduction, the forms\n  of degree `r^j` in the `θ_t` fill a ball of theta functions.\
        \ The `θ_t` have no common zero.\n\nNotions from other files:\n* `New.ψf`: the standard additive character\
        \ of the finite adeles: ψ_f(x) = exp(2πi Tr_{E/ℚ}(a)) for\n  any a in E with x − a integral.\n* `New.Variety.toRealVectors`:\
        \ the additive map E^n → (∏_v C)^n applying the CM-type embedding\n  x ↦ (Φ_v(x))_v to each coordinate.\n\
        * `New.RealComplexForm.thetaSpace`: the entire functions f on V with\n  f(z + l) = χ(l)·exp(B(l,z) + B(l,l)/2)·f(z)\
        \ for l in L.\n* `New.RealComplexForm.thetaShift`, `New.ThetaTori.normalizedShift`: the twisted translation\n\
        \  f ↦ exp(−B(a,z) − B(a,a)/2)·f(z + a), and the same divided by the multiplier at a.\n* `New.AdelicTorsion`,\
        \ `New.Variety.frameTorsionClass`: the torsion O_E-module (\U0001D538_f / Ô)ⁿ of\n  n-tuples of finite adeles\
        \ of E modulo integral ones (an adelic model of (E / O_E)ⁿ), and the\n  O_E-linear map sending y in Eⁿ to\
        \ the class of the adelic vector g⁻¹y in it.\n\n## Relation to the literature\n\nKnown; see `Lib.Shimura.IntegralModel.TowerExistence`,\
        \ `Lib.Shimura.Uniformisation.AppellHumbert`\nand `Lib.Shimura.ThetaModuli.UniversalFamily` for sources.\n"
