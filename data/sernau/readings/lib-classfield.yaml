    excerpt:
      path: grh/src/Lib/ClassField/Places/LocalFields.lean
      line: 8
      endLine: 14
      text: 'A local field is a field `k` whose absolute Galois group `Γ` acts on an algebraic closure `Ω` and

        stabilises a valuation subring `A` of `Ω` (`New.IsLocalGalois`). The trace `O = A ∩ k`

        (`New.valRingBelow k A`) must be a discrete valuation ring whose residue field has finite order `q`

        (`New.residueCard k A`); completeness is not assumed. `A.valuation` is multiplicative (at most 1 on

        `A`). For a uniformiser `π` of `k`, the additive valuation `New.ordRat k A : Ωˣ → ℚ` is normalised

        so that `π` has order `1`; it is defined on `DiscreteUnits Ω`, which is `Ωˣ` written additively

        (`x.toMul` is the unit). `valuationVia k A c` is `A.valuation` of the image of `c : k` in `Ω`.

        '
    remainder:
      path: grh/src/Lib/ClassField/Places/LocalFields.lean
      line: 15
      endLine: 47
      text: "\n## Main definitions and results\n\n* `New.IsLocalGalois.frobenius_spec`: for a henselian local field\
        \ `k`, `Γ` contains an arithmetic\n  Frobenius `φ`. The products of a power `φ ^ n` (`n ≥ 0`) with an element\
        \ of inertia are dense in\n  `Γ`, and `A` is integral over `A ∩ k`. The three parts are `New.IsLocalGalois.exists_isFrob`,\n\
        \  `New.IsLocalGalois.denseRange_frob_pow_mul_inertia` and\n  `New.IsLocalGalois.isIntegral_valRingBelow`.\n\
        * `New.IsLocalGalois.of_finite`: a finite extension `k'` of `k` is local, and its ramification index\n \
        \ `e` and residue degree `f` satisfy `e * f = [k' : k]`. Moreover `e = 1` if the group of `k'`\n  contains\
        \ inertia.\n* `New.existsUnique_unramified_char`: for a local field `k` and `r ∈ ℚ/ℤ` there is exactly one\n\
        \  continuous character of its absolute Galois group that is trivial on inertia and sends a given\n  Frobenius\
        \ to `r`. It comes from the action on roots of unity of order dividing `q ^ m - 1`, `m`\n  the order of\
        \ `r`.\n\nNotions from other files:\n* `New.IsFrob`: `σ` stabilises the valuation subring `A` and `σ • x\
        \ ≡ x ^ q` modulo the maximal\n  ideal for all `x ∈ A`.\n* `New.IsUniformiser`: `π` is a uniformiser of\
        \ `K` for `A`: an element of `K` lies in the maximal\n  ideal of `A` exactly when its valuation is at most\
        \ that of `π`.\n* `New.residueCard k A`: the order of the residue field of A ∩ k (zero if infinite).\n*\
        \ `New.ordRat k A`: the order on Ωˣ normalised on k, chosen so that `n * ordRat k A x = a` exactly\n  when\
        \ `x ^ n` and `π ^ a` have the same valuation, for uniformisers `π` of `k`.\n* `New.QZ`: the group ℚ/ℤ;\
        \ it is given the discrete topology.\n\n## Relation to the literature\n\nKnown result: Hilbert ramification\
        \ theory for infinite Galois extensions, here for local fields.\nPlaces are valuation rings of an algebraic\
        \ closure acted on by an abstract profinite group, and\nlocal fields are only henselian with finite residue\
        \ field. Source: J. Neukirch, Algebraic Number\nTheory, 1999, I §9, II §§7–9, VI §1; J.-P. Serre, Local\
        \ Fields, 1979, I §7, IV §2; Stacks Project,\ntag 09EE.\n"
