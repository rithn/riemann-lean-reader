      startOffset: 369
      endOffset: 1299
      text: 'The file studies continuous characters `χ : Γ → ℚ/ℤ` of absolute Galois groups `Γ = Gal(Ω/E)` (`Ω`

        the algebraic closure; `New.EmbeddedNumberField E`: a number field with an embedding into `Ω`) of CM

        fields `E` that are killed by a prime `p`, and the cyclic extensions of degree `p` they cut out.

        Grunwald''s theorem in prime degree produces such characters with prescribed local behaviour. If `E`

        is stably unramified (here: `New.HasPrimitiveRoot5040 E`, a primitive 5040th root of unity lies in

        `E`) and the symmetrised character is nonzero and kills inertia above `p`, the field cut out by the

        symmetrised character is a step of degree `p` over `E`. Weil data lift to stably unramified CM

        extensions `L` whose CM type restricts to that of `E` and whose relative different is prime to the

        places fixed by conjugation. Together these results give a step of prime degree with Weil data and a

        prescribed completion at a split place.'
    remainder:
      path: grh/src/Lib/ClassField/Grunwald.lean
      line: 20
      endLine: 63
      startOffset: 1299
      endOffset: 4064
      text: "\n\n## Main definitions and results\n\n* `New.grunwald`: a character of the finite ideles of a totally\
        \ complex field, killed by `p`, agrees\n  with a Galois character killed by `p` at finitely many given places,\
        \ and on the units at every\n  place whose norm is not prime.\n* `New.QZChar.symmetrise`, `New.QZChar.abelianLift_symmetrise`:\
        \ for a CM field, the character\n  `g ↦ χ g + χ (gᶜ)`; on the Artin symbol of an idele `a` it is `χ a +\
        \ χ (star a)`.\n* `New.QZChar.stepField`: the fixed field of the kernel of `New.QZChar.symmetrise χ`. Instances\
        \ show\n  that it is CM, that a CM type of `E` extends to it (`New.CMTypeOver`) and that it inherits\n \
        \ `New.HasPrimitiveRoot5040`.\n* `New.isStep_stepField`: it is a step of degree `p` over `E` if `New.HasPrimitiveRoot5040\
        \ E` holds,\n  `χ` is killed by a prime `p`, and `New.QZChar.symmetrise χ` is not zero and kills inertia\
        \ above\n  `p`.\n* `New.nonempty_weilData_of_not_dvd_differentIdeal`: if `L` also satisfies\n  `New.HasPrimitiveRoot5040`,\
        \ then `L` has Weil data; in the construction `j` stays, `υ` is composed\n  with the norm, and a new idele\
        \ absorbs the relative different, which is assumed prime to the\n  places fixed by conjugation.\n* `New.GaloisRep.exists_isStepOfLocalChar`,\
        \ `New.GaloisRep.exists_step_of_local_char`: given a split\n  place `w` below `A` and a nontrivial tame\
        \ character `χ` of `E_wˣ` killed by a prime `p`, a step\n  `E' / E` of degree `p`, again with Weil data,\
        \ cut out by the symmetrisation of a Galois character\n  `ν` that is trivial at `w` and has symmetrisation\
        \ `χ` there; the only place of `E'` above `w` is\n  split and lies under `A`.\n\nNotions from other files:\n\
        * `New.locIdele`: The homomorphism sending x ∈ K_v^× to the finite idele with component x at v and 1\n \
        \ elsewhere; `New.ideleAt v` takes the component at v.\n* `New.CMTypeOver`: a CM type of L that restricts\
        \ to the given CM type of E; the embedding chosen at\n  a place extends the one chosen at the place below.\n\
        * `New.WeilData`: Weil data on a stably unramified E. They consist of ȷ in E with ȷ = −ȷ̄, Im τȷ > 0\n \
        \ for every τ in the CM type and (1 − ȷ⁻¹)/2 integral; a finite idele α for which the completed\n  integers\
        \ Ô are self-dual under (z, u) ↦ ψ_f(ȷαᾱzu); and a splitting character υ equal to −1 at\n  uniformisers\
        \ of the places w with w = w̄.\n\n## Relation to the literature\n\nKnown result: Grunwald–Wang theorem in\
        \ prime exponent. It is proved over a totally complex field,\nand the character also agrees with the given\
        \ one on units at all primes of degree above one. It\nyields a CM extension of prime degree with prescribed\
        \ tame completion at a split place. Source:\nArtin–Tate, Class Field Theory (1968), ch. X; S. Wang, Grunwald–Wang\
        \ theorem, an effective version,\narXiv 1401.0389 (2014).\n\nSee also `Lib.Weil.MixedModel.ZeroTerm`.\n"
