    excerpt:
      path: grh/src/Lib/ClassField/LocalDuality/CrystallineDuality.lean
      line: 9
      endLine: 15
      text: 'The file studies classes of Galois lattices given by admissibility, allowed Hodge–Tate jumps and

        polynomials that kill inertia. It shows how a class changes under twisted duals, tensor products and

        jointly injective maps. It also defines pairings `Y × L → ℤ/p^m(1)` and the extensions of `O` by

        `(Y ⊗ L)^∨(1)` that they give. At `ℓ`, it proves local duality statements for potentially

        crystalline lattices: a perfect `ℤ_[ℓ]`-pairing of a lattice with its dual, the sizes of the

        crystalline cocycles modulo `ℓ ^ m` and a divisibility of indices. Here Z_f denotes the crystalline

        cocycles `New.Period.crysCocycles`.

        '
    remainder:
      path: grh/src/Lib/ClassField/LocalDuality/CrystallineDuality.lean
      line: 16
      endLine: 59
      text: "\n## Main definitions and results\n\n* `New.Lift.InClass`: the class of lattices given by admissibility,\
        \ allowed jumps and polynomials\n  that kill inertia.\n* `New.Lift.Pairing`: an `O(1)`-valued form on `Y\
        \ ⊗ L` whose coboundary is `p ^ m` times a\n  crystalline cocycle.\n* `New.Lift.cupOrthogonal`: the functions\
        \ `Γ → L` whose cup products with crystalline cocycles of\n  the lattices of a class are coboundaries.\n\
        * `New.Lift.dualDefect`: the length of the crystalline cocycles of `L` modulo those in\n  `New.Lift.cupOrthogonal`.\n\
        * `New.Period.IsPotentiallyCrystalline.index_mul_index_dual`: the sizes of Z_f(L) and Z_f(L') modulo\n \
        \ `ℓ ^ m`.\n* `New.Period.IsPotentiallyCrystalline.relIndex_dvd_of_orthogonal`: a divisibility of indices\
        \ from\n  local Tate duality, which bounds the cocycles of `L / ℓ ^ m` orthogonal to a subgroup of Z_f(L').\n\
        \nNotions from other files, for a representation `ρ` of `Γ` on an `O`-module `T`:\n* `New.Period.IsAdmissible\
        \ ρ F`: the elements of `Bmax ⊗ T` fixed by `F`-almost all `g` span\n  `Bmax ⊗ T` over `Bmax`; `New.Period.nearOne\
        \ Γ` is the pull-back to `Γ` of the neighbourhoods of\n  `1` in `G_p`.\n* `New.Period.IsPotentiallyCrystalline\
        \ ρ`: `ρ` is admissible along `New.Period.nearOne Γ`.\n* `New.Period.IsKilledBy ρ s m Q`: `ρ` is potentially\
        \ crystalline and `Q` evaluated at the linear\n  Frobenius `New.Period.linearFrob ρ s m` is zero.\n* `New.Period.IsWeilPair\
        \ s 0`: `s` lies in the inertia group of `G_p`.\n* `New.Period.jump ρ γ u`: the multiplicity of the Hodge–Tate\
        \ jump `u : ℤ` of `ρ` at the\n  `ℤ_[p]`-algebra map `γ : O → ℂ_[p]`. It is the dimension over Q̄_p (zero\
        \ if infinite) of the space\n  of `γ`-semilinear maps f : T → ℂ_p with f(gx) = χ(g)^(−u)·g f(x) for g near\
        \ 1.\n* `New.Period.HasJumps ρ γ J`: for every integer `u`, the multiplicity `jump ρ γ u` equals the\n \
        \ number of times `u` occurs in the multiset `J`.\n\n## Relation to the literature\n\nKnown result: Local\
        \ Tate duality in degree 1 as an upper bound for orthogonal cocycle groups. Only\nan inequality is proved.\
        \ The bound is proved by Kummer theory and dévissage when `Γ` acts by\nelements of `ℓ`-power order. For\
        \ a general finite module `M`,\n`New.DiscreteModule.local_duality_card_dvd` gives only a divisibility, by\
        \ descent from an open\nsubgroup `U` of index prime to `#M`. It takes as a hypothesis a largest orthogonal\
        \ pair of cocycle\ngroups over `U`, and this file supplies that pair for the reductions of crystalline cocycles\n\
        (`h_orth`, `h_max` in `card_pairingAnnihilator_mul_card_dvd`). Perfectness of the duality and the\nEuler\
        \ characteristic formula are outside the scope of this file, and no result in it uses them.\nSource: J.-P.\
        \ Serre, Galois Cohomology (1997), II §5.2 Thm 2 and §5.7; J. S. Milne, Arithmetic\nDuality Theorems (2nd\
        \ ed. 2006), I 2.3, 2.8.\n\nSee also `Lib.PadicHodge.Crystalline.Regularity` and `Lib.PadicHodge.ArtinSchreierSequence`.\n"
