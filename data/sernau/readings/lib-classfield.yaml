      endLine: 45
      text: "\n## Main definitions and results\n\n* `New.IsLargeLevel.SplitPlaces.card_trivialised_of_isHigmanProjective`:\
        \ for `V` killed by `l`,\n  fixed by `U` and projective over `G ⧸ U` in Higman's sense, given `z`, `n` with\
        \ `ρ(z) − n`\n  injective on `V` and with `z • r − n • r` fixed by `U` for every unit `r` fixed by all `s.φ\
        \ i`\n  with `l • r` a `U`-fixed `N`-unit, at most `#V ^ (#ι + 1)` trivialised cocycles, with equality\n\
        \  under further hypotheses.\n* `New.IsLargeLevel.SplitPlaces.hasFewCocycles_of_central`: let `K` be totally\
        \ complex and `r ≠ 0`.\n  Suppose some `z`, central modulo `U` and with `l`-adic cyclotomic character `1`,\
        \ satisfies\n  `V.FiniteKilledFixedInj (l ^ r) U z 1`. Suppose also that the Frobenii of the split places\
        \ detect\n  roots. Then `V` has at most `#V ^ (#ι + 1)` trivialised cocycles.\n\nNotions from other files:\n\
        * `New.DiscreteModule.IsHigmanProjective`: Higman's criterion relative to Q of finite index: some\n  additive\
        \ τ : A → A has ∑ gτg⁻¹ = 1, summed over chosen representatives g of G/Q.\n* `New.DiscreteModule.FiniteKilledFixedInj`:\
        \ The G-module A is finite and killed by n, Q acts\n  trivially on it, and ρ(z) − m is injective on it.\n\
        * `New.IsLargeLevel.fixedSUnits`: The N-units of the fixed field of U: the N-units of Ω that are\n  fixed\
        \ by U.\n\n## Relation to the literature\n\nAn upper bound of the kind the Greenberg–Wiles formula gives\
        \ when the dual Selmer group vanishes;\nthe hypothesis on the Frobenii `s.φ i` takes the place of that vanishing.\
        \ Only this bound is proved\n(with a case of equality for projective modules), under the hypothesis that\
        \ `ρ(z) − n` is injective\non `V`; for modules that are not projective, `n = 1` and `z` is central modulo\
        \ `U`. No local duality\nis used: the dual Selmer group is replaced by linear relations among the values\
        \ of a cocycle on tame\ninertia at the split places.\n\nSource: H. Darmon, F. Diamond, R. Taylor, Fermat's\
        \ Last Theorem (1995; revised 2007), Thm 2.18–2.19;\nA. Wiles, Ann. of Math. 141 (1995), Prop. 1.6; J. S.\
