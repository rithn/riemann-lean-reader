      endLine: 41
      text: "\n## Main definitions and results\n\n* `New.DiscreteModule.trivialisedCocycles`: pairs `(f, z)` of\
        \ a continuous `z : G → V` vanishing on\n  `I` and `f : X → V` with `g • f x = f (g • x) + z g`; so `z`\
        \ is the coboundary of `f x` on the\n  stabiliser of `x`.\n* `New.DiscreteModule.trivialisedCocycles.exists_mem_of_orbit_reps`,\n\
        \  `New.DiscreteModule.trivialisedCocycles.corestrict_mem`: such pairs are built from data at one\n  point\
        \ per orbit, and by corestriction.\n* `New.DiscreteModule.trivialisedCocycles.hasFewCocycles_of_isShortExact`:\
        \ the bound `(#V) ^ k` for\n  the number of such pairs (`New.DiscreteModule.HasFewCocycles`) passes from\
        \ the ends of a short\n  exact sequence to the middle term.\n* `New.IsLargeLevel.SplitPlaces.exists_powerResidueSymbols`\
        \ (as one conjunction,\n  `power_residue_reciprocity`): the `m`-th power residue symbols of the `N`-units\
        \ of the field of\n  `U` give linear relations among these values when `V` is trivial on `U`. If the field\
        \ of `U` is\n  totally complex, solutions of the relations give such cocycles.\n\nNotions from other files:\n\
