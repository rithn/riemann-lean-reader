    excerpt:
      path: grh/src/Lib/ClassField/GaloisCohomology/ContinuousCocycles.lean
      line: 6
      endLine: 11
      text: 'This file builds the part of continuous group cohomology used in this library, using explicit

        cochains. It works with a representation `ρ` of a topological group `G` on a discrete `R`-module

        `M`, and with discrete modules `New.DiscreteModule R Γ`. It also defines the cyclic class of a

        character into `ℚ/ℤ` and an invariant, and the basic objects of local class field theory, where `Γ`

        is a Galois group of `Ω` over `K`. It then treats restriction and short exact sequences of discrete

        modules, and counts continuous 1-cocycles along exact sequences.

        '
    remainder:
      path: grh/src/Lib/ClassField/GaloisCohomology/ContinuousCocycles.lean
      line: 12
      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.Z2`, `New.B2`, `New.H2`: continuous 2-cocycles, coboundaries\
        \ and their quotient.\n* `New.QZ`, `New.QZ.carry`, `New.QZChar`: the discrete group `ℚ/ℤ`, the carry of\
        \ two representatives\n  in `[0, 1)`, and continuous characters into `ℚ/ℤ`.\n* `New.cyclicClass`: the class\
        \ of `(g, h) ↦ carry (χ g) (χ h) • w`, additive in `χ` and in `w`.\n* `New.IsClassOfInvariant`, `New.Cohomology.classOfInvariant`:\
        \ the map from `ℚ/ℤ` to `H²(Γ, Ωˣ)`\n  normalised on unramified cyclic classes.\n* `New.IsLocalArtin`, `New.localArtin`,\
        \ `New.placeOver`: the local Artin map, defined by duality\n  with the cyclic classes `New.cyclicClass`,\
        \ its version on the completion of a number field at a\n  prime, and a chosen place over that prime.\n*\
        \ `New.DiscreteModule R Γ`: a discrete `R`-module with a continuous `R`-linear action of `Γ`.\n\nNotions\
        \ from other files:\n* `New.DiscreteUnits Ω`: the group `Ωˣ` written additively, with the discrete topology;\n\
        \  `New.unitsRep` is the action of `Γ` on it.\n* `New.IsFrob A q σ`: `σ` stabilises `A` and `σ • x ≡ x ^\
        \ q` modulo the maximal ideal of `A`;\n  `New.inertiaGroup Γ A` is the case `q = 1`.\n* `New.IsPlaceOver\
        \ A v`: the valuation subring `A` of `Ω` lies over the prime `v` of the number\n  field `K`: an integer\
        \ of `K` lies in the maximal ideal of `A` exactly when it lies in `v`.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.ClassField.GaloisCohomology.KummerCyclicClasses`, `Lib.ClassField.Local.ArtinMap`,\n`Lib.ClassField.Places.LocalFields`\
        \ and `Lib.ClassField.LocalDuality.CrystallineDuality` for\nsources.\n"
