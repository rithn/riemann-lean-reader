      text: 'Infinite Galois theory for an abstract group. `New.IsProGalois Γ K Ω` says that the profinite group

        `Γ` acts on the Galois extension `Ω / K` as its Galois group, with open stabilisers. This covers

        `Gal(Ω/K)` and its closed subgroups `H` (acting over the fixed field `New.fixedFieldOf H`) at once.

        `Fact (IsOpen U)` and `IsClosed H` are used as instances on subgroups.

        '
    remainder:
      path: grh/src/Lib/ClassField/Places/ProfiniteGalois.lean
      line: 10
      endLine: 28
      text: "\n* `New.continuous_of_equivariant_emb`: a map between such groups that is compatible with a ring\n\
        \  homomorphism of the top fields is continuous.\n* `New.exists_galois_restrict`, `New.isClosedEmbedding_galois_restrict`,\n\
        \  `New.isOpenEmbedding_galois_restrict`: restriction maps between Galois groups, along a map of the\n \
        \ top fields or to a smaller base field. The parts of the second one are\n  `New.isClosedEmbedding_of_smul_eq_smul`,\
        \ `New.range_eq_fixingSubgroup_of_smul_eq_smul` and\n  `New.index_range_eq_finrank_of_smul_eq_smul`.\n*\
        \ `New.fixedFieldOf_fixingSubgroup`, `New.fixingSubgroup_fixedFieldOf`, `New.finrank_fixedFieldOf`:\n  the\
        \ Galois correspondence between intermediate fields and closed subgroups, with degree equal to\n  index.\n\
        \nNotions from other files:\n* `New.DiscreteUnits.ofBase`: the homomorphism from K^× to the Γ-invariants\
        \ of Ω^× (both written\n  additively) induced by K → Ω.\n\n## Relation to the literature\n\nKnown; see `Lib.ClassField.Places.LocalFields`\
        \ for sources.\n"
