      endLine: 12
      startOffset: 123
      endOffset: 502
      text: "Local-global compatibility, including the places above `ℓ`, for the ℓ-adic avatar of an algebraic\n\
        Hecke character `θ` of a CM field `E` satisfying `New.HasPrimitiveRoot5040`.\n\n* `New.GaloisRep.avatarCompatAt_of_hasPrimitiveRoot5040`:\
        \ the statement\n  `New.GaloisRep.AvatarCompatAt w θ` at every finite place `w`.\n\nA base change reduces\
        \ to a split place `w`, one with `star w ≠ w`."
    remainder:
      path: grh/src/Lib/ClassField/Avatar/LocalGlobalCompatibility.lean
      line: 12
      endLine: 35
      startOffset: 502
      endOffset: 2080
      text: " There\n(`New.GaloisRep.avatarCompatAt_of_isSplit`) `θ = θ₁ (θ / θ₁)`, with `θ₁` the character of a\
        \ rank one\neigenform (`New.GaloisRep.sphericalCompat_of_odd`, `New.GaloisRep.Attached.exists_det_eq_avatar`)\n\
        and `θ / θ₁` of type `0` at the embeddings inducing `w`\n(`New.GaloisRep.avatarCompatAt_of_type_eq_zero`).\n\
        \nNotions from other files:\n* `New.AlgHeckeChar`: pairs of a character of the finite ideles and its infinity\
        \ type.\n* `New.AlgHeckeChar.avatar`: the ℓ-adic character of `Gal(Ω/E)` attached to such a pair.\n* `New.GaloisRep.AvatarCompatAt`:\
        \ at each place of `Ω` over `w` the avatar has finite type\n  (`IsFiniteTypeAt`), its jumps are minus the\
        \ type of `θ`, and inertia and geometric Frobenius\n  elements act through `θ` and local class field theory.\n\
        * `New.IsEigenform`, `New.HasHeckePolyAt`: `f ≠ 0` has Hecke polynomial `P u` at almost all places\n  `u`\
        \ of prime norm; `f` is spherical at a split place with the given Hecke polynomial.\n\n## Relation to the\
        \ literature\n\nKnown result: the existence of the ℓ-adic avatar of an algebraic Hecke character and its\
        \ local\nbehaviour. The avatar is constructed over totally complex fields (in an imported file). For the\
        \ CM\nfields used here, the behaviour at places above ℓ is read from the rank-one case of the Galois\nrepresentations\
        \ of `Lib.GaloisRep.Main.OddRank` rather than from Lubin–Tate theory. Source: J.-P.\nSerre, Abelian ℓ-adic\
        \ representations and elliptic curves, 1968, II–III (locally algebraic =\nHodge–Tate, Tate's theorem); B.\
        \ Conrad, Lifting global representations with local properties,\nApp. B (crystalline case).\n"
    standaloneReview:
      verdict: clear
      reason: States local-global compatibility for the avatar at finite places.
