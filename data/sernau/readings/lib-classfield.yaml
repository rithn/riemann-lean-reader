      startOffset: 225
      endOffset: 956
      text: 'This file studies the Galois cohomology of `Ωˣ` for a group Γ acting on a field Ω. The group `Ωˣ` is

        written additively (`New.DiscreteUnits`, with action `New.unitsRep`). In the last two sections Γ is

        the profinite Galois group of Ω/K (`New.IsProGalois`). Take a continuous character χ : Γ → ℚ/ℤ with

        kernel U and a Γ-invariant w in `Ωˣ`. The symbol (χ, w) = `New.cyclicClass ρ χ w` is the class in H²

        of (g, h) ↦ carry(χ(g), χ(h))·w. The file first treats cup products of 1-cocycles, annihilators of

        pairings, and a descent lemma for semilinear actions. Finally it shows that the classes vanishing on

        U are the symbols (χ, w), and that (χ, w) = 0 exactly when w is a norm from U, that is, a field norm

        from the field cut out by χ.'
    remainder:
      path: grh/src/Lib/ClassField/GaloisCohomology/KummerCyclicClasses.lean
      line: 15
      endLine: 58
      startOffset: 956
      endOffset: 3852
      text: "\n\n## Main definitions and results\n\n* `New.cupProduct`, `New.cupProduct_flip`: the cup product of\
        \ 1-cocycles, with values in `H²`, and\n  its anticommutativity; `New.DiscreteModule.evalCup` is the case\
        \ of the evaluation pairing.\n* `New.Period.mem_span_fixed`: for a semilinear action, a vector fixed by\
        \ a subgroup U of finite\n  index is a linear combination of invariant vectors, provided every element outside\
        \ U moves some\n  U-fixed scalar. The invariant vectors are traces over the finitely many cosets, and Dedekind's\n\
        \  independence of characters shows that their span contains the vector.\n* `New.hilbert90_unitsRep`: Hilbert\
        \ 90, every continuous 1-cocycle with values in `Ωˣ` is a\n  coboundary.\n* `New.exists_kummer_cocycle`:\
        \ if `Γ` fixes the `n`-th roots of unity (`ζ ^ k` is\n  `New.rootPowHom Ω n k` for a chosen primitive `n`-th\
        \ root of unity `ζ`), an invariant `x = a ^ n`\n  gives a homomorphism `f : Γ → ℤ/n` with `g a / a = ζ ^\
        \ f g`.\n* `New.mk_eq_neg_cyclicClass_ofZModCocycle`: the cup product of `g ↦ g a / a` with `ξ : Γ → ℤ/n`\
        \ is\n  minus the cyclic class of `ξ / n` and `a ^ n`.\n* `New.QZChar.cyclicClass_spec`: the classes in\
        \ `H²(Γ, Ωˣ)` that die on `U` are the symbols `(χ, w)`\n  of `New.cyclicClass` with `w` in `Kˣ` (embedded\
        \ in `Ωˣ` by `New.DiscreteUnits.ofBase`), and\n  `(χ, w) = 0` exactly when `w` is a norm from `U`. The two\
        \ hard directions are\n  `New.QZChar.exists_eq_cyclicClass_of_resH2_eq_zero` and\n  `New.QZChar.exists_corestrictH0_eq_of_cyclicClass_eq_zero`.\n\
        \nNotions from other files:\n* `New.DiscreteModule R Γ`: an `R`-module `V` with the discrete topology and\
        \ a continuous `R`-linear\n  action `ρ` of Γ; `New.Z1 ρ` and `New.Z2 ρ` are its continuous 1- and 2-cocycles.\n\
        * `New.unitsRep`: the ℤ-linear representation of Γ on Ω^× (written additively) coming from the\n  action\
        \ of Γ on the field Ω by ring automorphisms.\n* `New.DiscreteModule.H2`: The continuous cohomology H²(Γ,A)\
        \ of a discrete Γ-module A: 2-cocycles\n  modulo the functions (g,h) ↦ g c(h) − c(gh) + c(g) with c continuous.\n\
        * `New.QZ` is ℚ/ℤ. `New.QZ.carry`: for a, b in ℚ/ℤ, the integer part (0 or 1) of the sum of their\n  representatives\
        \ in [0,1); `New.cyclicClass ρ χ w` is the class of the cocycle (g,h) ↦ carry(χ(g),\n  χ(h))·w.\n* `New.IsProGalois`:\
        \ a profinite group acts on the Galois extension Ω/K as its Galois group, with\n  open stabilisers.\n\n\
        ## Relation to the literature\n\nKnown result: the parts of Galois cohomology in degrees ≤ 2 listed above,\
        \ namely cup products,\nHilbert 90, Kummer cocycles and the symbols of cyclic extensions. Only explicit\
        \ continuous cocycles\nare used. Shapiro's lemma and corestriction (summation of functions on a coset space)\
        \ come from\n`Lib.ClassField.GaloisCohomology.ShapiroCorestriction`. Source: J.-P. Serre, Galois Cohomology\n\
