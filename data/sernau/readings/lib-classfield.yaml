      line: 8
      endLine: 14
      text: 'Let `K` be a number field and let `Γ` act as the Galois group of `Ω/K`, where `Ω` (`New.Ω`) is the

        algebraic closure of `ℚ`. The first section treats complex conjugations in `Γ` and the symbols of

        totally positive elements of `K`. The second section proves the second inequality for a Galois

        extension `L / K`; the proof compares Dirichlet densities of primes of degree one. In the last

        section `L` is the field cut out by a character `χ` of `Γ`; it treats local norms and Artin symbols,

        proves Hasse''s norm theorem in prime degree when the real places of `K` stay real in `L` and deduces

        the Albert–Brauer–Hasse–Noether theorem.

        '
    remainder:
      path: grh/src/Lib/ClassField/Global/AlbertBrauerHasseNoether.lean
      line: 15
      endLine: 49
      text: "\n## Main definitions and results\n\n* `New.IsTotallyPositive.exists_resH2_cyclicClass_eq_zero`: the\
        \ symbol of a totally positive `x`\n  restricts to zero on an open subgroup containing every complex conjugation.\n\
        * `New.second_inequality`: for `L / K` Galois, an open subgroup `W` of the finite ideles that\n  contains\
        \ the totally positive principal ideles and the norms from `L` has index at most `[L : K]`.\n  Each of its\
        \ cosets contains the uniformiser idele `ϖ_v` for infinitely many `v` of prime norm\n  (`New.frequently_prime_uniformizer_div_mem_of_adeleNorm_mem`).\n\
        * `New.exists_hasPrimeDensity_addChar_uniformizer`: the values of a character `f` of the quotient by\n \
        \ `W` at the `ϖ_v` have mean `1 - m` if `f` is trivial and `-m` otherwise, for some `m : ℕ`.\n* `New.exists_localNorm_of_abelianLift_artinAt`:\
        \ an element of a completion with trivial local\n  symbol is a local norm.\n* `New.albert_brauer_hasse_noether`:\
        \ a class in H²(Γ, Ωˣ) is zero if it dies at every finite place\n  and over a finite extension in which\
        \ the real places stay real.\n\nNotions from other files:\n* `New.IsProGalois`: a profinite group acts on\
        \ the Galois extension Ω/K as its Galois group, with\n  open stabilisers.\n* `New.QZChar.abelianLift`: The\
        \ homomorphism induced by the continuous character χ on the\n  topological abelianisation of Γ, with values\
        \ in ℚ/ℤ written multiplicatively.\n* `New.artinAt`: The local Artin map K_v^× → Γ^ab: the Artin map to\
        \ the abelianised decomposition\n  group of the chosen place above v, followed by the map induced by inclusion.\n\
        \n## Relation to the literature\n\nKnown result: Global class field theory, comprising Albert–Brauer–Hasse–Noether,\
        \ reciprocity,\nexistence and norms. Only finite ideles are used, with real places handled by total positivity,\
        \ and\nexistence is proved only for totally complex fields. Reciprocity starts from cyclotomic characters\n\
        of prime conductor, with the auxiliary character chosen by B. H. Neumann's covering lemma. Source:\nJ. S.\
        \ Milne, Class Field Theory (v4.03, 2020), VI 4.9, VII 4–9, VIII 4; Tate, Global class field\ntheory, in\
        \ Cassels–Fröhlich 1967, ch. VII; H. Hasse, Die Struktur der R. Brauerschen\nAlgebrenklassengruppe, Math.\
        \ Ann. 107 (1933) (reciprocity from the sum formula).\n\nSee also `Lib.ClassField.Places.LocalFields` and\
        \ `Lib.ClassField.HeckeL.ContinuationAtOne`.\n"
