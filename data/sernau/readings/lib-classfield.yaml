      line: 8
      endLine: 14
      text: 'The finite ideles of a number field `K` are the units `(𝔸f K)ˣ` of the finite adeles. They embed in

        the units of the adeles `New.𝔸 K`, the pairs of a map `NumberField.InfinitePlace K → ℂ` and a finite

        adele, with component `1` at the infinite places. `New.FinPlace K` is the set of finite places, and

        `New.LocField v` is the completion at `v`. The file defines principal, local and S-unit ideles and

        proves their basic properties. It then relates the finite ideles to fractional ideals and the class

        group, and deduces that every open subgroup containing the totally positive elements of `Kˣ` has

        finite index.

        '
    remainder:
      path: grh/src/Lib/ClassField/Places/Ideles.lean
      line: 15
      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.principalIdele`, `New.locIdele`, `New.ideleAt`: the principal\
        \ idele of an element of `Kˣ`,\n  the idele with one given component and `1` elsewhere, and the component\
        \ at a place.\n* `New.idelesUnitOff`: the ideles that are units outside `S`; open (`New.isOpen_idelesUnitOff`),\
        \ and\n  compact for `S = ∅` (`New.isCompact_idelesUnitOff_empty`).\n* `New.exists_idele_divisor_hom`: the\
        \ divisor map, with kernel the ideles that are units everywhere.\n* `New.exists_idele_classGroup_hom`: a\
        \ map to the class group whose kernel is `Kˣ` times these\n  units.\n* `New.exists_sup_idelesUnitOff_eq_top`:\
        \ for a suitable finite `S`, every idele is a principal idele\n  times a unit outside `S`.\n* `New.finiteIndex_idele_subgroup_of_isOpen`:\
        \ an open subgroup that contains the totally positive\n  elements of `Kˣ` has finite index.\n\nNotions from\
        \ other files:\n* `New.Ô K`: the integral finite adeles, whose component at every place lies in its ring\
        \ of\n  integers; `New.uniformizer w` is a chosen uniformiser of the completion at `w`.\n* `S.unit K` (Mathlib):\
        \ the `S`-units, the `x` in `Kˣ` of valuation `1` at every finite place\n  outside `S`.\n\n## Relation to\
        \ the literature\n\nKnown; see `Lib.ClassField.Places.LocalFields` for sources.\n"
