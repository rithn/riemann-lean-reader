      line: 9
      endLine: 12
      text: 'Places of an extension `Ω` of a number field `K` are treated as valuation subrings of `Ω` lying over

        primes of `𝓞 K`. An embedding `σ` of a number field `E` into an ultrametric normed field over `ℚ_p`

        induces a prime of `E` above `p` and extends to the finite adeles of `E`. The formula

        `g * (e * f) = [L : K]` is restated in terms of finite places.

        '
    remainder:
      path: grh/src/Lib/ClassField/Places/ValuationSubrings.lean
      line: 13
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.IsPlaceOver.isEquiv`, `New.IsPlaceOver.unique`: `A` induces\
        \ the `v`-adic valuation up to\n  equivalence, and determines `v`.\n* `New.FinPlace.isPlaceOver_placeOver`,\
        \ `New.exists_isPlaceOver_of_val_ne_one`: every `v` has a\n  valuation subring of `New.Ω` over it; for `Ω/K`\
        \ algebraic, every `A` whose valuation is not `1` at\n  some nonzero element lies over some `v`.\n* `New.finite_ramified`:\
        \ almost all inertia groups lie in a given open subgroup of `Γ`.\n* `New.IsPlaceOver.exists_smul`: the Galois\
        \ group `Γ` is transitive on the `A` over `v`.\n* `New.placeOfEmb`: the prime induced by `σ`; it consists\
        \ of the integers with `‖σ x‖ < 1`\n  (`New.mem_placeOfEmb`) and contains `p` (`New.natCast_mem_placeOfEmb`).\n\
        * `New.exists_placeOfEmb_extension`, `New.placeOfEmbExtension`: `σ` extends continuously to the\n  completion\
        \ of `E` at that prime.\n* `New.adeleExtension`: the resulting ring homomorphism on finite adeles; it is\
        \ continuous, extends\n  `σ` and sends integral adeles to elements of norm at most one (`New.norm_adeleExtension_le_one`).\n\
        \nNotions from other files:\n* `New.FinPlace K`: a nonzero prime of `\U0001D4DE K`; `v.q` is its absolute\
        \ norm; a `New.ClosurePlace` is a\n  valuation subring of `New.Ω`, the algebraic closure of `ℚ`.\n* `A x`,\
        \ for a valuation subring `A` of `Ω`: the value `A.valuation x`; for `x : K`,\n  `valuationVia K A x` is\
        \ `A.valuation (algebraMap K Ω x)`.\n* `New.IsProGalois Γ K Ω`: `Γ` is a profinite Galois group of `Ω /\
        \ K` with open stabilisers.\n* `New.inertiaGroup Γ A`: the `σ` in `Γ` that stabilise `A` and act trivially\
        \ modulo its maximal\n  ideal.\n* `New.PadicField`: a normed field that is a normed algebra over `ℚ_p`,\
        \ not necessarily complete.\n\n## Relation to the literature\n\nKnown; see `Lib.ClassField.Places.LocalFields`\
        \ for sources.\n"
