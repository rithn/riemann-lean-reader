      line: 9
      endLine: 14
      text: 'An algebraic Hecke character of a number field `K` is a character of the finite ideles with open

        kernel that is `∏ τ, τ x ^ (-n τ)` on `Kˣ`, for integers `n τ` indexed by the complex embeddings of

        `K`. Over a CM field, a unitary Hecke character of suitable type becomes algebraic after a twist by

        a half-integral power of the absolute value. This is applied to the base change `y ↦ μ (y / ȳ)` of a

        character `μ` of `U(1)(𝔸)` with a weight, and to `υ |·| ^ (-1 / 2)`, with `υ` the splitting

        character of the Weil data.

        '
    remainder:
      path: grh/src/Lib/ClassField/HeckeCharacter/AlgebraicValues.lean
      line: 15
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.AlgHeckeChar.exists_pow_eq_prod`, `New.AlgHeckeChar.norm_map_eq_sqrt_finIdeleAbs_zpow`,\n\
        \  `New.AlgHeckeChar.norm_padic_eq_prod`, `New.AlgHeckeChar.conjugateBy`: powers, complex and\n  `p`-adic\
        \ absolute values and conjugates of the values of an algebraic Hecke character.\n* `New.IsHeckeOfType.toAlgebraic`:\
        \ the algebraic character `ψ |·|^{k/2}` of infinity type `m`, for\n  `ψ` of type `m (Φ w) - m (Φ̄ w)` with\
        \ `m (Φ w) + m (Φ̄ w) = k` at every infinite place `w`.\n* `New.AutChar.HasWeight.isHeckeOfType`: if `ν`\
        \ has weight `e`, its base change has type `2 • e`.\n* `New.AutChar.HasWeight.baseChangeAlgebraic`: this\
        \ base change as an algebraic Hecke character.\n* `New.AutChar.HasWeight.norm_map_eq_one`, `New.AutChar.HasWeight.norm_padic_eq_prod`:\
        \ at a point\n  `u` of `U(1)(\U0001D538)` with archimedean part `1`, the conjugates of the value `μ u` of\
        \ a character of\n  weight `e` have modulus `1`, and its absolute value under `ι : ℂ →+* ℂ_[p]` is\n  `∏\
        \ τ, ‖u_τ‖ ^ (-e τ)`, with `u_τ` the component of `u` at the prime induced by `ι ∘ Φ τ`.\n* `New.WeilData.chiFinAlgebraic`:\
        \ the character `υ |·|^{-1/2}` as an algebraic Hecke character.\n\nNotions from other files:\n* `New.IsHeckeOfType`:\
        \ The character ψ of the finite ideles is the finite part of a Hecke character\n  of type n: its kernel\
        \ is open and ψ(x) ∏_w (Φ_w(x)/|Φ_w(x)|)^{n_w} = 1 on K^×.\n* `New.AutChar.HasWeight`: μ has weight e and\
        \ tame part ψ: almost all residue characters ψ_w are\n  trivial, and μ(u) = ∏_v u_v^{e(v)} · ∏_w ψ_w(u mod\
