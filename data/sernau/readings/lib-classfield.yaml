      line: 6
      endLine: 10
      text: 'This file proves the lattice-sum estimate behind the continuation of Hecke `L`-functions to

        `s = 1`. Ideles are pairs of a unit of the Minkowski space `mixedSpace K` and a finite idele. The

        file defines the principal ideles, the module of an idele, an adelic tent and its theta sum over

        the principal ideles. It writes theta sums as Riemann sums over the image of `K`. It shows that

        `thetaSum d (r / 3) b` depends, up to an error, only on the module of `b`.

        '
    remainder:
      path: grh/src/Lib/ClassField/HeckeL/IdelicThetaSum.lean
      line: 11
      endLine: 30
      text: "\n## Main definitions and results\n\n* `New.ZetaIntegral.principalIdeles`: the image of `Kˣ` in the\
        \ idele group;\n  `New.ZetaIntegral.ideleModule` is the module of an idele.\n* `New.ZetaIntegral.adelicTent\
        \ r d`: a tent of height and radius `r` at `1` times the indicator of\n  `d * (x - 1) ∈ Ô`.\n* `New.ZetaIntegral.thetaSum\
        \ d r b`: the sum of the tent over the coset of `b` modulo the\n  principal ideles. `New.ZetaIntegral.exists_abs_sub_thetaSum_le_mul_rpow`:\
        \ `thetaSum d (r / 3) b`\n  depends only on the module `l` of `b`, up to an error: for each `l > 0` some\
        \ `i` has\n  `|i - thetaSum d (r / 3) b| ≤ C * l ^ δ * thetaSum d r b` for all `b` of module `l`.\n\nNotions\
        \ from other files:\n* `New.finIdeleAbs`: The module |x| of a finite idele x: the adelic absolute value\
        \ of the idele with\n  finite part x and component 1 at infinity.\n* `New.Ô`: The subring Ô of finite adeles\
        \ of K that are integral at every finite place.\n\n## Relation to the literature\n\nKnown; see `Lib.ClassField.HeckeL.ContinuationAtOne`\
        \ for sources.\n"
