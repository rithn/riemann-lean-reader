    excerpt:
      path: grh/src/Lib/ClassField/Places/TameInertia.lean
      line: 7
      endLine: 11
      text: 'This file studies how inertia and Frobenius elements act on roots of unity and on roots of a

        uniformiser over a henselian local field, and in particular over `ℚ_p`. Over `ℚ_ℓ`, with `G_ℓ`

        (`New.Gp ℓ`) its absolute Galois group, a Frobenius for `q` raises roots of unity of order prime to

        `ℓ` to the `q`-th power, and inertia fixes them. For Weil pairs, degrees add under products and are

        determined by the Galois element.

        '
    remainder:
      path: grh/src/Lib/ClassField/Places/TameInertia.lean
      line: 12
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.Cohomology.exists_inertia_smul_eq_of_orbit_subset`,\n \
        \ `New.IsLocalGalois.exists_inertia_smul_eq_of_pow_eq`: inertia is transitive on the roots of an\n  Eisenstein\
        \ polynomial, in particular on the `n`-th roots of `π`.\n* `New.IsLocalGalois.tame_inertia`: the tame theorem.\
        \ Characters of inertia of order prime to the\n  residue characteristic are governed by the action on an\
        \ `n`-th root `y` of a uniformiser `π`.\n  Its three parts are `New.IsLocalGalois.stabilizer_le_ker_of_pow_eq_one`,\n\
        \  `New.IsLocalGalois.exists_map_eq_pow_of_isPrimitiveRoot` and\n  `New.IsLocalGalois.map_conj_eq_pow_of_isFrob`.\n\
        * `New.Selmer.apply_eq_pow_of_isFrob`: a Frobenius for `q` (`New.IsFrob`) raises a root of unity of\n  order\
        \ prime to `ℓ` to the `q`-th power.\n* `New.Selmer.exists_inertia_cyclotomicGp_eq`: every natural number\
        \ prime to `p` is a value of the\n  `p`-adic cyclotomic character on inertia. Inertia permutes the primitive\
        \ `p ^ (k + 1)`-th roots of\n  unity transitively, and `New.Selmer.exists_cyclotomicGp_eq_of_isClosed` passes\
        \ to the limit by\n  compactness.\n* `New.Period.IsWeilPair.eq_pow_of_isFrob`: for a homomorphism `j` from\
        \ a group `Γ` to the absolute\n  Galois group of `ℚ_p` and a Weil pair `(j s, m)`, the element `j s` determines\
        \ `p ^ m`.\n\nNotions from other files:\n* `New.IsLocalGalois`: Γ = Gal(Ω/k), with Ω algebraically closed\
        \ of characteristic 0, stabilises A,\n  and A ∩ k is a discrete valuation ring with finite residue field.\
        \ So k is a henselian local field.\n* `New.IsUniformiser`: `π` is a uniformiser of `K` for `A`: an element\
        \ of `K` lies in the maximal\n  ideal of `A` exactly when its valuation is at most that of `π`.\n* `New.IsFrob`:\
        \ `σ` stabilises the valuation subring `A` and `σ • x ≡ x ^ q` modulo the maximal\n  ideal for all `x ∈\
        \ A`.\n\n## Relation to the literature\n\nKnown; see `Lib.ClassField.Places.LocalFields` for sources.\n"
