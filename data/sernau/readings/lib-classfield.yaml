      text: "`New.cyclotomicCharMod Ω N : Γ →* (ZMod N)ˣ` and `New.cyclotomicChar Ω l : Γ →* ℤ_[l]ˣ` give the\n\
        action on the `N`-th roots of unity and on the roots of unity of `l`-power order, and\n`New.IsFrob A q σ`\
        \ says that `σ` preserves `A` and acts as `x ^ q` modulo its maximal ideal.\n\n## Main definitions and results\n\
        \n* `New.cyclotomicCharMod_eq_iff`: the value at `g` is `a` iff `g • ζ = ζ ^ a` whenever `ζ ^ N = 1`.\n\
        * `New.IsFrob.cyclotomicCharMod_eq`, `New.IsFrob.cyclotomicChar_eq`: the value at a Frobenius for\n  `q`\
        \ is `q`, away from `N` or `l`; the case `q = 1` is inertia. The reason is\n  `New.eq_of_val_sub_lt_one`:\
        \ distinct `N`-th roots of unity stay distinct modulo the maximal ideal.\n* `New.cyclotomicCharMod_surjective`:\
        \ for the Galois group of `New.Ω` over `ℚ`, the character modulo\n  `N` is onto.\n\nNotions from other files:\n\
