      path: grh/src/Lib/ClassField/Local/ArtinMap.lean
      line: 8
      endLine: 15
      text: 'The file defines the local Artin map `New.artinAt` with values in `Γ^ab`, the global Artin map

        `New.artinMap` of a number field `K`, and algebraic Hecke characters. In the parts on number fields,

        `Γ` is the Galois group (`IsProGalois Γ K Ω`) of an algebraically closed field `Ω` over `K`; `Ω` has

        no binder here (it is fixed elsewhere), and `New.ClosurePlace` is the type of valuation subrings of

        `Ω`. For a local field, the file shows that the local Artin map sends uniformisers to inverse

        Frobenii. At a place of a number field, it proves the main properties of the local Artin map

        `New.localArtin`: the defining formula, compatibility with norms, its image, its relation to

        `New.artinAt`, and tame inertia.

        '
    remainder:
      path: grh/src/Lib/ClassField/Local/ArtinMap.lean
      line: 16
      endLine: 56
      text: "\n## Main definitions and results\n\n* `New.artinAt`: the local Artin map at `v`, with values in the\
        \ topological abelianisation of `Γ`.\n* `New.artinMap`: the global Artin map from the finite ideles of `K`\
        \ to the abelianised Galois\n  group. It is chosen (`Classical.epsilon`) so that each character of `Γ` takes\
        \ on it the product of\n  its values on the local Artin maps. This file does not prove that such a map exists;\n\
        \  `New.abelianLift_artinMap_eq_finprod_of_exists` gives the product formula when one does.\n* `New.algHeckeChars`,\
        \ `New.AlgHeckeChar`: algebraic Hecke characters, as characters of the finite\n  ideles (`New.AlgHeckeChar.character`)\
        \ together with their infinity type\n  (`New.AlgHeckeChar.infinityType`).\n* `New.IsPlaceOver.isLocalArtin_localArtin`:\
        \ the formula holds; the local theory in `ℚ̄_p` then\n  applies.\n* `New.IsTameGenerator`, `New.IsPlaceOver.exists_eq_pow_and_apply_conj_eq_pow`:\
        \ tame generators of\n  inertia, and the values on inertia of a homomorphism of exponent prime to `w`.\n\
        * `New.IsPlaceOver.tameGenerator`, `New.IsPlaceOver.tame_inertia`,\n  `New.IsPlaceOver.exists_isTameUnit`:\
        \ a chosen tame generator, and a unit of `K_w`\n  whose symbol it is and whose residue generates the units\
        \ of the residue field.\n\nNotions from other files:\n* `New.localArtin Γ A w`: a chosen homomorphism from\
        \ `K_w^×` to the topological abelianisation of\n  the decomposition group of `A`, pinned down on `K^×` by\
        \ `New.IsLocalArtin`.\n* `New.IsCompletionEmb w p Γ A j`: embeddings of `K_w` and of `Ω` (by `j`) in `ℚ̄_p`\
        \ that induce `A`\n  and make the decomposition group of `A` the Galois group of `ℚ̄_p` over `K_w`.\n* `New.IsLocalArtin`:\
        \ The homomorphism `f : Lˣ → Γ^ab` satisfies `New.Cohomology.classOfInvariant (χ\n  (f x)) = −(δχ ∪ x)`\
        \ for all continuous characters `χ` and all `x` in `Lˣ`.\n* `New.IsFrob`: `σ` stabilises the valuation subring\
        \ `A` and `σ • x ≡ x ^ q` modulo the maximal\n  ideal for all `x ∈ A`.\n* `New.IsPlaceOver`: The valuation\
        \ subring `A` of `Ω` lies over the prime `w` of `K`: an integer of\n  `K` is in the maximal ideal of `A`\
        \ exactly when it lies in `w`.\n* `New.QZChar.abelianLift`: The homomorphism induced by the continuous character\
        \ χ on the\n  topological abelianisation of Γ, with values in ℚ/ℤ written multiplicatively.\n\n## Relation\
        \ to the literature\n\nKnown result: Local class field theory, with Brauer invariant, Artin map, norms and\
        \ tame symbol. It\nis proved for henselian fields such as fixed fields of decomposition groups, with the\
        \ norm index in\nprime degree coming from Tate's lemma on the Herbrand quotient. Source: J.-P. Serre, Local\
        \ Fields\n(1979), XII–XIV; J. S. Milne, Class Field Theory (v4.03), I and III 2.\n\nSee also `Lib.ClassField.Avatar.LocalGlobalCompatibility`\
        \ and `Lib.ClassField.Places.LocalFields`.\n"
