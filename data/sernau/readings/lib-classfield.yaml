      endLine: 29
      text: "\n* `New.IsProGalois`, `New.IsLocalGalois`: `Γ` is the profinite Galois group of `Ω / K`; in the local\n\
        \  case `Ω` is moreover algebraically closed of characteristic `0`, `Γ` stabilises `A`, and `A ∩ K`\n  (`New.valRingBelow`)\
        \ is a discrete valuation ring with finite residue field.\n* `New.decompGroup`, `New.inertiaGroup`, `New.IsFrob`,\
        \ `New.IsPlaceOver`: decomposition group,\n  inertia group, Frobenius elements, and places over a nonzero\
        \ prime of the ring of integers\n  `\U0001D4DE K` of a field `K`.\n* `New.IsComplexConj`, `New.cyclotomicChar`,\
        \ `New.cyclotomicCharIn`: complex conjugations and the\n  `l`-adic cyclotomic character.\n\nNotions from\
        \ Mathlib used in the statements:\n* `A : ValuationSubring Ω`: a subring that contains `x` or `x⁻¹` for\
        \ every nonzero `x`, with its\n  valuation `A.valuation`; `A.valuation x ≤ 1` means `x ∈ A`, and `< 1` means\
