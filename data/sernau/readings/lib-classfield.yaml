    excerpt:
      path: grh/src/Lib/ClassField/Avatar/HeckeBaseChange.lean
      line: 9
      endLine: 12
      text: 'Let `E` be a CM field with CM type `Φ`. A character `ν` of `U(1)(𝔸)` trivial on rational points

        gives by base change the Hecke character `x ↦ ν(x / x̄)` of `E`. For `e ≠ 0` and `S` finite, its

        `L`-function without the factors at `S ∪ S̄` does not vanish at real `s ≥ 1`. Algebraic Hecke

        characters are also base changed along the norm.

        '
    remainder:
      path: grh/src/Lib/ClassField/Avatar/HeckeBaseChange.lean
      line: 13
      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.AutChar.L`: the Euler product of the base change, without\
        \ the factors at `S ∪ S̄`.\n* `New.AutChar.HasWeight.L_ne_zero`: for `e ≠ 0` and `S` finite, this `L`-function\
        \ does not vanish\n  at real `s ≥ 1`.\n* `New.AutChar.HasWeight.toAlgebraic`: the algebraic Hecke character\n\
        \  `ν(x / x̄) υ(x)^{-k} |x|^{j - k/2}`, with `υ` the splitting character of `New.SplittingChar`.\n* `New.Variety.exists_twist_algHeckeChar`:\
        \ twisting ρ by ω, controlled at the places w where ω is\n  unramified and its type is one natural number\
        \ d. The twist is by χ^d·μ, with χ the cyclotomic\n  character and μ the ℓ-adic avatar of ω|·|^(−d), whose\
        \ type vanishes over w.\n\nNotions from other files:\n* `New.AutChar`: The group of continuous circle-valued\
        \ characters of U(1)(\U0001D538), the norm-one adeles of\n  the CM field E, trivial on elements coming from\
        \ E.\n* `New.HeckeChar`: The group of unitary Hecke characters of E: continuous circle-valued characters\n\
        \  of the idele group trivial on principal ideles.\n* `New.IsHeckeOfType`: The character ψ of the finite\
        \ ideles is the finite part of a Hecke character\n  of type n: its kernel is open and ψ(x) ∏_w (Φ_w(x)/|Φ_w(x)|)^{n_w}\
        \ = 1 on K^×.\n* `New.IsHeckeOfType.toAlgebraic`: the algebraic character `ψ |·|^{k/2}` of infinity type\
        \ `m`, for\n  `ψ` of type `m (Φ w) - m (Φ̄ w)` with `m (Φ w) + m (Φ̄ w) = k` at every infinite place `w`.\n\
        * `New.AutChar.HasWeight`: μ has weight e and tame part ψ: almost all residue characters ψ_w are\n  trivial,\
        \ and μ(u) = ∏_v u_v^{e(v)} · ∏_w ψ_w(u mod w) whenever u has integral finite part.\n* `New.heckeCoeff`\
        \ φ S: the value of φ at the chosen uniformiser at v for v outside S, and 0 for v\n  in S; `New.eulerProd`\
        \ a is the Euler product ∏_v (1 - a_v q_v^(-s))⁻¹.\n\n## Relation to the literature\n\nKnown; see `Lib.ClassField.HeckeL.ContinuationAtOne`,\n\
        `Lib.ClassField.Avatar.LocalGlobalCompatibility` and `Lib.ClassField.Global.CMSplittingCharacters`\nfor\
        \ sources.\n"
