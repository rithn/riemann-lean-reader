        \ action `ρ` of `G`; `New.DiscreteModule.restrictTo` restricts the action to a subgroup.\n* `New.Z1`: the\
        \ `R`-module of continuous 1-cocycles of `ρ`, that is, of continuous maps\n  `f : G → M` with `f (g * h)\
        \ = f g + ρ g (f h)`.\n* `New.IsLargeLevel.SplitPlaces`: Split places for `U`. The subgroup `U` fixes the\
