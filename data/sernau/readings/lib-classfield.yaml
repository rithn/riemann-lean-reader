      endLine: 13
      text: 'This file proves that partial Hecke `L`-functions `New.eulerProd (heckeCoeff ψ S)` of nontrivial

        characters extend analytically to `s = 1`. Here `ψ` satisfies `New.IsHeckeOfType ψ n`, `S` is a

        finite set of primes, and only real `s ≥ 1` is treated. The file combines the theta-sum estimate

        of `Lib.ClassField.HeckeL.IdelicThetaSum` with the finite-place half of Tate''s thesis. This yields

        three results: analyticity at `1`, a prime density statement and, for `ψ ^ 2 ≠ 1`, nonvanishing

        on `[1, ∞)`. Valuations are multiplicative: `v x ≤ 1` means integral.

        '
    remainder:
      path: grh/src/Lib/ClassField/HeckeL/ContinuationAtOne.lean
      line: 14
      endLine: 51
      text: "\n## Main definitions and results\n\n* `New.IsHeckeOfType.integral_mul_finIdeleAbs_rpow_eq_eulerProd_mul`:\
        \ the integral of `f ψ |·| ^ s`\n  over the finite ideles is the partial `L`-function of `ψ` times a volume;\n\
        \  `New.IsHeckeOfType.tate_integral` adds that this volume is nonzero.\n* `New.IsHeckeOfType.exists_analyticAt_one_eulerProd`:\
        \ for `ψ ≠ 1` the partial `L`-function extends\n  analytically to a neighbourhood of `1`.\n* `New.IsHeckeOfType.exists_hasPrimeDensity`:\
        \ for `ψ ≠ 1` the partial `L`-function is continuous on\n  `[1, ∞)`, and the values of `ψ` have mean `-m`\
        \ over the primes of degree one, for some natural\n  number `m`.\n* `New.IsHeckeOfType.eulerProd_ne_zero`:\
        \ for `ψ ^ 2 ≠ 1` the partial `L`-function has no zero on\n  `[1, ∞)`.\n\nNotions from other files:\n* `New.finIdeleAbs`:\
        \ The module |x| of a finite idele x: the adelic absolute value of the idele with\n  finite part x and component\
        \ 1 at infinity. `New.ZetaIntegral.ideleModule`: the module of an idele.\n* `New.Ô`: The subring Ô of finite\
        \ adeles of K that are integral at every finite place.\n  `New.ZetaIntegral.adelicTent r d`: a tent of radius\
        \ `r` at `1` times the indicator of\n  `d * (x - 1) ∈ Ô`.\n* `New.eulerProd`: The Euler product `∏ (1 -\
        \ a v * q ^ (-s))⁻¹` over the primes `v` of `K`, with\n  `q = v.q` the norm of `v`, as a function of real\
        \ `s > 1`; at `s = 1` it is the limit from the\n  right, if that exists.\n* `New.IsHeckeOfType ψ n`: the\
        \ character `ψ` of the finite ideles is the finite part of a Hecke\n  character of type `n`: its kernel\
        \ is open and `ψ x * ∏_w (Φ_w x / |Φ_w x|) ^ (n w) = 1` on `Kˣ`.\n* `New.heckeCoeff ψ S`: the function on\
        \ finite places sending `v ∉ S` to the value of `ψ` at the\n  local idele of the chosen uniformiser at `v`,\
        \ and `v ∈ S` to `0`.\n\n## Relation to the literature\n\nKnown result: Hecke L-functions with Euler product,\
        \ continuation to s = 1, non-vanishing and prime\ndensities. Only real s is treated, and a non-trivial character\
        \ of integral angular type is continued\nto a neighbourhood of 1 from Tate's integral by a Riemann sum instead\
        \ of Poisson summation.\nNon-vanishing is proved only when the square of the character is non-trivial, and\
        \ densities are\ntaken over primes of degree one, with bounded error. Source: J. Tate, Fourier analysis\
        \ in number\nfields and Hecke's zeta-functions, 1950, in Cassels–Fröhlich ch. XV, §4.4–4.5; J. Milne, Class\
        \ Field\nTheory, VI 4.8–4.9 (finite order); S. Lang, Algebraic Number Theory (non-vanishing); Titchmarsh,\n\
        Theory of the Riemann zeta-function, §2.11 (the Riemann-sum continuation is Müntz's formula over ℚ).\n"
