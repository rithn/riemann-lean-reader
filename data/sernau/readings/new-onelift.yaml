      text: "\n\n## Main definitions and results\n\n* `New.Rows.IsPointLift`, `New.Rows.exists_isPointLift`, `New.Rows.pointLift`:\
        \ an element `A` of the\n  integral level with prescribed columns at `O.ChosenIndex` and rows at `O.TwistIndex`.\n\
        * `New.Rows.pointForm`: the point form at `h A`; `New.Rows.inner_pointForm` and\n  `New.Rows.normalizedDescent_pointForm`\
        \ compute its inner products and its descent\n  `New.DescentPair.normalizedDescent`, whose finite datum\
        \ is `New.Rows.pointFormDatum`.\n* `New.LevelPlaces.LevelForm.innerAt_heckePolyOnForms` computes the adjoint\
        \ of `H_w(X)` for the\n  pairing `innerAt σ`.\n* `New.DescentPair.falseLiftsAt`, `New.DescentPair.IsOrthogonalToFalseLifts`,\n\
        \  `New.DescentPair.IsTestForm`: false lifts, the forms orthogonal to them, and the integral ones\n  among\
        \ these for a fixed `e₀` and `Z = ker O.normalizedDescent`.\n* `New.Selmer.DenominatorLe`: a bound on the\
        \ ℓ-adic denominator of the projection to a subspace Z.\n* `New.DescentPair.normSqAt_starProjection_le`:\
        \ on forms orthogonal to the false lifts the\n  projection to Z does not increase the norm at σ.\n\nNotions\
        \ from other files:\n* `New.DescentPair`: A descent pair: places M and Q, a space W of rank r with numbered\
        \ basis\n  vectors, an embedding of the index set r into the larger index set n, weights k⁺ and k⁻, and\
        \ a\n  character μ whose tame part is trivial off these places.\n* `New.DescentPair.FormV`: the algebraic\
        \ forms on V = I_n with the weight, level and character of\n  the pair; the level sits at two finite sets\
        \ of split places, M and Q.\n* `New.DescentPair.heckePolyOnForms`: the operator H_w(X) = ∑_i (−X)^i q^{i(i−1)/2}\
        \ T_{w,i} on\n  forms, for a split place w that, with its conjugate, is off M and Q;\n  `New.DescentPair.liftHeckeRoot`\
        \ w is the value X_* at which it is taken.\n* `New.DescentPair.normalizedDescent`: the descent, a linear\
        \ map from forms Ξ on V to functions on\n  U(W)(\U0001D538): its value at g is the class sum over h, for\
        \ `New.DescentPair.levelGroup`, of\n  `New.DescentPair.conjKernel` at g and h applied to Ξ(h). It is adjoint\
        \ to the lift from W\n  (`New.DescentPair.inner_thetaLift`).\n* `New.LevelPlaces.placeAt`: the chosen places\
        \ and the places of Q as one family, indexed by\n  `O.ChosenIndex ⊕ O.TwistIndex`.\n\n## Relation to the\
