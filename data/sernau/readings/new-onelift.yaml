      endOffset: 834
      text: 'Let `O` be a descent pair with spaces `W` and `V`, and let `y` be a form on `V` whose descents to

        `W` by the data `v_P ⊗ Ψ_bl ⊗ vac` vanish, where `v_P` is the Fock vector of a polynomial `P` and

        `Ψ_bl` is the block datum. Suppose that the characters `χ_w` at the places of `Q` are not trivial

        and that the hyperplane sums at the chosen places annihilate `y`. This file proves that the descents

        vanish for all data that are the vacuum at the finite places other than the chosen places, the

        places of `Q` and their conjugates (`DescentPair.descentsVanish_of_hyperplaneSumsAnnihilate`). By

        the descents of `y` we mean those of the matrix coefficient of `y` for a fixed linear form `u`.'
    remainder:
      path: grh/src/New/OneLift/FalseLifts/BottomOfTower.lean
      line: 13
      endLine: 48
      startOffset: 834
      endOffset: 3432
      text: "\n\nIt suffices to treat the indicator of a small class around each point `x`. If `x` has an integral\n\
        block ratio (`HasIntegralBlockRatio`) at every place of `O`, the mean of the translates of this\nindicator\
        \ under the level group is a multiple of a translate of `Ψ_bl` under `U(W)`. Otherwise an\nannihilating\
        \ row at a place where `x` has no integral block ratio gives integral elements `h_v`\n(`rowShear`) that\
        \ fix the components of `x` at the places of `O` and whose sum annihilates `y`.\nClasses are taken modulo\
        \ `i!` (`factorialIdele`) for large `i`, and the mean is taken over the\nfinitely many translates under\
        \ the whole level group.\n\nThe pair `O` carries two families of split finite places, the chosen places\
        \ and the places of `Q`,\nindexed by `O.ChosenIndex` and `O.TwistIndex`. The family `O.placeAt` lists all\
        \ these places, and\n`O.places` is their set. The pair also carries the space `W = O.W` of rank `r`, an\
        \ embedding\n`O.incl : r ↪ n` and the residue characters `χ_w = O.tamePart w`. The space `V` is `stdSpace\
        \ E n`,\nand `O.FormV` are the forms on `V` of the level of `O`. The level group `O.levelGroup` consists\
        \ of\nthe elements of the maximal level whose reductions fix `(1, 0)ᵀ` at the chosen places and are block\n\
        lower triangular at the places of `Q`. For an `n × r` matrix `x` we write `x'` for the square block\nof\
        \ the rows `O.incl` and `x''` for the block of the other rows.\n\nThe field `E` is CM and carries Weil data\
        \ (`WeilData E`): a purely imaginary element, a finite idele\nand a splitting character, from which the\
        \ Weil representation is defined.\n\nNotions from other files:\n* `New.Space.lift` for the swapped kernel\
        \ goes from `U(V)` to `U(W)`; the descent of `y` is the\n  conjugate of this lift of the conjugate of `y`.\n\
        * `New.Space.schrodingerOp`: for a set `S` of split places, `schrodingerOp V S Ψ f` is the vector of\n \
        \ the Weil representation with the function `Ψ` of finite adelic vectors above `S` and `f`\n  elsewhere;\
        \ `New.Space.integrated` sets the component at infinity, and `New.Space.vacElem` is the\n  vacuum.\n* `New.cosetIndicator`:\
        \ `cosetIndicator S t z` is the indicator function of the `x` such that\n  `t⁻¹ (x - z)` is integral at\
        \ every place of `S`.\n* `New.DescentPair.blockDatum` is the vector `Ψ_bl ⊗ vac`. The function `Ψ_bl` of\
        \ a finite adelic\n  `n × r` matrix `x` is `∏_{w ∈ Q} χ_w(det x' mod w)` if `x` is integral at all places\
        \ of `O` and\n  `≡ (1, 0)ᵀ` (`New.inclMatrix`) at the chosen places, and `0` otherwise.\n* `New.DescentPair.formAction`\
        \ is the action `s̄ y` on forms of the product of the groups `GL r`\n  over the residue fields of the chosen\
        \ places.\n"
