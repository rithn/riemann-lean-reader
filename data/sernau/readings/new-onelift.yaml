        \  1), without the Euler factors at the level.\n\nThe data `D` over the parameters `P` supply the CM field\
        \ `D.E`, with `f` infinite places and\n`D.towerExp` its index in the tower over `K = ℚ(i√d)`, the natural\
        \ numbers `m`, `k`, `r`, `t`, `M`\nand `a`, and the reals `b`, `x`, `x₁` of the bounds. Here `M ^ f` is\
        \ the norm of the product of the\nchosen places, `x` the length of the prime sum, `denominatorBudget = f\
        \ a log³ b / (m k)` and\n`directionAmount` the sum over the infinite places `σ` of `jetSize (κ σ) - primeSum\
        \ (κ σ) σ`, where\n`κ = D.weight`, `jetSize` is the size of a derivative and `primeSum` measures its guaranteed\n\
        divisibility.\n\n`P.vacuumScale D.towerExp` scales the vacuum of rank one to integral values, `P.jetScale\
        \ D.towerExp`\nscales Taylor series of theta functions, `modKernel` is the theta kernel given by a function\
        \ on\nmatrices modulo an ideal and a polynomial, and `p.rowLengthSum` is `∑ τ, (p.negWeight τ - p.z)`.\n\
        \n## Relation to the literature\n\nNorms of lifts of Hecke characters as L-values, their divisibility via\
        \ congruences, and divisibility\nat inert primes are known from the literature. Related work: Prasanna,\
        \ Integrality of a ratio of\nPetersson norms, 2006; Coates–Liang–Sujatha, Tate–Shafarevich group for elliptic\
        \ curves with CM II,\n2010 (after Katz, 1977); Y.-S. Lee, Hida family of theta lift from U(1) to definite\
        \ U(2), 2024.\n"
