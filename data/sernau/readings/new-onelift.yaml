      endLine: 67
      startOffset: 959
      endOffset: 4538
      text: "\n\nLetters: the twist is ϑ, υ = `upsilonU1` is the splitting character on U(1), and I_m = E^m is the\n\
        standard definite space of rank m.\n\n## Main definitions and results\n\n* `New.Data.exchangePair`: three\
        \ pairs for each `1 ≤ j ≤ m`, indexed by `none` and the two signs.\n* `New.Data.heckeValueProd`: the product\
        \ `Γ_j` of the values `Exchange.lValueProd` at the inverses\n  of the characters of these pairs, twisted\
        \ by a tame character or its inverse. It is not divided by\n  its value at the trivial twist.\n* `New.Rows.exists_mul_stdClassSum_eq_carrierForm`,\
        \ from the first two exchanges: for even `m` and a\n  character c of weight 0 that is tame for (\U0001D52A\
        , χ), the carrier is a constant γ of known size times a\n  class sum of `New.Rows.carrierCoeff` times a\
        \ theta kernel twisted by χ∘det.\n* `New.Rows.carrierForm_mem_rapidOfLevel_and_isAdelicHol`: for even `m`,\
        \ if there is a tame\n  character of weight 0, the carrier lies in `New.Rows.rapidOfLevel` for every level.\
        \ So it has full\n  level and is rapidly decreasing. It is also holomorphic.\n* `New.Data.exists_mul_thirdExchangeLeftSide_eq_choiceFn`,\n\
        \  `New.Data.thirdExchangeLeftSide_eq_kernelClassSum`: a number times a double class sum of kernels\n  is\
        \ \U0001D5A5_i, and this double sum is a theta series on U(W_j).\n\nNotions from other files:\n* `New.Data.chiM`,\
        \ `New.Data.chiMLocal`: a fixed character χ of U(1)(\U0001D538) of weight 0 and its tame\n  part ω, which\
        \ is trivial off the chosen places and has order greater than 8m at each of them.\n* `New.Data.goodForms`:\
        \ The good forms on V: the image of the idempotent e₀ of ℂ[\U0001D5A6] acting on forms\n  of principal level\
        \ at the chosen places above p₀ and p₁.\n* `New.Data.signsW`: Signs ±1 on the indices i in `New.Data.RowIndex`\
        \ for W_j: −1 when\n  `New.Data.basisNumber`(i) ≥ `New.Data.posRank` j, and +1 otherwise.\n* `New.Rows.IsAdelicHol`:\
        \ For every adelic g, the function h ↦ F(g·(h,1)) on the archimedean group\n  is holomorphic of the given\
        \ weight for the given order (`New.IsHolOfWeight`).\n* `New.Data.kernelWeight`: The weight `New.staircaseWeight`\
        \ on W_j for the pair (W_j, V°).\n\n## Relation to the literature\n\nThe twisted theta kernel of an indefinite\
        \ and a definite unitary group of equal rank, summed against\nan explicit form, is a non-zero multiple of\
        \ one fixed non-zero holomorphic, rapidly decreasing form\nof level one, for even m. The factor has modulus\
        \ given by Hecke L-values, so the twist survives only\nas a number. Non-vanishing and holomorphy of the\
        \ stable-range theta lift of a character are known in\nthe literature. Related work: J.-S. Li, Non-vanishing\
        \ theorems for the cohomology of certain\narithmetic quotients, 1992; Gan–Qiu–Takeda, The regularized Siegel–Weil\
        \ formula, 2014; T. Yang,\nTheta liftings and Hecke L-functions, 1997.\n\nThe theta kernel of two definite\
        \ unitary groups of the same even rank 2e with determinant data,\nsummed over the classes of one group,\
        \ is a non-zero constant whose modulus, up to a fixed factor and\nconductor norms, is a product of Hecke\
        \ L-values at 1,…,e. This is the first step in turning the\ntwist into a number. It is Rallis's formula\
        \ at equal rank 2e for a character, whose central value\nfolds by the functional equation into Hecke L-values\
        \ at 1,…,e and a conductor power, with the\nramified local data computed explicitly. Related work: Yamana,\
        \ L-functions and theta correspondence\nfor classical groups, 2014; C. Li, Geometric and arithmetic theta\
        \ correspondences (§2.4–2.5), 2024;\nYang, Theta liftings and Hecke L-functions, 1997.\n\nSee `New.OneLift.ComparisonOperator.FirstFactors`\
        \ and `New.OneLift.ComparisonOperator.ProductsSpan`\nfor related work.\n"
