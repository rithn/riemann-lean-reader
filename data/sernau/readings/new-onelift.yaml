      text: " Here `N` indexes `V″`, `m` indexes `V°`,\n`z : r ↪ m` marks `r` basis vectors of `V°`, and `a` indexes\
        \ the rows of a matrix `s` modulo `ϖ²`,\nthe linear forms on `V″` on which a finer congruence is imposed.\
        \ The idele `ϖ = O.genIdele`\ngenerates the product of the chosen places `O.chosenPlace i`, and `Q` is the\
        \ product of the places\n`O.twistPlace i`. We write `(1; 0)` for an inclusion matrix `New.inclMatrix` with\
        \ `r` columns.\n\nThe datum of the theta lift from `W` to `V` asks for `x ≡ (1; 0)` modulo `ϖ`. A product\
        \ datum asks\nfor conditions modulo `ϖ²` on the two blocks of `x`. The lattice that connects them is spanned\
        \ by\nthe columns of the matrix that is `(1; 0)` on both summands, by `L″_s = {u | s u ≡ 0 modulo ϖ}` in\n\
        `V″` and by `ϖ` times the standard lattice of `V°`. The matrix of a basis is called `γ`, and it is\nhandled\
        \ through the integral matrix `ϖ γ⁻¹`.\n\nThis file computes the descent to `W` of product forms on a glued\
        \ lattice, from which the slices\nof a lift are read off. It also bounds the p-adic gauge of the Cartan\
        \ product at the point\n`(h, h') γ`.\n\n## Main definitions and results\n\n* Slices of lifts. `New.Rows.DividedSplitting.normalizedDescent_productForm`:\
        \ if `V.IsGlued s L` and\n  `b * b' = O.charV`, the descent to `W` of a product form is the complex conjugate\
        \ of the product\n  of `L.weilScalar` with a sum over the congruence group, whose terms are products of\
        \ a kernel on\n  `V″` and one on `V°`. `New.Rows.DividedSplitting.normalizedDescent_stdClassSum_productForm`:\
        \ the\n  same for the sum of product forms over the classes, with `New.Rows.kernelClassSum` on `V″`.\n*\
        \ The denominators. `New.Rows.DividedSplitting.weylGauge_cartanProduct_le`: for a glued lattice, a\n  natural\
        \ number `M ≠ 0` divisible by `ϖ` and points `h`, `h'` on the two summands, the gauge of\n  the product\
        \ of two vectors at the point `(h, h') γ` (with `(h, h')` made block diagonal along\n  `V.ε : N ⊕ m ≃ n`)\
        \ is at most `‖M‖⁻¹ ^ V.denominatorExponent` times their gauges.\n\nNotions from other files:\n* `New.DescentPair`:\
        \ A descent pair: chosen places and twist places, a space W of rank r with\n  numbered basis vectors, an\
        \ embedding of indices into n > r, two diagrams given by their numbers of\n  columns of each height, and\
        \ a character μ whose tame part, a character `O.tamePart w` of the\n  residue field at each place w, is\
        \ trivial off these places.\n* `New.LevelPlaces.levelModulus`, `New.Rows.liftMod`: `levelModulus c` is the\
        \ modulus ϖ^c·Q, and\n  `levelModulus c false` is ϖ^c. `liftMod` is a chosen lift of an invertible matrix\
        \ modulo an\n  ideal to an integral point of G_f that is 1 outside the places dividing the ideal and their\n\
        \  conjugates.\n* `New.inclMatrix`: For a map u: m → n of index sets, the n×m matrix whose j-th column is\
        \ the\n  standard basis vector e_{u(j)}.\n* `New.modKernel`: The theta kernel at (g, h) of the datum given\
        \ by a function on matrices modulo an\n  ideal and the Fock vector of a polynomial.\n* `New.WeylIndex`:\
        \ `WeylIndex n κ` indexes the standard basis of the vectors of weight κ in n\n  letters. Here `κ τ h` is\
        \ the number of columns of height h at the infinite place τ.\n\n## Relation to the literature\n\nSee `New.OneLift.ComparisonOperator.GluingMaps`\
        \ and\n`New.OneLift.ComparisonOperator.FirstFactors` for related work.\n"
