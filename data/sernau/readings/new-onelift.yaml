      text: 'This file studies polynomials in the entries of variable matrices `x_τ`, one for each `τ : Φ`, with

        rows indexed by `N` and columns by `L`. It studies how these polynomials transform under the

        two-sided linear substitutions `New.Rows.twoSidedSubst`, `x_τ ↦ c_τᵀ x_τ g_τᵀ`. It treats products

        of determinants of constant matrices stacked over `x_τ`. It also treats the coordinates of a

        polynomial in its first `p` columns, where `p` is a number of columns.

        '
    remainder:
      path: grh/src/New/OneLift/ComparisonOperator/DeterminantProducts.lean
      line: 11
      endLine: 24
      text: "\n## Main definitions and results\n\n* `New.Rows.stackedDetProd`, `New.Rows.twoSidedSubst_stackedDetProd`:\
        \ a product of determinants of\n  constant matrices stacked over `x_τ` (`New.Rows.stackedDet`). The substitution\
        \ sends the product\n  for the matrices `M τ k * (g τ)ᵀ` to a scalar multiple of the product for the matrices\
        \ `M τ k`.\n* `New.Rows.firstColsCoord`, `New.Rows.twoSidedSubst_firstColsCoord`: the coordinates of a\n\
        \  polynomial in its first `p` columns; if the substitution with column matrices\n  `fromBlocks 1 0 0 (g\
        \ τ)` (fixing the first `p` columns) sends `F'` to a multiple of `F`, the\n  coordinates of `F'` and `F`\
        \ are related by the Schur matrix (`New.schur`).\n\nNotions from other files:\n* `New.nablaBasis`, `New.schur`:\
        \ products of minors indexed by families of standard fillings\n  (`New.WeylIndexFamily`), and the matrix\
        \ of a substitution of rows in these polynomials.\n"
