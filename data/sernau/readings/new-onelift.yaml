      text: "\nThe standard definite space `E^n` is also written `I_n`, and `υ = New.WeilData.upsilonU1` is the\n\
        character `ν_η` of weight 1 and trivial tame part. The letter `ϑ` denotes a tame character\n(`New.Data.TameChar`);\
        \ it is a twist only where this is said.\n\n| object | Lean name | object | Lean name |\n|---|---|---|---|\n\
        | `S = E^{2m,m}` | `CarrierIndex` | `χ′` | `twistedChiMPow` |\n| `W♭ = E^{6m+1}` | `FlatIndex` | `ν″` |\
        \ `firstFactorChar` |\n| `V″`, `W′` | `FirstFactorIndex` | `ν♭ υ^m` | `carrierChar` |\n| `V°` | `SecondFactorIndex`\
        \ | `φ°`, `\U0001D5BA χ′` | `carrierForm`, `carrierCoeff` |\n| columns of `μ⁺`, plus Δ′ indices | `DetIndex`\
        \ | `P`, `\U0001D5A5_i` | `paddedMinorProd`, `choiceFn` |\n| choices `i` | `ChoiceIndex` | `u`, `u°` | `conjHolomorphicWeight`,\
        \ `kernelWeight` |\n\n## Main definitions and results\n\n* `New.Rows.carrierForm`: the carrier φ°, the theta\
        \ lift of the constant function from the unitary\n  group of a negative definite space to that of a space\
        \ with signs `+1` on `2 m` and `−1` on `m`\n  coordinates.\n* `New.Rows.carrierCoeff`: the coefficients\
        \ \U0001D5BA times a character, a class sum of theta kernels\n  between two definite spaces.\n* `New.Data.choiceFn`:\
        \ the function `\U0001D5A5_i` on `U(W_j)`, the integral of the carrier against a theta\n  kernel.\n* `New.Data.isTameFor_of_hasWeight`,\
        \ `New.Data.isTameFor_twistedChiMPow`: let `ϑ` be a twist,\n  `c ≠ 0`, and take a character whose tame part\
        \ is `ψ * ϑ.tamePart`, with `ψ` non-trivial exactly at\n  the chosen places. It ramifies exactly at the\
        \ places dividing `D.twistModulus ϑ c`, that is, the\n  chosen places and the places in `ϑ.Q` (`New.Exchange.IsTameFor`).\
        \ This applies to\n  `New.Data.twistedChiMPow`.\n* `New.Rows.exists_int_weylRep_invariant_fockPoly_eq_smul_monomial`:\
        \ for a monomial of the right\n  degrees there is an integral vector whose Fock polynomial is a nonzero\
        \ multiple of the monomial.\n  The vector is fixed by the elements that act trivially on the rows of the\
        \ monomial.\n\nNotions from other files:\n* `New.Modulus`: a nonzero ideal of \U0001D4DE_E that is never\
        \ divisible by both a place w and its conjugate\n  w̄.\n* `New.Data.spaceW`: the diagonal hermitian space\
        \ `W_j` of rank r over E with signs `D.signsW j`.\n* `New.Data.liftWeight`: the natural number `κ_j`, a\
        \ function of the infinite place; the character\n  `New.Data.liftChar` of the `j`-th lift has weight `−κ_j`.\n\
        * The numbers of `D`: the rank `r` of `W_j`, the number `m` of lifts, `k = r + 1 − m`, `t = 5 r`,\n  the\
        \ gap `Δ = New.Data.gap = 2 r ^ 8` and `Δ′ = New.Data.reducedHalfGap = Δ / 2 − (t + 1) / 2`.\n* `New.Data.descentPair`:\
        \ the data (`New.DescentPair`) of the lift from `W_j` to `I_{r+t}`. They\n  include a `numbering` of the\
        \ basis vectors of `W_j` and, at each infinite place, two partitions\n  `μ⁺`, `μ⁻` given by their numbers\
        \ `colsPlus`, `colsMinus` of columns of each height.\n* `New.Data.TameChar`, `New.Data.Twist`: a character\
        \ of U(1)(\U0001D538) of weight 0 whose tame part is\n  trivial outside a finite set Q of places; it is\
        \ a twist if the tame part is non-trivial on all of\n  Q.\n\n## Use in the argument\n\n* The carrier φ°\
        \ and the coefficients \U0001D5BA: the class sum of a twisted square kernel against \U0001D5BA is a\n  multiple\
        \ of φ°. See `New.OneLift.ComparisonOperator.ThreeExchanges`.\n* Moduli, index sets, polynomial and functions\
        \ `\U0001D5A5_i`: the third exchange and its left side as a\n  theta series. See `New.OneLift.ComparisonOperator.ThreeExchanges`\
        \ and\n  `New.OneLift.ComparisonOperator.FirstFactors`.\n* Order, weights and gaps on `W_j`: the functions\
        \ `\U0001D5A5_i` separate good forms. See\n  `New.OneLift.ComparisonOperator.ProductsSpan`.\n* Integral\
        \ vectors with a monomial Fock polynomial: the height bound for inverse ratios of twisted\n  to untwisted\
        \ Hecke L-values. See `New.OneLift.HeckeValues.TwistedValueHeights`.\n"
