      endOffset: 1209
      text: 'Fix admissible data `D`, a tame character `ϑ` and an index `1 ≤ j ≤ m`. Write `E^n` for

        the standard definite space of rank `n`, V″ for the one on `New.Data.FirstFactorIndex` and

        W^add = E^{3m−j} ⊕ W♭ ⊕ E^{3m} for the one on `New.Data.AddedIndex`. Throughout, k = `D.k`,

        m = `D.m`, M = `D.M`, and W_j is the space on `D.RowIndex` with r₊ = `D.posRank j` = k + j − 1

        plus signs. This file writes P_V as a sum of products of a polynomial in X and a coordinate of

        ζ(z), where X are the variables in the positive basis vectors of W_j and z those in W^add. Each

        value of Υ is a double class sum of products of three theta kernels of definite spaces, and this

        file bounds these kernels. By `New.Data.exists_isIntegralAndSmall_leftSideSeries`, for one constant

        `c″ ≠ 0` the first factors φ″, the complex conjugates of c″Υ, are integral away from the norm of Q

        and, if Q is empty, all their images under automorphisms of ℂ are small

        (`New.Data.IsIntegralAndSmall`).'
    remainder:
      path: grh/src/New/OneLift/ComparisonOperator/FirstFactors.lean
      line: 19
      endLine: 49
      startOffset: 1209
      endOffset: 3188
      text: "\n\n## Main definitions and results\n\n* `New.Data.renameRowsCols_stackedDetProd_eq_sum`: P_V as a\
        \ sum of products of a polynomial in X and\n  a coordinate of ζ(z).\n* `New.Data.exists_isIntegralAndSmall_leftSideSeries`:\
        \ for 1 ≤ j ≤ m there is one c ≠ 0, independent\n  of i, ϑ and h, such that every first factor y = conj\
        \ (c · Υ) is integral and small in the sense of\n  `New.Data.IsIntegralAndSmall`.\n\nNotions from other\
        \ files:\n* `New.toPoly`, `New.weylNormSq`: the polynomial of a coordinate vector of weight κ, and the squared\n\
        \  norm of the vector for the Gram matrix of κ. Here `κ τ h` counts the columns of height `h` at `τ`.\n\
        * `New.Data.FirstFactorIndex`: the indices of W_j, (E^j)⁻, E^{3m−j} and W♭ = E^{6m+1}.\n* `New.Data.TameChar`,\
        \ `New.Data.twistModulus`: a character `ϑ` of U(1)(\U0001D538) of weight 0 with tame\n  part on a finite\
        \ set Q = `ϑ.Q` of places, and the moduli ϖ^c Q.\n* `New.Data.stackedDetProdCoords`: the coordinates of\
        \ the polynomial map ζ.\n* `New.Data.leftSideSeries`: the series Υ, built from theta kernels of definite\
        \ spaces.\n\n## Relation to the literature\n\nThe first factors enter the comparison of twisted theta forms\
        \ on U(W_j) with twist-free ones,\n`New.Data.exists_mul_thirdExchangeLeftSide_eq_choiceFn` in\n`New.OneLift.ComparisonOperator.ThreeExchanges`:\
        \ for every twist, an explicit theta form times a\nnumber is a twist-free function, and the squared modulus\
        \ of the number is a constant independent of\nthe twist divided by a product of squared Hecke L-values and\
        \ powers of norms of places. This file\nproves that the first factors are integral off the conductor and\
        \ small when untwisted. The rank one\ncase (the lift is a scalar of square modulus an L-value), twisting\
        \ on a square block and integral\ntheta data are known in the literature. Related work: T. Yang, Theta liftings\
        \ and Hecke L-functions,\n1997; Böcherer–Schmidt, p-adic measures attached to Siegel modular forms, 2000;\
        \ Harris–Li–Skinner,\nThe Rallis inner product formula and p-adic L-functions, 2005.\n"
