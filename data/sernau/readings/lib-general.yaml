      endLine: 11
      text: 'This file rearranges the coordinates of finite powers of a σ-finite measure space, bounds integrals

        of negative powers under polynomial volume growth by a layer cake argument, shows that continuous

        functions on a group G that are left invariant under a cocompact subgroup Γ are integrable for

        finite measures on G, and passes L² bounds of integral operators with measurable, integrable kernels

        to finite products. It also contains Tonelli''s theorem for finite products, products of cocompact

        subgroups, and two small constructions, `New.padTuple` and `New.unitOrOne`.

        '
    remainder:
      path: grh/src/Lib/General/Measure/IntegralOperators.lean
      line: 12
      endLine: 31
      text: "\nAmong the imported notions in the statements are `Subgroup.FixesLeft Γ F`, meaning `F (γ g) = F g`\n\
        for `γ ∈ Γ`, and the following.\n\n* `Subgroup.IsCocompact Γ`: some compact set `C ⊆ G` meets every orbit\
        \ `Γg`.\n\n## Main definitions and results\n\n* `New.lintegral_rpow_neg_le_of_measure_sublevel_le`: if the\
        \ sublevel sets `{u ≤ R}` of a measurable\n  function `u ≥ 1` have measure at most `(K R^e)^d V`, with `K\
        \ ≥ 0`, then the integral of `u^(-A)`\n  has an explicit bound for `A > e d`. The measure is arbitrary,\
        \ so the result also bounds sums\n  (counting measure). For finite `V`, `New.integrable_rpow_neg_of_measure_sublevel_le`\
        \ and\n  `New.integral_rpow_neg_le_of_measure_sublevel_le` are the forms for the Bochner integral;\n  `New.DiscreteSeries.integral_rpow_neg_le_of_measure_le`\
        \ joins them.\n* `New.integrable_of_isCocompact`: continuous left Γ-invariant functions are integrable for\
        \ finite\n  measures on G.\n* `New.IsL2Contraction`: a finite family of kernels defines an operator of norm\
        \ at most one between\n  two `L²` spaces, tested on bounded measurable functions. By `New.IsL2Contraction.pi`,\
        \ the bound\n  passes to the product of finitely many such families, for σ-finite measures and measurable\
        \ kernels\n  that are integrable in the last variable.\n"
