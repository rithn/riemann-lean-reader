      line: 8
      endLine: 14
      text: 'Let `k` be an algebraically closed field. For schemes and morphisms locally of finite type, points

        with values in `k` detect nonempty locally closed sets and images of morphisms, and this is used to

        spread properties over commutative group schemes.

        Smooth morphisms are shown to be geometrically reduced, and abelian schemes over `k` are shown to be

        integral. The file also records that flat morphisms are injective on stalks. Finally it gives

        criteria for families of complex points to be separating over a stalk of the base and on a product

        of flat schemes.

        '
    remainder:
      path: grh/src/Lib/General/Geometry/GeometricPoints.lean
      line: 15
      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.exists_section_mem`, `New.exists_point_mem`: a nonempty\
        \ locally closed set in a scheme\n  locally of finite type over `k` contains a `k`-point.\n* `New.IsDenseFamily.of_fibres`:\
        \ if the complex points `η i` are dense in `S` and `A` is smooth over\n  `S`, a family containing every\
        \ complex point of `A` over the `η i` is dense in `A`.\n* `New.AddObj.property_of_isOpenImmersion`: take\
        \ a commutative group scheme (`New.AddObj`) locally\n  of finite type over `k`. A property induced by a\
        \ property of ring maps spreads from a nonempty\n  open part to the whole scheme, by translation.\n* `New.AddObj.smoothOfRelativeDimension_of_fibres`:\
        \ the relative dimension of an abelian scheme can\n  be read off the fibres through a dense family of points.\n\
        * `New.isSeparatingFamily_stalk`: for `A` and `S` reduced and dense points of `A` with finitely many\n \
        \ images in `S`, the lifts of those that factor through a stalk of `S` separate the base change of\n  `A`\
        \ to that stalk.\n* `New.IsSeparatingFamily.prod`: separating points of `B`, paired with dense points of\
        \ the fibres of\n  `A` over their images in `S`, separate `A ×_S B`, for `A`, `B` flat and locally of finite\
        \ type,\n  `A` reduced, and `S` reduced, locally noetherian, with finitely many dense complex points.\n\n\
        Notions from other files:\n* `New.IsDenseFamily`: the images of a family of complex points are dense.\n\
        * `New.IsSeparatingFamily`: the family is dense and the scheme is reduced.\n* `New.IsAbelianScheme`: a smooth\
        \ proper commutative group scheme on which multiplication by every\n  `m ≠ 0` is surjective.\n* `New.translation`:\
        \ translation x ↦ x + z by a section z of a commutative group scheme.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.Shimura.AbelianScheme.IsogenyFlatness` for sources.\n"
