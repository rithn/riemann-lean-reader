      startOffset: 147
      endOffset: 918
      text: 'This file studies the imaginary quadratic field `K = ℚ(√-d)` (`New.QuadField`) for `d ≡ 3 mod 4`,

        realised inside `ℂ`, and the Dirichlet characters attached to it. Throughout, `New.chiK d p` is the

        Legendre symbol `(p / d)` of `p` modulo the prime `d`, and `New.QuadField.betaK d` is the algebraic

        integer `(1 + √-d) / 2`. A finite place of `K` (`New.FinPlace`) is a nonzero prime of its ring of

        integers. Below, `w` is a finite place that contains the rational prime `p`, and `w.q` is its

        absolute norm. For a prime `d ≡ 7 mod 8` the file determines the ring of integers and the different

        of `K`. For `d ≡ 3 mod 4` it shows how a rational prime `p` decomposes in `K`. It also proves two

        consequences of lifting the exponent at `2` for integers, which do not involve `K`.'
    remainder:
      path: grh/src/Lib/General/NumberTheory/ImaginaryQuadraticField.lean
      line: 13
      endLine: 31
      startOffset: 918
      endOffset: 2175
      text: "\n\n## Main definitions and results\n\n* `New.chiK`, `New.quadTwist`: the Legendre symbol `(·/d)` as\
        \ an integer-valued character, and its\n  product with a complex character `χ` modulo `N`, a character modulo\
        \ `N * d`.\n* `New.QuadField`: the field. For `d ≡ 3` modulo `4` it is a quadratic CM field\n  (the degree\
        \ is `New.QuadField.finrank_eq_two`). For a prime `d ≡ 3` modulo `4` it embeds in any\n  field of characteristic\
        \ zero with a primitive `d`-th root of unity\n  (`New.QuadField.embOfPrimitiveRoot`).\n* `New.QuadField.different_eq_span_and_adjoin_betaK`:\
        \ for a prime `d ≡ 7` modulo `8`, the integers\n  of `K` are `ℤ[(1 + √-d) / 2]` and the different is `(√-d)`.\n\
        * `New.FinPlace.q_eq_pow_inertiaDeg`, `New.FinPlace.inertiaDeg_dvd_iff_forall_pow_eq`: the norm of\n  `w`\
