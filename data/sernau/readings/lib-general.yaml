      endLine: 14
      text: "This file collects lemmas on polynomials in several variables and on algebras of finite type. They\n\
        cover commuting partial derivatives, generation by products of polynomials in two sets of variables,\nthe\
        \ cost of monomials of polynomials that vanish to high order, and homogenization along a linear\nform.\n\
        \n## Main definitions and results\n\n* `New.exists_le_weight_of_mem_vanishingIdeal_pow`: a nonzero polynomial\
        \ that vanishes to order `d`\n  at enough suitable points has a monomial of cost at least `d`.\n"
    remainder:
      path: grh/src/Lib/General/Algebra/MultivariatePolynomials.lean
      line: 15
      endLine: 38
      text: "* `New.exists_isHomogeneous_sub_one_dvd_sub` replaces a polynomial `P` of total degree at most `N`\n\
        \  by a form `G`, homogeneous of degree `N`, congruent to `P` modulo `F - 1` for a given linear form\n \
        \ `F`. So `G` and `P` have the same value at every point where `F` equals `1`\n  (`New.exists_homogenization`);\
        \ points are `R`-algebra maps `φ` out of the polynomial ring, with\n  values in algebras in `Type`.\n* `New.nullstellensatz_exists_le_ker`:\
        \ the weak Nullstellensatz for an algebra of finite type, with\n  points written as `k`-algebra homomorphisms\
        \ `A → k`.\n* `New.exists_mem_colon_of_tangent`: a criterion for an ideal to cut out a section of an affine\n\
        \  scheme of finite type near a point. Tangent vectors at a `k`-valued point `o` along the fibre are\n \
        \ the `V`-algebra maps to the dual numbers `k[ε]` that reduce to `o`.\n* `New.Variety.IsAbsIntegrallyClosedLocal.multivariate_hensel`\
        \ is a several-variable Hensel lemma\n  for systems `x i = p i (x)` whose coefficients lie in the maximal\
        \ ideal. Over a local domain in\n  which every monic polynomial of positive degree has a root\n  (`New.Variety.IsAbsIntegrallyClosedLocal`),\
        \ it follows from the local structure of étale algebras:\n  a standard étale algebra is given by a monic\
        \ polynomial, whose residual root lifts.\n\n## Relation to the literature\n\nAll results are known. `New.exists_le_weight_of_mem_vanishingIdeal_pow`\
        \ is a form of the\nCombinatorial Nullstellensatz with multiplicity, over any field. Each variable u has\
        \ a positive\ninteger κ(u) and the weight 1/κ(u). In place of a grid it uses a set of at least ∏κ(u) points\
        \ at\nwhich each u^κ(u) agrees with a polynomial of lower weighted degree. A nonzero polynomial vanishing\n\
        to order d at all these points then has a monomial of weighted degree at least d. Source: Alon,\nCombinatorial\
