      text: "Linear algebra over a discrete valuation ring O (written `DVR O`) with normalized valuation\nv = `addVal\
        \ O` and fraction field K. The valuation of a determinant of relations is bounded by the\nlength of a module\
        \ of solutions, taken modulo an element p or in K/O.\n\n* `New.Selmer.exists_rows_addVal_det_le`: let ψ\
        \ : A → M_d(O) be onto, N an A-submodule of A^ι, p ≠ 0\n  and b < v(p). If the vectors modulo p killed by\
        \ ψ(N) lie in a module of length at most b, then\n  some square matrix B with rows in N has v(det ψ(B))\
        \ ≤ b, with ψ(B) read as a block matrix.\n"
    remainder:
      path: grh/src/Lib/General/Algebra/BlockFittingBound.lean
      line: 13
      endLine: 26
      text: "* `New.Selmer.divQuot`: the map x ↦ x/p from O/p to K/O (`New.Selmer.DivisibleQuot`). For p ≠ 0 it\n\
        \  is injective with image the p-torsion.\n* `New.Selmer.exists_rows_addVal_det_le_of_divisible`: the same\
        \ bound when the vectors with entries\n  in K/O killed by ψ(N) lie in a module of length at most b. It follows\
        \ from the form modulo p and\n  is the form that Ribet's lemma uses.\n\nThe idea: as ψ is onto, any d linear\
        \ forms in the span of the rows of the ψ(t), t ∈ N, are the rows\nof one ψ(t). So a basis of this span,\
        \ divided into groups of d forms, gives B. The length of the\nsolutions bounds the determinant of such a\
        \ basis by the duality lemma\n`New.exists_matrix_addVal_det_le_length` for lattices in O^n.\n\n## Relation\
        \ to the literature\n\nGeneral linear algebra over a discrete valuation ring (elementary divisors).\n"
