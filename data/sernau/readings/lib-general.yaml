      text: "This file collects auxiliary facts from topology and algebra. It characterises congruence modulo a\n\
        principal ideal `(a)` by divisibility of the difference by `a`.\n\n## Main definitions and results\n\n*\
        \ `IsCompact.eventually_forall_mem`: a form of the tube lemma for a jointly continuous map of two\n  variables,\
        \ with the continuity hypothesis discharged by `fun_prop` by default.\n* `New.Selmer.exists_procyclic_generator`:\
        \ a continuous character of a compact group with values in\n  1 + 4ℤ_ℓ has procyclic image.\n"
