      text: 'This file computes sums of residues of rational functions whose denominator has simple real roots.

        Let `p = nodal univ x` be the monic polynomial with the distinct roots `x i`. The residue of `F / p`

        at `x i` is `F (x i) / p'' (x i)`. This file also determines the sign of `p'' (x i)` when the roots

        are ordered.

        '
    remainder:
      path: grh/src/Lib/General/Algebra/ResidueSums.lean
      line: 10
      endLine: 20
      text: "\n## Main definitions and results\n\n* `New.DiscreteSeries.sum_eval_div_eval_derivative_nodal` and\n\
        \  `sum_eval_div_sub_mul_eval_derivative_nodal`: two sums of residues at simple poles.\n* `New.DiscreteSeries.eval_derivative_nodal`:\
        \ the derivative of `nodal univ x`, the monic\n  polynomial with roots `x j`, at the root `x i` is the product\
