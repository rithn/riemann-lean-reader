        \  `New.Variety.perfectRing_tensor`: if p = 0 in S, perfect S-algebras are closed under wide\n  pushouts,\
        \ so, for perfect S, under tensor products.\n* `New.Variety.exists_perfection_quotient`: the perfection\
        \ of B/t, for p = 0 in the base.\n* `New.Variety.exists_perfect_blowup_charts`: for f, g in a perfect algebra\
        \ B over a perfect ring\n  with p = 0, perfected charts B₁ (where g ∣ f) and B₂ (where f ∣ g) form an exact\
