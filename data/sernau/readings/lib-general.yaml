      path: grh/src/Lib/General/Algebra/CohomologyBaseChange.lean
      line: 7
      endLine: 14
      startOffset: 189
      endOffset: 908
      text: 'Cohomology here is H^n(N, Φ) = Ext^n(N, Φ) in the category of functors from C to abelian groups,

        where Φ is a functor to S-modules. For a module M over an S-algebra T, the base change map

        `New.Variety.baseChangeMap` goes from M ⊗_S H^n(N, Φ) to H^n(N, M ⊗_S Φ).

        `New.Variety.HasFlatBaseChange N` says that this map is bijective for all S, T, Φ, n and all M flat

        over S. The file proves bijectivity for N = ℤ[h_A], with h_A the functor represented by A, by the

        Yoneda lemma, shows that for flat M the maps admit dévissage in N, and transfers bijectivity along

        bijective comparisons. It also shows that base change of algebras is left adjoint to restriction of

        scalars, and that ring maps send powers of p to powers of p.'
    remainder:
      path: grh/src/Lib/General/Algebra/CohomologyBaseChange.lean
      line: 14
      endLine: 42
      startOffset: 908
      endOffset: 2390
      text: "\n\n## Main definitions and results\n\n* `New.Variety.HasBaseChange.baseChangeMap_bijective_freeAb_reprBy`:\
        \ the base change map is\n  bijective for N = ℤ[h_A], by the Yoneda lemma.\n* `New.Variety.HasBaseChange.devissage`:\
        \ for M flat it admits dévissage, being compatible with the\n  long exact sequences of short exact sequences.\n\
        * `New.Variety.Comparison.IsBijective.baseChangeMap_bijective_iff`: along a bijective comparison\n  from\
        \ an N with flat base change, base change by a flat M on the target holds exactly when the\n  comparison\
        \ stays bijective after tensoring the coefficients with M.\n* `New.Variety.algBaseChangeAdj`: for a k-algebra\
        \ S, the functor A ↦ S ⊗_k A\n  (`New.Variety.algBaseChange`) is left adjoint to restriction of scalars\n\
        \  (`New.Variety.restrictAlg`).\n* `New.Variety.pointMap_algBaseChange_unit_bijective`: the base change\
        \ S ⊗_k B represents Hom(B, -)\n  on S-algebras.\n\nNotions from other files:\n* `New.Variety.moduleCoeff`:\
        \ A functor F from C to k-modules, regarded as a functor to abelian\n  groups, so that it can serve as the\
        \ coefficients of cohomology.\n* `New.Variety.freeAb`: The functor sending a set-valued functor Y to Z[Y],\
        \ whose value at A is the\n  free abelian group on Y(A).\n* `New.Variety.tensorWith`: For a module M over\
        \ the S-algebra T, the functor X ↦ M ⊗_S X from\n  S-modules to T-modules.\n\n## Relation to the literature\n\
        \nThe arguments are the usual ones: the Yoneda lemma, exactness of tensoring with a flat module, and\nthe\
        \ tensor-hom adjunction.\n"
