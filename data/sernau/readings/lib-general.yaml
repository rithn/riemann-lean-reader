      endLine: 39
      text: "\n## Main definitions and results\n\n* `New.AreMatched`: two functions `Φ`, `Ψ` supported on the blocks\
        \ `New.invLastRows e k` and\n  `New.firstCols e k` of `k ∈ GL n O`, whose values differ by the factor `χ\
        \ (det k)`.\n* `New.IsPrimitiveMatrix.mul_iff`: for primitive `y`, the matrix `y * x` is primitive exactly\
        \ if `x`\n  is primitive.\n* `New.exists_firstCols_eq_mul`: multiplying `firstCols e k` by an element of\
        \ `GL b O` and\n  `invLastRows e k` by an element of `GL a O` gives the blocks of another element of `GL\
        \ n O`,\n  whose determinant is computed.\n* `New.IsValuationPair.exists_firstCols_iff`: if `New.IsValuationPair\
        \ O` holds, the primitive\n  matrices are the `firstCols e k` with `k` in `GL n O`.\n* `New.AreMatched.lift_of_reduction`:\
        \ partners over `R` lift along a surjective local homomorphism\n  `O → R`; here `O` is a subring of another\
        \ ring `F`.\n* `New.AreMatched.left_mul`, `New.AreMatched.right_mul`: the transformation laws of two partner\n\
        \  functions.\n\nNotions from other files:\n* `New.intGL n O`: the group `GL n O` as a subgroup of `GL n\
        \ R`.\n* `New.IsPrimitiveMatrix O y`: the matrix `y` and some left inverse of it have entries in `O`.\n\
        * `New.HasLeftInv X`: the matrix `X` has a left inverse over `R`.\n* `New.liftIntegralFn π f`: the function\
        \ that is `f` at the image under `π` of a matrix over `O`\n  and zero at every other matrix.\n* `New.IsValuationPair\
        \ O`: for all `u`, `v` in `R` there is an idempotent `ε` in `O` such that `u`\n  and `v` are `O`-multiples\
