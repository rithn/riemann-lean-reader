      startOffset: 162
      endOffset: 906
      text: '`New.QZ` is `ℚ/ℤ` with the discrete topology, and a character of a profinite group `G`

        (`New.QZChar G`) is a continuous homomorphism `G → ℚ/ℤ`. The file first proves elementary facts:

        the exponential embedding of `ℚ/ℤ` into `ℂˣ`, the embedding of `ZMod n` into `ℚ/ℤ`, extension of

        homomorphisms into divisible groups, and equality of the orders of a finite abelian group and its

        dual. It then shows that characters separate points of the topological abelianisation of `G`, and

        that additive maps from characters to `ℚ/ℤ` are evaluations at its points; these facts are used to

        build Artin maps from their values on characters. `New.QZChar.abelianLift χ` denotes the map

        induced by `χ` on the abelianisation, with values written multiplicatively.'
    remainder:
      path: grh/src/Lib/General/Groups/ProfiniteCharacters.lean
      line: 14
      endLine: 37
      startOffset: 906
      endOffset: 2371
      text: "\n\n## Main definitions and results\n\n* `New.QZ.exists_extend`: for abelian groups, homomorphisms\
        \ to a divisible group extend along any\n  homomorphism whose kernel they kill.\n* `New.card_hom_QZ`: a\
        \ finite abelian group and its dual have the same order.\n* `New.QZChar.mem_of_forall_abelianLift`, `New.QZChar.abelianization_ext`:\
        \ characters separate a\n  point from a closed subgroup of the abelianisation, and hence separate points.\n\
        * `New.QZChar.exists_hom_abelianLift_eq`: every additive map from characters to `ℚ/ℤ` is evaluation\n  at\
        \ a point of the abelianisation, in a form that is multiplicative in a parameter.\n* `New.QZChar.continuous_iff_forall_isOpen_ker_comp`:\
        \ a homomorphism from a commutative topological\n  group to the abelianisation is continuous exactly when\
        \ its composite with each character has open\n  kernel.\n* `New.exists_monoidHom_extend`, deduced from `New.QZ.exists_extend`:\
        \ a homomorphism\n  `θ` from a commutative group into a divisible commutative group, trivial on the preimage\
        \ of a\n  subgroup `H` under a homomorphism `f` of commutative groups, factors through `f` by a homomorphism\n\
        \  trivial on `H`.\n\nNotions from other files:\n* `New.Z1 ρ`: the continuous 1-cocycles of `ρ`, that is\
        \ the continuous `f : G → M` with\n  `f (g h) = f g + ρ g (f h)`; `New.QZChar G` is the case of the trivial\
        \ action on `ℚ/ℤ`.\n* `New.QZChar.toHom χ`: the character `χ` as a group homomorphism to `ℚ/ℤ` written\n\
        \  multiplicatively; `New.QZChar.ker χ` is its kernel.\n"
