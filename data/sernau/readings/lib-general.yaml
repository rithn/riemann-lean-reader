    excerpt:
      path: grh/src/Lib/General/Algebra/AdicCompletion.lean
      line: 6
      endLine: 10
      text: 'This file collects tools on adic completeness over a commutative ring. It covers normed fields over

        `ℚ_[p]`, divisibility by powers of an element `π`, maps of adic completions, monoid actions by ring

        endomorphisms, extension of linear maps by adic continuity, and topological bases. In the results on

        topological bases, `I` is an ideal of `S`, often `I = (p, z)`, and `M` is an `S`-module. For

        `c : New.Lift.AdicBasis I M`, the `c.b i` are its vectors and the `c.coord i` its coordinate forms.

        '
    remainder:
      path: grh/src/Lib/General/Algebra/AdicCompletion.lean
      line: 11
      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.shiftDiff`: the operator `(x_j) ↦ (x_j - π x_{j+1})` on\
        \ sequences. By\n  `New.isPrecomplete_of_shiftDiff_surjective`, if it is onto for `π = x` and for `π = y`,\
        \ then\n  `(x, y)`-adic Cauchy sequences converge.\n* `New.Adic.ringHom_ext_of_approx`: two ring maps `F`,\
        \ `G` from `A` to a `p`-adically separated ring\n  are equal if every element of `A` is congruent, modulo\
        \ each power of `p`, to an element on which\n  they agree.\n* `New.adicMap`: a ring map that carries `I`\
        \ into `J` induces a map of adic completions.\n* `New.exists_adic_extension`: a linear map `g` into an `I`-adically\
        \ complete module extends along a\n  map `β` with dense image, if `β f ∈ I ^ (n + n) • ⊤` implies `g f ∈\
        \ I ^ n • ⊤` for all `n`.\n* `New.Lift.exists_adicBasis`: an `I`-adic topological basis of `M` over `S`\
        \ exists when\n  `I = (p, z)` is maximal, `S` is `I`-adically complete, `p` is zero or injective on `M`,\
        \ and `z` is\n  injective on `M / p M`. It may be taken to contain given vectors independent modulo `I M`.\n\
        * `New.free_finite_of_rank_le`: over a ring `S` that is complete for a maximal ideal `(p, z)`, a\n  separated\
        \ module of finite rank on which `p, z` behave as a regular sequence (or `p = 0` and `z`\n  is regular)\
        \ is finite and free. The proof uses the topological basis of\n  `New.Lift.exists_adicBasis`.\n\nNotions\
        \ of this file:\n* `New.Lift.AdicBasis`: a topological basis of `M` over `S` for the `I`-adic topology:\
        \ vectors `b i`\n  whose finite combinations are dense, with linear forms `coord i` on `M` that read off\
        \ the\n  coefficients of a finite combination.\n\n## Relation to the literature\n\nKnown; see `Lib.PadicComparison.Completion`\
        \ for sources.\n"
