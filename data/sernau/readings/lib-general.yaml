      text: "For every ideal `I` of a ring of integers of a number field some power `I ^ n` with `n ≠ 0` is\nprincipal.\
        \ For ideals of norm greater than 1 the generators can be chosen large at every complex\nembedding.\n\n\
        ## Main definitions and results\n\n* `New.ThetaTori.exists_pow_eq_span_inv_lt`: for an ideal of norm greater\
        \ than 1, some power is\n  principal with a non-unit generator of arbitrarily large absolute value at every\
        \ complex\n  embedding.\n"
    remainder:
      path: grh/src/Lib/General/NumberTheory/SUnitsAndClassNumber.lean
      line: 16
      endLine: 38
      text: "* `New.SUnit.dirichlet_unit_theorem`: for a finite set `S` of finite places of a number field `K`,\n\
        \  the `S`-units are finitely generated of rank `#S + #(infinite places) - 1`. This follows from\n  Mathlib's\
        \ unit theorem and the finiteness of the class number, in the form\n  `New.exists_valuation_eq_exp_mul`.\
        \ Valuations are multiplicative, with values in `ℤᵐ⁰`, and a\n  uniformiser has valuation `exp (-1)`.\n\
        * `New.eq_zero_of_forall_norm_lt_one`: an algebraic integer of absolute value below `1` at every\n  infinite\
        \ place is `0`. Here `Φ v`, from an instance of `New.PlaceEmbedding`, is a chosen complex\n  embedding that\
        \ induces the infinite place `v`.\n* `New.classNumber_le`: a number field of degree `n` and discriminant\
        \ `d` has class number at most\n  `(2 ^ n * |d|) ^ (n + 1)`.\n\nMinkowski's bound is at most `2 ^ n * |d|`\
        \ (`New.minkowski_bound_le_two_pow_mul_discr`), so each\nclass has an integral ideal of norm `k ≤ 2 ^ n\
        \ * |d|` as a member. Such an ideal is generated by\n`k` and one more element, and the proof counts the\
        \ possible pairs.\n\n* `New.conj_mem_quadInt`: for a prime `d ≡ 7` mod `8`, the ring `New.quadInt d`, the\
        \ image of the\n  ring of integers of ℚ(√−d) in ℂ, is stable under complex conjugation.\n\n## Relation to\
        \ the literature\n\nDirichlet's `S`-unit theorem is deduced from the unit theorem in Mathlib, and the class\
        \ number bound\nis a crude explicit form of the finiteness of the class number, deduced from Minkowski's\
        \ bound in\nMathlib.\n"
