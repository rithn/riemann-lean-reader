      endLine: 11
      text: 'This file collects known facts on complex matrices near the identity.

        It proves Jacobi''s formula for the derivative of the determinant at the identity and

        `det (exp M) = exp (tr M)`.

        Estimates in the Hilbert–Schmidt norm, which is the norm of all matrices in this file, control the

        inverse and the logarithm of `1 + X` and the exponential of `X`.

        '
    remainder:
      path: grh/src/Lib/General/LinearAlgebra/MatricesNearIdentity.lean
      line: 12
      endLine: 25
      text: "The logarithm of an element of `USign ε` near `1` lies in the Lie algebra.\nA matrix at distance less\
        \ than `1` from the identity is accretive.\n\n## Main definitions and results\n\n* `New.hasDerivAt_det_of_eq_one`:\
        \ along a differentiable curve of complex matrices through the\n  identity, the derivative of the determinant\
        \ there is the trace of the velocity.\n* `New.DiscreteSeries.logOneAdd` and `exp_logOneAdd`: the logarithm\
        \ of `1 + X` for `‖X‖ ≤ 1 / 2`.\n\nNotions from other files:\n* `signMatrix ε` is the diagonal matrix with\
        \ entries `ε i = ±1`, and `USign ε` is its unitary group.\n* `unitaryLie J` is the space of matrices `X`\
        \ with `Xᴴ * J + J * X = 0`.\n* `entryMask r X` keeps the entries `(i, j)` of `X` with `r i j` and replaces\
        \ the others by `0`.\n* A matrix `A` is accretive (`A.IsAccretive`) if `A + Aᴴ` is positive definite.\n"
