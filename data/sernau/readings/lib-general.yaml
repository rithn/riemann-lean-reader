      text: "This file sets up the character theory of a finite group `G` that is used for the characters of\n`GL\
        \ n` over a finite field. From Wedderburn's theorem it derives criteria for irreducibility.\n\n## Main definitions\
        \ and results\n\n* `New.IsIrreducibleChar`: characters of norm one that satisfy the convolution identity\
        \ with every\n  class function.\n* `New.virtualChars S G`: the `S`-span of the characters, a subalgebra\
        \ of `G → ℂ`; for `S = ℤ` these\n  are the virtual characters, for `S = ℕ` the characters (`New.isChar_of_mem_virtualChars`).\n"
    remainder:
      path: grh/src/Lib/General/Groups/CharacterTheory.lean
      line: 15
      endLine: 33
      text: "* `New.IsCentralProj`: central idempotents e of the group algebra ℂ[H] of any group H. Their\n  coefficients\
        \ are class functions; 1 − e, the image of e under a ring endomorphism of ℂ and tensor\n  products are again\
        \ central idempotents.\n* `New.IsClassFunction.isIrreducibleChar_of_classInner_eq_intCast`,\n  `New.IsClassFunction.mem_virtualChars`,\
        \ `New.IsClassFunction.exists_eq_mul_groupAlgElem_mul`:\n  criteria for a class function `f` to be an irreducible\
        \ character, for `f` to be a combination of\n  characters with coefficients in a given semiring, and for\
        \ an element of `ℂ[G]` to be recovered\n  from its product with `New.groupAlgElem f`. They are collected\
        \ in\n  `New.isIrreducibleChar_and_mem_virtualChars_and_exists_mul`.\n* `New.IsCentralProj.isChar_card_mul_coeff`:\
        \ for a central idempotent `e` of `ℂ[G]`, the function\n  `g ↦ |G| · e(g)` is a character. Its pairing with\
        \ any character is the rank of an idempotent, so a\n  natural number. It is the character of a representation\
        \ of dimension at most `|G|`\n  (`New.IsCentralProj.exists_character_eq_and_finrank_le_card`), so the coefficients\
        \ of `e` have\n  norm at most `1` (`New.IsCentralProj.norm_coeff_le_one`).\n* `New.IsCentralProj.self_adjoint`,\
        \ `New.IsCentralProj.sum_norm_sq_conv_le`: a central idempotent of\n  `ℂ[G]` acts self-adjointly for every\
        \ `G`-invariant form that is sesquilinear for `σ⁻¹ ∘ conj ∘ σ`,\n  complex conjugation transported along\
        \ an automorphism `σ` of `ℂ`. So it acts as an orthogonal\n  projection in every unitary representation.\
        \ Hence convolution with it does not increase `ℓ²`\n  norms.\n"
