      line: 6
      endLine: 9
      text: 'This file gives two ways to show that a number field is CM. The first asks that the field contain a

        totally complex field, and that complex conjugation be induced, in all embeddings at once, by a map

        of the field to itself. The second shows that adjoining to a CM field a root of a suitable

        polynomial gives a CM field, whose finite adeles it also describes.

        '
    remainder:
      path: grh/src/Lib/General/NumberTheory/CMFields.lean
      line: 10
      endLine: 26
      text: "\nWe write `\U0001D538f K` for the ring of finite adeles of a number field `K`. For an extension `L\
        \ / K` of\nnumber fields, `\U0001D538f L` is an algebra over `\U0001D538f K`, and complex conjugation `star`\
        \ of a CM field\nextends to its finite adeles.\n\n## Main definitions and results\n\n* `New.isCMField_of_forall_exists_conj`:\
        \ a number field is CM if it contains a totally complex field\n  and complex conjugation is induced, in\
        \ all embeddings at once, by a map of the field to itself.\n* `New.isCMField_adjoinRoot_of_forall_root_mul_star_eq`:\
        \ let `E` be a CM field and `P` an\n  irreducible polynomial over `E`. If all complex roots of `P` have\
        \ the same rational square\n  absolute value `ν`, then `L = E[X]/(P)` is again CM.\n* `New.aeval_root_finAdele_surjective`,\
        \ `New.aeval_root_finAdele_eq_zero_iff`: for monic `P`, the\n  finite adeles `\U0001D538f L` are obtained\
        \ from `\U0001D538f E` by adjoining a root of `P`.\n* `New.IsFinAdelePresentation`: a map from polynomials\
        \ over `\U0001D538f E` presents `\U0001D538f L` as the quotient\n  by `P`, compatibly with `E[X] → L` and\
        \ with complex conjugation.\n* `New.adjoinRoot_cm_presentation`: these facts about `L` and `\U0001D538f\
        \ L` in one statement.\n"
