      text: "This file develops measure theory on hermitian quadrics over a \"place\" `A`. The result is a measure\n\
        that is written `Dirac(h(x, x) - Γ) dx` and is determined by the disintegration property. Quadrics\nand\
        \ disintegrations are indexed by skew elements `b`, with `Γ = δ⁻¹ * b` for a skew unit δ.\n\n* `New.Floors.Place`:\
        \ the data and properties of a place. Here `skewMeasure`, written ν, is a Haar\n  measure on the skew elements,\
        \ and `skewUnit`, written δ, is a skew unit. For hermitian Γ, the\n  element δΓ is skew (`New.Floors.Place.skewUnitMul`).\n"
    remainder:
      path: grh/src/Lib/General/Measure/QuadricDisintegration.lean
      line: 13
      endLine: 25
      text: "* `New.Floors.Place.flatChart`, `New.Floors.Place.quadricMeasure`: for hermitian `T`, an explicit\n\
        \  chart of `h(x, x) = δ⁻¹ * b`, and the image of the flat measure under it. Here `h` is a hyperbolic\n\
        \  plane plus `T` (`New.Floors.planeSumGram`).\n* `New.Floors.Place.IsDisintegration`: disintegrations along\
        \ `h(x, x)`. For hermitian `T`, the chart\n  measures form a disintegration of the volume (`New.Floors.Place.isDisintegration_quadricMeasure`).\n\
        \  Disintegrations are unique at every skew `b` (`New.Floors.Place.IsDisintegration.unique`). They\n  move\
        \ along a matrix `M` with `Mᴴ * J * M = T` that has a left inverse\n  (`New.Floors.Place.IsDisintegration.map`).\n\
        \nNotation: for a ring with involution, `skewAdjoint A` is the group of elements with `star x = -x`,\nand\
