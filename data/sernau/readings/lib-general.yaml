      line: 11
      endLine: 31
      text: "The last gives a condition under which a Hermitian form takes the value `1` on a subspace.\n\n## Main\
        \ definitions and results\n\n* `New.exists_orthonormal_mul`: the columns of a complex matrix with a left\
        \ inverse\n  (`New.HasLeftInv`) become orthonormal after right multiplication by an invertible matrix `b`\
        \ that\n  is block triangular for a given weight `wt` on the columns: `b i j = 0` whenever `wt j < wt i`.\n\
        * `New.IsTightFrame`: vectors of `\U0001D51E₀`, with multiplicities, that form a tight frame of `ℂ^Φ`.\n\
        * `New.exists_polar`: `g = k * z` with `k` unitary and `z` positive definite and an exponential.\n* `New.isAccretive_blockDiagPart_inv_mul`:\
        \ the block diagonal part of `g` is invertible and\n  `(blockDiagPart ε g)⁻¹ * g` is accretive.\n* `New.exists_mem_dotProduct_mulVec_eq_one`:\
        \ a Hermitian form on `ℂ^m` that is not negative\n  semidefinite on a subspace takes the value `1` on that\
        \ subspace.\n\nNotions from other files:\n* `New.signMatrix ε`: the diagonal matrix of the signs `ε`; `New.USign\
        \ ε` is its unitary group, the\n  invertible complex matrices `g` with `gᴴ * signMatrix ε * g = signMatrix\
        \ ε`.\n* `New.unitaryLie J`: the Lie algebra of this group for `J = signMatrix ε`: the real vector space\n\
        \  of complex matrices `X` with `Xᴴ * J + J * X = 0`; `New.expU X` is `exp X` in the group.\n* `Matrix.IsAccretive\
        \ z`: the matrix `z + zᴴ` is positive definite.\n* `New.WeilData E`: data on a CM field `E`; only its finite\
        \ idele `α` is used here.\n"
