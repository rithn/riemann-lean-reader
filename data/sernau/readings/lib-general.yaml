      path: grh/src/Lib/General/LinearAlgebra/IntegralLattices.lean
      line: 7
      endLine: 12
      text: 'This file studies matrices over a commutative ring `A` that are integral with respect to a subring

        `R`. The model is the ring of integral adeles inside the finite adeles. `New.IsIntMatrix R M` says

        that all entries of `M` lie in `R`. The property `New.IsValuationPair R` says that of two elements

        of `A` one divides the other over `R`, piece by piece along an idempotent of `R`. The file also

        defines column lattices and indices of lattices, and studies principal congruence subgroups of

        unitary groups.

        '
    remainder:
      path: grh/src/Lib/General/LinearAlgebra/IntegralLattices.lean
      line: 13
      endLine: 47
      text: "\n## Main definitions and results\n\n* `New.IsValuationPair.smith_normal_form`: a square matrix over\
        \ `A` is diagonalized by row and\n  column operations over a subring `R` that satisfies `New.IsValuationPair`.\n\
        * `New.exists_invTransposeGL_inv_eq`: for such a subring `O` of `R`, `gᵀ` lies in the double coset\n  `GL\
        \ n O * g * GL n O`.\n* `New.IsHeckeFunction.heckeFun_adjoint`, `New.IsHeckeFunction.heckeFun_comm`: adjoints\
        \ and\n  commutativity of Hecke operators for `K = GL n O`, with `O` a valuation subring of a field.\n*\
        \ `New.submoduleIndex`, `New.denomIndex`: the relative index of two `R`-modules, and the index of\n  the\
        \ denominator of `a`. An infinite index is read as `0`.\n* `New.colLattice`, `New.preimageLattice`: the\
        \ span of the columns of `M`, and the vectors `M` makes\n  integral.\n* `New.unitaryLevel`: the principal\
        \ congruence subgroup of the unitary group `New.U J`.\n\nNotions from other files:\n* `New.intGL n O`: for\
        \ a subring `O` of `R`, the subgroup of `GL n R` of matrices that have,\n  together with their inverse,\
        \ all entries in `O`.\n* `New.U J`: the unitary group of `J`, the `g` in `GL n R` with `gᴴ * J * g = J`.\n\
        * `New.heckeFun π K f`: the operator `∑ f g • π g`, summed over chosen representatives `g` of\n  `G ⧸ K`\
        \ (zero if infinitely many terms are nonzero).\n* `New.IsHeckeFunction K f`: `f` is left and right `K`-invariant\
        \ and supported on finitely many\n  cosets `g K`.\n* `New.levelSpace π K`: the vectors of the representation\
        \ `π` that are fixed by `K`.\n\n## Relation to the literature\n\nKnown result: Commutativity of the spherical\
        \ Hecke algebra of GL_n. This file proves the case that\nis used, by Gelfand's trick: over a valuation subring\
        \ of a field the Hecke operators commute on\nfixed vectors of a representation. Source: J. Tits, Reductive\
        \ groups over local fields, Corvallis\n1979, 3.3.3; T. Tamagawa, On the zeta functions of a division algebra,\
        \ Ann. Math. 77 (1963).\n\nPart of a known result: the valuation pairs and integral matrices of this file\
        \ are groundwork for\nWitt's extension theorem for unimodular hermitian lattices and for the Iwasawa decomposition\
        \ (see\n`Lib.Adelic.Witt.IwasawaDecomposition`).\n"
