      text: 'This file collects arithmetic lemmas on finite fields and on finite places of a CM field `E`. For

        `P` irreducible over a finite field with `q` elements and a root `x` of `P` in an extension `K`, the

        roots of `P` in `K` are the Frobenius conjugates `x^(q^i)`, `i < deg P`. For a CM field `E` with a

        primitive root of unity of order `5040`, a place fixed by conjugation has a norm that is a square,

        so places of prime norm are split. The file also contains two summation lemmas.

        '
    remainder:
      path: grh/src/Lib/General/NumberTheory/FrobeniusOrbits.lean
      line: 11
      endLine: 37
      text: "\n* `New.FinPlace E`: the finite places `w` of `E`, that is, the nonzero primes of `\U0001D4DE E`;\
        \ `star w` is\n  the complex conjugate of `w`.\n* `w.q`: the norm of `w`, that is, the number of elements\
        \ of its residue field.\n* `w.IsSplit`: the statement `star w ≠ w`.\n\n## Main definitions and results\n\
        \n* `New.card_selfAdjoint`: the size of a finite field with an involution that moves `√-1`.\n* `New.two_notMem_of_star_eq`:\
        \ if `E` contains an integer of trace `1` and even norm over its\n  maximal real subfield, a place with\
        \ `star w = w` does not lie above `2`;\n  `New.HasPrimitiveRoot5040.isSplit_of_two_mem` is the case of the\
        \ hypothesis\n  `New.HasPrimitiveRoot5040 E`.\n* `New.exists_sq_eq_q_of_star_eq`: if moreover `E` contains\
        \ `√-1`, such a place has norm\n  `w.q = r ^ 2` with `r % 4 = 3`; `New.HasPrimitiveRoot5040.exists_sq_eq_q_of_inert`\
        \ is the case\n  of the hypothesis `New.HasPrimitiveRoot5040 E`.\n* `New.finite_prime_q_star_eq`, `New.isSplit_of_q_prime`:\
        \ all but finitely many places of prime norm\n  are moved by the conjugation, and all of them under the\
        \ hypothesis `New.HasPrimitiveRoot5040 E`.\n* `New.root_pow_card_pow_eq_self_iff`, `New.root_pow_card_pow_eq_iff_modEq`:\
        \ `x^(q^n) = x` iff\n  `deg P ∣ n`, and `x^(q^a) = x^(q^b)` iff `a ≡ b` modulo `deg P`.\n* `New.aroots_eq_frobenius_orbit`,\
        \ `New.aroots_pow_eq_frobenius_orbit`: with multiplicity, the roots\n  of `P` in `K` are the `x^(q^i)` for\
        \ `i < deg P`, and the roots of `P^j` are the `x^(q^i)` for\n  `i < deg (P^j)`.\n\n## Relation to the literature\n\
        \nKnown: standard facts on finite fields and on residue fields of CM fields.\n"
