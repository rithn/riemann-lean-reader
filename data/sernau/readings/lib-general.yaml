      endLine: 15
      text: 'In the strong integral, operator-valued functions are integrated vector by vector, so no

        measurability in the operator norm is needed. In the results on analytic families, E is a

        finite-dimensional complex normed space, K a compact R₁ space and f : E → K → ℂ a family of

        functions on K with parameter in E. The file also contains the Schwarz lemma in normed spaces,

        holomorphy of dominated parameter integrals, a uniqueness result for analytic functions along

        submersions, and Euler''s beta integral together with Hua''s bound for negative powers of

        determinants.

        '
    remainder:
      path: grh/src/Lib/General/Analysis/HolomorphicIntegrals.lean
      line: 16
      endLine: 37
      text: "\n## Main definitions and results\n\n* `New.strongIntegral`: the operator `x ↦ ∫ y, F y x ∂μ`, when\
        \ this map is a bounded operator.\n* `New.DiscreteSeries.IsAnalyticFamily`: the map x ↦ f(x, ·) into the\
        \ Banach space C(K, ℂ) is\n  analytic at a point.\n* `New.DiscreteSeries.IsAnalyticFamily.analyticAt_integral`:\
        \ then x ↦ ∫ f(x, k) dμ(k) is analytic,\n  for a finite Borel measure μ.\n* `New.analyticAt_of_eventually_differentiableAt`:\
        \ a map between finite-dimensional complex spaces\n  that is differentiable near p is analytic at p.\n*\
        \ `New.eventually_differentiableAt_integral`: an integral of holomorphic functions of a parameter in\n \
        \ a finite-dimensional space, dominated by an integrable function, is holomorphic.\n* `New.hua_integral_le`:\
        \ Hua's bound for the integral of a negative power of `|det (M + Yᴴ Y)|`,\n  where `Y = X S + A`, over the\
        \ rows of `X`, one row at a time;\n  `New.lintegral_norm_det_add_inv_pow_le` is a cruder form for `Y = S\
        \ X + c` and at least seven\n  columns.\n\n## Relation to the literature\n\nKnown result: an upper bound\
        \ for Hua's determinant integral. The integral is bounded only from\nabove, with an affine change of the\
        \ rows, instead of being computed exactly. Source: Hua, Harmonic\nAnalysis of Functions of Several Complex\
        \ Variables in the Classical Domains, AMS 1963.\n"
