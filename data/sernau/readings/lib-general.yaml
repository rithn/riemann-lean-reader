      text: "This file collects linear algebra on eigenvalues and characteristic polynomials. It expresses traces\n\
        of powers and determinants such as `det (1 - c N)` through the roots of the characteristic\npolynomial.\n\
        \n## Main definitions and results\n\n* `New.exists_eigenvector_of_commute`: common eigenvectors of endomorphisms\
        \ that preserve a\n  finite-dimensional subspace `S` and commute on it, over an algebraically closed field.\n\
        * `New.exists_eigenvector_of_trace_mul_eq`: if twisted traces of a commuting family `A'` are\n  proportional\
        \ to traces of a commuting family `A`, a generalised eigensystem of `A` on which one\n  operator has non-zero\
        \ trace extends to an eigensystem of `A'` that is invariant under the twist.\n"
    remainder:
      path: grh/src/Lib/General/LinearAlgebra/Eigenvalues.lean
      line: 17
      endLine: 32
      text: "* `New.amitsur_charpoly_mem_of_span` (Amitsur): for an algebra map to matrices, it suffices to check\n\
        \  on a spanning set that the coefficients of the characteristic polynomials lie in the base ring.\n  The\
        \ proof works with det (1 - t ρ(w)) modulo a power of t and factors 1 - t ρ(w) step by step.\n* `New.isConj_diagonal_of_isRoot_charpoly`:\
        \ a complex square matrix whose characteristic polynomial\n  vanishes at pairwise distinct numbers x_i,\
        \ one for each index i, is conjugate to the diagonal\n  matrix with entries x_i.\n* `New.sylvester_law_of_inertia`:\
        \ Sylvester's law of inertia for sign matrices.\n\n## Relation to the literature\n\nKnown result: Amitsur's\
        \ theorem that integral characteristic polynomials on a spanning set give them\non the whole algebra. It\
        \ is a consequence of Amitsur's formula for the characteristic polynomial of\na sum of matrices. Source:\
        \ S. A. Amitsur, On the characteristic polynomial of a sum of matrices,\nLinear and Multilinear Algebra\
        \ 8 (1980), no. 3, 177-182; G. Chenevier, The p-adic analytic space of\npseudocharacters of a profinite\
        \ group and pseudorepresentations over arbitrary rings, LMS Lecture\nNote Ser. 414 (2014), (1.5).\n"
