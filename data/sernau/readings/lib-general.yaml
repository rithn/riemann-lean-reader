      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.Variety.absFrobenius f X`: the absolute `l ^ f`-Frobenius\
        \ of a scheme `X` over a field of\n  characteristic `l`. It acts on `B`-valued points through `x ↦ x ^ l\
        \ ^ f` on `B`\n  (`New.Variety.comp_absFrobenius`), commutes with all morphisms and fixes the underlying\
        \ space.\n* `New.Variety.eventually_span_coordSection`: let `N` be a projective embedding of an integral\n\
        \  scheme over a field and `p` a base change to a noetherian ring. For large `m` the monomials of\n  degree\
        \ `m` in the coordinates span the sections of `(p^* N) ^ m`.\n* The instance `New.isProper_pi`: the product\
        \ in `Over S` of a finite family of proper schemes over\n  `S` is proper over `S`.\n* `New.Variety.HasProjEmbedding.of_isClosedImmersion_pi`:\
