      text: "A power series over `ℂ_[p]` is called integral if it comes, through `New.seriesToCp`, from a series\n\
        with coefficients in the ring of integers of `ℂ_[p]`.\n\n## Main definitions and results\n\n* `New.mem_range_seriesToCp`:\
