      text: "\n## Main definitions and results\n\n* `New.Variety.LongExactSeq`, `New.Variety.LongExactSeq.Hom`:\
        \ the sequences and their morphisms.\n* `New.Variety.LongExactSeq.Hom.four_lemma` (four lemma) and\n  `New.Variety.LongExactSeq.Hom.five_lemma`\
        \ (five lemma).\n* `New.Variety.LongExactSeq.contravariant`, `New.Variety.LongExactSeq.covariant`: the long\
        \ exact Ext\n  sequences of a short exact sequence in the first and in the second variable;\n  `New.Variety.Comparison.pull_hom_contravariant`\
        \ and `New.Variety.Comparison.pull_hom_covariant`\n  say that comparison maps give morphisms between them.\n\
        * `New.Variety.isCohomEquiv_iff_subsingleton`: in a short exact sequence 0 → X₁ → X₂ → X₃ → 0, the\n  map\
        \ X₁ → X₂ is an equivalence for F iff the quotient X₃ has no cohomology with values in F.\n* `New.Variety.H.sigma_bijective`:\
