        \  separated, and covered by one affine after restriction along a functor `ι : C ⥤ CommAlg k`.\n* `New.Variety.EtaleChart`,\
        \ `New.Variety.IsChartCovered`, `New.Variety.HasAtlas`: affine open charts\n  with étale coordinates, and\
        \ covers of the field-valued points by charts.\n* `New.Variety.etale_polyEval_iff`: for `k` Noetherian and\
        \ `R` of finite type, coordinates are étale\n  iff maps lift uniquely along square-zero extensions once\
        \ the values of the coordinates are lifted.\n* `New.Variety.HasAtlas.exists_isCharting`: an atlas gives\
        \ a subfunctor satisfying\n  `New.Variety.IsCharting`. It is found as a finite union of charts whose coordinates\
        \ are units,\n  that is, of pieces étale over a torus.\n* `New.Variety.Comparison.isClosedClass`: for a\
        \ comparison of cohomologies on categories over `D`,\n  the functors on `D` for which it is bijective form\
        \ a closed class\n  (`New.Variety.IsClosedClass`: contains `0` and, given a short exact sequence whose first\
        \ term is\n  in it, contains the second term iff the third).\n* `New.Variety.IsCharted`: a scheme is charted\
        \ if its functor of points has a subfunctor satisfying\n  `New.Variety.IsCharting`.\n\nNotions from other\
        \ files:\n* `New.Variety.IsPointwiseSurjective p`: the map `p : E ⟶ Y` of functors is surjective on `A`-points\n\
