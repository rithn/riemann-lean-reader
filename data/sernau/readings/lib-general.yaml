      endLine: 12
      text: 'This file collects tools for passing between points of schemes over a countable ring and complex

        points, and for building Galois coverings from complex points: extensions of embeddings of countable

        rings into ℂ, an injective character of the algebraic closure of a finite field, Zariski generic

        members of holomorphic families, reduced closures of families of complex points, and criteria for

        coverings to be étale or smooth.

        '
    remainder:
      path: grh/src/Lib/General/Geometry/GaloisCovers.lean
      line: 13
      endLine: 48
      text: "\n## Main definitions and results\n\n* `New.exists_ringEquiv_extend`: two embeddings of a countable\
        \ ring, into `ℂ` and into an\n  algebraically closed field of the same cardinality, are matched by an isomorphism\
        \ of the fields\n  (Steinitz's classification, relative to the ring).\n* `New.exists_ringHom_complex_extend`\
        \ lets one view a point over a field of cardinality at most that\n  of ℂ as a complex point, compatibly\
        \ with given embeddings of a countable base ring in the field\n  and in ℂ.\n* `New.Variety.exists_generic_member`:\
        \ if `X` is locally of finite type over a countable ring and\n  `φ` is a holomorphic family of complex points\
        \ of `X` on a connected open set `U`, some `φ b`\n  specialises, in the Zariski topology, to every `φ c`.\n\
        * `New.Variety.ReducedClosure`: the reduced closure in a finite product of schemes over `S` of a\n  family\
        \ of complex points; `New.Variety.ReducedClosure.exists_lift` constructs maps between two\n  such closures.\n\
        * `New.Variety.isGaloisCovering_of_complex_points`: over a countable domain whose maps to fields of\n  characteristic\
        \ 0 are injective, a surjective map from a proper to a separated scheme, with a\n  finite group acting simply\
        \ transitively on its fibres of complex points, is a Galois covering.\n* `New.Variety.IsGaloisCovering.smoothOfRelativeDimension_baseChange`:\
        \ for a Galois covering\n  `W → Z` over a domain `R`, with `W` proper and reduced and `Z` separated and\
        \ smooth, the base\n  change of `W` to a field of characteristic 0 containing `R` is smooth.\n\nNotions\
        \ from other files:\n* `New.Variety.IsGaloisCovering`: Δ is a finite group of automorphisms of W over c\
        \ : W → Z, c is\n  surjective, and Δ acts simply transitively on the fibres of c on points with values in\
        \ fields of\n  characteristic 0.\n* `New.LandsIn t U`: the morphism t lands in the open U, that is, the\
        \ preimage of U is everything.\n* `New.HolomorphicAt φ w`: for every function regular on an open set containing\
        \ φ w, the nearby\n  members of the family φ land in that open set and the function pulls back to one analytic\
        \ at w.\n  The parameter space is a finite-dimensional complex normed space (`FinComplexSpace`).\n* `New.IsSeparatingFamily\
        \ ξ`: the scheme is reduced and the complex points ξ z are dense in it.\n\n## Relation to the literature\n\
        \nThe isomorphisms of fields come from Steinitz's theorem, and the étaleness criterion is that of\nChase–Harrison–Rosenberg.\n"
