      line: 6
      endLine: 12
      text: 'This file proves mean value facts for circle averages and a halving criterion for upper bounds. It

        develops the algebra of Taylor series at 0 of analytic functions and proves an elementary bound of

        x^l by a factorial and exponentials. It also gives smoothness rules for matrix operations and

        extends analytic germs to globally smooth maps.


        The imported notion `New.taylorAtZero f` is the formal power series whose `n`-th coefficient is

        `iteratedDeriv n f 0 / n !`, the Taylor series of `f : ℂ → ℂ` at 0.

        '
    remainder:
      path: grh/src/Lib/General/Analysis/MeanValueAndTaylor.lean
      line: 13
      endLine: 30
      text: "\n## Main definitions and results\n\n* `New.taylorAtZero_mul`, `New.taylorAtZero_comp_mul`, `New.eq_of_taylorAtZero_eq`:\
        \ Taylor series\n  at 0 of products and of `z ↦ f (a * z)`; such a series determines an entire function.\n\
        * `New.integral_eq_of_circle_mean`: an integral is unchanged when the integrand is replaced by its\n  mean\
        \ over a family of measure preserving maps indexed by the circle `ℝ / ℤ`.\n* `New.integral_comp_toCircle_eq_apply_zero`:\
        \ the mean value property over the unit circle of a\n  function holomorphic on the closed unit disc, for\
        \ the Haar probability measure of `ℝ / ℤ`.\n* `New.le_of_halving`: let `c ≥ 0`. A function bounded above\
        \ is at most `c` if each of its bounds\n  can be halved at the points where it exceeds `c`.\n* `New.exists_contDiff_eventuallyEq`:\
        \ a map on a finite-dimensional space that is of class `C^ω`\n  at a point agrees near it with a globally\
        \ smooth map.\n\n## Relation to the literature\n\nThe results of this file include the mean value property\
        \ of holomorphic functions and the fact that\nan entire function is determined by its Taylor series at 0.\n"
