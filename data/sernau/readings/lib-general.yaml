      endLine: 31
      text: "\n## Main definitions and results\n\n* `New.extendGL`: the embedding g ↦ diag(g, 1); `New.submatrix_extendGL`\
        \ and\n  `New.extendGL_apply_of_notMem_range` give its block g and its rows outside that block.\n* `New.rangeParabolic`,\
        \ `New.mem_rangeParabolic_iff`: the opposite parabolic for the two blocks, and\n  its description in entries.\n\
        * `New.index_rangeParabolic_mul_card_GL`, `New.index_stabilizer_inclMatrix`: the index of the\n  opposite\
        \ parabolic times |GL_r(R)| is the index of the group that fixes the basis vectors of\n  the first block,\
        \ and over a finite field the latter index is computed.\n* `New.residueDatum`: a function of adelic matrices\
