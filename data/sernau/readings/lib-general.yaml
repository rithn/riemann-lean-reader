      startOffset: 165
      endOffset: 1011
      text: 'The file first shows that, over an algebraically closed valued field, there is an integral point at

        which finitely many given polynomials are at least as large as all their coefficients. It then

        bounds the coefficients of power series built by exponentials, logarithms and roots over `ℂ_[p]`.

        There `v` denotes the additive valuation with `v(p) = 1`, so that `‖c‖ = p ^ (-v(c))`, and `v(g)`

        for a series `g` is the infimum of the valuations of its coefficients. `expSubst g` is `exp ℂ_[p]`

        substituted at `g`, written `exp g`, and `logOf f` is `log ℂ_[p]`, the series of `log (1 + X)`,

        substituted at `f - 1`, written `log f`. For `g(0) = 0` it proves that `exp g` is integral when

        `v(g) ≥ 1 / (p - 1)`, gives a divisibility criterion for `exp g - 1`, and shows that `exp g` lies in

        a ring `𝒪[[T]]` if its `m`-th power does, for `m` prime to `p`.'
    remainder:
      path: grh/src/Lib/General/Algebra/SeriesBounds.lean
      line: 15
      endLine: 42
      startOffset: 1011
      endOffset: 2452
      text: "\n\nThe imported notions used in the statements are these.\n\n* `seriesToCp` is the inclusion of the\
        \ series with integral coefficients into all series over\n  `ℂ_[p]`. Its range consists of the series whose\
        \ coefficients have norm at most `1`.\n* `IsSeriesGenerator B T` says that `T = X + ⋯` and that `B` is the\
        \ ring of all integral series in\n  `T`, written `B = \U0001D4AA[[T]]`.\n\n## Main definitions and results\n\
        \n* `New.exists_val_coeff_le_val_eval`: at one integral point, finitely many polynomials are at least\n\
        \  as large as all their coefficients.\n* `New.norm_coeff_expSubst_le_one`: `exp g` is integral if `g(0)\
        \ = 0` and `v(g) ≥ 1 / (p - 1)`,\n  degree by degree.\n* `New.norm_coeff_expSubst_sub_one_le`, `New.IsSeriesGenerator.mem_of_expSubst_smul_eq`:\
        \ for\n  `v(c) ≥ 1 / (p - 1)` and `g(0) = 0`, the number `c` divides `exp g - 1` if it divides `g`, and,\n\
        \  for `c ≠ 0` and in a ring `\U0001D4AA[[T]]`, `c` divides `g` if it divides `exp g - 1`.\n* `New.IsSeriesGenerator.expSubst_mem_of_pow_mem`:\
        \ if `g(0) = 0` and `(exp g) ^ m ∈ \U0001D4AA[[T]]` with `m`\n  prime to `p`, then `exp g ∈ \U0001D4AA[[T]]`.\n\
        \n## Relation to the literature\n\nKnown result: the Gauss norm equals the supremum norm on the unit polydisc\
        \ over an algebraically\nclosed valued field. Source: Bosch, Güntzer and Remmert, *Non-Archimedean Analysis*.\n\
        \nKnown result: the integrality of the `p`-adic exponential and logarithm on series of large enough\nvaluation,\
        \ and of the binomial series with exponent in `ℤ_p`.\n"
