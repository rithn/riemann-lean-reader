      path: grh/src/New/Congruences/FirstOrder/EvenClasses.lean
      line: 8
      endLine: 14
      text: 'The file concerns cocycles of `Gal(Ω/E)` in the twists `O/ℓ^ν(-e)`. Here `Ω` is the algebraic

        closure of `ℚ`, `E ⊆ Ω` is a CM field containing the `5040`-th roots of unity

        (`New.CMFieldWithRoot5040`), and `O` is the ring of integers of a finite Galois extension of `ℚ_ℓ`

        (`New.CoeffRing`). Further, `cyc` is the `ℓ`-adic cyclotomic character (`New.cyclotomicChar`),

        `cyc mod N` is the one modulo `N` (`New.cyclotomicCharMod`), and `g^c = conjGal g` is the conjugate

        of `g` by the chosen complex conjugation. The reciprocity law for even classes is in

        `New.Congruences.FirstOrder.KummerMaps`.

        '
    remainder:
      path: grh/src/New/Congruences/FirstOrder/EvenClasses.lean
      line: 15
      endLine: 42
      text: "\n## Main definitions and results\n\n* `New.Selmer.evenClasses`: the even classes, that is the cocycles\
        \ unramified off `ℓ` and a set of\n  places and its conjugate that are invariant under `g ↦ g^c` and zero\
        \ on the kernel of\n  `cyclotomicChar` in the decomposition groups above `ℓ`.\n* `New.Selmer.IsTameGeneratorFamily`:\
        \ places `w j` off `ℓ`, tame generators `τ j`, and `φ j` fixing\n  `μ_{ℓ^ν}`; `New.Selmer.withConjInv f`\
        \ doubles a family by the `(f j ^ c)⁻¹`, which serve the\n  conjugate places.\n* `New.Selmer.IsPrimeTriangle`:\
        \ an even class that kills the earlier elements `τ i`, and `φ i` of\n  the same exponent, is killed at `τ\
        \ j` up to a bounded power of `ℓ`.\n* `New.Selmer.IsAuxTwist`: an auxiliary set of places with an anticyclotomic\
        \ character whose values\n  at tame generators are not too close to `1`.\n* `New.Selmer.IsTameGeneratorFamily.mem_selmerModule_of_tame_eq_zero`:\
        \ killing the doubled tame\n  generators removes the ramification at the places `w j` and their conjugates.\n\
        * `New.Selmer.eq_zero_of_forall_mem_Z1_of_mem_evenClasses`: to show that an element `b` of\n  `O / ℓ ^ ν`\
        \ vanishes, given an even class `c`, it is enough to test `b` with the additive maps `u`\n  to `ℤ/ℓ ^ ν`\
        \ for which `u ∘ c` is a cocycle of the twist `-e`; in fact every `u` has this\n  property.\n\nNotions from\
        \ other files:\n* `New.selmerModule ρ S L B`: the locally constant cocycles of `ρ` with values in `B` that\n\
        \  are unramified outside `S` and satisfy the relations `L`.\n* `New.Selmer.tateTwist ℓ E O e`: the character\
        \ `cyclotomicInv ℓ E O ^ e` as `1 × 1` matrices, where\n  `cyclotomicInv` is `cyc⁻¹` with values in `O`.\n\
        * `New.Selmer.shaLocalSet ℓ E 1`: the elements of decomposition groups above `ℓ` with `cyc = 1`.\n* `New.Z1`\
        \ and `New.charRep`: the continuous cocycles of a representation, and the representation\n  given by scalars\
        \ through a character.\n"
