      text: "\n## Main definitions and results\n\n* `New.Selmer.isMainSummandWeights_mainPair`: the single jump\
        \ of a main pair obeys\n  `New.Selmer.IsMainSummandWeights` in rank `1`.\n* `New.Selmer.isMainSummandWeights_descentPair`:\
        \ the jumps built from `New.Data.targetParameter` and\n  `New.Data.liftWeight` obey `New.Selmer.IsMainSummandWeights`\
        \ in rank `D.r`.\n* `New.Selmer.exists_isMainSummand_of_isRepOfType`: take a representation `R` with admissible\
        \ labels\n  whose shifted jumps obey `New.Selmer.IsMainSummandWeights`. Assume its traces are limits of\
        \ the\n  values of `b`. Then it gives a representation `T` with `New.Selmer.IsMainSummand O b T`.\n* `New.Selmer.exists_isMainSummand_descentPair`:\
        \ a Hecke eigensystem of a good form on\n  `D.spaceW D.m` gives a main summand for each descent pair of\
        \ the trivial twist.\n\nNotions from other files:\n* `New.Selmer.IsMainSummandWeights D r t J`: numerical\
        \ conditions on the jumps `J σ`, a multiset of\n  integers for each complex embedding `σ` of the CM field\
        \ `D.E`.\n* `New.Selmer.IsMainSummand O z T`: `T` is like a main summand, and for every twist of the pair\
        \ `O`\n  by a tame character `ϑ` the normalised representation attached to a lift of the system `z` has\
        \ the\n  trace of `T` twisted by `ϑ⁻¹` plus a string of powers of the inverse cyclotomic character.\n* `New.Selmer.IsLiftSetting\
        \ O c ϑ`: the descent pair `O` fits the twist `ϑ` and the labels `c` are\n  admissible.\n* `New.Selmer.IsRepOfType\
        \ O k J c S R`: `R` is a conjugate self-dual representation of level `S`\n  (`New.Selmer.IsConjSelfDualOfLevel`)\
        \ with jumps `J`, and inertia at the chosen places acts through\n  the roots of the labels `c`.\n* `New.Data.goodForms`,\
        \ `New.Data.eigenPart`: the image of the idempotent e₀ on forms of principal\n  level at the chosen places,\
        \ and the forms on which the Hecke operators act by given scalars.\n\n## Relation to the literature\n\n\
