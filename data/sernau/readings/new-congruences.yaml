      line: 6
      endLine: 12
      text: 'A tame chart `New.Lift.TameChart` is a Kummer chart `New.Lift.KummerChart`, with coordinate `z` and

        exponent `e`, together with an element `s` of inertia. The power `s ^ k` multiplies `z` by `ξ ^ k`,

        for some `ξ` in Λ = W(𝔽_{p^f}) that is a primitive e-th root of unity modulo `p`. The degree of a

        polynomial that kills the operator induced by `s` bounds the power of `p` that kills the cokernel of

        the map of Kisin modules attached to an extension of a trivial lattice `C` by a lattice `Y`. The

        file also shows that, if Γ maps onto G_p, tame charts exist for each ramification index e dividing

        p^f − 1, when p does not divide f.

        '
    remainder:
      path: grh/src/New/Congruences/Lifting/TameCharts.lean
      line: 13
      endLine: 33
      text: "\n## Main definitions and results\n\n* `New.Lift.TameChart.exists_z_smul_eq_sum_tameGen`: if a polynomial\
        \ `q` over `ℤ_p` kills the\n  operator β induced by `s`, then `q(s)` maps the Kisin module into `z` times\n\
        \  `New.Lift.KummerChart.JumpLattice.kisinAinf`.\n* `New.Lift.TameChart.killsCokernel_of_isKilledBy`: if\
        \ `Y` is potentially crystalline and a monic\n  `q` kills β on `Y`, then `p ^ κ` kills the cokernel, that\
        \ is, multiplies the constants of `C` into\n  the image, as soon as `m (deg q + 1) ≤ κ`, `e ≤ p ^ m` and\
        \ `p` is large against `κ` and the jumps.\n* `New.Lift.exists_tameChart`: tame charts exist.\n\nNotions\
        \ from other files:\n* `New.Lift.WittFq`: The ring Λ = W(\U0001D53D_{p^f}) of constants, \U0001D53D_{p^f}\
        \ taken inside the tilt O^♭.\n* `New.Period.linearFrob`: For s in inertia, `linearFrob ρ s 0` is the B-linear\
        \ operator β on B ⊗ T\n  (B = `Bmax`) that acts as s on the vectors fixed by the elements of Γ near 1.\n\
        * `New.Lift.KummerChart.Letter`: A letter is a unit i of \U0001D53D_{p^f}. The coefficient ring O carries\
        \ an\n  element ζ with ζ^{p^f−1} = 1, and the letter-i part of W(C^♭) ⊗ L is where ζ acts as [i].\n\n##\
