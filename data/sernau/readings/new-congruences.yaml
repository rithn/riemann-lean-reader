    excerpt:
      path: grh/src/New/Congruences/FirstOrder/FittingBlock.lean
      line: 7
      endLine: 12
      text: 'This file bounds Fitting ideals of modules `R^s / N` over `R = O[X j]`, `O` a discrete valuation

        ring, through modules of functions, and states the conditions on traces and on common Ribet

        elements. Each index `j : J` carries two pairs `τ j`, `τ'' j` and `φ j`, `φ'' j` of elements of `G`.

        In the application `τ'' j` is the inverse of the conjugate of `τ j`, so that `c (τ j) - c (τ'' j)`

        is the value at `τ j` of the sum of a cocycle `c` and its conjugate, an even class; likewise for

        `φ`. The file also gives the linear algebra for several characters and for the main summand.

        '
    remainder:
      path: grh/src/New/Congruences/FirstOrder/FittingBlock.lean
      line: 13
      endLine: 30
      text: "\n## Main definitions and results\n\n* `New.Selmer.HasTriangleCost`, `New.Selmer.exists_mul_prod_X_mem_fittingIdeal`:\
        \ if the module of\n  functions `New.Selmer.formsMod` attached to `N ⊆ R^s`, `R = O[X j]`, satisfies a triangular\n\
        \  condition along a finite set `I` of indices and a bound on lengths, then the Fitting ideal of\n  `R^s\
        \ / N` contains `∏ j ∈ I, X j` times a polynomial whose constant coefficient has bounded\n  valuation.\n\
        * `New.Selmer.IsTraceIdeal`: an algebra `S` of families of polynomials in variables `X j` holds the\n  characteristic\
        \ polynomials, and an `S`-submodule `\U0001D4A5` holds the traces of given relations.\n\nNotions from other\
        \ files:\n* `New.Selmer.fittingIdeal N`: the ideal of `R` generated by the determinants of square matrices\n\
        \  with all rows in `N ⊆ R^ι`, the zeroth Fitting ideal of `R^ι / N`.\n* `New.Selmer.formsMod Φ z N p`:\
        \ the functions `g ↦ Ψ (z g)` on `G`, where `Ψ : O^n → O / p` runs\n  over the `O`-linear maps that vanish\
        \ on `Φ⁻¹ N`.\n* `New.Selmer.ribetCocyclesIn u ρ B`: the cocycles `G → B^d` for `ρ` that obey the linear\
        \ relations\n  among the families `(u x g - 1)_x`.\n"
