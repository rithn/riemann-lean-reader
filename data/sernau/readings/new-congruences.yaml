      endLine: 47
      text: "\n## Main definitions and results\n\n* `New.Lift.KummerChart.JumpLattice.constantsModE`: the constants\
        \ modulo E^A, with exponents\n  `New.Lift.KummerChart.JumpLattice.shiftedStdOrders`.\n* `New.Lift.KummerChart.PairingSide.pointsOver_nonempty_of_long_gap`:\
        \ the long gap lemma. On an\n  unramified Kummer chart, if `E ^ s` kills the cokernel at `i` and `p ^ κ`\
        \ kills it at\n  `i.stepBack l`, the jumps at `i` and the `l - 1` letters before it are at most `g`, `3\
        \ ≤ p ^ l`,\n  `A ≤ p ^ l * δ`, and there is the long gap `s + g * ∑ a < l, p ^ a < A`, then a constant\
        \ of the\n  trivial lattice lifts, up to a power of p, to a point of the extension at `i` with a large order\n\
        \  at E at the very negative jumps.\n\nNotions from other files:\n* `New.Lift.KummerChart`: a ring `k.S`\
