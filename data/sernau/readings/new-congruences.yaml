        \ a ring of coefficients O, a finite free Z_p-algebra with an element\n  ζ such that ζ^{p^f−1} = 1; ζ cuts\
        \ out the letters.\n* `New.Lift.KummerChart.Letter`: the letters of a Kummer chart, that is, the multiplicative\
