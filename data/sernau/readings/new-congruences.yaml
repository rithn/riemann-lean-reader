      line: 7
      endLine: 12
      text: 'Forms of the base data `D` are taken at principal level at the auxiliary places `Q.place j`. Each

        isotypic space `x` has a Galois representation `N x`. This is the twist of `x.galRep` by a character

        `a` that is trivial at the tame generators. This file builds the first-order term `∂` at one place.

        It then builds the family `∏ (Nm j + α j ∂ j)` that kills the ideal of the tied relations. Finally

        it shows that the top coefficient of Ribet''s element clears the denominator of the projection to the

        lifts.

        '
    remainder:
      path: grh/src/New/Congruences/FirstOrder/AuxiliaryPrimeTie.lean
      line: 13
      endLine: 60
      text: "\n## Main definitions and results\n\n* `New.Patching.BaseLevel.exists_mul_traceElement_tameGenerator_eq_frob`:\
        \ the first-order term `∂`\n  at one place.\n* `New.Patching.BaseLevel.exists_deformed_norm_family`: the\
        \ family `∏ (Nm j + α j ∂ j)`, with `Nm j`\n  the sum over `GL_n` of the residue field of `Q.place j` and\
        \ `α j` variables, kills the ideal of\n  the tied relations and, up to powers of a Hecke operator `δ`, factors\
        \ through the base level; both\n  hold modulo `ℓ ^ ν / (2 n!)`.\n* `New.Patching.BaseLevel.smul_top_coeff_mem_ellIntegralForms`,\n\
        \  `New.Patching.BaseLevel.exists_diagOp_mem_ellIntegralForms`: the top coefficient of Ribet's\n  element\
        \ clears the denominator of the projection to the lifts.\n\nNotions from other files:\n* `New.Patching.BaseLevel.formsOfLevel`,\
        \ `New.Patching.BaseLevel.Eigensystem`: the forms of the type\n  fixed by `D` that have principal level\
        \ at the places `L j` and maximal level at the other places\n  off `D.places` and its conjugate. The empty\
        \ family `L = ![]` gives the base level. Systems of\n  level `L` are the isotypic spaces (`New.Patching.Isotypic`,\
        \ spaces of forms with given Hecke\n  eigenvalues at almost all places) that contain a nonzero form of level\
        \ `L`.\n* `New.Patching.BaseLevel.integralEnd`, `New.Patching.BaseLevel.localOperators`: the endomorphisms\n\
        \  of the forms of level `L` that preserve the integral forms, and those among them that come from\n  integral\
        \ combinations of translations supported at `Q.place j` and its conjugate.\n* `New.Patching.BaseLevel.heckeAlgebra`,\
        \ `New.Patching.BaseLevel.heckeAction`: the `ℓ`-adic\n  functions `t` on systems such that scaling each\
        \ system `x` by `ιℓ.symm (t x)` preserves the\n  integral forms, and the operator that such a function defines.\n\
        * `New.Patching.BaseLevel.traceElement` (in `New.Congruences.FirstOrder.TiedTraces`): the trace\n  `x ↦\
        \ tr (P(N x h) N x g)` on systems of level `L`, as a member of the Hecke algebra.\n* `New.Patching.BaseLevel.tiedIdeal`\
        \ (in `New.Congruences.FirstOrder.TiedTraces`): the ideal of\n  `\U0001D54B[α]` generated by the `ℓ ^ ν\
        \ tr[g]` and the traces of the tied relations\n  `r j = γ j - 1 - α j (φ j - 1) H j (φ j)`.\n\n## Relation\
        \ to the literature\n\nThe norm map from one deep auxiliary level to the base level is deformed in parameters,\
        \ one per\nplace, that tie tame inertia to Frobenius. The top coefficient of Ribet's Hecke element, a\n\
        polynomial in these parameters, clears the denominator of the projection to lifts up to a known\nfactor;\
        \ the orders of the even classes do not enter the bound. Auxiliary tame level and first-order\nderivatives\
        \ in diamond operators occur in the literature in other settings. Related work: Wiles, The\nIwasawa conjecture\
        \ for totally real fields, 1990; Lecouturier, Mazur–Tate conjecture for prime\nconductor, 2019; Dotto–Thorne,\
        \ Residually reducible representations of rank 2, 2026.\n\nAt a suitable Frobenius element, the Hecke polynomial\
        \ of a weak lift is a full chain of roots times\na factor that is integral once normalised. With the chain\
        \ lemma this gives, at each added place, an\nintegral operator on forms under which the tie of inertia to\
        \ Frobenius holds and weak lifts do not\nmove. In the literature the chain lemma follows from the spherical\
        \ unitary dual and Jacquet modules.\nRelated work: Tadić, Spherical unitary dual of GL(n), 1986; Casselman,\
        \ Unramified principal series\nof p-adic groups I, 1980; Clozel–Harris–Taylor, Automorphy for some l-adic\
        \ lifts (Lemma 3.1.3,\n§3.4), 2008.\n"
