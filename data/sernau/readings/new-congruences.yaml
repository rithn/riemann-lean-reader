        \ of `O[X j][G]` spanned by what every\n  `u x` kills, `p I`, the relations that tie `τ k` to `φ k`, and\
        \ `I ρ₀`, with `I` the augmentation\n  ideal; and the rows whose element lies in it. The actions are `polyAction`\
