        \ twisted main summand `ψ R` plus the characters\n  `O(-e)`, `e < t`, and let the twisted lattice `ψ' R₀`\
        \ span all matrices over `O`. Then `R'` has a\n  lattice that is block diagonal with summands `ψ' R₀` and\
        \ the characters.\n* `New.Selmer.crystallineColength_le_sum_dualDefect`: at each place `v` above `ℓ` let\
