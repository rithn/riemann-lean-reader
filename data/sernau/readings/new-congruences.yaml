      endLine: 43
      text: "\n## Main definitions and results\n\n* `New.Selmer.isConjSelfDual_of_attached`: a Galois representation\
        \ `r` of rank `n` attached to a\n  Hecke eigenform (`New.GaloisRep.Attached`) satisfies `New.Selmer.IsConjSelfDual`.\
        \ In particular,\n  tr r(g^c) = χ(g)^(n-1) tr r(g⁻¹) with χ = `New.Selmer.cyclotomicInv`. The Hecke operators\
        \ at w and\n  w̄ are dual (`New.heckeSplit_dual`), which gives the relation for most Frobenii. It passes\
        \ to\n  every g along the filter `New.mostFrobeniiAt`.\n* `New.Selmer.isRepOfType_of_hasProductLabel`: the\
        \ representation attached to a labelled eigenform\n  is a representation of a type.\n\nNotions from other\
        \ files:\n* `New.Data.descentPair`: The j-th descent pair (`New.DescentPair`) for ϑ: W = W_j of rank r,\n\
        \  V = I_{r+t}, the character μ_j⁰ϑ of weight −w_j, and the places `New.Data.levelPlaces`.\n* `New.Data.CriticalPair.IsMainPair`:\
        \ A pair `p = (p.character, z)` with `p.character` of weight\n  `-c` is a main pair for `j` if the index\
        \ type `RankOneIndex z` has `2 z` elements and `2 ≤ z`\n  (`HasLiftRank`), `m < z ≤ r`, `1 ≤ j ≤ m`, the\
        \ tame part of `p.character` is `D.chiMLocal ^ j`\n  (`D.chiMLocal` the tame character of the data), and\
        \ `w_j + r - t ≤ c ≤ w_j` at every infinite\n  place, with `w_j = D.liftWeight j`.\n* `New.Selmer.IsConjSelfDual`:\
        \ `R` is continuous, has non-degenerate trace form, and is conjugate\n  self-dual up to twist on traces,\
        \ tr R(g^c) = χ(g)^(t-1) tr R(g⁻¹), with `g^c = c g c`\n  (`New.conjGal`) and χ = `New.Selmer.cyclotomicInv`.\n\
