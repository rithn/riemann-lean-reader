        \ the error term\n  `e_ℓ`, with crude constants.\n\n## Relation to the literature\n\nRibet's method in any\
        \ rank, with congruent summands and tied primes, gives a Hecke element,\npolynomial in the tie parameters,\
        \ that kills all determinants det (1 - u g) modulo the ties. On\nlifts it has no term properly dividing\
