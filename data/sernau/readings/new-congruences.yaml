    excerpt:
      path: grh/src/New/Congruences/FirstOrder/DenominatorBound.lean
      line: 10
      endLine: 14
      text: 'The bound that Ribet''s method gives for the denominator of the orthogonal projection to `Z`: an

        operator on `Z`, with eigenvalues of bounded valuation, takes the projection of every integral form

        orthogonal to the false lifts to an integral form. `O` is a descent pair of hermitian spaces of

        ranks `r < n` (`New.DescentPair`). `Z` is a subspace of its forms spanned by vectors in the ranges

        of the idempotents `New.Selmer.typeProjection O c` of types `c` in lift setting.

        '
    remainder:
      path: grh/src/New/Congruences/FirstOrder/DenominatorBound.lean
      line: 15
      endLine: 51
      text: "\nThe *chain* at a place of norm `q` is `∏ (X - q ^ i)`, `i < t'`, with `t' = O.rankDiff`.\n\n* `New.Selmer.typeProjection_sub_starProjection_mem_of_isOrthogonalToFalseLifts`:\
        \ a form orthogonal\n  to the false lifts differs from its projection to `Z`, in each type, only outside\
        \ the weak lifts.\n* `New.Selmer.exists_operator_ellVal_le_liftValuationBound`: the bound for denominators.\
        \ An operator\n  on `Z` preserves the Hecke eigenspaces, has eigenvalues of valuation at most\n  `New.Selmer.liftValuationBound`\
        \ and takes projections of integral forms orthogonal to the false\n  lifts to integral forms.\n* `New.Selmer.denominatorLe_clearingBound`:\
        \ if `Z` is spanned by lifts whose twisted main summands\n  have small Selmer groups with divisible coefficients\
        \ (`New.Selmer.IsLiftGenerator`), then\n  `New.Selmer.DenominatorLe` holds with exponent `β log ℓ`, where\n\
        \  `β = New.Selmer.clearingBound D ℓ`. Its operator is `D.chosenGroupOrder` times that of\n  `exists_operator_ellVal_le_liftValuationBound`\
        \ (`New.Selmer.exists_operator_det_clearingBound`).\n\nNotions from other files:\n* `New.Selmer.AbsGal`:\
        \ the absolute Galois group of the CM field `D.E` of the data `D`.\n* `New.Data.chosenGroupOrder`: the product,\
        \ over the chosen places above `D.levelPrime 0` and\n  `D.levelPrime 1`, of the orders of the groups `GL\
        \ (D.r * D.t)` over the residue fields.\n* `New.Patching.Isotypic`: a system, that is the space of forms\
        \ with given Hecke eigenvalues at\n  almost all places. `B.Eigensystem L` is the set of systems that contain\
        \ a nonzero form of level\n  `L` over the base data `B`; the base level is `L = ![]`.\n* `New.Selmer.normalisedRep`:\
        \ the twist of a Galois representation by the character\n  `normalizingAvatar O`.\n* `New.Selmer.IsAuxTwist`:\
        \ the character is anticyclotomic, its modulus avoids the given places and\n  its ramification has bounded\
        \ valuation.\n\n## Relation to the literature\n\nFor a twist with short Selmer groups, an operator of bounded\
        \ ℓ-adic valuation clears the denominator\nof the projection to theta lifts on integral forms orthogonal\
        \ to the false lifts. The bound counts\nlocal losses, class number, level, odd classes and congruences between\
        \ the characters; the orders of\nthe even classes, where Vandiver's conjecture lives, do not enter. Ribet-type\
        \ bounds, Taylor–Wiles\nprimes in the residually reducible case and the mass formula case are treated in\
        \ the following\nworks. Related work: Dasgupta–Kakde–Silliman–Wang, The residually indistinguishable case\
        \ of Ribet's\nmethod for GL2, 2023; Dotto–Thorne, Modularity of residually reducible representations of\
        \ rank 2,\n2026; Martin–Wakatsuki, Mass formulas and Eisenstein congruences in higher rank, 2024.\n"
