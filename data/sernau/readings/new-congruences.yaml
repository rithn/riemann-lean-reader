      endLine: 56
      text: "\n## Main definitions and results\n\n* `New.Selmer.exists_length_le_loss_add_crystallineSelmerLength`:\
        \ with divisible coefficients, the\n  cocycles of the main summand at the lift are counted by its loss,\
        \ free of the level, and its\n  Selmer group.\n* `New.Selmer.ribet_columns`: Ribet's element and the bound\
        \ on its coefficient of `∏ X j`.\n\nLetters: the new places are `w j`, with tame generators `τ j`, Frobenius\
        \ elements `φ j` and tied\nrelations `τ j - 1 - X j * (φ j - 1) * H j (φ j)`. The primes `p₀ = D.levelPrime\
        \ 0`\nand `p₁ = D.levelPrime 1` give the principal level; `g₀` is the element of the Galois group that\n\
        separates the characters.\n\nNotions from other files:\n* `New.CoeffRing`: rings of integers of finite Galois\
        \ extensions of `ℚ_ℓ` inside `ℚ̄_ℓ`; their\n  `normLength` is length over `O`, scaled so that `O/ℓ` has\
        \ length 1.\n* `New.Selmer.IsLiftSetting`: a descent pair `V` (`New.DescentPair`) has the places of the\
        \ data and\n  of the twist `ϑ`, an odd rank `card r ≤ D.r` and an odd difference of ranks `V.rankDiff ≤\
        \ D.t`.\n  Its type polynomials `c i` are monic squarefree polynomials of degree `card r` over the residue\n\
        \  fields at the chosen places above `p₀` and `p₁`, with conditions on their roots.\n* `New.Lift.InClass\
        \ F C U`: the local lattices `Y` such that `Bmax ⊗ Y` is spanned by the periods\n  fixed both near `1` and\
        \ along the filter `F`, the Hodge–Tate jumps lie in the sets `U`, and every\n  polynomial `Q` with `C s\
        \ Q` kills the inertial element `s` on the periods.\n* `New.Selmer.IsPrimeTriangle`: a linearly ordered\
        \ tame generator family `w j` with monotone\n  exponents `ty j`. An even class of exponent `ty j` that kills\
        \ the earlier `τ i`, and the earlier\n  `φ i` of the same exponent, has its value at `τ j` killed by `ℓ\
        \ ^ h`. Finitely many test points\n  and `g₀` detect the cocycles unramified off `ℓ`, and `g₀` separates\
        \ the characters up to `ℓ ^ h`.\n* `New.Selmer.IsTameGeneratorFamily`: `w j` is not above `ℓ`, `τ j` is\
        \ the chosen tame generator at\n  a place over `w j`, and `φ j` fixes the `ℓ ^ ν`-th roots of unity.\n*\
        \ `New.Selmer.clearingBound` (in `New.Congruences.FirstOrder.TraceRelations`): the clearing bound\n  `β_ℓ`\
