      line: 11
      endLine: 38
      text: "\n## Main definitions and results\n\n* `New.Selmer.isTameType_of_roots`: a class of polynomials containing\
        \ those that vanish on a given\n  multiset of at most N roots of unity of orders dividing ℓ^a - 1, 1 ≤ a\
        \ ≤ r, is\n  `New.Lift.IsTameType`.\n* `New.Selmer.localLattice`: a lattice restricted to the decomposition\
        \ group at a place above ℓ.\n* `New.Selmer.IsConjSelfDualOfLevel.hasJumps_localLattice`: a lattice in a\
        \ conjugate self-dual\n  representation of given level has the jumps of the representation at a place above\
        \ ℓ.\n* `New.Selmer.IsConjSelfDualOfLevel.inClass_localLattice`: a lattice in a conjugate self-dual\n  representation\
        \ of given level inherits admissibility at a place above ℓ and, if the place divides\n  M, the polynomials\
        \ that kill inertia.\n\nNotions from other files:\n* `New.Data.E`: The field E = K(ζ), ζ a primitive root\
        \ of unity of order q₁ = 3^c 2^s q₀, for the\n  exponent s of the data.\n* `New.Selmer.AbsGal`: The absolute\
        \ Galois group of the field E of the data D: automorphisms of an\n  algebraic closure of E fixing E.\n*\
        \ `New.CoeffRing`: Rings of integers of finite Galois extensions of `ℚ_ℓ` inside `ℚ̄_ℓ`.\n* `New.Selmer.IsConjSelfDualOfLevel`:\
        \ R is conjugate self-dual, and at every place outside the level\n  S or above ℓ M it is of finite type,\
        \ has the prescribed jumps, and is good away from M.\n* `New.Lift.InClass`: a lattice over O at a place\
        \ above ℓ is admissible along the supremum of a\n  given filter and the filter near 1, has its jumps in\
        \ given sets, and inertia elements are killed\n  on its periods by given polynomials.\n\n## Relation to\
