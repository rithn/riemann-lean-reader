        \ `New.Data.CriticalPair.ratio` on twists (`New.Data.CriticalPair.IsTwistMeasure`); the\n  cases `z ≥ 2`\
        \ and `z = 1` are `New.Data.CriticalPair.isTwistMeasure_integralAlgebraicPart` and\n  `New.Data.CriticalPair.exists_isTwistMeasure_of_z_eq_one`.\n"
