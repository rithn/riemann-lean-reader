      text: 'This file concerns two sides of a Kummer chart with a pairing `P` modulo `p ^ m`. From numerical

        conditions on orders it derives safe moves. It then walks along Frobenius orbits to derive the

        condition `New.Lift.Pairing.IsScaledCupCoboundary`. It shows that at plain cuts deep enough standard

        points are stops, and it sorts jumps in the windows into sides that are down or up.

        '
    remainder:
      path: grh/src/New/Congruences/Lifting/SafeMoves.lean
      line: 10
      endLine: 50
      text: "\n## Main definitions and results\n\n* `New.Lift.KummerChart.PairingSide.SidePairing.isSafe_of_orders`:\
        \ for `w`, `y` over `0`, the\n  pairs `(z τ w, y)` and `(w, z τ y)` are safe (`New.Lift.Pairing.IsSafe`)\
        \ if the orders of `w`, `y`\n  and a point of the Tate dual side `New.Lift.Pairing.tateDualSide` add up\
        \ to a positive number.\n* `New.Lift.KummerChart.PairingSide.SidePairing.isSafeMoveFst_of_killsCokernel`,\n\
        \  `New.Lift.KummerChart.PairingSide.SidePairing.isSafeMoveSnd_of_killsCokernel`: the rule. A move is\n\
        \  safe if a power of `p` times a power of `E` kills the cokernel of the Tate dual side and the\n  orders\
        \ of the move and the depth of the point at rest add up to at least `ruleBound`.\n* `New.Lift.KummerChart.PairingSide.SidePairing.isScaledCupCoboundary_of_stops`:\
        \ the walk. Standard\n  points at the cuts are carried along by Frobenius; at each cut one side moves to\
        \ a stop, rests\n  there while the other side moves, and goes on to its own point.\n* `New.Lift.KummerChart.PairingSide.SidePairing.exists_mem_stopPoints_isSafeMoveSnd`,\n\
        \  `New.Lift.KummerChart.PairingSide.SidePairing.exists_mem_stopPoints_isSafeMoveFst`: at a plain\n  cut,\
        \ where one side is down and the other is up, a deep enough standard point is a stop.\n\nNotions from other\
        \ files:\n* `New.Lift.KummerChart.PairingSide`: lattices Y and C with an O-linear map `cocycleMap` from\
        \ C to\n  the crystalline cocycles of Y, and for each letter a finite set of jumps that contains 0.\n* `New.Lift.Pairing`:\
        \ a pairing of Y and L modulo p^m, that is, an O-linear ψ: Y ⊗ L → O(1) with\n  gψ − ψ = p^m c(g) for a\
        \ crystalline cocycle c, and a Z_p-linear f: O → Z_p.\n* `New.Lift.KummerChart.PairingSide.pointsOver`:\
        \ points of the extension over `p ^ e c`, with\n  exponents and a depth.\n* `New.Lift.KummerChart.PairingSide.stopPoints`:\
        \ the points over `p ^ e c` with the exponents\n  `stopOrders η l` of a stop, where one side rests while\
        \ the other side moves.\n* `New.Lift.KummerChart.PairingSide.ruleBound`: the least sum of the orders of\
        \ a move and the depth\n  of the point at rest that the rule for `l` allows.\n\n## Relation to the literature\n\
        \nExplicit powers of p and of the Eisenstein polynomial kill cokernels of Kisin modules on crystalline\n\
        extensions, and Galois operators buy divisibility at known cost. A walk along Frobenius orbits makes\ncup\
        \ products of crystalline classes vanish up to powers of p, and these tools bound the loss above p\nin the\
        \ Selmer bound. Zero cokernel for weights of one sign, cup products via Ext and torsion bounds\nby Sen operators\
        \ are known in the literature. Related work: Čoupek–Gazaki–Marmora, Exactness\nproperty of Breuil–Kisin\
        \ functors and Bloch–Kato Selmer groups, 2026; Gao–Liu, Integral Sen theory\nand integral Hodge filtration,\
        \ 2024; Chang–Diamond, Extensions of rank one (φ,Γ)-modules and\ncrystalline representations, 2011.\n\n\
        The file `New.Congruences.Lifting.CutExponentBounds` applies the walk to two choices of cuts.\n"
