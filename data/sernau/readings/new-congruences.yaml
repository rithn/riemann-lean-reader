        \nNotions from other files:\n* `New.IsAuxiliary S I`: The places of `I` have prime norm, neither they nor\
        \ their conjugates lie in\n  the set `S` of places, and their conjugates lie outside `I`.\n* `New.Data.CriticalPair`:\
        \ A character `p.character` of U(1) of weight `-p.negWeight` with tame part\n  `p.tamePart`, and an integer\
        \ `p.z` with `1 ≤ z ≤ c` at every infinite place.\n* `New.Data.TameChar`: A character of U(1) of weight\
        \ 0, with modulus a finite set `Q` of places and\n  tame part `ψ` supported on `Q`; `New.Data.Twist` is\
