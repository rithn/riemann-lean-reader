      line: 6
      endLine: 11
      text: 'Let `g` be a functor from `C` to tests over a ring `A`, and let `ℓ` be a prime. The Tate module `𝕋`

        of `G_m` along `g` sits in the Kummer sequence. When `A` is local and absolutely integrally closed

        and `ℓ` is invertible in `A`, a section `ε` of `𝕋` makes `𝕋` act on every coefficient `M`

        (`New.Variety.TorsionCoeff`: killed by `ℓ`, with Zariski descent). On the projective line `ℙ¹`, the

        cocycle of `O(1)` and the Kummer class give the first Chern class `η ∈ H²(ℙ¹, 𝕋)`, and the

        projective line formula `H(ℙ¹ × S) = H(S) ⊕ η H(S)` is stated as a property of a coefficient.

        '
    remainder:
      path: grh/src/Lib/Cohomology/ProjectiveLine/ChernClass.lean
      line: 12
      endLine: 40
      text: "\n## Main definitions and results\n\n* `New.Variety.shortExact_kummerSeq`: the Kummer sequence 0 →\
        \ \U0001D54B → Hom(ℚ, G_m) → G_m → 0 is exact.\n* `New.Variety.tateGen`, `New.Variety.isCohomEquiv_tensorPoint_tateGen`:\
        \ a section ε of \U0001D54B such that\n  S → S ⊗ \U0001D54B, x ↦ x ⊗ ε, is bijective on Ext(−, F) for S\
        \ killed by ℓ and F with Zariski descent. Here\n  A is local and absolutely integrally closed, and the prime\
        \ ℓ is invertible in A\n  (`New.Variety.InvertsPrime`).\n* `New.Variety.TorsionCoeff.tateAction`: the class\
        \ in Ext⁰(M ⊗ \U0001D54B, M) inverse to x ↦ x ⊗ ε; it\n  commutes with all classes between coefficients\
        \ (`New.Variety.TorsionCoeff.tateAction_comm`).\n* `New.Variety.TorsionCoeff.mulClass`: the product y ·\
        \ ξ of a class y in M with a class ξ in \U0001D54B,\n  natural in M.\n* `New.Variety.etaClass`: the class\
        \ `η ∈ H²(ℙ¹, \U0001D54B)`, the cocycle class times the Kummer class.\n* `New.Variety.TorsionCoeff.etaAt`,\
        \ `New.Variety.TorsionCoeff.HasLineFormula`: product with `η`;\n  `H(ℙ¹ × S) = H(S) ⊕ η H(S)`.\n\nNotions\
        \ from other files:\n* `New.Variety.IsTest`: a test ring A is reduced and absolutely integrally closed,\
        \ and any a, b ∈ A\n  admit an idempotent e with a ∣ eb and b ∣ (1 − e)a.\n* `New.Variety.TestOver`: The\
        \ category of tests over A: the full subcategory of commutative\n  A-algebras whose underlying rings are\
        \ test rings.\n* `New.Variety.H`: The group Ext^n(N,F) in the category of functors from C to abelian groups.\n\
        * `New.Variety.Cocycle`: A 1-cocycle from F to G: homomorphisms D(f): F(c) → G(d) for f: c → d with\n  D(gf)\
        \ = G(g)D(f) + D(g)F(f). It defines an extension of F by G.\n\n## Relation to the literature\n\nKnown; see\
        \ `Lib.Cohomology.ProjectiveLine.ConstantLineFormula` and\n`Lib.PadicComparison.Duality.GoodPairs` for sources.\n"
