      endLine: 36
      text: "\nThe proof first treats a product of two represented functors through the Leray–Hirsch map. It then\n\
        passes to the general case by dévissage in each factor.\n\nNotions from other files:\n* `CategoryTheory.Functor.mulPairing`:\
        \ For a functor Φ to k-algebras with underlying functor F to\n  abelian groups, the pairing F ⊗ F → F given\
        \ by multiplication.\n* `New.Variety.exteriorAlg`: The functor sending a pair (A, M) to the exterior algebra\
        \ ⋀_A M, as a\n  k-algebra.\n* `New.Variety.lerayHirsch`: For an exact functor Φ and classes θ_i in Ext^{d_i}(ΦG,\
        \ F), the map\n  w ↦ Σ θ_i∘Φ(w_i) from finitely supported families in total Ext(S, G) to total Ext(ΦS, F).\n\
        * `New.Variety.freeAb`: The functor sending a set-valued functor Y to Z[Y], whose value at A is the\n  free\
