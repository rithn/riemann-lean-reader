      endLine: 39
      text: "\n`New.Variety.HasAtlas d X`: `X` is separated and its field points lie in finitely many affine charts\n\
        `New.Variety.EtaleChart d X` with `d` étale coordinates. `HodgeH (relFreeAb U) q` is Hodge\ncohomology relative\
        \ to the subfunctor `U`. `New.Variety.IsLocalSymbol ξ y P g m` says three things:\n`g` cuts out `P` at the\
        \ point `y`; `y` maps the part of `Spec R` off the preimage of `P` into `U`;\nand `ξ` pulls back along `y`\
        \ to `m • [dg / g]`. Here `[dg / g]` is the pull-back of\n`New.Variety.symbolClass` along `g`. `P` is a\
        \ predicate on points, not the subfunctor that `ξ` is\nrelative to; that subfunctor is the implicit `U`.\
        \ For the diagonal class, `P` is the diagonal\n`x.1 = x.2`, while `δ` is relative to its complement.\n\n\
