    excerpt:
      path: grh/src/Lib/Cohomology/PointClass/LinearIndependence.lean
      line: 6
      endLine: 11
      text: 'Let `k` be an algebraically closed field with a map to `Q̄_p`, and let `Y` be a projectively

        embedded scheme whose points over `k`-algebras (`New.Variety.algPointsOf`; `PointsIn Y A` is the set

        of points of `Y` with values in a `k`-algebra `A`, and `structureMap` is the map `k ⟶ A`) are

        covered by charts with `d` étale coordinates (`New.Variety.HasAtlas`). The Hodge–Tate map

        `New.Variety.hodgeTateMap d` sends the distinct classes of `k`-points of `Y` to linearly independent

        elements.

        '
    remainder:
      path: grh/src/Lib/Cohomology/PointClass/LinearIndependence.lean
      line: 12
      endLine: 46
      text: "\n* `New.Variety.linearIndepOn_hodgeTateMap_pointClass`: the main result.\n* `New.Variety.exists_map_separating_class`:\
        \ for a `k`-point `z₀` and finitely many other points, a\n  map `j` to `Y` whose pull-back kills the classes\
        \ that differ from that of `z₀` and keeps the\n  Hodge–Tate image of the class of `z₀` non-zero.\n\nThe\
        \ map `j` is an open part of the graph of a linear projection of the component of `z₀` to\nprojective space,\
        \ chosen by Noether normalisation (`New.Variety.exists_generic_chart`,\n`New.Variety.exists_etale_projection`).\
        \ Over a suitable `k`-point `Q` of projective space the\nprojection is étale and its fibre consists of points\
        \ with the class of `z₀`. Pull-back along the\nprojection is injective and the Hodge–Tate image of the class\
        \ of `Q` is non-zero, so the Hodge–Tate\nimage of the class of `z₀` is non-zero too.\n\nNotions from other\
        \ files:\n* `New.Variety.pointClass d z`: the class of the `k`-point `z` in the Hodge cohomology of degree\n\
        \  `d`.\n* `New.Variety.IsCoordsWithUnit L x v`: `v` is a vector of homogeneous coordinates of the point\
        \ `x`\n  for the embedding `L`, and some entry of `v` is a unit.\n* `New.Variety.CutsOutLocus.IsHomogeneousSolution\
        \ k g v`: every homogeneous polynomial over `k` that\n  vanishes at `g` vanishes at `v`, that is, `v` lies\
        \ on the cone cut out at `g`.\n* `New.Variety.CutsOutLocus.IsNoetherNormalization Λ g`: the values `evalForms\
        \ Λ g` of the linear\n  forms `Λ j` satisfy no non-zero homogeneous relation, and the cone of `g` is integral\
        \ over them.\n* `New.Variety.EtaleChart d X`: a `k`-algebra `c.coordRing` with `d` étale coordinates and\
        \ a point\n  `c.point` of `X` with values in `c.coordRing`, whose images `c.locus` (the points\n  `X.map\
        \ φ c.point`) make its spectrum an open subfunctor of `X`.\n\n## Relation to the literature\n\nKnown result:\
        \ Hodge–Tate images of point classes are non-zero and detect degrees of zero-cycles.\nThis file proves only\
        \ that the Hodge–Tate images of the distinct point classes are linearly\nindependent, without duality or\
        \ a trace map. Non-vanishing on projective space is imported\n(`New.Variety.projSpace.hodgeTateMap_pointClass_ne_zero`)\
        \ and carried to a smooth projective variety\nby transfer along a finite linear projection. Source: Faltings,\
        \ p-adic Hodge theory, JAMS 1 (1988)\n(compatibility with traces and cycle classes); for transfer, Suslin–Voevodsky,\
        \ Singular homology of\nabstract algebraic varieties, Invent. Math. 123 (1996), §§4–6.\n"
