        \ rings); Bhatt, Mathew, The arc-topology, Duke Math. J. 170\n(2021), Prop 5.2, Thm 5.4; Stacks project,\
        \ Tag 09YQ; Scholze, Étale cohomology of diamonds,\n7.15-7.16.\n\nSee also `Lib.Cohomology.ProperBaseChange.Theorem`.\n"
