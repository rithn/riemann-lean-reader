      text: "\n* `New.Variety.isLerayHirschBasis_lineBasis_of_basis`: the formula over a flat S follows from any\n\
        \  family θ that contains η and is a Leray–Hirsch basis over S and over S ⊗ ℤ[ℙ¹].\n* `New.Variety.hasLineFormula_of_lerayHirsch_ne_zero`:\
        \ over a valuation ring A the formula holds as\n  soon as η acts non-trivially on the point for one coefficient\
        \ whose tests lie over the generic\n  point of A.\n* `New.Variety.hasLineFormula_locallyConstant`: the formula\
        \ for a valuation ring A with an injective\n  ring map to ℂ_ℓ.\n\nThe formula is reduced to algebraically\
        \ closed fields k over A\n(`New.Variety.hasUniversalPoints_structurePt`), where a Künneth basis contains\
        \ η unless η · 1 = 0.\nThat vanishing would spread to the generic point of A; the tilted theory of\n`New.Variety.hasLineFormula_tiltTheory`\
        \ shows that it does not occur for A in ℂ_ℓ.\n\nNotions from other files:\n* `New.Variety.TestOver`: The\
        \ category of tests over A: the commutative A-algebras that are reduced,\n  absolutely integrally closed,\
        \ and in which any a, b admit an idempotent e with a ∣ eb and\n  b ∣ (1 − e)a.\n* `New.Variety.TorsionCoeff`:\
        \ A coefficient along g: a functor to abelian groups, killed by ℓ, with\n  Zariski descent; a `New.Variety.Theory`\
        \ is one that also behaves well on closed loci.\n* `New.Variety.projLine`: The projective line as a functor\
        \ on rings; `New.Variety.onePointFunctor`\n  is the constant one-point functor and `New.Variety.reprBy A`\
        \ the functor Hom(A, −).\n\n## Relation to the literature\n\nKnown result: the projective line formula for\
        \ ℤ/ℓ coefficients, where the degree two class is the\nChern class of O(1) given by the Kummer sequence.\
        \ Here the formula H(ℙ¹ × S) = H(S) ⊕ η H(S) is\nstated in Leray–Hirsch form for locally constant ℤ/ℓ coefficients\
        \ on test rings; the tilted\ncoefficients serve only to show that η acts non-trivially. Source: SGA 4½ [Cycle];\
        \ SGA 5\n(Jouanolou); Milne, Étale Cohomology; Scholze, p-adic Hodge theory for rigid-analytic varieties.\n"
