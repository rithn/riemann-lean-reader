        \ image.\n\nNotions from other files:\n* `New.Variety.IsTest`: A is a test ring: reduced, absolutely integrally\
        \ closed, and any a, b admit\n  an idempotent e with a ∣ eb and b ∣ (1 − e)a. `New.Variety.TestRing` is\
        \ their category.\n* `New.Variety.IsCover`: p: E → Y is a cover for F: the inclusion of the image of p in\
        \ Y induces\n  bijections on Ext^n(Z[−],F) for all n.\n* `New.Variety.locConstCoeff`: For an abelian group\
        \ Λ, the coefficient functor on test rings sending\n  A to the group of locally constant functions Spec\
        \ A → Λ.\n* `New.Variety.BijectiveUpTo`: for maps f_n : A_n → B_n, the first r of the conditions f₀\n  injective,\
        \ f₀ surjective, f₁ injective, f₁ surjective, and so on.\n\n## Relation to the literature\n\nKnown result:\
        \ Descent of torsion étale cohomology along v-covers, with excision, transfer and\nlimits. Here cohomology\
        \ is defined as Ext of presheaves on test rings. The local rings of a test\nring are valuation rings of\
        \ algebraically closed fields. Descent, excision, transfer and limits are\nproved from this definition,\
        \ while equality with étale cohomology is neither proved nor used.\nSource: Scholze, Berkovich Motives,\
