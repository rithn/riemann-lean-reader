        \ (A, M) ↦ ⋀_A M.\n* `New.Variety.HodgeH`: Hodge cohomology, Ext^q from N(A ⊕ M) to ⋀_A M in functors on\
        \ pairs, with\n  pull-back `New.Variety.HodgeH.map`, scaling `New.Variety.HodgeH.scale` and base change\n\
