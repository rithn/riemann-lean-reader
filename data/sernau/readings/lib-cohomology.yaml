        \ where classes also extend from closed loci. `New.Variety.Theory.locallyConstant` is the theory of\n  locally\
        \ constant functions.\n* `New.Variety.IdealFamily`, `New.Variety.Theory.onZeros`: a compatible family of\
        \ ideals, and the\n  coefficient that sees only the locus where it is zero.\n* `New.Variety.IdealFamily.isCohomEquiv_constToZeros`,\n\
        \  `New.Variety.TorsionCoeff.pullbackAlong_oneLocConst_surjective`: the map from `ℤ/ℓ` relative to\n  the\
        \ locus where the ideal is the unit ideal to the locally constant functions on the zero locus is\n  an equivalence\
        \ for coefficients with Zariski descent, provided the locally constant functions\n  along `g` underlie a\
        \ theory `Θ`; hence every class on the constant functor `ℤ` with coefficients\n  in a `TorsionCoeff g` (killed\
        \ by `ℓ`, with Zariski descent) comes from one on the locally constant\n  functions to `ℤ/ℓ`.\n\nNotions\
        \ from other files:\n* `New.Variety.HasFlatValues F`: every value of `F` is a flat `ℤ`-module.\n* `New.Variety.restrictAlong\
        \ φ`, `New.Variety.freeAb`: the functor `N ↦ N ∘ φ`, and the functor\n  sending a set-valued functor `Y`\
        \ to `ℤ[Y]`, the free abelian group on `Y(A)` at each `A`.\n* `New.Variety.relFreeAb U`, `New.Variety.abCoker\
        \ α`: the functor `ℤ[V]/ℤ[U]` for `U ⊆ V`, whose Ext\n  groups are the relative cohomology of `(V, U)`;\
        \ the cokernel of `α`, formed objectwise.\n* `New.Variety.IsTest`: a test ring A is reduced and absolutely\
        \ integrally closed, and any a, b ∈ A\n  admit an idempotent e with a ∣ eb and b ∣ (1 − e)a.\n* `New.Variety.Comparison`:\
        \ a functor φ : C' → C with a map F∘φ → F'; it `IsBijective` along α :\n  N' → N∘φ if Ext^n(N, F) → Ext^n(N',\
        \ F') is bijective for all n. `HasUniversalPoints u`, a\n  sufficient condition: the fibres of u over points\
        \ are representable, with the same coefficients.\n* `New.Variety.IsCohomDense`, `New.Variety.HasZariskiDescent`:\
        \ `U ⊆ Y` is dense for `F` if, for\n  every point `h_A → Y`, the inclusion of the preimage of `U` induces\
        \ bijections on Ext with\n  coefficients `F`; `F` has Zariski descent if every `U` that contains `Y` near\
        \ each maximal ideal\n  (`New.Variety.IsZariskiLocallyTop`) is dense for `F`.\n\n## Relation to the literature\n\
        \nKnown result: Cup product with a degree-two class and closed supports, for mod-ℓ cohomology as Ext.\n\
        Only the formal set-up is given, for Ext on test rings. It consists of ℓ-torsion coefficient\ntheories with\
        \ closed supports cut out by families of ideals, and a degree-two class between flat\nfunctors tensored\
        \ with every functor. No Chern class, Künneth formula, Gysin map or Poincaré duality\nis stated here. Source:\
        \ for the setting, Milne, Étale Cohomology, Ch. VI.\n\nSee also `Lib.Cohomology.Etale.FilteredLimits` and\
        \ `Lib.PadicComparison.Duality.GoodPairs`.\n"
