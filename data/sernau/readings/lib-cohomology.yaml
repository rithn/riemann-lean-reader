      startOffset: 239
      endOffset: 1281
      text: 'Spaces are functors on rings. A space is proper over `A` (`New.Variety.IsProperOver`) if its

        diagonal is cut out by ideals and a valuative criterion holds with one universal point.

        `New.Variety.TestOver` A is the category of A-algebras that are test rings (absolutely integrally

        closed reduced rings where any two elements are comparable for divisibility after splitting by an

        idempotent; `testIncl` includes them in rings), `New.Variety.H` N F n is Extⁿ(N, F) among functors

        to abelian groups, and the coefficients are ℤ/ℓ for a prime ℓ invertible in the base. The file

        proves proper base change over an absolutely integrally closed local domain that is a valuation ring

        and derives three consequences: injectivity of restriction to the residue fibre, invariance of

        cohomology under extension of algebraically closed fields, and openness of zero sets of classes.

        These results then give detection at points for coefficients that are ℤ/ℓ on the zero locus of a

        family of ideals, in the form used to prove that Leray–Hirsch maps are bijective.'
    remainder:
      path: grh/src/Lib/Cohomology/ProperBaseChange/Theorem.lean
      line: 18
      endLine: 65
      startOffset: 1281
      endOffset: 4646
      text: "\n\n## Main definitions and results\n\n* `New.Variety.IsProperOver.proper_base_change`: for `Y` proper\
        \ over an absolutely integrally closed\n  valuation ring `A` in which `ℓ` is invertible, the closed fibre\
        \ of `Y` has the cohomology of `Y`.\n* `New.Variety.IsProperOver.injective_map_residue`: over an absolutely\
        \ integrally closed local\n  domain that is a valuation ring, a class is determined by its restriction to\
        \ the fibre over the\n  residue field.\n* `New.Variety.IsProperOver.isTestCohomEquiv_field_extension`: cohomology\
        \ does not change under an\n  extension `S → T` of algebraically closed fields over `R`.\n* `New.Variety.IsProperOver.isOpen_zero_set_and_eq_zero`:\
        \ over a test ring, the primes at which a\n  class vanishes form an open set, and a class that vanishes\
        \ at every prime is zero.\n* `New.Variety.IsDetectedAtPoints`: the property of a coefficient F that classes\
        \ over a test are\n  detected at the residue fields of its primes (zero sets are open, and a class that\
        \ vanishes at\n  every prime is zero), and that extending a field test changes nothing; a structure with\
        \ one field\n  for each of these two properties.\n* `New.Variety.IdealFamily.isDetectedAtPoints_of_proper`:\
        \ for X proper over ℤ and I a family of\n  ideals on X × Spec A, a coefficient that is ℤ/ℓ on the locus\
        \ I = 0, this locus being dense, has\n  that property. Idea: the locus W = {I = 0} is proper over A, and\
        \ over a test c the cohomology with\n  coefficients F is that of W_c with coefficients ℤ/ℓ.\n\nNotions from\
        \ other files:\n* `New.Variety.IsAbsIntegrallyClosedLocal`: A is an absolutely integrally closed local domain:\
        \ a\n  local domain in which every monic polynomial of positive degree has a root.\n* `New.Variety.IsCohomEquiv`:\
        \ α : N' → N induces bijections Extⁿ(N, F) → Extⁿ(N', F) for all n.\n* `New.Variety.locConstCoeff` Λ: the\
        \ coefficient on test rings given by the locally constant\n  functions Spec B → Λ.\n* `New.Variety.IsTestCohomEquiv`\
        \ Λ u: the map u of functors on rings, restricted to test rings,\n  induces such bijections for the coefficient\
        \ `locConstCoeff Λ`.\n* `New.Variety.reprBy`: the functor h_A = Hom(A, −) represented by A.\n* `New.Variety.IsCohomDense`:\
        \ U ⊆ Y is dense for F if for every point h_A → Y the inclusion of the\n  preimage of U in h_A is such an\
        \ equivalence.\n* `New.Variety.IdealFamily`: For a functor ι from C to commutative rings, ideals I_c of\
        \ ι(c) such\n  that I_b is generated by the image of I_a for every morphism a → b.\n* `New.Variety.zeroPoints`:\
        \ For s: X → h_R and a subset I of R, the subfunctor of points x ∈ X(B)\n  whose structure map R → B sends\
        \ I to 0; `New.Variety.unitPoints`: those whose structure map sends\n  every element of I to a unit.\n\n\
        ## Relation to the literature\n\nKnown result: Proper base change and invariance under extension of algebraically\
        \ closed fields. Here\nthe coefficients are constant F_ℓ, the base is an absolutely integrally closed valuation\
        \ ring, and\nproperness of a functor (`New.Variety.IsProperOver`) means a closed diagonal and a valuative\n\
        criterion. The proof reduces to spaces of places of a field and then uses Zorn's lemma on subrings\nwith\
        \ a Mayer–Vietoris splitting, together with Kummer theory. Source: Artin, SGA 4 Exp. XII 5.1,\n5.4, 5.5\
