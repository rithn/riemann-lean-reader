      text: "The perfect projective line on p-adic tests S is a model on which classes on ℙ¹ are computed. Its\n\
        two discs are represented in the tilt S^♭ by O^♭[ℚ≥0], and its torus by O^♭[ℚ].\n\n* `New.Variety.PerfectLine.gluing`:\
        \ the gluing map ℤ[torus ⊔ point] → ℤ[two discs]; it is injective\n  (a monomorphism). Its cokernel plays\
        \ the role of the perfect line with the point ∞ killed.\n"
    remainder:
      path: grh/src/Lib/Cohomology/ProjectiveLine/PerfectLine.lean
      line: 11
      endLine: 33
      text: "* `New.Variety.PerfectLine.oneSub_comp_gluing`: the operators 1 − (T^s ↦ χ(s) T^s) commute with the\n\
        \  gluing map.\n* `New.Variety.PerfectLine.isCohomEquiv_gluing_tilt`,\n  `New.Variety.PerfectLine.isCohomEquiv_gluing_generic`:\
        \ over each test c the gluing map induces\n  bijections on cohomology. This holds for coefficients G(S^♭),\
        \ where G is built from an O^♭-module\n  N and is assumed acyclic on perfect rings. It also holds for S[1/p].\n\
        * `New.Variety.PerfectLine.subsingleton_H_cokernel_gluing`: then M ⊗ cokernel has no cohomology, for\n \
        \ every M with flat values.\n\nIdea: all cohomology is in degree 0, where the map is the splitting of a\
        \ Laurent polynomial into two\nparts according to the sign of the exponent. `New.Period.OFlat` is O^♭, the\
