    excerpt:
      path: grh/src/Lib/Cohomology/Etale/RelativeChains.lean
      line: 7
      endLine: 14
      text: 'This file provides tools for computing the groups Ext^n(N, F) (`New.Variety.H`) of functors from a

        category C to abelian groups. For a subfunctor U of a set-valued functor V,

        `New.Variety.relFreeAb U` is the quotient ℤ[V]/ℤ[U] of free abelian groups (`New.Variety.freeAb`).

        Its Ext^n into F is the relative cohomology H^n(V, U). A map is an equivalence for F

        (`New.Variety.IsCohomEquiv`) if it is bijective on all Ext^n(·, F). A subfunctor U of Y is dense

        (`New.Variety.IsCohomDense`) if over every point h_A → Y its preimage gives an equivalence; with

        these notions the file proves vanishing for locally zero functors, transfer, excision and gluing of

        relative classes over finite covers.

        '
    remainder:
      path: grh/src/Lib/Cohomology/Etale/RelativeChains.lean
      line: 15
      endLine: 39
      text: "\n## Main definitions and results\n\n* `New.Variety.cohomology_eq_zero_of_locallyZero`, `New.Variety.isCohomEquiv_of_locallyZero`:\
        \ a\n  functor whose sections all die on dense sieves has no cohomology, so a map with such a kernel and\n\
        \  cokernel is an equivalence.\n* `New.Variety.exists_transfer_map`: the transfer attached to finitely many\
        \ locally permuted maps\n  (`New.Variety.permutedPairs`: the pairs on which they are permuted).\n* `New.Variety.relFreeAb.shortExact_triple`,\
        \ `New.Variety.relFreeAb.isCohomEquiv_of_le`,\n  `New.Variety.relFreeAb.excision`: the exact sequence of\
        \ a monomorphism, invariance under enlarging\n  U′ to U when U′ is dense in U, and excision.\n* `New.Variety.relFreeAb.exists_glued_class`:\
        \ in the lowest degree where it may be nonzero, relative\n  cohomology glues over a finite cover (a Mayer–Vietoris\
        \ induction).\n* `New.Variety.relFreeAb.prod`: the map of pairs that gives exterior products of relative\
        \ classes.\n\nNotions from other files:\n* `New.Variety.isCohomEquiv_iff_subsingleton`, `New.Variety.isCohomEquiv_quotient_of_acyclic`:\
        \ for\n  0 → X₁ → X₂ → X₃ → 0 short exact, X₁ → X₂ is an equivalence for F exactly when all Ext^n(X₃, F)\n\
        \  vanish, and X₂ → X₃ is one when all Ext^n(X₁, F) vanish.\n* `New.Variety.pointMap`: The map h_A → Y from\
        \ h_A = Hom(A,−) corresponding to a point y of Y(A) by\n  the Yoneda lemma.\n\n## Relation to the literature\n\
        \nKnown; see `Lib.Cohomology.Etale.FilteredLimits` for sources.\n"
