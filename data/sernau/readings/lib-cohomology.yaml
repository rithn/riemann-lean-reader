      path: grh/src/Lib/Cohomology/Etale/ProperFunctors.lean
      line: 9
      endLine: 20
      text: "This file studies the cohomology `Hⁿ(Y) = Extⁿ(ℤ[Y], F)` of set-valued functors `Y` on rings,\ncomputed\
        \ on test rings, with `F = New.Variety.locConstCoeff Λ` the locally constant `Λ`-valued\nfunctions. Two\
        \ criteria for density, for affine maps and for finitely many affine subfunctors, are\ntested on points\
        \ in valuation rings of algebraically closed fields.\n\n## Main definitions and results\n\n* `New.Variety.IsTestCohomEquiv.of_connected`:\
        \ the local-to-global principle. A map\n  `u : X ⟶ Y` that induces isomorphisms on cohomology (`New.Variety.IsTestCohomEquiv`)\
        \ over every\n  connected piece of `Y` induces them over `Y`. This needs `X` and `Y` cohomologically continuous\n\
        \  (`New.Variety.IsCohomContinuous`). The pieces are loci `U a` of a zero-locus family `U` with\n  `U (span\
        \ {e}) ⊔ U (span {1 - e})` dense for every idempotent `e`.\n"
    remainder:
      path: grh/src/Lib/Cohomology/Etale/ProperFunctors.lean
      line: 21
      endLine: 52
      text: "* `New.Variety.IsRelAffine.hasCohomDenseImage_of_lifts`: an affine map that is onto on such points\n\
        \  has dense image.\n* `New.Variety.IsCohomDense.of_affine_cover`: `U` is dense if each such point lies\
        \ in one of\n  finitely many affine subfunctors whose points in test rings belong to `U`.\n* `New.Variety.IsProperOver.hasCohomDenseImage_of_surjective`:\
        \ a map of proper functors, onto on\n  geometric points, has dense image (`New.Variety.IsCohomDense`) for\
        \ locally constant coefficients\n  `New.Variety.locConstCoeff Λ`.\n* A density criterion for finitely many\
        \ maps `P i : Y ⟶ Z` into a proper functor:\n  `New.Variety.IsProperOver.isCohomDense_of_coincidences`.\
        \ It is\n  `New.Variety.IsCohomDense.of_affine_cover` for the closed loci on which prescribed pairs of the\n\
        \  maps agree.\n* `New.Variety.ellAdicCohom.transfer`: let `c : W ⟶ Y` be a Galois covering of proper schemes\
        \ with\n  finite group `Δ`. Then the `ℓ`-adic cohomology of `Y` embeds in that of `W` and reaches all\n\
        \  `Δ`-invariant classes.\n\nNotions from other files:\n* `New.Variety.IsRelAffine`: The property of a map\
        \ X → Y of set-valued functors on rings that its\n  pull-back along every point h_A → Y is representable,\
