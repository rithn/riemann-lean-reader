      text: "The Künneth formula for Hodge cohomology `New.Variety.HodgeH`, in the weak form that the fixed-point\n\
        formula needs: cross products span.\n\n* `New.Variety.kunneth`: over a field of characteristic 0, if `X`\
        \ has an atlas, every class on\n  `X × X` is a sum of cross products of classes on `X`.\n\nHodge cohomology\
        \ is an Ext group in functors on pairs `(A, M)`, where `M` is a finite free\n`A`-module (`New.Variety.HodgeTest`).\
        \ It is taken from `(A, M) ↦ ℤ[X(A ⊕ M)]` to the exterior\nalgebra `(A, M) ↦ ⋀ M` (`New.Variety.hodgeCoeff`).\n"
    remainder:
