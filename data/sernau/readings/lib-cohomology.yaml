    excerpt:
      path: grh/src/Lib/Cohomology/ProperBaseChange/LineCharts.lean
      line: 7
      endLine: 12
      text: 'This file gives the commutative algebra behind a Mayer–Vietoris sequence of locally constant

        `ZMod ℓ`-valued functions for two charts of a line. The setting is two charts `Spec B`, `Spec C`

        over `A` with overlap `Spec D`, where `D = B[1 / t] = C[1 / s]`, `t * s = 1` in `D`, and `D` is

        integral over `A[t, s]`. Everything is read modulo an ideal `I` of `A`. Under further hypotheses,

        compatible clopens of the charts come from the base, and every locally constant function on the

        overlap is a difference of functions from the charts.

        '
    remainder:
      path: grh/src/Lib/Cohomology/ProperBaseChange/LineCharts.lean
      line: 13
      endLine: 33
      text: "\n## Main definitions and results\n\n* `New.Variety.exists_eq_basicOpen_of_isClopen_of_preimage_eq`:\
        \ compatible clopens of the charts\n  come from `A`, assuming every pair in `B × C` agreeing in `D` comes\
        \ from `A` (`hA_onto`) and `hI`.\n* `New.Variety.exists_eq_locConstSpec_map_sub_map`: under further hypotheses\
        \ (`A`, `D` domains; `ℓ`\n  prime and a unit in `A`; `A`, `B`, `C` absolutely integrally closed; `hI`; `h_cases`),\
        \ every\n  locally constant `ZMod ℓ`-valued function on the overlap is a difference of functions from the\n\
        \  charts.\n\nNotions from other files:\n* `New.Variety.IsAbsIntegrallyClosed`: A is absolutely integrally\
        \ closed: every monic polynomial\n  over A of positive degree has a root in A.\n* `New.ThePrime`: `ThePrime\
        \ ℓ` fixes the prime `ℓ` (it extends `Fact ℓ.Prime`).\n* `New.Variety.locConstSpec`: For an abelian group\
        \ Λ, the functor on commutative rings sending A to\n  the group of locally constant functions Spec A → Λ;\
        \ it sends a ring map to pull-back along the map\n  of spectra.\n\n## Relation to the literature\n\nKnown;\
        \ see `Lib.Cohomology.ProperBaseChange.Theorem` for sources.\n"
