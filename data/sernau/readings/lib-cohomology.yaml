      line: 6
      endLine: 11
      text: 'Spaces are functors from rings to sets (`New.Variety.PointFunctor`). For `s : Z ⟶ reprBy D` and a

        point `x ∈ Z(C)`, the ring map under `x` is `baseRingMap s x : D ⟶ C`. The space of places is a form

        of the Riemann–Zariski space. It is used to cover a proper functor `Z` over `D`.


        A place of a `D`-algebra `P` is a prime `q` of `P` together with a valuation ring of `κ(q)` over

        `D`. For `α : D ⟶ P`, the ring `T = prodValuationRing α` is the product of these valuation rings.

        '
    remainder:
      path: grh/src/Lib/Cohomology/ProperBaseChange/PlaceSpace.lean
      line: 12
      endLine: 28
      text: "Each `t ∈ P` is a ratio `a t / b t` in it, with `a = numerator` and `b = denominator`. The space of\n\
        places `W` of a valuative lift `z`, with `z.point ∈ Z(T)`, has as points over `C` the classes of\nmaps `f\
        \ : T → C`. Two maps are identified if they give the same point `Z.map f z.point` of `Z(C)`\nand the same\
        \ ratios `(f (a t) : f (b t))`.\n\n* `New.Variety.IsProperOver`: properness, as a closed diagonal and a\
        \ valuative criterion.\n* `New.Variety.ResiduePlace.placeSpace`: the space of places `W`.\n* `New.Variety.ResiduePlace.exists_isLocalHom_eq_projHom_comp`:\
