      text: "\n\n## Overview of this theory\n\nThroughout, `ℓ` is a fixed prime. Cohomology of a functor `X` to\
        \ sets, with coefficients in a\nfunctor `F` to abelian groups, is `Extⁿ(ℤ[X], F)`. Here `ℤ[X]` is the free\
        \ abelian group functor on\n`X`, and the Ext is taken in functors on test objects: rings, or pairs of a\
        \ ring and a module.\n\nOn absolutely integrally closed rings `A` (every monic polynomial of positive degree\
        \ has a root),\nlocally constant functions on `Spec A` give `\U0001D53D_ℓ`-cohomology. Their Witt vectors\
        \ give\n`ℤ_ℓ`-cohomology. `New.Variety.ellAdicCohom` is `X ↦ ℚ_ℓ ⊗ Hⁿ(X ×_R Ω, ℤ_ℓ)`, for `X` over a ring\n\
        `R` and an `R`-algebra `Ω`. Test objects may also be pairs `(B, M)` of a `k`-algebra `B` and a\n`B`-module\
        \ `M`. On these, `New.Variety.HodgeH` of a functor `N` in degree `q` is `Ext^q` from\n`(B, M) ↦ N(B ⊕ M)`\
        \ to `(B, M) ↦ ⋀_B M`.\n\n* `New.Variety.IsProperOver.proper_base_change`: let `A` be an absolutely integrally\
        \ closed local\n  domain that is a valuation ring, with `ℓ` a unit in `A`. Let `Y` be proper over `Spec\
        \ A`. Then\n  restriction from `Y` to its closed fibre is bijective on `\U0001D53D_ℓ`-cohomology in every\
        \ degree.\n* `New.Variety.isTestCohomEquiv_baseChangeTransition`: let `A` be a valuation ring of an algebraic\n\
        \  closure `ℚ̄` of `ℚ`, with a prime `p` in its maximal ideal and `ℓ` a unit. Let `A` be an algebra\n  over\
        \ a ring `R`, and let `Y` over `R` be built from charts étale over tori\n  (`New.Variety.IsCharted`). Then\
        \ pull-back `Hⁿ(Y_A, \U0001D53D_ℓ) → Hⁿ(Y_ℚ̄, \U0001D53D_ℓ)` is bijective for all `n`.\n* `New.Variety.ellAdicCohom.woods_hole`:\
        \ let `R ⊆ E → k ⊆ ℚ̄_p`, with `E` a field of characteristic\n  0 and `k` algebraically closed. Let `Y`\
        \ be proper and `W` projective over `R`. Let `Y` over `E`\n  and `W` over `k` have atlases of dimension\
        \ `d`. Let `uᵢ : W ⟶ Y` be maps, and let `bᵢ ∈ k` be\n  almost all zero. Let `λ_h` be the Hodge–Tate map\
        \ `New.Variety.hodgeTateMap h`. Assume that\n  `h > d`, or that `∑ bᵢ λ_h(uᵢ^* x) = 0`, read over `k`, for\
        \ all `x` of degree at most `d` in\n  `HodgeH` of `Y` over `E`. Then `New.Variety.IsNullFamily` holds: for\
        \ `c : W ⟶ Y`, if each\n  coincidence `c y = uᵢ y`, `y ∈ W(k)`, has a tangent polynomial `P` with `P(1)\
        \ ≠ 0`, the terms\n  `bᵢ · (coefficient of degree h of P) / P(1)` add up to zero.\n\nThese replace proper\
        \ base change (SGA 4, XII) and smooth base change (SGA 4), here with coefficients\n`\U0001D53D_ℓ` over such\
        \ rings. They also replace half of the holomorphic Lefschetz (Woods Hole) formula of\nAtiyah and Bott, for\
        \ `h`-forms and correspondences. No comparison with étale or coherent cohomology\nis stated.\n\nStructure\
        \ of the development. `Etale`: descent, Mayer–Vietoris, limits, `ℓ`-adic coefficients.\n`ProperBaseChange`:\
        \ cover `X` by points with values in valuation rings, and reduce to the valuation\nrings of a single field.\
        \ `LerayHirsch`, `TorsionTheories`, `ProjectiveLine`: `1` and the first Chern\nclass of `O(1)` form a basis\
        \ of the cohomology of `ℙ¹`. With duality from `Lib.PadicComparison`,\n`SmoothBaseChange` follows. `Hodge`:\
        \ point classes, the Künneth formula, local terms of the\ndiagonal. `PointClass`: the Hodge–Tate map of\
        \ `Lib.PadicComparison` keeps distinct point classes\nindependent, by reduction to `ℙᵈ` and `ℙ¹`.\n\n##\
        \ This file\n\nNotions from other files:\n* `New.Variety.HodgeH.baseChange`: Base change: for an E-algebra\
        \ k, the additive map from the Hodge\n  cohomology over E of N to that over k of N restricted to k-algebras.\n\
        \n## Relation to the literature\n\nKnown result: Half of the holomorphic Lefschetz (Woods Hole) formula\
        \ for h-forms and\ncorrespondences. No trace is computed here. The statement is that if a combination of\
        \ pull-backs\nkills the Hodge classes of degree at most the dimension d under the Hodge–Tate map λ_h, then\
        \ the z^h\ncoefficients of the local terms det(1−zA)/det(1−A) at simple coincidences add up to zero. Source:\n\
        M. F. Atiyah, R. Bott, A Lefschetz fixed point formula for elliptic complexes II, Ann. of Math. 88\n(1968)\
        \ 451-491; G. Kondyrev, A. Prikhodko, Holomorphic Atiyah-Bott formula for correspondences,\nArnold Math.\
        \ J. (2022); SGA5 III 6.12.\n"
