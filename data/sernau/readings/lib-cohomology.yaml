      text: "\n\n## Main definitions and results\n\n* `New.Variety.ConstIfCoincident`, `New.Variety.IsCoincidenceSet`:\
        \ reduced coincidences, and a\n  finite set of rational points that lists them all.\n* `New.Variety.HasJacobianRatio`:\
        \ the local term, the determinant of `(t du - dc) (du - dc)⁻¹`.\n* `New.Variety.IsTangentPoly.hasJacobianRatio_eval_div`:\
        \ a tangent polynomial `P` with `P 1 ≠ 0`\n  gives this term as `P t / P 1`; by `New.Variety.IsTangentPoly.constIfCoincident`\
        \ the coincidences\n  at that point are then reduced.\n* `New.Variety.scaledGraph`: the graph of `(u, c)`\
        \ twisted by the scaling of `M` by `t` in the first\n  factor.\n* `New.Variety.exists_diagonal_local_terms`:\
        \ the class `δ` of the diagonal, pulled back along this\n  twisted graph, is `∑ n w • pointClass d w` over\
        \ the coincidences `w` of `u` and `c`, where `n w`\n  is the determinant of a matrix `N` with `t du - dc\
        \ = N (du - dc)` at `w`\n  (`New.Variety.HasJacobianRatio`).\n* `New.Variety.IsPointSum.cup_pointClass`:\
        \ the external product of the class of a point of `X` and\n  the class of a point of a curve is the class\
        \ of the product point.\n\nNotions from other files:\n* `New.Variety.HodgeH`: Hodge cohomology: for a functor\
        \ N from k-algebras to abelian groups, Ext^q\n  from (A, M) ↦ N(A ⊕ M) to (A, M) ↦ ⋀_A M, in functors on\
        \ pairs.\n* `New.Variety.symbolClass`: The Grothendieck symbol [dT/T] in Hdg^d(\U0001D538^d, \U0001D538\
        ^d ∖ 0); its pull-back\n  along a tuple f of functions is the symbol [df/f].\n* `New.Variety.IsPointSum`:\
        \ A relative class has multiplicity n z at each z in s: on some chart\n  containing z it restricts to n\
        \ z times the symbol [dg / g] of functions g that cut out z.\n* `New.Variety.IsTangentPoly`: at a point\
        \ `y ∈ W(k)`, the tangent map `dc` on the tangent space of\n  dimension `d` is injective, `du = dc ∘ B`,\
        \ and `P t = P 0 * det (1 - t B)`.\n* `New.Variety.HasAtlas`: X is separated and has finitely many charts,\
        \ each with exactly d étale\n  coordinates, that contain every field-valued point.\n* `New.Variety.offPoints`:\
        \ for a set s of k-points of X, the subfunctor of the points none of whose\n  values in fields comes from\
        \ s.\n* `New.Variety.exteriorAlg`, `CategoryTheory.Functor.mulPairing`: the exterior algebra ⋀_A M of a\n\
        \  pair (A, M), and the pairing given by its multiplication (the wedge product of coefficients in the\n\
        \  cup product).\n* `New.Variety.freeAb.prod`: for set-valued functors X, Y, the map ℤ[X × Y] → ℤ[X] ⊗ ℤ[Y],\
        \ [(x,\n  y)] ↦ [x] ⊗ [y].\n\n## Relation to the literature\n\nKnown result: the fixed point formula in\
        \ Hodge cohomology, with local terms computed by\nGrothendieck symbols. Here the setting is characteristic\
        \ 0 and smooth separated varieties with a\nfinite atlas, with cohomology taken as Ext of functors. The class\
        \ of the diagonal and Künneth\nsurjectivity for X×X are not proved here; they come from `exists_diagonal_class`\
        \ and `kunneth` in\nother files. Here the point classes are multiplied for a product with a curve, and the\
        \ pull-back of\nthe diagonal class along reduced coincidences is given as a weighted sum of point classes.\
        \ Source:\nStacks Project, tags 0BEC (Künneth) and 0G82 (Gysin maps); A. Chatzistamatiou, K. Rülling, Higher\n\
        direct images of the structure sheaf in positive characteristic, Algebra & Number Theory 5 (2011)\n693-775,\
        \ sections 2-3; V. Srinivas, Gysin maps and cycle classes for Hodge cohomology, Proc. Indian\nAcad. Sci.\
