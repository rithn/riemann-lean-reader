        \ `x` in `X(C)`\n  satisfies `P`.\n* `New.Variety.IsOpenSubfunctor`: V is an open subfunctor of X: each\
        \ x ∈ X(A) has an ideal I of A\n  such that, for φ: A → B, φ(x) ∈ V(B) iff φ(I)B = B.\n* `New.Variety.EtaleChart`:\
        \ A chart of X: a k-algebra R with finitely many étale coordinates and a\n  point y in X(R) that embeds\
        \ Spec R as an open subfunctor, its `locus`.\n* `New.Variety.offDiagonal`: The complement of the diagonal\
        \ in X × X: pairs of points whose values\n  in every field are distinct.\n* `New.Variety.relFreeAb`: For\
