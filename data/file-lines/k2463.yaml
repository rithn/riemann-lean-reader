- module: Development.AutomorphicArithmetic.CharacterBoxes.MainConclusion
  depth: 4
  lines: 14
  line: Proves right-half-plane nonvanishing for Dirichlet L-functions and deduces the Riemann hypothesis.
  reading: >-
    For every positive modulus and every Dirichlet character, the associated L-function is nonzero in Re s > 1/2,
    with s = 1 excluded for the principal character. The proof uses a Galois local–global compatibility hypothesis
    to obtain the automorphy input for the nonvanishing theorem, supplies local Langlands parameter existence, and
    discharges the compatibility hypothesis with a theorem derived from a theta lift. It then applies the imported
    reduction to the Riemann hypothesis. Supplements.Kernels.MainTheorems uses the nonvanishing theorem to put every
    zero of a primitive Dirichlet L-function in the open critical strip on the critical line.
  key_decls:
  - name: UpperTheory.FinalTheorems.everyCharacter_of_row
    gloss: >-
      Derives right-half-plane nonvanishing for all Dirichlet L-functions from the Galois local–global compatibility
      hypothesis for the local Langlands parameters.
  - name: UpperTheory.FinalTheorems.everyCharacter
    gloss: >-
      Establishes L(s, χ) ≠ 0 for every Dirichlet character χ of positive modulus when Re s > 1/2 and either χ is
      nonprincipal or s ≠ 1.
  - name: UpperTheory.FinalTheorems.riemannHypothesis
    gloss: Establishes that every nontrivial zero of the Riemann zeta function has real part 1/2.
