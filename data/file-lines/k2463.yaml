      representation whenever the original rank-two Galois representation over ℚ has such an attachment, is continuous,
      and remains irreducible on every open subgroup.
  - name: UpperTheory.V.Sd.Hypotheses4L.cube
    gloss: >-
      Assumes that the symmetric cube of a continuous rank-two Galois representation over ℚ is attached to a regular
      algebraic cuspidal representation if the original has such an attachment and remains irreducible on every
      open subgroup and the cube is irreducible.
  - name: UpperTheory.V.Sd.Hypotheses4L.ind
    gloss: >-
      Assumes that across a quadratic extension of totally real fields, a cuspidal representation either has matching
      infinitesimal characters and almost-everywhere matching Satake data above the same place or admits cuspidal
