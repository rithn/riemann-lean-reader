    over ℚ without nontrivial self-twists. At finite places, given valid reciprocity and both local components,
    it compares Weil characteristic polynomials and preserves zero monodromy. SymLow specializes SymSat to the symmetric
    square. A continuous attached rank-two Galois representation irreducible on each open subgroup excludes nontrivial
    self-twists. For these inputs with regular algebraic cuspidal attachment over ℚ, the last two hypotheses assert
    such attachment for the inverse cyclotomic twist of the trace-zero adjoint and the symmetric cube if irreducible.
  key_decls:
  - name: UpperTheory.V.Lit.NewtonThorneSym
    gloss: >-
      Asserts that a regular algebraic cuspidal GL₂ representation over ℚ with no nontrivial Hecke-character self-twist
      has a regular algebraic cuspidal lift to GLₙ₊₁ for each n ≥ 1, such that at each finite place, given valid
      local reciprocity and both local components, source eigenvalues a and b give lift eigenvalues aⁿ⁻ⁱbⁱ for 0
      ≤ i ≤ n at the same Weil element, counted with multiplicity, and zero source monodromy implies zero lift monodromy.
  - name: UpperTheory.V.Lit.NonCM
    gloss: >-
      Asserts that a cuspidal GL₂ representation over ℚ has no nontrivial Hecke-character self-twist if its attached
      continuous Galois representation stays irreducible on every open subgroup.
  - name: UpperTheory.V.Lit.SymSat
    gloss: >-
      Asserts the same regular algebraic cuspidal symmetric-power existence under the same hypotheses, with a source
      Satake pair {α, β} and a lift Satake multiset of αⁿ⁻ⁱβⁱ for 0 ≤ i ≤ n at almost all primes.
  - name: UpperTheory.V.Lit.AdAutQ
    gloss: >-
      Asserts regular algebraic cuspidal attachment for the inverse cyclotomic twist of the trace-zero adjoint of
      a continuous rank-two Galois representation over ℚ that has such an attachment and stays irreducible on every
