- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.ModularityArgument.ThresholdArguments.DenseThresholdCases.TWeylC
  depth: 9
  lines: 45
  line: >-
    Constructs algebraic coefficient representations with prescribed infinitesimal characters and an explicit polynomial
    dimension bound.
  reading: >-
    For a totally imaginary number field E and strictly decreasing integers mᵢ with |mᵢ| ≤ H, the theorem realizes
    the multiset {−mᵢ − (n−1)/2} at every complex embedding. It uses the dominant nonnegative weight νₖ = k + 1
    + H − m_{n−1−k} for zero-based indices k, then applies determinant twists and tensors over the embeddings. The
    dimension is at most ((n+1)²(H+1))^A, where A = n²[E:ℚ]. BrCardP and TCardK use these coefficients with cohomological
    bounds to bound pairwise nonisomorphic families of polarized and conjugate-dual cuspidal representations, respectively,
    over CM fields at prescribed weight and bounded level.
  key_decls:
  - name: UpperTheory.V.Af.weyl_complex_of_printed_results
    gloss: >-
      With the literature hypothesis bundle as a parameter, the theorem supplies an algebraic coefficient representation
      for GLₙ over any totally imaginary number field E with infinitesimal character {−mᵢ − (n−1)/2} at every embedding
      and dimension at most ((n+1)²(H+1))^(n²[E:ℚ]) whenever the integers mᵢ are strictly decreasing and bounded
      in absolute value by H.
  blueprint: []
  status: fixed
  check:
