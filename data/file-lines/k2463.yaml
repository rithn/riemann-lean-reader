- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.ModularityArgument.ThresholdArguments.DenseThresholdCases.EGIndAutCs
  depth: 7
  lines: 42
  line: >-
    Derives regular algebraic cuspidal automorphy for semisimple rank-four Galois representations with quadratic
    induction data.
  reading: >-
    The cuspidal induction hypothesis gives the induced representation’s infinitesimal character at each complex
    embedding as the multiset sum of the two rank-two characters above it, and distinctness of the four weights
    gives regular algebraicity. The induced Satake parameters identify the resulting cuspidal representation with
    the inverse cyclotomic twist of the given Galois representation. Twisting back gives automorphy in the original
    normalization. BirthTop and IndAutLOfSplit use the theorem as a rank-four automorphy input.
  key_decls:
  - name: UpperTheory.V.Z.InvariantSubmoduleMonicPolynomial.E.indAutCs_of_alt
    gloss: >-
      Given the automorphic and cuspidal induction hypotheses, a semisimple rank-four Galois representation with
      the characteristic polynomials of quadratic induction between totally complex number fields from an attached
      rank-two representation is regular algebraic cuspidal automorphic if the four weights above each complex embedding
      are distinct and every nonsplit finite place is unramified with Satake parameters for the rank-two input at
      every place above it.
  - name: infOf_two
    gloss: >-
      The normalized rank-two infinitesimal character consists of the two integer weights shifted by one half.
  - name: infOf_add
    gloss: >-
      If the four integer weights are distinct, the union of the two normalized rank-two infinitesimal characters
      has no repetitions and lies in 3/2 + ℤ.
  - name: tw_back
    gloss: >-
      Twisting by the inverse cyclotomic character and then by the cyclotomic character recovers the original representation.
