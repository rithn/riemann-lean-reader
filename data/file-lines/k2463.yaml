    windows.
  reading: >-
    The tensor proposition asks for a single j between 1 and 9 such that every admissible rank-two auxiliary datum
    at j gives a rank-four tensor with cuspidal automorphy and uniform local windows on the eligible restrictions.
    Other definitions formulate quadratic induction, window transfer along a tower, sphericality from unramifiedness,
    split control at bad places, and potential unramifiedness for ordinary twists. Two elementary lemmas package
    conjugate self-dual automorphy and its local witness data. AutomorphyRankFour proves the tensor proposition
    from additional inputs.
