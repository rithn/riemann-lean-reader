    gloss: >-
      Under the literature hypotheses, a nontrivial finite-order Hecke self-twist of uniquely specified Satake data
      yields a nontrivial Galois character with open kernel whose twist preserves the attached continuous semisimple
      representation up to isomorphism and whose restriction is trivial over every extension satisfying the norm-character
      condition.
