  line: >-
    Proves rank-two base change with preservation of infinitesimal characters for solvable and real-to-complex quadratic
    extensions.
  reading: >-
    Under Af.Hypotheses′ and the respective rank-two lifting hypotheses, both results start with a regular algebraic
    cuspidal representation attached to a continuous Galois representation and produce a regular algebraic cuspidal
    lift attached to its restriction when that restriction is irreducible. The solvable proof iterates prime-degree
    cyclic lifts using fixed fields of normal subgroups of prime index. Irreducibility rules out the self-twist
    alternative, and Frobenius compatibility identifies the restricted Galois data. AutNewformAOfEx applies the
    quadratic and solvable lifts in succession.
  key_decls:
  - name: UpperTheory.V.Z.Bc.upSolI_of_alt
    gloss: >-
      Under Af.Hypotheses′ and the prime-degree cyclic lifting hypothesis, if the continuous Galois representation
      attached to a rank-two regular algebraic cuspidal input stays irreducible along a solvable Galois extension
      of totally complex fields, there is a regular algebraic cuspidal lift attached to that restriction and preserving
      infinitesimal characters under pullback.
  - name: UpperTheory.V.Z.Bc.upQuadI_of_alt
    gloss: >-
      Under Af.Hypotheses′ and the quadratic lifting hypothesis, if the continuous Galois representation attached
      to a rank-two regular algebraic cuspidal input over a totally real field stays irreducible over a totally
      complex quadratic extension, there is a regular algebraic cuspidal lift attached to that restriction and preserving
      infinitesimal characters under pullback.
  - name: upCycI
    gloss: >-
      Under Af.Hypotheses′ and CyclicBaseChangeLiftRankTwo, a rank-two regular algebraic cuspidal input with an
