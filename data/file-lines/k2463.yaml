- module: Development.AutomorphicArithmetic.AutomorphicVarieties.SmallClassNumbers.CorGKOf
  depth: 2
  lines: 29
  line: Proves polynomial bounds for logarithmically weighted sums of normalized Selmer lengths.
  reading: >-
    The proof combines a rank-three congruence-number estimate with a character-by-character Selmer estimate derived
    using Kato’s vanishing, rigidity, and unramified automorphy. It assembles the local, automorphic, Galois-cohomological,
    and complex multiplication inputs from the literature and obtains the required hypotheses by patching with weak
    descent. The general bound specializes via the imaginary quadratic field of discriminant −3 to the trivial character
    modulo 2.
  key_decls:
  - name: UpperTheory.V.SmallClassNumbers.corGK_of
    gloss: >-
      Under the stated hypotheses, if at least one character with kernel H satisfies GD at each summed prime, all
      lengths in those kernel classes are finite and their log-weighted normalized sum is at most 2c₅ φ([(ℤ/Nℤ)×
      : H]) [N(e+1)]^A (log p + log p′) for distinct auxiliary primes p and p′ neither of which divides 30N|disc
      K|.
  - name: UpperTheory.V.SmallClassNumbers.litN
    gloss: >-
      Establishes the rank-N literature hypothesis by assembling local, automorphic, Galois-cohomological, and complex
      multiplication inputs.
  - name: UpperTheory.V.SmallClassNumbers.corGK
    gloss: >-
      Establishes the general finiteness and weighted Selmer-length bound by supplying the hypotheses of the conditional
      result.
  - name: UpperTheory.V.SmallClassNumbers.bound
    gloss: >-
      For every positive even e, the Selmer lengths for the trivial character modulo 2 are finite at primes ℓ ≥
      5 with ℓ − 1 not dividing 2e, and their logarithmically weighted normalized sum over any finite set of such
      primes is bounded by C(e + 1)^A for uniform constants C and A.
