  reading: >-
    For a cuspidal representation π of GLₙ over a totally real field, invariance of its Satake multiset under b
    ↦ ψ(v)/b at almost all finite places gives twisted self-duality by the Hecke character ψ. Inverse transpose
    inverts the Satake parameters, so strong multiplicity one identifies π with its ψ-twisted contragredient. The
    Gelfand–Kazhdan pairing then gives a nondegenerate bilinear pairing with multiplier ψ composed with the determinant.
    TSelfDualR applies this criterion after deriving the Satake symmetry from a Galois pairing.
  key_decls:
  - name: UpperTheory.satake_polarization_real_of_printed_results
    gloss: >-
      Under the stipulated literature hypotheses, a cuspidal representation over a totally real field is twisted
      self-dual by ψ if, outside a finite set of places, ψ is unramified and the Satake multiset is invariant under
      b ↦ ψ(v)/b.
  - name: hasSat_invT
    gloss: >-
      Passing to the inverse-transpose cuspidal representation inverts each Satake parameter with its multiplicity.
  - name: isTwistOf_twist
    gloss: >-
      The constructed Hecke twist multiplies the finite and archimedean compact actions by the character composed
      with the determinant and adds the corresponding differential to the Lie algebra action.
