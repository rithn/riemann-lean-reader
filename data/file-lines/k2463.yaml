    across the field isomorphism. At higher degree it takes the fixed field of a normal subgroup of prime index,
    applies prime-degree cyclic base change, and invokes induction on the remaining extension. TSeedInW applies
    the theorem to a rank-two representation before twisting by an algebraic character.
