    gloss: >-
      Under the stated automorphic and cyclic base-change hypotheses, a continuous positive-rank Galois representation
      attached to a regular algebraic cuspidal representation over a totally complex field remains so attached after
      irreducible restriction to a finite solvable Galois extension.
  - name: exists_prime_index
    gloss: Every nontrivial finite solvable group has a normal subgroup of prime index.
  - name: closure_tower
    gloss: An algebraic closure of an algebraic extension is also an algebraic closure of the base field.
