- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.ModularityArgument.ThresholdArguments.DenseThresholdCases.BirthAwChain
  depth: 7
  lines: 47
  line: >-
    Propagates local character bounds for rank-two automorphic Galois representations through base change and twisting.
  reading: >-
    Under HypothesesH', a continuous rank-two Galois representation over a totally real field must restrict irreducibly
    to the top and have a regular algebraic cuspidal attachment with plain toral components or Satake data at each
    finite place. The proof uses quadratic CM base change, an algebraic twist and cyclic base change along a solvable
    tower. Each resulting regular algebraic cuspidal attachment has toral components and one exponent t such that
    at each finite place of residue cardinality q, cuspidal-support character values on uniformizers have modulus
    strictly between q^(t−1/2) and q^(t+1/2). BirthIndS and AutomorphicLiftGsp4OfInputs use the bounds for sphericity
    at nonsplit places.
  key_decls:
  - name: UpperTheory.V.Z.Win.Birth.awChain_of_printsH
    gloss: >-
      Under HypothesesH', a continuous rank-two Galois representation satisfying PR (a regular algebraic cuspidal
      attachment over the totally real base with plain toral components or Satake data at each finite place) and
      irreducible on restriction to the top has AllW after quadratic CM restriction, an algebraic character twist
      and solvable Galois restriction.
  - name: contTwist
    gloss: Twisting a continuous matrix representation by a continuous character preserves continuity.
