  depth: 7
  lines: 32
  line: >-
    Proves that algebraic character twists preserve regular algebraic cuspidal automorphy over totally complex fields.
  reading: >-
    The proof twists the cuspidal representation by the algebraic Hecke character corresponding to the ℓ-adic twisting
    character. At each complex embedding, the twist translates all infinitesimal weights by the same integer, preserving
    distinctness and the required integrality. Compatibility of Galois attachment with twisting identifies the resulting
    representation. EGIndAutCs uses the theorem to undo an inverse cyclotomic twist after quadratic induction.
  key_decls:
  - name: UpperTheory.V.Sd.twist_conjugate_selfDual
    gloss: >-
      Over a totally complex number field, if r is attached to a regular algebraic cuspidal representation π, twisting
      r by an algebraic ℓ-adic character gives the representation attached to the corresponding Hecke-character
      twist of π, which is again regular algebraic and cuspidal.
  - name: isAlg_of_pos
    gloss: >-
      Over a totally complex field, the algebraicity formula on totally positive elements gives the same formula
      on all nonzero elements.
  - name: regAlg_twist
    gloss: >-
      Twisting a regular algebraic cuspidal representation by an algebraic Hecke character preserves regular algebraicity.
