      asks for a single exponent j from 1 to 9 such that every compatible integral model and admissible auxiliary
      datum at j gives a tensor with regular algebraic cuspidal automorphy and uniform local windows on each irreducible
      restriction to a totally complex abelian extension of ℚ disjoint from the chosen imaginary quadratic field
      K′ and satisfying GoodAt.
