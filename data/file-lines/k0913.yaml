- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.WeightPolynomialTraceIdentity
  depth: 14
  lines: 264
  line: >-
    Derives ordinary and twisted Laurent polynomial identities from trace formulas on the diagonal unitary torus.
  reading: >-
    The ordinary and twisted weight polynomials record dimensions and traces of the dual twist on the dual weight
    spaces. Given a direct sum of these spaces and an equivariant involution satisfying the prescribed torus trace
    formulas, the proof expands each trace by weights and writes the Weyl character as a quotient of alternants.
    It clears the Vandermonde denominators at unitary tuples with pairwise distinct squares, then uses coefficient
    comparison to obtain formal Laurent identities. The importing module uses these identities to prove GlobalTheory.T.weight_polynomial_trace_identity.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.Ident.trace_decomp
    gloss: >-
      When the dual is the direct sum of its weight spaces, the trace of \(\rho(k^{-1})T\) for diagonal \(k\) and
      equivariant \(T\) is the sum of the dual twist traces multiplied by their weight monomials over a finite set
      containing every weight with a nonzero dual weight space.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.Ident.weylChar_evL
    gloss: >-
      Expresses Lean’s weylChar on nonzero coordinates as the totalized quotient of the evaluated alternants \(A_{\lambda+\delta}\)
      and \(A_\delta\), with \(\delta=(n-1,\ldots,0)\) and a nonzero denominator for pairwise distinct coordinates.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.Ident.evL_frL
    gloss: Doubling all exponents before evaluation has the same effect as squaring each evaluation coordinate.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.Ident.eq_zero_of_evL
    gloss: >-
      A Laurent polynomial vanishing at every unitary tuple with pairwise distinct coordinate squares is identically
      zero.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.Ident.lefK_laurent_ident
    gloss: >-
      For an equivariant involution satisfying the prescribed torus trace formulas and a direct sum of dual weight
      spaces, the ordinary and twisted weight polynomials formed over a finite set containing every weight with
      a nonzero dual weight space satisfy \(W_1(z)A_\delta(z)^2=P(z)A_{\lambda+\delta}(z)^2\) and \(W_T(z)A_\delta(z^2)=P(z)A_{\lambda+\delta}(z^2)\),
      where \(P(z)=\prod_{a,b}(1+z_a/z_b)\).
