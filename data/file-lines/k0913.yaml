  - name: GlobalTheory.CompanionTheory.RealCountG.WtInt.expU_two_pi
    gloss: For a diagonal matrix unit E_aa, the subgroup generated by iE_aa returns to the identity at 2π.
  - name: GlobalTheory.CompanionTheory.RealCountG.WtInt.eigen_int
    gloss: >-
      Under the prescribed orbit derivative formula, every real eigenvalue of a diagonal generator is an integer.
  - name: GlobalTheory.CompanionTheory.RealCountG.WtInt.weight_integral
    gloss: >-
