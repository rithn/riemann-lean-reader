- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.HarmonicOfNormBound
  depth: 10
  lines: 779
  line: Proves that a shifted norm bound forces a dominated weight to be harmonic.
  reading: >-
    For weakly decreasing integer weights λ and ν with wtR(ν) dominated by m0(λ), set y = (wtR(ν) − ρ) ∘ w + ρ,
    where ρ = rhoV(n) and w orders the shifted coordinates decreasingly. Abel summation and a decreasing majorant
    for interval counts show that y is dominated by m0(λ). The lower bound on the squared norm of y then forces
    equality with m0(λ), and the resulting permutation splits into reversals of contiguous blocks on which λ is
    constant. This yields ν ∈ harmZ(λ), and the companion statement module invokes the criterion directly.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RealCountG.mem_harmZ_of_norm_ge
    gloss: >-
      Under the dominance and ordering hypotheses, ν belongs to harmZ(λ) if the squared norm of the shifted and
      reordered weight y is at least that of m0(λ).
  - name: GlobalTheory.CompanionTheory.RealCountG.LemmaHG.maj
    gloss: >-
      Constructs a nonnegative decreasing sequence whose prefix sums majorize the subset counts in an interval,
      with equality for the full interval and a bound relating its first moment to the selected indices.
  - name: GlobalTheory.CompanionTheory.RealCountG.LemmaHG.step1
    gloss: >-
      Under the monotonicity and dominance hypotheses, every k-coordinate sum of wtR(ν) − ρ is bounded by the first
      k coordinates of m0(λ) − ρ.
  - name: GlobalTheory.CompanionTheory.RealCountG.LemmaHG.blocks
    gloss: >-
      For a permutation f whose adjacent steps are ascents or unit descents, the indices where f(i) + i takes a
      given value form an interval [p, q) on which f(i) = p + q − 1 − i.
  - name: GlobalTheory.CompanionTheory.RealCountG.LemmaHG.harm_of_perm
    gloss: >-
      For weakly decreasing λ and ν, the identity νᵢ = 2λ_{π(i)} + n − 1 − π(i) − i for a permutation π of the zero-based
      indices implies ν ∈ harmZ(λ).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
