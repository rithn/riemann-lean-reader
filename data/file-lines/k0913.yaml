- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.HighestWeightOfUnitaryDerivative
  depth: 14
  lines: 143
  line: Proves integrality of the real joint weights of diagonal generators arising from a U(n) action.
  reading: >-
    For a nonzero eigenvector of G_aa with real eigenvalue r, the orbit along exp(t iE_aa) has derivative ir times
    the orbit at every t, by translation of the derivative at zero. Multiplication by exp(−itr) makes the orbit
    constant, so the subgroup’s 2π period forces exp(−2πir) = 1 and hence r ∈ ℤ. Applying this to each diagonal
    generator gives the joint-weight theorem restated as GlobalTheory.T.highest_weight_of_unitary_derivative.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RealCountG.WtInt.expU_add
