- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.CyclicStandardTournament
  depth: 11
  lines: 239
  line: >-
    Proves that transitive tournaments maximize the sum of squared signed scores and uses this to bound second-type
    weights.
  reading: >-
    The tournament bound equates three times the sum of squared row scores with the sum of the cyclic expression
    over ordered triples and compares each triple with the transitive orientation. Reversing the edges in a subset
    of positive roots gives signed scores equal to twice ρ minus twice the sum of those roots. For a nonempty subset
    joining strictly increasing levels, the positive coordinate gaps of the base harmonic weight then force the
    second-type weight to have strictly smaller ρ-shifted norm. The importing module combines this bound with membership
    in the set of top weights.
  key_decls:
  - name: GlobalTheory.CompanionTheory.MultOne.ShortSecondWeights.cyclic_standard_tournament
    gloss: Shows that the triple expression equals one on distinct vertices in the transitive tournament.
