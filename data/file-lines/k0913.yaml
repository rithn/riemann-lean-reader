- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.ExistsHighestWeightInInvariantSubmodule
  depth: 14
  lines: 131
  line: >-
    Proves that every nonzero invariant subspace of a finite-dimensional gl_n(ℂ)-module with G_ab* = G_ba contains
    a highest-weight vector.
  reading: >-
    The diagonal generators restrict to commuting Hermitian operators on the invariant subspace, so simultaneous
    diagonalization gives a real joint weight. All joint weights lie in the finite product of the real spectra of
    the diagonal operators. The matrix-unit commutator relations show that G_ab shifts a weight by e_a−e_b whenever
    the resulting vector is nonzero. For a < b this shift increases the weight lexicographically, so every raising
    operator kills a vector of lexicographically maximal weight. The direct importer restates the existence theorem
    as GlobalTheory.T.exists_highest_weight_in_invariant_submodule.
