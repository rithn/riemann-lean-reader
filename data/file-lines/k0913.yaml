  - name: GlobalTheory.CompanionTheory.HarmCone.dsg_nonneg
    gloss: >-
      The change in a pairwise sign from ℓ to ℓ′, multiplied by the original level difference ℓ(a) − ℓ(b), is nonnegative.
  - name: GlobalTheory.CompanionTheory.HarmCone.pairing_nonneg
    gloss: The pairing of the original levels with the vector of row sums of the sign changes is nonnegative.
  - name: GlobalTheory.CompanionTheory.HarmCone.harm_cone
