    norm of the base harmonic weight. For a second-type weight ν, ν + ρ is a coordinate permutation of the vector
    obtained by subtracting the sum of a nonempty set of those roots from μ_Q + ρ, and its squared norm is strictly
    smaller than that of μ_Q + ρ. The strict bound combines positive coordinate gaps with a triple-by-triple estimate
    on skew sign matrices obtained by reversing the selected pairs. The importing statement module exposes this
    exclusion for real Levi descent.
