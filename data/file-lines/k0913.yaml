- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.IsCliff
  depth: 10
  lines: 53
  line: Defines Clifford matrix families, their spin operators, and weight data for unitary representations.
  reading: >-
    The weight definitions give the shifted integral weight m0Z, the coordinatewise embedding wtR into real weights,
    dominance by prefix sums with equal totals, and diagonal torus weight spaces in the continuous dual. IsCliff
    imposes anticommutator and adjoint relations on a matrix family. The spin matrices are quadratic in that family,
    and yF adds their action to the coordinatewise action of Kf. SpinGlRelationsAdjoint uses these definitions to
