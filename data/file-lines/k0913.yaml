    gloss: Assigns to each index the number of indices at strictly lower levels.
  - name: GlobalTheory.CompanionTheory.LevelCompress.lowCount_lt_iff
    gloss: One index has a smaller count than another exactly when its original level is smaller.
  - name: GlobalTheory.CompanionTheory.LevelCompress.muQ_lowCount
    gloss: Replacing the levels by their counts preserves the weight μ_Q.
  - name: GlobalTheory.CompanionTheory.LevelCompress.exists_compress
    gloss: >-
      Every admissible natural-number level function on n indices has an admissible replacement with labels in {0,
      …, n−1} and the same weight μ_Q.
