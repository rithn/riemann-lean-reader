    Proves that every unitary matrix is unitarily diagonalizable and is the exponential of a skew-Hermitian matrix.
  reading: >-
    For a unitary matrix \(K\), the proof simultaneously diagonalizes the commuting Hermitian matrices \(K+K^*\)
    and \(i(K-K^*)\), obtaining a unitary eigenbasis for \(K\). Its eigenvalues have modulus one, so multiplying
    their arguments by \(i\) gives diagonal logarithms that yield a skew-Hermitian logarithm in the original basis.
    DerivativeUnitaryAction uses this exponential description to show that an infinitesimal intertwiner also intertwines
    the \(U(n)\)-actions.
  key_decls:
  - name: GlobalTheory.CompanionTheory.UnitaryExp.exists_unitary_diag
    gloss: >-
      Every complex unitary matrix \(K\) admits a unitary \(V\) for which \(V^*KV\) is diagonal with all entries
      of modulus one.
  - name: GlobalTheory.CompanionTheory.UnitaryExp.exists_skew_exp_eq
    gloss: >-
      Every \(k\in U(n)\) admits a complex matrix \(X\) with \(X^*=-X\) and \(\exp(X)=k\) as an invertible matrix.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.GelfandTransference.HadamardGelfand.Highest
  depth: 15
  lines: 101
  line: Proves a recurrence for the diagonal entries of matrix powers acting on a highest-weight vector.
  reading: >-
    Let E be a matrix over an associative ring whose entries satisfy the standard glₙ commutator relations, and
    let v be a module vector killed by the strictly upper entries with integral diagonal weights ν. The defining
    left-multiplication recurrence and the commutator formula for entries of powers show by induction that all strictly
    upper entries of Eᵏ kill v. Writing Dₖ(a) for the action of (Eᵏ)ₐₐ on v, the proof uses right multiplication
    to obtain Dₖ₊₁(a) = (νₐ + n − 1 − a)Dₖ(a) − ∑_{b>a} Dₖ(b), with indices starting at zero.
  key_decls:
  - name: Formalism.HadamardInequality.P.epow_succ_right
    gloss: The recursively defined power Eᵏ⁺¹ is obtained by multiplying Eᵏ by E on the right.
  - name: Formalism.HadamardInequality.P.epow_upper_kill
    gloss: >-
      Under the glₙ commutator relations, every strictly upper entry of every power of E annihilates a vector annihilated
      by the strictly upper entries of E.
  - name: Formalism.HadamardInequality.P.epow_diag_smul_highest_weight
    gloss: >-
      Under the glₙ commutator relations, for a vector killed by the strictly upper entries with integral diagonal
      weights ν, the a-th diagonal action at power k + 1 is the action at power k scaled by the integer νₐ + n −
      1 − a, minus the sum of the power-k diagonal actions at indices b > a.
  - name: Formalism.HadamardInequality.P.highest_weight_diagonal_holds
    gloss: >-
      The diagonal recurrence holds for every ring, module, matrix satisfying the glₙ commutator relations, and
      vector with the stated highest-weight conditions.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.ExistsHighestWeightHermitianDerivation
  depth: 16
  lines: 340
  line: >-
    Constructs a unitary highest-weight model with adjoint-compatible infinitesimal operators and a Weyl character
    formula.
  reading: >-
    For each weakly decreasing integral weight, the matrix action is transported to a Euclidean space where \(U(n)\)
    preserves the inner product. Differentiating this invariance along skew-Hermitian exponentials yields \(K_{ab}^{*}=K_{ba}\).
    Vectors killed by all raising operators are fixed by the upper unitriangular subgroup, whose fixed space is
    the highest-weight line. On diagonal unitary elements with distinct entries, the trace is the Weyl character.
    The importing statement module invokes rmModel directly.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RmModel.exists_frame
    gloss: >-
      Gives a complex-linear identification with Euclidean space in which the matrix action of \(U(n)\) preserves
      the inner product.
  - name: GlobalTheory.CompanionTheory.RmModel.fix_of_killed
    gloss: >-
      A vector killed by every strictly upper-triangular matrix-unit operator is fixed by every upper unitriangular
      matrix.
  - name: GlobalTheory.CompanionTheory.RmModel.line_of_killed
    gloss: >-
      Every vector in the joint kernel of the raising operators is a scalar multiple of the distinguished highest-weight
      vector in matrix coordinates.
  - name: GlobalTheory.CompanionTheory.RmModel.herm_frame
    gloss: >-
      In coordinates with invariant inner product, the operators attached to the matrix units \(E_{ab}\) and \(E_{ba}\)
      are adjoints.
  - name: GlobalTheory.CompanionTheory.RmModel.rmModel
    gloss: >-
      For each weakly decreasing integral weight \(\nu\), constructs a finite-dimensional unitary representation
      with infinitesimal operators satisfying the matrix-unit commutator and adjoint relations, a joint raising
      kernel equal to a line of weight \(\nu\), and trace equal to the Weyl character on diagonal elements with
      distinct entries.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.GelfandTransference.HadamardGelfand.Gelfand
  depth: 16
  lines: 34
  line: >-
    Proves that the glₙ commutator rule extends to commutators of matrix entries with entries of any power.
  reading: >-
    For a matrix E over a possibly noncommutative ring whose entries satisfy the standard glₙ relations, the theorem
    expresses each commutator of an entry of E with an entry of Eᵏ as a difference of two Kronecker-delta terms.
    The proof inducts on k using the Leibniz rule for commutators in the matrix product. The highest-weight argument
    uses the identity both to prove that strictly upper entries of Eᵏ annihilate a highest-weight vector and to
    derive the recurrence for the action of the diagonal entries.
  key_decls:
  - name: Formalism.HadamardInequality.P.comm_epow
    gloss: >-
      Under the glₙ relations, [E_{cd}, (Eᵏ)_{ab}] = δ_{da}(Eᵏ)_{cb} − δ_{bc}(Eᵏ)_{ad} for every nonnegative integer
      k.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.DifferentiableCoeffRowAct
  depth: 17
  lines: 91
  line: Proves entrywise holomorphy of the representation matrix \(R_m\) on \(\mathrm{GL}_n(\mathbb C)\).
  reading: >-
    For a fixed multivariate polynomial, induction on the polynomial shows that every coefficient after the row
    action by \(M^{\mathsf T}\) depends holomorphically on \(M\). Near each invertible matrix, every entry of \(R_m\)
    is a finite linear combination of these coefficients multiplied by an integral power of the determinant, which
    is holomorphic there. ExistsHighestWeightHermitianDerivation uses this result to differentiate the representation
    along matrix exponential curves.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RmHol.differentiable_entry
    gloss: Each coordinate projection \(M\mapsto M_{ab}\) is complex differentiable on the full matrix space.
  - name: GlobalTheory.CompanionTheory.RmHol.differentiable_det
    gloss: >-
      The determinant is complex differentiable on the full matrix space by its expansion as a finite sum of products
      of entries.
  - name: GlobalTheory.CompanionTheory.RmHol.differentiable_coeff_rowAct
    gloss: >-
      Every monomial coefficient of the row transform of a fixed polynomial by \(M^{\mathsf T}\) is complex differentiable
      as a function of \(M\).
  - name: GlobalTheory.CompanionTheory.RmHol.detPow_nonsingInvUnit
    gloss: >-
      For an invertible matrix \(M\), the determinant character with integer exponent \(c\) evaluates to \((\det
      M)^c\).
  - name: GlobalTheory.CompanionTheory.RmHol.holRm
    gloss: >-
      For every integral weight tuple \(\lambda\), each entry of \(R_m(\lambda,M)\) is complex differentiable at
      every invertible \(M\).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.GelfandInfinitesimalCharacter
  depth: 17
  lines: 37
  line: >-
    Collects matrix-coefficient definitions and an entrywise derivative lemma for the matrix exponential.
  reading: >-
    The definitions give a matrix coefficient, its linear functional on the \(U(n)\)-finite vectors, and two combinations
    of the infinitesimal operators attached to \(E_{ab}\) and \(iE_{ab}\). The derivative lemma applies coordinate
    projection to the derivative of the matrix exponential at zero, and ExistsHighestWeightHermitianDerivation uses
    it to differentiate the representation along exponential curves.
  key_decls:
  - name: GlobalTheory.CompanionTheory.GelfAct.hasDerivAt_exp_entry
    gloss: >-
      For every complex matrix \(X\), the real-parameter derivative of \((\exp(tX))_{ab}\) at \(t=0\) is \(X_{ab}\).
  - name: GlobalTheory.CompanionTheory.GelfAct.cf
