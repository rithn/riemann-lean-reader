    equivariant function by two commuting Lie algebra actions obtained from right differentiation. Haar integration
    over the unitary group gives the inner product, with definiteness from Iwasawa decomposition. Evaluation at
    the identity yields the prescribed Gelfand invariant scalars. The evaluation identities, local finiteness, and
    nontriviality of evaluation on each nonzero finite-dimensional stable submodule place every highest weight in
    the harmonic weight plus the level-defined root cone. The importing module restates the model existence theorem.
  key_decls:
