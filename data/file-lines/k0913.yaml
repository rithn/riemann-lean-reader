- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.DiracKHolds
  depth: 11
  lines: 152
  line: >-
    Proves integrality of unitary diagonal weights and verifies the Lie bracket relations for the sum of two commuting
    actions.
  reading: >-
    The unitary exponential satisfies the one-parameter subgroup law, and each diagonal coordinate circle returns
    to the identity at time 2π. For a nonzero diagonal eigenvector of real weight r, the orbit satisfies the differential
    equation with scalar ir, so periodicity gives exp(2πir) = 1 and hence r ∈ ℤ. The sum of the two general linear
    actions satisfies the same bracket relations because the mixed commutators vanish. The importing proof uses
    both facts in the Dirac inequality for compact highest weights.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RealMult.DiracProof.expU_add'
    gloss: >-
      Shows that exponentiating real multiples of a fixed skew-Hermitian matrix gives a one-parameter subgroup of
      the unitary group.
  - name: GlobalTheory.CompanionTheory.RealMult.DiracProof.expU_two_pi
    gloss: >-
      Shows that the diagonal coordinate subgroup generated by i times a diagonal matrix unit returns to the identity
      at time 2π.
  - name: GlobalTheory.CompanionTheory.RealMult.DiracProof.weight_int
    gloss: >-
      Proves that a real eigenvalue of a diagonal infinitesimal operator in a differentiated unitary action is integral.
  - name: GlobalTheory.CompanionTheory.RealMult.DiracProof.kF_gl
    gloss: >-
      Verifies the general linear bracket relations for the entrywise sum of two commuting general linear actions.
