- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.InducedFunctionKHighestWeight
  depth: 13
  lines: 395
  line: Proves the highest-weight equations for the induced function under the diagonal Lie algebra action.
  reading: >-
    For a weakly decreasing integral weight λ constant on the blocks of a nondecreasing level sequence ℓ, the diagonal
    weight at index a is 2λ_a plus the number of indices of higher level minus the number of indices of lower level.
