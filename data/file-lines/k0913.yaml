- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.RealFirstNilpotent
  depth: 11
  lines: 147
  line: >-
    Proves that two harmonic weights coincide if their difference lies in the root monoid of the starting level
    function.
  reading: >-
    For a fixed dominant integral λ, let μ and μ′ come from admissible levels ℓ and ℓ′. If μ′ − μ is a nonnegative
    integral sum of roots e_a − e_b with ℓ(a) < ℓ(b), then μ′ = μ. The proof uses antisymmetry to write the pairing
    of μ′ − μ with ℓ as half the sum of pairwise sign changes times the original level differences. Each product
    is nonnegative, while each allowed root pairs strictly negatively with ℓ. The importing module restates the
    result as the first nilpotent condition.
  key_decls:
