- module: >-
    Development.WeilBound.RepresentationTheoryGL.ArchimedeanBaseChange.ArchimedeanBaseChangeProof.RealDescent.RealLeviDescent.NoSecondTypeWeight
  depth: 12
  lines: 39
  line: >-
    Defines second-type weights, admissibility, and the multiplicity-one statement for a cyclic module at a block
    harmonic weight.
  reading: >-
    A second-type weight is obtained by subtracting a nonempty sum of distinct roots from earlier to later blocks
    from the ρ-shifted harmonic weight, sorting into strictly decreasing order, and undoing the shift. Admissibility
    requires vanishing of all such highest-weight spaces along with the prescribed infinitesimal characters and
    a locally finite diagonal action. The multiplicity statement concerns vectors of the block harmonic highest
    weight reached from a nonzero highest-weight vector of that same weight. ConeWeightsNotSecondType uses these
    definitions to formulate cone exclusion and a cone bound on highest weights in the cyclic span.
  key_decls:
  - name: PositivityTheory.RgBcC.RealD.wtB
    gloss: Assigns to a set of pairs B the root sum ∑_{(a,b)∈B}(eₐ − eᵦ).
  - name: PositivityTheory.RgBcC.RealD.IsSecondTypeWeight
    gloss: >-
      Characterizes ν by requiring ν + ρ to be a strictly decreasing permutation of the shifted block harmonic weight
      minus a sum of distinct roots from a nonempty set of earlier-to-later block pairs.
