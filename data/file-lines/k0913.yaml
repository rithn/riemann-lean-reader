- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.CPoly
  depth: 13
  lines: 36
  line: Defines the Laurent-polynomial ingredients for weight-space trace identities and Weyl alternants.
  reading: >-
    The group algebra of the integral weight lattice is realized as a Laurent-polynomial algebra, with evaluation
    sending each weight monomial to the corresponding product of powers of nonzero coordinates. The definitions
    give a signed permutation sum, the staircase exponent (n−1, …, 0), the product ∏ₐ,ᵦ(1 + xₐ/xᵦ), an exponent-doubling
    map, and a polynomial assembled from finitely many weight coefficients. WeightPolynomialTraceIdentity uses these
    definitions to express ordinary and twisted traces on dual weight spaces through Weyl alternants.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.cPoly
    gloss: >-
      Forms the Laurent polynomial Σ_{μ∈s} c(μ)x^μ from coefficients indexed by a finite set of integral weights.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.evL
    gloss: >-
      Evaluates weight monomials at a tuple of nonzero complex numbers and extends this evaluation as an algebra
      homomorphism.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.altL
    gloss: >-
      Forms the alternant by summing the monomials with permuted exponent vectors, weighted by the signs of the
      permutations.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.pPL
    gloss: Defines the Laurent product ∏ₐ,ᵦ(1 + xₐ/xᵦ) over all ordered pairs of coordinate indices.
  - name: GlobalTheory.CompanionTheory.RealCount.Tope.frL
    gloss: >-
      Defines the algebra endomorphism that doubles each exponent vector, equivalently substituting xₐ² for every
      variable xₐ.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
