- module: Formalism.LocalToGlobal.IndefiniteReal.EigenDecomposition
  depth: 9
  lines: 126
  line: >-
    Proves simultaneous orthonormal diagonalization for pairwise commuting complex endomorphisms closed under adjoints.
  reading: >-
    On a finite-dimensional complex inner product space, a pairwise commuting family closed under adjoints admits
    a common orthonormal eigenbasis. The proof chooses a finite basis of the family's linear span from the family
    itself and forms the Hermitian operators T + T* and i(T − T*) for each chosen operator. It assembles orthonormal
    bases of their nonzero joint eigenspaces and recovers the original operators by linearity. The matrix formulation
    uses this theorem to obtain a single unitary change of basis that diagonalizes a commuting family of Hermitian
    matrices.
