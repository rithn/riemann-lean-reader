- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.HasDerivAtMulVec
  depth: 17
  lines: 139
  line: >-
    Derives the infinitesimal highest-weight equations by differentiating the group action on an extremal vector.
  reading: >-
    For a weakly decreasing integral weight \(\lambda\), the proof starts with a nonzero extremal vector and assumes
    entrywise holomorphy of the representation matrix. Along \(\mathbf{1}+tE_{ab}\) for \(a<b\), the vector is fixed,
    while along \(\mathbf{1}+tE_{aa}\) with \(1+t\ne0\) it is multiplied by \((1+t)^{\lambda_a}\). Differentiation
    at zero gives annihilation by the raising operators and diagonal eigenvalues \(\lambda_a\). ExistsHighestWeightHermitianDerivation
    uses these equations to construct its unitary highest-weight model.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RmHol.HW.hv_ne
    gloss: The distinguished extremal vector in the polynomial representation is nonzero.
  - name: GlobalTheory.CompanionTheory.RmHol.HW.hasDerivAt_mulVec
    gloss: >-
      Under entrywise holomorphy, the derivative at zero of \(R_m(\lambda,\mathbf{1}+tB)c\) is \(X_A(\lambda,B)c\),
      coordinate by coordinate.
  - name: GlobalTheory.CompanionTheory.RmHol.HW.fix_upper
    gloss: Every upper elementary unipotent \(\mathbf{1}+tE_{ab}\) with \(a<b\) fixes the distinguished vector.
  - name: GlobalTheory.CompanionTheory.RmHol.HW.diag_act
    gloss: >-
      For weakly decreasing \(\lambda\) and \(1+t\ne0\), the diagonal matrix \(\mathbf{1}+tE_{aa}\) acts on the
      distinguished vector by \((1+t)^{\lambda_a}\).
  - name: GlobalTheory.CompanionTheory.RmHol.HW.exists_hw
    gloss: >-
      For weakly decreasing \(\lambda\) and an entrywise holomorphic representation matrix, there is a nonzero vector
      killed by every raising operator and on which each diagonal infinitesimal operator acts by \(\lambda_a\).
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.LineInverse
  depth: 17
  lines: 120
  line: Derives the matrix-unit commutator relations by differentiating conjugation along \(\mathbf{1}+te\).
  reading: >-
    When \(e^2=\delta e\), the inverse of \(\mathbf{1}+te\) near \(t=0\) is \(\mathbf{1}-\frac{t}{1+t\delta}e\).
    Assuming entrywise holomorphy, the proof inserts this inverse into the conjugation identity and differentiates
    at zero to obtain \([X_A(e),X_A(B)]=X_A(eB-Be)\). Specializing to matrix units gives the commutator relations
    for \(X_u\), which ExistsHighestWeightHermitianDerivation transports to its unitary model.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RmHol.line_inverse
    gloss: >-
      If \(e^2=\delta e\) and \(s(1+t\delta)=t\), then \(\mathbf{1}-se\) is a two-sided inverse of \(\mathbf{1}+te\).
  - name: GlobalTheory.CompanionTheory.RmHol.conj_line
    gloss: >-
      Under entrywise holomorphy and \(e^2=\delta e\), conjugation of \(X_A(B)\) by \(R_m(\mathbf{1}+te)\) agrees
      near zero with \(X_A\) applied to \((\mathbf{1}+te)B(\mathbf{1}-\frac{t}{1+t\delta}e)\).
  - name: GlobalTheory.CompanionTheory.RmHol.comm_XA
    gloss: >-
      Under entrywise holomorphy and \(e^2=\delta e\), the commutator \([X_A(e),X_A(B)]\) equals \(X_A(eB)-X_A(Be)\)
      for every \(B\).
  - name: GlobalTheory.CompanionTheory.RmHol.XA_zero
    gloss: The differential \(X_A\) sends the zero direction to the zero matrix.
  - name: GlobalTheory.CompanionTheory.RmHol.xu_glRel
    gloss: >-
      Under entrywise holomorphy, \(X_{ab}=X_u(a,b)\) satisfies \([X_{ab},X_{cd}]=\delta_{bc}X_{ad}-\delta_{da}X_{cb}\).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.SecondCountableUnitary
  depth: 17
  lines: 371
  line: >-
    Proves Haar averaging identities for a continuous matrix representation of \(U(n)\) and its Gram operator.
  reading: >-
    Haar averaging of \(F(k)^*F(k)\) gives a positive invertible Gram operator for a continuous finite-dimensional
    representation of a compact second-countable group. Right invariance gives \(F(k)^*QF(k)=Q\), and uniqueness
    of the positive square root gives commutation with every unitary operator commuting with the representation.
    The proof establishes second countability of \(U(n)\) and applies these identities to its exterior-algebra and
    tensor-product action. ExistsHighestWeightHermitianDerivation uses the identity, product, and continuity laws
    for \(R_m\) to construct a unitary model.
  key_decls:
  - name: GlobalTheory.CompanionTheory.CxAvg.gram_isUnit
    gloss: >-
      The Haar integral of \(F(k)^*F(k)\) is invertible for a continuous finite-dimensional representation \(F\)
      of a compact second-countable group.
  - name: GlobalTheory.CompanionTheory.CxAvg.gram_invariant
    gloss: The averaged Gram operator \(Q\) satisfies \(F(k)^*QF(k)=Q\) for every group element \(k\).
  - name: GlobalTheory.CompanionTheory.CxAvg.sqrt_commute
    gloss: >-
      Every unitary operator commuting with all \(F(k)\) commutes with the positive square root of the averaged
      Gram operator.
  - name: GlobalTheory.CompanionTheory.CxAvg.continuous_Rm
    gloss: >-
      For every integral weight tuple, the representation matrix \(R_m\) depends continuously on the unitary group
      element.
  - name: GlobalTheory.CompanionTheory.CxAvg.avg
    gloss: >-
      For the concrete \(U(n)\)-action, the positive square root of the averaged Gram operator is invertible and
      self-adjoint, squares to that invariant Gram operator, and commutes with the unitary operators commuting with
      the action.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
