    integral weight λ and each weakly increasing level assignment lev on whose fibers λ is constant. The model has
    two commuting Lie algebra actions and a nonzero highest-weight vector of weight μQ(λ, lev). For every weight
    ν with a nonzero highest-weight vector, ν − μQ(λ, lev) is a nonnegative integer combination of eₐ − eᵦ with
