- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.RealKTypesInCone
  depth: 11
  lines: 446
  line: >-
    Proves a root-cone bound for the highest weights of K-types generated by a harmonic highest-weight vector.
  reading: >-
    Under the admissibility, multiplicity, and model hypotheses, any nonzero highest-weight vector generated from
    a nonzero highest-weight vector of harmonic weight μ_Q has weight in μ_Q plus the nonnegative integral span
    of roots e_a − e_b with ℓ(a) < ℓ(b). The proof lifts the vector to the cyclic submodule of the orthogonal direct
    sum with the model, taking the orthogonal complement of the projection kernel within a finite-dimensional invariant
    subspace of that cyclic submodule. The multiplicity hypothesis at μ_Q and the adjoint identities force the lift
    to have a nonzero model component, which supplies the cone bound. The importing module restates this as the
    K-type generation theorem.
