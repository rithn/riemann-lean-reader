    coordinates. These two algebra actions commute by linearity, and the combined infinitesimal operator is the
    sum of the lifted action on V and the spin matrix action. The Dirac operator sums the products of the lifted
    P_ab and the matrix actions of c_ba. CliffordHighestWeightVector uses the commutation identity to expand the
    Dirac square in its highest-weight argument.
