  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.DominantEqOfNormGe
  depth: 11
  lines: 410
  line: >-
    Proves a shifted dominance bound and an equality criterion from prefix sums and a reverse squared-norm inequality.
  reading: >-
    The prefix-sum estimate bounds the sum of the k largest entries of an index-shifted sequence by splitting at
    the first unselected index and comparing adjacent intervals. Applied to weights, it bounds the decreasing rearrangement
    after subtracting ρ by the corresponding shifted reference weight. With equal totals and successive gaps of
    at least one in the pointwise sum, Abel summation forces all prefix deficits to vanish when the dominated vector
    has at least the reference squared norm. In the harmonic-weight proof, adding ρ back in its original order to
    the rearranged shifted weight gives the reference weight by this criterion.
  key_decls:
  - name: GlobalTheory.CompanionTheory.RealCount.LemmaH.core
    gloss: >-
      If decreasing sequences ν and c satisfy the prefix bounds ν ≤ c − 4i in cumulative sums, the k largest entries
      of ν + i sum to at most the first k entries of c − 3i.
  - name: GlobalTheory.CompanionTheory.RealCount.LemmaH.abel
    gloss: >-
      Bounds a weighted sum below by the sum of its prefix sums and an endpoint term when the prefix sums are nonnegative
      and successive weights drop by at least one.
  - name: GlobalTheory.CompanionTheory.RealCount.LemmaH.eq_of_dom
    gloss: >-
      For vectors with equal totals and successive gaps of at least one in their pointwise sum, prefix dominance
      and the reverse squared-norm inequality force coordinatewise equality.
  - name: GlobalTheory.CompanionTheory.RealCount.LemmaH.lam_mono
    gloss: >-
      Shows that adding the coordinate index to a strictly decreasing integral weight gives a weakly decreasing
      sequence.
  - name: GlobalTheory.CompanionTheory.RealCount.LemmaH.step1
    gloss: >-
