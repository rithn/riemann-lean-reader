    gloss: >-
      The combined operator yF_ab is the sum of the coordinatewise action of Kf_ab and the matrix action of spinM(c)_ab.
  - name: GlobalTheory.CompanionTheory.DiracK.dirac
    gloss: >-
      Defines the Dirac operator as the sum over a and b of the compositions of the coordinatewise P_ab action with
