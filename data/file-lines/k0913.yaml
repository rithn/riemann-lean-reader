    with a Weyl shift. The highest-term statement gives an upper spin-norm bound with a harmonicity criterion at
    equality, while the Dirac statement gives the matching lower bound for occurring weights. For antitone integral
    λ, CountE asserts nonnegative integer coefficients, equal to one at harmonic weights, given Lefschetz and core
    modules and a finite-dimensional intertwiner space. DiracOfDiracZeroModule combines the highest-term and second-type
    comparisons with the Dirac inequality without a split component to obtain least-weight admissibility under IsCoreMod0.
