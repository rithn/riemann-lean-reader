- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.RealCompression
  depth: 11
  lines: 78
  line: >-
    Proves that admissible level functions can be compressed to labels 0 through n−1 while preserving their harmonic
    weights.
  reading: >-
    The compression replaces each level by the number of indices at strictly lower levels. The count is less than
    n and preserves strict comparisons and ties, so it preserves admissibility, the shift ρ_U, and the weight μ_Q
    = 2λ + 2ρ_U. Thus every admissible natural-number level function yields a weight in the finite harmonic set,
    a membership criterion used in the highest-term equality argument.
