- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.NormSqLeDominantRearrangement
  depth: 10
  lines: 234
  line: Proves the Dirac inequality for compact highest weights without a split component.
  reading: >-
    On a nonzero highest-weight vector in the spin tensor product, the Dirac-square identity and the Casimir eigenvalues
    give a lower bound on the squared norm of the shifted weight, because the Dirac operator is skew-adjoint. A
    Parthasarathy–Rao–Varadarajan construction supplies such a vector from a compact highest-weight vector. The
    rearrangement inequality then bounds the resulting norm above by the squared spin norm of the original weight.
    DiracInequalityKTypes and MultGOfMultFor use the inequality to establish least-weight admissibility.
  key_decls:
  - name: GlobalTheory.CompanionTheory.DiracKType0.dirac_inequality_k_types
    gloss: >-
      For a weakly decreasing integer tuple λ and a core module without a split component at infOf λ, every weight
      ν with a nonzero compact highest-weight space satisfies LSq(λ) ≤ spinSq(ν).
  - name: GlobalTheory.CompanionTheory.DiracKType0.dirac_ineq0
    gloss: >-
      A nonzero highest-weight vector of weight τ for the combined compact and spin action in a core module without
      a split component gives ‖m0(λ)‖² ≤ ‖τ + ρ‖² when the spin matrices satisfy IsCliff.
  - name: GlobalTheory.CompanionTheory.DiracKType0.norm_sq_le_dominant_rearrangement
    gloss: >-
      For every real tuple a and permutation π, ‖a + ρ ∘ π‖² ≤ ‖domC(a) + ρ‖², where domC sorts the coordinates
      in weakly decreasing order.
