    relations and adjoint condition, let τ be the full diagonal highest weight of a nonzero vector in the spin tensor
    product. Then ‖τ + ρ‖² ≥ 4‖λ + ρ‖², where ρ is the half-sum of the positive roots. The proof expands the Dirac
    square using the Clifford relations, evaluates the spin and module Casimirs, and uses skew-symmetry to turn
    the square into a norm inequality. The same square and Casimir identities are used in the version for modules
    without the auxiliary involution.
