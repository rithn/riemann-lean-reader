    gloss: >-
      States that for antitone integral λ the expansion set contains the harmonic weights and its weights have squared
      spin norm at most ‖2(λ + ρ)‖², with equality implying harmonicity.
  - name: PositivityTheory.RgBcC.RealD.DiracV
    gloss: >-
