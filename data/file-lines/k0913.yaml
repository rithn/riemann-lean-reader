    gloss: Acts on V-valued tuples by ordinary complex matrix multiplication on the coordinate index.
  - name: GlobalTheory.CompanionTheory.DiracK.lft_mul_rgt
    gloss: Every coordinatewise endomorphism commutes with every scalar matrix action.
