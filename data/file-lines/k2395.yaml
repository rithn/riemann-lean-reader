- module: >-
    Development.WeilBound.CoreStatements.AutomorphicKernels.LocalLanglandsExistence.WeilEquivOfLocalDegreeOne
  depth: 6
  lines: 261
  line: >-
    Proves a Weil-group comparison and constructs finite global field models for finite-index Weil subgroups.
  reading: >-
    When the base Weil group fixes the upper field, Frobenius makes every element of the upper residue field satisfy
    x^q = x, where q is the base prime norm. The root-count bound and the fact that the upper norm is a positive
    power of q give equality of norms, which makes Weil-group restriction bijective and is used in ExistsCompletionEquivOfHe
    to deduce residue degree one. For a finite-index subgroup with open intersection with inertia, the global model
    takes a normal closure containing the prescribed fields, a finite field whose pointwise Weil stabilizer is the
    given subgroup, and a Weil-fixed square root of 1 − 4q, then takes the Weil fixed field inside it as the totally
    complex base.
  key_decls:
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.normV_eq_of_localDegreeOne
    gloss: >-
      For places induced by a common valuation, the prime norms agree if the base Weil group fixes the upper field
      pointwise.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.weil_equiv_of_localDegreeOne
    gloss: >-
      Under the same hypothesis, restriction identifies the upper and base Weil groups and preserves their actions
      on the common algebraic closure.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.weil_fix_sqrt
    gloss: >-
      The local Weil group fixes every square root of 1 − 4q in the algebraic closure, where q is the prime norm.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.exists_globalModel_fields
    gloss: >-
      Given a finite-index Weil subgroup with open intersection with inertia, constructs a finite Galois extension
      containing prescribed fields and a totally complex intermediate field such that the Weil image on the extension
      equals the Galois group over that intermediate field and the kernel lies in the given subgroup.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.exists_globalModel
    gloss: >-
      Gives the global field model for a finite-index Weil subgroup with open intersection with inertia by taking
      the prescribed family of fields to be empty.
