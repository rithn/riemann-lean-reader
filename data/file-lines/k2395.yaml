    4. The Galois prime decomposition formula therefore gives a unique prime above (3), which specifies the places
    for the prime-degree cyclicity condition. The local cyclic base-change module uses this pair of places to construct
    the pullback along the local norm as a lift of a smooth character, then uses Arthur–Clozel local uniqueness
    to characterize all lifts.
