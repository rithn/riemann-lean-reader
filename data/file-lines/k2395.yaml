    having related Weil–Deligne parameters. Transport by the identity reduces to equality, and transport of Weil
    elements is conjugation. A degree-zero Weil element preserves each parameter by intertwining its Weil action
    and monodromy, while Frobenius supplies a nonidentity place automorphism. The stated local Langlands hypothesis
    gives a reciprocity assignment satisfying the literal laws. The dimension law excludes constant assignments,
    and the empty segment sum is the zero parameter.
  key_decls:
  - name: GlobalTheory.LocLanglands.LitModel.fieldCompatible_iff
    gloss: >-
      Field compatibility is equivalent to choosing representatives on the same coordinate space with equal monodromy
      and matching actions on corresponding Weil elements.
  - name: GlobalTheory.LocLanglands.LitModel.fieldCompatible_iff_wdRel
    gloss: >-
      If the first assignment sends each GL(n) representation to an n-dimensional parameter, field compatibility
      is equivalent to the Weil–Deligne relation for every related pair of representations under a place isomorphism.
  - name: GlobalTheory.LocLanglands.LitModel.wdRel_refl_iff
    gloss: >-
      The Weil–Deligne relation induced by the identity on the algebraic closure is equality of parameter classes.
  - name: GlobalTheory.LocLanglands.LitModel.wdRel_weil
    gloss: >-
