- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.DecompositionElementFrobeniusPower
  depth: 10
  lines: 144
  line: >-
    Proves one arithmetic Frobenius power reverses a decomposition element on reductions of all algebraic integers
    in a finite subextension.
  reading: >-
    Over a finite field of size q, induction gives the formula a ↦ a^(q^m) for the mth power of arithmetic Frobenius
    on any algebraic extension. For a valuation ring above a finite place of a number field, the main theorem finds
