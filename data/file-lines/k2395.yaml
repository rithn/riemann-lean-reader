- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.ExistsPowCharPowEqSelf
  depth: 8
  lines: 232
  line: Characterizes Frobenius lifts by their exact action on Teichmüller representatives.
  reading: >-
    For a chosen valuation ring in a number field’s algebraic closure above a finite prime of residue cardinality
    q, an automorphism of the closure over the number field lifts q-power Frobenius exactly when it preserves the
    ring and sends every root of X^(q^m) − X in the closure to its qth power for every m > 0. Reducing primitive
    integer polynomials gives periodic Frobenius orbits for the residue classes. Factoring X^(q^m) − X gives a representative
    of each class for a suitable m, and a geometric-sum argument gives uniqueness for that m. An importer uses the
    criterion to express the Frobenius condition in the algebraic closure of the completion.
  key_decls:
