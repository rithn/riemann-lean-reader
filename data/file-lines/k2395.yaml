- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.ExistsWeilOfFixes
  depth: 7
  lines: 104
  line: >-
    Proves that a Weil element fixing an intermediate number field comes from the Weil group at the prime above.
  reading: >-
    Choose a valuation on a common algebraic closure inducing primes w of E and W of K, where E ⊆ K. Every element
    of the Weil group at w that fixes K pointwise has the same action on the closure as an element of the Weil group
    at W. The proof removes a power of Frobenius at W and rules out a positive remaining degree by counting roots
    over the residue field, leaving an inertia element at W that is then multiplied by the removed Frobenius power
