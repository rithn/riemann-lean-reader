- module: Development.WeilBound.CoreStatements.AutomorphicKernels.LocalLanglandsExistence.KernelCondGlob
  depth: 6
  lines: 144
  line: >-
    Defines kernel conditions linking induced Weil–Deligne parameters to local Tate constants and finite-order Hecke
    lifts.
  reading: >-
    The Tate conditions require integer-weighted products of local constants, normalized by the trivial character,
    to equal one when the induced Weil–Deligne parameters satisfy the corresponding characteristic-polynomial relation.
    They cover a common unramified twist, finite-order characters, and finite-order characters trivial on the Weil
    subgroup fixing a specified intermediate field. The last setting also gives conditions on standard epsilon factors
    and on Hecke lifts satisfying Euler-factor and local character identities. The twist condition with parameter
    one is used to prove a product identity for normalized Tate constants.
  key_decls:
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.HeckeRel
    gloss: >-
      Requires the weighted products of inverse Euler factors to match those of the trivial characters for Re(s)
      > 1 at finite places outside a finite set and away from v, and the weighted product of local characters pulled
      back to each finite base completion to equal one.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.KernelCondTw
    gloss: >-
      Requires the normalized Tate product to equal one under the characteristic-polynomial relation for finite-order
      characters twisted by a common unramified character with parameter in a prescribed set.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.KernelCondGlob
    gloss: >-
      Imposes the Tate product condition on finite-order characters over subfields of a specified intermediate field
      whose Artin pullbacks are trivial on Weil elements fixing that field.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.KernelCondStd
    gloss: >-
      Under the same field, character, and polynomial hypotheses, requires the weighted product of normalized epsilon
      factors at zero and the weighted product of character values on the base field’s multiplicative group to equal
      one.
  - name: PositivityTheory.Pf1.LocalLanglands.HeckeKernelConditions.HasHeckeLift
    gloss: >-
      Under the same hypotheses, requires finite-order Hecke characters whose local components at the unique places
      over v equal the prescribed χᵢ, with HeckeRel and the weighted character product identity on the base field’s
