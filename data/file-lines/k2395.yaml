    lies in the image of the embedding. Suppose a local Galois automorphism lifts a global decomposition-group element
    along the embedding of algebraic closures and the global valuation ring lies over the finite prime w with residue
    field of size q. The global element lifts arithmetic Frobenius exactly when the local automorphism sends every
    root of X^(q^m) − X to its qth power for every m > 0. The root lemma transfers the global criterion across the
    embedding. The direct importer uses this criterion in the uniformizer step of its local Artin-map comparison.
  key_decls:
  - name: GlobalTheory.WeilDict.exists_eq_of_pow_eq_self
    gloss: >-
      For a field embedding with algebraically closed source and N ≥ 2, every target element ζ satisfying ζ^N =
      ζ lies in the image.
  - name: GlobalTheory.WeilDict.isFrob_iff_of_lifts
    gloss: >-
      For intertwining local and global automorphisms, with the global one in the decomposition group of a valuation
      ring over the prime w with residue field size q, the global automorphism lifts arithmetic Frobenius if and
      only if the local one acts by ζ ↦ ζ^q on every ζ satisfying ζ^(q^m) = ζ for some positive integer m.
  blueprint: []
  status: fixed
  check:
