- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.HasNormGroups
  depth: 7
  lines: 41
  line: >-
    Defines valuation-compatible embeddings, lifts of automorphisms, and the norm-group condition for a local Weil
    group.
  reading: >-
    An embedding into the algebraic closure of a completion is compatible with a valuation ring when its preimage
    of the elements integral over the completed integers is that ring. Lifts intertwine local and global automorphisms,
    compose under multiplication, and determine the global automorphism uniquely. The norm-group condition equates
    pointwise fixation of each finite abelian extension by a lift with membership of the Weil element's image in
    the extension's norm group. A downstream theorem verifies this condition for a valuation-compatible embedding
    and a local Artin map under global Artin reciprocity and Chevalley's theorem on units.
  key_decls:
  - name: GlobalTheory.LocDict.IsLocEmb
    gloss: >-
      An embedding satisfies this condition when membership in the given valuation ring is equivalent to integrality
      of the image over the completed ring of integers.
  - name: GlobalTheory.LocDict.Lifts
    gloss: >-
      A local Galois automorphism lifts a global automorphism when their actions commute with the chosen embedding.
  - name: GlobalTheory.LocDict.Lifts.mul
    gloss: The product of two local lifts lifts the product of the corresponding global automorphisms.
  - name: GlobalTheory.LocDict.Lifts.eq
    gloss: Two global automorphisms lifted by the same local automorphism through the same embedding are equal.
  - name: GlobalTheory.LocDict.HasNormGroups
    gloss: >-
      For every finite abelian extension of the completion, a lift of a Weil element fixes the extension pointwise
      exactly when the element maps into the image of the field norm on multiplicative groups.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AbelianVarietyTheory.PublishedTheorems.GaloisCohomology₂.LocalCyclic
  depth: 7
  lines: 111
  line: >-
    Proves degree preservation and the character norm formula for local base change at a unique prime above the
    base prime.
  reading: >-
    In a prime-degree Galois extension, every automorphism fixes the unique prime above the base prime, so the full
    decomposition group gives a Galois extension of completions of the same degree. Local base change preserves
    the index n of GL(n), and on smooth characters it is realized by pullback along the local norm, whose continuity
    preserves smoothness. The trivial character is fixed under Galois conjugation. At 3 in ℚ(i)/ℚ, the Arthur–Clozel
    local base-change hypothesis gives uniqueness of the norm pullback.
  key_decls:
