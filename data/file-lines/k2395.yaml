- module: Development.AutomorphicArithmetic.WhittakerHecke.LocalArtinInertiaValuationOfUniformizerPrime
  depth: 10
  lines: 419
  line: Proves the tame inertia congruence for local Artin reciprocity at a rational-prime uniformizer.
  reading: >-
    Let v have residue-field size q and let p be a rational prime of v-adic order one. If π^(q−1) = p and the local
    Artin image of an inertia element t reduces to x, then t(π)/π reduces to x at the chosen prolongation of v.
    The proof uses global Artin norm compatibility to construct Frobenius lifts, compares lifts for uniformizers
    differing by a unit, and uses (q−1)st powers to account for principal units. Factoring the root-of-unity character
    through the local Artin map transfers the congruence to t. UpperTheory.Zero.LLC.tameRecAll invokes this theorem
    directly.
  key_decls:
  - name: UpperTheory.localArtin_inertia_valuation_of_uniformizer_prime
    gloss: >-
      For π^(q−1) equal to a rational-prime uniformizer, the ratio t(π)/π and the local Artin image of t have the
      same residue after extending the residue field to the chosen prolongation.
  - name: glob_norm
    gloss: >-
      The global Artin maps intertwine the idelic norm with restriction on abelianized absolute Galois groups.
  - name: frob_fix
    gloss: >-
      Assuming global Artin reciprocity, for a global Artin map and a root π of π^(q−1) = ϖ with ϖ an integral uniformizer,
      there is a Frobenius lift fixing π whose inverse has the Artin class of the local idele attached to (−1)^qϖ.
  - name: ine_of_unit
    gloss: >-
      Assuming global Artin reciprocity, a global Artin map sends the local idele of a unit x congruent to a base-field
      integer u to the class of an inertia element σ with σ(π)/π congruent to u, where π is a (q−1)st root of an
      integral uniformizer.
  - name: weil_smul_eq_of_local_artin_eq
    gloss: >-
      Two Weil group elements with the same local Artin image act identically on any (q−1)st root of a nonzero base-field
      element.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls). Before and after text: check-log.tsv.
