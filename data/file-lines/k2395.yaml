- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.ExistsTensorIdempotentOfAlgHomToBase
  depth: 16
  lines: 89
  line: >-
    Constructs an idempotent on which multiplication acts through a given K-algebra map from a tensor product to
    K.
  reading: >-
    Let E′/E be a finite extension in characteristic zero, let K/E be a field extension, and put A = K ⊗_E E′. For
    a K-algebra map ψ from A to K, set T = 1 ⊗ θ for a primitive element θ and α = ψ(T). The proof factors the minimal
    polynomial of θ over E after base change to K as (X − α)g and uses separability to define e = g(T)/g(α). The
    relation Te = αe extends to ae = ψ(a)e for every a ∈ A, so ψ(e) = 1 gives e² = e.
  key_decls:
