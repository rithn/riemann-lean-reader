- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.GlobalArtinReciprocityMapUnique
  depth: 8
  lines: 232
  line: Proves uniqueness of the global Artin reciprocity map on the ideles of a number field.
  reading: >-
    Two maps satisfying global Artin reciprocity agree if their ratio is trivial in every quotient of the abelianized
    absolute Galois group by an open subgroup. In each quotient, open kernels give agreement on local units outside
    finitely many places, and the Frobenius condition gives agreement on uniformizers there. Totally positive approximation
    gives agreement at the remaining finite places, and idele truncation reduces the ratio to its archimedean part,
    which vanishes by diagonal and connected-component triviality. A direct importer uses uniqueness to make inverse
    local reciprocity compatible with any global Artin map.
  key_decls:
  - name: GlobalTheory.ArtinUniq.globalArtin_unique
    gloss: >-
      Any two homomorphisms from the ideles of a number field to its abelianized absolute Galois group satisfying
      global Artin reciprocity are equal.
  - name: GlobalTheory.ArtinUniq.unif_eq
    gloss: >-
      After postcomposition by a group homomorphism that kills the second Artin map’s images of local units at a
      place, the two maps agree on uniformizers there.
  - name: GlobalTheory.ArtinUniq.eq_one_of_unit_unif
    gloss: >-
      A homomorphism from the multiplicative group of a finite-place completion is trivial if it kills the local
      units and the uniformizers.
  - name: GlobalTheory.ArtinUniq.eq_infPart
    gloss: >-
      An abelian-valued idele homomorphism with open kernel that kills every finite local factor depends only on
      the archimedean part.
  - name: GlobalTheory.ArtinUniq.eq_one_of_local
    gloss: >-
      An abelian-valued idele homomorphism with open kernel is trivial if it kills all finite local factors, the
      diagonal field elements, and the archimedean identity component.
