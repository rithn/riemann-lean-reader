- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.NormEqMulNormIdempotentCorner
  depth: 16
  lines: 47
  line: >-
    Factors the algebra norm into the value of a K-algebra homomorphism and the norm on the complementary idempotent
    summand.
  reading: >-
    Let A be a finite-dimensional commutative algebra over a field K, let ψ be a K-algebra homomorphism from A to
    K, and suppose ψ(e) = 1 and ea = ψ(a)e for all a ∈ A. These relations make e idempotent, and the first theorem
    computes N_{A/K}(ce + 1 − e) = c by taking the determinant of the identity plus a rank-one update. The second
    theorem factors a as (e + (1 − e)a)(ψ(a)e + 1 − e) and uses multiplicativity to obtain N_{A/K}(a) = ψ(a)N_{A/K}(e
    + (1 − e)a).
  key_decls:
  - name: GlobalTheory.norm_scale_idem_add_compl
    gloss: Under the stated hypotheses on ψ and e, the norm of ce + 1 − e is c for every c ∈ K.
  - name: GlobalTheory.norm_eq_mul_norm_idem_corner
    gloss: Under the same hypotheses, the norm of a equals ψ(a) times the norm of e + (1 − e)a for every a ∈ A.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.ValuationLeOneOfSqSubSelfIntegralBasis
  depth: 16
  lines: 40
  line: >-
    Proves integrality of ε above a prime if the coordinates of ε² − ε in a basis of algebraic integers are integral
    at that prime.
  reading: >-
    Let E′/E be an extension of number fields and fix an E-basis of E′ consisting of algebraic integers. If all
    coordinates of ε² − ε are integral at a finite prime w of E, then ε is integral at every prime w′ above w. The
    proof transfers the coefficient bounds to w′ and uses the ultrametric inequality on the basis expansion to show
    that ε² − ε is integral there. If the multiplicative valuation of ε exceeded 1, the identity ε² = ε + (ε² −
    ε) would bound the valuation of ε² by that of ε, contradicting multiplicativity.
  key_decls:
  - name: GlobalTheory.integral_of_sq_sub_integral
    gloss: >-
      For a prime w′ above w, local integrality at w of the coordinates of ε² − ε in an E-basis of E′ consisting
      of algebraic integers implies local integrality of ε at w′.
  blueprint: []
  status: fixed
