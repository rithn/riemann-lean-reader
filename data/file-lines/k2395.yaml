- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.ChevalleyUnits
  depth: 5
  lines: 182
  line: Proves Chevalley’s theorem on congruence subgroups of number-field units.
  reading: >-
    For a number field E and positive integers m and b, there is a positive integer a coprime to b such that every
    unit congruent to 1 modulo a in the ring of integers of E is an m-th power of a unit. For prime-power m, the
    proof uses Chebotarev to choose Frobenius representatives whose prime norms form the modulus, then uses Frobenius
    fixedness and cyclotomic descent to obtain a root in E. Bézout’s identity combines the congruences for coprime
    exponents. The construction of the inverse local Artin map on the Weil group uses the theorem to obtain injectivity
    of the global Artin map on the local multiplicative group embedded in the ideles.
  key_decls:
  - name: GlobalTheory.Published.chevalleyUnits'
    gloss: >-
      For every positive exponent and positive integer b, there is a positive modulus coprime to b for which all
      units congruent to 1 are powers of that exponent in the unit group.
  - name: GlobalTheory.ChevalleyUnitsProof.core
    gloss: >-
      For each prime-power exponent and positive integer b, a positive modulus coprime to b forces every unit congruent
      to 1 to be a power of that exponent in the unit group.
  - name: GlobalTheory.ChevalleyUnitsProof.combine
    gloss: >-
      The product of two congruence moduli coprime to b serves as a modulus for the product of their coprime exponents.
  - name: GlobalTheory.ChevalleyUnitsProof.normFacts
    gloss: >-
      If a prime ideal of a number field’s ring of integers omits b, its absolute norm is positive, lies in the
      ideal, and is coprime to b.
  blueprint:
  - merten:thm-chevalley-congruence-units
  status: checked
  check:
    verdict: supported
    notes: ''
