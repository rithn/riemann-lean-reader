- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.LocalTraceCompletion
  depth: 8
  lines: 166
  line: Extends the field trace to a continuous additive map between compatible finite-place completions.
  reading: >-
    Let v and v′ be places of K and L induced by one valuation on a common algebraic closure. If every K-embedding
    of L into the closure is realized by the Weil group at v, the trace preserves membership in the common valuation
    ring because it is a sum of those embeddings. Comparing valuation bounds after scaling by elements of K gives
    continuity at zero and hence an additive extension from the completion of L to that of K. A direct importer
    uses the valuation-ring membership criterion to prove surjectivity of a map between completions.
