- module: Development.AbelianVarietyTheory.PublishedTheorems.GaloisCohomology₂.ScholzeFunctorialExtension
  depth: 9
  lines: 64
  line: >-
    Defines ScholzeFunctorialExtension, a proposition on local Langlands assignments and their compatibility with
    base change.
  reading: >-
    The proposition posits Weil–Deligne assignments at finite places of number fields, compatible under place isomorphisms.
    Its laws specify dimension, zero monodromy, the Artin formula for GL(1), parabolic induction, character twists,
    and Iwahori fixed vectors for unramified parameters. For a continuous prime-degree map of completions extending
    the number field inclusion, suppose a nonidentity relative automorphism exists. If the source is cuspidal and
    the pair satisfies IsLBCCl for every such automorphism, their parameters must satisfy the Weil–Deligne relation
    induced by the identity on the common algebraic closure. GlobalTheory.FunExt.LbcModel.feeds applies this clause
    to local base change.
  key_decls:
  - name: GlobalTheory.Published.ScholzeFunctorialExtension
    gloss: >-
      Posits a family satisfying the functorial laws and place-isomorphism compatibility, plus Weil–Deligne compatibility
      along a continuous prime-degree extension of completions extending the number field inclusion when the source
      is cuspidal, a nonidentity relative automorphism exists, and the pair satisfies IsLBCCl for every such automorphism.
  - name: GlobalTheory.LocLanglands.FunctorialLaws
    gloss: >-
      Specifies the dimension, monodromy, character, induction, twist, and Iwahori conditions on a local assignment.
  - name: GlobalTheory.LocLanglands.FunctorialLaws.one
    gloss: The parameter of a smooth GL(1) character is its pullback along a local Artin map.
  - name: GlobalTheory.LocLanglands.FunctorialLaws.ind
    gloss: >-
      Every irreducible subquotient of the normalized smooth parabolic induction of positive-rank factors has parameter
      equal to the direct sum of their parameters.
  - name: GlobalTheory.LocLanglands.FunctorialLaws.iwahoriFixed
    gloss: A representation with an unramified parameter has a nonzero Iwahori-fixed vector.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 4 field edits (key_decls, line, reading). Before and after text: check-log.tsv.
