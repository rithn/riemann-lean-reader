- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.IsSmoothCharCompNormU
  depth: 6
  lines: 42
  line: Proves that pullback along the local field norm preserves smooth complex characters.
  reading: >-
    For an extension of number fields and finite places u above v, the local field norm induces a homomorphism from
    the multiplicative group of the completion at u to that at v. Its continuity ensures that the preimage of a
    smooth character's open kernel is open, so the pullback is smooth. The norm is used in the tower composition
    formula, and the smoothness result is used to formulate a character-support condition for cuspidal lifts and
    to prove an unlinking criterion for norm-pulled characters.
  key_decls:
  - name: GlobalTheory.BCChar.normU
    gloss: >-
      Defines the field norm from the completion at u to the completion at v on their multiplicative groups.
  - name: GlobalTheory.BCChar.isSmoothChar_comp_normU
    gloss: >-
      Proves that a smooth complex character of the multiplicative group at v remains smooth after pullback along
      the norm from u.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
