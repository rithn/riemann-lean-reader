    gloss: >-
      An automorphism of a number field’s algebraic closure over that field lifts q-power Frobenius for a chosen
      valuation ring above a finite prime of residue cardinality q exactly when it belongs to the corresponding
      decomposition group and sends every root of X^(q^m) − X in the closure to its qth power for every m > 0.
  - name: GlobalTheory.FrobTeich.exists_pow_normV_pow_cong
    gloss: >-
