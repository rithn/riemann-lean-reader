- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitarySwapReduction
  depth: 10
  lines: 266
  line: >-
    Proves that swapping adjacent principal series parameters preserves a unitary representation embedding when
    the left has smaller modulus.
  reading: >-
    For an irreducible admissible spherical representation of an unramified unitary group, a principal series embedding
    at χ yields one with adjacent entries χ_i and χ_j exchanged when |χ_i/χ_j| < 1. The rank-one intertwining map
    uses a functional on the simple root subgroup, where the Borel action becomes an affine change of variable.
    On a spherical vector the map has nonzero factor (1 − z/q²)/(1 − z), with z = χ_i/χ_j, so irreducibility gives
    injectivity. The direct importer restates the result as GlobalTheory.T.unitary_swap_reduction.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SwapRoot.step_exists_int
    gloss: >-
      Over a complete discretely valued field with an unramified involution, for nonzero w with |w|q² < 1, there
      is a linear, translation-invariant functional on admissible root functions that scales by q^(2 ord(c)) under
      nonzero dilations x ↦ cx and takes the value (1 − w)/(1 − wq²) on the normalized spherical root function.
  - name: GlobalTheory.CompanionTheory.SwapRoot.step_factor
    gloss: >-
      For nonzero x, the reflected root element factors into a Borel element and a conjugated root element at x⁻¹,
      with Borel character value (χ_i/(q²χ_j))^(−ord(x)).
  - name: GlobalTheory.CompanionTheory.SwapRoot.step_borel_shift
    gloss: >-
      Right multiplication by a Borel element induces an affine change x ↦ cx + y in the reflected root coordinate,
      and the character multiplier combined with the dilation factor gives the swapped Borel character.
  - name: GlobalTheory.CompanionTheory.SwapRoot.step_stab_adm
    gloss: >-
      A principal series function fixed on the right by an open identity neighborhood restricts along each translated
      reflected root subgroup to a locally constant function with the prescribed geometric tail.
  - name: GlobalTheory.CompanionTheory.SwapRoot.swapStepU
    gloss: >-
      An irreducible admissible spherical representation embedded in the principal series at χ also embeds equivariantly
      in the series with adjacent entries χ_i and χ_j exchanged when |χ_i/χ_j| < 1.
  blueprint: []
