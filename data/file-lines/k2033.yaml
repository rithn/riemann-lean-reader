      reflection.
  - name: GlobalTheory.WeylCell.cSimpleU
    gloss: >-
      Uses the SL₂ factor at q² for an adjacent ratio, the SL₂ factor at q for the last parameter in even dimension,
      and the SU(2,1) factor in odd dimension.
  - name: GlobalTheory.WeylCell.cWeylU
    gloss: >-
      Multiplies rank-one factors evaluated at parameter ratios, pairwise products, and single parameters selected
      by the permutation's ordinary and reflected index comparisons.
  - name: GlobalTheory.WeylCell.ConvU
    gloss: >-
