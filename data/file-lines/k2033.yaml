      chain into itself.
  - name: GlobalTheory.CompanionTheory.SatPow.mem_iwU_iff
    gloss: >-
      For a valuation-preserving involution, a unitary matrix belongs to the Iwahori exactly when it is integral
      and upper triangular modulo the maximal ideal.
  - name: GlobalTheory.CompanionTheory.SatPow.iwU_diag
    gloss: >-
      For a valuation-preserving involution, every diagonal entry of a unitary Iwahori element has multiplicative
      valuation one.
