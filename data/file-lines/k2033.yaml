- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.SatakePowerNonvanishing
  depth: 12
  lines: 256
  line: >-
    Proves nonvanishing of Satake values on double cosets of arbitrarily large powers of a strictly dominant diagonal
    element.
  reading: >-
    For an unramified unitary group and any Satake parameter, the spherical Hecke operator attached to the double
    coset of t^j has nonzero eigenvalue for arbitrarily large j when t is strictly dominant and diagonal. Evaluation
    on Weyl representatives gives finite dimensionality of the Iwahori-fixed principal series, and a minimal supported
    Bruhat weight gives injectivity of the coset-sum operator. If the Hecke values eventually vanish, the coset
    formula gives zero coset sums for high iterates, and finite-dimensional injectivity forces the original spherical
    vector's coset sum to vanish. The direct importer uses this result to prove GlobalTheory.T.satake_power_nonvanishing.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.satPowNonvan
    gloss: >-
      For every Satake parameter and strictly dominant diagonal t, the Satake value of the indicator of Kt^jK is
      nonzero for arbitrarily large j, where K is the spherical subgroup.
  - name: GlobalTheory.CompanionTheory.SatPow.iwFix
    gloss: >-
      Defines the subspace of the unitary principal series fixed by right translation by the Iwahori subgroup.
  - name: GlobalTheory.CompanionTheory.SatPow.finiteDimensional_iwFix
    gloss: >-
      Proves that the Iwahori-fixed principal series is finite-dimensional when the involution preserves the valuation.
  - name: GlobalTheory.CompanionTheory.SatPow.aOp_inj
