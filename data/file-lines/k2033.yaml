- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.IntegralDepthPowerLastSimpleReflectionCell
  depth: 12
  lines: 110
  line: >-
    Evaluates the depth-power integral on the last simple-reflection cell of an odd-dimensional unramified unitary
    group.
  reading: >-
    With normalized Haar measure, the proof gives mass one at depth zero and subtracts successive sublevel volumes
    q^(j + 2⌊j/2⌋) to obtain the mass at exact depth j > 0. Pushing the measure forward by depth turns the integrals
    into weighted series. For |z| < 1, the integral of (z/q²)^depth is the SU(2,1) factor (1 − z/q²)(1 + z/q)/(1
    − z²), and the integral of its modulus is the modulus of that factor evaluated at |z|. The statement module
    restates the resulting integral theorem.
  key_decls:
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.Atone.level_sets
    gloss: >-
      A natural-number-valued function with measurable sublevel sets of finite mass is measurable, and each level
      mass is the difference of consecutive sublevel masses, with the depth-zero mass given by the first sublevel.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.Atone.sums_over_levels
    gloss: >-
      For a function constant on the levels of a measurable natural-number-valued map, convergence of the level-mass-weighted
      complex and absolute series gives integrability and identifies both integrals with their sums.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.integral_depth_cell
    gloss: >-
      For an integral representative of the last simple reflection in odd dimension and Haar measure giving the
      integral subgroup volume one, the depth power (z/q²)^depth is integrable for |z| < 1, with integral cSU(q,z)
      and absolute integral |cSU(q,|z|)|.
  blueprint: []
  status: fixed
