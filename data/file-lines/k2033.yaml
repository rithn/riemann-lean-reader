    gloss: >-
      If J has finite index in K and R is a transversal for J/(J ∩ tJt⁻¹) that contains the identity and whose conjugates
      by all nonnegative powers of t lie in K, then for each j the coset-sum identity holds with a positive integer
      multiplier independent of the right K-invariant function.
