    gloss: >-
      For a diagonal uniformizer element attached to a cone tuple in the unramified setting, the upper unipotent
      index equals the index of the subgroup with exponent-difference bounds in the weight-zero subgroup.
  - name: PositivityTheory.Rg.BcB.F.Eig.IndexUAAux.step3
    gloss: >-
