      For an involutive field endomorphism σ and a block index a with 2(a + 2) ≤ n, maps GL₂ into the σ-unitary
      group by placing a matrix and its reversed inverse conjugate transpose on the two reflected coordinate pairs
      and acting as the identity on the other coordinates.
