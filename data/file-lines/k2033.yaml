      Each diagonal entry of a product of two upper triangular unitary matrices is the product of the corresponding
      diagonal entries.
  - name: Formalism.UG.P.fSatake_borel_diag_inv
    gloss: >-
      The diagonal entries of the inverse of an upper triangular unitary matrix are the reciprocals of the original
      diagonal entries.
  - name: Formalism.UG.P.fSatake_unit_diag
    gloss: >-
      In an upper triangular unitary matrix, applying σ to each diagonal entry and multiplying by the opposite entry
