- module: Formalism.SatakeDualWeyl.AdelicIwasawaHecke.FIwasawaD
  depth: 10
  lines: 148
  line: >-
    Proves two lemmas for unitary elimination: maximal pivot selection and preservation of earlier columns.
  reading: >-
    In a partially triangular unitary matrix, isotropy and the ultrametric inequality rule out the middle row as
    the sole maximum in absolute value on the pivot interval. A permutation commuting with index reversal moves
    a nonzero maximal entry to the diagonal and preserves the required below-diagonal zeros in earlier columns.
    With the unit coordinate vector at the reflected row and a second vector supported in the open pivot interval,
    the elimination matrix fixes vectors vanishing from the pivot row up to but excluding the reflected row, because
    both Hermitian pairings in its action vanish. FIwasawaE uses these lemmas to advance triangularization by one
    column.
  key_decls:
  - name: Formalism.UG.P.fIwasawa_exists_max_pivot
    gloss: >-
      For a partially triangular unitary matrix and a valuation-preserving field map, if the next column index ρ
      precedes its reflection, an integral unitary left multiplier preserves earlier below-diagonal zeros and puts
      a nonzero entry of maximal valuation on the diagonal, with the maximum taken over the closed interval from
      ρ to its reflection.
  - name: Formalism.UG.P.fIwasawa_E_fix
    gloss: >-
      With the first vector argument equal to the unit coordinate vector at the reflected row and the second supported
      strictly between the pivot row and its reflection, the elimination matrix fixes every vector vanishing at
      the pivot row and throughout that open interval.
