      its upper factor satisfies τ(W)W = 1 for the conjugate antidiagonal transpose τ.
  - name: GlobalTheory.CompanionTheory.SatPow.IwFact.diag_conj_apply
    gloss: Conjugation Y ↦ t⁻¹Yt by an invertible diagonal matrix scales entry (a,b) by the ratio t_bb/t_aa.
