- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryIwahoriFactorization
  depth: 10
  lines: 303
  line: >-
    Factors each unitary Iwahori element into an upper unitriangular factor and a lower triangular factor.
  reading: >-
    For a valuation-preserving involution and a strictly dominant diagonal unitary element t, every Iwahori element
    factors as u y, with u upper unitriangular and y lower triangular, and u, y and t⁻¹yt all in the Iwahori. Right-to-left
    column elimination produces the triangular factors, and the unitary adjoint identity shows that they are unitary.
    Strict dominance controls the valuations below the diagonal after conjugation. The direct importers use the
    factorization to state the unitary Iwahori theorem and reuse the elimination and adjoint arguments at CM completions.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.IwFact.elim_step
