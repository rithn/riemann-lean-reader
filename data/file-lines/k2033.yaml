    coordinates reversed, in the reflected block. Block multiplication and the antidiagonal form identity give a
    homomorphism carrying the upper unipotent subgroup to an additive root map and the swap matrix to an involution.
    The module also defines admissibility by local constancy and a geometric tail, and defines the spherical function
    that is one on the valuation ring. Direct importers use these definitions for the rank-one integral and the
    adjacent-parameter intertwining map.
