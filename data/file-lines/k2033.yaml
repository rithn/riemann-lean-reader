- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.MemIwGLOfDiag
  depth: 11
  lines: 183
  line: Proves diagonal Iwahori membership and a common eigenvector criterion for unitary Jacquet modules.
  reading: >-
    Diagonal matrices with diagonal entries of multiplicative valuation 1 stabilize every lattice in the defining
    chain, so they lie in the general linear Iwahori. For diagonal elements of the unitary compact subgroup, integrality
    of the matrix and its inverse gives multiplicative valuation 1 on the diagonal. Under the Iwahori, dominance,
    compact subgroup, and Jacquet hypotheses, surjectivity on fixed vectors and admissibility give a finite-dimensional
    space on which the commuting diagonal operators admit a common eigenvector, provided the space is nonzero. Its
    eigenvalues are one on the compact diagonal subgroup. The importer applies this criterion in eigU_complete.
  key_decls:
  - name: GlobalTheory.CompanionTheory.EigTorus.exists_common_eigenvector
    gloss: >-
      A pairwise commuting family of endomorphisms of a nonzero finite-dimensional complex vector space has a common
      nonzero eigenvector.
  - name: GlobalTheory.CompanionTheory.EigTorus.mem_latK_iff
    gloss: >-
      A diagonal matrix with diagonal entries of multiplicative valuation 1 preserves membership in each lattice
      of the defining chain.
  - name: GlobalTheory.CompanionTheory.EigTorus.mem_iwGL_of_diag
    gloss: >-
      A diagonal invertible matrix with diagonal entries of multiplicative valuation 1 belongs to the general linear
      Iwahori subgroup.
  - name: GlobalTheory.CompanionTheory.EigTorus.mem_iwU_of_diag
    gloss: Every diagonal element of the unitary compact subgroup belongs to the unitary Iwahori subgroup.
  - name: GlobalTheory.CompanionTheory.EigTorus.eigU_of
    gloss: >-
      Under the stated hypotheses, a nonzero Jacquet class fixed by the compact diagonal subgroup guarantees a nonzero
