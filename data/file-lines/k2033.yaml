- module: Formalism.SatakeDualWeyl.AdelicIwasawaHecke.FIwasawa
  depth: 8
  lines: 185
  line: >-
    Proves Iwasawa factorization for unitary groups and constructs the unique normalized spherical function.
  reading: >-
    For a valuation-preserving involution, the proof triangularizes the inverse by integral left multiplication
    to obtain an Iwasawa factorization g = bk. When q and all character parameters are nonzero, the diagonal valuation
    character is multiplicative on upper triangular elements and trivial on the integral ones, so its value on b
    is independent of the factorization. This value gives the spherical function normalized at the identity, and
    every function with the same transformation law is a scalar multiple of it. Fcompose uses the existence theorem
    to prove the Satake eigenvalue formula and multiplicativity of the Satake transform.
  key_decls:
  - name: Formalism.UG.P.fIwasawa_iwasawa
    gloss: >-
      For a valuation-preserving involution, every unitary element factors as an upper triangular element times
      an element of the integral subgroup.
  - name: Formalism.UG.P.fIwasawa_chi_mul
    gloss: >-
      The diagonal valuation character is multiplicative on upper triangular unitary elements when q and all character
      parameters are nonzero.
  - name: Formalism.UG.P.fIwasawa_chi_int
    gloss: >-
      The diagonal valuation character takes the value one on upper triangular elements of the integral subgroup.
  - name: Formalism.UG.P.fIwasawa_wd
    gloss: >-
      Under the nonvanishing hypotheses, the character takes the same value on the upper triangular factors of any
      two Iwasawa factorizations of an element.
  - name: Formalism.UG.P.exists_spherical_function_unitary
    gloss: >-
      Under the unramified hypotheses, for n equal to 2m or 2m+1 and nonzero complex parameters, there is a spherical
      function normalized at the identity, and every spherical function for those parameters is its multiple by
      its value at the identity.
  blueprint: []
  status: fixed
  check:
