- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.DominantUnipotentContraction
  depth: 10
  lines: 141
  line: Proves dominance and unipotent contraction for diagonal elements of the unramified unitary group.
  reading: >-
    Nonincreasing additive valuations along the diagonal imply that conjugation sends the upper unipotent Iwahori
    subgroup into itself and inverse conjugation sends the lower one into itself, with both fixing the diagonal
    part. Strict decrease gives geometric bounds on off-diagonal entry valuations of unipotent conjugates and their
    inverses, all with diagonal entries 1. These bounds bring each upper unipotent element into the Iwahori and
    send the entire lower unipotent Iwahori subgroup into any prescribed identity neighborhood by a single inverse
    power. The dominance theorem is used to construct an equivariant functional on the Jacquet quotient.
  key_decls:
  - name: GlobalTheory.CompanionTheory.DomUnitary.mem_J_iff
    gloss: >-
      A unitary element belongs to the unitary Iwahori exactly when its underlying matrix belongs to the general
      linear Iwahori.
  - name: GlobalTheory.CompanionTheory.DomUnitary.dom_core
    gloss: >-
      A diagonal unitary element with nonincreasing additive valuations preserves the upper unipotent Iwahori subgroup
      by conjugation and the lower one by inverse conjugation, and both conjugations fix the diagonal Iwahori subgroup.
  - name: GlobalTheory.CompanionTheory.DomUnitary.strict_core
    gloss: >-
      If the diagonal valuations decrease strictly, conjugation by a suitable power sends each upper unipotent element
      into the Iwahori, and conjugation by one inverse power sends the entire lower unipotent Iwahori subgroup into
      any prescribed open identity neighborhood.
  - name: GlobalTheory.CompanionTheory.DomUnitary.domU
    gloss: >-
      For the unramified unitary Iwahori datum, nonincreasing diagonal valuations imply dominance and strictly decreasing
      valuations imply strict dominance.
