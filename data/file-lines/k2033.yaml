      Iwahori entry conditions and leaves columns with zero in the pivot row unchanged.
  - name: GlobalTheory.CompanionTheory.SatPow.IwFact.exists_fact
    gloss: >-
      A matrix satisfying the Iwahori entry conditions factors as an integral upper unitriangular matrix times a
