- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.DominantElementsGlValued
  depth: 8
  lines: 437
  line: >-
    Proves an entrywise Iwahori criterion and diagonal conjugation bounds for GL_n over a discretely valued field.
  reading: >-
    Iwahori membership requires both a matrix and its inverse to be integral and upper triangular modulo the maximal
    ideal. A diagonal element with nonincreasing additive valuations preserves the upper unipotent Iwahori subgroup
    by conjugation and the lower one by inverse conjugation, and fixes diagonal matrices. Strict decrease gives
    geometric entrywise bounds that bring each upper unipotent element into the Iwahori and uniformly move its lower
    unipotent subgroup into any identity neighborhood under inverse conjugation by a power. The entrywise bounds
    are used in the corresponding unitary-group contraction proof.
  key_decls:
  - name: GlobalTheory.CompanionTheory.DomGLVal.mem_IwGL_iff
    gloss: >-
      An invertible matrix belongs to the Iwahori exactly when it and its inverse have integral entries and reduce
      to upper triangular matrices.
  - name: GlobalTheory.CompanionTheory.DomGLVal.conj_apply
    gloss: Conjugation by an invertible diagonal matrix with entries d_i multiplies entry (i,j) by d_i/d_j.
  - name: GlobalTheory.CompanionTheory.DomGLVal.open_shrink
    gloss: >-
      Every open identity neighborhood contains all matrices for which both the matrix and its inverse are sufficiently
      close to the identity entrywise.
  - name: GlobalTheory.CompanionTheory.DomGLVal.dom_core
    gloss: >-
      A diagonal element with nonincreasing additive valuations sends the upper unipotent Iwahori subgroup into
      itself by conjugation and the lower one into itself by inverse conjugation, and fixes the diagonal Iwahori
      subgroup.
  - name: GlobalTheory.CompanionTheory.DomGLVal.strict_core
    gloss: >-
      For strictly decreasing diagonal valuations, conjugation by a suitable power sends each upper unipotent element
      into the Iwahori, and inverse conjugation by a single power sends the entire lower unipotent Iwahori subgroup
      into any prescribed open identity neighborhood.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.ExistsStrictDom
  depth: 8
  lines: 117
  line: >-
    Constructs a strictly dominant diagonal element of the unramified unitary group and proves that its Iwahori
    lies in the integral subgroup.
  reading: >-
    The construction uses diagonal entries ϖ^(n−1−2i) for a uniformizer ϖ fixed by the involution, with indices
    starting at zero. Opposite exponents across the antidiagonal ensure preservation of the defining form, and the
    additive valuations decrease strictly. Testing the action of the general linear Iwahori on the standard lattice
    gives entrywise integrality, which applied to a unitary matrix and its inverse gives the subgroup inclusion.
    The module combines these results with openness and compactness of the integral subgroup, and the resulting
    package is used to prove the existence of a unitary Jacquet eigenvector.
