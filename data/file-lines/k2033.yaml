  line: Proves uniqueness of left Haar measure under normalization on a nonempty compact open set.
  reading: >-
    On a locally compact group with its Borel σ-algebra and a countable cover by compact measurable sets, let μ
    be left Haar measure and ν a left-invariant measure finite on compact sets. If ν(s) = c μ(s) on a nonempty compact
    open set s, then ν = c μ. The proof identifies the proportionality constant on s, where μ has positive finite
    mass, then extends equality from relatively compact sets by continuity from below along the increasing finite
    unions of the cover.
  key_decls:
  - name: GlobalTheory.haar_unique_of_sigmaCompact_normalised
    gloss: >-
      On a locally compact Borel group with a countable compact measurable cover, a left-invariant measure finite
      on compact sets equals c times a given left Haar measure if their masses have that proportionality on one
      nonempty compact open set.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.HaarMeasureWeylCellOddUnitary
  depth: 14
  lines: 352
  line: >-
    Computes normalized Haar volumes of shells in the last simple-reflection cell of an odd-dimensional unitary
    group.
  reading: >-
    Over a complete discretely valued field satisfying IsUnramInv with parameter q, choose an integral Weyl representative
    of the last simple reflection in odd dimension. With the integral subgroup of its cell assigned mass one, the
    shell at depth j ≥ 0 has Haar volume q^(j + 2⌊j/2⌋). The proof identifies the cell with the upper unitriangular
    subgroup of the three-dimensional unitary group via the central 3 × 3 block. The unitary equations turn the
    corner valuation bound into bounds on all three upper entries, so the volume follows by multiplying the indices
    of successive weighted subgroups.
  key_decls:
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.Volume.blockU
    gloss: >-
      Embeds the upper unitriangular subgroup of the three-dimensional unitary group into the ambient unitary group
      by inserting its matrix in the central block.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.Volume.exists_blockU
    gloss: >-
      Every upper unitriangular unitary matrix whose strictly upper entries vanish outside the central block comes
      from the three-dimensional subgroup.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.Volume.mem_unipLat_wt
    gloss: >-
      For valuation-preserving σ, membership in the depth-j weighted subgroup of the three-dimensional upper unitriangular
      unitary group is equivalent to the upper-right entry having valuation at most exp(j) in multiplicative notation.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.measure_shellU
    gloss: >-
      Over a complete discretely valued field satisfying IsUnramInv with parameter q, an integral Weyl representative
      of the last simple reflection in odd dimension has shell volume q^(j + 2⌊j/2⌋) at each depth j ≥ 0 for Haar
      measure assigning mass one to the integral subgroup of its cell.
  blueprint: []
  status: fixed
  check:
