- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryCharacterFacts
  depth: 10
  lines: 327
  line: >-
    Proves the normalized character formula for diagonal torus eigenvalues on a Jacquet module of an unramified
    unitary group.
  reading: >-
    A nonzero Jacquet class that is a common eigenvector for the diagonal torus has multiplicative eigenvalues.
    If these are trivial on the integral diagonal subgroup, they are determined by the orders of the first ⌊n/2⌋
    entries, since each diagonal element factors as paired inverse powers of a σ-fixed uniformizer of order one
    times an integral diagonal element. Evaluating on the standard basis of the order lattice and rescaling by powers
    of q gives the parameters in χΔ. The direct importer uses charU to prove GlobalTheory.T.unitary_character_facts.
  key_decls:
  - name: GlobalTheory.CompanionTheory.TorusChar.map_jac
    gloss: >-
      Diagonal elements preserve the subspace defining the unipotent coinvariants because they normalize the upper
      unitriangular subgroup.
  - name: GlobalTheory.CompanionTheory.TorusChar.xi_mul
    gloss: >-
      The eigenvalues on a nonzero common diagonal eigenvector in the Jacquet module multiply under products of
      diagonal elements.
  - name: GlobalTheory.CompanionTheory.TorusChar.v_entry
    gloss: >-
      When σ preserves the valuation, the first ⌊n/2⌋ diagonal valuations determine their reflected partners by
      inversion, and the middle valuation in odd dimension is one in multiplicative notation.
  - name: GlobalTheory.CompanionTheory.TorusChar.exists_decomp
    gloss: >-
