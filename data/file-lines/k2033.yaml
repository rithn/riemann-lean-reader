  line: Proves continuity of the unitary root map for an adjacent simple reflection.
  reading: >-
    A valuation-preserving field endomorphism is continuous because it preserves the valuation balls at zero. Continuity
    of the two-by-two unipotent block and its partner gives continuity of the root matrix, where the partner is
    obtained by conjugating the inverse block’s conjugate transpose by the fixed antidiagonal permutation matrix.
    Negating the parameter gives the inverse root matrix, so both matrix coordinates defining the topology on the
    unit group vary continuously. ContinuousUnitaryRootMapStatement re-exports the resulting group-valued continuity
    theorem.
  key_decls:
