- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.IwahoriFactorisation
  depth: 10
  lines: 271
  line: >-
    Proves unique upper–diagonal–lower factorization over a local ring with prescribed divisibility above and below
    the diagonal.
  reading: >-
    Let an invertible matrix over a commutative local ring have entries divisible by α above the diagonal and by
    a nonunit β below it. It factors uniquely into upper unitriangular, diagonal with unit entries, and lower unitriangular
    matrices, with the same divisibility conditions on the outer factors. Reduction to the residue field shows that
    the original diagonal entries are units. The proof proceeds by induction, using the last row and column to determine
    the outer factors along the border and passing to the Schur complement of the bottom-right entry. DvdInvOfBlockTriangular
    invokes the theorem in existsUnique_factor for an invertible matrix satisfying Shape α β.
  key_decls:
  - name: GlobalTheory.UnipotentBorder.iwahori_factorisation
    gloss: >-
      An invertible matrix over a commutative local ring with entries divisible by α above the diagonal and by a
      nonunit β below it has a unique upper–diagonal–lower factorization with diagonal units and unitriangular factors
      satisfying the respective divisibility conditions.
  - name: GlobalTheory.UnipotentBorder.diag_unit
    gloss: >-
      Over a commutative local ring, a matrix with unit determinant and all entries below the diagonal divisible
      by a fixed nonunit has unit diagonal entries.
  - name: GlobalTheory.UnipotentBorder.udl_exists
    gloss: >-
      Over a commutative local ring, unit diagonal entries and the stated divisibility conditions with β a nonunit
      suffice for the existence of the factorization.
  - name: GlobalTheory.UnipotentBorder.udl_unique
    gloss: >-
      Over any commutative ring, equality of two upper–diagonal–lower products with unitriangular outer factors
      and unit diagonal entries forces equality of the three factors.
  - name: GlobalTheory.UnipotentBorder.top_block
    gloss: >-
      The leading block of the product is the product of the leading blocks plus the outer product contributed by
      the last column of the upper factor and the last row of the lower factor, scaled by the last diagonal entry.
