- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.HasSumSu21RankOneSeriesDifferences
  depth: 14
  lines: 87
  line: >-
    Sums the rank-one unitary series with coefficients given by successive differences of the shell weights.
  reading: >-
    Set Aⱼ = q^(j + 2⌊j/2⌋). For nonzero complex q and |z| < 1, the series with terms (z/q²)ʲ Aⱼ splits into even
    and odd geometric series with common ratio z², giving (1 + z/q)/(1 − z²). For integer q ≥ 2, subtracting a copy
    of the series shifted by one index and multiplied by z/q² yields the sum (1 − z/q²)(1 + z/q)/(1 − z²) for the
    coefficients Aⱼ − Aⱼ₋₁, with A₋₁ = 0.
  key_decls:
  - name: GlobalTheory.SURankOneSeries.term_even
    gloss: For q ≠ 0, the weighted term at index 2i equals (z²)ⁱ.
  - name: GlobalTheory.SURankOneSeries.term_odd
    gloss: For q ≠ 0, the weighted term at index 2i + 1 equals (z/q)(z²)ⁱ.
  - name: GlobalTheory.SURankOneSeries.hasSum_weighted
    gloss: For nonzero complex q and |z| < 1, the series weighted by Aⱼ sums to (1 + z/q)/(1 − z²).
  - name: GlobalTheory.SURankOneSeries.hasSum_series
    gloss: >-
      For integer q ≥ 2 and |z| < 1, the series weighted by Aⱼ − Aⱼ₋₁ sums to (1 − z/q²)(1 + z/q)/(1 − z²).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.UnitaryWeylCellShellIsOpenCompactSubgroup
  depth: 14
  lines: 312
  line: >-
    Proves odd-dimensional last-reflection shells are open compact subgroups for integral Weyl lifts over complete
    IsUnramInv ℤ-valued fields.
  reading: >-
    The proof uses the central 3 × 3 block to show that the corner valuation bound survives multiplication and inversion
    and bounds every entry of a matrix and its inverse. Openness follows by pulling back an open valuation ball
    along the corner entry map, and compactness follows by realizing the shell as a closed subset of a compact set
    of bounded matrix–inverse pairs. At depth zero the shell is exactly the intersection of the cell with the integral
    unitary subgroup.
  key_decls:
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.ShellGroup.corner_rel
    gloss: >-
      For a unitary matrix X with the prescribed central block condition on both X and X⁻¹, the upper adjacent entry
      X[a,m] times its conjugate is the negative of the sum of the corner entry and its conjugate.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.ShellGroup.entry_le
    gloss: >-
      If σ preserves the valuation and a unitary matrix and its inverse have the prescribed central block form,
      then a corner valuation bound e gives the bound max(1, e) on the valuation of every matrix entry.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.ShellGroup.corner_mul_le
    gloss: >-
      If σ preserves the valuation and two unitary matrices and their inverses have the prescribed central block
      form, then any common bound on the two corner valuations also bounds the corner valuation of their product.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.ShellGroup.isCompact_bounded
    gloss: >-
      Over a complete discretely valued field with IsUnramInv data, the set of invertible matrices whose entries
      and inverse entries lie in a fixed valuation ball is compact.
  - name: GlobalTheory.WeylCell.WeylUnipotentShell.shellU_open_compact_subgroup
    gloss: >-
      Over a complete discretely valued field with IsUnramInv data, for an integral representative of the last simple
      reflection in odd unitary dimension, every integer-depth shell is an open compact subgroup of the cell, and
      the depth-zero shell consists of its integral points.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 6 field edits (key_decls, line). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.IntegralCasts.CapelliIdentities.IwahoriEntryBound
  depth: 14
  lines: 103
  line: >-
    Proves that every diagonal entry of a matrix in the GLₙ Iwahori subgroup is a unit in the valuation ring.
  reading: >-
    The Iwahori subgroup is defined as the common stabilizer of a coordinate lattice chain. Applying a matrix to
    the jth basis vector in the (j+1)st lattice shows that all entries lie in the valuation ring and those below
    the diagonal lie in its maximal ideal. In each diagonal entry of g⁻¹g, the off-diagonal products sum to an element
    of valuation below 1, forcing the two diagonal factors to have valuation 1 by the bounds for g and its inverse.
    BruhatWeightDecreases uses the unit condition for both Iwahori factors in its cell comparison.
  key_decls:
  - name: UpperTheory.Reformulated.B.IwahoriEntryBound.latK
    gloss: >-
      Defines the kth lattice by requiring the first k coordinates to lie in the valuation ring and the remaining
      coordinates to lie in its maximal ideal.
  - name: UpperTheory.Reformulated.B.IwahoriEntryBound.IwGL
    gloss: >-
      Defines the Iwahori subgroup of GLₙ as the intersection of the stabilizers of the lattices indexed by k from
      0 to n.
  - name: UpperTheory.Reformulated.B.IwahoriEntryBound.Helpers.entry_bound
    gloss: >-
      Every entry of an Iwahori matrix has multiplicative valuation at most 1, with strict inequality below the
      diagonal.
  - name: UpperTheory.Reformulated.B.IwahoriEntryBound.main
    gloss: Each diagonal entry of an Iwahori matrix has multiplicative valuation exactly 1.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review sample-02 (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.CosetRepsOfFactorization
  depth: 14
  lines: 62
  line: Proves that a factorization supplies a finite left coset transversal with a prescribed property.
  reading: >-
    Let J be a subgroup and H = J ∩ tJt⁻¹ have finite index in J, and suppose P holds at the identity and each i
    ∈ J factors as uh with u ∈ J satisfying P and h ∈ H. The proof chooses one such u from each left coset, taking
    the identity for H, and uses equality of cosets to establish uniqueness within the chosen set. The direct importer
    re-exports the result as GlobalTheory.T.coset_reps_of_factorization.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.RepsGen.reps_of_quotient_with_property
    gloss: >-
      Under the finite-index and factorization hypotheses, there is a finite set R ⊆ J containing the identity and
      satisfying P at each element, with a unique r ∈ R such that t⁻¹r⁻¹it ∈ J for each i ∈ J.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.DominantConjugateUnipotentMem
  depth: 14
  lines: 97
  line: >-
    Proves that strictly dominant diagonal powers conjugate upper unitriangular Iwahori elements into the maximal
    compact subgroup.
  reading: >-
    Conjugation by tᵏ multiplies each upper off-diagonal entry by the kth power of the corresponding ratio of diagonal
    entries of t. Strict dominance makes each such ratio integral, so conjugation preserves integrality of both
    the upper unitriangular Iwahori element and its inverse. This gives maximal compact membership for every k ≥
    0. The direct importer re-exports the result as GlobalTheory.T.dominant_conjugate_unipotent_mem.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.conj_unip_mem_KU
    gloss: >-
      For a strictly dominant diagonal unitary element t and an upper unitriangular Iwahori element u, the conjugate
      tᵏu(tᵏ)⁻¹ belongs to the maximal compact subgroup for every k ≥ 0.
  - name: GlobalTheory.CompanionTheory.SatPow.conj_entries_le_one
    gloss: >-
      Conjugating an integral upper unitriangular matrix by a nonnegative power of a strictly dominant diagonal
      matrix preserves entrywise integrality.
  - name: GlobalTheory.CompanionTheory.SatPow.val_le_of_ordL_lt
    gloss: For nonzero a and b, ord_L(a) < ord_L(b) implies v(b) ≤ v(a) for the multiplicative valuation v.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.FunctionalZeroOfInjectivePower
  depth: 14
  lines: 63
  line: >-
    Proves that a functional vanishing on late iterates of an injective endomorphism in finite complex dimension
    also vanishes at the start.
  reading: >-
    On a finite-dimensional complex vector space, the span of the late iterates lies in the kernel of the functional
    and is invariant under the endomorphism. The restriction to this span is injective and hence surjective, so
    injectivity on the ambient space lets the proof trace the orbit backward to the starting vector. The direct
    importer re-exports the result as GlobalTheory.T.functional_zero_of_injective_power.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.functional_eq_zero_of_late_iterates
    gloss: >-
      For an injective endomorphism A of a finite-dimensional complex vector space, a linear functional ℓ with ℓ(Aʲv)
      = 0 for all j ≥ j₀ satisfies ℓ(v) = 0.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review sample-02 (material findings): 1 field edit (line). Before and after text: check-log.tsv.'
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.HeckePowerCosetFormula
  depth: 14
  lines: 231
  line: >-
    Proves a Hecke power formula up to a positive integer factor under the normalized transversal and t-power conjugation
    hypotheses.
  reading: >-
    Let J have finite index in K and let R be a transversal for J/(J ∩ tJt⁻¹) containing 1, with tᵏr(tᵏ)⁻¹ ∈ K for
    r ∈ R and k ≥ 0. For a right K-invariant function, summing the j-fold iterate of the coset operator built from
    R over K/J gives a positive integer multiple of the Hecke action of the indicator of KtʲK at the identity. The
    proof expands the iterate into a multiset of products and uses right J-invariance to show that left translation
    by K preserves the sum. This gives the same positive multiplicity to every coset xK in KtʲK. The direct importer
    re-exports the formula as GlobalTheory.T.hecke_power_coset_formula.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.HeckeTrace.heckeTrace
    gloss: >-
      Under the finite-index, transversal, and conjugation hypotheses, the j-fold coset-sum identity holds with
      a positive integer multiplier independent of the right K-invariant function.
  - name: GlobalTheory.CompanionTheory.SatPow.HeckeTrace.exists_words
    gloss: >-
      If R contains the identity and all conjugates tᵏr(tᵏ)⁻¹ lie in K, the j-fold iterate is a sum of right translations
      indexed by a nonempty multiset in Ktʲ.
  - name: GlobalTheory.CompanionTheory.SatPow.HeckeTrace.aOp_iterate_rightInvariant
    gloss: >-
      Every iterate of the coset-sum operator for a transversal of J/(J ∩ tJt⁻¹) preserves right J-invariance.
  - name: GlobalTheory.CompanionTheory.SatPow.HeckeTrace.finsum_left_mul
    gloss: >-
      The sum of a right J-invariant function over K/J is unchanged by left translation by an element of K.
  - name: GlobalTheory.CompanionTheory.SatPow.HeckeTrace.multiset_sum_eq_hAct
    gloss: >-
      A nonempty multiset supported in KsK whose sums against right K-invariant functions are left K-invariant gives
      a positive integer multiple of the Hecke sum at the identity.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (line, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryIwahoriIndexFinite
  depth: 14
  lines: 88
  line: >-
    Proves finite index for the unitary Iwahori subgroup in the compact subgroup of integral points and for its
    intersections with conjugates.
  reading: >-
    For the antidiagonal unitary group over a complete discretely valued field with an unramified involution, the
    indices [K : J] and [J : J ∩ tJt⁻¹] are finite for every unitary element t, where K is the compact subgroup
    of integral points and J is the Iwahori subgroup. Entrywise valuation conditions show that J is open, and conjugation
    preserves openness. Compactness of K and of its closed subgroup J then gives both finite indices. The direct
    importer re-exports the result as GlobalTheory.T.unitary_iwahori_index_finite.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.finite_index_iwU
    gloss: >-
      Under the complete valued-field and unramified involution hypotheses, the coset spaces K/J and J/(J ∩ tJt⁻¹)
      are finite for every unitary element t.
  - name: GlobalTheory.CompanionTheory.SatPow.isOpen_iwU
    gloss: The unitary Iwahori subgroup is open when the field endomorphism preserves the valuation.
  - name: GlobalTheory.CompanionTheory.SatPow.isOpen_map_conj
    gloss: Every conjugate of an open subgroup of a topological group is open.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (minor findings): 2 field edits (line, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryIwasawaBruhatDecomposition
  depth: 14
  lines: 596
  line: >-
    Proves that every element of the unitary group factors as a Borel element, a permutation matrix, and an Iwahori
    element.
  reading: >-
    For the unitary group of the antidiagonal form over a field with a ℤ-valued valuation and a valuation-preserving
    involution, every element factors as g = bwi in arbitrary dimension. The proof chooses the first entry of maximal
    multiplicative valuation in an isotropic row, then uses explicit unitary matrices to clear the pivot row and
    column and their reversals. Iterating from the outer rows inward gives a monomial matrix whose diagonal factor
    is absorbed into the Borel. The direct importer invokes this result to prove GlobalTheory.T.unitary_iwasawa_bruhat_decomposition.
  key_decls:
  - name: GlobalTheory.CompanionTheory.BruhatIw.bruhat_iwasawa
    gloss: >-
      Every unitary matrix under the stated valuation and involution hypotheses is a product of an upper-triangular
      unitary matrix, a unitary permutation matrix, and an Iwahori element.
  - name: GlobalTheory.CompanionTheory.BruhatIw.exists_pivot
    gloss: >-
      When σ preserves the valuation, the first coordinate of a nonzero isotropic vector attaining maximal multiplicative
      valuation has an index distinct from its reversal.
  - name: GlobalTheory.CompanionTheory.BruhatIw.exists_eich
    gloss: >-
      A normalized isotropic vector at an index distinct from its reversal gives the pivot row of an explicit unitary
      matrix.
  - name: GlobalTheory.CompanionTheory.BruhatIw.step
    gloss: >-
      With at least two rows remaining, left Borel and right Iwahori factors reduce the next pair of outer rows
      to isolated pivots while preserving earlier pivots.
  - name: GlobalTheory.CompanionTheory.BruhatIw.mono_end
    gloss: >-
      A unitary matrix with an isolated pivot in every row factors as a diagonal unitary matrix times a unitary
      permutation matrix.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-03 (material findings): 1 field edit (key_decls). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.IntegralCasts.CapelliIdentities.AOpRightInvariant
  depth: 15
  lines: 39
  line: Proves that a finite coset sum preserves right invariance under a subgroup.
  reading: >-
    For a subgroup J, the operator sums φ(grt) over representatives r of the left cosets of J ∩ tJt⁻¹ in J. Left
    multiplication by an element of J permutes these cosets, and right J-invariance of φ absorbs the change of representative
    after conjugation by t. HeckePowerCosetFormula applies the theorem inductively to prove right J-invariance for
    every iterate of the operator.
  key_decls:
  - name: UpperTheory.Reformulated.B.Qf37.aOp
    gloss: >-
      Sends a complex-valued function φ on a group to the function g ↦ ∑_{r∈R} φ(grt) for a finite subset R and
      a fixed element t.
  - name: UpperTheory.Reformulated.B.Qf37.aOp_rightInvariant
    gloss: >-
      If R represents the left cosets of J ∩ tJt⁻¹ in J exactly once, then the operator sends right J-invariant
      functions to right J-invariant functions.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
