      σ, with the first block starting at index a and 2(a + 2) ≤ n.
  - name: UpperTheory.Reformulated.B.AntidiagonalWeylElement.rootGL_mem_unitary
    gloss: >-
      For involutive σ, every matrix in the image of the two-block construction preserves the antidiagonal form.
  - name: UpperTheory.Reformulated.B.AntidiagonalWeylElement.sR
    gloss: >-
      Defines s as the image of the 2×2 swap matrix, exchanging the two coordinates within each selected block.
  - name: UpperTheory.Reformulated.B.AntidiagonalWeylElement.uR
    gloss: Defines u(x) as the image of the upper unitriangular 2×2 matrix with superdiagonal entry x.
  - name: UpperTheory.Reformulated.B.AntidiagonalWeylElement.sR_uR_mul_unip
    gloss: >-
      For each upper unitriangular isometry v over the discretely valued field, there is a shift y such that for
