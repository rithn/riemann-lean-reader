    r ∈ R and k ≥ 0, then summing the j-fold iterate of the coset operator built from R over K/J for a right K-invariant
    function gives a positive integer multiple of the Hecke action of the indicator of KtʲK at the identity. The
    Satake nonvanishing proof uses this formula to turn eventual vanishing of the Hecke values into eventual vanishing
    of the iterated coset sums.
