    0 ≤ i < ⌊n/2⌋. Iwahori factorization reduces the index to the upper unipotent subgroup, where diagonal conjugation
    imposes entrywise valuation bounds given by differences of diagonal exponents. The proof counts the resulting
    subgroup index and uses reversal antisymmetry to sum those differences. The inert-place proof substitutes the
    index for the factor multiplying the Hecke eigenvalue in the level-operator formula.
  key_decls:
