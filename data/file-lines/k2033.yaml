    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.DvdInvOfBlockTriangular
  depth: 9
  lines: 255
  line: >-
    Proves inversion preserves block divisibility and establishes unique Iwahori factorizations in both triangular
    orders.
  reading: >-
    Reduction modulo a principal ideal turns block divisibility into block triangularity, which is preserved by
    inversion. Invertible matrices with entries divisible by α above the diagonal and by β below form a subgroup.
    Over a local ring with β a nonunit, each has unique upper–diagonal–lower and lower–diagonal–upper factorizations
    with the same divisibilities, unitriangular outer factors, and diagonal units. Reversing the row and column
    indices gives the opposite order. Both orders are used to factor elements of the GLₙ Iwahori subgroup.
  key_decls:
  - name: GlobalTheory.IwahoriFactor.dvd_inv_of_blockTriangular
    gloss: >-
      If a fixed element divides every entry strictly below the block diagonal of an invertible matrix, it divides
      the corresponding entries of the inverse.
  - name: GlobalTheory.IwahoriFactor.shapeGroup
    gloss: >-
      Defines the subgroup of invertible matrices over a commutative ring with entries divisible by α above the
      diagonal and by β below it.
  - name: GlobalTheory.IwahoriFactor.existsUnique_factor
    gloss: >-
      Over a local ring with β a nonunit, each matrix in this subgroup factors uniquely as upper unitriangular,
      diagonal with unit entries, and lower unitriangular, with the respective divisibilities α and β.
  - name: GlobalTheory.IwahoriFactor.existsUnique_factor_opp
    gloss: >-
      Under the same hypotheses, each matrix factors uniquely as lower unitriangular, diagonal with unit entries,
      and upper unitriangular, with the respective divisibilities β and α.
  - name: GlobalTheory.IwahoriFactor.iwahori_factorisation
    gloss: >-
      Over a discrete valuation ring, an invertible matrix with entries divisible by ϖʳ above the diagonal and ϖˢ
      below it, for a uniformizer ϖ and s ≥ 1, has a unique upper–diagonal–lower factorization with the same divisibilities,
      unitriangular outer factors, and diagonal units.
