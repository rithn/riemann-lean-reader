- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.ShellMeasure
  depth: 11
  lines: 463
  line: >-
    Computes even-dimensional Weyl cell measures and proves unipotent translation formulas for the last simple reflection.
  reading: >-
    In even dimension, the antidiagonal entry identifies the last simple reflection cell with the additive trace-zero
    line. With the compact intersection of volume one, successive valuation balls have index q and the level-j ball
    has volume q^j. This formula determines the Haar scaling under diagonal conjugation. For functions with the
    left χΔ Borel law, a right unipotent factor becomes a left cell translation in even dimension and a right cell
    translation in odd dimension, where the field must be complete and unramified and the Weyl representative lie
    in K_U. UnitaryInverseReduction uses these formulas to evaluate and transform cell integrals.
  key_decls:
  - name: GlobalTheory.CompanionTheory.InvStep.shell_measure'
    gloss: >-
      In the even-dimensional last simple reflection cell, the set with antidiagonal entry x satisfying v(x) ≤ exp(j)
      in the multiplicative value group is measurable and has Haar volume q^j for every integer j when the compact
      intersection has volume one.
  - name: GlobalTheory.CompanionTheory.InvStep.conjScale'
    gloss: >-
      On the even-dimensional cell, replacing the integrand F(u) by F(t⁻¹ut) for diagonal t multiplies both the
      complex and the nonnegative integral by q^(−2 ord_L(t_aa)), where a is the lower index of the reflected pair.
  - name: GlobalTheory.CompanionTheory.InvStep.shiftCore
    gloss: >-
      For a reflection swapping adjacent reversed indices, insertion of an upper unitriangular factor ν in a Borel-equivariant
      function value φ(y⁻¹uνg) is absorbed by a fixed left translation of u in the cell.
  - name: GlobalTheory.CompanionTheory.InvStep.shiftEven
    gloss: >-
      For the last simple reflection in even dimension and φ satisfying the left χΔ Borel law, each upper unitriangular
      ν admits a fixed cell element u′ such that φ(y⁻¹uνg) = φ(y⁻¹u′ug) for every cell element u and group element
      g.
  - name: GlobalTheory.CompanionTheory.InvStep.shiftOdd
    gloss: >-
      For the last simple reflection in odd dimension over a complete unramified valued field, with Weyl representative
      y in K_U and φ satisfying the left χΔ Borel law, each upper unitriangular ν admits a fixed cell element p
      such that φ(y⁻¹uνg) = φ(y⁻¹upg) for every cell element u and group element g.
  blueprint: []
