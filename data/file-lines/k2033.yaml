- module: Development.AutomorphicArithmetic.IntegralCasts.CapelliIdentities.UnitaryRootEmbedding
  depth: 13
  lines: 854
  line: >-
    Constructs a two-block GL₂ homomorphism into an antidiagonal unitary group and proves a unipotent shift identity.
  reading: >-
    The homomorphism places g and its inverse σ-transpose conjugated by the swap matrix in two reflected adjacent
    coordinate blocks, and fixes the other coordinates. Block multiplication verifies preservation of the antidiagonal
    form. In the integer-valued valuation setting, right multiplication of s u(x) by an upper unitriangular isometry
    v shifts x by the selected superdiagonal entry of v and introduces an upper unitriangular isometry on the left.
    The proof cancels that entry and uses unitarity to cancel its reflected partner before conjugating by s. ReflectionRootUnipotentShift
    uses the identity directly for its namesake theorem.
