    at ratios, products, and single parameters selected by ordinary and reflected comparisons of permuted lower-half
    indices, and convergence requires these arguments to have modulus less than one. The module also takes moduli
    coordinatewise and proves closure of Weyl representatives under products and inverses by reducing matrix products
    to single supported terms. The last reflection and its parameter action are used in the even-dimensional diagonal
    character identity.
