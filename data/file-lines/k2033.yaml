- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.BruhatWeightDecreases
  depth: 13
  lines: 392
  line: >-
    Proves that strictly dominant diagonal translation can only lower the Bruhat weight of a unitary Iwahori cell.
  reading: >-
    For a factorization wrt = bw′i with r and i in the Iwahori subgroup and t strictly dominant diagonal, the weight
    of w′ is at most that of w. Equality forces the same Weyl permutation and identifies the diagonal orders of
    the Borel factor b with those of t permuted by w. The proof uses valuation bounds for Iwahori minors to compare
    tail sums of diagonal orders, then adds the inequalities over all tails. BruhatWeightDecreasesStatement applies
    cell_triang to prove GlobalTheory.T.bruhat_weight_decreases.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SatPow.cell_triang
    gloss: >-
      In the factorization wrt = bw′i, either the Bruhat weight strictly decreases or the Weyl permutation is unchanged
      and the diagonal orders of b are those of t permuted by w.
  - name: GlobalTheory.CompanionTheory.SatPow.Triang.mat_triang
    gloss: >-
      Under the matrix factorization hypotheses, the sum of permuted diagonal orders weighted by the one-based positions
      strictly decreases unless the two permutations and corresponding diagonal orders agree.
  - name: GlobalTheory.CompanionTheory.SatPow.Triang.key
    gloss: >-
      Each tail sum of diagonal orders for the new permutation is bounded above by the old one, with equality forcing
      containment of the new permutation's tail image in the old one's and agreement with the Borel factor's tail
      sum.
  - name: GlobalTheory.CompanionTheory.SatPow.Triang.minor_diag
    gloss: >-
      Every principal minor of a matrix satisfying the Iwahori entry bounds and having unit diagonal entries has
      unit determinant.
  - name: GlobalTheory.CompanionTheory.SatPow.Triang.minor_perm
    gloss: >-
      A square submatrix of a matrix satisfying the Iwahori entry bounds admits a matching of row indices to column
      indices with each row index at most its matched column index if its determinant has multiplicative valuation
      1.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
