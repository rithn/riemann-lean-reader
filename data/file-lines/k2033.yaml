- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryFrobeniusReciprocity
  depth: 10
  lines: 122
  line: >-
    Proves Frobenius reciprocity in the form of a principal series embedding for an unramified unitary group.
  reading: >-
    A nonzero Jacquet functional with normalized torus character parametrized by β gives the coefficient map v ↦
    (g ↦ λ(ρ(g)v)). The Borel decomposition into diagonal and unipotent factors gives the principal series transformation
    law, and irreducibility makes the map injective. Comparing the two Satake eigenvalue systems on the image of
    a spherical eigenvector shows that β is Weyl-conjugate to the original Satake parameter. The direct importer
    uses frobU to prove GlobalTheory.T.unitary_frobenius_reciprocity.
  key_decls:
  - name: GlobalTheory.CompanionTheory.FrobRec.coeffMap
    gloss: Sends each vector v to the function g ↦ λ(ρ(g)v) for a chosen linear functional λ.
  - name: GlobalTheory.CompanionTheory.FrobRec.coeffMap_equivariant
    gloss: The coefficient map intertwines the given action with right translation on functions.
  - name: GlobalTheory.CompanionTheory.FrobRec.coeffMap_injective
    gloss: The coefficient map of an irreducible representation is injective for every nonzero functional.
  - name: GlobalTheory.CompanionTheory.FrobRec.coeffMap_mem
    gloss: >-
      Given Borel splitting and an involutive σ, a functional that factors through the Jacquet quotient and transforms
      by the normalized torus character at β has all its coefficients in the principal series at β.
  - name: GlobalTheory.CompanionTheory.FrobRec.frobU
    gloss: >-
      For an irreducible admissible representation of an unramified unitary group over a complete valued field with
