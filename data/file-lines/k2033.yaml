- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.LocCompactSecondCountable
  depth: 13
  lines: 250
  line: >-
    Proves local compactness, second countability, and a Haar scaling formula, and gives coordinates on a unitary
    parabolic radical.
  reading: >-
    For a complete discretely valued field L satisfying the unramified involution hypotheses with residue cardinality
    q², the module proves local compactness and second countability. It computes the additive Haar scaling under
    multiplication by u ∈ L× as q^(−2 ord_L(u)) by comparing indices of valuation balls. For the unipotent radical
    of the unitary line stabilizer, it derives the trace equation for the upper-right entry from the unitary matrix
    identity. Given a continuous involution σ, a trace-one θ and a nonzero d with σ(d) = −d, the trace equation
    gives a homeomorphism with Lⁿ × K, where K is the fixed field.
  key_decls:
  - name: GlobalTheory.LineUMod.locCompact_secondCountable
    gloss: >-
      Under the unramified involution hypotheses, the complete valued field L is locally compact and second countable.
  - name: GlobalTheory.LineUMod.distribHaarChar_eq
    gloss: Multiplication by u ∈ L× scales additive Haar measure by q^(−2 ord_L(u)).
  - name: GlobalTheory.LineUMod.val_eq_nMat
    gloss: >-
      A radical element has upper unitriangular block form, with top row block x equal to the negative of the reversed
      σ-conjugate of the right column block y and corner z satisfying z + σ(z) = x · y.
  - name: GlobalTheory.LineUMod.coord
    gloss: >-
      Given a continuous involution σ, a trace-one θ and a nonzero d with σ(d) = −d, the homeomorphism from the
      radical to Lⁿ × K uses the right column block and the coefficient (z − θ(z + σ(z)))/d of d in the corner z
      relative to the basis (θ, d).
  - name: GlobalTheory.LineUMod.normUnit
    gloss: The map sends u ∈ L× to the fixed-field unit uσ(u).
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
