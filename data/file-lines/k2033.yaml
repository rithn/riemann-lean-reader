    are units.
  reading: >-
    For a valuation-preserving involution, a unitary matrix lies in the Iwahori exactly when its entries are integral
    and its reduction is upper triangular. Necessity follows by testing lattice stabilization on coordinate vectors,
    and sufficiency follows because the unitary inverse formula gives the same entrywise bounds for the inverse,
    so both matrices preserve the lattice chain. Comparing diagonal entries in the product with the inverse shows
    that each diagonal entry is a unit. The unitary Iwahori factorization proof uses both the membership criterion
    and the diagonal unit property.
