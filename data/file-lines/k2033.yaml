    subgroup yields a nonzero functional on the representation that factors through the Jacquet quotient and has
    the same eigenvalues. Admissibility makes the Iwahori-fixed space finite dimensional, and lifting fixed Jacquet
    classes to it via the Jacquet lemma makes the Jacquet fixed space finite dimensional. Commutative algebra gives
    a dual eigenvector on that fixed space, and compact averaging extends it to the Jacquet module. The direct importer
    uses eqFormU to prove GlobalTheory.T.unitary_equivariant_form.
