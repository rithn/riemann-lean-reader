- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryJacquetNonzero
  depth: 10
  lines: 68
  line: >-
    Proves that a spherical Satake eigenvector has nonzero image in the Jacquet module of an unramified unitary
    group.
  reading: >-
    For an admissible irreducible representation with a Satake parameter, a spherical eigenvector gives a nonzero
    Jacquet class fixed by the integral diagonal subgroup. If the class vanished, a high power of a strictly dominant
    Iwahori Hecke operator would kill the vector. Casselman multiplication identifies operator powers on Iwahori-fixed
    vectors with operators for the corresponding torus powers. A KU-invariant functional equal to 1 on the vector
    and spherical comparison force eventual vanishing of the Satake values of the KU double cosets, contradicting
    nonvanishing at arbitrarily large powers. GlobalTheory.T.unitary_jacquet_nonzero restates the result.
  key_decls:
  - name: GlobalTheory.CompanionTheory.JacSph.hecke_pow
    gloss: >-
      For a smooth representation in Casselman’s setup, if t is dominant and U is its Hecke operator on the J-fixed
      space, then t^r is dominant and U^r is a Hecke operator for t^r for every r ≥ 0.
  - name: GlobalTheory.CompanionTheory.JacSph.jacNeU
    gloss: >-
      An admissible irreducible representation of an unramified unitary group with a Satake parameter has a nonzero
      Jacquet class fixed by the integral diagonal subgroup.
