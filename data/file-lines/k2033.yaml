- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.ExistsAdmissibleLinearFunctional
  depth: 12
  lines: 307
  line: >-
    Constructs a translation-invariant functional by normalized Haar integration under the unramified hypotheses
    for 0 < |w| and |w|q² < 1.
  reading: >-
    Over a complete discretely valued field satisfying the unramified involution hypotheses, admissible functions
    are locally constant and equal a multiple of w^(−ord_L x) outside a large ball. For |w|q² < 1, geometric shell
    bounds prove integrability of the spherical test function, and subtracting a multiple leaves a continuous compactly
    supported remainder. Haar integration with valuation ring volume one is translation invariant and scales by
    q^(2 ord_L c) under x ↦ cx for c ≠ 0. For nonzero w in this range the uniformizer identity gives the spherical
    integral (1 − w)/(1 − wq²). The statement re-exports the construction, and BlockDetOrderAdd and ModulusHalfBlockValue
    use the order lemma.
  key_decls:
  - name: GlobalTheory.CompanionTheory.SwapInt.ordL_mul_of_ne
    gloss: The order of a product of two nonzero field elements is the sum of their orders.
  - name: GlobalTheory.CompanionTheory.SwapInt.integral_comp_mul_left
    gloss: >-
      Under the unramified hypotheses, replacing F(x) by F(cx) for c ≠ 0 multiplies its regular additive Haar integral
      by q^(2 ord_L c).
  - name: GlobalTheory.CompanionTheory.SwapInt.integrable_of_isAdm
    gloss: >-
      Under the unramified involution hypotheses on a complete, locally compact, second-countable discretely valued
      field, every admissible function with |w|q² < 1 is integrable for normalized additive Haar measure.
  - name: GlobalTheory.CompanionTheory.SwapInt.sphFn_mul_uniformizer
    gloss: >-
      For nonzero w, substituting ϖx in the spherical test function gives w⁻¹ times the original function plus (1
      − w⁻¹) times the indicator of the valuation ring.
  - name: GlobalTheory.CompanionTheory.SwapInt.exists_invariant_integral
    gloss: >-
      Over a complete discretely valued field satisfying the unramified involution hypotheses, for 0 < |w| and |w|q²
      < 1 there exists a linear functional on the admissible class that is translation invariant, transforms under
