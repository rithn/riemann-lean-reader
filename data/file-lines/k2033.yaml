- module: Formalism.SatakeDualWeyl.AdelicIwasawaHecke.FIwasawaC
  depth: 11
  lines: 247
  line: >-
    Establishes the Gram identities, zero patterns, and row permutations used in unitary pivot selection.
  reading: >-
    Partial triangularity means that the first r columns vanish below the diagonal. The integral unitary matrices
    contain the identity and are closed under multiplication and, for a valuation-preserving field map, inversion.
    The antidiagonal Gram identity gives column isotropy before the midpoint, and induction gives reciprocal conjugate
    diagonal entries and zeros in the reflected rows. These zeros bound the rows needed for the next pivot search.
    FIwasawaD uses these identities and a permutation commuting with index reversal to move an entry of maximal
    valuation in the pivot window to the diagonal.
  key_decls:
  - name: Formalism.UG.P.fIwasawa_gram_un
    gloss: >-
      For a unitary matrix, the Gram pairing of columns a and b is one when b is the reversal of a and zero otherwise.
  - name: Formalism.UG.P.fIwasawa_rows
    gloss: >-
      For a unitary matrix triangular in its first r columns, each s < r has conjugated diagonal entry times reflected
      diagonal entry equal to one, and the reflected row vanishes to the left of its diagonal.
  - name: Formalism.UG.P.fIwasawa_col_zero
    gloss: >-
      For a unitary matrix triangular in its first r columns, if column r precedes its reflection, its entries below
      the reflected row vanish.
  - name: Formalism.UG.P.fIwasawa_iso
    gloss: >-
      In a unitary matrix, any column whose index precedes its reflection is isotropic for the antidiagonal pairing.
  - name: Formalism.UG.P.fIwasawa_perm
    gloss: >-
      If a pivot index strictly precedes its reflection, any index in their closed interval that differs from its
      own reflection is the image of the pivot index under a permutation commuting with reversal and fixing all
      indices outside the interval.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 6 field edits (key_decls, reading). Before and after text: check-log.tsv.
