- module: Formalism.SatakeDualWeyl.AdelicIwasawaHecke.FSatakeC
  depth: 10
  lines: 526
  line: >-
    Proves the torus–unipotent–integral cell decomposition of the Borel–integral product and computes spherical
    values on its cells.
  reading: >-
    In dimension 2m or 2m+1, the first m diagonal valuations of the Borel factor give the torus exponents, and the
    diagonal unit factor is absorbed into the integral subgroup. The ratio of two torus–unipotent factors for the
    same element has integral diagonal entries whose valuations cancel in opposite pairs, forcing the exponents
    to agree. The spherical transformation law gives the value on each cell, and uniqueness of the normalized spherical
    function forces vanishing off the Borel–integral product. FSatake uses these results to group the Hecke action
    sum by torus exponent.
  key_decls:
  - name: Formalism.UG.P.fSatake_tMat_exists
    gloss: >-
      Under the unramified hypotheses and 2m ≤ n, each integer exponent vector defines a diagonal unitary element
      with paired reciprocal uniformizer powers.
  - name: Formalism.UG.P.fSatake_cell_exists
    gloss: >-
      In the unramified case with n equal to 2m or 2m+1, every Borel–integral product factors as a diagonal uniformizer-power
      element, an upper unitriangular element, and an integral element.
  - name: Formalism.UG.P.fSatake_cell_unique
    gloss: Any two such factorizations of the same element have the same torus exponent vector.
  - name: Formalism.UG.P.fSatake_phi_cell
    gloss: >-
      On the cell with exponent vector a, the spherical function equals its value at the identity times the product
      of αᵢ^{aᵢ} q^{−aᵢ(n−1−2i)} over i from 0 to m−1.
  - name: Formalism.UG.P.fSatake_vanish
    gloss: >-
      For complete L under the unramified hypotheses in dimension 2m or 2m+1, existence and uniqueness of the normalized
      spherical function imply that every spherical function with the given nonzero parameters vanishes off the
      Borel–integral product.
  blueprint: []
  status: fixed
  check:
