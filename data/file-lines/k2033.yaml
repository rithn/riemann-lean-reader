- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryChamberDecompositionStatement
  depth: 9
  lines: 8
  line: >-
    Re-exports the chamber reduction theorem for principal series embeddings of unramified unitary groups.
  reading: >-
    Given the swap and inversion steps for an unramified unitary group, an admissible irreducible representation
    spherical for K_U that embeds equivariantly in a principal series also embeds equivariantly in one whose parameter
    lies in the same Weyl orbit and has nonincreasing coordinate moduli all at least one. The unitary extremality
