    and inverting coordinatewise. For the antidiagonal form, the diagonal tuple e satisfies σ(e(i)) e(i.rev) = 1
    at every index i, where σ is the given ring endomorphism. This relation also suffices to construct a diagonal
    unitary matrix. FSatakeC uses the product formula and the opposite-entry relation to prove uniqueness of the
    torus exponents.
  key_decls:
