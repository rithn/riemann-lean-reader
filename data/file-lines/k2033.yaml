- module: Development.AutomorphicSpectrum.Proofs.BlockDecomposition.UnitaryInverseReduction
  depth: 10
  lines: 328
  line: >-
    Proves that inverting a last principal series parameter of modulus below one preserves the existence of a spherical
    embedding.
  reading: >-
    For an irreducible admissible spherical representation of an unramified unitary group, an embedding into a principal
    series with |χ_j| < 1 at the last coordinate yields an embedding with χ_j inverted. Integration over the last
    simple reflection cell gives the reflected Borel character, and Iwasawa decomposition bounds the integrand by
    a multiple of the normalized spherical vector. The rank-one factor is nonzero in both parities, so the resulting
    map is nonzero on a spherical vector and hence injective. The direct importer uses invStepU to prove GlobalTheory.T.unitary_inverse_reduction.
  key_decls:
  - name: GlobalTheory.CompanionTheory.InvStep.spherical_cell
    gloss: >-
      When the last parameter has modulus below one, the spherical vector normalized at the identity is integrable
      over the translated cell of a Weyl representative in KU for the last simple reflection, and its integral equals
      the parity-dependent rank-one factor for Haar measure giving the cell’s intersection with KU mass one.
  - name: GlobalTheory.CompanionTheory.InvStep.cSimpleU_ne_zero
    gloss: The last simple reflection factor is nonzero for q ≥ 2 and a last parameter of modulus below one.
  - name: GlobalTheory.CompanionTheory.InvStep.integral_law
    gloss: >-
      For a function satisfying the original left Borel transformation law, right multiplication of its argument
      by a Borel element scales the integral over the translated last reflection cell by the normalized reflected
      character.
  - name: GlobalTheory.CompanionTheory.InvStep.integrable_cell
    gloss: >-
      When the last parameter has modulus below one, a function with the principal series Borel transformation law
      and right invariance under an open identity neighborhood is integrable over the translated cell of a Weyl
      representative in KU for the last simple reflection, with Haar measure giving the cell’s intersection with
      KU mass one.
  - name: GlobalTheory.CompanionTheory.InvStep.invStepU
    gloss: >-
      An irreducible admissible spherical representation embedded in the principal series at χ also embeds equivariantly
      in the principal series obtained by inverting the last coordinate of χ, provided that coordinate has modulus
      below one.
