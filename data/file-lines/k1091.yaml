    as a sum with j-th term binom(k,j) B_j N^(j−1) a^(k−j). Denint uses this expansion to clear denominators term
    by term.
  key_decls:
  - name: UpperTheory.V.Bern.b_expand
    gloss: >-
      For every positive integer N and nonnegative integers k and a, the scaled Bernoulli weight N^(k−1) B_k(a/N)
      equals the sum of binom(k,j) B_j N^(j−1) a^(k−j) over j = 0, …, k.
