- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.BUpper
  depth: 12
  lines: 39
  line: Bounds generalized Bernoulli numbers for complex-valued functions of modulus at most one.
  reading: >-
    For a function Φ on residues modulo a positive integer N with |Φ(a)| ≤ 1, its degree-k generalized Bernoulli
    number has absolute value at most 4N^k k!/(2π)^k. The proof applies the bound for the Bernoulli polynomial on
    [0,1] to each of the N summands and uses the triangle inequality. Denupper multiplies this estimate by the denominator
    factor to bound the scaled Bernoulli numbers, and NormCharEvalHigherStickelbergerLe uses it to bound character
    evaluations of higher Stickelberger elements.
  key_decls:
  - name: UpperTheory.V.Bern.b_upper
    gloss: >-
      For every nonnegative integer k and positive modulus N, the degree-k generalized Bernoulli number of a complex-valued
      function bounded in absolute value by one is bounded in absolute value by 4N^k k!/(2π)^k.
  blueprint: []
