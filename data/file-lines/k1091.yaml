    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Bcoef
  depth: 14
  lines: 25
  line: Proves the exponential generating function for scaled Bernoulli polynomial values.
  reading: >-
    For natural numbers N > 0 and a ≥ 0, the formal series with coefficients N^(k−1) B_k(a/N)/k! becomes t exp(at)
    after multiplication by exp(Nt)−1. The proof substitutes Nt for t in the Bernoulli polynomial generating identity
    at a/N and divides the resulting series by N. This identity is used to prove Raabe’s distribution formula.
  key_decls:
  - name: UpperTheory.V.Bern.b_egf
    gloss: >-
      For integers N > 0 and a ≥ 0, the exponential generating series of N^(k−1) B_k(a/N), multiplied by exp(Nt)−1,
      equals t exp(at) as a formal power series over ℚ.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (reading). Before and after text: check-log.tsv.
- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.BernoulliPolyReflection
  depth: 14
  lines: 36
  line: Proves translation, scaling, and reflection identities for scaled Bernoulli polynomial values.
  reading: >-
    For N > 0, write C(N,k,a) = N^(k−1) B_k(a/N). Translating a by N adds k a^(k−1), with zero increment at k =
    0, and reflecting a to N−a for 0 ≤ a ≤ N multiplies the value by (−1)^k. These identities follow from the translation
    and reflection formulas for B_k, while scaling N and a by the same positive integer m fixes a/N and contributes
    a factor of m^(k−1). The scaling identity is used to derive the Euler factor when a Dirichlet character’s modulus
    is multiplied by a prime.
  key_decls:
  - name: UpperTheory.V.Bern.b_shift
    gloss: >-
      For N > 0, shifting a by N adds k a^(k−1) for k ≥ 1 and zero for k = 0, scaling N and a by m > 0 multiplies
      C(N,k,a) by m^(k−1), and reflecting a to N−a for a ≤ N multiplies it by (−1)^k.
  - name: bernoulli_poly_reflection
    gloss: For rational x and k ≥ 0, B_k(1−x) = (−1)^k B_k(x).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Hurzero
  depth: 14
  lines: 36
  line: Proves that the Hurwitz zeta function satisfies ζ(0,x) = 1/2 − x for 0 < x ≤ 1.
  reading: >-
    For Re s > 1, a series with a telescoping correction represents ζ(s,x) − ζ(s,1) − (1−x). The common pole terms
    at s = 1 cancel, and the identity theorem extends the series identity to the region Re s > −1/2 and |s| < 3.
    Every summand vanishes at s = 0, so ζ(0,1) = −1/2 gives the claimed value. The result supplies the k = 1 case
    of the generalized Bernoulli formula for L-values at 1−k.
  key_decls:
  - name: UpperTheory.V.Bern.b_hurzero
    gloss: For real x with 0 < x ≤ 1, the Hurwitz zeta value at s = 0 is 1/2 − x.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.SumIccMulEq
  depth: 14
  lines: 38
  line: >-
    Proves that generalized Bernoulli sums are invariant under pulling back weights to a multiple modulus.
  reading: >-
    For N dividing M with M > 0, pulling a weight function on ℤ/Nℤ back along reduction from ℤ/Mℤ preserves its
    generalized Bernoulli sum in every degree. Writing M = Nm, the proof splits the summation interval into m blocks
    of length N, regroups terms by their representatives a in [1,N], and applies Raabe’s formula to the coefficients
    at a+jN. The invariance gives the uncorrected pullback sum in the proof of the prime-step formula for Dirichlet
    characters.
  key_decls:
  - name: UpperTheory.V.Bern.b_comp
    gloss: >-
      For N dividing M with M > 0, the kth generalized Bernoulli sum of a weight function into a commutative ℚ-algebra
      equals that of its pullback to ℤ/Mℤ.
  - name: sum_Icc_mul_eq
    gloss: >-
      The sum over 1 through Nm equals the sum over the m blocks indexed by a+jN with 1 ≤ a ≤ N and 0 ≤ j < m.
  - name: sum_Icc_one_eq
    gloss: Summing f over 1 through n is equivalent to summing f(i+1) over 0 ≤ i < n.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Termdiff
  depth: 15
  lines: 77
  line: Proves holomorphy of a corrected Hurwitz zeta difference series on Re s > −1/2 and |s| < 3.
  reading: >-
    For 0 < x ≤ 1, the correction to the difference of the Hurwitz summands at x and 1 cancels the linear Taylor
    terms about n+1. The two second-order remainders give the uniform summable majorant 24((n+x)^(−3/2) + (n+x)^(−5))
    on the stated region. Each summand is entire in s, so the sum is holomorphic there. This holomorphy lets the
    identity theorem carry the series formula to s = 0 in the evaluation of ζ(0,x).
  key_decls:
  - name: UpperTheory.V.Bern.b_termdiff
    gloss: >-
      For 0 < x ≤ 1, the series with summands (n+x)^(−s) − (n+1)^(−s) − (1−x)((n+1)^(−s) − (n+2)^(−s)) is holomorphic
      on Re s > −1/2 and |s| < 3.
  - name: termdiff_rpow_le
    gloss: For a > 0 and −5 ≤ e ≤ −3/2, the real power a^e is bounded above by a^(−3/2) + a^(−5).
  - name: termdiff_cpow
    gloss: For a positive real base a, the function s ↦ a^(−s) is entire.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Termsum
  depth: 15
  lines: 32
  line: Sums a corrected difference of Hurwitz zeta series on the half-plane Re s > 1.
  reading: >-
    For 0 < x ≤ 1, the corrected difference of the Hurwitz series at x and 1 sums to ζ(s,x) − ζ(s,1) − (1−x). The
    proof shifts the series at 1 by one term, leaving the initial term 1 as the sum of the telescoping difference.
    This identity supplies the equality on Re s > 1 that is continued to s = 0 to evaluate ζ(0,x).
  key_decls:
  - name: UpperTheory.V.Bern.b_termsum
    gloss: >-
      For 0 < x ≤ 1 and Re s > 1, summing (n+x)^(−s) − (n+1)^(−s) − (1−x)((n+1)^(−s) − (n+2)^(−s)) over n ≥ 0 gives
      ζ(s,x) − ζ(s,1) − (1−x).
  - name: hasSum_hurwitzZeta
    gloss: >-
      For 0 ≤ x ≤ 1 and Re s > 1, the series with terms (n+x)^(−s) for n ≥ 0 sums to the Hurwitz zeta value at the
      class of x modulo 1, using the formal convention for complex powers at zero.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.BTaylor2
  depth: 16
  lines: 79
  line: Bounds the first-order Taylor remainder of t ↦ t^(−s) on positive real intervals for Re s ≥ −2.
  reading: >-
    For u,v ≥ a > 0 and Re s ≥ −2, the error in the linear approximation at u is bounded by |s| |s+1| a^(−Re s−2)(v−u)².
    The proof differentiates complex powers along the positive real axis and applies the mean-value inequality twice,
    first to bound the variation of the derivative and then to bound the remainder. The estimate is used to obtain
    a summable majorant for the corrected Hurwitz zeta difference series.
  key_decls:
  - name: UpperTheory.V.Bern.b_taylor2
    gloss: >-
      For u,v ≥ a > 0 and Re s ≥ −2, the modulus of v^(−s) − u^(−s) + s(v−u)u^(−s−1) is at most |s| |s+1| a^(−Re
      s−2)(v−u)².
  - name: lip
    gloss: >-
      For Re s ≥ −2, the function t ↦ t^(−s−1) is Lipschitz on [a,∞) with constant |s+1| a^(−Re s−2) for each a
      > 0.
  - name: hd_cpow
    gloss: >-
      For a complex exponent c and positive real t, the derivative of t ↦ t^c with respect to t is c t^(c−1).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
