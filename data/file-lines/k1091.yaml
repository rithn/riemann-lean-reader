- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.StickelbergerElements.StickelbergerBernoulliCoeffExpansionModDenominat
  depth: 13
  lines: 46
  line: >-
    Expands the normalized Stickelberger Bernoulli coefficient into two power terms with an explicit denominator
    bound for the remainder.
  reading: >-
    For positive integers M and k and a nonnegative integer b, the degree-k coefficient divided by k is b^k/(kM)
    − b^(k−1)/2 modulo integer multiples of 2M/dk(k). The proof isolates the B₀ and B₁ terms in the Bernoulli polynomial
    expansion and clears the remaining Bernoulli denominators with the product of primes at most k+1. GenBUnits
    and TwistedBernoulliValueCongrPowMulFirst apply the expansion at pairs of residues to prove congruences for
    combinations of coefficients.
  key_decls:
  - name: UpperTheory.V.Stk.stickelbergerBernoulliCoeff_expansion_mod_denominator
    gloss: >-
      For integers M, k ≥ 1 and b ≥ 0, bcoef(M,k,b)/k equals b^k/(kM) − b^(k−1)/2 + (2M/dk(k))z for some integer
      z, where dk(k) is 2k times the product of primes at most k+1.
  blueprint: []
  status: fixed
