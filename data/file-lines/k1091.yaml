- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.BNzC
  depth: 11
  lines: 70
  line: >-
    Proves nonvanishing of generalized Bernoulli numbers for complex Dirichlet characters of matching parity.
  reading: >-
    For a complex Dirichlet character χ of positive modulus with χ(−1) = (−1)^k, the primitive generalized Bernoulli
    number is nonzero for k ≥ 1, and the number at the original modulus is nonzero for k ≥ 2. The proof relates
    the primitive number to the L-value at 1−k and uses the functional equation and nonvanishing for the inverse
    primitive character at k. At the original modulus, each Euler factor is nonzero because the term subtracted
    from 1 has absolute value either 0 or p^(k−1) > 1. BNzany extends both conclusions to characteristic-zero fields.
  key_decls:
  - name: UpperTheory.V.Bern.b_nzC
    gloss: >-
      For a complex Dirichlet character χ of positive modulus with χ(−1) = (−1)^k and k ≥ 1, the degree-k primitive
      generalized Bernoulli number is nonzero, and the degree-k generalized Bernoulli number at the original modulus
      is nonzero when k ≥ 2.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.BNzany
  depth: 11
  lines: 43
  line: >-
    Extends generalized Bernoulli nonvanishing for Dirichlet characters of matching parity to every characteristic-zero
    field.
  reading: >-
    For a Dirichlet character χ of positive modulus over a characteristic-zero field with χ(−1) = (−1)^k, the primitive
    generalized Bernoulli number is nonzero for k ≥ 1, and the number at the original modulus is nonzero for k ≥
    2. The proof lifts χ to the algebraic closure of its coefficient field, descends the lifted character to an
    algebraic closure of ℚ, and applies the complex theorem via an embedding into ℂ. Field embeddings preserve and
    reflect the parity condition and both nonvanishing claims. PsiReal and ZeNorm use primitive nonvanishing over
    algebraic closures of p-adic fields.
  key_decls:
  - name: UpperTheory.V.Bern.b_nzany
    gloss: >-
      Over any characteristic-zero field, a Dirichlet character χ of positive modulus with χ(−1) = (−1)^k has a
      nonzero primitive generalized Bernoulli number for k ≥ 1 and a nonzero generalized Bernoulli number at the
      original modulus for k ≥ 2.
  - name: nz_iff
    gloss: >-
      A homomorphism between characteristic-zero fields preserves and reflects the equality χ(−1) = (−1)^k and the
      nonvanishing of both degree-k generalized Bernoulli numbers, at the conductor and at the original modulus.
