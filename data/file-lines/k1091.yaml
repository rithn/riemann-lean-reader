    1 − χ*(p)p^(k−1) for each distinct prime p dividing N, where χ* is the associated primitive character. BNzC
    uses this factorization to extend primitive nonvanishing to the original modulus for k ≥ 2.
  key_decls:
  - name: UpperTheory.V.Bern.b_primlevel
    gloss: >-
      For a Dirichlet character χ of positive modulus N over a commutative ℚ-algebra and k ≥ 1, the degree-k generalized
      Bernoulli number equals its primitive counterpart times the product of 1 − χ*(p)p^(k−1) over the distinct
      primes p dividing N.
  blueprint: []
