- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Charbij
  depth: 12
  lines: 49
  line: >-
    Proves a kernel-preserving bijection of Dirichlet characters under field embeddings when the source has the
    requisite roots of unity.
  reading: >-
    Let N be positive and e the exponent of the unit group modulo N. If the source field contains a primitive e-th
    root of unity, a field embedding induces a bijection on Dirichlet characters whose kernels on units lie in any
    prescribed family of subgroups. Injectivity preserves the kernel, and surjectivity follows because the target
    character's values on units are e-th roots of unity and can be pulled back through the embedding. BNzany extends
    the values of its input character from the characteristic-zero field Ω to its algebraic closure and uses surjectivity
    to lift it along a chosen embedding from the algebraic closure of ℚ.
  key_decls:
  - name: UpperTheory.V.Bern.b_charbij
    gloss: >-
      For a field embedding whose source contains a primitive root of unity of order equal to the exponent of the
      unit group modulo N, composition bijects the source- and target-valued Dirichlet characters of positive modulus
      N whose kernels on units belong to a prescribed family.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Expand
