    expresses |L(1−k, χ)| as 2(k−1)!N^(k−1/2)/(2π)^k times |L(k, χ⁻¹)|. The proof substitutes the finite Fourier
    transforms of χ and χ composed with negation into the functional equation, combines the two phases using parity,
    and uses Γ(k) = (k−1)! and the Gauss sum magnitude √N. BNzC uses the identity to transfer nonvanishing at k
    to the primitive special value at 1−k.
  key_decls:
  - name: UpperTheory.V.Bern.b_fe
    gloss: >-
      If χ is a primitive complex Dirichlet character of positive conductor N and k ≥ 1 satisfies χ(−1) = (−1)^k,
      then |L(1−k, χ)| = 2(k−1)!N^(k−1/2)/(2π)^k · |L(k, χ⁻¹)|.
  - name: fe_LFunction_const_mul
    gloss: >-
      Multiplying a complex-valued function on residues modulo a positive integer by a scalar multiplies its associated
