    notes: ''
- module: Development.AbelianVarietyTheory.Definitions.Foundations.CoPtMu
  depth: 10
  lines: 32
  line: Defines two signed divisor-sum sequences, their Cauchy convolution, and a four-term smoothing.
  reading: >-
    The two divisor sums retain factorizations s = uv for which p divides neither factor and subtract the contribution
    selected by −v from that selected by v, using congruences modulo N. The first multiplies the Dirichlet character
    modulo p^m evaluated at the signed quotient by that quotient raised to max(k−2, 0), while the second evaluates
    the inverse character on the correspondingly signed divisor. Their Cauchy convolution gives the sequence used
    in the four-term smoothing, which a direct importer identifies with the b = 1 specialization of its two-residue
    smoothing.
  key_decls:
  - name: GlobalTheory.KummerEisensteinGalois.ffMu
    gloss: >-
      Sums the difference of the contributions from v and −v in the class a modulo N, weighting each signed quotient
      by its character value times its power of exponent max(k−2, 0).
  - name: GlobalTheory.KummerEisensteinGalois.eeMu
    gloss: >-
      Sums inverse-character values at u and subtracts those at −u, selecting each term by whether the corresponding
      signed quotient v or −v lies in the class b modulo N.
  - name: GlobalTheory.KummerEisensteinGalois.coPtMu
    gloss: Takes the Cauchy convolution of the two divisor-sum sequences associated to a and b.
  - name: GlobalTheory.KummerEisensteinGalois.coPtS
    gloss: >-
      Forms a weighted alternating sum of the convolution at residue pairs (x, 1), (cx, 1), (x, d), and (cx, d),
      with weights built from powers of c and d and inverse-character values.
