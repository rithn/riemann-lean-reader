    notes: ''
- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.GeneralizedBernoulliChangeLevel
  depth: 12
  lines: 60
  line: >-
    Proves the Euler-factor formula for generalized Bernoulli numbers under inflation to a multiple of the modulus.
  reading: >-
    For k ≥ 1, inflating a Dirichlet character χ from modulus N to a positive multiple M multiplies its degree-k
    generalized Bernoulli number by the product of 1 − χ(p)p^(k−1) over primes p dividing M. The proof iterates
    the one-prime formula along the factorization of M/N: a prime already dividing the intermediate modulus contributes
    no new factor, while a new prime retains its original character value. Primlevel applies the formula to inflation
    from the conductor to the given modulus.
  key_decls:
  - name: UpperTheory.V.Bern.b_level
    gloss: >-
      For a Dirichlet character χ over a commutative ℚ-algebra, k ≥ 1, and a positive multiple M of its modulus,
      inflation to M multiplies the generalized Bernoulli number by the product of 1 − χ(p)p^(k−1) over the distinct
      prime divisors of M.
  - name: UpperTheory.V.Bern.generalized_bernoulli_change_level
    gloss: >-
      For positive N and m and k ≥ 1, the generalized Bernoulli number after inflation from N to M = Nm equals the
      original number times the product of 1 − χ(p)p^(k−1) over the distinct primes dividing M.
  - name: UpperTheory.V.Bern.level_zero
    gloss: A Dirichlet character vanishes at every prime dividing its modulus.
  - name: UpperTheory.V.Bern.level_val
    gloss: >-
      Inflation from N to a multiple M preserves the character value at every prime that does not divide M.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Primden
  depth: 12
  lines: 38
  line: >-
    Proves that the product of the primes up to k+1 clears the denominators of all ordinary Bernoulli numbers through
    index k.
  reading: >-
    The proof uses von Staudt–Clausen at even indices, since each prime contributing to the denominator of B_j satisfies
    p−1 ∣ j and p ≤ j+1, and handles odd indices using B_1 = −1/2 and vanishing for odd j > 1. Denint uses this
    common denominator to clear the ordinary Bernoulli coefficients in the expansion of the scaled Bernoulli polynomial
    weights.
  key_decls:
  - name: UpperTheory.V.Bern.b_primden
    gloss: >-
      For nonnegative integers j ≤ k, multiplying B_j by the product of all primes up to k+1 gives an integer.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Primlevel
  depth: 12
