- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Primeq
  depth: 11
  lines: 26
  line: >-
    Proves that the primitive Bernoulli number and primitive character values are invariant under raising the modulus.
  reading: >-
    Injectivity of inflation from a fixed modulus shows that a primitive character has its original values and generalized
    Bernoulli number at the conductor, and that raising the modulus to any positive multiple preserves both primitive
    quantities. ZeNorm uses the primitive-character identity to replace the primitive Bernoulli number by the generalized
