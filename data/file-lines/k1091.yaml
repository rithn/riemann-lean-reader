  - name: GlobalTheory.LambdaValuationPowers.chiAvg_eq_sum_inv
    gloss: >-
      Expresses the reciprocal-weighted average for χ as a χ-weighted sum with the smoothing evaluated at (xδ⁻¹,δ⁻¹).
  - name: GlobalTheory.LambdaValuationPowers.chiAvg_shift
    gloss: >-
      Shows that for a Dirichlet character χ modulo nonzero N, scaling both arguments of the smoothing by a unit
