- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.BRaabe
  depth: 13
  lines: 48
  line: Proves Raabe’s distribution formula for scaled Bernoulli polynomial values.
  reading: >-
    The theorem expresses N^(k−1) B_k(a/N) as the sum of the corresponding scaled values at level Nm over the arguments
    a+jN for 0 ≤ j < m. The proof factors exp(Nm t)−1 as a geometric sum times exp(Nt)−1, applies the exponential
    generating function over the rationals, and extracts the coefficient of t^k. The identity is used to prove invariance
    of generalized Bernoulli sums under pullback to a multiple modulus and to compare sums over unit classes when
    raising the modulus by a power of a prime that already divides it.
  key_decls:
  - name: UpperTheory.V.Bern.b_raabe
    gloss: >-
      For positive integers N and m and nonnegative integers k and a, bcoef(N,k,a) equals the sum of bcoef(Nm,k,a+jN)
      over 0 ≤ j < m.
