  line: >-
    Collects Dirichlet L-function nonvanishing and critical-line theorems, together with the Riemann hypothesis.
  reading: >-
    The imported half-plane theorem gives nonvanishing for every Dirichlet L-function in Re(s) > 1/2 except at s
    = 1 for the principal character. In the open critical strip, the functional equation and gamma-factor nonvanishing
    reflect a primitive character’s zero at s to a zero for its inverse at 1 − s, so half-plane nonvanishing confines
    these zeros to Re(s) = 1/2. Conductor reduction extends the strip result to all characters. The modulus-one
    specialization gives zeta nonvanishing for Re(s) > 1/2 away from s = 1, and the zeta functional equation rules
    out nontrivial zeros to the left of the critical line.
