- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.MapGenBChar
  depth: 10
  lines: 66
  line: >-
    Defines generalized Bernoulli numbers and proves their compatibility with coefficient maps and subalgebras.
  reading: >-
    The degree-k generalized Bernoulli number of a function on residues modulo N is the sum of its values at a =
    1, …, N weighted by N^(k−1) B_k(a/N). The primitive Bernoulli number and primitive L-function use the associated
    primitive character at its conductor. Ring homomorphisms between commutative ℚ-algebras preserve the rational
    weights and carry the sum to the sum for the mapped function, including for Dirichlet characters. The sum also
    lies in every ℚ-subalgebra containing the function values. BNzany uses coefficient compatibility to transport
    nonvanishing along an injective map.
  key_decls:
  - name: UpperTheory.V.Bern.genB
    gloss: >-
      Defines the degree-k generalized Bernoulli number as a sum over a = 1, …, N with weights N^(k−1) B_k(a/N).
  - name: UpperTheory.V.Bern.Bprim_eq
    gloss: >-
      Expresses the primitive generalized Bernoulli number as a weighted sum over a = 1, …, f, evaluating the associated
      primitive character at each a modulo its conductor f.
  - name: UpperTheory.V.Bern.map_genB
    gloss: >-
      Applying a ring homomorphism between commutative ℚ-algebras to a generalized Bernoulli number gives the number
      for the pointwise image of the function.
  - name: UpperTheory.V.Bern.map_genB_char
    gloss: >-
      The generalized Bernoulli number of a Dirichlet character composed with a ring homomorphism between commutative
      ℚ-algebras is the image of the original number.
  - name: UpperTheory.V.Bern.genB_mem
    gloss: The generalized Bernoulli number lies in any ℚ-subalgebra that contains every value of the function.
  blueprint: []
  status: fixed
  check:
