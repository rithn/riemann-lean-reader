- module: Development.AutomorphicArithmetic.AutomorphicVarieties.OddResidueBounds.ChiFacts
  depth: 10
  lines: 28
  line: >-
    Proves injectivity, kernel parity, and Bernoulli coefficient ring membership for pulled-back Dirichlet characters.
  reading: >-
    Pullback along a surjection ρ from the units modulo N onto Autℚ(E) is injective on O-valued unit characters,
    since evaluation on preimages recovers the original character. The pullback kernel contains ker ρ and contains
    −1 exactly when k is even if χ(−1) = (−1)^k. The subring membership theorem for scaled Bernoulli numbers puts
    den(N,k) times the kth Bernoulli number of the primitive character associated to χ in O. AtPrime uses the parity
    and kernel condition for membership in the prescribed character set and injectivity to reindex the sum over
    the image. PsiReal uses the ring membership to apply a valuation bound.
  key_decls:
  - name: UpperTheory.V.Odd.chiFacts
    gloss: >-
      For a number field E, a surjective ρ from the units modulo N onto Autℚ(E), and a ℤℓ-subalgebra O of an algebraic
      closure of ℚℓ, pullback of O-unit-valued characters is injective, the kernel of each parity-matching pullback
      contains ker ρ and contains −1 exactly when k is even, and the denominator-scaled kth Bernoulli number of
      the associated primitive character belongs to O for every k.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AbelianVarietyTheory.Definitions.Foundations.SumMulCoPtSbEqSumInv
  depth: 11
  lines: 133
  line: >-
    Defines a four-term smoothing and proves inversion and unit-scaling identities for its character-weighted sums.
  reading: >-
    The smoothing combines convolution values at (a,b), (ca,b), (a,db), and (ca,db) and depends only on the classes
    of a and b modulo N. For nonzero N, the average sums values at (xδ,δ) over units δ modulo N with reciprocal
    weights. For weights from a Dirichlet character χ modulo N, inversion rewrites the average as a χ-weighted sum
    at (xδ⁻¹,δ⁻¹), and scaling both arguments by a unit t multiplies the average by χ(t). The direct importer ChiProj
    uses the same smoothing with weights χ(δ).
  key_decls:
  - name: GlobalTheory.LambdaValuationPowers.coPtSb
    gloss: >-
      Forms a weighted alternating sum of four convolution values by scaling the first residue by c, the second
      by d, or both.
  - name: GlobalTheory.LambdaValuationPowers.coPtSb_congr
    gloss: >-
      Shows that the smoothed convolution is unchanged when either argument is replaced by a congruent integer modulo
      N.
  - name: GlobalTheory.LambdaValuationPowers.chiAvg
    gloss: >-
      Sums the smoothed convolution at (xδ,δ) over units δ modulo N, with the reciprocal of the supplied weight
