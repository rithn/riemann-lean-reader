- module: Formalism.GammaFactorNonvanishing.RhOfRight
  depth: 5
  lines: 62
  line: Derives the Riemann hypothesis from nonvanishing of ζ(s) for Re s > 1/2 away from s = 1.
  reading: >-
    The assumed nonvanishing of ζ(s) for Re s > 1/2, s ≠ 1, rules out zeros to the right of the critical line. For
    a putative nontrivial zero s to the left, the proof evaluates the zeta functional equation at 1 − s and shows
    that every factor on its right-hand side is nonzero. A vanishing cosine would force s to be an even integer,
    and the condition Re s < 1/2, ζ(0) ≠ 0, and the exclusion of trivial zeros eliminate those cases. CritLine specializes
    its EveryCharacter hypothesis to the trivial character modulo 1 and rewrites the resulting L-function as ζ to
    apply the theorem.
  key_decls:
  - name: Formalism.VW.rh_of_right
    gloss: >-
      If ζ(s) is nonzero for every s with Re s > 1/2 and s ≠ 1, then every nontrivial zero of ζ lies on Re s = 1/2.
  blueprint:
  - merten:thm-riemann-hypothesis
  - naskrecki:rh-right
