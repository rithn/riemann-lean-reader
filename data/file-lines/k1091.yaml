- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.DirichletCharacterLevelRaising
  depth: 13
  lines: 60
  line: >-
    Proves the Euler-factor formula for generalized Bernoulli numbers when a Dirichlet character’s modulus is multiplied
    by a prime.
  reading: >-
    For k ≥ 1, inducing a Dirichlet character χ from modulus N to Np multiplies its kth generalized Bernoulli number
    by 1 − χ(p)p^(k−1). The proof starts with the Bernoulli sum for the pullback along reduction modulo N, subtracts
    the terms at multiples of p, and reindexes them by a = pb. Character multiplicativity and the scaling of Bernoulli
    coefficients give the correction factor. The formula supplies the induction step for the product formula at
    arbitrary multiple moduli.
  key_decls:
  - name: UpperTheory.V.Bern.b_step
    gloss: >-
      For N > 0, p prime, and k ≥ 1, the kth generalized Bernoulli number of the character induced from χ modulo
      N to modulus Np is (1 − χ(p)p^(k−1)) times that of χ.
  - name: valuation_power_identity
    gloss: >-
      The character induced to modulus Np is obtained from the pullback of χ by setting its values at multiples
      of p to zero.
  - name: sum_divisible_eq_sum_mul
    gloss: For p > 0, the sum of f(a) over multiples of p in [1,Np] equals the sum of f(pb) over b in [1,N].
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: >-
    Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.GaussMulGaussInv
  depth: 13
  lines: 38
  line: >-
    Proves that a primitive Dirichlet character modulo N has Gauss sum of absolute value √N and root number of absolute
    value 1.
  reading: >-
    Applying the finite Fourier transform twice and evaluating at 1 gives τ(χ)τ(χ⁻¹) = χ(−1)N for primitive χ. Complex
    conjugation in the Gauss sum gives the sum for the inverse character with the additive character reversed, producing
    the factor χ(−1). Together these identities give |τ(χ)|² = N, and the root-number normalization gives absolute
    value 1. The Gauss sum magnitude is used to evaluate the absolute-value factor in the Dirichlet L-function functional
    equation at 1−k.
  key_decls:
  - name: gauss_mul_gauss_inv
    gloss: For primitive χ modulo N, the standard Gauss sums satisfy τ(χ)τ(χ⁻¹)χ(−1) = N.
  - name: conj_gauss
    gloss: For any complex Dirichlet character χ modulo N, the complex conjugate of τ(χ) is χ(−1)τ(χ⁻¹).
  - name: UpperTheory.V.Bern.b_gauss
    gloss: >-
      For primitive χ modulo N, the standard Gauss sum has absolute value √N and the root number has absolute value
      1.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Polybound
  depth: 13
  lines: 68
  line: Proves the uniform bound |B_k(x)| ≤ 4k!/(2π)^k for rational x in [0,1] and every k ≥ 0.
  reading: >-
    For k ≥ 2 and real x in [0,1], the proof pairs opposite frequencies in the Fourier expansion of B_k(x) and uses
    the unit modulus of each Fourier character to bound the normalized series by 2ζ(2) = π²/3 < 4. Agreement of
    rational and real polynomial evaluation transfers the estimate to rational inputs, and direct evaluation handles
    k = 0 and k = 1. The bound is applied term by term to generalized Bernoulli sums with complex weights of absolute
    value at most one.
  key_decls:
  - name: UpperTheory.V.Bern.b_polybound
    gloss: For every k ≥ 0 and rational x in [0,1], the Bernoulli polynomial satisfies |B_k(x)| ≤ 4k!/(2π)^k.
  - name: polybound_big
    gloss: For k ≥ 2 and real x in [0,1], the normalized value (2π)^k |B_k(x)|/k! is at most 4.
  - name: polybound_norm_fourier
    gloss: Every integer-frequency Fourier character on the unit circle has absolute value one.
  - name: polybound_cast
    gloss: >-
      Evaluating a Bernoulli polynomial at a rational argument and embedding the result in the reals agrees with
      real evaluation.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Sumicc
  depth: 13
  lines: 34
  line: Proves an elementary reindexing lemma for sums over residue classes modulo a positive integer.
  reading: >-
    Reduction modulo N identifies the integers 1 through N with the residue classes modulo N, using N as the representative
    of zero and the least positive representative for every other class. The reindexing is used in the Bernoulli
    formula for L-values at 1−k, in rewriting generalized Bernoulli sums over units, and in evaluating Stickelberger
    elements at characters.
  key_decls:
  - name: UpperTheory.V.Bern.b_sumicc
    gloss: >-
      For N > 0 and any additive commutative monoid M, summing a function G from ℤ/Nℤ to M over the reductions of
      1 through N equals summing G over all residue classes.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.StickelbergerCharacterEval.Chitheta
  depth: 13
