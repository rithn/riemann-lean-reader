    gloss: >-
      Every Dirichlet L-function is nonzero in Re(s) > 1/2 except at the excluded pair of the principal character
      and s = 1.
  - name: rhOfAll
    gloss: Every nontrivial zero of the Riemann zeta function has real part 1/2.
  - name: critAll
    gloss: Every zero of a primitive Dirichlet L-function in 0 < Re(s) < 1 lies on Re(s) = 1/2.
  - name: claimAll
    gloss: >-
      The conjunction asserts half-plane nonvanishing, the critical-line statement for all Dirichlet characters
      in the open critical strip, and the Riemann hypothesis.
