- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.BOneSum
  depth: 9
  lines: 45
  line: >-
    Proves a weighted-sum formula for the first generalized Bernoulli number of a function whose values sum to zero.
  reading: >-
    For a positive modulus N and a function Φ from the residue classes modulo N to a commutative ℚ-algebra, if the
    values of Φ sum to zero, then N times its first generalized Bernoulli number equals the sum of aΦ(a mod N) over
    a = 1, …, N. The proof reindexes the residue-class sum using these representatives and substitutes the first
    Bernoulli polynomial x − 1/2, whose constant term cancels by the zero-sum hypothesis. LemmaX applies the formula
    to an odd product of Dirichlet characters, and ResidualBernoulliNonvanishing uses it to evaluate a sum over
    units weighted by a nontrivial Dirichlet character.
  key_decls:
  - name: UpperTheory.V.Bern.b_one_sum
    gloss: >-
      For a positive modulus N, summing an additive-commutative-monoid-valued function over the residue classes
      modulo N gives the same result as summing its values on the representatives 1, …, N.
  - name: UpperTheory.V.Bern.b_one
    gloss: >-
      For a positive modulus N and a function Φ from the residue classes modulo N to a commutative ℚ-algebra whose
      values sum to zero, N times its first generalized Bernoulli number equals the sum of aΦ(a mod N) over a =
      1, …, N.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Condmap
  depth: 9
  lines: 49
  line: >-
    Proves that injective coefficient maps preserve Dirichlet character conductors and commute with passage to primitive
    characters.
  reading: >-
    Composing a Dirichlet character of positive modulus with an injective homomorphism of commutative rings preserves
    its kernel on units and its conductor, and applies the homomorphism pointwise to the associated primitive character.
    The proof recovers the conductor from the divisors through which the character factors, as determined by its
    kernel, and compares primitive values by injectivity of inflation to the original modulus. Primmap uses the
    conductor and value identities to transport primitive generalized Bernoulli numbers, while ChrInvNeg and ZeNorm
    use conductor preservation to retain primitivity under coefficient maps.
  key_decls:
  - name: UpperTheory.V.Bern.b_condmap
    gloss: >-
      Composing a Dirichlet character of positive modulus with an injective homomorphism of commutative rings preserves
      its conductor and kernel on units and sends each primitive character value at a natural number to its image
      under the homomorphism.
  - name: change_level_value_eq
    gloss: >-
      For characters of the same modulus dividing a positive common modulus, if their inflations agree after applying
      a coefficient homomorphism to the first, then the second character's value at each natural number is the image
      of the first character's value.
  blueprint: []
  status: checked
