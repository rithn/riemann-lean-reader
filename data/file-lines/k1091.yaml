    notes: 'Review sample-01 (minor findings): 1 field edit (key_decls). Before and after text: check-log.tsv.'
- module: Development.AutomorphicArithmetic.AutomorphicVarieties.GaloisLibrary.BernoulliNumbers.Primmem
  depth: 10
  lines: 54
  line: >-
    Proves subring membership and integrality for generalized Bernoulli numbers after clearing denominators.
  reading: >-
    For a Dirichlet character of positive modulus N with values in a commutative ℚ-algebra, its primitive degree-k
    Bernoulli number lies in every ℚ-subalgebra containing its values on units. Multiplying by D = N·primorial(k+1)
    gives membership in every subring containing those values and makes both the primitive and original numbers
    integral over ℤ. The proof uses finite order on units and the divisibility of the conductor's denominator factor
    by way of its inclusion as a divisor of D. Prodint uses the integrality result for products, and PrimCase uses
    subring membership to place the scaled primitive number in a p-adic valuation ring.
  key_decls:
  - name: UpperTheory.V.Bern.b_primmem
    gloss: >-
      The primitive generalized Bernoulli number lies in every ℚ-subalgebra containing the character values on units,
      its multiple by N·primorial(k+1) lies in every subring containing those values, and the same factor makes
      both primitive and original numbers integral over ℤ.
  - name: dirichletCharacter_unit_isIntegral
    gloss: >-
      The value of a Dirichlet character on a unit is integral over ℤ because raising it to the order of the unit
      gives 1.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
