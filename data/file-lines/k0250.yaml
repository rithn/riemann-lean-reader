- module: Formalism.HermitianCurvature.HermitianCurvatureProofs.LagrangeExtraction
  depth: 12
  lines: 159
  line: >-
    Proves iterated Lagrange coefficient extraction on product grids, with norm bounds and explicit Chebyshev constants.
  reading: >-
    The Lagrange weights annihilate monomials below degree d and recover the degree-d coefficient of a vector-valued
    polynomial of degree at most d. For coordinate steps of degree at most d whose degree-d coefficient is a scalar
    times the preceding stage, induction expresses the scaled initial stage as a weighted terminal grid sum using
    d+1 distinct nodes per coordinate. The triangle inequality gives a uniform norm bound, and normalizing the absolute
    weights and applying Cauchy–Schwarz gives first- and second-moment bounds. Chebyshev nodes give an explicit
    constant on each interval. GaugeNormPower uses exact extraction to express an operator-valued word in terms
    of its grid evaluations.
  key_decls:
  - name: Formalism.FourierDecayAlt.P.LagrangeExtraction.lagrangeLead
    gloss: >-
      The coefficient of degree d of a real vector-valued polynomial of degree at most d is the Lagrange-weighted
      sum of its values at d+1 distinct real nodes.
  - name: Formalism.FourierDecayAlt.P.LagrangeExtraction.extractK
    gloss: >-
      If each coordinate step has degree at most d with degree-d coefficient equal to the preceding stage times
      a scalar, then on d+1 distinct nodes per coordinate the scaled initial stage equals the terminal grid sum
      with product Lagrange weights.
  - name: Formalism.FourierDecayAlt.P.LagrangeExtraction.extractBound
    gloss: >-
      A uniform bound B on the terminal grid norms bounds the scaled initial norm by B times the product of the
      coordinatewise sums of absolute Lagrange weights.
  - name: Formalism.FourierDecayAlt.P.LagrangeExtraction.extractProb
    gloss: >-
      The normalized absolute product weights define a probability measure whose first and second norm moments bound
      the scaled initial norm and its square, with the corresponding weight factors.
  - name: Formalism.FourierDecayAlt.P.LagrangeExtraction.extractCheb
    gloss: >-
      For d ≥ 1 and strictly ordered endpoints α < β in each coordinate interval, Chebyshev grids give the factor
