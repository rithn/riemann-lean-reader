- module: Formalism.HermitianCurvature.StatementMA
  depth: 13
  lines: 787
  line: >-
    Builds differential-algebra models of the transfer matrix and formulates Lemma E for the smooth cutoff energy.
  reading: >-
    The transfer entries are matrices of operator pairs on a commutative complex algebra of Hahn series or smooth
    functions, with the second operator in the opposite ring. The smooth model uses coordinate multiples of Wirtinger
    derivatives on the open set where every c-coordinate is nonzero and |ζ|² > TT′, and proves that these operators
    preserve smoothness. The word recursion and its diagonal weights define the steps and families of the cutoff-energy
    system. Lemma E specifies the limit as the cutoff tends to zero from above, under interlacing, decay, adjointness,
    and eigenvalue hypotheses. StatementJC uses this limit as a hypothesis in its comparison with the local lattice
    energy.
  key_decls:
  - name: Formalism.FourierDecayAlt.MA.DAlg.Laws
    gloss: >-
      Requires the Euler operators to be commuting derivations with prescribed action on coordinates, and requires
      the coordinates and ζζ̄ − TT′ to be units in a nontrivial algebra.
  - name: Formalism.FourierDecayAlt.MA.anQ
    gloss: >-
      Realises the differential algebra on smooth complex-valued functions using coordinates and their conjugates
      together with the corresponding Wirtinger Euler operators.
  - name: Formalism.FourierDecayAlt.MA.ModelFrameD
    gloss: >-
      Asserts the existence of compatible level and start data yielding a word-frame factorisation with positive
      diagonal coefficients for every cut word.
  - name: Formalism.FourierDecayAlt.MA.sysQ
    gloss: >-
      Packages the cutoff quadratic form, recursive word steps, and word families into a system for Lemma E.
  - name: Formalism.FourierDecayAlt.MA.LemmaEModel
    gloss: >-
      States that for a sufficiently wide spectral interval and an admitted word within the length bound, the cutoff
      energy tends to the word size times the squared L² norm of the source.
  blueprint:
  - merten:lem-cutoff-energy-limit
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review sample-03 (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Lemmata.HermitianSesquilinear.ConjEqOfNonnegReal
  depth: 13
  lines: 44
  line: >-
    Proves Hermitian symmetry and the Cauchy–Schwarz inequality for complex sesquilinear forms with real, nonnegative
    diagonal values.
  reading: >-
    Expanding the diagonal values at x + y and x + iy and setting their imaginary parts to zero yields Hermitian
    symmetry. The form then satisfies the axioms of a positive semidefinite inner product, so the standard inner-product
    Cauchy–Schwarz inequality bounds the squared modulus by the product of the diagonal values. GramProductIdentities
    invokes this bound in cs_of_pos and applies it to the form frmS in csPos.
  key_decls:
  - name: Bl.HermitianSesquilinear.conj_eq_of_nonneg_real
    gloss: >-
      A complex sesquilinear form with real, nonnegative diagonal values satisfies Ξ(y,x) = overline(Ξ(x,y)).
  - name: Bl.HermitianSesquilinear.goal1
    gloss: >-
      For a complex sesquilinear form with real, nonnegative diagonal values, |Ξ(x,y)|² ≤ Re Ξ(x,x) · Re Ξ(y,y)
      for all x and y.
  blueprint: []
