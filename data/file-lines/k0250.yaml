- module: Formalism.HermitianCurvature.HermitianCurvatureProofs.TopDegreePolynomials
  depth: 12
  lines: 151
  line: >-
    Proves degree bounds and top-degree coefficient formulas for shifted sesquilinear pairings, plane waves, and
    lifts.
  reading: >-
    Pairing two polynomial actions at real arguments Y and Y+h gives a complex polynomial of degree at most a+b
    when the input degrees are bounded by a and b. Expanding both actions leaves only the pair of indices (a,b)
    contributing to the coefficient of Y^(a+b). Expanding the two-by-two matrix action gives a difference of pairings,
    from which monicity and degree bounds give the plane-wave and lift coefficients at degrees 2n and 2n+s, respectively.
    WordLiftInduction uses the plane-wave coefficient formula and derives the lift coefficient from shifted pairing
    estimates to prove Chebyshev norm bounds for both kinds of words.
  key_decls:
  - name: Formalism.FourierDecayAlt.P.pairing_top_degree
    gloss: >-
      For input degree bounds a and b, the shifted pairing has degree at most a+b, and its coefficient in degree
      a+b is the pairing of the actions of the input coefficients in degrees a and b.
  - name: Formalism.FourierDecayAlt.P.j_pairing_formula
    gloss: >-
      Pairing the first evaluated pair, after applying J U(s)⁻¹, with the second evaluated pair gives Ξ((B(Y)+sA(Y))x,
      A′(Y′)x′) − Ξ(A(Y)x, B′(Y′)x′).
  - name: Formalism.FourierDecayAlt.P.plane_wave_top_degree
    gloss: >-
      For monic A and A′ of degree n and B and B′ of degree below n, the plane-wave pairing with shift one has degree
      at most 2n and coefficient s Ξ(x,x′) in degree 2n.
  - name: Formalism.FourierDecayAlt.P.lift_top_degree
    gloss: >-
      For s ≥ 1, e = ±1, nonzero t and t′, and monic A and A′ of degree n+s, if B and B′ act on the chosen vectors
      at every real evaluation point as e/t and e/conj(t′) times the respective monic degree-n polynomial actions,
      then the shifted J-pairing has degree at most 2n+s and coefficient e(1/t − 1/t′) Ξ(x,x′) in that degree.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 3 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Formalism.HermitianCurvature.HermitianCurvatureProofs.WeightedSumDifferenceIdentity
  depth: 12
  lines: 1545
  line: >-
    Proves the model transfer matrix’s quantum determinant formula and pairwise commutativity of its lower-left
    entries.
  reading: >-
    The lower-left commutator vanishes by separate identities for the constant and mixed products and by antisymmetry
    in the double shift sum. A partial-fraction calculation accounts for coincident shifted roots and expresses
    the raising–lowering commutator as a difference of normalized determinant values. This gives eight entry identities
    wherever the required diagonal inverses exist, and polynomiality extends them to every spectral parameter. LowerLevelsSameScalar
    uses the determinant formula to establish the starting module structure and lower-left commutativity to prove
    admissibility.
  key_decls:
  - name: Formalism.FourierDecayAlt.P.Mx7.weighted_sum_difference_identity
    gloss: >-
      If NS−SN = −bS, S commutes with b and G, XS = SX′, and E commutes with N and b, then GX(−N−cb)SE = SGX′E(−N−cb+b).
  - name: Formalism.FourierDecayAlt.P.lower_left_commute_model
    gloss: For P.OK, the lower-left transfer entries t₂₁(P,u) and t₂₁(P,v) commute for all complex u and v.
  - name: Formalism.FourierDecayAlt.P.Mx7.pf
    gloss: >-
      For P.OK and xC(P,π,·) nonzero at u−1, u, and u+1, the difference F(u−1) − F(u), with F(v) = qC(P,v)/(xC(P,π,v)xC(P,π,v+1)),
      equals an affine term plus a sum weighted by the upward and downward shift norms.
  - name: Formalism.FourierDecayAlt.P.Mx7.raising_lowering_commutator_alt
    gloss: >-
      Under the model relations, P.OK, and nonvanishing of all diagonal factors xC(π,·) at u−1, u, and u+1, the
      raising–lowering commutator is qC(u−1)t₂₂(u−1)⁻¹t₂₂(u)⁻¹ − qC(u)t₂₂(u)⁻¹t₂₂(u+1)⁻¹.
  - name: Formalism.FourierDecayAlt.P.transfer_determinant
    gloss: >-
      For P.OK, the transfer matrix has quantum determinant qC(Y) = −TT′ ∏ᵢ (Y+½+uᵢ)(Y+½+u′ᵢ) in both shifted symplectic
      matrix identities.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 5 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Formalism.HermitianCurvature.HermitianCurvatureProofs.WordMonicExtraction
  depth: 12
  lines: 413
  line: >-
    Proves Lagrange interpolation formulas for plane-wave pairings, lift pairings, and lifted vectors along words.
  reading: >-
    Lagrange weights on d+1 distinct real nodes extract the degree-d coefficient of a polynomial of degree at most
    d, including for vector-valued polynomials. For plane waves, strict degree bounds on B and Bv and monicity give
    the degree-2n coefficient. For lifts, the zero letter parameter and pairing identities reduce the degree-2n+s
    coefficient calculation to monic factors of degrees n and n+s. Induction on word length multiplies the letter
    factors and the interpolation weights, and the vector lift uses the same argument with ordered products of algebra
    elements. PolynomialDegreeExpansion uses the plane-wave formula to prove its grid degree identity.
  key_decls:
  - name: Formalism.FourierDecayAlt.P.WordMonicExtraction.word_gen
    gloss: >-
      If each letter’s weighted sum scales the pairing by a scalar for all algebra multiples of the input vectors,
      the product-weighted word sum scales the pairing by the product of those scalars.
  - name: Formalism.FourierDecayAlt.P.WordMonicExtraction.monic_extract
    gloss: >-
      For a monic degree-n polynomial A₀ and a complex-linear map E, the Lagrange-weighted sum of E(A₀(yᵢ)x) over
      n+1 distinct real nodes equals E(x).
  - name: Formalism.FourierDecayAlt.P.plane_wave_word_formula
    gloss: >-
      Under the plane-wave degree and monicity conditions, the Lagrange-weighted word sum on 2n+1 distinct nodes
      per letter equals the base pairing multiplied by ∏ₐ sₐ.
  - name: Formalism.FourierDecayAlt.P.lift_word_formula
    gloss: >-
      Under the lift hypotheses, the Lagrange-weighted word sum on 2n+s+1 distinct nodes per letter equals the base
      pairing multiplied by ∏ₐ eₐ(1/tₐ−1/t′ₐ).
  - name: Formalism.FourierDecayAlt.P.lift_vector_word
    gloss: >-
      If after applying a complex-linear map E each letter acts on every algebra multiple of X₀ as cₐ times a monic
      degree-n polynomial, the Lagrange-weighted sum of E applied to the ordered word actions on X₀ over n+1 distinct
      real nodes per letter equals (∏ₐ cₐ)E(X₀).
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Formalism.HermitianCurvature.PositionExpansionTopCoefficients
  depth: 12
  lines: 406
  line: Defines word pairings and formulates duality, interpolation, and norm estimates for plane waves.
  reading: >-
    A sesquilinear pairing compatible with the algebra involution defines the forms associated with word matrices.
    The duality propositions compare squared moduli of mixed pairings with products of diagonal forms divided by
    word-dependent scalar factors. The position expansion states a sesquilinear evaluation identity, and tensor-product
    Lagrange interpolation links its grid values to the plane-wave pairing. The module formulates implications from
    interpolation and pointwise size to a combined bound, then through normalisation to a two-regime estimate with
    the direct plane-wave bound as a separate input. GramProductIdentities proves the Gram sum, positivity, and
    realisation statements.
  key_decls:
  - name: Formalism.FourierDecayAlt.FormPairingAction.Rep
    gloss: >-
      Equips a module over a complex star algebra with a sesquilinear pairing for which the action of the involution
      gives the adjoint action.
  - name: Formalism.FourierDecayAlt.FormPairingAction.LemmaDK
    gloss: >-
      States that under the start, duality, and positivity hypotheses, the product of the primal and dual diagonal
      forms divided by the product of the word-dependent scalar factors is real and its real part bounds the squared
      modulus of the mixed pairing.
  - name: Formalism.FourierDecayAlt.FormPairingAction.PositionExpansionTopCoefficients
    gloss: >-
      States that under the plane-wave data and with the sesquilinear form given by the specified word form, the
      extended-word pairing at K real positions equals the iterated sesquilinear evaluation of the four insertion
      polynomials.
  - name: Formalism.FourierDecayAlt.FormPairingAction.GridDegreeIdentity
    gloss: >-
      States that under the plane-wave data and with 2n + 1 distinct nodes per position, sᴷ times the original plane-wave
      pairing equals a tensor-product Lagrange sum of extended pairings.
  - name: Formalism.FourierDecayAlt.FormPairingAction.SmallParameterNormBound
    gloss: >-
      States that under the plane-wave, grid, growth, positivity, and normalisation hypotheses, including a local
      normalisation factor at most X at every position, the plane-wave modulus divided by the word normaliser is
      bounded by the original normalised diagonal form for |s| ≤ X and by (X/|s|)ᴷ times a grid-weighted sum of
      the means of the primal and dual normalised extended forms for |s| > X.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 5 field edits (key_decls, reading). Before and after text: check-log.tsv.
