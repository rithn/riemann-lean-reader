  line: Defines polynomiality for functions from ℂ to a complex algebra.
  reading: >-
    The predicate IsPF holds when a single polynomial with coefficients in the target algebra represents the function
    at every complex argument, evaluated via the algebra’s structure map. IsPFSum unfolds this definition to prove
    closure under finite pointwise sums.
  key_decls:
  - name: UpperTheory.Reformulated.B.PolynomialFunction₂.IsPF
    gloss: >-
      A function f from ℂ to a complex algebra A is polynomial if some p in A[X] satisfies f(z) = p(ι(z)) for all
      z in ℂ, where ι is the structure map.
