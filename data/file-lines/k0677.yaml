- module: Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.TrivReal
  depth: 11
  lines: 81
  line: >-
    Reduces principal-character zeros with Re(s) > 0 and s ≠ 1 to zeta zeros and proves conjugation symmetry for
    nonprincipal real characters.
  reading: >-
    The principal-character L-function factors as the Riemann zeta function times a finite product of Euler factors,
    each nonzero for Re s > 0 because |p^(−s)| < 1. For real characters, termwise conjugation of the Dirichlet series
    gives the symmetry for Re s > 1, and the identity theorem extends it to the whole plane for nonprincipal characters.
    The Dirichlet zero-free region proof uses the zeta reduction for the principal character and conjugation symmetry
    to constrain real-character zeros at small height. The symmetry also gives real values on the real axis in the
    proof of positivity on a zero-free real ray.
  key_decls:
  - name: Formalism.ZeroFreeDirichlet.one_sub_prime_cpow_neg_ne_zero
    gloss: For every prime p and every s with Re s > 0, the Euler factor 1 − p^(−s) is nonzero.
  - name: Formalism.ZeroFreeDirichlet.trivialCharZerosOfZeta
    gloss: >-
      Every zero of a principal Dirichlet L-function with Re s > 0 and s ≠ 1 is a zero of the Riemann zeta function.
  - name: Formalism.ZeroFreeDirichlet.conj_apply_of_sq_eq_one
    gloss: If χ² is the principal character, every value of χ is fixed by complex conjugation.
  - name: Formalism.ZeroFreeDirichlet.conj_LFunction_conj_of_sq_eq_one
    gloss: >-
      For a real Dirichlet character χ and Re s > 1, the value at the conjugate of s is the conjugate of L(s,χ).
  - name: Formalism.ZeroFreeDirichlet.realCharConj
    gloss: >-
      For every nonprincipal real Dirichlet character χ, the value at the conjugate of s is the conjugate of L(s,χ)
