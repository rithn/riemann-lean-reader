- module: Formalism.PeriodIntegrals.UnitaryGroupMassFormula.ExplicitFormula.ExplicitFormulaFromGluing
  depth: 14
  lines: 99
  line: >-
    Derives the truncated explicit formula for primitive Dirichlet characters from Perron, contour-shift, and zero-sum
    change bounds.
