- module: Development.AbelianVarietyTheory.Proofs.GlobalInterpolation.NegSumLogDerivNonneg
  depth: 7
  lines: 54
  line: >-
    Proves that for real Dirichlet characters χ and ψ of one modulus, the sum of Re(L′/L) for 1, χ, ψ and χψ is
    nonpositive at real σ > 1.
  reading: >-
    For any Dirichlet character χ and real σ > 1, the Dirichlet series with terms Re(χ(n))Λ(n)/n^σ sums to −Re(L′(σ,
    χ)/L(σ, χ)), where Λ is the von Mangoldt function. When χ² = ψ² = 1, the four character values sum to a nonnegative
    number on units by checking the signs of χ and ψ, and they vanish on nonunits. Adding the four series thus gives
    nonnegative terms because the von Mangoldt weights are nonnegative. OrderNeTop uses the inequality to show that
    for a fixed modulus there is at most one pair of a nonprincipal real character and a real zero in the stated
    region, and any such zero is simple. LFunctionConjEqZero uses χ = ψ in its zero-free region proof.
  key_decls:
  - name: GlobalTheory.TwoRealCharacters.hasSum_re_neg_logDeriv
    gloss: >-
      For a Dirichlet character χ modulo q ≥ 1 and real σ > 1, the series over positive integers n with terms Re(χ(n))Λ(n)/n^σ
      converges to −Re(L′(σ, χ)/L(σ, χ)).
  - name: GlobalTheory.TwoRealCharacters.re_sum_nonneg
    gloss: >-
      For Dirichlet characters χ and ψ modulo q satisfying χ² = ψ² = 1, the sum of the real parts of the principal
      character, χ, ψ, and χψ is nonnegative at every residue class modulo q.
  - name: GlobalTheory.TwoRealCharacters.neg_sum_logDeriv_nonneg
    gloss: >-
      For q ≥ 1, real σ > 1, and Dirichlet characters χ and ψ modulo q satisfying χ² = ψ² = 1, the negative of the
      sum of the real parts of the logarithmic derivatives at σ for the principal character, χ, ψ, and χψ is nonnegative.
