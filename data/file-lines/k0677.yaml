- module: Formalism.LFunctionBounds.Statement
  depth: 14
  lines: 127
  line: >-
    Defines weighted triple sums, odd-character period identities, zero-density bounds, and zeta nonvanishing criteria.
  reading: >-
    Weights on ordered positive triples summing to ℓ define coefficients via coordinate counts and L(0, χ). For
    odd prime ℓ, the period identity expands a sawtooth sum in odd characters and relates weighted log gamma ratios
    corrected by −log ℓ to L′/L at 1. A proposition prescribes zero coefficients on small inversion-stable sets
    of odd characters, and two density bounds count characters with zeros on specified sets. Three criteria assert
    zeta nonvanishing in Re(s) > θ from pointwise, Chebyshev-averaged, or finite-range upper bounds on corrected
    smoothed von Mangoldt sums. PositivityBound uses the triples in its positivity hypothesis and Al in its asymptotic
    estimate.
  key_decls:
  - name: Formalism.FX.PeriodIdentity
    gloss: >-
      For probability weights on triples summing to an odd prime ℓ, the proposition expands the weighted sawtooth
      sum away from multiples of ℓ in conjugates of odd characters, requires the coefficients to sum to one and
      conjugate under inversion, and equates the weighted sum of log gamma ratios corrected by −log ℓ to the Euler–Mascheroni
      constant plus log(2π/ℓ) minus the weighted sum of L′(1, χ⁻¹)/L(1, χ⁻¹).
  - name: Formalism.FX.KillingLemma
    gloss: >-
      For every ε > 0 and all sufficiently large primes ℓ, every inversion-stable set of at most ℓ^(1−ε) odd characters
      admits probability weights on the triples for which all its coefficients cW vanish.
  - name: Formalism.FX.DensityRect
    gloss: >-
      For each 1/2 < θ < 1 there is δ > 0 such that for every T ≥ 1 the number of characters modulo a prime ℓ with
      a zero in Re(s) ≥ θ and |Im(s)| ≤ T is at most Cℓ^(1−δ), with C independent of ℓ.
  - name: Formalism.FX.FixedLW3
    gloss: >-
      For 1/2 ≤ θ < 1, the proposition implies zeta nonvanishing in Re(s) > θ if there are arbitrarily large primes
      ℓ each admitting, for every ε > 0 and all sufficiently large x, a positive natural m ≥ x^(1−θ−ε) giving a
      Chebyshev-averaged upper error bound Cx^(θ+ε) uniform over triples.
  - name: Formalism.FX.Theorem7
    gloss: >-
      For 1/2 ≤ θ < 1, an upper error bound x^(θ+ε) uniform over triples and over ℓ^(1/ε) ≤ x ≤ ℓ^(1300/ε) implies
      zeta nonvanishing in Re(s) > θ if the bound holds at arbitrarily large prime moduli ℓ for each ε > 0.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 3 field edits (key_decls, reading). Before and after text: check-log.tsv.
