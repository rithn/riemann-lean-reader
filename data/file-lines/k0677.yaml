    Dirichlet L-functions.
  reading: >-
    The entire function exLF equals L(s, χ) for nonprincipal χ and extends (s − 1)L(s, χ) to a nonzero value at
    s = 1 for principal χ. Its zeros coincide with those of the original L-function away from s = 1, lie in Re(s)
    < 1, and have finite positive multiplicity, with simple zeros remaining simple. Away from s = 1 and the zeros,
    the negative logarithmic derivative of L(s, χ) equals that of exLF plus the principal-character term 1/(s −
    1). The upper bound on Re(s) ≥ 1/2 uses polynomial growth for nonprincipal characters and the factorization
    into ζ and a finite Euler product for the principal character. The lower bound on Re(s) > 1 follows from a reciprocal
    bound for L(s, χ).
