- module: Formalism.LandauZeroFreeBounds.ExceptionalZeroBounds.Positivity
  depth: 11
  lines: 147
  line: >-
    Proves three nonnegativity inequalities for real parts of negative logarithmic derivatives of Dirichlet L-functions.
  reading: >-
    For Re s > 1, the negative logarithmic derivative is the Dirichlet series with coefficients Λ(n)χ(n), so each
    inequality follows by summing nonnegative real combinations of its terms. The 3–4–1 proof treats n = 0 separately
    and for positive n with unit residue modulo q uses 3 + 4 Re w + Re(w²) = 2(1 + Re w)² with |w| = 1 and w = χ(n)n^(−it).
    The other two inequalities use the fact that a real character takes values ±1 on units, while all the characters
    in each combination vanish on nonunits. The Dirichlet zero-free region proof uses these inequalities for nonreal
    characters and to constrain exceptional zeros of real characters.
  key_decls:
  - name: Formalism.ZeroFreeDirichlet.negLogDeriv_eq_LSeries
    gloss: For Re s > 1, −L′(s,χ)/L(s,χ) equals the Dirichlet series with coefficients Λ(n)χ(n).
  - name: Formalism.ZeroFreeDirichlet.term_three_four_one_nonneg
    gloss: >-
      For each index, the real parts of the von Mangoldt Dirichlet-series terms for the principal character at σ,
      χ at σ + it, and χ² at σ + 2it have a nonnegative weighted sum with weights 3, 4, and 1.
  - name: Formalism.ZeroFreeDirichlet.term_one_add_real_nonneg
    gloss: >-
      At a real argument, the real parts of the corresponding terms for the principal character and a real character
      have a nonnegative sum.
  - name: Formalism.ZeroFreeDirichlet.term_two_real_nonneg
    gloss: >-
      At a real argument, the real parts of the corresponding terms for the principal character, two real characters
      of the same modulus, and their product have a nonnegative sum.
  - name: Formalism.ZeroFreeDirichlet.negLogDerivPositivity
    gloss: >-
      For σ > 1, the 3–4–1 combination and both real-character combinations of the real parts of the negative logarithmic
      derivatives are nonnegative.
