- module: Formalism.StatementOC
  depth: 8
  lines: 73
  line: >-
    Defines corrected von Mangoldt sums and states one-sided bound implications for analytic orders, nonvanishing
    and the Riemann hypothesis.
  reading: >-
    Both sums weight the von Mangoldt function by x/n − 1 up to ⌊x⌋, with a factor Re χ(n) in the twist. The corrections
    add −x log x + (1 + γ)x and x Re(L′(1, χ)/L(1, χ)), respectively, with γ Euler’s constant. For nonprincipal
    real characters and 0 < θ < 1, bounds are imposed for all x ≥ 1, with nonnegative weights of positive total
    in the weighted case. Lower propositions conclude and upper ones assume nonvanishing on (θ, 1) for single or
    positively weighted characters, and both compare orders directly or by weighted mean for Re(s) > θ and s ≠ 1.
    Bounds −Cx^(1/2+ε) for each character and ε > 0 imply the Riemann hypothesis if some member’s L-function is
    nonzero at each s with Re(s) > 1/2.
  key_decls:
  - name: Formalism.OCStep
    gloss: >-
      A lower bound of −Cx^θ on the corrected untwisted sum minus the corrected twist for all x ≥ 1 implies that
      the character L-function is nonzero on (θ, 1) and that its analytic order equals that of ζ at every s with
      Re(s) > θ and s ≠ 1.
  - name: Formalism.OCStepUpper
    gloss: >-
      An upper bound of Cx^θ on the same difference for all x ≥ 1, together with real nonvanishing on (θ, 1), implies
      equality of the analytic orders of ζ and the character L-function at every s with Re(s) > θ and s ≠ 1.
  - name: Formalism.OCAvg
    gloss: >-
      A lower bound of −Cx^θ on a finite weighted sum of the differences for all x ≥ 1, with nonnegative weights
      of positive total, implies real nonvanishing on (θ, 1) for each positively weighted character and identifies
      the finite analytic order of ζ with the weighted mean of the finite analytic orders of the character L-functions
      at every s with Re(s) > θ and s ≠ 1.
  - name: Formalism.OCAvgUpper
    gloss: >-
      With nonnegative weights of positive total, an upper bound of Cx^θ on the finite weighted sum for all x ≥
      1, together with real nonvanishing on (θ, 1) for each positively weighted character, implies finiteness of
      all the analytic orders and the same weighted-mean identity at every s with Re(s) > θ and s ≠ 1.
  - name: Formalism.RiemannHypothesisOfLowerBounds
    gloss: >-
      The Riemann hypothesis is the conclusion of an implication assuming that each corrected difference in a family
      of nonprincipal real-valued characters is bounded below by −Cx^(1/2+ε) for all x ≥ 1 for every ε > 0, and
      that at every s with Re(s) > 1/2 some member’s L-function is nonzero.
  blueprint:
  - merten:def-chebyshev-weighted
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (minor findings): 6 field edits (key_decls, line, reading). Before and after text: check-log.tsv.
- module: Formalism.Statement
  depth: 9
  lines: 50
  line: >-
    Defines a corrected von Mangoldt sum and implications from its lower bounds to half-plane nonvanishing and the
    Riemann hypothesis.
  reading: >-
    G sums Λ(n)(1 + Re χ(n))(x/n − 1) for 1 ≤ n ≤ ⌊x⌋, subtracts x log x and adds x(1 + γ + Re(L′(1, χ)/L(1, χ))),
    where γ is Euler’s constant. The module defines complex-valued quadratic characters modulo 3, 4, and 7. For
    nonprincipal real-valued χ with L(σ, χ) ≠ 0 on (σ₀, 1), both Landau propositions state that lower bounds on
    G for x ≥ 1 imply nonvanishing of ζ(s) and L(s, χ) for Re(s) > σ₀. LandauStep uses exponent σ₀ with 0 < σ₀ <
    1, and LandauStepEps uses σ₀ + ε for each ε > 0 with 0 ≤ σ₀ < 1. RHofG states that lower bounds on G at exponent
    1/2 + ε for each ε > 0, with an ε-dependent constant, imply the Riemann hypothesis and nonvanishing of L(s,
    χ) for Re(s) > 1/2.
  key_decls:
  - name: Formalism.S
    gloss: S(χ, x) is the sum of Λ(n)(1 + Re χ(n))(x/n − 1) over 1 ≤ n ≤ ⌊x⌋.
  - name: Formalism.G
    gloss: G(χ, x) is S(χ, x) − x log x + (1 + γ + Re(L′(1, χ)/L(1, χ)))x, where γ is Euler’s constant.
  - name: Formalism.LandauStep
    gloss: >-
      For a nonprincipal real-valued χ and 0 < σ₀ < 1, nonvanishing of L(σ, χ) on (σ₀, 1) and a lower bound G(χ,
      x) ≥ −Cx^σ₀ for all x ≥ 1 imply that both ζ(s) and L(s, χ) are nonzero throughout Re(s) > σ₀.
  - name: Formalism.LandauStepEps
    gloss: >-
      For a nonprincipal real-valued χ and 0 ≤ σ₀ < 1, the same real nonvanishing hypothesis and lower bounds G(χ,
      x) ≥ −Cε x^(σ₀+ε) for all x ≥ 1, with a constant Cε for each ε > 0, imply nonvanishing of both ζ(s) and L(s,
      χ) throughout Re(s) > σ₀.
  - name: Formalism.RHofG
    gloss: >-
      For a Dirichlet character χ of nonzero modulus, lower bounds G(χ, x) ≥ −Cε x^(1/2+ε) for all x ≥ 1, with a
      constant Cε for each ε > 0, imply the Riemann hypothesis and nonvanishing of L(s, χ) throughout Re(s) > 1/2.
  blueprint: []
