- module: Formalism.LFunctionBounds.PositivityBound
  depth: 13
  lines: 88
  line: >-
    Defines a partial-sum bound for antisymmetric functions with positive sums on prescribed triples and bounds
    for Dirichlet characters.
  reading: >-
    For odd ℓ ≥ 3, the positivity bound assumes φ(ℓ − x) = −φ(x) for 1 ≤ x < ℓ and positive sums on prescribed triples.
    For some 1 ≤ X ≤ (ℓ − 1)/2, X∑φ² is at most K(1 + log ℓ) times the squared initial sum, with absolute K. Gordan
    formulates the alternative of a zero convex combination or a linear functional positive on every vector of a
    nonempty finite family. Other propositions bound fourth moments, Pólya–Vinogradov sums, and truncation errors
    for Re(s) > 0. Special-value propositions state a finite sum for L(0, χ) for nonprincipal χ modulo a prime,
    Lerch’s Hurwitz zeta derivative at zero for 0 < a ≤ 1, and a log-derivative identity at 0 for odd χ modulo a
    prime and at 1 for χ⁻¹.
  key_decls:
  - name: Formalism.FX.PositivityBound
    gloss: >-
      There is an absolute K > 0 such that every φ satisfying the antisymmetry and triple-positivity hypotheses
      at odd ℓ ≥ 3 admits 1 ≤ X ≤ (ℓ − 1)/2 with X∑_{1≤x<ℓ} φ(x)² ≤ K(1 + log ℓ)(∑_{1≤x≤X} φ(x))².
  - name: Formalism.FX.Gordan
    gloss: >-
      For any nonempty finite family of real vectors, either zero belongs to its convex hull or a linear functional
      is strictly positive on every vector in the family.
  - name: Formalism.FX.M4
    gloss: >-
      For every ε > 0 there is a constant Cε such that, for every prime ℓ and 0 ≤ X ≤ ℓ, the sum of |∑_{1≤n≤X} χ(n)|⁴
      over nonprincipal characters modulo ℓ is at most Cε ℓ^(1+ε) X².
  - name: Formalism.FX.PolyaVinogradov
    gloss: >-
      For every nonprincipal character modulo a prime ℓ, the modulus of its sum over any interval of nonnegative
      integers is bounded by an absolute constant times √ℓ(1 + log ℓ).
  - name: Formalism.FX.LPartialSum
    gloss: >-
      For a nonprincipal character whose initial sums are bounded in modulus by B, truncating the Dirichlet series
      for L(s, χ) after N ≥ 1 terms gives an error of modulus at most 2B(1 + |s|/Re(s))N^(−Re(s)) for Re(s) > 0.
