  line: Bounds the logarithmic derivative of a zero-free holomorphic function on a smaller concentric disc.
  reading: >-
    The proof takes a holomorphic logarithm of g/g(s₀), normalized to vanish at the center, and converts the growth
    bound for g into an upper bound M for the real part of that logarithm. Borel–Carathéodory on the open disc of
    radius R bounds the logarithm uniformly on the closed disc of radius (r + R)/2, and Cauchy’s derivative estimate
    then applies on a disc of radius (R − r)/2 about each evaluation point. The direct importer LocalAbstract applies
    this bound to the zero-free function obtained by replacing the local zero factors with reflected factors.
  key_decls:
  - name: PI.EF.Loc.logDeriv_bound_of_zero_free
    gloss: >-
      Under the holomorphic logarithm hypothesis, if g is holomorphic and zero-free on |z − s₀| < R and satisfies
      |g(z)| ≤ exp(M)|g(s₀)| there for M > 0, then |g′(z)/g(z)| ≤ 4M(r + R)/(R − r)² throughout |z − s₀| ≤ r for
      every 0 < r < R.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review sample-01 (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Formalism.PeriodIntegrals.UnitaryGroupMassFormula.ExplicitFormula.NormLogDerivReflLe
  depth: 15
  lines: 105
  line: >-
    Establishes the boundary modulus and logarithmic derivative estimates for the reflected linear factors used
    in the local zero expansion.
  reading: >-
    A reflected factor has the same modulus as z − ρ on the outer circle, takes the value R at the center, and has
    a positive lower bound throughout the closed disc when ρ lies in a smaller concentric disc. Its constant derivative
    and this lower bound give the logarithmic derivative estimate. The direct importer LocalAbstract uses these
    estimates to control the reflected product and uses the factorization lemmas to identify the coefficients in
    the local zero sum with the actual orders of vanishing.
  key_decls:
  - name: PI.EF.Loc.norm_refl_sphere
    gloss: >-
      On the circle of radius R > 0 centered at s₀, the reflected factor associated with ρ has modulus |z − ρ|.
  - name: PI.EF.Loc.le_norm_refl
    gloss: If |ρ − s₀| ≤ R′ and |z − s₀| ≤ R with R > 0, the reflected factor at z has modulus at least R − R′.
  - name: PI.EF.Loc.norm_logDeriv_refl_le
    gloss: >-
      For ρ in the closed concentric disc of radius R′ < R, the reflected factor has logarithmic derivative of modulus
      at most R′/[R(R − R′)] throughout the closed disc of radius R.
  - name: PI.EF.Loc.logDeriv_prod_pow_mul
    gloss: >-
      At a point where all factors are differentiable and nonzero, the logarithmic derivative of h multiplied by
      a finite product of powers equals h′/h plus the sum of the factors’ logarithmic derivatives weighted by their
      exponents.
  - name: PI.EF.Loc.order_eq_of_factor
    gloss: >-
      In a local factorization into powers of distinct linear factors and a holomorphic factor nonzero at ρ, the
      exponent of z − ρ equals the order of vanishing at ρ.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.PeriodIntegrals.UnitaryGroupMassFormula.ExplicitFormula.PerronKernelA
  depth: 15
  lines: 267
  line: Proves sign-dependent bounds for the truncated vertical integral of the Perron kernel exp(ℓs)/s.
  reading: >-
    For ℓ < 0, the proof closes the rectangle to the right, where the kernel is holomorphic, and for ℓ > 0 it closes
    to the left, enclosing the pole at zero. The second contour integral is evaluated by splitting off 1/s and integrating
    it with logarithm branches along the edges. In both cases, the distant vertical edge can be made arbitrarily
    small, and the two horizontal edges give the error bound. The direct importer PerronKernelB uses these estimates
    to bound the difference between the normalized kernel and the step function at 1.
  key_decls:
  - name: PI.EF.PK.horiz_bound
    gloss: >-
      For a ≤ b, ℓ ≠ 0, and h ≠ 0, the horizontal integral of exp(ℓs)/s from a + ih to b + ih has modulus at most
      (exp(ℓb) − exp(ℓa))/(ℓ|h|).
  - name: PI.EF.PK.vert_bound
    gloss: >-
      For x ≠ 0 and T ≥ 0, the integral of exp(ℓ(x + it))/(x + it) over −T ≤ t ≤ T has modulus at most 2T exp(ℓx)/|x|.
  - name: PI.EF.PK.rectInt_ker
    gloss: >-
      The positively oriented integral of exp(ℓs)/s around a rectangle containing zero in its interior equals 2πi.
  - name: PI.EF.PK.line_bound_neg
    gloss: >-
      For ℓ < 0 and c, T > 0, the integral of exp(ℓ(c + it))/(c + it) over −T ≤ t ≤ T has modulus at most 2 exp(ℓc)/(|ℓ|T).
  - name: PI.EF.PK.line_bound_pos
    gloss: >-
      For ℓ > 0 and c, T > 0, the same vertical integral with respect to t differs from 2π by at most 2 exp(ℓc)/(ℓT).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.PeriodIntegrals.UnitaryGroupMassFormula.ExplicitFormula.PerronSum
  depth: 15
  lines: 137
  line: >-
    Proves power-sum and kernel-weight estimates for bounding the weighted truncation error in Perron inversion.
  reading: >-
    The proof bounds partial sums of n⁻¹⁻ᵋ by the integral of a decreasing power and then uses log n ≤ nᵋ/ε to bound
    the log-weighted sums. For T > 0 and 0 < d ≤ |log(u/x)|, the Perron error weight is at most 2/(Td), with d =
    log 2 available for positive u and x with x ≤ u/2 or x ≥ 2u. The direct importer PerronSumBound uses these estimates
    and the identity uᶜ = eu for the Perron line to bound the von Mangoldt weighted error sum.
  key_decls:
  - name: PI.EF.sum_rpow_le
    gloss: For ε > 0, every initial partial sum of n⁻¹⁻ᵋ starting at n = 2 is at most 1/ε.
  - name: PI.EF.sum_logTerm_le
    gloss: For ε > 0, every initial partial sum of (log n)n⁻¹⁻²ᵋ over positive integers is at most 1/ε².
  - name: PI.EF.kb_le_of_le
    gloss: If T > 0 and 0 < d ≤ |log y|, the Perron error weight kb(T, y) is at most 2/(Td).
  - name: PI.EF.abs_log_div_ge_far
    gloss: For positive u and x, either x ≤ u/2 or x ≥ 2u implies |log(u/x)| ≥ log 2.
  - name: PI.EF.rpow_cLine
    gloss: For u ≥ 2 and c = 1 + 1/log u, the identity uᶜ = eu holds.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Formalism.PeriodIntegrals.UnitaryGroupMassFormula.ExplicitFormula.RectIntEqZeroOfDifferentiableOn
  depth: 15
  lines: 404
  line: >-
    Proves rectangular Cauchy integral formulas for simple and double poles and derives the Perron-weighted residue
    identity.
  reading: >-
    The proof integrates 1/(s − p) along the four edges using branches of the logarithm and uses a primitive to
    show that the integral of 1/(s − p)² vanishes. Subtracting the numerator’s value at p gives the simple-pole
    Cauchy formula, and applying it to the divided difference gives the derivative formula. Partial fractions and
    linearity then yield a residue identity for an arbitrary holomorphic weight E, which specializes to the Perron
    kernel by taking E(s) = uˢ. The direct importer RectProofs supplies the Cauchy formula and the Perron specialization
    in the form used by the explicit-formula argument.
  key_decls:
  - name: PI.EF.Rect.rectInt_inv_sub
    gloss: >-
      For p strictly inside the rectangle, the positively oriented boundary integral of 1/(s − p) equals 2πi.
  - name: PI.EF.Rect.rectInt_div_sub
    gloss: >-
      For h complex differentiable on the closed rectangle and p strictly inside it, the boundary integral of h(s)/(s
      − p) equals 2πi h(p).
  - name: PI.EF.Rect.rectInt_div_sub_sq
    gloss: Under the same hypotheses, the boundary integral of h(s)/(s − p)² equals 2πi h′(p).
  - name: PI.EF.Rect.rect_residue_gen
    gloss: >-
      For H and E complex differentiable on a closed rectangle containing 0 and the finite set of nonzero points
      ρ in its interior, the boundary integral of [H(s) + ∑ρ w(ρ)/(s − ρ) + e/s]E(s)/s equals 2πi · (H(0)E(0) +
      ∑ρ w(ρ)(E(ρ) − E(0))/ρ + eE′(0)).
  - name: PI.EF.Rect.rect_residue
    gloss: >-
      For u > 0, the same boundary integral with E(s) = uˢ equals 2πi · (H(0) + ∑ρ w(ρ)(u^ρ − 1)/ρ + e log u).
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (minor findings): 2 field edits (key_decls). Before and after text: check-log.tsv.
- module: Formalism.StatementFL
  depth: 15
  lines: 44
  line: >-
    Defines corrected character sums and states pointwise and Chebyshev-averaged zeta nonvanishing criteria from
    one-sided bounds.
  reading: >-
    Each character sum weights Λ(n)χ(n) by x/n − 1 up to ⌊x⌋ and adds xL′(1, χ)/L(1, χ). The family remainder subtracts
    the real part of a complex linear combination of these corrected sums from the corrected untwisted sum Gz(x).
    Both criteria assume nonprincipal characters, a linear combination that is real for x ≥ 1, and nonvanishing
    on the real interval (θ, 1) for every character with a nonzero coefficient. Given the corresponding one-sided
    bound, each criterion concludes that ζ(ρ) is nonzero at every ρ ≠ 1 with Re(ρ) > θ where all characters with
    nonzero coefficients have nonvanishing L-functions.
  key_decls:
  - name: Formalism.SchiC
    gloss: SchiC is the sum of Λ(n)χ(n)(x/n − 1) over 1 ≤ n ≤ ⌊x⌋.
  - name: Formalism.GchiC
    gloss: GchiC adds xL′(1, χ)/L(1, χ) to the complex character sum SchiC.
  - name: Formalism.famComb
    gloss: >-
      The family remainder is Gz(x) − Re(∑ᵢ cᵢ GchiC(χᵢ, x)) for a finite family of characters and complex coefficients.
  - name: Formalism.FamilyLandauC
    gloss: >-
      For 0 < θ < 1, an eventual bound of Cx^θ on the family remainder multiplied by a fixed sign ±1 gives the zeta
      nonvanishing conclusion under the shared hypotheses.
  - name: Formalism.FamilyLandauCW3
    gloss: >-
      For 0 ≤ θ < 1, the averaged criterion gives the same conclusion under the shared hypotheses if, for every
      ε > 0 and all sufficiently large x, some positive integer m ≥ x^(1−θ−ε) gives a Chebyshev-weighted average
      whose product with a fixed sign ±1 is at most Cε x^(θ+ε).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.PeriodIntegrals.UnitaryGroupMassFormula.ExplicitFormula.RectInv
  depth: 16
  lines: 29
  line: Evaluates the integral of 1/(s − w) along a vertical segment strictly to the right of w.
  reading: >-
    On that segment, s − w stays in the open right half-plane, where the principal logarithm is a primitive of 1/(s
    − w). The fundamental theorem of calculus gives the endpoint difference for either orientation of the segment.
  key_decls:
  - name: PI.EF.PK.vert_inv_right
    gloss: >-
      If Re(w) < b, the contour integral of 1/(s − w) from b + ic to b + id along the vertical segment equals log(b
      + id − w) − log(b + ic − w), with the principal logarithm at both endpoints.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.ZetaNonvanishingChebyshevWeights
  depth: 16
  lines: 36
  line: >-
    Defines discrete and continuous Chebyshev averages of the corrected von Mangoldt sum and states one-sided zeta
    nonvanishing criteria.
  reading: >-
    For x > 0 the discrete average is (1/m) ∑ⱼ aⱼ Gz(x/aⱼ), with aⱼ = sin²((2j + 1)π/(4m)), and the continuous average
    integrates sin²(φ/2) Gz(x/sin²(φ/2)) against dφ/π on [0, π]. The approximation proposition asserts an absolute
    error bound of Kx(1 + log m)/m. The continuous criteria formulate nonvanishing in Re(s) > θ from an eventual
    one-sided bound at exponent θ or at every exponent θ + ε with ε > 0. The discrete criterion allows the number
    of nodes to depend on x and ε, with m ≥ x^(1−θ−ε). StatementFL uses the discrete average in a zeta nonvanishing
    criterion for a finite family of Dirichlet characters, assuming nonvanishing of the L-functions with nonzero
    coefficients.
  key_decls:
  - name: Formalism.chebyshevWeightedAverage
    gloss: Defines the sum ∑ⱼ (1/m) · (x/(x/aⱼ)) · f(x/aⱼ) for j = 0, …, m − 1, with aⱼ = sin²((2j + 1)π/(4m)).
  - name: Formalism.Gcheb
    gloss: The continuous average is the integral of sin²(φ/2) Gz(x/sin²(φ/2)) over 0 ≤ φ ≤ π, divided by π.
  - name: Formalism.ChebyshevWeightApproximation
    gloss: >-
      Asserts the existence of a uniform K such that for every integer m ≥ 1 and real x ≥ 1 the discrete average
      of Gz differs from Gcheb(x) by at most Kx(1 + log m)/m.
  - name: Formalism.ZetaLandauChebEps
    gloss: >-
      For 0 ≤ θ < 1, eventual upper bounds Cε x^(θ+ε) on the continuous average multiplied by a fixed sign ±1, for
      every ε > 0, imply ζ(s) ≠ 0 throughout Re(s) > θ.
  - name: Formalism.ZetaNonvanishingChebyshevWeights
    gloss: >-
      For 0 ≤ θ < 1, if for each ε > 0 and all sufficiently large x some integer m ≥ 1 with m ≥ x^(1−θ−ε) gives
      a discrete average of Gz whose product with a fixed sign ±1 is at most Cε x^(θ+ε), then ζ(s) ≠ 0 throughout
      Re(s) > θ.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-02 (material findings): 3 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Formalism.ZetaNonvanishingGeneralWeights
  depth: 17
  lines: 26
  line: >-
    Defines a grid average and states zeta nonvanishing criteria from one-sided bounds on weighted averages of the
    corrected von Mangoldt sum.
  reading: >-
    The general criterion allows finitely many sampling points in [x/2, x] with probability weights ωⱼ and |xⱼ/x
    − 1| ≤ x^(θ−1+ε). The spread criterion uses xⱼ = x/(1 + j/m) and ωⱼ = 1/m for j = 1, …, m, with m a positive
    integer ≥ x^(1−θ−ε). For 0 ≤ θ < 1, both define propositions asserting nonvanishing of ζ on Re(s) > θ if, for
    a fixed sign s₀ = ±1, every ε > 0 admits Cε so that for all sufficiently large x the samples and weights can
    be chosen to satisfy s₀ Σⱼ ωⱼ(x/xⱼ)Gz(xⱼ) ≤ Cε x^(θ+ε).
  key_decls:
  - name: Formalism.spreadWeightedAverage
    gloss: The spread average of f at scale x is Σⱼ (1/m)(x/xⱼ)f(xⱼ), where xⱼ = x/(1 + j/m) for j = 1, …, m.
  - name: Formalism.ZetaNonvanishingGeneralWeights
    gloss: >-
      Defines the proposition that for 0 ≤ θ < 1 and a fixed sign s₀ = ±1, ζ(s) is nonzero throughout Re(s) > θ
      if for each ε > 0 there is a Cε such that for all sufficiently large x, sampling points xⱼ in [x/2, x] with
      |xⱼ/x − 1| ≤ x^(θ−1+ε) and probability weights ωⱼ can be chosen with s₀ Σⱼ ωⱼ(x/xⱼ)Gz(xⱼ) ≤ Cε x^(θ+ε).
  - name: Formalism.ZetaNonvanishingSpreadWeights
    gloss: >-
      Defines the proposition that for 0 ≤ θ < 1 and a fixed sign s₀ = ±1, ζ(s) is nonzero throughout Re(s) > θ
      if for each ε > 0 there is a Cε such that for all sufficiently large x, some positive integer m ≥ x^(1−θ−ε)
      can be chosen with s₀ Σⱼ (1/m)(x/xⱼ)Gz(xⱼ) ≤ Cε x^(θ+ε), where xⱼ = x/(1 + j/m) for j = 1, …, m.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 4 field edits (key_decls, reading). Before and after text: check-log.tsv.
