- module: Formalism.FockGram.FockGramProofs.CovolGram
  depth: 10
  lines: 34
  line: >-
    Proves that the covolume of the lattice generated by a real basis is the square root of its Gram determinant.
  reading: >-
    In orthonormal coordinates, the volume of the basis parallelepiped is the absolute determinant of the coordinate
    matrix A. The Gram matrix is AᵀA, whose determinant is the square of det A. The Hermitian-lattice genus proofs
    use the formula to express covolumes through Gram determinants and turn determinant bounds into covolume bounds.
  key_decls:
  - name: Formalism.E.covolumeEqSqrtDetGram
    gloss: >-
      For any basis of a finite-dimensional real inner product space, the covolume of its integer span equals the
      square root of the determinant of its Gram matrix.
