- module: Formalism.HermitianLattices.HermitianLatticesProofs.GenusCovolBound
  depth: 10
  lines: 334
  line: Proves a uniform upper bound on the Euclidean trace covolumes of lattices in a Hermitian genus.
  reading: >-
    Hermitian duals of lattices in one genus lie in one genus, so a single positive integer d clears their Hermitian
    pairings. The field discriminant Δ sends each trace dual into the corresponding Hermitian dual, so D = dΔ² clears
    the trace pairings on every trace dual. The scaled inverse Gram matrix then has positive integer determinant,
    giving the covolume bound D^(N/2) in Euclidean dimension N. The class-set finiteness proof uses this uniform
    bound.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.genusCovolBound_covol_le
    gloss: >-
      A full Euclidean trace lattice in dimension N has covolume at most D^(N/2) if multiplying the trace form by
      the positive integer D makes all pairings on its trace dual integral.
  - name: Formalism.HermitianLatticesTheory.genusCovolBound_dualAt_gmap
    gloss: Taking the local Hermitian dual at an ideal commutes with the action of a Hermitian isometry.
  - name: Formalism.HermitianLatticesTheory.genusCovolBound_dual_genus
    gloss: >-
      For a nondegenerate Hermitian form whose involution preserves the ring of integers, the duals of two lattices
      in the same genus belong to the same genus.
  - name: Formalism.HermitianLatticesTheory.genusCovolBound_discr
    gloss: >-
      Multiplication by the field discriminant sends the trace dual of the ring of integers into the ring of integers.
  - name: Formalism.HermitianLatticesTheory.genusCovolBound
    gloss: >-
      For a positive-definite trace form realized in Euclidean space, one upper bound applies to the covolumes of
      all full Euclidean lattice images in a given Hermitian genus.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
