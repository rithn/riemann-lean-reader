- module: Formalism.HermitianLattices.HermitianLatticesProofs.FinIntermediate
  depth: 10
  lines: 31
  line: >-
    Proves that a finite-index subgroup of an abelian group has only finitely many intermediate subgroups.
  reading: >-
    For additive subgroups P ≤ Q with Q/P finite, the quotient map sends each intermediate subgroup to a subgroup
    of Q/P and recovers it by taking the inverse image. This injects the intermediate subgroups into the finite
    set of subgroups of Q/P. The theorem supplies the intermediate-subgroup finiteness step in the proof that a
    Hermitian lattice genus has finitely many isometry classes.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.finIntermediate
    gloss: >-
      If P ≤ Q are subgroups of an abelian group and Q/P is finite, there are only finitely many subgroups M with
      P ≤ M ≤ Q.
