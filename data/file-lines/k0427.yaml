  depth: 11
  lines: 43
  line: >-
    Proves that every vector in the ambient space of a number-field lattice has a nonzero integer multiple in the
    lattice.
  reading: >-
    The proof uses induction on the span of the lattice over the number field. For sums it multiplies the two integer
    factors, and for scalar multiples it uses the fact that each field element has a nonzero integer multiple in
    the ring of integers. TraceReal uses the theorem to show that the lattice image and the ambient vector space
    image have the same real span.
  key_decls:
