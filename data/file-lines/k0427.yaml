- module: Formalism.HermitianLattices.HermitianLatticesProofs.MajLattice
  depth: 10
  lines: 203
  line: >-
    Proves that the archimedean majorant realization of a lattice over a totally complex field is a full Euclidean
    lattice.
  reading: >-
    At each complex place the realization applies the inverse X(v)⁻¹ of the invertible coordinate matrix at place
    v and separates real and imaginary parts, giving a real linear isomorphism from the product of Minkowski spaces.
    Integral-basis multiples of the chosen field-basis vectors give a real basis after realization. A common integer
    denominator puts the scaled lattice image inside the integer span of this basis, proving discreteness, while
    nonzero multiples of the basis vectors in the image prove full real span. The majorant duality theorem uses
    both properties.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.majLattice_T_injective
    gloss: >-
      The real coordinate map from the product of Minkowski spaces is injective when every archimedean coordinate
      matrix is invertible.
  - name: Formalism.HermitianLatticesTheory.majLattice_B_apply
    gloss: >-
      Each vector of the constructed real basis is the realization of a chosen K-basis vector multiplied by an element
      of the integral basis of K.
  - name: Formalism.HermitianLatticesTheory.majLattice_exists_d
    gloss: >-
      For a finitely generated module over the ring of integers, one nonzero integer clears all denominators in
      its coordinates relative to a fixed K-basis.
  - name: Formalism.HermitianLatticesTheory.majLattice_exists_c
    gloss: >-
      If a module spans the ambient K-vector space, every ambient vector has a nonzero integer multiple in the module.
  - name: Formalism.HermitianLatticesTheory.majLattice
    gloss: >-
      Over a totally complex number field, invertible coordinate matrices at every infinite place give a lattice
      image that is discrete and spans the full Euclidean space over ℝ.
  blueprint: []
