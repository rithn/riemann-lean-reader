- module: Formalism.FockGram.StatementHerm
  depth: 10
  lines: 38
  line: >-
    Defines the sesquilinear dual and states Gram determinant formulas for the dual index and the trace pairing.
  reading: >-
    The dual consists of vectors whose pairings with the original submodule in the first argument lie in the coefficient
    ring’s image. If the coefficient ring embeds in K with involution-stable image, a basis span lies in its dual
    exactly when the Gram entries are integral. Under the same hypotheses, over a ring finite free over ℤ, a nonzero
    integral Gram determinant gives dual index equal to its absolute norm and self-duality exactly when it is a
    unit. In the product basis from the S-basis and the ℤ-basis of S, the trace Gram determinant is the original
    determinant’s norm times the rank-th power of the involutive trace-pairing determinant in that ℤ-basis. Lattice
    duality uses this dual.
  key_decls:
  - name: Formalism.E.hdual
    gloss: >-
      Defines the dual as the intersection, over vectors y in the submodule, of the inverse images of the coefficient
      ring’s image under x ↦ B(y,x).
  - name: Formalism.E.HermDual
    gloss: >-
      States the Gram-entry criterion for containment in the dual over an involution-stable subring, together with
      the norm formula for the index and the unit criterion for self-duality when the subring is finite free over
      ℤ and the integral Gram determinant is nonzero.
  - name: Formalism.E.HermTraceGram
    gloss: >-
      States that the Gram determinant of the traced form in the product basis is the norm of the original Gram
      determinant times the rank-th power of the determinant of the pairing (a,b) ↦ Tr(star(a) · b) on the coefficient
      ring.
