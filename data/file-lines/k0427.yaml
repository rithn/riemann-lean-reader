  reading: >-
    If the displacement operator g − 𝟙 satisfies a common nonnegative bound δ in the local coordinate seminorm at
    every infinite place, then the Euclidean norm of the realized displacement of any vector y is at most δ times
    the norm of its realization. The proof expresses the local displacement by matrix multiplication and identifies
    the squared realization norm with the sum of squared complex coordinate norms over the infinite places. Squaring
    and summing the local inequalities gives the global estimate.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.opBound
    gloss: >-
      A common nonnegative displacement bound at all infinite places gives the same bound in the Euclidean realization.
  - name: Formalism.HermitianLatticesTheory.opBound_normSq
    gloss: >-
      The squared norm of the Euclidean realization equals the sum of squared complex coordinate norms over the
      infinite places.
  - name: Formalism.HermitianLatticesTheory.opBound_fcoord
    gloss: >-
      The transformed coordinates of g(y) − y at v come from applying the embedded matrix of g minus the identity
      to the embedded coordinates of y, then applying X(v)⁻¹, taken to be zero for singular X(v).
  - name: Formalism.HermitianLatticesTheory.opBound_vecAt_map
    gloss: >-
      The embedded coordinates of g(y) are obtained by multiplying the embedded matrix of g by the embedded coordinates
      of y.
  - name: Formalism.HermitianLatticesTheory.opBound_cnorm_sq
    gloss: >-
      The squared Euclidean norm of a complex coordinate vector equals the sum of the squared absolute values of
      its entries.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 1 field edit (key_decls). Before and after text: check-log.tsv.
- module: Formalism.HermitianLattices.HermitianLatticesProofs.ThetaBasic
  depth: 10
  lines: 90
  line: >-
    Proves the translation, sign, and isometry symmetries of Hermitian lattice theta sums and the phase law under
    τ ↦ τ + 1.
  reading: >-
    Reindexing shows that the scalar theta sum depends only on the shift modulo the lattice and is even in that
    shift. Simultaneously transporting the lattice and shifts by a Hermitian isometry preserves both scalar and
    higher-degree sums, and degree one recovers the scalar sum. If diagonal lattice traces are even integers and
    the shift pairs with the lattice in integral trace, then τ ↦ τ + 1 multiplies the scalar sum by exp(πi Tr(h(γ,γ))),
    where γ is the shift. This follows by expanding the traced Hermitian norm and using invariance of the field
    trace under the involution.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.thetaBasic
    gloss: >-
      Establishes the shift symmetries, isometry invariance, scalar phase law, and reduction from degree one to
      the scalar theta sum.
  - name: Formalism.HermitianLatticesTheory.thetaBasic_trace_star
    gloss: The field trace to ℚ is invariant under the field involution.
  - name: Formalism.HermitianLatticesTheory.thetaBasic_eqv
    gloss: A linear automorphism of the ambient space induces a bijection from the lattice onto its image.
  - name: Formalism.HermitianLatticesTheory.thetaBasic_eqv_apply
    gloss: On each lattice vector, the induced bijection agrees with the ambient automorphism.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.HermitianLattices.HermitianLatticesProofs.ThetaSummable
  depth: 10
  lines: 388
  line: >-
    Proves absolute convergence of shifted Hermitian lattice theta series on the upper half-plane for positive-definite
    trace forms.
  reading: >-
    In a ℤ-basis, the trace quadratic form is bounded below by a positive multiple of the squared coordinate norm.
    Clearing denominators gives positivity on rational vectors, and the real symmetrization is positive definite
    by density and nonsingularity, yielding the bound by compactness. The parallelogram identity controls the shift,
    so the absolute values are dominated by a constant times a product of summable one-dimensional Gaussians. AutFinite
    uses convergence to prove finiteness of bounded trace sublevel sets, and TraceReal uses the coordinate bound
    to obtain a positive lower bound on nonzero lattice vectors.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.thetaSummable_main
    gloss: >-
      For a positive-definite trace form, the theta series converges absolutely for every shift and every parameter
      with positive imaginary part.
  - name: Formalism.HermitianLatticesTheory.thetaSummable_shift
    gloss: >-
      The shifted trace quadratic value is at least half the unshifted value minus the trace quadratic value of
      the shift.
  - name: Formalism.HermitianLatticesTheory.thetaSummable_coercive_rat
    gloss: >-
      A positive-definite rational quadratic form bounds a positive multiple of the sum of squared coordinates on
      rational vectors.
  - name: Formalism.HermitianLatticesTheory.thetaSummable_gauss
    gloss: For every δ > 0, the Gaussian exp(−δn²) is summable over the integers.
  - name: Formalism.HermitianLatticesTheory.thetaSummable_pi
    gloss: >-
      The product of a nonnegative summable sequence evaluated in finitely many coordinates is summable over the
      corresponding integer tuples.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.HermitianLattices.HermitianLatticesProofs.TraceReal
  depth: 10
  lines: 253
  line: >-
    Realizes positive-definite Hermitian trace forms as Euclidean inner products and sends lattices to full Euclidean
    lattices.
  reading: >-
    The realization rescales an orthogonal ℚ-basis by the square roots of its diagonal trace values, and multiplication
    by each field element is bounded in the resulting norm. A uniform positive lower bound on the trace values of
    nonzero lattice vectors gives discreteness, while taking nonzero integer multiples into the lattice gives full
    real span. ClassSetFinite uses the realization in the proof of finiteness of the isometry classes in a genus.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.traceReal
    gloss: >-
      A Hermitian form with positive-definite trace on a finite-dimensional vector space over a number field with
      involution admits an additive Euclidean realization preserving the trace pairing, bounding field multiplication,
      and taking every lattice to a full Euclidean lattice.
  - name: Formalism.HermitianLatticesTheory.traceReal_main
    gloss: >-
      Establishes existence of an additive Euclidean realization, using the rational dimension of the ambient space
      for the construction in the proof.
  - name: Formalism.HermitianLatticesTheory.traceReal_lower
    gloss: >-
      If the trace quadratic form is positive on every nonzero ambient vector, then each full lattice has a uniform
      positive lower bound on its nonzero trace self-pairings.
  - name: Formalism.HermitianLatticesTheory.traceReal_mult
    gloss: Every ambient vector has a nonzero integer multiple in any full lattice.
  - name: Formalism.HermitianLatticesTheory.traceReal_star
    gloss: The field trace to ℚ is invariant under the field involution.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 3 field edits (key_decls). Before and after text: check-log.tsv.
- module: Formalism.HermitianLattices.StatementTheta
  depth: 10
  lines: 83
  line: >-
    Defines shifted theta series and states Hermitian symmetries, scalar Hermitian summability, Euclidean inversion,
    and finite Weil relations.
  reading: >-
    Hermitian terms use rational trace pairings and Euclidean terms use squared norms. The scalar series is periodic
    modulo the lattice and even in the shift, with a τ ↦ τ + 1 phase for even trace lattices and trace-dual shifts.
    Both Hermitian series respect joint isometric transport of lattice and shifts. In the upper half-plane, scalar
    summability assumes a lattice in finite dimension with positive-definite trace form, and Euclidean inversion
    for discrete full lattices in finite-dimensional real inner-product spaces uses a phase-weighted dual sum. The
    finite Weil relations use normalized Fourier and diagonal phase operators, and the theta lift uses the scalar
    series at zero shift.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.thetaL
    gloss: >-
      Sums the exponentials of πiτ times the rational trace of the Hermitian self-pairing over a shifted lattice.
  - name: Formalism.HermitianLatticesTheory.thetaN
    gloss: >-
      Sums over lattice n-tuples using the matrix trace of the product of the shifted tuple’s trace Gram matrix
      and the complex parameter matrix in the exponent.
  - name: Formalism.HermitianLatticesTheory.WeilFinite
    gloss: >-
      For a nondegenerate unitary quadratic phase on a finite abelian group, states that S preserves the squared
      ℓ² norm, S² acts by negation, and (ST)³ acts by negation times the normalized Gauss sum.
  - name: Formalism.HermitianLatticesTheory.ThetaSummable
    gloss: >-
      States summability for every shift and upper-half-plane parameter for a lattice in a finite-dimensional Hermitian
      space with positive-definite trace pairing.
  - name: Formalism.HermitianLatticesTheory.ThetaSEuclid
    gloss: >-
      For a discrete full lattice in a finite-dimensional real inner-product space and Im τ > 0, states that the
      shifted theta series at −1/τ is a phase-weighted dual-lattice sum times (−iτ)^(dim/2) divided by the covolume.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 4 field edits (key_decls, line, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.IntegralCasts.CapelliIdentities.CommonMajorizingLattice
  depth: 11
  lines: 8
  line: Proves that a single nonzero integer clears denominators for any finite subset of a number field.
  reading: >-
    The proof applies the integral-multiples theorem over ℤ ⊂ ℚ and identifies integer scalar multiplication with
    multiplication in the number field. In MajLattice, the theorem is applied to all basis coordinates of a finite
    generating set, yielding a single multiplier that makes the coordinates of every element of the generated module
    integral.
  key_decls:
  - name: UpperTheory.Reformulated.B.CommonMajorizingLattice.majLattice_common
    gloss: >-
      For any finite subset S of a number field K, there is a nonzero integer d such that da belongs to the ring
      of integers of K for every a in S.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.AlphaUniqueness.Statement
  depth: 11
  lines: 97
  line: >-
    Defines unitary quadratic functions and states Gauss sum, determinant phase, and invariant quadratic refinement
    identities.
  reading: >-
    For unitary quadratic functions on finite abelian groups, nondegeneracy is characterized by the squared Gauss
    sum modulus. For a nondegenerate Q preserved by an endomorphism whose first ℓ powers sum to zero, the Gauss
    sum squares to the group order if ℓ is prime and 1 mod 4 and the other primary subgroups have square order.
    A normalized Gauss sum enters a phase identity for products of unitary determinants. An orbit-pair sum modulo
    2 gives the candidate invariant refinement of an alternating pairing, with statements of existence, uniqueness,
    and invariance under commuting pairing-preserving endomorphisms. The discriminant-form and theta modules use
    the unitary quadratic definitions.
  key_decls:
  - name: Formalism.K.GaussAbs
    gloss: >-
      States that a unitary quadratic function on a finite abelian group is nondegenerate exactly when the squared
      modulus of its Gauss sum equals the group order.
  - name: Formalism.K.QuadraticGaussSumSign
    gloss: >-
      States that the Gauss sum of a nondegenerate unitary quadratic function squares to the group order when an
      endomorphism preserves the function, its first ℓ powers sum to zero for a prime ℓ congruent to 1 modulo 4,
      and every other primary subgroup has square order.
  - name: Formalism.K.SquareClassUnitaryProduct
    gloss: >-
      Under the Gauss sum sign hypotheses, states that for an even family of unitary matrices γ with nonzero det(𝟙
      − γ⁻¹), the normalized Gauss sum times the inverse phase of the product of these determinants squares to the
      product of det γ.
  - name: Formalism.K.AlphaRefine
    gloss: >-
      States that summing the alternating modulo-2 pairing over pairs of iterates with indices 0 ≤ i < j < ℓ gives
      an invariant quadratic refinement when ℓ is odd and the first ℓ powers of the pairing-preserving endomorphism
      sum to zero.
  - name: Formalism.K.AlphaUnique
    gloss: >-
      States that under the same odd-length vanishing-sum hypotheses, every invariant quadratic refinement of the
      pairing equals the orbit-pair sum.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Formalism.HermitianLattices.GenusCovolBound
  depth: 11
  lines: 38
  line: >-
    Defines the trace-dual submodule and states a genus-wide covolume bound and finiteness of lattice automorphisms.
  reading: >-
    The trace-dual submodule is the span over the ring of integers of vectors that pair integrally with the given
    submodule under the rational trace. For a positive-definite Hermitian trace pairing, the statements give a uniform
    covolume bound within a fixed genus in a common Euclidean realization and finiteness of each lattice’s Hermitian
    isometry stabilizer. The class finiteness argument assumes the covolume bound, and the Hermitian theta inversion
    formula sums over the trace-dual submodule.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.tdualSub
    gloss: >-
      Takes the span over the ring of integers of all vectors whose sesquilinear pairing with every vector of the
      given submodule in the first argument has integer trace.
  - name: Formalism.HermitianLatticesTheory.GenusCovolBound
    gloss: >-
      States that in a fixed Euclidean realization of a positive-definite Hermitian trace pairing, one constant
      bounds the covolumes of all discrete full lattice images in a fixed genus.
  - name: Formalism.HermitianLatticesTheory.AutFinite
    gloss: >-
      States that the group of linear Hermitian isometries carrying a full lattice onto itself is finite when the
      rational trace pairing is positive definite.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (key_decls). Before and after text: check-log.tsv.'
- module: Formalism.HermitianLattices.ThetaLEuclid
  depth: 11
  lines: 37
  line: States the Euclidean comparison and inversion formulas for shifted Hermitian theta series.
  reading: >-
    An additive realization of a positive trace pairing as a Euclidean inner product identifies the shifted theta
    series with the Euclidean series of the image and the transported shift. For a Hermitian form on a finite-dimensional
    K-space with positive trace pairing and a discrete full Euclidean lattice image, the upper-half-plane inversion
    formula uses a sum over the trace-dual submodule, with phases determined by pairing with the shift and a prefactor
    of (−iτ) to half the Euclidean dimension divided by the image covolume.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.ThetaLEuclid
    gloss: >-
      States that for a positive trace pairing, an additive map carrying that pairing to the Euclidean inner product
      identifies the scalar shifted Hermitian theta series with the Euclidean theta series of the transported submodule
      and shift.
  - name: Formalism.HermitianLatticesTheory.ThetaLSLaw
    gloss: >-
      States that for Im τ > 0, a Hermitian form with positive trace pairing on a finite-dimensional K-space and
      a discrete full Euclidean lattice image give the theta series at −1/τ as a trace-dual theta sum weighted by
      the character of the shift and scaled by the dimension factor and inverse covolume.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (minor findings): 3 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Lemmata.GeneralBFactSecondRest.Imports
  depth: 11
  lines: 49
  line: >-
    Proves that every vector has a nonzero integer multiple in any ring-of-integers submodule that spans the ambient
    space.
  reading: >-
    For a totally complex number field K with an involution, every vector in a K-vector space has a nonzero integer
    multiple in any submodule over the ring of integers of K that spans the space over K. The proof proceeds by
    induction on the span, multiplying the integer factors when adding vectors and clearing the denominator of a
    field scalar by making it integral. The MajLattice proof uses the theorem to show that the realized lattice
    spans its ambient real vector space.
  key_decls:
  - name: Bl.general_b_fact_second_rest.goal1
    gloss: >-
      If a submodule over the ring of integers of a totally complex number field with an involution spans the ambient
      vector space over that field, every vector has a nonzero integer multiple in the submodule.
  - name: Bl.general_b_fact_second_rest.aux
    gloss: Every element of a number field has a nonzero integer multiple that is integral over the integers.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
