  depth: 10
  lines: 61
  line: >-
    Defines the trace discriminant module and states finiteness and Weil transformation laws for Hermitian lattice
    theta vectors.
  reading: >-
    The discriminant module is the trace dual modulo its intersection with the lattice. A chosen representative
    of each class supplies both the quadratic phase and the shift for its theta component. For full trace-integral
    lattices with positive-definite Hermitian trace pairing, the module states finiteness of the discriminant module.
    With the same hypotheses, even trace norms, and a finite discriminant module, it states nondegeneracy of the
    quadratic phase and the Weil laws for translation and inversion, with weight half the rational dimension.
  key_decls:
