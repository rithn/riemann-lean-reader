- module: Formalism.HermitianLattices.HermitianLatticesProofs.GenusCovol
  depth: 10
  lines: 611
  line: >-
    Proves that Euclidean covolume for a positive-definite trace form is constant within a Hermitian lattice genus.
  reading: >-
    Inverting the trace Gram matrix constructs a basis for the trace dual and shows that its covolume is reciprocal
    to the original covolume. The squared covolume is the ratio of the indices of the intersection in the dual and
    in the original lattice, respectively. Local Hermitian isometries match both lattices and their trace duals,
    and induction on finite index turns these local identifications into equality of the two global indices across
    the genus. The same index lemma is used to prove genus invariance of the discriminant order of integral Hermitian
    lattices.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.genusCovol_tdual
    gloss: >-
      Defines the trace dual of a lattice L as the module of vectors y for which Tr_{K/ℚ}(h(x,y)) is integral for
      every x in L.
  - name: Formalism.HermitianLatticesTheory.genusCovol_lemmaS
    gloss: >-
      Two inclusions of finite additive index have equal indices if, at every maximal ideal, an injective additive
      map identifies both localized submodules of the first inclusion with their counterparts in the second.
  - name: Formalism.HermitianLatticesTheory.genusCovol_sq
    gloss: >-
      In a Euclidean realization preserving the positive-definite trace pairing where A maps to a discrete full
      lattice, if a positive integer multiple of A lies in its trace dual A*, then J = A ∩ A* has finite index in
      both and the squared trace covolume of A is [A*:J] divided by [A:J].
  - name: Formalism.HermitianLatticesTheory.genusCovol_local
    gloss: >-
      An isometry witnessing Hermitian local equivalence at a prime identifies the ordinary localizations of the
      two finitely generated modules and of their trace duals.
  - name: Formalism.HermitianLatticesTheory.genusCovol
    gloss: >-
      Two Hermitian lattices in the same genus have equal covolume in any common Euclidean realization of the positive-definite
      trace form in which both images are full lattices.
