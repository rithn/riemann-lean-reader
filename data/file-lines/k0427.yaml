- module: Formalism.HermitianLattices.HermitianLatticesProofs.AutFinite
  depth: 10
  lines: 79
  line: >-
    Proves finiteness of bounded trace sublevel sets and of automorphism groups of Hermitian lattices with positive-definite
    trace form.
  reading: >-
    Writing q(v) = Tr_{K/ℚ}(h(v,v)), summability of the theta series at i implies that only finitely many lattice
    vectors satisfy q(v) ≤ R, since each contributes at least exp(−πR). A lattice automorphism is determined by
    the images of finitely many lattice generators, and those images lie in a common finite trace sublevel set.
    The two results are used to prove finiteness of sets of vectors representing a fixed form value and of stabilizers
    in a unitary double-coset space.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.autFinite_short
    gloss: >-
      If the trace of the diagonal of a sesquilinear form is positive on every nonzero vector, only finitely many
      lattice vectors have diagonal trace at most a given rational bound.
  - name: Formalism.HermitianLatticesTheory.autFinite
    gloss: >-
      For a Hermitian form with positive-definite trace form on a finite-dimensional vector space over a number
      field K, the group of K-linear isometries preserving a given lattice over the ring of integers of K is finite.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Formalism.HermitianLattices.HermitianLatticesProofs.ClassSetAssembly
  depth: 10
  lines: 759
  line: Proves a finiteness criterion for Hermitian lattice isometry classes and applies it to a genus.
  reading: >-
    A common denominator d gives a lower bound of 1/d on the Euclidean norms of nonzero lattice vectors, so a covolume
    bound yields uniformly short independent vectors via the short-vector theorem. Their trace Gram matrices, including
    pairings with integral-basis multiples, take finitely many values and determine the frames up to K-linear trace
    isometry. For each matrix tuple, the Gram determinant confines the transported lattices between a fixed integer
    span and a finite-index enlargement. The genus specialization is used to prove class-set finiteness.
  key_decls:
  - name: Formalism.HermitianLatticesTheory.classSetAssembly_denom
    gloss: >-
      If a positive integer makes the trace Gram matrix of a full frame integral, its scaled matrix determinant
      clears the frame coordinates of every vector whose pairings with the frame become integral under the same
      scaling.
  - name: Formalism.HermitianLatticesTheory.classSetAssembly_exists_isom
    gloss: >-
      Two full frames with matching trace Gram matrices and matching trace pairings after multiplication in the
      first slot by each element of a rational basis of K are related by a K-linear trace isometry.
  - name: Formalism.HermitianLatticesTheory.classSetAssembly_main
    gloss: >-
      Given a positive-definite Euclidean realization of the trace form with bounded scalar multiplication, a family
      with a common denominator and uniformly short full frames admits a finite set of Hermitian isometry representatives,
      assuming intermediate-subgroup finiteness and recovery of Hermitian isometries from K-linear trace isometries.
  - name: Formalism.HermitianLatticesTheory.classSetFinite_core
    gloss: >-
      Under the same realization, subgroup, and isometry hypotheses, a common integral scaling and discrete full
