    gloss: Forms the quotient of the trace dual by its intersection with the lattice.
  - name: Formalism.HermitianLatticesTheory.qDiscr
    gloss: Assigns to each class the exponential of πi times the trace norm of its chosen representative.
  - name: Formalism.HermitianLatticesTheory.thetaVec
    gloss: >-
      Indexes shifted lattice theta series by discriminant classes, using the chosen representative as the shift.
  - name: Formalism.HermitianLatticesTheory.ThetaWeil
    gloss: >-
      States that for a full trace-integral lattice with positive-definite Hermitian trace pairing, even trace norms,
