    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (key_decls). Before and after text: check-log.tsv.'
- module: Development.AbelianVarietyTheory.Proofs.SatakeParameters.LpTwOneNe
  depth: 10
  lines: 57
  line: >-
    Proves that the unramified twist scaling Frobenius by the residue field cardinality changes every positive-dimensional
    Weil–Deligne class.
  reading: >-
    In dimension d, the twist multiplies the Frobenius determinant by q^d, where q is the residue field cardinality,
    whereas an isomorphism preserves that nonzero determinant. Since q > 1 and d > 0, the two classes differ. NoMonodromyOfMemWeilDeligneListSum
    restates the lemma in its own namespace.
  key_decls:
  - name: GlobalTheory.WeilDeligne.WD.lpTw_one_ne
    gloss: >-
      A positive-dimensional Weil–Deligne representation is not isomorphic to its twist by the unramified character
      sending Frobenius to the residue field cardinality.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
