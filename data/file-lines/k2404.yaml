- module: Development.AbelianVarietyTheory.Proofs.SatakeParameters.SegmentSumNoMonodromyLengthOne
  depth: 9
  lines: 41
  line: >-
    Shows that zero monodromy forces length-one segments in a Weil–Deligne sum built from a reciprocity map satisfying
    IsRecT.
  reading: >-
    For a local Langlands map satisfying the stated axioms, zero monodromy of the segment sum forces each summand
    to have zero monodromy. Twist compatibility and irreducibility of supercuspidal parameters make the twisted
    first-term parameter irreducible, so tensoring with a special factor of dimension at least two would give nonzero
    monodromy. At length one the twist is trivial and the special factor is the tensor unit, leaving the direct
    sum of the first-term parameters. The direct importer restates the theorem as GlobalTheory.T.segmentSum_no_monodromy_length_one.
  key_decls:
  - name: GlobalTheory.SegSumOne.segSum_of_mono0
    gloss: >-
      For a local reciprocity map satisfying IsRecT, a segment sum with zero monodromy consists of length-one segments
      and equals the direct sum of the parameters of their first terms.
