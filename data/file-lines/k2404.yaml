- module: Development.AbelianVarietyTheory.Proofs.SatakeParameters.FixedIwahoriNeBotOfTwist
  depth: 10
  lines: 44
  line: >-
    Proves that a determinant absolute-value twist with nonzero Iwahori-fixed vectors yields such vectors in the
    original representation.
  reading: >-
    The determinant has absolute value one on the Iwahori subgroup, so the twisting character is trivial there.
    The proof pulls a nonzero fixed vector back along the intertwining isomorphism. FixedUnr uses the lemma to transfer
    nonzero Iwahori invariants from the algebraic normalization to the original local representation.
  key_decls:
  - name: GlobalTheory.AboveL.IwaFix.fixed_iwahori_ne_bot_of_twist
    gloss: >-
      If a representation isomorphic to the twist of a complex representation of GL(n,k), for a nonarchimedean local
      field k, by the determinant absolute value to a complex power has a nonzero Iwahori-fixed vector, then so
      does the original representation.
  blueprint: []
  status: fixed
