    so the tensor product's monodromy comes from the shift on the special factor. In dimension at least two, the
    shift has a nonzero value, and its tensor with a nonzero vector in the irreducible factor stays nonzero. For
    a local Langlands map satisfying IsRecT, SegmentSumNoMonodromyLengthOne uses these results to show that a segment
    sum with zero monodromy consists of length-one segments and equals the sum of their first-term parameters.
