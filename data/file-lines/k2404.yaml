- module: Development.AbelianVarietyTheory.PublishedTheorems.GaloisGeometry₂.TemperedProductOfSquareIntegrable
  depth: 6
  lines: 98
  line: >-
    Formulates the square-integrable product criterion for temperedness on GL(n) and proves the character case for
    GL(1).
  reading: >-
    The general criterion is stated as a proposition for smooth irreducible complex representations over nonarchimedean
    local fields of characteristic zero. It characterizes temperedness by a representation product of factors with
    square-integrable matrix coefficients modulo the center. For a smooth GL(1) character, descent of the coefficient
    norms to the one-point central quotient is equivalent to unitarity, and the resulting constants satisfy the
    matrix-coefficient Lᵖ condition for every real p. A unitary character is itself the single square-integrable
    factor, and a nonunitary character fails the temperedness condition.
  key_decls:
  - name: GlobalTheory.Published.TemperedProductOfSquareIntegrable
    gloss: >-
      States that a smooth irreducible complex representation of GL(n) with n ≥ 1 over a nonarchimedean local field
      of characteristic zero is tempered exactly when it is equivalent to a product of square-integrable irreducible
      factors of positive ranks summing to n.
  - name: GlobalTheory.Published.TemperedProduct.coeffLp_detRep_one_iff
    gloss: >-
      For every real p, a smooth GL(1) character satisfies the matrix-coefficient Lᵖ condition modulo the center
      exactly when it is unitary.
  - name: GlobalTheory.Published.TemperedProduct.unitary_char
    gloss: >-
      A smooth unitary character gives a smooth irreducible tempered representation of GL(1) with a one-factor square-integrable
      product presentation.
  - name: GlobalTheory.Published.TemperedProduct.not_tempered_char
    gloss: >-
      A smooth nonunitary character gives a smooth irreducible representation of GL(1) that fails the matrix-coefficient
      condition for temperedness.
  - name: GlobalTheory.Published.TemperedProduct.coeffLp_of_equiv
    gloss: >-
      An equivalence of representations transports the matrix-coefficient Lᵖ condition from one representation to
      the other.
  blueprint:
  - merten:thm-tempered-products
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 3 field edits (key_decls, line, reading). Before and after text: check-log.tsv.
