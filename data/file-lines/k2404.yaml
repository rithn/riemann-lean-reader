  line: >-
    Proves finite-place temperedness for RACSD cusp forms on GL(n) over CM fields (n ≥ 2) under the polarized Galois
    representation hypothesis.
  reading: >-
    The theorem assumes the existence of compatible Galois representations for polarized regular algebraic cusp
    forms over CM fields. For regular algebraic conjugate self-dual (RACSD) cusp forms of rank n ≥ 2, regular algebraicity
    supplies the infinitesimal characters used to compute the Galois weight n−1. Away from the auxiliary prime ℓ,
    local–global compatibility identifies the Frobenius-semisimplified Weil–Deligne parameter with the reciprocity
    parameter twisted by (1−n)/2, which cancels the purity twist (n−1)/2. Choosing ℓ from {2, 3} covers every finite
    place.
