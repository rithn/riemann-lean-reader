  depth: 10
  lines: 70
  line: >-
    Defines twisted Weil intertwiners and proves that they restrict to source summands and project to target summands.
  reading: >-
    The source Weil action is twisted by the unramified character sending Frobenius to the residue field cardinality,
    and the vanishing condition requires every such intertwiner between representatives of two Weil–Deligne classes
    to be zero. The direct-sum lemmas follow from the componentwise Weil action, and NoMonodromyOfMemWeilDeligneListSum
    uses the intertwining condition to define vanishing on a specified inertia eigenspace.
