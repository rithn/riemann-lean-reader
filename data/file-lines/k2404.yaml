    to a length-one segment is its sole term. Applying this to each segment identifies the representation specified
    by the Langlands datum as a subquotient of the induction of those supercuspidal terms, giving its support with
    multiplicities. The direct importer restates the support theorem as GlobalTheory.T.supercuspidalSupport_of_lengthOne_langlandsDatum.
