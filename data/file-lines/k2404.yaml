- module: Development.AbelianVarietyTheory.Proofs.SatakeParameters.GaloisWeightEqDimSubOne
  depth: 7
  lines: 67
  line: >-
    Proves attached Galois weight n−1 for conjugate self-dual GL(n) cuspidals over CM fields with infinitesimal
    characters at every embedding.
  reading: >-
    At each of two conjugate embeddings, the attachment obtains the Hodge–Tate multiset from the infinitesimal character
    by z ↦ (n−1)/2−z. Conjugate self-duality negates the infinitesimal-character entries at the conjugate embedding,
    and the attachment carries Hodge–Tate entries there by h ↦ wt−h. Summing the two comparisons gives n(wt−(n−1))
    = 0. GlobalTheory.T.galois_weight_eq_dim_sub_one restates the resulting weight formula.
  key_decls:
