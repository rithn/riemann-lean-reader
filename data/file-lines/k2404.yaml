      Asserts that a representation is Speh of some positive length attached to a square-integrable irreducible
      representation.
  - name: GlobalTheory.Published.UnitaryDualGL
    gloss: >-
      Asserts that every smooth irreducible unitarizable complex representation of GL(n) over a characteristic-zero
      nonarchimedean local field is isomorphic to a parabolic product of unitary Speh representations and opposite
