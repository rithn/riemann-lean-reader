- module: Development.AutomorphicArithmetic.AutomorphicVarieties.ModularityArgument.SemisimpleLevels.FixedUnr
  depth: 9
  lines: 112
  line: Proves Iwahori fixedness and a spherical criterion for local GL(n) from unramified Weil characters.
  reading: >-
    Under the stated reciprocity and automorphic hypotheses, if at each Weil element the normalized Weil–Deligne
    parameter’s characteristic polynomial is the product of linear factors with roots given by the values of a fixed
    family of unramified Weil characters, the representation has a nonzero Iwahori-fixed vector. The proof shows
    that each cuspidal support factor is an unramified character. Nonzero monodromy forces two Frobenius values
    to differ by a factor of the residue field cardinality, a relation that extends to the Weil group by unramifiedness.
    Excluding such character pairs gives sphericity. The semisimple level theorem uses this criterion.
  key_decls:
  - name: UpperTheory.V.Lev.fixedUnr
    gloss: >-
      Under Af.Hypotheses₂ and the reciprocity hypothesis IsRec, a smooth irreducible local GL(n) representation
      whose normalized parameter has characteristic roots given at each Weil element by a fixed family of unramified
      Weil characters has a nonzero Iwahori-fixed vector and is spherical if no two characters differ by the twist
      sending a Weil element of degree d to q raised to d, where q is the residue field cardinality.
  - name: eq_one_of_dvd
    gloss: >-
      A semisimple complex endomorphism whose characteristic polynomial divides a power of X − 1 is the identity.
  - name: link
    gloss: >-
      If character values give the characteristic roots of a Weil–Deligne representation with nonzero monodromy,
      one character’s Frobenius value is the residue field cardinality times another’s.
  - name: link_all
    gloss: >-
      For unramified characters, a ratio of q at Frobenius extends to a ratio of q raised to the degree at every
      Weil element, where q is the residue field cardinality.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (minor findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Development.AbelianVarietyTheory.Definitions.GaloisGeometry.PolarizedGaloisRepNarrow2
  depth: 10
  lines: 183
  line: >-
    Defines an existence assertion for polarized ℓ-adic Galois representations with local–global compatibility over
    CM fields.
  reading: >-
    For each prime ℓ and chosen coefficient-field isomorphism, the proposition asserts existence of a continuous
    semisimple polarized Galois representation, an integer weight, and Hodge–Tate multisets for positive-rank regular
    algebraic polarized cuspidal pairs. Away from ℓ, it gives local Langlands compatibility, twisted Weil eigenvalue
    bounds, and temperedness criteria. Given tied local period data and an induced bridge above ℓ, it requires de
    Rhamness, jumps for induced embeddings, semistability and compatibility in the Iwahori-spherical case, and crystallinity
    in the spherical case. Monodromy vanishing on a joint inertia eigenspace is well defined on Weil–Deligne classes
    and twist invariant.
  key_decls:
  - name: GlobalTheory.Published.PolarizedGaloisRepNarrow2
    gloss: >-
      Asserts the existence, for each prime ℓ, chosen coefficient-field isomorphism, and positive-rank regular algebraic
      polarized cuspidal pair over a CM field, of an ℓ-adic Galois representation, an integer weight, and Hodge–Tate
      multisets satisfying PropsN.
  - name: GlobalTheory.GalNarrow2.PropsN
    gloss: >-
      Packages continuity, semisimplicity, polarization, compatibility and eigenvalue bounds away from ℓ, twisted
      temperedness there when all components at the place are spherical, full Weil–Deligne agreement and twisted
      temperedness at every place away from ℓ if a square-integrable component occurs at any finite place, Hodge–Tate
      weight relations, and the conditional AboveN package.
  - name: GlobalTheory.GalNarrow2.AboveN
    gloss: >-
      Packages de Rhamness and prescribed filtration jumps, semistability with Weil characteristic polynomial matching
      and transfer of zero monodromy when Iwahori-fixed vectors exist, eigenvalue bounds, and crystallinity for
      spherical local components.
  - name: GlobalTheory.WeilDeligne.WD.mono0Ine
    gloss: >-
      Asserts that the monodromy operator of a Weil–Deligne class annihilates the joint inertia eigenspace for a
      specified function on inertia.
  - name: GlobalTheory.WeilDeligne.WD.mono0Ine_lpTw
    gloss: >-
      Proves that the local twist preserves and reflects vanishing of monodromy on the specified joint inertia eigenspace.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 3 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.SumSegmentsLanglandsStatement
  depth: 10
  lines: 17
  line: Restates the imported norm-twist identity for Weil–Deligne sums attached to Langlands segments.
  reading: >-
    For a local Langlands reciprocity map for general linear groups over the adic completion, each segment of length
    m contributes the parameter of its first term, twisted by exponent (m−1)/2 and tensored with the m-dimensional
    special parameter. The proof of the local Langlands formula for Speh-type products uses this identity to pass
    from a common twist of the segments to a twist of their parameter sum.
  key_decls:
