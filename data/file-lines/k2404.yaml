    gloss: >-
      For n ≥ 1, an associated ℓ-adic Galois representation of a conjugate self-dual cuspidal representation of
      GL(n) over a CM field has weight n−1 if the cuspidal representation has an infinitesimal character at every
      complex embedding.
  - name: GlobalTheory.CsdWeight.sum_map_const_sub
    gloss: >-
      For a finite multiset of complex numbers, the sum after replacing each z by c−z is its cardinality times c
      minus its original sum.
