- module: Development.AbelianVarietyTheory.PublishedTheorems.GaloisCohomology₂.IsSquareIntegrable
  depth: 7
  lines: 37
  line: >-
    Defines square-integrability modulo the center, unitary Speh representations, and a unitary dual hypothesis
    for GL(n).
  reading: >-
    Square-integrability requires positive rank, unitarizability, and a Haar measure on the central quotient giving
    finite integrals of the squared norms of smooth-dual matrix coefficients evaluated at chosen coset representatives.
    A unitary Speh representation is a positive-length Speh representation attached to square-integrable data. The
    unitary dual hypothesis over characteristic-zero nonarchimedean local fields asserts that every smooth irreducible
    unitarizable representation is a parabolic product of unitary Speh factors and pairs of opposite twists with
    exponents ±s, where 0 < s < 1/2. SquareIntegrableSegment uses the first definition as the premise of its segment
    assertion.
  key_decls:
  - name: GlobalTheory.UnitaryDual.IsSquareIntegrable
    gloss: >-
      Requires positive rank, unitarizability, and square-integrability modulo the center of every matrix coefficient
      formed using a smooth dual vector.
