- module: >-
    Development.AutomorphicArithmetic.Foundations.GaloisRepresentations.IntegralStructures.InertCharpoly.CharPolOfInert
  depth: 7
  lines: 192
  line: >-
    Proves depth zero and inertial separation for generic local representations under conditions on their Weil–Deligne
    parameters.
  reading: >-
    For a generic irreducible representation under IsRecT, zero monodromy gives an unlinked supercuspidal support
    whose parameters sum to the original parameter. Over ℚₚ, tameness also gives depth zero by finite counting on
    supercuspidal labels. Inertially equivalent constituents contribute the same tame-generator roots, so every
    root from the pair repeats and must be a (q−1)st root of unity for residue size q, forcing rank one. The toral
    case likewise forces the entire support to have rank one. Local–global compatibility uses these results for
    toral comparison and to verify the fixed-vector and support conditions for tame comparison.
  key_decls:
  - name: UpperTheory.Gal.Int.Row.split
    gloss: >-
