    gloss: >-
      If the eigenvalues of a tame inertia generator on a tame parameter are all (q−1)st roots of unity, where q
      is the residue-field cardinality, the Weil action has abelian image.
  - name: UpperTheory.Gal.Int.Row.plainTor_of_tor
    gloss: >-
      For a generic irreducible representation under IsRecT, zero monodromy and characteristic polynomial (X − 1)^dim
      on each Weil commutator give unlinked supercuspidal support consisting of characters.
  - name: UpperTheory.Gal.Int.Row.charPol_of_inert
    gloss: >-
