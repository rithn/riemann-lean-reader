- module: Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries.HeckeSide
  depth: 17
  lines: 91
  line: >-
    Identifies the normalized Frobenius polynomial at the conjugate split place from spherical Hecke eigenvalues.
  reading: >-
    Under tempered local reciprocity, a Satake tuple gives an unramified parameter whose Frobenius eigenvalues after
    the (1−n)/2 twist are the twisted inverses of the Satake entries. The proof decomposes the nonzero fixed vector
    into images of spherical vectors in the conjugate local component and computes the Hecke action on each summand.
    It then applies Viète’s formula to give leading coefficient 1 and coefficient (−1)^k (Nw)^{k(k−1)/2} c_k at
    X^{n−k} for 1 ≤ k ≤ n, where Nw is the residue cardinality and c_k is the k-th Hecke eigenvalue.
  key_decls:
  - name: GlobalTheory.HeckeFrob.twisted_reciprocity_unramified_and_frobenius_eigenvalues_eq
    gloss: >-
      Given a Satake tuple, the normalized local parameter is unramified and its Frobenius eigenvalues are the twisted
      inverses of the Satake entries.
  - name: GlobalTheory.HeckeFrob.heckeSide_alt
    gloss: >-
      Under tempered reciprocity, a nonzero automorphic vector fixed by maximal compact elements supported at the
      split place and satisfying the Hecke eigenrelations for a uniformizer and a subgroup J agreeing there with
      the maximal compact yields a Satake tuple for the specified conjugate local component whose twisted inverse
      entries have elementary symmetric functions equal to the norm-scaled Hecke eigenvalues for 1 ≤ k ≤ n.
  - name: GlobalTheory.HeckeFrob.locPol_eq_alt
    gloss: >-
      Under tempered reciprocity and the specified split-place uniformizer, level, and Hecke eigenvector hypotheses,
      the normalized parameter of the identified local component at the conjugate place is unramified and its monic
      Frobenius polynomial has the signed, norm-scaled Hecke eigenvalues as coefficients below the leading term.
