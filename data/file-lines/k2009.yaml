    gloss: >-
      Under the label and conjugacy hypotheses, a row is good if its irreducible smooth local components have the
      prescribed class-map images and the group-algebra orbit of a nonzero idempotent-fixed vector lies in a subspace
      where, at each place, every nonzero vector is detected by a conjugate-linear map intertwining on the subspace
