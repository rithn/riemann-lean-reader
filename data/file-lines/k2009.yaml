    has its group-algebra orbit in a subspace W with the following property. At each place, every nonzero vector
    in W is detected by a conjugate-linear map that intertwines the finite group action on vectors in W and maps
    W into the local principal congruence fixed vectors. The proof extracts a good label family from the vector
    and identifies its dual labels with the row labels by comparing inertia characteristic polynomials and using
    injectivity of Teichmüller lifts. GoodFTAllOfLocal applies the criterion row by row.
  key_decls:
