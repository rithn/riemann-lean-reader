  line: >-
    Proves that the prescribed split-place block subgroup acts on realized type vectors through the block character.
  reading: >-
    A continuous completion isomorphism compatible with the prescribed embeddings of E transports the local component
    of an adelic element supported at the chosen split place. Membership in the prescribed block subgroup yields
    the level conditions and makes the additive character factor trivial. The proof uses density and the faithful
    reading to identify the remaining factor with the reading’s character evaluated on the determinant of the lower-right
    block. The split-place completion statement invokes this theorem directly.
  key_decls:
  - name: GlobalTheory.TypeVecEig.main_alt_alt
    gloss: >-
      Under a faithful reading, right translation by an adelic element supported at the designated split place scales
      each realized vector from the prescribed type space by the block character of its local component transported
      through a continuous completion isomorphism compatible with the prescribed embeddings of E, provided that
      component lies in the block subgroup.
