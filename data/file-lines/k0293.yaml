- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.FourierSumsCosetsSemidirectCyclic
  depth: 17
  lines: 95
  line: >-
    Proves Fourier formulas for pairings on the normal subgroup and the generator coset of a finite semidirect product
    with cyclic quotient.
  reading: >-
    For H = G ⋊ ⟨s⟩ with quotient of order n, a primitive nth root ζ gives a one-dimensional character η by pullback
    from the quotient, with η trivial on G and η(s) = ζ. For arbitrary complex functions X and Y on H, the sums
    of X times the conjugate of Y over G and Gs, multiplied by n, equal the sums of the full-group pairings of X
    with Yηᵃ for 0 ≤ a < n, with weights 1 and ζᵃ, respectively. Interchanging the sums reduces each identity to
    a geometric sum, using conjugation as inversion on roots of unity. The generator-coset formula is used to show
    that a nonzero pairing of irreducible characters at prime index forces a twist by a quotient character.
  key_decls:
  - name: GlobalTheory.Shin.CosetFourier.fourier_coset_sums
    gloss: >-
      Constructs a character trivial on the normal subgroup and taking the prescribed primitive root on the generator,
      and proves both Fourier identities for arbitrary complex functions.
  - name: GlobalTheory.Shin.CosetFourier.star_eq_inv_of_pow_eq_one
    gloss: The complex conjugate of an nth root of unity is its inverse for n > 0.
  - name: GlobalTheory.Shin.CosetFourier.geom_sum_root_of_unity
