    gloss: >-
      For a subgroup H of a finite nilpotent group G, the character induced from the trivial character of H minus
      the constant [G:H] is an integral sum of induced differences of linear and trivial characters.
  - name: GlobalTheory.BrauerZero.mem_degreeOneDiff_of_forall_centralByPrime
    gloss: >-
      A class function lies in the span of the induced differences if, for each subgroup with p-group quotient by
      its center for some prime p, every product of its restriction with a virtual character induces into that span.
  - name: GlobalTheory.BrauerZero.central_case
    gloss: >-
      If a finite group has p-group quotient by its center and the degree-zero theorem holds for its proper subgroups,
      then it holds for the group.
  - name: GlobalTheory.BrauerZero.virtualCharacter_degreeZero_mem_degreeOneDiff
    gloss: >-
      Every complex virtual character of a finite group that vanishes at the identity lies in the integral span
      of the induced differences.
  - name: GlobalTheory.BrauerZero.brauerDegreeZero
    gloss: >-
      The character of any finite-dimensional complex representation of a finite group minus its dimension is a
      finite integral sum of induced differences between linear characters and the trivial characters of their respective
      subgroups.
