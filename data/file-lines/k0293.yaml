    The proof twists one representation by the linear characters of the cyclic quotient. Each normalized pairing
    with a twist is the dimension of a space of equivariant maps. The Fourier formula expresses the normalized pairing
    on the normal factor as the sum of these nonnegative integers, so its vanishing forces every twisted pairing
    to vanish. The Fourier formula for a nonidentity coset then gives zero there, and the companion statement module
    restates the result.
