- module: GroundTheory.LocalFields.BrauerInductionAssembly
  depth: 13
  lines: 60
  line: Derives Brauer’s induction formula for finite groups from the monomiality of elementary subgroups.
  reading: >-
    Assuming every irreducible complex character of an elementary subgroup is induced from a linear character of
    one of its subgroups, the module proves that every complex character of a finite group is an integer combination
    of characters induced from linear characters of elementary subgroups. For each prime it finds a multiple of
    the trivial character in the span with multiplier coprime to that prime, so the ideal of multipliers is the
    unit ideal. To multiply a generator by a character, restrict the character and induce the product back. Monomiality
    and subgroup closure keep the result in the span, and applying this to the trivial character gives the formula.
  key_decls:
