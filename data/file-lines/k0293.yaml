    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: >-
    Development.AbelianVarietyTheory.Proofs.DivisorProofs.CliffordSemidirectPrimeIndexIrreducibleCharacter
  depth: 18
  lines: 119
  line: Proves a prime-index Clifford dichotomy for irreducible characters of finite semidirect products.
  reading: >-
    For H = G ⋊ ⟨s⟩ with quotient of prime order, an irreducible character χ either vanishes throughout Gs or restricts
    irreducibly to G and satisfies ∑_{x∈Gs} |χ(x)|² = |G|. A nontrivial quotient twist fixing χ forces vanishing
    because the twisting character has a constant value different from 1 on Gs. Otherwise, character orthogonality
    leaves only the trivial twist in the Fourier formulas, giving squared sums of |G| on both G and Gs and hence
    irreducibility on G by the norm-one criterion. The direct importer restates the theorem under GlobalTheory.T.
  key_decls:
  - name: GlobalTheory.Shin.clifford_prime_index
    gloss: >-
      On the generator coset of a split extension of prime index, an irreducible character either vanishes identically
      or has average squared absolute value one and restricts irreducibly to the normal subgroup.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.CyclotomicSumNormSqEqOneSingleNonzero
  depth: 18
  lines: 215
  line: >-
    Proves that a family of prime-order cyclotomic integers with squared absolute values summing to one has exactly
    one nonzero term.
  reading: >-
    For a primitive ℓth root ζ with ℓ prime, the theorem considers a finite family of integer linear combinations
    of 1, ζ, …, ζ^(ℓ−1). It expands each squared absolute value by grouping products of coefficients by exponent
    difference modulo ℓ, then uses the cyclotomic minimal polynomial to show that every vanishing relation among
    these powers has constant coefficients. If the squared absolute values sum to one, the sum of squared differences
    over all ordered pairs of coefficients within each term, totaled across the family, is 2(ℓ−1), while each nonzero
    term contributes at least ℓ. The direct importer restates the theorem under GlobalTheory.T.
  key_decls:
  - name: GlobalTheory.cyclo_sum_mul_star_eq_one_single
    gloss: >-
      If the squared absolute values in a finite family of integer sums of powers of a primitive root of prime order
      add to one, exactly one family member is nonzero.
  - name: GlobalTheory.cycloSq_coeff_eq
    gloss: >-
      An integer relation among the first ℓ powers of a primitive ℓth root with ℓ prime has all coefficients equal.
  - name: GlobalTheory.cycloSqCoeff
    gloss: >-
      The coefficient at residue d is the sum of f(a)f(b) over 0 ≤ a,b < ℓ with a − b congruent to d modulo ℓ.
  - name: GlobalTheory.cycloSq_mul_star
    gloss: >-
      The squared absolute value of an integer sum of powers of ζ expands in those powers with coefficients given
      by cycloSqCoeff.
  - name: GlobalTheory.cycloSq_le_of_ne_zero
    gloss: >-
      A nonzero integer sum of powers of a primitive ℓth root with ℓ > 1 has a sum of squared coefficient differences
      over all ordered pairs of at least ℓ.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.ExistsPolyPowMulEqOne
  depth: 18
  lines: 103
  line: >-
    Proves that every invertible complex matrix has an inverse ℓth root that is a polynomial in the matrix, for
    every positive integer ℓ.
  reading: >-
    For an invertible complex matrix B and ℓ > 0, the theorem constructs p with p(B)^ℓ B = 𝟙. Lagrange interpolation
    chooses a polynomial q whose value at each eigenvalue λ is an ℓth root of λ⁻¹. A root-divisibility lemma makes
    the error Xq^ℓ − 1 nilpotent modulo the characteristic polynomial. In the quotient, with r = [X], the derivative
    of P(T) = rT^ℓ − 1 at [q] is a unit, so nilpotent lifting gives a zero of P that Cayley–Hamilton transfers to
    B. The direct importer restates the result under GlobalTheory.T.
  key_decls:
  - name: GlobalTheory.exists_poly_pow_mul_eq_one
    gloss: >-
      For every invertible complex matrix B and positive integer ℓ, there is a complex polynomial p such that p(B)^ℓ
      B = 𝟙.
  - name: GlobalTheory.dvd_pow_natDegree_of_forall_isRoot
    gloss: >-
      If every root of a monic complex polynomial f is a root of g, then f divides g raised to the degree of f.
  - name: GlobalTheory.prod_X_sub_C_dvd_pow_of_isRoot
    gloss: >-
      For a multiset of m roots of g, the product of the corresponding linear factors, counted with repetition,
      divides g^m.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.SemidirectCosetPairingEqZeroOrTwist
  depth: 18
  lines: 86
  line: >-
    Proves that a nonzero generator-coset pairing of irreducible characters at prime index forces a quotient-character
    twist.
  reading: >-
    In a finite semidirect product G ⋊ ⟨s⟩ with prime-order quotient, the pairing of irreducible characters χ and
    χ′ on Gs is zero or χ = χ′ν for a one-dimensional character ν trivial on G. Twisting rescales the action by
    nonzero scalars, preserving the invariant subspaces and hence irreducibility, and multiplies the character by
    ν. The coset Fourier formula turns a nonzero coset pairing into a nonzero full-group pairing with some quotient
    twist of χ′, which character orthogonality identifies with χ. The direct importer restates the dichotomy under
    GlobalTheory.T.
  key_decls:
  - name: GlobalTheory.Shin.coset_pair_eq_zero_or_twist
    gloss: >-
      Two irreducible characters have zero pairing on the generator coset unless the first is a twist of the second
      by a one-dimensional character of the prime-order quotient.
  - name: GlobalTheory.CliffTwo.twistRep
    gloss: >-
      Defines the twist of a complex representation ρ by a one-dimensional character ν through the action x ↦ ν(x)ρ(x).
  - name: GlobalTheory.CliffTwo.twistRep_apply
    gloss: The twisted action of each group element x is the original action multiplied by the scalar ν(x).
  - name: GlobalTheory.CliffTwo.isIrreducible_twistRep
    gloss: >-
      Twisting an irreducible complex representation by a one-dimensional character preserves irreducibility.
  - name: GlobalTheory.CliffTwo.isIrrChar_mul_char
    gloss: >-
      The pointwise product of an irreducible complex character and a one-dimensional character is irreducible.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
