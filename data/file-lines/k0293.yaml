    The action of a cuspidal datum factors through the Levi projection, and its restriction to the block-diagonal
    subgroup is irreducible. The direct-product character theorem gives one irreducible character per block. Taking
    traces of vanishing operator sums over standard two-block unipotent radicals and cancelling the other factors'
    degrees shows that each block character is primitive after extension by zero to the full matrix algebra. The
    nonvanishing of irreducible character degrees is also used in the proof that the product of the character and
    base-level idempotents is nonzero.
