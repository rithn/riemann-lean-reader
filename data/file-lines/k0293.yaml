- module: Development.AbelianVarietyTheory.Proofs.CharacterTheory.SumConjIdempotentEqCardSmul
  depth: 9
  lines: 63
  line: >-
    Sums the conjugates of a nonzero idempotent in an irreducible representation to |T| times the identity under
    subgroup orthogonality.
  reading: >-
    The sum of the conjugates commutes with the group action by reindexing. After right multiplication by the idempotent,
    each term indexed by the subgroup T equals the idempotent, and every other term vanishes. The difference between
    the sum and |T| times the identity therefore has an invariant kernel containing the nonzero image of the idempotent,
    so irreducibility forces the difference to vanish. The direct importer uses the identity to derive the induced
    character formula in an imprimitivity argument.
  key_decls:
  - name: GlobalTheory.sum_conj_idempotent_eq_card_smul
    gloss: >-
      For an irreducible representation ρ of a finite group G over a field, if a nonzero idempotent e commutes with
      ρ(T) for a subgroup T and satisfies eρ(g)e = 0 for g outside T, then the sum of ρ(g)eρ(g)⁻¹ over G is |T|
      times the identity.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (material findings): 1 field edit (line). Before and after text: check-log.tsv.'
