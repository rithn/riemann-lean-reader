  check:
    verdict: supported
    notes: ''
- module: Development.AbelianVarietyTheory.Proofs.CharacterTheory.IsCharacterOverSubfieldOfRepresentation
  depth: 6
  lines: 69
  line: >-
    Shows that every finite-dimensional representation gives a character in coordinates, preserving irreducibility.
  reading: >-
    A linear isomorphism transports a representation by conjugating its action operators. Trace invariance preserves
    the character, and the induced order isomorphism on invariant subspaces preserves irreducibility. Choosing a
    basis therefore realizes the character on a coordinate space over K, with its trace values viewed in any field
    extension L/K and irreducibility taken over K. Direct importers use the theorem to recognize characters of tensor
    products and induced representations.
  key_decls:
  - name: GlobalTheory.BI.transportRep
    gloss: >-
      Transports a representation along a linear isomorphism e by sending each action operator ρ(g) to eρ(g)e⁻¹.
  - name: GlobalTheory.BI.character_transportRep
    gloss: >-
      Shows that transport along a linear isomorphism preserves the character of a finite-dimensional representation.
  - name: GlobalTheory.BI.transportSubOrderIso
    gloss: >-
      Identifies the invariant subspaces of the transported and original representations by an inclusion-preserving
      bijection whose inverse also preserves inclusion.
  - name: GlobalTheory.BI.isIrreducible_transportRep
    gloss: Shows that transport along a linear isomorphism preserves irreducibility.
  - name: GlobalTheory.BI.isChar_and_isIrrChar_of_rep
    gloss: >-
      For a field extension L/K, the trace function of any finite-dimensional K-representation, viewed in L, is
      realized by a representation on a coordinate space over K that is irreducible whenever the original is.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
