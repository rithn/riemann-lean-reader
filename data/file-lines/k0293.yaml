- module: Development.AbelianVarietyTheory.Proofs.GlobalInterpolation.IsSSRepOfFiniteIndex
  depth: 17
  lines: 85
  line: >-
    Proves semisimplicity of a finite-dimensional representation in characteristic zero from semisimplicity on a
    finite-index subgroup.
  reading: >-
    For each invariant subspace, semisimplicity on the subgroup gives a subgroup-equivariant projection onto it.
    Averaging the conjugates of this projection over the left cosets gives a projection equivariant under the whole
    group, whose kernel is an invariant complement. The importing proof applies the theorem to the trivial subgroup
    to deduce semisimplicity of finite-dimensional complex representations of finite groups.
  key_decls:
  - name: GlobalTheory.FiniteIndexSemisimple.isSSRep_of_finiteIndex
    gloss: >-
      A finite-dimensional representation of Γ over a characteristic-zero field is semisimple if its restriction
      to a finite-index subgroup of Γ is semisimple.
