- module: Development.AbelianVarietyTheory.Definitions.CommutativeAlgebra.AbByPOfComm
  depth: 6
  lines: 32
  line: >-
    Collects definitions for characters, induction, and groups with an abelian normal subgroup and a p-primary quotient.
  reading: >-
    Characters and irreducible characters are traces of the corresponding finite-dimensional representations over
    K, viewed in L, and virtual characters are their integer linear combinations. Using sums taken as zero on infinite
    support, induction sums the zero-extended function over conjugates and scales by |H|⁻¹ in L, while pairing scales
    the sum of a(g)b(g⁻¹) by |G|⁻¹ in L. The one-dimensional trivial representation gives the constant character
    1. A direct importer uses these definitions to show that every irreducible character of a finite group satisfying
    AbByP, over an algebraically closed field of characteristic zero, is linear or induced from a character of a
    proper subgroup.
  key_decls:
  - name: GlobalTheory.BI.IsChar
    gloss: >-
      An L-valued function on G is a character over K if it is the trace of a finite-dimensional K-representation
      mapped into L.
  - name: GlobalTheory.BI.IsIrrChar
    gloss: >-
      An L-valued function on G is an irreducible character over K if it is the trace of a finite-dimensional irreducible
      K-representation mapped into L.
  - name: GlobalTheory.BI.Virt
    gloss: >-
      The virtual characters over K form the additive subgroup of L-valued functions generated by the characters
      over K.
  - name: GlobalTheory.BI.ind
    gloss: >-
      For finite G, induction from H sums the zero-extended function over conjugates indexed by G and scales by
      the field inverse of the cast of |H| in L, giving zero when the cast is zero.
  - name: GlobalTheory.BI.AbByP
    gloss: >-
      There is a prime p and an abelian normal subgroup A such that every element of G has some p-power lying in
      A.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
