  line: Proves Brauer induction for degree-zero virtual characters of finite groups.
  reading: >-
    Every degree-zero complex virtual character is a finite integral sum of inductions of differences between a
    one-dimensional character and the trivial character on the same subgroup. The proof inducts on group order and
    uses the induction product formula to reduce to groups whose quotient by the center is a p-group. In that case,
    irreducible characters are linear or induced from proper subgroups, and induction on subgroup index handles
    the induced trivial characters after subtracting their degrees. The reciprocity uniqueness proof uses the resulting
    trace-minus-dimension formula as an input to field compatibility.
  key_decls:
