  line: Proves an induction principle for finite-group characters by adjoining irreducible characters.
  reading: >-
    For an extension L/K of characteristic-zero fields, the theorem treats characters of finite-dimensional K-representations
    as L-valued functions, with irreducibility taken over K. A property that holds for the zero character and is
    preserved by adding an irreducible character to a character holds for every such character. The proof uses strong
    induction on the degree, peeling off an irreducible character of positive degree at each step. BrauerDegreeZero
    uses the principle to reduce its claim about a complex character minus its degree to the irreducible case.
  key_decls:
  - name: GlobalTheory.BI.isChar_induction
    gloss: >-
      For a finite group and a characteristic-zero field extension L/K, a predicate on L-valued functions holds
      for every character of a K-representation if it holds at zero and is preserved when adding the character of
      an irreducible K-representation to a character of a K-representation.
  blueprint: []
