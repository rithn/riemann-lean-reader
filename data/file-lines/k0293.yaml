    Collects basic character facts about pullback, conjugation invariance, and the value at the identity.
  reading: >-
    For a finite-dimensional representation over K with trace values viewed in a field extension L/K, composing
    the action with a group homomorphism gives the pulled-back character, invariance of trace under conjugation
    gives a class function, and the trace of the identity is the dimension mapped into L, with dimension zero giving
    the zero character. Direct importers use pullback and conjugation invariance for virtual characters and the
    identity value in the degree-zero argument.
  key_decls:
  - name: GlobalTheory.isChar_restrict_conj_one
    gloss: >-
      An L-valued character χ afforded by a K-representation is invariant under conjugation, pulls back along any
      group homomorphism to a character afforded over K, and satisfies χ(1) = n in L for some natural number n such
      that n = 0 implies χ is identically zero.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
