- module: >-
    Development.AbelianVarietyTheory.Proofs.CharacterTheory.IrreducibleCharacterLinearOrInducedAbelianByPrim
  depth: 6
  lines: 64
  line: >-
    Proves that irreducible characters of finite abelian-by-p groups are linear or induced from proper subgroups.
  reading: >-
    Over an algebraically closed field of characteristic zero, every irreducible character of a finite group with
    an abelian normal subgroup of p-power index is linear or induced from a character of a proper subgroup. The
    proof uses a weight idempotent to express the character as induced from the stabiliser of a weight. If proper-subgroup
    induction is excluded, the stabiliser is the whole group, and irreducibility forces the idempotent to be the
    identity. This yields commuting representation operators, whose common eigenvector gives the linear character.
    BrauerDegreeZero uses the dichotomy to reduce the induced case to a proper subgroup.
  key_decls:
  - name: GlobalTheory.BI.weightStabiliser
    gloss: >-
      Defines the subgroup of elements whose conjugation action fixes a given linear character of a normal subgroup.
  - name: GlobalTheory.BI.nontrivial_of_isIrreducible
    gloss: Shows that an irreducible representation has a nonzero underlying vector space.
  - name: GlobalTheory.BI.irrChar_linear_or_induced
    gloss: >-
      Over an algebraically closed field of characteristic zero, an irreducible character of a finite group with
      an abelian normal subgroup of p-power index for some prime p is one-dimensional or is induced from a character
      of a proper subgroup.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
