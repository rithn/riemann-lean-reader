    gloss: >-
      The trace of the twisted operator is the original trace multiplied by the same power of the linear character
      value.
  - name: GlobalTheory.Shin.CosetOrth.sum_trace_mul_star_nat
    gloss: >-
      The unnormalized character pairing of two finite-dimensional complex representations of the same finite group
      is the group order times the dimension of the space of equivariant maps from the second representation to
      the first.
