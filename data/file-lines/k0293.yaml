  line: Proves the projection formula for induction of complex-valued functions on finite groups.
  reading: >-
    For a subgroup H of a finite group G, inducing a function on H and multiplying by a class function on G equals
    inducing the product with the class function restricted to H. The proof extends subgroup functions by zero and
    uses conjugation invariance to pull the class function’s value out of the induction sum. OneMemClosureInducedCentralByPrimePower
    uses the formula to show that its generating set of induced virtual characters is closed under multiplication.
    BrauerDegreeZero uses it to rewrite products with induced generators in an additive generation argument.
  key_decls:
