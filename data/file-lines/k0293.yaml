- module: GroundTheory.LocalFields.BrauerInductionElementary
  depth: 17
  lines: 141
  line: >-
    Defines elementary subgroups, proves that they are nilpotent and closed under passage to subgroups, and includes
    all finite cyclic groups.
  reading: >-
    A p-elementary subgroup is generated as a product of commuting factors, one cyclic of order prime to p and the
    other a p-group, and an elementary subgroup is p-elementary for some prime p. Bézout’s identity splits each
    element of a finite group into powers of itself of order prime to p and of p-power order, proving that every
    cyclic subgroup is p-elementary. The same power argument recovers the two factors inside any subgroup. Nilpotence
    follows because the cyclic factor is central and the quotient by it is a finite p-group.
  key_decls:
  - name: GroundTheory.LocalField.IsElementaryAt
    gloss: >-
      A subgroup is p-elementary if it is the product of a cyclic subgroup of order prime to p and a p-subgroup
      whose elements commute with the cyclic factor.
  - name: GroundTheory.LocalField.exists_zpow_mul_zpow_eq
    gloss: >-
      For prime p, every element of a finite group is the product of two integer powers of itself, one of order
      prime to p and one killed by the p-part of the element’s order.
  - name: GroundTheory.LocalField.isElementaryAt_zpowers
    gloss: Every cyclic subgroup of a finite group is p-elementary for every prime p.
  - name: GroundTheory.LocalField.IsElementaryAt.mono
    gloss: Every subgroup of a p-elementary subgroup is p-elementary at the same p.
  - name: GroundTheory.LocalField.IsElementaryAt.isNilpotent
    gloss: For prime p, every p-elementary subgroup of a finite group is nilpotent.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (key_decls). Before and after text: check-log.tsv.
- module: GroundTheory.LocalFields.BrauerInductionIntegral
  depth: 17
  lines: 161
  line: >-
    Proves cyclotomic integrality of finite-group character values, a retraction onto ℤ, and a Frobenius congruence.
  reading: >-
    Restricting a character to the cyclic subgroup generated by an element expresses its value as a sum of roots
    of unity and places it in ℤ[ζ] whenever the element’s order divides the order of the primitive root ζ. For integral
    ζ, the constant coordinate in the power basis gives a ℤ-linear retraction and shows that elements of ℤ[ζ] with
    a nonzero integer multiple in ℤ are themselves integers. For prime p and n ≥ 0, the pⁿ-th power of a finite
    sum agrees modulo p with the sum of the pⁿ-th powers. BrauerInductionSpan uses the retraction to descend from
    the ℤ[ζ]-span of induced characters to the integral span when the function has integer pairings with all irreducible
    characters.
  key_decls:
  - name: GroundTheory.LocalField.IsCharacter.exists_sum_zpow
    gloss: >-
      On all integer powers sᵃ of an element s, a character has a common expansion in powers βᵃ of roots of unity
      β whose orders divide the order of s, with fixed nonnegative integer multiplicities.
  - name: GroundTheory.LocalField.IsCharacter.apply_mem_adjoin
    gloss: >-
      If the order of s divides N and ζ is a primitive Nth root of unity, every character value at s belongs to
      ℤ[ζ].
  - name: GroundTheory.LocalField.exists_retraction_adjoin
    gloss: For ζ integral over ℤ, the inclusion of ℤ in ℤ[ζ] admits a ℤ-linear retraction.
  - name: GroundTheory.LocalField.exists_int_of_mul_eq_int
    gloss: For ζ integral over ℤ, an element of ℤ[ζ] with a nonzero integer multiple in ℤ is itself an integer.
  - name: GroundTheory.LocalField.exists_sum_pow_prime_pow_eq
    gloss: >-
      For prime p and n ≥ 0, the pⁿ-th power of a finite sum in a commutative ring is congruent modulo p to the
      sum of the pⁿ-th powers of its terms.
  blueprint: []
  status: fixed
  check:
