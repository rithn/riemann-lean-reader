    irreducible normal-factor representation. When the target representation ρ has character orthogonal to Y, precomposition
    with the surjection shows that every intertwiner from that irreducible representation to ρ vanishes. Averaging
    rank-one maps and summing diagonal entries then gives a vanishing operator sum weighted by the conjugated coset
    character values. The companion statement module restates the criterion.
  key_decls:
  - name: GlobalTheory.Shin.sum_char_inv_mul_char_eq_zero_iff
