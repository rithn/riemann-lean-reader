- module: Development.AbelianVarietyTheory.Proofs.CharacterTheory.VirtualCharactersMulComapConjIndLinear
  depth: 6
  lines: 110
  line: >-
    Proves closure properties of complex virtual characters under multiplication, pullback, and subgroup induction.
  reading: >-
    For a finite group, complex virtual characters are class functions, include all linear characters, and are closed
    under pointwise multiplication. Pullback along any homomorphism into the group and induction from any subgroup
    preserve virtual characters. The product formula comes from tensor products, and induction is additive because
    extension by zero and the conjugation sum are additive. Induction on the additive subgroup generated by characters
    extends these facts to virtual characters. Direct importers use them in the degree-zero argument and to construct
    virtual characters from semidirect-product orbit terms.
  key_decls:
  - name: GlobalTheory.BI.isChar_mul_complex
    gloss: >-
      The pointwise product of two complex characters is the character of the tensor product representation.
  - name: GlobalTheory.BI.isChar_monoidHom_complex
    gloss: >-
      Every homomorphism from a group to the nonzero complex numbers is the character of a one-dimensional complex
      representation.
  - name: GlobalTheory.BI.subgroupFunctionExtendByZero_add
    gloss: Extension by zero from a subgroup commutes with pointwise addition.
  - name: GlobalTheory.BI.indAddHomComplex
    gloss: >-
      Defines induction from a subgroup of a finite group as an additive homomorphism on complex-valued functions.
  - name: GlobalTheory.BI.virt_mul_comap_conj_ind_linear
    gloss: >-
      Complex virtual characters on a finite group are conjugation-invariant and closed under pointwise products,
      include all linear characters, pull back to virtual characters along homomorphisms, and include every induction
      of a virtual character from a subgroup.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
