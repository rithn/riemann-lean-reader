      space of equivariant maps from one to the other is zero.
  - name: GlobalTheory.Shin.invariants_bot_of_quot
    gloss: >-
      If a representation admits no nonzero equivariant map to a target, then neither does any irreducible quotient
      of that representation.
  - name: GlobalTheory.Shin.sum_trace_smul_eq_zero
    gloss: >-
      For complex representations ρ₀ and ρ of a finite group G with ρ₀ on ℂᵐ, if every equivariant map from ρ₀ to
      ρ is zero, then ∑g tr(Bρ₀(g⁻¹))ρ(g) = 0 for every endomorphism B of ℂᵐ.
  - name: GlobalTheory.Shin.kills_twist_of_pair_ne_zero
