- module: Development.AbelianVarietyTheory.PublishedTheorems.Divisors₂.IsCMTypeEmbedding
  depth: 7
  lines: 120
  line: >-
    Constructs unitary Hecke characters over CM fields and derives a reflection law for zeros from the Hecke functional
    equation.
  reading: >-
    The chosen embeddings at the infinite places represent the complex-conjugation orbits, and the least local levels
    form a finitely supported family of conductor exponents. Over a CM field, a unitary character with the same
    nonzero infinity exponent at every place is constructed by extending a character from an open subgroup of the
    ideles. Inversion preserves unitarity and negates the exponents, so the strip-bound hypothesis supplies both
    completions. The functional equation has a nowhere-zero prefactor, giving the zero correspondence between the
    character at s and its inverse at 1 − s, which is used to prove nonvanishing at certain integers.
  key_decls:
  - name: GlobalTheory.Published.HeckeFEModel.isCMType_embedding
    gloss: Every complex embedding is the chosen embedding of a unique infinite place or its complex conjugate.
  - name: GlobalTheory.Published.HeckeFEModel.exists_exponents
    gloss: >-
      Every Hecke character has a finitely supported family of least local levels indexed by the finite places.
  - name: GlobalTheory.Published.HeckeFEModel.exists_unitary
    gloss: >-
      Every CM field admits a unitary Hecke character with the prescribed exponent expT(E) at every chosen infinite-place
      embedding.
  - name: GlobalTheory.Published.HeckeFEModel.hypotheses_inhabited
    gloss: >-
      Over every CM field there are CM-type data, a unitary Hecke character with a nonzero infinity exponent, and
      finite conductor data, with both completions supplied by the strip-bound hypothesis.
  - name: GlobalTheory.Published.HeckeFEModel.zero_iff
    gloss: >-
      Assuming the Hecke functional equation, the completed L-function of a unitary Hecke character over a totally
      complex field with nontrivial CM-type infinity data vanishes at s exactly when the completed L-function of
