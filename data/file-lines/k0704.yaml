- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.DetCharEqOneOfHasWt
  depth: 8
  lines: 123
  line: >-
    Constructs a Hecke character of a CM field with the same explicit nonzero exponent at every infinite place.
  reading: >-
    The common exponent is twice the order of the torsion subgroup of the integer units. It kills the phase of every
    embedded integer unit because the square of that phase is the image of the torsion unit obtained by dividing
    the unit by its complex conjugate. Principal ideles that are units at every finite place come from integer units,
    so the model character agrees there with the trivial character and the unitary extension theorem enforces triviality
    on all principal ideles. IsCMTypeEmbedding uses the phase identity in its unitary existence theorem.
  key_decls:
