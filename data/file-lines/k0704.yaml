  depth: 7
  lines: 195
  line: >-
    Constructs archimedean and ℓ-adic power characters on ideles and proves that the archimedean identity component
    is open.
  reading: >-
    Finite products of integer powers along embeddings define continuous idele characters at infinity and at the
    places over ℓ, and the archimedean product on principal ideles is the product over field embeddings. Local connectedness
    of the open archimedean unit group gives openness of its identity component. Nonzero field elements are dense
    in the archimedean unit group, and those in the identity component are totally positive by the intermediate
    value theorem. IsOpenKerOfInfConn uses these facts to extend an archimedean power formula from totally positive
    field elements to the identity component.
  key_decls:
