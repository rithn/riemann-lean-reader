    The archimedean value on a nonzero field element is algebraic because it is a product of integer powers of its
    complex embeddings. At a given finite place, the proof principalizes a positive power of the prime ideal and
    uses triviality on principal ideles to relate its generator’s local and archimedean values. Raising to a common
    exponent kills the finite-unit factors, so a positive power of the uniformizer value is algebraic. One importer
    restates the uniformizer theorem, and another uses the embedding lemma to prove algebraicity of finite idele
    values under a restriction hypothesis.
