    hypothesis.
  reading: >-
    Each index in Ψ gives an embedding in the host CM type by transporting the distinguished embedding through the
    corresponding Galois automorphism. The proof uses the inverse Galois correspondence to recover the original
    index. Under the hypothesis giving the cardinality of Ψ, divisibility by four follows from the power of two
    dividing the frame order. The CM-type membership lemma is used in OnePsi to identify the unique Ψ-index above
    each infinite place of F.
