- module: Formalism.PeriodIntegrals.UnitaryGroupMassFormula.InfinityTypeCharacter.ExtensionEmbeddingAlgebraMap
  depth: 25
  lines: 38
  line: >-
    Extends complex embeddings continuously to their infinite-place completions and defines normalization on ℂˣ.
  reading: >-
    The canonical embedding of an infinite-place completion into ℂ restricts to the representative embedding of
    that place. For a prescribed embedding inducing the same place, either the canonical map or its complex conjugate
    gives a continuous extension. The normalization z ↦ z/|z| is multiplicative by multiplicativity of the complex
    modulus. ContinuousUnitsMap combines these constructions to define the normalized archimedean factors of an
    idele character.
  key_decls:
  - name: PI.InfTypeCharW.normalize
    gloss: Defines the multiplicative homomorphism on ℂˣ sending z to z/|z|.
  - name: PI.InfTypeCharW.extensionEmbedding_algebraMap
    gloss: >-
      The canonical embedding of the completion at w into ℂ agrees on the number field with the representative embedding
      of w.
  - name: PI.InfTypeCharW.exists_ext
    gloss: >-
