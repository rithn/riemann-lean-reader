- module: Formalism.LocalToGlobal.UnitaryNorms.IsUnitaryNormOf
  depth: 7
  lines: 208
  line: Defines Hecke characters of a number field, their local components, and their unitary normalization.
  reading: >-
    Hecke characters are continuous homomorphisms from the ideles to ℂ× that are trivial on the diagonal copy of
    the field’s multiplicative group. The module defines local components, conductor and infinity-type conditions,
    a product-rule predicate, and restrictions formed by multiplying over places above a base-field place. Unramifiedness
    is equivalent to level zero and makes the local value independent of the uniformizer, since two uniformizers
    differ by a local unit. A unitary normalization expresses a character as a unitary character times a norm-power
    character. CharHost uses this relation at exponent 1/2 to define IsEtaAlg.
