- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.FiniteChars
  depth: 7
  lines: 91
  line: >-
    Reduces finiteness of Hecke characters of fixed infinity type and bounded level to finiteness of an idelic quotient.
  reading: >-
    The level subgroup consists of ideles that are units at every finite place and congruent to one modulo the specified
    prime powers. A finite quotient has finitely many complex characters because their values are roots of unity
    of order dividing the quotient order. Dividing by one character of the prescribed type and level gives an injection
    into the characters of the quotient by the principal ideles and the level subgroup, assuming congruence triviality
    and finite index. KeyFinitenessGlobal supplies these hypotheses to obtain Hecke character finiteness.
  key_decls:
