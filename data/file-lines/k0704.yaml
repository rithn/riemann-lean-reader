- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.ContinuousOfValuedEq
  depth: 8
  lines: 142
  line: >-
    Extends number-field automorphisms to maps on the corresponding completions and assembles a continuous homomorphism
    on ideles.
  reading: >-
    A valuation-preserving ring homomorphism is continuous when the source valuation is surjective, by comparison
    of valuation balls at zero. A number-field automorphism extends to continuous maps between the corresponding
    completions, preserving valuations at finite places. The proof assembles the maps through the archimedean product
    and the finite restricted product, then passes to units to obtain an idele homomorphism compatible with principal
    ideles and the local factors. ExistsDvrFrobeniusLift pairs the finite completion maps for a field automorphism
    fixing Q and its inverse to obtain an automorphism of the completion at Q.
  key_decls:
  - name: GlobalTheory.Mem.Chr.continuous_of_valued_eq
    gloss: >-
      A ring homomorphism between rings with valuations in the same ordered value group is continuous if it preserves
      valuation values and the source valuation is surjective.
  - name: GlobalTheory.Mem.Chr.exists_finCompl_map
