    factors specify conductor bounds, and restriction at a subfield place is evaluated on subfield elements by multiplying
    the factors at places above it. The module specifies character families by ramification, restriction, and infinity
    type, and shows how class characters act by twisting. A positive power relation forces every character value
    to have modulus one. An importer uses the norm-power and normalization predicates to construct algebraic eta
    characters by a half-norm twist.
