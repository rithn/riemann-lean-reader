- module: Development.AbelianVarietyTheory.Proofs.TwistedOperators.ExistsSmoothMulExtensionOfContinuousChar
  depth: 8
  lines: 151
  line: >-
    Extends continuous characters of archimedean units to multiplicative functions smooth on the unit locus.
  reading: >-
    The extension is defined by zero on nonunits, and the unit locus is exactly the set of points of nonzero mixed
    norm. Convolution with a smooth compactly supported bump makes a continuous character of a finite-dimensional
    real vector space a nonzero constant multiple of its smooth convolution. Applying this to the pullback by coordinatewise
    exponentiation gives smoothness at the identity via the local logarithm, and multiplicative translation gives
    smoothness at every unit. The norm-twist construction uses the extension to obtain a smooth, degree-zero archimedean
    factor for a unitary Hecke character.
