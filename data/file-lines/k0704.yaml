    extend triviality on embedded nonzero field elements to each finite completion and from the archimedean diagonal
    to the full archimedean product. Factoring off finitely many uniformizer powers then gives triviality on all
    ideles, since the remaining finite unit part is handled by local triviality. FiniteInfinitePlaceProduct uses
    this criterion to prove rigidity for Hecke characters whose uniformizer values are one at almost all finite
    places.
