- module: Development.AbelianVarietyTheory.Definitions.Foundations.AbsCharNotUnitary
  depth: 8
  lines: 437
  line: >-
    Constructs complex powers of the idelic norm and proves the product rule for Hecke characters on principal ideles.
  reading: >-
    The norm powers exponentiate the weighted archimedean log sum minus the log of the associated fractional ideal
    norm, a difference that vanishes on principal ideles. Purely imaginary powers are unitary, and the exponent-one
    character has modulus less than one on a finite uniformizer idele. Convergence of finite-place truncations gives
    the product rule by continuity. The module also constructs faithful characters of prime-field unit groups and
    obtains algebraic eta characters by a half-norm twist. An importer uses the exponent-one twist to exhibit a
    nonunitary rank-one cuspidal representation.
  key_decls:
  - name: GlobalTheory.Mem.Chr.CharModel.absChar
    gloss: >-
      For each complex exponent s, constructs the Hecke character sending an idele a to exp(s times the logarithmic
      idelic norm of a).
  - name: GlobalTheory.Mem.Chr.CharModel.absChar_isAbsPow
    gloss: >-
      For real s, the norm power is trivial on finite local units, takes a uniformizer to the prime ideal norm raised
      to −s, and takes an archimedean diagonal to the product of the embedding moduli raised to s.
  - name: GlobalTheory.Mem.Chr.CharModel.absChar_not_unitary
    gloss: The idelic norm character at exponent one is nonunitary.
  - name: GlobalTheory.Mem.Chr.CharModel.productRule
    gloss: >-
      On a principal idele, the archimedean factor, the local factors at a finite set containing the ramified places,
