- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.ExistsOddPrimeGtTwoBounds
  depth: 9
  lines: 112
  line: >-
    Proves existence of algebraic Hecke characters of prescribed infinity type over CM fields, unramified above
    a given prime.
  reading: >-
    For a CM field and a rational prime ℓ, any integral infinity type whose exponents on conjugate embeddings sum
    to a common weight w₀ is realized by a Hecke character unramified at every place above ℓ. The proof chooses
    an auxiliary prime q exceeding 2, ℓ, and the number of roots of unity, and uses a parity identity to show that
    the prescribed phase character is trivial on units congruent to 1 modulo q. It extends the phase on the intersection
    of unit and congruence ideles with trivial restriction to diagonal Eˣ, then twists by the idelic norm to the
    power w₀/2. GaloisStatementOfSmall uses the character to construct a rank-one crystalline Galois representation
    with prescribed weights.
