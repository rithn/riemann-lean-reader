    ray class quotient. For each base datum and gap parameter, the proof constructs a finite set of triples consisting
    of a prime above the auxiliary prime, a prime of the extension above it, and an indexed tuple of Hecke characters
    of prescribed infinity types. The characters have level at most two at places above the selected base prime
    or a prime in S1 and are unramified elsewhere. Grid data give triples in this set, which transfers across stages
    sharing the base datum. The grid existence argument in evLgG_gridA_of_join uses this uniform finiteness.
  key_decls:
