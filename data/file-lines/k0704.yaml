      A field automorphism carrying one finite place to another extends to a continuous valuation-preserving ring
      homomorphism between their completions.
  - name: GlobalTheory.Mem.Chr.exists_infCompl_map
    gloss: >-
      A field automorphism extends continuously from the completion at the pullback of an infinite place to the
      completion at that place.
  - name: GlobalTheory.Mem.Chr.conjPl_symm_iff
    gloss: >-
      An automorphism carries one finite place to another exactly when its inverse carries the second place back
      to the first.
  - name: GlobalTheory.Mem.Chr.exists_isConjI
    gloss: >-
      Every number-field automorphism induces a continuous idele homomorphism that agrees with it on principal ideles,
