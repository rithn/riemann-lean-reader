      of the maximal ideal at each place in S.
  - name: GlobalTheory.LevelChars.finite_chars
    gloss: >-
      Only finitely many complex characters of an abelian group are trivial on a given finite-index subgroup.
  - name: GlobalTheory.LevelChars.heckeFin_of
    gloss: >-
      Assuming congruence triviality and finite index, only finitely many Hecke characters have a prescribed infinity
      type, are unramified off a fixed finite set, and satisfy a common local level bound on that set.
