- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.ContinuousInfIdele
  depth: 8
  lines: 98
  line: >-
    Equates the diagonal and place-by-place formulas for the archimedean type of a continuous idele character.
  reading: >-
    Choose one embedding into ℂ for each infinite place and prescribe an integer power of the unit phase of its
    value on a nonzero field element. The character has the resulting product formula on diagonally embedded nonzero
    field elements in the archimedean ideles if and only if it has the prescribed formula at each place on the image
    of those elements. The proof extends the embeddings to the completions and uses density and continuity to isolate
    each factor, while the reverse implication multiplies the local formulas. CmHeckeCharacterInfinityType uses
    the equivalence to compute local components of CM Hecke characters.
  key_decls:
  - name: GlobalTheory.InfTypeLocal.denseRange_atInf
    gloss: >-
      The multiplicative group of a number field embeds diagonally with dense image in the product of the multiplicative
      groups of its archimedean completions.
  - name: GlobalTheory.InfTypeLocal.continuous_infIdele
    gloss: >-
      Inserting a nonzero element of an archimedean completion at its place and placing one at every other place
      defines a continuous map into the ideles.
