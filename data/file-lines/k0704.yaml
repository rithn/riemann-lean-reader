- module: Development.AbelianVarietyTheory.Proofs.IwasawaDecomposition.ExistsProdInfMulFinPart
  depth: 8
  lines: 104
  line: >-
    Factors ideles into archimedean and finite parts and shows that local tests determine continuous idele characters.
  reading: >-
