- module: Development.AbelianVarietyTheory.Definitions.AutomorphicMembership.IsOpenKerFinIdele
  depth: 7
  lines: 197
  line: >-
    Proves open kernels for finite idele characters and gives exponential, smoothness, and growth results for characters
    of complex tori.
  reading: >-
    For a continuous finite idele character, the kernel contains a congruence neighborhood whose elements have all
    powers mapped within distance 1/2 of 1. On a finite product of copies of ℂ×, lifting through the complex exponential
    gives a real-linear exponent L. The extension by zero is smooth at units, has derivative L at the identity,
    and the character is polynomially bounded in a common bound for the input and its inverse. Direct importers
    use these results to find congruence subgroups in idele character kernels and to identify the exponential formula
    for archimedean Hecke characters.
  key_decls:
  - name: GlobalTheory.CuspRep.isOpen_ker_finIdele
    gloss: Every continuous homomorphism from a number field’s finite idele group to ℂ× has open kernel.
  - name: GlobalTheory.CuspRep.exists_lin
    gloss: >-
      After precomposition with the coordinatewise exponential, a continuous character of a finite product of copies
      of ℂ× is the exponential of a continuous real-linear map L to ℂ.
  - name: GlobalTheory.CuspRep.contDiffAt_extZero
    gloss: >-
      Extending a continuous character by zero gives a function that is smooth over ℝ at every point with all coordinates
      nonzero.
  - name: GlobalTheory.CuspRep.fderiv_extZero
    gloss: The real Fréchet derivative at the identity of the extension by zero is the real-linear exponent L.
  - name: GlobalTheory.CuspRep.exists_bound
    gloss: >-
      For each continuous character there are constants C ≥ 0 and N ∈ ℕ such that its absolute value at u is at
      most C B^N whenever B ≥ 1 bounds the sup norms of u and u⁻¹.
