    notes: ''
- module: Development.DiscreteGroups.GlobalIrreducibility.ExistsElliptic
  depth: 16
  lines: 78
  line: >-
    Realizes full-degree finite-field elements as elliptic matrix eigenvalues and bounds the exceptional Frobenius
    fixed sets.
  reading: >-
    For prime g and K/F_g of degree n, multiplication by a unit z of degree n gives a matrix in GLₙ(F_g) whose characteristic
    polynomial equals the minimal polynomial of z, by Cayley–Hamilton and degree comparison. A unit of smaller degree
    lies in a proper subfield and is fixed by the ith power of Frobenius for some 1 ≤ i ≤ ⌊n/2⌋. For each i > 0,
    the fixed units are roots of X^(g^i) − X, so there are at most g^i of them. OrbitOfAgree uses these lemmas to
    bound the exceptional set and apply its character-agreement hypothesis to the remaining units.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.Kon.exists_elliptic
    gloss: >-
      Every unit of degree n in a degree-n extension of F_g is a root of the irreducible characteristic polynomial
      of some matrix in GLₙ(F_g).
  - name: DiscreteGroups.sglob.DzType.Kon.bad_of_deg
    gloss: >-
      A unit of degree less than n in a degree-n extension of F_g satisfies z^(g^i) = z for some 1 ≤ i ≤ ⌊n/2⌋.
  - name: DiscreteGroups.sglob.DzType.Kon.card_fixed_le
    gloss: For each positive i, at most g^i units in a finite extension of F_g satisfy z^(g^i) = z.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
