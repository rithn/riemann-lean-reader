- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.CentralUnit
  depth: 8
  lines: 204
  line: Constructs tame Weil–Deligne parameters for depth-zero cuspidal representations of GL(n) over ℚₚ.
  reading: >-
    The construction uses the Frobenius orbit of the regular finite-field character naming the finite cuspidal type
    to build an irreducible n-dimensional parameter with zero monodromy. It fixes the determinant on a Frobenius
    lift via the central character and matches it on inertia by comparing scalar actions through a type intertwiner
    and using the finite-field norm. The inertia polynomial is independent of the auxiliary residue-field realization
    and the representative of the character’s Frobenius orbit. GoodMap uses this existence theorem to construct
    its parameter assignment on the depth-zero cuspidal locus.
  key_decls:
  - name: UpperTheory.Zero.LLC.parEx
    gloss: >-
      At a completion continuously isomorphic to ℚₚ, every depth-zero cuspidal representation of GL(n) admits an
      irreducible tame n-dimensional Weil–Deligne parameter that matches its central character via local Artin reciprocity
      and satisfies the finite-type inertia formula.
  - name: UpperTheory.Zero.LLC.eta
