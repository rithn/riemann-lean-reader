- module: >-
    Development.WeilBound.RepresentationTheoryGL.GaloisPermutationReps.SubquotientEquivalence.ConjTorusSubApply
  depth: 6
  lines: 220
  line: >-
    Identifies the first congruence subgroup invariants of an irreducible smooth GL(n) representation with the image
    of a cuspidal type.
  reading: >-
    For an irreducible smooth GL(n) representation over a nonarchimedean local field with central character, an
    embedded nonzero cuspidal representation of the residue-field GL(n), inflated along reduction, fills the first
    congruence subgroup invariants. In the Cartan decomposition, scalar diagonals preserve the type image, while
    non-scalar diagonals send it into the kernel of passage to congruence subgroup coinvariants by averaging over
    a finite unipotent radical. Irreducibility makes the translates span, and compact averaging identifies invariants
    with coinvariants. The fixed-space equality is used in proving depth-zero counting.
  key_decls:
  - name: PositivityTheory.Rg.DzCount.B.st6
    gloss: >-
      The image of a nonzero cuspidal type equals the first congruence subgroup fixed space in an irreducible smooth
      representation with central character.
  - name: PositivityTheory.Rg.DzCount.B.TorusConjugationFixed.range_le_fixed
    gloss: >-
      The image of any type map is fixed by the first congruence subgroup because the action on its source factors
      through reduction.
  - name: PositivityTheory.Rg.DzCount.B.TorusConjugationFixed.conj_torus_sub_apply
    gloss: If the diagonal entries are ϖ^{a_i}, conjugation multiplies the (i,j)-entry of g − 𝟙 by ϖ^{a_i−a_j}.
  - name: PositivityTheory.Rg.DzCount.B.TorusConjugationFixed.torus_mem_twKer
    gloss: >-
      A uniformizer diagonal with nonconstant exponents sends the cuspidal type image into the kernel of passage
      to first congruence subgroup coinvariants.
  - name: PositivityTheory.Rg.DzCount.B.TorusConjugationFixed.apply_mem_sup
    gloss: >-
      With a central character, every group translate of a cuspidal type vector lies in the sum of the type image
