- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.TypeIff
  depth: 6
  lines: 59
  line: Proves the equivalence of two formulations of the depth-zero cuspidal inertia law.
  reading: >-
    For representations containing the specified inflated finite cuspidal type under a continuous identification
    with ℚ_g, both formulations require zero monodromy and express the inertia characteristic polynomial using the
    Frobenius conjugates of the matching regular finite-field character. One computes the residue of a local Artin
    image at an auxiliary place, and the other evaluates a residue homomorphism directly on base inertia. The proof
    passes between them by lifting and restricting inertia elements and approximating Artin images by algebraic
    integers with the same residue. The local Langlands existence and uniqueness proofs use opposite directions
    of the equivalence.
  key_decls:
  - name: UpperTheory.Zero.LLC.typeIff
    gloss: >-
      A Weil–Deligne parameter map satisfies the depth-zero type law if and only if it satisfies the equivalent
