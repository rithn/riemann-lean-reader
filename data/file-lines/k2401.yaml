- module: Development.DiscreteGroups.GlobalIrreducibility.DzDigMain
  depth: 14
  lines: 39
  line: Proves that shifted digit sums determine a base-p rotation orbit modulo pⁿ − 1.
  reading: >-
    For prime p > 16n² and n ≥ 2, set N = pⁿ − 1 and e = N/(p − 1). If k and k′ each have n distinct rotations modulo
    N and the base-p digit sums of uk and uk′ modulo N change equally under every shift by a multiple of e for every
    unit u modulo N, then k′ ≡ pʲk mod N for some j. The proof first matches the integer quotients by e after a
    rotation for each u, then uses a covering count and the bound φ(N) > 2ne to force an exact congruence. This
    supplies the digit-sum step in the Gauss-sum criterion for matching tame parameters.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.dig
    gloss: >-
      For prime p > 16n² and n ≥ 2, if each exponent has n distinct rotations modulo N = pⁿ − 1 and their base-p
      digit sums modulo N change equally for all unit multipliers and shifts by multiples of N/(p − 1), then the
      exponents differ by multiplication by a power of p modulo N.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
