  reading: >-
    For two functions with inverse left Whittaker characters induced by a nontrivial additive character via the
    superdiagonal sum, right lower-triangular invariance of one confines its support to the product of the upper
    unitriangular and lower triangular subgroups. The factorization there is unique, and the characters cancel in
    the product sum. In the next rank, summing a Whittaker eigenvector over the embedded lower triangular subgroup
    gives a fixed vector whose Whittaker functional value comes entirely from the identity term. The proof of lFinPair
    applies the finite functional equation to this fixed vector.
