    as powers of a faithful Teichmüller character, then applies invariant-subspace Möbius inversion to the resulting
    root power sums. For regular labels it obtains the degree, Green’s signed Frobenius sum at a unit root of the
    irreducible characteristic polynomial, and equality exactly along Frobenius orbits via inner products. A count
    using irreducible polynomial labels proves exhaustiveness. The proof of lKondo uses the exhaustive family to
    insert the explicit formula into its character sum.
  key_decls:
