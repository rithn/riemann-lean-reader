    and the trace is to the prime field. Trace invariance and nondegeneracy of the trace pairing force any power
    of the automorphism that preserves the character to fix b, hence to act identically on the field. The direct
    importer pulls the character's orbit back along an inertia quotient to obtain distinct inertia characters indexed
    modulo the automorphism's order.
