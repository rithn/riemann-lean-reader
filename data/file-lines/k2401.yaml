- module: Development.DiscreteGroups.GlobalIrreducibility.DzDigCover
  depth: 15
  lines: 101
  line: Bounds Euler’s totient by counting modular differences between residues that lie in the same block.
  reading: >-
    If k′ differs modulo N from every k pʲ with j < n, and each unit multiplier sends k′ and some k pʲ into the
    same block of width e, then φ(N) ≤ 2n(e − 1). The proof covers the units by two sets per exponent, one for each
    sign of the residue difference, and bounds each set by counting multiples of a gcd. The proof of dig uses the
    totient bound to force k′ ≡ k pʲ modulo pⁿ − 1 for some j < n.
  key_decls:
  - name: DiscreteGroups.sglob.DzDig.totient_le
    gloss: >-
      For N, e > 0, if k′ is incongruent to every k pʲ for j < n but every unit multiplier puts the least residues
      of k′ and some k pʲ at the same integer quotient by e, then φ(N) ≤ 2n(e − 1).
  - name: DiscreteGroups.sglob.DzDig.cover_bound
    gloss: >-
      For natural N, e and D, at most max(e − 1, 0) integers u with 0 ≤ u < N have the least residue of uD strictly
      between 0 and e.
  - name: DiscreteGroups.sglob.DzDig.diff_mod
    gloss: >-
      For N > 0, if the least residue of ua modulo N is at least that of ub, their ordinary difference is the least
      residue of u times the modular difference a − b.
  blueprint: []
  status: fixed
  check:
