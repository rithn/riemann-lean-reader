- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.IsoUniq
  depth: 8
  lines: 53
  line: >-
    Proves uniqueness of p and of a continuous isomorphism from ℚₚ to a characteristic-zero nonarchimedean local
    field admitting one.
  reading: >-
    Continuity carries the powers of p to a sequence tending to zero, so p lies in the maximal ideal of the target
    valuation ring. If two distinct primes lay there, Bézout’s identity would put 1 in the same ideal. For a fixed
    p, continuous field isomorphisms agree on the dense copy of ℚ and hence agree everywhere. CentralUnit uses this
    uniqueness to identify the prime and field isomorphism when comparing finite-type inertia formulas.
  key_decls:
  - name: UpperTheory.Zero.LLC.isoUniq
    gloss: >-
      For a fixed nonarchimedean local field of characteristic zero, any two continuous identifications with p-adic
      rational fields have the same prime, and the continuous isomorphism from that ℚₚ is unique.
  - name: val_natCast_lt_one
    gloss: >-
      A continuous field isomorphism from ℚₚ sends p to an element of multiplicative valuation strictly less than
      one.
  - name: val_intCast_le_one
    gloss: Every integer maps into the valuation ring, so its multiplicative valuation is at most one.
