    polynomial. The field trace is the negative of the coefficient immediately below the leading term of the minimal
    polynomial raised to the degree of K over the subfield generated by the element. For a field K of size gⁿ, the
    embedding identifies Kˣ with the (gⁿ − 1)-st roots of unity, and complex conjugation inverts the linked character
    values. The proof of lKondo uses these identities to express its character sum in terms of the Gauss sum.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.Kon.aC_eq_gs
    gloss: >-
      When the multiplicative character θ on Kˣ is linked to the ambient character power, the coefficient aC equals
      the Gauss sum for θ⁻¹ and the trace pullback of ψ₀, divided by gⁿ − 1.
  - name: DiscreteGroups.sglob.DzType.Kon.trace_eq_hT
    gloss: >-
