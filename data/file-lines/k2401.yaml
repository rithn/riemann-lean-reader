- module: Development.DiscreteGroups.GlobalIrreducibility.DzStickValSub
  depth: 18
  lines: 107
  line: >-
    Proves a base-p digit-sum bound for Gauss-sum valuations and an exact product formula for complementary exponents.
  reading: >-
    The Jacobi-sum identity bounds the product of two Gauss-sum valuations by the valuation for the product character
    when that character is nontrivial. Frobenius reindexing leaves the Gauss sum unchanged when its multiplicative
    character is raised to p, so induction on the base-p digits gives the lower bound in the multiplicative valuation.
    For 0 < a < pᶠ − 1, the inverse-character Gauss-sum identity gives the exact product of the valuations at a
    and pᶠ − 1 − a. DzStickValMain combines the bounds with this product formula to obtain equality.
  key_decls:
  - name: DiscreteGroups.sglob.Stick.GSDatum.val_mul_le
    gloss: >-
      For a nontrivial product character, the product of the two Gauss-sum valuations is at most the Gauss-sum valuation
      for that product character.
