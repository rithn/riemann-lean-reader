  reading: >-
    A continuous field isomorphism from ℚₚ to a number-field completion identifies GL(n, ℤₚ) with the subgroup of
    matrices whose entries and inverse entries are integral. Surjectivity follows by lifting the matrix and its
    inverse entrywise and checking their inverse identities by injectivity. Transporting reduction modulo p across
    this isomorphism gives a surjection onto GL(n, 𝔽ₚ) with kernel the first principal congruence subgroup.
