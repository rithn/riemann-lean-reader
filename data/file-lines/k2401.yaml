    Cuspidals receive irreducible parameters of dimension n, compatible with real norm twists and central-character
    absolute values. The proof uses Artin reciprocity in rank one, extends depth-zero parameters over Q_p by character
    twists, and uses norm twists of auxiliary parameters for the remaining cuspidals. Rank-one characters and twists
    of depth-zero cuspidals over Q_p are determined by their parameters among cuspidals and satisfy twist, duality,
