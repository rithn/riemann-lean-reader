      are cuspidal of degree ∏_{i=1}^{d−1}(gⁱ − 1) and take the value (−1)^(d−1) ∑_{i=0}^{d−1} θ(z^(gⁱ)) on a matrix
      with irreducible characteristic polynomial and unit root z in the degree-d extension, with two regular labels
