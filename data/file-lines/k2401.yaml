    gloss: >-
      For a degree −1 Frobenius element one can choose a tame inertia generator satisfying the q-power relation
      on tame Weil actions, such that irreducibility gives a jointly irreducible pair and an isomorphism of pairs
      lifts to a Weil–Deligne isomorphism when both Weil actions are irreducible.
