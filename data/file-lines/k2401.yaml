- module: Development.DiscreteGroups.GlobalIrreducibility.DzGenVec
  depth: 19
  lines: 70
  line: >-
    Defines a function on GL_m(k) weighted by the square root of the Borel modulus on the double coset B w₀ S.
  reading: >-
    For a nonarchimedean local field k, the function is zero off B w₀ S, where B is the singleton-block parabolic,
    w₀ reverses the coordinates, and S is a subgroup. If every diagonal entry of every element of S is a valuation-ring
    unit, the value at b w₀ s is the square root of the modulus of b, independent of the factorization. The proof
    compares two Borel factors via conjugation by w₀, which permutes the diagonal entries. Under the same diagonal-unit
    hypothesis, InCellMulRightIff uses the formula to show that left multiplication by b ∈ B scales the function
    by the square root of the modulus of b and right multiplication by s ∈ S preserves it.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.dl
    gloss: >-
      Defines the square root of the modulus character on the singleton-block parabolic via the Levi projection.
  - name: DiscreteGroups.sglob.DzType.dl_eq_one
    gloss: Shows that the square root of the modulus is one when all diagonal entries are valuation-ring units.
  - name: DiscreteGroups.sglob.DzType.InCell
    gloss: Expresses membership in B w₀ S by the existence of a factorization b w₀ s.
  - name: DiscreteGroups.sglob.DzType.cellFun
    gloss: Assigns the square root of the modulus of a chosen Borel factor on B w₀ S and zero elsewhere.
  - name: DiscreteGroups.sglob.DzType.cellFun_eq
    gloss: >-
      Evaluates the function at b w₀ s as the square root of the modulus of b whenever all diagonal entries of all
      elements of S are valuation-ring units.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review sample-01 (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.DiscreteGroups.GlobalIrreducibility.DzStickValOne
  depth: 19
  lines: 113
  line: >-
    Proves that the Gauss sum for the inverse character ω⁻¹ has the same valuation at Q as ζ − 1 when p^f > 2.
  reading: >-
    Over a finite field of characteristic p, summing x⁻¹Tr(x) gives −1 by expanding the trace into Frobenius powers.
    The lifted trace sum is therefore congruent to −1 modulo Q. Expanding the additive character to first order
    in ζ − 1 and using cancellation of the nontrivial multiplicative character gives g(1) = (ζ − 1)(−1 + y) with
    y in Q, so the second factor has valuation one. The direct importer uses this equality to prove a multiplicative
    valuation bound in terms of the base-p digit sum of the Gauss sum index.
  key_decls:
  - name: DiscreteGroups.sglob.Stick.sum_inv_mul_trace
    gloss: >-
      Shows that the sum of x⁻¹Tr(x) over a finite field of characteristic p is −1, with trace to the prime field.
  - name: DiscreteGroups.sglob.Stick.exists_pow_eq_one_add
    gloss: >-
      Shows in any commutative ring that ζⁿ is congruent to 1 + n(ζ − 1) modulo the ideal generated by (ζ − 1)².
  - name: DiscreteGroups.sglob.Stick.GSDatum.sum_inv_val_add_one_mem
    gloss: Shows that the sum of the integer trace representatives weighted by ω⁻¹ is congruent to −1 modulo Q.
  - name: DiscreteGroups.sglob.Stick.GSDatum.exists_g_one_eq
    gloss: Factors g(1) as (ζ − 1)(−1 + y) for some y in Q when p^f > 2.
  - name: DiscreteGroups.sglob.Stick.GSDatum.val_g_one
    gloss: Identifies the multiplicative valuation at Q of g(1) with that of ζ − 1 when p^f > 2.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.DiscreteGroups.GlobalIrreducibility.DzStickValBasic
  depth: 20
  lines: 114
  line: >-
    Relates the valuations of p and ζ − 1 and proves character identities for Gauss sums over finite fields.
  reading: >-
    For prime p, evaluating the pth cyclotomic polynomial at 1 shows that p is a unit multiple of (ζ − 1)^(p−1)
    for a primitive pth root ζ, giving the corresponding identity of multiplicative valuations at Q. Over the field
    of p^f elements, the additive trace character is primitive and Frobenius invariant, the distinguished character
    ω reducing modulo Q to the given field embedding has order p^f − 1, and g(0) = −1. When 1 < p^f − 1, the direct
    importer computes the valuation of g(1) using the trace-character formula, ζ − 1 ∈ Q, and ω_pow_ne_one at exponent
    one to show that ω⁻¹ is nontrivial.
  key_decls:
  - name: DiscreteGroups.sglob.Stick.associated_prime_pow
    gloss: >-
      For prime p, shows that p and (ζ − 1)^(p−1) differ by a unit in an integral domain containing a primitive
      pth root ζ.
  - name: DiscreteGroups.sglob.Stick.psi_isPrimitive
    gloss: >-
      Proves that the additive trace character defined by a primitive pth root is primitive, using surjectivity
      of the finite-field trace.
  - name: DiscreteGroups.sglob.Stick.GSDatum.val_p
    gloss: Identifies the multiplicative valuation of p at Q with the (p−1)st power of the valuation of ζ − 1.
  - name: DiscreteGroups.sglob.Stick.GSDatum.ω_pow_ne_one
    gloss: Shows that every power ω^a with 0 < a < p^f − 1 is nontrivial.
  - name: DiscreteGroups.sglob.Stick.GSDatum.g_zero
    gloss: Evaluates the Gauss sum with trivial multiplicative character as −1.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Development.DiscreteGroups.GlobalIrreducibility.ValuationUnitriLt
  depth: 20
  lines: 74
  line: >-
    Proves that if the reduction of an integral product LU is lower triangular with invertible diagonal, then U
    reduces to the identity.
  reading: >-
    Here L is lower triangular, U is upper unitriangular, and reduction is modulo the maximal ideal of the valuation
    ring. The proof inducts on the rows of U, bounding the entries of the corresponding row of L from left to right.
    The diagonal entry of LU then forces the diagonal entry of L to be a valuation-ring unit, and the ultrametric
    inequality puts the strictly upper entries of U in the maximal ideal.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.valuation_unitri_lt
    gloss: >-
      For lower triangular L and upper unitriangular U, if LU has entries in the valuation ring, diagonal entries
      of valuation one, and strictly upper entries of valuation less than one, then every strictly upper entry of
      U has valuation less than one.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
