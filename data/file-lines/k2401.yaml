- module: Development.AutomorphicArithmetic.WhittakerHecke.ExistsAdicCompletionRingEquivExtendingOfStable
  depth: 8
  lines: 90
  line: >-
    Proves that a prime-stabilizing automorphism of a number field extends continuously to its completion and preserves
    the valuation.
  reading: >-
    Stability of the prime ideal implies stability of all its powers, which determines the valuation on the ring
    of integers. Applying the resulting inequality to the automorphism and its inverse gives equality, which passes
    to the field by taking fractions. Density makes the continuous extensions of the two maps inverse to one another
    and carries valuation preservation to the completion. The direct importer uses the extension of an automorphism
    induced by Frobenius to identify its action on the residue field.
  key_decls:
  - name: intValuation_le_of_equiv
    gloss: >-
      An automorphism of the ring of integers stabilizing a nonzero prime ideal does not increase its multiplicatively
      written valuation.
  - name: intValuation_eq_of_equiv
    gloss: >-
      An automorphism of the ring of integers stabilizing a nonzero prime ideal preserves the associated valuation
      on integral elements.
  - name: valuation_eq_of_equiv
    gloss: >-
      A number-field automorphism stabilizing a nonzero prime ideal of the ring of integers preserves that prime's
      valuation on the whole field.
  - name: UpperTheory.exists_adicCompletion_ringEquiv_extending_of_stable
