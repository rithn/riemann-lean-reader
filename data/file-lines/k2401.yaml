- module: >-
    Development.WeilBound.RepresentationTheoryGL.GaloisPermutationReps.SubquotientEquivalence.EquivariantPartsOfFiniteType
  depth: 6
  lines: 164
  line: >-
    Gives an M-eigenvalue of exact q-power period dim V for jointly irreducible invertible M, G on finite-dimensional
    complex V with MG = GM^q.
  reading: >-
    For invertible operators M and G on a nonzero finite-dimensional complex space V, assume MG = GM^q and joint
    irreducibility. Iterating G carries an M-eigenvector of eigenvalue z to eigenvectors with eigenvalues z^(q^i),
    and finiteness of the spectrum yields a periodic eigenvalue. For its least period d, a G^d-eigenvector in the
    corresponding M-eigenspace generates d independent iterates whose span is stable under both operators, so d
    = dim V. The exact-period theorem is used to label tame Weil–Deligne representations and in the proof of tame
    uniqueness.
  key_decls:
  - name: PositivityTheory.Rg.DzCount.st1a
    gloss: >-
      For a jointly irreducible pair of invertible operators on a finite-dimensional complex vector space V satisfying
      MG = GM^q, some nonzero eigenvalue of M has least positive period dim V under z ↦ z^q.
  - name: PositivityTheory.Rg.DzCount.eigenvector_maps_power
    gloss: Under MG = GM^q, G sends the z-eigenspace of M into its z^q-eigenspace.
  - name: PositivityTheory.Rg.DzCount.eigenvector_iterate_power
    gloss: Under MG = GM^q, G^i sends the z-eigenspace of M into its z^(q^i)-eigenspace.
  - name: PositivityTheory.Rg.DzCount.pow_pow_pow_add
    gloss: Composing the power maps with exponents q^a and q^b gives the power map with exponent q^(a+b).
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, line). Before and after text: check-log.tsv.
- module: >-
    Development.WeilBound.RepresentationTheoryGL.GaloisPermutationReps.SubquotientEquivalence.ExistsLiftUnipotentRadical
  depth: 6
  lines: 210
  line: >-
    Proves that an irreducible smooth GL(n) representation containing an inflated cuspidal type is cuspidal.
  reading: >-
    For GL(n) over a nonarchimedean local field, reduction maps each integral parabolic unipotent radical onto its
    residue-field counterpart. The lift is obtained entrywise in the strictly upper blocks, with identity diagonal
    blocks. Averaging over the finite radical kills the cuspidal type in the local unipotent coinvariants. The parabolic–maximal
    compact decomposition extends this vanishing to every translate of the type, and irreducibility gives vanishing
    of the entire Jacquet module for each proper parabolic. The cuspidality theorem is used in the depth-zero counting
    argument.
  key_decls:
  - name: PositivityTheory.Rg.DzCount.st5
    gloss: >-
      An irreducible smooth complex representation of GL(n) over a nonarchimedean local field is cuspidal if it
      contains an inflated nonzero cuspidal representation of the residue-field GL(n).
  - name: PositivityTheory.Rg.DzCount.L5.mem_unipotent_radical_iff_alt
    gloss: >-
      A matrix lies in the unipotent radical exactly when its entries agree with the identity outside the strictly
      upper blocks.
  - name: PositivityTheory.Rg.DzCount.L5.unipotent_radical_ne_bot
    gloss: >-
      Over a field, a pair of indices in strictly ordered blocks gives a nonidentity transvection in the unipotent
      radical.
  - name: PositivityTheory.Rg.DzCount.L5.exists_lift_unipotent_radical
    gloss: >-
      Every element of the residue-field unipotent radical lifts to an integral element of the corresponding local
      unipotent radical.
  - name: PositivityTheory.Rg.DzCount.L5.lift_mem_twisted_kernel
    gloss: >-
      If the finite unipotent radical has zero invariants in the source, every vector in the image of a reduction-equivariant
      map vanishes in the corresponding local unipotent coinvariants.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: >-
    Development.WeilBound.RepresentationTheoryGL.GaloisPermutationReps.SubquotientEquivalence.ExistsMaximalStableAvoiding
  depth: 6
  lines: 216
  line: >-
    Embeds irreducible residue-field GL(n) types in smooth irreducible local representations with prescribed central
    value at a uniformizer.
  reading: >-
    An irreducible complex representation of the residue-field GL(n) embeds, after inflation to GL(n) of the valuation
    ring, in a smooth irreducible representation over the local field. Its central character extends that of the
    finite type on units and takes any prescribed nonzero complex value at a uniformizer. The proof takes the cyclic
    span of a nonzero type vector in the depth-zero representation and uses Zorn's lemma to quotient by a maximal
    invariant subspace avoiding that vector. This preserves the entire type by irreducibility and supplies the existence
    step in depth-zero counting.
  key_decls:
  - name: PositivityTheory.Rg.DzCount.st4
    gloss: >-
      For n > 0, every finite-dimensional irreducible complex representation of the residue-field GL(n) admits a
      reduction-equivariant embedding into a smooth irreducible local representation whose central character takes
      a prescribed nonzero value at a chosen uniformizer.
  - name: PositivityTheory.Rg.DzCount.exists_maximal_stable_avoiding
    gloss: >-
      Every nonzero vector in a complex group representation is avoided by an invariant subspace maximal among those
      avoiding it.
  - name: PositivityTheory.Rg.DzCount.quotRep4_irr
    gloss: >-
      Quotienting a cyclic representation by an invariant subspace maximal among those avoiding its generator yields
      an irreducible representation.
  - name: PositivityTheory.Rg.DzCount.subRep4
    gloss: The group action restricts to a representation on any invariant subspace.
