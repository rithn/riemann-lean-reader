  depth: 6
  lines: 255
  line: >-
    Reduces irreducibility and isomorphism of tame Weil–Deligne representations to a tame inertia generator and
    Frobenius.
  reading: >-
    For a tame inertia generator γ and a degree −1 Frobenius element φ, the operators M = ρ(γ) and G = ρ(φ) satisfy
    MG = GM^q, where q is the residue-field size. Smoothness makes the kernel on inertia open, so stability and
    intertwining for these two operators extend to the full Weil action. An irreducible Weil action forces the nilpotent
    monodromy to vanish because its kernel is a nonzero invariant subspace. The two-operator reduction is used to
    construct injective polynomial labels for irreducible tame Weil–Deligne classes of fixed positive dimension
    and fixed eigenvalue product at the chosen Frobenius.
  key_decls:
