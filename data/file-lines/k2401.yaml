    Reduction from the global ring of integers to the residue field of the completion has kernel the prime ideal,
    by the valuation criterion for membership in the maximal ideal. Approximating each local integer by a global
    integer with error of valuation strictly less than one in multiplicative notation proves surjectivity, so the
    quotient by the prime ideal computes the cardinality. The direct importer uses this cardinality to construct
    a residue-field Frobenius automorphism.
