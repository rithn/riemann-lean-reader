  line: >-
    Constructs cyclotomic Gauss-sum data with controlled character powers and computes the effect of norm twists.
  reading: >-
    For K of size pⁿ, set N = pⁿ − 1 and choose a prime above p in ℚ(ζ_{pN}). A primitive N-th root retains its
