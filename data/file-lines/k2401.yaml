- module: Development.AutomorphicArithmetic.WhittakerHecke.ContinuousInertiaRestrictionOfCompat
  depth: 8
  lines: 27
  line: >-
    Proves continuity of a homomorphism between inertia groups that preserves the action on the ambient field.
  reading: >-
    For a tower E ⊆ L ⊆ Ω with E and L number fields, the theorem compares the inertia groups of a fixed valuation
    ring of Ω over E and L. It checks continuity at the identity in the Krull topology: the preimage of each target
    neighborhood contains the source inertia subgroup fixing a suitable finite intermediate field over L, which
    is also finite over E. The direct importer composes this map with local reciprocity to prove that a homomorphism
    to the additive group of a residue field has open kernel.
  key_decls:
  - name: UpperTheory.continuous_inertia_restriction_of_compat
    gloss: >-
      A homomorphism from inertia over E to inertia over L for a fixed valuation ring of Ω is continuous if it sends
      each element to an automorphism with the same action on Ω.
