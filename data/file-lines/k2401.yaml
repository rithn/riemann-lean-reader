    gloss: >-
      At a number-field completion continuously identified with ℚₚ, a smooth irreducible GL(n) representation whose
      pullback contains an inflated finite type on GL(n, ℤₚ) has nonzero first principal congruence fixed vectors
      in its chosen isomorphism-class representative.
