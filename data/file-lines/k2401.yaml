- module: >-
    Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.IsSemisimpleInducedParam
  depth: 9
  lines: 402
  line: >-
    Constructs irreducible Weil–Deligne parameters from Frobenius orbits of inertia characters with prescribed Frobenius
    determinant.
  reading: >-
    The construction uses functions satisfying f(j+n)=bf(j), on which inertia acts diagonally by the orbit characters
    and Frobenius acts by shifting the argument. Distinct inertia characters isolate the coordinate lines, and the
    cyclic shift forces irreducibility. Smoothness gives finite inertia image, so a positive power of each Weil
    operator is a nonzero scalar, proving semisimplicity. The parameter has zero monodromy and is tame when the
    orbit characters are trivial on wild inertia. CentralUnit uses this construction to realize the inertia formula
    for depth-zero cuspidal types.
  key_decls:
  - name: UpperTheory.Zero.LLC.indEx
    gloss: >-
      An orbit of n inertia characters with open kernels gives an irreducible n-dimensional Weil–Deligne parameter
      with those inertia eigencharacters and any prescribed nonzero determinant on a degree-one Frobenius lift.
  - name: UpperTheory.Zero.LLC.InducedExistence.rho0
    gloss: >-
      Defines the Weil action on functions satisfying f(j+n)=bf(j) by combining a shift given by the Weil degree
      with multiplication by an inertia character.
  - name: UpperTheory.Zero.LLC.InducedExistence.isSmooth_inducedParam
    gloss: The Weil action is smooth when the initial inertia character has open kernel.
  - name: UpperTheory.Zero.LLC.InducedExistence.isSemisimple_inducedParam
    gloss: Every Weil element acts semisimply in the smooth construction with n > 0 and b nonzero.
  - name: UpperTheory.Zero.LLC.InducedExistence.det_shift
    gloss: The shift on the space of functions satisfying f(j+n)=bf(j) has determinant (−1)ⁿ⁻¹b.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
