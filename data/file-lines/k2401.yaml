    notes: >-
      Review full-review (minor findings): 2 field edits (key_decls). Before and after text: check-log.tsv.
- module: Development.DiscreteGroups.GlobalIrreducibility.DzDigShift
  depth: 15
  lines: 196
  line: Derives a match between modular residue blocks from equal changes in base-p digit sums.
  reading: >-
    For p ≥ 2 and n ≥ 1, set N = pⁿ − 1 and e = N/(p − 1). For 0 ≤ x < N and 0 ≤ b < p − 1, shifting x by be modulo
    N changes its digit sum by nb minus (p − 1) times the number of indices i < n for which adding be to the least
    residue of pⁱx modulo N reaches or exceeds N. Equal changes for all shifts give equal counts above each block
    threshold, so some pʲ multiple of the first residue lies in the same width-e block as the second. The proof
    of dig uses this match for each unit multiplier to apply a totient bound.
  key_decls:
  - name: DiscreteGroups.sglob.DzDig.match_of_hyp
    gloss: >-
      For p ≥ 2 and n ≥ 1, if all translations by multiples of e give equal digit-sum changes for uk and uk′ modulo
      N, then the least residues of pʲuk and uk′ have the same quotient by e for some j < n.
  - name: DiscreteGroups.sglob.DzDig.count_shift
    gloss: >-
      For p ≥ 2, n ≥ 1, 0 ≤ x < N and 0 ≤ b < p − 1, translating x by be modulo N changes its base-p digit sum by
      nb minus (p − 1) times the number of least residues of pⁱx, for i < n, whose quotient by e is at least p −
      1 − b.
  - name: DiscreteGroups.sglob.DzDig.e_mul_dsum
    gloss: >-
      For p ≥ 2 and 0 ≤ x < N, the sum of the least residues of pⁱx modulo N over i < n equals e times the base-p
      digit sum of x.
  - name: DiscreteGroups.sglob.DzDig.cnt
    gloss: >-
      Counts the indices i < n for which the least residue of pⁱx modulo N has integer quotient by e at least the
      given threshold.
  - name: DiscreteGroups.sglob.DzDig.exists_match
    gloss: >-
      For n ≥ 1 and 0 ≤ x′ < N, if the threshold counts for x and x′ agree at the block index of x′ and the next
      index, some pʲx with j < n has least residue in the block containing x′, with block width given by the sum
      of pⁱ over i < n.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 4 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Development.DiscreteGroups.GlobalIrreducibility.DzDigTot
  depth: 15
  lines: 160
  line: Proves a strict lower bound for Euler’s totient of pⁿ − 1 when p is prime, n ≥ 2 and p > 16n².
  reading: >-
    For prime p and n ≥ 2 with p > 16n², the bound is (p − 1)φ(pⁿ − 1) > 2n(pⁿ − 1). Induction on the largest prime
    in a finite set gives a product estimate, which Euler’s product formula turns into a lower bound for φ(N) in
    terms of the number of distinct prime divisors of N. Comparing powers of p and 2 shows that twice the number
    of distinct prime divisors of pⁿ − 1 is strictly less than p. The proof of dig uses the strict lower bound to
    contradict the upper bound from modular residue counting.
  key_decls:
  - name: DiscreteGroups.sglob.DzDig.two_n_N_lt
    gloss: For prime p and n ≥ 2 with p > 16n², one has 2n(pⁿ − 1) < (p − 1)φ(pⁿ − 1).
  - name: DiscreteGroups.sglob.DzDig.sq_le_totient
    gloss: For N ≥ 2 with r distinct prime divisors, N² ≤ 4(2r − 1)φ(N)².
  - name: DiscreteGroups.sglob.DzDig.prod_sq_le
    gloss: >-
      For a nonempty set of r distinct primes q, the squared product of q is at most 4(2r − 1) times the squared
      product of q − 1.
  - name: DiscreteGroups.sglob.DzDig.two_pow_card_le
    gloss: A positive integer with r distinct prime divisors is at least 2ʳ.
  - name: DiscreteGroups.sglob.DzDig.pow_le_two_pow
    gloss: For integers n ≥ 1 and p > 16n², one has p²ⁿ ≤ 2ᵖ.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (line, reading). Before and after text: check-log.tsv.
