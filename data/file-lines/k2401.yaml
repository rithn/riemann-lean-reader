- module: Development.DiscreteGroups.GlobalIrreducibility.DzKSchur
  depth: 9
  lines: 53
  line: >-
    Applies Schur’s lemma to class-function sums on irreducible complex representations of finite groups.
  reading: >-
    A finite-dimensional complex representation whose character agrees with an irreducible character is irreducible
    by the character norm criterion. For an irreducible representation ρ and a class function f, the operator ∑ᵧ
    f(y)ρ(y⁻¹) commutes with the group action by reindexing under conjugation, so Schur’s lemma makes it scalar.
    Taking the trace gives the scalar as the inverse-element character sum divided by the dimension.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.Kon.simple_of_isIrr
    gloss: >-
      A finite-dimensional complex representation of a finite group is irreducible if it has the same character
      as an irreducible representation.
  - name: DiscreteGroups.sglob.DzType.Kon.central_scalar
    gloss: >-
      The operator ∑ᵧ f(y)ρ(y⁻¹) for a class function f acts on an irreducible representation by a scalar c satisfying
      c dim ρ = ∑ᵧ f(y)χρ(y⁻¹).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
