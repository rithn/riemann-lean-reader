    finite cuspidal types with equal characters. The proof identifies the finite types by character equality and
    takes the span of the group translates of their common image in the product of the two representations. Its
    principal congruence fixed vectors are exactly that image, which forces both coordinate projections to be isomorphisms
    by irreducibility. ParUniq uses the result to recover the cuspidal representation from its tame parameter.
