- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.PairCheckThreeTwo
  depth: 9
  lines: 181
  line: >-
    Proves that Frobenius orbit sums on field generators are nonzero somewhere and determine regular characters
    up to Frobenius conjugacy.
  reading: >-
    Over a prime field, the Frobenius orbit sum of each regular multiplicative character is nonzero at some element
    that generates the extension, and its values on all such elements determine the character up to Frobenius conjugacy.
    The proof bounds the support of character-sum differences and reduces uniqueness in the four exceptional (prime,
    degree) pairs (2,2), (3,2), (2,4), and (2,6) to exhaustive congruence checks. NameLaws uses uniqueness to identify
    cuspidal parameters up to Frobenius, and NameCentral uses nonvanishing to compute the scalar action of the center.
  key_decls:
  - name: UpperTheory.Zero.LLC.pin
    gloss: >-
      For a finite extension of a prime field, a regular character has a nonzero Frobenius orbit sum at some field
      generator and is determined up to Frobenius by those sums on field generators.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.Pair
    gloss: >-
      If the first n iterates of both t and t′ under multiplication by g are distinct and closed under translation
      by e modulo N, then t′ is congruent to t g^j for some j < n.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.exc
    gloss: >-
      If the translation exponent is divisible by the multiplicative group order of every maximal proper subfield
      and Pair holds for every pair of residues modulo g^n − 1, regular characters with equal sums on all field
      generators are Frobenius conjugate.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.pairCheck_three_two
    gloss: >-
      Any two length-two orbits under multiplication by 3 modulo 8 that are stable under translation by 2 coincide.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.ResIndep
  depth: 9
  lines: 141
  line: >-
    Shows that Artin inertia reductions over ℚₚ agree up to residue-field isomorphism for unramified data of equal
    positive residue degree.
  reading: >-
    Fix a place with completion continuously isomorphic to ℚₚ and an ambient valuation above it. A residue-field
    isomorphism intertwines any two maps satisfying the Artin inertia reduction conditions for auxiliary data with
    uniformizer p at each auxiliary place and residue field size q = p^n, n > 0. The proof embeds both fields in
    the ambient residue field as the roots of X^q − X and identifies both embedded reductions of t with the residue
    of t(π)/π for a common root π of π^(q−1) = p. CentralUnit uses the isomorphism to transport regular cuspidal
    parameters and compare the resulting Weil–Deligne inertia formulas.
  key_decls:
  - name: UpperTheory.Zero.LLC.resIndep
    gloss: >-
      At a fixed place with completion continuously isomorphic to ℚₚ and a fixed ambient valuation, a residue-field
      isomorphism intertwines any two valid Artin inertia reductions for unramified auxiliary data of the same positive
      residue degree.
  - name: UpperTheory.Zero.LLC.core
    gloss: >-
