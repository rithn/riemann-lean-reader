- module: Development.AutomorphicArithmetic.WhittakerHecke.ExistsNumberFieldExtensionPlaceFrobeniusDegree
  depth: 8
  lines: 150
  line: >-
    Proves the existence of a cyclotomic extension with prescribed residue degree, fixed by inertia and stable under
    Frobenius.
  reading: >-
    For a finite place w of norm q and n ≥ 2, the proof adjoins a primitive (qⁿ − 1)st root of unity to the base
    field. The polynomial X^(qⁿ − 1) − 1 has unit derivative at that root, so congruence forces inertia to fix the
    generator, and an element outside w² stays outside the square of the lifted prime. The root retains its order
    after reduction, and the nth power of Frobenius forces every residue to satisfy X^(qⁿ) = X, giving residue degree
    n. The direct importer uses the extension to construct a Frobenius-equivariant quotient of inertia isomorphic
    to the additive group of the residue field.
  key_decls:
  - name: UpperTheory.exists_numberField_extension_place_frobenius_degree
    gloss: >-
      For a finite place w, a valuation above it on an algebraic closure, a Frobenius lift, n ≥ 2, and an integer
      c outside w², there exists a number-field extension fixed pointwise by inertia and preserved by the lift,
      with an induced prime of residue degree n whose square excludes c.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review sample-03 (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AutomorphicArithmetic.WhittakerHecke.ExistsUnitResidueLogarithmOfRootsOfUnity
  depth: 8
  lines: 110
  line: >-
    Constructs a surjective residue logarithm from the units of a valuation ring to the additive group of its residue
    field.
  reading: >-
    For a uniformizer π and residue field k, the logarithm sends a unit a to the reduction of (aᴺ − 1)/π, where
    N > 0, zᴺ = 1 for every z ∈ k×, and the image of N in k is −1. The product cross term vanishes on reduction,
    and the linear term of (1 + πx)ᴺ gives surjectivity. The map vanishes when v(a − 1) < v(π) in multiplicative
    notation and is equivariant for valuation-preserving automorphisms fixing π paired with residue automorphisms
    that intertwine reduction. The direct importer composes it with local reciprocity to obtain a Frobenius-equivariant
    quotient of inertia with open kernel.
  key_decls:
  - name: one_add_pow_expansion'
    gloss: In any commutative ring, (1 + z)ᴺ differs from 1 + Nz by a multiple of z².
  - name: UpperTheory.exists_unit_residue_logarithm_of_roots_of_unity
    gloss: >-
      Given a uniformizer and a positive exponent N annihilating the multiplicative residue group with N = −1 in
      the residue field, the theorem constructs a surjective additive logarithm on valuation-ring units that vanishes
      on the second principal unit subgroup and is equivariant under valuation-preserving automorphisms fixing the
      uniformizer.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.AutomorphicArithmetic.WhittakerHecke.TameInertiaCharacterFrobeniusConjEqPow
  depth: 8
  lines: 177
  line: >-
    Constructs irreducible Weil–Deligne parameters with unitary determinant outside all character twists of tame
    parameters.
  reading: >-
    Assume n ≥ 2 and a Frobenius-equivariant inertia quotient with open kernel onto the additive group of a field
    of size qⁿ, where q is the residue cardinality and the induced field automorphism has order n. The proof pulls
    back n conjugate additive characters to build an irreducible n-dimensional parameter with determinant 1 on Frobenius
    and of finite order on inertia. If the first two characters agree on wild inertia, n Frobenius conjugations
    equate their ratio to its qⁿth power, which is 1 since both factor through the finite additive group. Their
    distinct wild values exclude all character twists of tame parameters. The direct importer supplies the quotient
    at each finite place.
  key_decls:
  - name: UpperTheory.IrreducibleNonTameWeilDeligne.eta
    gloss: >-
      The jth inertia character is the pullback of an additive character precomposed with the jth power of the finite-field
      automorphism.
  - name: UpperTheory.IrreducibleNonTameWeilDeligne.eta_eq_iff
    gloss: >-
      For a surjective inertia quotient and an additive character with trivial stabilizer under the automorphism's
      powers, two indexed characters coincide exactly when their indices are congruent modulo the automorphism's
      order.
  - name: UpperTheory.IrreducibleNonTameWeilDeligne.eta_pow_card
    gloss: >-
      Each value of an indexed inertia character is a root of unity of order dividing the finite field's cardinality.
  - name: UpperTheory.IrreducibleNonTameWeilDeligne.eta_eq_of_wild
    gloss: >-
      For the Frobenius-equivariant quotient of size qⁿ with automorphism of order n, agreement of the first two
      characters on wild inertia implies agreement on all of inertia.
  - name: UpperTheory.tameInertiaCharacter_frobenius_conj_eq_pow
    gloss: >-
      For n ≥ 2, a Frobenius-equivariant inertia quotient of size qⁿ with open kernel and automorphism of order
