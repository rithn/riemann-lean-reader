- module: Development.DiscreteGroups.GlobalIrreducibility.DzPinA
  depth: 16
  lines: 95
  line: >-
    Relates complex and arithmetic Gauss sums, and derives base-p digit-sum identities from equal powers of Gauss-sum
    products.
  reading: >-
    Every complex multiplicative character of a finite cyclic group is a power of a fixed faithful character, as
    follows by evaluating at a generator. A compatible ring homomorphism to ℂ carries the arithmetic Gauss sum to
    the complex sum with additive character pulled back by the finite-field trace. Applying the Stickelberger valuation
    formula to equal positive powers of two products of Gauss sums gives equality of the corresponding sums of base-p
    digit sums. Congruence lemmas record how to reduce character exponents and undo multiplication by an invertible
    residue.
  key_decls:
  - name: DiscreteGroups.sglob.DzPin.pow_eq_pow_of_modEq
    gloss: If xᴺ = 1, then exponents congruent modulo N give equal powers of x.
  - name: DiscreteGroups.sglob.DzPin.modEq_twist
    gloss: If tu ≡ 1 modulo N, then multiplying the residue of uk + be by t gives k + e(tb) modulo N.
  - name: DiscreteGroups.sglob.DzPin.exists_eq_pow_of_injective
    gloss: >-
      Every complex character of a finite cyclic group is a nonnegative integral power of any faithful complex character
      of that group.
  - name: DiscreteGroups.sglob.DzPin.dsum_eq_of_pow_eq
    gloss: >-
      In the Stickelberger Gauss-sum datum, equality of the rth powers of g(a₁)g(a₂) and g(a₃)g(a₄) for r > 0 and
      indices below pᶠ − 1 forces equality of the two sums of base-p digit sums.
  - name: DiscreteGroups.sglob.DzPin.gs_eq
    gloss: >-
      A ring homomorphism to ℂ matching the chosen root of unity and multiplicative character sends the arithmetic
      Gauss sum to the complex Gauss sum with inverse multiplicative character and trace-pulled additive character.
