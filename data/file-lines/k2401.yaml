      approximating the lifted Artin value modulo the maximal ideal.
  - name: UpperTheory.Zero.LLC.range_sub
    gloss: The image of an embedded field of q elements is the root set of X^q − X.
  - name: UpperTheory.Zero.LLC.exists_equiv
