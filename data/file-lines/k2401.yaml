- module: Development.DiscreteGroups.GlobalIrreducibility.DzLCusp
  depth: 6
  lines: 119
  line: >-
    Proves cuspidality for irreducible GL(n, k) representations with a cuspidal type inflated via GL(n, ℤₚ) → GL(n,
    𝔽ₚ) and continuous ℚₚ ≃ k.
  reading: >-
    Let k be a nonarchimedean local field with a continuous field isomorphism ℚₚ ≃ k. A smooth irreducible representation
    of GL(n, k) is cuspidal if its pullback to GL(n, ℚₚ) contains, on GL(n, ℤₚ), a cuspidal representation of GL(n,
    𝔽ₚ) inflated by reduction modulo p. For a two-block unipotent radical, finite unipotent averaging puts the inflated
    subspace in the kernel of the coinvariant quotient. Iwasawa decomposition and irreducibility then force the
    quotient to vanish. Permutation conjugacy gives the vanishing required by the cuspidality criterion, which is
    applied at number-field completions identified with a p-adic field.
  key_decls:
  - name: DiscreteGroups.sglob.DzLc.twKer_twoBlocks_eq_top
    gloss: >-
      For a nonarchimedean local field k with a continuous isomorphism ℚₚ ≃ k, the coinvariants of a smooth irreducible
      representation of GL(n, k) vanish for each proper two-block standard parabolic unipotent radical if its pullback
      contains, on GL(n, ℤₚ), a cuspidal type inflated from GL(n, 𝔽ₚ) by reduction modulo p.
  - name: DiscreteGroups.sglob.DzLc.isCuspidal_of_inflates
    gloss: >-
      For a nonarchimedean local field k with a continuous isomorphism ℚₚ ≃ k, a smooth irreducible representation
      of GL(n, k) is cuspidal if its pullback contains, on GL(n, ℤₚ), a cuspidal type inflated from GL(n, 𝔽ₚ) by
      reduction modulo p.
  - name: DiscreteGroups.sglob.DzType.lCusp
    gloss: >-
      Establishes the finite cuspidal inflation criterion in positive rank at number-field completions equipped
      with a continuous field isomorphism from the p-adic rationals.
