- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.DetByType
  depth: 8
  lines: 313
  line: >-
    Proves that a finite cuspidal type and a central character determine an irreducible representation of GL(n)
    over ℚₚ.
  reading: >-
