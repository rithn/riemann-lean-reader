- module: Development.DiscreteGroups.GlobalIrreducibility.DzKName
  depth: 15
  lines: 237
  line: >-
    Constructs Green’s cuspidal characters of GL(d, 𝔽_g) for prime g and positive d and parametrizes them by regular
