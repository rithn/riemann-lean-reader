- module: Development.DiscreteGroups.GlobalIrreducibility.DzFpVec
  depth: 16
  lines: 141
  line: >-
    Constructs Whittaker eigenvectors and proves vanishing for ψ ≠ 1 on nonidentity lower triangular GL elements
    with the identity last row.
  reading: >-
    Let χ(u) = ψ(∑ᵢ uᵢ,ᵢ₊₁) on the upper unitriangular subgroup U. A nonzero χ-equivariant functional ℓ forces χ
    to be multiplicative, and over a finite field, averaging with χ⁻¹ produces a χ-eigenvector v with ℓ(v) ≠ 0.
    For nontrivial ψ, the coefficient ℓ(ρ(Y)v) vanishes at every nonidentity lower triangular Y whose last row equals
    that of the identity. The proof uses the last row where Y differs from the identity to find u₁, u₂ in U with
    u₁Y = Yu₂ and distinct χ-values. DzFpSum uses this vanishing to retain only the identity term in a sum over
    the embedded lower triangular subgroup.
