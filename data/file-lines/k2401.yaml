    For a depth-zero cuspidal representation, a simple constituent of the first principal congruence fixed space
    has cuspidal character as a representation of GL(n, 𝔽ₚ). For an irreducible target with a central character,
    a nonzero intertwiner from an inflated finite cuspidal type is injective and has image equal to the entire fixed
    space. Transporting two such embeddings to the same representation identifies the finite actions and hence their
    characters. CentralUnit and ParUniq use these types to construct and characterize tame Weil–Deligne parameters.
  key_decls:
  - name: UpperTheory.Zero.LLC.typeEx
    gloss: >-
      At a finite place of a number field with a chosen prolongation to its algebraic closure and a continuous ring
      isomorphism from ℚₚ to the completion, every positive-rank depth-zero irreducible cuspidal representation
      admits an inflated finite cuspidal type whose character depends only on the local isomorphism class.
  - name: UpperTheory.Zero.LLC.TypeExistence.exists_cusp
    gloss: >-
      In positive rank, the pullback of a cuspidal irreducible representation with nonzero first principal congruence
