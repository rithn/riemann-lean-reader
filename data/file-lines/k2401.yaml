    M-eigenvalue orbit.
  reading: >-
    For two pairs satisfying MG = GM^q on n-dimensional complex spaces with G invertible, assume their M-eigenvalues
    include points on the same nonzero q-power orbit of exact length n. Iterating G on an eigenvector gives a basis
    because the resulting M-eigenvalues are distinct. After aligning the starting eigenvalue, both pairs have the
    same diagonal entries for M and the same cyclic shift for G, with the determinant of G fixing the scalar on
    the last step. This comparison is used to show that polynomial labels distinguish irreducible tame Weil–Deligne
    classes of fixed positive dimension and fixed Frobenius determinant.
