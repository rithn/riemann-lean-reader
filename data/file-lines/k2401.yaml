- module: Development.DiscreteGroups.GlobalIrreducibility.OrbitOfAgree
  depth: 15
  lines: 123
  line: >-
    Proves that agreement of Frobenius sums on elliptic elements determines a regular character’s Frobenius orbit.
  reading: >-
    For n ≥ 2 and prime g > 16n², two multiplicative characters of 𝔽_{gⁿ}ˣ lie in the same Frobenius orbit if one
    is regular and their Frobenius sums agree on elements of degree n over 𝔽_g. Character orthogonality makes the
    cross sum vanish for disjoint orbits, while regularity gives a self-pairing of n(gⁿ − 1). The summands of the
    pairing difference vanish outside an exceptional set of size at most ⌊n/2⌋g^⌊n/2⌋ and have absolute value at
    most 2n², contradicting the self-pairing. The proof of lKondo uses this criterion to identify the given cuspidal
    character with its explicitly labeled counterpart.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.Kon.orbit_of_agree
    gloss: >-
      For K of size gⁿ with n ≥ 2 and prime g > 16n², if the Frobenius sums of θ and θ′ agree on roots of irreducible
      characteristic polynomials of elements of GL(n, 𝔽_g) and θ is regular, then θ′ = θ raised to gⁱ for some 0
      ≤ i < n.
  - name: DiscreteGroups.sglob.DzType.Kon.card_bad_le
    gloss: >-
      In a finite field containing 𝔽_g, at most ⌊n/2⌋g^⌊n/2⌋ nonzero elements are fixed by some i-th power of the
      g-power Frobenius with 1 ≤ i ≤ ⌊n/2⌋.
