- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.NameLaws
  depth: 8
  lines: 126
  line: >-
    Derives the laws for labeling cuspidal characters of GL(n, 𝔽ₚ) by Frobenius orbits of regular characters.
  reading: >-
    Green’s formula labels each cuspidal character by a regular character of 𝔽ₚⁿ’s multiplicative group, using a
    signed Frobenius sum at matrices with irreducible characteristic polynomial. Uniqueness up to Frobenius follows
    by testing the sums on degree-n elements, realized as eigenvalues of multiplication matrices. Labels in the
    same orbit give equal cuspidal characters, and pullback along a field isomorphism preserves the labeling relation
    and regularity. CentralUnit uses these laws to compare different residue-field realizations, and ParUniq uses
    them to identify finite cuspidal type characters.
  key_decls:
  - name: UpperTheory.Zero.LLC.nameLaws
    gloss: >-
      Proves existence and Frobenius uniqueness of regular labels, equality of cuspidal characters for labels in
      one orbit, and compatibility with pullback along field isomorphisms.
  - name: UpperTheory.Zero.LLC.exists_elt
    gloss: >-
      Every nonzero element of degree n over 𝔽ₚ is a root of the irreducible characteristic polynomial of some element
      of GL(n, 𝔽ₚ).
  - name: UpperTheory.Zero.LLC.regular_pow
    gloss: Every Frobenius iterate of a regular multiplicative character is regular.
  - name: UpperTheory.Zero.LLC.pow_mod
    gloss: >-
      The j-th Frobenius iterate of a multiplicative character of a degree-n finite-field extension depends only
      on j modulo n.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.TameUniq
  depth: 8
  lines: 215
  line: >-
    Proves Frobenius-orbit uniqueness of tame inertia labels and uniqueness of the associated irreducible parameter
    with fixed determinant.
  reading: >-
    For a fixed tame residue map, the inertia polynomials are invariant under Frobenius conjugation of the finite-field
    character. Their trace coefficients recover its orbit by surjectivity of the residue map and linear independence
    of characters. The proof identifies two irreducible tame parameters with the same inertia formula and determinant
    by intertwining a tame inertia generator and an inverse Frobenius lift. ParUniq uses both uniqueness conclusions,
    and CentralUnit uses Frobenius invariance to compare inertia formulas.
  key_decls:
  - name: UpperTheory.Zero.LLC.tameUniq
    gloss: >-
      The tame inertia formula determines its regular character label up to Frobenius, and together with the determinant
      determines the irreducible tame Weil–Deligne parameter up to isomorphism.
  - name: UpperTheory.Zero.LLC.orbit_of_sums
    gloss: >-
      If the sums of the first n Frobenius iterates of two multiplicative characters agree at every unit, the second
      character is one of those iterates of the first.
  - name: UpperTheory.Zero.LLC.pair_of_gen
    gloss: >-
      A tame inertia generator and a degree-minus-one Frobenius lift act irreducibly on an irreducible tame parameter,
      and an isomorphism intertwining these two operators intertwines the entire parameter.
  - name: UpperTheory.Zero.LLC.eigenvalue_iff
    gloss: The inertia eigenvalues at t are precisely the character values θ(R(t)^(p^j)) for 0 ≤ j < n.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.TypeEx
  depth: 8
