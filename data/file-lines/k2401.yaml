  - name: DiscreteGroups.sglob.DzIso.redKO
    gloss: >-
      Defines reduction to GL(n, 𝔽ₚ) by identifying the integral subgroup with GL(n, ℤₚ) and reducing entries modulo
      p.
  - name: DiscreteGroups.sglob.DzIso.redKO_surjective
    gloss: Every element of GL(n, 𝔽ₚ) is the reduction of an element of the integral subgroup.
  - name: DiscreteGroups.sglob.DzIso.ker_redKO
