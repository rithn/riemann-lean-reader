- module: Development.DiscreteGroups.GlobalIrreducibility.DzLcPerm
  depth: 7
  lines: 165
  line: >-
    Proves normalizer and permutation-conjugacy lemmas for unipotent radicals of block parabolics in GL(N).
  reading: >-
    Block upper triangular matrices normalize the corresponding unipotent radical because multiplication on either
    side preserves strict block upper triangularity. Every nontrivial block-parabolic unipotent radical contains
    a permutation conjugate of a proper standard two-block radical. The proof sorts the coordinate block labels
    and cuts at their first strict increase. The local cuspidality proof uses this inclusion to pass from vanishing
    of two-block coinvariants to vanishing for the radicals in the cuspidality criterion.
  key_decls:
  - name: DiscreteGroups.sglob.DzLc.strict_left_mul
    gloss: >-
      Left multiplication by a block upper triangular matrix preserves strict block upper triangularity for the
      same block labels.
  - name: DiscreteGroups.sglob.DzLc.conj_mem_unipRadical
    gloss: >-
      Conjugation by an invertible block upper triangular matrix sends the corresponding unipotent radical into
      itself.
  - name: DiscreteGroups.sglob.DzLc.blockUpper_le_normalizer
    gloss: The block upper triangular subgroup lies in the normalizer of its unipotent radical.
  - name: DiscreteGroups.sglob.DzLc.exists_cut
    gloss: >-
      A nonconstant nondecreasing sequence of block labels admits an interior cut with every label before it strictly
      smaller than every label after it.
  - name: DiscreteGroups.sglob.DzLc.exists_perm_conj
    gloss: >-
      Every nontrivial block-parabolic unipotent radical contains a permutation conjugate of a proper standard two-block
