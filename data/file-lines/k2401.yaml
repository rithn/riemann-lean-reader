- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.ArtEx
  depth: 6
  lines: 15
  line: >-
    Constructs the unique inverse local Artin map from each finite place’s Weil group to the completion’s multiplicative
    group.
  reading: >-
    The map runs from the local Weil group to the multiplicative group of the completed field. Existence comes from
    local reciprocity, and uniqueness follows because any two such maps have the same image under global reciprocity,
    whose restriction to idèles supported at the given place is injective by the Chevalley units result. The correspondence
    existence proof chooses this map to construct a parameter assignment on all irreducible smooth representations,
    and the uniqueness proof identifies competing reciprocity maps before proving parameter agreement on representations
    satisfying Good.
  key_decls:
  - name: UpperTheory.Zero.LLC.artEx
    gloss: >-
      For every finite place and every prolongation to an algebraic closure, there is a unique homomorphism from
      the associated Weil group to the multiplicative group of the completion satisfying the local Artin reciprocity
      laws.
  blueprint: []
