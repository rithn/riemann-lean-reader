- module: Development.DiscreteGroups.GlobalIrreducibility.DzTwFin
  depth: 8
  lines: 153
  line: >-
    Proves that determinant twists preserve finite GL(n) cuspidality and multiply the character parameter by a norm
    character.
  reading: >-
    Twisting by χ composed with the determinant preserves cuspidality for GL(n, 𝔽ₚ). The twist preserves the character
    norm because the factors at an element and its inverse cancel, and it leaves the two-block unipotent averages
    unchanged because the determinant is one there. For a matrix with irreducible characteristic polynomial, the
    determinant is the field norm of a root in 𝔽ₚⁿ. In the signed Frobenius-orbit character formula, the twist therefore
    replaces the parameter θ by θ times χ composed with the norm, preserving Frobenius regularity.
  key_decls:
  - name: DiscreteGroups.sglob.DzTw.character_twFD
    gloss: >-
      The character of a determinant twist at a matrix is the original character value multiplied by χ evaluated
      on its determinant.
  - name: DiscreteGroups.sglob.DzTw.isCusp_twFD
    gloss: >-
      Twisting a finite cuspidal character by a multiplicative character composed with the determinant preserves
      cuspidality.
  - name: DiscreteGroups.sglob.DzTw.det_eq_norm
    gloss: >-
      The determinant of a matrix with irreducible characteristic polynomial equals the norm of any root in the
      degree-n extension.
  - name: DiscreteGroups.sglob.DzTw.isRegularChar_mul
    gloss: >-
      Multiplying a Frobenius-regular character by a character pulled back along the norm preserves Frobenius regularity.
  - name: DiscreteGroups.sglob.DzTw.char_twFD
    gloss: >-
      If the character satisfies the signed Frobenius-orbit formula with parameter θ on matrices with irreducible
      characteristic polynomial, its determinant twist satisfies the formula with parameter θ multiplied by the
      norm pullback of χ.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
