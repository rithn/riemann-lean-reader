- module: Development.DiscreteGroups.GlobalIrreducibility.InCellMulRightIff
  depth: 18
  lines: 55
  line: Collects double-coset membership and translation lemmas for a principal-series cell function.
  reading: >-
    Absorbing factors into the two sides of B w₀ S proves that membership is invariant under left translation by
    the standard Borel B and right translation by S. When every diagonal entry of every element of S has valuation
    1, the cell function transforms on the left by δ_B^{1/2} and is invariant on the right by S, giving CellVecFixed
    the transformation laws for its S-fixed principal-series vector.
  key_decls:
  - name: DiscreteGroups.sglob.DzType.inCell_mul_left_iff
    gloss: For b in B, the product bg belongs to B w₀ S exactly when g does.
  - name: DiscreteGroups.sglob.DzType.inCell_mul_right_iff
    gloss: For s in S, the product gs belongs to B w₀ S exactly when g does.
  - name: DiscreteGroups.sglob.DzType.cellFun_mul_left
    gloss: >-
      If every diagonal entry of every element of S has valuation 1, then left translation by b in B scales the
      cell function by δ_B(b)^{1/2}.
  - name: DiscreteGroups.sglob.DzType.cellFun_mul_right
    gloss: >-
      If every diagonal entry of every element of S has valuation 1, then right translation by any element of S
      fixes the cell function.
