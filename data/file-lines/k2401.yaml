- module: Development.DiscreteGroups.GlobalIrreducibility.ExistsEqMulShiftToCircle
  depth: 14
  lines: 76
  line: >-
    Proves that nontrivial additive characters of a prime residue field lift continuously to the corresponding p-adic
    completion.
  reading: >-
    Primitivity and a finite cardinality count show that every circle-valued additive character of ℤ/gℤ is obtained
    by multiplying the argument of the standard character by a residue s. For prime p, scaling the standard character
    of ℚₚ by the least representative of s divided by p gives the required restriction on ℤₚ. A continuous isomorphism
    from ℚₚ to the completion has a continuous inverse by the open mapping theorem, so the lift transports to the
