  - name: UpperTheory.Zero.LLC.TypeExistence.fixed_eq_range
    gloss: >-
      For an irreducible representation with a central character, a nonzero intertwiner from an inflated finite
      cuspidal type identifies the type with the full first principal congruence fixed space.
  - name: UpperTheory.Zero.LLC.TypeExistence.char_eq
