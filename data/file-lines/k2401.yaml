    gloss: >-
      For a nontrivial additive character ψ₀ of 𝔽ₚ, constructs a fixed multiplicative lift and faithful complex
      character Ω such that each t coprime to pN admits a complex embedding realizing Ωᵗ on the lift and sending
      a primitive p-th root to ψ₀(1).
