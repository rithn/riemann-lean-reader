- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.TwTame
  depth: 7
  lines: 194
  line: >-
    Proves that a determinant twist of a depth-zero irreducible GL(n) representation remains depth zero exactly
    when the character is tame.
  reading: >-
    Depth zero is expressed by nonzero fixed vectors under the first principal congruence subgroup. A tame character
    preserves these vectors because the determinant of every element of that subgroup is a principal unit. Conversely,
    a principal unit on which the character is nontrivial gives a diagonal matrix that, by Cartan decomposition
    and irreducibility, forces the original coinvariants to vanish, contradicting the injection of fixed vectors
    into coinvariants. ParOne tests χ by twisting the trivial GL(1) representation, and GoodMap deduces tameness
    of χχ₁⁻¹ when two twists of depth-zero cuspidals coincide.
  key_decls:
  - name: UpperTheory.Zero.LLC.twTame
    gloss: >-
      For n > 0 over a nonarchimedean local field of characteristic zero, the determinant twist of a depth-zero
      irreducible representation by a smooth character has depth zero exactly when the character is trivial on principal
      units.
  - name: UpperTheory.Zero.LLC.tame_of_dz
    gloss: >-
      If an irreducible representation of GL(n) with n > 0 and its determinant twist both have depth zero, the twisting
      character is tame.
  - name: UpperTheory.Zero.LLC.dz_of_tame
    gloss: A determinant twist by a tame character preserves depth zero.
