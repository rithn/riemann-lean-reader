- module: Development.AbelianVarietyTheory.Proofs.InertiaEigenvalues.EpsilonFactorsAtOneHalf
  depth: 8
  lines: 185
  line: Proves that the Tate epsilon factor agrees with the local epsilon factor at s = 1/2.
  reading: >-
    The equality holds over nonarchimedean local fields for a continuous nontrivial additive character and a smooth
    complex multiplicative character. For unramified characters, both formulas reduce to the same power of the character
    evaluated at a uniformizer. In the ramified case, conductor congruences make the summand constant on each class
    of the valuation shell, and a bijection with the units modulo the conductor subgroup identifies the two Gauss
    sums. The continuity lemma is used in the proof of the norm formula for smooth central characters in ExponentMulAbsPow.
  key_decls:
  - name: GlobalTheory.DelEps.tateEps_eq_localEpsilon_half
