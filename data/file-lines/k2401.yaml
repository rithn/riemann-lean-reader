- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.WDBasic
  depth: 7
  lines: 237
  line: Proves determinant, monodromy, duality, and character-twist identities for Weil–Deligne parameters.
  reading: >-
    The product of the Weil eigenvalues is the determinant character, determined by inertia and a degree-one Frobenius
    lift. Irreducibility of the Weil action forces zero monodromy because the nilpotent operator has Weil-stable
    kernel. Duality preserves dimension, irreducibility, and tameness and inverts inertia eigenvalues. Twisting
    by a smooth Weil character ξ preserves dimension and irreducibility, scales each eigenvalue at σ by ξ(σ), multiplies
    their product by ξ(σ)^d in dimension d, and preserves tameness of a positive-dimensional tame parameter exactly
    when ξ is trivial on wild inertia. ParDual uses the duality identities to verify compatibility with contragredients.
  key_decls:
  - name: UpperTheory.Zero.LLC.wDBasic
    gloss: >-
      Establishes the determinant and Frobenius–inertia identities and the behavior of Weil–Deligne parameters under
      duality and smooth character twists.
  - name: UpperTheory.Zero.LLC.WDB.monodromy_zero_of_irreducible
    gloss: An irreducible underlying Weil representation has zero monodromy.
  - name: UpperTheory.Zero.LLC.WDB.irr_dual
    gloss: The dual of a finite-dimensional irreducible complex representation is irreducible.
  - name: UpperTheory.Zero.LLC.WDB.charpoly_inv_prod
    gloss: >-
      The characteristic polynomial of the inverse of an invertible complex endomorphism has the reciprocal roots,
      with multiplicity.
  - name: UpperTheory.Zero.LLC.WDB.irr_twist
    gloss: Twisting an irreducible Weil representation by a smooth character preserves irreducibility.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review sample-01 (material findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: Development.DiscreteGroups.GlobalIrreducibility.DzLDepth
  depth: 7
  lines: 35
  line: >-
    Proves depth zero for irreducible GL(n) representations with inflated finite type at number-field completions
    continuously isomorphic to ℚₚ.
  reading: >-
    At a number-field completion equipped with a continuous field isomorphism from the p-adic rationals, a smooth
    irreducible representation of GL(n) containing an inflated finite type has a nonzero vector fixed by the first
    principal congruence subgroup. Every element of that subgroup lifts to an integral matrix reducing to the identity,
    so equivariance fixes every vector in the image of the inflation map. The equivalence with the chosen representative
    of the isomorphism class transports a nonzero fixed vector to that representative.
