  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.DiscreteGroups.GlobalIrreducibility.DzStickTeich
  depth: 16
  lines: 121
  line: Constructs power-residue characters by lifting roots of unity from a quotient ring.
  reading: >-
    Reduction modulo an ideal P of a domain is injective on nth roots of unity when n has nonzero image, by the
    factorization of aⁿ − bⁿ, so primitive roots retain their order. If F_q embeds into the quotient by a prime
    ideal P, n divides q − 1, and the domain contains a primitive nth root, the map x ↦ x^((q − 1)/n) lifts to a
    multiplicative character whose order divides n. Uniqueness of the root-of-unity lifts gives multiplicativity.
    DzPinB uses preservation of primitive roots to construct the finite-field embedding and takes n = q − 1 to lift
    its multiplicative character.
  key_decls:
  - name: DiscreteGroups.sglob.Stick.eq_of_pow_eq_one_of_mk_eq
    gloss: >-
      Two nth roots of unity in a domain with the same reduction modulo P are equal if n has nonzero image in the
      quotient.
  - name: DiscreteGroups.sglob.Stick.natCast_not_mem_of_dvd
    gloss: >-
      If F_q maps into the quotient by a prime ideal P, every divisor of q − 1 has nonzero image in the quotient.
  - name: DiscreteGroups.sglob.Stick.isPrimitiveRoot_mk
    gloss: >-
      A primitive nth root of unity in a domain remains primitive after reduction modulo an ideal P whenever n has
      nonzero image.
  - name: DiscreteGroups.sglob.Stick.exists_powResChar
    gloss: >-
      For a given embedding ι of F_q into the quotient by P and a primitive nth root in the domain with n dividing
      q − 1, there is a multiplicative character ρ with ρⁿ = 1 whose reduction at each x is ι(x)^((q − 1)/n).
  blueprint: []
  status: checked
  check:
