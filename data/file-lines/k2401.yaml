- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.PinChar
  depth: 11
  lines: 134
  line: >-
    Bounds the support of a difference of character sums and proves stability under twisting by characters trivial
    on that support.
  reading: >-
    For disjoint sets A and B of complex characters of a finite abelian group G, let f be the difference of their
    character sums. Character orthogonality gives the unnormalized Parseval identity ∑_{z∈G}|f(z)|² = |G|(|A|+|B|).
    Combining this with the pointwise bound |f(z)| ≤ |A|+|B| yields |G| ≤ |supp(f)|(|A|+|B|) when at least one set
    is nonempty. A character trivial on the support preserves the Fourier coefficients under twisting and hence
    permutes each of A and B.
  key_decls:
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.sum_mul_conj
    gloss: The unnormalized inner product of two characters is |G| when they coincide and zero otherwise.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.inner_dif
    gloss: >-
      The unnormalized Fourier coefficient of the difference at ψ is |G| times the difference of the membership
      indicators of ψ in A and B.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.parseval
    gloss: The squared ℓ² norm of the difference of sums over disjoint character sets A and B is |G|(|A|+|B|).
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.card_le
    gloss: >-
      If D contains the support of the difference for disjoint A and B with positive total size, then |G| ≤ |D|(|A|+|B|).
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.mul_mem
    gloss: >-
      Multiplication by a character trivial on D preserves membership in each of the two disjoint character sets
      whenever D contains the support of their difference.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.Foundations.LocalLanglands.LocalCentralUnits.PinNum
  depth: 11
  lines: 254
  line: Proves numerical bounds for a sum over the prime divisors of an extension degree.
  reading: >-
    For integers g ≥ 2 and n ≥ 1, let B(g,n) = ∑_{ℓ prime, ℓ|n}(g^(n/ℓ) − 1). The inequalities are nB(g,n) < g^n
    − 1 for all such pairs and 2nB(g,n) < g^n − 1 outside the four pairs (2,2), (3,2), (2,4), and (2,6). The proof
    uses a geometric-series estimate for n ≥ 12 and evaluates the prime-divisor sum explicitly in smaller degrees.
    PinFld uses B(g,n) to bound the number of nonzero elements lying in proper subfields of a degree-n extension
    of the prime field F_g.
  key_decls:
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.bd
    gloss: Defines B(g,n) as the sum of g^(n/ℓ) − 1 over the distinct prime divisors ℓ of n.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.bd_le
    gloss: For g ≥ 2 and n ≥ 1, the sum B(g,n) is at most 2g^⌊n/2⌋.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.big
    gloss: For g ≥ 2 and n ≥ 12, one has 2nB(g,n) + 1 < g^n.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.two_bd
    gloss: For g ≥ 2 and n ≥ 1 outside the four exceptional pairs, one has 2nB(g,n) + 1 < g^n.
  - name: UpperTheory.Zero.LLC.CharacterSumPairs.one_bd
    gloss: For every g ≥ 2 and n ≥ 1, one has nB(g,n) + 1 < g^n.
