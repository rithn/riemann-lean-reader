- module: >-
    Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.ExplicitFormulaErrorOfHostConditions
  depth: 7
  lines: 168
  line: >-
    Derives explicit-formula error data from host conditions and reduces family-wide zero-freeness to cyclic levels.
  reading: >-
    A subgroup of Dirichlet characters defines a level by taking their primitive representatives. If the cyclic
    level generated by each character in a family is zero-free in Re(s) > 1/2, then so is the family. The weighted
    combination of corrected, smoothed Chebyshev terms uses the zeta term with its main term subtracted and nontrivial
    character terms with logarithmic-derivative corrections. A growth condition links its eventual upper bound to
    zero-freeness. Under the range and share hypotheses, the main theorem obtains the error data from the host conditions
    by rescaling the logarithmic derivative bound from κ.C log X to κ.C J log x.
  key_decls:
  - name: Formalism.HC.Level.Gm
    gloss: >-
      Adds the zeta term to a weighted sum of the real parts of the nontrivial retained characters’ Chebyshev terms.
  - name: Formalism.HC.Level.ChebyshevGrowthImpliesZeroFree
    gloss: >-
      States that an eventual upper bound of y^θ for the weighted Chebyshev sum implies zero-freeness in Re(s) >
      θ for every retained character, for 0 < θ < 1.
  - name: Formalism.HC.zeroFreeOn_of_cyc
    gloss: >-
      Deduces zero-freeness in Re(s) > 1/2 for a family from zero-freeness of all primitive representatives in each
      member’s cyclic level.
  - name: Formalism.HC.EAtH
    gloss: >-
      Packages order agreement, character retention including the exceptional-character condition, share discrepancy,
      bounds at x on corrected Chebyshev terms for primitive representatives of bounded host characters, and bounds
      on logarithmic derivatives at 1.
  - name: Formalism.HC.EAtH.explicit_formula_error_of_host_conditions
    gloss: >-
      Establishes the error data with logarithmic derivative bound κ.C J log x from the host conditions, the range
      and share hypotheses, and κ.C ≥ 0.
  blueprint:
