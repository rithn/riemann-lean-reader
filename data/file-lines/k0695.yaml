    verdict: imprecise
    notes: >-
      Review full-review (material findings): 3 field edits (key_decls). Before and after text: check-log.tsv.
- module: Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.InertiaGaloisSymmetry.AnyFrame
  depth: 12
  lines: 421
  line: Constructs finite abelian frames and cyclotomic hosts from homomorphisms on unit groups modulo m.
  reading: >-
    The frame group is the image of the map pairing reduction modulo 2^(e+2) up to sign with a homomorphism ξ on
    units modulo m. Its projection onto the image of ξ has cyclic kernel. For the host, two Jacobi symbols give
    the signs in the Artin map, and the first sign governs the Galois action on a square root of −q. The Chinese
    remainder theorem gives Artin surjectivity and lifts witnesses for exactness at primes dividing m. AnyLevel
    specializes the construction to arbitrary subgroups of Dirichlet characters.
  key_decls:
  - name: Formalism.HC.ModData.frame
    gloss: >-
      Builds the frame from the joint image of the two unit-group maps, using a generator of the kernel of projection
      onto the image of ξ.
  - name: Formalism.HC.ModData.art_surj
    gloss: >-
      Proves that the Artin map from units modulo mqd onto the frame’s Galois group is surjective under the host
      hypotheses and coprimality of m and qd.
  - name: Formalism.HC.ModData.host
    gloss: >-
      Constructs the cyclotomic host from the frame for e ≥ 2 under the host and coprimality hypotheses, with Jacobi
      symbol (−d/ℓ) equal to 1 at every odd prime ℓ dividing m.
  - name: Formalism.HC.ModData.exists_sqq
    gloss: >-
      Produces a square root of −q in the host field on which each Galois automorphism acts by its first sign component.
  - name: Formalism.HC.ModData.exact
    gloss: >-
      If every prime ℓ dividing m admits a unit congruent to 1 modulo m/ℓ with nonidentity joint image, produces
      for each ℓ a unit congruent to 1 modulo mqd/ℓ with nonidentity Artin image.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: >-
    Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.InertiaGaloisSymmetry.OfCharLevel
  depth: 12
  lines: 376
  line: >-
    Constructs cyclotomic hosts for subgroups of even Dirichlet characters and identifies their primitive Artin
    pullbacks.
  reading: >-
    For an even character subgroup Ξ modulo M, the construction chooses the least divisor QS of lcm(2^(e+2), M)
    that is divisible by 2^(e+2) and through which the annihilator quotient map factors. For e ≥ 1, exactness at
    each prime ℓ dividing QS follows from minimality when QS/ℓ retains divisibility by 2^(e+2) and from an explicit
    unit at ℓ = 2 when that divisibility fails. Characters of Ξ descend through the quotient, and comparison on
    common units identifies their primitive characters with the Artin pullbacks from the frame character set Chat.
    AnyLevel reuses QS and the quotient map for arbitrary character subgroups.
  key_decls:
  - name: Formalism.HC.EvenGrp.QS
    gloss: >-
      Selects the least modulus divisible by 2^(e+2) among the divisors of lcm(2^(e+2), M) through which the map
      to the quotient by the annihilator of Ξ factors.
  - name: Formalism.HC.EvenGrp.exact_data
    gloss: >-
      For e ≥ 1 and each prime ℓ dividing QS, produces a unit congruent to 1 modulo QS/ℓ with nonidentity image
      in the frame group.
  - name: Formalism.HC.EvenGrp.host
    gloss: >-
      Constructs the cyclotomic host for e ≥ 2 under the hypotheses on q and d, coprimality of M and qd, and the
      Jacobi-symbol condition at odd primes dividing M.
  - name: Formalism.HC.EvenGrp.prim_theta
    gloss: >-
      Identifies the primitive character associated to a member of Ξ with the primitive Dirichlet character obtained
      by pulling its frame lift back along the Artin map.
  - name: Formalism.HC.EvenGrp.keptEqChat
    gloss: >-
      Shows that the primitive characters inducing members of Ξ are exactly those obtained by Artin pullback and
      passage to the primitive character from the frame character set Chat.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.ConductorsKronecker.CostPropositionBasicBound
  depth: 13
  lines: 187
  line: >-
    Bounds a centered weighted von Mangoldt sum by combining a character average with explicit error estimates.
  reading: >-
    The basic inequality rewrites the averaged top excess using the character-balance identity. It estimates the
    change from replacing the weights by a Lipschitz bound and uses the thick-set average formula to isolate the
    four-character contribution and bound the thin remainder. The small-cost hypotheses absorb the displacement
    cost and reduce the remaining additive error to Err + 2|TT|mb/x. Size-window inequalities then give Gz(x) ≤
    x^(1/2 + (C+3)ε), which the importer RamificationTwoAndConjugationAtQAndD uses to establish its scale bound.
  key_decls:
  - name: UpperTheory.GL.cost_proposition_basic_bound
    gloss: >-
      Under the host facts and growth hypotheses, bounds the density-weighted main term after subtracting 3x^(1/2+ε)
      and the displacement cost by Err plus the thin-set and Lipschitz errors.
  - name: UpperTheory.GL.card_mul_delta_le_err
    gloss: >-
      Under the additional small-cost hypotheses, bounds |TT|mb(δ₂/2)(Gz(x) − 4x^(1/2+ε)) by Err + 2|TT|mb/x, where
      δ₂ is the density of T2 in H.
  - name: UpperTheory.GL.cost_proposition_at_scale
    gloss: >-
      Under the host facts, growth, small-cost, and size-window hypotheses, gives the pointwise upper bound Gz(x)
      ≤ x^(1/2 + (C+3)ε).
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.ThickFrames.NotGoodLe
  depth: 13
  lines: 138
  line: >-
    Bounds the probability that a Bernoulli subset with one forced index fails the interval and tile conditions
    for a good orbit.
  reading: >-
    With independent inclusion probabilities in [3δ/4, δ], 0 ≤ δ ≤ 1, one index forced into the sample, u ≥ 1 and
    (M₀ + 1)((6r + 1)u) ≤ n, the theorem bounds failure by two occupancy bounds and a marked-tile bound. The window
    lemma turns a bound b for a single window into nb for n cyclic windows, accounting for the possible count increase
    of one on insertion. The proof takes a union bound using the subset estimate C(L₂,K)δ^K for short windows and
    the binomial upper tail at N₁ − 1 for intervals. The theorem topsGroup uses this estimate to control weighted
    orbit failures in its subset selection.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.not_good_le
    gloss: >-
      Under the tile-length hypothesis, bounds the failure probability by n times the sum of the short-window binomial
      estimate, the marked-tile failure bound, and the interval binomial tail.
  - name: ngl_windows_le
    gloss: >-
      If a Bernoulli sample on any set of at most L positions has probability at most b of reaching K′, then after
      forcing one index the probability that any of n length-L cyclic windows exceeds K ≥ K′ is at most nb.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.ThickFrames.SharesOfCounts
  depth: 13
  lines: 112
  line: Converts absolute coset count bounds into relative proportion bounds and a cardinality estimate.
  reading: >-
    Let A₀ have order n and index m in a finite abelian group A. If the counts of T in A₀ and in each other coset
    are within D of δn and 3δn/4, respectively, with δ > 0, D ≥ 0, 4mD ≤ ηδn, and η ≤ 1, then δ|A|/2 ≤ |T| ≤ 2δ|A|.
    Dividing the count estimate by |T| > 0 shows that the corresponding coset proportions differ from 4/(3m+1) and
    3/(3m+1) by at most η. Summing over all γ ∈ A counts every member of T exactly n times and bounds the error
    in |T| from (3m+1)δn/4 by mD. The theorem topsGroup uses this estimate to convert Bernoulli sampling discrepancies
    into coset proportion bounds.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.shares_of_counts
    gloss: >-
      Derives a factor-two cardinality bound and coset proportion bounds when every count error is at most D, with
      D ≥ 0, δ > 0, η ≤ 1, and 4mD ≤ ηδn.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.ThickFrames.orbitSum
  depth: 13
  lines: 159
  line: >-
    Factors a Bernoulli-weighted orbit sum into a point’s inclusion weight and a sum with that point forced in.
  reading: >-
    For the orbit b + ⟨h⟩ in a finite abelian group, the theorem indexes its points from 0 to ord(h)−1 and identifies
    the index i₀ of a specified point t. For real weights p, the product-weight sum for selecting t and satisfying
    an orbit property equals p(t) times the corresponding sum over other orbit indices with i₀ inserted. If all
    p-values lie in [0,1], the sums are probabilities under independent sampling. The proof sums out weights off
    the orbit, reindexes by the additive order, and factors out the weight at i₀. The theorem topsGroup uses the
    identity to estimate the joint event that a point is selected and its orbit fails the test.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.orbit_sum
    gloss: >-
      Expresses the joint Bernoulli weight of selecting t and satisfying an orbit property as p(t) times the weight
      of the property with t forced in.
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.fibre_sum
    gloss: >-
      Sums the product weights of all subsets with a prescribed restriction along an injection to obtain the product
      weight on that restriction.
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.marginal
    gloss: >-
      Identifies the expectation of any function of a restricted subset with its expectation under the pulled-back
      product weights.
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.fin_sum_eq
    gloss: >-
      Reindexes the expectation over length-n finite indices as an expectation over the integers from 0 to n−1.
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.bernoulliExpectation_mem_and
    gloss: >-
      Factors the weight of a joint membership and subset event by extracting the specified index’s inclusion weight
      and inserting that index into the remaining sample.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (minor findings): 2 field edits (line, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.ThickFrames.orbitTerms
  depth: 13
  lines: 261
  line: >-
    Proves that the prescribed tiles fit in the orbit and that the three failure terms sum to at most C_b x^(−2).
  reading: >-
    For fixed ε > 0 and bounded L₂, the estimates hold uniformly for sufficiently large x and orbit lengths x^(ε/4)
    ≤ n ≤ Cₒx^(2+8ε). The tile count grows logarithmically and the tile length is O(x^(ε/8)), so the prescribed
    tiles fit within n positions. The proof bounds the short-window term by a power of δ = x^(−ε/8), the marked-tile
    term by exponential decay, and the long-window binomial tail by a geometric series. The theorem topsGroup uses
    the tile-fit condition and the resulting inverse-square bound to control failures in its subset selection.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.orbit_terms
    gloss: >-
      For fixed ε > 0, Cₒ and L_b, gives C_b > 0 and a uniform large-x threshold ensuring the tiles fit and the
      three orbit-failure terms sum to at most C_b x^(−2) whenever x^(ε/4) ≤ n ≤ Cₒx^(2+8ε) and L₂ ≤ L_b.
  - name: ot_binUpper_le
    gloss: >-
      For G independent Bernoulli trials with success probability 0 ≤ δ ≤ 1, bounds the probability of at least
      N successes by exp(−N) when N ≥ 6eGδ.
  - name: ot_exists_log_le_rpow
    gloss: For positive C and a, proves that C(log x + 1) ≤ x^a for all sufficiently large x.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 2 field edits (key_decls). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.ThickFrames.select
  depth: 13
  lines: 174
  line: >-
    Proves a Bernoulli selection theorem that controls class counts and weighted failures in the same subset.
  reading: >-
    On a finite set of size N partitioned into classes, sample points independently with probabilities at most δ.
    For a finite family of tests with nonnegative weights, assume each point’s joint probability of selection and
    failure is at most βδ, allowing the test to depend on the sampled subset. For D > 0 with D ≥ √(2δN), some subset
    has every class count within D of its mean and a weighted count of failures among selected points at most 4βδN
    times the total test weight. The proof averages squared discrepancies and weighted failures using the Bernoulli
    second-moment identity. The theorem topsGroup applies the result to subgroup cosets and orbit tests.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.select
    gloss: >-
      Selects one subset satisfying simultaneous class discrepancy and weighted failure bounds from pointwise bounds
      on joint selection and failure probabilities.
  - name: sel_moment
    gloss: >-
      Expresses the second moment of a constant plus a sum of independent Bernoulli variables with coefficients
      g(a) as the squared mean plus ∑ₐ g(a)² p(a)(1−p(a)).
  - name: sel_exists
    gloss: >-
      For a finite probability distribution, finds a positive-weight outcome whose score is at most the mean score.
  - name: sel_ncard
    gloss: Expresses the number of elements satisfying a predicate as the sum of its indicators.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 2 field edits (key_decls, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.ThickFrames.MarkedLowBounds
  depth: 14
  lines: 95
  line: Bounds the marked-tile expression between 10^(−(6r+1)) and 1 at the reciprocal-density scale.
  reading: >-
    For 0 < δ ≤ 1/100 and u = ⌈1/δ⌉, the theorem bounds markedLow(δ,r,u) uniformly in δ for each r. The proof uses
    log(1−δ) ≥ −δ/(1−δ) to bound (1−δ)^u below by 3/10, then uses the rounding bounds on ⌊u/2⌋ to bound the second
    factor below by 1/10. Both factors are at most 1. The theorem orbit_terms uses the lower bound to turn the repeated
    marked-tile failure term into exponential decay.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.markedLow_bounds
    gloss: For every nonnegative integer r and 0 < δ ≤ 1/100, proves 10^(−(6r+1)) ≤ markedLow(δ,r,⌈1/δ⌉) ≤ 1.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: Development.AutomorphicArithmetic.ThickFrames.TailLe
  depth: 14
  lines: 41
  line: >-
    Bounds the upper tail of a sum of independent Bernoulli variables with possibly unequal success probabilities.
  reading: >-
    If at most G independent Bernoulli trials each have success probability at most δ, the probability of at least
    K successes is bounded both by the binomial coefficient C(G,K) times δ^K and by the upper tail of Binomial(G,δ).
    The proof compares expectations of functions increasing under inclusion by replacing each success probability
    with δ, using induction on the trial set. The theorem not_good_le uses the two bounds for its two window occupancy
    conditions.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.tail_le
    gloss: >-
      Gives both the binomial-coefficient bound and the binomial upper-tail bound for the number of successes among
      at most G trials with rates bounded by δ.
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.bernoulliExpectation_le_of_monotone
    gloss: >-
      Bounds the expectation of any inclusion-monotone function of a Bernoulli subset by its expectation under the
      common inclusion probability δ.
