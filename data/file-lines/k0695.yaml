    gloss: >-
      The selected Dirichlet character is primitive and agrees with the host-field character on Frobenius at every
      unramified prime.
  - name: Formalism.MainNotions.Lnk.blockReal_at_of
    gloss: >-
      The Bessel identity realizes the embedded lattice pairing matrices, up to invertible basis changes, as selected
      rows of orthonormal-coordinate matrices after scalar transport by identity or conjugation and an isometric
      column embedding.
  - name: Formalism.MainNotions.Lnk.frameF_of
    gloss: >-
      A family of frame realizations yields frame bounds under the lattice, fullness and chosen parameter hypotheses.
  - name: Formalism.MainNotions.Lnk.estimates_of_points_family
    gloss: >-
      Family coverage and pointwise prime estimates at sufficiently large admissible scales imply the family small-order-prime
      hypothesis.
  - name: Formalism.MainNotions.Lnk.lossF_of_core
    gloss: The family small-order-prime hypothesis yields simultaneous loss bounds with exponent zero.
