    preserved under eventual inclusion. The Landau condition requires a zero to the right of Re(s) = θ to force
    a point with Gm(y) > y^θ in every sufficiently late window. Form B asks that for each λ > 1 and 0 < θ < 1 an
    upper bound Gm(x) ≤ x^θ on arbitrarily late λ-windows imply zero-freeness in Re(s) > θ for the retained characters.
