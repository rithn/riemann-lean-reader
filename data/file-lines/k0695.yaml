- module: Formalism.SharpRestriction.GlobalSchurBounds.TopDensityNGeSixteen
  depth: 8
  lines: 1940
  line: >-
    Identifies primitive Dirichlet characters of the host field and derives conditional lattice-frame, slope and
    loss bounds.
  reading: >-
    Host-field characters are matched with primitive Dirichlet characters by their values on unramified Frobenius
    elements, yielding identities for the associated weighted prime-power sums. Orthonormal bases turn the Bessel
    identity into a block matrix realization, and Hilbert–Schmidt bounds feed into frame estimates. Separate reductions
    turn placewise inequalities into lattice slope bounds and average over admissible integer weights to obtain
    loss bounds with exponent zero. LinkPk uses the frame and character comparisons to assemble its global theorem.
  key_decls:
