- module: Development.AutomorphicArithmetic.ThickFrames.TilesLe
  depth: 14
  lines: 105
  line: >-
    Bounds the probability that some cyclic block has no marked tile when one index is forced into the sample.
  reading: >-
    With independent inclusion probabilities in [3δ/4, δ], the theorem bounds the probability that some cyclic block
    of M₀+1 consecutive tiles has no marked tile by n(1−markedLow(δ,r,u))^M₀. The tiles have length (6r+1)u, with
    u ≥ 1 and (M₀+1)(6r+1)u ≤ n. Omitting the tile that can contain the forced index leaves at least M₀ disjoint
    tiles per block. The proof multiplies their failure probabilities by independence and takes a union bound over
    starting tiles. The theorem not_good_le uses this as the tile contribution to the orbit-failure bound.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.tiles_le
    gloss: >-
      Bounds the probability that the marked-tile condition fails after inserting a specified index into a Bernoulli
      sample.
  - name: bernoulliExpectation_one_sub
    gloss: Shows that the Bernoulli expectation of 1−f is 1 minus the expectation of f.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (minor findings): 2 field edits (line, reading). Before and after text: check-log.tsv.
- module: Development.AutomorphicArithmetic.ThickFrames.MarkedGe
  depth: 15
  lines: 185
  line: >-
    Lower-bounds the probability that independent Bernoulli sampling marks a tile with an alternating occupancy
    pattern.
  reading: >-
    With inclusion probabilities in [3δ/4, δ], a tile of 6r+1 consecutive cells of length u is marked with probability
    at least markedLow(δ,r,u). The pattern alternates 3r+1 empty cells with 3r cells containing exactly one selected
    point, at an even integer. The proof bounds the empty-cell and singleton probabilities separately, counting
    at least ⌊u/2⌋ even integers in each cell, then multiplies the bounds by independence. The theorem tiles_le
    uses this estimate to bound the probability that some cyclic block of M₀ + 1 tiles has no marked tile after
    inserting i₀.
  key_decls:
  - name: UpperTheory.BernoulliSumsFrobeniusOrbits.marked_ge
    gloss: Bounds the probability of the alternating marked-tile pattern below by the product markedLow(δ,r,u).
  - name: one_sub_pow_le_bernoulliExpectation_empty
    gloss: >-
      Bounds the probability of selecting no element of C below by (1−δ)^|C| when every inclusion probability is
      at most δ.
  - name: le_bernoulliExpectation_singleton_even
    gloss: >-
      For independent inclusion probabilities in [3δ/4, δ] with 0 ≤ δ ≤ 1, bounds the probability of selecting exactly
      one point at an even integer in a length-u interval below by ⌊u/2⌋(3δ/4)(1−δ)^(u−1).
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
