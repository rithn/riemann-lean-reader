  line: Proves conditional nonvanishing of Dirichlet L-functions in the half-plane Re s > 1/2.
  reading: >-
    Given Green’s classification of cuspidal characters of finite general linear groups, the host-field hypothesis
    VWin, and a global interpolation hypothesis bundle, plugWin combines the interpolation theorem with host fields
    at parameter 3/2 to obtain nonvanishing for primitive characters. The theorem plugAll extends this to all characters
    using the finite Euler factors relating each character to its primitive associate. The resulting proposition
    excludes the principal character at s = 1. A direct importer uses it to put every zero of a primitive Dirichlet
    L-function in the open critical strip on the critical line.
