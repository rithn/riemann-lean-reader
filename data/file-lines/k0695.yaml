- module: Formalism.SharpRestriction.RamificationFrobenius.TotientGaloisClasses.Analytic
  depth: 8
  lines: 176
  line: >-
    Defines smoothed Chebyshev terms and analytic host conditions, and proves uniqueness of primitive inducing characters.
  reading: >-
    The smoothed Chebyshev term uses von Mangoldt weights and, for a nonprincipal character, adds y times the logarithmic
    derivative at 1. Primitive inducing characters are unique because agreement on integers coprime to the host
    modulus gives equality after lifting to a common modulus, where the conductors recover the primitive moduli.
    The host conditions combine character retention with Chebyshev and logarithmic derivative bounds. The explicit-formula
    error theorem uses the retention conditions and the pointwise and logarithmic derivative bounds.
  key_decls:
  - name: Formalism.HC.An.gChi
    gloss: >-
      With smoothing weight max(y/n − 1, 0), the principal branch is the untwisted von Mangoldt sum minus y(log
      y − 1 − γ), and the nonprincipal branch is the χ-weighted von Mangoldt sum plus y L′(1, χ)/L(1, χ).
  - name: Formalism.HC.An.Induces.unique
    gloss: >-
      Two primitive Dirichlet characters that agree with the same function on integers coprime to a fixed nonzero
      modulus are equal.
  - name: Formalism.HC.HostRaw.isPrimOf_iff
    gloss: >-
      A primitive Dirichlet character induces a given host character exactly when it is the primitive representative
      of the pullback along the host Artin map.
  - name: Formalism.HC.HostConditions
    gloss: >-
      Requires the retained characters to come from the plus class, specifies exceptional-character retention, and
      imposes a large-argument Chebyshev bound, a pointwise bound, and logarithmic derivative bounds at 1.
  - name: Formalism.HC.PreHostAn
    gloss: >-
      Extends the preliminary host conditions by imposing the analytic host conditions on the underlying host.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (key_decls). Before and after text: check-log.tsv.
