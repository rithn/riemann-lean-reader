- module: Development.AutomorphicArithmetic.FrobeniusLocalisation.SizeDefs
  depth: 8
  lines: 63
  line: >-
    Defines Frobenius representatives and two bounded sets of inert primes, and proves that inert primes are coprime
    to the host modulus.
  reading: >-
    A prime p is inert when the Jacobi symbol (−d/p) equals −1. Reduction modulo 8 rules out the prime 2, and the
    host divisibility lemma then gives coprimality with the host modulus. The first bounded set requires Frobenius
    to be distinct from complex conjugation and to generate a subgroup containing it, and the second requires the
    second Frobenius component to lie in the kernel of hH. The frame definitions record the size of the kernel of
    hH, membership in a translated image, and the place associated to g^iτ. The Frobenius representative is used
    to describe arithmetic Frobenius and prime decomposition in the host field.
  key_decls:
  - name: UpperTheory.HF.Formalism.HC.HostRaw.frobG
    gloss: >-
      Assigns to a natural number coprime to the host modulus the Artin image of its residue class, and assigns
      the identity in the remaining cases.
  - name: UpperTheory.HF.Formalism.HC.HostRaw.Inert
    gloss: Selects primes p for which the Jacobi symbol (−d/p) equals −1.
  - name: UpperTheory.HF.Formalism.HC.HostRaw.DRC
    gloss: >-
      Collects inert primes p ≤ B whose Frobenius generates a subgroup containing complex conjugation and is distinct
      from complex conjugation.
  - name: UpperTheory.HF.Formalism.HC.HostRaw.DRh
    gloss: Collects inert primes p ≤ B for which the second component of Frobenius lies in the kernel of hH.
  - name: UpperTheory.HF.Formalism.HC.HostRaw.Inert.coprime
    gloss: Proves that every inert prime is coprime to the host modulus.
