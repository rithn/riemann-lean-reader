    Matches host-field character sums with weighted prime-power sums and derives a conditional Riemann hypothesis.
  reading: >-
    Additive coordinates transport inertia and Frobenius, and primitive Dirichlet characters give the corresponding
    weighted character sums. Matching the inert-prime terms and the ramified term at d gives an exact balance between
    the prime-power sum, its main term and the character remainder. A thick-set estimate yields G(x) ≤ x^(1/2 +
    (C + 3)ε), and the eventual bounds for all sufficiently small ε imply the Riemann hypothesis under the family
    assumptions. FrameCodeOfAdditive uses the prime-power sum comparison to identify its arithmetic loss term.
  key_decls:
  - name: Formalism.MainNotions.ZetaZeroFreeRegion.Br.fieldFacts
    gloss: >-
      In additive coordinates, inertia is subgroup membership and the arithmetic Frobenius lifts are the corresponding
      inertia coset.
  - name: Formalism.MainNotions.ZetaZeroFreeRegion.Br.prim_val
    gloss: >-
      At every positive integer, the primitive Dirichlet character attached to a host-field character agrees with
      the arithmetic value computed in additive coordinates.
  - name: Formalism.MainNotions.ZetaZeroFreeRegion.Br.balance
    gloss: >-
      For a > 0 and weights positive on D.R.Psi, the weighted prime-power sum at the top place tau1 t minus its
      main term equals the character remainder there.
  - name: Formalism.MainNotions.ZetaZeroFreeRegion.Br.proposition_eleven_two_at_scale
    gloss: >-
      At a scale satisfying the large-x conditions, nonnegative C and Cd, the derivative-integral estimate, character
      bounds, the top-excess bound, and size and place hypotheses give G(x) ≤ x^(1/2 + (C + 3)ε).
  - name: Formalism.MainNotions.ZetaZeroFreeRegion.rh_of
    gloss: >-
      For a positive cutoff ε₀, the family Proposition 2.6 estimate, character-sum bounds, uniform top-excess bound,
      and size and place hypotheses imply the Riemann hypothesis.
  blueprint: []
  status: fixed
