    to evaluation at the identity on a translated source vector. Theta descent and the induced-model isomorphisms
    identify evaluation at the identity with a map satisfying Jacquet intertwining laws. Jacquet-map uniqueness
    gives vanishing of the first restriction or proportionality of the second to the first on UAt. The auxiliary
    lemmas verify identity membership and the character conditions for the Weil action, and H1SplitConfigBIntegralStatement
    restates the main theorem.
