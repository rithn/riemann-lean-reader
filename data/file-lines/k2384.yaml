- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.PolEqISupFockDeg
  depth: 9
  lines: 66
  line: >-
    Defines the archimedean Fock degree filtration and proves that it exhausts the polynomial Weil space.
  reading: >-
    The filtration starts with the span of Gaussians and at each step adjoins the Heisenberg derivatives of vectors
    in the preceding step. Its increasing union equals the polynomial Weil space because it contains the Gaussians
    and is closed under those derivatives. A linear map nonzero on the polynomial space has a first filtration step
    with nonzero image, which defines its lowest Fock part. In matched Configuration A under KP, H1SplitConfigAGaussian
    extends agreement by a given scalar on this part to the full maps when both satisfy the same archimedean Frobenius
    conditions.
