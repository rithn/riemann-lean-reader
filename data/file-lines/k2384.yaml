- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.GoodCharactersParity
  depth: 22
  lines: 202
  line: >-
    Proves that mα(w) and a′ have the same parity at every infinite place w for a good base and good character data.
  reading: >-
    For a good base and good character data, the proof evaluates α on the idèle of the totally real base field with
    component −1 at w and 1 elsewhere, viewed in the CM extension. The infinity type gives (−1)^mα(w), while the
    restriction formula gives (−1)^a′ once the idèle is shown to lie outside the product of principal idèles and
    norms. A factorization of that kind would make its principal factor a local norm everywhere except w, where
    the quadratic norm form is nonnegative and the sign is negative, contradicting Hilbert reciprocity. The statement
    module restates the resulting parity identity.
  key_decls:
  - name: GlobalTheory.RealLift.exists_form_of_one_eq
    gloss: >-
      If the image of t times a value of the binary form X² − δY² is 1, then the image of t is itself represented
      by that form.
