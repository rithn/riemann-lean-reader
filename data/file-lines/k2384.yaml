- module: Development.AbelianVarietyTheory.Definitions.Divisors.GenSubHwOfSurjective
  depth: 7
  lines: 470
  line: >-
    Proves that highest-weight generation descends through surjective intertwiners and constructs archimedean coefficient
    modules.
  reading: >-
    A surjective intertwiner carries generation by a fixed highest-weight space to its target. At a real place of
    a CM extension, lifted matrix exponentials give one-parameter subgroups whose right derivatives determine the
    complex Lie algebra action, which descends to the image of a linear map from a source module because compatibility
    with right differentiation makes its kernel stable. Standard matrix coefficients in an adapted frame give stable
    modules generated by the first coordinate weight. The hyperbolic plane gives an example with a nonzero lowering
    operator. The adapted-frame condition is used in extending frames for twisted coefficient formulas.
  key_decls:
  - name: GlobalTheory.ThK.RealK.genSub_hw_of_surjective
    gloss: >-
      If the source is generated by its highest-weight space of weight Λ, then the target of a surjective intertwiner
      is generated by its highest-weight space of the same weight.
  - name: GlobalTheory.ThK.RealK.exists_lineAt
    gloss: >-
      For a CM extension and a frame for the Hermitian form at the chosen real place, every element of the real
      unitary Lie algebra in frame coordinates is realized by a continuous adelic one-parameter subgroup supported
      at the chosen real place.
  - name: GlobalTheory.ThK.RealK.genBy_range
    gloss: >-
      For a CM extension and a Hermitian frame at the chosen real place, the image of a highest-weight-generated
      GKMod under a linear map compatible with right differentiation inherits the Lie algebra action and is generated
      at the same highest weight.
  - name: GlobalTheory.ThK.RealK.stable_genBy_coef
    gloss: >-
      For a CM extension and an adapted frame with a nonempty positive block, the image of each row coefficient
      map for the standard representation is stable and generated by the highest-weight space of the first positive
      coordinate weight.
  - name: GlobalTheory.ThK.RealK.exists_stable_hyp
    gloss: >-
      Over a CM extension, the hyperbolic plane with the specified hyperbolic frame admits a stable function module
      generated at the first positive coordinate weight on which the matrix unit from the positive to the negative
      coordinate acts nontrivially for every compatible right differential action.
