    gloss: >-
      For each split embedding t there are coordinates and two local characters such that a larger local unitary
      element lies in the unitary unipotent radical if its matrix lies in the matrix unipotent radical, and if its
      matrix equals a block-diagonal Levi matrix then the smaller local unitary component has the middle block as
      its matrix in identity coordinates and the scalar twist is the product of the two characters on the outer
      determinants.
