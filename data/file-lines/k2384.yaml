    δ with σ(δ) = −δ such that the completed lattice is self-dual for δJᵀ. The proof starts with an integer θ satisfying
    θ + σ(θ) = 1, rescales 2θ − 1 to a local unit, and multiplies it by a local generator of the base field’s absolute
    different. The trace-dual estimates give both lattice inclusions after multiplication by a base integer prime
    to the place, which is a unit in the completed ring of integers. The importing skew-scalar existence theorem
    invokes this result directly.
