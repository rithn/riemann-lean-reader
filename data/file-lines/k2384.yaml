- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.IndLineInf
  depth: 7
  lines: 71
  line: Defines finite and archimedean multiplicity-one conditions for theta induction.
  reading: >-
    At a finite place, induction maps satisfy right-translation equivariance on Schwartz–Bruhat vectors, left unipotent
    invariance, and a Levi transformation law twisted by χ|·|^z. At infinity, Frobenius maps satisfy unipotent annihilation
    and twisted infinitesimal Levi and maximal compact compatibility on polynomial Weil vectors. The multiplicity-one
    predicates require proportionality over ℂ to any nonzero admissible map, testing both nonvanishing and proportionality
    on the local unitary group at finite places and on the full linear maps at infinity. H1A proves both predicates
    for matched data in configurations A and B under KP.
  key_decls:
  - name: GlobalTheory.IndLine.IsIndMap
    gloss: Specifies the right-translation, unipotent, and twisted Levi laws for a finite-place induction map.
  - name: GlobalTheory.IndLine.IndLineFin
    gloss: >-
      Requires every admissible finite-place induction map to be a complex multiple of any admissible map whose
      restriction to the local unitary group is nonzero, with equality on that group.
  - name: GlobalTheory.IndLine.IsFrobInf
    gloss: >-
      Specifies unipotent annihilation and twisted infinitesimal Levi and maximal compact compatibility for an archimedean
      Frobenius map on polynomial Weil vectors.
  - name: GlobalTheory.IndLine.IndLineInf
    gloss: >-
      Requires every admissible archimedean Frobenius map to be a complex multiple of any nonzero admissible Frobenius
      map.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (reading). Before and after text: check-log.tsv.
