      If every value of X² − δY² over every base algebra is represented by the CM norm, then δ has nonpositive image
      at each real embedding.
  - name: GlobalTheory.RealLift.even_mα_add
    gloss: >-
      For a good base B and character data good relative to B, a, and a′, the integer mα(w) + a′ is even at every
      infinite place w.
  blueprint: []
