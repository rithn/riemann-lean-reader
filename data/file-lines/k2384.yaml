      the least such degree when the set is nonempty.
  - name: GlobalTheory.IndLine.lowPartInf
    gloss: Defines the lowest Fock part as the image of the filtration step at the lowest degree.
  - name: GlobalTheory.IndLine.lowPartInf_ne_bot
