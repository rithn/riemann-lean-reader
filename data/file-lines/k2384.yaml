  line: Proves nonsplit finite-place multiplicity one for theta induction in configuration A under KP.
  reading: >-
    For matched Weil data and twist α with norm exponent a′/2, compact Levi lifts and vacuum invariance force each
    induction map to send the projected source vacuum, at the identity, into the target spherical line. A unipotent–Levi–compact
    factorization propagates that scalar to all local group elements, and irreducibility extends the comparison
    to all source vectors. Two auxiliary lemmas give identity membership and closure under multiplication for the
    local unitary group. H1SplitConfigAIntegralStatement restates the multiplicity-one theorem.
  key_decls:
  - name: GlobalTheory.IndLine.AlphaInert.indLine
    gloss: >-
      Given KP, matched configuration A data and a finite place v admitting no F-algebra embedding E → F_v, either
      the first of two induction maps with twist α and exponent a′/2 vanishes on the local unitary group or the
      second equals a single complex scalar times the first for every source vector and local group element.
  - name: GlobalTheory.IndLine.AlphaInert.one_mem_uAt
    gloss: The identity belongs to the unitary subgroup supported at the finite place v.
  - name: GlobalTheory.IndLine.AlphaInert.mul_mem_uAt
    gloss: >-
      The product of two elements supported at the same finite place v is again supported there in the unitary group.
  blueprint: []
  status: fixed
