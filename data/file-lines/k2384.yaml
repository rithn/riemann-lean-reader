- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.LeviCharacterExponentArchimedean
  depth: 22
  lines: 90
  line: >-
    Proves that the character on a maximal compact Levi element is determined by its archimedean exponents.
  reading: >-
    A nonzero rational eigenvector forces its adelic eigenvalue t to have finite components equal to 1 when the
    unitary element has trivial finite components. At each infinite place, preservation of the form and commutation
    with the Cartan involution force the local eigenvalue t_w to have modulus 1. For the eigenvector of an adapted
    Levi, these facts give adelic absolute value 1, so χ(t)|t|^z equals ∏_w t_w^m(w) for every real z when χ has
    archimedean exponents m(w). The statement module restates this character formula.
  key_decls:
  - name: GlobalTheory.ThK.LeviChar.at_eigen
    gloss: >-
      A unitary element with trivial finite components acts on a nonzero rational eigenvector by a scalar whose
      finite components are all 1.
  - name: GlobalTheory.ThK.LeviChar.norm_eigen
    gloss: >-
      In the CM skew-Hermitian setting, an adelic scalar by which a maximal compact element acts on a nonzero rational
      eigenvector has modulus 1 at every infinite place.
  - name: GlobalTheory.ThK.LeviChar.char_levi_KInf
    gloss: >-
      Over a CM extension with a skew-Hermitian ambient space and an adapted plane, if χ has archimedean exponents
      m(w), the scalar t of a Levi element in the archimedean maximal compact satisfies χ(t)|t|^z = ∏_w t_w^m(w)
      for every real z.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (key_decls). Before and after text: check-log.tsv.
- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.PolynomialInclusionFockActionComm
  depth: 22
  lines: 82
  line: >-
    Proves that polynomial inclusion intertwines the Fock action with the action of the zero-extended matrix.
  reading: >-
    The inclusion renames variables by keeping the first index coordinate fixed and skipping one index in each of
    the two summands of the second coordinate, preserving the sign test that defines the raising and lowering operators.
    It transports multiplication by a variable and partial differentiation to the corresponding operators on the
    larger polynomial ring, hence intertwines the operators for individual matrix units. Expanding an arbitrary
    matrix in matrix units gives the full intertwining identity, which the statement module restates.
  key_decls:
  - name: GlobalTheory.FockInclAct.polIncl_pderiv
    gloss: >-
      Differentiating before inclusion agrees with differentiating the included polynomial in the corresponding
      renamed variable.
  - name: GlobalTheory.FockInclAct.polIncl_lowB
    gloss: >-
      Polynomial inclusion intertwines the lowering operator with the lowering operator at the corresponding index.
  - name: GlobalTheory.FockInclAct.polIncl_omE
    gloss: >-
      Polynomial inclusion transports the operator omE for a pair of indices with a common first coordinate to the
      operator for the renamed pair.
  - name: GlobalTheory.FockInclAct.extMat_Eab
    gloss: Zero extension sends a matrix unit to the matrix unit at the corresponding embedded row and column.
  - name: GlobalTheory.FockInclAct.polIncl_comp_fockAct2
    gloss: >-
      Acting by Y and then including agrees with including first and applying the Fock action of the zero extension
      of Y.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
