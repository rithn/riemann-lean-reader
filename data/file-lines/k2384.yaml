  reading: >-
    For a good base and an adapted plane in the skew-Hermitian setting, every element of the smaller local lattice
    stabilizer has a Levi lift in the larger one. Writing ι for the adapted embedding and Q for its orthogonal retraction,
    the proof extends k by the matrix 𝟙 + ι(mat(k) − 𝟙)Q, which fixes both vectors of the adapted plane. The lattice
    splitting gives lattice preservation for Q and a separate adaptedness condition gives it for ι, so the lift
    and its inverse preserve the larger adelic lattice and the lift retains its support at the given place. This
    supplies the Levi maximal compact existence statement.
  key_decls:
  - name: GlobalTheory.LeviK.proj
    gloss: Defines the orthogonal retraction matrix in terms of the two Gram matrices and the embedding.
  - name: GlobalTheory.LeviK.proj_mul
    gloss: >-
      Shows that the retraction is a left inverse to the embedding when the smaller form is nondegenerate and the
      embedding pulls back the larger form to it.
  - name: GlobalTheory.LeviK.leviPt
