- module: Development.AbelianVarietyTheory.Proofs.DivisorProofs.LeadMinorMulDiagonal
  depth: 21
  lines: 253
  line: >-
    Proves how adjoining two scalar coordinates and right multiplication by a diagonal matrix affect leading minors
    and frame coefficients.
  reading: >-
    The construction inserts one column into each block of a frame and extends its action matrix by cI₂ when both
    new columns have eigenvalue c. Reindexing into block diagonal form shows that the leading minor through the
    insertion and both diagonal-block determinants each acquire a factor c. A right diagonal multiplier scales a
    leading minor by the product of its selected entries, giving the factor c^e₁ c^e₂ c^e₃ for the coefficient using
    the size A+1 leading minor when only the inserted columns are scaled by c. The archimedean frame identities
    also compose by pointwise matrix multiplication.
  key_decls:
  - name: GlobalTheory.TwCoef.leadMinor_extM
    gloss: >-
      The leading minor of size A+1 in the extended first block equals c times the original leading minor of size
      A.
  - name: GlobalTheory.TwCoef.leadMinor_mul_diagonal
    gloss: >-
      Right multiplication by a diagonal matrix multiplies the leading minor by the product of its corresponding
      diagonal entries.
  - name: GlobalTheory.TwCoef.coef_mul_extM
    gloss: >-
      Scaling the two inserted columns by c multiplies the coefficient using the leading minor of size A+1, through
      the first insertion, by c^e₁ c^e₂ c^e₃ for integer exponents e₁, e₂, e₃.
  - name: GlobalTheory.TwCoef.mul_extFrame
    gloss: >-
      If K acts on the original frame through g and on each new column by c, then K acts on the enlarged frame through
      the reindexed block matrix g ⊕ cI₂.
  - name: GlobalTheory.TwCoef.isReading_mul
    gloss: >-
      The product of two group elements acts on the archimedean frames through the pointwise product of their corresponding
      matrices.
