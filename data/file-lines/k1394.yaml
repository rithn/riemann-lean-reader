- module: Development.AbelianVarietyTheory.Proofs.DegenerationProofs.ExistsAddValuation
  depth: 10
  lines: 135
  line: >-
    Constructs normalized additive valuations on the algebraic closure of ℚₚ and gives a summability criterion.
  reading: >-
    The spectral norm formula using the constant term and degree of the minimal polynomial gives log ‖x‖ ∈ ℚ log
    p for x ≠ 0. For 0 < ‖π‖ < 1, the quotient log ‖x‖ / log ‖π‖ defines an additive valuation with v(π) = 1 and
    v(0) = +∞. A family tends to zero along the cofinite filter if only finitely many terms lie below each rational
    valuation bound. A family tending to zero in this sense is summable if its terms lie in a common finite extension
    of ℚₚ, by completeness and the ultrametric inequality. These results are used to prove summability of Fourier
    coefficients in a finite extension.
  key_decls:
