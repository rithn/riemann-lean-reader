- module: GroundTheory.PAdicHodge.NormalizedTraceTower
  depth: 11
  lines: 302
  line: >-
    Proves relative degree stabilization, a uniform transfer estimate, and Galois equivariance for cyclotomic layer
    traces.
  reading: >-
    For a finite extension K of ℚₚ in its algebraic closure, the layers are the composita KFₙ, where Fₙ is generated
    over ℚₚ by the pⁿ-th roots of unity. The degrees [KFₙ:Fₙ] decrease weakly and stabilize, giving two normalized
    trace comparisons by base change. A fixed basis and its trace-dual give coordinate expansions at every layer
    from stabilization onward and transfer a uniform trace bound from Fₙ to KFₙ. The layer traces commute with automorphisms
    fixing K. TateNormalizedTrace uses the estimate and equivariance to bound the Tate traces uniformly on the tower
    union and prove equivariance on its completion.
