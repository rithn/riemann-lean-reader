- module: GroundTheory.PAdicHodge.BCrisEigenFrob
  depth: 11
  lines: 222
  line: Computes the actions of arithmetic Frobenius lifts and inertia on Witt-vector periods in A_inf.
  reading: >-
    Over a finite extension L of ℚₚ with residue field of size pᶠ, arithmetic Frobenius lifts act on the embedded
    Witt vectors by the f-fold Witt Frobenius, while inertia acts trivially. The proof transfers the action on prime-to-p
    roots of unity to the tilt using injectivity of untilting on finite-field elements. A Witt Frobenius eigenvalue
    w thus gives the eigenvalue wᶠ for a Frobenius lift. Density of the Weil group then shows that a continuous
    character trivial on inertia and one Frobenius lift is trivial everywhere. BCrisEigenChar uses these results
    to compare eigencharacters.
  key_decls:
  - name: GroundTheory.PAdicHodge.EigenWitt.eq_of_untiltC_eq
    gloss: >-
      Two integral tilt elements fixed by the same positive iterate of Frobenius are equal if their untilts in ℂₚ
      coincide.
