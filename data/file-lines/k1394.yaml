- module: GroundTheory.PAdicHodge.NormalizedTrace
  depth: 7
  lines: 344
  line: >-
    Defines normalized traces for algebraic extensions in characteristic zero and proves a scaled p-adic norm bound.
  reading: >-
    The normalized trace is the negative of the coefficient just below the leading term in the minimal polynomial,
    divided by its degree. On each finite subextension in characteristic zero it equals the field trace divided
    by the extension degree, giving linearity and transitivity through finite intermediate fields. It commutes with
    compatible field isomorphisms and is unchanged by linearly disjoint base extension. The p-adic bound uses the
    ultrametric inequality on the sum of the roots. NormalizedTraceTower uses the base-change identity and the bound
    to compare and estimate traces along the cyclotomic tower.
  key_decls:
  - name: GroundTheory.PAdicHodge.normTraceF_eq_trace_div
    gloss: >-
      For an element of a finite subextension L/F in characteristic zero, the normalized trace to F is its field
      trace from L divided by [L:F].
  - name: GroundTheory.PAdicHodge.normTraceFₗ
    gloss: >-
      The normalized trace from an algebraic extension to its characteristic-zero base field F is F-linear.
  - name: GroundTheory.PAdicHodge.normTrace_normTrace
    gloss: >-
      In an algebraic extension of a characteristic-zero field F, taking the normalized trace first to a finite
      intermediate field E and then to F gives the normalized trace directly to F.
  - name: GroundTheory.PAdicHodge.normTrace_eq_of_finrank_sup
    gloss: >-
      If finite extensions A and B of k in a common ambient field satisfy [AB:k] = [A:k][B:k], the normalized traces
      to B and to k agree on A when viewed in the ambient field.
  - name: GroundTheory.PAdicHodge.norm_natCast_mul_normTrace_le
    gloss: >-
      For y in the algebraic closure of ℚₚ and an intermediate field F, multiplying its normalized trace to F by
      any natural-number multiple of the minimal-polynomial degree gives an element of norm at most ‖y‖.
