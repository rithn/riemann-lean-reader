    extension with the same norm bound. By density, the extension preserves additivity and inherits scalar linearity
    and Galois equivariance when the original map has those properties. Closedness keeps the values of an extended
    retraction in the finite subfield, and agreement with the original map preserves its identity restriction there.
    TateNormalizedTrace applies these lemmas to extend the normalized traces to the cyclotomic completion.
