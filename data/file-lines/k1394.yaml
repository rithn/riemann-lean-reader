    gloss: >-
      For each π with 0 < ‖π‖ < 1, constructs an additive valuation taking the rational value log ‖x‖ / log ‖π‖
      at every nonzero x and +∞ at zero.
  - name: GlobalTheory.PadicVal.tendsto_of_null
    gloss: >-
      For a valuation related to the norm by the logarithmic formula, a family converges to zero along the cofinite
