- module: GroundTheory.PAdicHodge.TateCpTwist
  depth: 10
  lines: 102
  line: Defines the continuous cyclotomic character and the Tate twists ℂₚ(j) for every integer j.
  reading: >-
    For each intermediate field K of the algebraic closure of ℚₚ, the cyclotomic character records the action on
    pⁿ-th roots of unity through its reduction modulo pⁿ. The twist multiplies the usual Galois action on ℂₚ by
    the j-th power of the character value, giving continuous K-linear operators. These operators compose according
    to the group law because the twist scalars are multiplicative and lie in ℚₚ, where Galois fixes them. For K
    finite over ℚₚ and j ≠ 0, the proof of vanishing invariants rewrites invariance as twistScalar(K, j, σ) · (σ
    • x) = x for every σ in the absolute Galois group of K.
  key_decls:
  - name: GroundTheory.PAdicHodge.cycloChar
    gloss: Restricts the p-adic cyclotomic character to the absolute Galois group of K, with values in ℤₚˣ.
  - name: GroundTheory.PAdicHodge.cycloChar_spec
    gloss: >-
      A Galois element acts on each pⁿ-th root of unity by raising it to the exponent given by its cyclotomic character
      modulo pⁿ.
  - name: GroundTheory.PAdicHodge.twistScalar
    gloss: >-
      The scalar for a Galois element in weight j is the image in ℂₚ of the j-th power of its cyclotomic character.
  - name: GroundTheory.PAdicHodge.cpTwistMap
    gloss: Sends x to χ(σ)ʲσ(x) as a continuous K-linear endomorphism of ℂₚ.
  - name: GroundTheory.PAdicHodge.cpTwistRep
    gloss: Assembles the twisted operators into a representation of the absolute Galois group of K on ℂₚ.
