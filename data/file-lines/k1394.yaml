- module: GroundTheory.LocalFields.WeilGroupDefs
  depth: 12
  lines: 297
  line: >-
    Constructs the Weil group of a nonarchimedean local field and proves its density and compactness of inertia.
  reading: >-
    The Weil group consists of absolute Galois elements whose restriction to the maximal unramified extension is
    an integral power of Frobenius. The exponent gives a surjective degree map to the integers with inertia as its
    kernel. The inclusion and degree induce the topology from the Krull Galois group times the discrete integers,
    making inertia compact and open. BCrisEigenFrob uses the dense image to prove that a continuous character trivial
    on inertia and on one degree-one element is trivial everywhere.
  key_decls:
  - name: GroundTheory.LocalField.WeilGroup
    gloss: >-
      Realizes the Weil group as the inverse image of the cyclic subgroup generated by Frobenius under restriction
      to the maximal unramified extension.
  - name: GroundTheory.LocalField.WeilGroup.exact_inertia_degree
    gloss: >-
      The degree map surjects onto the integers, and its kernel maps isomorphically onto the subgroup fixing the
      maximal unramified extension.
  - name: GroundTheory.LocalField.WeilGroup.isEmbedding_toGalProd
    gloss: >-
      The Galois inclusion and the degree together give a topological embedding into the absolute Galois group times
      the discrete integers.
  - name: GroundTheory.LocalField.WeilGroup.inertiaEquiv
    gloss: >-
      Weil inertia is topologically isomorphic to the subgroup of the absolute Galois group fixing the maximal unramified
      extension.
  - name: GroundTheory.LocalField.WeilGroup.denseRange_toGal
    gloss: The Weil group has dense image in the absolute Galois group with its Krull topology.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: GroundTheory.PAdicHodge.CyclotomicField
  depth: 12
  lines: 76
  line: >-
    Defines the p-power cyclotomic fields over ℚₚ and proves that they form an ascending tower of finite Galois-stable
    extensions.
  reading: >-
    The nth field is obtained by adjoining all pⁿ-th roots of unity to ℚₚ, and the fields are nested by divisibility
    of the exponents. A root of the pⁿ-th cyclotomic polynomial gives a primitive root, and every pⁿ-th root of
    unity is a power of any such primitive root, so a single primitive root generates the field. Automorphisms fixing
    ℚₚ preserve each field by permuting its defining roots. NormalizedTraceTower uses these fields to form the layers
    obtained by taking their composita with a fixed intermediate field.
  key_decls:
  - name: GroundTheory.PAdicHodge.cycl
    gloss: >-
      Defines the nth cyclotomic field by adjoining all pⁿ-th roots of unity in the algebraic closure of ℚₚ.
  - name: GroundTheory.PAdicHodge.cycl_mono
    gloss: The nth cyclotomic field is contained in the mth whenever n ≤ m.
  - name: GroundTheory.PAdicHodge.finiteDimensional_cycl
    gloss: Every cyclotomic layer has finite degree over ℚₚ.
  - name: GroundTheory.PAdicHodge.cycl_eq_adjoin
    gloss: Any primitive pⁿ-th root of unity generates the nth cyclotomic field over ℚₚ.
  - name: GroundTheory.PAdicHodge.cycl_map
    gloss: Every automorphism of the algebraic closure fixing ℚₚ maps each cyclotomic field onto itself.
  blueprint: []
  status: checked
  check:
    verdict: supported
    notes: ''
- module: GroundTheory.PAdicHodge.SenTateCharUnits
  depth: 12
  lines: 297
  line: Defines the p-adic unit filtration and proves power, approximation, and subgroup index formulas.
  reading: >-
    The open subgroups Uₖ of ℤₚˣ consist of units congruent to 1 modulo pᵏ. For k ≥ 1, reduction of (u − 1)/pᵏ modulo
    p gives a homomorphism with kernel Uₖ₊₁. A binomial congruence shows that pth powers raise exact depth by one
    from depth 2 onward, and prime-to-p powers preserve exact positive depth. Successive corrections modulo p approximate
    every unit of Uₛ by powers of a unit of exact depth s ≥ 2 and give index pⁱ between levels s and s + i after
    intersecting with any subgroup containing that unit. In SenTateCharClosure, openness gives a finite quotient
    by the preimage of U₂ under a continuous character, so an infinite inertia image forces a nonidentity value
    in U₂.
  key_decls:
  - name: GroundTheory.PAdicHodge.SenTateChar.unitsOneAdd
    gloss: Defines Uₖ as the subgroup of p-adic units u for which pᵏ divides u − 1.
  - name: GroundTheory.PAdicHodge.SenTateChar.levelHom_eq_one_iff
    gloss: >-
      For k ≥ 1, the map from Uₖ to the additive group of 𝔽ₚ given by reduction of (u − 1)/pᵏ has kernel Uₖ₊₁.
  - name: GroundTheory.PAdicHodge.SenTateChar.pow_prime_pow_mem_not_mem
    gloss: If a has exact depth s ≥ 2, then a raised to pⁱ has exact depth s + i.
  - name: GroundTheory.PAdicHodge.SenTateChar.exists_mul_inv_pow_mem
    gloss: >-
      If a has exact depth s ≥ 2, then for each b ∈ Uₛ and each k there is a nonnegative integer j with ba⁻ʲ ∈ Uₖ.
  - name: GroundTheory.PAdicHodge.SenTateChar.relIndex_unitsOneAdd_inf
    gloss: If a subgroup R contains a unit of exact depth s ≥ 2, then the index of R ∩ Uₛ₊ᵢ in R ∩ Uₛ is pⁱ.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: GroundTheory.PAdicHodge.UnramifiedACris
  depth: 12
  lines: 91
  line: >-
    Constructs a ring map to A_cris from Witt vectors of the residue field of a finite unramified subextension of
    the algebraic closure of ℚₚ.
  reading: >-
    Let K₀ be a finite unramified subextension of the chosen algebraic closure of ℚₚ. Its ring of integers has maximal
    ideal generated by p, so the map on valuation rings induced by the inclusion K₀ → Cₚ descends to a map from
    the residue field to 𝒪_Cₚ/p. Since the residue field is perfect, this map lifts to the Frobenius inverse limit
    defining the tilt of the valuation ring. Applying the p-typical Witt vector functor gives a map to A_inf, and
    composition with the canonical map to A_cris gives the stated construction.
  key_decls:
  - name: GroundTheory.PAdicHodge.UnramifiedACris.exists_eq_p_mul_of_mem_maximalIdeal
    gloss: Every element of the maximal ideal of the integers of K₀ is a multiple of p in that ring.
  - name: GroundTheory.PAdicHodge.UnramifiedACris.residueToModP
    gloss: Reduces the natural map on integers to a ring map from the residue field of K₀ to 𝒪_Cₚ/p.
  - name: GroundTheory.PAdicHodge.UnramifiedACris.residueToPreTilt
    gloss: Lifts the residue-field map to the inverse limit of 𝒪_Cₚ/p under Frobenius.
  - name: GroundTheory.PAdicHodge.UnramifiedACris.wittToAInf
    gloss: >-
      Applies the p-typical Witt vector functor to the lifted residue-field map to obtain a ring map to A_inf.
  - name: GroundTheory.PAdicHodge.UnramifiedACris.wittToACris
    gloss: Composes the map to A_inf with the canonical map to A_cris.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review sample-01 (material findings): 2 field edits (line, reading). Before and after text: check-log.tsv.
- module: GroundTheory.PAdicHodge.UnramifiedClosure
  depth: 12
  lines: 273
  line: Constructs the unramified closure of ℚₚ and proves quantitative approximation by its elements.
  reading: >-
    Adjoining all roots of unity of order prime to p gives the Galois-stable unramified closure U, whose intersection
    with K defines the unramified part of K. The fixed-field criterion shows that U is closed inside the algebraic
    closure. For integral z with |z^(pʳ) − z| ≤ |p|ᵐ, r ≥ 1 and m ≥ 1, repeated pʳ-powering converges to a fixed
    point in U within |p|ᵐ of z, while for m = 0 zero gives the approximation. By finding two close iterates of
    an algebraic approximant, every sufficiently high p-power iterate of an integral element of Cₚ can be approximated
    from U to any prescribed precision. ACrisFrobFixed uses this to approximate θ-images of elements fixed by a
    positive Frobenius iterate.
  key_decls:
  - name: GroundTheory.PAdicHodge.unramifiedClosure
    gloss: Defines U by adjoining to ℚₚ all roots of unity of order prime to p in its algebraic closure.
  - name: GroundTheory.PAdicHodge.mem_unramifiedClosure_of_forall_approx
    gloss: An algebraic element approximable by elements of U within |p|ᵐ for every m belongs to U.
  - name: GroundTheory.PAdicHodge.exists_eq_of_pow_eq_self
    gloss: For r ≥ 1, every solution of ω^(pʳ) = ω in Cₚ is the image of an element of U.
  - name: GroundTheory.PAdicHodge.exists_approx_of_pow_sub
    gloss: If |z| ≤ 1 and |z^(pʳ) − z| ≤ |p|ᵐ for r ≥ 1, then some element of U lies within |p|ᵐ of z.
  - name: GroundTheory.PAdicHodge.eventually_approx_pow
    gloss: >-
      For each c ∈ Cₚ with |c| ≤ 1 and each m, every sufficiently high iterate c^(pᵏ) lies within |p|ᵐ of some element
      of U.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: >-
      Review full-review (material findings): 1 field edit (reading). Before and after text: check-log.tsv.
- module: GroundTheory.PowerSubgroups.CountableNeighbourhoods.UnramifiedClosureCountableNeighbourhoods
  depth: 13
  lines: 35
  line: >-
    Proves that every sequence of powers of an element in the closed unit ball of the algebraic closure of ℚₚ has
    arbitrarily close terms.
  reading: >-
    For any exponent sequence in ℕ and any ε > 0, two terms at strictly ordered indices differ in norm by less than
    ε. All powers lie in the compact closed unit ball of the finite-dimensional ℚₚ-algebra generated by the element,
    so a convergent subsequence supplies the pair. UnramifiedClosure applies the lemma to pᵏ powers of an algebraic
    approximant to c ∈ ℂₚ and uses the close pair to approximate each sufficiently late power c^(pᵏ) by an element
    of the unramified closure.
  key_decls:
  - name: GroundTheory.Variant₂.N1.exists_lt_norm_pow_sub_pow_lt
    gloss: >-
      If ‖c‖ ≤ 1 in the algebraic closure of ℚₚ, then for every f from ℕ to ℕ and every ε > 0 there are k₀ < k₁
      with ‖c^{f(k₁)} − c^{f(k₀)}‖ < ε.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (reading). Before and after text: check-log.tsv.'
- module: ReciprocityTheory.ClassFieldTheory.LocalClassField.UnrExtE
  depth: 13
  lines: 100
  line: >-
    Proves that in the algebraic closure of ℚₚ, a degree-n extension of a finite base with the same norm values
    equals the unramified one.
  reading: >-
    Compactness of a closed ball in a finite extension of Q_p gives a closest point to any element of the algebraic
    closure. For nested fields with the same residue field and norm values, normalizing the error and lifting its
    residue to the smaller field improves any nonzero minimum, forcing equality. The proof identifies the degree-n
    unramified extension by first matching residue-field sizes and then comparing degrees. Importers use this identification
    to describe open subgroups containing inertia and to express the maximal unramified subfield of a finite extension
    of Q_p by adjoining roots of unity.
  key_decls:
  - name: ReciprocityTheory.DiscreteGroups.LocalClassField.exists_closest
    gloss: Every element of the algebraic closure of Q_p has a closest point in any finite intermediate field.
  - name: ReciprocityTheory.DiscreteGroups.LocalClassField.le_of_resK_le_of_norm
    gloss: >-
      Nested intermediate fields coincide if the smaller field is finite over Q_p and the larger field's residue
      field and set of norm values are contained in those of the smaller field.
  - name: ReciprocityTheory.DiscreteGroups.LocalClassField.eq_Kn_of_norm
    gloss: >-
      For positive n, a degree-n extension of a finite intermediate field K with the same norm values as K equals
      the degree-n unramified extension of K in the algebraic closure.
  blueprint: []
  status: fixed
  check:
    verdict: imprecise
    notes: 'Review full-review (minor findings): 1 field edit (line). Before and after text: check-log.tsv.'
