- module: GroundTheory.PAdicHodge.AxLemma
  depth: 10
  lines: 573
  line: >-
    Proves Ax’s quantitative approximation lemma and the Ax–Sen–Tate fixed-point theorem for closed Galois subgroups.
  reading: >-
    Let x lie in the algebraic closure of ℚₚ and K be an intermediate field over ℚₚ. If every K-conjugate of x is
    within p-adic distance r of x, then x is within p^(p/(p−1)²)r of some element of K. The proof descends on the
    minimal-polynomial degree by finding a nearby root of a Hasse derivative and controlling the loss via binomial
    coefficients. Passing to ℂₚ identifies the fixed points of a closed Galois subgroup with the closure of its
    algebraic fixed field, which is already closed when finite over ℚₚ. The vanishing proof for nonzero Tate twists
    uses this identification to place a putative fixed vector in the cyclotomic completion.
  key_decls:
  - name: GroundTheory.PAdicHodge.exists_close_of_hasseDeriv
    gloss: >-
      If x has degree d over K and all its K-conjugates lie within ρ of it, then for each 0 ≤ q < d there is an
      element b of degree at most d−q over K satisfying |binom(d,q)|ₚ |x−b|ₚ^(d−q) ≤ ρ^(d−q).
  - name: GroundTheory.PAdicHodge.ax_lemma
    gloss: If every K-conjugate of x is within distance r of x, some y in K satisfies |x−y|ₚ ≤ p^(p/(p−1)²)r.
  - name: GroundTheory.PAdicHodge.fixedPoints_gal_eq_closure
    gloss: >-
      For any intermediate field K of the algebraic closure of ℚₚ, the fixed points of its absolute Galois group
      on ℂₚ form the closure of K.
  - name: GroundTheory.PAdicHodge.fixedPoints_gal_eq
    gloss: >-
      For finite K over ℚₚ, the fixed points of its absolute Galois group on ℂₚ are exactly the embedded copy of
      K.
  - name: GroundTheory.PAdicHodge.fixedPoints_closedSubgroup_eq_closure
    gloss: >-
      For a subgroup closed in the Krull topology, its fixed points on ℂₚ form the closure of its fixed field in
      the algebraic closure of ℚₚ.
