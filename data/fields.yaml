# Field grouping for the 63 themes of riemannhypothesissolved.com.
# Colour hues are 0-360 (HSL, saturation 80%); the lightness for each is FIELD_L in scripts/site/build_site.py. Picked for
# distinctness on the navy background (#0b1230): no two fields closer than 0.09 in OKLab, every field at contrast >= 7.5:1, and
# nothing between hues 25 and 65, which is the main theorem's gold.
fields:
  - id: nt
    name: "Classical number theory"
    description: "Primes, ideals, class field theory, Hecke characters and L-functions: the classical machinery for numbers beyond the integers."
    hue: 74
  - id: aut
    name: "Automorphic forms"
    description: "Highly symmetric functions and the representations of matrix groups (GL_n, unitary groups) that they generate, over the rationals, number fields and p-adic fields."
    hue: 216
  - id: theta
    name: "Theta & Siegel–Weil"
    description: "Theta lifts: a machine that carries symmetric functions from one group to another, plus the Siegel–Weil formula that evaluates the sums behind it."
    hue: 304
  - id: lat
    name: "Lattices & mass"
    description: "Counting and measuring lattices (grids of points with extra structure), including mass formulas, volumes and local densities of unitary groups."
    hue: 188
  - id: ht
    name: "Heights & Arakelov"
    description: "Measuring the arithmetic size of points and geometric objects, with arithmetic intersection numbers and metrics on bundles."
    hue: 22
  - id: av
    name: "Abelian varieties"
    description: "Abelian varieties, their moduli, degenerations and complex multiplication: the geometric shapes that carry the arithmetic."
    hue: 342
  - id: padic
    name: "p-adic Hodge theory"
    description: "How p-adic Galois symmetries act on geometric objects, via period rings, Wach modules, deformation rings and Euler systems."
    hue: 120
  - id: ag
    name: "Algebraic geometry"
    description: "General scheme theory and cohomology: resolution of singularities, étale cohomology, ample bundles and vanishing theorems."
    hue: 276
  - id: an
    name: "Harmonic analysis"
    description: "Fourier transforms, wave and heat operators, and estimates for functions on matrix groups and real Lie groups."
    hue: 158
themes:
