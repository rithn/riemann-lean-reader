# Outside guides and explainers (tracker C9, items 68a to 68c). Written 23 Nov 2026.
# NOT YET USED BY THE GENERATOR: build_site.py does not read this file. The /guides/ page (68e, 68f) and the
# "explained elsewhere" cluster box (69b) come later.
#
# Fields per entry:
#   author         name as the page gives it (a note says where the page names no one)
#   title          exact title on the page
#   url            the page that was opened
#   date           ISO date printed on the page, or the first public date found; date_note says what the date is
#   type           kind of page
#   language       en
#   parts_covered  which parts of the proof the guide covers (from research/guides/candidates-2026-11-23.md,
#                  where every page was read on 23 Nov; not re-read entry by entry on this pass)
#   status         verified: the author ran or certifies checks of the Lean proof himself or itself.
#                  explains-only: the author explains or maps the proof and ran no check of the archive.
#   status_quote   exact words from the page that support the status
#   tier           A or B, as in the candidates file
#   clusters       tier A only (tracker 69a, 23 Nov 2026): ids of the clusters that hold the Lean files or declarations
#                  the guide cites, as found by exact name. A short list or an empty one means the guide gives few
#                  names, not that it covers little. Tier B entries have none yet.
#   clusters_basis one line on how the list was made. Evidence table: research/guides/cluster-map-2026-11-23.tsv
#
# A field that could not be confirmed is written as a mapping with `unconfirmed: true`, plus the best value known
# and where it came from. Each page was opened on 23 Nov 2026 (read with a page-reading tool that returns a summary,
# so quotes are as returned; GitHub details come from the GitHub API).
#
# Not added: the 15 "maybe" entries (tier C), and Terence Tao's blog post (labelled B in the candidates file
# but "context, not an explainer"; the candidates file has 5 rows marked B, the tracker says 4).

