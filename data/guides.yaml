# Outside guides and explainers (tracker C9, items 68a to 68c). Written 23 Nov 2026.
# NOT YET USED BY THE GENERATOR: build_site.py does not read this file. The /guides/ page (68e, 68f) and the
# "explained elsewhere" cluster box (69b) come later.
#
# Fields per entry:
#   author         a mapping since 24 Nov 2026 (see "Fields added on 24 Nov 2026" below). as_listed keeps the 23 Nov text.
#   title         exact title on the page
#   url            the page that was opened
#   date           ISO date printed on the page, or the first public date found; date_note says what the date is
#   type           kind of page
#   language       en
#   parts_covered  which parts of the proof the guide covers (from research/guides/candidates-2026-11-23.md,
#                  where every page was read on 23 Nov; not re-read entry by entry on this pass)
#   status         verified: the author ran or certifies checks of the Lean proof himself or itself.
#                  explains-only: the author explains or maps the proof and ran no check of the archive.
#   status_quote   exact words from the page that support the status
#   tier           A or B, as in the candidates file
#   clusters       tier A only (tracker 69a, 23 Nov 2026): ids of the clusters that hold the Lean files or declarations
#                  the guide cites, as found by exact name. A short list or an empty one means the guide gives few
#                  names, not that it covers little. Tier B entries have none yet.
#   clusters_basis one line on how the list was made. Evidence table: research/guides/cluster-map-2026-11-23.tsv
#
# Fields added on 24 Nov 2026 (lane 1, "guide facts"; design: research/plans/guides-design.md sections 1, 4, 6).
# Every value comes from the author's own pages; the report with sources is research/guides/lane1-facts-2026-11-24.md.
#   slug           short URL name: /guides/<slug>/ and /?guide=<slug>
#   page           true: the guide has its own page. false: a line on /guides/ only (tamnd)
#   listed         false: kept here but skipped by the build everywhere (hub, pages, sitemap, refs, photos); dropped_note says why
#   order          hub order, 1 first. Rule: group 1 = authors with a university maths post, group 2 = other named
#                  authors, group 3 = organisations and unnamed pages; newest first inside each group
#   author.as_listed    the 23 Nov value, kept
#   author.name         as the author writes it on a page they control
#   author.name_source  that page; name_note says what else is there
#   author.handle       GitHub handle, where the guide is a repository
#   author.unconfirmed  false when the name is confirmed by the author's own page; true would mean a guess
#   author.home         the author's home page (an organisation entry has home and home_also)
#   author.role, role_source, role_note   the post as stated, where, and a caveat. null if none stated
#   author.order_group  1, 2 or 3, as in the order rule
#   author.photo        local copy of the original, research/guides/photos-src/<slug>.<ext>, not resized. null if none found
#   author.photo_source the page the photo is on; photo_url the image file; photo_note size and caveats.
#                       Organisations: the logo, with photo_also / photo_source_also for the second one
#   posted_at      {url, date}: where and when first posted, date as printed (note says how it was found)
#   format         pdf | web | repo: what the mapped object is
#   licence        as stated, or "none stated"; licence_note quotes the source
#   host_copy      true only if the licence allows redistribution (we may serve a pinned copy)
#   versions       list of {version, date, url, ...}: versions read. md5, commit, pages, file where known
#   title_latest   (Adriazola only) the title of the newest manuscript, when it differs from `title`
#   changed_since_2026-11-23   what differed on 24 Nov from the 23 Nov entry. Existing fields are not edited, so a
#                  field above (date, status_note, type) may be stale where this note says so
#
# A field that could not be confirmed is written as a mapping with `unconfirmed: true`, plus the best value known
# and where it came from. Pages were opened on 23 Nov 2026 (read with a page-reading tool that returns a summary,
# so quotes are as returned; GitHub details come from the GitHub API) and again on 24 Nov 2026 (raw HTML, GitHub API,
# a headless browser for pages that need scripts).
#
# Not added: the 15 "maybe" entries (tier C), and Terence Tao's blog post (labelled B in the candidates file
# but "context, not an explainer"; the candidates file has 5 rows marked B, the tracker says 4).

